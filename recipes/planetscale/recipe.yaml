# PlanetScale Recipe for Cauldron
#
# Written against the Swagger 2.0 document PlanetScale serves from its own API
# host at api.planetscale.com/v1/openapi-spec -- 670 kilobytes, 135 paths, 87
# definitions -- and quoted from the field descriptions in it.
#
# The field called state is not the state of the deployment.
#
# A deploy request carries both of these, side by side:
#
#   state             -- "Whether the deploy request is open or closed"
#   deployment_state  -- "The deployment state of the deploy request"
#
# So state is about the review and not about the schema. A deploy request that
# was opened, examined and closed without ever shipping anything reads
# state: closed, and so does one whose migration ran an hour ago. The field
# whose name a reader reaches for first is the one that answers a different
# question, and the field that answers theirs is the one with the longer name.
#
# The consequence is a deployment dashboard that is confidently wrong in the
# safe-looking direction: closed reads as done, done reads as deployed, and
# the request that was abandoned is counted as a release.
#
# Four more, each from the same document:
#
#   1. The identifier you would store cannot address the thing. A deploy
#      request has an id -- "The ID of the deploy request" -- and a number --
#      "The number of the deploy request" -- and every path takes the number:
#      /organizations/{organization}/databases/{database}/deploy-requests
#      /{number}. The number is per database, so 1 exists in every database
#      an organisation owns, and the globally unique id addresses nothing.
#      Code that stores the id and interpolates it into the URL gets a 404
#      that looks like a deleted record.
#   2. A deploy request outlives the branch it came from. branch_deleted is
#      "Whether or not the deploy request branch was deleted", with
#      branch_deleted_by and branch_deleted_at beside it, and branch still
#      holding the name. So the request still names a branch, and the branch
#      is not there, and only a third field says so.
#   3. The end of a listing is a null rather than an absence. next_page is
#      "The next page number, or null when this is the last page", and
#      next_page_url says the same. Metronome's next_page is the same
#      decision and Confluence's _links.next is the opposite one -- absent
#      when there is nothing more -- so three providers in this collection
#      spell the end of a list three different ways.
#   4. The envelope names its own type. Every paginated response carries
#      type: "list", which is Stripe's habit arriving on a database API.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The deploy lifecycle has ten endpoints -- deploy, apply-deploy,
#     complete-deploy, cancel, revert, skip-revert, force-cutover and the
#     rest -- and none is modelled. Each moves deployment_state, and this
#     format cannot express a route that advances a state machine, so
#     modelling them would mean ten routes that all answer the record
#     unchanged. What is served is the pair of fields those endpoints move
#     between, which is what the file is about.
#   - Branches, backups, passwords, keyspaces and the organisation's own
#     endpoints are absent. Databases and deploy requests only.
#   - PlanetScale's own documentation describes a service token as an
#     Authorization header of "{id}:{token}". The document itself declares
#     only OAuth2, so the header form is taken from the prose and the key
#     below has that shape.
#
# Checked live against api.planetscale.com, unauthenticated, 2026-09-05, in
# two parts. First: this Recipe's own upstream.docs host,
# api-docs.planetscale.com, no longer resolves at all -- NXDOMAIN from this
# machine's resolver, not a redirect or a 404. The reference moved to
# planetscale.com/docs, whose own machine-readable description
# (planetscale.com/docs/openapi.yaml) still declares servers: -
# https://api.planetscale.com/v1, confirming the API host itself is
# unchanged even though the page that used to describe it is gone.
#
# Second, and the more interesting finding: this API answers the credential
# question differently depending on whether the route names an
# organisation. GET /v1/organizations, which takes no path parameter,
# answers 401 {"code":"unauthorized","message":"Requires authentication"}
# to no credential at all -- a real sentence, and not "Unauthorized." with a
# period, which is what this file had from documentation before this check.
# But every route this Recipe actually serves takes {organization} as a path
# segment, and GET /v1/organizations/does-not-exist/databases answers 404
# {"code":"not_found","message":"Not Found"} whether or not a credential is
# sent at all -- the organisation is resolved, and found missing, before the
# token is ever examined. That is the "NocoDB" shape this project's own
# Auth.AfterRouting documentation already names: a route with an id resolves
# the id first regardless of credential, a route without one checks the
# credential first. Cauldron's single AfterRouting flag cannot express a
# split that depends on which route a request hit, so it is stated here
# rather than forced into a setting that would only be right for one of this
# Recipe's two kinds of route -- and since none of the routes this Recipe
# models lack an organisation segment, no case here can honestly assert the
# corrected 401 sentence in context; only the text itself is confirmed,
# dated, above.
#
# The token and the ids below are fixtures and belong to no organisation.

recipe: planetscale
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  # api-docs.planetscale.com no longer resolves -- checked 2026-09-05, see
  # the file header. This is where the reference moved.
  docs: https://planetscale.com/docs/openapi.yaml

auth:
  # A token id and a token, joined by a colon, with no scheme word in front.
  scheme: header
  header: Authorization
  keys:
    - cauldronfixture:pscale_tkn_cauldron000000000000

responses:
  list:
    style: wrapped
    key: data
    page_field: current_page
    limit_field: per_page
    # Present and null on the last page rather than absent, which Metronome
    # does too and Confluence does the other way round.
    cursor_field: next_page
    cursor_null: true
    fields:
      type: list
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code
    type_field: "-"

resources:
  deploy_request:
    id:
      # The number, because that is what every path takes. The globally
      # unique id is a field beside it and addresses nothing.
      style: numeric
      type: number
      field: number
    fields:
      # "The ID of the deploy request" -- and not the way to ask for one.
      # Stored under a name of its own because the record is keyed by the
      # number, and published as id because that is what PlanetScale calls
      # it.
      deploy_request_id:
        type: string
        as: id
      branch:
        type: string
      branch_id:
        type: string
      # The branch may be gone while branch still names it.
      branch_deleted:
        type: boolean
        default: false
      branch_deleted_at:
        type: datetime
        stamped: false
      into_branch:
        type: string
      approved:
        type: boolean
        default: false
      # Open or closed, which is about the review.
      state:
        type: string
        default: open
      # And what actually happened to the schema.
      deployment_state:
        type: string
        default: pending
      notes:
        type: string
      html_url:
        type: string
      num_comments:
        type: integer
        default: 0
      created_at:
        type: datetime
      updated_at:
        type: datetime
      closed_at:
        type: datetime
        stamped: false
      deployed_at:
        type: datetime
        stamped: false
      # The partition lives in the path and is not repeated in the body.
      organization:
        type: string
        in: "-"
      database:
        type: string
        in: "-"

  database:
    id:
      style: opaque
    fields:
      name:
        type: string
      state:
        type: string
        default: ready
      created_at:
        type: datetime
      updated_at:
        type: datetime
      organization:
        type: string
        in: "-"

routes:
  - method: GET
    path: /v1/organizations/{organization}/databases/{database}/deploy-requests
    resource: deploy_request
    operation: list
    scope:
      - organization
      - database
    filters:
      - param: state
        field: state
    pagination:
      style: page
      cursor_param: page
      limit_param: per_page
      limit: 25
      first_page: 1

  - method: GET
    path: /v1/organizations/{organization}/databases/{database}/deploy-requests/{id}
    resource: deploy_request
    operation: get
    scope:
      - organization
      - database

  - method: GET
    path: /v1/organizations/{organization}/databases
    resource: database
    operation: list
    scope:
      - organization
    pagination:
      style: page
      cursor_param: page
      limit_param: per_page
      limit: 25
      first_page: 1

  - method: GET
    path: /v1/organizations/{organization}/databases/{id}
    resource: database
    operation: get
    scope:
      - organization

errors:
  # Confirmed live, 2026-09-05, against GET /v1/organizations -- the one
  # route in this API that checks the credential without an organisation to
  # resolve first. See the file header for the routes this Recipe actually
  # serves, which do not.
  authentication_error:
    status: 401
    message: Requires authentication
    code: unauthorized

  resource_missing:
    status: 404
    message: Not Found
    code: not_found

  invalid_request:
    status: 422
    message: Unprocessable Entity.
    code: unprocessable

fixtures:
  empty: {}

  organisation:
    database:
      - id: qc0kbgxvbqmr
        organization: cauldron
        name: shop
        state: ready
        created_at: "2026-01-09T10:14:22.000Z"
        updated_at: "2026-08-12T09:01:44.000Z"

    deploy_request:
      # Closed, and deployed. The two fields agree here, which is what makes
      # the next one survive review.
      - id: "3"
        organization: cauldron
        database: shop
        deploy_request_id: dr_cauldron000000000001
        branch: add-order-index
        branch_id: br_cauldron0000000000a1
        branch_deleted: true
        branch_deleted_at: "2026-08-12T09:05:00.000Z"
        into_branch: main
        approved: true
        state: closed
        deployment_state: complete
        notes: Adds an index on orders.created_at.
        html_url: https://app.planetscale.com/cauldron/shop/deploy-requests/3
        num_comments: 2
        created_at: "2026-08-11T14:20:00.000Z"
        updated_at: "2026-08-12T09:05:00.000Z"
        closed_at: "2026-08-12T09:05:00.000Z"
        deployed_at: "2026-08-12T09:02:11.000Z"
      # Closed, and never deployed at all. Same state, opposite outcome.
      - id: "4"
        organization: cauldron
        database: shop
        deploy_request_id: dr_cauldron000000000002
        branch: drop-legacy-column
        branch_id: br_cauldron0000000000a2
        branch_deleted: false
        into_branch: main
        approved: false
        state: closed
        deployment_state: pending
        notes: Abandoned after review.
        html_url: https://app.planetscale.com/cauldron/shop/deploy-requests/4
        num_comments: 5
        created_at: "2026-08-13T11:00:00.000Z"
        updated_at: "2026-08-14T16:30:00.000Z"
        closed_at: "2026-08-14T16:30:00.000Z"
      # Still open, and in the middle of deploying.
      - id: "5"
        organization: cauldron
        database: shop
        deploy_request_id: dr_cauldron000000000003
        branch: widen-sku
        branch_id: br_cauldron0000000000a3
        branch_deleted: false
        into_branch: main
        approved: true
        state: open
        deployment_state: in_progress
        notes: Widens sku to varchar(64).
        html_url: https://app.planetscale.com/cauldron/shop/deploy-requests/5
        num_comments: 0
        created_at: "2026-08-20T08:45:00.000Z"
        updated_at: "2026-08-20T08:52:00.000Z"

conformance:
  - name: two deploy requests are closed and only one of them shipped
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/4
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # state is "Whether the deploy request is open or closed", and this
        # one was closed without deploying anything. A dashboard counting
        # closed requests as releases counts this.
        state: closed
        deployment_state: pending
        notes: Abandoned after review.
      absent:
        # And the field that would have given it away is not there.
        - deployed_at

  - name: and the one that did ship says so in the other field
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/3
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # Identical state, opposite outcome. The only difference between this
        # request and the one above is a field whose name nobody reaches for
        # first.
        state: closed
        deployment_state: complete
        deployed_at: "2026-08-12T09:02:11.000Z"

  - name: an open request can be deploying while it is still open
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/5
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # The third combination, so the two fields are pinned as independent
        # rather than as two spellings of one thing.
        state: open
        deployment_state: in_progress

  - name: the identifier a client would store cannot address the request
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/dr_cauldron000000000001
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      # The id is a real field on a real record and the path takes the
      # number. Asking by id is a 404 that reads exactly like a deleted
      # deploy request.
      status: 404
      body:
        code: not_found

  - name: and the number that does address it is only unique to its database
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/3
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # A small integer, counted per database, sent as a number -- and the
        # unique identifier riding along beside it as an ordinary field.
        number: 3
        id: dr_cauldron000000000001
      absent:
        # And the partition it lives in is in the path and not in the body,
        # so a record pulled out of a listing carries no memory of which
        # database it belongs to.
        - organization
        - database

  - name: a deploy request still names a branch that is gone
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/3
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # branch still holds the name, branch_id still holds the id, and the
        # only thing saying it does not exist any more is a third field.
        branch: add-order-index
        branch_deleted: true
        branch_deleted_at: "2026-08-12T09:05:00.000Z"

  - name: and the request beside it has a branch that is still there
    source: https://planetscale.com/docs/openapi.yamlget-a-deploy-request
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests/5
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        branch: widen-sku
        branch_deleted: false
      absent:
        - branch_deleted_at

  - name: the last page says so with a null rather than by leaving it out
    source: https://planetscale.com/docs/openapi.yamllist-deploy-requests
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # "The next page number, or null when this is the last page." A loop
        # testing for the key never ends; one testing the value does.
        # Confluence spells the same idea by omitting the field.
        next_page: null
        type: list
        current_page: 1
        per_page: 25
        "data[0].number": 3
        "data[2].number": 5

  - name: filtering a listing by state gets the review state and not the other one
    source: https://planetscale.com/docs/openapi.yamllist-deploy-requests
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases/shop/deploy-requests?state=open
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # The parameter is called state, and it filters the field called
        # state -- so there is no way to ask this endpoint for everything
        # that has actually been deployed.
        "data[0].number": 5
        "data[0].deployment_state": in_progress
      absent:
        - data[1]

  - name: a database in another organisation is not there
    source: https://planetscale.com/docs/openapi.yamlget-a-database
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/somebody-else/databases/shop
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      # A record that exists but belongs to another organisation looks
      # absent rather than forbidden.
      status: 404
      body:
        code: not_found

  - name: a token the organisation does not know is refused
    source: https://planetscale.com/docs/openapi.yaml
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/cauldron/databases
      headers:
        Authorization: cauldronfixture:pscale_tkn_not_this_organisation
    expect:
      status: 401
      body:
        code: unauthorized
        message: Requires authentication

  - name: another organisation's databases are not in this one's listing
    source: https://planetscale.com/docs/openapi.yamllist-databases
    fixture: organisation
    request:
      method: GET
      path: /v1/organizations/somebody-else/databases
      headers:
        Authorization: cauldronfixture:pscale_tkn_cauldron000000000000
    expect:
      status: 200
      body:
        # An empty list rather than a refusal: the organisation is a
        # partition in the path, and asking a valid token about an
        # organisation it cannot see answers with nothing rather than saying
        # so.
        type: list
        next_page: null
      absent:
        - data[0]

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://planetscale.com/docs/openapi.yamllist-deploy-requests"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases/shop/deploy-requests"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      body:
        "data[0].number": 4
      absent:
        - "data[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether per_page was read or not -- but page can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "page moves the page on for v1 organizations databases"
    source: "https://planetscale.com/docs/openapi.yamllist-databases"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The record. This listing was answered already -- the route, the
  # status and the envelope beside it -- but only ever empty, so the
  # collection key and the field names under it had nothing asserting
  # them and could have been renamed to anything. This seeds a fixture
  # that holds 1 and asserts what came back.
  - name: "the database listing answers with a record in it"
    source: "https://planetscale.com/docs/openapi.yamlget-a-deploy-request"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      body:
        "data[0].name": "shop"
      absent:
        - "data[1]"

  # The names. This Recipe declares 2 field(s) on a database that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a database carries the field names this Recipe declares"
    source: "https://planetscale.com/docs/openapi.yamllist-databases"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      body:
        "data[0].created_at": "2026-01-09T10:14:22.000Z"
        "data[0].updated_at": "2026-08-12T09:01:44.000Z"

  # The names. This Recipe declares 8 field(s) on a deploy_request that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 8 name(s) that came back at the paths they came
  # back under.
  - name: "a deploy_request carries the field names this Recipe declares"
    source: "https://planetscale.com/docs/openapi.yamllist-deploy-requests"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases/shop/deploy-requests"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      body:
        "data[0].approved": true
        "data[0].branch_id": "br_cauldron0000000000a1"
        "data[0].closed_at": "2026-08-12T09:05:00.000Z"
        "data[0].created_at": "2026-08-11T14:20:00.000Z"
        "data[0].html_url": "https://app.planetscale.com/cauldron/shop/deploy-requests/3"
        "data[0].into_branch": "main"
        "data[0].num_comments": 2
        "data[0].updated_at": "2026-08-12T09:05:00.000Z"

  # The names. This Recipe declares 1 field(s) on a database that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a database carries the field names this Recipe declares, and 1 more of them"
    source: "https://planetscale.com/docs/openapi.yamllist-databases"
    fixture: organisation
    request:
      method: GET
      path: "/v1/organizations/cauldron/databases"
      headers:
        "Authorization": "cauldronfixture:pscale_tkn_cauldron000000000000"
    expect:
      status: 200
      body:
        "data[0].state": "ready"





