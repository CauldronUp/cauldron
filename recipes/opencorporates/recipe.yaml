# OpenCorporates Recipe for Cauldron
#
# The honest finding here is that the free, keyless OpenCorporates this
# task's brief describes does not exist any more, and this Recipe models
# that refusal rather than working around it. Every route this Recipe
# struck today (2026-09-03) against api.opencorporates.com -- the direct
# company lookup, the search endpoint, the reconciliation endpoint OpenRefine
# users have relied on for years, an invented path, a wrong method -- with no
# token, an empty token and a junk token, answered the byte-identical 401
# {"error":{"message":"Invalid Api Token. Please check your OpenCorporates
# account"}}. Not "most of it is gated now" the way CourtListener is
# per-viewset, and not the open-everywhere shape ProPublica is elsewhere in
# this task: OpenCorporates in 2026 refuses literally everything this Recipe
# could reach without an account, which this task's own brief anticipated as
# a possible honest outcome and asked to be stated plainly if it was the
# finding. It is.
#
# ## Where this differs from CourtListener and ProPublica
#
# Both of those are reachable with no credential for at least some of what
# they hold. OpenCorporates is not reachable for any of it -- and unlike
# Companies House elsewhere in this task, whose closure is total but whose
# credential taxonomy is rich (three distinct sentences across five request
# shapes), OpenCorporates collapses everything -- absent, empty, wrong,
# wrong-shaped, wrong-path, wrong-method, the historically-separate
# reconciliation surface -- to ONE sentence. Where CourtListener needed a
# per-viewset public/private split and Companies House needed per-shape
# routing to say what it observed, this Recipe needs neither: one auth
# scheme, one accepted key, one error, and every one of the cases below
# proves that collapse rather than working around it.
#
# OpenCorporates' own documentation does not agree with its own wire
# behaviour about this. Its API reference (quoted below, fetched today)
# states the HTTP codes as "401 Unauthorized: Authentication credentials
# were incorrect" -- wording that describes only a WRONG credential. The
# live wire answers the identical 401 and the identical sentence to NO
# credential at all, which the docs' own wording does not describe. That
# contradiction was checked live, not assumed.
#
# ## The identifier question this group of three exists to answer
#
# OpenCorporates aggregates roughly a hundred registers worldwide, and it
# says which one every record came from three separate ways at once, all
# three present on the one full worked example this Recipe holds (fetched
# from OpenCorporates' own docs, cited below, for the Dutch company "Bover
# B.V."): the identifier is jurisdiction-scoped explicitly in the URL PATH
# (/v0.4/companies/nl/17087985 -- "the jurisdiction code is the code for the
# jurisdiction which registered the company", the docs' own words), AGAIN as
# a field on the record (`jurisdiction_code: "nl"`, sitting beside
# `company_number: "17087985"` as two separate properties, never one
# compound identifier), and a THIRD time inside `source.publisher` /
# `source.url` -- for Bover, "OpenKVK.nl", not even the Dutch chamber of
# commerce directly but a third-party mirror of it, which is itself a
# provenance fact OpenCorporates chose to preserve rather than flatten to
# "the Netherlands". `registry_url` is a fourth pointer, aimed at the
# original register's own lookup page for this exact record. Four ways to
# ask "where did this come from," on one object, and jurisdiction is a
# genuinely separate field in every one of them -- never folded into the
# number itself the way, say, a Delaware SSN-shaped identifier sometimes is
# elsewhere. The jurisdiction_code scheme itself is documented precisely:
# "If this is a country it is simply the two-letter ISO code... If this is a
# state or province it is an underscore version of the ISO 3166-2 code...
# eg. Michigan in the US is us_mi" -- confirmed on the wire in the search
# example below, whose two American companies carry us_ga and us_wa.
#
# ## What a dissolved record looks like, and whether it stays retrievable
#
# The search example below (also OpenCorporates' own published worked
# example, not this Recipe's construction) answers that directly: "ABERDEEN
# BANK OF SCOTLAND NOMINEES LIMITED" (gb, SC024750) carries
# `current_status: "Dissolved"` and `inactive: true`, and is returned by an
# ordinary search exactly the way an active company is -- dissolution does
# not remove a company from OpenCorporates, or even relegate it to a
# different shape of response. What is worth stating plainly is what that
# same record does NOT carry: `dissolution_date` is null even though the
# company is dissolved, and both `retrieved_at` fields -- the one on the
# company itself and the one nested in `source` -- are ALSO null, on this
# exact record, in OpenCorporates' own published example. Compare the same
# response's other two companies, both active, both carrying real non-null
# retrieved_at timestamps. So the honest answer to "does the API say when it
# last synchronised with the official source" is: sometimes, and not
# always, and the gap is not random -- it correlates with exactly the
# records (older, dissolved, lower-priority to re-crawl) where a caller
# would most want to know how stale the data is and is instead told
# nothing. Companies House, this task's other Recipe, does not expose this
# question at all; OpenCorporates exposes it and sometimes has no answer.
#
# ## The status vocabulary is not a vocabulary
#
# Unlike Companies House's fixed twelve-value company_status enum,
# OpenCorporates' `current_status` is verbatim, per-jurisdiction text: this
# Recipe's own three real examples carry "Active", "Dissolved" and
# "Active/Compliance" -- the last one a Georgia Secretary of State term
# OpenCorporates passes through rather than normalises into anything
# comparable across jurisdictions. A client comparing current_status across
# two companies from two registers is comparing two different registers'
# own words, not one API's classification.
#
# ## Free access, checked plainly
#
# OpenCorporates' own documentation still describes an open-data carve-out
# ("Access to all the data is free for open data projects... An API key is
# required in order to use the OpenCorporates API" -- both sentences,
# verbatim, from the same paragraph) -- meaning even the free tier requires
# requesting and presenting a key; there is no keyless path any more,
# reconciliation endpoint included, and that was checked live rather than
# assumed from the prose. This Recipe holds one fixture key that this Recipe
# itself invented, accepted only by the emulator, never sent to
# api.opencorporates.com.
#
# ## Why the two successful responses below are raw, not resource-modelled
#
# Both are OpenCorporates' own published worked examples (API-Reference doc,
# cited below), not fabricated, and neither carries a verified date because
# no key exists here to call them with live -- the same trade the together
# Recipe elsewhere in this collection makes for its own catalogue fixture.
# They are declared as `raw` rather than as a `company` resource for the
# same reason ProPublica's Recipe in this task gives for its own organisation
# lookup: OpenCorporates wraps a search result TWICE -- once for the
# envelope (`results.companies`) and once PER ITEM (`{"company": {...}}}`
# inside the array) -- and this format's list styles describe the outer
# wrapping and have no way to describe the inner one without either
# understating the shape or inventing a fourth list style for one provider.
# `raw` states exactly what was captured and nothing more.
#
# ## Known fidelity gaps, stated rather than hidden
#
#   - No 200 response below carries a verified date -- see above.
#   - No upstream.spec is recorded. OpenCorporates' own reference is prose
#     HTML with embedded worked examples, not a machine-readable OpenAPI or
#     JSON Schema document, so there is nothing here for a fingerprint to
#     reduce.
#   - Rate limiting (`account_status`, `calls_remaining`) is documented in
#     the same reference but requires an authenticated account to observe
#     at all -- not modelled, for the same reason the 200s above carry no
#     verified date.

recipe: opencorporates
capability: docs
version: 0.1.0

upstream:
  api: v0.4
  docs: https://api.opencorporates.com/documentation/API-Reference

auth:
  scheme: query
  param: api_token
  keys:
    - cauldron00000000000000000000000000000000

responses:
  error:
    style: nested
    key: error
    message_field: message
    code_field: "-"
    type_field: "-"

routes:
  # OpenCorporates' own published worked example for a direct company
  # lookup. Reachable only with the fixture key above -- anything else is
  # refused by the credential check before this route is ever reached. See
  # the header for why this is raw rather than resource-modelled.
  - method: GET
    path: /v0.4/companies/nl/17087985
    raw:
      content_type: application/json; charset=utf-8
      text: '{"api_version": "0.2", "results": {"company": {"name": "Bover B.V.", "company_number": "17087985", "jurisdiction_code": "nl", "incorporation_date": null, "dissolution_date": null, "company_type": "Besloten Vennootschap", "registry_url": "https://server.db.kvk.nl/TST-BIN/FU/TSWS001@?BUTT=17087985", "branch": null, "branch_status": null, "inactive": false, "current_status": "Active", "created_at": "2011-01-12T21:50:57+00:00", "updated_at": "2012-02-02T10:36:46+00:00", "retrieved_at": "2011-08-25T14:37:37+01:00", "opencorporates_url": "https://opencorporates.com/companies/nl/17087985", "previous_names": null, "source": {"publisher": "OpenKVK.nl", "url": "https://www.openkvk.nl/17087985", "retrieved_at": "2011-08-25T14:37:37+01:00"}, "corporate_groupings": [], "data": {"most_recent": [{"datum": {"id": 2457732, "title": "SEC Edgar entry", "data_type": "OfficialRegisterEntry", "description": "register id: 1434782", "opencorporates_url": "https://opencorporates.com/data/2457732"}}, {"datum": {"id": 2457731, "title": "Company Address", "data_type": "CompanyAddress", "description": "BOKSHEIDE 20, EERSEL P7 5521 PM", "opencorporates_url": "https://opencorporates.com/data/2457731"}}], "total_count": 2, "url": "https://opencorporates.com/companies/nl/17087985/data"}, "filings": [], "officers": []}}}'

  # OpenCorporates' own published worked example for a search, chosen
  # because one of its three results is dissolved and the other two are
  # active companies from two different American states -- the exact
  # comparison the header above draws on.
  - method: GET
    path: /v0.4/companies/search
    raw:
      content_type: application/json; charset=utf-8
      text: '{"api_version": "0.4", "results": {"companies": [{"company": {"branch_status": null, "company_number": "SC024750", "company_type": null, "created_at": "2011-04-24T11:14:25+01:00", "current_status": "Dissolved", "dissolution_date": null, "inactive": true, "incorporation_date": null, "jurisdiction_code": "gb", "name": "ABERDEEN BANK OF SCOTLAND NOMINEES LIMITED", "opencorporates_url": "https://opencorporates.com/companies/gb/SC024750", "previous_names": null, "registry_url": "http://data.companieshouse.gov.uk/doc/company/SC024750", "retrieved_at": null, "source": {"publisher": "UK Companies House", "retrieved_at": null, "terms": "UK Crown Copyright", "url": "http://xmlgw.companieshouse.gov.uk/"}, "updated_at": "2014-01-18T22:44:40+00:00", "registered_address_in_full": null}}, {"company": {"branch": "F", "branch_status": "branch of an out-of-jurisdiction company", "company_number": "344214", "company_type": "Alien Corporations (RICO) - Foreign", "created_at": "2011-09-30T12:52:25+01:00", "current_status": "Active/Compliance", "dissolution_date": null, "inactive": false, "incorporation_date": "2005-03-28", "jurisdiction_code": "us_ga", "name": "BANK OF SCOTLAND", "opencorporates_url": "https://opencorporates.com/companies/us_ga/344214", "previous_names": [], "registry_url": "http://corp.sos.state.ga.us/corp/soskb/Corp.asp?344214", "retrieved_at": "2011-10-04T15:15:15+01:00", "source": {"publisher": "Georgia Secretary of State", "retrieved_at": "2011-10-04T15:15:15+01:00", "url": "http://corp.sos.state.ga.us/corp/soskb/Corp.asp?344214"}, "updated_at": "2014-02-16T16:18:16+00:00", "registered_address_in_full": "THE MOUND,EDINBURGH,EHI 1YZ, SCOTLAND ZF"}}, {"company": {"branch": "F", "branch_status": "branch of an out-of-jurisdiction company", "company_number": "601846892", "company_type": "BNK", "created_at": "2011-09-15T07:34:40+01:00", "current_status": "Active", "dissolution_date": null, "inactive": false, "incorporation_date": "1998-01-21", "jurisdiction_code": "us_wa", "name": "BANK OF SCOTLAND", "opencorporates_url": "https://opencorporates.com/companies/us_wa/601846892", "previous_names": null, "registry_url": "http://www.sos.wa.gov/corps/search_detail.aspx?ubi=601846892", "retrieved_at": "2013-03-06T16:59:21+00:00", "source": {"publisher": "Washington Secretary of State - Corporations Division", "retrieved_at": "2013-03-06T16:59:21+00:00", "url": "http://www.sos.wa.gov/corps/search_detail.aspx?ubi=601846892"}, "updated_at": "2014-02-06T17:44:27+00:00", "registered_address_in_full": null}}], "page": 1, "per_page": 30, "total_count": 190, "total_pages": 7}}'

errors:
  # The one sentence every failure on this host answers with, whatever
  # shape the failure took. See the header.
  authentication_error:
    status: 401
    message: Invalid Api Token. Please check your OpenCorporates account

fixtures:
  empty: {}

# Every 401 case below was struck live today against api.opencorporates.com
# with no account and no real key ever created. The two 200 cases carry no
# verified date -- see the header for why.
conformance:
  - name: no token at all is refused
    source: https://api.opencorporates.com/v0.4/companies/search?q=tesco
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        q: tesco
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: an empty token is refused the identical way
    source: https://api.opencorporates.com/v0.4/companies/search?q=tesco&api_token=
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        q: tesco
        api_token: ""
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: a junk token is refused the byte-identical way -- absent and wrong do not differ
    source: https://api.opencorporates.com/v0.4/companies/search?q=tesco&api_token=junkjunkjunk12345
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        q: tesco
        api_token: junkjunkjunk12345
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: a Bearer header instead of the query parameter is treated as no credential at all
    source: https://api.opencorporates.com/v0.4/companies/search?q=tesco
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        q: tesco
      headers:
        Authorization: "Bearer junkjunkjunk12345"
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: the historically free reconciliation endpoint is gated exactly the same way now
    source: https://api.opencorporates.com/v0.4/companies/reconcile?query=Tesco
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/reconcile
      query:
        query: Tesco
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: credential wins over routing -- an unrouted path is refused, not 404d
    source: https://api.opencorporates.com/v0.4/this-is-not-a-real-endpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v0.4/this-is-not-a-real-endpoint
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: credential wins over method too -- a wrong method on a real path is refused, not 405d
    source: https://api.opencorporates.com/v0.4/companies/search?q=tesco
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v0.4/companies/search
      query:
        q: tesco
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: DELETE on a direct company lookup is refused the same way
    source: https://api.opencorporates.com/v0.4/companies/gb/00102498
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /v0.4/companies/gb/00102498
    expect:
      status: 401
      body:
        error:
          message: Invalid Api Token. Please check your OpenCorporates account

  - name: a dissolved company stays retrievable and carries no dissolution date or sync timestamp
    source: https://api.opencorporates.com/documentation/API-Reference
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        api_token: cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        "results.companies[0].company.name": ABERDEEN BANK OF SCOTLAND NOMINEES LIMITED
        "results.companies[0].company.jurisdiction_code": gb
        "results.companies[0].company.current_status": Dissolved
        "results.companies[0].company.inactive": true
        "results.companies[0].company.dissolution_date": null
        "results.companies[0].company.retrieved_at": null
        "results.companies[0].company.source.publisher": UK Companies House

  - name: current_status is the register's own word, not a fixed cross-jurisdiction vocabulary
    source: https://api.opencorporates.com/documentation/API-Reference
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/search
      query:
        api_token: cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        "results.companies[1].company.jurisdiction_code": us_ga
        "results.companies[1].company.current_status": Active/Compliance
        "results.companies[1].company.source.publisher": Georgia Secretary of State
        "results.companies[2].company.jurisdiction_code": us_wa
        "results.companies[2].company.current_status": Active
        "results.companies[2].company.source.publisher": Washington Secretary of State - Corporations Division

  - name: a direct lookup carries the jurisdiction three separate ways, none of them folded into the number
    source: https://api.opencorporates.com/documentation/API-Reference
    fixture: empty
    request:
      method: GET
      path: /v0.4/companies/nl/17087985
      query:
        api_token: cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        results.company.company_number: "17087985"
        results.company.jurisdiction_code: nl
        results.company.source.publisher: OpenKVK.nl
        results.company.source.url: https://www.openkvk.nl/17087985
        results.company.registry_url: https://server.db.kvk.nl/TST-BIN/FU/TSWS001@?BUTT=17087985
