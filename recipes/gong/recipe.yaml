# Gong Recipe for Cauldron
#
# Written against Gong's API reference at gong.app.gong.io/settings/api and
# struck live against api.gong.io on 2026-09-07 with no credential and then
# with a deliberately invalid one.
#
# **The refusal discloses the running build, the branch and the number.** Struck
# live, on a request carrying no credential at all:
#
#   x-gong-service-version: PublicApiServer:17.main.20701
#
# The service name, a major version, the branch it was cut from, and the build
# number. `main` is in there. So an anonymous 401 says which of Gong's services
# answered, which line of development it came from and how many builds have
# been cut -- the same class of disclosure [imgix](../imgix) makes with
# `meta.server.version`, and here it is a header rather than a body so nothing
# that logs bodies will catch it.
#
# **Two correlation ids, neither labelled as the one to quote.** `x-traceid` in
# the headers and `requestId` in the body, different values on the same
# response. imgix does this too. A support ticket gets whichever one the
# client's error handler happened to keep.
#
# **`errors` is an array of strings.** Not objects:
#
#   {"requestId":"4cr7gi74j5xsi8t8orw",
#    "errors":["Validate credentials failed. Please check your credentials and try again."]}
#
# So there is no code, no field name, no pointer -- only prose, and the array
# exists because one request can fail several ways at once and each way is a
# sentence. [honeybadger](../honeybadger) in this collection puts a bare string
# in the same field name; Gong puts strings in an array, which is the shape
# between "one message" and "structured failures" and has the drawbacks of
# both.
#
# **The JSON is pretty-printed with a space before every colon.**
# `"requestId" : "4cr7gi74j5xsi8t8orw"` -- Jackson's `DefaultPrettyPrinter`,
# the Java default nobody turns off. Harmless on the wire, and it means every
# byte comparison, every fixture recorded by hand and every snapshot test
# written against this API carries the spacing.
#
# **An unknown path answers 401, not 404**, with the credentials sentence -- so
# route existence is not discoverable without a working key, and a typo is
# reported as an authentication problem.
#
# The `WWW-Authenticate: Basic realm="Gong.io API"` header is correct, which is
# rarer here than it should be.

recipe: gong
capability: chat
version: 0.1.0

upstream:
  api: v2
  docs: https://gong.app.gong.io/settings/api
  # No spec: Gong publishes its reference behind an account.

auth:
  # An access key and secret as Basic credentials.
  scheme: basic
  keys:
    - CAULDRONGONGFIXTUREKEY00
  absent_error: validate_credentials_failed
  rejected_error: validate_credentials_failed

responses:
  list:
    style: wrapped
    key: calls
    cursor_field: records.cursor
    count_field: records.totalRecords
    fields:
      requestId: 4cr7gi74j5xsi8t8orw
  error:
    style: string_list
    key: errors
    fields:
      # Beside the array rather than inside it, because it belongs to the
      # response rather than to any one failure in it.
      requestId: 4cr7gi74j5xsi8t8orw

resources:
  call:
    id:
      field: id
      style: digits
    fields:
      title:
        type: string
      started:
        type: datetime
      duration:
        type: integer
        default: 0
      direction:
        type: string
        default: Inbound
      system:
        type: string
        default: Zoom
      isPrivate:
        type: boolean
        default: false

routes:
  - method: GET
    path: /v2/calls
    resource: call
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: cursor

errors:
  validate_credentials_failed:
    status: 401
    # One sentence in an array of one. Struck live for a request with no
    # credential, one with a wrong credential, and one on a path that does not
    # exist.
    message: "Validate credentials failed. Please check your credentials and try again."
    headers:
      # Correct RFC 7617, which is rarer in this collection than it should be.
      WWW-Authenticate: 'Basic realm="Gong.io API"'
      # The running build, the branch and the number, on a response anyone can
      # obtain without an account.
      x-gong-service-version: "PublicApiServer:17.main.20701"
      # A second correlation id, disagreeing with the requestId in the body.
      x-traceid: 3uupfqfgc8dvzpakwzb

fixtures:
  empty:
    call: []

  workspace:
    call:
      - id: "7839201847362951047"
        title: Discovery -- Northwind
        started: "2026-09-02T15:00:00Z"
        duration: 2714
        direction: Inbound
        system: Zoom
        isPrivate: false
      - id: "7839201847362951048"
        title: Follow-up -- Northwind
        started: "2026-09-04T09:30:00Z"
        duration: 918
        direction: Outbound
        system: Zoom
        # Marked private, and still in the listing: Gong returns the record
        # and withholds the transcript, so a client counting calls counts this
        # one and a client fetching content does not get it.
        isPrivate: true

conformance:
  - name: an anonymous refusal names the running build
    source: https://api.gong.io/v2/calls
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers: {}
    expect:
      status: 401
      headers:
        # The service, a major version, the branch and the build number, to
        # a request with no account behind it.
        x-gong-service-version: "PublicApiServer:17.main.20701"

  - name: there are two correlation ids and they disagree
    source: https://api.gong.io/v2/calls
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers: {}
    expect:
      status: 401
      headers:
        x-traceid: 3uupfqfgc8dvzpakwzb
      body:
        # A different value from the header above, on the same response, and
        # nothing says which one support wants.
        requestId: 4cr7gi74j5xsi8t8orw

  - name: errors is an array of sentences
    source: https://api.gong.io/v2/calls
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers: {}
    expect:
      status: 401
      body:
        # Strings, not objects: no code, no field name, no pointer. The array
        # exists because one request can fail several ways, and each way is
        # prose.
        'errors[0]': "Validate credentials failed. Please check your credentials and try again."

  - name: the refusal challenges correctly
    source: https://api.gong.io/v2/calls
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers: {}
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Basic realm="Gong.io API"'

  - name: an unknown path is a credential failure
    source: https://api.gong.io/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        # notakey:notasecret
        Authorization: "Basic bm90YWtleTpub3Rhc2VjcmV0"
    expect:
      # 401, not 404, so route existence is not discoverable and a typo is
      # reported as an authentication problem.
      status: 401
      body:
        'errors[0]': "Validate credentials failed. Please check your credentials and try again."

  - name: calls are wrapped and identified by nineteen digits
    source: https://gong.app.gong.io/settings/api
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
    expect:
      status: 200
      body:
        # Sent as a string, because nineteen digits do not survive a double.
        'calls[0].id': "7839201847362951047"
        'calls[0].title': Discovery -- Northwind

  - name: a private call is in the listing without its contents
    source: https://gong.app.gong.io/settings/api
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
    expect:
      status: 200
      body:
        # The record comes back and the transcript does not, so a client
        # counting calls counts this one and a client fetching content gets
        # nothing for it -- two different totals from one listing.
        'calls[1].isPrivate': true
        'calls[1].direction': Outbound

  - name: a duration is seconds with no unit anywhere
    source: https://gong.app.gong.io/settings/api
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
    expect:
      status: 200
      body:
        # 2714, which is 45 minutes. Nothing in the name or the record says
        # seconds rather than milliseconds, and both readings produce a
        # plausible call length.
        'calls[0].duration': 2714
        'calls[0].started': "2026-09-02T15:00:00Z"
        'calls[0].system': Zoom

  - name: the paging block is nested beside the records
    source: https://gong.app.gong.io/settings/api
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'calls[0].id': "7839201847362951047"
        # The total of the whole set, under a records object rather than at
        # the top level.
        'records.totalRecords': 2
      matches:
        'records.cursor': '.'

  - name: the last page carries no cursor forward
    source: https://gong.app.gong.io/settings/api
    fixture: workspace
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
      query:
        limit: "1"
        # Sent by no other case, so this is what pins the cursor parameter's
        # name -- and note that the total below still counts the whole set
        # rather than what is left.
        cursor: "7839201847362951047"
    expect:
      status: 200
      body:
        'calls[0].id': "7839201847362951048"
        'records.totalRecords': 2
      absent:
        - 'records.cursor'

  - name: a workspace with no calls answers an empty array
    source: https://gong.app.gong.io/settings/api
    fixture: empty
    request:
      method: GET
      path: /v2/calls
      headers:
        Authorization: "Basic Q0FVTERST05HT05HRklYVFVSRUtFWTAwOnNlY3JldA=="
    expect:
      status: 200
      body:
        calls: []
