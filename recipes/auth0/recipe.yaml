# Auth0 Recipe for Cauldron
#
# Auth0's free tenant is a real tenant. Users created by a test are real users
# with real email addresses, verification emails go out, and the Management API
# token expires every day so a CI suite has to fetch a new one before it can do
# anything. The rate limit on the free tier is low enough that a suite creating
# and deleting users trips it, and deleting a user is permanent.
#
# Tried live anyway, on 2026-09-05, and confirmed rather than assumed: the
# Management API this Recipe models has no host at all that does not belong
# to a specific tenant. auth0.com itself answers 404 for /api/v2/users --
# it is the marketing site, not the API -- and every real request goes to
# {tenant}.auth0.com or {tenant}.{region}.auth0.com, a subdomain minted only
# once somebody has signed up. There is no shared, unauthenticated request
# this Recipe can send that reaches Auth0's own Management API code at all,
# which is a different and stricter condition than "answers a bot wall" or
# "the docs say get an account": the tenant is part of the *address*, not a
# credential presented to a shared one. No case below carries a verified
# date, and none can without an Auth0 tenant this project does not have.
#
# Two things worth modelling exactly:
#
#   1. The user_id encodes the connection it came from. auth0|abc is a
#      database user, google-oauth2|123 came from Google, samlp|... from an
#      enterprise connection. Code that assumes the auth0 prefix breaks the
#      first time somebody signs in with Google, and the identifier is not
#      interchangeable between connections either.
#   2. email_verified is a separate field from the email, and it is false
#      until somebody clicks the link. A tenant used for testing tends to
#      contain only verified users, so the branch that handles an unverified
#      one never runs until production.
#
# Known fidelity gap, stated rather than hidden: Auth0 returns a bare array by
# default and an object with totals when include_totals is set. Cauldron always
# returns the bare array.
#
# Tokens below are fixtures, not secrets.

recipe: auth0
capability: auth
version: 0.1.0

upstream:
  api: v2
  docs: https://auth0.com/docs/api/management/v2

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_management_token

responses:
  list:
    style: bare
  error:
    style: flat
    # Auth0 sends four fields and they are all different things: the HTTP
    # status, its reason phrase, the prose, and a machine-readable code.
    status_field: statusCode
    type_field: error
    code_field: errorCode
    message_field: message

resources:
  user:
    id:
      # The prefix says which connection the user came from. Code assuming
      # this one breaks on the first social login.
      #
      # auth0| is what a new database user is minted with. The others are
      # shapes a real tenant already contains and Cauldron does not create,
      # which is why they are listed separately rather than folded in: a
      # Recipe that minted a google-oauth2| user would be claiming Auth0
      # creates one, and it does not -- Google does.
      prefix: "auth0|"
      other_prefixes:
        - "google-oauth2|"
        - "samlp|"
        - "windowslive|"
        - "oidc|"
      length: 24
      field: user_id
    fields:
      email:
        type: string
        required: true
      # False until somebody clicks the link. A test tenant tends to hold
      # only verified users, so the branch handling this never runs.
      email_verified:
        type: boolean
        default: false
      name:
        type: string
      nickname:
        type: string
      # A blocked user still exists and is still returned by a listing. They
      # simply cannot sign in.
      blocked:
        type: boolean
        default: false
      connection:
        type: string
        default: Username-Password-Authentication
      logins_count:
        type: integer
        default: 0
      created_at:
        type: datetime
      # Absent until they have actually signed in once.
      last_login:
        type: datetime
        stamped: false

  connection:
    id:
      prefix: con_
      length: 16
    fields:
      name:
        type: string
        required: true
      strategy:
        type: string
        default: auth0
      enabled_clients:
        type: string

  client:
    id:
      style: opaque
      field: client_id
      length: 32
    fields:
      name:
        type: string
        required: true
      app_type:
        type: string
        default: spa
      # A first-party client skips the consent screen; a third-party one does
      # not, and the difference only shows up in a browser.
      is_first_party:
        type: boolean
        default: true
      token_endpoint_auth_method:
        type: string
        default: none

routes:
  - method: GET
    path: /api/v2/users
    resource: user
    operation: list
    pagination:
      # page and per_page, counted from nought -- Auth0's first page is page 0,
      # so a client reading page 1 as the first is handed the second.
      style: page
      limit_param: per_page
      cursor_param: page
      first_page: 0
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

  - method: POST
    path: /api/v2/users
    resource: user
    operation: create
    status: 201

  - method: GET
    path: /api/v2/users/{id}
    resource: user
    operation: get

  - method: PATCH
    path: /api/v2/users/{id}
    resource: user
    operation: update

  - method: DELETE
    path: /api/v2/users/{id}
    resource: user
    operation: delete

  - method: GET
    path: /api/v2/connections
    resource: connection
    operation: list
    pagination:
      # page and per_page, counted from nought -- Auth0's first page is page 0,
      # so a client reading page 1 as the first is handed the second.
      style: page
      limit_param: per_page
      cursor_param: page
      first_page: 0
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

  - method: GET
    path: /api/v2/clients
    resource: client
    operation: list
    pagination:
      # page and per_page, counted from nought -- Auth0's first page is page 0,
      # so a client reading page 1 as the first is handed the second.
      style: page
      limit_param: per_page
      cursor_param: page
      first_page: 0
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

webhooks:
  # Auth0 calls these log stream events.
  events:
    - ss
    - fp
    - sv
    - sepft
    - limit_wc
  signing:
    scheme: hmac-sha256
    header: X-Auth0-Signature
    secret: cauldron-log-stream-secret

errors:
  rate_limit:
    status: 429
    code: too_many_requests
    type: Too Many Requests
    message: Global rate limit has been reached
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  authentication_error:
    status: 401
    code: invalid_token
    type: Unauthorized
    message: Invalid token

  resource_missing:
    status: 404
    code: inexistent_user
    type: Not Found
    message: "No user exists with the specified ID: {detail}"

  parameter_missing:
    status: 400
    code: invalid_body
    type: Bad Request
    message: "Payload validation error: {detail} is required"

  # Auth0 refuses a duplicate email in a database connection, which is what
  # breaks a retried migration halfway through.
  user_exists:
    status: 409
    code: auth0_idp_error
    type: Conflict
    message: The user already exists.

  # The Management API token is short lived, and an expired one fails
  # differently from a malformed one.
  expired_token:
    status: 401
    code: expired_token
    type: Unauthorized
    message: The access token has expired

  # A token without the right scope reads like a missing resource until you
  # read the code.
  insufficient_scope:
    status: 403
    code: insufficient_scope
    type: Forbidden
    message: "Insufficient scope, expected any of: read:users"

fixtures:
  empty: {}

  small-tenant:
    connection:
      - id: con_cauldron00000001
        name: Username-Password-Authentication
        strategy: auth0
      - id: con_cauldron00000002
        name: google-oauth2
        strategy: google-oauth2
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: con_cauldron00000003
        name: google-oauth2
        strategy: google-oauth2
    user:
      - id: "auth0|000000000000000000000001"
        email: ada@example.com
        email_verified: true
        name: Ada Lovelace
        logins_count: 42
        last_login: "2026-01-14T09:12:00Z"
      - id: "auth0|000000000000000000000002"
        email: grace@example.com
        # Signed up, never clicked the link. Cannot be trusted as an
        # identity, and a test tenant rarely contains one.
        email_verified: false
        name: Grace Hopper
      - id: "google-oauth2|107329581004"
        email: alan@example.com
        email_verified: true
        name: Alan Turing
        # Came from Google. Code that parses the id assuming auth0| breaks
        # here, and the identifier is not interchangeable with the database
        # user of the same email address.
        connection: google-oauth2
        logins_count: 3
      - id: "auth0|000000000000000000000004"
        email: blocked@example.com
        email_verified: true
        # Still exists, still listed, cannot sign in.
        blocked: true
    client:
      - id: "00000000000000000000000000000001"
        name: Cauldron SPA
        app_type: spa
        is_first_party: true

# Conformance cases, read from Auth0's Management API reference rather than
# observed against a live tenant. The verify report says so.
conformance:
  - name: the user_id encodes the connection it came from
    source: https://auth0.com/docs/manage-users/user-accounts/identify-users
    fixture: small-tenant
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: Bearer cauldron_management_token
    expect:
      status: 200
      body:
        '[0]':
          user_id: "auth0|000000000000000000000001"
        # Came from Google. Code parsing the id and assuming auth0| breaks
        # here, and this identifier is not interchangeable with a database
        # user of the same email address.
        '[2]':
          user_id: "google-oauth2|107329581004"
          connection: google-oauth2
      absent:
        - '[0].id'

  - name: an unverified email is a separate fact from the email
    source: https://auth0.com/docs/manage-users/user-accounts
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/users/auth0|000000000000000000000002"
      headers:
        Authorization: Bearer cauldron_management_token
    expect:
      status: 200
      body:
        # Signed up, never clicked the link. A tenant used for testing tends
        # to hold only verified users, so this branch never runs until
        # production.
        email: grace@example.com
        email_verified: false
      absent:
        - last_login

  - name: a blocked user is still returned
    source: https://auth0.com/docs/manage-users/user-accounts/block-and-unblock-users
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/users/auth0|000000000000000000000004"
      headers:
        Authorization: Bearer cauldron_management_token
    expect:
      status: 200
      body:
        # Exists, listed, cannot sign in. Filtering a user list without
        # reading this shows somebody who has no access.
        blocked: true
        email_verified: true

  - name: a collection is a bare array
    source: https://auth0.com/docs/api/management/v2
    fixture: small-tenant
    request:
      method: GET
      path: /api/v2/connections
      headers:
        Authorization: Bearer cauldron_management_token
    expect:
      status: 200
      body:
        '[0]':
          name: Username-Password-Authentication
          strategy: auth0
        '[1]':
          strategy: google-oauth2
      absent:
        - users
        - data
        - total

  - name: the error carries four distinct fields
    source: https://auth0.com/docs/api/management/v2
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/users/auth0|doesnotexist"
      headers:
        Authorization: Bearer cauldron_management_token
    expect:
      status: 404
      body:
        # The status, its reason phrase, the prose and a machine-readable
        # code are four different things, and only the last is stable.
        statusCode: 404
        error: Not Found
        errorCode: inexistent_user
      matches:
        message: 'No user exists'

  - name: a created user is unverified and has never signed in
    source: https://auth0.com/docs/api/management/v2
    fixture: empty
    request:
      method: POST
      path: /api/v2/users
      headers:
        Authorization: Bearer cauldron_management_token
      json:
        email: alan@example.com
        name: Alan Turing
    expect:
      status: 201
      body:
        email: alan@example.com
        # Created is not verified, and creating a user through the API does
        # not make them trustworthy as an identity.
        email_verified: false
        blocked: false
        logins_count: 0
      matches:
        user_id: '^auth0\|[A-Za-z0-9]{24}$'
      absent:
        - last_login

  - name: a bad token is refused with the same four fields
    source: https://auth0.com/docs/api/management/v2
    request:
      method: GET
      path: /api/v2/users
    expect:
      status: 401
      body:
        statusCode: 401
        error: Unauthorized
        errorCode: invalid_token

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=1, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://auth0.com/docs/manage-users/user-accounts/identify-users"
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/users"
      query:
        "per_page": "1"
        "page": "1"
      headers:
        "Authorization": "Bearer cauldron_management_token"
    expect:
      status: 200
      body:
        "[0].user_id": "auth0|000000000000000000000002"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=1, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads on api v2 connections"
    source: "https://auth0.com/docs/api/management/v2"
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/connections"
      query:
        "per_page": "1"
        "page": "1"
      headers:
        "Authorization": "Bearer cauldron_management_token"
    expect:
      status: 200
      body:
        "[0].id": "con_cauldron00000002"
      absent:
        - "[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the client listing answers with what the fixture holds"
    source: "https://auth0.com/docs/manage-users/user-accounts/identify-users"
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/clients"
      headers:
        "Authorization": "Bearer cauldron_management_token"
    expect:
      status: 200
      body:
        "[0].client_id": "00000000000000000000000000000001"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=1, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads on api v2 users"
    source: "https://auth0.com/docs/manage-users/user-accounts/identify-users"
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/users"
      query:
        "per_page": "1"
        "page": "1"
      headers:
        "Authorization": "Bearer cauldron_management_token"
    expect:
      status: 200
      body:
        "[0].user_id": "auth0|000000000000000000000002"
      absent:
        - "[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://auth0.com/docs/manage-users/user-accounts/identify-users"
    fixture: small-tenant
    request:
      method: GET
      path: "/api/v2/clients"
      query:
        "per_page": "1"
        "page": "1"
      headers:
        "Authorization": "Bearer cauldron_management_token"
    expect:
      status: 200
      absent:
        - "[0]"



