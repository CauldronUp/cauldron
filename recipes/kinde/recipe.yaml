# Kinde Recipe for Cauldron
#
# One of three Recipes (with frontegg/recipe.yaml and
# propelauth/recipe.yaml) written together to answer one question: every
# customer gets their own hostname -- <business>.kinde.com -- and what
# happens when a caller reaches one that is wrong or does not exist at all.
# make/recipe.yaml already found a provider where that question has no
# answer: a real token on the wrong zone is indistinguishable from one nobody
# ever issued. Kinde is not that provider, on either axis this group probes.
#
# *.kinde.com is a genuine wildcard, checked with plain nslookup:
#
#   zzz-cauldron-nonexistent-probe-12345.kinde.com  -> resolves
#   another-fake-probe-98765.kinde.com              -> resolves
#   kinde.kinde.com (Kinde's own dogfooded business) -> resolves
#
# all three to real IP addresses, none of them NXDOMAIN. DNS alone cannot
# tell a business from a typo here, the same as it cannot for Make's six
# zones or Frontegg's app-<id> hosts. What the application answers once a
# connection lands is where Kinde stops resembling either of them.
#
# GET / on a fabricated subdomain answers 202 with an AWS WAF
# x-amzn-waf-action: challenge header and an empty body -- a bot-mitigation
# gate, not a Kinde behaviour, and it does not fire consistently: a *second*,
# never-before-touched fabricated subdomain answered its very first request
# cleanly. Struck past that gate, on three separate fabricated subdomains and
# on two different paths (GET /.well-known/openid-configuration and
# GET /api/v1/users), the answer is stable and it names the actual problem:
#
#   HTTP/1.1 404 Not Found
#   <title>404 Domain Not Found</title>
#
# an HTML page from Kinde's own admin app, not a JSON API error, but a page
# whose title says in as many words what Frontegg's "Failed to find vendor
# for host" says in JSON: this business does not exist. Checked live, this
# same page, byte-identical up to the request path in the markup, answers
# for a hostname this project fabricated and for a second one it also
# fabricated -- the finding is that Kinde tells you the domain is wrong at
# all, not that any one probe of it is special.
#
# kinde.kinde.com -- Kinde's own account, confirmed live as real by its
# public /.well-known/openid-configuration answering a genuine OIDC discovery
# document with issuer "https://kinde.kinde.com" -- is where this Recipe's
# credential findings were struck, because a management-API call needs a
# subdomain that is at least a real business to get past the domain check at
# all. No account, no application and no API key were ever created there;
# every case below is either a routing-level probe needing no credential, or
# a credential this project invented and confirmed was never accepted.
#
# The management API's own failure envelope has three distinguishable
# sentences, not two, all under the identical 403 status and the identical
# first array entry:
#
#   no Authorization header at all
#     -> {"errors":[{"code":"INVALID_CREDENTIALS","message":"Invalid
#         credentials used to access API"},{"code":
#         "INVALID_AUTHORIZATION_HEADER","message":"Invaild authorization
#         header"}]}
#   Authorization: Bearer <a plain word, no dots -- not JWT-shaped>
#     -> second entry: {"code":"TOKEN_INVALID","message":"token contains an
#        invalid number of segments"}
#   Authorization: Bearer <three dot-separated segments, real header and
#     payload, no kid Kinde has ever issued>
#     -> second entry: {"code":"TOKEN_INVALID","message":"the JWT has an
#        invalid kid: could not find kid in JWT header"}
#
# the same shape-not-value distinction turso/recipe.yaml already found for a
# different provider's JWTs, one layer deeper here: a plain word and a
# well-formed-but-unissued JWT are not just both "wrong," they fail two
# different checks inside the same code path and Kinde's own error carries
# the difference. And missing is a third thing again, distinct from both --
# INVALID_AUTHORIZATION_HEADER is not TOKEN_INVALID, because there was no
# token to find a fault in.
#
# All three answers were struck against every path this Recipe tried, known
# or not, and against a wrong method on a known path (PUT /api/v1/users, no
# credential): identical body every time. Kinde's auth gate runs before
# routing is even attempted, the same order firehydrant/recipe.yaml already
# documents for a different provider, confirmed live here on Kinde's own
# host: a path this Recipe declares no route for at all is refused for its
# credentials, never for its path, and a method with nothing registered gets
# refused the identical way rather than a routing-specific shape.
#
# The machine-to-machine flow this group of Recipes was asked to look for is
# named in Kinde's own published OpenAPI description before it is anything
# else: "1. Set up and authorize a machine-to-machine (M2M) application... 2.
# Generate a test access token... 3. Test request any endpoint using the test
# token." Both the M2M client_credentials grant and the end-user
# authorization_code grant mint that token from the identical route,
# POST /oauth2/token, and struck live, every malformed request to it --
# empty body, grant_type alone with no client_id, a garbage client_id and
# secret under client_credentials, a garbage code under authorization_code --
# answers the identical 400, in a completely different vocabulary from the
# management API above:
#
#   HTTP/1.1 400 Bad Request
#   Content-Type: text/plain; charset=utf-8
#
#   not_found
#
# ten bytes, no code, no JSON, the same for a missing parameter and a
# well-formed-but-invented credential alike -- this endpoint does not
# distinguish "you sent nothing" from "you sent something specific and
# wrong" the way /api/v1/users does three different ways. The token-minting
# surface is the thin one; the resource surface is the rich one. That is
# backwards from what a caller might expect the more security-sensitive
# endpoint to do, and it is exactly what was observed, four separate ways.
#
# Kinde's own hosted OpenAPI description (api-spec.kinde.com, fetched
# directly and confirmed live, not the stale kinde.com/api path its own
# older SDK generators point at, which now 404s) settles two more things this
# project could not have watched happen without a credential:
#
#   - The identifier a caller reads off a listed organisation is named
#     "code," not "id" -- organization_item_schema has no id property at
#     all, the same shape firehydrant/recipe.yaml already found for a
#     severity addressed by slug rather than id.
#   - A single user, fetched by GET /api/v1/user?id=..., carries
#     preferred_email; the identical concept on every entry of
#     GET /api/v1/users' own array is named email instead, on two response
#     schemas in the same published file. Code reading .preferred_email off
#     a listed user finds undefined, and code reading .email off a single
#     fetched one finds the same.
#   - Organisation feature flags -- GET /api/v1/organizations/{org_code}/
#     feature_flags -- answers a map keyed by flag key, each entry
#     {"type": "str"|"int"|"bool", "value": <string>}: value is documented as
#     a string on every one of the three types, so a boolean flag's value
#     arrives as the four-byte string "true," not JSON true, and a client
#     that trusts type before parsing value gets it right; one that does not
#     gets a truthy string for every flag including the one whose value is
#     the string "false". Not modelled as a route below -- see the gaps.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No application, API key, M2M client or end-user account was ever
#     created on kinde.kinde.com or anywhere else. The one resource route
#     below is proven only against an empty fixture, the same device
#     make/recipe.yaml and census/recipe.yaml use for the same reason.
#   - Kinde's real envelope carries two array entries for every failure --
#     a constant {"code":"INVALID_CREDENTIALS",...} first, then the specific
#     one quoted above. Cauldron's list error style serves exactly one entry
#     per failure; the specific one is served, because it is the one the
#     three-way finding above turns on, and the constant wrapper is recorded
#     here and not modelled -- the same trade frontegg/recipe.yaml states for
#     its own two-sentence body.
#   - The "404 Domain Not Found" page is an HTML admin-app response, not a
#     JSON API shape, and Cauldron routes model wire APIs rather than a
#     provider's own web frontend. It is recorded in this header as observed
#     evidence and is not served by any route below, the same choice
#     propelauth/recipe.yaml makes for its own frontend 404.
#   - ROUTE_NOT_FOUND -- {"errors":{"code":"ROUTE_NOT_FOUND","message":"The
#     requested API route does not exist"}} -- is real, documented in the
#     spec, and only reachable behind a valid credential this project never
#     had; see rootly/recipe.yaml for the identical shape of gap on a
#     different provider. It is declared below and carries no verified date.
#   - Organisations, feature flags, roles, permissions and every
#     organisation-scoped route are out of scope beyond the one list route
#     below and the feature-flag finding stated above in prose. This Recipe
#     exists to show the domain and credential mechanism, not to be a
#     complete client for a management API with over two hundred documented
#     paths.
#   - No rate-limit header was seen on any response this Recipe struck, so
#     none is declared.
#
# Every case below not carrying a verified date was read from Kinde's own
# hosted OpenAPI description at api-spec.kinde.com/kinde-management-api-spec
# .yaml (openapi: 3.0.0, info.title: "Kinde Management API"), fetched
# directly, not observed against a real business. Keys below are fixtures,
# not secrets.

recipe: kinde
capability: auth
version: 0.1.0

upstream:
  api: "1"
  provider: kinde
  docs: https://docs.kinde.com/developer-tools/kinde-api/
  spec: https://api-spec.kinde.com/kinde-management-api-spec.yaml
  spec_hash: e7238d6701af21612366700074c9a5f54f73b5db3f2d01694e6314ecd17d4b0f
  spec_seen: "2026-09-01"

auth:
  # Genuinely a bearer JWT on the management API, and a form-encoded
  # client_credentials/authorization_code grant with no Authorization header
  # at all on the token endpoint -- one recipe, two unrelated credential
  # shapes, the same split mezmo/recipe.yaml documents for ingestion versus
  # export. scheme: none plus required_headers is the device that lets both
  # live in one Recipe; required_headers has no way to scope itself to one
  # path, only to a set of methods, and POST is not exclusive to the token
  # route here, so the token-endpoint cases below send a placeholder
  # Authorization header to clear Cauldron's own gate -- confirmed live, with
  # one sent anyway, that the real endpoint's answer does not change.
  scheme: none

required_headers:
  Authorization:
    error: no_credential

responses:
  error:
    style: list
    key: errors
    message_field: message
    code_field: code
    code_type: string

resources:
  user:
    collection: users
    id:
      style: opaque
    fields:
      # The list's own item schema names this "email." A single user fetched
      # by GET /api/v1/user?id=... carries the same concept under
      # "preferred_email" instead -- see the header. Both are real,
      # documented, and not the same field name.
      email:
        type: string
      provided_id:
        type: string
        null_when_unset: true
      is_suspended:
        type: boolean
        default: false
      total_sign_ins:
        type: integer
        null_when_unset: true
      failed_sign_ins:
        type: integer
        null_when_unset: true
      last_signed_in:
        type: datetime
        null_when_unset: true
      created_on:
        type: datetime
        null_when_unset: true
      organizations:
        type: list

  # A business's own configured organisation. code is the identifier every
  # path actually takes -- organization_item_schema has no "id" property at
  # all, the same shape firehydrant/recipe.yaml already found for a severity
  # addressed by slug.
  organization:
    collection: organizations
    id:
      style: opaque
      field: code
    fields:
      name:
        type: string
      handle:
        type: string
        null_when_unset: true
      is_default:
        type: boolean
        default: false
      external_id:
        type: string
        null_when_unset: true
      is_auto_membership_enabled:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/v1/users
    resource: user
    operation: list
    matches_header:
      Authorization: "Bearer cauldron-kinde-fixture-management-token-0000000000"
    pagination:
      style: cursor
      limit_param: page_size
      cursor_param: next_token
    list:
      style: wrapped
      cursor_field: next_token

  # Three dot-separated segments, well-formed enough to be parsed as a JWT,
  # naming a kid Kinde has never issued. A different failure at a later
  # stage of the same check than the catch-all below.
  - method: GET
    path: /api/v1/users
    matches_header:
      Authorization: "Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiIsImlhdCI6MTIzNDU2Nzg5MH0.fakefakefakefakefakefakefakefakefakefakefake"
    error: jwt_bad_kid

  # Everything else that was offered and did not check out: a plain word
  # with no dots, the shape this Recipe actually struck live.
  - method: GET
    path: /api/v1/users
    error: malformed_token

  - method: GET
    path: /api/v1/organizations
    resource: organization
    operation: list
    matches_header:
      Authorization: "Bearer cauldron-kinde-fixture-management-token-0000000000"
    pagination:
      style: cursor
      limit_param: page_size
      cursor_param: next_token
    list:
      style: wrapped
      cursor_field: next_token

  - method: GET
    path: /api/v1/organizations
    error: malformed_token

  # A path this Recipe declares no other route for, armed with the same
  # catch-all fallback a real route's malformed case gets -- the same device
  # census/recipe.yaml uses to make the auth-before-routing point directly.
  # Struck live: this exact path, with a plain-word credential, answered the
  # identical body a real route's fallback does.
  - method: GET
    path: /api/v1/this-is-not-a-real-resource
    error: malformed_token

  # Mints the token both the M2M and the end-user flow use -- see the header
  # for why this route's own failure vocabulary is so much thinner than the
  # one guarding every route above it. The conformance cases below send a
  # placeholder Authorization header purely to clear Cauldron's own
  # required_headers gate; the real endpoint was confirmed live to ignore it
  # entirely.
  - method: POST
    path: /oauth2/token
    error: token_request_invalid

errors:
  # required_headers' own answer for a request carrying no Authorization
  # anywhere at all. See the header for the constant first array entry this
  # shape cannot also carry.
  no_credential:
    status: 403
    code: INVALID_AUTHORIZATION_HEADER
    message: "Invaild authorization header"

  # A credential that is not even JWT-shaped -- no dots at all, the exact
  # value this Recipe sent live.
  malformed_token:
    status: 403
    code: TOKEN_INVALID
    message: "token contains an invalid number of segments"

  # Three segments, well-formed enough to be parsed, naming a kid nobody
  # issued. A different failure at a later stage of the same check.
  jwt_bad_kid:
    status: 403
    code: TOKEN_INVALID
    message: "the JWT has an invalid kid: could not find kid in JWT header"

  # Ten bytes, plain text, no code -- the token endpoint's one answer to
  # every malformed request this Recipe struck it with. See the header.
  token_request_invalid:
    status: 400
    style: text
    message: "not_found"

  # Documented, not observed -- reaching it needs a credential this project
  # never had, because the auth gate runs before routing on every path this
  # Recipe tried. See rootly/recipe.yaml for the identical shape of gap.
  route_not_found:
    status: 404
    style: flat
    key: errors
    code_field: code
    message_field: message
    code: ROUTE_NOT_FOUND
    message: "The requested API route does not exist"

fixtures:
  empty: {}

conformance:
  - name: no credential at all is INVALID_AUTHORIZATION_HEADER, not a missing token
    source: https://kinde.kinde.com/api/v1/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/users
    expect:
      status: 403
      body:
        "errors[0].code": INVALID_AUTHORIZATION_HEADER
        "errors[0].message": "Invaild authorization header"

  - name: a plain word with no dots fails a different check
    source: https://kinde.kinde.com/api/v1/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: Bearer junk-not-a-jwt-at-all
    expect:
      status: 403
      body:
        "errors[0].code": TOKEN_INVALID
        "errors[0].message": "token contains an invalid number of segments"

  - name: a well-formed JWT naming no real kid fails a later, different check
    source: https://kinde.kinde.com/api/v1/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiIsImlhdCI6MTIzNDU2Nzg5MH0.fakefakefakefakefakefakefakefakefakefakefake
    expect:
      status: 403
      body:
        "errors[0].code": TOKEN_INVALID
        "errors[0].message": "the JWT has an invalid kid: could not find kid in JWT header"

  - name: an unrouted path is refused for its credentials, never for its path
    source: https://kinde.kinde.com/api/v1/this-is-not-a-real-resource
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/this-is-not-a-real-resource
      headers:
        Authorization: Bearer junk-not-a-jwt-at-all
    expect:
      status: 403
      body:
        "errors[0].code": TOKEN_INVALID

  - name: a method nothing is registered for gets the identical body, not a 405
    source: https://kinde.kinde.com/api/v1/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/v1/users
    expect:
      status: 403
      body:
        "errors[0].code": INVALID_AUTHORIZATION_HEADER

  - name: the token endpoint answers ten bytes of plain text, not JSON, for a malformed client_credentials request
    # The Authorization header here is a placeholder to clear Cauldron's own
    # required_headers gate -- see auth above. Confirmed live that the real
    # endpoint answers identically with or without one.
    source: https://kinde.kinde.com/oauth2/token
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /oauth2/token
      headers:
        Content-Type: application/x-www-form-urlencoded
        Authorization: Bearer irrelevant-to-this-endpoint
      form:
        grant_type: client_credentials
        client_id: cauldron-fake-client-id
        client_secret: cauldron-fake-secret
    expect:
      status: 400
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "^not_found$"

  - name: the identical body answers a malformed authorization_code request too
    source: https://kinde.kinde.com/oauth2/token
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /oauth2/token
      headers:
        Content-Type: application/x-www-form-urlencoded
        Authorization: Bearer irrelevant-to-this-endpoint
      form:
        grant_type: authorization_code
        code: cauldron-fake-code
        client_id: cauldron-fake-client-id
        client_secret: cauldron-fake-secret
        redirect_uri: https://example.com
    expect:
      status: 400
      body_matches: "^not_found$"

  - name: the correct credential clears the gate to an empty collection
    source: https://api-spec.kinde.com/kinde-management-api-spec.yaml
    fixture: empty
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: "Bearer cauldron-kinde-fixture-management-token-0000000000"
    expect:
      status: 200
      body:
        users: []
