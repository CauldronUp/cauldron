# Salt Edge Recipe for Cauldron
#
# Written against Salt Edge's API reference at docs.saltedge.com and struck
# live against www.saltedge.com on 2026-09-07 with no credential and then with
# a deliberately invalid one.
#
# **The documentation link points at the anchor for that exact error.** Struck
# live:
#
#   GET /api/v5/customers                      (no credential)
#   400 {"error":{"class":"AppIdNotProvided",
#                 "message":"'App-Id' was not provided in request headers.",
#                 "documentation_url":"https://docs.saltedge.com/account_information/v5/#errors-app_id_not_provided",
#                 "request_id":"..."}}
#
# Not the API's front page. Not a generic errors page. The fragment for
# `app_id_not_provided`, which is the failure that just happened.
#
# **This is the best `documentation_url` in the collection and it is worth
# saying so.** Several providers here send one -- GitHub's
# `documentation_url`, Statsig's, DocSpring's -- and every one of them points
# at a section a reader still has to search. Salt Edge deep-links to the
# paragraph. A developer reading a failure in a log can click once and be
# looking at the explanation of *that* failure.
#
# **`class` is the exception class.** `AppIdNotProvided`, `ApiKeyNotFound` --
# Ruby class names, in PascalCase, in the field a client branches on. That is
# a machine-readable code with a stable name, which is more than most providers
# here manage, and it is also a name from the codebase: renaming the class
# renames the wire contract.
#
# **A credential failure is 400.** Not 401 and not 403. So the status a client
# retries on, the status it re-authenticates on, and the status it treats as
# "my payload is wrong" are all the same number here -- and the third reading
# is the one that sends somebody looking at their request body.
#
# **An unknown path answers the credential failure.** `ApiKeyNotFound` on
# `/api/v5/cauldron-nope`, so routing is judged after authentication and a path
# cannot be shown not to exist.
#
# **Two headers, not one.** `App-Id` and `Secret`, both required, both
# refused separately: no App-Id is `AppIdNotProvided` and a wrong pair is
# `ApiKeyNotFound`. So the two halves of the credential have their own
# failures, which is rarer here than it should be.

recipe: saltedge
capability: banking
version: 0.1.0

upstream:
  api: v5
  docs: https://docs.saltedge.com/account_information/v5/
  # No spec: Salt Edge publishes a rendered reference site.

auth:
  scheme: header
  header: App-Id
  keys:
    - cauldron-f1xture-app-id
  # The two halves of the credential fail differently, struck live.
  absent_error: app_id_not_provided
  rejected_error: api_key_not_found

responses:
  list:
    style: wrapped
    key: data
    fields:
      meta:
        next_id: null
        next_page: null
  error:
    style: nested
    key: error
    message_field: message
    # The exception class, in PascalCase, which is a stable machine-readable
    # name and also a name from the codebase.
    code_field: class
    code_type: string
    type_field: "-"

resources:
  customer:
    id:
      field: id
      style: digits
    fields:
      identifier:
        type: string
      secret:
        type: string
      # Untyped, so a customer who is not blocked omits the key rather than
      # being given a zero date.
      blocked_at:
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /api/v5/customers
    resource: customer
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: per_page
      cursor_param: from_id

errors:
  app_id_not_provided:
    # 400, not 401. Struck live.
    status: 400
    code: AppIdNotProvided
    message: "'App-Id' was not provided in request headers."
    fields:
      # The fragment for this exact failure, not the front page and not a
      # generic errors section. The best documentation link in this
      # collection.
      error.documentation_url: "https://docs.saltedge.com/account_information/v5/#errors-app_id_not_provided"
      error.request_id: "2dd0a1f7c4b93e85"

  api_key_not_found:
    status: 400
    code: ApiKeyNotFound
    message: "API key does not exist or is inactive."
    fields:
      error.documentation_url: "https://docs.saltedge.com/account_information/v5/#errors-api_key_not_found"
      error.request_id: "d3a7be29105f6c48"

fixtures:
  empty:
    customer: []

  app:
    customer:
      - id: "1077308375771481711"
        identifier: ada-lovelace-01
        secret: cauldron-customer-secret-0001
        created_at: "2026-05-12T08:41:03Z"
        updated_at: "2026-08-30T19:22:44Z"
      - id: "1077308375771481712"
        identifier: grace-hopper-02
        secret: cauldron-customer-secret-0002
        # Blocked, and still listed with a timestamp saying when. A customer
        # that is blocked cannot refresh a connection, and nothing in the
        # listing marks that except a date that is present rather than null.
        blocked_at: "2026-09-01T11:00:00Z"
        created_at: "2026-06-02T14:05:17Z"
        updated_at: "2026-09-01T11:00:00Z"

conformance:
  - name: the documentation link names the failure that happened
    source: https://www.saltedge.com/api/v5/customers
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers: {}
    expect:
      status: 400
      body:
        # The fragment for app_id_not_provided, not the front page. A reader
        # with this in a log can click once and be looking at the explanation
        # of this failure.
        'error.documentation_url': "https://docs.saltedge.com/account_information/v5/#errors-app_id_not_provided"
        'error.message': "'App-Id' was not provided in request headers."

  - name: the code is an exception class name
    source: https://www.saltedge.com/api/v5/customers
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers: {}
    expect:
      status: 400
      body:
        # PascalCase, in the field a client branches on: a stable
        # machine-readable name, and a name from the codebase.
        'error.class': AppIdNotProvided

  - name: a credential failure is 400 rather than 401
    source: https://www.saltedge.com/api/v5/customers
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers: {}
    expect:
      # So the status a client retries on, re-authenticates on, and reads as
      # "my payload is wrong" are one number -- and the third reading sends
      # somebody looking at their request body.
      status: 400

  - name: the two halves of the credential fail differently
    source: https://www.saltedge.com/api/v5/customers
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers:
        App-Id: notreal
        Secret: notreal
    expect:
      status: 400
      body:
        # A different class and a different link from the case above: no
        # App-Id is one failure and a pair nobody issued is another.
        'error.class': ApiKeyNotFound
        'error.message': "API key does not exist or is inactive."
        'error.documentation_url': "https://docs.saltedge.com/account_information/v5/#errors-api_key_not_found"

  - name: an unknown path is a credential failure
    source: https://www.saltedge.com/api/v5/cauldron-nope
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/cauldron-nope
      headers:
        App-Id: notreal
        Secret: notreal
    expect:
      # Routing is judged after authentication, so a path cannot be shown not
      # to exist.
      status: 400
      body:
        'error.class': ApiKeyNotFound

  - name: every failure carries a request id
    source: https://www.saltedge.com/api/v5/customers
    verified: "2026-09-07"
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers: {}
    expect:
      status: 400
      body:
        'error.request_id': "2dd0a1f7c4b93e85"

  - name: customers are wrapped in data with nineteen-digit ids
    source: https://docs.saltedge.com/account_information/v5/#customers-list
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers:
        App-Id: cauldron-f1xture-app-id
        Secret: cauldron-f1xture-secret
    expect:
      status: 200
      body:
        # Sent as strings, because nineteen digits do not survive a double.
        'data[0].id': "1077308375771481711"
        'data[0].identifier': ada-lovelace-01

  - name: a blocked customer is in the listing with a date
    source: https://docs.saltedge.com/account_information/v5/#customers-list
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers:
        App-Id: cauldron-f1xture-app-id
        Secret: cauldron-f1xture-secret
    expect:
      status: 200
      body:
        # A blocked customer cannot refresh a connection, and nothing marks
        # that except a timestamp that is present rather than null -- so the
        # boolean a client wants has to be derived from a date.
        'data[1].blocked_at': "2026-09-01T11:00:00Z"
        'data[1].identifier': grace-hopper-02
        # Created and updated at the same instant on the blocked record,
        # because blocking is the last thing that happened to it.
        'data[1].updated_at': "2026-09-01T11:00:00Z"
        'data[0].created_at': "2026-05-12T08:41:03Z"
        # The customer secret is in the listing. It is Salt Edge's own
        # per-customer token rather than a bank credential, and it is still a
        # secret arriving in a collection response nobody asked to be
        # sensitive.
        'data[0].secret': cauldron-customer-secret-0001
      absent:
        - 'data[0].blocked_at'

  - name: the paging block is nulls rather than absences
    source: https://docs.saltedge.com/account_information/v5/#customers-list
    fixture: app
    request:
      method: GET
      path: /api/v5/customers
      headers:
        App-Id: cauldron-f1xture-app-id
        Secret: cauldron-f1xture-secret
      query:
        per_page: "100"
        from_id: "1077308375771481711"
    expect:
      status: 200
      body:
        # next_id and next_page are both present and both null on the last
        # page, so a client testing for the key finds it and has to test the
        # value instead.
        'meta.next_id': null
        'meta.next_page': null

  - name: an app with no customers answers an empty array
    source: https://docs.saltedge.com/account_information/v5/#customers-list
    fixture: empty
    request:
      method: GET
      path: /api/v5/customers
      headers:
        App-Id: cauldron-f1xture-app-id
        Secret: cauldron-f1xture-secret
    expect:
      status: 200
      body:
        data: []
