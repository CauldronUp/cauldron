# Wikimedia Core REST Recipe for Cauldron
#
# The error message is inside a map keyed by language.
#
#   {"errorKey": "rest-nonexistent-title",
#    "messageTranslations": {"en": "The specified page (...) does not exist"},
#    "httpCode": 404, "httpReason": "Not Found"}
#
# There is no "message". A client reading err.message finds undefined on every
# failure this API has, and the sentence it wanted is one level down under a
# language code it has to choose. Choosing wrongly is silent: ask for "fr" on a
# response that carries only "en" and you get undefined again, from a field that
# exists.
#
# **And three failures share no key set at all.**
#
#   page not found : errorKey, messageTranslations, httpCode, httpReason
#   path not found : httpCode, httpReason
#   empty search   : error, name, value, failureCode, failureData, errorKey,
#                    messageTranslations, httpCode, httpReason
#
# The second has no message in any language -- not an empty map, no map. The
# third has nine keys, two of which name the same failure and disagree: "error"
# says parameter-validation-failed and "errorKey" says missingparam. A client
# switching on one gets a different answer from a client switching on the other,
# in one response.
#
# Written against the live API rather than a document: every case below was
# checked against api.wikimedia.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The record links to a different host running the same API. Served from
#      api.wikimedia.org/core/v1, the page's own html_url is
#      en.wikipedia.org/w/rest.php/v1/page/Earth/html -- a second deployment,
#      on the wiki's own domain, under a different path. A client following the
#      link it was given leaves the host it asked.
#   2. Two identifiers, four orders of magnitude apart. id is 9228 for the page
#      and latest.id is 1372042770 for its newest revision, so the smaller
#      number is the thing and the larger is the version of it, with nothing in
#      either name saying which is which.
#   3. The licence URL ends in a language. license.url is
#      .../by-sa/4.0/deed.en, so the link a client renders as "the licence" is
#      one translation of it, and there is no field saying which.
#
# And a language code that names no wiki does not fail: it redirects, in HTML,
# to the Incubator where such wikis are drafted -- and the redirect body ends
# with an HTML comment naming the PHP file that produced it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One page is served, and its latest revision moves whenever anyone edits
#     Earth. The revision id and timestamp are the ones that stood at the
#     moment in the verified field.
#   - The Incubator redirect is described above and not served. It is a 302 to
#     another host, which is a thing an emulator can answer with and not a
#     thing this Recipe's routes are shaped to hold.

recipe: wikimedia
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: wikimedia
  docs: https://api.wikimedia.org/wiki/Core_REST_API
  supersedes:
    # The older interface, which is a separate Recipe here.
    - version: rest_v1
      host: en.wikipedia.org/api/rest_v1
      note: the per-wiki REST interface this one was built to replace, and which still runs

auth:
  # Public, no key. Wikimedia asks for a User-Agent naming the caller, which is
  # a courtesy a Recipe cannot enforce.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    # There is no message field at all: the sentence lives under a language.
    message_field: "-"
    code_field: errorKey
    code_type: string
    type_field: "-"
    status_field: httpCode

resources:
  page:
    id:
      style: numeric
      field: id
      type: number
    fields:
      key:
        type: string
      title:
        type: string
      # A revision, four orders of magnitude larger than the page it belongs to.
      latest:
        type: map
      content_model:
        type: string
      # A licence whose URL ends in a language.
      license:
        type: map
      # A link to a different host running the same API.
      html_url:
        type: string

routes:
  - method: GET
    path: /core/v1/wikipedia/en/page/Earth/bare
    resource: page
    operation: get
    id_from: auth

  # A page that does not exist: a message, under a language.
  - method: GET
    path: /core/v1/wikipedia/en/page/Zzzznotarealpagexyz/bare
    error: nonexistent_title

  # A path that does not exist: no message in any language.
  - method: GET
    path: /core/v1/nosuchthing
    error: bare_not_found

  # A search with nothing to search for: nine keys, two of them disagreeing.
  - method: GET
    path: /core/v1/wikipedia/en/search/page
    error: missing_parameter

errors:
  nonexistent_title:
    status: 404
    code: rest-nonexistent-title
    fields:
      # The sentence, one level down, under a code the client must choose.
      messageTranslations:
        en: The specified page (Zzzznotarealpagexyz) does not exist
      httpReason: Not Found

  bare_not_found:
    status: 404
    # No errorKey either: this failure has two keys and neither is a sentence.
    code_field: "-"
    fields:
      httpReason: Not Found

  missing_parameter:
    status: 400
    # One of the two fields that name this failure...
    code: missingparam
    fields:
      # ...and the other, which does not agree with it.
      error: parameter-validation-failed
      name: q
      value: ""
      failureCode: missingparam
      failureData: null
      messageTranslations:
        en: 'The "q" parameter must be set.'
      httpReason: Bad Request

fixtures:
  empty: {}

  earth:
    page:
      # The page...
      - id: "9228"
        key: Earth
        title: Earth
        latest:
          # ...and its newest revision, four orders of magnitude larger.
          id: 1372042770
          timestamp: "2026-08-30T00:46:47Z"
        content_model: wikitext
        license:
          # A licence URL that ends in a language.
          url: "https://creativecommons.org/licenses/by-sa/4.0/deed.en"
          title: Creative Commons Attribution-Share Alike 4.0
        # A different host, running the same API under a different path.
        html_url: "https://en.wikipedia.org/w/rest.php/v1/page/Earth/html"

conformance:
  - name: the error message is inside a map keyed by language
    source: https://api.wikimedia.org/core/v1/wikipedia/en/page/Zzzznotarealpagexyz/bare
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/wikipedia/en/page/Zzzznotarealpagexyz/bare
    expect:
      status: 404
      body:
        # One level down, under a code the client must choose.
        messageTranslations.en: The specified page (Zzzznotarealpagexyz) does not exist
        errorKey: rest-nonexistent-title
        # The status again, in the body, beside its own reason phrase.
        httpCode: 404
        httpReason: Not Found
      absent:
        # There is no message. Reading err.message finds undefined on every
        # failure this API has.
        - message

  - name: and a path that does not exist has no message in any language
    source: https://api.wikimedia.org/core/v1/nosuchthing
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/nosuchthing
    expect:
      status: 404
      body:
        # Two keys, and neither is a sentence.
        httpCode: 404
        httpReason: Not Found
      absent:
        # Not an empty map: no map.
        - messageTranslations
        - errorKey
        - message

  - name: and an empty search has nine keys, two of which disagree
    source: "https://api.wikimedia.org/core/v1/wikipedia/en/search/page?q=&limit=1"
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/wikipedia/en/search/page
    expect:
      status: 400
      body:
        # One field naming the failure...
        error: parameter-validation-failed
        # ...and another naming it differently, in the same response.
        errorKey: missingparam
        # A third saying the same thing again.
        failureCode: missingparam
        # The parameter, its value, and a null where the detail would go.
        name: q
        value: ""
        failureData: null
        messageTranslations.en: 'The "q" parameter must be set.'
        httpCode: 400
        httpReason: Bad Request

  - name: the record links to a different host running the same API
    source: https://api.wikimedia.org/core/v1/wikipedia/en/page/Earth/bare
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/wikipedia/en/page/Earth/bare
    expect:
      status: 200
      body:
        # Asked of api.wikimedia.org, answered with a link to
        # en.wikipedia.org, under a different path, for the same API.
        html_url: "https://en.wikipedia.org/w/rest.php/v1/page/Earth/html"
        key: Earth
        title: Earth

  - name: two identifiers, four orders of magnitude apart
    source: https://api.wikimedia.org/core/v1/wikipedia/en/page/Earth/bare
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/wikipedia/en/page/Earth/bare
    expect:
      status: 200
      body:
        # The page...
        id: 9228
        # ...and the version of it, with nothing in either name saying which
        # is which.
        latest.id: 1372042770
        latest.timestamp: "2026-08-30T00:46:47Z"

  - name: the licence URL ends in a language
    source: https://api.wikimedia.org/core/v1/wikipedia/en/page/Earth/bare
    verified: "2026-08-31"
    fixture: earth
    request:
      method: GET
      path: /core/v1/wikipedia/en/page/Earth/bare
    expect:
      status: 200
      body:
        # The link a client renders as "the licence" is one translation of it,
        # and no field says which.
        license.url: "https://creativecommons.org/licenses/by-sa/4.0/deed.en"
        license.title: Creative Commons Attribution-Share Alike 4.0
        # And the format the page is stored in, which is not HTML.
        content_model: wikitext
