  - name: a wrong access key is a 412
    source: https://demo-frontends.shopware.store/store-api/product
    verified: "2026-09-05"
    fixture: catalogue
    request:
      method: GET
      path: /store-api/product
      headers:
        sw-access-key: SWSCNOTAREALKEY000000000
    expect:
      # Precondition Failed. A client with branches for 401 and 403 takes
      # neither, and a retry policy keyed on 401 never refreshes anything.
      status: 412
      body:
        errors[0].code: FRAMEWORK__ROUTING_SALES_CHANNEL_NOT_FOUND
        errors[0].status: "412"
      matches:
        errors[0].detail: No matching sales channel

  - name: no sw-access-key at all is a different failure than a wrong one
    source: https://demo-frontends.shopware.store/store-api/product
    verified: "2026-09-05"
    request:
      method: GET
      path: /store-api/product
    expect:
      # Not the 412 a present-but-wrong key gets. This one comes from
      # Symfony's own missing-header exception, never from Shopware's sales
      # channel lookup, and this Recipe used to say the two could not be
      # told apart.
      status: 401
      body:
        errors[0].code: "0"
        errors[0].status: "401"
        errors[0].detail: 'Header "sw-access-key" is required.'

  - name: a key of the wrong shape is refused before it is ever compared to the fixture
    source: https://demo-frontends.shopware.store/store-api/product
    verified: "2026-09-05"
    request:
      method: GET
      path: /store-api/product
      headers:
        # Not SWSC-prefixed. A key like this never reaches the comparison
        # against auth.keys at all -- auth.shape rules it out first.
        sw-access-key: SWCAULDRONINVALIDKEY000
    expect:
      status: 403
      body:
        errors[0].code: FRAMEWORK__API_INVALID_ACCESS_KEY
        errors[0].status: "403"
        errors[0].detail: Access key is invalid and could not be identified.

  - name: a path nothing declares is a 404, credential or not
    source: https://demo-frontends.shopware.store/store-api/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No sw-access-key sent. If the credential were judged first this would
      # be the 401 above; instead routing answers first and a path that does
      # not exist gets exactly the same 404 with or without one.
      path: /store-api/not-a-real-endpoint
    expect:
      status: 404
      body:
        errors[0].code: "0"
        errors[0].status: "404"
      matches:
        errors[0].detail: 'No route found for .*not-a-real-endpoint'

  - name: a method a real path does not support is a 405
    source: https://demo-frontends.shopware.store/store-api/product
    verified: "2026-09-05"
    # Real Shopware's Allow header on this exact request reads "GET, POST" --
    # the entity route also takes a POST carrying criteria in its body, which
    # the header of this file already says is not modelled. This Recipe only
    # declares GET for this path, so the Allow header this emulator computes
    # is narrower than the provider's; asserting the full real value here
    # would be asserting a fidelity gap as though it were closed.
    request:
      method: DELETE
      path: /store-api/product
    expect:
      status: 405
      body:
        errors[0].code: "0"
        errors[0].status: "405"
      matches:
        errors[0].detail: 'No route found for .*Method Not Allowed'

