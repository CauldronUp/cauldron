# Open Brewery DB Recipe for Cauldron
#
# brewery_type says "closed".
#
#   {"name": "Dog & Pony Alehouse and Grill", "brewery_type": "closed", ...}
#
# The field naming what kind of brewery this is also answers whether it is one.
# Its fourteen values include micro, brewpub and regional, which are kinds;
# closed, which is a status; planning, which is a stage; and location, which is
# neither. 642 breweries are typed "closed" and 639 "planning" -- 1,281 of
# 11,848 -- so a client filtering by_type=micro silently excludes every closed
# micro, and a client showing all types puts businesses that do not exist next
# to businesses that do, with nothing but the type to tell them apart.
#
# **And two pairs of fields are the same field twice.** state and state_province
# carry the same string on every record, and so do street and address_1. Not
# similar: identical, "Oklahoma" and "Oklahoma", "1716 Topeka St" and "1716
# Topeka St". Two of them are the current names and two are kept from an older
# shape, and nothing in the response says which pair is which -- so half of any
# address written against this API is written against a field that is there for
# compatibility.
#
# Written against the live API rather than a document: every case below was
# checked against api.openbrewerydb.org on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. Asking for one brewery too many is a redirect to the homepage.
#      ?per_page=201 does not answer 400 and does not clamp to 200 -- it answers
#      302 with Location: https://api.openbrewerydb.org/. A client following
#      redirects gets the landing page and a 200, so the failure arrives looking
#      like a success with the wrong body.
#   2. A JSON API's not-found is an HTML page. A brewery that does not exist
#      answers 404 with content-type text/html and a rendered error document, so
#      a client that parses every response as JSON throws on the parse rather
#      than reading a status.
#   3. The autocomplete endpoint is a 301 to search. The path the documentation
#      names is not the path that answers; it redirects to a different endpoint
#      with a different response shape.
#   4. by_state has 214 keys and most of them are not states. ACT is an
#      Australian territory, Argyll a Scottish county, Auckland a New Zealand
#      region and Aveiro a Portuguese district, all interleaved alphabetically
#      with Alabama and Arizona in one flat map under a field called by_state.
#   5. phone is two formats in one column: "+49 9261 628000" with spaces and a
#      country code, and "4058160490" as ten bare digits. Nothing says which a
#      given row holds, and the country field is the only hint.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Three breweries are served, not 11,848: one open American, one German, one
#     closed. They are chosen to carry both phone formats, both postal-code
#     shapes and the type that is not a type.
#   - meta's by_state is trimmed from 214 keys to eight and by_country from 23
#     to five. The finding is what the keys are, not how many.
#   - address_2 and address_3 are null on every record served, which is what
#     they are on every record checked. latitude and longitude are null together
#     on about a fifth of the real collection and are not null here.
#   - Only the list, the single brewery, search, meta and the two redirects are
#     modelled. by_dist and the random endpoint answer other documents.

recipe: openbrewerydb
capability: infrastructure
version: 0.1.0

upstream:
  api: openbrewerydb
  docs: https://www.openbrewerydb.org/documentation

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    # A bare array. No envelope, no count, no links.
    style: bare
  resource:
    style: bare
  error:
    # Every failure here is a rendered page rather than a document.
    style: text

resources:
  brewery:
    id:
      style: uuid
    fields:
      name:
        type: string
      # micro and brewpub are kinds; closed is a status and planning is a stage.
      brewery_type:
        type: string
      address_1:
        type: string
      # Null on every record checked.
      address_2:
        type: string
      address_3:
        type: string
      city:
        type: string
      # The current name for the subdivision.
      state_province:
        type: string
      postal_code:
        type: string
      country:
        type: string
      longitude:
        type: number
      latitude:
        type: number
      # Spaced and international on one row, ten bare digits on the next.
      phone:
        type: string
      website_url:
        type: string
      # And the same string again, under the older name.
      state:
        type: string
      street:
        type: string

  summary:
    id:
      style: opaque
      # /meta answers no identifier.
      field: "-"
    fields:
      total:
        type: integer
      # 214 keys, most of which are not states.
      by_state:
        type: map
      by_country:
        type: map
      # Fourteen values, three of which are not types.
      by_type:
        type: map
      # Paging fields, on a document that is not a page of anything.
      page:
        type: integer
      per_page:
        type: integer

routes:
  - method: GET
    path: /v1/breweries
    resource: brewery
    operation: list
    pagination:
      # per_page and page, both struck live on 2026-09-05. per_page was
      # already pinned here in the sharpest finding this Recipe has --
      # ?per_page=201 does not answer 400 and does not clamp, it answers 302
      # to the landing page, so a client following redirects gets a 200 and
      # the wrong body. A parameter a provider redirects you for is one it
      # reads.
      #
      # page was checked the same way: ?per_page=2&page=1 and page=2 answer
      # two different pairs of breweries, counting from one.
      style: page
      limit: 50
      max_limit: 200
      limit_param: per_page
      cursor_param: page
      first_page: 1
    filters:
      # The parameter is lowercase and underscored; the field is
      # title-cased with spaces. Asking for united_states returns rows saying
      # "United States", and nothing in the response carries the form that was
      # sent -- so a client cannot round-trip its own filter.
      - param: by_country
        field: country
        values:
          united_states:
            - United States
          germany:
            - Germany
      - param: by_type
        field: brewery_type

  # Over the limit: not a 400, not a clamp, a redirect to the homepage.
  - method: GET
    path: /v1/breweries
    matches_query:
      per_page: "201"
    error: over_page_limit

  # Declared before the id route so /meta is not read as an identifier.
  - method: GET
    path: /v1/breweries/meta
    resource: summary
    operation: get
    id_from: auth

  - method: GET
    path: /v1/breweries/search
    resource: brewery
    operation: list

    pagination:
      # per_page and page, both struck live on 2026-09-05. per_page was
      # already pinned here in the sharpest finding this Recipe has --
      # ?per_page=201 does not answer 400 and does not clamp, it answers 302
      # to the landing page, so a client following redirects gets a 200 and
      # the wrong body. A parameter a provider redirects you for is one it
      # reads.
      #
      # page was checked the same way: ?per_page=2&page=1 and page=2 answer
      # two different pairs of breweries, counting from one.
      style: page
      limit: 50
      max_limit: 200
      limit_param: per_page
      cursor_param: page
      first_page: 1
  # The path the documentation names, answering a redirect to a different one.
  - method: GET
    path: /v1/breweries/autocomplete
    error: moved_to_search

  - method: GET
    path: /v1/breweries/{id}
    resource: brewery
    operation: get
    not_found: not_found_page

errors:
  # A JSON API answering a rendered page, so a client that parses everything as
  # JSON throws on the parse rather than reading a status.
  not_found_page:
    status: 404
    headers:
      Content-Type: text/html; charset=utf-8
    message: |-
      <!DOCTYPE html>
      <html lang="en">
          <head>
              <meta charset="utf-8">
              <title>Not Found</title>
          </head>
      </html>

  # 302 to the API root. A client following redirects gets the landing page and
  # a 200, so the failure arrives looking like a success with the wrong body.
  over_page_limit:
    status: 302
    headers:
      Location: https://api.openbrewerydb.org/
      Content-Type: text/html; charset=utf-8
    message: |-
      <!DOCTYPE html>
      <html>
          <head>
              <meta http-equiv="refresh" content="0;url='https://api.openbrewerydb.org/'">
              <title>Redirecting to https://api.openbrewerydb.org/</title>
          </head>
      </html>

  # The documented path, permanently moved to a different endpoint with a
  # different response shape.
  moved_to_search:
    status: 301
    headers:
      Location: https://api.openbrewerydb.org/v1/breweries/search
      Content-Type: text/html; charset=utf-8
    message: |-
      <!DOCTYPE html>
      <html>
          <head>
              <meta http-equiv="refresh" content="0;url='https://api.openbrewerydb.org/v1/breweries/search'">
              <title>Redirecting to https://api.openbrewerydb.org/v1/breweries/search</title>
          </head>
      </html>

fixtures:
  empty: {}

  breweries:
    brewery:
      # American, open, ten bare digits, and a ZIP+4.
      - id: 5128df48-79fc-4f0f-8b52-d06be54d0cec
        name: (405) Brewing Co
        brewery_type: micro
        address_1: 1716 Topeka St
        address_2: null
        address_3: null
        city: Norman
        state_province: Oklahoma
        postal_code: 73069-8224
        country: United States
        longitude: -97.46818222
        latitude: 35.25738891
        phone: "4058160490"
        website_url: http://www.405brewing.com
        # The same two strings again, under the older names.
        state: Oklahoma
        street: 1716 Topeka St

      # German, and the phone carries a country code and spaces.
      - id: ae7b3174-8be8-4d53-a3a5-9b8240970eea
        name: "'s"
        brewery_type: brewpub
        address_1: "Friesener Stra\xDFe 1"
        address_2: null
        address_3: null
        city: Kronach
        state_province: Bayern
        postal_code: "96317"
        country: Germany
        longitude: 11.327765
        latitude: 50.241246
        phone: +49 9261 628000
        website_url: http://www.antla.de
        state: Bayern
        street: "Friesener Stra\xDFe 1"

      # And one whose type is not a type.
      - id: 78c50e54-34e3-415d-9574-ac0cc0505113
        name: Dog & Pony Alehouse and Grill
        # Not a kind of brewery. A statement that there is not one.
        brewery_type: closed
        address_1: 351 Park Ave N
        address_2: null
        address_3: null
        city: Renton
        state_province: Washington
        postal_code: 98057-5716
        country: United States
        longitude: -122.2023129
        latitude: 47.48758261
        phone: "4252548080"
        website_url: http://www.thedogandpony.com
        state: Washington
        street: 351 Park Ave N

    summary:
      - id: meta
        total: 11848
        by_state:
          # An Australian territory, a Scottish county, a New Zealand region and
          # a Portuguese district, interleaved with two American states -- in
          # one flat map called by_state. Eight of the real 214.
          ACT: 7
          Alabama: 52
          Argyll: 4
          Arizona: 125
          Auckland: 44
          Aveiro: 9
          Bayern: 597
          Oklahoma: 44
        by_country:
          # Five of the real 23.
          Australia: 514
          Belgium: 478
          England: 62
          Germany: 597
          Scotland: 10
        by_type:
          # Fourteen values. micro, brewpub, regional and large are kinds;
          # closed is a status, planning is a stage, and location is neither.
          bar: 41
          beergarden: 3
          brewpub: 3929
          cidery: 7
          closed: 642
          contract: 210
          large: 137
          location: 1
          micro: 5864
          nano: 22
          planning: 639
          proprietor: 67
          regional: 239
          taproom: 47
        # On a document that is not a page of anything.
        page: 1
        per_page: 50

conformance:
  - name: brewery_type says closed
    source: https://api.openbrewerydb.org/v1/breweries/78c50e54-34e3-415d-9574-ac0cc0505113
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/78c50e54-34e3-415d-9574-ac0cc0505113
    expect:
      status: 200
      body:
        name: Dog & Pony Alehouse and Grill
        # The field naming what kind of brewery this is, answering whether it
        # is one.
        brewery_type: closed

  - name: two pairs of fields are the same field twice
    source: https://api.openbrewerydb.org/v1/breweries/5128df48-79fc-4f0f-8b52-d06be54d0cec
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/5128df48-79fc-4f0f-8b52-d06be54d0cec
    expect:
      status: 200
      body:
        # Not similar. Identical.
        state_province: Oklahoma
        state: Oklahoma
        address_1: 1716 Topeka St
        street: 1716 Topeka St

  - name: phone is two formats in one column
    source: https://api.openbrewerydb.org/v1/breweries?per_page=2
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries
    expect:
      status: 200
      body:
        # Ten bare digits.
        "[0].phone": "4058160490"
        "[0].postal_code": 73069-8224
        # Spaces and a country code, and a five-digit postcode beside a ZIP+4.
        "[1].phone": +49 9261 628000
        "[1].postal_code": "96317"

  - name: the type filter excludes the closed ones by excluding a status
    source: https://api.openbrewerydb.org/v1/breweries?by_type=micro
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries?by_type=micro
    expect:
      status: 200
      body:
        # One row, and the closed brewpub is gone -- not because it is closed
        # but because "closed" is a different value of the field being filtered.
        "[0].brewery_type": micro
        "[0].name": (405) Brewing Co
      absent:
        - "[1]"

  - name: the country filter is spelled one way and answered another
    source: https://api.openbrewerydb.org/v1/breweries?by_country=united_states
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries?by_country=united_states
    expect:
      status: 200
      body:
        # Asked for united_states, answered "United States", with the form that
        # was sent appearing nowhere in the response.
        "[0].country": United States
        "[1].country": United States
      absent:
        - "[2]"

  - name: a brewery that does not exist answers HTML
    source: https://api.openbrewerydb.org/v1/breweries/00000000-0000-0000-0000-000000000000
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/00000000-0000-0000-0000-000000000000
    expect:
      # A JSON API's not-found, rendered.
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: '<title>Not Found</title>'

  - name: one page too many is a redirect to the homepage
    source: https://api.openbrewerydb.org/v1/breweries?per_page=201
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries?per_page=201
    expect:
      # Not 400, and not clamped to 200. A client following redirects gets the
      # landing page and a 200.
      status: 302
      # Anchored. A headers expectation is a substring check -- right for
      # "application/json" inside "application/json; charset=utf-8", wrong for
      # a Location, because the homepage is a prefix of every other path on
      # this host.
      header_matches:
        Location: ^https://api\.openbrewerydb\.org/$

  - name: the documented autocomplete path is a redirect to search
    source: https://api.openbrewerydb.org/v1/breweries/autocomplete?query=dog
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/autocomplete?query=dog
    expect:
      status: 301
      header_matches:
        Location: ^https://api\.openbrewerydb\.org/v1/breweries/search$

  - name: by_state is 214 keys and most of them are not states
    source: https://api.openbrewerydb.org/v1/breweries/meta
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/meta
    expect:
      status: 200
      body:
        total: 11848
        # An Australian territory and a Scottish county, in a map called
        # by_state, sorted in among the American ones.
        "by_state.ACT": 7
        "by_state.Argyll": 4
        "by_state.Auckland": 44
        "by_state.Alabama": 52

  - name: the summary carries paging fields and is not a page
    source: https://api.openbrewerydb.org/v1/breweries/meta
    verified: "2026-08-29"
    fixture: breweries
    request:
      method: GET
      path: /v1/breweries/meta
    expect:
      status: 200
      body:
        # A summary of 11,848 breweries, describing itself as page 1 of 50.
        page: 1
        per_page: 50
        # And 1,281 of the 11,848 are typed by whether they exist.
        "by_type.closed": 642
        "by_type.planning": 639
        "by_type.micro": 5864

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://api.openbrewerydb.org/v1/breweries?per_page=2"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries"
      query:
        "per_page": "1"
        "page": "2"
    expect:
      status: 200
      body:
        "[0].id": "ae7b3174-8be8-4d53-a3a5-9b8240970eea"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads on v1 breweries"
    source: "https://api.openbrewerydb.org/v1/breweries?per_page=2"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries"
      query:
        "per_page": "1"
        "page": "2"
    expect:
      status: 200
      body:
        "[0].id": "ae7b3174-8be8-4d53-a3a5-9b8240970eea"
      absent:
        - "[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for it with the credential the rest of the file uses,
  # and asserts the 3 record(s) that came back rather than the ones the
  # fixture lists: the store does not serve them in the order a fixture
  # writes them.
  - name: "the brewery listing answers, which nothing here had shown"
    source: "https://api.openbrewerydb.org/v1/breweries/78c50e54-34e3-415d-9574-ac0cc0505113"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries/search"
    expect:
      status: 200
      body:
        "[0].name": "(405) Brewing Co"
      absent:
        - "[3]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 3 and receiving one can only
  # happen if per_page was read.
  - name: "per_page is read, and a page of one is not the whole collection"
    source: "https://api.openbrewerydb.org/v1/breweries/78c50e54-34e3-415d-9574-ac0cc0505113"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries/search"
      query:
        "per_page": "1"
    expect:
      status: 200
      body:
        "[0].name": "(405) Brewing Co"
      absent:
        - "[1]"

  # And the position. page=2 answers a different record, which the size
  # alone cannot produce.
  - name: "page moves the page on, and what comes back is not page one"
    source: "https://api.openbrewerydb.org/v1/breweries/78c50e54-34e3-415d-9574-ac0cc0505113"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries/search"
      query:
        "per_page": "1"
        "page": "2"
    expect:
      status: 200
      body:
        "[0].name": "'s"
      absent:
        - "[1]"

  # The names. This Recipe declares 6 field(s) on a brewery that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a brewery carries the field names this Recipe declares"
    source: "https://api.openbrewerydb.org/v1/breweries?per_page=2"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries"
    expect:
      status: 200
      body:
        "[0].city": "Norman"
        "[0].latitude": 35.25738891
        "[0].longitude": -97.46818222
        "[0].website_url": "http://www.405brewing.com"

  # The names. This Recipe declares 1 field(s) on a summary that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a summary carries the field names this Recipe declares"
    source: "https://api.openbrewerydb.org/v1/breweries/meta"
    fixture: breweries
    request:
      method: GET
      path: "/v1/breweries/meta"
    expect:
      status: 200
      body:
        "by_country.Australia": 514




