# Freshdesk Recipe for Cauldron
#
# Freshdesk has no sandbox on the plans most people are on. A trial account
# expires, and a real help desk contains real customers, so a test that creates
# a ticket can fire a real automation and email somebody. Teams either share a
# trial that dies mid-project or point tests at production with a naming
# convention.
#
# Two things worth modelling exactly:
#
#   1. Status and priority are integer enums, not words. A ticket's status is
#      2, not "open", and 4 is resolved while 5 is closed. Code that compares
#      against a string never matches, and code that treats "not 5" as open
#      counts resolved tickets as outstanding.
#   2. Collections are bare arrays with the paging in a Link header. An
#      emulator that wrapped them in an object with a cursor would teach a
#      client to read something the real API does not send.
#
# Known fidelity gap, stated rather than hidden: a Freshdesk validation
# failure carries a description alongside a per-field errors array. Cauldron
# sends the description; the per-field array is not modelled.
#
# Probed live, unauthenticated, on 2026-09-05. Freshdesk is multi-tenant --
# every account has its own subdomain, and there is no shared host to probe
# generically -- so this was struck against support.freshdesk.com, Freshdesk's
# own help desk, running on its own product. The refusal shape a tenant sends
# an uncredentialed caller does not depend on whose data is behind it, which
# is what makes one real, public tenant a fair stand-in for "the API" here:
#
#   1. GET /api/v2/tickets with no credential at all, and again with an
#      invented Basic username, both answer the identical 401
#      {"code":"invalid_credentials","message":"You have to be logged in to
#      perform this action."} -- exactly what this file already declared,
#      unmodified by this probe.
#   2. GET /api/v2/not-a-real-endpoint, no credential at all, answers 404
#      with zero bytes -- not modelled before this probe, and not the
#      resource_missing shape ("Resource not found: {detail}") that name
#      would otherwise borrow.
#   3. PATCH /api/v2/tickets -- a real path, a method this Recipe does not
#      declare for it -- answers a genuine 405, no credential needed:
#      {"message":"PATCH method is not allowed. It should be one of these
#      method(s): GET, POST"}, with an Allow: GET, POST header alongside it.
#
# Points 2 and 3 were both reached without a credential mattering, which
# auth.after_routing below declares.
#
# Keys below are fixtures, not secrets.

recipe: freshdesk
capability: support
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.freshdesk.com/api

auth:
  # Freshdesk sends the API key as the Basic username, with any password.
  scheme: basic
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true
  keys:
    - cauldron-freshdesk-key

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: description
    code_field: code

resources:
  ticket:
    collection: tickets
    id:
      style: numeric
      type: number
    fields:
      subject:
        type: string
        required: true
      description_text:
        type: string
      # Integer enums. 2 open, 3 pending, 4 resolved, 5 closed. Code that
      # compares against "open" never matches, and code that treats anything
      # other than 5 as outstanding counts resolved tickets twice.
      status:
        type: integer
        default: 2
      # 1 low, 2 medium, 3 high, 4 urgent.
      priority:
        type: integer
        default: 1
      # 1 email, 2 portal, 3 phone, 7 chat.
      source:
        type: integer
        default: 2
      requester_id:
        type: integer
      responder_id:
        type: integer
      group_id:
        type: integer
      # A ticket can breach its SLA while still being open, and the flag is
      # what a report reads rather than the timestamps.
      fr_escalated:
        type: boolean
        default: false
      is_escalated:
        type: boolean
        default: false
      # Set only when the ticket is actually resolved.
      resolved_at:
        type: datetime
        stamped: false
      due_by:
        type: datetime
      created_at:
        type: datetime
      updated_at:
        type: datetime

  contact:
    collection: contacts
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      email:
        type: string
      phone:
        type: string
      # An unverified contact cannot use the portal, and is still returned by
      # a plain listing.
      active:
        type: boolean
        default: false
      company_id:
        type: integer
      created_at:
        type: datetime

  company:
    collection: companies
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      domains:
        type: string
      # The plan a company is on drives its SLA, and a report that ignores it
      # compares tickets against the wrong target.
      note:
        type: string
      created_at:
        type: datetime

routes:
  - method: GET
    path: /api/v2/tickets
    resource: ticket
    operation: list
    pagination:
      # Freshdesk pages by number and calls the size per_page. A client sending
      # limit is ignored and gets the default thirty.
      style: page
      limit_param: per_page
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 30

  - method: POST
    path: /api/v2/tickets
    resource: ticket
    operation: create
    status: 201
    # ticket_create, which is what Freshdesk calls it. The runtime's own
    # convention is resource.action, so without this line a created ticket
    # fired ticket.created -- an event this Recipe does not declare and
    # Freshdesk does not send -- which means it fired nothing at all, and a
    # handler waiting for one waited for ever with nothing to show for it.
    emits: ticket_create

  - method: GET
    path: /api/v2/tickets/{id}
    resource: ticket
    operation: get

  - method: PUT
    path: /api/v2/tickets/{id}
    resource: ticket
    operation: update
    emits: ticket_update
    # Freshdesk sends the generic update on every edit and these two only
    # when the field named actually moves. A handler subscribed to
    # ticket_status_change runs on a subject edit here and never in
    # production, which is the failure worth not shipping.
    emits_when:
      - event: ticket_status_change
        field: status
      - event: ticket_priority_change
        field: priority

  - method: DELETE
    path: /api/v2/tickets/{id}
    resource: ticket
    operation: delete

  - method: GET
    path: /api/v2/contacts
    resource: contact
    operation: list
    pagination:
      # Freshdesk pages by number and calls the size per_page. A client sending
      # limit is ignored and gets the default thirty.
      style: page
      limit_param: per_page
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 30

  - method: GET
    path: /api/v2/contacts/{id}
    resource: contact
    operation: get

  - method: GET
    path: /api/v2/companies
    resource: company
    operation: list
    pagination:
      # Freshdesk pages by number and calls the size per_page. A client sending
      # limit is ignored and gets the default thirty.
      style: page
      limit_param: per_page
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 30

webhooks:
  events:
    - ticket_create
    - ticket_update
    - ticket_status_change
    - ticket_priority_change
    - note_create
  # Freshdesk wraps everything in freshdesk_webhook and prefixes every key
  # with the resource it came from, so the ticket's own field names appear
  # nowhere in the payload. A handler reads freshdesk_webhook.ticket_status
  # and there is no ticket object to reach it through.
  #
  # Open question, deliberately not guessed at: Freshdesk's placeholders
  # render status and priority as their labels rather than their codes, so
  # the real payload may carry "Open" where this carries 2. The codes are
  # what this Recipe knows to be true of the ticket; the label mapping is not
  # modelled anywhere here, and inventing one in the envelope would put a
  # string in the payload that no part of this Recipe can account for.
  payload:
    freshdesk_webhook:
      ticket_id: "{record.id}"
      ticket_subject: "{record.subject}"
      ticket_status: "{record.status}"
      ticket_priority: "{record.priority}"
      ticket_description: "{record.description_text}"
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: rate_limit_exceeded
    message: You have exceeded the limit of requests per minute
    headers:
      Retry-After: "20"
      X-RateLimit-Remaining: "0"

  # Struck live with no credential at all, and again with an invented Basic
  # username: the identical body either way. The sentence travels under
  # "message" here, not "description" -- unlike the rest of this Recipe's
  # errors, struck from Freshdesk's own documented worked example -- which
  # message_field below corrects for this one entry alone.
  authentication_error:
    status: 401
    code: invalid_credentials
    message: You have to be logged in to perform this action.
    message_field: message

  # Struck live with no credential at all: the router answers before
  # authentication is ever consulted, which auth.after_routing declares.
  unknown_route:
    status: 404
    empty: true

  # Struck live against a real path with a method this Recipe does not
  # declare for it: a genuine 405, no credential needed, with a computed
  # Allow header that matched what was actually sent. No code field at all,
  # and the sentence again travels under "message" rather than
  # "description".
  method_not_allowed:
    status: 405
    code_field: "-"
    message_field: message
    message: "PATCH method is not allowed. It should be one of these method(s): GET, POST"

  resource_missing:
    status: 404
    code: not_found
    message: "Resource not found: {detail}"

  parameter_missing:
    status: 400
    code: missing_field
    message: "Validation failed: {detail} is required"

  # Freshdesk refuses a duplicate contact email outright, which is what breaks
  # a retried import halfway through.
  duplicate_value:
    status: 409
    code: duplicate_value
    message: A contact with this email already exists.

  # An agent seat limit reached mid-month refuses writes while reads keep
  # working, which reads like an intermittent failure.
  access_denied:
    status: 403
    code: access_denied
    message: You are not authorized to perform this action.

fixtures:
  empty: {}

  small-helpdesk:
    company:
      - id: "1"
        name: Analytical Engines
        domains: example.com
    contact:
      - id: "10"
        name: Ada Lovelace
        email: ada@example.com
        company_id: 1
        active: true
      - id: "11"
        name: Grace Hopper
        email: grace@example.com
        company_id: 1
        # Never verified. Cannot use the portal, and still listed.
        active: false
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '12'
        name: Grace Hopper
        email: grace2@example.com
        company_id: 1
        active: false
    ticket:
      - id: "1"
        subject: Cannot reset my password
        description_text: The link says it has expired.
        # Open, urgent, and already breaching first response.
        status: 2
        priority: 4
        requester_id: 10
        fr_escalated: true
      - id: "2"
        subject: Invoice query
        # Resolved, not closed. A count of "anything but 5" includes this.
        status: 4
        priority: 2
        requester_id: 10
        resolved_at: "2026-01-12T14:00:00Z"
      - id: "3"
        subject: Feature request
        status: 5
        priority: 1
        requester_id: 11
        resolved_at: "2026-01-05T10:00:00Z"

# Conformance cases. The resource shapes are read from Freshdesk's API
# reference rather than observed against a live help desk -- no trial for
# one was ever created. The refusal cases at the end are struck live,
# unauthenticated, and carry a verified date; see the header for which real
# tenant they were struck against.
conformance:
  - name: status and priority are integers, not words
    source: https://developers.freshdesk.com/api/#tickets
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/tickets/1
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 200
      body:
        # Unquoted, like the status and priority beside it.
        id: 1
        # Code comparing against "open" never matches.
        status: 2
        priority: 4
        source: 2
        subject: Cannot reset my password

  - name: resolved is not closed
    source: https://developers.freshdesk.com/api/#ticket_attributes
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/tickets
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 200
      body:
        # 4 is resolved and 5 is closed. A count of "anything but 5" as
        # outstanding includes the resolved one.
        '[1]':
          status: 4
        '[2]':
          status: 5

  - name: a collection is a bare array
    source: https://developers.freshdesk.com/api/#list_all_tickets
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/tickets
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 200
      body:
        '[0]':
          subject: Cannot reset my password
      # Paging is in a Link header, not the body. Wrapping these would teach
      # a client to read something the real API does not send.
      absent:
        - data
        - results
        - meta

  - name: an open ticket has no resolved_at
    source: https://developers.freshdesk.com/api/#ticket_attributes
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/tickets/1
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 200
      body:
        status: 2
        # Breaching first response while still open. A report reads this flag
        # rather than comparing timestamps.
        fr_escalated: true
      absent:
        - resolved_at

  - name: an unverified contact is still listed
    source: https://developers.freshdesk.com/api/#contacts
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/contacts
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 200
      body:
        '[0]':
          active: true
        # Cannot use the portal, and still returned.
        '[1]':
          active: false
          name: Grace Hopper

  - name: the error prose is in description
    source: https://developers.freshdesk.com/api/#error
    fixture: small-helpdesk
    request:
      method: GET
      path: /api/v2/tickets/9999
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
    expect:
      status: 404
      body:
        code: not_found
      matches:
        description: 'Resource not found'
      absent:
        - message
        - error

  - name: a new ticket opens at status 2 with the lowest priority
    source: https://developers.freshdesk.com/api/#create_ticket
    fixture: empty
    request:
      method: POST
      path: /api/v2/tickets
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
      json:
        subject: Printer is smoking
    expect:
      status: 201
      body:
        subject: Printer is smoking
        status: 2
        priority: 1
        fr_escalated: false
      matches:
        id: '^[0-9]+$'

  - name: moving the status sends the status change and not the priority one
    source: https://support.freshdesk.com/support/solutions/articles/225427
    fixture: small-helpdesk
    request:
      method: PUT
      path: /api/v2/tickets/1
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
      json:
        status: 4
    expect:
      status: 200
      body:
        status: 4
      webhook:
        event: ticket_status_change
        body:
          # Prefixed and wrapped, which is neither the record's own name nor
          # the path the default envelope would have put it at. This case
          # asserted data.object.status and passed, which proved only that
          # the emulator was sending its own convention.
          freshdesk_webhook.ticket_status: 4
          freshdesk_webhook.ticket_id: 1
        absent:
          - data
          - data.object
          - freshdesk_webhook.status
        absent_events:
          # The same write left priority alone, and Freshdesk does not
          # announce a change to a field nobody touched.
          - ticket_priority_change

  - name: editing a subject sends the generic update and no change events
    source: https://support.freshdesk.com/support/solutions/articles/225427
    fixture: small-helpdesk
    request:
      method: PUT
      path: /api/v2/tickets/1
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
      json:
        subject: Cannot reset my password (second attempt)
    expect:
      status: 200
      body:
        subject: Cannot reset my password (second attempt)
      webhook:
        event: ticket_update
        absent_events:
          # This is the whole reason a conditional emission exists. A handler
          # subscribed to ticket_status_change must not run because somebody
          # fixed a typo in the subject.
          - ticket_status_change
          - ticket_priority_change

  - name: setting a status to the value it already holds is not a status change
    source: https://support.freshdesk.com/support/solutions/articles/225427
    fixture: small-helpdesk
    request:
      method: PUT
      path: /api/v2/tickets/1
      headers:
        Authorization: Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY
      json:
        # The ticket is already open. A client that sends the whole record
        # back on every edit -- which plenty do, having read it first --
        # names status every time, and the transition is what Freshdesk
        # announces, not the mention.
        status: 2
        subject: Cannot reset my password
    expect:
      status: 200
      webhook:
        event: ticket_update
        absent_events:
          - ticket_status_change

  - name: no credential at all is a flat 401 under message, not description
    # Struck live against support.freshdesk.com. The identical body answers
    # an invented Basic username too.
    source: https://support.freshdesk.com/api/v2/tickets
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v2/tickets
    expect:
      status: 401
      body:
        code: invalid_credentials
        message: You have to be logged in to perform this action.
      absent:
        - description

  - name: a path this API does not route needs no credential either
    # Struck live against support.freshdesk.com with no credential at all.
    # The router answers before authentication is ever consulted, which
    # auth.after_routing declares.
    source: https://support.freshdesk.com/api/v2/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v2/not-a-real-endpoint
    expect:
      status: 404
      no_body: true

  - name: a wrong method on a real path is a genuine 405 with an Allow header
    # PATCH on /api/v2/tickets, a method this Recipe declares only GET and
    # POST for. Struck live against support.freshdesk.com with no
    # credential at all; the computed Allow header matched what was sent.
    source: https://support.freshdesk.com/api/v2/tickets
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PATCH
      path: /api/v2/tickets
    expect:
      status: 405
      headers:
        Allow: "GET, POST"
      body:
        message: "PATCH method is not allowed. It should be one of these method(s): GET, POST"
      absent:
        - code
        - description

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the company listing answers with what the fixture holds"
    source: "https://developers.freshdesk.com/api/#tickets"
    fixture: small-helpdesk
    request:
      method: GET
      path: "/api/v2/companies"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY"
    expect:
      status: 200
      body:
        "[0].id": 1
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://developers.freshdesk.com/api/#ticket_attributes"
    fixture: small-helpdesk
    request:
      method: GET
      path: "/api/v2/tickets"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY"
    expect:
      status: 200
      body:
        "[0].id": 2
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads on api v2 contacts"
    source: "https://developers.freshdesk.com/api/#contacts"
    fixture: small-helpdesk
    request:
      method: GET
      path: "/api/v2/contacts"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY"
    expect:
      status: 200
      body:
        "[0].id": 11
      absent:
        - "[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://developers.freshdesk.com/api/#tickets"
    fixture: small-helpdesk
    request:
      method: GET
      path: "/api/v2/companies"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY"
    expect:
      status: 200
      absent:
        - "[0]"

  # The names. This Recipe declares 4 field(s) on a company that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a company carries the field names this Recipe declares"
    source: "https://developers.freshdesk.com/api/#tickets"
    fixture: small-helpdesk
    request:
      method: GET
      path: "/api/v2/companies"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZnJlc2hkZXNrLWtleTpY"
    expect:
      status: 200
      body:
        "[0].created_at": "2026-01-01T00:00:00Z"
        "[0].domains": "example.com"
        "[0].name": "Analytical Engines"

  # The names. This Recipe declares 6 field(s) on a contact that no case
  # asserted, so each of them could have been renamed to anything and
