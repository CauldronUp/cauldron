# TheMealDB Recipe for Cauldron
#
# "meals" is an array, or null, or a string.
#
#   lookup.php?i=52772       ->  200 {"meals": [ {...} ]}
#   lookup.php?i=99999999    ->  200 {"meals": null}
#   lookup.php               ->  200 {"meals": "Invalid ID"}
#
# One key, three JSON types, and the same status on all three. body.meals.length
# works on the first, throws on the second, and returns 10 on the third --
# because "Invalid ID" is ten characters long. A client that checks
# `if (body.meals)` treats the error message as a truthy result and iterates it
# character by character.
#
# **And forty of the record's fifty-four fields are one array flattened into
# columns.** strIngredient1 through strIngredient20 and strMeasure1 through
# strMeasure20, so a nine-ingredient recipe carries eleven empty slots -- and
# they are not empty the same way. Slots 10 to 15 are the empty string and slots
# 16 to 20 are null, in one numbered series, split at an index nothing explains.
#
# Written against the live API rather than a document: every case below was
# checked against themealdb.com on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. Every field is prefixed str except the ones that are not. idMeal,
#      dateModified and the identifier fields skip it, so the convention holds
#      for fifty of fifty-four fields and a client cannot guess which.
#   2. strTags is a comma-joined string where an array belongs: "Meat,Casserole".
#      Splitting it is the only way to read it, and nothing says the separator
#      has no spaces.
#   3. strInstructions carries CRLF. The line endings inside the JSON string are
#      \r\n, so anything splitting on \n leaves a carriage return at the end of
#      every line.
#   4. strArea is "Japanese" and strCountry is "Japan" -- the adjective and the
#      noun, in two fields, on one record.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One meal is served, not the collection, and its instructions are trimmed
#     to the first two sentences. The CRLF is in what is served.
#   - The public test key is 1, which is what the documentation gives out. A bad
#     key answers an IIS 404 page in XHTML rather than anything this API wrote,
#     and that is recorded rather than served: the path would have to carry the
#     key for a Recipe to route on it.
#   - Only lookup.php is modelled. search.php, filter.php, random.php,
#     categories.php and the list endpoints answer their own documents.

recipe: themealdb
capability: infrastructure
version: 0.1.0

upstream:
  api: themealdb
  docs: https://www.themealdb.com/api.php

auth:
  # The documentation hands out 1 as the public test key, in the path.
  scheme: none

responses:
  list:
    style: wrapped
    key: meals
  error:
    # The failures put their message under the same key the results use.
    style: flat
    message_field: meals

resources:
  meal:
    id:
      style: numeric
      # A number, quoted, under a name that skips the str prefix every other
      # field has.
      field: idMeal
    fields:
      strMeal:
        type: string
      strMealAlternate:
        type: string
      strCategory:
        type: string
      # The adjective, beside strCountry's noun.
      strArea:
        type: string
      strCountry:
        type: string
      # CRLF line endings, inside a JSON string.
      strInstructions:
        type: string
      strMealThumb:
        type: string
      # A comma-joined string where an array belongs.
      strTags:
        type: string
      strYoutube:
        type: string
      # Nine of these are filled, six are "" and five are null.
      strIngredient1:
        type: string
      strIngredient2:
        type: string
      strIngredient3:
        type: string
      strIngredient9:
        type: string
      strIngredient10:
        type: string
      strIngredient15:
        type: string
      strIngredient16:
        type: string
      strIngredient20:
        type: string
      strMeasure1:
        type: string
      strMeasure9:
        type: string
      strMeasure10:
        type: string
      strMeasure16:
        type: string
      strSource:
        type: string
      strImageSource:
        type: string
      strCreativeCommonsConfirmed:
        type: string
      # Not prefixed, unlike almost everything beside it.
      dateModified:
        type: string

routes:
  - method: GET
    path: /api/json/v1/1/lookup.php
    resource: meal
    operation: list
    pagination:
      # A lookup by id, which answers the one meal asked for. The collection
      # is the request rather than a window onto one, so there is nothing to
      # page.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    matches_query:
      i: "52772"

  # An identifier that is not a meal: the key holds null.
  - method: GET
    path: /api/json/v1/1/lookup.php
    matches_query:
      i: "99999999"
    error: no_such_meal

  # And no identifier at all: the same key holds a sentence.
  - method: GET
    path: /api/json/v1/1/lookup.php
    error: invalid_id

errors:
  # null, under the key the results use, with a 200. The message field is
  # turned off and the key is set directly, because the value is not a
  # sentence -- it is the absence of one, spelled where a collection goes.
  no_such_meal:
    status: 200
    message_field: "-"
    fields:
      meals: null

  # And a string, under the same key, with the same status -- so
  # body.meals.length is 10 here and throws above.
  invalid_id:
    status: 200
    message: Invalid ID

fixtures:
  empty: {}

  cookbook:
    meal:
      - id: "52772"
        strMeal: Teriyaki Chicken Casserole
        # null, where the unused ingredient slots below are "".
        strMealAlternate: null
        strCategory: Chicken
        # The adjective...
        strArea: Japanese
        # ...and the noun.
        strCountry: Japan
        # \r\n inside a JSON string, so splitting on \n leaves a carriage
        # return behind. Trimmed to two sentences.
        strInstructions: "Preheat oven to 350\xB0 F. Spray a 9x13-inch baking pan with non-stick spray.\r\nCombine soy sauce, \xBD cup water, brown sugar, ginger and garlic in a small saucepan and cover."
        strMealThumb: https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg
        # A comma-joined string, with no spaces, where an array belongs.
        strTags: Meat,Casserole
        strYoutube: https://www.youtube.com/watch?v=4aZr5hZXP_s
        # Nine ingredients, in nine of twenty columns.
        strIngredient1: soy sauce
        strIngredient2: water
        strIngredient3: brown sugar
        strIngredient9: brown rice
        # Slots 10 to 15 are the empty string...
        strIngredient10: ""
        strIngredient15: ""
        # ...and 16 to 20 are null, in the same numbered series.
        strIngredient16: null
        strIngredient20: null
        strMeasure1: 3/4 cup
        strMeasure9: 3 cups
        strMeasure10: ""
        strMeasure16: null
        strSource: null
        strImageSource: null
        strCreativeCommonsConfirmed: null
        dateModified: null

conformance:
  - name: the key holds an array
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        "meals[0].idMeal": "52772"
        "meals[0].strMeal": Teriyaki Chicken Casserole

  - name: and null, on the same key with the same status
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=99999999
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=99999999
    expect:
      # Not 404. The collection key is null, so body.meals.length throws.
      status: 200
      body:
        meals: null

  - name: and a string, on the same key with the same status again
    source: https://www.themealdb.com/api/json/v1/1/lookup.php
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php
    expect:
      # body.meals.length is 10 here, because "Invalid ID" is ten characters,
      # and a client checking `if (body.meals)` iterates the error message.
      status: 200
      body:
        meals: Invalid ID

  - name: forty of fifty-four fields are one array flattened into columns
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        # Nine ingredients, in nine of twenty numbered columns, each with its
        # own measure column beside it.
        "meals[0].strIngredient1": soy sauce
        "meals[0].strMeasure1": 3/4 cup
        "meals[0].strIngredient9": brown rice
        "meals[0].strMeasure9": 3 cups

  - name: and the unused slots are empty two different ways
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        # Slots 10 to 15 are the empty string...
        "meals[0].strIngredient10": ""
        "meals[0].strIngredient15": ""
        "meals[0].strMeasure10": ""
        # ...and 16 to 20 are null, in one numbered series, split at an index
        # nothing explains.
        "meals[0].strIngredient16": null
        "meals[0].strIngredient20": null
        "meals[0].strMeasure16": null

  - name: a comma-joined string where an array belongs
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        # No spaces around the separator, and nothing in the response says so.
        "meals[0].strTags": Meat,Casserole

  - name: the instructions carry CRLF
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      # The CRLF is inside a JSON string, so the bytes on the wire are a
      # backslash and an r rather than a carriage return. The pattern has to
      # match the escaped form, which is the whole point of the finding.
      body_matches: 'non-stick spray\.\\r\\nCombine soy sauce'

  - name: the fields the other cases do not read
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        "meals[0].strCategory": Chicken
        "meals[0].strMealThumb": https://www.themealdb.com/images/media/meals/wvpsxx1468256321.jpg
        "meals[0].strYoutube": https://www.youtube.com/watch?v=4aZr5hZXP_s
        # A licence field that is null rather than false, so the three-valued
        # question of whether the licence is confirmed has no third value.
        "meals[0].strCreativeCommonsConfirmed": null
        "meals[0].strImageSource": null
        # The degree sign is U+00B0 and the fraction is U+00BD, both inside the
        # instructions, both on the wire as themselves.
        "meals[0].strInstructions": "Preheat oven to 350\xB0 F. Spray a 9x13-inch baking pan with non-stick spray.\r\nCombine soy sauce, \xBD cup water, brown sugar, ginger and garlic in a small saucepan and cover."

  - name: the adjective and the noun, in two fields
    source: https://www.themealdb.com/api/json/v1/1/lookup.php?i=52772
    verified: "2026-08-30"
    fixture: cookbook
    request:
      method: GET
      path: /api/json/v1/1/lookup.php?i=52772
    expect:
      status: 200
      body:
        "meals[0].strArea": Japanese
        "meals[0].strCountry": Japan
        # And the optional fields are null, where the unused ingredient slots
        # beside them are "".
        "meals[0].strMealAlternate": null
        "meals[0].strSource": null
        "meals[0].dateModified": null
