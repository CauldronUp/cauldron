# Twelve Data Recipe for Cauldron
#
# Sits beside Alpha Vantage in this collection on purpose. Both answer daily
# bars for a stock symbol; the two providers do the same job and disagree
# about nearly everything else that matters to a client's error handling.
#
# **Every failure this Recipe records answers a real HTTP status.** No apikey
# at all, an apikey that is not one, a symbol nobody trades and an interval
# that means nothing all answer 401, not 200 -- because the credential is
# checked before any of the others is, so a single missing parameter hides
# every other mistake in the same request (see below). response.ok is false
# on all four, which is precisely the check Alpha Vantage's own Recipe says a
# client cannot rely on.
#
# **And a missing credential and a wrong one are not two sentences here --
# they are the same sentence.**
#
#   (no apikey at all)          -> 401 {"code":401,"message":"**apikey** parameter is incorrect or not specified. ..."}
#   apikey=junkkeyabc123...     -> 401 {"code":401,"message":"**apikey** parameter is incorrect or not specified. ..."}
#
# Byte for byte the same body, whether the parameter was left out or filled
# in with nonsense. FRED, modelled alongside this Recipe, draws that exact
# distinction in three different sentences at the same status code; Twelve
# Data draws no distinction at all, at a status code that at least says
# something failed. Two providers, two opposite ways of being unhelpful about
# the same class of mistake.
#
# **A route that does not exist is not this failure, and says so in a
# different format entirely.** /nonexistent_endpoint, with no apikey either,
# answers:
#
#   404, Content-Type: text/plain
#   404 page not found
#
# -- eighteen bytes of plain text, not the {"code","message","status"}
# envelope every declared route sends. A client that assumes every Twelve
# Data response is JSON because the documented ones are calls .json() on this
# and throws, on the one request its own typo produced. It is also a second,
# unrelated 404: /time_series for a symbol with no data answers 404 in the
# declared JSON envelope (documented below, never observed -- see the
# fidelity gap), so this provider has two 404s that share nothing but the
# number, the same shape of trap arXiv's raw-body Recipe exists to catch.
#
# Written against the live API rather than a document: every case below
# marked verified was checked against api.twelvedata.com on the date in its
# verified field.
#
# One more the Recipe pins:
#
#   auth is deliberately left off (see below), which means Cauldron's
#   built-in credential check never runs for this Recipe -- and that is the
#   point. The runtime's query scheme checks the credential before it
#   matches a route at all, and the live API checks the opposite order: an
#   unmatched path answers its plain-text 404 with no apikey on the request
#   whatsoever. Turning the scheme on would make every case above pass and
#   the malformed-route case fail, because the sandbox would answer 401 to a
#   request the real provider never asks a credential about.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful call was ever reachable. Twelve Data publishes no public
#     demonstration key of the kind Alpha Vantage's "demo" is -- every
#     unauthenticated request this Recipe could actually make is one of the
#     failures above, all of them carrying a verified date. The one GET route
#     that answers with data serves the shape Twelve Data's own
#     documentation describes for /time_series, cited to the docs rather
#     than to a transcript, and carries no verified field for that reason.
#   - What a genuine bad symbol or a genuine bad interval answers with a real
#     key was never reachable either, for the same reason Alpha Vantage's
#     Recipe gives for not reaching its real per-key errors: the credential
#     check intercepts every request this Recipe could send before either
#     parameter is ever looked at. Two of the routes below record what
#     Twelve Data's documentation says those answers are (400 for a bad
#     parameter, 404 for data that does not exist), sourced to the docs and
#     not verified, and two conformance cases record the thing that could
#     actually be checked: a bad symbol and a bad interval, sent with no
#     apikey, both answer the identical credential failure above rather than
#     either documented shape.
#   - Only AAPL on a 1day interval is served, and only a few bars of it --
#     the trap this Recipe records is in the shape of the envelope and the
#     type of its numbers, not in how much history is behind them.

recipe: twelvedata
capability: brokerage
version: 0.1.0

upstream:
  api: twelvedata
  docs: https://twelvedata.com/docs

auth:
  # apikey is a query parameter every real call carries, but Cauldron's
  # built-in query scheme checks it before a route is even matched, and the
  # live API checks the opposite order -- see the header. Modelling it by
  # hand through routes and errors is what keeps that order honest.
  scheme: none

responses:
  resource:
    style: bare
  success:
    fields:
      status: ok
  error:
    # {"code": 401, "message": "...", "status": "error"}. code is always the
    # HTTP status repeated in the body, not a separate provider code, so it
    # is declared as status_field rather than code_field.
    style: flat
    message_field: message
    status_field: code
    fields:
      status: error

resources:
  time_series:
    id:
      style: opaque
      # The symbol lives in the query string, not as a field of its own on
      # the object the provider sends back.
      field: "-"
    fields:
      # Instrument metadata, held whole: symbol, interval, currency,
      # exchange_timezone, exchange, mic_code, type.
      meta:
        type: map
      # Keyed by nothing -- an array of bars, each carrying its own
      # datetime, unlike FRED's observations which arrive the same way but
      # under a wrapped envelope with a count beside them.
      values:
        type: list

routes:
  # The real path. No unauthenticated call to it ever answers this -- every
  # one this Recipe could actually make is one of the errors below instead.
  # What is served here is the shape Twelve Data's own documentation
  # describes, uncalled. See the header.
  - method: GET
    path: /time_series
    resource: time_series
    operation: get
    id_from: query:symbol

  # Verified: no apikey parameter at all.
  - method: GET
    path: /time_series-no-apikey
    error: bad_credentials

  # Verified: an apikey that is not a real one. Byte for byte the same body
  # as the route above -- see the header.
  - method: GET
    path: /time_series-junk-apikey
    error: bad_credentials

  # Verified: a symbol that trades nowhere, with no apikey. Still the
  # credential failure, not the documented "data not found" -- the
  # credential check runs first. See the header and the fidelity gap.
  - method: GET
    path: /time_series-bad-symbol-no-key
    error: bad_credentials

  # Verified: an interval that means nothing, with no apikey. Still the
  # credential failure, not the documented "bad parameter".
  - method: GET
    path: /time_series-bad-interval-no-key
    error: bad_credentials

  # Documented, never verified: what Twelve Data's own error-code table says
  # a bad parameter answers, for a caller who has a real key. See the
  # fidelity gap -- this Recipe could never actually reach it.
  - method: GET
    path: /time_series-bad-parameter
    error: bad_parameter

  # Documented, never verified: what the same table says missing data
  # answers. A second, unrelated 404 from the plain-text one below -- see
  # the header.
  - method: GET
    path: /time_series-not-found
    error: data_not_found

errors:
  bad_credentials:
    status: 401
    message: "**apikey** parameter is incorrect or not specified. You can get your free API key instantly following this link: https://twelvedata.com/pricing. If you believe that everything is correct, you can contact us at https://twelvedata.com/contact/customer"

  bad_parameter:
    status: 400
    message: "Invalid or incorrect parameter(s) provided"

  data_not_found:
    status: 404
    message: "Requested data could not be found"

  # Overrides the runtime's own default text and shape for an unrecognised
  # path: real plain text, not the JSON envelope every declared route sends.
  # See the header.
  unknown_route:
    status: 404
    style: text
    message: "404 page not found"
    headers:
      Content-Type: text/plain

fixtures:
  empty: {}

  aapl:
    time_series:
      - id: AAPL
        meta:
          symbol: AAPL
          interval: 1day
          currency: USD
          exchange_timezone: "America/New_York"
          exchange: NASDAQ
          mic_code: XNGS
          type: "Common Stock"
        values:
          - datetime: "2026-08-31"
            open: "230.50"
            high: "233.10"
            low: "229.80"
            close: "232.40"
            volume: "45123400"
          - datetime: "2026-08-28"
            open: "228.90"
            high: "231.20"
            low: "227.60"
            close: "230.15"
            volume: "38904100"

conformance:
  - name: no apikey at all answers a real 401, not a 200
    source: https://api.twelvedata.com/time_series?symbol=AAPL&interval=1day
    verified: "2026-09-01"
    request:
      method: GET
      path: /time_series-no-apikey
    expect:
      status: 401
      body:
        code: 401
        status: error
        message: "**apikey** parameter is incorrect or not specified. You can get your free API key instantly following this link: https://twelvedata.com/pricing. If you believe that everything is correct, you can contact us at https://twelvedata.com/contact/customer"

  - name: a junk apikey answers byte for byte the same sentence
    source: "https://api.twelvedata.com/time_series?symbol=AAPL&interval=1day&apikey=junkkeyabc123junkkeyabc123"
    verified: "2026-09-01"
    request:
      method: GET
      path: /time_series-junk-apikey
    expect:
      status: 401
      body:
        code: 401
        message: "**apikey** parameter is incorrect or not specified. You can get your free API key instantly following this link: https://twelvedata.com/pricing. If you believe that everything is correct, you can contact us at https://twelvedata.com/contact/customer"

  - name: a symbol that trades nowhere never gets far enough to say so
    source: https://api.twelvedata.com/time_series?symbol=NOTASYMBOLXYZ&interval=1day
    verified: "2026-09-01"
    request:
      method: GET
      path: /time_series-bad-symbol-no-key
    expect:
      status: 401
      body:
        # The identical credential sentence, not the documented "Requested
        # data could not be found" -- see the header's fidelity gap.
        message: "**apikey** parameter is incorrect or not specified. You can get your free API key instantly following this link: https://twelvedata.com/pricing. If you believe that everything is correct, you can contact us at https://twelvedata.com/contact/customer"

  - name: nor does an interval that means nothing
    source: https://api.twelvedata.com/time_series?symbol=AAPL&interval=3fortnights
    verified: "2026-09-01"
    request:
      method: GET
      path: /time_series-bad-interval-no-key
    expect:
      status: 401
      body:
        message: "**apikey** parameter is incorrect or not specified. You can get your free API key instantly following this link: https://twelvedata.com/pricing. If you believe that everything is correct, you can contact us at https://twelvedata.com/contact/customer"

  - name: an unmatched path is plain text, not the JSON envelope
    source: https://api.twelvedata.com/nonexistent_endpoint
    verified: "2026-09-01"
    request:
      method: GET
      path: /nonexistent_endpoint
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^404 page not found$'

  - name: and a route with a typo in it is the same eighteen bytes
    source: https://api.twelvedata.com/time_seriesXYZ?symbol=AAPL&interval=1day
    verified: "2026-09-01"
    request:
      method: GET
      path: /time_seriesXYZ
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^404 page not found$'

  - name: documented -- a bad parameter with a real key would be a 400
    source: https://twelvedata.com/docs
    request:
      method: GET
      path: /time_series-bad-parameter
    expect:
      status: 400
      body:
        code: 400
        status: error
        message: "Invalid or incorrect parameter(s) provided"

  - name: documented -- and missing data would be a JSON 404, not the plain one
    source: https://twelvedata.com/docs
    request:
      method: GET
      path: /time_series-not-found
    expect:
      status: 404
      body:
        code: 404
        status: error
        message: "Requested data could not be found"

  - name: documented -- the success shape, clean field names and string numbers
    source: https://twelvedata.com/docs
    fixture: aapl
    request:
      method: GET
      path: /time_series
      query:
        symbol: AAPL
        interval: 1day
    expect:
      status: 200
      body:
        status: ok
        "meta.symbol": AAPL
        "meta.interval": 1day
        "meta.currency": USD
        "meta.exchange": NASDAQ
        "values[0].datetime": "2026-08-31"
        # Reachable with a dot, unlike Alpha Vantage's "1. open" -- but still
        # a string, just like it.
        "values[0].close": "232.40"
        "values[1].volume": "38904100"
      absent:
        - id
