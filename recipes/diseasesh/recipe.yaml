# disease.sh Recipe for Cauldron
#
# Six fields end in PerOneMillion. Three are integers and three are floats.
#
#   "casesPerOneMillion":     128843
#   "deathsPerOneMillion":    1538
#   "testsPerOneMillion":     1734189
#   "activePerOneMillion":    149.63
#   "recoveredPerOneMillion": 127155.85
#   "criticalPerOneMillion":  2.58
#
# One suffix, one obvious meaning, and two JSON types split by which statistic it
# happens to be. A client that types the family as an integer truncates three of
# them; one that types it as a float is right about all six and wrong about what
# the API promises. Nothing in the response distinguishes the two groups, and
# the three that are whole numbers are whole by arithmetic rather than by
# declaration -- a country whose cases do not divide evenly would break the
# pattern the first three establish.
#
# **And countryInfo carries _id.** A field named the way a database names its
# primary key, underscore and all, on a public API -- holding 124, which is the
# UN numeric country code and not an internal row id at all.
#
# Written against the live API rather than a document: every case below was
# checked against disease.sh on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. updated is a JavaScript millisecond timestamp. 1788067291278: a bare
#      integer, no timezone, no ISO 8601, and it changes on every request while
#      the figures beside it do not.
#   2. The coordinates are integers and the derived statistics are not. lat is
#      60 and long is -95 -- whole degrees, which places Canada about a hundred
#      kilometres from anywhere in particular -- while criticalPerOneMillion is
#      2.58. The least precise numbers on the record are the ones describing a
#      place.
#   3. long, not longitude. lat is an abbreviation everybody makes and long is
#      one that collides with a reserved word in several languages, and the pair
#      is inconsistent with every other field name here.
#   4. A country that does not exist is JSON and a path that does not exist is
#      HTML. The first answers {"message": "Country not found or doesn't have
#      any cases"} with a 404 and the second answers an Express error page --
#      <pre>Cannot GET /v3/nope</pre> -- with the same status.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One country is served, not 231. The figures are what the live API answered
#     on the date recorded, and they no longer move: this dataset stopped being
#     updated, so updated changes on every request and nothing under it does.
#   - Only the single-country lookup is modelled. The all, continents,
#     historical, vaccine and jhucsse endpoints answer their own documents.

recipe: diseasesh
capability: infrastructure
version: 0.1.0

upstream:
  api: diseasesh
  docs: https://disease.sh/docs/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  country:
    id:
      style: opaque
      # A country is addressed by name and the body echoes it under "country".
      field: "-"
      carried_by: country
    fields:
      # A JavaScript millisecond timestamp, as a bare integer.
      updated:
        type: integer
      country:
        type: string
      # Carries _id, lat and long.
      countryInfo:
        type: map
      cases:
        type: integer
      todayCases:
        type: integer
      deaths:
        type: integer
      todayDeaths:
        type: integer
      recovered:
        type: integer
      todayRecovered:
        type: integer
      active:
        type: integer
      critical:
        type: integer
      # Three of the six PerOneMillion fields are integers...
      casesPerOneMillion:
        type: integer
      deathsPerOneMillion:
        type: integer
      testsPerOneMillion:
        type: integer
      # ...and three are floats.
      activePerOneMillion:
        type: number
      recoveredPerOneMillion:
        type: number
      criticalPerOneMillion:
        type: number
      tests:
        type: integer
      population:
        type: integer
      continent:
        type: string
      # Reciprocals, integer-floored, so a value under one becomes one.
      oneCasePerPeople:
        type: integer
      oneDeathPerPeople:
        type: integer
      oneTestPerPeople:
        type: integer

routes:
  - method: GET
    path: /v3/covid-19/countries/{id}
    resource: country
    operation: get
    not_found: country_not_found

  # A path that is not an endpoint, answered by the framework rather than the
  # API.
  - method: GET
    path: /v3/nope
    error: no_such_path

errors:
  country_not_found:
    status: 404
    message: Country not found or doesn't have any cases

  no_such_path:
    status: 404
    style: text
    headers:
      Content-Type: text/html
    message: |-
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Error</title>
      </head>
      <body>
      <pre>Cannot GET /v3/nope</pre>
      </body>
      </html>

fixtures:
  empty: {}

  countries:
    country:
      - id: canada
        # Milliseconds since the epoch, as a bare integer.
        updated: 1788067291278
        country: Canada
        countryInfo:
          # Named the way a database names a primary key, holding the UN
          # numeric country code.
          _id: 124
          iso2: CA
          iso3: CAN
          # Whole degrees, on a record whose derived statistics carry two
          # decimal places.
          lat: 60
          # And abbreviated where nothing else on the record is.
          long: -95
          flag: https://disease.sh/assets/img/flags/ca.png
        cases: 4946090
        todayCases: 0
        deaths: 59034
        todayDeaths: 0
        recovered: 4881312
        todayRecovered: 350
        active: 5744
        critical: 99
        # Integers.
        casesPerOneMillion: 128843
        deathsPerOneMillion: 1538
        testsPerOneMillion: 1734189
        # Floats, under the same suffix.
        activePerOneMillion: 149.63
        recoveredPerOneMillion: 127155.85
        criticalPerOneMillion: 2.58
        tests: 66572774
        population: 38388419
        continent: North America
        # 66,572,774 tests among 38,388,419 people is 0.58 people per test,
        # floored to 1 -- which reads as one test each and is nearly two.
        oneCasePerPeople: 8
        oneDeathPerPeople: 650
        oneTestPerPeople: 1

conformance:
  - name: six fields end in PerOneMillion and three of them are integers
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        # Whole numbers...
        casesPerOneMillion: 128843
        deathsPerOneMillion: 1538
        testsPerOneMillion: 1734189
        # ...and decimals, under the same suffix, with nothing in the response
        # distinguishing the two groups.
        activePerOneMillion: 149.63
        recoveredPerOneMillion: 127155.85
        criticalPerOneMillion: 2.58

  - name: countryInfo carries a database's primary key name
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        # Underscore and all, on a public API, holding the UN numeric country
        # code rather than an internal row id.
        "countryInfo._id": 124
        "countryInfo.iso2": CA
        "countryInfo.iso3": CAN

  - name: the coordinates are whole degrees
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        # Integers, on a record whose derived statistics carry two decimal
        # places -- so the least precise numbers here describe a place.
        "countryInfo.lat": 60
        # And abbreviated, where nothing else on the record is.
        "countryInfo.long": -95
        "countryInfo.flag": https://disease.sh/assets/img/flags/ca.png

  - name: the timestamp is milliseconds since the epoch
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        # A bare integer, no timezone, no ISO 8601 -- and it moves on every
        # request while the figures beside it do not.
        updated: 1788067291278
        country: Canada
        continent: North America

  - name: the reciprocals are floored, and one of them floors to a promise
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        # 66,572,774 tests among 38,388,419 people is 0.58 people per test,
        # floored to 1, which reads as one test each and is nearly two.
        oneTestPerPeople: 1
        tests: 66572774
        population: 38388419
        oneCasePerPeople: 8
        oneDeathPerPeople: 650

  - name: a country that does not exist is JSON
    source: https://disease.sh/v3/covid-19/countries/zzzz
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/zzzz
    expect:
      status: 404
      body:
        message: Country not found or doesn't have any cases

  - name: and a path that does not exist is HTML
    source: https://disease.sh/v3/nope
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/nope
    expect:
      # The same status, from the framework rather than the API, so a client
      # that parses every 404 as JSON throws on this one and not the other.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '<pre>Cannot GET /v3/nope</pre>'

  - name: the counts that stopped moving
    source: https://disease.sh/v3/covid-19/countries/canada
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v3/covid-19/countries/canada
    expect:
      status: 200
      body:
        cases: 4946090
        deaths: 59034
        recovered: 4881312
        active: 5744
        critical: 99
        # Zero on two of the three "today" fields and not on the third, on a
        # dataset that is no longer updated.
        todayCases: 0
        todayDeaths: 0
        todayRecovered: 350
