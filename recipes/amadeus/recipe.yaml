# Amadeus Recipe for Cauldron
#
# Neither host this API is documented to live at answers at all. Checked
# 2026-09-02, from two independent vantage points -- this machine's own
# resolver and, separately, a fetch issued from Anthropic's own
# infrastructure -- both test.api.amadeus.com and api.amadeus.com return no
# DNS record of any kind: no A, no AAAA, no CNAME, just an authoritative
# SOA with an empty answer section from Google's and Cloudflare's public
# resolvers alike. The fetch from outside this machine failed the same way
# every other attempt did: `getaddrinfo ENOTFOUND test.api.amadeus.com` and
# `getaddrinfo ENOTFOUND api.amadeus.com`, not a timeout, not a TLS refusal,
# not a 403 from a bot wall -- the name itself resolves to nothing, from
# every direction this Recipe could ask. developers.amadeus.com, the
# documentation host, is unaffected and answers normally through its own
# Imperva front door; only the API hosts every SDK, every worked example and
# every guide in this file's own citations point at are gone. Every case
# below is therefore read from Amadeus's own published material and carries
# no verified date at all -- not one request in this file could have been
# sent to the real API, because there was no address to send it to.
#
# Two primary sources make that still worth doing precisely. Amadeus
# publishes real, machine-readable OpenAPI descriptions for every product on
# GitHub (amadeus4dev/amadeus-open-api-specification), fingerprinted below,
# and a second repository (amadeus4dev/developer-guides) carries the prose
# guides as plain Markdown rather than the client-rendered site that
# republishes them -- developers.amadeus.com's own authorization guide page
# answers 200 and contains nothing fetchable without executing JavaScript,
# the same shape of gap this collection already has for Kiwi's docs, so the
# Markdown source is what this file actually cites throughout. Both
# repositories are live, unauthenticated, and needed no account to read.
#
# **This API answers with two different envelopes for two different
# failures, on the same product, and neither is the other's.** The OAuth
# token endpoint's own errors -- documented in both the OpenAPI description
# and developer-guides/docs/common-errors.md, which shows worked JSON for
# each -- are flat: {"error", "error_description", "code", "title"}, four
# keys, no nesting, no array. Every other Amadeus error in the same guide,
# for every other endpoint, is a JSON:API-flavoured array:
# {"errors":[{"status","code","title","detail","source"}]}. A client that
# learns Amadeus's error shape from calling the token endpoint first -- the
# first call any integration makes -- learns the wrong shape for every
# subsequent one.
#
# **The token response states its own lifetime, and a second document
# confirms the number independently.** The OAuth spec's own worked example
# answers expires_in: 1799 -- one second short of thirty minutes -- and
# common-errors.md's "Access token expired" entry states the same fact in
# prose, independently: "Access tokens are only valid for 30 minutes." Two
# separately-maintained documents agree to the second. This directly answers
# half of this group's question for Amadeus: yes, the credential itself
# carries an explicit, stated expiry, in a field named for exactly that.
#
# **A flight offer does not.** FlightOffer, in the FlightOffersSearch v2
# description, has no expires_at, no valid_until, nothing naming a deadline
# for the offer itself. What it has is lastTicketingDate /
# lastTicketingDateTime, and the schema's own description says plainly what
# that is and is not: "If booked on the same day as the search... this
# flight offer is guaranteed to be thereafter valid for ticketing until this
# date." That is a ticketing deadline for an offer already booked, not a
# statement of when the offer itself goes stale unbooked -- the opposite
# half of the question Duffel's expires_at answers directly, in this same
# collection, for what looks like the same kind of object. And id itself is
# small and positional -- '1', '2' in every worked example this Recipe
# found, never a persistent-looking token -- which this Recipe reproduces
# with the "opaque" id style for want of a closer word, the same
# accommodation FlightAware's Recipe already makes for a short
# provider-assigned code that is not actually random.
#
# **What a stale offer answers, this Recipe cannot state, because Amadeus's
# own published materials do not state it either.** FlightOffersPrice and
# FlightCreateOrders -- the two operations that would refuse a stale or
# already-booked offer -- each document exactly two response shapes in their
# OpenAPI descriptions: a 400 (Error_400, example code 477 "INVALID FORMAT")
# and a 500 (Error_500, example code 141 "SYSTEM ERROR HAS OCCURRED"), and
# neither worked example is about an offer going stale. Nothing in either
# spec, and nothing in developer-guides, shows what code or message a
# rejected, sold-out or repriced offer actually carries. Duffel's Recipe in
# this collection can state this precisely -- offer_expired, invalid_state_
# error, quoted from Duffel's own docs -- because Duffel published it.
# Amadeus's public material simply does not say, and this Recipe states that
# absence rather than inventing a code that would look exactly as plausible
# as the real one and be a guess.
#
# **Test and production are documented to differ in what they hold, not in
# what they refuse.** developer-guides/docs/test-data.md states it as a
# table: test is "Limited, cached" data at 10 TPS on a free quota;
# production is "Unlimited, real-time" at 40 TPS, billed past a free
# allowance. That is a real, citable answer to whether the two hosts differ
# -- but it is an answer about inventory and rate limits, not about
# authentication, and this Recipe cannot extend it to "whether the two hosts
# differ in what they refuse" at all: both hosts are equally unreachable
# today, so that half of the question has no evidence either way, and
# saying so is more honest than assuming the auth layer is identical because
# the two hosts share one description.
#
# **A resource call's own credential failure is real, documented, and comes
# in four distinct sentences Cauldron's own engine cannot hold at once.**
# common-errors.md lists, each with a worked JSON body: code 38191 "Invalid
# HTTP header" for a missing or malformed Authorization header entirely,
# code 38190 "Invalid access token" for one that is simply wrong, code 38192
# "Access token expired" for one that was valid and has timed out, and code
# 38193 "Access token revoked" for one the provider invalidated early.
# Cauldron's credential check distinguishes three verdicts -- absent,
# malformed, rejected -- which would already be one short of Amadeus's four.
# This Recipe cannot even reach three: the OAuth token endpoint authenticates
# over form-encoded body fields, a carrier this project's auth schemes do not
# describe (bearer, header, query, basic -- none of them a POST body), so
# giving the protected flight-search route real bearer-style verdict
# splitting would mean gating the *token* route by a bearer credential it was
# never sent. The only way to leave one route open is the mechanism
# Temporal's and Census's Recipes already use elsewhere in this collection:
# auth.scheme: none Recipe-wide, with matches_header standing in for the
# check by hand on every route that needs one. That buys the open token
# route and costs the verdict split entirely -- every protected route here
# has exactly one fallback answer, not three, and it uses 38190 ("Invalid
# access token"), the most general of Amadeus's four documented sentences,
# because a single slot can only hold one.
#
# **The same numeric code is glued to two different failures on the token
# endpoint itself.** unsupported_grant_type (400, sending a grant_type other
# than client_credentials) and invalid_client (401, wrong client_id or
# client_secret) are two different HTTP statuses, two different `error`
# strings, and two different sentences in `error_description` -- and both
# carry code: 38187 and title: "Invalid parameters", identically, in
# Amadeus's own worked examples. A client that switches on `code` alone
# cannot tell "you sent the wrong grant type" from "your credentials are
# wrong" apart; only `error` or the HTTP status can.
#
# **routing order and a wrong method are both undocumented here.** No page
# this Recipe found states whether an unrecognised path is checked before or
# after the credential, or what a wrong HTTP method answers -- only that a
# resource-not-found case exists (code 38196, "Resource not found", 404) with
# no ordering claim attached to it. This Recipe declares that 404 as
# Cauldron's own unknown_route fallback, which is honest about the shape and
# silent about the order, and does not touch method_not_allowed at all:
# nothing in common-errors.md mentions a 405 or an Allow header on this API,
# so Cauldron's generic default is left standing rather than overwritten with
# a guess.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No case in this file carries a verified date, for the reason in the
#     first paragraph above. Every one is read from a document this Recipe
#     actually fetched on 2026-09-02, and none is a call to the real API,
#     because no address exists to call.
#   - Only two operations are modelled -- the OAuth token grant and Flight
#     Offers Search -- out of the roughly forty Amadeus publishes specs for.
#     FlightOffersPrice, FlightCreateOrders and everything past them are read
#     for their error shapes only, in the header above, and declared as
#     routes nowhere in this file.
#   - A flight-offer's itineraries, price and travelerPricings are carried
#     as opaque lists and maps rather than typed fields, the same
#     accommodation Duffel's slices and conditions get in this collection --
#     modelling FlightOffer's full nested shape would be a second Recipe's
#     worth of schema for a finding that does not need it.
#   - source.pointer/parameter/example on an Issue is real, documented, and
#     not declared -- this Recipe's Issue-shaped errors carry status, code,
#     title and detail only.
#   - The token-info lookup (GET /v1/security/oauth2/token/{access_token})
#     is documented and not modelled: this Recipe never issues a route that
#     would need it, and adding one only to read a token back would not
#     demonstrate anything the create route does not already show.
#   - The flight-offers-search route names `max` for its size and says
#     Amadeus takes no name for a position, which is what the endpoint does:
#     max caps how many offers come back in one response and there is nothing
#     to ask for a next one with.
#
#     It used to declare no pagination block at all, "so Cauldron's own
#     default (page size 10, reading a limit query parameter) applies rather
#     than anything Amadeus is documented to do" -- an engine fallback
#     standing where a reading already existed. This file's one-offer fixture
#     never reaches a size where the difference would show up in a case.
#   - common-errors.md's own worked example for code 38191 ("Invalid HTTP
#     header") renders both code and status as quoted strings --
#     "code": "38191", "status": "401" -- where every one of its seven
#     sibling examples renders the same two properties as bare numbers.
#     Cauldron's error codes infer JSON number-or-string from the value
#     Recipe-wide, not per named error, so this Recipe cannot reproduce one
#     error typed differently from its neighbours without retyping all of
#     them -- and 38191 is not modelled here at all (see the four-sentence
#     paragraph above), so the inconsistency is stated rather than forced
#     into a shape this file cannot actually hold.

recipe: amadeus
capability: scheduling
version: 0.1.0

upstream:
  # Two different version labels for two different products, which is
  # Amadeus's own scheme, not an approximation: /v1/security/oauth2/token
  # and /v2/shopping/flight-offers are both real, current paths per their
  # respective OpenAPI descriptions.
  api: v1 oauth2 / v2 flight-offers-search
  docs: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/API-Keys/authorization.md
  spec: https://raw.githubusercontent.com/amadeus4dev/amadeus-open-api-specification/main/spec/yaml/Authorizaton_v1_swagger_specification.yaml
  spec_hash: b68fa3cba1c34e93aa1fc22c461c26b67d0b60211236e3d95894a7d364e06f58
  spec_seen: "2026-09-02"

auth:
  # Disabled Recipe-wide on purpose -- see the header's four-sentence
  # paragraph. The token endpoint authenticates over form-encoded body
  # fields, a carrier none of Cauldron's schemes describe, so every route
  # below that needs a credential checks one by hand with matches_header,
  # the same accommodation Temporal's and Census's Recipes make elsewhere in
  # this collection.
  scheme: none

responses:
  # The Issue-array envelope -- {"errors":[{status,code,title,detail}]} --
  # used by every Amadeus endpoint this Recipe found published documentation
  # for, except the OAuth token endpoint itself. That one flips style, key
  # and every field name per-error below; see the header's first paragraph.
  error:
    style: list
    key: errors
    message_field: detail
    code_field: code
    type_field: "-"
    status_field: status

resources:
  # Not addressed by a URL id in the ordinary sense; access_token is the
  # value a caller holds onto and presents on every later call, which is the
  # closest thing this resource has to an identifier.
  token:
    id:
      style: opaque
      field: access_token
    constants:
      type: amadeusOAuth2Token
    fields:
      username:
        type: string
      application_name:
        type: string
      client_id:
        type: string
      token_type:
        type: string
        default: Bearer
      # The number that answers this group's question for a credential
      # rather than an offer -- see the header.
      expires_in:
        type: integer
        default: 1799
      state:
        type: string
        default: approved
      scope:
        type: string

  flight_offer:
    id:
      # A small, positional, response-scoped label -- '1', '2' -- not a
      # persistent-looking token. See the header for why "opaque" stands in
      # for a shape this project's id styles do not otherwise name.
      style: opaque
    constants:
      type: flight-offer
    fields:
      source:
        type: string
      instantTicketingRequired:
        type: boolean
        default: false
      # A ticketing deadline for an offer already booked, not an expiry for
      # the offer itself. See the header -- this is the answer to half of
      # this group's question, and the answer is that the field that looks
      # like it is asking is asking something else.
      lastTicketingDate:
        type: string
        null_when_unset: true
      numberOfBookableSeats:
        type: integer
      itineraries:
        type: list
      price:
        type: map
      validatingAirlineCodes:
        type: list
      travelerPricings:
        type: list

routes:
  # Checked first regardless of whether client_id is otherwise our fixture's
  # own, because a real caller demonstrating this case still has to send a
  # client_id of some kind, and declaration order is match order -- see
  # route.go. A grant_type other than client_credentials, sent by a caller
  # who otherwise has the shape right.
  - method: POST
    path: /v1/security/oauth2/token
    selects_body: refresh_token
    error: unsupported_grant_type

  # Matched by the literal client_id our one fixture credential pair holds,
  # once the check above has already let a correct grant_type through.
  - method: POST
    path: /v1/security/oauth2/token
    selects_body: cauldron-amadeus-fixture-client-id-000000
    resource: token
    operation: create
    status: 200

  # Wrong client_id, wrong client_secret, or a body with none of the above --
  # everything else this endpoint can be sent.
  - method: POST
    path: /v1/security/oauth2/token
    error: invalid_client

  - method: POST
    path: /v2/shopping/flight-offers
    resource: flight_offer
    operation: list
    pagination:
      # max, not limit, and it is a cap rather than a page size: Amadeus
      # does not page this in the cursor or offset sense at all. max says
      # how many offers come back in one response, and there is nothing to
      # ask for the next one with.
      #
      # So the position says the provider takes no name for it, which is
      # what "-" means, and max is named for the size. This replaces the
      # runtime's own default -- ten records reading "limit" -- on a route
      # the header already recorded as taking neither.
      style: cursor
      limit: 10
      limit_param: max
      cursor_param: "-"
    matches_header:
      Authorization: Bearer cauldron-amadeus-fixture-access-token-000000000000
    list:
      style: wrapped
      key: data
      count_field: meta.count

  # No Authorization header, or one this Recipe does not hold. See the
  # header for why this is one answer standing in for Amadeus's own four.
  - method: POST
    path: /v2/shopping/flight-offers
    error: authentication_error

errors:
  # The token endpoint's own envelope: flat, four keys, no array. Both
  # worked examples below share this shape and, remarkably, share a code and
  # a title too -- see the header's fifth paragraph.
  invalid_client:
    status: 401
    style: flat
    message_field: error_description
    code_field: code
    code: "38187"
    message: Client credentials are invalid
    fields:
      error: invalid_client
      title: Invalid parameters

  unsupported_grant_type:
    status: 400
    style: flat
    message_field: error_description
    code_field: code
    code: "38187"
    message: Only client_credentials value is allowed for the body parameter grant_type
    fields:
      error: unsupported_grant_type
      title: Invalid parameters

  # The general "your bearer token is wrong" sentence -- one of four
  # documented verdicts standing in for all of them. See the header.
  authentication_error:
    status: 401
    code: 38190
    message: The access token provided in the Authorization header is invalid
    fields:
      title: Invalid access token

  # Cauldron's own generic fallback, renamed to Amadeus's documented wording
  # for "the endpoint or URL does not exist." No ordering claim attached --
  # see the header.
  unknown_route:
    status: 404
    code: 38196
    message: The targeted resource doesn't exist
    fields:
      title: Resource not found

fixtures:
  empty: {}

  self-service:
    token:
      # access_token is minted fresh per call -- operation: create does not
      # replay a stored id, the same way Duffel's order and Census's
      # sync_run mint theirs in this collection -- so the value here is
      # never actually served; only the defaulted fields below are. The
      # protected flight-offers-search route is guarded by its own separate
      # fixture bearer value instead of this one, precisely because nothing
      # this route mints could be predicted ahead of a call to assert
      # against. username, application_name and client_id are the literal
      # example values from both of Amadeus's own primary sources (the
      # OpenAPI description and developer-guides/docs/API-Keys/
      # authorization.md), which agree with each other byte for byte.
      - access_token: cauldron-amadeus-fixture-access-token-000000000000
        username: foo@bar.com
        application_name: BetaTest_foobar
        client_id: cauldron-amadeus-fixture-client-id-000000
        token_type: Bearer
        expires_in: 1799
        state: approved
        scope: ""

    flight_offer:
      # Every field value below is copied from the FlightOffersSearch v2
      # description's own worked example for POST /v2/shopping/flight-offers
      # (EWR-LHR-MAD, USD 342.20) -- itineraries and price are reproduced in
      # full rather than trimmed, because trimming a nested example risks
      # leaving it internally inconsistent in a way nobody would notice.
      - id: "1"
        source: GDS
        instantTicketingRequired: false
        lastTicketingDate: "2023-11-01"
        numberOfBookableSeats: 9
        itineraries:
          - duration: PT9H10M
            segments:
              - departure:
                  iataCode: EWR
                  at: "2023-11-01T21:50:00"
                arrival:
                  iataCode: LHR
                  at: "2023-11-02T08:45:00"
                carrierCode: 6X
                number: "188"
                aircraft:
                  code: "777"
                operating:
                  carrierCode: 6X
                duration: PT5H55M
                id: "3"
                numberOfStops: 0
                blacklistedInEU: false
              - departure:
                  iataCode: LHR
                  at: "2023-11-02T10:30:00"
                arrival:
                  iataCode: MAD
                  at: "2023-11-02T13:00:00"
                carrierCode: 6X
                number: "9931"
                aircraft:
                  code: "320"
                operating:
                  carrierCode: 6X
                duration: PT1H30M
                id: "4"
                numberOfStops: 0
                blacklistedInEU: false
        price:
          currency: USD
          total: "342.20"
          base: "294.00"
          fees:
            - amount: "0.00"
              type: SUPPLIER
            - amount: "0.00"
              type: TICKETING
          grandTotal: "342.20"
        validatingAirlineCodes:
          - 6X
        travelerPricings:
          - travelerId: "1"
            fareOption: STANDARD
            travelerType: ADULT
            price:
              currency: USD
              total: "342.20"
              base: "294.00"
            fareDetailsBySegment:
              - segmentId: "3"
                cabin: BUSINESS
                fareBasis: J6XQSMIX
                class: J
                includedCheckedBags:
                  quantity: 8
              - segmentId: "4"
                cabin: BUSINESS
                fareBasis: J6XQSMIX
                class: J
                includedCheckedBags:
                  quantity: 8

conformance:
  # From developer-guides/docs/API-Keys/authorization.md's own cURL example
  # and the OpenAPI description's worked response, agreeing byte for byte on
  # expires_in. This is the answer to half of this group's question: the
  # credential itself states its own lifetime, in seconds, explicitly.
  - name: the token response states its own lifetime to the second
    source: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/API-Keys/authorization.md
    fixture: self-service
    request:
      method: POST
      path: /v1/security/oauth2/token
      headers:
        Content-Type: application/x-www-form-urlencoded
      form:
        grant_type: client_credentials
        client_id: cauldron-amadeus-fixture-client-id-000000
        client_secret: cauldron-amadeus-fixture-client-secret-0000
    expect:
      status: 200
      body:
        type: amadeusOAuth2Token
        token_type: Bearer
        expires_in: 1799
        state: approved
      matches:
        # Minted fresh per call -- see the fixture comment above.
        access_token: ".+"

  # From the same guide and the OpenAPI description's ErrorResponse example,
  # both showing this exact body for a wrong client_id/client_secret pair.
  - name: wrong client credentials name the client, not the grant
    source: https://raw.githubusercontent.com/amadeus4dev/amadeus-open-api-specification/main/spec/yaml/Authorizaton_v1_swagger_specification.yaml
    fixture: self-service
    request:
      method: POST
      path: /v1/security/oauth2/token
      form:
        grant_type: client_credentials
        client_id: somebody-elses-client-id
        client_secret: somebody-elses-client-secret
    expect:
      status: 401
      body:
        error: invalid_client
        error_description: Client credentials are invalid
        code: 38187
        title: Invalid parameters

  # From common-errors.md's "Unsupported grant type" entry. Compare the case
  # above: same code, same title, different HTTP status, different `error`
  # string -- see the header's fifth paragraph.
  - name: a wrong grant type shares invalid_client's code and title
    source: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/common-errors.md
    fixture: self-service
    request:
      method: POST
      path: /v1/security/oauth2/token
      form:
        grant_type: refresh_token
        client_id: cauldron-amadeus-fixture-client-id-000000
        client_secret: cauldron-amadeus-fixture-client-secret-0000
    expect:
      status: 400
      body:
        error: unsupported_grant_type
        error_description: Only client_credentials value is allowed for the body parameter grant_type
        code: 38187
        title: Invalid parameters

  # From the FlightOffersSearch v2 description's own worked example.
  # itineraries, price and travelerPricings are reproduced in full in the
  # fixture above; this case asserts the two fields this group's question is
  # actually about.
  - name: an offer's id is small and positional, and nothing on it says when it goes stale
    source: https://raw.githubusercontent.com/amadeus4dev/amadeus-open-api-specification/main/spec/yaml/FlightOffersSearch_v2_swagger_specification.yaml
    fixture: self-service
    request:
      method: POST
      path: /v2/shopping/flight-offers
      headers:
        Authorization: Bearer cauldron-amadeus-fixture-access-token-000000000000
    expect:
      status: 200
      body:
        # 1, not the source example's 2 -- this fixture keeps only the
        # first of the two flight-offers the description's own example
        # returns, per the header's third fidelity gap.
        "meta.count": 1
        "data[0].id": "1"
        "data[0].type": flight-offer
        "data[0].lastTicketingDate": "2023-11-01"
        "data[0].price.total": "342.20"
        "data[0].price.currency": USD
      absent:
        # lastTicketingDate is present -- see the case name and the header.
        # expires_at, or anything naming it, is not, on this or any other
        # field this Recipe found documented.
        - "data[0].expires_at"
        - "data[0].valid_until"

  - name: no bearer token at all gets Amadeus's general invalid-token sentence
    source: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/common-errors.md
    fixture: self-service
    request:
      method: POST
      path: /v2/shopping/flight-offers
    expect:
      status: 401
      body:
        "errors[0].code": 38190
        "errors[0].title": Invalid access token
        "errors[0].detail": The access token provided in the Authorization header is invalid
        "errors[0].status": 401

  - name: a bearer token this Recipe does not hold gets the identical sentence
    # See the header: Amadeus documents four distinct verdicts here (missing
    # header, wrong token, expired token, revoked token) and this Recipe can
    # reach exactly one of them, because auth.scheme: none trades the native
    # verdict split for the one open token route this API also needs.
    source: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/common-errors.md
    fixture: self-service
    request:
      method: POST
      path: /v2/shopping/flight-offers
      headers:
        Authorization: Bearer somebody-elses-token-entirely
    expect:
      status: 401
      body:
        "errors[0].code": 38190
        "errors[0].title": Invalid access token

  # Cauldron's own generic fallback, renamed to Amadeus's documented 404
  # wording. No ordering claim -- see the header.
  - name: an unrecognised path answers Amadeus's own resource-not-found wording
    source: https://raw.githubusercontent.com/amadeus4dev/developer-guides/master/docs/common-errors.md
    fixture: self-service
    request:
      method: GET
      path: /v2/this-is-not-a-real-endpoint
    expect:
