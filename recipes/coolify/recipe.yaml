# Coolify Recipe for Cauldron
#
# Written against Coolify's own OpenAPI 3.1 document, published in its own
# repository -- github.com/coollabsio/coolify, openapi.json, 192 paths,
# info.version "0.1" -- read on 2026-09-06. Coolify Cloud exists but every
# endpoint needs an account, and there is no anonymous surface, so nothing here
# is verified live: every claim is the provider's own document.
#
# **The document uses `writeOnly` nowhere, and declares secrets on responses.**
#
# `writeOnly` is OpenAPI's way of saying "this may be sent and is never returned".
# It appears zero times in this 192-path, one-megabyte document.
#
# Meanwhile the Application schema -- the one a listing answers with -- declares:
#
#   http_basic_auth_password       "Password for HTTP Basic Authentication"
#   manual_webhook_secret_github   "Manual webhook secret for GitHub."
#   manual_webhook_secret_gitlab
#   manual_webhook_secret_bitbucket
#   manual_webhook_secret_gitea
#
# and the PrivateKey schema declares `private_key`, `format: private-key` -- the
# SSH key itself.
#
# So as published, nothing in this document distinguishes a secret you send from
# a secret you get back. A generated client types all of them onto the response.
# A generated TypeScript interface for Application has a password on it. Any
# code that logs a response body, or serialises one into an error report, or
# caches one, is handling five secrets per application and does not know it.
#
# **This is a claim about the document, not about the running server.** Coolify
# may well redact these at runtime; there is no anonymous endpoint to check
# against, so this Recipe does not claim it either way. What is checkable is
# what the document says, and the document says they are returned.
#
# **There is no POST /applications.**
#
# Creating an application is five separate endpoints, chosen by where the code
# comes from:
#
#   POST /applications/public
#   POST /applications/private-github-app
#   POST /applications/private-deploy-key
#   POST /applications/dockerfile
#   POST /applications/dockerimage
#
# `/applications` itself has a GET and nothing else. All five answer the same
# Application shape, so a client has one type for the result and five paths for
# the request, and the decision of which to call is made from data the caller
# holds rather than from anything the API offers.
#
# **A bad credential is 400, and no credential is 401.**
#
# The document's own reusable responses:
#
#   400  "Invalid token."
#   401  "Unauthenticated."
#
# That is the opposite way round from most providers here, where a wrong token
# is a 401. A client whose refresh-and-retry path fires on 401 never fires on an
# expired token, because an expired token is a 400 -- and 400 is the status
# every client treats as "my request was malformed, do not retry".
#
# **Ports are a string.** `ports_exposes` is `type: string`, and so is
# `ports_mappings`. A comma-separated list inside a string field, so a client
# reading a port has to split and parse, and a client writing one has to join --
# and neither is described anywhere in the schema.
#
# **Two identifiers, and the one called uuid is not one.** `id` is "the
# application identifier in the database", an integer, exposed and addressing
# nothing. `uuid` is what every path segment takes -- and it is a 24-character
# lowercase alphanumeric string like `k4o8sw0kow4c8c0soo4k0go8`, with no hyphens
# and no version nibble. A client that validates it against a UUID pattern
# because of what it is called rejects every real identifier, and a database
# column typed uuid cannot hold one.
#
# **Eighty-six fields on one record**, returned in full by a listing that takes
# one parameter -- `tag` -- and no limit, no page, no cursor and no total. An
# instance with two hundred applications answers two hundred eighty-six-field
# records, every time.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Coolify Cloud requires an
#     account and has no anonymous surface.
#   - Applications, listed and fetched. 192 paths is a platform: services,
#     databases, servers, projects, teams, deployments, private keys and the
#     whole scheduled-task surface each want their own evidence.
#   - The secret-shaped fields are served with obvious placeholders, never
#     plausible values. What is being reproduced is that the keys are there on
#     a response, which is the finding; inventing a realistic-looking password
#     would make the fixture worth redacting.
#   - Twelve of the eighty-six fields are modelled. The rest are real and
#     omitted, so this Recipe under-states how much a listing carries.

recipe: coolify
capability: hosting
version: 0.1.0

upstream:
  api: "v1"
  docs: https://coolify.io/docs/api-reference/authorization
  spec: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
  spec_hash: e4f3a8b237329686588ef23e97ca096306bbbc34e43bf7432e2fb224b4a5475b
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - "1|cauldronCoolifyToken000000000000000000"
  absent_error: unauthenticated
  # A token that is present and wrong. Not a 401 -- see the header.
  rejected_error: invalid_token

responses:
  list:
    # A bare array of every application, with no envelope and no total.
    style: bare
  error:
    style: flat
    message_field: message

resources:
  application:
    id:
      # Not a UUID, despite the name. Coolify's identifiers are 24-character
      # lowercase alphanumeric strings -- k4o8sw0kow4c8c0soo4k0go8 -- with no
      # hyphens and no version nibble. A client that validates the field
      # against a UUID pattern because of what it is called rejects every real
      # one, and a database column typed uuid cannot store them.
      style: opaque
      field: uuid
    fields:
      # "The application identifier in the database." Exposed on the wire as
      # `id`, and no path takes it.
      database_id:
        type: number
        as: id
      name:
        type: string
        required: true
      description:
        type: string
      fqdn:
        type: string
      status:
        type: string
        default: "running:healthy"
      build_pack:
        type: string
        default: nixpacks
      git_repository:
        type: string
      git_branch:
        type: string
        default: main
      # A string, not an array of numbers.
      ports_exposes:
        type: string
        default: "3000"
      is_http_basic_auth_enabled:
        type: boolean
        default: false
      http_basic_auth_username:
        type: string
      # Declared on the response schema with no writeOnly, in a document that
      # uses writeOnly nowhere.
      http_basic_auth_password:
        type: string
      manual_webhook_secret_github:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /api/v1/applications
    resource: application
    operation: list
    pagination:
      # None. One parameter -- tag -- and nothing that bounds the response.
      style: none
    filters:
      - field: name
        param: tag

  - method: GET
    path: /api/v1/applications/{id}
    resource: application
    operation: get
    not_found: not_found

  # One of five creation endpoints, chosen by where the code comes from. There
  # is no POST /applications: this is the finding served rather than described.
  - method: POST
    path: /api/v1/applications/dockerimage
    resource: application
    operation: create
    status: 201

errors:
  unauthenticated:
    status: 401
    message: "Unauthenticated."
  # A wrong token, which is a 400 here and a 401 almost everywhere else.
  invalid_token:
    status: 400
    message: "Invalid token."
  not_found:
    status: 404
    message: "Resource not found."
  validation:
    status: 422
    message: "Validation error."
    fields:
      # Laravel's shape: a map of field name to an array of sentences.
      errors:
        name:
          - "The name field is required."
  rate_limit:
    status: 429
    message: "Rate limit exceeded."
    headers:
      # Declared on the 429 in the document, with an example of 60.
      Retry-After: "60"

fixtures:
  empty:
    application: []

  instance:
    application:
      - uuid: k4o8sw0kow4c8c0soo4k0go8
        database_id: 12
        name: docs
        description: The public documentation site.
        fqdn: https://docs.example.com
        status: "running:healthy"
        build_pack: nixpacks
        git_repository: https://github.com/example/docs
        git_branch: main
        ports_exposes: "3000"
        is_http_basic_auth_enabled: false
        http_basic_auth_username: null
        # Null here, because basic auth is off. The key is still declared on
        # the response schema.
        http_basic_auth_password: null
        manual_webhook_secret_github: null
        created_at: "2026-03-02T11:00:00.000000Z"
        updated_at: "2026-09-01T07:41:00.000000Z"
      - uuid: g0ck8o4wsokgw40s8k0088og
        database_id: 13
        name: staging
        description: The staging environment, behind basic auth.
        fqdn: https://staging.example.com
        status: "running:unhealthy"
        build_pack: dockerfile
        git_repository: https://github.com/example/app
        git_branch: develop
        # Two ports in one string, which is the shape the schema declares.
        ports_exposes: "3000,9229"
        is_http_basic_auth_enabled: true
        http_basic_auth_username: preview
        # An obvious placeholder, never a plausible value: what is being
        # reproduced is that the key is present on a listing response, not a
        # credential worth having.
        http_basic_auth_password: PLACEHOLDER-NOT-A-SECRET
        manual_webhook_secret_github: PLACEHOLDER-NOT-A-SECRET
        created_at: "2026-05-19T15:22:00.000000Z"
        updated_at: "2026-09-04T18:03:00.000000Z"

conformance:
  - name: a listing carries the fields a document with no writeOnly declares
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        # writeOnly appears zero times in this 192-path document, and the
        # Application schema declares a password and four webhook secrets.
        # So a generated client's response type has these on it, and anything
        # logging or caching a listing handles them.
        #
        # The value here is a placeholder. The finding is the key.
        '[1].http_basic_auth_password': PLACEHOLDER-NOT-A-SECRET
        '[1].manual_webhook_secret_github': PLACEHOLDER-NOT-A-SECRET
        '[1].http_basic_auth_username': preview
        '[1].is_http_basic_auth_enabled': true

  - name: the same keys are present and null when the feature is off
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        # Nullable, so the key is there either way -- which is why a client
        # cannot tell "this application has no password" from "the server
        # redacted it".
        '[0].http_basic_auth_password': null
        '[0].is_http_basic_auth_enabled': false

  - name: ports are a comma-separated string, not an array
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        # type: string in the schema, with no format and no pattern, so the
        # separator is a convention a caller has to know. Reading a port means
        # splitting; writing one means joining.
        '[1].ports_exposes': "3000,9229"
        '[0].ports_exposes': "3000"

  - name: two identifiers, and the path takes the uuid
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications/k4o8sw0kow4c8c0soo4k0go8
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        uuid: k4o8sw0kow4c8c0soo4k0go8
        # "The application identifier in the database", exposed and addressing
        # nothing.
        id: 12
        name: docs
        git_branch: main
        description: The public documentation site.
        # The domain the application answers on, nullable, and one field for
        # what the schema's own description calls "the application domains" --
        # plural, in a string.
        fqdn: https://docs.example.com
        git_repository: https://github.com/example/docs
        created_at: "2026-03-02T11:00:00.000000Z"
        updated_at: "2026-09-01T07:41:00.000000Z"

  - name: fetching by the database identifier finds nothing
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications/12
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 404
      body:
        message: "Resource not found."

  - name: the status is a compound string, not a state
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        # Two facts joined by a colon inside one untyped string: whether it is
        # running, and whether its health check passes. No enum declares
        # either half, so a client comparing to "running" never matches.
        '[0].status': "running:healthy"
        '[1].status': "running:unhealthy"
        # And the build pack, which IS an enum: nixpacks, railpack, static,
        # dockerfile, dockercompose.
        '[1].build_pack': dockerfile

  - name: creating an application is one of five paths, not POST on the collection
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: POST
      # /applications has a GET and nothing else. The five creates are
      # /public, /private-github-app, /private-deploy-key, /dockerfile and
      # this one, all answering the same shape.
      path: /api/v1/applications/dockerimage
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
      json:
        name: cache
        ports_exposes: "6379"
    expect:
      status: 201
      body:
        name: cache
        ports_exposes: "6379"
        # The defaults the server fills in, which the request did not send.
        build_pack: nixpacks
        git_branch: main
        is_http_basic_auth_enabled: false

  - name: no credential is 401 and a wrong one is 400
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthenticated."

  - name: a rejected token is a 400, which no retry path fires on
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer not-a-real-token
    expect:
      # The document's own reusable 400 is "Invalid token." So an expired
      # credential arrives as the status every client treats as "my request
      # was malformed, do not retry", and a refresh-on-401 path never fires.
      status: 400
      body:
        message: "Invalid token."

  - name: "a validation failure is a map of field to sentences"
    source: "https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json"
    arm: validation
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 422
      body:
        message: "Validation error."
        # Laravel's shape: keyed by field name, and every value an array even
        # when there is one sentence in it.
        'errors.name[0]': "The name field is required."

  - name: "the rate limit says how long to wait"
    source: "https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json"
    arm: rate_limit
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 429
      headers:
        # Declared on the 429 in the document, which most providers modelled
        # here do not do.
        Retry-After: "60"
      body:
        message: "Rate limit exceeded."

  - name: the only listing parameter filters by tag
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      query:
        # The whole of what a listing takes. No limit, no page, no cursor, no
        # total -- so an instance with two hundred applications answers two
        # hundred eighty-six-field records and there is no way to ask for
        # fewer.
        tag: staging
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      body:
        '[0].name': staging
      absent:
        - '[1]'

  - name: the identifier is called uuid and is not one
    source: https://raw.githubusercontent.com/coollabsio/coolify/main/openapi.json
    fixture: instance
    request:
      method: GET
      path: /api/v1/applications
      headers:
        Authorization: Bearer 1|cauldronCoolifyToken000000000000000000
    expect:
      status: 200
      matches:
        # Twenty-four lowercase alphanumeric characters. No hyphens, no
        # version nibble, nothing a UUID validator accepts.
        '[0].uuid': '^[a-z0-9]{24}$'
      absent:
        # And there is no separately-named identifier that IS a uuid.
        - '[0].guid'
