# UK Carbon Intensity Recipe for Cauldron
#
# A path that does not exist answers 200, and the body says 400.
#
#   GET /nosuchpath
#   HTTP/1.1 200 OK
#   {"error": {"code": "400 Bad Request",
#              "message": "Please enter a valid path e.g. /intensity/"}}
#
# The status line says the request succeeded and the body says it did not, so
# `response.ok` is true for a URL the API does not have. And the code is not a
# code: it is a status line, as a string, with the number and the reason phrase
# in one field -- so a client comparing `error.code === 400` compares a number
# to "400 Bad Request" and gets false.
#
# A date it cannot parse, meanwhile, answers a real 400 with the same body. Same
# shape, two status codes, and which one arrives depends on which part of the
# request was wrong.
#
# **And the same fuels are named two ways on two endpoints.** /generation calls
# them `"gas"`, `"imports"`, `"nuclear"` -- lowercase, one word. /intensity
# /factors calls them `"Gas (Combined Cycle)"`, `"Gas (Open Cycle)"`, `"Dutch
# Imports"`, `"French Imports"`, `"Irish Imports"` -- capitalised, spaced,
# parenthesised, and split finer. Neither vocabulary is a key of the other, so
# joining a fuel's share to its emissions factor needs a mapping the API does
# not publish.
#
# Written against the live API rather than a document: every case below was
# checked against api.carbonintensity.org.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The timestamps have no seconds. "2026-08-30T10:00Z" is valid ISO 8601
#      and is rejected by parsers that expect the seconds field, and the API's
#      own error message asks for exactly that form: "YYYY-MM-DDThh:mmZ".
#   2. Every half hour carries a forecast and an actual and a word. forecast is
#      84, actual is 79, and index is "low" -- two numbers and a category,
#      where the category is derived from one of the numbers by a threshold
#      nothing in the response states.
#   3. The emissions factors are human labels. "Gas (Combined Cycle)": 394 uses
#      a capitalised, spaced, parenthesised string as a JSON key, so reading it
#      needs a subscript in every language and the key cannot be a variable
#      name anywhere.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The line endings are not reproduced. The successful bodies are
#     pretty-printed with CRLF and a trailing space after each opening brace;
#     the failures use a bare carriage return, with no line feed at all --
#     classic-Mac line endings, in JSON, in 2026. Cauldron's encoder writes its
#     own formatting, so this is recorded here rather than served.
#   - Key order is not reproduced either, and it is worth recording: in
#     generationmix, most entries are {"perc": ..., "fuel": ...} and the two
#     whose percentage is zero are {"fuel": ..., "perc": ...}. Order carries no
#     meaning in JSON, and it shows two code paths.
#   - The grid moves. What is served is what was recorded on the date shown.

recipe: carbonintensity
capability: analytics
version: 0.1.0

upstream:
  api: carbonintensity
  docs: https://carbon-intensity.github.io/api-definitions/

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: data
  resource:
    style: wrapped
    key: data
  error:
    style: nested
    key: error
    message_field: message
    code_field: code

resources:
  period:
    id:
      style: opaque
      # The half hour it starts, with no seconds in it.
      field: from
    fields:
      to:
        type: string
      # Two numbers and a category.
      intensity:
        type: map

  mix:
    id:
      style: opaque
      field: from
    fields:
      to:
        type: string
      generationmix:
        type: list

  factor:
    id:
      style: opaque
      field: "-"
    fields:
      # Capitalised, spaced and parenthesised JSON keys.
      Biomass:
        type: integer
      Coal:
        type: integer
      "Dutch Imports":
        type: integer
      "French Imports":
        type: integer
      "Gas (Combined Cycle)":
        type: integer
      "Gas (Open Cycle)":
        type: integer
      Hydro:
        type: integer
      "Irish Imports":
        type: integer
      Nuclear:
        type: integer
      Oil:
        type: integer
      Other:
        type: integer
      "Pumped Storage":
        type: integer
      Solar:
        type: integer
      Wind:
        type: integer

routes:
  - method: GET
    path: /intensity
    resource: period
    operation: list

    pagination:
      # Struck live on 2026-09-05: this answers one reading in a data array
      # of one, and pages by nothing. The National Grid's intensity
      # endpoints return the current window, not a collection somebody
      # walks.
      style: none
  - method: GET
    path: /generation
    resource: mix
    operation: get
    id_from: auth

  - method: GET
    path: /intensity/factors
    resource: factor
    operation: list

    pagination:
      # Struck live on 2026-09-05: this answers one reading in a data array
      # of one, and pages by nothing. The National Grid's intensity
      # endpoints return the current window, not a collection somebody
      # walks.
      style: none
  # A path the API does not have, answered with 200 and a body that says 400.
  # The status is on the error rather than here: a route's own status does not
  # reach a failure it names, so declaring it twice would leave one of them
  # unreachable.
  - method: GET
    path: /nosuchpath
    error: invalid_path

  # A date it cannot parse, answered with a real 400 and the same shape.
  - method: GET
    path: /intensity/notadate
    error: invalid_datetime

errors:
  invalid_path:
    # The status the request really gets, which is not the one the body claims
    # two lines below.
    status: 200
    # A status line, as a string, in a field called code.
    code: 400 Bad Request
    message: Please enter a valid path e.g. /intensity/

  invalid_datetime:
    status: 400
    code: 400 Bad Request
    # The API asking for the form it also sends: hours and minutes, no seconds.
    message: "Please enter a valid datetime in ISO8601 format YYYY-MM-DDThh:mmZ e.g. /intensity/2017-08-25T15:30Z"

fixtures:
  empty: {}

  grid:
    period:
      # Half an hour, named by its start, with no seconds anywhere.
      - id: "2026-08-30T10:00Z"
        from: "2026-08-30T10:00Z"
        to: "2026-08-30T10:30Z"
        intensity:
          forecast: 84
          actual: 79
          # A category, derived from a number by a threshold the response does
          # not state.
          index: low

    mix:
      - id: "2026-08-30T10:00Z"
        from: "2026-08-30T10:00Z"
        to: "2026-08-30T10:30Z"
        generationmix:
          # Lowercase, one word each -- and none of these is a key of the
          # factors below.
          - perc: 12.9
            fuel: biomass
          - perc: 0
            fuel: coal
          - perc: 22.7
            fuel: imports
          - perc: 10.2
            fuel: gas
          - perc: 19.1
            fuel: nuclear
          - perc: 0
            fuel: other
          - perc: 0
            fuel: hydro
          - perc: 22.5
            fuel: solar
          - perc: 12.6
            fuel: wind

    factor:
      - id: factors
        Biomass: 120
        Coal: 937
        # Three separate imports, where generation has one.
        "Dutch Imports": 474
        "French Imports": 53
        "Irish Imports": 458
        # Two gases, where generation has one.
        "Gas (Combined Cycle)": 394
        "Gas (Open Cycle)": 651
        Hydro: 0
        Nuclear: 0
        Oil: 935
        Other: 300
        "Pumped Storage": 0
        Solar: 0
        Wind: 0

conformance:
  - name: a path that does not exist answers 200 and says 400
    source: https://api.carbonintensity.org.uk/nosuchpath
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /nosuchpath
    expect:
      # response.ok is true for a URL the API does not have.
      status: 200
      body:
        # Not a code: a status line, as a string, so error.code === 400 is
        # false and error.code === "400" is false too.
        "error.code": 400 Bad Request
        "error.message": Please enter a valid path e.g. /intensity/

  - name: and a date it cannot parse answers a real 400 with the same shape
    source: https://api.carbonintensity.org.uk/intensity/notadate
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /intensity/notadate
    expect:
      # Same body shape, two status codes, and which one arrives depends on
      # which part of the request was wrong.
      status: 400
      body:
        "error.code": 400 Bad Request
        # The API asking for the form it also sends: no seconds.
        "error.message": "Please enter a valid datetime in ISO8601 format YYYY-MM-DDThh:mmZ e.g. /intensity/2017-08-25T15:30Z"

  - name: the timestamps have no seconds
    source: https://api.carbonintensity.org.uk/intensity
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /intensity
    expect:
      status: 200
      body:
        # Valid ISO 8601, and rejected by parsers that expect the seconds
        # field -- which is the form the API's own error message asks for.
        "data[0].from": "2026-08-30T10:00Z"
        "data[0].to": "2026-08-30T10:30Z"

  - name: two numbers and a category
    source: https://api.carbonintensity.org.uk/intensity
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /intensity
    expect:
      status: 200
      body:
        "data[0].intensity.forecast": 84
        "data[0].intensity.actual": 79
        # Derived from one of the numbers by a threshold nothing states.
        "data[0].intensity.index": low

  - name: the fuels are lowercase here
    source: https://api.carbonintensity.org.uk/generation
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /generation
    expect:
      status: 200
      body:
        # One word each, and one entry for all imports.
        "data.generationmix[0].fuel": biomass
        "data.generationmix[0].perc": 12.9
        "data.generationmix[2].fuel": imports
        "data.generationmix[2].perc": 22.7
        "data.generationmix[3].fuel": gas
        "data.generationmix[3].perc": 10.2

  - name: and human labels there, split finer
    source: https://api.carbonintensity.org.uk/intensity/factors
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /intensity/factors
    expect:
      status: 200
      body:
        # Capitalised, spaced and parenthesised JSON keys, so reading one needs
        # a subscript in every language.
        "data[0].Gas (Combined Cycle)": 394
        "data[0].Gas (Open Cycle)": 651
        # Three imports where generation has one, and none of these names
        # appears there.
        "data[0].Dutch Imports": 474
        "data[0].French Imports": 53
        "data[0].Irish Imports": 458
        "data[0].Biomass": 120

  - name: the zero-carbon fuels are zero and the coal is not
    source: https://api.carbonintensity.org.uk/intensity/factors
    verified: "2026-08-30"
    fixture: grid
    request:
      method: GET
      path: /intensity/factors
    expect:
      status: 200
      body:
        # Nuclear, hydro, solar and wind at zero, and pumped storage too --
        # which is a store rather than a source, and is counted as if it were
        # free.
        "data[0].Nuclear": 0
        "data[0].Hydro": 0
        "data[0].Solar": 0
        "data[0].Wind": 0
        "data[0].Pumped Storage": 0
        "data[0].Coal": 937
        "data[0].Oil": 935

  # The names. This Recipe declares 1 field(s) on a factor that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a factor carries the field names this Recipe declares"
    source: "https://api.carbonintensity.org.uk/intensity/factors"
    fixture: grid
    request:
      method: GET
      path: "/intensity/factors"
    expect:
      status: 200
      body:
        "data[0].Other": 300

