# Airship Recipe for Cauldron
#
# Written against Airship's REST API reference at
# www.airship.com/docs/developer/rest-api/ua and struck live against
# go.urbanairship.com on 2026-09-09 with no credential and with a deliberately
# invalid one.
#
# **The challenge header advertises whichever scheme you already tried.**
# Struck live:
#
#   GET /api/channels/     (no credential)
#   401  WWW-Authenticate: Basic realm="API"
#
#   GET /api/channels/     Authorization: Bearer notreal
#   401  WWW-Authenticate: Bearer realm="API"
#
# This endpoint accepts three schemes -- its own reference lists "Basic Auth
# (Master), Bearer Token, OAuth 2.0", and the tags endpoint next to it lists
# four. RFC 9110 lets a 401 carry several challenges precisely so a server can
# say which ones it takes. Airship sends exactly one, and picks it by echoing
# what the caller already sent.
#
# So the header exists to tell you which schemes are available, and the only
# way to learn that Bearer is available is to have already guessed it. A caller
# holding an OAuth token and sending nothing is told to use Basic.
#
# It is the second challenge-header fault in this batch and the opposite of
# [cloudamqp](../cloudamqp), which sends no challenge at all to a caller with
# no credential and a correct one to a caller with a wrong credential. One
# withholds the header from the caller who needs it; this one sends it and
# fills it in wrong.
#
# **The failure is JSON labelled text/plain, and the reference says so.**
#
#   401  Content-Type: text/plain
#   {"ok":false,"error":"Unauthorized","error_code":40101}
#
# The documentation's own response table for this operation gives the 401 a
# body of `Content-Type: text/plain`, so the mislabel is written down rather
# than accidental. It is the fifth content-type fault in this collection, after
# Statsig sending none, Wrike serving text over JSON, Maxio serving JSON over
# text and Affinity serving HTML over text.
#
# **`error_code` is the HTTP status with two digits stuck on the end.** 40101
# is 401 followed by 01. So the machine-readable code is not independent of the
# status; it contains it, and a client switching on `error_code` is switching
# on a number whose leading digits it already had.
#
# **Three content types across three responses, and the two JSON ones
# disagree.** The reference gives 200 a body of
# `application/vnd.urbanairship+json; version=3`, the 404 a body of
# `application/vnd.urbanairship+json` with no version parameter at all, and the
# 401 `text/plain`. So the version is part of the contract on success and
# absent on failure.
#
# **And the vendor media type names a company that was renamed.**
# `urbanairship` is Urban Airship, which became Airship; the host in every
# example is go.urbanairship.com. The fourth rename survivor in this
# collection, after [bird](../bird) authenticating with MessageBird's
# `AccessKey`, [maxio](../maxio) served from chargify.com and
# [terraformcloud](../terraformcloud) at app.terraform.io -- and the first
# where the old name is baked into a media type, which is the hardest of the
# four to change, because changing it breaks every client that negotiates on it.
#
# **A custom header names the field to read.** `Data-Attribute: channels` on
# the listing and `Data-Attribute: channel` on a single lookup. The response
# says, out of band, which key in the body holds the payload -- which is a
# real answer to the envelope problem and one nothing else here does.
#
# **The next page arrives twice, and the reference contradicts itself about
# one of them.** `next_page` is a full URL in the body, and a `Link` header
# carries the same address with `rel=next`. The response-header table describes
# `Link` as "Provides the URL to the *current* page of results", and the worked
# example three paragraphs below it shows `rel=next`. Both cannot be right.
#
# **Two examples on one page name the same things differently.** The
# single-channel lookup shows `"type": "open"` and `"address":
# "example@example.com"`; the listing shows `"device_type": "android"` and
# `"push_address": "FE66..."`. Platform and address, under two names each, in
# two examples of the same resource on the same documentation page.

recipe: airship
capability: push
version: 0.1.0

upstream:
  api: "3"
  docs: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
  # No spec: Airship publishes a rendered reference site.

auth:
  # The app key as the username and the master secret as the password, which
  # is the "Basic Auth (Master)" this operation's reference names first.
  scheme: basic
  keys:
    - cauldr0nairsh1papkey00
  absent_error: unauthorized
  rejected_error: unauthorized
  # A Bearer prefix on an API taking Basic is unreadable rather than wrong --
  # and it is the request that makes the challenge header say Bearer, which
  # is the whole finding.
  malformed_error: unauthorized_bearer
  # An unrouted path answers the web server's HTML 404 with a credential in
  # hand, so the router runs before the credential check.
  after_routing: true

responses:
  list:
    style: wrapped
    key: channels
    # A whole URL rather than a token, so a client concatenating it onto a
    # base address builds one that does not exist.
    cursor_field: next_page
    cursor_url: absolute
    # And the same address again in a Link header, which the reference's own
    # response-header table describes as the current page.
    link_header: true
    fields:
      # A boolean success flag beside the HTTP status, on every response.
      ok: true
  error:
    style: flat
    message_field: error
    code_field: error_code

resources:
  channel:
    id:
      field: channel_id
      style: uuid
    fields:
      # The listing's name for the platform. The single-channel example on the
      # same page calls it `type`.
      device_type:
        type: string
      # And the listing's name for the address, which that example calls
      # `address`.
      push_address:
        type: string
      opt_in:
        type: boolean
      installed:
        type: boolean
      background:
        type: boolean
      created:
        type: string
      last_registration:
        type: string
      named_user_id:
      tags:
        type: list

routes:
  - method: GET
    path: /api/channels
    resource: channel
    operation: list
    pagination:
      style: cursor
      limit: 1000
      max_limit: 1000
      limit_param: limit
      cursor_param: start

errors:
  unauthorized:
    status: 401
    # 401 with two digits stuck on the end, so the code contains the status.
    code: "40101"
    message: Unauthorized
    headers:
      # JSON under a header that says text, which this API's own reference
      # writes into its response table.
      Content-Type: text/plain
      # One challenge, on an endpoint that accepts three schemes, chosen by
      # what the caller did not send.
      WWW-Authenticate: Basic realm="API"
    fields:
      ok: false

  unauthorized_bearer:
    status: 401
    code: "40101"
    message: Unauthorized
    headers:
      Content-Type: text/plain
      # The same failure, and the challenge now names Bearer -- because the
      # caller used Bearer. The header echoes rather than instructs.
      WWW-Authenticate: Bearer realm="API"
    fields:
      ok: false

  unknown_route:
    status: 404
    # Not the vendor type the reference gives a documented 404: an unrouted
    # path never reaches the application, so the web server answers in HTML.
    style: text
    message: "Error 404"
    headers:
      Content-Type: text/html

fixtures:
  empty:
    channel: []

  app:
    channel:
      - channel_id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        device_type: android
        push_address: FE66489F304DC75B8D6E8200DFF8A456E8DAEACEC428B427E9518741C92C6660
        opt_in: true
        installed: true
        background: true
        created: "2020-03-06T18:52:59"
        last_registration: "2020-10-07T21:28:35"
        named_user_id: some_id_that_maps_to_your_systems
        tags:
          - loyalty
      - channel_id: b8f9b663-0a3b-cf45-587a-be880946e881
        device_type: ios
        push_address: 2A5B8C1D4E7F0A3B6C9D2E5F8A1B4C7D0E3F6A9B2C5D8E1F4A7B0C3D6E9F2A5B
        # Uninstalled and still in the listing, with opt_in false -- two
        # booleans that a client counting reachable devices has to combine.
        opt_in: false
        installed: false
        background: false
        created: "2021-11-19T09:14:02"
        last_registration: "2023-02-28T07:45:11"
        tags: []

conformance:
  - name: a missing credential is offered Basic
    source: https://go.urbanairship.com/api/channels/
    verified: "2026-09-09"
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers: {}
    expect:
      status: 401
      headers:
        # One challenge, on an endpoint whose reference lists three schemes.
        WWW-Authenticate: Basic realm="API"

  - name: sending Bearer changes what the challenge advertises
    source: https://go.urbanairship.com/api/channels/
    verified: "2026-09-09"
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      headers:
        # The header exists to say which schemes are available and instead
        # repeats the one the caller already chose.
        WWW-Authenticate: Bearer realm="API"

  - name: the failure is JSON labelled text/plain
    source: https://go.urbanairship.com/api/channels/
    verified: "2026-09-09"
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers: {}
    expect:
      status: 401
      headers:
        # Written into the reference's own response table for this operation,
        # so the mislabel is documented rather than accidental.
        Content-Type: text/plain
      body:
        error: Unauthorized
        ok: false

  - name: the error code is the status with two digits appended
    source: https://go.urbanairship.com/api/channels/
    verified: "2026-09-09"
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers: {}
    expect:
      status: 401
      body:
        # 401 followed by 01, so the code a client branches on contains the
        # status it already had.
        error_code: 40101

  - name: an unrouted path never reaches the application
    source: https://go.urbanairship.com/api/cauldron-nope
    verified: "2026-09-09"
    fixture: app
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      headers:
        # HTML, where the reference gives a documented 404 the vendor JSON
        # type -- so there are two different 404s on this host.
        Content-Type: text/html
      body_matches: 'Error 404'

  - name: channels are wrapped beside a boolean called ok
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        # A success flag in the body beside the status on the wire.
        ok: true
        'channels[0].channel_id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        'channels[0].device_type': android

  - name: the listing names platform and address its own way
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        # device_type and push_address here; the single-channel example on the
        # same documentation page calls them type and address.
        'channels[1].device_type': ios
        'channels[1].push_address': 2A5B8C1D4E7F0A3B6C9D2E5F8A1B4C7D0E3F6A9B2C5D8E1F4A7B0C3D6E9F2A5B

  - name: three booleans describe whether a device can be reached
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        # opt_in, installed and background, and a client counting reachable
        # devices has to decide which combination counts.
        'channels[0].opt_in': true
        'channels[0].installed': true
        'channels[0].background': true
        'channels[1].opt_in': false
        'channels[1].installed': false

  - name: the timestamps carry no zone at all
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        # The reference's own examples are written this way: a T in the middle
        # and nothing after the seconds, so neither is RFC 3339.
        'channels[0].created': "2020-03-06T18:52:59"
        'channels[0].last_registration': "2020-10-07T21:28:35"

  - name: a channel with no named user omits the field
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        'channels[0].named_user_id': some_id_that_maps_to_your_systems
        'channels[0].tags[0]': loyalty
        'channels[1].tags': []
      absent:
        # So a client joining channels to your own user records has to handle
        # the key being missing rather than null.
        - 'channels[1].named_user_id'

  - name: the next page is a whole URL and arrives twice
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'channels[0].channel_id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
      matches:
        # In the body as an absolute address, and in a Link header the
        # reference's response table calls the current page while its own
        # example marks it rel=next.
        next_page: '^https?://'
      header_matches:
        Link: 'rel="?next"?'

  - name: channels page on start
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: app
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
      query:
        limit: "1"
        start: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
    expect:
      status: 200
      body:
        'channels[0].channel_id': b8f9b663-0a3b-cf45-587a-be880946e881

  - name: an app with no channels answers an empty array
    source: https://www.airship.com/docs/developer/rest-api/ua/operations/channels/
    fixture: empty
    request:
      method: GET
      path: /api/channels
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJzaDFwYXBrZXkwMDpjYXVsZHJvbg=="
    expect:
      status: 200
      body:
        channels: []
        ok: true
