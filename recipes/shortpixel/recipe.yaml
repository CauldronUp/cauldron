# ShortPixel Recipe for Cauldron
#
# The image reducer, read from ShortPixel's published API reference at
# shortpixel.com/api-docs and from its own PHP client, and struck live against
# api.shortpixel.com on 2026-09-13 with no key, with a wrong key, and on a path
# that does not exist.
#
# **Every refusal is an HTTP 200.** Struck live, headers and all:
#
#   HTTP/1.1 200 OK
#   content-type: text/html; charset=UTF-8
#
#   {
#       "Status": {
#           "Code": -401,
#           "Message": "Missing API key. You need an API key to use this service."
#       }
#   }
#
# Two hundred OK for a request that was refused, a JSON body labelled
# `text/html`, and the real status in the body as a negative number. A client
# that checks `response.ok` sees success; a client that checks the content type
# before parsing sees a web page.
#
# **The negative numbers are HTTP status codes, and they do not mean what they
# say.** -401, -402, -403 and -404 are documented as: invalid key, wrong key,
# quota exceeded, and "the maximum number of URLs in the optimization queue
# reached". So -403 is a billing state and -404 is back-pressure -- borrowed
# numbers with the meanings left behind. Beside them sit -102 through -117,
# -201 through -207 and -301 through -306, which resemble nothing at all, so
# one number space is half borrowed and half invented and a reader cannot tell
# which half a code came from without the table.
#
# **And the documented sentence for -401 is not the sentence -401 sends.** The
# reference gives "Invalid API key. Please check that the API key is the one
# provided to you." Live, an absent key answers "Missing API key. You need an
# API key to use this service." One code, two sentences, and the published one
# is not the one you get.
#
# **Every size field spells "Lossless" wrong and every URL field spells it
# right.** From the reference, on one record:
#
#   LosslessURL       LoselessSize
#   WebPLosslessURL   WebPLoselessSize
#   AVIFLosslessURL   AVIFLoselessSize
#
# Three families, and in all three the URL is correct and the size has lost an
# `s` and an `l`. A typo that consistent was copied rather than slipped, and a
# client cannot spell one rule for both halves of the pair.
#
# **The AVIF lossy size carries WebP's P.** The reference lists `WebPLossySize`
# and `AVIFPLossySize` -- an `AVIFP` that is not a format, next to
# `AVIFLossyURL` and `AVIFLoselessSize` that are not spelled that way.
#
# **"NA" is the absent value.** A URL that was not requested and a size that was
# not produced both come back as the two-character string `NA`, so a size field
# holds a number or a word and a client comparing it to zero has to check first.
#
# **A record names the machine that served it.** `Server` is "The server in our
# network that did the file processing. Used for debugging purposes." -- an
# internal hostname on the response, and a load balancer cookie
# (`ShortPixel-LB2`) beside it on a stateless API.

recipe: shortpixel
capability: media
version: 0.1.0

upstream:
  api: v2
  docs: https://shortpixel.com/api-docs
  # No spec: ShortPixel documents this API as an HTML reference page with a
  # table of codes and a PHP snippet. There is no machine-readable description
  # at any address this Recipe could find.

auth:
  # The key travels in the JSON body, beside the images.
  scheme: body
  param: key
  keys:
    - cauldr0nf1xturek3y0000
  unentitled:
    - cauldr0nemptyquota0000
  absent_error: missing_api_key
  rejected_error: wrong_api_key
  unentitled_error: quota_exceeded
  after_routing: true

responses:
  list:
    # A bare array of items, one per URL sent.
    style: bare
  error:
    style: nested
    key: Status
    message_field: Message
    # A negative HTTP status code, in the body of a 200.
    code_field: Code
    code_type: number

resources:
  image:
    id:
      # The only handle on an item is the URL you sent, echoed back.
      field: OriginalURL
      style: opaque
      length: 40
    fields:
      Code:
        type: number
        in: Status
      Message:
        type: string
        in: Status
      # Correctly spelled, on the URL.
      LossyURL:
        type: string
      LosslessURL:
        type: string
      WebPLossyURL:
        type: string
      WebPLosslessURL:
        type: string
      AVIFLossyURL:
        type: string
      AVIFLosslessURL:
        type: string
      OriginalSize:
        type: number
      LossySize:
        type: number
      # And misspelled, on the size, in all three families.
      LoselessSize:
      WebPLossySize:
      WebPLoselessSize:
      # An AVIFP that is not a format.
      AVIFPLossySize:
      AVIFLoselessSize:
      PercentImprovement:
        type: number
      Timestamp:
        type: string
      # An internal hostname, on the response, for debugging.
      Server:
        type: string

routes:
  - method: POST
    path: /v2/reducer.php
    resource: image
    operation: list
    pagination:
      style: none

  - method: POST
    # The upload endpoint next door, refusing the same key the same way.
    path: /v2/post-reducer.php
    resource: image
    operation: list
    pagination:
      style: none

errors:
  missing_api_key:
    # Two hundred OK, for a request that was refused.
    status: 200
    code: "-401"
    # And not the sentence the reference prints for -401, which is "Invalid API
    # key. Please check that the API key is the one provided to you."
    message: Missing API key. You need an API key to use this service.
    headers:
      Content-Type: text/html; charset=UTF-8
      # Session affinity, pushed onto a stateless client.
      Set-Cookie: ShortPixel-LB2=ShortPixel_spfe02; path=/

  wrong_api_key:
    status: 200
    # Payment Required's number, for a key that is simply wrong.
    code: "-402"
    message: Wrong API Key.
    headers:
      Content-Type: text/html; charset=UTF-8
      Set-Cookie: ShortPixel-LB2=ShortPixel_spfe02; path=/

  quota_exceeded:
    status: 200
    # Forbidden's number, for a billing state.
    code: "-403"
    message: Quota exceeded. You need to subscribe to a larger plan or to buy an additional one time package to increase your quota.
    headers:
      Content-Type: text/html; charset=UTF-8
      Set-Cookie: ShortPixel-LB2=ShortPixel_spfe02; path=/

fixtures:
  empty:
    image: []

  batch:
    image:
      - OriginalURL: https://example.com/photo.png
        Code: 2
        Message: Success
        LossyURL: https://api.shortpixel.com/dl/photo-lossy.png
        # Not requested, so the two-character string that stands for absent.
        LosslessURL: "NA"
        WebPLossyURL: https://api.shortpixel.com/dl/photo-lossy.webp
        WebPLosslessURL: "NA"
        AVIFLossyURL: "NA"
        AVIFLosslessURL: "NA"
        OriginalSize: 482113
        LossySize: 118904
        # The same concept as LosslessURL above, short an s and an l.
        LoselessSize: "NA"
        WebPLossySize: 94220
        WebPLoselessSize: "NA"
        # WebP's P, on AVIF.
        AVIFPLossySize: "NA"
        AVIFLoselessSize: "NA"
        PercentImprovement: 75.34
        Timestamp: "2026-09-13 21:44:59"
        # The machine that did the work, named to the caller.
        Server: ShortPixel_spfe02
      - OriginalURL: https://example.com/diagram.png
        # Scheduled, not finished: the same array carries both states.
        Code: 1
        Message: Image scheduled for processing.
        LossyURL: "NA"
        LosslessURL: "NA"
        WebPLossyURL: "NA"
        WebPLosslessURL: "NA"
        AVIFLossyURL: "NA"
        AVIFLosslessURL: "NA"
        OriginalSize: 0
        LossySize: 0
        LoselessSize: "NA"
        WebPLossySize: "NA"
        WebPLoselessSize: "NA"
        AVIFPLossySize: "NA"
        AVIFLoselessSize: "NA"
        PercentImprovement: 0
        Timestamp: "2026-09-13 21:44:59"
        Server: ShortPixel_spfe02

conformance:
  - name: a refusal arrives as two hundred OK labelled text/html
    source: https://api.shortpixel.com/v2/reducer.php
    verified: "2026-09-13"
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json: {}
    expect:
      # The request was refused and this is the status line it came back on.
      status: 200
      headers:
        Content-Type: text/html; charset=UTF-8
      body:
        # The real status, as a negative number, in the body.
        Status.Code: -401
        # And not the sentence the published reference gives for -401.
        Status.Message: Missing API key. You need an API key to use this service.

  - name: a wrong key borrows the number for Payment Required
    source: https://api.shortpixel.com/v2/reducer.php
    verified: "2026-09-13"
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: notarealkey000000000000
        urllist:
          - https://example.com/photo.png
    expect:
      status: 200
      body:
        Status.Code: -402
        Status.Message: Wrong API Key.

  - name: the upload endpoint refuses the same key the same way
    source: https://api.shortpixel.com/v2/post-reducer.php
    verified: "2026-09-13"
    fixture: batch
    request:
      method: POST
      path: /v2/post-reducer.php
      json:
        key: notarealkey000000000000
    expect:
      status: 200
      body:
        Status.Code: -402
        Status.Message: Wrong API Key.

  - name: an exhausted quota borrows the number for Forbidden
    source: https://shortpixel.com/api-docs
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nemptyquota0000
        urllist:
          - https://example.com/photo.png
    expect:
      status: 200
      body:
        # A billing state, under the number for a permissions one.
        Status.Code: -403
        Status.Message: Quota exceeded. You need to subscribe to a larger plan or to buy an additional one time package to increase your quota.

  - name: the URL spells Lossless and the size does not
    source: https://shortpixel.com/api-docs
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nf1xturek3y0000
        urllist:
          - https://example.com/photo.png
    expect:
      status: 200
      body:
        # One record, one concept, two spellings.
        '[0].LosslessURL': "NA"
        '[0].LoselessSize': "NA"
        '[0].WebPLosslessURL': "NA"
        '[0].WebPLoselessSize': "NA"
        '[0].AVIFLosslessURL': "NA"
        '[0].AVIFLoselessSize': "NA"

  - name: the AVIF lossy size carries WebP's P
    source: https://shortpixel.com/api-docs
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nf1xturek3y0000
        urllist:
          - https://example.com/photo.png
    expect:
      status: 200
      body:
        # WebPLossySize, and then AVIFPLossySize beside AVIFLossyURL.
        '[0].WebPLossySize': 94220
        '[0].AVIFPLossySize': "NA"
        '[0].AVIFLossyURL': "NA"

  - name: a size field holds a number or the word NA
    source: https://shortpixel.com/api-docs
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nf1xturek3y0000
        urllist:
          - https://example.com/photo.png
    expect:
      status: 200
      body:
        '[0].OriginalSize': 482113
        '[0].LossySize': 118904
        '[0].PercentImprovement': 75.34
        '[0].LossyURL': https://api.shortpixel.com/dl/photo-lossy.png
        '[0].WebPLossyURL': https://api.shortpixel.com/dl/photo-lossy.webp

  - name: an item carries its own status and the machine that served it
    source: https://shortpixel.com/api-docs
    fixture: batch
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nf1xturek3y0000
        urllist:
          - https://example.com/photo.png
          - https://example.com/diagram.png
    expect:
      status: 200
      body:
        # Done and not-yet-done in one array, each item carrying the same
        # Status envelope the whole-request failures use.
        '[0].Status.Code': 2
        '[0].Status.Message': Success
        '[1].Status.Code': 1
        '[1].Status.Message': Image scheduled for processing.
        '[0].OriginalURL': https://example.com/photo.png
        '[0].Timestamp': "2026-09-13 21:44:59"
        # An internal hostname, on the response.
        '[0].Server': ShortPixel_spfe02

  - name: an empty request answers a bare empty array
    source: https://shortpixel.com/api-docs
    fixture: empty
    request:
      method: POST
      path: /v2/reducer.php
      json:
        key: cauldr0nf1xturek3y0000
        urllist: []
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
