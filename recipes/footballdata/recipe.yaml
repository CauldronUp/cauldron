# football-data.org Recipe for Cauldron
#
# football-data.org gates on X-Auth-Token, and the header's exact wording
# (docs.football-data.org/general/v4/lookup_tables.html, fetched
# 2026-09-02) is "X-Auth-Token: UR_TOKEN" -- no Bearer, no scheme, the raw
# token value and nothing else.
#
# **Missing and wrong are not the same failure, and they are not even the
# same status code.** Verified live, both against
# GET /v4/competitions/PL:
#
#   no header at all      -> 403 {"message":"The resource you are looking
#                             for is restricted and apparently not within
#                             your permissions. Please check your
#                             subscription.","errorCode":403}
#   X-Auth-Token: junk     -> 400 {"message":"Your API token is invalid.",
#                             "errorCode":400}
#
# Two different statuses, two different sentences, and the absent case reads
# like a permissions problem rather than a missing-credential one -- a
# caller who forgot the header entirely is told to check their subscription,
# which is true of nobody who has not even tried to authenticate yet.
#
# **Routing and method both resolve before either credential failure does.**
# An unrouted path answers 404 and a wrong method answers 405, both with no
# header sent at all:
#
#   GET   /v4/nosuchresource        -> 404 {"error":404}
#   PATCH /v4/competitions/PL       -> 405 {"message":"Method not allowed.
#                                       Use GET method only.","errorCode":405}
#
# both verified with zero credential presented, and the 404 case repeated
# with a junk token to confirm the credential is never consulted for it
# either -- byte-identical. That ordering is Fireworks' Recipe in this
# collection restated on a different host: route, then method, then
# credential, the reverse of the auth-first default most of this collection
# uses.
#
# **Two general endpoints work with no credential at all, and every scoped
# one this Recipe tried does not.** GET /v4/competitions -- the whole
# catalogue, no token, no header -- answered 200 with real data: 189
# competitions, X-Authenticated-Client: anonymous, and a quota this Recipe
# could watch move (X-Requests-Available: 49, X-RequestCounter-Reset: 86338,
# down from 86400 sixty-two seconds earlier). GET /v4/competitions/PL,
# scoped to one specific competition, refused the identical unauthenticated
# request with the 403 above -- and so did GET /v4/competitions/ACL, a
# competition tagged plan: TIER_FOUR in the very catalogue the anonymous
# call just returned, which rules out "this competition needs a paid tier"
# as the reason: every scoped competition this Recipe tried needed a
# credential, tier notwithstanding, while the unscoped list needed none.
# football-data.org's own policies page
# (docs.football-data.org/general/v4/policies.html) is the source for why:
# "Non-authenticated clients are allowed for 100 requests per 24 hours" --
# the anonymous allowance this Recipe's X-RequestCounter-Reset: 86400 (a day
# in seconds) confirms live -- against "Registered clients are allowed for
# 10 requests/minute in the free plan" for everything that actually needs a
# key.
#
# **A credential this Recipe does not hold breaks the free endpoint too.**
# GET /v4/competitions with "X-Auth-Token: junk" answered the same 400
# "Your API token is invalid." that the scoped route does -- so the
# allowance above is "send nothing and it works," not "send anything and it
# works." Sending a credential the provider does not recognise is refused
# even on the one route that never demanded one. That is served here as
# `public: when-absent`, which exempts a request presenting nothing and
# judges anything presented as the rest of the host would.
#
# The distinction exists because of this Recipe. The exemption was
# all-or-nothing when this was first written, and the wrong-token case had
# to be described in prose rather than asserted, because modelling this
# route with the unconditional mode would have waved a bad token through on
# the one route a caller is most likely to try first. FireHydrant's
# noauth/ping is the other reading and it was verified, not assumed:
# byte-identical with a junk bearer attached and with no header at all. Two
# providers, two meanings of open, and now two ways to say it.
#
# **The response-header table on football-data.org's own documentation page
# does not match the header name the wire sends.** Fetched and grepped
# directly from the raw page source rather than summarised: the lookup
# table names the field "X-RequestsAvailable", one compound word with no
# hyphen. Every live response this Recipe received sent "X-Requests-
# Available", hyphenated between Requests and Available. Grep the
# documentation for the string the header actually carries and it is not
# there.
#
# **The full match status vocabulary is eleven words, all of them
# documented, and it distinguishes exactly what this collection's group of
# three exists to ask about:**
#
#   SCHEDULED | TIMED | IN_PLAY | PAUSED | EXTRA_TIME | PENALTY_SHOOTOUT |
#   FINISHED | SUSPENDED | POSTPONED | CANCELLED | AWARDED
#
# quoted verbatim from the same lookup-tables page. Not-yet-started
# (SCHEDULED, TIMED), postponed and cancelled are three separate words, not
# one collapsed "not happening" value -- and suspended is a fourth, distinct
# from either. No worked JSON example on any football-data.org documentation
# page this Recipe could reach shows what score looks like on a SCHEDULED or
# TIMED match, though: the only complete Match object published anywhere in
# the docs (docs.football-data.org/general/v4/match.html) is a FINISHED one,
# quoted in full below. Whether fullTime.home is null, 0, or the key is
# absent before kickoff is not shown anywhere this Recipe could read, and is
# not modelled here as a result -- see the fidelity gaps.
#
# **A season carries the identical pending/terminal question one level up,
# and this Recipe's own catalogue call happened to answer both sides of it
# live.** The Premier League's currentSeason, in the same /v4/competitions
# response every case below draws from, reads
# {"currentMatchday": 2, "winner": null} -- in progress, nobody crowned yet.
# A page further down the same 189-entry catalogue, Austria's third-tier
# "Playoffs 1/2" competition carries {"currentMatchday": null,
# "winner": {"id": 2022, "name": "spusu SKN St. Pölten", ...}} -- a full
# Team object sitting where PL has null, because that competition's one
# recorded season ended in 2018 and stayed that way. Two competitions in the
# same real response, one still pending and one long since terminal, and the
# field that tells them apart is not a status string but whether winner
# holds an object or nothing at all.
#
# **lastUpdated is real, ISO 8601 with a Z, and it is on every competition
# this Recipe's anonymous call returned** -- 2026-08-10T07:41:50Z on the
# Premier League's row, 2018-08-23T15:47:33Z on Austria's, both live. The
# one Match object this Recipe could read carries the same field
# (2022-06-06T08:20:24Z, four months after the match itself, on a document
# describing a game played 2022-02-27) -- named identically on both resource
# kinds, which is not something this Recipe can assume generalises past the
# two it saw.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No SCHEDULED, TIMED, IN_PLAY, PAUSED, EXTRA_TIME, PENALTY_SHOOTOUT,
#     SUSPENDED, POSTPONED, CANCELLED or AWARDED match is modelled -- only
#     FINISHED, because it is the only status any published worked example
#     on this provider's documentation shows in full. Ten of the eleven
#     documented words are named in this header and in the field comment
#     below and are not backed by a fixture, because inventing one would be
#     guessing at a shape nobody here has read.
#   - The published Match example carries lineup, bench, goals, odds and
#     referees arrays this Recipe does not declare at all -- dozens of
#     fields, most of them themselves nested Player and Team objects. This
#     Recipe scopes to the status/score/timestamp question its group of
#     three exists to answer.
#   - No successful call was ever made against a route that requires a real
#     credential. /v4/matches/{id} is cited from documentation only, and its
#     conformance case carries source and no verified date as a result. Only
#     the routes reachable with no credential, plus the credential-failure
#     shapes on the ones that are not, were actually called.
#   - No 429 was ever triggered, on the anonymous quota or otherwise, and
#     none is modelled; football-data.org's own documentation gives no
#     example of the response body, only the fact that it happens.
#   - /v4/areas, /v4/teams and every subresource (head2head, standings,
#     scorers, persons) are not modelled.
#
# Every case below carries source. A verified date means this Recipe called
# api.football-data.org with exactly the request shown, on 2026-09-02, and
# recorded exactly what came back.

recipe: footballdata
capability: infrastructure
version: 0.1.0

upstream:
  api: v4
  provider: football-data.org
  docs: https://docs.football-data.org/general/v4/index.html

auth:
  scheme: header
  header: X-Auth-Token
  keys:
    - cauldron00000000000000000000000000
  # 403, framed as a permissions problem rather than a missing-credential
  # one -- see the header. Reserved for a genuinely absent header; the two
  # general routes below override this per-route via public.
  absent_error: subscription_required
  # 400, and it is the same sentence whether the credential is present-and-
  # wrong on a scoped route or on the two general ones -- see the header for
  # why only the scoped case is asserted as a passing conformance case.
  rejected_error: invalid_token
  # Routing and method both resolve first, live and verified both ways --
  # see the header. The reverse of this collection's auth-first default.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: count
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  competition:
    collection: competitions
    id:
      style: numeric
      type: number
    # Addressed by the short code (PL, CL, WC) as often as by the numeric
    # id -- docs.football-data.org's own worked examples use PL throughout.
    alias: code
    fields:
      area_id:
        type: integer
        in: area
        as: id
      area_name:
        type: string
        in: area
        as: name
      area_code:
        type: string
        in: area
        as: code
      area_flag:
        type: string
        null_when_unset: true
        in: area
        as: flag
      name:
        type: string
      code:
        type: string
        null_when_unset: true
      type:
        type: string
      emblem:
        type: string
        null_when_unset: true
      # TIER_ONE through TIER_FOUR in this Recipe's own catalogue call --
      # see the header for why this is not the axis unauthenticated access
      # actually turns on.
      plan:
        type: string
      current_season_id:
        type: integer
        null_when_unset: true
        in: currentSeason
        as: id
      current_season_start_date:
        type: string
        null_when_unset: true
        in: currentSeason
        as: startDate
      current_season_end_date:
        type: string
        null_when_unset: true
        in: currentSeason
        as: endDate
      current_season_current_matchday:
        type: integer
        null_when_unset: true
        in: currentSeason
        as: currentMatchday
      # Null while the season is still in progress, a full Team object once
      # it is not -- see the header for both halves observed live in the
      # same response.
      current_season_winner:
        type: map
        null_when_unset: true
        in: currentSeason
        as: winner
      number_of_available_seasons:
        type: integer
        as: numberOfAvailableSeasons
      last_updated:
        type: datetime
        as: lastUpdated

  match:
    id:
      style: numeric
      type: number
    fields:
      utc_date:
        type: datetime
        as: utcDate
      # SCHEDULED | TIMED | IN_PLAY | PAUSED | EXTRA_TIME |
      # PENALTY_SHOOTOUT | FINISHED | SUSPENDED | POSTPONED | CANCELLED |
      # AWARDED -- the full documented vocabulary; only FINISHED is backed
      # by a worked example anywhere this Recipe could find one. See the
      # header.
      status:
        type: string
      minute:
        type: integer
        null_when_unset: true
      injury_time:
        type: integer
        null_when_unset: true
        as: injuryTime
      matchday:
        type: integer
      stage:
        type: string
      group:
        type: string
        null_when_unset: true
      last_updated:
        type: datetime
        as: lastUpdated
      competition_id:
        type: integer
        in: competition
        as: id
      competition_name:
        type: string
        in: competition
        as: name
      competition_code:
        type: string
        in: competition
        as: code
      home_team_id:
        type: integer
        in: homeTeam
        as: id
      home_team_name:
        type: string
        in: homeTeam
        as: name
      home_team_short_name:
        type: string
        in: homeTeam
        as: shortName
      home_team_tla:
        type: string
        in: homeTeam
        as: tla
      away_team_id:
        type: integer
        in: awayTeam
        as: id
      away_team_name:
        type: string
        in: awayTeam
        as: name
      away_team_short_name:
        type: string
        in: awayTeam
        as: shortName
      away_team_tla:
        type: string
        in: awayTeam
        as: tla
      # HOME_TEAM, AWAY_TEAM or DRAW once decided; not confirmed null before
      # a result exists, because no SCHEDULED worked example shows it -- see
      # the header.
      score_winner:
        type: string
        null_when_unset: true
        in: score
        as: winner
      score_duration:
        type: string
        in: score
        as: duration
      score_full_time_home:
        type: integer
        null_when_unset: true
        in: score.fullTime
        as: home
      score_full_time_away:
        type: integer
        null_when_unset: true
        in: score.fullTime
        as: away
      score_half_time_home:
        type: integer
        null_when_unset: true
        in: score.halfTime
        as: home
      score_half_time_away:
        type: integer
        null_when_unset: true
        in: score.halfTime
        as: away

routes:
  # No credential required, live -- see the header. Marked when-absent
  # rather than true, because this route is open to a caller who presents
  # nothing and refuses one who presents a wrong token, and the difference
  # is now expressible.
  - method: GET
    path: /v4/competitions
    resource: competition
    operation: list
    pagination:
      # Struck live on 2026-09-05: this answers all 189 competitions with
      # count 189 beside them, and ?limit=2 answers the same 189. There is
      # no size parameter and no position -- the whole list arrives, and
      # count is a total rather than a page marker.
      #
      # So this listing does not page. The runtime was serving ten of the
      # 189 and offering a cursor for the rest.
      style: none
    public: when-absent
    headers:
      X-Authenticated-Client: anonymous

  - method: GET
    path: /v4/competitions/{id}
    resource: competition
    operation: get

  - method: GET
    path: /v4/matches/{id}
    resource: match
    operation: get

errors:
  subscription_required:
    status: 403
    message: The resource you are looking for is restricted and apparently not within your permissions. Please check your subscription.
    fields:
      errorCode: 403

  invalid_token:
    status: 400
    message: Your API token is invalid.
    fields:
      errorCode: 400

  method_not_allowed:
    status: 405
    message: Method not allowed. Use GET method only.
    fields:
      errorCode: 405

  unknown_route:
    status: 404
    message_field: "-"
    fields:
      error: 404

fixtures:
  empty: {}

  # Two rows out of the 189 this Recipe's anonymous call actually returned
  # (verified 2026-09-02) -- PL for the in-progress case, Austria's
  # "Playoffs 1/2" for the concluded one. See the header for why the count
  # field below reads 2 rather than the real catalogue's 189: this Recipe
  # serves a representative subset, and count_field reports what it actually
  # holds rather than a number no fixture here backs.
  competitions-catalogue:
    competition:
      - id: 2021
        area_id: 2072
        area_name: England
        area_code: ENG
        area_flag: https://crests.football-data.org/770.svg
        name: Premier League
        code: PL
        type: LEAGUE
        emblem: https://crests.football-data.org/PL.png
        plan: TIER_ONE
        current_season_id: 2502
        current_season_start_date: "2026-08-21"
        current_season_end_date: "2027-05-30"
        current_season_current_matchday: 2
        current_season_winner: null
        number_of_available_seasons: 128
        last_updated: "2026-08-10T07:41:50Z"
      - id: 2022
        area_id: 2016
        area_name: Austria
        area_code: AUT
        area_flag: https://crests.football-data.org/816.svg
        name: Playoffs 1/2
        code: APL
        type: PLAYOFFS
        emblem: null
        plan: TIER_TWO
        current_season_id: 24
        current_season_start_date: "2018-05-31"
        current_season_end_date: "2018-06-03"
        current_season_current_matchday: null
        current_season_winner:
          id: 2022
          name: "spusu SKN St. Pölten"
          shortName: "St. Pölten"
          tla: STP
          crest: https://crests.football-data.org/2022.png
        number_of_available_seasons: 1
        last_updated: "2018-08-23T15:47:33Z"

  # The only complete Match object published anywhere in football-data.org's
  # own documentation -- see the header. Cited, not observed: no credential
  # this Recipe holds is real.
  one-finished-match:
    match:
      - id: 330299
        utc_date: "2022-02-27T16:05:00Z"
        status: FINISHED
        minute: 90
        injury_time: 7
        matchday: 26
        stage: REGULAR_SEASON
        group: null
        last_updated: "2022-06-06T08:20:24Z"
        competition_id: 2015
        competition_name: Ligue 1
        competition_code: FL1
        home_team_id: 531
        home_team_name: ES Troyes AC
        home_team_short_name: Troyes
        home_team_tla: ETR
        away_team_id: 516
        away_team_name: Olympique de Marseille
        away_team_short_name: Marseille
        away_team_tla: MAR
        score_winner: DRAW
        score_duration: REGULAR
        score_full_time_home: 1
        score_full_time_away: 1
        score_half_time_home: 0
        score_half_time_away: 1

conformance:
  - name: the open catalogue still refuses a credential it does not recognise
    # The half that could not be asserted until a route could be open to a
    # caller presenting nothing and closed to one presenting something
    # wrong. Struck live: the same invalid-token refusal the gated routes
    # give, on the route that never demanded a credential.
    source: https://api.football-data.org/v4/competitions
    verified: "2026-09-02"
    fixture: competitions-catalogue
    request:
      method: GET
      path: /v4/competitions
      headers:
        X-Auth-Token: junktoken12345
    expect:
      status: 400
      body:
        message: Your API token is invalid.
        errorCode: 400

  - name: the general catalogue needs no credential at all
    source: https://api.football-data.org/v4/competitions
    verified: "2026-09-02"
    fixture: competitions-catalogue
    request:
      method: GET
      path: /v4/competitions
    expect:
      status: 200
      headers:
        X-Authenticated-Client: anonymous
      body:
        count: 2
        "competitions[0].code": PL
        "competitions[0].plan": TIER_ONE

  - name: a season still in progress and one long concluded sit in the same response
    # currentSeason.winner is null on PL's row and a full Team object on
    # Austria's -- the pending/terminal question one level up from a single
    # match, both halves live in the same real catalogue call.
    source: https://api.football-data.org/v4/competitions
    verified: "2026-09-02"
    fixture: competitions-catalogue
    request:
      method: GET
      path: /v4/competitions
    expect:
      status: 200
      body:
        "competitions[0].currentSeason.currentMatchday": 2
        "competitions[0].currentSeason.winner": null
        "competitions[1].currentSeason.currentMatchday": null
        "competitions[1].currentSeason.winner.name": "spusu SKN St. Pölten"

  - name: an absent credential on a scoped route is framed as a subscription problem
    source: https://api.football-data.org/v4/competitions/PL
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v4/competitions/PL
    expect:
      status: 403
      body:
        message: The resource you are looking for is restricted and apparently not within your permissions. Please check your subscription.
        errorCode: 403

  - name: and a present, wrong one is told only that it is invalid
    source: https://api.football-data.org/v4/competitions/PL
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v4/competitions/PL
      headers:
        X-Auth-Token: junktoken12345
    expect:
      status: 400
      body:
        message: Your API token is invalid.
        errorCode: 400

  - name: the one documented FINISHED match carries score, duration and both halves
    # Not observed -- see the header and the fixture comment. Cited from
    # docs.football-data.org/general/v4/match.html in full.
    source: https://docs.football-data.org/general/v4/match.html
    fixture: one-finished-match
    request:
      method: GET
      path: /v4/matches/330299
      headers:
        X-Auth-Token: cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        status: FINISHED
        "score.winner": DRAW
        "score.duration": REGULAR
        "score.fullTime.home": 1
        "score.fullTime.away": 1
        "score.halfTime.home": 0
        "score.halfTime.away": 1
        lastUpdated: "2022-06-06T08:20:24Z"

  - name: an unrouted path answers before any credential is examined
    source: https://api.football-data.org/v4/nosuchresource
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v4/nosuchresource
    expect:
      status: 404
      body:
        error: 404
      absent:
        - message
        - errorCode

  - name: so does a wrong method, naming the one that would have worked
    source: https://api.football-data.org/v4/competitions/PL
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /v4/competitions/PL
    expect:
      status: 405
      body:
        message: Method not allowed. Use GET method only.
        errorCode: 405
