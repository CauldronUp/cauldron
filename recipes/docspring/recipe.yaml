# DocSpring Recipe for Cauldron
#
# Written against DocSpring's API guide at docspring.com/docs and struck live
# against api.docspring.com on 2026-09-06 with no credential and then with a
# deliberately invalid one.
#
# **Every failure echoes something the caller sent back at them.** Struck live:
#
#   no credential
#   401 {"status":"error","error":"Missing Basic Auth: Please provide an API
#        token via Basic Auth. See:
#        https://docspring.com/docs/api-guide/authentication/"}
#
#   Basic not-a-token:not-a-secret
#   401 {"status":"error","error":"Could not find API token with ID:
#        not-a-token"}
#
#   GET /api/v1/cauldron-nonexistent
#   404 {"status":"error","error":"Unrecognized request URL (GET:
#        /api/v1/cauldron-nonexistent). Please see https://docspring.com/docs
#        or contact support if you need any help."}
#
# The second quotes the token id back. The third quotes the method and the path.
# Both are useful when the caller is you and neither costs anything here,
# because a DocSpring token id is a public half -- the secret is the password
# and it is never echoed.
#
# What is worth noticing is that the *token id* is the thing quoted. A Basic
# credential has two halves and only one of them is safe to repeat; DocSpring
# repeats that one and not the other, which is the distinction most providers
# that echo credentials fail to make.
#
# **`status` is the string "error" rather than a number or a boolean.** Not the
# HTTP status, not a success flag: the literal word. So the only structured
# field in the envelope has one value on every failure and carries no
# information, and everything a client needs is inside `error`, which is prose
# with URLs in it.
#
# **There is no code, no type and no field name.** Three different failures --
# no credential, a bad credential, a bad path -- and nothing in any of them a
# program can switch on except by matching English.
#
# **The 401 is Rails answering, and it says so in the headers.** `x-runtime:
# 0.015572` rides the refusal: how long the server spent, in seconds, as a
# float, disclosed to an unauthenticated caller. `x-request-id` is 32 hex
# characters beside it.

recipe: docspring
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://docspring.com/docs/api-guide/authentication/
  # No spec: DocSpring's reference is a rendered guide.

auth:
  scheme: basic
  # The token id is the username and the secret is the password. The refusal
  # for a wrong one quotes the id and never the secret, which is why the id is
  # the half checked here.
  keys:
    - cauldron_fixture_token_id
  absent_error: missing_basic_auth
  rejected_error: unknown_token

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"
    fields:
      # The literal word, on every failure. One value, no information.
      status: error

resources:
  template:
    id:
      field: id
      style: prefixed
      prefix: tpl_
    fields:
      name:
        type: string
      document_state:
        type: string
        default: uploaded
      page_count:
        type: integer
        default: 1
      expiration_interval:
        type: string
        default: hours
      expire_after:
        type: number
        default: 1

routes:
  - method: GET
    path: /api/v1/templates
    resource: template
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: per_page
      cursor_param: page

errors:
  missing_basic_auth:
    status: 401
    # A sentence, an instruction and a URL, in the field a client reads.
    message: "Missing Basic Auth: Please provide an API token via Basic Auth. See: https://docspring.com/docs/api-guide/authentication/"

  unknown_token:
    status: 401
    # {detail} is the credential that was judged: DocSpring quotes the token id
    # back, which is the public half of a Basic pair. The secret is the
    # password and is never repeated.
    message: "Could not find API token with ID: {detail}"

  unknown_route:
    status: 404
    # The method and the path, then a documentation link, then an offer of
    # support -- in the same field as everything else.
    message: "Unrecognized request URL (GET: /api/v1/cauldron-nonexistent). Please see https://docspring.com/docs or contact support if you need any help."

fixtures:
  empty:
    template: []

  account:
    template:
      - id: tpl_9Xk2mQ7pR4nL
        name: Invoice
        document_state: uploaded
        page_count: 2
        expiration_interval: hours
        expire_after: 1
      - id: tpl_3Bv8sT1wY6cD
        name: Contract
        # Uploaded and not yet processed, which is the state a client polls
        # through and the reason a page count of zero is not an error.
        document_state: processing
        page_count: 0
        expiration_interval: days
        expire_after: 7

conformance:
  - name: no credential names the scheme and links the guide
    source: https://api.docspring.com/api/v1/templates
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers: {}
    expect:
      status: 401
      body:
        error: "Missing Basic Auth: Please provide an API token via Basic Auth. See: https://docspring.com/docs/api-guide/authentication/"
        # The literal word, not a number and not a boolean.
        status: error

  - name: a wrong token is quoted back by its public half
    source: https://api.docspring.com/api/v1/templates
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers:
        # not-a-token as the username, not-a-secret as the password.
        Authorization: "Basic bm90LWEtdG9rZW46bm90LWEtc2VjcmV0"
    expect:
      status: 401
      body:
        # Struck live. The id comes back and the secret does not, which is the
        # distinction most providers echoing a credential fail to make.
        error: "Could not find API token with ID: not-a-token"

  - name: an unknown path is quoted back with its method
    source: https://api.docspring.com/api/v1/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nonexistent
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 404
      body:
        error: "Unrecognized request URL (GET: /api/v1/cauldron-nonexistent). Please see https://docspring.com/docs or contact support if you need any help."

  - name: every failure carries the same one-valued status
    source: https://api.docspring.com/api/v1/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nonexistent
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 404
      body:
        # The word "error", on a 404 and on both 401s. No code, no type, no
        # field name anywhere, so nothing here can be switched on except by
        # matching English.
        status: error

  - name: templates are a bare array of prefixed identifiers
    source: https://docspring.com/docs/api-guide
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 200
      body:
        # No envelope on success, where every failure has one.
        '[0].id': tpl_9Xk2mQ7pR4nL
        '[0].name': Invoice

  - name: a template still processing reports no pages
    source: https://docspring.com/docs/api-guide
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 200
      body:
        # Zero pages and no error: the count is not yet known, and a client
        # treating page_count as authoritative renders an empty document.
        '[1].document_state': processing
        '[1].page_count': 0

  - name: expiry is a number and its unit is a separate string
    source: https://docspring.com/docs/api-guide
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 200
      body:
        # 1 hour and 7 days, as two fields. Comparing expire_after across two
        # templates without reading expiration_interval compares hours to days.
        '[0].expire_after': 1
        '[0].expiration_interval': hours
        '[1].expire_after': 7
        '[1].expiration_interval': days

  - name: templates page on page and per_page
    source: https://docspring.com/docs/api-guide
    fixture: account
    request:
      method: GET
      path: /api/v1/templates
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
      query:
        page: "2"
        per_page: "1"
    expect:
      status: 200
      body:
        # A bare array with no total and no link header, so a client cannot
        # tell a full last page from a full middle one without asking again.
        '[0].id': tpl_3Bv8sT1wY6cD

  - name: an account with no templates answers an empty array
    source: https://docspring.com/docs/api-guide
    fixture: empty
    request:
      method: GET
      path: /api/v1/templates
      headers:
        Authorization: "Basic Y2F1bGRyb25fZml4dHVyZV90b2tlbl9pZDpzZWNyZXQ="
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
