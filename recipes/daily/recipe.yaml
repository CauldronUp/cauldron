  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the meeting listing answers with what the fixture holds"
    source: "https://docs.daily.co/openapi.json"
    fixture: small-domain
    request:
      method: GET
      path: "/v1/meetings"
      headers:
        "Authorization": "Bearer cauldron-fixture-daily-api-key-0000000000000000"
    expect:
      status: 200
      body:
        "data[0].id": "aaaaaaaa-0000-0000-0000-000000000001"
        "data[1].id": "aaaaaaaa-0000-0000-0000-000000000002"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and starting_after=aaaaaaaa-0000-0000-0000-000000000001,
  # which is the identifier of the last record on the previous page, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and starting_after are the two names this listing reads"
    source: "https://docs.daily.co/openapi.json"
    fixture: small-domain
    request:
      method: GET
      path: "/v1/meetings"
      query:
        "limit": "1"
        "starting_after": "aaaaaaaa-0000-0000-0000-000000000001"
      headers:
        "Authorization": "Bearer cauldron-fixture-daily-api-key-0000000000000000"
    expect:
      status: 200
      body:
        "data[0].id": "aaaaaaaa-0000-0000-0000-000000000002"
      absent:
        - "data[1]"
