# Daily Recipe for Cauldron
#
# Daily is the third provider in this group and the plainest of the three on
# the wire: a single Bearer API key over api.daily.co/v1, no separate
# management-versus-join credential shape at the REST layer at all. Compare
# recipes/livekit/recipe.yaml and recipes/agora/recipe.yaml, both written
# alongside this one: LiveKit and Agora each mint a second, short-lived
# credential (a self-signed JWT for LiveKit, a proprietary token for Agora)
# for the client that actually joins a call, separate from the credential
# that manages rooms server-side. Daily does have an equivalent -- meeting
# tokens, minted by POST /v1/meeting-tokens or self-signed the same way
# LiveKit's are (see docs.daily.co/docs/guides/privacy-and-security/
# self-signing-tokens, not read for this task) -- but it is a second,
# separate object this Recipe does not model, not a second shape the one
# route below takes. Every route this Recipe declares takes the same Bearer
# API key, checked live, the whole task.
#
# Set beside the other two providers this group's question was built around.
# Whereby, the control, answers a create with "no state, no status and no
# phase anywhere in it" and deletes the room itself an hour after the create
# request's own endDate (recipes/whereby/recipe.yaml). 100ms's room carries
# real state -- enabled: true from the first instant -- and is permanent:
# there is no delete route on that API at all (recipes/100ms/recipe.yaml).
# Daily is a third arrangement, closer to Whereby's than 100ms's but not the
# same as either: a room is real and gettable, DELETE genuinely removes it,
# and there is no status field on the resource anywhere -- but a room also
# carries no fixed lifetime the way Whereby's does. exp is optional. A room
# created with none set has no expiry at all, and one created with an exp in
# the past is not deleted by that fact -- it becomes what Daily's own
# reference calls a zombie, quoted in full below.
#
# The room's own schema, read from the OpenAPI description this task
# fetched at docs.daily.co/openapi.json (recorded as upstream.spec below):
# id, name, api_created, privacy, url, created_at, and a config object.
# No status, no state, no phase field anywhere on it -- the same absence
# Whereby's schema has and 100ms's does not. What stands in for a lifecycle
# is entirely the config.exp integer, and Daily's own reference names the
# consequence in words rather than a status enum, on the config field
# reference page (docs.daily.co/reference/rest-api/rooms/config), quoted
# here in full because the sentence is the finding:
#
#   "Rooms that have an exp in the past are not returned by the list rooms
#   endpoint; they are zombies of a sort. An existing meeting can continue
#   in the room, but from the perspective of most of the API, the room does
#   not exist!"
#
# That is Daily's own answer to this group's question, in its own words: an
# expired room is not deleted, an in-progress call can carry on inside it
# regardless, and "from the perspective of most of the API" it reads as
# though it were never created at all. The page does not say what a direct
# GET /v1/rooms/{room_name} on that specific room answers -- only that the
# list endpoint omits it -- and no worked example anywhere in the
# description shows a zombie room's GET response, so this Recipe cannot
# pin the exact body and does not claim one. What it can pin, because the
# description states it as a fact about the schema rather than a behaviour
# this task would have needed a live zombie room to observe, is that no
# status field exists anywhere for a client to have read instead.
#
# The credential check is the one place this Recipe found something Daily's
# own documentation states in a table and this task then struck live, word
# for word. From docs.daily.co/docs/rest-api/authentication#authentication-errors:
#
#   | Condition                                   | HTTP status | error value                  |
#   | Authorization header missing or malformed   | 400         | authorization-header-error   |
#   | API key is not valid                        | 401         | authentication-error         |
#
# Struck live against api.daily.co with no account and no key ever created:
#
#   no Authorization header at all
#     -> 400 {"error":"authorization-header-error","info":"invalid authorization header"}
#   Authorization: junktoken12345 (no "Bearer " prefix)
#     -> 400 {"error":"authorization-header-error","info":"invalid authorization header"}
#   Authorization: Bearer  (prefix, nothing after it)
#     -> 400 {"error":"authorization-header-error","info":"invalid authorization header"}
#   Authorization: Bearer junktoken12345 (right shape, wrong key)
#     -> 401 {"error":"authentication-error"}
#
# That is not only a different sentence between the absent and rejected
# verdicts, which most of this collection's interesting providers do -- it
# is a different STATUS CODE, 400 against 401, for a distinction this format
# usually only sees carried in the body or a challenge header. And the
# rejected body drops the info field entirely: 32 bytes,
# {"error":"authentication-error"}, no second sentence at all, where every
# other failure on this host carries one. Malformed collapses into absent
# here, not into rejected -- the same direction Whereby's and 100ms's own
# credential checks collapse it, and the opposite of Agora's, in this same
# group (see recipes/agora/recipe.yaml's header for that one going the other
# way).
#
# Routing and the credential check answer in the same order as Whereby's,
# and it is worth stating why that is not a coincidence of collapsing two
# providers' evidence together: it was struck independently, four ways.
# GET /v1/nosuchroute and PATCH /v1/rooms (a real path, wrong method) both
# answered 404 {"error":"not-found","info":"api endpoint does not exist"}
# with no Authorization header sent at all, and both answered the identical
# 404 again with "Authorization: Bearer junktoken12345" attached -- so a
# credential, right or wrong, is never even examined once the router has
# already failed to find a match. auth.after_routing: true reproduces this
# exactly, and needed no workaround route to reach it: every case below
# sends precisely what the live request sent.
#
# One structural note the after_routing flag does not carry on its own:
# there is no 405 anywhere on this host that this task could find. A wrong
# method on a real path (PATCH or DELETE /v1/rooms) answers the identical
# 404 body a wrong path gets -- not a distinct method-not-allowed shape, and
# no Allow header naming what would have worked. Compare
# recipes/turso/recipe.yaml, read before this one was written, which states
# the identical absence for its own host in almost the identical words.
# Daily and Turso are two unrelated providers that both decided a mistyped
# path and a mistyped method are the same mistake.
#
# Timed rather than assumed, because recipes/100ms/recipe.yaml's sharpest
# finding is that its own two deepest credential failures differ only in
# how long they take -- worth re-striking here rather than taking on faith
# that every provider's failure path costs the same. Three requests each,
# absent and rejected, against api.daily.co/v1/rooms: absent averaged
# roughly 320-380ms and rejected roughly 300-325ms, the same order of
# magnitude with no consistent gap between them. Unlike 100ms's pair --
# sub-2ms against 221ms, a hundred-fold difference that exposed a real
# database lookup -- nothing here suggests Daily's rejected check reaches
# further than its absent one; both plausibly cost the same because there
# is no second-tier shape check to fail before the key lookup, only the one
# check the table above already names two ways to fail.
#
# Content-Type told the truth on every response this task read: every
# success and every failure answered application/json, and every body
# parsed as the object the description says it would.
#
# Whether participant counts or session records survive a room ending is
# the group's last question, and Daily is the one provider here that
# answers it with a second, separate resource rather than a field on the
# room itself. GET /v1/meetings and GET /v1/meetings/{id} answer meeting
# session objects -- id, room, start_time, duration, ongoing,
# max_participants, and a participants array of {user_id, participant_id,
# user_name, join_time, duration} -- read from the same openapi.json's own
# worked example, quoted in full below rather than paraphrased. ongoing:
# false is what a concluded session carries, on a record this task has no
# reason to believe stops being queryable when its room later expires: the
# room's own zombie state ("the room does not exist" from most of the API)
# and a meeting session's queryability are two different facts on two
# different resources, and nothing this task read connects one to the
# other. GET /v1/rooms/{room_name}/presence answers the other half of the
# same question -- who is in a room right now, not who has ever been --
# with its own worked example, also quoted below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - config is a real object with something over eighty documented
#     properties on this schema. This Recipe declares four: exp, nbf,
#     max_participants, start_video_off. Recording, transcription,
#     live-streaming, SIP and every Prebuilt UI toggle are real, documented
#     fields on the same object and none of them are typed here.
#   - No worked example anywhere in the description shows a GET on a room
#     past its own exp, or on a room name nothing ever seeded -- only the
#     "zombies" sentence quoted above, in prose, with no body attached to
#     it. Every per-route response this description declares only ever
#     names 200 and 400, never 404, so this Recipe's not_found override on
#     the room's get and delete routes reuses the one generic 400 shape the
#     description actually shows rather than inventing a distinct 404 body
#     nobody wrote down.
#   - id (a UUID) and name (what every path actually addresses a room by)
#     are two different fields on the same record, the same split
#     recipes/turso/recipe.yaml's Database.DbId versus Database.Name
#     states for its own resource. This Recipe cannot confirm, the way
#     Turso's could from its own published description, that addressing a
#     room by its id rather than its name fails -- no page this task read
#     says so either way -- so that particular claim is not made here.
#   - Meeting tokens (POST /v1/meeting-tokens), domain configuration,
#     recordings, live-streaming, transcription, SIP dial-in/dial-out and
#     webhooks are all real, documented parts of this API and none of them
#     are modelled. This Recipe is scoped to what the group's question
#     turns on: a room's own lifecycle, and whether occupancy survives it.
#   - Rate limiting is documented in exact numbers (20 req/sec or 100 per
#     5-second window for most endpoints; roughly 2 req/sec for
#     DELETE /rooms/:name and GET /recordings; roughly 1 req/sec for
#     starting a recording, live stream, or dial-out) and never triggered;
#     no specific header value is served for it because none was ever
#     observed.
#
# The key below is a fixture and belongs to no account.

recipe: daily
capability: voice
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.daily.co/docs/rest-api
  spec: https://docs.daily.co/openapi.json
  spec_hash: 60e968871c6e9e2241db048549e67cb81666f45c6f0aa348d9ff2424132b8f6c
  spec_seen: "2026-09-02"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-fixture-daily-api-key-0000000000000000
  # A missing header, one with no "Bearer " prefix, and "Bearer " with
  # nothing after it all answered the identical 400 live -- see the header.
  absent_error: authorization_header_error
  malformed_error: authorization_header_error
  # The one case that was actually presented and refused: a different status
  # code as well as a different body, and the info field disappears entirely.
  rejected_error: authentication_error
  # Verified four ways live: an unrouted path and a wrong method on a real
  # path both 404 with no credential examined, whether or not one was sent.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: total_count
  resource:
    style: bare
  error:
    # {"error": "<code>", "info": "<prose>"} -- Daily's own two-field split,
    # stated in words on the errors reference page and struck live the same
    # way. Not every failure carries info; authentication_error does not,
    # and says so with its own message_field override below.
    style: flat
    code_field: error
    message_field: info

resources:
  room:
    collection: data
    id:
      # Every path parameter on this API is literally named room_name, and
      # every worked example addresses a room by its name, never by id --
      # the same split recipes/turso/recipe.yaml states for Database.Name
      # versus DbId. See the header for why this Recipe does not also claim
      # addressing by id fails; it only was never confirmed to work.
      style: opaque
      field: name
    fields:
      # The server-minted UUID, real and echoed, never what a path takes.
      # Daily's own wire key for this is "id" -- this Recipe cannot say so
      # with as: id without colliding with the identifier's own reserved
      # "id" token (id.field is "name" on this resource, precisely so that
      # every path addresses a room by name rather than by this field), so
      # it is declared here under its own name instead, undeclared fidelity
      # rather than a wire collision.
      uuid:
        type: string
        default: d61cd7b2-a273-42b4-89bd-be763fd562c1
      # true on the create worked example, false on the get/list ones --
      # not a discrepancy, two different rooms in two different examples.
      api_created:
        type: boolean
        default: true
      privacy:
        type: string
        default: public
      # Not templated from the room's own name the way a real create's URL
      # would be -- the same limitation recipes/whereby/recipe.yaml states
      # for its own roomUrl.
      url:
        type: string
        default: https://cauldron-fixture.daily.co/cauldron-fixture-room
      created_at:
        type: datetime
      # "Expires". No status field exists anywhere on this schema for a
      # room's lifecycle -- this integer, and whether it is set at all, is
      # the entire mechanism. See the header for what passing it means, in
      # Daily's own words.
      exp:
        type: integer
        in: config
        null_when_unset: true
      # "Not before".
      nbf:
        type: integer
        in: config
        null_when_unset: true
      max_participants:
        type: integer
        in: config
        default: 200
      start_video_off:
        type: boolean
        in: config
        default: false

  # A historical occupancy record, genuinely separate from the room -- see
  # the header. Read from the openapi.json's own worked example for
  # GetMeetingInfo, quoted there in full.
  meeting:
    collection: data
    id:
      style: uuid
    fields:
      room:
        type: string
      start_time:
        type: timestamp
      duration:
        type: integer
      # Whether this one occupancy span is still open -- the room's own
      # zombie state, if any, is a separate fact. See the header.
      ongoing:
        type: boolean
        default: false
      max_participants:
        type: integer
      # {user_id, participant_id, user_name, join_time, duration} per entry,
      # carried as raw map entries rather than individually declared fields
      # -- the same choice recipes/100ms/recipe.yaml makes for its own
      # nested peer object.
      participants:
        type: list
        default: []

  # Current occupancy, not history -- who is in the room right now. A
  # different question from meeting's ongoing, answered by a different
  # route entirely. Read from the openapi.json's own worked example for
  # GetRoomPresence.
  presence:
    collection: data
    id:
      style: opaque
      field: participant_id
    fields:
      room:
        type: string
      userId:
        type: string
        null_when_unset: true
      userName:
        type: string
        null_when_unset: true
      mtgSessionId:
        type: string
      joinTime:
        type: datetime
      duration:
        type: integer

routes:
  - method: POST
    path: /v1/rooms
    resource: room
    operation: create
    returns: [id, uuid, api_created, privacy, url, created_at, exp, nbf, max_participants, start_video_off]

  - method: GET
    path: /v1/rooms/{id}
    resource: room
    operation: get
    # No distinct 404 body exists anywhere in the description for a room
    # nothing seeds -- see the header. Reusing the one generic 400 shape
    # the spec actually shows is more honest than inventing a 404 nobody
    # wrote down.
    not_found: invalid_request_error

  - method: GET
    path: /v1/rooms
    resource: room
    operation: list
    pagination:
      # Daily's own description declares limit beside the starting_after
      # this block already named. Naming one and not the other left the size
      # to the runtime, which happens to read the same word -- right by
      # coincidence rather than by checking.
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: starting_after

  - method: DELETE
    path: /v1/rooms/{id}
    resource: room
    operation: delete
    not_found: invalid_request_error
    # {"deleted": true, "name": "my-room"} -- flagged renders {id, deleted},
    # and the id field is already renamed to "name" by the resource's own
    # id.field above, which is exactly this shape.
    deleted_body: flagged

  - method: GET
    path: /v1/rooms/{room}/presence
    resource: presence
    operation: list
    scope: [room]
    # The real, documented query parameter -- no cursor, just a cap. userId
    # and userName, the other two documented query parameters on this route,
    # are not modelled.
    pagination:
      # This listing takes limit and no position parameter at all -- Daily's
      # description gives it limit, userId and userName and nothing else.
      # "-" says the provider accepts no name for the position, which is
      # what the description supports; leaving it empty would have the
      # runtime read "cursor" on a route nothing says accepts one.
      limit: 100
      limit_param: limit
      cursor_param: "-"

  - method: GET
    path: /v1/meetings
    resource: meeting
    operation: list
    pagination:
      # Daily's own description declares limit beside the starting_after
      # this block already named. Naming one and not the other left the size
      # to the runtime, which happens to read the same word -- right by
      # coincidence rather than by checking.
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: starting_after

  - method: GET
    path: /v1/meetings/{id}
    resource: meeting
    operation: get
    not_found: invalid_request_error

errors:
  # Struck live three ways: no header, no "Bearer " prefix, and "Bearer "
  # with nothing after it. Byte-identical every time, and this table's own
  # first row, word for word.
  authorization_header_error:
    status: 400
    code: authorization-header-error
    message: invalid authorization header

  # Struck live: a well-formed but wrong bearer token. A different status
  # code from the row above, not only a different sentence -- and info is
  # dropped entirely rather than carrying a second one.
  authentication_error:
    status: 401
    code: authentication-error
    message_field: "-"

  # Struck live four ways: an unrouted path and a wrong method on a real
  # path, each with and without a credential attached. See the header for
  # why the credential never mattered to any of the four.
  unknown_route: &daily_not_found
    status: 404
    code: not-found
    message: api endpoint does not exist

  # The identical body -- see the header for why no 405 exists on this host
  # to distinguish a wrong method from a wrong path at all.
  method_not_allowed: *daily_not_found

  # The one shape this description's own per-route "400" response ever
  # shows, for a request missing something it needed. Reused for a room
  # this Recipe's fixtures never seeded, in the absence of any documented
  # 404 -- see the header.
  invalid_request_error:
    status: 400
    code: invalid-request-error
    message: missing required field

  # Documented, not observed: this Recipe never triggered a real 429.
  rate_limit_error:
    status: 429
    code: rate-limit-error
    message: rate limit exceeded

fixtures:
  empty: {}

  small-domain:
    room:
      # The get-room worked example, quoted in the header's schema summary
      # and cited verbatim on the reference page.
      - id: w2pp2cf4kltgFACPKXmX
        uuid: d61cd7b2-a273-42b4-89bd-be763fd562c1
        name: w2pp2cf4kltgFACPKXmX
        api_created: false
        privacy: public
        url: https://api-demo.daily.co/w2pp2cf4kltgFACPKXmX
        created_at: "2019-01-26T09:01:22.000Z"
        start_video_off: true

    meeting:
      # The GetMeetingInfo worked example on the same description, three
      # concluded sessions in the same room, quoted in full in the header.
      - id: aaaaaaaa-0000-0000-0000-000000000001
        room: my-room
        start_time: 1774363859
        duration: 600
        ongoing: false
        max_participants: 1
        participants:
          - user_id: null
            participant_id: bbbbbbbb-0000-0000-0000-000000000001
            user_name: Alice
            join_time: 1774363859
            duration: 600
      - id: aaaaaaaa-0000-0000-0000-000000000002
        room: my-room
        start_time: 1774283912
        duration: 187
        ongoing: false
        max_participants: 2
        participants:
          - user_id: null
            participant_id: bbbbbbbb-0000-0000-0000-000000000002
            user_name: Alice
            join_time: 1774283925
            duration: 174
          - user_id: null
            participant_id: bbbbbbbb-0000-0000-0000-000000000003
            user_name: Bob
            join_time: 1774283912
            duration: 179
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: aaaaaaaa-0000-0000-0000-000000000003
        room: my-room
        start_time: 1774283912
        duration: 187
        ongoing: false
        max_participants: 2
        participants:
        - user_id: null
          participant_id: bbbbbbbb-0000-0000-0000-000000000002
          user_name: Alice
          join_time: 1774283925
          duration: 174
        - user_id: null
          participant_id: bbbbbbbb-0000-0000-0000-000000000003
          user_name: Bob
          join_time: 1774283912
          duration: 179

    presence:
      # The GetRoomPresence worked example, quoted in the header.
      - participant_id: d61cd7b2-a273-42b4-89bd-be763fd562c1
        room: w2pp2cf4kltgFACPKXmX
        userId: "pbZ+ismP7dk="
        userName: Moishe
        mtgSessionId: 16e9701a-93e0-4933-83c9-223e7c40d552
        joinTime: "2023-01-01T20:53:19.000Z"
        duration: 2312

# Every case below carries source. A verified date means this Recipe called
# api.daily.co with exactly the request shown and recorded exactly what came
# back; its absence means the case was read from the OpenAPI description at
# docs.daily.co/openapi.json and never called -- no account was ever created
# and no API key was ever requested, guessed or used.
conformance:
  - name: no Authorization header at all is a 400, not a 401
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/rooms
    expect:
      status: 400
      body:
        error: authorization-header-error
        info: invalid authorization header

  - name: a header with no Bearer prefix answers the identical 400
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/rooms
      headers:
        Authorization: junktoken12345
    expect:
      status: 400
      body:
        error: authorization-header-error
        info: invalid authorization header

  - name: and so does Bearer with nothing after it
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/rooms
      headers:
        Authorization: "Bearer "
    expect:
      status: 400
      body:
        error: authorization-header-error

  - name: a well-formed but wrong bearer token is a different status code and drops info entirely
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/rooms
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error: authentication-error
      absent:
        - info

  - name: an unrouted path 404s with no credential examined
    source: https://api.daily.co/v1/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
    expect:
      status: 404
      body:
        error: not-found
        info: api endpoint does not exist

  - name: and the identical 404 comes back with a credential attached too
    source: https://api.daily.co/v1/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      body:
        error: not-found

  - name: a wrong method on a real path gets the identical 404, not a 405
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /v1/rooms
    expect:
      status: 404
      body:
        error: not-found
        info: api endpoint does not exist

  - name: and that holds with a credential attached as well
    source: https://api.daily.co/v1/rooms
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /v1/rooms
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      body:
        error: not-found

  - name: a room's own schema has no status field anywhere on it
    source: https://docs.daily.co/openapi.json
    fixture: small-domain
    request:
      method: GET
      path: /v1/rooms/w2pp2cf4kltgFACPKXmX
      headers:
        Authorization: Bearer cauldron-fixture-daily-api-key-0000000000000000
    expect:
      status: 200
      body:
        name: w2pp2cf4kltgFACPKXmX
        privacy: public
        "config.start_video_off": true
      absent:
        - status
        - state
        - phase

  - name: a listing wraps its array under data beside a total_count
    source: https://docs.daily.co/openapi.json
    fixture: small-domain
    request:
      method: GET
