    lease:
      - id: "148e2d1d7d1289"
        app_name: cauldron-web
        nonce: "8f4c1e93a70b25d6"
        owner: ada@example.com
        expires_at: 1787135400
        description: "flyctl deploy"
        version: 01HQ8ZF2T4V6X8Z0B2D4F6H8J0

# The resource cases below are derived from the OpenAPI description Fly
# publishes for the Machines API, rather than a real organisation -- no
# machine for one was ever created. The refusal cases carrying a verified
# date were struck live, unauthenticated, against api.machines.dev; see the
# header.
conformance:
  - name: started, on a host nobody can reach
    # Not stopped, not failed, not anything state has a word for. Two
    # fields on one object, both true, and only one of them is read.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/148e2d1d7d1289
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        state: started
        host_status: unreachable

  - name: started, and taking no traffic on purpose
    # Cordoned. Draining, deliberately, and indistinguishable from a
    # healthy machine if you read only state.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/3d8ee2f1c47398
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        state: started
        host_status: ok
        cordoned: true

  - name: started, and failing its own health check
    # The process is up and the application is not, and the reason is in
    # the check's output rather than anywhere near the state.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/9081f4a2e6b537
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        state: started
        cordoned: false
        checks[0].status: critical
        checks[0].output: "dial tcp 127.0.0.1:8080: connect: connection refused"

  - name: three machines, all started, none of them the same
    # A deploy script that waits for state == started and declares success
    # has waited for the field that cannot tell these apart.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        "[0].state": started
        "[1].state": started
        "[2].state": started
        "[0].host_status": unreachable
        "[1].cordoned": true
        "[2].checks[0].status": critical
      absent:
        - "[3]"
        - machines

  - name: the identifier you watch is not the one that lasts
    # instance_id is unique for each version of the machine, in Fly's
    # words. The id above it survives an update and this does not, so a
    # metric keyed on it starts a new series at every deploy.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/148e2d1d7d1289
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        id: "148e2d1d7d1289"
        instance_id: 01HQ8Z3K5N7P9R2T4V6X8Y0A2C
        # Three machines, one image, three instance ids. What is deployed
        # is the digest, and what changes per machine is the field beside
        # it.
        image_ref.repository: registry.fly.io/cauldron-web
        image_ref.tag: deployment-01HQ8Z3K5N
        image_ref.digest: "sha256:7f3a1c9e2b5d8046af1e73c2d90b6845e3f7a1c9e2b5d8046af1e73c2d90b684"

  - name: the machine carries its own history
    # events is on the object, newest first, so the state and the log that
    # produced it arrive together and can be read apart by code that does
    # not know they are the same thing.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/3d8ee2f1c47398
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        events[0].type: cordon
        events[0].source: user
        events[0].status: started
      absent:
        - events[1]

  - name: the event status is the machine state, spelled the same and meaning less
    # This machine is cordoned and its newest event says started, because
    # the event's status is the state the machine entered, not the outcome
    # of the event. A log line reading "cordon: started" is an event that
    # began, not a machine that is serving.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/3d8ee2f1c47398
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        cordoned: true
        events[0].type: cordon
        events[0].status: started

  - name: a lease is addressed by the machine and does not name it
    # Fly does not echo the machine id here. The nonce is the whole point:
    # it is the token an update must carry, and no other endpoint but
    # creation ever hands one over.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/148e2d1d7d1289/lease
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        nonce: "8f4c1e93a70b25d6"
        owner: ada@example.com
        description: "flyctl deploy"
      absent:
        - id
        - machine_id
        - app_name

  - name: somebody else holding the lease is a 409 about the machine
    # The machine is fine and the request is fine. What is wrong is that a
    # deploy is already in flight, and the message says locked rather than
    # saying who.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    arm: lease_held
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/148e2d1d7d1289/lease
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 409
      body:
        error: "failed to acquire lease: machine is already locked"
      absent:
        - code
        - message

  - name: the app name is in the path and not in the body
    # A partition that lives in the URL is not repeated in the object, so a
    # machine on its own cannot say which app it belongs to.
    source: https://docs.machines.dev/spec/openapi3.json
    fixture: one-app
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines/148e2d1d7d1289
      headers:
        Authorization: Bearer FlyV1cauldron000000000000000000
    expect:
      status: 200
      body:
        name: winter-frost-4821
        region: lhr
      absent:
        - app_name
        - app

  - name: no credential at all is an authentication error, not the unwired one
    # Struck live. This file had declared a message under a name nothing
    # wired to authentication -- see the header -- so this is the first
    # case to actually exercise a credential failure here.
    source: https://api.machines.dev/v1/apps/cauldron-web/machines
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines
    expect:
      status: 401
      body:
        error: "Authenticate: token validation error"

  - name: an invented token gets the identical refusal
    source: https://api.machines.dev/v1/apps/cauldron-web/machines
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /v1/apps/cauldron-web/machines
      headers:
        Authorization: Bearer FlyV1totallyinventedtoken00000000
    expect:
      status: 401
      body:
        error: "Authenticate: token validation error"

  - name: a path this API does not route needs no credential either
    # Struck live with no credential at all. Go's own net/http default,
    # plain text -- reached before authentication is ever consulted, which
    # auth.after_routing declares.
    source: https://api.machines.dev/v1/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /v1/not-a-real-endpoint
    expect:
      status: 404
      body_matches: "404 page not found"

  - name: a wrong method on a real path is the identical plain-text 404
    # PATCH on a real app's machines path, a method this Recipe does not
    # declare for it. Struck live with no credential at all.
    source: https://api.machines.dev/v1/apps/cauldron-web/machines
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PATCH
      path: /v1/apps/cauldron-web/machines
    expect:
      status: 404
      body_matches: "404 page not found"
