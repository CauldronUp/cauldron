      - id: "148e2d1d7d1289"
        app_name: cauldron-web
        name: winter-frost-4821
        state: started
        region: lhr
        instance_id: 01HQ8Z3K5N7P9R2T4V6X8Y0A2C
        private_ip: fdaa:0:2c1f:a7b:1de:1234:5678:2
