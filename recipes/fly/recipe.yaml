# Fly.io Machines Recipe for Cauldron
#
# started does not mean your application is up.
#
# A machine has a state, and everybody reads it, and three other fields on
# the same object independently contradict it.
#
#   host_status can be unreachable. The machine is started, on a host Fly
#   cannot currently talk to. Not stopped, not failed, not anything the
#   state field has a word for.
#
#   cordoned can be true. The machine is started and taking no new traffic,
#   on purpose, because somebody is draining it. Nothing in state says so.
#
#   checks can be critical. The process is running and failing its own
#   health check, which is the situation health checks exist to describe.
#
# So "is this machine up" has four answers on one object and they disagree
# by design. A deploy script that waits for state == "started" and then
# declares success has waited for the least informative of the four.
#
# Four more the Recipe pins:
#
#   1. The identifier you watch is not the identifier that lasts. Fly's own
#      words: instance_id is unique for each version of the machine. The
#      machine id is stable across updates and the instance id is not, so
#      metrics and logs keyed on the wrong one lose their history at every
#      deploy and gain a new series that looks like a new machine.
#   2. nonce is returned once and only sometimes. Fly's words again: only
#      ever returned on machine creation, and only if a lease_duration was
#      provided. It is the token that lets you update the machine later, no
#      other endpoint returns it, and asking for one without a lease
#      duration gets a machine with no way to write to it.
#   3. The machine carries its own history. events is an array on the
#      object, newest first, so the state above it is the latest entry of a
#      log that came in the same response, and the two can be read
#      separately by code that does not know they are the same thing.
#   4. Waiting is an endpoint. GET .../wait blocks until the machine reaches
#      a state you name, or until a timeout you name. An API that ships a
#      blocking call is an API telling you its other calls do not wait, and
#      it is the one call a mock never reproduces.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - wait is not modelled. Answering it immediately would be the helpful
#     lie: a client would learn that waiting is free and instant, which is
#     the opposite of what the endpoint exists to teach.
#   - No machine changes state. Nothing starts, stops, cordons, suspends or
#     destroys, so the states in the fixture are the states you get.
#   - Fly has a second API. The older platform API is GraphQL, at a
#     different host, describing the same apps in a different shape, and
#     this format speaks REST. That was the reason this provider was on the
#     backlog and it is the one thing here that is not modelled.
#   - Volumes, secrets, certificates, releases, allocations, exec, ps,
#     metadata and the org-wide machine listing are not modelled.
#
# Probed live, unauthenticated, on 2026-09-05, against api.machines.dev:
#
#   1. GET /v1/apps/{app}/machines with no Authorization header, with an
#      invented token as "FlyV1 ..." and again as "Bearer FlyV1...", all
#      answer the identical 401 {"error":"Authenticate: token validation
#      error"} -- not "You are not authorized to perform this action.",
#      which this file declared under the name unauthorized before this
#      probe, wired to nothing: no case armed it and no auth field named
#      it, so it had never been reachable at all. It is renamed to
#      authentication_error below, which fixes both the name and the text.
#   2. GET /v1/not-a-real-endpoint and GET on a real app's machines path
#      with a method this Recipe does not declare (PATCH), both with no
#      credential, answer the identical "404 page not found\n" in plain
#      text -- Go's own net/http default, not the JSON shape any declared
#      error here uses. Reached without a credential mattering either way,
#      which auth.after_routing below declares.
#
# Keys below are fixtures, not secrets.

recipe: fly
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.machines.dev/
  spec: https://docs.machines.dev/openapi.json
  spec_hash: da90bbcdb5919e12ae3a13d3ad1b9a473b9c379bd5369796384b086dab91fabf
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true
  keys:
    - FlyV1cauldron000000000000000000

responses:
  list:
    style: bare
  error:
    style: flat
    code_field: "-"
    message_field: error
    type_field: "-"

resources:
  machine:
    collection: machines
    id:
      style: opaque
      length: 14
    fields:
      # The partition. It is a field because that is how a machine is scoped
      # to its app, and Fly does not repeat it in the body, so it never
      # reaches the wire.
      app_name:
        type: string
        in: "-"
      name:
        type: string
      # created, starting, started, stopping, stopped, suspending,
      # suspended, replacing, destroying or destroyed. The most-read field
      # here and the least conclusive.
      state:
        type: string
        default: started
      region:
        type: string
      # Unique for each version of the machine, in Fly's words. It changes
      # on every update while the id above does not, so anything keyed on
      # it loses its history at each deploy.
      instance_id:
        type: string
      private_ip:
        type: string
      # ok, unknown or unreachable. A separate question from state, and a
      # machine can be started on a host nobody can reach.
      host_status:
        type: string
        default: ok
      # Running and taking no new traffic. Deliberate, invisible in state,
      # and the reason a machine that looks healthy is serving nothing.
      cordoned:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime
      image:
        type: string
        in: image_ref
        as: repository
      image_tag:
        type: string
        in: image_ref
        as: tag
      image_digest:
        type: string
        in: image_ref
        as: digest

      # The health check. Its status is a third opinion about whether this
      # machine is working, and the output is the only place the reason is.
      check_name:
        type: string
        in: checks[0]
        as: name
      check_status:
        type: string
        in: checks[0]
        as: status
      check_output:
        type: string
        in: checks[0]
        as: output
      check_updated_at:
        type: datetime
        in: checks[0]
        as: updated_at

      # The machine's own history, newest first, in the same response as
      # the state it produced.
      event_id:
        type: string
        in: events[0]
        as: id
      event_type:
        type: string
        in: events[0]
        as: type
      event_status:
        type: string
        in: events[0]
        as: status
      event_source:
        type: string
        in: events[0]
        as: source
      event_timestamp:
        type: timestamp_ms
        in: events[0]
        as: timestamp

  # What you must hold to update a machine. Its nonce is the token, and the
  # only other time Fly hands one over is at creation, once, and only if you
  # asked for a lease then.
  lease:
    collection: leases
    id:
      style: opaque
      length: 14
      # Fly does not echo the machine id in a lease. The lease is addressed
      # by the machine it belongs to, which lives in the path.
      field: "-"
    fields:
      app_name:
        type: string
        in: "-"
      nonce:
        type: string
      owner:
        type: string
      expires_at:
        type: timestamp
      description:
        type: string
      version:
        type: string

routes:
  - method: GET
    path: /v1/apps/{app_name}/machines
    resource: machine
    operation: list
    scope: [app_name]

  - method: GET
    path: /v1/apps/{app_name}/machines/{id}
    resource: machine
    operation: get
    scope: [app_name]

  - method: GET
    path: /v1/apps/{app_name}/machines/{id}/lease
    resource: lease
    operation: get
    scope: [app_name]

errors:
  # Updating without holding the lease. The machine is fine, the request is
  # fine, and somebody else is holding the token.
  lease_held:
    status: 409
    message: "failed to acquire lease: machine is already locked"

  machine_not_found:
    status: 404
    message: "machine not found"

  app_not_found:
    status: 404
    message: "app not found"

  # Struck live four separate ways -- no credential, an invented "FlyV1 ..."
  # token, and the same invented token again as "Bearer FlyV1..." -- the
  # identical body every time. Renamed from unauthorized, which nothing had
  # wired to authentication at all: no case armed it and no auth field
  # named it, so it had never actually been reachable.
  authentication_error:
    status: 401
    message: "Authenticate: token validation error"

  # Struck live with no credential at all: the router answers before
  # authentication is ever consulted, which auth.after_routing declares.
  # Go's own net/http default, plain text rather than any JSON shape this
  # Recipe's other errors use.
  unknown_route:
    status: 404
    style: text
    message: "404 page not found\n"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical plain-text 404 an unrouted path gets, not
  # a distinct shape.
  method_not_allowed:
    status: 404
    style: text
    message: "404 page not found\n"

  # Asking for capacity that is not there right now. The request is well
  # formed and the region is full.
  capacity:
    status: 422
    message: "insufficient capacity to create the machine in region lhr"

fixtures:
  empty: {}

  one-app:
