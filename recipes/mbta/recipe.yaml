# MBTA Recipe for Cauldron
#
# "type" is a number and a string in the same object.
#
#   data.attributes.type  ->  1
#   data.type             ->  "route"
#
# One is the transit route type -- 1 means subway, from the GTFS specification --
# and the other is the JSON:API resource type. Two levels apart, one key name,
# and a client that reads `type` without saying which one gets whichever its
# path happened to reach. A third lives in every relationship:
# relationships.agency.data.type is "agency".
#
# **And the human-readable text moves keys between failures.** A resource that
# does not exist answers `{"code": "not_found", "status": "404", "title":
# "Resource Not Found", "source": {"parameter": "id"}}` -- title, no detail. A
# filter that does not exist answers `{"code": "bad_request", "status": "400",
# "source": {"parameter": "filter"}, "detail": "Unsupported filter(s):
# nosuchfilter"}` -- detail, no title. So a client that renders errors[0].detail
# shows nothing when a route is missing, and one that renders errors[0].title
# shows nothing when a filter is wrong.
#
# Written against the live API rather than a document: every case below was
# checked against api-v3.mbta.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. status is a string in the body and a number on the wire. "status": "404",
#      quoted, beside an HTTP 404. It is what JSON:API asks for, which is why it
#      is worth pinning: the specification and the status line disagree about
#      the type of the same fact.
#   2. The same error body arrives under two content types. A missing route is
#      application/vnd.api+json and a missing resource is application/json --
#      byte-identical bodies, and a client switching parsers on the content type
#      takes two paths to one answer.
#   3. Colours have no hash. "color": "DA291C" and "text_color": "FFFFFF", six
#      hex digits and nothing else, so `style="color: DA291C"` renders nothing
#      and the fix is a string concatenation nobody documents.
#
# And two arrays are joined only by index: direction_destinations is
# ["Ashmont/Braintree", "Alewife"] and direction_names is ["South", "North"],
# so the destination of the southbound train is found by zipping. short_name is
# the empty string rather than null or absent, and sort_order is 10010 on a
# scale nothing explains.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One route is served, of the network.
#   - The relationships carry identifiers and no included resources, which is
#     what the API sends without an ?include parameter.

recipe: mbta
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  provider: mbta
  docs: https://api-v3.mbta.com/docs/swagger/index.html
  # Swagger 2.0, which was refused outright until this was rewritten into
  # OpenAPI 3 on the way in. It was the one description here in a format
  # that could not be read, and the count of providers publishing nothing
  # readable was one higher than the truth because of it.
  spec: https://api-v3.mbta.com/docs/swagger/swagger.json
  spec_hash: 4ea83146bb74dd6c7ffe696d891746b2419a34f5715eeabe6746ee9a33b69d39
  spec_seen: "2026-08-31"
  supersedes:
    # The retired realtime interface. Its clients were left out of detection
    # for this reason, in a comment, where nothing could check it.
    - version: v2
      host: realtime.mbta.com
      note: the retired realtime interface, whose clients must not be offered this Recipe

auth:
  # Public. A key raises the rate limit.
  scheme: none

responses:
  success:
    fields:
      # The specification's own version, on every response.
      jsonapi:
        version: "1.0"
  list:
    style: wrapped
    key: data
  resource:
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    message_field: title
    code_field: code

resources:
  route:
    id:
      style: opaque
      field: id
    fields:
      attributes:
        type: map
      links:
        type: map
      relationships:
        type: map
      # The JSON:API resource type: a string, where the one inside attributes
      # is a number.
      type:
        type: string

routes:
  - method: GET
    path: /routes/{id}
    resource: route
    operation: get
    not_found: route_not_found
    headers:
      # The specification's own media type.
      Content-Type: application/vnd.api+json; charset=utf-8

  # The same body, under the ordinary media type. Its own error rather than
  # the one above, because the two differ in nothing but the content type and
  # that is the whole point: a Recipe that shared one error could not say it.
  - method: GET
    path: /nosuchresource
    error: resource_not_found

  # A filter that does not exist, whose text lives under a different key.
  - method: GET
    path: /routes-bad-filter
    error: unsupported_filter
    headers:
      Content-Type: application/vnd.api+json; charset=utf-8

errors:
  # A route that does not exist, under the specification's own media type.
  route_not_found:
    status: 404
    code: not_found
    # Under title, with no detail beside it.
    message: Resource Not Found
    headers:
      Content-Type: application/vnd.api+json; charset=utf-8
    fields:
      # A string, beside an HTTP status that is a number.
      status: "404"
      source:
        parameter: id

  # The same body, byte for byte, under the ordinary one.
  resource_not_found:
    status: 404
    code: not_found
    message: Resource Not Found
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      status: "404"
      source:
        parameter: id

  unsupported_filter:
    status: 400
    code: bad_request
    # Under detail, with no title beside it.
    message_field: detail
    message: "Unsupported filter(s): nosuchfilter"
    fields:
      status: "400"
      source:
        parameter: filter

fixtures:
  empty: {}

  network:
    route:
      - id: Red
        # The JSON:API resource type.
        type: route
        attributes:
          # Six hex digits and no hash.
          color: DA291C
          text_color: FFFFFF
          description: Rapid Transit
          # Joined to direction_names only by index.
          direction_destinations:
            - Ashmont/Braintree
            - Alewife
          direction_names:
            - South
            - North
          fare_class: Rapid Transit
          listed_route: true
          long_name: Red Line
          # Empty, rather than null or absent.
          short_name: ""
          # A scale nothing explains.
          sort_order: 10010
          # The transit route type: 1 is subway, from GTFS. A number, where
          # the type one level up is a string.
          type: 1
        links:
          self: /routes/Red
        relationships:
          agency:
            data:
              id: "1"
              # A third type, and a string again.
              type: agency
          line:
            data:
              id: line-Red
              type: line

conformance:
  - name: type is a number and a string in the same object
    source: https://api-v3.mbta.com/routes/Red
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes/Red
    expect:
      status: 200
      headers:
        # The specification's own media type, on the success as on the failure.
        Content-Type: application/vnd.api+json
      body:
        # The transit route type, from GTFS: 1 is subway.
        "data.attributes.type": 1
        # The JSON:API resource type, one level up.
        "data.type": route
        # And a third, inside every relationship.
        "data.relationships.agency.data.type": agency
        "data.relationships.line.data.type": line

  - name: colours have no hash
    source: https://api-v3.mbta.com/routes/Red
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes/Red
    expect:
      status: 200
      body:
        # Six hex digits and nothing else, so style="color: DA291C" renders
        # nothing and the fix is a concatenation nobody documents.
        "data.attributes.color": DA291C
        "data.attributes.text_color": FFFFFF

  - name: two arrays joined only by index
    source: https://api-v3.mbta.com/routes/Red
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes/Red
    expect:
      status: 200
      body:
        # The destination of the southbound train is found by zipping.
        "data.attributes.direction_names[0]": South
        "data.attributes.direction_destinations[0]": Ashmont/Braintree
        "data.attributes.direction_names[1]": North
        "data.attributes.direction_destinations[1]": Alewife

  - name: the empty name is a string and the order is a number
    source: https://api-v3.mbta.com/routes/Red
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes/Red
    expect:
      status: 200
      body:
        "data.attributes.long_name": Red Line
        # Empty, rather than null or absent.
        "data.attributes.short_name": ""
        # On a scale nothing explains.
        "data.attributes.sort_order": 10010
        "data.attributes.listed_route": true
        "data.attributes.fare_class": Rapid Transit
        "data.links.self": /routes/Red
        # The specification's own version rides along.
        "jsonapi.version": "1.0"

  - name: a resource that does not exist puts its text under title
    source: https://api-v3.mbta.com/routes/NoSuchRoute
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes/NoSuchRoute
    expect:
      status: 404
      headers:
        # The specification's own media type.
        Content-Type: application/vnd.api+json
      body:
        "errors[0].code": not_found
        "errors[0].title": Resource Not Found
        # A string, beside an HTTP status that is a number.
        "errors[0].status": "404"
        "errors[0].source.parameter": id
      absent:
        # Nothing under detail, which is where the other failure keeps its text.
        - "errors[0].detail"

  - name: and a filter that does not exist puts its text under detail
    source: https://api-v3.mbta.com/routes?filter[nosuchfilter]=x
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /routes-bad-filter
    expect:
      status: 400
      body:
        "errors[0].code": bad_request
        "errors[0].detail": "Unsupported filter(s): nosuchfilter"
        "errors[0].status": "400"
        "errors[0].source.parameter": filter
      absent:
        # Nothing under title, which is where the other failure keeps its text.
        - "errors[0].title"

  - name: the same error body arrives under two content types
    source: https://api-v3.mbta.com/nosuchresource
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /nosuchresource
    expect:
      # Byte-identical to the missing route above, and announced differently.
      status: 404
      headers:
        Content-Type: application/json
      body:
        "errors[0].code": not_found
        "errors[0].title": Resource Not Found
        "errors[0].status": "404"
