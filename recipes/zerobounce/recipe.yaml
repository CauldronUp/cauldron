# ZeroBounce Recipe for Cauldron
#
# ZeroBounce is the sharpest possible version of this collection's
# not-found question, because its answer to "is this address bad, or did we
# just fail to find out" is a whole extra top-level word, not a flag on an
# existing one. GET /v2/validate's status is one of exactly seven values --
# valid, invalid, catch-all, unknown, spamtrap, abuse, do_not_mail -- and
# that list was confirmed three separate ways on the wire's own documentation:
# the field-reference table on v2-validate-emails, the prose on
# v2-status-codes, and a PHP code comment ("// can be: valid, invalid,
# catch-all, unknown, spamtrap, abuse, do_not_mail") sitting inside a
# code sample on the same page. unknown is its own status, not a sub-case of
# invalid, and ZeroBounce's own prose is explicit about why that word exists
# at all: "We couldn't validate for one reason or another. Typical cases
# include an offline mail server or an anti-spam email system... you are not
# charged for unknown results, credits will be credited back." That last
# clause answers this collection's credits question directly, for exactly
# one of the seven: unknown is free. Nothing citable anywhere in ZeroBounce's
# published material says whether invalid, catch-all, spamtrap, abuse or
# do_not_mail are charged, refunded or something in between, and this Recipe
# does not guess -- it says plainly that the other six are unestablished.
#
# **The sharpest finding: "catch-all" and "accept_all" are two different
# answers to the same question, at two different levels of the schema, and a
# caller reading only status misses the distinction entirely.** ZeroBounce's
# own v2-status-codes page asks itself the question this collection exists
# to ask -- "How is this different from the standalone catch-all status?" --
# and answers it in two lines:
#
#   accept_all -> Domain vetted by ZeroBounce, historically delivers,
#                 returned as valid
#   catch-all  -> Domain not in the allow-list; actual deliverability
#                 cannot be confirmed
#
# So a catch-all domain ZeroBounce has enough history on comes back
# status: valid, sub_status: accept_all -- a real top-level "good," with a
# footnote. A catch-all domain it has no history on comes back as its own
# top-level status, catch-all, sitting beside invalid and spamtrap rather
# than under valid at all. A caller who only branches on
# status === "valid" silently accepts both of these and cannot tell them
# apart after the fact; a caller who also reads sub_status can. That is this
# collection's second question -- does a caller need both fields -- answered
# as concretely as it gets: yes, and here is the one bit of information the
# first field alone cannot recover.
#
# There is a third, independent signal for the same idea. Every response
# also carries catchall_domain -- true, false or null -- documented as "Is
# the domain name a catch-all," and it is a property of the domain, not a
# verdict on this address. The one fully worked field-reference example on
# v2-validate-emails (address john.doe@zerobounce.net, ZeroBounce's own
# domain) shows status: valid, sub_status: "" (empty, not accept_all) and
# catchall_domain: true, all at once -- a catch-all-configured domain that
# still resolved to a plain valid with no accept_all footnote at all. Three
# fields can each say something different about the same one question, and
# this Recipe declares all three because collapsing any pair loses a real
# distinction ZeroBounce itself draws.
#
# **A second undocumented inconsistency, cited rather than resolved:** the
# sub_status enum on v2-validate-emails' own field table spells one value
# "forcible_disconnect" (lowercase f); the prose two paragraphs later on
# v2-status-codes spells the same value "Forcible_disconnect" (capital F).
# Neither page is newer than the other in any way this Recipe could check.
# Both are quoted in the header rather than one being silently corrected;
# the fixtures below never need to pick, because no sandbox address forces
# that particular sub_status.
#
# **Sandbox addresses, established precisely, because a vendor-published way
# to force each outcome is exactly what makes good fixtures.** ZeroBounce's
# mechanism is not a special key -- it is a list of reserved @example.com
# local-parts, documented on v2-sandbox-mode, that force a specific
# status/sub_status "with the API for testing purposes... Testing with these
# emails will not use any of your credits... You will still need to use your
# API KEY with these test email addresses." That last sentence is the
# precise part: unlike Kickbox (below), ZeroBounce's sandbox is not a
# separate key tier at all -- any accepted key, real or this Recipe's fixture
# one, triggers the canned result for these thirty-three addresses:
# disposable@, invalid@, valid@, toxic@, donotmail@, spamtrap@, abuse@,
# unknown@, catch_all@, antispam_system@, does_not_accept_mail@,
# exception_occurred@, failed_smtp_connection@, failed_syntax_check@,
# forcible_disconnect@, global_suppression@, greylisted@,
# leading_period_removed@, mail_server_did_not_respond@,
# mail_server_temporary_error@, mailbox_quota_exceeded@, mailbox_not_found@,
# no_dns_entries@, possible_trap@, possible_typo@, role_based@,
# timeout_exceeded@, unroutable_ip_address@, free_email@,
# role_based_catch_all@, gold@, role_based_accept_all@, aiagentmailbox@ --
# all @example.com, plus a GEO-testing IP (99.110.204.1) for the optional ip
# parameter. Ten of the thirty-three are modelled as fixture records below
# (see Known fidelity gaps for which, and why not all thirty-three). Note
# what is missing from that list: there is no bare "accept_all@example.com".
# ZeroBounce gives a sandbox address for role_based_accept_all and none for
# plain accept_all, so this Recipe cannot demonstrate the accept_all
# sub_status through a sandbox address at all -- only through the one
# worked field-reference example, which does not carry it either (see
# above). accept_all is documented in prose and never demonstrated in any
# worked JSON this Recipe could find.
#
# **Two field types are not what their own field table implies.** The
# worked example's mx_found is the *string* "true", not the JSON boolean
# true, despite the field table describing it as "[true/false]" the same way
# it describes free_email (which really is a JSON boolean: false, unquoted,
# in the same object). domain_age_days ("3431") and active_in_days ("30")
# are quoted strings for what read as counts. processed_at
# ("2026-06-18 07:05:00.033") is ZeroBounce's own format -- space-separated,
# no "T", no zone -- not ISO 8601. Every one of these is declared as
# type: string below rather than the type its name suggests, because that is
# the wire, and a client that does JSON.parse(mx_found) or trusts
# processed_at to parse as a standard timestamp is the exact bug this
# format exists to catch.
#
# **Every route this Recipe can call directly is behind a Cloudflare rule
# that has nothing to do with ZeroBounce's own authentication.** Checked
# live on 2026-09-02: GET https://api.zerobounce.net/v2/validate,
# /v2/getcredits and /v2/validatebatch (as a GET) all answered 403
# "error code: 1020" -- Cloudflare's own bot-block page, seventeen bytes of
# text/plain, CF-RAY a35074cf4956aaad among others -- for every credential
# state tried: none, empty, wrong. The same paths with a single trailing
# slash (GET /v2/validate/) reached ZeroBounce's own application every time,
# answering real JSON. GET /v2/nosuchroute (no trailing slash needed) and
# GET / both reached the application directly with no block at all, which is
# what pins this to a rule keyed on the specific known endpoint paths rather
# than a blanket block on this Recipe's source network. POST to the same
# paths without the trailing slash also reached the application directly.
# DELETE and OPTIONS hit a *different* Cloudflare rule -- a full "Sorry, you
# have been blocked" interstitial page, not the seventeen-byte 1020 one --
# on both the slash and no-slash forms, so this Recipe has no live evidence
# at all of what ZeroBounce's own application does for an unsupported
# method, and declares no method_not_allowed case rather than guess. Every
# route below is declared at its documented path with no trailing slash,
# because that is what a real integration calls; the slash is a probing
# artefact of this session's network, recorded here and never served.
#
# **Three verdicts, three different answers, and Cauldron's own query-scheme
# check can only reach two of them.** Struck live against GET /v2/validate/
# on 2026-09-02:
#
#   api_key parameter absent entirely  -> 400 {"error":"Missing parameter: api_key."}
#   api_key=  (present, empty string)  -> 200 {"error":"API key must be specified."}
#   api_key=<wrong, non-empty value>   -> 200 {"error":"Invalid API key or your account ran out of credits"}
#
# Three shapes, two different status codes, byte-different messages. But
# Cauldron's own credential check for scheme: query reads
# r.URL.Query().Get(auth.Param), and Go's url.Values.Get returns the empty
# string both when a parameter is missing and when it is present with
# nothing after the "=" -- so the runtime cannot tell "absent" from
# "present, empty" apart for a query credential the way it can for a header
# with a declared prefix. auth.absent_error below is the fully-absent case
# (400, "Missing parameter"), because that is the more directly documented
# and more commonly hit of the two; the empty-string case is real, verified,
# and served here only as an armed conformance case (see fixtures), because
# ordinary routing through this Recipe cannot reach it on its own. This is
# the same shape of gap Rootly's Recipe records for its own runtime
# constraint, reached here for an unrelated reason.
#
# **Routing is checked before any credential.** GET /v2/nosuchroute answered
# an empty 404 (Content-Length: 0, no body at all) whether or not an api_key
# was sent -- checked live with none, and again with a wrong one, byte
# identical. auth.after_routing: true below reproduces this exactly and,
# unlike several other Recipes in this collection that needed the same
# setting, needs no armed workaround to demonstrate it: the case below sends
# no credential at all and still reaches Cauldron's own unknown-route
# handler, because that is genuinely what live ZeroBounce does too.
#
# **The same "wrong credential" verdict gets a different sentence, and a
# different envelope, on every endpoint this Recipe tried.** All checked
# live 2026-09-02 with the byte-identical wrong value:
#
#   GET  /v2/validate       -> {"error":"Invalid API key or your account ran out of credits"}
#   GET  /v2/getcredits     -> {"Credits":"-1"}                     -- not an error envelope at all
#   GET  /v2/getapiusage    -> {"error":"Invalid API key"}          -- no credits mention
#   POST /v2/validatebatch  -> {"errors":[{"error":"Invalid API Key or your account ran out of credits","email_address":"all"}]}
#
# Note the capitalisation: validate's sentence says "API key" (lowercase k);
# validatebatch's otherwise-identical sentence says "API Key" (capital K).
# A route can now carry its own credential, so getcredits no longer has to
# borrow validate's sentence: it declares its own auth block below with its
# own rejected_error, and a genuinely wrong credential reached through
# ordinary routing -- no arming -- answers its real shape, {"Credits":"-1"},
# not an error envelope at all. That was Cauldron's own limitation, not a
# claim about ZeroBounce, and it is closed for this pair; the conformance
# case that used to need arming to prove the shape now proves the route
# reaches it on its own. getapiusage's and validatebatch's shapes are still
# recorded in this header, dated, and still not modelled as routes or cases
# at all, because neither belongs to a route this Recipe declares -- that
# part was never about auth being one setting, and giving a route its own
# credential does not create a route that was never declared.
#
# **The docs and the wire disagree about getcredits' own number.**
# v2-credit-balance's worked examples show {"Credits":2375323} for a real
# balance and {"Credits":-1} for an invalid key -- both JSON numbers,
# unquoted. The live 403-invalid-key call this Recipe actually made
# answered {"Credits":"-1"} -- a quoted string. Same sentinel value, two
# different JSON types, one from the page and one from the wire, both cited
# with their source.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of ZeroBounce's thirty-three documented sandbox addresses, ten are
#     modelled as fixture records: the seven top-level statuses once each
#     (valid, invalid, catch-all, unknown, spamtrap, abuse, do_not_mail)
#     plus disposable, role_based and gold to show a second field
#     (sub_status) varying under one repeated top-level status
#     (do_not_mail twice, valid twice). Any address not in the fixture --
#     including twenty-three of ZeroBounce's own documented ones -- answers
#     this Recipe's generic resource_missing 404 through Cauldron's
#     id-lookup mechanism, which is not what live ZeroBounce would ever
#     send: the real API performs a live check on any syntactically
#     plausible address and never answers "not found" for one. This is a
#     structural mismatch between a lookup format built for finite records
#     and a provider that answers something for everything, and there is no
#     honest way to close it without fixturing all thirty-three, which this
#     Recipe does not do because most of them differ from an already-modelled
#     one only in sub_status, not in any field worth a second case.
#   - GET /v2/getapiusage and POST /v2/validatebatch are not modelled as
#     routes. Both were probed live (see header) and both attach their own
#     credential-failure wording to endpoints this Recipe does not declare.
#   - No 429 was ever triggered; the 80,000-requests-per-10-seconds figure
#     (100,000 for ZeroBounce ONE(tm) accounts) on v2-validate-emails is
#     quoted, not served with a matching header, because no live response
#     this Recipe received carried a rate-limit header of any kind to copy.
#   - api-eu.zerobounce.net, a separate EU host mentioned on
#     v2-credit-balance for data-residency reasons, is not modelled; this
#     Recipe only ever called the default host.
#   - Of roughly twenty documented response fields this Recipe declares
#     every one that appears in the worked field-reference example. The
#     activity-data and AI-scoring product lines, and the batch/file-upload
#     surface (v2-send-file, v2-file-status, v2-get-file,
#     v2-file-management-api), are entirely separate documented products and
#     not touched here at all.
#
# No account was created and no real key was ever used. Every case below
# carrying a verified date was called against api.zerobounce.net with
# exactly the request shown (using the trailing-slash form live, for the
# edge-block reason explained above, while declaring the documented
# no-slash path); every case without one was read from
# www.zerobounce.net/docs/email-validation-api-quickstart and its child
# pages, cited individually. No formal machine-readable spec (OpenAPI or
# otherwise) was found published anywhere for this API, so upstream.spec is
# left unset rather than pointed at a page that is not one. Keys below are
# fixtures, not secrets.

recipe: zerobounce
capability: email
version: 0.1.0

upstream:
  api: v2
  docs: https://www.zerobounce.net/docs/email-validation-api-quickstart/v2-validate-emails

auth:
  scheme: query
  param: api_key
  keys:
    - zerobounce_cauldron_00000000000000000000000000
  # The fully-absent case -- see the header for why the empty-string case
  # (a real, distinct, verified answer) cannot also be reached this way and
  # is served instead as an armed case.
  absent_error: missing_api_key
  rejected_error: invalid_or_out_of_credits
  # Routing is checked before any credential -- see the header. Verified
  # live with no credential sent at all.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"

resources:
  email:
    id:
      # The provider echoes the queried address back under "address", not
      # "id" -- there is no minted identifier here at all, only the address
      # a caller asked about.
      style: opaque
      field: address
    fields:
      status:
        type: string
      # Empty string on a clean result (the worked example's own value),
      # not null -- see the fixtures below.
      sub_status:
        type: string
        default: ""
      free_email:
        type: boolean
        default: false
      # true, false or null per the field table -- a property of the
      # domain, independent of sub_status. See the header for how this,
      # status and sub_status can each say something different about the
      # same catch-all question at once.
      catchall_domain:
        type: boolean
        null_when_unset: true
      did_you_mean:
        type: string
        null_when_unset: true
      account:
        type: string
        null_when_unset: true
      domain:
        type: string
        null_when_unset: true
      # A quoted string for a day count, per the worked example
      # ("domain_age_days": "3431") -- see the header.
      domain_age_days:
        type: string
        null_when_unset: true
      active_in_days:
        type: string
        null_when_unset: true
      # A bare date ("2026-02-25"), not a full datetime.
      active_first_seen:
        type: string
        null_when_unset: true
      smtp_provider:
        type: string
        null_when_unset: true
      # The string "true"/"false", not a JSON boolean -- see the header.
      # Declared as type: string deliberately, unlike free_email and
      # catchall_domain, which really are booleans on the same object.
      mx_found:
        type: string
        null_when_unset: true
      mx_record:
        type: string
        null_when_unset: true
      firstname:
        type: string
        null_when_unset: true
      lastname:
        type: string
        null_when_unset: true
      gender:
        type: string
        null_when_unset: true
      country:
        type: string
        null_when_unset: true
      region:
        type: string
        null_when_unset: true
      city:
        type: string
        null_when_unset: true
      zipcode:
        type: string
        null_when_unset: true
      # ZeroBounce's own format -- "2026-06-18 07:05:00.033" -- space
      # rather than "T", no zone. Not ISO 8601, so declared as a plain
      # string rather than a datetime type this format would render
      # differently.
      processed_at:
        type: string
        null_when_unset: true

  # The account-level credit balance -- no identifier, answers about
  # whoever the credential belongs to. See the header for why its own
  # invalid-credential shape ({"Credits":"-1"}) cannot be reached through
  # ordinary routing and is only demonstrated as an armed case.
  credits:
    id:
      # No identifier at all -- this answers about whoever the credential
      # belongs to, and the wire echoes nothing that could serve as one.
      style: opaque
      field: "-"
    fields:
      # Capitalised on the wire, unlike every other field this API returns
      # (status, sub_status, free_email, ...) -- the one field on this
      # Recipe's two resources that breaks the otherwise-consistent
      # lower-snake-case convention.
      Credits:
        type: integer

routes:
  - method: GET
    path: /v2/validate
    resource: email
    operation: get
    id_from: query:email
    # No lookup_by: the queried address IS this resource's identifier (see
    # resources.email.id above), so the raw query value is matched against
    # each fixture record's id directly -- no separate field to translate
    # through, the way Clearbit's email-to-uuid lookup needs one.
    #
    # No not_found override declared -- see the header's fidelity-gap note. Live
    # ZeroBounce never answers "not found" for a syntactically plausible
    # address; this route's generic 404 for anything outside the fixture is
    # a Cauldron structural limit, not a claim about the provider.

  - method: GET
    path: /v2/getcredits
    resource: credits
    operation: get
    id_from: auth
    # This route's own credential -- see the header. getcredits answers a
    # wrong key with its own shape, {"Credits":"-1"}, not validate's
    # sentence, and now it can say so instead of borrowing the Recipe-wide
    # one. absent_error and after_routing are repeated from the Recipe's
    # own auth block rather than left to infer, because naming a route's
    # own auth replaces the whole block, not just the field that differs;
    # neither was re-verified against this specific route on its own, only
    # against /v2/validate and /v2/nosuchroute, so they carry forward the
    # same assumption ordinary inheritance already made rather than a new
    # one.
    auth:
      scheme: query
      param: api_key
      keys:
        - zerobounce_cauldron_00000000000000000000000000
      absent_error: missing_api_key
      rejected_error: getcredits_invalid
      after_routing: true

errors:
  # An unrecognised path answers zero bytes -- Content-Length: 0, no body
  # at all -- verified live with no credential sent. "unknown_route" is the
  # conventional name the runtime reaches for on its own for any path that
  # matches no route; declaring it here is what replaces the runtime's own
  # generic "Unrecognised request URL." message with the real, empty one.
  unknown_route:
    status: 404
    empty: true

  # The fully-absent verdict, observed live via the trailing-slash form --
  # see the header.
  missing_api_key:
    status: 400
    message: "Missing parameter: api_key."

  # A credential that was presented, non-empty, and simply wrong. Also what
  # this Recipe's getcredits route answers for the same verdict, which is
  # not what live getcredits actually sends -- see the header and the armed
  # case below.
  invalid_or_out_of_credits:
    status: 200
    message: Invalid API key or your account ran out of credits

  # The empty-string verdict: api_key= present with nothing after it.
  # Observed live, and only reachable here by arming -- Cauldron's own
  # query-scheme check cannot distinguish this from a fully-absent
  # parameter (both read as "" from url.Values.Get). See the header.
  empty_api_key:
    status: 200
    message: API key must be specified.

  # getcredits' own answer to a wrong credential: not an error envelope at
  # all, a resource answering the sentinel -1 -- and, per the live call
  # this Recipe actually made, as a quoted string, not the unquoted number
  # v2-credit-balance's own worked example shows. Reached through ordinary
  # routing now that the getcredits route names this as its own
  # rejected_error -- see the header.
  getcredits_invalid:
    status: 200
    style: flat
    message_field: "-"
    code_field: "-"
    fields:
      Credits: "-1"

fixtures:
  empty: {}

  # Ten of ZeroBounce's thirty-three documented sandbox addresses -- see
  # the header for which and why not the rest. Every address is copied
  # verbatim from v2-sandbox-mode; every status/sub_status pairing is
  # copied from v2-status-codes' own categorisation of each address's name.
  # Every other field is left null/default because no source gives these
  # specific sandbox addresses a value for them.
  sandbox:
    email:
      - id: valid@example.com
        status: valid
        sub_status: ""
      - id: invalid@example.com
        status: invalid
        sub_status: ""
      # The status this whole Recipe exists to distinguish from accept_all
      # -- see the header. Genuinely unverifiable, not merely "bad."
      - id: catch_all@example.com
        status: catch-all
        sub_status: ""
      # "We couldn't validate for one reason or another... you are not
      # charged for unknown results, credits will be credited back." --
      # ZeroBounce's own words, quoted in the header, for the one status
      # this collection's credits question has a citable answer for.
      - id: unknown@example.com
        status: unknown
        sub_status: ""
      - id: spamtrap@example.com
        status: spamtrap
        sub_status: ""
      - id: abuse@example.com
        status: abuse
        sub_status: ""
      - id: donotmail@example.com
        status: do_not_mail
        sub_status: ""
      # do_not_mail again, with a sub_status this time -- demonstrates the
      # two-field pairing the header's central finding is about: the same
      # top-level word covering seven named reasons underneath it.
      - id: disposable@example.com
        status: do_not_mail
        sub_status: disposable
      - id: role_based@example.com
        status: do_not_mail
        sub_status: role_based
      # valid again, with a sub_status -- the positive-side mirror of
      # disposable/role_based above.
      - id: gold@example.com
        status: valid
        sub_status: gold
    credits:
      # The one worked positive balance in ZeroBounce's own documentation
      # (v2-credit-balance), not a number this Recipe invented.
      - Credits: 2375323

  # The single fully-populated worked example on v2-validate-emails itself
  # -- every field the docs show a value for, none invented. Note
  # catchall_domain: true beside status: valid and sub_status: "" (not
  # accept_all) -- see the header's discussion of why three fields can each
  # say something different about the same catch-all question.
  worked-example:
    email:
      - id: john.doe@zerobounce.net
        status: valid
        sub_status: ""
        free_email: false
        catchall_domain: true
        did_you_mean: null
        account: johndoe
        domain: zerobounce.net
        domain_age_days: "3431"
        active_in_days: "30"
        active_first_seen: "2026-02-25"
        smtp_provider: g-suite
        mx_found: "true"
        mx_record: aspmx.l.google.com
        firstname: dan
        lastname: cotet
        gender: male
        country: null
        region: null
        city: null
        zipcode: null
        processed_at: "2026-06-18 07:05:00.033"

# Every case below carries source. A verified date means this Recipe called
# api.zerobounce.net with exactly the request shown (via the documented
# no-slash path, or -- where noted -- the trailing-slash form this session
# needed to clear an unrelated Cloudflare rule; see the header) and recorded
# exactly what came back. Its absence means the case was read from
# www.zerobounce.net/docs/email-validation-api-quickstart and its child
# pages and never called with a real key.
conformance:
  - name: no api_key at all is a 400, not the 200 every wrong credential gets
    source: https://api.zerobounce.net/v2/validate/
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/validate
      query:
        email: valid@example.com
    expect:
      status: 400
      body:
        error: "Missing parameter: api_key."

  - name: a present, non-empty, wrong api_key is a 200 that conflates bad key with no credits
    source: https://api.zerobounce.net/v2/validate/
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/validate
      query:
        email: valid@example.com
        api_key: junktoken12345
    expect:
      status: 200
      body:
        error: Invalid API key or your account ran out of credits

  - name: api_key= with nothing after it is a third, distinct answer
    # Real and verified live -- see the header for why Cauldron's own
    # query-scheme check cannot reach this on its own and it has to be
    # armed to demonstrate the shape.
