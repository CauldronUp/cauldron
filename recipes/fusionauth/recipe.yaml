# FusionAuth Recipe for Cauldron
#
# Written against the OpenAPI 3.0.3 document FusionAuth publishes at
# github.com/FusionAuth/fusionauth-openapi -- 176 paths, 706 schemas -- and
# quoted from the parameter and field descriptions in it.
#
# A header that is optional until somebody else changes something.
#
# Nearly every endpoint takes this parameter, and every one of them declares
# it the same way:
#
#   name: X-FusionAuth-TenantId
#   required: false
#   description: "The unique Id of the tenant used to scope this API request.
#                 Only required when there is more than one tenant and the API
#                 key is not tenant-scoped."
#
# So the contract says optional, and the prose says it becomes required -- not
# when your code changes, but when the deployment grows a second tenant, or
# when somebody reissues the API key without scoping it to one.
#
# Both of those are administrative acts in a different system, performed by
# somebody who has never seen the integration. Code written against a
# single-tenant install works, passes its tests, ships, and keeps working for
# as long as the install stays that way. The day a second tenant appears, every
# call starts failing, and the fix is a header the code has never sent and the
# schema never said it needed.
#
# A developer's own sandbox is single-tenant, so it is precisely the state in
# which this cannot be discovered. This Recipe seeds two, which is why it
# refuses a request that names neither.
#
# Three more, each from the same document:
#
#   1. A user's password can be a problem without the user changing. A user
#      carries breachedPasswordStatus and breachedPasswordLastCheckedInstant,
#      so an account that has not been touched in a year can move from fine
#      to blocked because somebody else's database leaked and FusionAuth
#      noticed. Nothing about the account changed and nothing about it says
#      when the answer will change again.
#   2. The field for whether an account works is called active, and there is
#      also an expiry beside it. Two ways to be unusable, one of which is a
#      boolean and one a date, and neither mentions the other. Keycloak's
#      enabled has the same problem one field along, and it is worth saying
#      that every provider in this collection solves this differently and
#      none of them solves it in one field.
#   3. Timestamps are instants and are named so. insertInstant and
#      lastUpdateInstant, in milliseconds, where every other provider here
#      says created_at and updated_at. Code that maps a user object by
#      convention finds neither.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The tenant header is enforced here because the fixture has two tenants.
#     Against a single-tenant install FusionAuth accepts a request without it,
#     which is the whole point of the file and is not something an emulator
#     can be in two states about at once. The single-tenant behaviour is the
#     one everybody already has; this is the other one.
#   - breachedPasswordStatus is served as seeded. FusionAuth checks passwords
#     against a breach corpus on a schedule of its own, and an emulator that
#     invented a schedule would be teaching a timetable rather than a shape.
#   - The document declares only 200 and a default error for most operations,
#     so the statuses here come from FusionAuth's own error documentation
#     rather than from the schema, and the file says so rather than implying
#     the spec was more specific than it is.
#   - Applications, tenants as a resource, groups, consents, webhooks, JWTs,
#     identity providers and the other hundred and seventy paths are absent.
#     Users only.
#
# The key and the ids below are fixtures and belong to no installation.

recipe: fusionauth
capability: identity
version: 0.1.0

upstream:
  api: v1
  docs: https://fusionauth.io/docs/apis/

auth:
  # An API key in the Authorization header, with no scheme word in front of
  # it -- the document declares it as apiKey in a header rather than as a
  # bearer token, and a client that helpfully prefixes Bearer is refused.
  scheme: header
  header: Authorization
  keys:
    - cauldron-fusionauth-fixture-key

# Declared required: false on every operation that takes it, and required in
# fact the moment an installation has two tenants. This one has two.
required_headers:
  X-FusionAuth-TenantId: missing_tenant_id

responses:
  list:
    style: wrapped
    key: users
    count_field: total
  resource:
    style: wrapped
    key: user
  error:
    # An array of general errors, each with a code and a message, beside a
    # fieldErrors object this Recipe does not invent entries for.
    style: list
    key: generalErrors
    message_field: message
    code_field: code
    type_field: "-"

resources:
  user:
    id:
      style: uuid
    fields:
      email:
        type: string
      username:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      # Whether the account works, except for the other way it might not.
      active:
        type: boolean
        default: true
      # The other way. A date rather than a boolean, and nothing links them.
      expiry:
        type: timestamp_ms
        stamped: false
      # Something that changes without the account changing.
      breachedPasswordStatus:
        type: string
      breachedPasswordLastCheckedInstant:
        type: timestamp_ms
        stamped: false
      # Instants, in milliseconds, under names no convention would guess.
      insertInstant:
        type: timestamp_ms
      lastUpdateInstant:
        type: timestamp_ms
      # The partition. It travels in a header rather than in the path, which
      # is what makes forgetting it possible at all.
      tenantId:
        type: string

routes:
  - method: GET
    path: /api/user/{id}
    resource: user
    operation: get

  - method: GET
    path: /api/user
    resource: user
    operation: list
    filters:
      - param: email
        field: email

  - method: POST
    path: /api/user
    resource: user
    operation: create

errors:
  authentication_error:
    status: 401
    message: The API key is not valid.
    code: "[notAuthorized]"

  missing_tenant_id:
    status: 400
    message: >-
      The X-FusionAuth-TenantId header is required when there is more than one
      tenant and the API key is not tenant-scoped.
    code: "[missing]X-FusionAuth-TenantId"

  resource_missing:
    status: 404
    message: The user was not found.
    code: "[notFound]user"

  invalid_request:
    status: 400
    message: The request was invalid.
    code: "[invalid]"

fixtures:
  empty: {}

  installation:
    user:
      # An ordinary account, in the first tenant.
      - id: 00000000-0000-0000-0000-000000000001
        email: ada@example.com
        username: ada
        firstName: Ada
        lastName: Lovelace
        active: true
        breachedPasswordStatus: None
        breachedPasswordLastCheckedInstant: 1755000000000
        insertInstant: 1754899200000
        lastUpdateInstant: 1754899200000
        tenantId: 30663132-6464-6665-3032-326466613934
      # Active, and its password turned up in somebody else's breach. The
      # account has not been touched since it was made.
      - id: 00000000-0000-0000-0000-000000000002
        email: grace@example.com
        username: grace
        firstName: Grace
        lastName: Hopper
        active: true
        breachedPasswordStatus: ExactMatch
        breachedPasswordLastCheckedInstant: 1755600000000
        insertInstant: 1754899200000
        lastUpdateInstant: 1754899200000
        tenantId: 30663132-6464-6665-3032-326466613934
      # Active, and expired. Two ways to be unusable, and this one uses the
      # date rather than the boolean.
      - id: 00000000-0000-0000-0000-000000000003
        email: alan@example.com
        username: alan
        firstName: Alan
        lastName: Turing
        active: true
        expiry: 1750000000000
        breachedPasswordStatus: None
        insertInstant: 1749000000000
        lastUpdateInstant: 1749000000000
        tenantId: 30663132-6464-6665-3032-326466613934
      # And somebody in the second tenant, which is the tenant that makes the
      # header necessary.
      - id: 00000000-0000-0000-0000-000000000004
        email: katherine@example.com
        username: katherine
        firstName: Katherine
        lastName: Johnson
        active: true
        breachedPasswordStatus: None
        insertInstant: 1755244800000
        lastUpdateInstant: 1755244800000
        tenantId: 61326633-3138-3462-6135-393037633261

conformance:
  - name: a request that names no tenant is refused once there are two
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-000000000001
      headers:
        Authorization: cauldron-fusionauth-fixture-key
    expect:
      # The document declares this header required: false on every operation
      # that takes it, and says in the same breath that it is "Only required
      # when there is more than one tenant and the API key is not
      # tenant-scoped". This installation has two tenants, which is a fact
      # about somebody else's configuration.
      status: 400
      body:
        "generalErrors[0].code": "[missing]X-FusionAuth-TenantId"

  - name: and the same request with the tenant named works
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-000000000001
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        # The only difference between this call and the one above is a header
        # the schema calls optional.
        "user.email": ada@example.com
        "user.active": true

  - name: an account can go from fine to breached without being touched
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-000000000002
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        # Active, and its password is in a breach corpus. insertInstant and
        # lastUpdateInstant are identical, so nothing about this account has
        # changed since it was made -- the world changed around it.
        "user.active": true
        "user.breachedPasswordStatus": ExactMatch
        "user.insertInstant": 1754899200000
        "user.lastUpdateInstant": 1754899200000

  - name: and the account beside it is clean under the same field
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-000000000001
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        # The other end of the same field, so both are pinned: None is a
        # value rather than an absence, which is what makes testing for the
        # field's presence useless.
        "user.breachedPasswordStatus": None

  - name: an account can be active and expired at once
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-000000000003
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        # active is a boolean and expiry is a date, neither mentions the
        # other, and code reading active alone treats this account as usable.
        "user.active": true
        "user.expiry": 1750000000000
      absent:
        # And the ordinary accounts have no expiry at all, so its presence is
        # the signal rather than its value.
        - user.enabled

  - name: the listing carries a total and the users under their own key
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        total: 4
        "users[0].email": ada@example.com
        "users[3].email": katherine@example.com

  - name: filtering by email finds the one account
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: installation
    request:
      method: GET
      path: /api/user?email=grace@example.com
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 200
      body:
        "users[0].username": grace
        total: 1
      absent:
        - users[1]

  - name: a user that is not there is refused with a bracketed code
    source: https://fusionauth.io/docs/apis/errors
    fixture: installation
    request:
      method: GET
      path: /api/user/00000000-0000-0000-0000-0000000000ff
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 404
      body:
        # FusionAuth's codes are bracketed strings rather than words, so a
        # client switching on them is comparing against "[notFound]user".
        "generalErrors[0].code": "[notFound]user"
        "generalErrors[0].message": The user was not found.

  - name: a key the installation does not know is refused
    source: https://fusionauth.io/docs/apis/authentication
    fixture: installation
    request:
      method: GET
      path: /api/user
      headers:
        Authorization: not-this-installations-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
    expect:
      status: 401
      body:
        "generalErrors[0].code": "[notAuthorized]"

  - name: a new account is active, unexpiring, and stamped in milliseconds
    source: https://github.com/FusionAuth/fusionauth-openapi
    fixture: empty
    request:
      method: POST
      path: /api/user
      headers:
        Authorization: cauldron-fusionauth-fixture-key
        X-FusionAuth-TenantId: 30663132-6464-6665-3032-326466613934
      json:
        email: dorothy@example.com
        username: dorothy
    expect:
      status: 200
      body:
        "user.email": dorothy@example.com
        # Active unless somebody says otherwise.
        "user.active": true
      matches:
        # Thirteen digits: an instant is milliseconds, and a Recipe that said
        # seconds would put this account in 1970 by a factor of a thousand.
        "user.insertInstant": '^[0-9]{13}$'
        "user.lastUpdateInstant": '^[0-9]{13}$'
      absent:
        # And no expiry, because an account that has not been given one does
        # not get one stamped at creation.
        - user.expiry
