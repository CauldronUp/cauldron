# Status.io Recipe for Cauldron
#
# A bad page id is not an error. It is a 200.
#
#   GET /1.0/status/000000000000000000000000
#   ->  200  {"error": "status page not found"}
#
# The HTTP layer says the request succeeded, and the only place that says
# otherwise is a six-word string inside a body a client had to decide to look
# at. A malformed id gets the identical treatment -- /1.0/status/abc and
# /1.0/status/not-a-real-id-at-all-zzzzzz both answer the same 200 and the
# same sentence, so this API draws no line between "that page never existed"
# and "that is not shaped like a page id at all." Checked against a real,
# public, currently-live page -- Status.io runs its own status page on its
# own product, at id 51f6f2088643809b7200000d, found by fetching
# status.status.io and reading the id its own JavaScript calls out to -- so
# the contrast between the real page and the two ways of asking for a
# nonexistent one is a working comparison, not a guess.
#
# **A well-formed request and a wrong URL fail through two different layers
# that do not agree on anything.** The page-not-found shape above comes from
# Status.io's own application code. Ask for a path this API was never given a
# route for at all -- no id segment, or a path that is not /status/anything --
# and the answer comes from the AWS infrastructure in front of it instead:
#
#   GET /1.0/status/            ->  403  {"message": "Missing Authentication Token"}
#   GET /1.0/nonsense           ->  403  {"message": "Missing Authentication Token"}
#
# Different status, different field name for the sentence -- message here,
# error on the page-not-found shape above -- and a claim that authentication
# is the problem on an API that, for this exact route, takes no credential at
# all. It is API Gateway's own generic refusal for a request its routing table
# never matched, surfacing through to a caller who sent nothing wrong except
# the shape of the URL.
#
# **The same three numbers mean four different things depending on what they
# are attached to.** Status.io publishes two unrelated numeric scales that
# happen to share every value:
#
#   Incident Status  (a component's or an incident's own condition):
#     100 Operational, 200 maintenance, 300 Degraded Performance,
#     400 Partial Service Disruption, 500 Service Disruption, 600 Security Event
#
#   Incident State  (how far along an incident's own response is):
#     100 Investigating, 200 Identified, 300 Monitoring, 400 Resolved
#
#   Maintenance State  (how far along a maintenance window is):
#     100 Pending, 200 Active, 300 Closed
#
# The live maintenance window fetched for this Recipe carries both a status
# and a state on its one message: "status": 200, "state": 100. The status is
# not "identified" -- 200 on the Incident Status scale means nothing but "this
# is a maintenance event," a fixed flag every maintenance message carries
# regardless of where it is in its own lifecycle, which is a completely
# separate question answered by state on the Maintenance State scale: 100,
# meaning the work has not started yet. A client that read every "200" in
# this API as "Identified" would be reading the Incident State scale's word
# for a number that, on this message, was never drawn from it.
#
# **"id" and "_id" both name an identifier, and which one a record uses
# depends on what kind of record it is.** A status component and its nested
# containers carry a plain id: {"id": "52cbb6a6e746d36b13000116", "name": ...}.
# An incident or a maintenance window carries an underscored _id instead --
# confirmed on the one live maintenance window this Recipe could fetch, and
# matching Status.io's own published example incident exactly. A client
# written against one shape and pointed at the other reads undefined from a
# key that is genuinely just spelled differently one level up.
#
# Written against the live API wherever a `verified` date says so: every such
# case was checked against api.status.io on that date, with no credential
# ever requested, guessed at, or sent, against the one real public page this
# research found. The incident-message case has no `verified` date, because
# no active incident existed on that page at the time this Recipe was written
# to observe one directly -- it is drawn from Status.io's own published
# documentation instead, cited by URL.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The fixture below holds one real status page (Status.io's own) with its
#     real, live component tree trimmed to two of its six components, and its
#     one real upcoming maintenance window in full. No incident is fixtured,
#     because none was active on the one page this research could observe:
#     the incident shape in this file's prose is Status.io's own documented
#     example, not a fixture, and is cited as such rather than asserted
#     against a case.
#   - Only the public, credential-free summary endpoint is modelled. Creating
#     or updating an incident, a component or a maintenance window all live
#     behind Status.io's authenticated management API, which requires a
#     credential this research never requested, guessed at or used.
#   - status, incidents and maintenance are declared as opaque list and map
#     fields rather than as their own typed resources with their own id
#     styles. The component tree nests containers inside components, and
#     maintenance nests two more arrays inside one object; modelling that
#     depth as Cauldron resources would need a resource type per nesting
#     level for a single page this Recipe only ever fetches whole, and every
#     field this file's prose and cases care about is reachable by a dotted
#     path into the fixture either way.
#   - Only one real page was found and fetched. Whether every Status.io
#     customer's page answers with the same six-component, no-incident shape,
#     or whether the not-found and gateway-refusal wording is identical on
#     every account, was not and could not be checked against a second one.

recipe: statusio
capability: observability
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://kb.status.io/developers/public-status-api/

auth:
  # Public status pages take no credential at all -- this is the one surface
  # of Status.io this research could reach. The authenticated management API
  # is not modelled; see the header comment.
  scheme: none

responses:
  resource:
    # The whole summary, under "result" -- not the bare object, and not the
    # per-collection keys the same string would let a Recipe imagine
    # (status/incidents/maintenance are not siblings of the envelope, they
    # are inside it).
    style: wrapped
    key: result
  error:
    # Status.io's own application-level failure names its message "error".
    # The unrelated gateway-level failure below overrides this field name on
    # itself alone, because it is API Gateway answering, not Status.io.
    style: flat
    message_field: error

resources:
  status_page:
    id:
      # 51f6f2088643809b7200000d, 52cbb6a6e746d36b13000116: twenty-four lower
      # -case hex characters, the MongoDB ObjectId shape.
      style: hex
      length: 24
      # The id in the request path is never echoed anywhere in the body --
      # confirmed against the live page, whose result carries no field
      # holding its own 51f6f2088643809b7200000d anywhere.
      field: "-"
    fields:
      # {updated, status, status_code} -- the page's own headline condition,
      # drawn from the Incident Status scale. See the header comment.
      status_overall:
        type: map
      # An array of components, each with its own id (not _id), name, status
      # and status_code, and a nested containers array of the same shape one
      # level down. Left as one opaque field rather than a resource of its
      # own -- see the header comment on why.
      status:
        type: list
      # Empty on the one live page this Recipe fetched. Each entry, per
      # Status.io's own published example, carries _id rather than id.
      incidents:
        type: list
      # {active: [...], upcoming: [...]} -- two more arrays inside one
      # object, not two fields of their own, because that is the shape the
      # wire actually sends.
      maintenance:
        type: map

routes:
  - method: GET
    path: /1.0/status/{id}
    resource: status_page
    operation: get
    # Any id not held by the fixture answers this, whatever shape it has --
    # see not_found_shape below on why no id.pattern is declared.
    not_found: page_not_found

  # Synthetic-by-shape rather than synthetic-by-content: an id segment that is
  # empty rather than absent still fails to match the route above, and Cauldron
  # has no way to declare "this literal path, with nothing where the parameter
  # goes" except as its own route. Checked live at exactly this path.
  - method: GET
    path: /1.0/status/
    error: missing_authentication_token

  # The same failure, for the path with the id segment removed rather than
  # left empty.
  - method: GET
    path: /1.0/status
    error: missing_authentication_token

  # Not a real endpoint at all, and refused identically to the two above --
  # API Gateway's routing table never matched any of the three, and answers
  # the same way regardless of which part of the path was wrong.
  - method: GET
    path: /1.0/nonsense
    error: missing_authentication_token

errors:
  # Status.io's own application code answering "no such page," at 200. See
  # the header comment: a malformed id gets this exact response too, because
  # nothing here draws a line between the two.
  page_not_found:
    status: 200
    message: "status page not found"

  # API Gateway's own generic refusal, from in front of Status.io's
  # application entirely. message rather than error -- a different field name
  # from the shape above, from a different layer making the claim.
  missing_authentication_token:
    status: 403
    message_field: message
    message: "Missing Authentication Token"

fixtures:
  empty: {}

  statusio-own-page:
    status_page:
      - id: 51f6f2088643809b7200000d
        status_overall:
          updated: "2026-09-01T03:00:25.528Z"
          status: Operational
          status_code: 100
        # Trimmed to two of the real six components. Each carries a plain id,
        # not _id -- contrast the maintenance window below.
        status:
          - id: 52cbb6a6e746d36b13000116
            name: Public Status Pages
            status: Operational
            status_code: 100
            updated: "2026-07-15T04:17:15.505Z"
            containers:
              - id: 52cbb6a5e746d36b13000065
                name: US-East
                updated: "2026-07-15T04:17:15.467Z"
                status: Operational
                status_code: 100
              - id: 52cbb6a5e746d36b13000062
                name: US-West
                updated: "2026-07-15T04:17:15.505Z"
                status: Operational
                status_code: 100
          - id: 691bf59f581add05f1fb3bd9
            name: Private Status Pages
            status: Operational
            status_code: 100
            updated: "2026-07-15T04:17:15.544Z"
            containers:
              - id: 52cbb6a5e746d36b13000065
                name: US-East
                updated: "2026-07-15T04:17:15.541Z"
                status: Operational
                status_code: 100
        # Empty on the live page. No entry to show _id on here -- see the
        # maintenance window below for that contrast instead.
        incidents: []
        maintenance:
          active: []
          upcoming:
            # The one real upcoming maintenance window this page had. _id,
            # not id -- unlike every component and container above.
            - _id: 6a5709ac7f1d7d060c5e3b65
              name: Deploy Version 1.8.9
              datetime_open: "2026-07-15T04:16:44.392Z"
              datetime_planned_start: "2026-09-02T04:00:00.000Z"
              datetime_planned_end: "2026-09-02T04:15:00.000Z"
              messages:
                # status 200 here is the fixed "this is a maintenance event"
                # flag from the Incident Status scale, not "Identified" from
                # the unrelated Incident State scale. state 100 is Pending,
                # from the Maintenance State scale -- the work has not
                # started. Three different scales, and this one message
                # carries values from two of them at once.
                - details: "We will be deploying the next version of Status.io.\r\n\r\nThere will be no downtime during this maintenance."
                  state: 100
                  status: 200
                  datetime: "2026-07-15T04:16:44.417Z"
              containers_affected:
                - _id: 52cbb6a5e746d36b13000065
                  name: US-East
                - _id: 52cbb6a5e746d36b13000062
                  name: US-West
              components_affected:
                - _id: 52cbb6a6e746d36b13000116
                  name: Public Status Pages

conformance:
  - name: a real page answers a single object wrapped under result
    source: https://api.status.io/1.0/status/51f6f2088643809b7200000d
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/51f6f2088643809b7200000d
    expect:
      status: 200
      body:
        result.status_overall.status: Operational
        result.status_overall.status_code: 100
      # Not at the top level. Reading response.status_overall directly, past
      # the envelope, finds nothing.
      absent:
        - status_overall
        - error

  - name: a component's id is plain id
    source: https://api.status.io/1.0/status/51f6f2088643809b7200000d
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/51f6f2088643809b7200000d
    expect:
      status: 200
      body:
        result.status[0].id: 52cbb6a6e746d36b13000116
        result.status[0].name: Public Status Pages
        result.status[0].containers[0].id: 52cbb6a5e746d36b13000065

  - name: a maintenance window's identifier is _id, not id
    source: https://api.status.io/1.0/status/51f6f2088643809b7200000d
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/51f6f2088643809b7200000d
    expect:
      status: 200
      body:
        result.maintenance.upcoming[0]._id: 6a5709ac7f1d7d060c5e3b65
        result.maintenance.upcoming[0].name: "Deploy Version 1.8.9"
      # The key one level up is spelled without the underscore. This one
      # is not.
      absent:
        - result.maintenance.upcoming[0].id

  - name: a maintenance message's status and state are two different scales
    source: https://api.status.io/1.0/status/51f6f2088643809b7200000d
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/51f6f2088643809b7200000d
    expect:
      status: 200
      body:
        # The fixed maintenance flag on the Incident Status scale, not
        # "Identified" on the unrelated Incident State scale.
        result.maintenance.upcoming[0].messages[0].status: 200
        # Pending, on the Maintenance State scale -- the work has not
        # started, which is a different fact from the line above.
        result.maintenance.upcoming[0].messages[0].state: 100

  - name: no incident is active on this page right now
    source: https://api.status.io/1.0/status/51f6f2088643809b7200000d
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/51f6f2088643809b7200000d
    expect:
      status: 200
      body:
        result.incidents: []
        result.maintenance.active: []

  - name: an unknown page id is a 200 with a bare error string, not a 404
    source: https://api.status.io/1.0/status/000000000000000000000000
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/000000000000000000000000
    expect:
      status: 200
      body:
        error: "status page not found"
      absent:
        - result

  - name: a malformed id is refused exactly the same way as a well-formed unknown one
    source: https://api.status.io/1.0/status/abc
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/abc
    expect:
      status: 200
      body:
        error: "status page not found"

  - name: a request with no id segment misses the route entirely
    source: https://api.status.io/1.0/status/
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status/
    expect:
      status: 403
      body:
        # A different field name from the application-level shape above --
        # message, not error -- because a different layer is answering.
        message: "Missing Authentication Token"
      absent:
        - error

  - name: so does the path with the id segment removed rather than left empty
    source: https://api.status.io/1.0/status
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/status
    expect:
      status: 403
      body:
        message: "Missing Authentication Token"

  - name: and so does a path that was never a real endpoint at all
    source: https://api.status.io/1.0/nonsense
    verified: "2026-08-31"
    fixture: statusio-own-page
    request:
      method: GET
      path: /1.0/nonsense
    expect:
      status: 403
      body:
        message: "Missing Authentication Token"
