# Pirsch Recipe for Cauldron
#
# The domains listing, struck live against api.pirsch.io on 2026-09-13 with no
# credential, with a deliberately invalid one, and on a path that does not
# exist. Record shapes come from Pirsch's own Go SDK, which is open.
#
# **Three failures, three shapes, and the first one is a success.** Struck live:
#
#   (no header)      200 application/json           null
#   Bearer notreal   401 text/plain; charset=utf-8  {"validation":null,"error":["token contains an invalid number of segments"]}
#   /cauldron-nope   404 text/plain; charset=utf-8  404 page not found
#
# A request with no credential at all answers **200 and the four bytes `null`**.
# Not an empty array -- the JSON null literal, which is what a Go handler
# returning a nil slice sends. `response.ok` is true, `.json()` succeeds and
# hands back null, and the `for (const d of body)` on the next line throws. A
# client that reaches `body.length` gets undefined and concludes the account has
# no domains.
#
# **The 401 is JSON labelled `text/plain`.** A client that checks the content
# type before parsing refuses to read it; one that trusts the label gets a
# string. The body is JSON either way.
#
# **And its message is a JWT library's internal error text.** `token contains an
# invalid number of segments` is golang-jwt's own string, passed through
# verbatim -- so the failure tells a caller who has proved nothing that the
# credential is a JWT, and which stage of parsing it failed at.
#
# **`validation` is `null` here and `{}` elsewhere.** The same envelope on a
# different path answers `{"validation":{},"error":["Domain not found."]}`. One
# field, two ways of being empty, and a client testing `if (body.validation)`
# gets a different answer depending on which failure arrived.
#
# **`error` is an array and `validation` is an object.** Two shapes in one
# envelope, so reading a failure means indexing one field and keying the other.
#
# **An unrouted path is not JSON at all.** `404 page not found` is Go's own
# `http.NotFound` string, in plain text, from an API whose other failures are
# JSON. So a client has three parsers to write and only one of them is told
# which to use.
#
# **A domain record carries a third party's account.** From Pirsch's own SDK:
# `google_user_id`, `google_user_email` and `gsc_domain` sit on the domain,
# beside the site's own settings -- an email address on a resource that is
# otherwise about a hostname.
#
# **And the timestamps are called `def_time` and `mod_time`.** Every record
# carries them, on a `BaseEntity` the whole API embeds, where `created_at` and
# `updated_at` would say the same thing in words a reader already knows.
#
# **`user_id` is a string and `new_owner` is a nullable integer**, and both name
# a person on the same record. One identifier scheme per field.

recipe: pirsch
capability: analytics
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.pirsch.io/api-sdks/api
  # No spec: Pirsch documents this API as prose and ships SDKs. There is no
  # OpenAPI document at any address this Recipe could find; the record shape
  # below is read from the Go SDK, which is the artefact a description would
  # have produced.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.p1rsch.f1xturet0ken
  # Only a wrong credential is refused. A missing one is answered.
  rejected_error: invalid_token
  after_routing: true

responses:
  list:
    style: bare
    # An empty collection is the null literal, not [].
    null_when_empty: true
  error:
    style: flat
    # An array of sentences, beside an object that is sometimes null.
    message_field: 'error[]'
    code_field: "-"

resources:
  domain:
    id:
      field: id
      style: uuid
    fields:
      hostname:
        type: string
      subdomain:
        type: string
      # The public tracking id, beside the private one above.
      identification_code:
        type: string
      # The timestamps every record in this API carries, under these names.
      def_time:
        type: datetime
      mod_time:
        type: datetime
      user_id:
        type: string
      organization_id:
        type: string
      public:
        type: boolean
      group_by_title:
        type: boolean
      disable_scripts:
        type: boolean
      imported_statistics:
        type: boolean
      pinned:
        type: boolean
      # Billing state, on the record that describes a website.
      subscription_active:
        type: boolean
      user_role:
        type: string
      settings:
        type: map
      # Untyped, so absence survives as null rather than as a default.
      timezone:
      display_name:
      custom_domain:
      # A third party's account, on a record about a hostname.
      google_user_id:
      google_user_email:
      gsc_domain:
      # A nullable integer naming a person, beside a string that does the same.
      new_owner:

routes:
  - method: GET
    path: /api/v1/domain
    resource: domain
    operation: list
    # Struck live: a request carrying nothing is answered rather than refused,
    # and what it is answered with is null.
    public: when-absent
    pagination:
      # None offered and none documented: the endpoint answers every domain
      # the credential can see.
      style: none

errors:
  invalid_token:
    status: 401
    # golang-jwt's own string, verbatim.
    message: token contains an invalid number of segments
    headers:
      # JSON, labelled as text.
      Content-Type: text/plain; charset=utf-8
    fields:
      # Null here; an empty object on other paths in the same API.
      validation: null

  unknown_route:
    status: 404
    # Go's http.NotFound string, in plain text, from an API whose other
    # failures are JSON.
    style: text
    message: 404 page not found
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  # What a caller with no credential is served, and the shape that breaks a
  # for-of loop.
  empty:
    domain: []

  account:
    domain:
      - id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        hostname: example.com
        subdomain: example
        identification_code: pWnCkQv5V1
        def_time: "2024-03-11T08:30:00Z"
        mod_time: "2026-08-22T13:45:10Z"
        user_id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        organization_id: 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        public: true
        group_by_title: false
        disable_scripts: false
        imported_statistics: false
        pinned: true
        subscription_active: true
        user_role: owner
        settings: {}
        timezone: Europe/Berlin
        display_name: Example
        custom_domain: null
        # The Google account, on the domain record.
        google_user_id: "118273645500192837465"
        google_user_email: owner@example.com
        gsc_domain: sc-domain:example.com
        new_owner: null
      - id: b8f9b663-0a3b-cf45-587a-be880946e881
        hostname: docs.example.com
        subdomain: docs-example
        identification_code: Kt3xZq8Ln0
        def_time: "2025-01-04T10:00:00Z"
        mod_time: "2026-09-01T06:30:00Z"
        user_id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        organization_id: 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        public: false
        group_by_title: true
        disable_scripts: false
        imported_statistics: true
        pinned: false
        subscription_active: true
        user_role: member
        settings: {}
        timezone: null
        display_name: null
        custom_domain: null
        google_user_id: null
        google_user_email: null
        gsc_domain: null
        # A person named as an integer, on a record whose user_id is a string.
        new_owner: 4471

conformance:
  - name: no credential at all is a success whose body is null
    source: https://api.pirsch.io/api/v1/domain
    verified: "2026-09-13"
    fixture: empty
    request:
      method: GET
      path: /api/v1/domain
      headers: {}
    expect:
      # Not an empty array. A for-of over this throws, and a length check on
      # it reports no domains.
      status: 200
      body_matches: '\Anull\s*\z'

  - name: a wrong credential is JSON labelled as text
    source: https://api.pirsch.io/api/v1/domain
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      headers:
        # A client that checks the content type before parsing refuses to read
        # a body that is JSON.
        Content-Type: text/plain; charset=utf-8
      body:
        # golang-jwt's own error string, in an array, beside a null object.
        'error[0]': token contains an invalid number of segments
        validation: null

  - name: an unrouted path is not JSON at all
    source: https://api.pirsch.io/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      # Go's http.NotFound string. The third shape this API answers with.
      body_matches: '\A404 page not found\s*\z'

  - name: a domain is identified twice
    source: https://github.com/pirsch-analytics/pirsch-go-sdk/blob/master/pkg/types.go
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer cauldr0n.p1rsch.f1xturet0ken"
    expect:
      status: 200
      body:
        # A uuid for the API and a short code for the tracking script.
        '[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        '[0].identification_code': pWnCkQv5V1
        '[0].hostname': example.com
        '[0].subdomain': example

  - name: the timestamps are def_time and mod_time
    source: https://github.com/pirsch-analytics/pirsch-go-sdk/blob/master/pkg/types.go
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer cauldr0n.p1rsch.f1xturet0ken"
    expect:
      status: 200
      body:
        # On a BaseEntity the whole API embeds, where created_at and
        # updated_at would say the same thing in words a reader knows.
        '[0].def_time': "2024-03-11T08:30:00Z"
        '[0].mod_time': "2026-08-22T13:45:10Z"
        '[1].def_time': "2025-01-04T10:00:00Z"

  - name: a domain carries a third party's account
    source: https://github.com/pirsch-analytics/pirsch-go-sdk/blob/master/pkg/types.go
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer cauldr0n.p1rsch.f1xturet0ken"
    expect:
      status: 200
      body:
        # An email address on a record that is otherwise about a hostname.
        '[0].google_user_email': owner@example.com
        '[0].google_user_id': "118273645500192837465"
        '[0].gsc_domain': sc-domain:example.com
        # And null on the domain that never connected one.
        '[1].google_user_email': null
        '[1].gsc_domain': null

  - name: two fields name a person and neither agrees on a type
    source: https://github.com/pirsch-analytics/pirsch-go-sdk/blob/master/pkg/types.go
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer cauldr0n.p1rsch.f1xturet0ken"
    expect:
      status: 200
      body:
        # A uuid string, and a nullable integer, on the same record.
        '[1].user_id': 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        '[1].new_owner': 4471
        '[0].new_owner': null
        '[0].user_role': owner
        '[1].user_role': member

  - name: billing state travels with the website
    source: https://github.com/pirsch-analytics/pirsch-go-sdk/blob/master/pkg/types.go
    fixture: account
    request:
      method: GET
      path: /api/v1/domain
      headers:
        Authorization: "Bearer cauldr0n.p1rsch.f1xturet0ken"
    expect:
      status: 200
      body:
        # Whether the subscription is paid, on the record that describes a
        # hostname.
        '[0].subscription_active': true
        '[0].pinned': true
        '[0].public': true
        '[1].public': false
        '[1].group_by_title': true
        '[1].imported_statistics': true
        '[0].disable_scripts': false
        '[0].organization_id': 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        '[1].timezone': null
        '[1].display_name': null
        '[0].custom_domain': null
        '[0].settings': {}
        '[0].timezone': Europe/Berlin
        '[0].display_name': Example
