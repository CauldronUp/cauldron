# OpenAlex Recipe for Cauldron
#
# The error message is the schema.
#
#   GET /works?filter=nosuchfilter:x
#   400 {"error": "Invalid query parameters error.",
#        "message": "nosuchfilter is not a valid field. Valid fields are
#                    underscore or hyphenated versions of: abstract.search,
#                    abstract.search.exact, apc_list.currency, ... version"}
#
# 4,779 characters and 207 field names, comma-separated, inside one sentence in
# one string. The failure is larger than most successful responses, the entire
# queryable surface of the API is delivered as prose, and a client that wants to
# know which field it got wrong has to split an English sentence on a colon and
# then on commas.
#
# **And a free API quotes a price.** Every response carries
# `"cost_usd": 0.0001` in its meta -- a tenth of a hundredth of a cent, for a
# request nobody is billed for. Beside it, `x_query` leaks the internal query
# language: `{"oql": "works", "oqo": {"get_rows": "works"}}`.
#
# Written against the live API rather than a document: every case below was
# checked against api.openalex.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. There are three failure shapes on one host. A work that does not exist
#      answers Flask's default HTML page -- `<!doctype html>\n<html lang=en>`,
#      the attribute unquoted, in text/html. An entity that does not exist
#      answers `{"message": "OpenAlex ID format not recognized"}`, message and
#      nothing else. A filter that does not exist answers `{"error": ...,
#      "message": ...}`. Same API, three parsers.
#   2. title and display_name are byte-identical. Both carry the full title of
#      the paper, in the same response, and nothing says which one to prefer.
#   3. The identifiers are URLs. `"id": "https://openalex.org/W3038568908"` and
#      `"doi": "https://doi.org/10.1585/pfr.15.2402039"` -- so getting the bare
#      W-number or the bare DOI means string-splitting a URL, and comparing two
#      records means comparing two addresses.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The message served is the real one, trimmed. The live message runs to
#     4,779 characters and 207 field names; the Recipe keeps its opening
#     sentence, the first eight names and the last three, with an ellipsis
#     between, because a Recipe is meant to be read.
#   - One work is served, of 321,811,346.
#   - db_response_time_ms and count move. They are the values recorded.

recipe: openalex
capability: docs
version: 0.1.0

upstream:
  api: openalex
  docs: https://docs.openalex.org/
  # Found by cauldron discover rather than recorded by hand. This
  # document declares one of the four routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://developers.openalex.org/openapi.json
  spec_hash: 4816b1ef896a7ab4f14372faae03dfd2fa99e0d3906885a3f123eea5c58b93a0
  spec_seen: "2026-09-05"

auth:
  # Public. A mailto in the User-Agent joins the faster pool.
  scheme: none

responses:
  success:
    fields:
      meta:
        count: 321811346
        db_response_time_ms: 150
        page: 1
        per_page: 1
        groups_count: null
        # The internal query language, on every response.
        x_query:
          oql: works
          oqo:
            get_rows: works
        # A price, on an API nobody is billed for.
        cost_usd: 0.0001
  list:
    style: wrapped
    key: results
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  work:
    id:
      style: opaque
      # A URL, not a W-number.
      field: id
    fields:
      # A URL too, not a bare DOI.
      doi:
        type: string
      title:
        type: string
      # Byte-identical to title.
      display_name:
        type: string
      publication_year:
        type: integer
      publication_date:
        type: string
      type:
        type: string
      cited_by_count:
        type: integer
      is_retracted:
        type: boolean
      is_paratext:
        type: boolean
      language:
        type: string
      fwci:
        type: number

routes:
  - method: GET
    path: /works
    resource: work
    operation: list

    pagination:
      # OpenAlex's own description declares per_page, "1-100, default 25",
      # and two ways to say where you are. page is the ordinary one and its
      # description names its own ceiling: "Use cursor for deep pagination
      # beyond 10,000 results." cursor is the other, started with the
      # literal value * and continued with the next_cursor the response
      # carries.
      #
      # This Recipe serves the page pair. A route takes one set of parameter
      # names in this format, and a caller paging past ten thousand results
      # is past what any fixture here can demonstrate -- so the cursor half
      # is recorded rather than modelled.
      style: page
      limit: 25
      max_limit: 100
      limit_param: per_page
      cursor_param: page
      first_page: 1
  # A filter that does not exist, answered with the schema.
  - method: GET
    path: /works-bad-filter
    error: invalid_query_parameters

  # An entity that does not exist: message and nothing else.
  - method: GET
    path: /nosuchentity
    error: id_format_not_recognized

  # A work that does not exist: the web framework's own page.
  - method: GET
    path: /works/W9999999999999
    error: flask_not_found
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  invalid_query_parameters:
    status: 400
    # The whole queryable surface of the API, as prose. Trimmed for reading:
    # the live message is 4,779 characters and 207 names.
    message: "nosuchfilter is not a valid field. Valid fields are underscore or hyphenated versions of: abstract.search, abstract.search.exact, apc_list.currency, apc_list.provenance, apc_list.value, apc_list.value_usd, apc_paid.currency, apc_paid.provenance, ... type, type_crossref, updated_date, version"
    fields:
      error: Invalid query parameters error.

  id_format_not_recognized:
    status: 404
    # One field, and no error key beside it.
    message: OpenAlex ID format not recognized

  flask_not_found:
    status: 404
    style: text
    # lang=en with no quotes: Werkzeug's page, not the application's.
    message: "<!doctype html>\n<html lang=en>\n<title>404 Not Found</title>\n<h1>Not Found</h1>\n<p>The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again.</p>\n"

fixtures:
  empty: {}

  works:
    work:
      - id: https://openalex.org/W3038568908
        doi: https://doi.org/10.1585/pfr.15.2402039
        title: Radiation Resistant Camera System for Monitoring Deuterium Plasma Discharges in the Large Helical Device
        # The same string again.
        display_name: Radiation Resistant Camera System for Monitoring Deuterium Plasma Discharges in the Large Helical Device
        publication_year: 2020
        publication_date: "2020-06-08"
        type: article
        cited_by_count: 801217
        is_retracted: false
        is_paratext: false
        language: en
        fwci: 0.9295

conformance:
  - name: the error message is the schema
    source: https://api.openalex.org/works?filter=nosuchfilter:x
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works-bad-filter
    expect:
      status: 400
      body:
        error: Invalid query parameters error.
      body_matches: '"message": "nosuchfilter is not a valid field\. Valid fields are underscore or hyphenated versions of: abstract\.search, abstract\.search\.exact,'

  - name: and it ends where the alphabet does
    source: https://api.openalex.org/works?filter=nosuchfilter:x
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works-bad-filter
    expect:
      status: 400
      # The live message runs to 4,779 characters and 207 names between these
      # two ends, all inside one sentence in one string.
      body_matches: 'type, type_crossref, updated_date, version'

  - name: a free API quotes a price
    source: https://api.openalex.org/works?per-page=1
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works
    expect:
      status: 200
      body:
        # A tenth of a hundredth of a cent, for a request nobody is billed for.
        "meta.cost_usd": 0.0001
        "meta.count": 321811346
        "meta.db_response_time_ms": 150

  - name: and leaks the query language it was translated into
    source: https://api.openalex.org/works?per-page=1
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works
    expect:
      status: 200
      body:
        # An internal representation, on every response.
        "meta.x_query.oql": works
        "meta.x_query.oqo.get_rows": works
        "meta.page": 1
        "meta.per_page": 1

  - name: title and display_name are the same string
    source: https://api.openalex.org/works?per-page=1
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works
    expect:
      status: 200
      body:
        # Both the full title, in one response, with nothing saying which to
        # prefer.
        "results[0].title": Radiation Resistant Camera System for Monitoring Deuterium Plasma Discharges in the Large Helical Device
        "results[0].display_name": Radiation Resistant Camera System for Monitoring Deuterium Plasma Discharges in the Large Helical Device

  - name: the identifiers are URLs
    source: https://api.openalex.org/works?per-page=1
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works
    expect:
      status: 200
      body:
        # Getting the bare W-number or the bare DOI means splitting a URL.
        "results[0].id": https://openalex.org/W3038568908
        "results[0].doi": https://doi.org/10.1585/pfr.15.2402039
        "results[0].publication_year": 2020
        "results[0].type": article
        # Eight hundred thousand citations, and two negated booleans beside it.
        "results[0].cited_by_count": 801217
        "results[0].is_retracted": false
        "results[0].is_paratext": false
        # A field-weighted citation impact, named in four letters and nowhere
        # explained.
        "results[0].fwci": 0.9295
        "results[0].publication_date": "2020-06-08"
        "results[0].language": en

  - name: an entity that does not exist is one field
    source: https://api.openalex.org/nosuchentity
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /nosuchentity
    expect:
      status: 404
      body:
        message: OpenAlex ID format not recognized
      absent:
        # No error key beside it, where the bad filter has one.
        - error

  - name: and a work that does not exist is the web framework's page
    source: https://api.openalex.org/works/W9999999999999
    verified: "2026-08-30"
    fixture: works
    request:
      method: GET
      path: /works/W9999999999999
    expect:
      # Werkzeug's own page, not the application's, in HTML on a JSON API --
      # and note lang=en with no quotes, which is how that page is written.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '^<!doctype html>\n<html lang=en>'

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://api.openalex.org/works?per-page=1"
    fixture: works
    request:
      method: GET
      path: "/works"
      query:
        "per_page": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "results[0]"

