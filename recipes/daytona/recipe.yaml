# Daytona Recipe for Cauldron
#
# The sandbox listing, read from the OpenAPI document Daytona serves without a
# credential at api.daytona.io/openapi.json, and struck live on 2026-09-13
# against that host with no credential, with a wrong token, on a path that does
# not exist, and with a method the path does not take.
#
# **The published document's only server is localhost over cleartext.**
# `servers: [{"url": "http://localhost:3000"}]`, on a document served from
# api.daytona.io. Its OpenID Connect discovery URL is
# `http://localhost:3000/.well-known/openid-configuration` to match. Every
# client generated from this document is pointed at the developer's own machine,
# over plain HTTP.
#
# **And the host that serves it answers nothing else.** Struck live, every one
# of these:
#
#   GET /api/sandbox           301 -> https://www.daytona.io/api/sandbox
#   GET /api/health            301 -> https://www.daytona.io/api/health
#   GET /api/cauldron-nope     301 -> https://www.daytona.io/api/cauldron-nope
#   PUT /api/sandbox           301 -> https://www.daytona.io/api/sandbox
#
# and following any of them lands on a Framer marketing page, 200, with
# `<!-- Made in Framer - framer.com -->` in the first line of HTML. So the
# document is the one thing `api.daytona.io` will answer with, and everything
# else on it is a permanent redirect to a website.
#
# Drift puts it the other way round: it reports `GET /api/sandbox` as
# undeclared, because the document describes `/sandbox` under a localhost
# server and the live host serves `/api/`.
#
# **A sandbox listing is required to carry each sandbox's environment
# variables.** `env` -- "Environment variables for the sandbox" -- is in the
# `required` array of the record the listing returns, so reading the list reads
# every sandbox's environment.
#
# **Two path parameters are authentication tokens.**
# `/organizations/otel-config/by-sandbox-auth-token/{authToken}` and
# `/organizations/sandbox-identity/by-sandbox-auth-token/{authToken}` put the
# secret in the URL, where every access log and every `Referer` keeps it.
#
# **Network policy is a comma-separated string.** `networkAllowList` is
# "Comma-separated list of allowed CIDR network addresses" and `domainAllowList`
# is the same for domains -- two lists, encoded as text, on a JSON record, in
# the fields that decide what a sandbox may reach.
#
# **Four timers and at least two conventions for "off".** `autoStopInterval` and
# `autoPauseInterval` say "0 means disabled"; `autoDeleteInterval` uses a
# negative value; `autoArchiveInterval` says nothing about being disabled at
# all.
#
# **A field's description names a resource that is not this one.** `user` is
# "The user associated with the project", on a schema called `Sandbox`.
#
# **And there are two listings, one of them named after paging.** `/sandbox` and
# `/sandbox/paginated`, beside `/sandbox/for-runner`, in the same public
# document.
#
# Also pinned: `state` and `desiredState` on one record, so a sandbox says what
# it is and what it is meant to be; `spot` and `spotEvictedAt`, so a record
# carries the moment it was preempted; and `recoverable`, a boolean about
# whether the error beside it can be undone.

recipe: daytona
capability: infrastructure
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://www.daytona.io/docs/tools/api
  spec: https://api.daytona.io/openapi.json
  spec_hash: 724b4c09ef133e9d657e8ffa6d51aa0f3db12765fef39faa2958dc3a900a33c2
  spec_seen: "2026-09-13"

auth:
  # No credential is modelled. api.daytona.io answers no API path at all -- a
  # 301 to a marketing site is the whole of it -- so the shape of a refusal
  # here was never observed, and this Recipe declines to invent one.
  scheme: none

responses:
  list:
    style: wrapped
    key: items
    cursor_field: nextCursor
  error:
    # Nothing here is a JSON failure: the one thing this host answers other
    # than the document is a redirect with an empty body.
    style: text

resources:
  sandbox:
    id:
      field: id
      style: uuid
    fields:
      organizationId:
        type: string
      name:
        type: string
      snapshot:
      # "The user associated with the project", on a Sandbox.
      user:
        type: string
      # Required, on a listing.
      env:
        type: map
      labels:
        type: map
      public:
        type: boolean
      networkBlockAll:
        type: boolean
      # A list, encoded as text, in the field that decides what a sandbox may
      # reach.
      networkAllowList:
      domainAllowList:
      outboundProxyUrl:
      otelEndpointOverride:
      target:
        type: string
      cpu:
        type: number
      gpu:
        type: number
      gpuType:
      memory:
        type: number
      disk:
        type: number
      spot:
      spotEvictedAt:
      # What it is...
      state:
      # ...and what it is meant to be.
      desiredState:
      errorReason:
      recoverable:
      warmPoolId:
      backupState:
      backupCreatedAt:
      # Four timers, and at least two conventions for "off".
      autoStopInterval:
      autoPauseInterval:
      autoArchiveInterval:
      autoDeleteInterval:
      autoDestroyAt:
      volumes:
        type: list
      toolboxProxyUrl:
        type: string
      lastActivityAt:
      createdAt:
        type: string

routes:
  - method: GET
    path: /sandbox
    resource: sandbox
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: cursor

  - method: GET
    # What api.daytona.io actually answers: a permanent redirect to a
    # marketing site.
    path: /api/sandbox
    public: true
    error: redirected_to_website

errors:
  redirected_to_website:
    status: 301
    empty: true
    headers:
      # Following it lands on a Framer page, 200, with no API behind it.
      Location: https://www.daytona.io/api/sandbox
      Server: CloudFront

fixtures:
  empty:
    sandbox: []

  workspace:
    sandbox:
      - id: 7f3a2b1c-4d5e-4f60-8a9b-0c1d2e3f4a5b
        organizationId: organization123
        name: build-agent
        snapshot: daytonaio/sandbox:0.4.3
        # "The user associated with the project".
        user: daytona
        # Required, on every record the listing returns.
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://user:pass@db.internal:5432/app
        labels:
          team: platform
        public: false
        networkBlockAll: false
        # Two lists, as text.
        networkAllowList: 10.0.0.0/8,192.168.0.0/16
        domainAllowList: example.com,registry.npmjs.org
        outboundProxyUrl: null
        otelEndpointOverride: null
        target: eu
        cpu: 2
        gpu: 0
        gpuType: null
        memory: 4
        disk: 10
        spot: false
        spotEvictedAt: null
        state: started
        desiredState: started
        errorReason: null
        recoverable: null
        warmPoolId: null
        backupState: completed
        backupCreatedAt: "2026-09-12T04:00:00.000Z"
        # 0 means disabled...
        autoStopInterval: 30
        autoPauseInterval: 60
        autoArchiveInterval: 10080
        # ...and a negative value means it here.
        autoDeleteInterval: -1
        autoDestroyAt: null
        volumes: []
        toolboxProxyUrl: https://proxy.app.daytona.io/toolbox
        lastActivityAt: "2026-10-01T12:00:00.000Z"
        createdAt: "2026-10-01T12:00:00.000Z"
      - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        organizationId: organization123
        name: gpu-trainer
        snapshot: null
        user: daytona
        env: {}
        labels: {}
        public: true
        networkBlockAll: true
        networkAllowList: ""
        domainAllowList: ""
        outboundProxyUrl: https://egress.example.com:3128
        otelEndpointOverride: http://otel-collector.internal:4318
        target: us
        cpu: 8
        gpu: 1
        gpuType: A100
        memory: 32
        disk: 100
        # Preempted, with the moment on the record.
        spot: true
        spotEvictedAt: "2026-09-11T22:14:03.000Z"
        state: error
        desiredState: started
        errorReason: Spot capacity reclaimed
        recoverable: true
        warmPoolId: warmPoolId
        backupState: none
        backupCreatedAt: null
        autoStopInterval: 0
        autoPauseInterval: 0
        autoArchiveInterval: 0
        autoDeleteInterval: 30
        autoDestroyAt: "2026-09-14T00:00:00.000Z"
        volumes: []
        toolboxProxyUrl: https://proxy.app.daytona.io/toolbox
        lastActivityAt: "2026-09-11T22:14:03.000Z"
        createdAt: "2026-08-30T09:41:52.000Z"

conformance:
  - name: the host that serves the document answers nothing else
    source: https://api.daytona.io/api/sandbox
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/sandbox
      headers: {}
    expect:
      # A permanent redirect to a marketing site, with no API behind it.
      status: 301
      no_body: true
      headers:
        Location: https://www.daytona.io/api/sandbox

  - name: a sandbox listing carries every sandbox's environment variables
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        # env is in the required array of the record the listing returns.
        'items[0].env.NODE_ENV': production
        'items[0].env.DATABASE_URL': postgres://user:pass@db.internal:5432/app
        'items[1].env': {}
        'items[0].name': build-agent

  - name: network policy is a comma-separated string
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        # "Comma-separated list of allowed CIDR network addresses", as text,
        # on a JSON record.
        'items[0].networkAllowList': 10.0.0.0/8,192.168.0.0/16
        'items[0].domainAllowList': example.com,registry.npmjs.org
        'items[1].networkAllowList': ""
        'items[0].networkBlockAll': false
        'items[1].networkBlockAll': true
        'items[1].outboundProxyUrl': https://egress.example.com:3128
        'items[1].otelEndpointOverride': http://otel-collector.internal:4318

  - name: four timers and two conventions for off
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        # "0 means disabled" on two of them, a negative value on a third, and
        # nothing said about the fourth.
        'items[0].autoStopInterval': 30
        'items[0].autoPauseInterval': 60
        'items[0].autoArchiveInterval': 10080
        'items[0].autoDeleteInterval': -1
        'items[1].autoStopInterval': 0
        'items[1].autoPauseInterval': 0
        'items[1].autoDeleteInterval': 30
        'items[1].autoDestroyAt': "2026-09-14T00:00:00.000Z"
        'items[0].autoDestroyAt': null

  - name: a sandbox says what it is and what it is meant to be
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        'items[0].state': started
        'items[0].desiredState': started
        'items[1].state': error
        'items[1].desiredState': started
        'items[1].errorReason': Spot capacity reclaimed
        # A boolean about whether the error beside it can be undone.
        'items[1].recoverable': true
        'items[0].recoverable': null

  - name: a record carries the moment it was preempted
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        'items[1].spot': true
        'items[1].spotEvictedAt': "2026-09-11T22:14:03.000Z"
        'items[0].spot': false
        'items[0].spotEvictedAt': null
        'items[1].gpu': 1
        'items[1].gpuType': A100
        'items[0].gpuType': null

  - name: the quotas and the proxy travel on the record
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'items[0].cpu': 2
        'items[0].memory': 4
        'items[0].disk': 10
        'items[0].target': eu
        # "The user associated with the project", on a Sandbox.
        'items[0].user': daytona
        'items[0].toolboxProxyUrl': https://proxy.app.daytona.io/toolbox
        'items[0].organizationId': organization123
        'items[0].snapshot': daytonaio/sandbox:0.4.3
        'items[0].labels.team': platform
        'items[0].public': false
        'items[0].backupState': completed
        'items[0].backupCreatedAt': "2026-09-12T04:00:00.000Z"
        'items[0].warmPoolId': null
        'items[0].volumes': []
        'items[0].lastActivityAt': "2026-10-01T12:00:00.000Z"
        'items[0].createdAt': "2026-10-01T12:00:00.000Z"
      matches:
        nextCursor: '\A\S+\z'

  - name: following the cursor reaches the last sandbox
    source: https://api.daytona.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /sandbox
      headers: {}
      query:
        limit: "1"
        cursor: 7f3a2b1c-4d5e-4f60-8a9b-0c1d2e3f4a5b
    expect:
      status: 200
      body:
        'items[0].id': 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        'items[0].name': gpu-trainer

  - name: an organisation with no sandboxes still sends the envelope
    source: https://api.daytona.io/openapi.json
    fixture: empty
    request:
      method: GET
      path: /sandbox
      headers: {}
    expect:
      status: 200
      body:
        items: []
