# Prowlarr Recipe for Cauldron
#
# Written against Prowlarr's own generated OpenAPI document, published in its own
# repository -- github.com/Prowlarr/Prowlarr, src/Prowlarr.Api.V1/openapi.json,
# 93 paths, info.version 1.0.0, OpenAPI 3.0.4 -- read on 2026-09-06. Prowlarr is
# self-hosted and there is no public instance, so nothing here is verified live.
#
# This Recipe is one of five siblings: sonarr, radarr, prowlarr, lidarr and
# readarr. They are forks of one codebase, they are commonly installed on the
# same machine, and they share a credential header, a path prefix and an API
# shape. **The set is the finding.**
#
# **The same integer means five different things.**
#
# `eventType` is a filter taking integers and a response field holding a string.
# None of the five documents pins explicit values, so the integers a caller
# sends are the members' declaration positions:
#
#   pos | sonarr                | radarr                | prowlarr       | lidarr                | readarr
#   ----|-----------------------|-----------------------|----------------|-----------------------|----------------------
#    0  | unknown               | unknown               | unknown        | unknown               | unknown
#    1  | grabbed               | grabbed               | releaseGrabbed | grabbed               | grabbed
#    2  | seriesFolderImported  | downloadFolderImported| indexerQuery   | artistFolderImported  | bookFileImported
#    3  | downloadFolderImported| downloadFailed        | indexerRss     | trackFileImported     | downloadFailed
#    4  | downloadFailed        | movieFileDeleted      | indexerAuth    | downloadFailed        | bookFileDeleted
#    5  | episodeFileDeleted    | movieFolderImported   | indexerInfo    | trackFileDeleted      | bookFileRenamed
#    6  | episodeFileRenamed    | movieFileRenamed      | -              | trackFileRenamed      | bookImportIncomplete
#    7  | downloadIgnored       | downloadIgnored       | -              | albumImportIncomplete | downloadImported
#    8  | -                     | -                     | -              | downloadImported      | bookFileRetagged
#    9  | -                     | -                     | -              | trackFileRetagged     | downloadIgnored
#   10  | -                     | -                     | -              | downloadIgnored       | -
#
# **Only position nought agrees across all five.**
#
# `?eventType=3` asks for a successful import on Sonarr and Lidarr, a failed
# download on Radarr and Readarr, and an RSS poll on Prowlarr. There is no
# integer that means "download failed" across the family: it is 4, 3, absent,
# 4 and 3.
#
# A monitoring job pointed at the wrong one of five counts the wrong thing, and
# nothing anywhere returns an error.
#
# **Prowlarr is the one that is not a download manager at all.**
#
# It manages indexers. Its history is a log of indexer activity -- queries, RSS
# polls, authentications -- not of downloads, so four of its six event types
# have no counterpart in any sibling. Its HistoryResource has no `sourceTitle`,
# no `quality`, no `qualityCutoffNotMet`; it has `indexerId` and a boolean
# `successful` that none of the other four carry.
#
# So a client written against the shared shape reads `sourceTitle` and finds
# undefined on every Prowlarr record, and one written against Prowlarr reads
# `successful` and finds undefined on the other four.
#
# **And it renames the one event they all have.** Position 1 is `grabbed` on
# four siblings and `releaseGrabbed` here -- the same integer, the same idea, a
# different string. A client switching on the name handles four and falls
# through on the fifth.
#
# **Nothing tells the five apart except appName.** Same `X-Api-Key`, same
# `/api/v1` prefix, same paged envelope, same 224-ish path count. The only
# discriminator is `appName` on `/api/v1/system/status`, and `instanceName`
# beside it is settable and therefore not one.
#
# The five documents also disagree about which OpenAPI patch they were generated
# against -- 3.0.1, 3.0.4, 3.0.4, 3.0.4, 3.0.1 -- and about `info.version`:
# "3.0.0" for sonarr and radarr, "1.0.0" for the other three.
#
# **The credential is documented as a query parameter as well as a header**, on
# all five: `apikey`, "Apikey passed as query parameter", beside `X-Api-Key`.
# Recorded and not served, because serving it would make a credential in a URL
# the easy path in local development.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Prowlarr is self-hosted and
#     there is no public instance.
#   - History and system status. 93 paths is an indexer manager: indexers,
#     applications, download clients, notifications, the search proxy and the
#     indexer-stats surface each want their own evidence.
#   - The eventType filter is served over the string, not the integers.
#     Encoding the integer mapping would mean asserting the enum's declaration
#     positions are its wire values, which none of the five documents states.
#   - The credential is checked in the header.

recipe: prowlarr
capability: media
version: 0.1.0

upstream:
  api: "v1"
  docs: https://prowlarr.com/docs/api/
  spec: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
  spec_hash: 7013c5ed7875ed8292024e5a8095f2b1be51b16a79f22cce1f15c98a675f41b7
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldronprowlarrapikey000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: records
    count_field: totalRecords
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message

resources:
  history:
    id:
      style: numeric
      type: number
    fields:
      # The scope field, and it names an indexer rather than a piece of media.
      # Its counterparts are seriesId, movieId, artistId and bookId, and none
      # of the five accepts another's spelling.
      indexerId:
        type: number
      # A boolean no sibling has, because no sibling logs a query that can
      # simply fail without failing a download.
      successful:
        type: boolean
        default: true
      # A string here and an integer in the filter of the same name.
      eventType:
        type: string
        default: indexerQuery
      downloadId:
        type: string
      date:
        type: datetime

  status:
    id:
      style: opaque
      field: appName
    fields:
      # The only field in the whole API that says which of the five you have
      # reached.
      appName:
        type: string
      instanceName:
        type: string
      version:
        type: string
      branch:
        type: string
      appData:
        type: string
      startupPath:
        type: string
      osName:
        type: string
      isDocker:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/v1/history
    resource: history
    operation: list
    pagination:
      style: page
      limit_param: pageSize
      cursor_param: page
      limit: 10
      first_page: 1
    filters:
      - field: indexerId
        param: indexerIds
      - field: eventType
        param: eventType
      - field: successful
        param: successful

  - method: GET
    path: /api/v1/system/status
    resource: status
    operation: list
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
  not_found:
    status: 404
    message: "NotFound"
  rate_limit:
    status: 429
    message: "Too Many Requests"

fixtures:
  empty:
    history: []
    status: []

  indexers:
    status:
      - appName: Prowlarr
        instanceName: Prowlarr
        version: 2.1.2.5152
        branch: master
        appData: /config
        startupPath: /app/prowlarr/bin
        osName: ubuntu
        isDocker: true
    history:
      - id: 7701
        indexerId: 3
        # Position 2 in this fork's enum. On Sonarr position 2 is
        # seriesFolderImported and on Radarr it is downloadFolderImported.
        eventType: indexerQuery
        successful: true
        downloadId: ""
        date: "2026-09-06T09:14:00Z"
      - id: 7702
        indexerId: 3
        # Position 4 here. On Sonarr and Lidarr position 4 is downloadFailed.
        eventType: indexerAuth
        # The boolean no sibling has: a query that ran and did not succeed,
        # which is not a failed download.
        successful: false
        downloadId: ""
        date: "2026-09-06T09:15:20Z"
      - id: 7703
        indexerId: 8
        # Position 1, and the one event all five have -- under a different
        # name here. The other four call it `grabbed`.
        eventType: releaseGrabbed
        successful: true
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-06T10:02:41Z"

conformance:
  - name: only appName says which of the five this is
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/system/status
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        # Not the path, not the credential, not the envelope. This field, on
        # five products that install side by side.
        appName: Prowlarr
        version: 2.1.2.5152
        branch: master

  - name: the event that all five share is renamed here
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      query:
        eventType: releaseGrabbed
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        # Position 1 in every one of the five enums, and the only fork that
        # spells it this way. A client switching on the string handles four
        # siblings and falls through on this one.
        'records[0].eventType': releaseGrabbed
        'records[0].id': 7703
        # And the only record here that carries one, because a query and an
        # authentication have no download attached -- so the field is the
        # empty string rather than null on the ones that do not.
        'records[0].downloadId': "A1B2C3D4E5F6"
      absent:
        - 'records[1]'

  - name: the record carries a boolean no sibling has and lacks the ones they share
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        # `successful` exists here and on none of the other four, because
        # Prowlarr logs indexer queries rather than downloads -- a query can
        # simply fail without a download failing.
        'records[1].successful': false
        'records[0].successful': true
      absent:
        # And the fields the other four share are not here at all.
        - 'records[0].sourceTitle'
        - 'records[0].quality'
        - 'records[0].qualityCutoffNotMet'

  - name: the scope field names an indexer, not a piece of media
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      query:
        # indexerIds here; seriesIds, movieIds and artistIds on three of the
        # siblings, and Readarr has no plural filter at all. ASP.NET Core
        # model binding drops a query key with no matching property, so the
        # wrong spelling is a filter that returns everything.
        indexerIds: "8"
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        'records[0].indexerId': 8
        'records[0].id': 7703
      absent:
        - 'records[1]'

  - name: the successful filter is a boolean of its own
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      query:
        successful: "false"
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        'records[0].id': 7702
        'records[0].eventType': indexerAuth
      absent:
        - 'records[1]'

  - name: the paged envelope names its own page and size back
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      query:
        page: "1"
        pageSize: "2"
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        # page, pageSize, totalRecords, records -- the same envelope all five
        # forks answer with, which is part of why they are hard to tell apart.
        page: 1
        pageSize: 2
        totalRecords: 3
        'records[0].date': "2026-09-06T09:14:00Z"
      absent:
        - 'records[2]'

  - name: the instance names itself separately from the product
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/system/status
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 200
      body:
        # Settable, and defaulting to the product name -- so it looks like a
        # second discriminator and is not one.
        instanceName: Prowlarr
        appData: /config
        startupPath: /app/prowlarr/bin
        osName: ubuntu
        isDocker: true

  - name: no credential is refused
    source: https://raw.githubusercontent.com/Prowlarr/Prowlarr/develop/src/Prowlarr.Api.V1/openapi.json
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"

  - name: "a missing record says so in these words"
    source: "https://prowlarr.com/docs/api/"
    arm: not_found
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 404
      body:
        message: "NotFound"

  - name: "the rate limit says so in these words"
    source: "https://prowlarr.com/docs/api/"
    arm: rate_limit
    fixture: indexers
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronprowlarrapikey000000000
    expect:
      status: 429
      body:
        message: "Too Many Requests"
