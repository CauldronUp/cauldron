# Dynatrace Recipe for Cauldron
#
# Dynatrace watches infrastructure: hosts, processes, services, containers --
# the topology a fleet is made of, discovered automatically and kept in a
# model Dynatrace calls Smartscape. This Recipe covers one corner of the
# Environment API v2, GET /api/v2/entities, which is how a script reads that
# topology back. The task this Recipe answers to asked for the smallest thing
# each of three providers has an id for. For Dynatrace that thing is the
# entity: a topology node such as SERVICE-1125C375A187D27A or
# HOST-06F288EE2A930951 (both from Dynatrace's own worked example, quoted
# below), typed by the literal prefix baked into the id string, addressed by
# nothing smaller. There is no per-metric-datapoint id in this corner of the
# API -- a datapoint is a value at a timestamp on an entity's time series, not
# a record with an identity of its own.
#
# Whether an entityId is stable across a restart of the process or host it
# names is NOT established here, and that gap is deliberate rather than
# missed. Every Dynatrace reference page this Recipe could reach --
# entity-v2's own description page, the entities-list endpoint page, the
# authentication page -- was checked for language about id persistence,
# reuse, or invalidation, and none of them said anything on the point either
# way. Stating "entity ids are stable" or "process-instance ids change on
# restart" without a citation would be exactly the fabrication this task
# forbids, worse than silence, so this Recipe says only what it can show:
# entityId encodes a type prefix and nothing here says whether the digits
# after the dash outlive the thing they name.
#
# Dynatrace does have a concept of a person using a browser -- Real User
# Monitoring, session replay for web and mobile apps -- and it is a
# genuinely separate product surface (Digital Experience Monitoring) reached
# through different routes this Recipe does not model at all. Nothing below
# should be read as Dynatrace's answer to "is a user a person or a browser";
# this corner of the API has no user concept, only topology, and folding RUM
# in here to answer that question for the sake of completeness would be
# describing an API this Recipe never called.
#
# ── The hostname, the scheme, and what a fabricated tenant actually proves ──
#
# Every Dynatrace SaaS environment lives at its own hostname,
# {environmentId}.live.dynatrace.com -- confirmed in Dynatrace's own
# authentication reference, which shows
# "https://mySampleEnv.live.dynatrace.com/api/v1/config/clusterversion" as
# its own worked path -- and every request needs a header whose scheme word
# is Dynatrace's own, not the usual one: "Authorization: Api-Token
# dt0c01.abc123.abcdefjhij1234567890" is the reference's own literal example.
# That much is documented and quoted rather than assumed.
#
# Verifying it live, the way this task asks, meant probing a fabricated
# environment id -- abc12345.live.dynatrace.com, chosen to look like a real
# one and belonging to nobody -- and every single probe against it, on
# 2026-09-01, answered the identical way:
#
#   GET  /api/v2/entities                          (no credential)
#   GET  /api/v2/entities                          (Api-Token, made up)
#   GET  /api/v2/entities                          (Bearer, wrong scheme)
#   GET  /api/v2/this-route-does-not-exist-xyz     (no credential)
#   POST /api/v2/entities                          (no credential)
#   PATCH /api/v2/entities                         (no credential)
#
# HTTP/1.1 404 Not Found, Content-Type: application/json, Content-Length: 23,
# body {"message":"Not Found"} -- byte for byte the same 23 bytes every time,
# with an apigw-requestid header and Via: CloudFront on each response. Those
# two headers are the fingerprint of AWS API Gateway's own built-in "no such
# resource" response, which is the generic answer API Gateway gives before a
# request ever reaches whatever sits behind it. Six requests, three questions
# (which credential, which path, which method) and one answer to all of
# them: this environment id does not name a real, provisioned tenant, and
# the gateway says so before routing or authentication for that tenant is
# ever consulted. GET / on the same fabricated host, by contrast, 302s to a
# shared "Account Management" single-page app -- confirming the wildcard
# DNS resolves somewhere real, just not somewhere that knows this
# environment id.
#
# That is a genuine, verified finding, and it is also a limit on every other
# claim this Recipe can make about a live Dynatrace tenant. This task
# forbids signing up for anything, so no real environment was ever reached,
# and a fabricated one answers every question the same way regardless of what
# was asked -- which means the ordinary probes (does a missing credential
# read differently from a wrong one? does routing happen before
# authentication? is there a real 405?) come back degenerate rather than
# negative. This Recipe does not convert "the gateway never got far enough to
# tell us" into "so they must be the same" for a real tenant; it states
# plainly that those questions were attempted and could not be answered this
# way, and it declares no absent/malformed/rejected split for exactly that
# reason -- one generic message covers every credential verdict below,
# honestly reflecting that none of the three was ever actually distinguished
# on a real backend.
#
# The 404 shape above is, however, real and reproducible, and this Recipe
# uses it for errors.unknown_route: two of the six probes (the nonsense path,
# and a wrong method against the real one) are pinned as verified cases
# below, on the strength that apigw-requestid and CloudFront are Dynatrace's
# platform layer rather than anything a specific tenant's backend renders --
# the same generic "no such resource" any API Gateway deployment sends when
# nothing downstream is consulted. No 405 was found anywhere in six probes
# across three methods, joining turso/recipe.yaml elsewhere in this
# collection, whose own live host answers a mistyped path and a mistyped
# method with the identical body and never sends a 405 either.
#
# ── The one worked example this Recipe could find ──
#
# Dynatrace's entities-list reference page gives exactly one worked JSON
# example, for the easyTravel demo application Dynatrace itself ships:
#
#   {"totalCount": 52, "pageSize": 50,
#    "nextPageKey": "AQArdHlwZSgiU0VSVklDRSIpL",
#    "entities": [{"entityId": "SERVICE-1125C375A187D27A",
#    "displayName": "dotNetBackend_easyTravel_x64",
#    "lastSeenTms": 1590609632865,
#    "properties": {"serviceTechnologyTypes":
#    ["IIS app pool", "ASP.NET", "DotNet"]}}]}
#
# entityId, displayName, lastSeenTms and properties below are that example,
# copied rather than invented. totalCount in this Recipe's own fixture is 1,
# not 52 -- the documentation's count describes the documentation's account,
# not this Recipe's one-entity fixture, and reusing 52 here would claim a
# fixture size that does not exist. The schema page names other fields on an
# entity -- type, firstSeenTms, tags, managementZones, fromRelationships,
# toRelationships, icon -- with no worked value for any of them anywhere
# this Recipe could reach, so none are modelled; see the gaps below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No get-one-entity route (GET /api/v2/entities/{entityId}). Only the
#     list page's worked example was found; inventing a single-entity
#     response by reusing the list schema would be a guess about a route
#     this Recipe never saw a real answer from.
#   - type, firstSeenTms, tags, managementZones, fromRelationships,
#     toRelationships and icon are documented as existing on the Entity
#     schema and are not modelled -- no worked value for any of them was
#     found. An entity's type is visible only as the prefix on its own
#     entityId (SERVICE-, HOST-), which this Recipe does not split into a
#     separate field it cannot demonstrate a value for.
#   - entitySelector, which the reference calls required "when you're
#     querying the first page of results," is accepted on the wire (a real
#     client sends it) but not enforced -- this Recipe's one-entity fixture
#     does not depend on it, and the reference gives no worked error body
#     for the case where it is missing, only an auto-generated schema
#     placeholder ({"code": 1, "message": "string", ...}) that is not a real
#     example and is not used here.
#   - No worked 401/403/429 body was found anywhere reachable -- only the
#     same auto-generated ErrorEnvelope placeholder mentioned above. This
#     Recipe's authentication_error carries a status and no message,
#     matching the honest default this format falls back to when a message
#     is left unset, rather than inventing prose Dynatrace never showed.
#   - No upstream.spec. Dynatrace's own OpenAPI description is served
#     per-tenant, at {environmentId}.live.dynatrace.com/api/v2/openapi.json
#     -- there is no tenant-independent copy this Recipe could fetch and
#     fingerprint without the account this task forbids obtaining.
#
# The token below is a fixture, shaped like Dynatrace's own documented
# example, and belongs to no real environment.

recipe: dynatrace
capability: observability
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2

auth:
  scheme: header
  header: Authorization
  prefix: "Api-Token "
  keys:
    - dt0c01.CAULDRON000.abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqr
  # Verified live: a nonsense path and a wrong method both answered API
  # Gateway's own 404 with no credential presented at all -- routing (or,
  # more precisely, the gateway's tenant lookup) is what refused those
  # requests, never a credential check. See the header for the fuller
  # picture this one flag cannot carry on its own.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: totalCount
    cursor_field: nextPageKey
    cursor_null: true
  resource:
    style: bare
  error:
    style: nested
    message_field: message

resources:
  entity:
    collection: entities
    id:
      style: opaque
      field: entityId
    fields:
      displayName:
        type: string
        required: true
      lastSeenTms:
        type: timestamp_ms
      properties:
        type: map

routes:
  - method: GET
    path: /api/v2/entities
    resource: entity
    operation: list
    pagination:
      style: cursor
      cursor_param: nextPageKey
      limit_param: pageSize

errors:
  # No worked body was found anywhere this Recipe could reach for a real
  # tenant's authentication failure -- see the header. Status only; the
  # message stays unset and falls back to this format's own generic wording
  # rather than inventing Dynatrace's.
  authentication_error:
    status: 401

  # Verified live against a fabricated environment id: a nonsense path with
  # no credential. 23 bytes, byte-identical every time this was checked --
  # see the header for exactly what this does and does not establish about
  # a real tenant. Flat, not nested: this is API Gateway's own generic
  # answer, a different layer from the ErrorEnvelope schema Dynatrace's own
  # reference documents for its application-level failures.
  unknown_route:
    status: 404
    style: flat
    message: "Not Found"

  # No 405 was found anywhere in this Recipe's live probing -- see the
  # header. Same body as unknown_route, declared separately on purpose: the
  # finding is that the two are indistinguishable, not that only one of them
  # exists. after_routing means a wrong method on the one real path reaches
  # this automatically, with no credential consulted, matching what a wrong
  # method actually did live.
  method_not_allowed:
    status: 404
    style: flat
    message: "Not Found"

fixtures:
  empty: {}

  small-account:
    entity:
      # Dynatrace's own easyTravel demo example, copied rather than
      # invented -- see the header.
      - id: SERVICE-1125C375A187D27A
        displayName: dotNetBackend_easyTravel_x64
        lastSeenTms: 1590609632865
        properties:
          serviceTechnologyTypes: ["IIS app pool", "ASP.NET", "DotNet"]

conformance:
  - name: an entity is the easyTravel example, copied rather than invented
    source: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2/get-entities-list
    fixture: small-account
    request:
      method: GET
      path: /api/v2/entities
      query:
        entitySelector: type(SERVICE)
      headers:
        Authorization: "Api-Token dt0c01.CAULDRON000.abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqr"
    expect:
      status: 200
      body:
        entities[0].entityId: SERVICE-1125C375A187D27A
        entities[0].displayName: dotNetBackend_easyTravel_x64
        entities[0].lastSeenTms: 1590609632865
        entities[0].properties.serviceTechnologyTypes[0]: "IIS app pool"
        # This Recipe's own fixture has one entity. The documentation's
        # totalCount (52) describes the documentation's account, not this
        # one -- see the header for why that number is not reused here.
        totalCount: 1
        nextPageKey: null

  - name: an entity's type lives only in the prefix of its own id
    source: https://docs.dynatrace.com/docs/dynatrace-api/environment-api/entity-v2/get-entities-list
    fixture: small-account
    request:
      method: GET
      path: /api/v2/entities
      headers:
        Authorization: "Api-Token dt0c01.CAULDRON000.abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqr"
    expect:
      status: 200
      body:
        # SERVICE-, not a separate type field. See the header on why no
        # type property is modelled: no worked value for one was found.
        entities[0].entityId: SERVICE-1125C375A187D27A
      absent:
        - entities[0].type

  - name: a request with no credential at all is refused
    source: https://docs.dynatrace.com/docs/dynatrace-api/basics/dynatrace-api-authentication
    fixture: small-account
    request:
      method: GET
      path: /api/v2/entities
    expect:
      # Status only -- see errors.authentication_error and the header for
      # why no body is asserted here.
      status: 401

  - name: a path this API has no route for is API Gateway's own generic 404
    source: https://abc12345.live.dynatrace.com/api/v2/this-route-does-not-exist-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/this-route-does-not-exist-xyz
    expect:
      status: 404
      headers:
        Content-Type: application/json
      body:
        message: "Not Found"

  - name: the method never changes the answer either
    source: https://abc12345.live.dynatrace.com/api/v2/entities
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v2/entities
    expect:
      # Struck live with no credential at all, against the real path, with
      # the wrong method: the identical 404 a nonsense path gets. No 405
      # anywhere -- see the header, and turso/recipe.yaml elsewhere in this
      # collection for the same finding on a different provider.
      status: 404
      body:
        message: "Not Found"
