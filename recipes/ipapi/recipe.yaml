# ip-api Recipe for Cauldron
#
# TLS is a paid feature, and the message saying so is delivered over TLS.
#
#   GET https://ip-api.com/json/1.1.1.1
#   403 {"status": "fail",
#        "message": "SSL unavailable for this endpoint, order a key at
#                    https://members.ip-api.com/"}
#
# The connection is accepted, the certificate is valid, the handshake completes,
# and the body says SSL is unavailable. Everything TLS is for worked; what is
# missing is the entitlement. So a page served over HTTPS cannot call this API
# without paying, and the way it finds out is a JSON document that arrived over
# HTTPS.
#
# **And every other failure is a 200.** A malformed address and a string that is
# not an address at all both answer HTTP 200:
#
#   /json/999.999.999.999  ->  200 {"status": "fail", "message": "invalid query"}
#   /json/zzznotanip       ->  200 {"status": "fail", "message": "invalid query"}
#
# So the status line is not a signal. The only thing that says whether a lookup
# worked is the word in "status", which is a string -- "success" or "fail" --
# and a client checking response.ok gets true for both.
#
# Written against the live API rather than a document: every case below was
# checked against ip-api.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A format it does not recognise is the marketing website. /json/, /csv/
#      and /xml/ each answer in their own content type, and /nosuchformat/
#      answers 200 with eleven kilobytes of HTML -- the homepage, meta keywords
#      and all. A client calling JSON.parse on it gets a syntax error at
#      character one, on a 200.
#   2. The rate limit is X-Rl and X-Ttl. Two abbreviations, neither standard,
#      one counting requests left and the other seconds left. X-Ttl falls with
#      the clock inside a window rather than resetting at a boundary, so two
#      requests a second apart see different numbers.
#   3. The autonomous system is a number and a name in one string.
#      "as": "AS13335 Cloudflare, Inc." -- with a comma inside it, beside an
#      "isp" of "Cloudflare, Inc" that has no full stop and an "org" that is a
#      different organisation again.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron serves over HTTP locally, which is what this API does without a
#     key, so the TLS refusal is armed as a fault rather than reached by
#     changing scheme: an emulator cannot offer a certificate and then decline
#     to use it.
#   - /csv/ and /xml/ are recorded above rather than served. The same path in
#     three content types is a property of the path prefix, and a Recipe that
#     served CSV would be claiming Cauldron can write it.
#   - One address is served, and it is 1.1.1.1 -- a public resolver, not a
#     person.

recipe: ipapi
capability: infrastructure
version: 0.1.0

upstream:
  api: ipapi
  docs: https://ip-api.com/docs

auth:
  # None, and no TLS either. A key buys both.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    fields:
      # Every failure says so in words as well, including the ones that are
      # not failures as far as HTTP is concerned.
      status: fail

resources:
  location:
    id:
      # The address, echoed back under a name that is about the request rather
      # than the answer.
      style: opaque
      field: query
    fields:
      # A string, and the only reliable signal that the lookup worked.
      status:
        type: string
      # Present only when it did not.
      message:
        type: string
      country:
        type: string
      countryCode:
        type: string
      region:
        type: string
      regionName:
        type: string
      city:
        type: string
      zip:
        type: string
      lat:
        type: number
      lon:
        type: number
      timezone:
        type: string
      isp:
        type: string
      org:
        type: string
      # A number and a name in one string, with a comma inside it.
      as:
        type: string

routes:
  - method: GET
    path: /json/{id}
    resource: location
    operation: get
    headers:
      # Two abbreviations, neither standard.
      X-Rl: "44"
      X-Ttl: "60"
      Access-Control-Allow-Origin: "*"

  # A format it does not recognise, answered with the marketing website.
  - method: GET
    path: /nosuchformat/1.1.1.1
    error: the_homepage
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  # Armed rather than routed: the sandbox has no TLS to decline.
  ssl_unavailable:
    status: 403
    message: "SSL unavailable for this endpoint, order a key at https://members.ip-api.com/"

  the_homepage:
    # Not an error status, and not a document either. Eleven kilobytes of HTML,
    # on a 200, written as the whole body rather than inside an envelope.
    status: 200
    style: text
    message: '<!DOCTYPE html><html lang="en"><head><style>html{visibility:hidden;opacity:0}</style><meta charset="utf-8"><meta name="description" content="Free IP Geolocation API - lookup any IP address">'
    fields: {}

fixtures:
  empty: {}

  addresses:
    location:
      # A public resolver, not a person.
      - id: 1.1.1.1
        status: success
        country: Australia
        countryCode: AU
        region: QLD
        regionName: Queensland
        city: South Brisbane
        zip: "4101"
        lat: -27.4766
        lon: 153.0166
        timezone: Australia/Brisbane
        # No full stop.
        isp: Cloudflare, Inc
        # A different organisation from the ISP.
        org: APNIC and Cloudflare DNS Resolver project
        # A number and a name, with a comma inside.
        as: AS13335 Cloudflare, Inc.

      # Not an address, and still a 200.
      - id: zzznotanip
        status: fail
        message: invalid query

conformance:
  - name: TLS is a paid feature, and the refusal arrives over TLS
    source: https://ip-api.com/json/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    arm: ssl_unavailable
    request:
      method: GET
      path: /json/1.1.1.1
    expect:
      # The handshake completed and the certificate was valid. What is missing
      # is the entitlement, and the way a client learns that is a document
      # delivered over the thing it is being told it cannot use.
      status: 403
      body:
        status: fail
        message: "SSL unavailable for this endpoint, order a key at https://members.ip-api.com/"

  - name: a string that is not an address is a 200
    source: http://ip-api.com/json/zzznotanip
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /json/zzznotanip
    expect:
      # response.ok is true. The only thing that says otherwise is a word.
      status: 200
      body:
        status: fail
        message: invalid query
        query: zzznotanip
      absent:
        # Nothing about a location, on a successful HTTP request.
        - country
        - lat
        - lon

  - name: and a lookup that worked says so the same way
    source: http://ip-api.com/json/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /json/1.1.1.1
    expect:
      status: 200
      body:
        # Same status line, same field, different word.
        status: success
        query: 1.1.1.1
        country: Australia
        countryCode: AU
        city: South Brisbane

  - name: the autonomous system is a number and a name in one string
    source: http://ip-api.com/json/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /json/1.1.1.1
    expect:
      status: 200
      body:
        # A comma inside the value, which is what makes the CSV format quote it.
        as: AS13335 Cloudflare, Inc.
        # No full stop on the ISP, and an org that is somebody else.
        isp: Cloudflare, Inc
        org: APNIC and Cloudflare DNS Resolver project

  - name: the coordinates are numbers and the postcode is a string
    source: http://ip-api.com/json/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /json/1.1.1.1
    expect:
      status: 200
      body:
        lat: -27.4766
        lon: 153.0166
        # Four digits, quoted, because postcodes are not numbers.
        zip: "4101"
        region: QLD
        regionName: Queensland
        timezone: Australia/Brisbane

  - name: the rate limit is two abbreviations
    source: http://ip-api.com/json/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /json/1.1.1.1
    expect:
      status: 200
      headers:
        # Requests left, and seconds left. Neither name is standard.
        X-Rl: "44"
        X-Ttl: "60"
        Access-Control-Allow-Origin: "*"

  - name: a format it does not recognise is the marketing website
    source: http://ip-api.com/nosuchformat/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /nosuchformat/1.1.1.1
    expect:
      # Eleven kilobytes of HTML, on a 200, where a client called JSON.parse.
      status: 200
      headers:
        Content-Type: text/html
      # Anchored, because an envelope carrying the HTML inside a field would
      # contain the doctype too, and the point is that nothing wraps it.
      body_matches: '^<!DOCTYPE html>'

  - name: and it advertises the API in its own meta tags
    source: http://ip-api.com/nosuchformat/1.1.1.1
    verified: "2026-08-30"
    fixture: addresses
    request:
      method: GET
      path: /nosuchformat/1.1.1.1
    expect:
      status: 200
      body_matches: 'Free IP Geolocation API - lookup any IP address'
