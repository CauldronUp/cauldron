# Castle Recipe for Cauldron
#
# A Castle decision is a verdict with the score attached, not the other way
# round. POST /v1/risk or /v1/filter answers {"action": "deny", "scores":
# {"account_abuse": {"score": 0.67}, "account_takeover": {"score": 0.77},
# "bot": {"score": 0.34}}, "signals": {"bot_behavior": {}, "proxy_ip": {},
# ...}} -- quoted verbatim from Castle's own published signals reference
# (https://docs.castle.io/docs/signals-reference). action is the closed
# three-value enum a policy resolves to (allow, challenge, deny -- Castle's
# own integration guide states the set in exactly those words), scores is
# three named floats in [0, 1] per category rather than one number, and
# signals names which named checks fired -- an object per signal rather than
# a string, empty in every worked example this Recipe could find, which
# reads as "this signal is present" rather than as a value carrying its own
# detail. There is no id anywhere in that object. Reason codes exist --
# signals is exactly that -- but an id to fetch the same decision back by
# does not, in the one worked response this Recipe could source. No opinion
# is not a value action takes either: three words, no fourth for "not
# evaluated."
#
# Castle's own documentation does not agree with itself about where action
# lives. The signals reference page's own JSON block puts it at the top
# level, exactly as quoted above. The integration guide
# (https://docs.castle.io/docs/integration-guide) shows a Ruby snippet
# checking `result[:policy][:action] == 'deny'` -- nested under a policy key
# that the other page's worked example does not have. Both are Castle's own
# words, on two different pages of the same reference, and this Recipe
# cannot tell whether the Ruby snippet is showing the wire shape or the
# client library's own object wrapping around a flatter response -- Ruby SDKs
# routinely restructure what they parse. Rather than guess, this Recipe
# builds the shape the one full, worked JSON example shows -- action at the
# top level -- and states the disagreement here instead of picking a side
# with a case. Compare recipes/census/recipe.yaml, whose header makes the
# same call about two Fivetran pages that disagree on the name of a healthy
# sync's terminal status.
#
# Four things struck live against api.castle.io, no account, no key:
#
#   1. Missing and wrong get the identical sentence. No Authorization header
#      and a syntactically fine but wrong Basic pair (-u junkuser:junkpass)
#      both answer 401 {"type": "unauthorized", "message": "Authentication
#      credentials are missing or invalid."}, byte for byte. Castle does not
#      distinguish the two verdicts this collection keeps finding some
#      providers do distinguish (compare recipes/firehydrant/recipe.yaml, two
#      sentences for the same pair of verdicts) -- one message covers both,
#      and this Recipe declares only the one entry that message needs.
#   2. The credential is checked before routing, for every method and every
#      path, with no exception found -- the same ordering
#      recipes/firehydrant/recipe.yaml and Airbyte's Recipe both settle on
#      elsewhere in this collection. GET /v1/risk (a real path, wrong method)
#      and GET /v1/nosuchroute (no such path at all) both answered the
#      identical 401 body above rather than a 405 or a 404 of their own --
#      struck with no credential and with a junk Basic pair, same result
#      both times. auth.after_routing is left at its default for exactly
#      this reason.
#   3. A header that is present and contains no whitespace at all crashes the
#      edge tier rather than being refused. "Authorization: garbagenospace",
#      "Authorization: Basic" with nothing after it, and a dozen shapes like
#      them all answered 500 Internal Server Error, Content-Type text/html,
#      openresty's own default error page, 174 bytes, reproduced exactly
#      four separate times against the live host. A header value that
#      contains a space -- including "Authorization: Basic YWJj", which
#      decodes to a colon-less "abc" and is not a usable credential by any
#      definition -- gets the ordinary 401 from finding 1 instead. The line
#      Castle's own edge draws is "does this header value contain a space,"
#      not "is this a well-formed Basic pair": narrower than what Cauldron's
#      own Malformed verdict can express, and the gap is stated below rather
#      than smoothed over.
#   4. Castle announces application/json on every response this Recipe
#      struck -- success or failure -- and the body actually is JSON every
#      time except the crash, which honestly announces text/html instead.
#      Nothing here found a provider claiming one Content-Type and sending
#      another, which several other Recipes in this collection do find.
#
# The credential itself: Castle's own IP Intelligence page
# (https://docs.castle.io/docs/ip-intelligence-api) shows the real curl
# command -- `curl -sSf -u ":$CASTLE_API_SECRET"` -- an empty username and
# the API Secret as the password, HTTP Basic. Every request below uses that
# shape.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron's Malformed verdict, from a Basic header Go's own parser
#     cannot split into a user and a password, is broader than the crash
#     boundary finding 3 describes. "Basic YWJj" (has a space, has the right
#     prefix, decodes to a colon-less string) fails Go's parse too and would
#     also be classified Malformed here -- so it would also get the 500,
#     where the live API answers the ordinary 401 for it. This Recipe claims
#     only the case it actually struck and reproduced identically (a header
#     with no space anywhere), not every input that happens to share
#     Cauldron's verdict.
#   - The request side is almost entirely unmodelled. Castle's own custom
#     parameters page (https://docs.castle.io/docs/api-custom-parameters)
#     shows that {"properties": {"account": {"type": "premium"}}} and
#     {"properties": {"account.type": "premium"}} are the same request --
#     nested and dotted forms are equivalent -- but nothing in Castle's own
#     published response ever echoes a submitted property back, so there is
#     no assertion this Recipe could make about it that would not just be
#     testing that Cauldron ignored what it was sent. Recorded here as a
#     finding with nothing to route it to, the way recipes/census/recipe.yaml
#     records a sync-run object it could not turn into a route.
#   - event, user, context, and every field that says what happened and to
#     whom are not modelled at all. Castle's own device-fingerprinting page
#     confirms a browser-generated "request token" is part of a real request
#     and states no field name for it in any block this Recipe could find,
#     so none is invented rather than guessed at from a plausible name
#     nobody actually read.
#   - allow and challenge are both real, both cited by name in Castle's
#     integration guide, and neither has a worked JSON example anywhere this
#     Recipe could find. Only deny is built into a fixture, because it is
#     the only one of the three with a full response this Recipe actually
#     read rather than inferred.
#   - IP Intelligence (GET /v1/ips/{value}, POST /v1/ips/query, dataset
#     downloads) is a separate product on the same host and is not modelled
#     beyond the one curl example that pins the auth scheme above.
#   - No rate limit was ever seen on any response this Recipe struck, so
#     none is declared -- an absence in what was observed, not a claim that
#     this host never sends one.
#
# Every key and secret below is a fixture invented for this Recipe. No
# account was created and no key was ever requested to write it.

recipe: castle
capability: identity
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.castle.io/docs/risk-scoring

auth:
  # Empty username, the secret as the password -- Castle's own curl example,
  # see the header. auth.after_routing is left at its default: the
  # credential is checked first, for every method and every path, with no
  # exception this Recipe found.
  scheme: basic
  credential: password
  keys:
    - cauldron-castle-fixture-secret-0000000000000000
  # A Basic header with no space in it anywhere crashes Castle's own edge
  # tier rather than being refused -- see finding 3. absent_error and
  # rejected_error are both left unset on purpose: finding 1 is that the
  # live API does not tell those two verdicts apart, and the fallback
  # (authentication_error) already carries the one sentence both need.
  malformed_error: malformed_edge_crash

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    type_field: type
    code_field: "-"

resources:
  # One assessment. Not addressable afterwards: see the header's answer to
  # whether a Castle decision has an id, which is the same worked example
  # this whole resource is built from.
  risk_assessment:
    id:
      style: opaque
      field: "-"
    fields:
      # allow, challenge, or deny -- Castle's own words for the complete set,
      # in https://docs.castle.io/docs/integration-guide. No opinion is not
      # a fourth value; the enum is closed at three.
      action:
        type: string
        default: deny
      # Three named categories, not one number. Quoted verbatim from
      # https://docs.castle.io/docs/signals-reference -- see the header for
      # why this is the shape this Recipe builds and the other page's
      # policy.action nesting is not.
      account_abuse_score:
        type: number
        default: 0.67
        in: scores.account_abuse
        as: score
      account_takeover_score:
        type: number
        default: 0.77
        in: scores.account_takeover
        as: score
      bot_score:
        type: number
        default: 0.34
        in: scores.bot
        as: score
      # Named checks, not a sentence. Every worked example shows an empty
      # object per signal -- presence is the information, not a nested
      # detail -- and these four are exactly the ones Castle's own reference
      # shows firing together on the deny example above.
      signal_bot_behavior:
        type: map
        default: {}
        in: signals
        as: bot_behavior
      signal_proxy_ip:
        type: map
        default: {}
        in: signals
        as: proxy_ip
      signal_disposable_email:
        type: map
        default: {}
        in: signals
        as: disposable_email
      signal_multiple_accounts_per_device:
        type: map
        default: {}
        in: signals
        as: multiple_accounts_per_device

routes:
  # Anonymous users -- before login or registration succeeds.
  - method: POST
    path: /v1/filter
    resource: risk_assessment
    operation: create

  # Authenticated users -- after a successful login. Castle's own
  # integration guide states both endpoints answer the same policy/action
  # shape, which is why one resource serves both routes here.
  - method: POST
    path: /v1/risk
    resource: risk_assessment
    operation: create

errors:
  # Covers both verdicts Castle does not tell apart -- see finding 1 and the
  # auth block above.
  authentication_error:
    status: 401
    type: unauthorized
    message: "Authentication credentials are missing or invalid."

  # The crash. text/html, not the JSON envelope every other failure here
  # uses -- see finding 3.
  malformed_edge_crash:
    status: 500
    style: text
    headers:
      Content-Type: "text/html"
    message: |
      <html>
      <head><title>500 Internal Server Error</title></head>
      <body>
      <center><h1>500 Internal Server Error</h1></center>
      <hr><center>openresty</center>
      </body>
      </html>

fixtures:
  empty: {}

# Every case below not carrying a verified date is read from
# https://docs.castle.io -- signals-reference.md, integration-guide.md, and
# ip-intelligence-api.md, all fetched 2026-09-01 -- and was never struck
# against a real Castle account: no App ID or API Secret exists to strike
# /v1/risk or /v1/filter with. A verified date means the exact request shown
# was struck live against api.castle.io on that date.
conformance:
  - name: no credential at all
    source: https://api.castle.io/v1/risk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/risk
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        type: unauthorized
        message: "Authentication credentials are missing or invalid."

  - name: a syntactically fine but wrong pair says the identical sentence
    # Live, -u junkuser:junkpass: byte for byte the same body the absent
    # case above gets. Castle does not distinguish these two verdicts.
    source: https://api.castle.io/v1/risk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/risk
      headers:
        Authorization: "Basic anVua3VzZXI6anVua3Bhc3M="
    expect:
      status: 401
      body:
        type: unauthorized
        message: "Authentication credentials are missing or invalid."

  - name: a header with no space anywhere crashes the edge instead of refusing it
    # Live, reproduced four separate times against the real host with four
    # different no-space values. This is the sharpest finding in this
    # Recipe: not a refusal, a 500, in a different media type than every
    # other failure this host sends.
    source: https://api.castle.io/v1/risk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/risk
      headers:
        Authorization: garbagenospace
    expect:
      status: 500
      headers:
        Content-Type: "text/html"
      body_matches: "500 Internal Server Error"

  - name: a real path with the wrong method is refused for its credential, not its method
    # Live, no credential: 401, not 405. The credential is checked before
    # routing, for every method this Recipe tried.
    source: https://api.castle.io/v1/risk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/risk
    expect:
      status: 401
      body:
        type: unauthorized
        message: "Authentication credentials are missing or invalid."

  - name: a path that does not exist is refused the identical way
    # Live, no credential: the same 401 a real path gets, not a 404 of its
    # own. Routing is never consulted before the credential is.
    source: https://api.castle.io/v1/nosuchroute
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
    expect:
      status: 401
      body:
        type: unauthorized
        message: "Authentication credentials are missing or invalid."

  - name: a decision is a verdict with the score attached, not the other way round
    source: https://docs.castle.io/docs/signals-reference
    fixture: empty
    request:
      method: POST
      path: /v1/risk
      headers:
        Authorization: "Basic OmNhdWxkcm9uLWNhc3RsZS1maXh0dXJlLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw"
      json:
        event: $login.succeeded
    expect:
      status: 200
      body:
        action: deny
        scores.account_abuse.score: 0.67
        scores.account_takeover.score: 0.77
        scores.bot.score: 0.34
        signals.bot_behavior: {}
        signals.proxy_ip: {}
      absent:
        # No id anywhere in Castle's own worked example -- the direct answer
        # to whether a decision is addressable afterwards. It is not, in the
        # one response this Recipe could source.
        - id
        - request_token
        - policy

  - name: the anonymous endpoint answers the identical shape
    # Castle's own integration guide states /filter and /risk share the same
    # policy/action response -- struck here against the same fixture secret
    # to show one resource is honestly serving both.
    source: https://docs.castle.io/docs/integration-guide
    fixture: empty
    request:
      method: POST
      path: /v1/filter
      headers:
        Authorization: "Basic OmNhdWxkcm9uLWNhc3RsZS1maXh0dXJlLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw"
      json:
        event: $registration
    expect:
      status: 200
      body:
        action: deny
        scores.bot.score: 0.34

  - name: action is a closed three-value enum with nothing for no opinion
    # allow and challenge are both real and both named in Castle's own
    # integration guide; neither has a worked JSON example this Recipe could
    # find, so neither is built into a fixture -- see the header's fidelity
    # gaps. What this case pins is the one value this Recipe did read in
    # full, and the absence of a fourth word beside it.
    source: https://docs.castle.io/docs/integration-guide
    fixture: empty
    request:
      method: POST
      path: /v1/risk
      headers:
        Authorization: "Basic OmNhdWxkcm9uLWNhc3RsZS1maXh0dXJlLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw"
      json:
        event: $login.succeeded
    expect:
      status: 200
      body:
        action: deny
