# InfluxDB Cloud Recipe for Cauldron
#
# The task named three genuinely different APIs -- v1, v2 and v3 -- and
# asked which one cloud2.influxdata.com actually serves today. Checked
# live, with no account, 2026-09-01: none of them, cleanly. The host is the
# InfluxDB Cloud web console (Quartz, its own internal name -- it appears in
# the console's own 404 page CSS class, quartz--error-body), and almost
# every path on it is a browser route that answers a session redirect
# rather than an API response. This Recipe models the one narrow slice that
# is not that, and states the rest plainly rather than routing paths that
# do not work.
#
# GET /api/v2/orgs -- unauthenticated -> 401 JSON
# {"code":"unauthorized","message":"Missing authorization header"}. A real,
# live, token-checked v2 endpoint. But GET /api/v2/buckets -- the resource a
# "database" in this group's question would actually be, and reachable with
# the identical Authorization: Token header a working /orgs call would use
# -- answers 302 to /login and sets a session cookie, ignoring the
# Authorization header entirely: sent with no header, a junk one, and the
# exact "Token junktoken12345" shape /orgs itself parses, all three answer
# the byte-identical redirect. So does GET /api/v2/me, GET /health, and GET
# /api/v3/query_sql. A bucket -- InfluxDB's database -- cannot be created,
# listed or read with an API token on this host at all; the operation this
# group's question is centrally about requires a browser session this task
# was never going to obtain, which this Recipe declines to route rather
# than approximate, the same refusal Pinecone's Recipe in this collection
# makes for its own data plane and for the identical reason.
#
# Write and query are worse than merely session-gated: they are not there.
# InfluxDB's own "Get started: Write data" guide gives this exact curl
# command, host included, quoted verbatim:
#
#   curl "https://cloud2.influxdata.com/api/v2/write?bucket=get-started&
#         precision=s" --header "Authorization: Token DATABASE_TOKEN" ...
#
# Sent exactly as documented, both with a junk token and with none at all,
# live: 404, Quartz's own branded error page (a "GET INFLUXDB" signup
# button baked into the HTML), not a JSON auth failure and not a generic
# gateway 404. The v1-compatible /write?db=... answers a third way again --
# 302 to /login, the same session-gated shape as /api/v2/buckets. Whatever
# the explanation -- a stale guide, a host that no longer serves what it
# once did, traffic that belongs on a different, undiscoverable per-account
# host the way this group's Milvus Recipe found for Zilliz's vectordb
# surface -- the documented write endpoint is not live at the host the
# documentation cites it at, checked as literally as this task could check
# it, and this Recipe routes none of write, query, or InfluxDB 3's
# query_sql/write_lp.
#
# One narrow, genuine credential-checking surface survives on this host --
# GET and POST /api/v2/orgs, and GET /api/v2/orgs/{id} -- confirmed by a
# routing tell rather than assumed: DELETE and PATCH on /api/v2/orgs, a
# method this path does not register, answer the Quartz 404 branded page
# immediately, with no credential sent and none required to provoke it,
# while GET and POST on the identical path reach a real credential check.
# The two are on different code paths entirely; the registered methods
# reach an actual API handler and everything else falls to the web
# console's own catch-all.
#
# That handler draws its own line between absent and everything else, and
# collapses malformed and rejected into one sentence rather than keeping
# three -- checked live, every shape:
#
#   no Authorization header at all           -> "Missing authorization
#                                                header"
#   Authorization: Token junktoken12345      -> "Missing token"
#   Authorization: junktoken12345 (no verb)  -> "Missing token"
#   Authorization: Token  (nothing after)    -> "Missing token"
#   Authorization: token junktoken12345 (lowercase) -> "Missing token"
#
# Four different malformations, one sentence, "Missing token" -- itself a
# strange thing to call a header that was plainly sent, the same kind of
# provider-chosen mislabel FireHydrant's and Pipedream's Recipes in this
# collection already record for their own hosts. malformed_error and
# rejected_error are declared as the identical entry below on purpose,
# rather than left to the fallback default, because that collapse is a real
# claim this host earns: it does not distinguish a garbled header from a
# well-formed one that is simply wrong.
#
# A fifth shape is real and not modelled at all: Authorization: Bearer
# junktoken12345 -- a keyword this format's header scheme does not
# recognise as this Recipe's own prefix -- answers 401 "Signature error"
# live, a third sentence again, neither "Missing token" nor the absent
# case. That means this v2-shaped path also accepts a second, undocumented
# credential type -- a JWT, verified by the wording -- on the identical
# route the published Token scheme uses, the same finding ClickHouse
# Cloud's Recipe in this collection makes for a Bearer-shaped header on its
# own Basic-only route. Recorded here rather than asserted as a case that
# would fail its own build, the discipline Milvus's Recipe uses for its own
# untestable middle case. Not auth.also's gap either, for the identical
# reason ClickHouse states: a long-lived database token on this route and a
# short-lived session JWT on the same route are two different credentials,
# not one credential in two carriers, and "Signature error" is its own
# third sentence rather than a paraphrase of "Missing token" -- the tell
# that a different checker answered, not the same one reading a second
# transport.
#
# The Organization shape below is InfluxDB's general v2 OSS description
# (raw.githubusercontent.com/influxdata/openapi, contracts/oss.yml),
# because Cloud does not publish its own machine-readable description for
# this narrow surviving slice and the OSS one is the closest thing to a
# specification this route has. It may not describe Cloud's own Organization
# exactly -- defaultStorageType, an OSS tsm/iox distinction, is left out of
# the fields below for that reason -- and upstream.spec is not recorded,
# because a fingerprint of a different product's description is not a
# fingerprint of this one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Buckets (databases), write, query, and every v3 path are not routed
#     at all -- see above. This Recipe's contribution to the question this
#     group exists to answer is that neither half of the control-plane/
#     data-plane split is cleanly an API on this host: the control plane
#     itself is mostly a web console, and the sliver of it that is a real
#     API does not reach the resource ("database") the group's question is
#     actually about.
#   - /health, /api/v2/me, /api/v3/query_sql and every other path this task
#     probed that redirects to /login are real, live, and not modelled:
#     there is no credential-checked failure to route, only a session
#     redirect this format has no fixture-holder session for.
#   - What a real, working v2 token answers on /api/v2/orgs is read from
#     the OSS description, not observed -- no account or token exists.
#   - Members, labels, secrets and the org-scoped sub-resources Organization
#     .links documents are real and not modelled: this Recipe is about the
#     version and routing questions the task named, not a full port of the
#     v2 management surface.
#
# The token below is a fixture and belongs to no organisation.

recipe: influxdb
capability: database
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.influxdata.com/influxdb3/cloud-serverless/api/

auth:
  scheme: header
  header: Authorization
  prefix: "Token "
  keys:
    - cauldroninfluxdbfixturetoken00000000000000000000
  absent_error: missing_authorization_header
  # Declared identical to rejected_error on purpose -- see the header. This
  # host's own handler does not draw the line this format's Malformed
  # verdict draws.
  malformed_error: missing_token
  rejected_error: missing_token
  # Routing runs before the credential is examined for the two registered
  # methods on this path, but a wrong method on it never reaches the
  # credential check at all -- see the header's routing-tell paragraph.
  # after_routing is left at its default (false): it reproduces the
  # absent-credential case, checked live on the registered methods, exactly.
  after_routing: false

responses:
  list:
    style: wrapped
    key: orgs
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  organization:
    id:
      style: opaque
      field: id
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      status:
        # active or inactive.
        type: string
        default: active
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: GET
    path: /api/v2/orgs
    resource: organization
    operation: list

  - method: GET
    path: /api/v2/orgs/{id}
    resource: organization
    operation: get

  - method: POST
    path: /api/v2/orgs
    resource: organization
    operation: create
    returns: [id, name, description]

errors:
  missing_authorization_header:
    status: 401
    code: unauthorized
    message: "Missing authorization header"

  # The single sentence this host answers for a malformed header AND a
  # well-formed wrong one alike -- see the header.
  missing_token:
    status: 401
    code: unauthorized
    message: "Missing token"

fixtures:
  empty: {}

  account:
    organization:
      - id: cauldron-fixture-org
        name: Cauldron Fixture
        description: ""
        status: active
        createdAt: "2026-01-10T09:00:00Z"
        updatedAt: "2026-01-10T09:00:00Z"

conformance:
  - name: no credential at all is a distinct sentence from every malformed shape
    source: https://cloud2.influxdata.com/api/v2/orgs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/orgs
    expect:
      status: 401
      body:
        code: unauthorized
        message: "Missing authorization header"

  - name: a header with the documented Token scheme and a junk value is called missing, not wrong
    source: https://cloud2.influxdata.com/api/v2/orgs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/orgs
      headers:
        Authorization: Token junktoken12345
    expect:
      status: 401
      body:
        message: "Missing token"

  - name: a header with no recognised scheme keyword at all gets the identical sentence
    source: https://cloud2.influxdata.com/api/v2/orgs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/orgs
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        message: "Missing token"

  - name: creating an organisation answers what was sent, trimmed to the create fields
    source: https://raw.githubusercontent.com/influxdata/openapi/master/contracts/oss.yml
    fixture: account
    request:
      method: POST
      path: /api/v2/orgs
      headers:
        Authorization: Token cauldroninfluxdbfixturetoken00000000000000000000
      json:
        name: cauldron-neworg
        description: a new fixture organisation
    expect:
      status: 200
      matches:
        id: ".+"
      body:
        name: cauldron-neworg
        description: a new fixture organisation
      absent:
        - status
        - createdAt

  - name: listing organisations wraps the array under orgs, not a bare array
    source: https://raw.githubusercontent.com/influxdata/openapi/master/contracts/oss.yml
    fixture: account
    request:
      method: GET
      path: /api/v2/orgs
      headers:
        Authorization: Token cauldroninfluxdbfixturetoken00000000000000000000
    expect:
      status: 200
      body:
        "orgs[0].id": cauldron-fixture-org
        "orgs[0].status": active

  - name: getting one organisation by id is bare, unlike the list it came from
    source: https://raw.githubusercontent.com/influxdata/openapi/master/contracts/oss.yml
    fixture: account
    request:
      method: GET
      path: /api/v2/orgs/cauldron-fixture-org
      headers:
        Authorization: Token cauldroninfluxdbfixturetoken00000000000000000000
    expect:
      status: 200
      body:
        id: cauldron-fixture-org
        name: Cauldron Fixture
