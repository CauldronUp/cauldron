# Rev.ai Recipe for Cauldron
#
# Written against Rev.ai's API reference at docs.rev.ai and struck live against
# api.rev.ai on 2026-09-07 with no credential and then with a deliberately
# invalid one.
#
# **A problem document with no problem in it.** Struck live, both ways,
# byte-identical:
#
#   GET /speechtotext/v1/jobs                (no credential)
#   GET /speechtotext/v1/jobs                Authorization: Bearer notreal
#   401  Content-Type: application/problem+json
#   {"title":"Authorization has been denied for this request.","status":401}
#
# RFC 9457 defines five members: `type`, `title`, `status`, `detail` and
# `instance`. Two arrive. `title` is a sentence and `status` restates the
# status line, so the document carries one fact the caller did not already have
# -- and it is prose.
#
# No `type` means, per the specification, that the type is `about:blank`: "the
# problem has no additional semantics beyond that of the HTTP status code".
# Which is exactly true here, and stating it by omission is the specification
# working as designed. It is also the most standardised way in existence of
# saying nothing.
#
# **This collection now has three problem+json documents and they fail three
# different ways.** [triggerdev](../triggerdev) sends all five members and
# points `type` at MDN's page about the HTTP status -- a correct page about
# something the document already says twice. Agicap sends a `type` pointing at
# the RFC section that *defines* 500. Rev.ai sends no `type` at all. Three
# providers reaching for the same specification, and not one of them uses the
# field for what it is for: naming a problem this API can have.
#
# **A missing credential and a wrong one are identical**, so the two failures
# needing different fixes are one document -- and the document has no field
# that could have separated them even in principle.
#
# **The sentence is in the passive voice and names no actor.** "Authorization
# has been denied for this request." Not "your token is invalid", not "no
# Authorization header": something denied something, and the caller is not told
# what or why. It is ASP.NET's own default message for a failed authorisation
# filter.

recipe: revai
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.rev.ai/api/asynchronous/reference/
  # No spec: Rev.ai publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-revai-f1xture-token-000000
  # One document for both, struck live.
  absent_error: authorization_denied
  rejected_error: authorization_denied

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: title
    code_field: "-"
    status_field: status

resources:
  job:
    id:
      field: id
      style: opaque
    fields:
      created_on:
        type: datetime
      # Untyped, so a job that has not finished omits it rather than being
      # given a zero date that would read as completed at the epoch.
      completed_on:
      name:
        type: string
      status:
        type: string
        default: in_progress
      # Untyped for the same reason: a job that never transcribed has no
      # duration, and a zero would be billed.
      duration_seconds:
      language:
        type: string
        default: en
      failure:

routes:
  - method: GET
    path: /speechtotext/v1/jobs
    resource: job
    operation: list
    pagination:
      style: cursor
      limit: 100
      max_limit: 1000
      limit_param: limit
      cursor_param: starting_after

errors:
  authorization_denied:
    status: 401
    # ASP.NET's default for a failed authorisation filter: passive voice, no
    # actor, and no mention of what was wrong with the request.
    message: "Authorization has been denied for this request."
    headers:
      # RFC 9457's media type, on a document carrying two of its five members.
      Content-Type: application/problem+json

fixtures:
  empty:
    job: []

  account:
    job:
      - id: Umx5c6F7pH7r
        created_on: "2026-09-06T14:02:11.402Z"
        completed_on: "2026-09-06T14:05:47.881Z"
        name: quarterly-review.mp3
        status: transcribed
        duration_seconds: 1841.4
        language: en
      - id: Vny6d7G8qI8s
        created_on: "2026-09-07T09:14:00.000Z"
        name: interview-raw.wav
        # Failed, with the reason in a separate field rather than in status --
        # so a client switching on status sees one word for every kind of
        # failure and has to read `failure` to learn which.
        status: failed
        failure: download_failure
        language: en

conformance:
  - name: the problem document carries two of five members
    source: https://api.rev.ai/speechtotext/v1/jobs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers: {}
    expect:
      status: 401
      body:
        # title is a sentence and status restates the status line, so the
        # document carries one fact the caller did not already have.
        title: "Authorization has been denied for this request."
        status: 401

  - name: there is no type so the problem has no semantics
    source: https://api.rev.ai/speechtotext/v1/jobs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers: {}
    expect:
      status: 401
      absent:
        # RFC 9457: an absent type means about:blank, "the problem has no
        # additional semantics beyond that of the HTTP status code". Which is
        # true here -- and it is the most standardised way in existence of
        # saying nothing.
        - type
        - detail
        - instance

  - name: the media type is problem+json all the same
    source: https://api.rev.ai/speechtotext/v1/jobs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/problem+json

  - name: a wrong credential is the same document
    source: https://api.rev.ai/speechtotext/v1/jobs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Byte-identical, so the two failures needing different fixes are one
      # document -- and the document has no field that could have separated
      # them even in principle.
      status: 401
      body:
        title: "Authorization has been denied for this request."

  - name: jobs are a bare array
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
    expect:
      status: 200
      body:
        # No envelope on success, where the failure has a media type of its
        # own -- so the two paths share nothing at all.
        '[0].id': Umx5c6F7pH7r
        '[0].status': transcribed
        '[0].name': quarterly-review.mp3
        '[0].completed_on': "2026-09-06T14:05:47.881Z"

  - name: a failed job puts its reason in a second field
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
    expect:
      status: 200
      body:
        # status is one word for every kind of failure and `failure` says
        # which -- so a client switching on status cannot tell a bad
        # download from a bad audio file, and the field that can is absent
        # on every job that worked.
        '[1].status': failed
        '[1].failure': download_failure

  - name: an unfinished job has no completion time
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
    expect:
      status: 200
      body:
        '[1].created_on': "2026-09-07T09:14:00.000Z"
      absent:
        # Absent rather than null, on a job that failed -- so "finished" and
        # "succeeded" are different questions and only one of them has a
        # field.
        - '[1].completed_on'
        - '[1].duration_seconds'

  - name: a duration is fractional seconds
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
    expect:
      status: 200
      body:
        # 1841.4 seconds, and it is what the job is billed on -- so a client
        # rounding it for display and a client summing it for cost want
        # different things from one float.
        '[0].duration_seconds': 1841.4
        '[0].language': en

  - name: jobs page on a starting point
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: account
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
      query:
        limit: "1"
        starting_after: Umx5c6F7pH7r
    expect:
      status: 200
      body:
        '[0].id': Vny6d7G8qI8s

  - name: an account with no jobs answers an empty array
    source: https://docs.rev.ai/api/asynchronous/reference/
    fixture: empty
    request:
      method: GET
      path: /speechtotext/v1/jobs
      headers:
        Authorization: "Bearer cauldr0n-revai-f1xture-token-000000"
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
