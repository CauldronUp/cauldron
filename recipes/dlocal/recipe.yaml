# dLocal Recipe for Cauldron
#
# Written against dLocal's API reference at docs.dlocal.com and struck live
# against api.dlocal.com on 2026-09-07 with no credential and then with
# deliberately invalid ones.
#
# **The refusal is a ladder, and the first rung is a clock.** Struck live,
# three requests:
#
#   GET /payments                                      (no headers at all)
#   400 {"code":5001,"message":"Invalid parameter","param":"X-Date"}
#
#   GET /payments                                      X-Date: 2026-09-07T21:30:00.000Z
#   400 {"code":5001,"message":"Missing parameter(s) [or non valid values]. login, key"}
#
#   GET /payments                                      X-Date, X-Login, X-Trans-Key, Authorization
#   403 {"code":3001,"message":"Invalid credentials"}
#
# The first thing dLocal checks is not the credential -- it is the timestamp.
# `X-Date` is part of the HMAC signature scheme, so a request without one
# cannot be verified at all, and the API says so before it says anything about
# who you are.
#
# That is defensible and it means the first failure a new integrator meets
# names a header they have never heard of, on an endpoint they were trying to
# authenticate against.
#
# **The same code covers two different missing things.** `5001` for a missing
# `X-Date` and `5001` again for missing `login` and `key` -- and the first
# carries a `param` field naming the header while the second does not, listing
# its two names inside the sentence instead. So the machine-readable half is
# one number for two problems and the structured field that would say which is
# present on one of them.
#
# **The final refusal is 403.** `3001`, "Invalid credentials", for a request
# carrying every required header with wrong values in them. Not 401 -- so
# across the whole ladder this API answers 400, 400 and 403 to what is, from
# the caller's side, one problem: not being authenticated yet.
#
# **The codes are four digits with a leading digit that means something.** 5001
# is a parameter problem and 3001 is a credential one, so the thousands digit
# is a category and nothing on the wire says so.

recipe: dlocal
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.dlocal.com/reference/payments-api
  # No spec: dLocal publishes a rendered reference site.

auth:
  # The signature scheme wants X-Date, X-Login, X-Trans-Key and an
  # Authorization header carrying an HMAC. This models the login half, which
  # is the one the ladder's third rung refuses.
  scheme: header
  header: X-Login
  keys:
    - cauldr0n-dlocal-f1xture-login
  # The credential is not even looked at until X-Date is present, which is
  # why the absent case here is about a clock rather than a key.
  absent_error: missing_date
  rejected_error: invalid_credentials

responses:
  list:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: number

resources:
  payment:
    id:
      field: id
      style: prefixed
      prefix: "PAY"
    fields:
      amount:
        type: number
        default: 0
      currency:
        type: string
        default: BRL
      country:
        type: string
        default: BR
      status:
        type: string
        default: PENDING
      status_code:
        type: string
      created_date:
        type: datetime
      order_id:
        type: string

routes:
  - method: GET
    path: /payments
    resource: payment
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: page_size
      cursor_param: page

errors:
  missing_date:
    # The first rung. Not about the credential at all: X-Date is part of the
    # signature scheme, so a request without one cannot be verified and the
    # API says so before it says anything about who you are.
    status: 400
    code: "5001"
    message: "Invalid parameter"
    fields:
      # Present on this failure and absent from the next one, which shares its
      # code -- so the structured field that would say which parameter is
      # missing is on one of the two problems that number covers.
      param: X-Date

  invalid_credentials:
    # The last rung. 403 rather than 401, for a request carrying every
    # required header with wrong values in them.
    status: 403
    code: "3001"
    message: "Invalid credentials"

fixtures:
  empty:
    payment: []

  merchant:
    payment:
      - id: PAY2946120571
        amount: 120.00
        currency: BRL
        country: BR
        status: PAID
        status_code: "200"
        created_date: "2026-09-04T13:22:41.000+0000"
        order_id: cauldron-order-0001
      - id: PAY2946120572
        amount: 45.90
        currency: BRL
        country: BR
        # Pending with a status_code that is not a failure: dLocal's local
        # payment methods settle over days, so PENDING is the normal state
        # rather than a transient one, and a client polling for PAID may wait
        # until Monday.
        status: PENDING
        status_code: "100"
        created_date: "2026-09-07T08:05:19.000+0000"
        order_id: cauldron-order-0002

conformance:
  - name: the first thing checked is the clock
    source: https://api.dlocal.com/payments
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers: {}
    expect:
      # Not the credential. X-Date is part of the signature scheme, so a
      # request without one cannot be verified -- and the first failure a new
      # integrator meets names a header they have never heard of.
      status: 400
      body:
        code: 5001
        message: "Invalid parameter"
        param: X-Date

  - name: the parameter failure names the parameter
    source: https://api.dlocal.com/payments
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers: {}
    expect:
      status: 400
      body:
        # A structured field naming the header, which is more than most
        # providers here manage -- and it is present on one of the two
        # problems code 5001 covers. The other lists its names in the
        # sentence instead.
        param: X-Date

  - name: a complete but wrong credential is 403
    source: https://api.dlocal.com/payments
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: notreal
        X-Trans-Key: notreal
        Authorization: "V2-HMAC-SHA256, Signature: deadbeef"
    expect:
      # Not 401. Across the whole ladder this API answers 400, 400 and 403 to
      # what is, from the caller's side, one problem: not being authenticated
      # yet.
      status: 403
      body:
        code: 3001
        message: "Invalid credentials"

  - name: the thousands digit is a category nothing declares
    source: https://api.dlocal.com/payments
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: notreal
        X-Trans-Key: notreal
    expect:
      status: 403
      body:
        # 5001 is a parameter problem and 3001 a credential one, so the
        # leading digit is a category -- and nothing on the wire says so.
        code: 3001

  - name: payments are wrapped in data with prefixed ids
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        'data[0].id': PAY2946120571
        'data[0].status': PAID

  - name: pending is the normal state rather than a transient one
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        # dLocal's local payment methods -- boleto, PIX, cash at a shop --
        # settle over days. So a client polling for PAID with a short timeout
        # gives up on a payment that will arrive, and PENDING is not a
        # transient state.
        'data[1].status': PENDING
        'data[1].status_code': "100"

  - name: the status code is a string beside a word
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        # "200" as text on a payment record, which is not an HTTP status and
        # reads exactly like one -- so a log line carrying it is ambiguous
        # about what succeeded.
        'data[0].status_code': "200"
        'data[0].status': PAID

  - name: timestamps carry an offset with no colon
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        # +0000 rather than +00:00 or Z. Legal ISO 8601 basic format and not
        # RFC 3339, so a strict parser refuses it and a lenient one does not
        # -- and the request's own X-Date uses Z, so one exchange has two
        # spellings of UTC.
        'data[0].created_date': "2026-09-04T13:22:41.000+0000"

  - name: the merchant's own order reference rides every payment
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        # The only handle that means anything in the merchant's system, and
        # dLocal does not enforce that it is unique -- so a client keying on
        # it is keying on a value it chose itself.
        'data[1].order_id': cauldron-order-0002
        'data[1].amount': 45.90
        # And the currency and country are separate fields that usually agree
        # and do not have to: dLocal's whole business is cross-border, so a
        # BRL payment in a non-BR country is the normal case rather than an
        # inconsistency.
        'data[1].currency': BRL
        'data[1].country': BR

  - name: payments page on a page and a size
    source: https://docs.dlocal.com/reference/payments-api
    fixture: merchant
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
      query:
        page: "2"
        page_size: "1"
    expect:
      status: 200
      body:
        # No total and no cursor anywhere, so a client cannot tell a full last
        # page from a full middle one without asking for another.
        'data[0].id': PAY2946120572

  - name: a merchant with no payments answers an empty array
    source: https://docs.dlocal.com/reference/payments-api
    fixture: empty
    request:
      method: GET
      path: /payments
      headers:
        X-Date: "2026-09-07T21:30:00.000Z"
        X-Login: cauldr0n-dlocal-f1xture-login
        X-Trans-Key: cauldr0n-dlocal-f1xture-key
    expect:
      status: 200
      body:
        data: []
