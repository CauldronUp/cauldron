# Wikipedia REST Recipe for Cauldron
#
# A page that does not exist is reported as an internal error.
#
#   GET /api/rest_v1/page/summary/Zzzznotarealpagexyz
#   ->  404  {"status": 404, "type": "Internal error"}
#
# Two fields, and that is the whole body. The type says "Internal error" for the
# most ordinary miss there is; nothing names the page, nothing distinguishes a
# title that was never created from one that was deleted or from a genuine
# failure inside the service. A client logging type logs the wrong cause, and a
# client branching on it cannot tell a 404 it should expect from a 500 it should
# alert on -- because the field that would say so says the same thing either way.
#
# **And the title arrives five times in four fields, two of them HTML.** A
# summary carries title, displaytitle, and titles with canonical, normalized and
# display inside it:
#
#   "title": "Toronto"
#   "displaytitle": "<span lang=\"en\" dir=\"ltr\"><span class=...>Toronto</span></span>"
#   "titles": {"canonical": "Toronto", "normalized": "Toronto",
#              "display": "<span lang=\"en\" ...>Toronto</span></span>"}
#
# displaytitle and titles.display are the same markup twice. canonical and
# normalized differ only for a page whose title needs normalising, and nothing
# says which of the five a heading should use.
#
# Written against the live API rather than a document: every case below was
# checked against en.wikipedia.org on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. A disambiguation page answers 200 with type: "disambiguation" and an
#      extract that is a flattened list: "Mercury most commonly refers
#      to:Mercury (planet), the closest planet to the Sun\nMercury (element),
#      a chemical element". No space after the colon, newlines between the
#      entries, and it is neither a sentence nor a list. Anything rendering
#      extract as prose renders that.
#   2. The request's own spelling is nowhere in the answer. Asking for
#      "toronto" answers title "Toronto" and titles.normalized "Toronto", so
#      there is no field that says the title you sent was corrected.
#   3. originalimage.source is a rendering rather than the original. The URL
#      ends 3840px-...jpg while width says 6632, so laying out from width and
#      height and loading source gets a picture forty per cent smaller than
#      declared.
#   4. And those image URLs carry analytics parameters:
#      ?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail,
#      appended to an image address in a JSON response.
#   5. content_urls has desktop and mobile with the same four keys, and three
#      of the four are byte-identical. Only revisions differs --
#      ?action=history against /Special:History/Toronto -- so a client that
#      picks one branch is right three times in four by accident.
#
# Two smaller ones worth writing down: revision is a numeric string
# ("1370998502") in a document where pageid is the number 64646, and the main
# namespace's text is the empty string rather than "Main" or null.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The encyclopedia is served rather than looked up. Title normalisation and
#     redirect following are real behaviours of the endpoint and this Recipe
#     answers with the pages its fixture holds; the normalisation is asserted
#     from a recorded response rather than applied.
#   - The extracts are trimmed to their first sentence, except the
#     disambiguation one, where the run-together list is the point and is
#     verbatim.
#   - tid is a time-based UUID that changes with the cache, and timestamp and
#     revision move whenever the page is edited. All three are served as
#     recorded.
#   - Only /page/summary is served. /page/html, /page/related, /page/media-list
#     and the feed endpoints answer different documents.
#
# The pages below are public and were recorded on the date in the cases.

recipe: wikipedia
capability: infrastructure
version: 0.1.0

upstream:
  api: rest_v1
  docs: https://en.wikipedia.org/api/rest_v1/

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    # There is no message. The whole body is a status and a type.
    message_field: "-"
    status_field: status
    type_field: type

resources:
  summary:
    id:
      style: opaque
      # The title in the path, and the body carries the corrected one under
      # four different names.
      field: "-"
      carried_by: title
    fields:
      # "standard" or "disambiguation", and both are 200.
      type:
        type: string
      title:
        type: string
      # The same markup as titles.display, one level up.
      displaytitle:
        type: string
      # The main namespace's text is the empty string.
      namespace:
        type: map
      wikibase_item:
        type: string
      # canonical, normalized and display -- three more of the same name.
      titles:
        type: map
      # A number, where revision below is a string.
      pageid:
        type: integer
      thumbnail:
        type: map
      # A rendering, not the original, at the original's declared size.
      originalimage:
        type: map
      lang:
        type: string
      dir:
        type: string
      # A numeric string.
      revision:
        type: string
      tid:
        type: string
      timestamp:
        type: string
      description:
        type: string
      description_source:
        type: string
      coordinates:
        type: map
      # desktop and mobile, three of whose four keys are identical.
      content_urls:
        type: map
      extract:
        type: string
      extract_html:
        type: string

routes:
  - method: GET
    path: /api/rest_v1/page/summary/{id}
    resource: summary
    operation: get
    not_found: page_missing

errors:
  # Two fields, and the type is wrong about what happened.
  page_missing:
    status: 404
    type: Internal error

fixtures:
  empty: {}

  pages:
    summary:
      - id: Toronto
        type: standard
        title: Toronto
        # The same markup as titles.display below.
        displaytitle: <span lang="en" dir="ltr"><span class="mw-page-title-main">Toronto</span></span>
        namespace:
          id: 0
          # Empty, rather than "Main" or null.
          text: ""
        wikibase_item: Q172
        titles:
          canonical: Toronto
          normalized: Toronto
          display: <span lang="en" dir="ltr"><span class="mw-page-title-main">Toronto</span></span>
        # A number.
        pageid: 64646
        thumbnail:
          source: https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Toronto_Skyline_from_Olympic_Island%2C_June_20_2026_%285-3_cropped%29.jpg/330px-Toronto_Skyline_from_Olympic_Island%2C_June_20_2026_%285-3_cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
          width: 330
          height: 198
        originalimage:
          # 3840px in the URL, 6632 in the field beside it.
          source: https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Toronto_Skyline_from_Olympic_Island%2C_June_20_2026_%285-3_cropped%29.jpg/3840px-Toronto_Skyline_from_Olympic_Island%2C_June_20_2026_%285-3_cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
          width: 6632
          height: 3982
        lang: en
        dir: ltr
        # A string, where pageid is a number.
        revision: "1370998502"
        tid: 1d76483d-9f65-11f1-a644-1ebc2431a5f4
        timestamp: "2026-08-24T02:40:06Z"
        description: Most populous city in Canada
        description_source: local
        coordinates:
          lat: 43.6525
          lon: -79.38166667
        content_urls:
          desktop:
            page: https://en.wikipedia.org/wiki/Toronto
            revisions: https://en.wikipedia.org/wiki/Toronto?action=history
            edit: https://en.wikipedia.org/wiki/Toronto?action=edit
            talk: https://en.wikipedia.org/wiki/Talk:Toronto
          mobile:
            # Identical to desktop.
            page: https://en.wikipedia.org/wiki/Toronto
            # And this one is not.
            revisions: https://en.wikipedia.org/wiki/Special:History/Toronto
            edit: https://en.wikipedia.org/wiki/Toronto?action=edit
            talk: https://en.wikipedia.org/wiki/Talk:Toronto
        # Trimmed to its first clause; the real extract runs to a paragraph.
        extract: Toronto is the most populous city in Canada and the capital city of the Canadian
        extract_html: <p><b>Toronto</b> is the most populous city in Canada and the capital city of the Canadian

      # Asked for in lower case, and answered in title case with nothing
      # anywhere recording the correction.
      - id: toronto
        type: standard
        title: Toronto
        titles:
          canonical: Toronto
          normalized: Toronto
          display: <span lang="en" dir="ltr"><span class="mw-page-title-main">Toronto</span></span>
        pageid: 64646
        lang: en
        dir: ltr
        revision: "1370998502"
        description: Most populous city in Canada
        extract: Toronto is the most populous city in Canada and the capital city of the Canadian

      # A 200, and an extract that is a list run into a sentence.
      - id: Mercury
        type: disambiguation
        title: Mercury
        titles:
          canonical: Mercury
          normalized: Mercury
          display: <span lang="en" dir="ltr"><span class="mw-page-title-main">Mercury</span></span>
        pageid: 19007
        lang: en
        dir: ltr
        revision: "1371625629"
        # Verbatim: no space after the colon, newlines between the entries.
        extract: "Mercury most commonly refers to:Mercury (planet), the closest planet to the Sun\nMercury (element), a chemical element\nMercury (mythology), a Roman deity"

conformance:
  - name: a page that does not exist is reported as an internal error
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Zzzznotarealpagexyz
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Zzzznotarealpagexyz
    expect:
      # Two fields, and that is the whole body. Nothing names the page, and the
      # type says the same thing for a miss and for a failure.
      status: 404
      body:
        status: 404
        type: Internal error
      absent:
        - title
        - detail
        - extract

  - name: the title arrives five times in four fields, two of them HTML
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Toronto
    expect:
      status: 200
      body:
        # displaytitle and titles.display are the same markup twice, and
        # nothing says which of the five a heading should use.
        title: Toronto
        displaytitle: <span lang="en" dir="ltr"><span class="mw-page-title-main">Toronto</span></span>
        "titles.canonical": Toronto
        "titles.normalized": Toronto
        "titles.display": <span lang="en" dir="ltr"><span class="mw-page-title-main">Toronto</span></span>

  - name: a disambiguation page is a 200 whose extract is a flattened list
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Mercury
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Mercury
    expect:
      status: 200
      body:
        # No space after the colon, newlines between the entries: neither a
        # sentence nor a list, and anything rendering extract as prose renders
        # exactly this.
        type: disambiguation
        extract: "Mercury most commonly refers to:Mercury (planet), the closest planet to the Sun\nMercury (element), a chemical element\nMercury (mythology), a Roman deity"

  - name: the spelling you asked for is nowhere in the answer
    source: https://en.wikipedia.org/api/rest_v1/page/summary/toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/toronto
    expect:
      status: 200
      body:
        # Asked for "toronto". Every field that could record the correction
        # carries the corrected form instead.
        title: Toronto
        "titles.canonical": Toronto
        "titles.normalized": Toronto

  - name: the original image is a rendering at the original's declared size
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Toronto
    expect:
      status: 200
      body:
        # 6632 declared, 3840 in the URL. Laying out from width and height and
        # loading source gets a picture forty per cent smaller.
        "originalimage.width": 6632
        "originalimage.height": 3982
        "thumbnail.width": 330
      matches:
        "originalimage.source": '/3840px-'

  - name: and the image URLs carry analytics parameters
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Toronto
    expect:
      status: 200
      matches:
        # Appended to an image address, in a JSON response.
        "thumbnail.source": 'utm_source=en\.wikipedia\.org&utm_campaign=api&utm_content=thumbnail'
        "originalimage.source": 'utm_campaign=api'

  - name: desktop and mobile differ in one of their four links
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Toronto
    expect:
      status: 200
      body:
        # Three of the four are byte-identical, so a client that picks one
        # branch is right three times in four by accident.
        "content_urls.desktop.page": https://en.wikipedia.org/wiki/Toronto
        "content_urls.mobile.page": https://en.wikipedia.org/wiki/Toronto
        "content_urls.desktop.revisions": https://en.wikipedia.org/wiki/Toronto?action=history
        "content_urls.mobile.revisions": https://en.wikipedia.org/wiki/Special:History/Toronto

  - name: the revision is a string and the page id is a number
    source: https://en.wikipedia.org/api/rest_v1/page/summary/Toronto
    verified: "2026-08-28"
    fixture: pages
    request:
      method: GET
      path: /api/rest_v1/page/summary/Toronto
    expect:
      status: 200
      body:
        # Two identifiers, one document, two types.
        revision: "1370998502"
        pageid: 64646
        # And the main namespace's text is empty rather than "Main" or null.
        "namespace.id": 0
        "namespace.text": ""
