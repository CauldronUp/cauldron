# BambooHR Recipe for Cauldron
#
# BambooHR's own documentation answers this batch's question about itself,
# in its own words, on the reference page for GET /employees/directory
# (documentation.bamboohr.com/reference/get-employees-directory, "Coverage
# and limits"):
#
#   "Inactive and former employees are also excluded, so an administrator
#   researching someone who has left the company will not find them here
#   even though the record still exists; use `get-employee` or
#   `list-employees` for those. Absence from this response therefore means
#   the employee is not in the published directory, not that no such
#   employee exists, so do not conclude from this endpoint alone that
#   someone does not work at the company."
#
# That is the whole brief in one paragraph, written by the vendor. A
# terminated employee and one who never existed produce the identical
# absence from this one endpoint, and BambooHR says so plainly rather than
# leaving it to be inferred. The same page also settles the brief's second
# question about this provider without needing to be asked: which fields
# /employees/directory and /employees/{id} disagree about.
#
# /employees/directory's fieldset is fixed by company configuration -- the
# response carries a `fields` array declaring exactly which keys this
# company chose to publish, and the caller cannot ask for more. BambooHR's
# own worked example (same reference page) is quoted verbatim below:
#
#   {"fields":[{"id":"displayName",...}, ...],
#    "employees":[{"id":123,"displayName":"John Doe","firstName":"John",
#      "lastName":"Doe","gender":"Male",
#      "jobTitle":"Customer Service Representative",
#      "workPhone":"555-555-5555","workPhoneExtension":null,
#      "skypeUsername":"JohnDoe","facebook":"JohnDoeFacebook"}]}
#
# status, employmentStatus and terminationDate are never in that fieldset --
# a company cannot configure the directory to publish them, because the
# directory is a coworker-lookup surface governed by sharing settings, not a
# roster. /employees/{id} (documentation.bamboohr.com/reference/get-employee)
# is the opposite shape entirely: "With no `fields` parameter, the response
# contains only `id` -- there is no implicit default field set," and
# `status`, `employmentStatus`, `employmentStatusId`, `hireDate`,
# `originalHireDate` and `terminationDate` are all real fields on that
# endpoint's own schema, available only if the caller names them. So the two
# endpoints do not merely expose different data by accident: the directory
# is architecturally incapable of saying whether somebody was terminated,
# and the single-employee endpoint can say it but only to a caller who knew
# to ask and remembered the field name.
#
# terminationDate's schema entry, quoted exactly from the endpoint's own
# OpenAPI description: "Employee's termination date. Only included when
# requested via the `fields` parameter.", `oneOf: [{type: string}, {type:
# null}]` -- nullable, and genuinely absent-vs-null is not this field's
# problem the way it is elsewhere in this collection, because the field
# itself is not returned at all unless asked for.
#
# BambooHR's own schema does not agree with itself about whether an employee
# id is a string or a number. Three separate property definitions inside the
# one OpenAPI document embedded in these reference pages:
#
#   "id":{"description":"The internal employee ID.","type":"string"}   (x2)
#   "id":{"description":"Employee ID.","type":"integer","...,"example":42}
#
# and the directory endpoint's own worked example above sends a bare,
# unquoted `123` even though the surrounding prose on the very same page
# says ids are "returned as strings in both formats" (JSON and XML). Neither
# side of that contradiction was picked as more authoritative below; each
# resource here matches the literal shape of the example it was built from.
# Employee id reuse is not addressed anywhere this Recipe could find, from
# BambooHR or a third party; it is left unestablished.
#
# A newer, third listing exists beside the directory: GET /v1/employees
# ("List Employees" in BambooHR's own reference, cursor-paginated,
# `filter[ids]` for batch lookup by id). Its own worked examples -- quoted
# verbatim below, both from the same reference page -- include an employee
# with `"status":"Inactive"` returned by an ordinary `filter[ids]` lookup,
# with no separate include-terminated parameter of any kind:
#
#   basic (unfiltered) page:
#     {"employeeId":"123","firstName":"Ava","lastName":"Nguyen",
#      "preferredName":"Ava","photoUrl":"https://cdn.example.com/p/123.jpg",
#      "jobTitleName":"Engineering Manager","status":"Active",
#      "_restrictedFields":[]}
#     {"employeeId":"124","firstName":"Sam","lastName":"Park",
#      "preferredName":"Sam","photoUrl":null,
#      "jobTitleName":"Product Designer","status":"Active",
#      "_restrictedFields":["photoUrl"]}
#     meta: {"total":2456,"page":{"limit":100,
#       "nextCursor":"eyJuZXh0RW1wbG95ZWUiOjEyNX0=","prevCursor":null}}
#
#   batchByIds (?filter[ids]=200,207):
#     {"employeeId":"200","firstName":"Lena","lastName":"Smith",
#      "preferredName":"Lena","photoUrl":null,
#      "jobTitleName":"QA Analyst","status":"Active","_restrictedFields":[]}
#     {"employeeId":"207","firstName":"Marco","lastName":"Lee",
#      "preferredName":null,"photoUrl":null,
#      "jobTitleName":"Support Engineer","status":"Inactive",
#      "_restrictedFields":["photoUrl"]}
#     meta: {"total":2,"page":{"limit":250,"nextCursor":null,"prevCursor":null}}
#
# This proves that fetching a known id by `filter[ids]` returns an inactive
# employee's record without special pleading. It does NOT prove that an
# unfiltered default page includes inactive employees -- the one unfiltered
# example on record only shows two Active rows -- so this Recipe states the
# narrower claim it can actually support and no more. The fixture below
# combines all four of BambooHR's own example rows (from the two examples
# quoted above) into one small roster so a single list case can show both
# an Active and an Inactive employee at once; nothing in any row was changed
# or invented, only which of BambooHR's two examples a given row came from.
#
# The permissions model on this endpoint is its own answer to "can an
# integration tell terminated from never existed," in the general case
# rather than the specific one: quoted verbatim from the endpoint's own
# description --
#
#   "Permissions. Field values the caller cannot read are returned as
#   `null`, and the names of those suppressed fields are listed on the
#   record in `_restrictedFields`. On an unfiltered request an employee
#   remains in `data` even when the caller can read none of the requested
#   fields... Separately, if the caller cannot read a field used in
#   `filter` or `sort`, the affected employee is dropped from the result
#   set entirely to avoid leaking presence, so a name search can return
#   `meta.total: 0` even though matching employees exist. Neither an empty
#   result nor a fully nulled row means no such employee exists."
#
# which is the same shape of trap the brief describes, generalised from
# "terminated" to "any field the caller cannot read": presence in `data`
# doesn't mean the fields are readable, and absence from a filtered result
# doesn't mean the employee doesn't exist. GET /employees/{id}, by contrast,
# fails this silently rather than explicitly: an unrequested field and a
# permission-denied field are both simply missing from the response, with
# no `_restrictedFields` list to tell them apart -- "an absent field may
# indicate either that it was not requested or that the caller lacks
# permission to view it." Two endpoints, two different answers to the same
# ambiguity, both documented in BambooHR's own words.
#
# Authentication is HTTP Basic with the secret key as the username and, per
# BambooHR's own getting-started guide, "any random string for the
# password" -- its own example curl uses the literal string `x`:
#
#   curl -i -u "{API Key}:x" "https://{companyDomain}.bamboohr.com/api/v1/employees/directory"
#
# which this Recipe declares as auth.credential: username, the same
# username-only check Twilio's Recipe in this collection uses for its
# account SID -- the password genuinely is not examined.
#
# What could not be settled by calling the wire: everything about the
# credential-refused shape and the routing-vs-auth order inside a real
# company. Both hosts the brief named -- api.bamboohr.com/api/gateway.php/{subdomain}
# and the {subdomain}.bamboohr.com direct form the getting-started guide's
# own example uses -- resolve the subdomain before anything else happens.
# Struck live, repeatedly, against a subdomain that does not exist
# (including BambooHR's own placeholder "example", the literal word its
# `_links` examples above use):
#
#   GET  /api/gateway.php/cauldrontest/v1/employees/directory  -> 404, empty body
#   POST /api/gateway.php/cauldrontest/v1/employees/directory  -> 404, identical
#   PATCH, and a second bogus path entirely                    -> 404, identical
#   GET  /api/gateway.php/cauldrontest/...  with a Basic credential (junk:x) -> 404, identical
#   GET  https://example.bamboohr.com/api/v1/employees/directory -> 404, identical
#
# every one of those content-type text/html, zero bytes of body. Tenant
# resolution is unconditional and precedes routing, method and credential
# alike -- but it is not something a Cauldron Recipe can express at all:
# this format's routes are paths within one already-resolved account, not a
# multi-tenant host-matching layer, so there is nothing to declare a route
# for. It is recorded here as a live, verified finding about the edge this
# API sits behind, and it is the only part of this Recipe's live probing
# that produced a result -- no subdomain this Recipe could reach ever got
# past that layer to say anything about auth, routing order, or a real
# employee. Every error body and every field-level claim below is therefore
# sourced to BambooHR's own published OpenAPI description (embedded in its
# readme.io reference pages) and never carries a verified date.
#
# BambooHR's own 401 documentation does not agree with itself either. Across
# the one embedded OpenAPI document this Recipe read, different endpoints'
# 401 responses are described as "No response body is returned.", "The
# response body is not JSON.", and (implicitly, via $ref) the JSON
# ProblemDetailsResponse schema -- three different claims about the same
# status code in the same document. This Recipe declares the
# ProblemDetailsResponse shape (type, title, status, detail) because it is
# the one with a real schema behind it, and uses the clearest single
# response description found ("Unauthorized. The API key is missing or
# invalid.") for detail's wording -- itself a documentation description
# rather than a confirmed literal body, which is exactly the ambiguity this
# paragraph is recording rather than resolving.
#
# The directory endpoint's own 403 is more concrete and is declared as its
# own error: when neither Company Directory nor Company Org Chart sharing
# is enabled for the caller, "the endpoint returns 403 with an empty body
# and the header `x-bamboohr-error-message: Directory disabled for this
# account`" -- the diagnosis travels in a header, not the body, on a
# response that otherwise carries nothing at all.
#
# GET /employees/directory answers XML by default, not JSON: "Follows the
# `Accept` header: `application/json` returns a JSON object with `fields`
# and `employees` arrays; `application/xml` (the default when `Accept` is
# missing or any non-JSON value) returns a `<directory>` document." Every
# case below sends Accept: application/json explicitly for that reason, and
# the XML branch is not modelled -- Cauldron's response envelope in this
# Recipe describes the JSON shape only.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - GET /employees/{id} (Get Employee) is not routed at all. Its fields
#     are real and quoted above, but no worked JSON example of a populated
#     response exists anywhere this Recipe could read -- every citation for
#     it is a schema property, never a body -- and the endpoint's whole
#     point (arbitrary fields chosen via `?fields=`) is a sparse-fieldset
#     mechanic this format has no way to drive from a query parameter.
#     Modelling it would mean inventing either an employee or a mechanism
#     neither of which BambooHR's own materials hand over.
#   - The `fields` metadata array that names a company's chosen directory
#     fieldset is not modelled; only the `employees` array is.
#   - `onlyCurrent` (documented default true on the directory: "only
#     employees whose hire date and employment-status effective date are on
#     or before today are returned") is stated in this header, not wired --
#     it is about future-dated hires and status changes, not about
#     terminated employees at all, and conflating the two would misstate
#     what the parameter does.
#   - Cursor pagination on List Employees (`page[limit]`, `page[after]`,
#     opaque base64 cursors, `_links.self`/`.next`) used to be unmodelled
#     entirely; the two request parameters are declared on the route now,
#     and the `_links` envelope still is not. This
#     Recipe's list case reports its own fixture's total under `meta.total`
#     rather than either of BambooHR's real example totals (2456 and 2),
#     because neither number describes this fixture's four rows.
#   - OAuth (BambooHR's other supported scheme, alongside HTTP Basic) is not
#     modelled; every case here is Basic.
#   - Every write endpoint, webhooks, custom fields, time off, and every
#     dataset outside Employees are entirely unmodelled.
#   - No upstream.spec. Every quote and schema fragment above was read from
#     the OpenAPI description readme.io embeds inline in each reference
#     page's own HTML (a different multi-megabyte bundle per page, covering
#     the whole product, not just that page's endpoint), not from one
#     fetchable document at a stable URL -- the same gap fireworks/recipe.yaml
#     states for the same reason.
#
# Keys below are fixtures, not secrets, and belong to no account.

recipe: bamboohr
capability: hr
version: 0.1.0

upstream:
  api: v1
  docs: https://documentation.bamboohr.com/reference/get-employees-directory

auth:
  scheme: basic
  credential: username
  keys:
    - cauldron-bamboohr-fixture-key-0000000000000000

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"
    type_field: type

resources:
  # The company's published directory. Fixed fieldset, no way to ask for
  # more, and status/employmentStatus/terminationDate are never in it -- see
  # the header. Field names and values below are BambooHR's own worked
  # example, quoted verbatim.
  directory_entry:
    collection: employees
    id:
      style: numeric
      type: number
    fields:
      displayName:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      gender:
        type: string
        null_when_unset: true
      jobTitle:
        type: string
        null_when_unset: true
      workPhone:
        type: string
        null_when_unset: true
      workPhoneExtension:
        type: string
        null_when_unset: true
      skypeUsername:
        type: string
        null_when_unset: true
      facebook:
        type: string
        null_when_unset: true

  # GET /v1/employees ("List Employees"). Cursor-paginated in reality; this
  # Recipe reports only meta.total for its own fixture -- see the header's
  # fidelity gaps. _restrictedFields names any field the caller could not
  # read on that row; the row still counts, per the header's permissions
  # quote.
  employee_summary:
    collection: data
    id:
      style: opaque
      field: employeeId
    fields:
      firstName:
        type: string
        null_when_unset: true
      lastName:
        type: string
        null_when_unset: true
      preferredName:
        type: string
        null_when_unset: true
      # A time-limited signed URL per BambooHR's own description, or null
      # when the caller cannot read it -- indistinguishable on the wire from
      # an employee with no photo, which this endpoint's own permissions
      # model already says is expected: see the header.
      photoUrl:
        type: string
        null_when_unset: true
      jobTitleName:
        type: string
        null_when_unset: true
      # Active or Inactive. The field this whole Recipe was written to
      # carry: an ordinary filter[ids] lookup returns Inactive rows with no
      # special parameter, per BambooHR's own second worked example -- see
      # the header.
      status:
        type: string
        null_when_unset: true
      _restrictedFields:
        type: list

routes:
  - method: GET
    path: /v1/employees/directory
    resource: directory_entry
    operation: list
    pagination:
      # The directory takes onlyCurrent and nothing else, from BambooHR's
      # own reference read 2026-09-05, which is explicit about the
      # consequence: "this endpoint returns the whole directory in one
      # response and accepts no name, department, or field filters, so
      # narrow the results on the client side."
      #
      # A company with four thousand employees receives four thousand
      # employees. That is BambooHR's design and the newer /v1/employees
      # listing below is the answer to it -- same provider, same resource,
      # one endpoint that hands over everything and one that pages.
      style: none

  - method: GET
    path: /v1/employees
    resource: employee_summary
    operation: list
    pagination:
      # page[limit] and page[after], which the header above already
      # establishes from BambooHR's own reference: "Cursor pagination on
      # List Employees (page[limit], page[after], opaque base64 cursors,
      # _links.self/.next)", with a worked example whose meta reads {"total"
      # :2456,"page":{"limit":100,"nextCursor":"eyJuZXh0RW1wbG95ZWUiOjEyNX0=
      # ","prevCursor":null}}.
      #
      # A hundred by default, from that example. The request parameter and
      # the response field are spelled differently again -- page[after] goes
      # out, nextCursor comes back -- and the cursor is base64 of a JSON
      # object, which decodes to {"nextEmployee":125}. Opaque by convention
      # rather than by construction: a client that decodes it finds an
      # employee id and will eventually depend on one.
      style: cursor
      limit: 100
      limit_param: "page[limit]"
      cursor_param: "page[after]"
    list:
      style: wrapped
      count_field: meta.total

errors:
  # See the header: BambooHR's own documentation does not agree with itself
  # about this response's shape, and detail's wording is a response
  # description, not a confirmed literal body. No case below claims a
  # verified date for it.
  authentication_error:
    status: 401
    message_field: detail
    message: "Unauthorized. The API key is missing or invalid."

  # Directory sharing is off for the caller (or company-wide). Empty body;
  # the whole diagnosis is the header. Quoted in the header.
  directory_disabled:
    status: 403
    message: ""
    headers:
      x-bamboohr-error-message: "Directory disabled for this account"

fixtures:
  empty: {}

  small-roster:
    # All four rows are BambooHR's own published example values from the
    # List Employees reference page -- two from its "basic" (unfiltered)
    # example, two from its "batchByIds" example -- recombined into one
    # fixture so a single list shows both an Active and an Inactive
    # employee at once. See the header for the exact source quotes; nothing
    # here was invented.
    employee_summary:
      - id: "123"
        firstName: Ava
        lastName: Nguyen
        preferredName: Ava
        photoUrl: "https://cdn.example.com/p/123.jpg"
        jobTitleName: Engineering Manager
        status: Active
        _restrictedFields: []
      - id: "124"
        firstName: Sam
        lastName: Park
        preferredName: Sam
        photoUrl: null
        jobTitleName: Product Designer
        status: Active
        _restrictedFields:
          - photoUrl
      - id: "200"
        firstName: Lena
        lastName: Smith
        preferredName: Lena
        photoUrl: null
        jobTitleName: QA Analyst
        status: Active
        _restrictedFields: []
      # Inactive, returned like any other row -- no include-terminated
      # parameter, no separate endpoint. See the header.
      - id: "207"
        firstName: Marco
        lastName: Lee
        preferredName: null
        photoUrl: null
        jobTitleName: Support Engineer
        status: Inactive
        _restrictedFields:
          - photoUrl

  directory-example:
    # BambooHR's own single worked example for this endpoint, quoted
    # verbatim in the header. Note the bare, unquoted 123 -- see the
    # header's id-type contradiction.
    directory_entry:
      - id: 123
        displayName: John Doe
        firstName: John
        lastName: Doe
        gender: Male
        jobTitle: Customer Service Representative
        workPhone: "555-555-5555"
        workPhoneExtension: null
        skypeUsername: JohnDoe
        facebook: JohnDoeFacebook

# No case below carries a verified date. This Recipe's only live probing
# reached tenant resolution (see the header) and never a real company's
# application layer, so every field, envelope and error shape here is
# sourced to BambooHR's own published OpenAPI description and was never
# called.
conformance:
  - name: the directory's fixed fieldset has no room for a status
    # BambooHR's own worked example, quoted verbatim in the header.
    source: https://documentation.bamboohr.com/reference/get-employees-directory
    fixture: directory-example
    request:
      method: GET
      path: /v1/employees/directory
      headers:
        Authorization: Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4
        Accept: application/json
    expect:
      status: 200
      body:
        "employees[0].id": 123
        "employees[0].displayName": John Doe
        "employees[0].jobTitle": Customer Service Representative
        "employees[0].workPhoneExtension": null
      absent:
        - "employees[0].status"
        - "employees[0].employmentStatus"
        - "employees[0].terminationDate"

  - name: an ordinary id lookup returns an inactive employee with no special parameter
    # The centrepiece of this Recipe -- see the header. Both rows are
    # BambooHR's own published examples.
    source: https://documentation.bamboohr.com/reference/list-employees
    fixture: small-roster
    request:
      method: GET
      path: /v1/employees
      headers:
        Authorization: Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4
        Accept: application/json
    expect:
      status: 200
      body:
        "data[0].status": Active
        "data[3].status": Inactive
        "data[3].jobTitleName": Support Engineer
        "data[3]._restrictedFields[0]": photoUrl
        "meta.total": 4

  - name: a suppressed field is null and named, not simply missing
    source: https://documentation.bamboohr.com/reference/list-employees
    fixture: small-roster
    request:
      method: GET
      path: /v1/employees
      headers:
        Authorization: Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4
        Accept: application/json
    expect:
      status: 200
      body:
        "data[1].photoUrl": null
        "data[1]._restrictedFields[0]": photoUrl
        "data[3].preferredName": null

  - name: no credential at all
    # See the header: this Recipe's own probing never got past tenant
    # resolution to observe this live, so this is BambooHR's documented
    # shape, not a confirmed literal body.
    source: https://documentation.bamboohr.com/reference/get-employees-directory
    fixture: empty
    request:
      method: GET
      path: /v1/employees/directory
      headers:
        Accept: application/json
    expect:
      status: 401
      body:
        detail: "Unauthorized. The API key is missing or invalid."

  - name: directory sharing disabled answers 403 with an empty body and the diagnosis in a header
    source: https://documentation.bamboohr.com/reference/get-employees-directory
    fixture: empty
    arm: directory_disabled
    request:
      method: GET
      path: /v1/employees/directory
      headers:
        Authorization: Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4
        Accept: application/json
    expect:
      status: 403
      headers:
        x-bamboohr-error-message: "Directory disabled for this account"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # page[limit]=1 and page[after]=123, which is the identifier of the
  # last record on the previous page, and asserts the second record came
  # back on its own: one to skip, one to return, and a third behind it
  # to prove the size stopped the page.
  - name: "page[limit] and page[after] are the two names this listing reads"
    source: "https://documentation.bamboohr.com/reference/list-employees"
    fixture: small-roster
    request:
      method: GET
      path: "/v1/employees"
      query:
        "page[limit]": "1"
        "page[after]": "123"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4"
        "Accept": "application/json"
    expect:
      status: 200
      body:
        "data[0].employeeId": "124"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # page[limit]=1 and page[after]=123, which is the identifier of the
  # last record on the previous page, and asserts the second record came
  # back on its own: one to skip, one to return, and a third behind it
  # to prove the size stopped the page.
  - name: "page[limit] and page[after] are the two names this listing reads on v1 employees"
    source: "https://documentation.bamboohr.com/reference/list-employees"
    fixture: small-roster
    request:
      method: GET
      path: "/v1/employees"
      query:
        "page[limit]": "1"
        "page[after]": "123"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tYmFtYm9vaHItZml4dHVyZS1rZXktMDAwMDAwMDAwMDAwMDAwMDp4"
        "Accept": "application/json"
    expect:
      status: 200
      body:
        "data[0].employeeId": "124"
      absent:
        - "data[1]"

  # The names. This Recipe declares 6 field(s) on a directory_entry that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 6 name(s) that came back at the paths they came
  # back under.
  - name: "a directory_entry carries the field names this Recipe declares"
    source: "https://documentation.bamboohr.com/reference/get-employees-directory"
    fixture: directory-example
    request:
      method: GET
      path: "/v1/employees/directory"
