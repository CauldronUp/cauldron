# Firebase Auth Recipe for Cauldron
#
# Written against Google's own machine-readable description of the API, the
# Identity Toolkit v1 discovery document at
# identitytoolkit.googleapis.com/$discovery/rest?version=v1 -- 41 methods, 61
# schemas, 446 properties, revision 20260813 -- and struck live against
# identitytoolkit.googleapis.com on 2026-09-06.
#
# **The document is not OpenAPI.** It is a Google Discovery Document:
# `kind: discovery#restDescription`, `discoveryVersion: v1`. There is no
# `openapi` key and no `swagger` key, so nothing that reads OpenAPI reads this,
# and `cauldron drift` classifies it as a format it cannot parse -- the
# permanent column rather than the try-again-tomorrow one. That is why this
# Recipe names no `spec:` URL. See the note in upstream below.
#
# It is also the second thing about this API that is named twice. The product
# is Firebase Auth. The document calls itself "Identity Toolkit API", the host
# is identitytoolkit.googleapis.com, and the word Firebase appears in the title
# of nothing. A developer searching the document for the product they are using
# does not find it.
#
# **The document describes no failure.**
#
# 61 schemas, and not one of them is the error envelope. There is no `Status`,
# no `GoogleRpcStatus`, and the string `"error"` occurs once in 183KB. The two
# schemas with "Error" in the name -- ErrorInfo and BatchDeleteErrorInfo -- are
# per-row failures carried *inside* a 200 response from the batch endpoints,
# each an {index, message} pair. So the only errors this document describes are
# the ones that arrive with a success status.
#
# EMAIL_NOT_FOUND and INVALID_PASSWORD -- the two strings every Firebase Auth
# client on earth switches on -- appear nowhere in it.
#
# What the failures actually look like was struck live, with no credential and
# then with a deliberately invalid one. Both are served here.
#
# **A missing credential is 403. A wrong one is 400. Neither is 401.**
#
# Struck live, no key at all:
#
#   POST https://identitytoolkit.googleapis.com/v1/accounts:lookup
#   HTTP 403
#   {"error": {"code": 403,
#              "message": "Method doesn't allow unregistered callers ...",
#              "errors": [{"message": "...", "domain": "global",
#                          "reason": "forbidden"}],
#              "status": "PERMISSION_DENIED"}}
#
# Struck live, key present and invalid:
#
#   POST .../v1/accounts:lookup?key=not-a-real-key
#   HTTP 400
#   {"error": {"code": 400,
#              "message": "API key not valid. Please pass a valid API key.",
#              "errors": [{...,"reason": "badRequest"}],
#              "status": "INVALID_ARGUMENT",
#              "details": [{"@type": "type.googleapis.com/google.rpc.ErrorInfo",
#                           "reason": "API_KEY_INVALID", ...},
#                          {"@type": ".../google.rpc.LocalizedMessage", ...}]}}
#
# So the two credential failures are 403 and 400 and the API never sends 401 for
# either. A client written the ordinary way -- `if (status === 401) refresh()`
# -- fires on neither. And 400 is the status for malformed input, so a wrong
# credential is reported in the same class as a malformed request body.
#
# **The error format is a query parameter, and it is called `$.xgafv`.**
#
# The document declares a global parameter named `$.xgafv`, enum ["1", "2"],
# described as "V1 error format". Struck live, it changes the body:
#
#   ?$.xgafv=1 (default)    error.code, error.message, error.errors[], error.status, error.details[]
#   ?$.xgafv=2              error.code, error.message,                 error.status, error.details[]
#
# v2 drops the legacy `errors` array and keeps `details`. So one failure has two
# body shapes, a query parameter picks which, the parameter's name begins with
# `$.` and has to be percent-encoded as %24.xgafv to survive a URL builder --
# and neither shape is written down anywhere in the document that declares the
# switch.
#
# The message itself arrives three times in one v1 body: at error.message, at
# error.errors[0].message, and at error.details[1].message.
#
# **The machine-readable reason is three levels down, in an array keyed by
# type.** `API_KEY_INVALID` -- the only part of the 400 a program should branch
# on -- lives at error.details[N].reason, where N is not fixed: entries are
# identified by an `@type` URL, so a client has to scan the array for
# "type.googleapis.com/google.rpc.ErrorInfo" rather than index it.
#
# **41 methods, 35 of them POST, and no DELETE anywhere.**
#
# Six GETs, thirty-five POSTs, no PUT, no PATCH, no DELETE. Deleting an account
# is `POST v1/accounts:delete`. Reading accounts is `POST v1/accounts:lookup`,
# with the filter in the request body. 35 of the 41 paths carry a colon action
# -- accounts:signUp, accounts:signInWithPassword, accounts:sendOobCode -- which
# is Google's AIP convention, the same shape [exoscale](../exoscale) and
# [boundary](../boundary) use and the opposite of [cilium](../cilium)'s, which
# puts a namespace before the colon rather than a verb after it.
#
# The practical effect: HTTP method carries no information here. Every cache,
# every proxy rule and every "is this request safe to retry" heuristic that
# keys on the verb sees POST for reads, writes and deletions alike.
#
# **One record, five timestamps, four encodings.**
#
# From UserInfo, the account object this Recipe serves:
#
#   createdAt          {"type": "string", "format": "int64"}     milliseconds
#   lastLoginAt        {"type": "string", "format": "int64"}     milliseconds
#   validSince         {"type": "string", "format": "int64"}     SECONDS
#   lastRefreshAt      {"type": "string", "format": "google-datetime"}  RFC 3339
#   passwordUpdatedAt  {"type": "number", "format": "double"}    milliseconds
#
# createdAt and validSince have byte-identical type declarations and differ by a
# factor of a thousand. Nothing in the schema distinguishes them; only the
# English descriptions do, and only if read. A generator produces the same Go
# string, the same TypeScript `string`, for both.
#
# passwordUpdatedAt is the same quantity as createdAt in a different JSON type,
# on the same object -- so `typeof user.createdAt === typeof
# user.passwordUpdatedAt` is false for two fields that both mean "a moment".
#
# **13 response fields say "Always present" in prose.**
#
# Discovery has no `required` list for responses, so the document says it in
# English 13 times: "Always present in the response." Every generator makes all
# 13 optional. The strongest is
# SignInWithPasswordResponse.registered -- "Whether the email is for an existing
# account. Always true." -- a boolean that is simultaneously deprecated and
# documented as constant, still emitted, carrying no information at all.
#
# **49 properties are deprecated, 13 of them named `kind`.**
#
# `kind` is the JSON-API-era discriminator. It is marked deprecated on thirteen
# separate response schemas and still sent by all of them.
#
# **writeOnly appears 0 times in 446 properties** -- in a document whose subject
# is credentials, which declares `password` on SignUpRequest and
# SignInWithPasswordRequest, and `passwordHash` and `salt` on UserInfo. After
# [coolify](../coolify) at 0 of 192, [casdoor](../casdoor) at 0 of 234 and
# [exoscale](../exoscale) at 1 of 261, this is the fourth and the sharpest: the
# fields that most need the marker are here and unmarked. readOnly is used, 7
# times, so the vocabulary was available.
#
# **Field visibility depends on the kind of credential, stated in prose.**
# UserInfo.passwordHash and UserInfo.salt: "Only accessible by requests bearing
# a Google OAuth2 credential". GetProjectConfigResponse.allowPasswordUser: "only
# returned for authenticated calls from a developer". So the same schema serves
# two audiences and which fields arrive is not a function of the request a
# client can see. Recorded, not served: reproducing it would mean modelling two
# credential classes, and the finding is that one schema covers both.
#
# **`{+targetProjectId}` is decorated with an operator the document then turns
# off.** 31 path placeholders use RFC 6570's `+` -- reserved expansion, meaning
# slashes in the value are not escaped -- and the top level declares
# `fullyEncodeReservedExpansion: true`, which says to escape them anyway. The
# `+` is left in the templates regardless.
#
# **`basePath` and `servicePath` are both the empty string** while `baseUrl` is
# https://identitytoolkit.googleapis.com/, so every path in the document is
# written without a leading slash: `v1/accounts:signUp`. Joining baseUrl to path
# works; joining an origin to path yields `https://hostv1/accounts:signUp`.
#
# **`GET v1/projects` returns one object.** The method id is
# `identitytoolkit.getProjects`, plural, and there is no id parameter and no
# array in the response: it is GetProjectConfig, the configuration of the
# project the API key belongs to. A path that reads like a collection, a name
# that reads like a collection, and a single record.
#
# **`GET v1/publicKeys` has no declared response at all.** Every other method in
# the document names a response schema. That one has none, because it answers a
# bare map of key id to PEM certificate, which the schema language here cannot
# express. So the document describes 41 methods and declines to describe one of
# their answers.
#
# **The paging token ends empty, not null.** nextPageToken: "If there are more
# accounts to be downloaded, a token ... Otherwise, this is blank." The second
# document in this collection to end a pagination with "" rather than null,
# after [waypoint](../waypoint). Empty is falsy, so `while (token)` terminates
# by accident and `token !== null` never does.

recipe: firebaseauth
capability: auth
version: 0.1.0

upstream:
  api: v1
  docs: https://cloud.google.com/identity-platform/docs/reference/rest/v1/accounts
  # No spec: here, and the absence is the first finding rather than an
  # omission. Google publishes a complete machine-readable description at
  # identitytoolkit.googleapis.com/$discovery/rest?version=v1 -- every
  # observation above about the document came from it -- and it is a Discovery
  # Document, not OpenAPI. It has no `openapi` key and no `swagger` key, so
  # `cauldron drift` reads it as a format it cannot parse and there is no
  # fingerprint to take, because the fingerprint is taken over parsed paths.
  # Naming a URL that nothing can check is what the shipping rule exists to
  # prevent. Recorded here so the next reader knows it was found and rejected
  # rather than missed.

auth:
  scheme: query
  param: key
  # The credential is an API key in the query string. The document says so:
  # "API key. Your API key identifies your project and provides you with API
  # access, quota, and reports. Required unless you provide an OAuth 2.0
  # token." location: query.
  #
  # Which is why Firebase API keys ship inside every web bundle that uses them
  # and why finding one is not a breach: it identifies a project, it does not
  # authorise anything. That is a design decision most providers do not make
  # and almost every scanner mis-reports.
  keys:
    - AIzaSyCauldronFixtureKey0000000000000000000
  # Struck live: 403 with nothing, 400 with something wrong. Not 401 for
  # either, which is the finding.
  absent_error: unregistered_caller
  rejected_error: api_key_invalid

responses:
  list:
    style: wrapped
    key: users
    cursor_field: nextPageToken
    # A token rather than a URL.
    cursor_url: ""
    # Absent on the last page rather than null. The document's own words are
    # "Otherwise, this is blank", and what arrives is no key at all.
    cursor_null: false
  error:
    style: nested
    key: error
    # error.code echoes the HTTP status inside the body -- 403 in the 403, 400
    # in the 400 -- which is what status_field is for.
    status_field: code
    # error.status is the category a client is meant to branch on:
    # PERMISSION_DENIED, INVALID_ARGUMENT. It is a string enum from
    # google.rpc.Code, which is the type_field role rather than the code_field
    # one.
    type_field: status
    # There is no separate error code. The nearest thing is
    # details[N].reason, which is nested inside an array this format cannot
    # reach into; it is carried per-error in fields: below instead.
    code_field: "-"

resources:
  user:
    id:
      field: localId
      # Documented as "Immutable. The unique ID of the account." 28 characters
      # of mixed-case alphanumerics, no prefix and no dashes, so it is not a
      # UUID and cannot be validated as one.
      style: opaque
    fields:
      # The project the account belongs to. Path scope on the listing, and not
      # emitted: the document has no such field on UserInfo -- tenantId is the
      # nearest thing and means something else.
      targetProjectId:
        type: string
        in: "-"
      email:
        type: string
      emailVerified:
        type: boolean
        default: false
      displayName:
        type: string
      disabled:
        type: boolean
        default: false
      phoneNumber:
        type: string
      # Milliseconds since the epoch, written as text. int64 does not survive
      # JSON's number type, so protobuf's JSON mapping sends it as a string --
      # the same trade [etcd](../etcd) and [waypoint](../waypoint) make, and
      # the same shape [clickup](../clickup) has.
      createdAt:
        type: timestamp_ms_string
      lastLoginAt:
        type: timestamp_ms_string
      # RFC 3339, on the same record as the two above. Third encoding.
      lastRefreshAt:
        type: datetime
      # SECONDS since the epoch, as a string -- and its type declaration in the
      # document is byte-identical to createdAt's, which is milliseconds. This
      # format has timestamp_ms_string and no seconds-as-a-string counterpart,
      # so it is declared as the string it is and the literal in the fixture
      # carries the unit. Recorded rather than invented: one provider needing a
      # type is not enough to add one, and the next provider that needs it will
      # find the case already made here.
      validSince:
        type: string
      # Milliseconds again, as a double. Fourth encoding, same object, same
      # quantity as createdAt.
      passwordUpdatedAt:
        type: number
      # Deprecated in the document and sent by every response that has it. The
      # JSON-API-era discriminator, thirteen schemas deep.
      kind:
        type: string
        default: "identitytoolkit#UserInfo"

routes:
  # The account listing, and the only paginated read in the document. A GET,
  # which makes it one of six.
  - method: GET
    path: /v1/projects/{targetProjectId}/accounts:batchGet
    resource: user
    operation: list
    scope: [targetProjectId]
    pagination:
      style: cursor
      limit: 20
      limit_param: maxResults
      cursor_param: nextPageToken

  # A POST that reads. The document calls it GetAccountInfo; the wire calls it
  # accounts:lookup; and it answers {"users": [...]} whether one account
  # matched or twenty.
  - method: POST
    path: /v1/accounts:lookup
    resource: user
    operation: list
    # No pagination declared, because the document declares none: lookup takes
    # localId, email, phoneNumber or federatedUserId and answers everything
    # that matched. A caller who asks for a thousand identifiers gets a
    # thousand records in one body or a failure, and the document does not say
    # which.
    pagination:
      style: none

errors:
  # Struck live 2026-09-06 with no key at all. 403, not 401.
  unregistered_caller:
    status: 403
    # error.status, the string enum from google.rpc.Code. This is the category
    # a client is meant to branch on, which is why it is declared as the type
    # rather than as a constant field.
    type: PERMISSION_DENIED
    message: "Method doesn't allow unregistered callers (callers without established identity). Please use API Key or other form of API consumer identity to call this API."
    fields:
      # Written to a dotted path so it lands inside the envelope rather than
      # beside it, which is where the real one is. This is the v1 format's
      # legacy array, and $.xgafv=2 removes it; the message inside repeats
      # error.message verbatim.
      error.errors:
        - message: "Method doesn't allow unregistered callers (callers without established identity). Please use API Key or other form of API consumer identity to call this API."
          domain: global
          reason: forbidden

  # Struck live with key=not-a-real-key. 400 -- the malformed-input status --
  # for a credential that was present and wrong.
  api_key_invalid:
    status: 400
    type: INVALID_ARGUMENT
    message: "API key not valid. Please pass a valid API key."
    fields:
      error.errors:
        - message: "API key not valid. Please pass a valid API key."
          domain: global
          reason: badRequest
      # The only machine-readable part of this failure, three levels down, in
      # an array whose entries are identified by a type URL rather than by
      # position. Survives $.xgafv=2, unlike the array above.
      error.details:
        - "@type": type.googleapis.com/google.rpc.ErrorInfo
          reason: API_KEY_INVALID
          domain: googleapis.com
          metadata:
            service: identitytoolkit.googleapis.com
        - "@type": type.googleapis.com/google.rpc.LocalizedMessage
          locale: en-US
          message: "API key not valid. Please pass a valid API key."

fixtures:
  empty:
    user: []

  project:
    user:
      - localId: kQ8bT2xMvR7nLpYc4WsGd9Fj3Ae1
        targetProjectId: demo-cauldron
        email: ada@example.invalid
        emailVerified: true
        displayName: Ada Lovelace
        disabled: false
        phoneNumber: "+15550100"
        # Milliseconds. 2026-03-14T09:26:53.589Z.
        createdAt: "1773480413589"
        lastLoginAt: "1788712061204"
        lastRefreshAt: "2026-09-05T22:14:21Z"
        # Seconds, and one thousandth of the numbers above. Same declared type
        # as createdAt in the document.
        validSince: "1788712061"
        # The same quantity as createdAt, as a number.
        passwordUpdatedAt: 1773480413589
      - localId: zR4hN9kQ2wXb7mVt5Ls8Ce3Dy6Ug
        targetProjectId: demo-cauldron
        email: grace@example.invalid
        emailVerified: false
        displayName: Grace Hopper
        disabled: false
        createdAt: "1780000000000"
        lastLoginAt: "1788600000000"
        lastRefreshAt: "2026-09-04T11:02:00Z"
        validSince: "1788600000"
        passwordUpdatedAt: 1780000000000
      - localId: pB6vJ3sYt8QmZ1nKr4Hx7Wg2Ef5A
        targetProjectId: demo-cauldron
        email: katherine@example.invalid
        emailVerified: true
        displayName: Katherine Johnson
        # Disabled, which the document describes as "inaccessible except for
        # requests bearing a Google OAuth2 credential" -- and it is still in
        # this listing, because the listing is one of those.
        disabled: true
        createdAt: "1770000000000"
        lastLoginAt: "1775000000000"
        lastRefreshAt: "2026-04-01T08:00:00Z"
        validSince: "1775000000"
        passwordUpdatedAt: 1770000000000

conformance:
  - name: a missing credential is 403 and never 401
    source: https://identitytoolkit.googleapis.com/v1/accounts:lookup
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      # No key parameter at all. Struck live exactly this way.
      query: {}
      headers: {}
    expect:
      # Struck live. A client testing for 401 to decide whether its credential
      # is missing never sees this.
      status: 403
      body:
        'error.code': 403
        'error.status': PERMISSION_DENIED
        # The whole sentence, struck live. It names API keys and OAuth as
        # the two ways in, and never uses the word Firebase.
        'error.message': "Method doesn't allow unregistered callers (callers without established identity). Please use API Key or other form of API consumer identity to call this API."

  - name: a wrong credential is 400, the status for malformed input
    source: https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=not-a-real-key
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: not-a-real-key
      headers: {}
    expect:
      status: 400
      body:
        'error.code': 400
        'error.status': INVALID_ARGUMENT
        'error.message': "API key not valid. Please pass a valid API key."

  - name: the reason a program should branch on is three levels down
    source: https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=not-a-real-key
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: not-a-real-key
      headers: {}
    expect:
      status: 400
      body:
        # Struck live. The entry is found by its @type rather than its index,
        # so a client cannot hard-code the 0 this assertion uses.
        'error.details[0].reason': API_KEY_INVALID
        'error.details[0].@type': type.googleapis.com/google.rpc.ErrorInfo
        # And the message arrives a third time, at the bottom of the array.
        'error.details[1].message': "API key not valid. Please pass a valid API key."

  - name: the legacy errors array repeats the message verbatim
    source: https://identitytoolkit.googleapis.com/v1/accounts:lookup
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query: {}
      headers: {}
    expect:
      status: 403
      body:
        # error.message and error.errors[0].message are the same string.
        # $.xgafv=2 drops this array and keeps the rest, which is recorded in
        # the README and not served: the switch is a query parameter this
        # format has no way to branch a whole envelope on.
        'error.errors[0].reason': forbidden
        'error.errors[0].domain': global

  - name: reading accounts is a POST
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/accounts/lookup
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
    expect:
      status: 200
      body:
        # Wrapped under users whether one matched or three. 35 of this API's
        # 41 methods are POST and none of them is DELETE.
        'users[0].localId': kQ8bT2xMvR7nLpYc4WsGd9Fj3Ae1
        'users[2].email': katherine@example.invalid

  - name: one record carries four different time encodings
    source: https://identitytoolkit.googleapis.com/$discovery/rest?version=v1
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
    expect:
      status: 200
      body:
        # Milliseconds as a string.
        'users[0].createdAt': "1773480413589"
        # Seconds as a string, declared in the document with byte-identical
        # types to the line above, and a thousand times smaller.
        'users[0].validSince': "1788712061"
        # RFC 3339.
        'users[0].lastRefreshAt': "2026-09-05T22:14:21Z"
        # The same quantity as createdAt, as a number rather than a string.
        'users[0].passwordUpdatedAt': 1773480413589

  - name: the account listing pages on a token and takes maxResults
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/projects.accounts/batchGet
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /v1/projects/demo-cauldron/accounts:batchGet
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
        maxResults: "2"
    expect:
      status: 200
      body:
        'users[0].localId': kQ8bT2xMvR7nLpYc4WsGd9Fj3Ae1
      matches:
        # Present because a third record is waiting. The document's own
        # description of the last page is "this is blank", so a client testing
        # `nextPageToken !== null` loops forever.
        nextPageToken: '.'

  - name: the last page omits the token rather than nulling it
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/projects.accounts/batchGet
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /v1/projects/demo-cauldron/accounts:batchGet
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
        maxResults: "50"
    expect:
      status: 200
      absent:
        - nextPageToken

  - name: a deprecated field is still sent
    source: https://identitytoolkit.googleapis.com/$discovery/rest?version=v1
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
    expect:
      status: 200
      body:
        # kind is marked deprecated on thirteen separate response schemas in
        # this document and emitted by all of them.
        'users[1].kind': "identitytoolkit#UserInfo"

  - name: a disabled account is in the listing
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/projects.accounts/batchGet
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /v1/projects/demo-cauldron/accounts:batchGet
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
    expect:
      status: 200
      body:
        'users[2].disabled': true
        'users[2].emailVerified': true

  - name: the token to follow is a companion to maxResults
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/projects.accounts/batchGet
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /v1/projects/demo-cauldron/accounts:batchGet
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
        maxResults: "2"
        # Handed back by the request before this one. Sending it is what pins
        # the parameter name: with no case that uses it, nextPageToken could
        # be called anything and every other case here would still pass.
        nextPageToken: zR4hN9kQ2wXb7mVt5Ls8Ce3Dy6Ug
    expect:
      status: 200
      body:
        # The third record, which the first page did not reach.
        'users[0].localId': pB6vJ3sYt8QmZ1nKr4Hx7Wg2Ef5A
      absent:
        # And nothing after it. Blank rather than null, in the document's own
        # words, which here means the key does not arrive at all.
        - nextPageToken

  - name: an account carries a name, a number and a previous login
    source: https://cloud.google.com/identity-platform/docs/reference/rest/v1/accounts
    verified: "2026-09-06"
    fixture: project
    request:
      method: POST
      path: /v1/accounts:lookup
      query:
        key: AIzaSyCauldronFixtureKey0000000000000000000
    expect:
      status: 200
      body:
        'users[0].displayName': Ada Lovelace
        # E.164, and a plain string: the document gives phoneNumber no format
