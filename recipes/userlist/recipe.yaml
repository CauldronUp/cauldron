# Userlist Recipe for Cauldron
#
# Written against Userlist's API reference at userlist.com/docs and struck live
# against api.userlist.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **A credential failure is reported as a missing resource.** Struck live, both
# ways, byte-identical:
#
#   GET /users                               (no credential)
#   GET /users                               Authorization: Push notreal
#   404 {"status":404,"code":"not_found",
#        "errors":["The requested resource could not be found on the server."]}
#
# Not 401, not 403 -- **404**, with a sentence about a resource. The route
# exists; the caller's permission to see it does not; and the API answers by
# claiming the thing is not there.
#
# It is the second provider in this collection to do this, after
# [eightbyeight](../eightbyeight), and the two arrive at it differently. 8x8's
# 404 is Kong refusing to route a request without a matching consumer, so the
# gateway genuinely has no route. Userlist's application answers with its own
# envelope and its own code, so this is a decision rather than a side effect.
#
# It is also, arguably, the right decision. Answering 401 to an unauthenticated
# request confirms that `/users` exists; answering 404 does not. Several
# providers here worry about disclosure and none of the others follow through
# this far. The cost is that a developer with a working key and a typo, and a
# developer with a wrong key and a correct path, are told the same thing.
#
# **The credential scheme is `Push`.** `Authorization: Push <token>`, not
# Bearer -- a scheme name Userlist made up, which no HTTP library has a helper
# for and which every reader has to be told about. It is at least unambiguous:
# a token sent as Bearer is not silently half-accepted.
#
# **`errors` is an array of bare strings** -- the third shape for that field
# name in this collection, after [honeybadger](../honeybadger)'s single string
# and [gong](../gong)'s array of strings, and against
# [beehiiv](../beehiiv)'s array of objects, which is the one that works.
#
# **`status` and `code` say the same thing twice.** The number and the phrase,
# both restating the status line, beside an array carrying the only sentence.

recipe: userlist
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://userlist.com/docs/api/
  # No spec: Userlist publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  # Not "Bearer ". A scheme name Userlist made up, which no HTTP library has a
  # helper for.
  prefix: "Push "
  keys:
    - cauldr0nuserl1stf1xturet0ken0000
  # One response for both, and it is a 404.
  absent_error: not_found
  rejected_error: not_found
  malformed_error: not_found

responses:
  list:
    style: wrapped
    key: users
    fields:
      # Userlist's own paging block, and the cursor is a whole URL.
      pagination:
        next: null
        previous: null
  error:
    style: string_list
    key: errors
    fields:
      # Both derivable from the status line, beside the array carrying the
      # only sentence.
      status: 404
      code: not_found

resources:
  user:
    id:
      field: identifier
      style: opaque
    fields:
      email:
        type: string
      properties:
      signed_up_at:
        type: datetime

routes:
  - method: GET
    path: /users
    resource: user
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: after

errors:
  not_found:
    # Not 401 and not 403. The route exists, the caller's permission does not,
    # and the API answers by claiming the thing is not there. Arguably the
    # right call for disclosure, and it means a typo and a wrong key are one
    # response.
    status: 404
    message: "The requested resource could not be found on the server."

fixtures:
  empty:
    user: []

  account:
    user:
      - identifier: ada-lovelace
        email: ada@example.invalid
        signed_up_at: "2026-04-02T10:15:00.000Z"
        properties:
          plan: pro
          seats: 12
      - identifier: grace-hopper
        email: grace@example.invalid
        signed_up_at: "2026-08-19T14:40:00.000Z"
        # No properties at all: an empty object rather than a missing key, so
        # two users have the same field with no common shape and neither is
        # null.
        properties: {}

conformance:
  - name: a missing credential is a 404
    source: https://api.userlist.com/users
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /users
      headers: {}
    expect:
      # The route exists and the API says it does not. Arguably the right
      # call -- answering 401 would confirm that /users is real -- and it
      # means a typo and a wrong key are one response.
      status: 404
      body:
        'errors[0]': "The requested resource could not be found on the server."
        code: not_found

  - name: a wrong credential is the same 404
    source: https://api.userlist.com/users
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push notreal"
    expect:
      status: 404
      body:
        'errors[0]': "The requested resource could not be found on the server."

  - name: a Bearer prefix is not the scheme this API takes
    source: https://userlist.com/docs/api/
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        # What every HTTP library's built-in helper sends. Userlist takes
        # `Push`, which it invented, and the refusal does not mention it --
        # though it is at least unambiguous: a Bearer token is not silently
        # half-accepted.
        Authorization: "Bearer cauldr0nuserl1stf1xturet0ken0000"
    expect:
      status: 404
      body:
        code: not_found

  - name: errors is an array of bare strings
    source: https://api.userlist.com/users
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /users
      headers: {}
    expect:
      status: 404
      body:
        # The third shape for this field name in the collection: Honeybadger
        # sends a single string, Gong an array of strings, beehiiv an array of
        # objects -- and only the last can carry a code per failure.
        'errors[0]': "The requested resource could not be found on the server."

  - name: the status is restated twice beside the array
    source: https://api.userlist.com/users
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /users
      headers: {}
    expect:
      status: 404
      body:
        # The number and the phrase, both derivable from the status line,
        # beside the array carrying the only sentence.
        status: 404
        code: not_found

  - name: users are wrapped under their own plural
    source: https://userlist.com/docs/api/
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push cauldr0nuserl1stf1xturet0ken0000"
    expect:
      status: 200
      body:
        'users[0].identifier': ada-lovelace
        'users[0].email': ada@example.invalid

  - name: the identifier is whatever the customer calls the user
    source: https://userlist.com/docs/api/
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push cauldr0nuserl1stf1xturet0ken0000"
    expect:
      status: 200
      body:
        # Userlist mints none of its own: `identifier` is the integrating
        # application's own key, so it is unvalidated and has to be URL-safe
        # by luck -- the same trade Sift and Nango make.
        'users[1].identifier': grace-hopper
        'users[1].signed_up_at': "2026-08-19T14:40:00.000Z"

  - name: properties are an untyped object that can be empty
    source: https://userlist.com/docs/api/
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push cauldr0nuserl1stf1xturet0ken0000"
    expect:
      status: 200
      body:
        # Whatever the customer attached, with no schema -- and an empty
        # object rather than null when they attached nothing, so a client
        # cannot tell "no properties" from "never set any".
        'users[0].properties.plan': pro
        'users[0].properties.seats': 12
        'users[1].properties': {}

  - name: the paging block is nulls rather than absences
    source: https://userlist.com/docs/api/
    fixture: account
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push cauldr0nuserl1stf1xturet0ken0000"
      query:
        limit: "100"
        after: ada-lovelace
    expect:
      status: 200
      body:
        # next and previous both present and both null on the last page, so
        # testing for the key finds it and the value has to be tested -- the
        # same shape Salt Edge has.
        'pagination.next': null
        'pagination.previous': null

  - name: an account with no users answers an empty array
    source: https://userlist.com/docs/api/
    fixture: empty
    request:
      method: GET
      path: /users
      headers:
        Authorization: "Push cauldr0nuserl1stf1xturet0ken0000"
    expect:
      status: 200
      body:
        users: []
