# Tailscale Recipe for Cauldron
#
# The device listing, read from Tailscale's own Go client
# (tailscale-client-go), and struck live against api.tailscale.com on
# 2026-09-13 with no header, with a wrong bearer, with a Basic credential, on a
# path that does not exist, and with a method the path does not take.
#
# **One sentence for four different causes.** Struck live, all four answering
# `{"message":"API token invalid"}` with a 401:
#
#   (no header)                     an absent credential
#   Bearer tskey-api-notarealkey    a wrong one
#   -u notarealkey:                 a Basic header instead of a bearer
#   PUT on a real path              a method the route does not take
#
# "Invalid", for a token that was never sent; and the same words for a request
# whose only fault was the verb.
#
# **An unrouted path is Go's plain-text default, wrapped in JSON.**
# `{"message":"404 page not found"}` -- the exact string `net/http` writes as
# `text/plain`, lifted into a message field. The sentence carries its own status
# code, so a client printing `message` prints "404" twice.
#
# **A timestamp can be the empty string.** The vendor's own client defines a
# `Time` type whose unmarshaller says: "a blank string will keep the time at its
# zero value". That code exists because the API sends `""` where a date belongs
# -- not `null`, not an absent key -- on `created`, `expires` and `lastSeen`.
# Every strict JSON date parser in every other language throws on it.
#
# **The listing envelope has no type at all.** The client reads it as
# `map[string][]Device` and returns `resp["devices"]`, so the one key wrapping
# the collection is a string literal in the middle of a function rather than a
# declared shape.
#
# **A failure can be attributed to a user.** `APIError` is
# `{message, data}` where `data` is `[{user, errors}]` -- a list of per-user
# objects, each with its own list of strings. So one HTTP failure can carry
# several people's problems, and the live 401 carries none of it: `data` is
# simply absent.
#
# **A device carries two public keys.** `machineKey` and `nodeKey` are on every
# record in the listing, so enumerating devices hands out both.
#
# **And two fields say what it is called.** `name` and `hostname`, side by side,
# with nothing saying which one a human picked.
#
# Also pinned: six booleans on one record -- `authorized`, `keyExpiryDisabled`,
# `blocksIncomingConnections`, `isExternal`, `connectedToControl`,
# `updateAvailable` -- with no enum anywhere; and `addresses`, a list, beside
# `name`, a string, for the two ways to reach the same machine.

recipe: tailscale
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://tailscale.com/api
  # No spec: Tailscale's api.md now redirects to a documentation site, and no
  # OpenAPI description is served at any address this Recipe could find. The
  # record shape below is the vendor's own Go client types.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - tskey-api-cauldr0nf1xture-k3y00000000000
  # One sentence for an absent credential, a wrong one, and a Basic header.
  absent_error: api_token_invalid
  rejected_error: api_token_invalid
  malformed_error: api_token_invalid
  after_routing: true

responses:
  list:
    style: wrapped
    # A string literal in the middle of a function, rather than a type.
    key: devices
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  device:
    id:
      field: id
      style: digits
      length: 18
    fields:
      # The two ways to reach it.
      addresses:
        type: list
      name:
        type: string
      # And the second name, with nothing saying which a human chose.
      hostname:
        type: string
      user:
        type: string
      tags:
        type: list
      os:
        type: string
      clientVersion:
        type: string
      # Three timestamps, any of which can be the empty string.
      created:
        type: string
      expires:
        type: string
      lastSeen:
        type: string
      # Two public keys, handed out by a listing.
      machineKey:
        type: string
      nodeKey:
        type: string
      authorized:
        type: boolean
      keyExpiryDisabled:
        type: boolean
      blocksIncomingConnections:
        type: boolean
      isExternal:
        type: boolean
      connectedToControl:
        type: boolean
      updateAvailable:
        type: boolean

routes:
  - method: GET
    path: /api/v2/tailnet/{tailnet}/devices
    resource: device
    operation: list
    pagination:
      style: none

errors:
  api_token_invalid:
    status: 401
    # "Invalid", for a token that was never sent.
    message: API token invalid

  method_not_allowed:
    # Live, a method the route does not take answers the credential failure,
    # while an unrouted path answers the one below -- so the router runs first
    # and the verb check never does.
    status: 401
    message: API token invalid

  unknown_route:
    status: 404
    # net/http's plain-text default, lifted into a JSON field, status and all.
    message: 404 page not found

fixtures:
  empty:
    device: []

  tailnet:
    device:
      - id: "123456789012345678"
        addresses:
          - 100.101.102.103
          - fd7a:115c:a1e0::1
        name: laptop.example.ts.net
        # The second name.
        hostname: laptop
        user: person@example.com
        tags: []
        os: macOS
        clientVersion: 1.86.2
        created: "2026-01-14T09:20:11Z"
        expires: "2026-07-13T09:20:11Z"
        lastSeen: "2026-09-13T21:58:00Z"
        # Two public keys, in a listing.
        machineKey: mkey:cauldr0nf1xture0000000000000000000000000000000000000000000000
        nodeKey: nodekey:cauldr0nf1xture000000000000000000000000000000000000000000000
        authorized: true
        keyExpiryDisabled: false
        blocksIncomingConnections: false
        isExternal: false
        connectedToControl: true
        updateAvailable: true
      - id: "876543210987654321"
        addresses:
          - 100.104.105.106
        name: ci-runner.example.ts.net
        hostname: ci-runner
        user: tagged-devices
        tags:
          - tag:ci
        os: linux
        clientVersion: 1.84.0
        created: "2026-05-02T00:00:00Z"
        # A date field holding two quotes, which is why the client's own Time
        # type has a special case for it.
        expires: ""
        lastSeen: ""
        machineKey: mkey:cauldr0nf1xture1111111111111111111111111111111111111111111111
        nodeKey: nodekey:cauldr0nf1xture111111111111111111111111111111111111111111111
        authorized: false
        keyExpiryDisabled: true
        blocksIncomingConnections: true
        isExternal: false
        connectedToControl: false
        updateAvailable: false

conformance:
  - name: a token that was never sent is invalid
    source: https://api.tailscale.com/api/v2/tailnet/-/devices
    verified: "2026-09-13"
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/-/devices
      headers: {}
    expect:
      status: 401
      body:
        message: API token invalid
      absent:
        # The client's APIError declares a data array of per-user errors.
        # The live failure carries none of it.
        - data

  - name: a wrong token is the same sentence
    source: https://api.tailscale.com/api/v2/tailnet/-/devices
    verified: "2026-09-13"
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/-/devices
      headers:
        Authorization: "Bearer tskey-api-notarealkey"
    expect:
      status: 401
      body:
        message: API token invalid

  - name: a Basic header is the same sentence again
    source: https://api.tailscale.com/api/v2/tailnet/-/devices
    verified: "2026-09-13"
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/-/devices
      headers:
        Authorization: "Basic bm90YXJlYWxrZXk6"
    expect:
      status: 401
      body:
        message: API token invalid

  - name: and a method the route does not take gets it too
    source: https://api.tailscale.com/api/v2/tailnet/-/devices
    verified: "2026-09-13"
    fixture: tailnet
    request:
      method: PUT
      path: /api/v2/tailnet/-/devices
      headers: {}
    expect:
      status: 401
      body:
        # The verb was the only thing wrong and the answer is about a token.
        message: API token invalid

  - name: an unrouted path is Go's plain text wrapped in JSON
    source: https://api.tailscale.com/api/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # The exact string net/http writes as text/plain, in a message field,
        # carrying its own status code.
        message: 404 page not found

  - name: a timestamp can be two quotes
    source: https://github.com/tailscale/tailscale-client-go
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/example.ts.net/devices
      headers:
        Authorization: "Bearer tskey-api-cauldr0nf1xture-k3y00000000000"
    expect:
      status: 200
      body:
        # Not null, not absent: the empty string, which is why the vendor's
        # own Time type has an unmarshaller that special-cases it.
        'devices[1].expires': ""
        'devices[1].lastSeen': ""
        'devices[0].expires': "2026-07-13T09:20:11Z"
        'devices[0].lastSeen': "2026-09-13T21:58:00Z"
        'devices[0].created': "2026-01-14T09:20:11Z"
        'devices[1].created': "2026-05-02T00:00:00Z"

  - name: a listing hands out two public keys per device
    source: https://github.com/tailscale/tailscale-client-go
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/example.ts.net/devices
      headers:
        Authorization: "Bearer tskey-api-cauldr0nf1xture-k3y00000000000"
    expect:
      status: 200
      body:
        'devices[0].machineKey': mkey:cauldr0nf1xture0000000000000000000000000000000000000000000000
        'devices[0].nodeKey': nodekey:cauldr0nf1xture000000000000000000000000000000000000000000000
        'devices[1].machineKey': mkey:cauldr0nf1xture1111111111111111111111111111111111111111111111
        'devices[1].nodeKey': nodekey:cauldr0nf1xture111111111111111111111111111111111111111111111

  - name: two fields say what the machine is called
    source: https://github.com/tailscale/tailscale-client-go
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/example.ts.net/devices
      headers:
        Authorization: "Bearer tskey-api-cauldr0nf1xture-k3y00000000000"
    expect:
      status: 200
      body:
        # And a third way to reach it, in a list beside them.
        'devices[0].name': laptop.example.ts.net
        'devices[0].hostname': laptop
        'devices[0].addresses[0]': 100.101.102.103
        'devices[0].addresses[1]': fd7a:115c:a1e0::1
        'devices[1].addresses[0]': 100.104.105.106
        'devices[0].user': person@example.com
        'devices[1].user': tagged-devices
        'devices[1].tags[0]': tag:ci
        'devices[0].tags': []

  - name: six booleans and no enum anywhere
    source: https://github.com/tailscale/tailscale-client-go
    fixture: tailnet
    request:
      method: GET
      path: /api/v2/tailnet/example.ts.net/devices
      headers:
        Authorization: "Bearer tskey-api-cauldr0nf1xture-k3y00000000000"
    expect:
      status: 200
      body:
        'devices[0].authorized': true
        'devices[1].authorized': false
        'devices[0].keyExpiryDisabled': false
        'devices[1].keyExpiryDisabled': true
        'devices[0].blocksIncomingConnections': false
        'devices[1].blocksIncomingConnections': true
        'devices[0].isExternal': false
        'devices[0].connectedToControl': true
        'devices[1].connectedToControl': false
        'devices[0].updateAvailable': true
        'devices[1].updateAvailable': false
        'devices[0].os': macOS
        'devices[1].os': linux
        'devices[0].clientVersion': 1.86.2
        'devices[0].id': "123456789012345678"

  - name: a tailnet with no devices still sends the untyped envelope
    source: https://github.com/tailscale/tailscale-client-go
    fixture: empty
    request:
      method: GET
      path: /api/v2/tailnet/example.ts.net/devices
      headers:
        Authorization: "Bearer tskey-api-cauldr0nf1xture-k3y00000000000"
    expect:
      status: 200
      body:
        # The key the client reads by string literal, and nothing else: no
        # count, no cursor, no paging of any kind.
        devices: []
