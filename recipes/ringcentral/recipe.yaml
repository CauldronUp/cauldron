  - name: an expired token is a 401 that reads like a bad one
    source: https://developers.ringcentral.com/api-reference
    arm: token_expired
    fixture: small-account
    request:
      method: GET
      path: /restapi/v1.0/account/~/extension/~/message-store
      headers:
        Authorization: Bearer cauldron_ringcentral_access_token
    expect:
      # An access token lives an hour. The code is the only thing separating
      # this from a credential that was never valid, and retrying with the
      # same token is pointless while refreshing it fixes it.
      status: 401
      body:
        errorCode: OAU-213
      matches:
        message: 'expired'

  - name: the rate limit names the group it belongs to
    source: https://developers.ringcentral.com/guide/basics/rate-limits
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: /restapi/v1.0/account/~/extension/~/call-log
      headers:
        Authorization: Bearer cauldron_ringcentral_access_token
    expect:
      status: 429
      headers:
        # Every endpoint belongs to Light, Medium or Heavy, and each group has
        # its own budget. A client backing off globally on this leaves the
        # other two groups idle for no reason.
        X-Rate-Limit-Group: Heavy
        X-Rate-Limit-Window: "60"
        Retry-After: "60"
      body:
        errorCode: CMN-301


