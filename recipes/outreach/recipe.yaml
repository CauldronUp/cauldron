# Outreach Recipe for Cauldron
#
# The prospects listing, read from the OpenAPI document Outreach serves without
# a credential at api.outreach.io/api/v2/schema/openapi.json, and struck live
# against api.outreach.io on 2026-09-11 with no credential, with a deliberately
# invalid one, and on a path that does not exist.
#
# **The API demands JSON:API and does not answer it.** Every request must carry
# `Content-Type: application/vnd.api+json` or take a 415, and the document's own
# error object is JSON:API's:
#
#   {errors: [{id: "unsupportedMediaType", title: "...", details: "..."}]}
#
# The live failure is not that. Struck live:
#
#   (no header)      401 application/json {"error":"No Authorization header.","description":"You must provide an Authorization header with a valid access token."}
#   Bearer notreal   401 application/json {"error":"Invalid JWT token.","description":"The JWT token could not be decoded."}
#
# No `errors` array, no `id`, no `title`, and `application/json` rather than the
# media type the API insists its callers send. A client written against the
# documented shape reads `body.errors[0].title` and gets a TypeError on the
# first failure it meets.
#
# **And the documented error object misuses JSON:API twice.** JSON:API defines
# `id` as "a unique identifier for this particular occurrence of the problem"
# and Outreach puts an error *code* in it -- `unsupportedMediaType`, the same
# string on every occurrence. JSON:API defines the human-readable explanation as
# `detail`; Outreach calls it `details`.
#
# **The failure names the credential's format.** `Invalid JWT token.` and `The
# JWT token could not be decoded.` tell a caller who has presented nothing valid
# that the token is a JWT -- which is to say, that it is base64 and can be read
# without the key. The 401 for a missing header is a different sentence than the
# 401 for a bad one, and both end in a full stop, so `error` is prose rather
# than a code and anything switching on it is switching on English punctuation.
#
# **The machine-readable document declares no parameters and no 401.**
# `GET /prospects` in the OpenAPI lists `parameters: []` and responses 200 and
# 422 -- on an endpoint whose prose documentation spends four sections on
# `filter`, `sort`, `count` and `page`, and which answers 401 to every request
# that arrives without a token. So the definition omits every input and the
# output a caller meets first.
#
# **Two security schemes are defined identically under different names.**
# `bearerAuth` and `s2sAuthToken` are both `{type: http, scheme: bearer,
# bearerFormat: JWT}`, byte for byte, and only the first is referenced anywhere.
#
# **The page-size parameter has two names.** Cursor pagination is documented as
# `page[size]`; offset pagination, three paragraphs later, as `page[limit]`.
# Same quantity, two spellings, and the `links` each style returns are spelled
# with its own.
#
# **Nothing on a prospect is required.** The `prospect` schema has 230
# attributes and no `required` array, and `prospectResponse` has none either --
# so `id` and `type`, which JSON:API requires on every resource object, are
# optional in Outreach's own description of one.
#
# **And the field metadata is images.** Every attribute description in the
# OpenAPI begins with raw HTML:
#
#   <img src=https://developers.outreach.io/badges/filterable.svg>
#   <img src=https://developers.outreach.io/badges/sortable.svg>
#   <img src=https://developers.outreach.io/badges/readonly.svg>
#
# Whether a field can be filtered, sorted or written is encoded as a hotlinked
# picture inside a free-text description. A generated client gets an unescaped
# `<img>` tag in its docstring, a reader offline sees nothing at all, and the
# only way to answer "is this filterable" mechanically is to match an image
# filename.

recipe: outreach
capability: crm
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.outreach.io/api/making-requests/
  spec: https://api.outreach.io/api/v2/schema/openapi.json
  spec_hash: c1a2d1e83fdf20723546b0b03668fff84ae5fbcd73ffb664c7b0c575bde5bd2c
  spec_seen: "2026-09-11"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.0utreach.f1xture
  # Two different sentences, and the second names the token's format.
  absent_error: no_authorization_header
  rejected_error: invalid_jwt_token
  # An unrouted path answers the credential failure, so the token is read
  # before the path is resolved.
  after_routing: false

responses:
  list:
    style: wrapped
    key: data
    # JSON:API's top-level links, as whole URLs.
    cursor_field: links.next
    cursor_url: absolute
    prev_field: links.prev
  error:
    # Not the documented {errors: [...]}. Two top-level keys.
    style: flat
    message_field: error
    code_field: "-"

resources:
  prospect:
    id:
      field: id
      style: numeric
      type: number
    constants:
      # JSON:API's discriminator, singular where the path is plural.
      type: prospect
    fields:
      firstName:
        type: string
        in: attributes
      lastName:
        type: string
        in: attributes
      # A list, on a resource most systems key by one address.
      emails:
        type: list
        in: attributes
      # The account's name copied onto the prospect when there is an account,
      # and free text when there is not.
      company:
        type: string
        in: attributes
      title:
        type: string
        in: attributes
      # "preferably in the IANA format" -- a field that is only preferably a
      # standard.
      timeZone:
        type: string
        in: attributes
      optedOut:
        type: boolean
        in: attributes
      engagedScore:
        type: number
        in: attributes
      createdAt:
        type: datetime
        in: attributes
      updatedAt:
        type: datetime
        in: attributes
      availableAt:
        in: attributes
      relationships:
        type: map

routes:
  - method: GET
    path: /api/v2/prospects
    resource: prospect
    operation: list
    pagination:
      style: cursor
      limit: 50
      max_limit: 1000
      # The cursor style spells it size; the deprecated offset style, three
      # paragraphs later in the same page, spells it limit.
      limit_param: page[size]
      cursor_param: page[after]

errors:
  no_authorization_header:
    status: 401
    # A sentence, with a full stop, in the field a client would switch on.
    message: No Authorization header.
    fields:
      description: You must provide an Authorization header with a valid access token.

  invalid_jwt_token:
    status: 401
    # And this one names the format, so a caller who has proved nothing learns
    # the credential is a readable token.
    message: Invalid JWT token.
    fields:
      description: The JWT token could not be decoded.

fixtures:
  empty:
    prospect: []

  org:
    prospect:
      - id: 1
        firstName: Sally
        # Null, on a record whose schema requires nothing at all.
        lastName: null
        emails:
          - sally@acme.example
        company: Acme
        title: Head of Operations
        timeZone: America/Los_Angeles
        optedOut: false
        engagedScore: 3.5
        createdAt: "2017-01-01T00:00:00Z"
        updatedAt: "2026-08-14T09:12:44Z"
        availableAt: null
        relationships:
          account:
            # A resource identifier: type and id, and nothing else.
            data:
              type: account
              id: 1
          mailings:
            # And a link instead of data, because the collection could be
            # large. Two relationship shapes on one record.
            links:
              related: https://api.outreach.io/api/v2/mailings?filter[prospect][id]=1
      - id: 2
        firstName: Ada
        lastName: Byron
        emails:
          - ada@acme.example
          - a.byron@acme.example
        company: Acme
        title: Principal Engineer
        timeZone: Europe/London
        optedOut: true
        engagedScore: 0
        createdAt: "2019-06-02T11:30:00Z"
        updatedAt: "2026-09-01T16:05:10Z"
        availableAt: "2026-12-01T09:00:00Z"
        relationships:
          account:
            data:
              type: account
              id: 1

conformance:
  - name: a missing header is not the documented error envelope
    source: https://api.outreach.io/api/v2/prospects
    verified: "2026-09-11"
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers: {}
    expect:
      status: 401
      headers:
        # Not application/vnd.api+json, which is the media type this API
        # requires its callers to send.
        Content-Type: application/json
      body:
        # No errors array, no id, no title. Two top-level keys.
        error: No Authorization header.
        description: You must provide an Authorization header with a valid access token.

  - name: a wrong token names the credential's format
    source: https://api.outreach.io/api/v2/prospects
    verified: "2026-09-11"
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # So a caller who has proved nothing is told the token is a JWT, and
        # that the failure was a decode rather than a rejection.
        error: Invalid JWT token.
        description: The JWT token could not be decoded.

  - name: an unrouted path is a credential failure
    source: https://api.outreach.io/api/v2/cauldron-nope
    verified: "2026-09-11"
    fixture: org
    request:
      method: GET
      path: /api/v2/cauldron-nope
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      # Not 404. The token is read before the path is resolved, so a mistyped
      # path is reported as a bad credential.
      status: 401
      body:
        error: Invalid JWT token.

  - name: a prospect is a JSON API resource object
    source: https://api.outreach.io/api/v2/schema/openapi.json
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        # type and id beside each other, and every field of substance one
        # level down -- neither of them required by Outreach's own schema.
        'data[0].type': prospect
        'data[0].id': 1
        'data[0].attributes.firstName': Sally
        'data[0].attributes.company': Acme

  - name: nothing on the record is required and a name can be null
    source: https://api.outreach.io/api/v2/schema/openapi.json
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        # 230 attributes, no required array, and the example in Outreach's own
        # documentation has a null surname.
        'data[0].attributes.lastName': null
        'data[0].attributes.availableAt': null
        'data[0].attributes.optedOut': false
        'data[0].attributes.timeZone': America/Los_Angeles

  - name: one prospect holds a list of addresses
    source: https://api.outreach.io/api/v2/schema/openapi.json
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        'data[1].attributes.emails[0]': ada@acme.example
        'data[1].attributes.emails[1]': a.byron@acme.example
        'data[1].attributes.optedOut': true
        'data[1].attributes.engagedScore': 0
        'data[1].attributes.title': Principal Engineer
        'data[1].attributes.availableAt': "2026-12-01T09:00:00Z"

  - name: relationships come in two shapes on one record
    source: https://developers.outreach.io/api/making-requests/
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        # A resource identifier for the to-one, and a URL for the to-many, so
        # reading a relationship means testing which kind it is first.
        'data[0].relationships.account.data.type': account
        'data[0].relationships.account.data.id': 1
        'data[0].relationships.mailings.links.related': https://api.outreach.io/api/v2/mailings?filter[prospect][id]=1

  - name: a page advertises the next one as a whole URL
    source: https://developers.outreach.io/api/making-requests/
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
      query:
        # The cursor style's spelling. The offset style calls the same
        # quantity page[limit].
        page[size]: "1"
    expect:
      status: 200
      body:
        'data[0].id': 1
      matches:
        'links.next': '^https?://'

  - name: the timestamps and the modified dates both travel
    source: https://api.outreach.io/api/v2/schema/openapi.json
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        'data[0].attributes.createdAt': "2017-01-01T00:00:00Z"
        'data[0].attributes.updatedAt': "2026-08-14T09:12:44Z"
        'data[0].attributes.engagedScore': 3.5
        'data[1].attributes.lastName': Byron

  - name: the cursor resumes where the page stopped
    source: https://developers.outreach.io/api/making-requests/
    fixture: org
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
      query:
        page[size]: "1"
        # The token out of the previous page's links.next, which is a whole
        # URL rather than a bare cursor -- so a client following it carries
        # the page size along without meaning to.
        page[after]: "1"
    expect:
      status: 200
      body:
        'data[0].id': 2
        'data[0].attributes.firstName': Ada

  - name: an organisation with no prospects still sends the envelope
    source: https://api.outreach.io/api/v2/schema/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v2/prospects
      headers:
        Authorization: "Bearer cauldr0n.0utreach.f1xture"
    expect:
      status: 200
      body:
        data: []
