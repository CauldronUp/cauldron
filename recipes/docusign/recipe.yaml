# Docusign Recipe for Cauldron
#
# Docusign is the clearest case in this collection for not testing against the
# real thing. Sending an envelope emails a real person and asks them to sign a
# document. The developer sandbox is free and still sends those emails, still
# requires every recipient to have a real address, and still cannot be made to
# produce the states that matter: a recipient who declines, one who opens and
# never signs, an envelope voided after partial completion.
#
# Two things worth modelling exactly:
#
#   1. "delivered" does not mean signed. It means the recipient opened the
#      envelope. The sequence is sent, delivered, completed, and code that
#      treats delivered as done files an unsigned document.
#   2. The counts in a listing are strings. resultSetSize and totalSetSize
#      come back as "2", not 2, so code comparing them to a number never
#      matches. Emitting a number here would quietly fix a bug the caller has
#      to handle.
#
# Probed live, unauthenticated, on 2026-09-05, against demo.docusign.net:
#
#   1. GET .../envelopes with no Authorization header at all does not answer
#      what a token-shaped one gets. It answers 401
#      {"errorCode":"PARTNER_AUTHENTICATION_FAILED","message":"The specified
#      Integrator Key was not found or is disabled. An Integrator key was
#      not specified."} -- naming an integrator key, not a token, because
#      Docusign checks for one before it ever gets to looking at a bearer
#      token. auth.absent_error below carries that split.
#   2. The same route with a well-formed but invented bearer token answers
#      401 {"errorCode":"AUTHORIZATION_INVALID_TOKEN","message":"The access
#      token provided is expired, revoked or malformed."} -- exactly what
#      this file already declared for authentication_error, unmodified by
#      this probe.
#   3. GET .../not-a-real-endpoint and DELETE on the real envelopes path (a
#      method this Recipe does not declare for it) both answer 404 with zero
#      bytes and no Content-Type, and both carry the identical non-standard
#      HTTP reason phrase "The URL provided does not resolve to a resource."
#      in place of "Not Found" -- checked with no credential presented at
#      all, so the routing gateway answers before Docusign's application
#      would. auth.after_routing below carries that ordering.
#
# Known fidelity gap: Go's net/http server always writes the canonical
# reason phrase for a status code and has no way to substitute Docusign's
# own "The URL provided does not resolve to a resource.", so this Recipe can
# reproduce the 404 and the empty body and not the status line's own text.
#
# Tokens below are fixtures, not secrets.

recipe: docusign
capability: signing
version: 0.1.0

upstream:
  api: v2.1
  docs: https://developers.docusign.com/docs/esign-rest-api/reference/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Struck live: an absent credential names a missing integrator key, not an
  # invalid token, and that is a different sentence from a well-formed one
  # that is simply wrong. See the header.
  absent_error: no_integrator_key
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer 404 before Docusign's application ever looks at
  # authentication, and only a matched route falls through to the 401.
  after_routing: true
  keys:
    - cauldron_docusign_token

responses:
  list:
    style: wrapped
    count_field: totalSetSize
    # Docusign sends its counts as strings.
    count_as_string: true
    fields:
      # Stated gap: DocuSign reports the position it served, and this is a
      # constant, so it says nought whatever was asked for -- the same shape
      # of lie that page_field and limit_field were added to fix for Algolia
      # and Bitbucket. It cannot use them yet: every numeric field in this
      # envelope travels as a string here (see count_as_string above) and
      # those two emit numbers, so switching would trade a stale value for a
      # wrong type.
      startPosition: "0"
  error:
    style: flat
    code_field: errorCode
    message_field: message

resources:
  envelope:
    collection: envelopes
    id:
      style: uuid
      field: envelopeId
    fields:
      # created, sent, delivered, signed, completed, declined, voided.
      # delivered means opened, not signed.
      status:
        type: string
        default: created
      emailSubject:
        type: string
        required: true
      documentsUri:
        type: string
      recipientsUri:
        type: string
      # A draft envelope has been created and not sent. Nobody has been
      # emailed, and sending is a separate call.
      sentDateTime:
        type: datetime
        stamped: false
      # Set only when every recipient has finished.
      completedDateTime:
        type: datetime
        stamped: false
      voidedReason:
        type: string
      createdDateTime:
        type: datetime

  recipient:
    collection: signers
    id:
      style: numeric
      field: recipientId
    fields:
      envelope_id:
        type: string
      name:
        type: string
        required: true
      email:
        type: string
        required: true
      # created, sent, delivered, signed, completed, declined, autoresponded.
      # A recipient can decline, which ends the envelope for everybody.
      status:
        type: string
        default: created
      # Routing order decides who is asked first. A recipient later in the
      # order has not been emailed yet, and their status says created rather
      # than anything about failure.
      routingOrder:
        type: string
        default: "1"
      declinedReason:
        type: string
      signedDateTime:
        type: datetime
        stamped: false

routes:
  - method: GET
    path: /restapi/v2.1/accounts/{account_id}/envelopes
    resource: envelope
    operation: list
    pagination:
      # Checked against DocuSign's own description: count for the size and
      # start_position for the position, both in the query. start_position
      # counts records rather than pages, which is what the name says and
      # what a page number would get wrong by a whole page at a time.
      style: offset
      limit: 100
      limit_param: count
      cursor_param: start_position

  - method: POST
    path: /restapi/v2.1/accounts/{account_id}/envelopes
    resource: envelope
    operation: create
    status: 201

  - method: GET
    path: /restapi/v2.1/accounts/{account_id}/envelopes/{id}
    resource: envelope
    operation: get

  - method: PUT
    path: /restapi/v2.1/accounts/{account_id}/envelopes/{id}
    resource: envelope
    operation: update

  - method: GET
    path: /restapi/v2.1/accounts/{account_id}/envelopes/{envelope_id}/recipients
    resource: recipient
    operation: list
    scope: [envelope_id]
    pagination:
      # Checked against DocuSign's own description: the recipients endpoint
      # takes neither count nor start_position -- unlike the envelope listing
      # above it -- and answers with the whole set.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

webhooks:
  # Docusign calls these Connect events.
  events:
    - envelope-sent
    - envelope-delivered
    - envelope-completed
    - envelope-declined
    - envelope-voided
    - recipient-completed
  signing:
    scheme: hmac-sha256
    header: X-DocuSign-Signature-1
    secret: cauldron-connect-key

errors:
  rate_limit:
    status: 429
    code: HOURLY_APIINVOCATION_LIMIT_EXCEEDED
    message: The maximum number of hourly API invocations has been exceeded.
    headers:
      Retry-After: "3600"
      X-RateLimit-Remaining: "0"

  # Struck live with a well-formed but invented bearer token, unmodified by
  # the probe.
  authentication_error:
    status: 401
    code: AUTHORIZATION_INVALID_TOKEN
    message: The access token provided is expired, revoked or malformed.

  # Struck live with no Authorization header at all: Docusign checks for an
  # integrator key before it ever looks at a bearer token, and names that
  # instead.
  no_integrator_key:
    status: 401
    code: PARTNER_AUTHENTICATION_FAILED
    message: "The specified Integrator Key was not found or is disabled. An Integrator key was not specified."

  # Struck live with no credential at all. Zero bytes, no Content-Type --
  # errors.unknown_route.empty reproduces that. What it cannot reproduce is
  # the non-standard reason phrase live carries in the status line itself
  # ("The URL provided does not resolve to a resource."); see the header.
  unknown_route:
    status: 404
    empty: true

  # Struck live against a real path with a method this Recipe does not
  # declare for it (DELETE on the envelopes list). The identical empty body
  # an unrouted path gets -- Docusign does not appear to distinguish the two.
  method_not_allowed:
    status: 404
    empty: true

  resource_missing:
    status: 404
    code: ENVELOPE_DOES_NOT_EXIST
    message: "The envelope could not be found: {detail}"

  parameter_missing:
    status: 400
    code: INVALID_REQUEST_PARAMETER
    message: "The request contained at least one invalid parameter: {detail} is required"

  # The failures a sandbox will not produce for you, and the ones an
  # e-signature integration has to survive.
  envelope_already_complete:
    status: 400
    code: ENVELOPE_INVALID_STATUS
    message: The envelope status is completed and cannot be modified.

  recipient_declined:
    status: 400
    code: RECIPIENT_HAS_DECLINED
    message: A recipient has declined the envelope, which ends it for everybody.

  # Docusign refuses a recipient with no email, and the message names the
  # index rather than the person.
  invalid_recipient:
    status: 400
    code: INVALID_EMAIL_ADDRESS
    message: The email address for one or more recipients is invalid.

fixtures:
  empty: {}

  small-account:
    envelope:
      - id: 11111111-1111-4111-8111-111111111111
        emailSubject: Supplier agreement
        # Opened, not signed. Code that treats this as done files an
        # unsigned document.
        status: delivered
        sentDateTime: "2026-01-12T09:00:00Z"
      - id: 22222222-2222-4222-8222-222222222222
        emailSubject: Signed last week
        status: completed
        sentDateTime: "2026-01-05T09:00:00Z"
        completedDateTime: "2026-01-06T14:20:00Z"
      - id: 33333333-3333-4333-8333-333333333333
        emailSubject: Draft, never sent
        # Created and not sent. Nobody has been emailed, and sending is a
        # separate call.
        status: created
      - id: 44444444-4444-4444-8444-444444444444
        emailSubject: Declined by the counterparty
        status: declined
        sentDateTime: "2026-01-08T11:00:00Z"
    recipient:
      - id: "1"
        envelope_id: 11111111-1111-4111-8111-111111111111
        name: Ada Lovelace
        email: ada@example.com
        # Opened it and has not signed.
        status: delivered
        routingOrder: "1"
      - id: "2"
        envelope_id: 11111111-1111-4111-8111-111111111111
        name: Grace Hopper
        email: grace@example.com
        # Second in the routing order, so not emailed yet. "created" here
        # says nothing about failure.
        status: created
        routingOrder: "2"

# Conformance cases. The resource shapes are read from Docusign's eSignature
# REST reference rather than observed against a live account -- sending an
# envelope emails a real person, so no account for one was ever created. The
# refusal cases at the end are struck live, unauthenticated, and carry a
# verified date; see the header.
conformance:
  - name: delivered means opened, not signed
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/get/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        # The sequence is sent, delivered, completed. Code that treats
        # delivered as done files an unsigned document.
        status: delivered
        sentDateTime: "2026-01-12T09:00:00Z"
      absent:
        - completedDateTime

  - name: completed is the one with a completion time
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/get/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        status: completed
        completedDateTime: "2026-01-06T14:20:00Z"

  - name: a draft envelope has emailed nobody
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/create/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        status: created
      # Sending is a separate call. Counting this as sent overstates what
      # anybody has been asked to do.
      absent:
        - sentDateTime
        - completedDateTime

  - name: the counts in a listing are strings
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/liststatuschanges/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        # "4", not 4. Code comparing totalSetSize to a number never matches,
        # and emitting a number here would quietly fix a bug the caller has
        # to handle.
        totalSetSize: "4"
        startPosition: "0"
        envelopes[0].emailSubject: Supplier agreement

  - name: the identifier is envelopeId
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/get/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        envelopeId: 22222222-2222-4222-8222-222222222222
      absent:
        - id

  - name: a recipient later in the routing order has not been asked yet
    source: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/enveloperecipients/list/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/11111111-1111-4111-8111-111111111111/recipients
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 200
      body:
        signers[0].status: delivered
        signers[0].routingOrder: "1"
        # Not emailed yet. "created" here says nothing about failure, and
        # treating it as a problem chases somebody who has not been asked.
        signers[1].status: created
        signers[1].routingOrder: "2"
      absent:
        - signers[1].signedDateTime

  - name: an unknown envelope names Docusign's own code
    source: https://developers.docusign.com/docs/esign-rest-api/reference/
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes/99999999-9999-4999-8999-999999999999
      headers:
        Authorization: Bearer cauldron_docusign_token
    expect:
      status: 404
      body:
        errorCode: ENVELOPE_DOES_NOT_EXIST
      matches:
        message: 'could not be found'
      absent:
        - error
        - errors

  - name: envelopes page by count and start_position, which counts records
    # Not "limit", which DocuSign does not accept. start_position is an
    # offset rather than a page number, so reading it as a page would be
    # wrong by a whole page at a time -- and while no style was declared it
    # was not read at all, so every request answered with the first page.
    source: https://raw.githubusercontent.com/docusign/OpenAPI-Specifications/master/esignature.rest.swagger-v2.1.json
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes
      headers:
        Authorization: Bearer cauldron_docusign_token
      query:
        count: "1"
        start_position: "1"
    expect:
      status: 200
      body:
        # The second envelope, because start_position counts records.
        envelopes[0].emailSubject: Signed last week
      absent:
        - envelopes[1]

  - name: no credential at all names a missing integrator key, not a token
    # Struck live. Docusign checks for an integrator key before it ever
    # looks at a bearer token, so an absent credential gets a different
    # sentence from a wrong one.
    source: https://demo.docusign.net/restapi/v2.1/accounts/cauldron/envelopes
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes
    expect:
      status: 401
      body:
        errorCode: PARTNER_AUTHENTICATION_FAILED
      matches:
        message: "Integrator key"

  - name: a well-formed invented token is a different failure entirely
    source: https://demo.docusign.net/restapi/v2.1/accounts/cauldron/envelopes
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /restapi/v2.1/accounts/cauldron/envelopes
      headers:
        Authorization: "Bearer eyFakeTokenInventedForThisProbe0000000000000000"
    expect:
      status: 401
      body:
        errorCode: AUTHORIZATION_INVALID_TOKEN
        message: The access token provided is expired, revoked or malformed.

  - name: a path this API does not route needs no credential either
    # Struck live with no credential at all. The router answers before
    # Docusign's application ever looks at authentication, which
    # auth.after_routing declares.
    source: https://demo.docusign.net/restapi/v2.1/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /restapi/v2.1/not-a-real-endpoint
    expect:
      status: 404
      no_body: true

  - name: a wrong method on a real path is the identical empty 404
    # DELETE on the envelopes list, a method this Recipe does not declare
    # for it. Struck live with no credential at all.
    source: https://demo.docusign.net/restapi/v2.1/accounts/cauldron/envelopes
    verified: "2026-09-05"
    fixture: empty
    request:
      method: DELETE
      path: /restapi/v2.1/accounts/cauldron/envelopes
    expect:
      status: 404
      no_body: true

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # count=1 and start_position=1, which is a count of records to skip,
  # and asserts the second record came back on its own: one to skip, one
  # to return, and a third behind it to prove the size stopped the page.
  - name: "count and start_position are the two names this listing reads"
    source: "https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/liststatuschanges/"
    fixture: small-account
    request:
      method: GET
      path: "/restapi/v2.1/accounts/cauldron/envelopes"
      query:
        "count": "1"
        "start_position": "1"
      headers:
        "Authorization": "Bearer cauldron_docusign_token"
    expect:
      status: 200
      body:
        "envelopes[0].envelopeId": "22222222-2222-4222-8222-222222222222"
      absent:
        - "envelopes[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # count=1 and start_position=1, which is a count of records to skip,
  # and asserts the second record came back on its own: one to skip, one
  # to return, and a third behind it to prove the size stopped the page.
  - name: "count and start_position are the two names this listing reads on restapi v2.1 accounts {account_id} envelopes"
    source: "https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/liststatuschanges/"
    fixture: small-account
    request:
      method: GET
      path: "/restapi/v2.1/accounts/cauldron/envelopes"
      query:
        "count": "1"
        "start_position": "1"
      headers:
        "Authorization": "Bearer cauldron_docusign_token"
    expect:
      status: 200
      body:
        "envelopes[0].envelopeId": "22222222-2222-4222-8222-222222222222"
      absent:
        - "envelopes[1]"

  # The names. This Recipe declares 4 field(s) on a envelope that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an envelope carries the field names this Recipe declares"
    source: "https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/liststatuschanges/"
    fixture: small-account
    request:
      method: GET
      path: "/restapi/v2.1/accounts/11111111-1111-4111-8111-111111111111/envelopes"
      headers:
        "Authorization": "Bearer cauldron_docusign_token"
    expect:
      status: 200
      body:
        "envelopes[0].createdDateTime": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 5 field(s) on a recipient that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a recipient carries the field names this Recipe declares"
    source: "https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/enveloperecipients/list/"
    fixture: small-account
    request:
      method: GET
      path: "/restapi/v2.1/accounts/11111111-1111-4111-8111-111111111111/envelopes/11111111-1111-4111-8111-111111111111/recipients"
      headers:
        "Authorization": "Bearer cauldron_docusign_token"
    expect:
      status: 200
      body:
        "signers[0].email": "ada@example.com"
        "signers[0].envelope_id": "11111111-1111-4111-8111-111111111111"
        "signers[0].name": "Ada Lovelace"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://developers.docusign.com/docs/esign-rest-api/reference/"
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: "/restapi/v2.1/accounts/cauldron/envelopes/11111111-1111-4111-8111-111111111111"
      headers:
        "Authorization": "Bearer cauldron_docusign_token"
    expect:
      status: 429
      body:
        "errorCode": "HOURLY_APIINVOCATION_LIMIT_EXCEEDED"
        "message": "The maximum number of hourly API invocations has been exceeded."



