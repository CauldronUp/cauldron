  live-2026-09-02:
    livescore:
      - id: "17017093"
        idEvent: "2429445"
        strSport: Soccer
        idLeague: "4686"
        strLeague: Ecuadorian Serie A
        idHomeTeam: "138159"
        idAwayTeam: "138225"
