conformance:
  - name: the free key answers the full, unpaginated catalogue
    source: https://www.thesportsdb.com/api/v1/json/123/all_leagues.php
    verified: "2026-09-02"
    fixture: leagues-catalogue
    request:
      method: GET
      path: /api/v1/json/123/all_leagues.php
    expect:
      status: 200
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        "leagues[0].idLeague": "4328"
        "leagues[0].strLeague": English Premier League
        "leagues[9].strLeague": Belgian Pro League

  - name: a verifiably finished match from 2019 carries a null status
    # strStatus is null on both records, despite scores being present and
    # the match being years in the past -- see the header for why this is
    # the sharpest version of the collection's pending-vs-terminal question.
    source: https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=2019-05-12&l=4328
    verified: "2026-09-02"
    fixture: matchday-38-2018-19
    request:
      method: GET
      path: "/api/v1/json/123/eventsday.php?d=2019-05-12&l=4328"
    expect:
      status: 200
      body:
        "events[0].strEvent": Leicester vs Chelsea
        "events[0].intHomeScore": "0"
        "events[0].intAwayScore": "0"
        "events[0].strStatus": null
        "events[0].strPostponed": "no"

  - name: the same league five days earlier carries a real status code instead
    # FT, not null -- the contrast the header draws against the 2019 case
    # above, from the same endpoint against the same league.
    source: https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=2026-08-30&l=4328
    verified: "2026-09-02"
    fixture: matchday-2-2026-27
    request:
      method: GET
      path: "/api/v1/json/123/eventsday.php?d=2026-08-30&l=4328"
    expect:
      status: 200
      body:
        "events[0].intHomeScore": "5"
        "events[0].intAwayScore": "2"
        "events[0].strStatus": FT

  - name: a date with nothing scheduled answers a null collection, not an empty array
    source: https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=2026-12-25&l=4328
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: "/api/v1/json/123/eventsday.php?d=2026-12-25&l=4328"
    expect:
      status: 200
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        events: null

  - name: a fixture nine days out has null scores and status NS, never zero
    source: https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=4328
