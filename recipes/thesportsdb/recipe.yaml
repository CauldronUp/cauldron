# TheSportsDB Recipe for Cauldron
#
# The free tier's credential is a path segment, the same trade Alchemy's
# Recipe in this collection makes for its Ethereum key: GET
# /api/v1/json/{key}/eventsday.php, the key sitting between /json/ and the
# endpoint name rather than in a header. TheSportsDB's own documentation page
# (thesportsdb.com/documentation, fetched 2026-09-02) states the current one
# in as many words -- "The current free API key is: 123" -- and every
# worked example on that same page is built on it: searchteams.php?t=Arsenal,
# searchfilename.php, all of them addressed as /api/v1/json/123/.... The
# older key "3", which used to be the one everybody's tutorial copied, still
# answers identically live -- it is simply no longer the one the docs name,
# and this Recipe follows the current documentation rather than the
# tutorials still citing the old one.
#
# **An invalid key in that path segment is not a 401. It is 400, JSON, and
# it says which page to visit next:**
#
#   GET /api/v1/json/999999999/all_leagues.php  -> 400
#     {"Message":"Invalid Premium API key: Signup here: https://www.thesportsdb.com/pricing"}
#
# verified live, and the wire's field name really does capitalise Message --
# not "message", not "error". A path with no key segment at all --
# /api/v1/json/all_leagues.php, one segment short -- is a completely
# different failure: 404, text/html, IIS's own not-found page, because the
# route pattern itself does not match rather than because a credential was
# examined and rejected. TheSportsDB draws the same line Rootly's Recipe in
# this collection draws between its two kinds of "not found": routing
# failure and credential failure are two different programs answering, and
# only one of them is JSON.
#
# **A wrong method gets a real 405 naming the methods that would have
# worked, on both API versions:**
#
#   PATCH /api/v1/json/123/all_leagues.php  -> 405, Allow: GET, HEAD, OPTIONS, TRACE
#
# verified live on v1 and, separately, on the premium-gated v2
# (api/v2/json/livescore/soccer, X-API-KEY header instead of a path segment)
# -- the identical 405 with the identical Allow list on both, which is the
# clearest evidence the two versions sit behind one and the same web-server
# tier rather than two independent applications. That Allow list is IIS's
# own default verb set for a route it recognises, not something either API
# version chose, so this Recipe asserts the status and nothing else: serving
# the literal header would be pinning a detail neither version's own code
# decided.
#
# **v2 tells an absent key from a wrong one; v1 cannot, because there the key
# is not a credential the runtime checks -- it is the route.** v2 requires
# the free key in a header (X-API-KEY) rather than the path, and the two
# failures diverge outright:
#
#   no X-API-KEY header at all      -> 400 "Missing API key in header, sign up at ..."
#   X-API-KEY: 123 (the free key)   -> 400 "Invalid Premium API key: Signup here: ..."
#   X-API-KEY: junk                 -> 400, byte-identical to the free-key case
#
# all three verified live. v2 genuinely distinguishes absent from present-
# and-wrong; v1 structurally cannot, because "absent" on v1 is not a missing
# header this Recipe could check independently of the path -- it is a
# shorter route that never matches the endpoint at all, which is why v1's
# two failures above (400 JSON vs 404 HTML) differ in every dimension rather
# than only in wording. v2 itself is not otherwise modelled: every route on
# it demanded a paid key, on every path this Recipe tried, including
# competitions this Recipe could reach on v1 with the free key alone --
# livescore is not a premium-only concept end to end, as the next finding
# shows.
#
# **v1's own livescore.php answers real, current data to the free key, which
# the documentation does not say.** The same documentation page that names
# the free key describes Premium as adding "livescores and video highlight
# links" over V1 -- worded as something V1 does not have. GET
# /api/v1/json/123/livescore.php?s=Soccer answered 200 with seventeen real,
# in-progress matches on both the "3" key and the documented "123" one, no
# gating of any kind. Either the documentation describes an intent the free
# tier has not enforced, or "livescores" there means the V2 2-minute-refresh
# feed rather than this endpoint; either way, a caller reading only the
# marketing page would not expect this to work, and it does.
#
# **This is where the collection's question is sharpest, and TheSportsDB
# answers it three different ways depending on how old the record is.**
#
#   a 2018-19 season match (finished, verifiably, seven years ago):
#     "intHomeScore": "0", "intAwayScore": "0", "strStatus": null
#
#   a 2026-27 season match already played (the same league, five days
#   before this Recipe was written):
#     "intHomeScore": "5", "intAwayScore": "2", "strStatus": "FT"
#
#   a 2026-27 fixture not yet played (nine days out at the time of writing):
#     "intHomeScore": null, "intAwayScore": null, "strStatus": "NS"
#
# all three struck live, all three from the same endpoint (eventsday.php)
# against the same league. The score fields behave exactly as a caller would
# hope -- present and numeric-as-a-string once a ball has been kicked, null
# and never "0" beforehand -- but strStatus does not: it is only populated
# for recent seasons. A finished match from 2019 carries no machine-readable
# "this is over" signal at all, on this endpoint; the only way to know it
# finished is that intHomeScore is not null and the date has passed. A
# caller written against a modern fixture and tested only against modern
# data would ship believing strStatus is always there, and be wrong the
# first time it looks up anything from the archive.
#
# **Nowhere in TheSportsDB's documentation is strStatus's vocabulary written
# down.** thesportsdb.com/documentation was fetched in full for this Recipe
# and contains no table, no enum, no list of the codes it sends -- not "NS",
# not "FT", not a single one. Everything this Recipe knows about the field
# is what was struck live: NS (not started, scores null), FT (full time,
# scores set) on eventsday.php and eventsnextleague.php, and 1H (first half)
# on livescore.php, which additionally carries strProgress ("18", "1" --
# minutes elapsed, a string despite the name) that the other two endpoints
# never send at all. Postponed and abandoned matches were searched for --
# EPL fixtures around the December 2021 postponement wave, full-season pulls
# for 2021-22 -- and none were found within what the free tier's own limits
# permit browsing (see the next finding); strPostponed exists as its own
# field, separate from strStatus, and every match this Recipe ever struck
# carried "no". Whatever value it carries when a match really is postponed,
# and whatever strStatus reads at the same moment, is not something this
# Recipe observed and is not claimed here.
#
# **The free tier does not error when a request exceeds its limit. It
# quietly truncates, with nothing on the wire saying so.**
# eventsseason.php?id=4328&s=2021-2022, asked for a full 38-round Premier
# League season, answered 200 with exactly fifteen matches -- rounds 1 and 2
# only, no page marker, no truncation notice, no count field disagreeing
# with the array length. thesportsdb.com/documentation calls this out per
# endpoint as a bare number ("Free Limit: 1", "Free Limit: 2", one line per
# route, no elaboration), and eventsseason.php's own free limit is one of
# them; what the number means in practice -- silently answering less than
# was asked for, formatted exactly like a complete answer -- is not written
# anywhere and had to be struck to find out. A caller paging by round count
# would believe the season had two rounds in it.
#
# **A caller cannot tell how fresh a live score is from eventsday.php or
# eventsnextleague.php -- neither carries any per-record timestamp beyond
# the fixture's own kickoff time. livescore.php is the one endpoint that
# can answer the question**, and it answers it under a field with no "str"
# or "int" prefix at all, breaking the naming convention every other field
# on this API follows: "updated": "2026-09-03 00:55:31" -- space-separated,
# no timezone offset, refreshed on a cadence this Recipe did not measure but
# distinct from strTimestamp (the match's own kickoff time, ISO-shaped but
# also missing a timezone) on the same record. Two timestamp-shaped strings
# on one object, in two different formats, meaning two different things.
#
# **Field names lie about their own JSON type, systematically.** Every
# "int"-prefixed field this Recipe struck -- intHomeScore, intAwayScore,
# intRound, intSpectators, intFormedYear -- travels as a JSON string when it
# travels at all, quoted digits rather than a number. A client that trusts
# the prefix and writes a schema with "type": "integer" for any of them
# rejects every real response TheSportsDB sends. This is not a fixture
# artefact of this Recipe's own choosing; it is what json_encode actually
# emitted on every call struck for it, verified in the raw response bytes
# rather than assumed from the field name.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No postponed or abandoned example was ever found -- see above. Neither
#     value is modelled, and this Recipe does not guess what either looks
#     like on strStatus or claim strPostponed flips to "yes" the way its
#     name implies; only "no" was ever observed.
#   - Of over fifty documented fields on an event, this Recipe declares
#     about a dozen. Venue, weather, spectator counts, betting odds, social
#     and media links (strPoster, strFanart, strBanner, strTweet1, strMap,
#     strVideo and more) are entirely absent, as is everything about
#     extra-time and penalty-shootout scoring (intHomeScoreExtra and its
#     sibling exist on the wire, always null in what this Recipe struck, and
#     are not declared).
#   - V2 is not modelled at all beyond the header/query mechanics above: no
#     key this Recipe holds ever unlocked a single V2 route, and inventing a
#     200 for it would be asserting the premium product works a particular
#     way nobody here has seen it work.
#   - lookupteam.php, lookupevent.php, searchplayers.php, and every other
#     lookup/search endpoint are not modelled; this Recipe scopes to the
#     match/score/status question its group of three exists to answer.
#   - The wrong-key 400 (invalid_key) is declared once, against
#     all_leagues.php, and verified only there; the header's evidence that
#     it is a shared gateway check (identical wording, identical status,
#     across v1 and the differently-shaped v2 failure) is why this Recipe
#     treats it as general rather than re-verifying it per endpoint.
#   - No rate-limit header of any kind was ever seen on any response this
#     Recipe struck, 200 or 400 or 404. thesportsdb.com/documentation states
#     "Free users 30 requests per minute" in prose; no 429 was triggered and
#     none is modelled.
#
# Every case below carries source. A verified date means this Recipe called
# www.thesportsdb.com with exactly the request shown, on 2026-09-02, and
# recorded exactly what came back. Every key below is the documented free
# key, a public constant rather than a secret.

recipe: thesportsdb
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  provider: thesportsdb
  docs: https://www.thesportsdb.com/documentation

auth:
  # The credential is the path itself -- see the header. Every case below is
  # a literal route rather than a declared scheme, the same trade Alchemy's
  # Recipe in this collection makes for its path-carried Ethereum key.
  scheme: none

responses:
  list:
    style: wrapped
    # No count field, no page field, no cursor -- nothing here paginates.
    # eventsseason.php's own silent truncation (see header) is the closest
    # thing this API has to a page boundary, and it carries no field
    # announcing it either.
  resource:
    style: bare
  error:
    # {"Message":"..."} -- capitalised on the wire, verified live, not a
    # transcription choice.
    style: flat
    message_field: Message
    code_field: "-"
    type_field: "-"

resources:
  league:
    collection: leagues
    id:
      style: digits
      field: idLeague
    fields:
      strLeague:
        type: string
      strSport:
        type: string

  event:
    collection: events
    id:
      style: digits
      field: idEvent
    fields:
      strEvent:
        type: string
      strSport:
        type: string
      strSeason:
        type: string
      strLeague:
        type: string
      idLeague:
        type: string
      strHomeTeam:
        type: string
      strAwayTeam:
        type: string
      idHomeTeam:
        type: string
      idAwayTeam:
        type: string
      # Present and numeric-as-a-string once a ball has been kicked, null
      # and never "0" beforehand -- see the header. Never absent: every
      # event this Recipe struck carried both keys, populated or null.
      intHomeScore:
        type: string
        null_when_unset: true
      intAwayScore:
        type: string
        null_when_unset: true
      # A JSON string despite the name, like every other int-prefixed field
      # here -- see the header.
      intRound:
        type: string
      dateEvent:
        type: string
      strTime:
        type: string
      strTimestamp:
        type: string
      # Undocumented anywhere -- see the header. Populated for recent
      # seasons (NS, FT observed), null for a verifiably finished match from
      # 2018-19. Postponed and abandoned are not among the values this
      # Recipe ever struck.
      strStatus:
        type: string
        null_when_unset: true
      # A string, "yes" or "no" -- not a JSON boolean, despite reading like
      # one. Every event this Recipe struck answered "no".
      strPostponed:
        type: string
      strLocked:
        type: string

  livescore:
    collection: livescore
    id:
      style: digits
      field: idLiveScore
    fields:
      idEvent:
        type: string
      strSport:
        type: string
      idLeague:
        type: string
      strLeague:
        type: string
      idHomeTeam:
        type: string
      idAwayTeam:
        type: string
      strHomeTeam:
        type: string
      strAwayTeam:
        type: string
      intHomeScore:
        type: string
      intAwayScore:
        type: string
      # 1H, and per the header the only endpoint this Recipe struck that
      # ever sent it: not NS, not FT, a third vocabulary member neither of
      # the other two routes here produced.
      strStatus:
        type: string
      # Minutes elapsed, a string despite the name -- eventsday.php and
      # eventsnextleague.php never send this field at all.
      strProgress:
        type: string
      strTimestamp:
        type: string
      strEventTime:
        type: string
      dateEvent:
        type: string
      # The one per-record freshness signal this API sends anywhere -- see
      # the header. Space-separated, no timezone, and a different shape
      # from strTimestamp on the very same record.
      updated:
        type: string

routes:
  - method: GET
    path: /api/v1/json/123/all_leagues.php
    resource: league
    operation: list
    pagination:
      # Struck live on 2026-09-05: the league list comes back whole and
      # ?limit=2 answers the same ten. No size, no position.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Matchday 38 of the 2018-19 Premier League season -- genuinely finished,
  # seven years old at the time this Recipe was written, and strStatus is
  # null on both records regardless -- see the header.
  - method: GET
    path: /api/v1/json/123/eventsday.php
    matches_query:
      d: "2019-05-12"
      l: "4328"
    resource: event
    operation: list
    pagination:
      # Struck live on 2026-09-05: the league list comes back whole and
      # ?limit=2 answers the same ten. No size, no position.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    headers:
      Content-Type: "application/json; charset=utf-8"

  # The same league, five days before this Recipe was written: strStatus is
  # "FT" here, the contrast the header draws against the 2018-19 case above.
  - method: GET
    path: /api/v1/json/123/eventsday.php
    matches_query:
      d: "2026-08-30"
      l: "4328"
    resource: event
    operation: list
    pagination:
      # Struck live on 2026-09-05: the league list comes back whole and
      # ?limit=2 answers the same ten. No size, no position.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    headers:
      Content-Type: "application/json; charset=utf-8"

  # A date with no fixtures scheduled at all -- see the header and the
  # null_events error below for what this endpoint sends instead of an
  # empty array.
  - method: GET
    path: /api/v1/json/123/eventsday.php
    matches_query:
      d: "2026-12-25"
      l: "4328"
    status: 200
    raw:
      content_type: "application/json; charset=utf-8"
      text: '{"events":null}'

  # Not yet played, nine days out at the time this Recipe was written:
  # scores null, strStatus "NS".
  - method: GET
    path: /api/v1/json/123/eventsnextleague.php
    matches_query:
      id: "4328"
    resource: event
    operation: list
    pagination:
      # Struck live on 2026-09-05: the league list comes back whole and
      # ?limit=2 answers the same ten. No size, no position.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Live, in progress, struck at the moment this Recipe was written -- see
  # the header for "updated" and strProgress, neither of which the two
  # routes above ever send.
  - method: GET
    path: /api/v1/json/123/livescore.php
    matches_query:
      s: "Soccer"
    resource: livescore
    operation: list
    pagination:
      # Struck live on 2026-09-05: the league list comes back whole and
      # ?limit=2 answers the same ten. No size, no position.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Any other key in this path position -- see the header. Literal routes
  # above win over this template for the one value this Recipe holds, the
  # same precedence Alchemy's Recipe relies on for its own path-carried key.
  - method: GET
    path: /api/v1/json/{key}/all_leagues.php
    error: invalid_key

errors:
  invalid_key:
    status: 400
    message: "Invalid Premium API key: Signup here: https://www.thesportsdb.com/pricing"
    headers:
      Content-Type: "application/json; charset=utf-8"

fixtures:
  empty: {}

  leagues-catalogue:
    # All ten leagues all_leagues.php answered live -- the entire response,
    # not a sample of a longer one. There is no eleventh page. The internal
    # key is "id" -- id.field: idLeague is what renames it to idLeague on
    # the wire, the same convention Twilio's Recipe in this collection uses
    # for its own renamed identifier (sid).
    league:
      - id: "4328"
        strLeague: English Premier League
        strSport: Soccer
      - id: "4329"
        strLeague: English League Championship
        strSport: Soccer
      - id: "4330"
        strLeague: Scottish Premier League
        strSport: Soccer
      - id: "4331"
        strLeague: German Bundesliga
        strSport: Soccer
      - id: "4332"
        strLeague: Italian Serie A
        strSport: Soccer
      - id: "4334"
        strLeague: French Ligue 1
        strSport: Soccer
      - id: "4335"
        strLeague: Spanish La Liga
        strSport: Soccer
      - id: "4336"
        strLeague: Greek Super League 1
        strSport: Soccer
      - id: "4337"
        strLeague: Dutch Eredivisie
        strSport: Soccer
      - id: "4338"
        strLeague: Belgian Pro League
        strSport: Soccer

  matchday-38-2018-19:
    event:
      - id: "576840"
        strEvent: Leicester vs Chelsea
        strSport: Soccer
        strSeason: "2018-2019"
        strLeague: English Premier League
        idLeague: "4328"
        strHomeTeam: Leicester
        strAwayTeam: Chelsea
        idHomeTeam: "133626"
        idAwayTeam: "133610"
        intHomeScore: "0"
        intAwayScore: "0"
        intRound: "38"
        dateEvent: "2019-05-12"
        strTime: "14:00:00+00:00"
        strTimestamp: "2019-05-12T15:00:00"
        strStatus: null
        strPostponed: "no"
        strLocked: unlocked
      - id: "576841"
        strEvent: Liverpool vs Wolves
        strSport: Soccer
        strSeason: "2018-2019"
        strLeague: English Premier League
        idLeague: "4328"
        strHomeTeam: Liverpool
        strAwayTeam: Wolves
        idHomeTeam: "133602"
        idAwayTeam: "133599"
        intHomeScore: "2"
        intAwayScore: "0"
        intRound: "38"
        dateEvent: "2019-05-12"
        strTime: "14:00:00+00:00"
        strTimestamp: "2019-05-12T15:00:00"
        strStatus: null
        strPostponed: "no"
        strLocked: unlocked

  matchday-2-2026-27:
    event:
      - id: "2494010"
        strEvent: Manchester United vs Ipswich Town
        strSport: Soccer
        strSeason: "2026-2027"
        strLeague: English Premier League
        idLeague: "4328"
