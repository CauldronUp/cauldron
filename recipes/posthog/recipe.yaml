# PostHog Recipe for Cauldron
#
# PostHog is open source and you can run it, which sounds like it removes the
# need for an emulator and does not. Running it means a Postgres, a ClickHouse,
# a Kafka and a Redis, which is a lot of machinery to stand up so that a test
# can ask whether a flag is on.
#
# The reason to emulate it is that two of its answers are routinely misread,
# and both misreadings produce code that works in every test and behaves
# differently for real users.
#
# Five things worth modelling exactly:
#
#   1. A flag definition is not what a user gets. The API serves the rules:
#      active, a rollout percentage, and a set of conditions. What any
#      particular person receives is the result of evaluating those against
#      their properties, which the SDK does locally. Reading active and
#      treating it as on is wrong for everybody outside the rollout.
#   2. Capture answers the same way whatever you send. The response is a
#      status of 1 and nothing else: no identifier, no confirmation, no
#      validation. An event with a malformed property is accepted here and
#      dropped later, silently, somewhere you are not looking.
#   3. A cohort is computed on a schedule. is_calculating is true while it
#      runs and the count is the previous one, so adding a property to a
#      person does not put them in a cohort now and nothing says when it
#      will.
#   4. A rollout percentage of zero is not the same as inactive. The flag is
#      live, its conditions are evaluated, and anybody matching an override
#      still gets it. Turning a flag off and setting it to nought percent
#      are different acts with different blast radii.
#   5. Two distinct ids can become one person. After a merge the surviving
#      person carries both, so a lookup by the older id still works and a
#      count of people goes down without anybody being deleted.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No flag is evaluated. This Recipe serves definitions, and the whole
#     point of the first item above is that evaluation happens elsewhere. A
#     suite that wants to test its own evaluation still has to do that
#     itself.
#   - No event is ingested, aggregated or queried. Capture accepts and says
#     so, and there is no query endpoint here at all: HogQL is a language,
#     and Cauldron does not execute languages.
#   - Cohort recalculation does not happen. Which state a cohort holds is
#     what a fixture puts there.
#   - Session replay, surveys, experiments and the data warehouse are not
#     modelled.
#
# Checked live against us.posthog.com, unauthenticated, 2026-09-05: absent
# and rejected credentials are two different DRF error bodies, not one
# message twice. No Authorization header at all answers 401
# {"type":"authentication_error","code":"not_authenticated","detail":
# "Authentication credentials were not provided."}; a syntactically fine but
# fictitious bearer answers a different code and sentence, "code":
# "authentication_failed", "detail":"Personal API key found in request
# Authorization header is invalid." This file had one message,
# "Incorrect authentication credentials.", under authentication_failed for
# both. A DELETE on a real path still answers the Absent shape above without
# a credential, matching this Recipe's own default ordering exactly, but a
# path this Recipe does not route at all is a third thing again: 404
# {"type":"invalid_request","code":"not_found","detail":"Endpoint not
# found."}, with no credential examined first. Cauldron's single
# credential-before-routing default is right for two of these three and
# cannot also be right for the unrouted-path case without breaking the
# other two, so that one is stated rather than encoded.
#
# Tokens below are fixtures, not secrets, and every person here is invented.

recipe: posthog
capability: analytics
version: 0.1.0

upstream:
  api: v1
  docs: https://posthog.com/docs/api
  # Found by cauldron discover rather than recorded by hand: this
  # document declares six of the seven routes this Recipe models,
  # which is evidence it belongs to this provider rather than proof.
  # It is what the paging parameters below were read from.
  spec: https://posthog.com/openapi.json
  spec_hash: 0cc243b4b460059126538dad70bfbba7eb1c44fd1204c1a3e82f1047abb8351c
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - phx_cauldron00000000000000000000000000
  # Verified live, 2026-09-05: a missing header is a different DRF error
  # from a fictitious key. See the file header.
  absent_error: not_authenticated

responses:
  list:
    style: wrapped
    # No key here on purpose: every resource this Recipe lists names its
    # own collection, so a key would describe a response nothing can ask
    # for. It carried one until the rule stopped counting resources that
    # are never listed.
    count_field: count
    cursor_field: next
    # A whole URL, not a token. Concatenating this onto a base URL --
    # which is what a client written against a token does -- builds an
    # address that does not exist.
    cursor_url: absolute
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: code
    type_field: type

resources:
  feature_flag:
    collection: results
    id:
      style: numeric
      type: number
    fields:
      # In the path on every route that reaches this, and PostHog does not
      # repeat it on the object. It stays a field because the scope filters
      # on it, and comes off the wire.
      project_id:
        type: string
        in: "-"
      # What the SDK asks for. The key is the contract and the numeric id is
      # PostHog's, so code that stores the id breaks when a flag is recreated.
      key:
        type: string
        required: true
      name:
        type: string
      # Whether the flag is live at all. Not whether any given person gets
      # it: that is the rollout and the conditions below.
      active:
        type: boolean
        default: true
      # The rules. A percentage of nought still evaluates, so a flag can be
      # active, roll out to nobody, and still be on for anybody matching an
      # override.
      rollout_percentage:
        type: integer
        in: filters
        as: rollout_percentage
      groups:
        type: list
        in: filters
      # Set when somebody archived it. An archived flag is still returned by
      # the listing, so a count of live flags that ignores this is wrong.
      deleted:
        type: boolean
        default: false
      created_at:
        type: string

  person:
    collection: results
    id:
      style: numeric
      type: number
    fields:
      # In the path on every route that reaches this, and PostHog does not
      # repeat it on the object. It stays a field because the scope filters
      # on it, and comes off the wire.
      project_id:
        type: string
        in: "-"
      # Several, because two identities can be merged into one person and
      # both keep working as lookups afterwards.
      distinct_ids:
        type: list
      properties:
      created_at:
        type: string

  cohort:
    collection: results
    id:
      style: numeric
      type: number
    fields:
      # In the path on every route that reaches this, and PostHog does not
      # repeat it on the object. It stays a field because the scope filters
      # on it, and comes off the wire.
      project_id:
        type: string
        in: "-"
      name:
        type: string
        required: true
      # True while the cohort is being recomputed, during which the count
      # below is the previous one.
      is_calculating:
        type: boolean
        default: false
      # As of the last calculation, which may be hours ago.
      count:
        type: integer
        default: 0
      last_calculation:
        type: string
      created_at:
        type: string

  capture:
    id:
      # No identifier on the wire, which is the whole character of this
      # endpoint: it accepts anything and confirms nothing.
      style: opaque
      field: "-"
    fields:
      # The entire response. No identifier, no confirmation, no validation.
      status:
        type: integer
        default: 1

routes:
  - method: GET
    path: /api/projects/{project_id}/feature_flags
    resource: feature_flag
    operation: list
    pagination:
      # PostHog's own description declares limit and offset on every listing
      # here -- Django REST Framework's offset paging, which is also why the
      # next pointer beside it is a whole URL rather than a token.
      #
      # Neither carries a default in the description, because PostHog's is
      # set per deployment rather than published. The hundred below is this
      # fake's page size and not a figure quoted from anywhere.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
    scope: [project_id]

  - method: GET
    path: /api/projects/{project_id}/feature_flags/{id}
    resource: feature_flag
    operation: get
    scope: [project_id]

  - method: GET
    path: /api/projects/{project_id}/persons
    resource: person
    operation: list
    pagination:
      # PostHog's own description declares limit and offset on every listing
      # here -- Django REST Framework's offset paging, which is also why the
      # next pointer beside it is a whole URL rather than a token.
      #
      # Neither carries a default in the description, because PostHog's is
      # set per deployment rather than published. The hundred below is this
      # fake's page size and not a figure quoted from anywhere.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
    scope: [project_id]

  - method: GET
    path: /api/projects/{project_id}/persons/{id}
    resource: person
    operation: get
    scope: [project_id]

  - method: GET
    path: /api/projects/{project_id}/cohorts
    resource: cohort
    operation: list
    pagination:
      # PostHog's own description declares limit and offset on every listing
      # here -- Django REST Framework's offset paging, which is also why the
      # next pointer beside it is a whole URL rather than a token.
      #
      # Neither carries a default in the description, because PostHog's is
      # set per deployment rather than published. The hundred below is this
      # fake's page size and not a figure quoted from anywhere.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
    scope: [project_id]

  - method: GET
    path: /api/projects/{project_id}/cohorts/{id}
    resource: cohort
    operation: get
    scope: [project_id]

  # The one that says nothing. Whatever you send, the answer is the same.
  #
  # It is also on a different origin from everything above it. Capture is
  # ingestion; the rest of this Recipe is the management API, and PostHog's
  # published description covers only the latter -- fourteen hundred paths and
  # no mention of this one -- so check reports it as a path the description
  # does not declare, every time.
  #
  # The format gives a Recipe one upstream, so both are served from one place
  # here. What that hides is narrow and real: an application configures an
  # ingestion host and, separately, an API host, and code written against a
  # fake serving both from one origin runs green with only one of them set.
  # docs/backlog.md carries the wider version of this, since Customer.io has
  # the same shape.
  - method: POST
    path: /capture/
    resource: capture
    operation: create
    status: 200
    returns: [status]

webhooks:
  events: []
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: throttled
    type: throttled_error
    message: "Request was throttled. Expected available in 60 seconds."

  # Verified live, 2026-09-05: a syntactically fine but fictitious personal
  # API key.
  authentication_error:
    status: 401
    code: authentication_failed
    type: authentication_error
    message: "Personal API key found in request Authorization header is invalid."

  # Verified live, 2026-09-05: no Authorization header at all.
  not_authenticated:
    status: 401
    code: not_authenticated
    type: authentication_error
    message: "Authentication credentials were not provided."

  resource_missing:
    status: 404
    code: not_found
    type: invalid_request
    message: "Not found."

  parameter_missing:
    status: 400
    code: invalid_input
    type: validation_error
    message: "This field is required."

  # A personal key scoped to read cannot write, and the failure names the
  # scope, which is the one useful thing about it.
  insufficient_scope:
    status: 403
    code: permission_denied
    type: authentication_error
    message: "This action requires the feature_flag:write scope."

  # A flag key must be unique within a project, so recreating a deleted flag
  # with the same key fails until the old one is purged.
  duplicate_key:
    status: 400
    code: unique
    type: validation_error
    message: "There is already a feature flag with this key."

fixtures:
  empty: {}

  small-project:
    feature_flag:
      # Live, and rolled out to a fifth of people. Reading active and
      # treating it as on is right for twenty per cent and wrong for eighty.
      - id: "101"
        project_id: "1"
        key: new-checkout
        name: New checkout flow
        active: true
        rollout_percentage: 20
        deleted: false
        created_at: "2026-07-02T10:00:00.123456Z"
        groups:
          - properties:
              - key: email
                value: "@cauldron.test"
                operator: icontains
            rollout_percentage: 20
      # Live and rolled out to nobody, which is not the same as off. Anybody
      # matching the override still gets it.
      - id: "102"
        project_id: "1"
        key: beta-dashboard
        name: Beta dashboard
        active: true
        rollout_percentage: 0
        deleted: false
        created_at: "2026-07-14T09:30:00.123456Z"
        groups:
          - properties:
              - key: email
                value: ada@cauldron.test
                operator: exact
            rollout_percentage: 100
      # Off. A different act with a different blast radius, and the rollout
      # is untouched underneath.
      - id: "103"
        project_id: "1"
        key: old-experiment
        name: Old experiment
        active: false
        rollout_percentage: 100
        deleted: false
        created_at: "2026-03-01T08:00:00.123456Z"
      # Archived, and still in the listing.
      - id: "104"
        project_id: "1"
        key: retired-banner
        name: Retired banner
        active: false
        rollout_percentage: 0
        deleted: true
        created_at: "2026-01-05T08:00:00.123456Z"

    person:
      # Two distinct ids on one person, because an anonymous session was
      # merged into a signed-in identity. Both still work as lookups.
      - id: "9001"
        project_id: "1"
        distinct_ids:
          - "01919e2f-anon-7f3a-9c2d-000000000001"
          - ada@cauldron.test
        created_at: "2026-06-01T09:00:00.123456Z"
        properties:
          email: ada@cauldron.test
          plan: pro
      # A person in a different project, so a listing that ignored the
      # project in its path would return this one too.
      - id: "9002"
        project_id: "2"
        distinct_ids:
          - grace@elsewhere.test
        created_at: "2026-06-02T09:00:00.123456Z"
        properties:
          email: grace@elsewhere.test

    cohort:
      # Being recomputed right now. The count is the previous one, and
      # nothing says when the new one arrives.
      - id: "501"
        project_id: "1"
        name: Pro users
        is_calculating: true
        count: 412
        last_calculation: "2026-08-17T22:00:00.123456Z"
        created_at: "2026-05-01T10:00:00.123456Z"
      - id: "502"
        project_id: "1"
        name: Trialists
        is_calculating: false
        count: 88
        last_calculation: "2026-08-18T02:00:00.123456Z"
        created_at: "2026-05-01T10:05:00.123456Z"

# Conformance cases. The two auth failures below were checked live against
# us.posthog.com, unauthenticated, on 2026-09-05 -- see the file header.
# Everything else, which needs a project to reach, is read from the PostHog
# API documentation rather than observed.
conformance:
  - name: no Authorization header at all is not_authenticated
    source: https://us.posthog.com/api/projects/1/feature_flags
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/projects/1/feature_flags
    expect:
      status: 401
      body:
        type: authentication_error
        code: not_authenticated
        detail: "Authentication credentials were not provided."

  - name: and a fictitious personal key is authentication_failed instead
    source: https://us.posthog.com/api/projects/1/feature_flags
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/projects/1/feature_flags
      headers:
        Authorization: Bearer phx_fakecauldronprobeonly00000000000000
    expect:
      status: 401
      body:
        type: authentication_error
        code: authentication_failed
        detail: "Personal API key found in request Authorization header is invalid."

  - name: a flag definition is not what a user gets
    source: https://posthog.com/docs/api/feature-flags
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags/101
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Active and rolled out to a fifth. Reading active and treating it as
        # on is right for twenty per cent of people and wrong for eighty, and
        # the object carries no per-person answer at all.
        active: true
        filters.rollout_percentage: 20
      absent:
        - enabled
        # The project is in the path and PostHog does not repeat it on the
        # flag, so code that reads a flag and stores flag.project_id to
        # scope a later call stores undefined.
        - project_id
        - value

  - name: nought per cent is not the same as inactive
    source: https://posthog.com/docs/feature-flags/creating-feature-flags
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags/102
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Live, rolled out to nobody, and anybody matching the override still
        # gets it. Turning a flag off and setting it to nought are different
        # acts with different blast radii.
        active: true
        filters.rollout_percentage: 0
        filters.groups[0].rollout_percentage: 100

  - name: and an inactive flag keeps its rollout underneath
    source: https://posthog.com/docs/api/feature-flags
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags/103
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Off, and still declaring a hundred per cent. Turning it back on
        # restores the old blast radius rather than starting from nothing.
        active: false
        filters.rollout_percentage: 100

  - name: an archived flag is still in the listing
    source: https://posthog.com/docs/api/feature-flags
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Four flags, one of them deleted, and nothing separates them but a
        # boolean. A count of live flags that ignores it is wrong by one.
        count: 4
        results[3].deleted: true
        results[0].deleted: false

  - name: a page before the last carries a next link and a full count
    source: https://posthog.com/docs/api
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags
      query:
        limit: "2"
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Two returned and four matched. The count is of everything, so a
        # progress bar sized from the array length is wrong by half here.
        count: 4
      matches:
        # A URL, not an opaque token: code that calls fetch on this
        # needs it to be one, and a dot matched a token just as happily.
        next: '^https?://'

  - name: capture says the same thing whatever you send
    source: https://posthog.com/docs/api/capture
    fixture: small-project
    request:
      method: POST
      path: /capture/
      json:
        event: something-with-a-typo
        properties:
          distinct_id: ada@cauldron.test
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # A status of one and nothing else. No identifier, no confirmation,
        # no validation: a malformed event is accepted here and dropped
        # later, silently, somewhere you are not looking.
        status: 1
      absent:
        - id
        - uuid
        - event
        - errors

  - name: a cohort being recomputed shows the previous count
    source: https://posthog.com/docs/api/cohorts
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/cohorts/501
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # Four hundred and twelve as of four hours ago, while the new number
        # is being worked out. Adding a property to a person does not put
        # them in a cohort now, and nothing says when it will.
        is_calculating: true
        count: 412
        last_calculation: "2026-08-17T22:00:00.123456Z"

  - name: and a settled one is the same shape
    source: https://posthog.com/docs/api/cohorts
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/cohorts/502
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # One boolean apart, so the count means two different things
        # depending on a field beside it.
        is_calculating: false
        count: 88

  - name: one person carries several distinct ids
    source: https://posthog.com/docs/api/persons
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/persons/9001
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # An anonymous session merged into a signed-in identity. Both still
        # work as lookups, and a count of people went down without anybody
        # being deleted.
        distinct_ids[0]: "01919e2f-anon-7f3a-9c2d-000000000001"
        distinct_ids[1]: ada@cauldron.test
        properties.email: ada@cauldron.test

  - name: a listing is scoped to the project in its path
    source: https://posthog.com/docs/api/persons
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/persons
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        # One person, and the other belongs to project 2. A listing that
        # ignored the path would leak somebody from another project into
        # this one's count.
        count: 1
        results[0].id: 9001
      absent:
        - results[1]

  - name: a failure carries a code and a type that are not the same thing
    source: https://posthog.com/docs/api
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags/999
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      status: 404
      body:
        # Three fields saying three different things, and the one a client
        # should branch on is code rather than type or detail.
        code: not_found
        type: invalid_request
      matches:
        detail: 'Not found'

  - name: a scope failure names the scope it wanted
    source: https://posthog.com/docs/api#personal-api-keys
    arm: insufficient_scope
    fixture: small-project
    request:
      method: GET
      path: /api/projects/1/feature_flags
      headers:
        Authorization: Bearer phx_cauldron00000000000000000000000000
    expect:
      # Which is the one genuinely useful thing about it: the fix is in the
      # key rather than in the code.
      status: 403
      body:
        code: permission_denied
      matches:
        detail: 'feature_flag:write scope'

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the cohort listing answers with what the fixture holds"
    source: "https://posthog.com/docs/api/feature-flags"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/cohorts"
      headers:
        "Authorization": "Bearer phx_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].id": 501
        "results[1].id": 502
      absent:
        - "results[2]"

  # The page size. Asking for one and receiving the first without the
  # second can only happen if limit was read -- with the name ignored
  # the whole collection comes back, and this fixture holds 4 records.
  # No record had to be invented for that.
  - name: "limit is read, because a page of one is not the whole collection"
    source: "https://posthog.com/docs/api/feature-flags"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/feature_flags"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer phx_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].id": 101
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://posthog.com/docs/api/feature-flags"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/feature_flags"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer phx_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].id": 102
      absent:
        - "results[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read, and a page of one is not the whole collection"
    source: "https://posthog.com/docs/api/feature-flags"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/cohorts"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer phx_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].name": "Pro users"
      absent:
        - "results[1]"

  # And the position. offset=1 answers a different record, which the
  # size alone cannot produce.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://posthog.com/docs/api/feature-flags"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/cohorts"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer phx_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].name": "Trialists"
      absent:
        - "results[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but offset can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "offset moves the page on for api projects persons"
    source: "https://posthog.com/docs/api/persons"
    fixture: small-project
    request:
      method: GET
      path: "/api/projects/1/persons"
