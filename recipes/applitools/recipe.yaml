# Applitools Eyes Recipe for Cauldron
#
# The batch results read, read from the Eyes server API reference at
# applitools.com/docs, and struck live on 2026-09-13 with no key, with a wrong
# key in the header, with a wrong key in the query parameter, on paths that do
# not exist, and with methods those paths do not take.
#
# **The problem document's `type` is the status code's own specification.**
# Every 401 is
#
#   {"type":"https://tools.ietf.org/html/rfc9110#section-15.5.2",
#    "title":"Unauthorized","status":401,
#    "traceId":"00-13cbcc15090cfe6121fa1fa0bbfad0eb-5ace6f4db87f3461-00"}
#
# RFC 9110 section 15.5.2 is the definition of 401 Unauthorized. RFC 9457 asks
# the type URI to identify the *problem*; this one identifies the status, which
# is already in `status`, and in `title`, and in the status line. Four copies of
# one fact, and nothing about what went wrong.
#
# **And the URI is dead.** `tools.ietf.org` was retired: the link 301s to
# `https://datatracker.ietf.org/doc/html/rfc9110`, and the redirect drops the
# `#section-15.5.2` fragment, so a reader who follows it lands at the top of a
# three-hundred-page RFC.
#
# **The support identifier points at a trace that was not recorded.** `traceId`
# is a W3C `traceparent`: version, trace id, span id, flags. The flags are `00`
# on every response struck -- the sampled bit clear, meaning the trace was not
# recorded. The identifier handed to the caller is for a trace nobody kept.
#
# **The problem document appears only where it is least needed.** Struck live:
#
#   GET  /api/sessions/batches/{id}   (no key)   401  application/problem+json, 165 bytes
#   GET  /api/cauldron-nope                      404  no body, no Content-Type
#   PUT  /api/sessions/batches                   405  no body, no Content-Type
#   GET  /api/sessions                           405  no body, no Content-Type
#
# The one failure whose cause the caller already knows is described in a
# standard format; the two that would tell them which path or verb was wrong say
# nothing at all.
#
# **The refusal is identical whatever the credential is**, which makes the
# API's own auth surface unobservable. No header, a wrong header, and a wrong
# `?apiKey=` all answer the same body with a fresh trace id, so nothing from
# outside says whether the query parameter the SDKs send is read at all.
#
# **A second host answers nothing.** `eyesapi.applitools.com` answers `404` with
# `Content-Length: 0` to every path tried, credential or not.
#
# In the documented response: the batch's own identifier is at
# `statistics.id`, inside the object of counts, beside `statistics.pointerId`;
# one of the counts is called `new`, a reserved word in several of the languages
# the SDKs are written in; `runBy` and `assignedTo` are user email addresses on
# a test result; `env.app` is documented "Browser/application" under a key named
# for neither; and `steps` is present only when the request carried
# `steps=true`, so the shape of the record depends on a query parameter.

recipe: applitools
capability: ci
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://applitools.com/docs/eyes/reference/server-api/batches/list-batch-results

auth:
  scheme: header
  header: X-Eyes-Api-Key
  keys:
    - cauldr0nAppl1t00lsF1xtureKey000000000000
  # One sentence for all three, so the surface cannot be probed from outside.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized
  # The path and the method are resolved first: both answer with no key sent.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    # RFC 9457's members. There is no detail and no message.
    type_field: title
    status_field: status
    code_field: "-"
    message_field: "-"

resources:
  batch:
    id:
      # No id on the record. The batch's own identifier is one level down,
      # inside the object of counts, as statistics.id.
      field: "-"
      style: uuid
      carried_by: statistics
    fields:
      batchUrl:
        type: string
      # The counts, one of which is called new.
      statistics:
        type: map
      tests:
        type: list

routes:
  - method: GET
    path: /api/sessions/batches/{batchId}
    resource: batch
    operation: list
    list:
      style: bare
      collapse_single: true
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    type: Unauthorized
    headers:
      Content-Type: application/problem+json; charset=utf-8
    fields:
      # The definition of the status code, as the type of the problem. Retired
      # host, and the 301 drops the fragment.
      type: https://tools.ietf.org/html/rfc9110#section-15.5.2
      # A W3C traceparent ending -00: sampled bit clear, trace not recorded.
      # Live this is fresh on every request.
      traceId: 00-13cbcc15090cfe6121fa1fa0bbfad0eb-5ace6f4db87f3461-00

  # Nothing at all, where a problem document would have said which path.
  unknown_route:
    status: 404
    empty: true

  # And nothing where one would have said which verb.
  method_not_allowed:
    status: 405
    empty: true

fixtures:
  empty: {}

  batches:
    batch:
      - statistics:
          id: 1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
          pointerId: 6b2e9d41-77af-4c0a-8f3d-51ba2e9c4d08
          passed: 18
          failed: 2
          unresolved: 1
          # A reserved word in several of the languages the SDKs are in.
          new: 3
          aborted: 0
          empty: 0
          total: 24
        batchUrl: https://eyes.applitools.com/app/test-results/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
        tests:
          - testId: 9f4c8a10-2b6e-4d75-83c1-0e7a5b29f4dd
            testName: Checkout page renders
            sessionUrl: https://eyes.applitools.com/app/test-results/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3/9f4c8a10-2b6e-4d75-83c1-0e7a5b29f4dd
            branchName: main
            # Email addresses, on a test result.
            runBy: ci@example.com
            assignedTo: dana@example.com
            startTime: "2026-09-11T09:14:02Z"
            env:
              device: desktop
              os: Linux
              # "Browser/application", under a key named for neither.
              app: Chrome 141.0
              viewport:
                width: 1440
                height: 900
            status: Passed
            properties: []
            accessibilityStatus:
              level: AA
              version: WCAG_2_1
              status: Passed
          - testId: 3c81b5e7-6d29-4a03-95f8-7e2b0c6a1f44
            testName: Cart badge count
            sessionUrl: https://eyes.applitools.com/app/test-results/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3/3c81b5e7-6d29-4a03-95f8-7e2b0c6a1f44
            branchName: main
            runBy: ci@example.com
            assignedTo: null
            startTime: "2026-09-11T09:14:41Z"
            env:
              device: desktop
              os: Linux
              app: Chrome 141.0
              viewport:
                width: 1440
                height: 900
            status: Unresolved
            properties:
              - name: suite
                value: smoke
            accessibilityStatus: null

conformance:
  - name: the problem type is the definition of the status code
    source: https://eyes.applitools.com/api/sessions/batches/00000000-0000-0000-0000-000000000000
    verified: "2026-09-13"
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/00000000-0000-0000-0000-000000000000
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/problem+json; charset=utf-8
      body:
        # RFC 9110 section 15.5.2 is 401 Unauthorized.
        type: https://tools.ietf.org/html/rfc9110#section-15.5.2
        title: Unauthorized
        # The same fact again, in the body.
        status: 401

  - name: and the support identifier says the trace was not sampled
    source: https://eyes.applitools.com/api/sessions/batches
    verified: "2026-09-13"
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers: {}
    expect:
      status: 401
      matches:
        # version - trace id - span id - flags, and the flags are 00.
        traceId: '\A00-[0-9a-f]{32}-[0-9a-f]{16}-00\z'

  - name: a wrong key in the header is the same body
    source: https://eyes.applitools.com/api/sessions/batches
    verified: "2026-09-13"
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers:
        X-Eyes-Api-Key: notarealkey
    expect:
      status: 401
      body:
        title: Unauthorized
        status: 401
        type: https://tools.ietf.org/html/rfc9110#section-15.5.2

  - name: and so is a wrong key in the parameter the sdks send
    source: https://eyes.applitools.com/api/sessions/batches?apiKey=notarealkey
    verified: "2026-09-13"
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      query:
        # Nothing from outside says whether this is read at all.
        apiKey: notarealkey
      headers: {}
    expect:
      status: 401
      body:
        title: Unauthorized

  - name: a path that does not exist says nothing at all
    source: https://eyes.applitools.com/api/cauldron-nope
    verified: "2026-09-13"
    fixture: batches
    request:
      method: GET
      path: /api/cauldron-nope
      headers: {}
    expect:
      status: 404
      # No problem document, and no Content-Type either.
      no_body: true
      absent_headers:
        - Content-Type

  - name: and neither does a method the path does not take
    source: https://eyes.applitools.com/api/sessions/batches
    fixture: batches
    request:
      method: POST
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers: {}
    expect:
      status: 405
      no_body: true
      absent_headers:
        - Content-Type

  - name: the batch's identifier lives inside its statistics
    source: https://applitools.com/docs/eyes/reference/server-api/batches/list-batch-results
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers:
        X-Eyes-Api-Key: cauldr0nAppl1t00lsF1xtureKey000000000000
    expect:
      status: 200
      body:
        # Not at the top level: inside the object of counts.
        'statistics.id': 1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
        'statistics.pointerId': 6b2e9d41-77af-4c0a-8f3d-51ba2e9c4d08
        # A reserved word, as a field name.
        'statistics.new': 3
        'statistics.passed': 18
        'statistics.failed': 2
        'statistics.unresolved': 1
        'statistics.total': 24
        batchUrl: https://eyes.applitools.com/app/test-results/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3

  - name: a test result carries two email addresses
    source: https://applitools.com/docs/eyes/reference/server-api/batches/list-batch-results
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers:
        X-Eyes-Api-Key: cauldr0nAppl1t00lsF1xtureKey000000000000
    expect:
      status: 200
      body:
        # runBy and assignedTo, on a visual test result.
        'tests[0].runBy': ci@example.com
        'tests[0].assignedTo': dana@example.com
        'tests[1].assignedTo': null
        'tests[0].testName': Checkout page renders
        'tests[0].branchName': main
        'tests[0].status': Passed
        'tests[1].status': Unresolved

  - name: the browser is under a key called app
    source: https://applitools.com/docs/eyes/reference/server-api/batches/list-batch-results
    fixture: batches
    request:
      method: GET
      path: /api/sessions/batches/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3
      headers:
        X-Eyes-Api-Key: cauldr0nAppl1t00lsF1xtureKey000000000000
      query:
        steps: "false"
    expect:
      status: 200
      body:
        # "Browser/application", documented under a key named for neither.
        'tests[0].env.app': Chrome 141.0
        'tests[0].env.device': desktop
        'tests[0].env.os': Linux
        'tests[0].env.viewport.width': 1440
        'tests[0].env.viewport.height': 900
        'tests[0].properties': []
        'tests[1].properties[0].name': suite
        'tests[0].accessibilityStatus.level': AA
        'tests[1].accessibilityStatus': null
        'tests[0].startTime': "2026-09-11T09:14:02Z"
        'tests[0].testId': 9f4c8a10-2b6e-4d75-83c1-0e7a5b29f4dd
        'tests[0].sessionUrl': https://eyes.applitools.com/app/test-results/1a7d3f92-4c6b-4f80-9e51-2d8c0b47a6e3/9f4c8a10-2b6e-4d75-83c1-0e7a5b29f4dd
