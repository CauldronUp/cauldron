# ProPublica Nonprofit Explorer Recipe for Cauldron
#
# Genuinely open, still. Every route this Recipe struck live -- the Organization
# lookup, the Search endpoint, a bad id, a bad method, a bad path -- answered
# with no key, no signup, and no header of any kind, checked on the date
# below. Unlike CourtListener or OpenStates elsewhere in this task, this is
# not a per-route carve-out on an otherwise gated surface: nothing on this
# host asked for a credential once, on any of the roughly twenty requests
# this Recipe made.
#
# The identifier story is the reason this Recipe exists, and the live wire
# disagrees with the API's own documentation about it in a way worth stating
# plainly. The published "Organization Object" table documents two fields
# for the EIN: `ein` (an integer, leading zeroes trimmed) and `strein`
# ("Version of the EIN in the XX-XXXXXXX format, containing leading zeroes
# if applicable"). The live Organization endpoint -- GET
# /organizations/:ein.json, struck against a real record below -- sends
# `ein` and does not send `strein` at all. Every key on that live object was
# read off the wire, not off the docs: id, ein, name, careofname, address,
# city, state, zipcode, exemption_number, subsection_code, affiliation_code,
# classification_codes, ruling_date, deductibility_code, foundation_code,
# activity_codes, organization_code, exempt_organization_status_code,
# tax_period, asset_code, income_code, filing_requirement_code,
# pf_filing_requirement_code, accounting_period, asset_amount, income_amount,
# revenue_amount, ntee_code, sort_name, created_at, updated_at, data_source,
# have_extracts, have_pdfs, latest_object_id -- and `strein`, `subseccd`,
# `guidestar_url` and `nccs_url`, all four of them documented Organization
# Object fields, are not among them. Those four names really do exist on the
# wire -- inside the embedded "organization" object the Search endpoint
# nests on every Filing result -- which is a second, DIFFERENT shape the
# published table conflates with the Organization endpoint's own. A client
# that fetches an organization directly by EIN and wants the canonical
# dashed form -- the one form an IRS document, GuideStar or a state charity
# registry would actually recognise -- gets no field for it at all from that
# response, and would have to reconstruct it by hand (zero-pad to nine
# digits, insert a dash after the second) or make an entirely different call
# to Search instead. That reconstruction happens to be safe for this
# provider's EINs specifically -- the two-digit IRS campus prefix is never
# "00", so at most one leading zero is ever dropped -- but nothing on the
# wire says so, and this Recipe states it here rather than leaving a reader
# to work it out.
#
# `data_source` is also, confusingly, two different fields with the same
# name at two different depths on the very same response: the top-level one
# is a fixed citation paragraph naming the IRS extracts this whole API is
# built from, stamped on every body (success or failure) this Recipe struck;
# the one nested inside "organization" is a per-record ingestion-batch tag
# ("current_2026_08_19") that moves with every refresh. A client reading
# response.data_source without checking which object it is on reads a
# citation string on one and a batch id on the other.
#
# The malformed-versus-missing split this task asked for turned out to be
# richer than "one EIN, one shape, one status," and every line below was
# struck live, with no key, against a real EIN and several deliberately not:
#
#   GET /organizations/131837418.json   -> 200, a real organisation (Candid)
#   GET /organizations/10-0000001.json  -> 404 {"...,"error":"Organization not found"}
#   GET /organizations/123.json         -> 404, the identical error
#   GET /organizations/1.json           -> 404, the identical error again
#   GET /organizations/0.json           -> 200, {"name":"Unknown Organization",
#                                          everything else null}, with THREE
#                                          real filings_without_data entries
#                                          attached
#   GET /organizations/999999999.json   -> 200, the identical
#                                          "Unknown Organization" shape, with
#                                          FIVE different real filings_without_data
#                                          entries attached
#
# A well-formed nine-digit EIN belonging to no organisation is a 404, in
# JSON, naming no organisation at all -- the ordinary, expected shape. What
# is not ordinary is that "well-formed" turns out to include two specific
# sentinel values -- 0 and 999999999 -- that are not 404s at all: they are
# 200, with a real placeholder organisation record and real (if orphaned)
# filing stubs still attached, because the underlying IRS extracts this API
# is built from use those two numbers as their OWN "EIN unknown" placeholder
# in scanned/malformed source records. A client checking `name === "Unknown
# Organization"` to detect "this EIN doesn't exist" is checking the right
# thing for exactly two numbers and the wrong one for every other unassigned
# EIN, which answers 404 instead.
#
# Two more shapes were struck live and could not be turned into servable
# routes, because reproducing them needs the path parameter itself to be
# transformed before it is looked up, and Cauldron's own id matching is an
# exact string comparison against a stored key (internal/store/store.go:
# `c.records[id]`), never a numeric parse:
#
#   GET /organizations/abcdefghi.json   -> 200, byte-identical to EIN 0.
#     Ruby's own `.to_i` (or the equivalent digit-filter this host clearly
#     runs) reads a string with no digits in it at all as zero, so a
#     non-numeric EIN is silently coerced to the same sentinel a genuinely
#     unassigned EIN of zero would reach -- not rejected, not 400, not
#     distinguished from "the special placeholder record" in any way.
#   GET /organizations/13-1837418.json  -> 200, byte-identical to
#     /organizations/131837418.json. The canonical dashed form is silently
#     accepted on this endpoint even though the documented Organization
#     Method says the id is "the organization's integer EIN" and nothing
#     about a dash -- the host strips non-digits and parses what remains,
#     the same mechanism that turns "abcdefghi" into zero.
#
# Both are genuine, both were struck live on the date below, and neither
# could be routed here: Cauldron would need to run the identical
# digit-filter-then-parse transform on every path segment before comparing
# it to a stored id, which is not what any Recipe in this collection's id
# matching does. They are recorded here, with the exact requests that
# produced them, rather than served.
#
# A wrong method on the one real route answers a Rails CSRF page's shape,
# not a routing error: POST, PUT, PATCH and DELETE against
# /organizations/131837418.json all answered 422 Unprocessable Entity with
# {"status":422,"error":"Unprocessable Entity"} -- no data_source, no
# api_version, a completely different envelope from every other failure this
# host answers -- which is the same family of failure Flexport's Recipe
# elsewhere in this collection describes for PUT/DELETE/OPTIONS against a
# Rails app with no real write endpoint at all: the framework's own
# authenticity-token rejection, reached before this API's own routing ever
# gets a say in it.
#
# An unrouted path answers plain text, not JSON at all: GET
# /nonprofits/api/v2/this-is-not-a-real-endpoint.json answers 404 with the
# bare five bytes "Not Found", Content-Type text/plain -- a third envelope,
# after the JSON not-found and the JSON method failure, on one host.
#
# On modelling: this Recipe declares no `resources:` block at all, and every
# route below is `raw`. The response shape genuinely needs -- a wrapped
# "organization" object sitting beside two SIBLING top-level arrays, from a
# single-record GET -- is not one this format's resource vocabulary can
# express today. `beside` is the mechanism built for "one endpoint, several
# arrays" (GoCardless's booked and pending transactions, in this collection),
# and it is wired only into the LIST handler
# (internal/runtime/handler.go, the code path that already has a `where`
# clause and a page to attach a second collection to); a route whose
# operation is `get` has no equivalent. Rather than misrepresent the shape
# by nesting filings_with_data and filings_without_data one level deeper
# than the wire actually puts them, or omitting them and understating what
# this endpoint sends, every organisation-lookup route below serves the
# literal, captured bytes -- which is also the more rigorous choice for a
# task whose central rule is "never invent a field value."
#
# Known fidelity gaps, stated rather than hidden:
#
#   - `careofname` on the Candid fixture is NOT the value the live record
#     carries. The real value names a real member of Candid's staff; this
#     task's rule is to keep real people out of fixtures, and the value
#     below is the obviously synthetic "% CAULDRON FIXTURE CONTACT". Every
#     other field on that fixture is the live response's own value,
#     unedited, because Candid is an organisation, not a person, which this
#     task's own guidance prefers.
#   - Candid's real filings_with_data array holds twelve entries with
#     roughly seventy fields apiece (the full Form 990 financial extract);
#     two are kept below, complete and unedited, to demonstrate the shape
#     without repeating a decade of near-identical rows. Its real
#     filings_without_data array holds eleven entries; four are kept.
#   - /search.json is real, public, and confirmed keyless live (cited
#     below), but not modelled with a servable fixture: every live result
#     this Recipe's own probes returned named a real judge, officer or
#     private party (a bankruptcy debtor, an assigned judge), which this
#     task's rule keeps out of fixtures entirely. The one case below for it
#     uses field names this Recipe confirmed live and synthetic
#     organisation values in place of the real result, and carries no
#     verified date for exactly that reason -- the shape was observed, the
#     values were not served as observed.
#   - The generic `/organizations/{id}.json` path is not declared as a
#     template. Every id below is a literal, specific value this Recipe
#     actually struck -- see the header for why a template could not
#     reproduce the digit-filtering this host does before it ever compares
#     an id to a database.
#   - No upstream.spec is recorded. This API's only published description is
#     the HTML page cited below; no OpenAPI or JSON Schema document exists
#     for this Recipe to fingerprint.

recipe: propublica
capability: docs
version: 0.1.0

upstream:
  api: v2
  docs: https://projects.propublica.org/nonprofits/api

auth:
  # Confirmed live on every route this Recipe struck, not assumed from one.
  # See the header.
  scheme: none

responses:
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"

routes:
  # The one full record this Recipe holds. Byte-faithful to the live
  # response, trimmed only in array length -- see the header.
  - method: GET
    path: /nonprofits/api/v2/organizations/131837418.json
    raw:
      content_type: application/json; charset=utf-8
      text: >-
        {"organization":{"id":131837418,"ein":131837418,"name":"Candid","careofname":"%
        CAULDRON FIXTURE CONTACT","address":"32 OLD SLIP 24TH
        FLOOR","city":"New York","state":"NY","zipcode":"10005-0000","exemption_number":0,"subsection_code":3,"affiliation_code":3,"classification_codes":"2000","ruling_date":"1957-06-01","deductibility_code":1,"foundation_code":15,"activity_codes":"059061000","organization_code":1,"exempt_organization_status_code":1,"tax_period":"2025-12-01","asset_code":9,"income_code":9,"filing_requirement_code":1,"pf_filing_requirement_code":0,"accounting_period":12,"asset_amount":107753716,"income_amount":67877099,"revenue_amount":41100093,"ntee_code":"T500","sort_name":null,"created_at":"2023-05-09T20:23:20.905Z","updated_at":"2026-08-19T19:29:47.423Z","data_source":"current_2026_08_19","have_extracts":null,"have_pdfs":null,"latest_object_id":"202621739349300917"},"filings_with_data":[{"tax_prd":202312,"tax_prd_yr":2023,"formtype":0,"pdf_url":null,"updated":"2025-08-05T16:07:59.426Z","totrevenue":43212468,"totfuncexpns":36022947,"totassetsend":100177752,"totliabend":30594864,"pct_compnsatncurrofcr":0.0,"subseccd":3,"totcntrbgfts":8769879,"totprgmrevnue":33025623,"invstmntinc":1539159,"compnsatncurrofcr":1377591,"othrsalwages":15119026,"totnetassetend":69582888,"ein":131837418},{"tax_prd":202212,"tax_prd_yr":2022,"formtype":0,"pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=download990pdf_09_2023_prefixes_01-14%2F131837418_202212_990_2023091121663809.pdf","updated":"2024-08-28T20:05:15.965Z","totrevenue":51839195,"totfuncexpns":39889670,"totassetsend":90918496,"totliabend":31457207,"pct_compnsatncurrofcr":0.0,"subseccd":3,"totcntrbgfts":7177743,"totprgmrevnue":32245979,"invstmntinc":1068678,"compnsatncurrofcr":1756676,"othrsalwages":17556808,"totnetassetend":59461289,"ein":131837418}],"filings_without_data":[{"tax_prd":202412,"tax_prd_yr":2024,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=IRS%2F131837418_202412_990_2026012223862133.pdf"},{"tax_prd":201012,"tax_prd_yr":2010,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2011_10_EO%2F13-1837418_990_201012.pdf"},{"tax_prd":200912,"tax_prd_yr":2009,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2010_10_EO%2F13-1837418_990_200912.pdf"},{"tax_prd":200812,"tax_prd_yr":2008,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2009_06_EO%2F13-1837418_990_200812.pdf"}],"data_source":"ProPublica Nonprofit Explorer API: https://projects.propublica.org/nonprofits/api/\nIRS Exempt Organizations Business Master File Extract (EO BMF): https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf\nIRS Annual Extract of Tax-Exempt Organization Financial Data: https://www.irs.gov/uac/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data","api_version":2}

  # The zero sentinel. Real, live, and the exact bytes this host answered --
  # see the header for why this is not the same thing as "unassigned."
  - method: GET
    path: /nonprofits/api/v2/organizations/0.json
    raw:
      content_type: application/json; charset=utf-8
      text: >-
        {"organization":{"id":0,"ein":0,"name":"Unknown
        Organization","careofname":null,"address":null,"city":null,"state":null,"zipcode":null,"exemption_number":null,"subsection_code":null,"affiliation_code":null,"classification_codes":null,"ruling_date":null,"deductibility_code":null,"foundation_code":null,"activity_codes":null,"organization_code":null,"exempt_organization_status_code":null,"tax_period":null,"asset_code":null,"income_code":null,"filing_requirement_code":null,"pf_filing_requirement_code":null,"accounting_period":null,"asset_amount":null,"income_amount":null,"revenue_amount":null,"ntee_code":null,"sort_name":null,"created_at":null,"updated_at":null,"data_source":null,"have_extracts":null,"have_pdfs":null,"latest_object_id":null},"filings_with_data":[],"filings_without_data":[{"tax_prd":201212,"tax_prd_yr":2012,"formtype":1,"formtype_str":"990EZ","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2013_09_EO%2F00-0000000_990EZ_201212.pdf"},{"tax_prd":200506,"tax_prd_yr":2005,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2005_12_EO%2F00-0000000_990_200506.pdf"},{"tax_prd":200412,"tax_prd_yr":2004,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2005_08_EO%2F00-0000000_990_200412.pdf"}],"data_source":"ProPublica Nonprofit Explorer API: https://projects.propublica.org/nonprofits/api/\nIRS Exempt Organizations Business Master File Extract (EO BMF): https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf\nIRS Annual Extract of Tax-Exempt Organization Financial Data: https://www.irs.gov/uac/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data","api_version":2}

  # The second sentinel. Same organisation shape, different orphaned
  # filings -- proof this is a real placeholder record and not a
  # once-off fluke of EIN zero specifically.
  - method: GET
    path: /nonprofits/api/v2/organizations/999999999.json
    raw:
      content_type: application/json; charset=utf-8
      text: >-
        {"organization":{"id":999999999,"ein":999999999,"name":"Unknown
        Organization","careofname":null,"address":null,"city":null,"state":null,"zipcode":null,"exemption_number":null,"subsection_code":null,"affiliation_code":null,"classification_codes":null,"ruling_date":null,"deductibility_code":null,"foundation_code":null,"activity_codes":null,"organization_code":null,"exempt_organization_status_code":null,"tax_period":null,"asset_code":null,"income_code":null,"filing_requirement_code":null,"pf_filing_requirement_code":null,"accounting_period":null,"asset_amount":null,"income_amount":null,"revenue_amount":null,"ntee_code":null,"sort_name":null,"created_at":null,"updated_at":null,"data_source":null,"have_extracts":null,"have_pdfs":null,"latest_object_id":null},"filings_with_data":[],"filings_without_data":[{"tax_prd":200807,"tax_prd_yr":2008,"formtype":2,"formtype_str":"990PF","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2007_10_PF%2F99-9999999_990PF_200807.pdf"},{"tax_prd":200707,"tax_prd_yr":2007,"formtype":0,"formtype_str":"990","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2007_02_EO%2F99-9999999_990_200707.pdf"},{"tax_prd":200607,"tax_prd_yr":2006,"formtype":1,"formtype_str":"990EZ","pdf_url":"https://projects.propublica.org/nonprofits/download-filing?path=2006_12_EO%2F99-9999999_990EZ_200607.pdf"}],"data_source":"ProPublica Nonprofit Explorer API: https://projects.propublica.org/nonprofits/api/\nIRS Exempt Organizations Business Master File Extract (EO BMF): https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf\nIRS Annual Extract of Tax-Exempt Organization Financial Data: https://www.irs.gov/uac/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data","api_version":2}

  # A well-formed, nine-digit, genuinely unassigned EIN. The ordinary case:
  # 404, in JSON, naming no organisation.
  - method: GET
    path: /nonprofits/api/v2/organizations/10-0000001.json
    error: org_not_found

  # Too short to be an EIN at all. The identical failure -- length is not
  # what this endpoint checks before answering.
  - method: GET
    path: /nonprofits/api/v2/organizations/123.json
    error: org_not_found

  - method: GET
    path: /nonprofits/api/v2/organizations/1.json
    error: org_not_found

  # A synthetic stand-in for /search.json -- see the header for why no real
  # result is served here. Field names are this Recipe's own live
  # observation; values are not, and this case carries no verified date for
  # that reason.
  - method: GET
    path: /nonprofits/api/v2/search.json
    raw:
      content_type: application/json; charset=utf-8
      text: >-
        {"total_results":2,"num_pages":1,"cur_page":0,"per_page":25,"page_offset":0,"search_query":"cauldron
        fixture","selected_state":null,"selected_ntee":null,"selected_code":null,"data_source":"ProPublica
        Nonprofit Explorer API: https://projects.propublica.org/nonprofits/api/\nIRS
        Exempt Organizations Business Master File Extract (EO BMF):
        https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf\nIRS
        Annual Extract of Tax-Exempt Organization Financial Data:
        https://www.irs.gov/uac/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data","api_version":1,"organizations":[{"ein":10000001,"strein":"10-0000001","name":"Cauldron
        Fixture Foundation","sub_name":"","address":"1 Fixture
        Way","city":"Testville","state":"NY","zipcode":"10001-0000","subseccd":3,"ntee_code":"T500","guidestar_url":"https://www.guidestar.org/organizations/10-0000001/.aspx","nccs_url":"http://nccsweb.urban.org/communityplatform/nccs/organization/profile/id/10000001/","updated":"2026-01-01T00:00:00Z"},{"ein":10000002,"strein":"10-0000002","name":"Cauldron
        Fixture Alliance Inc","sub_name":"","address":"2 Fixture
        Way","city":"Testville","state":"NY","zipcode":"10001-0000","subseccd":3,"ntee_code":"T500","guidestar_url":"https://www.guidestar.org/organizations/10-0000002/.aspx","nccs_url":"http://nccsweb.urban.org/communityplatform/nccs/organization/profile/id/10000002/","updated":"2026-01-01T00:00:00Z"}]}

  # Rails' own authenticity-token rejection, not a routing error -- see the
  # header.
  - method: POST
    path: /nonprofits/api/v2/organizations/{id}.json
    error: method_not_allowed

  - method: PUT
    path: /nonprofits/api/v2/organizations/{id}.json
    error: method_not_allowed

  - method: PATCH
    path: /nonprofits/api/v2/organizations/{id}.json
    error: method_not_allowed

  - method: DELETE
    path: /nonprofits/api/v2/organizations/{id}.json
    error: method_not_allowed

  # A path this host has no route for at all. Plain text, not JSON -- a
  # third envelope on one host, after the JSON not-found and the JSON
  # method failure.
  - method: GET
    path: /nonprofits/api/v2/this-is-not-a-real-endpoint.json
    error: unrouted_plain

errors:
  org_not_found:
    status: 404
    message: Organization not found
    fields:
      api_version: 2
      data_source: >-
        ProPublica Nonprofit Explorer API:
        https://projects.propublica.org/nonprofits/api/
        IRS Exempt Organizations Business Master File Extract (EO BMF):
        https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf
        IRS Annual Extract of Tax-Exempt Organization Financial Data:
        https://www.irs.gov/uac/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data

  # Rails' CSRF rejection shape. No data_source, no api_version -- a
  # deliberately different envelope from every JSON failure above.
  method_not_allowed:
    status: 422
    message_field: error
    message: Unprocessable Entity
    fields:
      status: 422

  # Bare text. Calling .json() on this throws.
  unrouted_plain:
    status: 404
    style: text
    headers:
      Content-Type: text/plain; charset=utf-8
    message: Not Found

fixtures:
  empty: {}

# Every case below carries source. A verified date means this Recipe called
# projects.propublica.org with exactly the request shown and recorded
# exactly what came back; its absence means the case was either read from
# ProPublica's own published API description, or (the search.json case) the
# request really was made live but this Recipe declined to serve the real,
# person-identifying result it returned -- see the header.
conformance:
  - name: a real organisation is fetched directly by its bare EIN, no key required
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/131837418.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/131837418.json
    expect:
      status: 200
      body:
        organization.id: 131837418
        organization.ein: 131837418
        organization.name: Candid
      absent:
        - organization.strein
        - organization.guidestar_url
        - organization.nccs_url

  - name: the canonical dashed EIN form is documented but not sent by this endpoint
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/131837418.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/131837418.json
    expect:
      status: 200
      absent:
        - strein
        - organization.strein

  - name: two data_source fields at two depths mean two different things
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/131837418.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/131837418.json
    expect:
      status: 200
      body:
        organization.data_source: current_2026_08_19
      matches:
        data_source: "^ProPublica Nonprofit Explorer API"

  - name: a well-formed nine-digit EIN belonging to nobody is a 404 naming no organisation
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/10-0000001.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/10-0000001.json
    expect:
      status: 404
      body:
        error: Organization not found
        api_version: 2
      absent:
        - organization

  - name: a too-short numeric segment gets the identical failure, not a shape error
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/123.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/123.json
    expect:
      status: 404
      body:
        error: Organization not found

  - name: a single digit is refused the same way again
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/1.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/1.json
    expect:
      status: 404
      body:
        error: Organization not found

  - name: EIN zero is not unassigned, it is a real placeholder record
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/0.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/0.json
    expect:
      status: 200
      body:
        organization.id: 0
        organization.name: Unknown Organization
        organization.created_at: null
      absent:
        - error

  - name: EIN zero still carries real, if orphaned, filing stubs
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/0.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/0.json
    expect:
      status: 200
      body:
        "filings_without_data[0].tax_prd": 201212
        "filings_without_data[0].formtype_str": 990EZ
      matches:
        "filings_without_data[0].pdf_url": "00-0000000"

  - name: a second sentinel EIN carries a different set of orphaned filings
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/999999999.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/organizations/999999999.json
    expect:
      status: 200
      body:
        organization.id: 999999999
        organization.name: Unknown Organization
      matches:
        "filings_without_data[0].pdf_url": "99-9999999"

  - name: a wrong method answers a Rails CSRF rejection, not a routing error
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/131837418.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /nonprofits/api/v2/organizations/131837418.json
    expect:
      status: 422
      body:
        status: 422
        error: Unprocessable Entity
      absent:
        - data_source
        - api_version

  - name: DELETE and PATCH answer the identical rejection
    source: https://projects.propublica.org/nonprofits/api/v2/organizations/131837418.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: DELETE
      path: /nonprofits/api/v2/organizations/131837418.json
    expect:
      status: 422
      body:
        error: Unprocessable Entity

  - name: an unrouted path is a bare text 404, a third envelope on this host
    source: https://projects.propublica.org/nonprofits/api/v2/this-is-not-a-real-endpoint.json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/this-is-not-a-real-endpoint.json
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: "^Not Found$"

  - name: search answers with no key either, and nests a second, richer organisation shape
    # Struck live on the date above at
    # https://projects.propublica.org/nonprofits/api/v2/search.json?q=propublica --
    # 200, no key, real strein/guidestar_url/nccs_url fields the direct
    # Organization endpoint above never sends. This case's own values are
    # synthetic -- see the header -- so it carries no verified date, even
    # though the shape and the keyless status were both confirmed live.
    source: https://projects.propublica.org/nonprofits/api/v2/search.json
    fixture: empty
    request:
      method: GET
      path: /nonprofits/api/v2/search.json?q=cauldron+fixture
    expect:
      status: 200
      body:
        "organizations[0].strein": "10-0000001"
        "organizations[0].ein": 10000001
      absent:
        - "organizations[0].subsection_code"
        - "organizations[0].careofname"
