# Europe PMC Recipe for Cauldron
#
# Three failure shapes, and the HTTP status is right on exactly one of them.
#
#   /search?format=json            ->  200  {"errCode": 404, "errMsg": "No search
#                                            criteria provided. ..."}
#   /search?query=x&format=xxx     ->  200  application/xml
#                                           <errorBean><errCode>404</errCode>...
#   /nosuchthing?format=json       ->  404  Content-Length: 0, no body
#
# The two that say 404 answer 200 and put the number in the body; the one that
# answers 404 says nothing at all. A client checking response.ok gets true for
# both failures that explain themselves and false for the one that does not.
#
# **And asking for a format that does not exist gets you XML.** ?format=xxx
# answers, in XML, that you should have asked for "xml" or "json" or "dc" -- so
# a client with a typo in its format parameter is told JSON is available by a
# document it cannot parse, at a status that says nothing went wrong. The
# message even has a space before its closing tag.
#
# **The same document sends real booleans in one object and letters in the
# next.** The echoed request carries "synonym": false, an actual JSON boolean.
# Eleven fields on the record beside it do not:
#
#   "request":  {"cursorMark": "*", "pageSize": 25, "synonym": false}
#   "result":   {"isOpenAccess": "Y", "inEPMC": "Y", "hasBook": "N", ...}
#
# So the API knows how to send a boolean, and chooses not to, eleven times, in
# the object next door. "N" is truthy in every language a client is likely to be
# written in, and there is no value those eleven fields can hold that is falsy.
#
# Written against the live API rather than a document: every case below was
# checked against ebi.ac.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. An identifier list is a semicolon-joined string with a trailing
#      separator: journalIssn is "0305-1048; 1362-4962; " -- two ISSNs, one
#      string, a trailing "; " and a trailing space. Splitting on "; " yields
#      three entries and the third is empty.
#   2. pubType is joined the same way and its items contain commas: "research
#      support, n.i.h., intramural; research-article; journal article; ...".
#      A client splitting on the comma its neighbour authorString uses gets
#      nonsense, and nothing in either name says which separator is which.
#   3. An array is wrapped in an object under a singular key, inside a field
#      named for a list: "fullTextIdList": {"fullTextId": ["PMC3531190"]}.
#      Three levels, and the plural is the outermost.
#
# And citedByCount is the one integer among the eleven letters, while
# journalVolume is "41" -- a number kept as a string, beside an issue of
# "database issue", which is not a number at all.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One record is served, of Europe PMC's millions, and it is fetched by a
#     query for its own identifier so the result does not move. A search
#     without that constraint returns whatever is newest.
#   - hitCount is the count for that one-record query. It is a declared
#     constant, not derived from the fixture.
#   - The XML failure is served as recorded bytes under a text error style.
#     Cauldron has no XML writer, and the point is the bytes rather than a
#     document model.
#   - The empty 404 is served with Cauldron's own content type. Upstream sends
#     Content-Length: 0 and no Content-Type at all; the absence is recorded
#     here rather than served.

recipe: europepmc
capability: docs
version: 0.1.0

upstream:
  api: v6.9
  provider: europepmc
  docs: https://europepmc.org/RestfulWebService

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: resultList.result
  error:
    # A code that says 404 in a response that says 200.
    style: flat
    message_field: errMsg
    code_field: errCode
    code_type: number
    type_field: "-"

resources:
  article:
    id:
      style: opaque
      field: id
    fields:
      source:
        type: string
      pmid:
        type: string
      pmcid:
        type: string
      doi:
        type: string
      title:
        type: string
      journalTitle:
        type: string
      journalVolume:
        type: string
      issue:
        type: string
      pubYear:
        type: string
      # Two ISSNs, one string, and a trailing separator.
      journalIssn:
        type: string
      # Joined on a semicolon, with commas inside the items.
      pubType:
        type: string
      # The one integer among eleven letters.
      citedByCount:
        type: integer
      # And the eleven letters.
      isOpenAccess:
        type: string
      inEPMC:
        type: string
      inPMC:
        type: string
      hasPDF:
        type: string
      hasBook:
        type: string
      hasSuppl:
        type: string
      hasReferences:
        type: string
      hasTextMinedTerms:
        type: string
      hasDbCrossReferences:
        type: string
      hasLabsLinks:
        type: string
      hasTMAccessionNumbers:
        type: string
      # An array, in an object, under a singular key, in a field named List.
      fullTextIdList:
        type: map
      firstIndexDate:
        type: string
      firstPublicationDate:
        type: string

routes:
  - method: GET
    path: /europepmc/webservices/rest/search
    resource: article
    operation: list
    pagination:
      # pageSize and cursorMark, and this Recipe does not need a reference
      # for either: Europe PMC echoes the request back in the response it
      # already pins, as {"cursorMark": "*", "pageSize": 25, "synonym":
      # false}. The default is in that echo too.
      #
      # cursorMark starts at the literal "*" rather than empty, which is
      # Solr's convention showing through, and is why this is cursor paging
      # under a name that reads like a bookmark. The runtime was reading
      # limit and cursor, neither of which appears anywhere in that object.
      style: cursor
      limit: 25
      limit_param: pageSize
      cursor_param: cursorMark
    fields:
      version: "6.9"
      hitCount: 1
      # The request, echoed back, carrying a real boolean.
      request.queryString: "EXT_ID:23193287"
      request.resultType: lite
      request.cursorMark: "*"
      request.pageSize: 25
      request.sort: ""
      # An actual JSON boolean, beside eleven fields that are letters.
      request.synonym: false

  # No search criteria: two hundred, carrying four hundred and four.
  - method: GET
    path: /europepmc/webservices/rest/search-without-criteria
    error: no_criteria

  # A page size out of range: the same shape again.
  - method: GET
    path: /europepmc/webservices/rest/search-bad-page-size
    error: bad_page_size

  # A format that does not exist: XML, telling you JSON was available.
  - method: GET
    path: /europepmc/webservices/rest/search-bad-format
    error: bad_format
    headers:
      Content-Type: application/xml

  # A path that does not exist: the only real 404, and it says nothing.
  - method: GET
    path: /europepmc/webservices/rest/nosuchthing
    resource: article
    operation: get
    id_from: auth
    status: 404
    empty_body: true

errors:
  no_criteria:
    # Two hundred...
    status: 200
    # ...carrying four hundred and four.
    code: "404"
    message: "No search criteria provided. Please provide a search criteria which is less than 1500 characters."

  bad_page_size:
    status: 200
    code: "404"
    message: "Invalid page size provided. Valid size is between 1 and 1000"

  bad_format:
    status: 200
    # XML, because JSON was not one of the words it recognised. Served as the
    # recorded bytes: the point is what arrives, not a document model.
    style: text
    message: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><errorBean><errCode>404</errCode><errMsg>Invalid Style provided. Please enter either "xml" or "json" or "dc" or use headers instead. </errMsg></errorBean>'

fixtures:
  empty: {}

  genbank:
    article:
      - id: "23193287"
        source: MED
        pmid: "23193287"
        pmcid: PMC3531190
        doi: "10.1093/nar/gks1195"
        # A title that is one word and a full stop.
        title: "GenBank."
        journalTitle: "Nucleic Acids Res"
        # A number kept as a string...
        journalVolume: "41"
        # ...beside an issue that is not a number at all.
        issue: "database issue"
        pubYear: "2013"
        # Two ISSNs, one string, a trailing separator and a trailing space.
        journalIssn: "0305-1048; 1362-4962; "
        # Semicolons between items, commas inside them.
        pubType: "research support, n.i.h., intramural; research-article; journal article; research support, non-u.s. gov't"
        # The one integer.
        citedByCount: 2055
        # And the eleven letters.
        isOpenAccess: "Y"
        inEPMC: "Y"
        inPMC: "Y"
        hasPDF: "Y"
        hasBook: "N"
        hasSuppl: "N"
        hasReferences: "Y"
        hasTextMinedTerms: "Y"
        hasDbCrossReferences: "N"
        hasLabsLinks: "Y"
        hasTMAccessionNumbers: "Y"
        # An array, in an object, under a singular key, in a field named List.
        fullTextIdList:
          fullTextId:
            - PMC3531190
        firstIndexDate: "2012-11-30"
        firstPublicationDate: "2012-11-27"

conformance:
  - name: the same document sends a real boolean and eleven letters
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search
    expect:
      status: 200
      body:
        # An actual JSON boolean, in the echoed request...
        request.synonym: false
        # ...beside eleven fields that are single letters, none of which is
        # falsy in any language a client is likely to be written in.
        "resultList.result[0].isOpenAccess": "Y"
        "resultList.result[0].inEPMC": "Y"
        "resultList.result[0].inPMC": "Y"
        "resultList.result[0].hasPDF": "Y"
        "resultList.result[0].hasBook": "N"
        "resultList.result[0].hasSuppl": "N"
        "resultList.result[0].hasReferences": "Y"
        "resultList.result[0].hasTextMinedTerms": "Y"
        "resultList.result[0].hasDbCrossReferences": "N"
        "resultList.result[0].hasLabsLinks": "Y"
        "resultList.result[0].hasTMAccessionNumbers": "Y"
        # And the one integer among them.
        "resultList.result[0].citedByCount": 2055

  - name: no search criteria answers two hundred carrying four hundred and four
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search-without-criteria
    expect:
      # Two hundred.
      status: 200
      body:
        # And four hundred and four, in the body, as a number.
        errCode: 404
        errMsg: "No search criteria provided. Please provide a search criteria which is less than 1500 characters."

  - name: and a page size out of range does the same
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=x&format=json&pageSize=9999"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search-bad-page-size
    expect:
      status: 200
      body:
        errCode: 404
        errMsg: "Invalid page size provided. Valid size is between 1 and 1000"

  - name: asking for a format that does not exist gets you XML
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=x&format=xxx"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search-bad-format
    expect:
      # Two hundred, and not JSON.
      status: 200
      headers:
        Content-Type: application/xml
      # It tells you, in XML, that json was one of the words it wanted -- and
      # leaves a space before the closing tag.
      body_matches: '^<\?xml version="1.0" encoding="UTF-8" standalone="yes"\?><errorBean><errCode>404</errCode><errMsg>Invalid Style provided. Please enter either "xml" or "json" or "dc" or use headers instead\. </errMsg></errorBean>$'

  - name: and the only real 404 says nothing at all
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/nosuchthing?format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/nosuchthing
    expect:
      # The one failure whose status is right is the one that explains nothing:
      # Content-Length: 0 and no body.
      status: 404
      body_matches: '^$'

  - name: an identifier list is a string with a trailing separator
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search
    expect:
      status: 200
      body:
        # Two ISSNs, one string, and splitting on "; " yields an empty third.
        "resultList.result[0].journalIssn": "0305-1048; 1362-4962; "
        # Semicolons between items, commas inside them, beside an author string
        # that uses the comma the other way.
        "resultList.result[0].pubType": "research support, n.i.h., intramural; research-article; journal article; research support, non-u.s. gov't"

  - name: an array is wrapped in an object under a singular key
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search
    expect:
      status: 200
      body:
        # Three levels, and the plural is the outermost.
        "resultList.result[0].fullTextIdList.fullTextId[0]": PMC3531190
        "resultList.result[0].pmcid": PMC3531190
        # A number kept as a string, beside an issue that is not a number.
        "resultList.result[0].journalVolume": "41"
        "resultList.result[0].issue": "database issue"
        "resultList.result[0].pubYear": "2013"

  - name: the envelope carries its own version and echoes the query back
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    verified: "2026-08-30"
    fixture: genbank
    request:
      method: GET
      path: /europepmc/webservices/rest/search
    expect:
      status: 200
      body:
        # A service version, in every response.
        version: "6.9"
        hitCount: 1
        request.queryString: "EXT_ID:23193287"
        request.resultType: lite
        # A cursor that starts at an asterisk.
        request.cursorMark: "*"
        request.pageSize: 25
        # An empty string where no sort was asked for.
        request.sort: ""
        "resultList.result[0].id": "23193287"
        "resultList.result[0].title": "GenBank."
        "resultList.result[0].source": MED
        "resultList.result[0].doi": "10.1093/nar/gks1195"
        # Indexed three days after it was published.
        "resultList.result[0].firstIndexDate": "2012-11-30"
        "resultList.result[0].firstPublicationDate": "2012-11-27"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not pageSize was read -- but cursorMark can be shown, and it is the
  # half nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "cursorMark moves past the only record, and the page comes back empty"
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    fixture: genbank
    request:
      method: GET
      path: "/europepmc/webservices/rest/search"
      query:
        "pageSize": "1"
        "cursorMark": "23193287"
    expect:
      status: 200
      absent:
        - "resultList.result[0]"

  # The names. This Recipe declares 2 field(s) on a article that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "an article carries the field names this Recipe declares"
    source: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23193287&format=json"
    fixture: genbank
    request:
      method: GET
      path: "/europepmc/webservices/rest/search"
    expect:
      status: 200
      body:
        "resultList.result[0].journalTitle": "Nucleic Acids Res"
        "resultList.result[0].pmid": "23193287"


