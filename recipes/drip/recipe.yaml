# Drip Recipe for Cauldron
#
# Second of a group of three email-marketing platforms continuing the
# question recipes/buttondown/recipe.yaml and recipes/kit/recipe.yaml
# opened, and recipes/constantcontact/recipe.yaml (in this same batch)
# carries alongside it: is a contact a person or a subscription, and can an
# integration ever move one back to subscribed without their asking?
# Buttondown's answer was a lifecycle field with a documented one-way
# refusal on collision; Kit's was a genuine one-way door with no route
# back; Constant Contact split the two policies across two differently
# named create endpoints. Drip's answer is the strangest of the four,
# because Drip's own documentation disagrees with itself about it, in two
# places on the same page, and this Recipe quotes both rather than picking
# a side.
#
# ## The status field, and the two things Drip's own docs say about writing it
#
# A subscriber carries `status`, one of two documented values -- `active`
# or `unsubscribed` -- described in the Subscribers resource's own
# properties table (developer.drip.com, "Subscribers" section) as: "The
# subscriber's status whether active or unsubscribed." A worked object in
# the same section shows it sitting beside `id`, `email` and everything
# else, on one persistent record -- there is no second, unsubscribed-shaped
# resource.
#
# `POST /v2/:account_id/subscribers` ("Create or update a subscriber") is a
# plain upsert: its own Arguments table lists `status` as a directly
# settable request parameter -- "Optional. A String specifying the
# subscriber's status: either active or unsubscribed." -- on the exact same
# endpoint used for ordinary contact creation. Nothing on that page
# distinguishes a fresh record from one that already exists and was
# unsubscribed; the field is simply named and typed. Set `status: active`
# in the body of an otherwise ordinary create-or-update call naming an
# email address that is already unsubscribed, and by this section's own
# words alone, that is what the field is documented to do.
#
# But the Subscribers section that shows the worked object also carries
# this sentence, unconnected to any specific endpoint: "**All subscriber
# API endpoints only work with your active people. Attempting to modify or
# delete an inactive person will result in an error.**" Read against the
# `status` field two paragraphs later, this says the opposite thing:
# modifying a subscriber whose status is not active -- which, given the
# field's own two-value enum, can only mean `unsubscribed` -- is refused,
# not honoured.
#
# Both sentences are the vendor's own, on the same reference page, and nothing
# in the published material resolves which one governs a create-or-update
# call naming an already-unsubscribed address. This Recipe holds no
# credential and no account exists to settle it by calling the endpoint, so
# per this project's own rule against guessing a behaviour nobody watched
# happen, POST is modelled below only for a plainly new, never-subscribed
# email address -- the one case both sentences agree on -- and this
# contradiction is left exactly as contradictory as Drip left it, rather
# than resolved in either direction.
#
# A second, real consent field rides beside `status` and is not disputed by
# anything else on the page: `eu_consent` ("granted", "denied", or
# "unknown", the schema's own words) plus `eu_consent_message`. Unlike
# `status`, no companion timestamp is documented for `eu_consent` on the
# Subscribers page itself -- no `eu_consent_date` or equivalent appears in
# the properties table -- so this Recipe declares the field and does not
# invent one.
#
# ## No separate consent-history resource, but a header-level one for SMS
#
# There is no consent-history endpoint and no array of past events on a
# subscriber. What Drip calls a "batch API" and "webhooks" are the only
# two mechanisms this documentation offers for reconstructing what changed
# and when, and neither is modelled here. The one piece of Drip's own
# design that gestures at history rather than a bare current value is
# `sms_consent` (a boolean) plus the note beside `POST .../subscribers`
# that `sms_consent_date` and `sms_permission_to_send` are separately
# required import-time columns for SMS -- a source and a date, structurally
# closer to Constant Contact's `opt_in_source`/`opt_in_date` pair than to
# a bare flag, but still fields on the one record rather than a second
# resource. Not modelled: this Recipe's fixture carries no SMS data, and
# the collection this group is asking about is email.
#
# ## Deletion: a fourth answer, and the one this Recipe cannot settle either
#
# Two named-but-different actions exist on top of `DELETE`: `POST
# .../remove` ("previously labeled unsubscribe" -- Drip's own words, an
# admission the endpoint was renamed) drops a subscriber from one campaign
# or, with no `campaign_id`, all of them; `POST .../unsubscribe_all` sets
# global status; only `DELETE /v2/:account_id/subscribers/:id_or_email`
# removes the record, answering "204 No Content if successful" and nothing
# else -- no note on whether the address becomes free to re-add as a new
# id, whether it stays reserved, or a third thing. Buttondown's Recipe in
# this collection hits the identical wall for its own DELETE and says so in
# the same words this Recipe now borrows: not something this Recipe can
# check with no account to delete a subscriber from.
#
# `POST .../unsubscribe_all` and `POST .../remove` are both real, documented,
# and not modelled as routes: both take an empty or near-empty body ("None"
# and an optional `campaign_id`) and drive a fixed-value transition
# server-side, the identical gap Kit's Recipe in this collection states for
# its own `.../unsubscribe` endpoint -- Cauldron's update operation merges
# what a request sends, and a request sending nothing has nothing to merge.
#
# ## Absent tells from present-and-wrong, but not in the body
#
# Struck live today against `GET /v2/accounts`: no `Authorization` header
# at all, a well-formed `Authorization: Bearer junktoken12345`, and a
# well-formed `Authorization: Basic <junk>` all answer the identical
# 401 body --
#
#   {"errors":[{"code":"authentication_error","message":"Authentication
#   failed, check your credentials"}]}
#
# -- so by body alone this is a Buttondown-shaped collapse. It is not,
# once the headers are read: the two credential-present requests each
# carried `X-RateLimit-Limit: 3600` and a decrementing
# `X-RateLimit-Remaining` (3599, then 3598, confirmed across two separate
# calls with two different credential shapes); the credential-absent
# request carried neither header at all, on otherwise identical requests
# a few seconds apart. Drip's rate limiter runs *after* a credential has
# been recognised as a credential-shaped thing and *before* it is checked
# for validity, so a request that never tried to authenticate never
# touches the counter and a request that tried and failed does. That is a
# real, reproducible distinction this wire keeps -- just not in the field
# a client would normally read to find it. `auth.rejected_error` is
# declared below with `X-RateLimit-Limit` fixed at the value this Recipe
# observed both times; `X-RateLimit-Remaining` is deliberately not pinned
# to a specific number -- it is a live, per-request counter and any fixed
# value this Recipe wrote down would already be wrong by the time it
# shipped. `auth.absent_error` is declared with neither header, and the
# case below for it asserts their absence directly.
#
# ## Routing beats auth, and this host's 404 is the marketing site's own
#
# `auth.after_routing: true`, checked in every direction the mechanism
# supports -- an unrouted path and a real path with the wrong method both
# fall through to routing before any credential is examined, with or
# without one attached:
#
#   GET    /v2/this-is-not-a-real-endpoint   no cred   -> 404 (HTML)
#   GET    /v2/this-is-not-a-real-endpoint   junk cred -> 404 (identical)
#   PATCH  /v2/accounts                      no cred   -> 404 (identical)
#   DELETE /v2/accounts                      no cred   -> 404 (identical)
#
# Every one of those four is the exact same 6090-byte page, `Content-Type:
# text/html; charset=UTF-8`, titled "Page Not Found | Drip" -- not a bare
# API error at all, but Drip's own consumer-facing marketing site's 404,
# reachable at `www.getdrip.com` under the identical body and title. The
# REST API and the web application answer unrouted requests from the same
# router; there is no 405 anywhere on this host either, joining Constant
# Contact in this same batch and Turso elsewhere in this collection. The
# page is large and mostly font-face CSS nobody would ever branch on, so
# `errors.unknown_route` below declares a short, clearly-partial stand-in
# (title plus the two lines of visible copy) rather than the complete
# 6090 bytes, and every conformance case that touches it asserts by
# `body_matches` against that visible copy rather than the whole page.
#
# ## Two hosts, two credential mechanisms, one shared 404
#
# Drip's OAuth token endpoint lives on `www.getdrip.com`, not
# `api.getdrip.com` -- the same asymmetry Constant Contact's Recipe in
# this batch documents for its own OAuth host, though Drip's case is
# plainer: `GET https://www.getdrip.com/oauth/token` answers the identical
# "Page Not Found | Drip" page and status the API host's own unrouted
# paths do, because both hosts are the same Rails application. There is no
# separate authorization-server product here the way Constant Contact's
# Okta-fronted `authz.constantcontact.com` is one; OAuth and the REST API
# share one deployment.
#
# ## Content-Type tells the truth
#
# Every response this Recipe observed declared the Content-Type it actually
# sent: `application/json; charset=utf-8` on every JSON error, `text/html;
# charset=UTF-8` on the 404 page. Nothing here is mislabelled.
#
# ## Known fidelity gaps, stated rather than hidden
#
#   - No `upstream.spec`. `developer.drip.com` is a single, hand-written
#     Slate-generated HTML reference page (`Server: GitHub.com`) with no
#     OpenAPI or Swagger document anywhere on the domain --
#     `developer.drip.com/openapi.json` and `/swagger.json` both 404.
#     There is nothing this Recipe could fingerprint.
#   - `POST .../remove`, `POST .../unsubscribe_all`, tags, custom field
#     identifiers, and the batch API are real, documented endpoints and are
#     not modelled -- see the header sections above for the two that bear
#     directly on this group's question.
#   - `visitor_uuid` is a third, real way to address a subscriber
#     (`id_or_email_or_visitor_uuid`) beside `id` and `email`; this Recipe's
#     `alias` mechanism carries only one alternate name, so `email` is
#     wired and `visitor_uuid` is not.
#   - `sms_number`, `sms_consent`, `lead_score`, `lifetime_value`,
#     `prospect`, `original_referrer`, `landing_url`, `user_agent` and
#     `ip_address` are real, documented Subscriber properties and are not
#     modelled; this Recipe is about the email consent question.
#   - GET /v2/:account_id/subscribers documents `tags`, `subscribed_before`
#     and `subscribed_after` filters beside `status`; none are enforced by
#     this Recipe's fixture.
#
# Every case below not carrying a `verified:` date was read from
# developer.drip.com, not observed against a real account -- this Recipe
# was written with no credential and no account exists to create one
# against. The key below is a fixture and authenticates nothing.

recipe: drip
capability: marketing
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.drip.com/
  # No spec: see the header. Drip publishes no machine-readable
  # description anywhere on developer.drip.com.

auth:
  scheme: basic
  # "The API Token is the username portion of the Basic Authentication
  # scheme, with an empty password" -- developer.drip.com's own words.
  credential: username
  keys:
    - cauldron-drip-fixture-key-0000000000000000
  # See the header: the body never tells absent from present-and-wrong, but
  # the rate-limit headers do. absent_error carries neither header;
  # rejected_error carries the fixed X-RateLimit-Limit this Recipe observed
  # and no pinned Remaining value. malformed_error names the identical entry
  # as rejected_error -- Cauldron's own check calls a Bearer-shaped header
  # malformed against a Basic-scheme Recipe (the wrong shape for this
  # scheme) where a real key would be rejected (the right shape, wrong
  # value), a distinction struck live and found not to matter here: Drip
  # answered "Authorization: Bearer junktoken12345" and "Authorization:
  # Basic <junk>" with the byte-identical body and the identical rate-limit
  # headers, so this Recipe says the wire does not keep the distinction
  # Cauldron's own check is able to make.
  absent_error: authentication_missing
  malformed_error: authentication_rejected
  rejected_error: authentication_rejected
  after_routing: true

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    code_field: code

resources:
  account:
    collection: accounts
    # A seven-digit number, sent as a JSON string in the docs' own worked
    # example -- not a bare number, and not addressable by any other name.
    id:
      style: digits
    fields:
      name:
        type: string
      url:
        type: string
      default_from_name:
        type: string
      default_from_email:
        type: string
      primary_email:
        type: string
      created_at:
        type: datetime

  subscriber:
    collection: subscribers
    # A partition that lives in the path and is never repeated in the body
    # -- see resource.go's own field type for exactly this shape (Fly's
    # app_name is the type's other citation).
    id:
      style: opaque
      length: 21
    alias: email
    fields:
      account_id:
        type: string
        in: "-"
      email:
        type: string
      first_name:
        type: string
        null_when_unset: true
      # See the header for the field this whole Recipe exists to carry, and
      # for the two contradicting sentences Drip's own docs use to describe
      # writing it.
      status:
        type: string
        default: active
      time_zone:
        type: string
        default: Etc/UTC
      custom_fields:
        type: map
        default: {}
      # "granted" | "denied" | "unknown" -- see the header. No companion
      # timestamp is documented for this field on the Subscribers page.
      eu_consent:
        type: string
        null_when_unset: true
      created_at:
        type: datetime

routes:
  - method: GET
    path: /v2/accounts
    resource: account
    operation: list
    pagination:
      # Drip's own reference for this operation, read 2026-09-05, lists its
      # arguments as "None." It answers "all accounts the authenticated user
      # has access to", and an account list is small by construction.
      #
      # Drip does page elsewhere, and generously: its subscriber listing
      # takes page and per_page, where per_page is "the number of records to
      # be returned on each page. Defaults to 100. Maximum 1000." Copying
      # that onto this route would have been the obvious mistake, and it is
      # exactly the mistake an emulator makes when a Recipe says nothing.
      style: none

  - method: GET
    path: /v2/accounts/{id}
    resource: account
    operation: get

  - method: GET
    path: /v2/{account_id}/subscribers
    resource: subscriber
    operation: list
    scope: [account_id]
    pagination:
      style: page
      limit_param: per_page
      cursor_param: page
      first_page: 1
    list:
      count_field: meta.total_count

  - method: GET
    path: /v2/{account_id}/subscribers/{id}
    resource: subscriber
    operation: get
    scope: [account_id]

  - method: POST
    path: /v2/{account_id}/subscribers
    resource: subscriber
    operation: create
    scope: [account_id]

  - method: DELETE
    path: /v2/{account_id}/subscribers/{id}
    resource: subscriber
    operation: delete
    status: 204
    empty_body: true
    scope: [account_id]

errors:
  authentication_missing:
    status: 401
    code: authentication_error
    message: Authentication failed, check your credentials

  authentication_rejected:
    status: 401
    code: authentication_error
    message: Authentication failed, check your credentials
    headers:
      X-RateLimit-Limit: "3600"

  # A short, clearly-partial stand-in for the real 6090-byte marketing-site
  # page -- see the header for why the full page is not reproduced here.
  # Both unknown_route and method_not_allowed carry it: there is no 405 on
  # this host, so both reserved names answer the identical 404.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: |-
      <!DOCTYPE html>
      <html>
      <head>
        <title>Page Not Found | Drip</title>
      </head>
      <body>
        <h1><strong>Hello?</strong><br> This parallel universe is full of mystery and delight...</h1>
        <p>That page doesn't appear to exist here. <br><br><a href="/signin">Return Home</a></p>
      </body>
      </html>

  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: |-
      <!DOCTYPE html>
      <html>
      <head>
        <title>Page Not Found | Drip</title>
      </head>
      <body>
        <h1><strong>Hello?</strong><br> This parallel universe is full of mystery and delight...</h1>
        <p>That page doesn't appear to exist here. <br><br><a href="/signin">Return Home</a></p>
      </body>
      </html>

fixtures:
  empty: {}

  # "Acme, Inc." is the docs' own worked Account object. The subscriber
  # pair combines the general "Subscribers are represented as follows"
  # worked object (John Doe, id z1togz2hcjrkpp5treip) with a second,
  # never-subscribed record this Recipe added to give the create route
  # something plainly new to name -- see the header for why no
  # already-unsubscribed subscriber is exercised by a write here.
  small-account:
    account:
      - id: "9999999"
        name: "Acme, Inc."
        url: www.acme.com
        default_from_name: John Doe
        default_from_email: john@acme.com
        primary_email: john@acme.com
        created_at: "2013-06-21T10:31:58Z"

    subscriber:
      - id: z1togz2hcjrkpp5treip
        account_id: "9999999"
        first_name: John
        status: active
        time_zone: America/Los_Angeles
        custom_fields:
          shirt_size: Medium
        eu_consent: granted
        created_at: "2013-06-21T10:31:58Z"
        email: john@acme.com

conformance:
  - name: no Authorization header at all carries no rate-limit headers
    source: https://api.getdrip.com/v2/accounts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v2/accounts
    expect:
      status: 401
      absent_headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
      body:
        "errors[0].code": authentication_error
        "errors[0].message": Authentication failed, check your credentials

  - name: a well-formed but wrong Bearer token gets the identical sentence and a rate-limit header the absent case never carried
    source: https://api.getdrip.com/v2/accounts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v2/accounts
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      headers:
        X-RateLimit-Limit: "3600"
      body:
        "errors[0].code": authentication_error
        "errors[0].message": Authentication failed, check your credentials

  - name: a well-formed but wrong Basic credential gets the same treatment as a wrong Bearer token
    source: https://api.getdrip.com/v2/accounts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v2/accounts
      headers:
        Authorization: "Basic anVua3Rva2VuMTIzNDU6"
    expect:
      status: 401
      headers:
        X-RateLimit-Limit: "3600"
      body:
        "errors[0].message": Authentication failed, check your credentials

  - name: an unrouted path 404s with the marketing site's own page and no credential sent at all
    source: https://api.getdrip.com/v2/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v2/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "That page doesn't appear to exist here\\."

  - name: the same unrouted path answers identically with a junk credential attached
    source: https://api.getdrip.com/v2/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v2/this-is-not-a-real-endpoint
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 404
      body_matches: "That page doesn't appear to exist here\\."

  - name: a wrong method on a real path is a 404, not a 405
    source: https://api.getdrip.com/v2/accounts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: PATCH
      path: /v2/accounts
    expect:
      status: 404
      absent_headers:
        - Allow
      body_matches: "That page doesn't appear to exist here\\."

  - name: a listing wraps its array under accounts
    source: https://developer.drip.com/
    fixture: small-account
    request:
      method: GET
      path: /v2/accounts
      headers:
        Authorization: "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 200
      body:
        "accounts[0].id": "9999999"
        "accounts[0].name": "Acme, Inc."

  - name: status lives on the same persistent record as everything else about a subscriber
    source: https://developer.drip.com/
    fixture: small-account
    request:
      method: GET
      path: /v2/9999999/subscribers/z1togz2hcjrkpp5treip
      headers:
        Authorization: "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 200
      body:
        id: z1togz2hcjrkpp5treip
        status: active
        email: john@acme.com

  - name: the same subscriber is reachable by email as well as by id
    source: https://developer.drip.com/
    fixture: small-account
    request:
      method: GET
      path: /v2/9999999/subscribers/john@acme.com
      headers:
        Authorization: "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 200
      body:
        id: z1togz2hcjrkpp5treip

  - name: creating a plainly new subscriber accepts the fields the docs' own example sends
    # See the header: only ever exercised for an address with no prior
    # record, because Drip's own documentation contradicts itself about
    # what happens otherwise and this Recipe does not pick a side.
    source: https://developer.drip.com/
    fixture: small-account
    request:
      method: POST
      path: /v2/9999999/subscribers
      headers:
        Authorization: "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
      json:
        email: newperson@example.com
        time_zone: America/Los_Angeles
        custom_fields:
          shirt_size: Medium
    expect:
      status: 200
      body:
        email: newperson@example.com
        time_zone: America/Los_Angeles
        "custom_fields.shirt_size": Medium

  - name: deleting a subscriber answers no body at all
    source: https://developer.drip.com/
    fixture: small-account
    request:
      method: DELETE
      path: /v2/9999999/subscribers/z1togz2hcjrkpp5treip
      headers:
        Authorization: "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 204
      no_body: true

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the subscriber listing answers with what the fixture holds"
    source: "https://developer.drip.com/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/9999999/subscribers"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 200
      body:
        "subscribers[0].id": "z1togz2hcjrkpp5treip"
      absent:
        - "subscribers[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://developer.drip.com/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/9999999/subscribers"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb24tZHJpcC1maXh0dXJlLWtleS0wMDAwMDAwMDAwMDAwMDAwOg=="
    expect:
      status: 200
      absent:
        - "subscribers[0]"


