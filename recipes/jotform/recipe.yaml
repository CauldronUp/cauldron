# Jotform Recipe for Cauldron
#
# Third of this group's three, after typeform/recipe.yaml and
# formstack/recipe.yaml (formstack ships unmapped -- see docs/backlog.md --
# so read typeform's for the closest sibling). The group's question is
# whether a response still says what was asked once the question changes
# under it, and Jotform answers it more plainly than Typeform does.
#
# **A Jotform answer carries its own question label, inline, every time.**
# GET /submission/{id}'s own worked example (cited below, not observed --
# no key exists) shows each entry of "answers" as
# {"text": "Name", "type": "control_fullname", "answer": {...}}, keyed by a
# numeric qid ("3", "4"). The label and the type travel WITH the answer, on
# the answer's own object -- not a lookup key into something else. That is
# the opposite arrangement from Typeform, whose response carries only a
# field id and expects a caller to resolve it against the form; a Jotform
# answer is self-describing at read time even if the question has since
# changed. Nothing in Jotform's documentation states outright that this text
# is a snapshot frozen at submission time rather than a live join against
# the current form -- but the field's presence, self-contained, inside the
# answer object rather than referenced from it, is the shape a snapshot
# takes and a live join does not need. That inference is stated as an
# inference, not as an observed fact, because no key exists to submit a
# form, edit the question and read the old answer back to confirm it.
#
# **The qid a caller CANNOT get from a submission is the trap.** An answer's
# own object gives text and type -- the two things this Recipe's central
# question is about -- but not a dropdown's option list, a field's
# validation rule, or its sublabels (compare
# form-id-questions-response-sample below: sublabels is a property of the
# *question*, never sent on the answer). Getting those means joining qid
# against the CURRENT GET /form/{id}/questions, and the collection's own
# backlog entry names exactly why that join is unsafe: "Form fields are
# keyed by numeric ids that change when the form is edited, so yesterday's
# submission maps to today's form incorrectly." A deleted question's number
# is not documented as retired, and Jotform's own question-delete endpoint
# (delete-form-id-question-id-response-sample) answers only
# {"content": "QuestionID #{id} successfully deleted."} -- a confirmation
# sentence, nothing about what becomes of existing answers naming that qid.
# So the label on an old answer survives its question being deleted; the
# richer metadata a caller has to fetch separately does not, and a qid
# reused by a new question would hand that second fetch the wrong field's
# rules with no error anywhere.
#
# **Every credential failure is one sentence, and the sentence names the
# route.** Absent, empty, a bare single character, and a plausible
# 32-character hex string were all struck live against GET /user with no
# key: all four answered {"responseCode":401,"message":"You're not
# authorized to use (\/user) ", ...}, byte for byte. So this Recipe declares
# no absent/malformed/rejected split at all -- there is only one verdict
# here, worth stating explicitly rather than leaving the three fields unset
# by omission.
#
# What is NOT one sentence across routes is which route answered. Struck
# live, with no credential, on six different paths:
#
#   /user               -> "You're not authorized to use (\/user) "
#   /user/forms         -> "You're not authorized to use (\/user-forms) "
#   /user/submissions   -> "You're not authorized to use (\/user-submissions) "
#   /form/{id}          -> "You're not authorized to use (\/form-id) "
#   /form/{id}/questions -> "You're not authorized to use (\/form-id-questions) "
#   /form/{id}/submissions -> "You're not authorized to use (\/form-id-submissions) "
#   /submission/{id}    -> "You're not authorized to use (\/submission-id) "
#
# Six distinct sentences, one per matched route's own slug, not the literal
# path asked for (/form/999999999 answers "form-id", the placeholder name,
# never the number). Cauldron's own credential check fires before a route's
# identity is available to interpolate -- unlike the unrecognised-path and
# wrong-method failures below, which the runtime hands the literal request
# path as {detail}, the auth refusal is raised with no per-request detail at
# all. This Recipe pins the exact, live-verified sentence for GET
# /user/forms, its main listing route, as authentication_error, and every
# other route's auth-failure case below asserts the stable prefix
# ("You're not authorized to use") with `matches` rather than claiming a
# full-text match this runtime cannot produce for six routes from one
# declared message. That is a genuine format limitation, not a shortcut.
#
# **Auth is checked only once a route is matched -- verified with no
# credential sent at all.** GET /no-such-route-xyz answers 404
# {"responseCode":404,"message":"Requested URL (\/no-such-route-xyz) is not
# available!",...} -- the generic route error, not the auth one. And a
# method nothing is registered for gets the identical shape: PATCH /user,
# still with no credential, answers 404 "Requested URL (\/user) is not
# available!" -- the same sentence a bogus path gets, not a 405, and not the
# auth sentence either. So Jotform resolves the path AND the method before
# it ever asks who is calling, which is auth.after_routing, and it goes
# further than most of this collection's examples of that flag: a route
# that exists but was asked for with the wrong verb is not just exempt from
# the credential check, it is indistinguishable from a route that was never
# registered at all -- one 404 shape covers both. There is no 405 anywhere
# on this host reachable without a credential. Cauldron's own built-in
# method-not-allowed detail composes "METHOD /path" rather than the bare
# path Jotform actually names, so the wrong-method case below also uses
# `matches` rather than a full-text assertion -- a second instance of the
# same detail-interpolation gap the auth section above describes, on a
# different failure.
#
# **Regional hosts are real and answer identically; an invented one is not
# a third region, it is the marketing site.** Jotform's own docs name three
# API hosts: api.jotform.com (default), eu-api.jotform.com (EU),
# hipaa-api.jotform.com (HIPAA). eu-api.jotform.com was struck live: GET
# /user with no credential, a junk APIKEY, an unrouted path and a wrong
# method all answer byte-identically to api.jotform.com, including the
# "info" URL still reading "https://api.jotform.com/docs..." -- the EU
# host's own error message points at the wrong host's documentation. This is
# NOT the Clockify finding this group's brief pointed at ("any string in
# that position looks like every region"): an invented subdomain
# (xx99-api.jotform.com, randomnonsense.jotform.com) does NOT reach the API
# at all. It resolves to Jotform's marketing site and answers that site's
# own branded 404 page -- text/html, jotform.com cookies, a "Sorry, we
# couldn't find that page" title -- a completely different backend, with
# none of the JSON envelope headers (jf-trace-id, x-httpx-id) the real API
# host sends on every response, genuine or not. So a caller who mistypes the
# EU subdomain does not get a wrong-region answer indistinguishable from the
# right one; they get evidence, immediately, that they are not talking to
# the API at all -- the opposite of Clockify's finding, on the same
# question, in the same week.
#
# **The response envelope's own status-like field never once disagreed with
# the HTTP status, in every case checked.** responseCode reads 401 on every
# 401 struck, 404 on every 404, mirroring the transport status exactly --
# unlike providers this collection has found disagreeing (see mezmo's
# status: 401 as a JSON number on one failure and the literal string "error"
# on another, in the same provider). Modelled here as StatusField rather
# than as an extra claim: Jotform is the plain case.
#
# **The published example itself cannot answer whether count is a page size
# or a total**, and this Recipe declines to guess rather than pick a
# reading its own source cannot support. All three of Jotform's own worked
# list examples -- user-forms-response-sample, user-submissions-response-
# sample, and form-id-submissions-response-sample -- show resultSet.count
# exactly equal to resultSet.limit (20/20, 100/100), so nothing in Jotform's
# own documentation distinguishes "this page held 20 records" from "the
# whole account holds 20 records." No count_means is declared below; see
# response.go's own CountMeans field for the two readings this could be and
# why guessing wrong is invisible until a collection outgrows one page.
#
# **The rate limit lives in the body of every response, not in a header.**
# "limit-left" rides beside "content" on every call, success or not observed
# here since it never appeared on a struck error body -- and the FAQ states
# a per-DAY ceiling only (1000/10000/50000/100000 depending on plan), no
# per-minute figure anywhere. Contrast this group's surveymonkey/recipe.yaml,
# whose rate limiting is header-based and (per its own docs) states both a
# per-minute and a per-day figure -- two members of the same group, one
# with no headers for this at all and a counter that only success responses
# would carry, the other all headers and no body field.
#
# **A single form's own worked example wraps it in an array.**
# form-id-response-sample -- GET /form/{id}, a single resource fetch -- shows
# "content": [{...}] with one entry, byte-identical in shape to the list
# endpoint's own array. Modelled here with resource.array, the same
# mechanism Xero's Recipe in this collection needs for the opposite
# direction (see resource.go's own comment on Array). Whether that is really
# how the live API answers or a copy-paste from the list example in
# Jotform's own docs cannot be told without a credential, and this Recipe
# says so rather than picking the tidier reading. The same worked example
# also carries a trailing comma after its last property before the closing
# brace -- invalid JSON in Jotform's own published sample -- reproduced here
# only as a fact about the source, not in the fixture.
#
# **The same two fields are typed two different ways in Jotform's own two
# examples.** user-forms-response-sample sends "favorite": 0, "archived": 0
# as bare JSON numbers; form-id-response-sample sends "favorite": "0",
# "archived": "0" as quoted strings, on the same two field names describing
# the same form. This Recipe follows the list example's typing (integer)
# for both routes, because the format declares one type per field rather
# than one per route, and states the disagreement here rather than picking
# silently.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of the roughly twenty documented form fields and the dozen-plus
#     question and submission fields, a working subset is declared -- enough
#     to carry the central question, not the full schema.
#   - Every route's per-request "duration" and "info" body fields are
#     omitted: duration is a timing value that would be fabricated if
#     pinned, and info is a per-route documentation-anchor URL this format
#     cannot vary per route on one named error (see the auth section above).
#   - GET /form/{id}/questions and GET /form/{id}/submissions are not
#     scoped by form id: every form this Recipe is asked about answers with
#     the same catalogue, the choice this collection's fireworks/recipe.yaml
#     makes for the same reason -- no credential exists to prove two forms
#     answer differently.
#   - No create, update, or delete route is modelled anywhere, and no
#     submission was ever created to observe what a genuinely deleted
#     question's historical answer looks like -- see the header's inference
#     versus fact distinction.
#   - webhooks are entirely unmodelled.
#
# Every case below not carrying a verified date was read from
# https://api.jotform.com/docs/ (the embedded worked JSON samples for each
# endpoint, cited by section per case) rather than observed against a real
# account -- this Recipe was written with no API key and created no account.
# Keys below are fixtures, not secrets. The submission fixture's own values
# (Bart Simpson, "¡Ay, caramba!") are Jotform's own published placeholder
# example, not a real respondent's data.

recipe: jotform
capability: forms
version: 0.1.0

upstream:
  api: "1"
  docs: https://api.jotform.com/docs/

auth:
  scheme: header
  header: APIKEY
  keys:
    - CAULDRON0000JOTFORM0000FIXTURE0
  # No absent/malformed/rejected split -- see the header. An empty key, a
  # one-character key, a plausible 32-hex-character key and no key at all
  # all answered the identical sentence, live.
  #
  # Jotform also accepts this same key as an "apiKey" query parameter,
  # checked live and behaving identically on every failure path struck. That
  # used to be a stated gap here -- "this format can declare one transport per
  # Recipe, not two for the same credential" -- which was true when it was
  # written and is what auth.also was added for. Both are served now, so a
  # client using the query form is accepted here exactly as Jotform accepts
  # it, rather than refused by a fake stricter than its provider.
  also:
    - scheme: query
      param: apiKey
  after_routing: true

responses:
  list:
    style: wrapped
  resource:
    style: wrapped
    key: content
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"
    status_field: responseCode
    fields:
      content: ""

resources:
  form:
    collection: content
    id:
      style: digits
      length: 14
    fields:
      username:
        type: string
      title:
        type: string
        required: true
      height:
        type: string
      # ENABLED, DISABLED or DELETED -- a retired form is a status, not an
      # absence.
      status:
        type: string
        default: ENABLED
      created_at:
        type: string
      updated_at:
        type: string
      last_submission:
        type: string
      # A count, sent as a quoted string -- "5", not 5.
      new:
        type: string
      # The form's own running total of submissions. A different field from
      # resultSet.count on the listing envelope, which this Recipe declines
      # to interpret -- see the header. Also a quoted string.
      count:
        type: string
      type:
        type: string
        default: LEGACY
      # See the header: the single-form worked example types these as
      # quoted strings instead. Declared as integer here, following the
      # list example.
      favorite:
        type: integer
        default: 0
      archived:
        type: integer
        default: 0
      url:
        type: string

  question:
    collection: content
    id:
      style: digits
      length: 1
      field: qid
    fields:
      text:
        type: string
        required: true
      type:
        type: string
        required: true
      name:
        type: string
      order:
        type: string
      required:
        type: string
        default: "No"
      # Present only on questions with more than one input, e.g. a full
      # name field's prefix/first/middle/last/suffix. Declared as a map
      # because its keys are the question's own sub-field names, not a
      # fixed set.
      sublabels:
        type: map

  submission:
    collection: content
    id:
      style: digits
      length: 18
    fields:
      form_id:
        type: string
      ip:
        type: string
      created_at:
        type: string
      updated_at:
        type: string
      # ACTIVE or OVERQUOTA.
      status:
        type: string
        default: ACTIVE
      # "1" if unread -- a quoted string, not a boolean.
      new:
        type: string
      # Keyed by qid, each value {text, type, answer, prettyFormat} -- see
      # the header. Declared as map because that is the closest this
      # format has to an object keyed by a mutable identifier; the value's
      # own inner shape is not type-checked by this declaration.
      answers:
        type: map
      # Only sent when the form is connected to a workflow -- absent
      # otherwise, not modelled as null.
      workflowStatus:
        type: string
        required: false

routes:
  - method: GET
    path: /user/forms
    resource: form
    operation: list
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 20

  - method: GET
    path: /form/{id}
    resource: form
    operation: get
    # A single record, wrapped in a one-entry array -- see the header.
    envelope:
      array: true

  - method: GET
    path: /form/{form_id}/questions
    resource: question
    operation: list
    list:
      # An object keyed by qid, not an array -- see the header.
      style: map
    pagination:
      # Not paged. A form's questions come back whole, with no offset or
      # limit parameter documented anywhere on this route.
      limit_param: "-"
      cursor_param: "-"
      limit: 25

  - method: GET
    path: /form/{form_id}/submissions
    resource: submission
    operation: list
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 100

  - method: GET
    path: /submission/{id}
    resource: submission
    operation: get

errors:
  # The one credential-failure sentence this Recipe declares -- see the
  # header for why it cannot vary by route the way the live API's does.
  # Pinned exactly for GET /user/forms; every other route's case below
  # matches the stable prefix instead of the full text.
  #
  # The live sentence escapes its own slash -- "(\/user-forms) ", PHP's
  # json_encode default -- and Go's encoding/json does not, with no field
  # in this format to force it. The message below carries a plain slash, a
  # stated departure from the literal bytes struck live, not an unnoticed
  # one.
  authentication_error:
    status: 401
    message: "You're not authorized to use (/user-forms) "

  # Reused for both a genuinely unrecognised path and a wrong method on a
  # real one -- see the header. {detail} carries the literal request path
  # for the former; Cauldron's own built-in composes "METHOD /path" for the
  # latter, which is not what Jotform sends, so that case below matches the
  # stable prefix rather than the full text.
  unknown_route:
    status: 404
    message: "Requested URL ({detail}) is not available!"

  method_not_allowed:
    status: 404
    message: "Requested URL ({detail}) is not available!"

fixtures:
  empty: {}

  small-account:
    form:
      # Every field value is Jotform's own worked example
      # (user-forms-response-sample / form-id-response-sample), cited, not
      # observed.
      - id: "31504059977966"
        username: johnsmith
        title: Contact Us
        height: "1550"
        status: ENABLED
        created_at: "2013-06-24 18:43:21"
        updated_at: "2013-06-25 19:01:52"
        last_submission: "2013-06-25 19:04:52"
        new: "5"
        count: "755"
        type: LEGACY
        favorite: 0
        archived: 0
        url: http://www.jotformpro.com/form/31504059977966

    question:
      # form-id-questions-response-sample, verbatim.
      - qid: "1"
        text: Textbox Example
        type: control_textbox
        name: textboxExample1
        order: "1"
        required: "No"
      - qid: "2"
        text: Full Name
        type: control_fullname
        name: fullName2
        order: "1"
        required: "No"
        sublabels:
          prefix: Prefix
          first: First Name
          middle: Middle Name
          last: Last Name
          suffix: Suffix
      - qid: "3"
        text: Your Message
        type: control_textarea
        name: yourMessage
        order: "3"
        required: "No"

    submission:
      # submission-id-response-sample / form-id-submissions-response-sample,
      # verbatim. "Bart Simpson" and the exclamation are Jotform's own
      # published placeholder, not a real respondent's data.
      - id: "237955080346633702"
        form_id: "31751954731962"
        ip: 123.123.123.123
        created_at: "2013-06-25 03:38:00"
        updated_at: "2013-06-27 04:58:00"
        status: ACTIVE
        new: "1"
        answers:
          "3":
            text: Name
            type: control_fullname
            answer:
              first: Bart
              last: Simpson
            prettyFormat: Bart Simpson
          "4":
            text: Your Message
            type: control_textarea
            answer: "¡Ay, caramba!"
        workflowStatus: Approve

conformance:
  - name: no credential at all is refused with the route's own slug in the sentence
    source: https://api.jotform.com/user/forms
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /user/forms
    expect:
      status: 401
      body:
        responseCode: 401
        content: ""

  - name: and the exact wording names user-forms, not user
    source: https://api.jotform.com/user/forms
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /user/forms
    expect:
      status: 401
      body:
        message: "You're not authorized to use (/user-forms) "

  - name: a plausible 32-character key is refused identically to no key at all
    # Live: an unprefixed, hex-shaped, realistic-looking key answers the
    # byte-identical sentence a totally absent header does. There is no
    # absent/malformed/rejected split here at all.
    source: https://api.jotform.com/user/forms
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /user/forms
      headers:
        APIKEY: "0123456789abcdef0123456789abcdef"
    expect:
      status: 401
      body:
        message: "You're not authorized to use (/user-forms) "

  - name: a route this Recipe also declares is refused with its OWN sentence, not user-forms'
    # Live, on /form/{id}. Cauldron's own declared authentication_error is
    # pinned to /user/forms' exact wording (see the header), so this case
    # asserts only the stable shared prefix rather than claiming the full
    # text this runtime cannot vary per route from one declaration.
    source: https://api.jotform.com/form/123456789
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /form/123456789
    expect:
      status: 401
      matches:
        message: "You're not authorized to use"

  - name: an unrecognised path answers 404 naming the literal path, not the auth sentence
    # Live, no credential sent. Proves auth.after_routing: an unrouted path
    # is refused for its route before its credential is ever examined.
    source: https://api.jotform.com/no-such-route-xyz
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /no-such-route-xyz
    expect:
      status: 404
      body:
        responseCode: 404
        message: "Requested URL (/no-such-route-xyz) is not available!"

  - name: a wrong method on a real path answers the identical shape a missing path does, not a 405
    # Live: PATCH /user/forms, no credential, no Allow header, no 405
    # anywhere. Cauldron's own built-in method_not_allowed detail composes
    # "METHOD /path"; Jotform's real sentence names only the path, so this
    # asserts the stable prefix and the status rather than the full text --
    # see the header.
    source: https://api.jotform.com/user/forms
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: PATCH
      path: /user/forms
    expect:
      status: 404
      matches:
        message: "is not available"
      headers:
        Content-Type: application/json
      absent_headers:
        - Allow

  - name: an answer carries its own question label inline
    # The central finding. Cited from Jotform's own worked example
    # (submission-id-response-sample), not observed -- no key exists to
    # fetch a real submission.
    source: https://api.jotform.com/docs/#submission-id
    fixture: small-account
    request:
      method: GET
      path: /submission/237955080346633702
      headers:
        APIKEY: CAULDRON0000JOTFORM0000FIXTURE0
    expect:
      status: 200
      body:
        content.answers.3.text: Name
        content.answers.3.type: control_fullname
        content.answers.4.text: Your Message

  - name: a form is wrapped in a one-entry array, even for a single fetch
    source: https://api.jotform.com/docs/#form-id
    fixture: small-account
    request:
      method: GET
      path: /form/31504059977966
      headers:
        APIKEY: CAULDRON0000JOTFORM0000FIXTURE0
    expect:
      status: 200
      body:
        content[0].title: Contact Us
        content[0].favorite: 0

  - name: questions are keyed by qid in an object, not listed in an array
    source: https://api.jotform.com/docs/#form-id-questions
    fixture: small-account
    request:
      method: GET
      path: /form/31504059977966/questions
      headers:
        APIKEY: CAULDRON0000JOTFORM0000FIXTURE0
    expect:
      status: 200
      body:
        content.2.text: Full Name
        content.2.sublabels.first: First Name
      absent:
        - content[0]
