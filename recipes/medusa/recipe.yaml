# Medusa Recipe for Cauldron
#
# Written against Medusa's published OpenAPI description rather than from
# memory: the Storefront API spec at version 2.19.0, fetched from the
# medusajs/medusa repository. Where this file quotes the provider it is
# quoting that document, which is a stronger provenance than most Recipes
# here have and is worth saying plainly. What it is not is evidence that the
# implementation matches its own spec.
#
# The sharpest thing in it is one sentence about a query parameter:
#
#   "if a field is prefixed with + it will be added to the default fields,
#    using - will remove it from the default fields. without prefix it will
#    replace the entire default fields."
#
# So ?fields=id does not give you an order with its id emphasised. It gives
# you an order with nothing else at all -- no total, no status, no email --
# and it is not an error. A developer adding one field to a response gets a
# response with one field, and the code that reads the rest starts finding
# undefined everywhere for a reason that is documented in a sentence nobody
# reads twice.
#
# Six things worth modelling exactly:
#
#   1. fields without a prefix replaces the defaults. With + it adds. The
#      difference between the two is one character and the failure is total.
#   2. x-publishable-api-key is required on every store route, and it is not
#      the credential. Authentication is separate, so a valid token with no
#      key is refused and the refusal is about the key.
#   3. There are two statuses and both have a "canceled". payment_status has
#      ten values and fulfillment_status has eight, four of them beginning
#      "partially_", so "is this order done" is not one comparison and no
#      single boolean is right.
#   4. An order carries seven totals: total, subtotal, item_total,
#      original_total, tax_total, discount_total and shipping_total. They
#      are all numbers and all correct, and which one a report wants depends
#      on the question rather than on the name.
#   5. id is a string and display_id is a number, and the number is the one
#      the customer quotes. Joining on the wrong one finds nothing.
#   6. Paging is offset and limit, echoed at the top of the body beside the
#      array along with a count -- so the first page reports offset nought
#      rather than page one.
#
# Checked live 2026-09-05 for anything reachable, and there is nothing to
# probe. Medusa is a self-hosted headless commerce engine, not a service
# its maintainers run for everyone -- there is no api.medusajs.com (the
# hostname does not resolve at all) and no shared multi-tenant host the way
# api.stripe.com is one, only whatever a given store's operator deployed.
# No case below carries a verified date for that reason: any reachable
# Medusa instance on the public internet belongs to a specific merchant's
# store, not to Medusa itself.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - fields is modelled for two shapes: the bare form that replaces, and one
#     + form that adds. The real parameter takes any comma-separated list of
#     any field, and a route here matches one member at a time.
#   - Only the Storefront API is modelled. Medusa also has an Admin API with
#     its own credential and its own shapes, and a client for one does not
#     read the other.
#   - Carts, checkout, payment collections and the customer account routes
#     are absent. Only orders are modelled.
#   - Medusa is self-hosted, so the version above is the version this was
#     written against and not the version anybody is running.
#
# The credentials below are fixtures, not secrets. They belong to no store.

recipe: medusa
capability: commerce
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.medusajs.com/api/store

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_medusa_customer_jwt

# Required on every store route, and not the credential. The spec marks it
# required: true, and it selects which sales channel the request is about --
# so a valid token with no key is refused, and the refusal is about the key
# rather than about the token.
required_headers:
  x-publishable-api-key: missing_publishable_key

responses:
  list:
    style: wrapped
    key: orders
    # Beside the array rather than nested, which is unusual enough to be
    # worth pinning: most providers in this repository put these inside
    # something.
    count_field: count
    limit_field: limit
    page_field: offset
  resource:
    style: wrapped
    key: order
  error:
    style: flat
    message_field: message
    code_field: type
    type_field: "-"

resources:
  order:
    id:
      # A string, prefixed. The number the customer quotes is display_id
      # below.
      style: prefixed
      prefix: order_
      length: 26
    fields:
      # What the customer sees on their confirmation. A number, beside an id
      # that is not.
      display_id:
        type: integer
      email:
        type: string
      currency_code:
        type: string
        default: usd
      # Ten values, one of which is canceled. captured is the one that means
      # the money arrived.
      payment_status:
        type: string
        default: not_paid
      # Eight values, one of which is also canceled, and four of which begin
      # partially_.
      fulfillment_status:
        type: string
        default: not_fulfilled
      # Seven totals, all numbers, all correct. Which one a report wants
      # depends on the question.
      total:
        type: number
      subtotal:
        type: number
      item_total:
        type: number
      original_total:
        type: number
      tax_total:
        type: number
      discount_total:
        type: number
      shipping_total:
        type: number
      created_at:
        type: datetime

routes:
  # fields with a leading plus adds to the defaults, so the order comes back
  # whole with the named field alongside.
  - method: GET
    path: /store/orders/{id}
    resource: order
    operation: get
    matches_query:
      fields: +email
    returns:
      - id
      - display_id
      - email
      - currency_code
      - payment_status
      - fulfillment_status
      - total
      - subtotal
      - item_total
      - original_total
      - tax_total
      - discount_total
      - shipping_total
      - created_at

  # And without a prefix it replaces them. The order comes back with the one
  # field asked for and nothing else, which is not an error.
  - method: GET
    path: /store/orders/{id}
    resource: order
    operation: get
    matches_query:
      fields: id
    returns:
      - id

  # The default shape, for a request that did not ask. It has no email in
  # it, which is what makes the route above worth having: without that
  # difference the + form and the default answer identically and a case
  # asserting the + form proves nothing. A mutation found exactly that.
  - method: GET
    path: /store/orders/{id}
    resource: order
    operation: get
    returns:
      - id
      - display_id
      - currency_code
      - payment_status
      - fulfillment_status
      - total
      - subtotal
      - item_total
      - original_total
      - tax_total
      - discount_total
      - shipping_total
      - created_at

  - method: GET
    path: /store/orders
    resource: order
    operation: list
    pagination:
      style: offset
      limit: 50
      limit_param: limit
      cursor_param: offset
      # Offsets start at nought, so the first page reports nought rather than
      # one.
      first_page: 0

errors:
  missing_publishable_key:
    status: 400
    code: not_allowed
    message: Publishable API key required in the request header.

  authentication_error:
    status: 401
    code: unauthorized
    message: Unauthorized

  resource_missing:
    status: 404
    code: not_found
    message: Order with id was not found

  parameter_missing:
    status: 400
    code: invalid_data
    message: Invalid request

  rate_limit:
    status: 429
    code: too_many_requests
    message: Too many requests

fixtures:
  empty: {}

  one-store:
    order:
      # Paid and shipped, but only partly on both counts -- which is an
      # ordinary state and reads as neither done nor undone.
      - id: order_01JQCAULDRON0000000000001
        display_id: 41
        email: buyer@example.com
        currency_code: eur
        payment_status: partially_captured
        fulfillment_status: partially_shipped
        total: 118.75
        subtotal: 100.00
        item_total: 100.00
        original_total: 125.00
        tax_total: 23.75
        discount_total: 5.00
        shipping_total: 0.00
        created_at: "2026-02-01T09:15:00.000Z"
      # Cancelled on both counts, which is the same word in two enums that
      # do not otherwise overlap.
      - id: order_01JQCAULDRON0000000000002
        display_id: 42
        email: other@example.com
        currency_code: eur
        payment_status: canceled
        fulfillment_status: canceled
        total: 0
        subtotal: 40.00
        item_total: 40.00
        original_total: 40.00
        tax_total: 0
        discount_total: 0
        shipping_total: 0
        created_at: "2026-02-02T11:00:00.000Z"

conformance:
  - name: asking for one field returns only that field
    source: https://docs.medusajs.com/api/store#select-fields-and-relations
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001?fields=id
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      # Not an error. An order with one field, because the spec says a field
      # without a prefix replaces the entire default set -- so a developer
      # adding one field to a response gets a response with one field.
      status: 200
      body:
        order.id: order_01JQCAULDRON0000000000001
      absent:
        # Everything else, silently.
        - order.total
        - order.payment_status
        - order.email
        - order.display_id

  - name: the default response has no email in it
    source: https://docs.medusajs.com/api/store#select-fields-and-relations
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        order.total: 118.75
        order.payment_status: partially_captured
      absent:
        # Which is why anybody reaches for fields in the first place, and
        # where the trap starts.
        - order.email

  - name: and asking with a plus adds it without losing the rest
    source: https://docs.medusajs.com/api/store#select-fields-and-relations
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001?fields=%2Bemail
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # The email arrives and everything else stays. The difference between
        # this and the case above it is one character in a query string, and
        # the failure that character prevents is total.
        order.email: buyer@example.com
        order.total: 118.75
        order.payment_status: partially_captured

  - name: a request without the publishable key is refused
    source: https://docs.medusajs.com/api/store#publishable-api-key
    fixture: one-store
    request:
      method: GET
      path: /store/orders
      headers:
        # A valid customer token, and nothing else. The spec marks the key
        # required on every store route.
        Authorization: Bearer cauldron_medusa_customer_jwt
    expect:
      status: 400
      body:
        # And the refusal is about the key rather than about the token, which
        # is the useful half: an integration that has authenticated correctly
        # is told what is actually missing.
        message: Publishable API key required in the request header.
        type: not_allowed

  - name: two statuses and neither is a boolean
    source: https://docs.medusajs.com/api/store#orders
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # Partly paid and partly shipped, which is an ordinary state. Ten
        # payment values and eight fulfilment ones, four of them beginning
        # partially_, so "is this order done" is not one comparison and any
        # boolean derived from either field alone is wrong for this order.
        order.payment_status: partially_captured
        order.fulfillment_status: partially_shipped

  - name: both statuses can say canceled
    source: https://docs.medusajs.com/api/store#orders
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000002
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # The one word the two enums share. Code that switches on a status
        # without knowing which field it came from cannot tell a cancelled
        # payment from a cancelled shipment.
        order.payment_status: canceled
        order.fulfillment_status: canceled

  - name: an order carries seven totals
    source: https://docs.medusajs.com/api/store#orders
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # All numbers, all correct, and which one a report wants depends on
        # the question rather than the name. original_total is before the
        # discount, subtotal is after it and before tax, total is everything.
        order.total: 118.75
        order.subtotal: 100
        order.original_total: 125
        order.tax_total: 23.75
        order.discount_total: 5
        order.shipping_total: 0

  - name: the identifier the customer quotes is not the identifier the API takes
    source: https://docs.medusajs.com/api/store#orders
    fixture: one-store
    request:
      method: GET
      path: /store/orders/order_01JQCAULDRON0000000000001
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # A prefixed string in the path, and a plain number on the
        # confirmation email. Looking an order up by the number a customer
        # read out is a 404.
        order.id: order_01JQCAULDRON0000000000001
        order.display_id: 41

  - name: paging is echoed beside the array rather than inside anything
    source: https://docs.medusajs.com/api/store#pagination
    fixture: one-store
    request:
      method: GET
      path: /store/orders
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        orders[0].display_id: 41
        # At the top of the body, which is unusual: most providers here nest
        # these. And the first page reports an offset of nought rather than a
        # page of one.
        count: 2
        limit: 50
        offset: 0
      absent:
        - meta
        - pagination

  - name: and an offset skips rather than pages
    source: https://docs.medusajs.com/api/store#pagination
    fixture: one-store
    request:
      method: GET
      path: /store/orders?limit=1&offset=1
      headers:
        Authorization: Bearer cauldron_medusa_customer_jwt
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 200
      body:
        # The second order, by skipping one rather than by asking for page
        # two.
        orders[0].display_id: 42
        offset: 1
        limit: 1
        count: 2
      absent:
        - orders[1]

  - name: a bad token is refused after the key is accepted
    source: https://docs.medusajs.com/api/store
    fixture: one-store
    request:
      method: GET
      path: /store/orders
      headers:
        Authorization: Bearer not_the_token
        x-publishable-api-key: pk_cauldron_0000000000
    expect:
      status: 401
      body:
        type: unauthorized

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://docs.medusajs.com/api/store#pagination"
    fixture: one-store
    request:
      method: GET
      path: "/store/orders"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron_medusa_customer_jwt"
        "x-publishable-api-key": "pk_cauldron_0000000000"
    expect:
      status: 200
      body:
        "orders[0].id": "order_01JQCAULDRON0000000000001"
      absent:
        - "orders[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://docs.medusajs.com/api/store#pagination"
    fixture: one-store
    request:
      method: GET
      path: "/store/orders"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron_medusa_customer_jwt"
        "x-publishable-api-key": "pk_cauldron_0000000000"
    expect:
      status: 200
      body:
        "orders[0].id": "order_01JQCAULDRON0000000000002"
      absent:
        - "orders[1]"

  # The names. This Recipe declares 3 field(s) on a order that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an order carries the field names this Recipe declares"
    source: "https://docs.medusajs.com/api/store#pagination"
    fixture: one-store
    request:
      method: GET
      path: "/store/orders"
      headers:
        "Authorization": "Bearer cauldron_medusa_customer_jwt"
        "x-publishable-api-key": "pk_cauldron_0000000000"
    expect:
      status: 200
      body:
        "orders[0].created_at": "2026-02-01T09:15:00.000Z"
        "orders[0].currency_code": "eur"
        "orders[0].item_total": 100


