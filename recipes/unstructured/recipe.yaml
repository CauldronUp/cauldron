# Unstructured Recipe for Cauldron
#
# The workflow listing from the Unstructured Platform API, read from the
# OpenAPI document served without a credential at
# platform.unstructuredapp.io/openapi.json, and struck live on 2026-09-13 with
# no header, with a malformed key, with a bearer token, on a path that does not
# exist, and with a method the path does not take.
#
# **The path without the trailing slash redirects to http.** Struck live:
#
#   GET https://platform.unstructuredapp.io/api/v1/workflows
#   HTTP/1.1 307 Temporary Redirect
#   location: http://platform.unstructuredapp.io/api/v1/workflows/
#
# The request arrived over TLS and the address it is sent to has none. A 307
# preserves the method and the body, so a client that follows redirects
# automatically repeats the request -- credential header included -- at a
# cleartext URL, unless its own stack refuses the downgrade.
#
# **And the slash is the API's convention.** `/api/v1/workflows/`,
# `/api/v1/sources/`, `/api/v1/destinations/`, `/api/v1/jobs/` and
# `/api/v1/templates/` all end in one, while every item path under them does
# not -- and `/api/v1/notifications` does not either, so the convention is not
# consistent inside its own document. The address a person would write by hand
# is the one that redirects.
#
# **A bearer token is a 500.** The 401 says "provide either Bearer token or API
# key in header". Sending the first of the two:
#
#   Authorization: Bearer notarealkey   500  {"detail":"Internal Server Error verifying token"}
#
# One of the two credential kinds the failure recommends crashes the verifier,
# and the crash is reported as the server's fault in the caller's words.
#
# **A malformed key is answered with typing advice.** "Failed to authenticate
# API Key: API key is malformed, please type the API key correctly in the
# header." -- "please type ... correctly", to a program.
#
# **The document declares no security at all.** `components.securitySchemes` is
# `null`. The credential appears instead as an ordinary header parameter on
# every operation, `required: false`, typed `anyOf: [string, null]` -- so the
# contract says the key is optional and may be null, on an API that answers 401
# without it, and a generated client's signature makes it optional too.
#
# **A workflow type enum contains a price.** `WorkflowType` is
# `["basic", "advanced", "platinum", "custom"]`: three descriptions of a
# workflow's structure and one plan name.
#
# **A listing can be asked for the deleted ones.** `show_only_soft_deleted` is a
# query parameter, `anyOf: [boolean, null]`, default `false` -- so soft-deleted
# workflows are a filter away, and the flag is nullable as well as boolean.
#
# **`page` and `page_size` are nullable integers with defaults.** `anyOf:
# [integer, null]` with `default: 1` and `default: 20`, so the paging position
# has three states and one of them is null.
#
# And the operation declares a 200 and a 422 and nothing else, on an API that
# answered 401, 404, 405 and 500 in the probes above -- so drift reports every
# failure this Recipe serves as unbacked, and each report is right.
#
# Also pinned: `key` on the record is
# an unlabelled nullable string beside `id`; and `sources` and `destinations`
# are arrays of bare uuids while `workflow_nodes` beside them carries whole
# objects.

recipe: unstructured
capability: ai
version: 0.1.0

upstream:
  api: "3.2.0"
  docs: https://docs.unstructured.io/api-reference/workflow/overview
  spec: https://platform.unstructuredapp.io/openapi.json
  spec_hash: 977e22efe28dbd667bc4d4577df4070cffbe844ea3ec630af68f7695efe4a782
  spec_seen: "2026-09-13"

auth:
  # Declared in the document as an ordinary header parameter, required: false.
  scheme: header
  header: unstructured-api-key
  keys:
    - cauldr0nf1xturek3y000000000000000000000000
  absent_error: authentication_required
  rejected_error: api_key_malformed
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  workflow:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      # An unlabelled nullable string, beside the identifier.
      key:
      # Bare uuids, where workflow_nodes below carries whole objects.
      sources:
        type: list
      destinations:
        type: list
      # basic, advanced, platinum, custom.
      workflow_type:
      workflow_nodes:
        type: list
      schedule:
      status:
        type: string
      reprocess_all:
        type: boolean
      skip_preflight:
        type: boolean
      created_at:
        type: string
      updated_at:

routes:
  - method: GET
    # The address a person writes by hand, which is a redirect to cleartext.
    path: /api/v1/workflows
    public: true
    error: trailing_slash_redirect

  - method: GET
    path: /api/v1/workflows/
    resource: workflow
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 20
      limit_param: page_size
      cursor_param: page
    filters:
      - param: status
        field: status

errors:
  trailing_slash_redirect:
    status: 307
    # Content-Length: 0, and the method and body preserved.
    empty: true
    headers:
      # The request came in over TLS. This did not.
      Location: http://platform.unstructuredapp.io/api/v1/workflows/

  authentication_required:
    status: 401
    # Naming two credential kinds, one of which answers 500.
    message: "Authentication required: provide either Bearer token or API key in header."

  api_key_malformed:
    status: 401
    # "please type ... correctly", said to a program.
    message: "Failed to authenticate API Key: API key is malformed, please type the API key correctly in the header."

  method_not_allowed:
    status: 405
    message: Method Not Allowed

  unknown_route:
    status: 404
    message: Not Found

fixtures:
  empty:
    workflow: []

  workspace:
    workflow:
      - id: 9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e
        name: handbook-ingest
        key: null
        sources:
          - 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        destinations:
          - 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
        # Three descriptions of a structure, and a plan name.
        workflow_type: advanced
        workflow_nodes:
          - id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
            name: Partitioner
            type: partition
            subtype: vlm
            settings:
              provider: anthropic
        schedule:
          crontab_entries:
            - cron_expression: 0 0 * * *
        status: active
        reprocess_all: false
        skip_preflight: false
        created_at: "2026-05-11T13:41:02.115Z"
        updated_at: "2026-09-02T08:20:19.004Z"
      - id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
        name: scratch
        key: legacy-scratch
        sources: []
        destinations: []
        # The plan name, as a workflow type.
        workflow_type: platinum
        workflow_nodes: []
        schedule: null
        status: inactive
        reprocess_all: true
        skip_preflight: true
        created_at: "2026-08-01T00:00:00.000Z"
        # Nullable, where created_at beside it is required.
        updated_at: null

conformance:
  - name: the address without the slash redirects to cleartext
    source: https://platform.unstructuredapp.io/api/v1/workflows
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows
      headers: {}
    expect:
      # A 307 preserves the method and the body.
      status: 307
      no_body: true
      headers:
        # The request arrived over TLS and this has none.
        Location: http://platform.unstructuredapp.io/api/v1/workflows/

  - name: the failure names two credential kinds
    source: https://platform.unstructuredapp.io/api/v1/workflows/
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers: {}
    expect:
      status: 401
      body:
        # One of the two answers 500 when you send it.
        detail: "Authentication required: provide either Bearer token or API key in header."

  - name: a malformed key is answered with typing advice
    source: https://platform.unstructuredapp.io/api/v1/workflows/
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: notarealkey
    expect:
      status: 401
      body:
        # "please type the API key correctly in the header", to a program.
        detail: "Failed to authenticate API Key: API key is malformed, please type the API key correctly in the header."

  - name: a wrong method on the slashed path is a proper 405
    source: https://platform.unstructuredapp.io/api/v1/workflows/
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: PUT
      path: /api/v1/workflows/
      headers: {}
    expect:
      status: 405
      body:
        detail: Method Not Allowed

  - name: an unrouted path is two words
    source: https://platform.unstructuredapp.io/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        detail: Not Found

  - name: a workflow type enum contains a price
    source: https://platform.unstructuredapp.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: cauldr0nf1xturek3y000000000000000000000000
    expect:
      status: 200
      body:
        # ["basic", "advanced", "platinum", "custom"].
        '[0].workflow_type': advanced
        '[1].workflow_type': platinum
        '[0].status': active
        '[1].status': inactive

  - name: bare identifiers on one side and whole objects on the other
    source: https://platform.unstructuredapp.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: cauldr0nf1xturek3y000000000000000000000000
    expect:
      status: 200
      body:
        # sources and destinations are arrays of uuids...
        '[0].sources[0]': 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        '[0].destinations[0]': 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
        # ...and workflow_nodes beside them is an array of objects.
        '[0].workflow_nodes[0].name': Partitioner
        '[0].workflow_nodes[0].type': partition
        '[0].workflow_nodes[0].subtype': vlm
        '[0].workflow_nodes[0].settings.provider': anthropic
        '[1].sources': []
        '[1].workflow_nodes': []

  - name: the schedule is a list of cron expressions in strings
    source: https://platform.unstructuredapp.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: cauldr0nf1xturek3y000000000000000000000000
    expect:
      status: 200
      body:
        '[0].schedule.crontab_entries[0].cron_expression': 0 0 * * *
        '[1].schedule': null
        # An unlabelled nullable string, beside the identifier.
        '[0].key': null
        '[1].key': legacy-scratch
        '[0].name': handbook-ingest
        '[0].reprocess_all': false
        '[1].reprocess_all': true
        '[0].skip_preflight': false
        '[1].skip_preflight': true
        '[0].created_at': "2026-05-11T13:41:02.115Z"
        '[0].updated_at': "2026-09-02T08:20:19.004Z"
        '[1].updated_at': null

  - name: a listing can be narrowed to the inactive ones
    source: https://platform.unstructuredapp.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: cauldr0nf1xturek3y000000000000000000000000
      query:
        status: inactive
        page: "1"
        page_size: "20"
    expect:
      status: 200
      body:
        '[0].id': 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
        '[0].name': scratch

  - name: a workspace with no workflows answers a bare empty array
    source: https://platform.unstructuredapp.io/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/workflows/
      headers:
        unstructured-api-key: cauldr0nf1xturek3y000000000000000000000000
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
