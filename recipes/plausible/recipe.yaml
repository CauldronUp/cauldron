# Plausible Recipe for Cauldron
#
# Written against Plausible's Sites API reference at plausible.io/docs and
# struck live against plausible.io on 2026-09-11 with no credential, with a
# deliberately invalid one, with a header carrying no scheme, on a second
# endpoint, and on a path that does not exist.
#
# **The two credential sentences are the best in this collection.** Struck
# live:
#
#   (no header)      401 {"error":"Missing API key. Please use a valid
#                         Plausible API key as a Bearer Token."}
#
#   Bearer notreal   401 {"error":"Invalid API key. Please make sure you're
#                         using a valid API key with access to the resource
#                         you've requested."}
#
# The first names the failure, the product and the scheme -- a caller who sent
# nothing is told what to send and how to send it. The second names the failure
# and then hedges, correctly, on scope: "with access to the resource you've
# requested" covers the case where the key is real and not entitled, which most
# providers here either answer with a bare 403 or do not distinguish at all.
#
# After seven providers in this collection that answer "invalid key" to a
# request carrying none, this is the pair to hold them against.
#
# **And a header with no scheme is still reported as missing.** `Authorization:
# notreal` -- present, non-empty, missing only the word Bearer -- answers
# "Missing API key". So the one caller who demonstrably sent something is told
# it sent nothing, which is the third time this shape has turned up here after
# [wise](../wise) and [todoist](../todoist).
#
# **A second endpoint gives a different sentence, and it admits it cannot tell
# two failures apart.** `/api/v1/stats/aggregate` with a wrong key answers:
#
#   {"error":"Invalid API key or site ID. Please make sure you're using a valid
#             API key with access to the site you've requested."}
#
# "Invalid API key **or site ID**" is an endpoint saying plainly that it does
# not know which of the two the caller got wrong -- because answering
# accurately would tell an unauthenticated stranger whether a given site
# exists. Honest about a limit imposed by a real constraint, in a sentence, on
# the wire. Nothing else here does that.
#
# **And then the 404 is the dashboard.** An unknown path under `/api/v1/`
# answers the Plausible web application's own 404 page: `text/html`, an
# apple-touch-icon, a viewport meta tag. So the three failures on this host are
# two carefully written JSON sentences and a web page.
#
# **A site has no identifier except its domain.** The record is
# `{domain, timezone}` and nothing else -- so the primary key is the thing a
# customer changes when they move hosts, and a site that is renamed is, to any
# client holding a reference, a different site that has appeared while the old
# one vanished.
#
# **`meta` carries both cursors and no total.** `{"after": null, "before":
# null, "limit": 100}` -- the two directions are always present and null on a
# single page, so a client testing for the key's presence to decide whether to
# page never stops. There is no count anywhere.
#
# **And a team can exist and not be reachable.** `/api/v1/sites/teams` returns
# each team with `api_available`, false on the personal one -- the API listing,
# in its own response, which of your teams it will refuse to serve.

recipe: plausible
capability: analytics
version: 0.1.0

upstream:
  api: v1
  docs: https://plausible.io/docs/sites-api
  # No spec: Plausible publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-plaus1ble-f1xture-key
  absent_error: missing_api_key
  rejected_error: invalid_api_key
  # A header carrying no scheme answers the missing-key sentence, word for
  # word, rather than a malformed one.
  malformed_error: missing_api_key
  after_routing: true

responses:
  list:
    style: wrapped
    key: sites
    cursor_field: meta.after
    prev_field: meta.before
    limit_field: meta.limit
    # Both directions are always present and null on a single page.
    cursor_null: true
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  site:
    id:
      # The domain is the identifier. There is no other field on the record.
      field: domain
      style: opaque
    fields:
      timezone:
        type: string

  team:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      # The API saying which of your teams it will not serve.
      api_available:
        type: boolean

routes:
  - method: GET
    path: /api/v1/sites
    resource: site
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: after

  - method: GET
    path: /api/v1/sites/teams
    resource: team
    operation: list
    list:
      key: teams
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: after

errors:
  missing_api_key:
    status: 401
    # Names the failure, the product and the scheme.
    message: "Missing API key. Please use a valid Plausible API key as a Bearer Token."

  invalid_api_key:
    status: 401
    # Names the failure and hedges correctly on scope.
    message: "Invalid API key. Please make sure you're using a valid API key with access to the resource you've requested."

  unknown_route:
    status: 404
    # The web application's own 404 page, on an API path.
    style: text
    message: "<!DOCTYPE html><html lang=\"en\" class=\"h-full plausible\"><head><meta charset=\"utf-8\"><title>Plausible</title></head></html>"
    headers:
      Content-Type: text/html; charset=utf-8

fixtures:
  empty:
    site: []
    team: []

  account:
    site:
      - domain: test-domain1.com
        timezone: Europe/London
      - domain: test-domain2.com
        timezone: America/Toronto
    team:
      - id: 4d3dae3b-2a44-4aaa-baac-6bb55234a435
        name: My Personal Sites
        # Real, listed, and not reachable through the API.
        api_available: false
      - id: ef828bca-8a1b-49f6-b829-dee1c9f7d628
        name: Some Team
        api_available: true

conformance:
  - name: a missing key is told what to send and how
    source: https://plausible.io/api/v1/sites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers: {}
    expect:
      status: 401
      body:
        # The failure, the product and the scheme, in one sentence.
        error: "Missing API key. Please use a valid Plausible API key as a Bearer Token."

  - name: a wrong key hedges correctly on scope
    source: https://plausible.io/api/v1/sites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # "with access to the resource you've requested" covers a key that is
        # real and not entitled, which most providers here answer with a bare
        # 403 or do not distinguish at all.
        error: "Invalid API key. Please make sure you're using a valid API key with access to the resource you've requested."

  - name: a header with no scheme is reported as missing
    source: https://plausible.io/api/v1/sites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        # Present, non-empty, missing only the word Bearer.
        Authorization: "notreal"
    expect:
      status: 401
      body:
        # Word for word the missing-key sentence, so the one caller that
        # demonstrably sent something is told it sent nothing.
        error: "Missing API key. Please use a valid Plausible API key as a Bearer Token."

  - name: an unknown path is the dashboards own 404 page
    source: https://plausible.io/api/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Two carefully written JSON sentences and then a web page.
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: 'DOCTYPE html'

  - name: sites are wrapped beside a meta object
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
    expect:
      status: 200
      body:
        'sites[0].domain': test-domain1.com
        'sites[0].timezone': Europe/London

  - name: a site has no identifier except its domain
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
    expect:
      status: 200
      body:
        # Two fields, and the primary key is the one a customer changes when
        # they move hosts.
        'sites[1].domain': test-domain2.com
        'sites[1].timezone': America/Toronto
      absent:
        - 'sites[1].id'

  - name: both cursors are present and null on a single page
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
    expect:
      status: 200
      body:
        # So a client testing for the key's presence to decide whether to page
        # never stops, and there is no count anywhere to fall back on.
        'meta.before': null
        'meta.after': null
        'meta.limit': 100

  - name: sites page on a cursor called after
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
      query:
        limit: "1"
        after: test-domain1.com
    expect:
      status: 200
      body:
        'sites[0].domain': test-domain2.com

  - name: a team can be listed and not reachable
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites/teams
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
    expect:
      status: 200
      body:
        # The API saying, in its own listing, which of your teams it will
        # refuse to serve.
        'teams[0].name': My Personal Sites
        'teams[0].api_available': false
        'teams[1].api_available': true

  - name: teams page on the same two parameters
    source: https://plausible.io/docs/sites-api
    fixture: account
    request:
      method: GET
      path: /api/v1/sites/teams
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
      query:
        limit: "1"
        after: 4d3dae3b-2a44-4aaa-baac-6bb55234a435
    expect:
      status: 200
      body:
        # Teams have a real identifier where sites have only a domain, so the
        # two listings on one API are keyed differently.
        'teams[0].id': ef828bca-8a1b-49f6-b829-dee1c9f7d628
        'teams[0].name': Some Team

  - name: an account with no sites answers an empty array
    source: https://plausible.io/docs/sites-api
    fixture: empty
    request:
      method: GET
      path: /api/v1/sites
      headers:
        Authorization: "Bearer cauldr0n-plaus1ble-f1xture-key"
    expect:
      status: 200
      body:
        sites: []
