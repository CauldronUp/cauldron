# PDBe (Protein Data Bank in Europe) Recipe for Cauldron
#
# The response is keyed by what you asked for, and not as you asked it.
#
#   GET /pdbe/api/pdb/entry/summary/4HHB
#           ->  200  {"4hhb": [ { "title": "...", ... } ]}
#
# The top level is a map with one key, and that key is your own query lowered.
# Ask in capitals and res["4HHB"] is undefined while res["4hhb"] is the answer,
# so a client that echoes back the identifier it was given reads nothing. There
# is no field anywhere in the response holding the identifier -- it is only the
# key -- so recovering it means Object.keys(res)[0].
#
# The same record from RCSB does the opposite. That Recipe pins rcsb_id: "4HHB"
# for a request that said 4hhb; this one pins a key of "4hhb" for a request that
# said 4HHB. Two organisations, one deposition, and normalisation in opposite
# directions.
#
# **And the two of them do not agree on how to write the date either.**
#
#   PDBe:  "deposition_date": "19840307"
#   RCSB:  "recvd_initial_deposition_date": "1984-03-07T00:00:00.000+00:00"
#
# Eight digits and no separators, against a full timestamp with a zero time and
# an offset. The same day, in the same collection, twice.
#
# Written against the live API rather than a document: every case below was
# checked against ebi.ac.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Three failures, three shapes, and one of them is a 405 for a GET. An
#      entry that does not exist is 404 with {"message": ...}; a path that does
#      not exist is 404 with {"detail": "Not Found"}; and the same path with a
#      trailing slash and no identifier is 405 {"detail": "Method Not Allowed"},
#      on an endpoint that takes GET and only GET. A client reading .message
#      finds undefined on two of the three.
#   2. A JSON key with a slash in it. number_of_entities carries "dna/rna"
#      beside "dna" and "rna", so the object has three keys where two would do
#      and one of them cannot be written in dot notation.
#   3. The experimental method is sent twice, as two arrays, in two cases:
#      experimental_method_class is ["x-ray"] and experimental_method is
#      ["X-ray diffraction"]. Both are lists of one, and neither string is the
#      other.
#
# And absence is spelled two ways in one record: deposition_site is null while
# split_entry and related_structures are empty arrays.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One entry is served, of the Protein Data Bank, and only its summary. PDBe
#     answers a dozen other endpoints about the same entry.
#   - The lower-casing is served by keying the fixture on the lowered form, not
#     by lowering anything at request time. The bytes match; the emulator has
#     no notion of normalising a path segment.
#   - The 405 is served as a declared error on its own path. Upstream it is the
#     router refusing a GET on a path that needs a parameter, which is a
#     different mechanism reaching the same response.

recipe: pdbe
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: pdbe
  docs: https://www.ebi.ac.uk/pdbe/api/doc/

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    # A map whose one key is the query, lowered, holding an array of one.
    style: map
    key: "-"
    entry_style: list
  error:
    style: flat
    message_field: message

resources:
  entry:
    id:
      style: opaque
    fields:
      title:
        type: string
      processing_site:
        type: string
      # Null, where two of its neighbours are empty arrays.
      deposition_site:
        type: string
      # Eight digits and no separators.
      deposition_date:
        type: string
      release_date:
        type: string
      revision_date:
        type: string
      # Two arrays, two cases, one fact.
      experimental_method_class:
        type: list
      experimental_method:
        type: list
      split_entry:
        type: list
      related_structures:
        type: list
      entry_authors:
        type: list
      # An object with a slash in one of its keys.
      number_of_entities:
        type: map
      assemblies:
        type: list

routes:
  # Asked in capitals, answered under a key in lower case.
  - method: GET
    path: /pdbe/api/pdb/entry/summary/4HHB
    resource: entry
    operation: list

    pagination:
      # Struck live on 2026-09-05: the response is one object keyed by the
      # entry id asked for, and takes no parameters. Nothing to page.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. The runtime was reading "limit" and "cursor", which
      # nothing here answers to.
      style: none
  # An entry that does not exist.
  - method: GET
    path: /pdbe/api/pdb/entry/summary/9zzz
    error: no_data

  # A path that does not exist: the framework's shape, not the application's.
  - method: GET
    path: /pdbe/api/nosuchthing
    error: not_found

  # The same path with no identifier: a 405, for a GET.
  - method: GET
    path: /pdbe/api/pdb/entry/summary/
    error: method_not_allowed

errors:
  no_data:
    status: 404
    message: Requested endpoint does not contain any data

  not_found:
    status: 404
    # A different key from the failure above, on the same host.
    style: flat
    message_field: detail
    message: Not Found

  method_not_allowed:
    # For a GET, on an endpoint that takes GET and only GET.
    status: 405
    style: flat
    message_field: detail
    message: Method Not Allowed

fixtures:
  empty: {}

  haemoglobin:
    # The key is the query, lowered. There is no identifier field anywhere in
    # the record -- this is the only place it appears.
    entry:
      - id: "4hhb"
        title: THE CRYSTAL STRUCTURE OF HUMAN DEOXYHAEMOGLOBIN AT 1.74 ANGSTROMS RESOLUTION
        processing_site: BNL
        # Null...
        deposition_site: null
        # Eight digits, no separators, as a string.
        deposition_date: "19840307"
        release_date: "19840717"
        revision_date: "20260812"
        # Two arrays, two cases, one fact.
        experimental_method_class:
          - x-ray
        experimental_method:
          - X-ray diffraction
        # ...and two empty arrays, four fields away from the null.
        split_entry: []
        related_structures: []
        entry_authors:
          - "Fermi, G."
          - "Perutz, M.F."
        number_of_entities:
          water: 1
          polypeptide: 2
          dna: 0
          rna: 0
          # A key with a slash in it, beside the two it joins.
          dna/rna: 0
          ligand: 2
          sugar: 0
        assemblies:
          - assembly_id: "1"
            name: tetramer
            form: hetero
            # A real boolean, in a record whose dates are digit strings.
            preferred: true

conformance:
  - name: the response is keyed by what you asked for and not as you asked it
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/4HHB
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      # Capitals.
      path: /pdbe/api/pdb/entry/summary/4HHB
    expect:
      status: 200
      body:
        # Lower case, and the only place the identifier appears at all.
        "4hhb[0].title": THE CRYSTAL STRUCTURE OF HUMAN DEOXYHAEMOGLOBIN AT 1.74 ANGSTROMS RESOLUTION
        "4hhb[0].processing_site": BNL
      absent:
        # A client echoing back what it was given reads nothing.
        - "4HHB"

  - name: the date is eight digits with no separators
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/4HHB
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/4HHB
    expect:
      status: 200
      body:
        # The same day RCSB sends as 1984-03-07T00:00:00.000+00:00.
        "4hhb[0].deposition_date": "19840307"
        "4hhb[0].release_date": "19840717"
        "4hhb[0].revision_date": "20260812"

  - name: an entry that does not exist and a path that does not exist disagree
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/9zzz
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/9zzz
    expect:
      status: 404
      body:
        # The application's key.
        message: Requested endpoint does not contain any data
      absent:
        - detail

  - name: and the framework answers under a different key entirely
    source: https://www.ebi.ac.uk/pdbe/api/nosuchthing
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/nosuchthing
    expect:
      status: 404
      body:
        # Same status, same host, same content type, different key.
        detail: Not Found
      absent:
        - message

  - name: a GET on a path that takes only GET is a 405
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/
    expect:
      # Method Not Allowed, for the only method the endpoint has.
      status: 405
      body:
        detail: Method Not Allowed

  - name: a JSON key with a slash in it
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/4HHB
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/4HHB
    expect:
      status: 200
      body:
        # Three keys where two would do, and one of them cannot be written in
        # dot notation.
        "4hhb[0].number_of_entities.dna": 0
        "4hhb[0].number_of_entities.rna": 0
        "4hhb[0].number_of_entities.dna/rna": 0
        "4hhb[0].number_of_entities.water": 1
        "4hhb[0].number_of_entities.polypeptide": 2
        "4hhb[0].number_of_entities.ligand": 2

  - name: the experimental method is two arrays in two cases
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/4HHB
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/4HHB
    expect:
      status: 200
      body:
        # Both lists of one, and neither string is the other.
        "4hhb[0].experimental_method_class[0]": x-ray
        "4hhb[0].experimental_method[0]": X-ray diffraction
        # An author list in surname-comma-initial, as RCSB sends it too.
        "4hhb[0].entry_authors[0]": "Fermi, G."
        "4hhb[0].entry_authors[1]": "Perutz, M.F."

  - name: absence is spelled two ways four fields apart
    source: https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/4HHB
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /pdbe/api/pdb/entry/summary/4HHB
    expect:
      status: 200
      body:
        # Null...
        "4hhb[0].deposition_site": null
        # ...and empty arrays.
        "4hhb[0].split_entry": []
        "4hhb[0].related_structures": []
        # And an assembly whose identifier is a string and whose flag is a real
        # boolean, in a record whose dates are digit strings.
        "4hhb[0].assemblies[0].assembly_id": "1"
        "4hhb[0].assemblies[0].preferred": true
        "4hhb[0].assemblies[0].name": tetramer
        "4hhb[0].assemblies[0].form": hetero
