conformance:
  - name: every value is a quoted, fixed-width string, whatever it holds
    source: https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-year&stations=USW00094728&startDate=2020-01-01&endDate=2020-12-31&format=json
    verified: "2026-08-31"
    fixture: single_year
    request:
      method: GET
      path: /access/services/data/v1?dataset=global-summary-of-the-year&stations=USW00094728&startDate=2020-01-01&endDate=2020-12-31&format=json
    expect:
      status: 200
      headers:
        Content-Type: application/json;charset=utf-8
      body:
        "[0].STATION": USW00094728
        "[0].DATE": "2020"
        # Ten characters between the quotes, on a value with two.
        "[0].TMAX": "     17.92"
        "[0].PRCP": "   1152.8"

  - name: the field set changes from row to row, silently
    source: https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-year&stations=USW00094728&startDate=2018-01-01&endDate=2020-12-31&format=json
    verified: "2026-08-31"
    fixture: three_years
    request:
      method: GET
      path: /access/services/data/v1?dataset=global-summary-of-the-year&stations=USW00094728&startDate=2018-01-01&endDate=2020-12-31&format=json
    expect:
      status: 200
      body:
        "[0].DATE": "2018"
        "[0].FZF4": "-9.3"
        "[1].DATE": "2019"
        "[1].FZF3": "-8.8"
        "[2].DATE": "2020"
      absent:
        # Gone by 2019, on the same station.
        - "[1].FZF4"
        # Gone by 2020, on the same station.
        - "[2].FZF4"
        - "[2].FZF3"

  - name: an unrecognised station is a 200 with nothing in it, not a 404
    source: https://www.ncei.noaa.gov/access/services/data/v1?dataset=global-summary-of-the-year&stations=ZZZ00000000&startDate=2020-01-01&endDate=2020-12-31&format=json
    verified: "2026-08-31"
    fixture: single_year
    request:
      method: GET
      path: /access/services/data/v1?dataset=global-summary-of-the-year&stations=ZZZ00000000&startDate=2020-01-01&endDate=2020-12-31&format=json
    expect:
      status: 200
      absent:
        - "[0]"

  - name: the status is stated twice, in the status line and in the body
    source: https://www.ncei.noaa.gov/access/services/data/v1?dataset=not-a-real-dataset&stations=USW00094728&startDate=2020-01-01&endDate=2020-12-31&format=json
    verified: "2026-08-31"
    request:
      method: GET
      path: /access/services/data/v1-unsupported-dataset
    expect:
      status: 400
      body:
        errorCode: 400
        errorMessage: Bad Request
        "errors[0].field": dataset
        "errors[0].message": Unsupported dataset.
        "errors[0].value": not-a-real-dataset

