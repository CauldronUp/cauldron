# MessageBird Recipe for Cauldron
#
# The message listing, read from MessageBird's published API reference and its
# own PHP client, and struck live against rest.messagebird.com on 2026-09-13
# with no header, with a wrong access key, with a Bearer header, on a path that
# does not exist, and with a method the path does not take.
#
# **A phone number is a JSON integer and a network code beside it is a string.**
# From the reference's own message object:
#
#   "recipient": 31612345678,
#   "recipientCountryPrefix": 31,
#   "mccmnc": "20408",
#   "mcc": "204",
#   "mnc": "08"
#
# `recipient` is documented `type: integer`. `mnc` is a string, and it has to be:
# `"08"` loses its leading zero the moment it becomes a number. An MSISDN loses
# its leading zero exactly the same way, and is a number anyway -- so one object
# makes opposite decisions about two identifiers for the same reason.
#
# **And the network code is on the record three times.** `mccmnc` is `"20408"`,
# `mcc` is `"204"`, `mnc` is `"08"`. The concatenation and both of its halves,
# as three fields, on one recipient.
#
# **A field called SentCount counts the ones that have not been sent.** The
# reference: "`totalSentCount` -- The count of recipients that have the message
# pending (status `sent`, and `buffered`)." Pending, under a name that says
# sent. And the example has `totalCount: 1`, `totalSentCount: 1` and
# `totalDeliveredCount: 1` for a single recipient, so the three counts overlap
# and adding them gives three where there is one.
#
# **The status and the reason disagree in the vendor's own example.**
# `"status": "sent"` with `"statusReason": "successfully delivered"`, on the
# same recipient object.
#
# **`mclass` has four valid values and two documented ones.** "Indicated the
# message type. `1` is a normal message, `0` is a flash message. (0-3 are valid
# values)" -- so two of the four are named, the special case is the zero, and
# the sentence has a typo in its first word.
#
# **`gateway` is a bare integer with no list.** "The SMS route that is used to
# send the message. This is for advanced users." The example sends `240` in one
# place and `10` in another, and nothing anywhere says what either means.
#
# **The credential failure names a query parameter.** Struck live:
#
#   {"errors":[{"code":2,"description":"Request not allowed (incorrect
#     access_key)","parameter":"access_key"}]}
#
# The credential travels in `Authorization: AccessKey <key>`, and the failure
# blames a parameter called `access_key` -- and says "incorrect" to a request
# that presented nothing. A `Bearer` header gets the identical body, so the
# scheme name is not what is being read.
#
# **The prose field is called `description`.** Not `message`, not `detail`:
# `description`, with an integer `code` beside it and a `parameter` that is
# `null` when there is no parameter.
#
# Also pinned: `links` carries `first`, `previous`, `next` and `last`, with
# `first` and `last` the same URL on a one-page listing; `count` and
# `totalCount` are two different counts in one envelope; a record carries `href`,
# its own address; `price.amount` is a floating point number; and a `PUT`
# answers 411 Length Required with an HTML page whose text reads "POST requests
# require a Content-length header".

recipe: messagebird
capability: sms
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.messagebird.com/api/sms-messaging/
  # No spec: MessageBird documents this API as a reference page with worked
  # examples. There is no OpenAPI description at any address this Recipe could
  # find, so the record shape below is that page's own message object, checked
  # against the objects in the official PHP client.

auth:
  scheme: bearer
  header: Authorization
  # Not "Bearer ": the scheme word is the product's own.
  prefix: "AccessKey "
  keys:
    - cauldr0nf1xturek3y0000000000
  absent_error: request_not_allowed
  rejected_error: request_not_allowed
  # A Bearer header gets the same body, so nothing distinguishes the three.
  malformed_error: request_not_allowed
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    count_field: totalCount
    page_count_field: count
    limit_field: limit
    page_field: offset
    cursor_field: links.next
    cursor_null: true
    cursor_url: absolute
    prev_field: links.previous
    fields:
      # The same address twice on a one-page listing.
      links.first: https://rest.messagebird.com/messages/?offset=0
      links.last: https://rest.messagebird.com/messages/?offset=0
  error:
    style: list
    key: errors
    # Not message, not detail.
    message_field: description
    code_field: code
    code_type: number

resources:
  message:
    id:
      field: id
      style: hex
      length: 32
    fields:
      # The record's own address, on the record.
      href:
        type: string
      # mt or mo: mobile terminated or mobile originated.
      direction:
        type: string
      type:
        type: string
      originator:
        type: string
      body:
        type: string
      reference:
      validity:
      # A route number, for advanced users, with no list anywhere.
      gateway:
        type: integer
      typeDetails:
        type: map
      datacoding:
        type: string
      # 0-3 are valid; two of the four are documented.
      mclass:
        type: integer
      scheduledDatetime:
      createdDatetime:
        type: string
      recipients:
        type: map

routes:
  - method: GET
    path: /messages
    resource: message
    operation: list
    pagination:
      style: offset
      # The first position is nought, and the envelope echoes it.
      first_page: 0
      limit: 20
      limit_param: limit
      cursor_param: offset

errors:
  request_not_allowed:
    status: 401
    code: "2"
    # "incorrect", said to a request that presented nothing at all.
    message: Request not allowed (incorrect access_key)
    fields:
      # The credential is a header. This names a query parameter.
      parameter: access_key

  unknown_route:
    status: 404
    code: "98"
    message: Resource not found
    fields:
      # Present, and null, because there is no parameter to blame.
      parameter: null

fixtures:
  empty:
    message: []

  outbox:
    message:
      - id: 436d780b854749b4beca51623d9e2674
        href: https://rest.messagebird.com/messages/436d780b854749b4beca51623d9e2674
        direction: mt
        type: sms
        originator: YourName
        body: This is a test message
        reference: null
        validity: null
        # A route number. The reference prints 240 in one example and this in
        # another, and explains neither.
        gateway: 10
        typeDetails: {}
        datacoding: plain
        mclass: 1
        scheduledDatetime: null
        createdDatetime: "2026-04-29T09:42:26+00:00"
        recipients:
          totalCount: 1
          # Documented as the count of recipients whose message is *pending*.
          totalSentCount: 1
          totalDeliveredCount: 1
          totalDeliveryFailedCount: 0
          items:
            # A phone number, as a number.
            - recipient: 31612345678
              status: sent
              # Which does not agree with the status beside it.
              statusReason: successfully delivered
              statusErrorCode: null
              statusDatetime: "2026-04-29T09:42:26+00:00"
              recipientCountry: Netherlands
              recipientCountryPrefix: 31
              recipientOperator: KPN
              # The concatenation...
              mccmnc: "20408"
              # ...and both of its halves.
              mcc: "204"
              # A string, because the zero would not survive being a number.
              mnc: "08"
              messageLength: 22
              messagePartCount: 1
              price:
                amount: 0.075
                currency: EUR
      - id: e8077d803532c0b5937c639b60216938
        href: https://rest.messagebird.com/messages/e8077d803532c0b5937c639b60216938
        # Received rather than sent, in two letters.
        direction: mo
        type: sms
        originator: "31612345678"
        body: STOP
        reference: the-client-reference
        validity: null
        gateway: 240
        typeDetails: {}
        datacoding: unicode
        # A flash message, which is the zero.
        mclass: 0
        scheduledDatetime: null
        createdDatetime: "2026-05-02T11:15:03+00:00"
        recipients:
          totalCount: 1
          totalSentCount: 0
          totalDeliveredCount: 0
          totalDeliveryFailedCount: 1
          items:
            - recipient: 31612345678
              status: delivery_failed
              statusReason: unknown subscriber
              statusErrorCode: 4
              statusDatetime: "2026-05-02T11:15:09+00:00"
              recipientCountry: Netherlands
              recipientCountryPrefix: 31
              recipientOperator: KPN
              mccmnc: "20408"
              mcc: "204"
              mnc: "08"
              messageLength: 4
              messagePartCount: 1
              price:
                amount: 0
                currency: EUR

conformance:
  - name: the failure blames a parameter for a header
    source: https://rest.messagebird.com/messages
    verified: "2026-09-13"
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers: {}
    expect:
      status: 401
      body:
        # The credential travels in Authorization: AccessKey <key>.
        'errors[0].parameter': access_key
        # "incorrect", to a request that presented nothing.
        'errors[0].description': Request not allowed (incorrect access_key)
        'errors[0].code': 2

  - name: a wrong access key is refused in the same bytes
    source: https://rest.messagebird.com/messages
    verified: "2026-09-13"
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey notarealkey"
    expect:
      status: 401
      body:
        'errors[0].description': Request not allowed (incorrect access_key)
        'errors[0].code': 2

  - name: a Bearer header is refused in the same bytes as well
    source: https://rest.messagebird.com/messages
    verified: "2026-09-13"
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        # The scheme word is not what is being read.
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        'errors[0].description': Request not allowed (incorrect access_key)
        'errors[0].parameter': access_key

  - name: an unrouted path blames nothing and says so
    source: https://rest.messagebird.com/cauldron-nope
    verified: "2026-09-13"
    fixture: outbox
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        'errors[0].code': 98
        'errors[0].description': Resource not found
        # Present and null, because there is no parameter to blame.
        'errors[0].parameter': null

  - name: a phone number is a number and a network code is a string
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        # type: integer, on an identifier whose leading zero matters as much
        # as the one below.
        'items[0].recipients.items[0].recipient': 31612345678
        'items[0].recipients.items[0].recipientCountryPrefix': 31
        # A string, because "08" would not survive being a number.
        'items[0].recipients.items[0].mnc': "08"

  - name: the network code is on the record three times
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        # The concatenation and both of its halves.
        'items[0].recipients.items[0].mccmnc': "20408"
        'items[0].recipients.items[0].mcc': "204"
        'items[0].recipients.items[0].mnc': "08"
        'items[0].recipients.items[0].recipientOperator': KPN
        'items[0].recipients.items[0].recipientCountry': Netherlands

  - name: a field called SentCount counts the pending ones
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        # One recipient, counted by three of the four fields.
        'items[0].recipients.totalCount': 1
        'items[0].recipients.totalSentCount': 1
        'items[0].recipients.totalDeliveredCount': 1
        'items[0].recipients.totalDeliveryFailedCount': 0
        'items[1].recipients.totalSentCount': 0
        'items[1].recipients.totalDeliveryFailedCount': 1

  - name: the status and the reason disagree on one recipient
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        # From the reference's own example object.
        'items[0].recipients.items[0].status': sent
        'items[0].recipients.items[0].statusReason': successfully delivered
        'items[0].recipients.items[0].statusErrorCode': null
        'items[1].recipients.items[0].status': delivery_failed
        'items[1].recipients.items[0].statusErrorCode': 4
        'items[0].recipients.items[0].statusDatetime': "2026-04-29T09:42:26+00:00"
        'items[0].recipients.items[0].messageLength': 22
        'items[0].recipients.items[0].messagePartCount': 1
        'items[0].recipients.items[0].price.amount': 0.075
        'items[0].recipients.items[0].price.currency': EUR

  - name: the record carries its own address and a route number nobody explains
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        'items[0].href': https://rest.messagebird.com/messages/436d780b854749b4beca51623d9e2674
        'items[0].id': 436d780b854749b4beca51623d9e2674
        # Two letters for the direction, and a route number with no list.
        'items[0].direction': mt
        'items[1].direction': mo
        'items[0].gateway': 10
        'items[1].gateway': 240
        # 0-3 are valid and two of the four are documented.
        'items[0].mclass': 1
        'items[1].mclass': 0
        'items[0].datacoding': plain
        'items[1].datacoding': unicode
        'items[0].type': sms
        'items[0].originator': YourName
        'items[0].body': This is a test message
        'items[0].reference': null
        'items[1].reference': the-client-reference
        'items[0].validity': null
        'items[0].scheduledDatetime': null
        'items[0].createdDatetime': "2026-04-29T09:42:26+00:00"
        'items[0].typeDetails': {}

  - name: the envelope counts twice and links to itself at both ends
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: outbox
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
      query:
        limit: "1"
        offset: "0"
    expect:
      status: 200
      body:
        # count is this page, totalCount is all of them.
        count: 1
        totalCount: 2
        limit: 1
        offset: 0
        # first and last, the same address on a one-page listing.
        'links.first': https://rest.messagebird.com/messages/?offset=0
        'links.last': https://rest.messagebird.com/messages/?offset=0
        'links.previous': null

  - name: an account with no messages still sends both counts
    source: https://developers.messagebird.com/api/sms-messaging/
    fixture: empty
    request:
      method: GET
      path: /messages
      headers:
        Authorization: "AccessKey cauldr0nf1xturek3y0000000000"
    expect:
      status: 200
      body:
        items: []
        count: 0
        totalCount: 0
        'links.next': null
