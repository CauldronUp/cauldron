# Doppler Recipe for Cauldron
#
# This is the third Recipe in a group asking one question of secret
# managers: does a refusal for a secret that does not exist answer
# differently from one the caller may not see? Doppler's own answer is the
# plainest of the three -- not because it collapses the two the way most
# providers do, but because its credential check runs so far ahead of
# routing that neither refusal is ever reachable. Every request this Recipe
# could send without a real key -- a real path, an invented one, the right
# verb, the wrong one -- answered about the credential and never once
# about the route. That is itself the finding: on this host there is no
# existence oracle to have, because nothing downstream of the credential
# gate is ever reached without one.
#
#   GET  /v3/configs                        (no credential) -> 401
#   GET  /v3/this-route-does-not-exist-xyz  (no credential) -> 401, byte-
#                                             identical body to the line above
#   POST /v3/configs                        (no credential) -> 401, same body
#   PATCH /v3/configs                       (no credential) -> 401, same body
#   DELETE /v3/this-route-does-not-exist-xyz (no credential) -> 401, same body
#
# struck live, on 2026-09-03, with no account and no key ever held. Compare
# recipes/vault/recipe.yaml, this group's HashiCorp neighbour, which could
# not be probed live at all -- Vault has no shared public host, so its
# whole Recipe is written from its own generated document. Doppler has the
# opposite problem: api.doppler.com is a real, dialable host and probing it
# live is exactly what this file did, but the credential gate sits in front
# of every single byte a real key would unlock, so every 200 below is
# still Doppler's own published worked example, cited and undated -- the
# live evidence and the documented evidence answer two different questions
# here, and neither substitutes for the other. Compare
# recipes/akeyless/recipe.yaml, this group's other JSON-RPC-shaped
# neighbour, whose describe-item route reaches a real 200 with no
# credential at all because Akeyless left it that way; Doppler leaves
# nothing that way.
#
# **Absent, malformed and rejected -- three verdicts this format can name,
# and Doppler answers with two sentences that do not line up with them the
# way the names suggest.** No Authorization header at all answers
# {"messages":["Please provide an api key. You can learn more at
# https://docs.doppler.com/reference#authentication"],"success":false}.
# So, byte for byte, does "Authorization: Bearer " with nothing after the
# prefix -- which recipes/auth.go's own Malformed doc calls out by name
# ("a bare 'Bearer ' was sent by somebody, so it is not absent") -- and so
# does "Authorization: junkjunkjunk12345", a value carrying no recognised
# scheme keyword at all. All three were struck live and are byte-identical.
# A value that DOES carry a recognised scheme and fails to be a credential
# Doppler holds -- "Authorization: Bearer junktoken12345", or
# "dp.st.dev.junktoken12345" matching Doppler's own documented token shape
# but naming nothing real -- answers the other sentence,
# {"messages":["Invalid Auth token"],"success":false}, every time, struck
# four separate ways. So this Recipe's absent_error and malformed_error
# name the same errors entry, on purpose: Doppler's own Malformed bucket
# (present, wrong shape) reads identically to its Absent one, and only
# once a request looks enough like a credential to be worth comparing does
# the sentence change. This is exactly the shape recipes/together/recipe.yaml
# records for the identical reason -- "a header with no Bearer prefix lands
# here too... which is Together's own classification rather than this
# runtime's."
#
# **A Basic-shaped credential is where this format's single declared
# prefix runs out, and it is stated here rather than forced.** Doppler's
# own reference page says plainly that the API is authenticated by "a
# bearer token to the HTTP Authorization header," and that is what
# auth.scheme: bearer below declares. But a Basic-shaped header --
# `curl -u dp.st.junktoken12345: https://api.doppler.com/v3/configs`, which
# curl renders as "Authorization: Basic <base64>" -- was struck live too,
# and answered the identical "Invalid Auth token" sentence a bad Bearer
# token gets, not the "provide an api key" sentence this Recipe's own
# Malformed classification would reach for any header that does not start
# with "Bearer " (a Basic-scheme header does not). So the live API's real
# split is "a recognised HTTP auth scheme, wrong value" versus "nothing
# scheme-shaped at all," and Doppler accepts at least two schemes on that
# first side of the line; this format can only declare one prefix per
# Recipe, so the Basic-shaped case is recorded here, dated, and not encoded
# as a conformance case, because the emulator this Recipe builds -- bearer
# only -- would answer it wrong. The nearest neighbour for this shape of
# gap is recipes/akeyless/recipe.yaml's whole-scheme absence, one step
# further along the same axis: Akeyless has no header or query mechanism
# to declare at all, and Doppler has one and a half.
#
# **The credential is checked before routing, for every method and every
# path, without exception -- the plainest of the five orderings
# auth.go's own AfterRouting doc catalogues, and the one that needs no
# flag at all because it is already this format's default.** Airbyte and
# Temporal Cloud, named in that doc as the other two unconditional cases,
# split from each other on which side of the gate wins; Doppler agrees
# with Airbyte's side without exception. Every combination this Recipe
# tried -- real path wrong method, invented path right method, invented
# path wrong method -- answered the credential sentence and never a 404 or
# a 405. Census, three rows up in this same backlog category by the
# original author's own account, splits that ordering on the HTTP verb
# alone; Doppler does not split it at all, on any axis this Recipe could
# find.
#
# **A secret's metadata is reachable apart from its value, and the two
# routes that do it disagree with each other about shape, not just about
# content.** Doppler publishes four ways to ask about what is nominally
# the same handful of secrets, and this Recipe pins all four from
# Doppler's own worked examples, none of them invented:
#
#   GET .../secret          {"name": "DATABASE", "value": {"raw": "...",
#                            "computed": "...", "note": ""}}
#   GET .../secrets         {"secrets": {"DATABASE": {"raw": "...",
#                            "computed": "...", "note": "",
#                            "rawVisibility": "...",
#                            "computedVisibility": "..."}, ...}}
#   GET .../secrets/names   {"names": ["STRIPE", "ALGOLIA", "DATABASE",
#                            "USER"]}
#   GET .../secrets/download {"STRIPE": "sk_test_...", "DATABASE":
#                            "brian@aws.dynamodb.com:9876", ...}
#
# /secrets/names is the metadata-only route the group's question is
# actually asking after: a name with no value attached, reachable (per
# Doppler's own docs) on the same credential as everything else here,
# because Doppler does not appear to split value-reading from name-reading
# by scope at all -- there is no separately-scoped read-only token
# documented anywhere in this API, which this Recipe states as an absence
# rather than serves as a permission it never observed. Compare
# recipes/vault/recipe.yaml's secret_metadata resource, which is the same
# idea from a product that also has no separate metadata-only credential.
#
# The other three routes disagree about MORE than which fields they carry.
# The single read nests raw/computed/note one level down, under "value";
# the listing does not nest them at all, and adds two fields the single
# read's own worked example never shows. Code written against one and
# pointed at the other is off by one level of indirection on the exact
# fields it went looking for -- the same class of trap
# recipes/vault/recipe.yaml's header opens with, `secret = response.data`
# being right against one KV mount and an object against the next, except
# here the two mounts are two different endpoints on the one host rather
# than a property of where the data lives.
#
# **"raw" versus "computed" is Doppler's own name for a value that looks
# local and is not, which is the specific thing this row of the backlog
# was queued to assess.** Doppler's own worked example, unedited: the
# DATABASE secret's raw value is the literal string
# "${USER}@aws.dynamodb.com:9876" -- an unresolved reference to another
# secret in the same config -- and its computed value is
# "brian@aws.dynamodb.com:9876", the same string with USER's value spliced
# in. Both are real fields on the same object at /secret and /secrets;
# only computed survives to /secrets/download, which answers with
# "brian@aws.dynamodb.com:9876" and nothing that would tell a reader a
# template was ever involved. Code that reads .raw because a field named
# "raw" sounds like the source of truth gets back a string with an
# unresolved reference sitting inside it, live, in production, on any
# config that inherits or interpolates -- and code that only ever calls
# /download never learns the distinction exists at all.
#
# **The path names an object that travels only in the query string.**
# Every one of the four routes above is literally /v3/configs/config/...
# -- "config" is not a placeholder, it is the literal seven-letter word,
# spelled out identically in Doppler's own OpenAPI fragment for all four
# operations. Which config you mean travels as ?config=whatever beside it;
# the URL path is the same fixed string for every config in every project
# an account has. A reader skimming the path for what varies would guess
# wrong about which part of the request does the addressing.
#
# **Versioning is real and is not the API's to answer.** docs.doppler.com/
# docs/versioning says plainly that "every action within a config... is
# recorded and viewable," with a rollback button in the dashboard for
# exactly the operations this group's question is about -- adding,
# updating, deleting a secret. Nothing in that page, or in any reference
# page this Recipe read, names an endpoint that reads a past version or
# performs that rollback over the API: the mechanism is described as
# dashboard-only, addressed by "log entries" rather than a version number.
# So unlike recipes/vault/recipe.yaml, whose KV v2 answers a numbered
# version on the same path a live one answers on, Doppler's history is
# real, documented, and -- on the evidence this Recipe could find --
# unreachable from outside the dashboard. Stated as an absence rather than
# guessed at.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The Basic-scheme finding above is recorded in prose and not as a
#     conformance case, because a case asserting it would assert something
#     the emulator this Recipe builds cannot actually do -- see the header
#     for why.
#   - No route here reaches a 200 live. Every resource shape is Doppler's
#     own published worked example (the literal JSON embedded in each
#     reference page's own OpenAPI fragment, not a paraphrase), and none
#     of it carries a verified date, because the credential gate blocks
#     every one of them the same way it blocks a made-up path. See the
#     header for why that is not the same gap Vault has.
#   - No upstream.spec. Each of the four reference pages read while
#     writing this file embeds its OWN OpenAPI 3.1 fragment -- one path,
#     one operation, "info": {"title": "core", "version": "4"} -- rather
#     than pointing at one discoverable document this Recipe could
#     fingerprint and re-fetch the way together/recipe.yaml does. Common
#     guesses (docs.doppler.com/openapi.json, /openapi.yaml, /docs.json)
#     all 404'd, and one guess (/rdme.json) hit ReadMe's own rate limit,
#     which was not retried -- see Step 2's own instruction not to. Worth
#     noting even so: that fragment's own securitySchemes names "oauth2"
#     with empty flows -- {} -- for an API this file's live probes confirm
#     is a fixed bearer token compared against a held set, not an OAuth
#     handshake of any kind. The same generated-middle, hand-supplied-ends
#     pattern recipes/vault/recipe.yaml's header names for a different
#     provider's document.
#   - Projects, environments and configs as addressable resources in their
#     own right are not modelled -- only secrets, and only the shapes this
#     group exists to compare. Doppler's project/config/environment
#     listing, create, update and delete surface is real and sizeable and
#     none of it bears on the question this Recipe was written to answer.
#   - Writes (secrets-update, configs-create, configs-clone, and the rest
#     of the mutating surface) are not modelled. Nothing here creates,
#     updates or deletes anything, live or emulated.
#   - A secret name that does not exist has no worked example on any page
#     this Recipe read -- every published example names DATABASE, STRIPE,
#     ALGOLIA or USER, all present. What that 404 looks like is left
#     unstated rather than guessed.
#   - auth.unentitled is not declared. Doppler's own docs describe several
#     token kinds -- personal, service, service account, CLI, SCIM, audit
#     -- with real scope differences between them (the "names" endpoint's
#     own reference page carries an "Authentication: OAuth2 required"
#     badge identical to every other page here, which reads as this API's
#     generic badge rather than an endpoint-specific scope claim), but no
#     page found while writing this file showed a worked example of one
#     kind of token being refused a route another kind may use. Reaching
#     one needs a real account, the same reason recipes/clever/recipe.yaml
#     gives for the identical omission.
#   - No rate-limit response was ever observed from api.doppler.com
#     itself; the one 429 struck while writing this file came from
#     docs.doppler.com, ReadMe's documentation host, and was not pursued
#     further or retried.
#
# The token, project, config and secret names below are fixtures, taken
# from Doppler's own published documentation examples, and belong to no
# Doppler account. Nothing below is a real secret: DATABASE's value is a
# template string Doppler itself publishes as a worked example, STRIPE's
# is a "sk_test_" test-mode-shaped string from that same published
# example, and neither was ever presented to Stripe, Algolia or anyone
# else's API by this Recipe or its author.

recipe: doppler
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://docs.doppler.com/reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - dp.st.dev.not-a-real-doppler-token
  # A header with no recognised scheme, and a bare "Bearer " with nothing
  # after it, both answer Doppler's absent sentence live -- see the header.
  absent_error: no_api_key
  malformed_error: no_api_key
  # A recognised prefix and a value Doppler does not hold -- struck four
  # separate ways live, always this sentence.
  rejected_error: invalid_auth_token

responses:
  resource:
    style: bare
  error:
    style: string_list
    key: messages
    fields:
      success: false

resources:
  # The single-read shape: name at the top, the value one level down under
  # its own object. Doppler's own worked example, verbatim.
  secret:
    id:
      style: opaque
      field: name
    fields:
      raw:
        type: string
        in: value
      computed:
        type: string
        in: value
      note:
        type: string
        in: value
        default: ""

  # The listing shape: the same three fields, flat rather than nested under
  # "value", plus two more the single-read example never shows -- see the
  # header. field: name rather than "-" on purpose -- Cauldron's own
  # map-style rendering keys each entry by whatever field this names and
  # strips that field back out of the value, which is what actually
  # reproduces Doppler's "the key carries the name, the value does not
  # repeat it" shape; declaring "-" here tells the renderer no field holds
  # the identifier at all and every record is silently dropped instead.
  secret_entry:
    id:
      style: opaque
      field: name
    fields:
      raw:
        type: string
      computed:
        type: string
      note:
        type: string
        default: ""
      raw_visibility:
        type: string
        as: rawVisibility
      computed_visibility:
        type: string
        as: computedVisibility

routes:
  - method: GET
    path: /v3/configs/config/secret
    resource: secret
    operation: get
    id_from: query:name

  - method: GET
    path: /v3/configs/config/secrets
    resource: secret_entry
    operation: list
    list:
      style: map
      key: secrets
    # No limit, page or cursor parameter is named anywhere in Doppler's own
    # reference for this route -- a config's secrets come back whole. "-"
    # keeps this Recipe from inventing a page size Doppler never documents.
    pagination:
      limit_param: "-"
      cursor_param: "-"
      limit: 100

  - method: GET
    path: /v3/configs/config/secrets/names
    resource: secret
    operation: list
    list:
      style: wrapped
      key: names
      entry_field: name
    pagination:
      limit_param: "-"
      cursor_param: "-"
      limit: 100

  - method: GET
    path: /v3/configs/config/secrets/download
    # A fourth shape again: a bare map straight from name to Doppler's
    # already-resolved computed value, no envelope and no raw/note beside
    # it at all. Sent verbatim rather than through the resource system --
    # see the header for why raw and computed diverge upstream of this
    # route and never do again once it has answered.
    raw:
      content_type: application/json
      text: |
        {
          "STRIPE": "sk_test_not-a-real-stripe-key",
          "ALGOLIA": "N9TOPUCTO",
          "DATABASE": "brian@aws.dynamodb.com:9876",
          "USER": "brian"
        }

errors:
  no_api_key:
    status: 401
    message: "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"

  invalid_auth_token:
    status: 401
    message: "Invalid Auth token"

fixtures:
  empty: {}

  store:
    secret:
      - id: STRIPE
        raw: "sk_test_not-a-real-stripe-key"
        computed: "sk_test_not-a-real-stripe-key"
        note: ""
      - id: ALGOLIA
        raw: "N9TOPUCTO"
        computed: "N9TOPUCTO"
        note: ""
      - id: DATABASE
        raw: "${USER}@aws.dynamodb.com:9876"
        computed: "brian@aws.dynamodb.com:9876"
        note: ""
      - id: USER
        raw: "brian"
        computed: "brian"
        note: ""

    secret_entry:
      - id: STRIPE
        raw: "sk_test_not-a-real-stripe-key"
        computed: "sk_test_not-a-real-stripe-key"
        note: ""
        raw_visibility: masked
        computed_visibility: masked
      - id: ALGOLIA
        raw: "N9TOPUCTO"
        computed: "N9TOPUCTO"
        note: ""
        raw_visibility: masked
        computed_visibility: masked
      - id: DATABASE
        raw: "${USER}@aws.dynamodb.com:9876"
        computed: "brian@aws.dynamodb.com:9876"
        note: ""
        raw_visibility: restricted
        computed_visibility: restricted
      - id: USER
        raw: "brian"
        computed: "brian"
        note: ""
        raw_visibility: unmasked
        computed_visibility: unmasked

conformance:
  - name: no Authorization header at all answers "provide an api key"
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/configs
    expect:
      status: 401
      body:
        "messages[0]": "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"
        success: false

  - name: a bare "Bearer " with nothing after it answers the identical sentence
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/configs
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        "messages[0]": "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"

  - name: and so does a header carrying no recognised scheme at all
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/configs
      headers:
        Authorization: junkjunkjunk12345
    expect:
      status: 401
      body:
        "messages[0]": "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"

  - name: a well-formed Bearer token nobody issued answers a different sentence
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/configs
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      body:
        "messages[0]": "Invalid Auth token"
        success: false

  - name: a token matching Doppler's own documented shape is refused the same way
    source: https://docs.doppler.com/reference/auth-token-formats
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/configs
      headers:
        Authorization: "Bearer dp.st.dev.junktoken12345"
    expect:
      status: 401
      body:
        "messages[0]": "Invalid Auth token"

  - name: an unrouted path with no credential never reaches routing
    source: https://api.doppler.com/v3/this-route-does-not-exist-xyz
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3/this-route-does-not-exist-xyz
    expect:
      status: 401
      body:
        "messages[0]": "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"

  - name: and neither does a wrong method on a real path, with no credential
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /v3/configs
    expect:
      status: 401
      body:
        "messages[0]": "Please provide an api key. You can learn more at https://docs.doppler.com/reference#authentication"

  - name: a wrong method with a junk credential still answers about the credential
    source: https://api.doppler.com/v3/configs
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v3/configs
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      body:
        "messages[0]": "Invalid Auth token"

  - name: a single secret answers name and a nested value, not the secret at top level
    source: https://docs.doppler.com/reference/secrets-get
    fixture: store
    request:
      method: GET
      path: /v3/configs/config/secret
      query:
        project: cauldron-fixture-project
        config: dev
        name: DATABASE
      headers:
        Authorization: "Bearer dp.st.dev.not-a-real-doppler-token"
    expect:
      status: 200
      body:
        name: DATABASE
        "value.raw": "${USER}@aws.dynamodb.com:9876"
        "value.computed": "brian@aws.dynamodb.com:9876"
        "value.note": ""

  - name: the listing keys by name and does not nest under value the way the single read does
    source: https://docs.doppler.com/reference/secrets-list
    fixture: store
    request:
      method: GET
      path: /v3/configs/config/secrets
      query:
        project: cauldron-fixture-project
        config: dev
      headers:
        Authorization: "Bearer dp.st.dev.not-a-real-doppler-token"
    expect:
      status: 200
      body:
        "secrets.DATABASE.raw": "${USER}@aws.dynamodb.com:9876"
        "secrets.DATABASE.computed": "brian@aws.dynamodb.com:9876"
        "secrets.STRIPE.rawVisibility": masked
        "secrets.DATABASE.rawVisibility": restricted
      absent:
        - secrets.DATABASE.value
        - secrets.DATABASE.name

  - name: names alone, with no value field anywhere in the response
    source: https://docs.doppler.com/reference/secrets-names
    fixture: store
    request:
      method: GET
      path: /v3/configs/config/secrets/names
      query:
        project: cauldron-fixture-project
        config: dev
      headers:
        Authorization: "Bearer dp.st.dev.not-a-real-doppler-token"
    expect:
      status: 200
      body:
        "names[0]": STRIPE
        "names[2]": DATABASE
      absent:
        - values
        - secrets

  - name: the download route answers Doppler's already-resolved computed value and nothing that says a template was involved
    source: https://docs.doppler.com/reference/secrets-download
    fixture: store
    request:
      method: GET
      path: /v3/configs/config/secrets/download
      query:
        project: cauldron-fixture-project
        config: dev
      headers:
        Authorization: "Bearer dp.st.dev.not-a-real-doppler-token"
    expect:
      status: 200
      body:
        DATABASE: "brian@aws.dynamodb.com:9876"
        USER: brian
      absent:
        - raw
        - computed
        - note
