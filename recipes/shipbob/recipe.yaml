# ShipBob Recipe for Cauldron
#
# The assigned host for this Recipe, api.shipbob.com/1.0, answered every
# credentialed request made against it during research, on every date this
# Recipe's cases are dated, with the same four words: the version is gone.
#
# ShipBob's own versioning page states the timeline in as many words: v1.0's
# "End of Support" was Jul 31, 2026; "Starting the week after end-of-support,
# an increasing share of 1.0 requests is blocked (per merchant account)"; and
# "all 1.0 requests return 410 Gone" beginning August 29, 2026
# (developer.shipbob.com/versioning). This Recipe was written 2026-09-01,
# three days into that state, and confirmed it directly: every request to
# /1.0/order carrying any Authorization header at all -- a garbage bearer
# token, this Recipe's own fixture-valid one, a token with no scheme prefix
# -- answered 410 Gone identically. ShipBob replaced date-based versioning
# for numbered ones; the current default is 2026-07, and v1.0 is not merely
# deprecated documentation, it is a host that has stopped doing the thing an
# integration talks to it for.
#
# **That forecloses the question this Recipe's group exists to answer, in
# the most direct way a Recipe in this collection has met it: there is no
# call left to observe buying a label, because there is no call left that
# succeeds.** What follows about Create Order, its shipments array and the
# state a label appears under is all read from ShipBob's still-published
# v1.0 reference (developer.shipbob.com/v1.0/api/orders/create-order) and
# none of it carries a verified date, because no request that could reach it
# was ever answered with anything but 410 -- not with a garbage credential,
# not with a well-formed one this Recipe invented, and there is no way to
# invent a real one. It is recorded here as the answer ShipBob's own
# documentation gives, not as something this Recipe's emulator can produce,
# and no route below claims to produce it.
#
# **Documented: ShipBob never exposes a call that buys a label.** POST
# /1.0/order creates an Order, and the very same response already contains a
# shipments array -- fulfillment records ShipBob's own warehouse created,
# not something the caller asked for separately. There is no sibling
# endpoint that turns an order into a shipment, and no "buy" or "announce"
# call anywhere in the v1.0 reference; a merchant creates an Order and
# ShipBob's own operations decide when and how it ships. The commitment
# point is not a call the integration makes at all -- it is a status
# transition the integration can only ever observe, on a schema its own
# documentation cannot agree with itself about. shipment.status is
# documented two ways in two places: the Create Order schema's own example
# enumerates None, Processing, Completed, Exception, OnHold, Cancelled,
# CleanSweeped, LabeledCreated, ImportReview (developer.shipbob.com/v1.0/api/
# orders/create-order); the separate Status Reference page instead names
# Exception, On Hold, Processing, Completed, Cancelled -- five words, with
# spaces where the other list has none -- and describes label generation
# not as one of those five but as a status *detail*, id 102, name "Labeled",
# meaning "Label Generated," nested one level under the Processing status
# (developer.shipbob.com/status-reference). Two pages of one company's own
# reference disagree about whether "the label now exists" is a status word
# or a sub-event underneath a different one, and this Recipe is not the
# place to decide which of them is right -- see census/recipe.yaml, in this
# same collection, for Fivetran's own documentation making the identical
# kind of disagreement about a different field.
#
# order.status has its own, milder version of the same thing: the Create
# Order schema's example gives Processing, Exception, PartiallyFulfilled,
# Fulfilled, Cancelled, ImportReview; the Status Reference page gives
# Processing, Exception, On Hold, Completed, Cancelled, Partially Fulfilled,
# Fulfilled -- again spaced differently, and this one adds On Hold and
# Completed while dropping ImportReview. Neither list is quoted into a
# fixture below; see the fidelity gaps.
#
# **Cancellation is real, documented, and per-shipment rather than
# all-or-nothing.** The v1.0 reference has no cancel-order page of its own
# that this Recipe could find; the only worked example is the 2025-07
# version's Cancel Order, POST /2025-07/order/{orderId}:cancel -- a
# colon-suffixed RPC-style path, not a REST DELETE -- answering 200 with
# {"order_id": ..., "status": "Success", ...,
# "canceled_shipment_results": [{"action": "Cancel", "is_success": true}]}.
# canceled_shipment_results carries one entry per shipment the order had
# already produced, each with its own is_success -- so a cancel is an
# attempt against every shipment ShipBob's own fulfillment had already
# started, not a single reversible flag on the order, and the response is
# how a caller finds out which of them it was too late for. No v1.0-specific
# cancel path is declared here because none was found documented under that
# version; see the fidelity gaps.
#
# Auth is Bearer, confirmed from ShipBob's own words: "Include your PAT in
# the Authorization header of all API requests" (developer.shipbob.com/
# auth.md), which also documents a required shipbob_channel_id header on
# every write -- not modelled, because no live call ever got far enough past
# the version gate to confirm whether it is checked before or after that
# gate fires.
#
# The dead host still has a shape worth recording precisely, checked live,
# 2026-09-01, against api.shipbob.com/1.0:
#
#   GET/POST /order        no Authorization header at all
#     -> 401, zero-byte body, WWW-Authenticate: Bearer error="invalid_token",
#        error_description="The token was not found in Authorization header"
#
#   GET/POST /order        any Authorization header (garbage, no-prefix,
#                          or this Recipe's own fixture-valid token)
#     -> 410 Gone {"error":"api_version_deprecated","message":"API version
#        1.0 has been deprecated as of August 31, 2026. Please migrate to
#        the current API version. Contact developer support for migration
#        assistance."}
#        Deprecation: true
#        Sunset: Mon, 31 Aug 2026 00:00:00 GMT
#
#   GET  /nosuchroute12345  with or without a credential
#     -> 404 {"statusCode": 404, "message": "Resource not found"}
#
#   PATCH /order            (a method the path does not register)
#     -> 404, identical body -- no distinguishable 405 anywhere this Recipe
#        found, checked both with and without a credential attached
#
# Read together: routing and method both resolve before the credential does
# -- an unrouted path 404s and an unregistered method 404s, neither one
# checking whether anything was even presented -- and only once a request
# has matched a real route and method does the credential question get
# asked at all, at which point the only thing that question can currently
# answer is 401 (nothing sent) or 410 (something was). This is Fireworks'
# arrangement (route and method before credential) rather than Together's
# (credential before method) -- see fireworks/recipe.yaml and together/
# recipe.yaml in this collection for the pair the finding was first written
# against -- and this Recipe declares auth.after_routing: true to match it.
#
# What that flag cannot also reproduce: Cauldron's own router answers a
# recognised path with the wrong method by setting an Allow header before
# it ever asks the Recipe what the failure looks like, unconditionally. The
# live host sends no Allow header on its wrong-method 404 -- there is
# nothing to allow, because nothing about the method was ever the reason
# for the refusal. This Recipe's method_not_allowed case will therefore
# carry an Allow header the real one does not; the status and body are both
# verified exact, the extra header is a runtime seam and not a claim about
# ShipBob.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No resources are declared and no fixtures beyond empty exist. Every
#     route on this host answers a fixed failure regardless of credential or
#     body, because that is genuinely everything the live host currently
#     does -- see above. The Order and Shipment shapes are recorded in this
#     header, cited, and deliberately not modelled as routes: doing so would
#     claim a 200 this host cannot currently produce for anybody, real
#     credential or not.
#   - shipbob_channel_id, the required header on writes, is not enforced
#     here for the same reason: no live call ever got past the version gate
#     to confirm its position in the ordering.
#   - No v1.0-specific cancel-order path is declared; the only worked
#     example found is versioned 2025-07 -- see above.
#   - The two disagreeing status vocabularies are quoted in full above and
#     neither is used in a fixture, because picking one would assert
#     ShipBob's documentation agrees with itself where it does not.

recipe: shipbob
capability: shipping
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://developer.shipbob.com/v1.0/api/orders/create-order

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.shipbob.pat.0000000000000000
  # The live absent-credential body is zero bytes, carried entirely in
  # WWW-Authenticate -- see the header. This Recipe's JSON envelope is a
  # stated departure from that, not a claim that the real body has content.
  absent_error: missing_token
  # A credential of any kind -- accepted by this Recipe's own fixture list
  # or not -- reaches the same live sentence, because the version gate does
  # not check validity before refusing. See the header: this name is also
  # what the routes below answer once a request passes the credential check
  # entirely, so both paths converge on the one sentence the host actually
  # has left to say.
  rejected_error: api_version_deprecated
  after_routing: true

responses:
  error:
    style: flat
    message_field: message
    code_field: error

resources: {}

routes:
  # Every real route on this host answers the same way regardless of
  # credential or body -- see the header. "error: <name>" needs no resource
  # and no operation, because live, nothing past this gate is reachable.
  - method: GET
    path: /1.0/order
    error: api_version_deprecated

  - method: POST
    path: /1.0/order
    error: api_version_deprecated

  - method: GET
    path: /1.0/order/{id}
    error: api_version_deprecated

errors:
  missing_token:
    status: 401
    style: flat
    message_field: message
    code_field: "-"
    message: The token was not found in Authorization header
    headers:
      WWW-Authenticate: >-
        Bearer error="invalid_token", error_description="The token was not
        found in Authorization header"

  api_version_deprecated:
    status: 410
    code: api_version_deprecated
    message: >-
      API version 1.0 has been deprecated as of August 31, 2026. Please
      migrate to the current API version. Contact developer support for
      migration assistance.
    headers:
      Deprecation: "true"
      Sunset: "Mon, 31 Aug 2026 00:00:00 GMT"

  unknown_route:
    status: 404
    style: flat
    message_field: message
    code_field: "-"
    message: Resource not found
    fields:
      statusCode: 404

  # No distinguishable 405 exists on this host -- see the header. Same body
  # as unknown_route, checked live both with and without a credential
  # attached, because nothing about the method is ever what triggers this.
  method_not_allowed:
    status: 404
    style: flat
    message_field: message
    code_field: "-"
    message: Resource not found
    fields:
      statusCode: 404

fixtures:
  empty: {}

conformance:
  - name: no credential at all gets a zero-byte body and the reason in the challenge header
    source: https://api.shipbob.com/1.0/order
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /1.0/order
    expect:
      status: 401
      headers:
        WWW-Authenticate: >-
          Bearer error="invalid_token", error_description="The token was not
          found in Authorization header"
      body:
        message: The token was not found in Authorization header

  - name: and POST with no credential gets the identical answer
    source: https://api.shipbob.com/1.0/order
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /1.0/order
      json: {}
    expect:
      status: 401
      body:
        message: The token was not found in Authorization header

  - name: a garbage bearer token reaches the version gate, not a credential check
    source: https://api.shipbob.com/1.0/order
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /1.0/order
      headers:
        Authorization: Bearer wrong.cauldron.pat.value
    expect:
      status: 410
      headers:
        Deprecation: "true"
      body:
        error: api_version_deprecated
        message: >-
          API version 1.0 has been deprecated as of August 31, 2026. Please
          migrate to the current API version. Contact developer support for
          migration assistance.

  - name: and this Recipe's own fixture-valid token reaches the identical gate
    # Checked live with this exact token: the version gate does not
    # distinguish a credential this Recipe would accept from one it would
    # not, because nothing about validity is ever reached.
    source: https://api.shipbob.com/1.0/order
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /1.0/order
      headers:
        Authorization: Bearer cauldron.shipbob.pat.0000000000000000
    expect:
      status: 410
      body:
        error: api_version_deprecated

  - name: an unrouted path 404s whether or not a credential is attached
    source: https://api.shipbob.com/1.0/nosuchroute12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /1.0/nosuchroute12345
      headers:
        Authorization: Bearer wrong.cauldron.pat.value
    expect:
      status: 404
      body:
        statusCode: 404
        message: Resource not found

  - name: an unregistered method on a real path answers the same 404, not a 405
    source: https://api.shipbob.com/1.0/order
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /1.0/order
    expect:
      status: 404
      body:
        statusCode: 404
        message: Resource not found
