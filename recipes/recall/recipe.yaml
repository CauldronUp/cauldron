# Recall.ai Recipe for Cauldron
#
# The bot listing, read from the API reference at docs.recall.ai, and struck
# live on 2026-09-13 against two regions with no credential, with a wrong
# token, with the wrong scheme, with a scheme and no value, with a value and no
# scheme, on a path that does not exist, and with a method the path does not
# take.
#
# **`Allow` rides on a 401 that is not about methods.** Every refusal carries
#
#   WWW-Authenticate: Token
#   Allow: GET, POST, HEAD, OPTIONS
#
# RFC 9110 puts `Allow` on a 405 and nowhere else. Here it is on the
# credential failure -- and a PUT, which is not in that list, is refused for
# the credential rather than for the verb, so the header naming the allowed
# methods is served beside an answer that ignored the method entirely.
#
# **The challenge names a scheme that is not registered.** `WWW-Authenticate:
# Token`, with no realm and no parameters. `Token` is not in the IANA HTTP
# Authentication Scheme Registry, so a client implementing the challenge has
# nothing to implement.
#
# **A wrong token is answered with a list of the vendor's regions.**
#
#   "Invalid API token. The API token provided might be for another Recall
#    region (such as us-east-1, us-west-2, eu-central-1, or ap-northeast-1).
#    Verify token is valid and belongs to the correct region."
#
# Four deployment regions, enumerated to an unauthenticated caller, because the
# service cannot tell a token that is invalid from one that is valid somewhere
# else.
#
# **And the two sentences about missing credentials fire on requests that carry
# them.** Struck live:
#
#   (no Authorization)            not_authenticated      "Authentication credentials were not provided."
#   Authorization: Token          authentication_failed  the region sentence
#   Authorization: notarealtoken  authentication_failed  the region sentence
#   Authorization: Bearer x       authentication_failed  the region sentence
#   Authorization: Banana x       authentication_failed  "Invalid token header. No credentials provided."
#
# A header holding the word `Token` and nothing else is told its token is
# invalid; a header holding a scheme and a value is told no credentials were
# provided; and the scheme word is otherwise ignored -- `Bearer` and a bare
# value are judged the same as `Token`. This Recipe serves the three sentences
# and reads the scheme, which the provider does not; the README says so.
#
# **An unrouted path is a Django HTML page, with a marketing CSP on it.** 404,
# `text/html`, `<h1>Not Found</h1><p>The requested resource was not found on
# this server.</p>`. The response carries a 1,700-byte
# `Content-Security-Policy` header naming several dozen third-party hosts --
# analytics, session recording, chat widgets, a payment processor, a
# data-enrichment vendor -- on an API's 404.
#
# **A parameter's name is a Django ORM lookup.** `metadata__<key>`, double
# underscore, "Replace <key> with the metadata key you want to filter on": the
# query-name syntax of the framework, exposed as the public filter interface.
#
# **The paging flag is a boolean typed as a string.** `use_cursor` is a
# `string`, documented "When present, uses cursor-based pagination instead of
# offset pagination" -- so its value is never read, only its presence. And the
# paging it replaces is worked by `page`, "A page number within the paginated
# result set", which is page-number paging rather than the offset paging the
# flag's own description calls it.
#
# **A field the caller sets is deleted from the record.** `meeting_url` is "The
# url of the meeting… This field will be cleared a few days after the bot has
# joined a call", so the record stops saying which meeting it recorded.
#
# Also pinned: the documented base `api.recall.ai` and the region host
# `us-west-2.recall.ai` answer identically, and so does `eu-central-1`; a
# trailing slash makes no difference to the refusal; the listing has no page
# size parameter at all; and `bot_name` defaults to "Meeting Notetaker".

recipe: recall
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.recall.ai/reference/bot_list

auth:
  scheme: header
  header: Authorization
  prefix: "Token "
  keys:
    - cauldr0nreca11f1xturet0ken000000000000ab
  absent_error: not_authenticated
  malformed_error: invalid_token_header
  rejected_error: authentication_failed
  # An unrouted path is answered with no credential read at all.
  after_routing: true

responses:
  list:
    style: wrapped
    key: results
    count_field: count
    cursor_field: next
    cursor_url: absolute
    cursor_null: true
    prev_field: previous
  error:
    style: flat
    # Django REST Framework's field, beside a code of its own.
    message_field: detail
    code_field: code

resources:
  bot:
    id:
      field: id
      style: uuid
    fields:
      # "This field will be cleared a few days after the bot has joined a call."
      meeting_url:
      # Defaults to "Meeting Notetaker".
      bot_name:
        type: string
      join_at:
        type: string
      status_changes:
        type: list
      recordings:
        type: list
      recording_config:
      variant:
      calendar_meetings:
        type: list
      metadata:
        type: map

routes:
  - method: GET
    path: /api/v1/bot/
    resource: bot
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      cursor_param: page
      # The reference names no page-size parameter at all: the listing takes a
      # page number and nothing else.
      limit_param: "-"
    filters:
      - param: meeting_url
        field: meeting_url

  - method: GET
    path: /api/v1/bot/{id}/
    resource: bot
    operation: get
    not_found: bot_missing

errors:
  not_authenticated:
    status: 401
    code: not_authenticated
    message: Authentication credentials were not provided.
    headers:
      # A scheme that is not in the IANA registry, with no realm.
      WWW-Authenticate: Token
      # On a 401. RFC 9110 puts this on a 405 and nowhere else.
      Allow: GET, POST, HEAD, OPTIONS

  authentication_failed:
    status: 401
    code: authentication_failed
    message: Invalid API token. The API token provided might be for another Recall region (such as us-east-1, us-west-2, eu-central-1, or ap-northeast-1). Verify token is valid and belongs to the correct region.
    headers:
      WWW-Authenticate: Token
      Allow: GET, POST, HEAD, OPTIONS

  invalid_token_header:
    status: 401
    code: authentication_failed
    # To a request that provided credentials.
    message: Invalid token header. No credentials provided.
    headers:
      WWW-Authenticate: Token
      Allow: GET, POST, HEAD, OPTIONS

  # A verb the route does not take is answered by the credential check, with
  # the list of verbs it does take sitting in the headers.
  method_not_allowed:
    status: 401
    code: not_authenticated
    message: Authentication credentials were not provided.
    headers:
      WWW-Authenticate: Token
      Allow: GET, POST, HEAD, OPTIONS

  unknown_route:
    status: 404
    style: text
    message: "\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <title>Not Found</title>\n</head>\n<body>\n  <h1>Not Found</h1><p>The requested resource was not found on this server.</p>\n</body>\n</html>\n"
    headers:
      Content-Type: text/html; charset=utf-8

  bot_missing:
    status: 404
    code: not_found
    message: Not found.

fixtures:
  empty:
    bot: []

  fleet:
    bot:
      - id: 2c8f1e64-7b3a-4d19-9a02-5f6e8c1d4b70
        meeting_url: https://meet.google.com/abc-defg-hij
        bot_name: Meeting Notetaker
        join_at: "2026-09-11T15:00:00Z"
        status_changes:
          - code: joining_call
            sub_code: null
            message: null
            created_at: "2026-09-11T15:00:04.118Z"
          - code: in_call_recording
            sub_code: null
            message: null
            created_at: "2026-09-11T15:00:41.902Z"
          - code: done
            sub_code: null
            message: null
            created_at: "2026-09-11T15:48:12.550Z"
        recordings:
          - id: 9b4d2a17-0c63-4e58-bb91-7d3f2e6a8c45
            started_at: "2026-09-11T15:00:41.902Z"
            completed_at: "2026-09-11T15:48:12.550Z"
        recording_config: null
        variant: null
        calendar_meetings: []
        metadata:
          crm_id: "0035f00000ABCDEfgh"
      - id: 7d51b9ae-2f04-4c86-8b15-3e9a0d7c6f21
        # Cleared a few days after the bot joined: the record no longer says
        # which meeting it recorded.
        meeting_url: null
        bot_name: Compliance recorder
        join_at: "2026-08-02T09:30:00Z"
        status_changes:
          - code: done
            sub_code: null
            message: null
            created_at: "2026-08-02T10:14:55.001Z"
        recordings: []
        recording_config: null
        variant: null
        calendar_meetings: []
        metadata: {}

conformance:
  - name: a missing credential carries the list of allowed methods
    source: https://us-west-2.recall.ai/api/v1/bot/
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers: {}
    expect:
      status: 401
      headers:
        # RFC 9110 puts this on a 405.
        Allow: GET, POST, HEAD, OPTIONS
        # Not a registered scheme, and no realm.
        WWW-Authenticate: Token
      body:
        code: not_authenticated
        detail: Authentication credentials were not provided.

  - name: a wrong token is answered with four region names
    source: https://us-west-2.recall.ai/api/v1/bot/
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token notarealtoken"
    expect:
      status: 401
      body:
        code: authentication_failed
      matches:
        # The service cannot tell an invalid token from one valid elsewhere.
        detail: '\AInvalid API token\..*us-east-1, us-west-2, eu-central-1, or ap-northeast-1.*\z'

  - name: the listing filters by the url the record may no longer carry
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
      query:
        # A filter on a field the provider clears a few days after the call,
        # so the same query stops matching the same bot.
        meeting_url: https://meet.google.com/abc-defg-hij
    expect:
      status: 200
      body:
        count: 1
        'results[0].id': 2c8f1e64-7b3a-4d19-9a02-5f6e8c1d4b70
        'results[0].meeting_url': https://meet.google.com/abc-defg-hij

  - name: a header with a scheme and a value says no credentials were provided
    source: https://us-west-2.recall.ai/api/v1/bot/
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Banana notarealtoken"
    expect:
      status: 401
      body:
        code: authentication_failed
        detail: Invalid token header. No credentials provided.

  - name: a wrong method is refused for the credential beside a list of verbs
    source: https://us-west-2.recall.ai/api/v1/bot/
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: PUT
      path: /api/v1/bot/
      headers: {}
    expect:
      status: 401
      headers:
        # PUT is not in it, and the refusal is not about that.
        Allow: GET, POST, HEAD, OPTIONS
      body:
        code: not_authenticated
        detail: Authentication credentials were not provided.

  - name: an unrouted path is html from django
    source: https://us-west-2.recall.ai/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: '[\s\S]*<h1>Not Found</h1><p>The requested resource was not found on this server\.</p>[\s\S]*'

  - name: a field the caller set is cleared from the record
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
    expect:
      status: 200
      body:
        'results[0].meeting_url': https://meet.google.com/abc-defg-hij
        # "cleared a few days after the bot has joined a call".
        'results[1].meeting_url': null
        'results[1].bot_name': Compliance recorder
        'results[0].bot_name': Meeting Notetaker
        'results[0].join_at': "2026-09-11T15:00:00Z"

  - name: a bot's history is four read-only fields per event
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
    expect:
      status: 200
      body:
        # code, sub_code, message, created_at -- all required, all read-only,
        # and two of them null on every event here.
        'results[0].status_changes[0].code': joining_call
        'results[0].status_changes[0].sub_code': null
        'results[0].status_changes[0].message': null
        'results[0].status_changes[2].code': done
        'results[0].recordings[0].id': 9b4d2a17-0c63-4e58-bb91-7d3f2e6a8c45
        'results[0].metadata.crm_id': "0035f00000ABCDEfgh"
        'results[0].recording_config': null
        'results[0].variant': null
        'results[1].calendar_meetings': []

  - name: the listing pages by number and links the next page as a url
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
      query:
        page: "1"
    expect:
      status: 200
      body:
        count: 2
        # Both null: the page size is not settable and everything fits.
        previous: null
        next: null

  - name: one bot travels bare rather than wrapped
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/7d51b9ae-2f04-4c86-8b15-3e9a0d7c6f21/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
    expect:
      status: 200
      body:
        id: 7d51b9ae-2f04-4c86-8b15-3e9a0d7c6f21
        meeting_url: null
        recordings: []
        metadata: {}

  - name: a bot that is not there keeps the json envelope
    source: https://docs.recall.ai/reference/bot_list
    fixture: fleet
    request:
      method: GET
      path: /api/v1/bot/00000000-0000-4000-8000-000000000000/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
    expect:
      status: 404
      body:
        code: not_found
        detail: Not found.

  - name: a workspace with no bots still sends all four envelope fields
    source: https://docs.recall.ai/reference/bot_list
    fixture: empty
    request:
      method: GET
      path: /api/v1/bot/
      headers:
        Authorization: "Token cauldr0nreca11f1xturet0ken000000000000ab"
    expect:
      status: 200
      body:
        results: []
        count: 0
        next: null
        previous: null
