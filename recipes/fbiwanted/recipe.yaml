# FBI Wanted Recipe for Cauldron
#
# The reward is zero, and the sentence beside it says twenty-five thousand
# dollars.
#
#   "reward_min": 0
#   "reward_max": 0
#   "reward_text": "The FBI is offering a reward of up to $25,000 for
#                   information leading to the identification, arrest, and
#                   conviction of the individual(s) involved ..."
#
# The two numbers are the machine-readable reward and they are both zero. The
# prose is the real one. So anything sorting by reward_max puts a
# twenty-five-thousand-dollar case last, and anything filtering on
# reward_max > 0 does not show it at all.
#
# **And thirty-three of the fifty-four fields are null.** age_range, sex, hair,
# eyes, build, complexion, weight, height_min, height_max, nationality, race,
# aliases, scars_and_marks, place_of_birth -- every physical descriptor, because
# the subject has not been identified. The record is mostly a list of things
# nobody knows, and the shape does not change to say so.
#
# Written against the live API rather than a document: every case below was
# checked against api.fbi.gov on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Absence is spelled two ways among fields of the same kind. Eight lists
#      are null -- aliases, locations, occupations, languages, suspects,
#      possible_countries, possible_states, legat_names -- and one, coordinates,
#      is []. Same kind of field, same absence, two encodings.
#   2. "detail" is an array on one failure and a string on the other. A
#      pageSize that is not a number answers 422 with the validation library's
#      own structure -- [{"type": "int_parsing", "loc": ["query", "pageSize"],
#      "msg": ..., "input": "notanumber"}], the offending input echoed back --
#      and a path that does not exist answers 404 with {"detail": "Not Found"}.
#      One key, two types, one API.
#   3. Two timestamps in one record disagree about time zones. publication is
#      "2026-08-27T13:40:00" with no zone, and modified is
#      "2026-08-27T18:55:05+00:00" with one.
#
# And description packs three facts into one string with carriage returns:
# "Unknown Suspect\r\nAugust 7, 2025\r\nAlbuquerque, New Mexico". A field called
# name holds a language, "English", inside files. pathId is a URL with an @ in
# the middle of it. And the record carries a warning_message reading "SHOULD BE
# CONSIDERED ARMED AND DANGEROUS" about a person every descriptive field
# describes as null.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One record is served, of 1,235.
#   - details is HTML with non-breaking spaces and CRLF inside a JSON string.
#     The characters are kept; the Recipe trims the paragraph for reading.

recipe: fbiwanted
capability: docs
version: 0.1.0

upstream:
  api: fbiwanted
  docs: https://www.fbi.gov/wanted/api

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: items
    count_field: total
  resource:
    style: bare
  error:
    # The string one. The validation failure is an array and is declared below.
    style: flat
    message_field: detail

resources:
  person:
    id:
      style: hex
      field: uid
    fields:
      title:
        type: string
      # Three facts in one string, separated by carriage returns.
      description:
        type: string
      # Zero, beside a sentence that says twenty-five thousand.
      reward_min:
        type: integer
      reward_max:
        type: integer
      reward_text:
        type: string
      # A warning about a person every descriptive field leaves null.
      warning_message:
        type: string
      status:
        type: string
      person_classification:
        type: string
      poster_classification:
        type: string
      # Two timestamps that disagree about time zones.
      publication:
        type: string
      modified:
        type: string
      subjects:
        type: list
      field_offices:
        type: list
      # The one absent list that is empty rather than null.
      coordinates:
        type: list
      # ...and the eight that are null rather than empty.
      aliases:
        type: list
      locations:
        type: list
      occupations:
        type: list
      languages:
        type: list
      suspects:
        type: list
      possible_countries:
        type: list
      possible_states:
        type: list
      legat_names:
        type: list
      # Every physical descriptor, and every one of them null.
      sex:
        type: string
      hair:
        type: string
      eyes:
        type: string
      build:
        type: string
      complexion:
        type: string
      weight:
        type: string
      nationality:
        type: string
      race:
        type: string
      scars_and_marks:
        type: string
      place_of_birth:
        type: string
      age_range:
        type: string
      # A field called name holds a language.
      files:
        type: list
      url:
        type: string
      path:
        type: string
      # A URL with an @ in the middle of it.
      pathId:
        type: string

routes:
  - method: GET
    path: /wanted/v1/list
    resource: person
    operation: list

    pagination:
      # pageSize and page, both struck live on 2026-09-05. The size was
      # already established by the provider's own refusal, which this Recipe
      # pins: ?pageSize=notanumber answers 422 with the parameter named in
      # the error's own loc array. The position was checked directly --
      # ?pageSize=2&page=1 and page=2 answer two different pairs of records
      # out of 1,240.
      #
      # Neither is limit and neither is cursor, which is what the runtime
      # read.
      style: page
      limit: 20
      limit_param: pageSize
      cursor_param: page
      first_page: 1
  # A pageSize that is not a number, answered with the validation library's own
  # structure.
  - method: GET
    path: /wanted/v1/list-bad-pagesize
    error: validation_error

  # A path that does not exist, answered with the same key as a string.
  - method: GET
    path: /nosuchpath
    error: not_found

errors:
  # detail is an array here.
  validation_error:
    status: 422
    style: list
    key: detail
    message_field: msg
    message: "Input should be a valid integer, unable to parse string as an integer"
    fields:
      # The validation library's own vocabulary, and the offending input
      # echoed back.
      type: int_parsing
      loc:
        - query
        - pageSize
      input: notanumber

  # And a string here, under the same key.
  not_found:
    status: 404
    message: Not Found

fixtures:
  empty: {}

  wanted:
    person:
      - id: 5c53990e4e3e4d758eea28c51c1f1cd9
        uid: 5c53990e4e3e4d758eea28c51c1f1cd9
        title: ATTEMPTED ROBBERY - ROUTE 66 TRAVEL CENTER
        # Three facts, carriage returns between them.
        description: "Unknown Suspect\r\nAugust 7, 2025\r\nAlbuquerque, New Mexico"
        # Both zero...
        reward_min: 0
        reward_max: 0
        # ...beside this.
        reward_text: "The FBI is offering a reward of up to $25,000 for information leading to the identification, arrest, and conviction of the individual(s) involved in this attempted robbery."
        # About a person nobody can describe.
        warning_message: SHOULD BE CONSIDERED ARMED AND DANGEROUS
        # Two letters for "not applicable".
        status: na
        person_classification: Main
        poster_classification: information
        # No zone...
        publication: "2026-08-27T13:40:00"
        # ...and a zone.
        modified: "2026-08-27T18:55:05+00:00"
        subjects:
          - Seeking Information
          - Indian Country
        field_offices:
          - albuquerque
        # Empty, where the eight lists below are null.
        coordinates: []
        aliases: null
        locations: null
        occupations: null
        languages: null
        suspects: null
        possible_countries: null
        possible_states: null
        legat_names: null
        # Every descriptor, unknown.
        sex: null
        hair: null
        eyes: null
        build: null
        complexion: null
        weight: null
        nationality: null
        race: null
        scars_and_marks: null
        place_of_birth: null
        age_range: null
        files:
          - url: https://www.fbi.gov/wanted/seeking-info/attempted-robbery---route-66-travel-center/download.pdf
            # A language, in a field called name.
            name: English
        url: https://www.fbi.gov/wanted/seeking-info/attempted-robbery---route-66-travel-center
        path: /wanted/seeking-info/attempted-robbery---route-66-travel-center
        # A URL with an @ in the middle of it.
        pathId: https://api.fbi.gov/@wanted-person/5c53990e4e3e4d758eea28c51c1f1cd9

conformance:
  - name: the reward is zero and the sentence says twenty-five thousand
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        # One record here, of the 1,235 the live endpoint counts.
        total: 1
        # The machine-readable reward, both ends of it.
        "items[0].reward_min": 0
        "items[0].reward_max": 0
        # And the real one, in prose. Anything sorting by reward_max puts this
        # case last.
        "items[0].reward_text": "The FBI is offering a reward of up to $25,000 for information leading to the identification, arrest, and conviction of the individual(s) involved in this attempted robbery."

  - name: every descriptor is null
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        # Thirty-three of the record's fifty-four fields are null, because the
        # subject has not been identified -- and the shape does not change to
        # say so.
        "items[0].sex": null
        "items[0].hair": null
        "items[0].eyes": null
        "items[0].build": null
        "items[0].complexion": null
        "items[0].weight": null
        "items[0].nationality": null
        "items[0].race": null
        "items[0].scars_and_marks": null
        "items[0].place_of_birth": null
        "items[0].age_range": null

  - name: and a warning about a person nobody can describe
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        "items[0].warning_message": SHOULD BE CONSIDERED ARMED AND DANGEROUS
        # Two letters for "not applicable", beside a classification of "Main".
        "items[0].title": ATTEMPTED ROBBERY - ROUTE 66 TRAVEL CENTER
        "items[0].status": na
        "items[0].person_classification": Main
        "items[0].poster_classification": information

  - name: absence is spelled two ways among fields of the same kind
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        # Eight lists null...
        "items[0].aliases": null
        "items[0].locations": null
        "items[0].occupations": null
        "items[0].languages": null
        "items[0].suspects": null
        "items[0].legat_names": null
      body_matches: '"coordinates": \[\]'

  - name: two timestamps disagree about time zones
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        # No zone...
        "items[0].publication": "2026-08-27T13:40:00"
        # ...and a zone, in the same record.
        "items[0].modified": "2026-08-27T18:55:05+00:00"

  - name: three facts in one string, and a language in a field called name
    source: https://api.fbi.gov/wanted/v1/list?pageSize=1
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list
    expect:
      status: 200
      body:
        # Carriage returns as a field separator, inside a JSON string.
        "items[0].description": "Unknown Suspect\r\nAugust 7, 2025\r\nAlbuquerque, New Mexico"
        # A language, under name.
        "items[0].files[0].name": English
        # And a URL with an @ in the middle of it.
        "items[0].pathId": https://api.fbi.gov/@wanted-person/5c53990e4e3e4d758eea28c51c1f1cd9

  - name: detail is an array on one failure
    source: https://api.fbi.gov/wanted/v1/list?pageSize=notanumber
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /wanted/v1/list-bad-pagesize
    expect:
      status: 422
      body:
        # The validation library's own vocabulary, and the offending input
        # echoed back.
        "detail[0].type": int_parsing
        "detail[0].msg": "Input should be a valid integer, unable to parse string as an integer"
        "detail[0].input": notanumber
        "detail[0].loc[0]": query
        "detail[0].loc[1]": pageSize

  - name: and a string on the other
    source: https://api.fbi.gov/nosuchpath
    verified: "2026-08-30"
    fixture: wanted
    request:
      method: GET
      path: /nosuchpath
    expect:
      # One key, two types, one API.
      status: 404
      body:
        detail: Not Found

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not pageSize was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://api.fbi.gov/wanted/v1/list?pageSize=1"
    fixture: wanted
    request:
      method: GET
      path: "/wanted/v1/list"
      query:
        "pageSize": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "items[0]"

  # The names. This Recipe declares 7 field(s) on a person that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a person carries the field names this Recipe declares"
    source: "https://api.fbi.gov/wanted/v1/list?pageSize=1"
    fixture: wanted
    request:
      method: GET
      path: "/wanted/v1/list"
    expect:
      status: 200
      body:
        "items[0].field_offices[0]": "albuquerque"
        "items[0].path": "/wanted/seeking-info/attempted-robbery---route-66-travel-center"
        "items[0].subjects[0]": "Seeking Information"
        "items[0].files[0].url": "https://www.fbi.gov/wanted/seeking-info/attempted-robbery---route-66-travel-center/download.pdf"


