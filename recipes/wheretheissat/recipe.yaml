# Where the ISS at? Recipe for Cauldron
#
# The same field is a number on one endpoint and a string on another.
#
#   /v1/satellites/25544        ->  "latitude": 26.268487855719
#   /v1/coordinates/37.79,-122  ->  "latitude": "37.795517"
#
# One API, one field name, two types. And id does it too: the satellite carries
# "id": 25544 and its own two-line element set carries "id": "25544", so a
# client that follows one endpoint to the other cannot compare the identifiers
# without deciding which side to cast.
#
# **And the units are declared after the numbers they govern.** altitude and
# velocity mean different things depending on a query parameter, and the only
# thing that says which is a field at the end of the object:
#
#   (default)      "altitude": 419.69504466844, "velocity": 27580.342778825,
#                  "units": "kilometers"
#   ?units=miles   "altitude": 260.21728290923, "velocity": 17145.517978961,
#                  "units": "miles"
#
# A parser reading fields in order has the numbers before it has the scale, and
# a client that forgets the parameter gets a plausible altitude that is wrong by
# a factor of 1.6.
#
# Written against the live API rather than a document: every case below was
# checked against api.wheretheiss.at on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. daynum is a Julian date and nothing says so. 2461282.8361574, beside a
#      Unix timestamp of 1788077044 in the same object, with no unit, no suffix
#      and no name to distinguish them -- two epochs in one response, one of
#      them from 4713 BC.
#   2. The failure puts the status last. {"error": "satellite not found",
#      "status": 404} -- the sentence first, the code after it, and the code
#      duplicating the status line.
#   3. A path it does not recognise names the framework. "Invalid controller
#      specified (nosuchthing)" -- controller is a word about the API's own
#      internals, in a message meant for whoever typed the URL.
#
# And the slashes are escaped: "America\/Los_Angeles", "https:\/\/maps.google
# .com\/...". Legal JSON and the default of one language's encoder, so the bytes
# on the wire are not the bytes most encoders would produce for the same value.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The station moves. The positions served are the ones recorded on the date
#     in the cases.
#   - Cauldron's encoder does not escape forward slashes, so the escaping above
#     is recorded rather than served. The values are the same; the bytes are
#     not.

recipe: wheretheissat
capability: infrastructure
version: 0.1.0

upstream:
  api: wheretheissat
  docs: https://wheretheiss.at/w/developer

auth:
  # Public, no key.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    # After the sentence, and duplicating the status line.
    code_field: status
    code_type: number

resources:
  satellite:
    id:
      style: numeric
      field: id
      # A number here, and a string on the element set below.
      type: number
    fields:
      name:
        type: string
      # Numbers on this endpoint, strings on /coordinates.
      latitude:
        type: number
      longitude:
        type: number
      # Meaningless without the field at the bottom of the object.
      altitude:
        type: number
      velocity:
        type: number
      visibility:
        type: string
      footprint:
        type: number
      timestamp:
        type: integer
      # A Julian date, beside a Unix one, with nothing to tell them apart.
      daynum:
        type: number
      solar_lat:
        type: number
      solar_lon:
        type: number
      # Last, after every number it governs.
      units:
        type: string

  # The same satellite asked for in miles. A separate resource because the
  # numbers differ, not just the label at the bottom of the object.
  satellite_miles:
    id:
      style: numeric
      field: id
      type: number
    fields:
      name:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      altitude:
        type: number
      velocity:
        type: number
      visibility:
        type: string
      footprint:
        type: number
      timestamp:
        type: integer
      daynum:
        type: number
      solar_lat:
        type: number
      solar_lon:
        type: number
      units:
        type: string

  elements:
    id:
      style: opaque
      # A string here, where the satellite sends a number.
      field: id
    fields:
      requested_timestamp:
        type: integer
      tle_timestamp:
        type: integer
      name:
        type: string
      header:
        type: string
      # Fixed-width orbital elements, as text.
      line1:
        type: string
      line2:
        type: string

  place:
    id:
      style: opaque
      field: "-"
      carried_by: latitude
    fields:
      # Strings here, where the satellite sends numbers.
      latitude:
        type: string
      longitude:
        type: string
      timezone_id:
        type: string
      offset:
        type: integer
      country_code:
        type: string
      map_url:
        type: string

routes:
  # The route declaring the parameter comes first.
  - method: GET
    path: /v1/satellites/{id}
    resource: satellite_miles
    operation: get
    matches_query:
      units: miles

  - method: GET
    path: /v1/satellites/{id}
    resource: satellite
    operation: get
    not_found: satellite_not_found

  - method: GET
    path: /v1/satellites/{id}/tles
    resource: elements
    operation: get

  - method: GET
    path: /v1/coordinates/{id}
    resource: place
    operation: get

  # A path with no controller behind it, which says so in those words.
  - method: GET
    path: /v1/nosuchthing
    error: invalid_controller

errors:
  satellite_not_found:
    status: 404
    code: "404"
    message: satellite not found

  invalid_controller:
    status: 404
    code: "404"
    # The API's own internal vocabulary, in a message for whoever typed the URL.
    message: Invalid controller specified (nosuchthing)

fixtures:
  empty: {}

  orbit:
    satellite:
      # Kilometres, and the field that says so is the last one.
      - id: "25544"
        name: iss
        latitude: 26.268487855719
        longitude: -31.043510874426
        altitude: 419.69504466844
        velocity: 27580.342778825
        visibility: daylight
        footprint: 4505.9116592143
        # Unix seconds...
        timestamp: 1788077044
        # ...and a Julian date, in the same object.
        daynum: 2461282.8361574
        solar_lat: 8.9484101246887
        solar_lon: 59.152614055222
        units: kilometers

    satellite_miles:
      # The same station, a few minutes later, asked for in miles. Every
      # number is different and the only thing that says so is the last field.
      - id: "25544"
        name: iss
        latitude: 26.268487855719
        longitude: -31.043510874426
        altitude: 260.21728290923
        velocity: 17145.517978961
        visibility: daylight
        footprint: 2796.9447371769
        timestamp: 1788082172
        daynum: 2461282.8955093
        solar_lat: 8.927145011758
        solar_lon: 37.781386680011
        units: miles

    elements:
      # The same satellite, whose identifier is a string here.
      - id: "25544"
        requested_timestamp: 1788082173
        tle_timestamp: 1787951709
        name: iss
        header: ISS (ZARYA)
        line1: "1 25544U 98067A   26240.88552474  .00011482  00000+0  21677-3 0  9998"
        line2: "2 25544  51.6317 300.2698 0005025  85.3239 274.8323 15.48926310583021"

    place:
      - id: 37.795517,-122.393693
        # Quoted, where the satellite's are not.
        latitude: "37.795517"
        longitude: "-122.393693"
        timezone_id: America/Los_Angeles
        offset: -7
        country_code: US
        map_url: https://maps.google.com/maps?q=37.795517,-122.393693&z=4

conformance:
  - name: latitude is a number here
    source: https://api.wheretheiss.at/v1/satellites/25544
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544
    expect:
      status: 200
      body:
        latitude: 26.268487855719
        longitude: -31.043510874426
        # And the identifier is a number too.
        id: 25544
        name: iss

  - name: and a string there
    source: https://api.wheretheiss.at/v1/coordinates/37.795517,-122.393693
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/coordinates/37.795517,-122.393693
    expect:
      status: 200
      body:
        # One API, one field name, two types.
        latitude: "37.795517"
        longitude: "-122.393693"
        timezone_id: America/Los_Angeles
        country_code: US
        offset: -7
        # A link to somebody else's map, built from the coordinates it was
        # given rather than from anything it looked up.
        map_url: https://maps.google.com/maps?q=37.795517,-122.393693&z=4

  - name: the identifier changes type between endpoints too
    source: https://api.wheretheiss.at/v1/satellites/25544/tles
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544/tles
    expect:
      status: 200
      body:
        # A string here, a number on the satellite itself.
        id: "25544"
        name: iss
        header: ISS (ZARYA)

  - name: the units are declared after the numbers they govern
    source: https://api.wheretheiss.at/v1/satellites/25544
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544
    expect:
      status: 200
      body:
        altitude: 419.69504466844
        velocity: 27580.342778825
        # The radius of the circle it can see, in the same unit.
        footprint: 4505.9116592143
        # Last in the object, after everything it applies to.
        units: kilometers

  - name: and asking in miles changes every number under it
    source: https://api.wheretheiss.at/v1/satellites/25544?units=miles
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544?units=miles
    expect:
      status: 200
      body:
        # 419.7 kilometres above, 260.2 miles here, on the same path one query
        # parameter apart -- and a client that forgets the parameter gets a
        # plausible altitude wrong by a factor of 1.6.
        altitude: 260.21728290923
        velocity: 17145.517978961
        footprint: 2796.9447371769
        units: miles

  - name: two epochs in one object, with nothing to tell them apart
    source: https://api.wheretheiss.at/v1/satellites/25544
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544
    expect:
      status: 200
      body:
        # Unix seconds since 1970...
        timestamp: 1788077044
        # ...and a Julian date counting from 4713 BC, with no unit, no suffix
        # and no name to distinguish them.
        daynum: 2461282.8361574
        solar_lat: 8.9484101246887
        visibility: daylight

  - name: the orbital elements are fixed-width text
    source: https://api.wheretheiss.at/v1/satellites/25544/tles
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/25544/tles
    expect:
      status: 200
      body:
        line1: "1 25544U 98067A   26240.88552474  .00011482  00000+0  21677-3 0  9998"
        line2: "2 25544  51.6317 300.2698 0005025  85.3239 274.8323 15.48926310583021"
        # The moment asked for, and the moment the elements were computed.
        requested_timestamp: 1788082173
        tle_timestamp: 1787951709

  - name: the failure puts the status last
    source: https://api.wheretheiss.at/v1/satellites/99999
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/satellites/99999
    expect:
      status: 404
      body:
        # The sentence first, the code after it, duplicating the status line.
        error: satellite not found
        status: 404

  - name: and a path with no controller says so in those words
    source: https://api.wheretheiss.at/v1/nosuchthing
    verified: "2026-08-30"
    fixture: orbit
    request:
      method: GET
      path: /v1/nosuchthing
    expect:
      status: 404
      body:
        # "controller" is a word about the API's own internals.
        error: Invalid controller specified (nosuchthing)
        status: 404

  # The names. This Recipe declares 1 field(s) on a satellite that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a satellite carries the field names this Recipe declares"
    source: "https://api.wheretheiss.at/v1/satellites/25544"
    fixture: orbit
    request:
      method: GET
      path: "/v1/satellites/25544"
    expect:
      status: 200
      body:
        "solar_lon": 59.152614055222

