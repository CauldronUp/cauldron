  - name: no GetRoom exists -- filtering the list is the only way to ask about one room
    # Read from the service definition itself: ListRoomsRequest.names is
    # documented as "will only return rooms with name match", and no other
    # RPC on this service takes a single room name and answers about that
    # room alone. See the header.
    source: https://github.com/livekit/protocol/blob/main/protobufs/livekit_room.proto
    fixture: small-project
    request:
      method: POST
      path: /twirp/livekit.RoomService/ListRooms
      headers:
        Content-Type: application/json
        Authorization: Bearer cauldron-fixture-livekit-accepted-management-token-0000000000000000
      json:
        names: [cauldron-fixture-room]
    expect:
      status: 200
      body:
        "rooms[0].name": cauldron-fixture-room
        "rooms[0].numParticipants": 0

  - name: a project with nothing currently running answers the identical empty shape a closed room would
    # This Recipe cannot reproduce ListRoomsRequest.names actually filtering
    # a nonexistent name out of a nonempty list -- Cauldron's own filters
    # mechanism reads query parameters, and names travels in this RPC's JSON
    # body, the same mismatch every route on this Twirp-shaped service has
    # with a format built around REST query strings. What this case proves
    # instead is the same claim from the other side: an account with no
    # rooms running answers rooms absent entirely, not an error and not a
    # 404 -- the identical shape a room that was never created and a room
    # that has since closed both leave behind, because nothing on this
    # surface can address one room that is not currently listed at all.
    source: https://github.com/livekit/protocol/blob/main/protobufs/livekit_room.proto
    fixture: empty
    request:
      method: POST
      path: /twirp/livekit.RoomService/ListRooms
      headers:
        Content-Type: application/json
        Authorization: Bearer cauldron-fixture-livekit-accepted-management-token-0000000000000000
      json: {}
    expect:
      status: 200
      absent:
        - "rooms[0]"

  - name: creating a room echoes what was asked for, and departureTimeout governs what happens after everyone leaves
    # "number of seconds to keep the room open after everyone leaves" --
    # the .proto's own words for departureTimeout, quoted in the header.
    # No worked JSON example exists for this response anywhere this task
    # read, so only the fields this request itself supplies are asserted;
    # sid and creationTime are checked by shape, not by a value nobody
    # confirmed.
    source: https://github.com/livekit/protocol/blob/main/protobufs/livekit_room.proto
    fixture: empty
    request:
      method: POST
      path: /twirp/livekit.RoomService/CreateRoom
      headers:
        Content-Type: application/json
        Authorization: Bearer cauldron-fixture-livekit-accepted-management-token-0000000000000000
      json:
        name: cauldron-fixture-new-room
        emptyTimeout: 600
        departureTimeout: 20
        maxParticipants: 20
    expect:
      status: 200
      body:
        name: cauldron-fixture-new-room
        emptyTimeout: 600
        departureTimeout: 20
        maxParticipants: 20
        numParticipants: 0
      matches:
        sid: ".+"

