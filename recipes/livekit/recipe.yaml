    # field -- an empty object, which a client calling .json() on succeeds
    # against and a 204 would not have.
    source: https://github.com/livekit/protocol/blob/main/protobufs/livekit_room.proto
    fixture: small-project
    request:
      method: POST
      path: /twirp/livekit.RoomService/DeleteRoom
