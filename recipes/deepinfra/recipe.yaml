# DeepInfra Recipe for Cauldron
#
# The models listing, struck live against api.deepinfra.com on 2026-09-13 with
# no credential, with a deliberately invalid one, and on a path that does not
# exist. The record shape below is the live response, which anyone can fetch.
#
# **The price of three is 2.9999999999999996.** From the live catalogue:
#
#   "pricing": {
#     "input_tokens": 1.0,
#     "output_tokens": 2.9999999999999996,
#     "cache_read_tokens": 0.2
#   }
#
# A binary floating-point number where a price belongs. It is three, arrived at
# by arithmetic rather than written down, and it will render as
# `$2.9999999999999996` in anything that formats it without rounding. There is
# no currency field and no unit field beside it, so a client cannot even tell
# what the 1.0 counts.
#
# **And a `discount` sits next to them.** `0.61`, a bare multiplier, with
# nothing saying whether the prices above are before it or after it.
#
# **The catalogue is public and a wrong key is refused.** No credential answers
# 200 and 191 models; `Bearer notreal` answers 401
# `{"detail":"User is not authorized to access this resource"}`. That is worth
# recording because the neighbouring provider does the opposite: [novita](../novita)
# serves its whole catalogue to a wrong key without reading it. Two
# OpenAI-compatible model listings, one rejecting a bad credential and one
# ignoring it.
#
# **Every model was created at the epoch.** `created: 0`, on all of them -- the
# same zero [cerebras](../cerebras) sends, for the same reason: the field exists
# because OpenAI's does.
#
# **Every model carries an image generator's settings.** `default_width`,
# `default_height` and `default_iterations` are on a text model's record, all
# null. One metadata shape for every kind of model, so a chat model's record has
# three fields about pixels.
#
# **And the description is Markdown.** The text field carries
# `[MiMo-V2-Flash](https://github.com/XiaomiMiMo/MiMo-V2-Flash)` -- a link, in a
# syntax a JSON client has no reason to expect, which renders as literal
# brackets anywhere that does not know to parse it.
#
# **The failures are FastAPI's default.** `{"detail": "..."}` for both the
# rejected credential and the unrouted path -- one key, no code, no type, and
# the 404's whole body is `{"detail":"Not Found"}`.

recipe: deepinfra
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://deepinfra.com/docs
  # No spec: DeepInfra documents this API as prose and an OpenAI-compatible
  # surface. There is no OpenAPI document at any address this Recipe could
  # find, and the record shape below is the live response, which needs no
  # credential to fetch.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nde3p1nfraf1xturek3y
  # A wrong key is refused even on the public listing.
  rejected_error: not_authorized
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    fields:
      object: list
  error:
    # FastAPI's one key.
    style: flat
    message_field: detail
    code_field: "-"

resources:
  model:
    id:
      field: id
      style: opaque
      length: 24
    constants:
      object: model
      owned_by: deepinfra
    fields:
      # The epoch, on every model.
      created:
        type: integer
      # The model's own id, where Novita sends an empty string.
      root:
        type: string
      parent:
      # Prices, a discount, a context length and three fields about pixels,
      # all in one shape shared by every kind of model.
      metadata:
        type: map

routes:
  - method: GET
    path: /v1/openai/models
    resource: model
    operation: list
    # Struck live with no credential: the catalogue is served to anyone. A
    # wrong credential is still refused, which is the contrast with Novita.
    public: when-absent
    pagination:
      style: none

errors:
  not_authorized:
    status: 401
    message: User is not authorized to access this resource

  unknown_route:
    status: 404
    # The whole body.
    message: Not Found

fixtures:
  empty:
    model: []

  catalogue:
    model:
      - id: XiaomiMiMo/MiMo-V2.5-Pro
        created: 0
        root: XiaomiMiMo/MiMo-V2.5-Pro
        parent: null
        metadata:
          # Markdown, in a JSON string.
          description: "MiMo-V2.5-Pro is an open-source Mixture-of-Experts language model. It uses the architecture introduced in [MiMo-V2-Flash](https://github.com/XiaomiMiMo/MiMo-V2-Flash)."
          context_length: 1048576
          max_tokens: 1048576
          pricing:
            input_tokens: 1.0
            # Three, computed rather than written down.
            output_tokens: 2.9999999999999996
            cache_read_tokens: 0.2
          # A bare multiplier, with nothing saying which side of it the prices
          # above sit on.
          discount: 0.61
          tags:
            - chat
            - prompt_cache
            - reasoning
          # An image generator's settings, on a chat model.
          default_width: null
          default_height: null
          default_iterations: null

conformance:
  - name: the catalogue is served to a caller with nothing
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body:
        object: list
        'data[0].id': XiaomiMiMo/MiMo-V2.5-Pro
        'data[0].object': model
        'data[0].owned_by': deepinfra

  - name: a wrong credential is refused on the public listing
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      # Where Novita would answer the whole catalogue to the same request.
      status: 401
      body:
        detail: User is not authorized to access this resource

  - name: an unrouted path is one key and two words
    source: https://api.deepinfra.com/v1/openai/cauldron-nope
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # The whole body: no code, no type, no path.
        detail: Not Found

  - name: the price of three is not three
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # Binary floating point, where a price belongs, with no currency and
        # no unit anywhere beside it.
        'data[0].metadata.pricing.output_tokens': 2.9999999999999996
        'data[0].metadata.pricing.input_tokens': 1.0
        'data[0].metadata.pricing.cache_read_tokens': 0.2
        # And a bare multiplier next to them.
        'data[0].metadata.discount': 0.61

  - name: every model was created at the epoch
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body:
        'data[0].created': 0
        # Filled in, where Novita sends an empty string for the same field.
        'data[0].root': XiaomiMiMo/MiMo-V2.5-Pro
        'data[0].parent': null

  - name: a chat model carries an image generator's settings
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # One metadata shape for every kind of model, so a chat model's
        # record has three fields about pixels.
        'data[0].metadata.default_width': null
        'data[0].metadata.default_height': null
        'data[0].metadata.default_iterations': null
        'data[0].metadata.tags[0]': chat
        'data[0].metadata.context_length': 1048576
        'data[0].metadata.max_tokens': 1048576

  - name: the description is Markdown
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body_matches: '\[MiMo-V2-Flash\]\(https://github\.com/'

  - name: an empty catalogue still sends the discriminator
    source: https://api.deepinfra.com/v1/openai/models
    verified: "2026-09-13"
    fixture: empty
    request:
      method: GET
      path: /v1/openai/models
      headers: {}
    expect:
      status: 200
      body:
        object: list
        data: []
