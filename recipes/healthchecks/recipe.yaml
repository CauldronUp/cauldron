# Healthchecks.io Recipe for Cauldron
#
# Healthchecks is a dead man's switch: a client pings a URL on a schedule, and
# the provider alerts somebody when a ping does not arrive. That single fact
# makes it the one API in this collection where the failure this project
# exists to model never touches the wire at all.
#
# A missing ping is not a response. It is nothing happening for long enough
# that a background job on Healthchecks' own server decides the silence
# means something, and sends an email, an SMS or a Slack message that the
# pinging client itself never sees, never triggers and is never told about.
# Every case below, and every case any Recipe format built around requests
# and responses could ever write, is about what happens when a ping *does*
# arrive. The thing Healthchecks is for is what happens when one does not,
# and there is no request to send that observes that: it is not a slow
# response, not an error, not a status code nobody checks -- it is the
# complete absence of an HTTP exchange, noticed by a clock on a server this
# project never touches. Cauldron has emits_when for "this field changed on
# a write it received"; it has nothing for "no write arrived by a deadline,"
# because that is a statement about elapsed time with no request in it, and
# every mechanism in this format is a request handler. That gap is not a
# missing field. It is the shape of the format: request in, response out,
# nothing else exists.
#
# **What a ping actually says is smaller than the silence it cannot say
# anything about.** hc-ping.com takes no credential at all -- pinging a UUID
# is deliberately as cheap as curl and a cron line -- and answers with one of
# a tiny number of fixed, four-to-eighteen-byte plain-text sentences, not
# JSON:
#
#   GET https://hc-ping.com/<uuid nobody has ever heard of>
#   200  OK (not found)                     text/plain; charset=utf-8
#
#   GET https://hc-ping.com/not-a-valid-uuid
#   400  invalid url format                 text/plain
#
# "OK (not found)" is the answer whether the request is a GET or a POST,
# whether the path ends in nothing, /fail, /start or /0, and whether the
# UUID is upper- or lower-case -- checked against all four suffixes and both
# methods on 2026-08-31, all identical. It is also, on its own, useless for
# telling a caller anything: it is a 200, so nothing about the status line
# says the UUID is unrecognised, and the body is the only place the word
# "not found" appears. A client that checks response.ok and stops there
# reads success from a ping that recorded precisely nothing.
#
# **The two content types are not the same content type.** The well-formed
# "not found" answer declares `text/plain; charset=utf-8`; the malformed-path
# refusal declares bare `text/plain`, no charset, and drops the CORS and
# `Ping-Body-Limit` headers the successful shape always carries. Three
# response properties change together -- status, charset and which headers
# exist at all -- for what looks from the outside like the same kind of
# failure to notice anything.
#
# **The management API, a different host with a different credential model
# entirely, answers the opposite way: loudly, and in JSON.** Every request to
# `healthchecks.io/api/v3/` without a working `X-Api-Key` is a 401 with
# `{"error": "missing api key"}` -- checked with no header, an empty header
# and the literal string `notarealkey`, all three identical. That is worth
# pausing on: `notarealkey` is a credential, sent as one, refused as one, and
# the API describes the refusal in the words for "you sent nothing." It is
# not a wording accident. A key-shaped value -- any 32 characters, hex or
# not -- is refused with a *different* sentence, `{"error": "wrong api
# key"}`; 31, 33, a bare empty string and the eleven-character
# `notarealkey` all land on "missing" instead. The provider is not checking
# whether the string is a real key at that first gate. It is counting
# characters, and "missing" versus "wrong" is a length comparison wearing
# the words for a lookup.
#
# This Recipe therefore covers two real hosts under one provider, which the
# established convention here (see Bugsnag's Recipe, whose Notify and Data
# APIs are the same split) says to flag rather than pretend is one thing:
# hc-ping.com needs no credential and never will, healthchecks.io/api/v3
# needs one and none was ever requested or used, and `auth:` in this format
# is one scheme for a whole Recipe -- there is no way to say "this route
# needs a key and this one, on a different host, never does" without either
# gating the credential-free surface behind a key it does not want, or
# leaving the credentialled one silently open. The management API's two
# routes below answer with a fixed, named failure instead of a modelled
# resource, for exactly that reason: it is the only way to keep
# hc-ping.com's routes free of an auth scheme this Recipe never turns on,
# while still describing precisely what the other host does to a request
# carrying no working key.
#
# Two more the Recipe pins:
#
#   1. A path that is not a UUID at all -- not the wrong UUID, one that was
#      never shaped like one, `/not-a-valid-uuid` -- is a 400 before the
#      ping subsystem ever runs, and a UUID with no dashes (32 raw hex
#      characters) is refused exactly the same way, at the same status, with
#      the same sentence. A well-formed but nonexistent UUID and a
#      malformed one are as different as this API gets, and the difference
#      is a status code and eight fewer bytes.
#   2. A trailing slash on an otherwise well-formed ping URL is also the 400,
#      not the 200 -- `/{uuid}` and `/{uuid}/` are not the same request here,
#      which most REST-shaped APIs would treat as decoration.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing about "a check went down because nobody pinged it" is here, and
#     nothing built on requests and responses could put it here. See the
#     opening paragraph: this is not an omission inside the format, it is the
#     shape of the format.
#   - "OK" -- the answer to a ping that reached a UUID Healthchecks actually
#     recognises -- is publicly documented and is not in this Recipe at all.
#     Producing it would need a check this project could seed and a real
#     account to have first created it in, and this project created neither:
#     no account, no key, nothing beyond an unauthenticated request was ever
#     sent to the management API. Every case below was sent to a UUID picked
#     at random, which Healthchecks has never heard of by construction.
#   - The exact 32-character boundary between "missing api key" and "wrong
#     api key" is real and was checked at lengths 16, 31, 32, 33, 40 and 41
#     characters on 2026-08-31 -- but it cannot be modelled. This format's
#     only credential check is a fixed set of accepted values compared
#     against what was sent, with one named failure for everything that does
#     not match; it has no notion of "the wrong length" as a distinct
#     outcome from "the wrong value," so a Recipe can serve the "missing"
#     shape or the "wrong" shape and not the rule that decides between them.
#     Every conformance case below about the management API therefore uses
#     either no key or a key that is not 32 characters long, which is the
#     shape this Recipe can actually stand behind.
#   - CORS and security headers on the management API's 401 --
#     `Access-Control-Allow-Headers`, `X-Frame-Options`, `X-Content-Type-Options`,
#     `Referrer-Policy`, `Cross-Origin-Opener-Policy`, and a `Vary: Cookie`
#     that implies a session-cookie-authenticated dashboard shares this exact
#     view stack with the API -- were all observed and are not asserted
#     below. They are infrastructure decoration around the one finding that
#     matters here (the body and the auth-failure wording), and this Recipe
#     keeps to what it is actually about.

recipe: healthchecks
capability: observability
version: 0.1.0

upstream:
  api: v3
  docs: https://healthchecks.io/docs/http_api/

auth:
  # Genuinely none, for hc-ping.com. The management API's key requirement is
  # modelled as a fixed failure on its own routes below instead of as a
  # Recipe-wide scheme, because that scheme has no way to apply to one host
  # under a Recipe and not the other. See the header comment.
  scheme: none

responses:
  # hc-ping's one remaining named failure -- a malformed path -- answers a
  # fixed plain-text sentence, never JSON. Its successful ping answers below
  # are recorded bytes, not errors, and carry their own content type. The
  # management API's one modelled failure overrides this per-error, below.
  error:
    style: text

routes:
  # hc-ping.com. No auth scheme is declared above, so none of these routes
  # asks for a credential, which matches the real host exactly.
  #
  # A ping to any UUID this Recipe has never heard of -- which, holding no
  # fixture and no account, is every UUID -- answers "OK (not found)" and a
  # 200, whatever the method and whatever the path ends in. Every one of
  # these five also carries Ping-Body-Limit, undocumented anywhere but the
  # wire: the maximum body a ping's POST payload may carry, in bytes,
  # restated on every single ping whether the request carried a body at all.
  - method: GET
    path: /{id}
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK (not found)"
    headers:
      Access-Control-Allow-Origin: "*"
      Ping-Body-Limit: "100000"

  - method: POST
    path: /{id}
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK (not found)"
    headers:
      Access-Control-Allow-Origin: "*"
      Ping-Body-Limit: "100000"

  - method: GET
    path: /{id}/fail
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK (not found)"
    headers:
      Access-Control-Allow-Origin: "*"
      Ping-Body-Limit: "100000"

  - method: GET
    path: /{id}/start
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK (not found)"
    headers:
      Access-Control-Allow-Origin: "*"
      Ping-Body-Limit: "100000"

  - method: GET
    path: /{id}/0
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK (not found)"
    headers:
      Access-Control-Allow-Origin: "*"
      Ping-Body-Limit: "100000"

  # A path that was never shaped like a UUID at all, refused before the ping
  # subsystem runs. A literal example rather than a rule, because this
  # format's routes match a path shape, not "fails a UUID pattern" -- the
  # same constraint goprox's Recipe already states for its own escaping
  # rule.
  - method: GET
    path: /not-a-valid-uuid
    error: ping_malformed

  # The same refusal for a UUID missing its dashes -- syntactically hex, and
  # still not the shape the path wants.
  - method: GET
    path: /83e80dd11ca94b23b1c259826adabb9a
    error: ping_malformed

  # A trailing slash on an otherwise well-formed ping is the same 400, not
  # the 200 a REST-shaped API would give it.
  - method: GET
    path: /{id}/
    error: ping_malformed

  # healthchecks.io/api/v3. Every request without a working X-Api-Key gets
  # this, whatever is actually presented -- see the header comment on why
  # the 32-character boundary this API really has cannot be told apart here.
  - method: GET
    path: /api/v3/checks/
    error: missing_api_key
    headers:
      # No DELETE on the collection route.
      Access-Control-Allow-Methods: "POST, GET, OPTIONS"

  - method: GET
    path: /api/v3/checks/{id}
    error: missing_api_key
    headers:
      # DELETE is only ever offered on a single check.
      Access-Control-Allow-Methods: "POST, DELETE, GET, OPTIONS"

errors:
  # A path that was never a UUID, refused before hc-ping's ping logic runs.
  # Eighteen bytes, plain prose, and -- unlike the successful ping's raw
  # response -- no CORS header and no Ping-Body-Limit at all, because this
  # refusal happens somewhere the successful path's headers are never added.
  ping_malformed:
    status: 400
    style: text
    message: "invalid url format"
    headers:
      # No charset, where the 200 above declares one. Two failures that look
      # alike from outside disagree on three response properties at once.
      Content-Type: "text/plain"

  # Sent for no key, an empty key, and any string that is not exactly 32
  # characters long -- "missing" is what this API calls "the wrong length,"
  # not "absent." See the header comment: the real 32-character boundary
  # into a different message, "wrong api key," cannot be modelled here.
  missing_api_key:
    status: 401
    style: flat
    message_field: error
    message: "missing api key"
    headers:
      Content-Type: "application/json"
      Access-Control-Allow-Origin: "*"

fixtures:
  empty: {}

conformance:
  - name: a ping to a uuid nobody has ever heard of is still a 200
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    expect:
      status: 200
      headers:
        # UTF-8 declared, where the malformed-path refusal below does not.
        Content-Type: "text/plain; charset=utf-8"
        Access-Control-Allow-Origin: "*"
        Ping-Body-Limit: "100000"
      # Not "OK". The one word this response has for "nothing was recorded"
      # sits inside a 200, and nothing about the status line says so.
      body_matches: '^OK \(not found\)$'

  - name: the method does not change that
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    verified: "2026-08-31"
    request:
      method: POST
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    expect:
      status: 200
      body_matches: '^OK \(not found\)$'

  - name: neither does /fail
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a/fail
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a/fail
    expect:
      status: 200
      body_matches: '^OK \(not found\)$'

  - name: nor /start
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a/start
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a/start
    expect:
      status: 200
      body_matches: '^OK \(not found\)$'

  - name: nor the numeric exit-code suffix
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a/0
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a/0
    expect:
      status: 200
      body_matches: '^OK \(not found\)$'

  - name: nor does upper-casing the uuid
    source: https://hc-ping.com/83E80DD1-1CA9-4B23-B1C2-59826ADABB9A
    verified: "2026-08-31"
    request:
      method: GET
      path: /83E80DD1-1CA9-4B23-B1C2-59826ADABB9A
    expect:
      status: 200
      body_matches: '^OK \(not found\)$'

  - name: a path that was never a uuid is refused before it becomes a ping
    source: https://hc-ping.com/not-a-valid-uuid
    verified: "2026-08-31"
    request:
      method: GET
      path: /not-a-valid-uuid
    expect:
      status: 400
      headers:
        # No charset, unlike the 200 above.
        Content-Type: "text/plain"
      body_matches: '^invalid url format$'
      absent_headers:
        # The successful shape's own headers, both gone on this refusal.
        - Access-Control-Allow-Origin
        - Ping-Body-Limit

  - name: so is the same uuid with its dashes removed
    source: https://hc-ping.com/83e80dd11ca94b23b1c259826adabb9a
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd11ca94b23b1c259826adabb9a
    expect:
      status: 400
      body_matches: '^invalid url format$'

  - name: and so is a trailing slash on an otherwise well-formed ping
    source: https://hc-ping.com/83e80dd1-1ca9-4b23-b1c2-59826adabb9a/
    verified: "2026-08-31"
    request:
      method: GET
      path: /83e80dd1-1ca9-4b23-b1c2-59826adabb9a/
    expect:
      status: 400
      body_matches: '^invalid url format$'

  - name: the management API refuses every request with no key, in json
    source: https://healthchecks.io/api/v3/checks/
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/v3/checks/
    expect:
      status: 401
      headers:
        Content-Type: application/json
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Methods: "POST, GET, OPTIONS"
      body:
        error: missing api key

  - name: an obviously fake key gets the identical shape as no key at all
    source: https://healthchecks.io/api/v3/checks/
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/v3/checks/
      headers:
        # Eleven characters: a credential, sent as one, refused as one, and
        # described in the words for "you sent nothing" rather than "that is
        # wrong" -- which is real, and which this fixed route reproduces
        # without being able to say the length is the reason. See the header
        # comment.
        X-Api-Key: notarealkey
    expect:
      status: 401
      body:
        error: missing api key

  - name: the single-check route allows a delete the collection route does not
    source: https://healthchecks.io/api/v3/checks/83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/v3/checks/83e80dd1-1ca9-4b23-b1c2-59826adabb9a
    expect:
      status: 401
      headers:
        Access-Control-Allow-Methods: "POST, DELETE, GET, OPTIONS"
      body:
        error: missing api key
