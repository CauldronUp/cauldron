# Bluesky Recipe for Cauldron
#
# public.api.bsky.app answers the group's opening question more precisely
# than either of its siblings, because AT Protocol was designed to answer it:
# a post's canonical identifier is not one value, it is two, and the
# protocol keeps them apart on purpose.
#
#   at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/3l6oveex3ii2l
#
# is the real, live uri of @bsky.app's own pinned post (fetched 2026-09-02 --
# the official Bluesky account, chosen for exactly the reason this format
# asks for: a citable, protocol-official handle rather than a fabricated
# one). Read left to right it names a repo (a DID), a collection
# (app.bsky.feed.post) and a record key (3l6oveex3ii2l) -- WHERE the record
# lives. It says nothing about WHICH version of the record's bytes that is.
# That second half travels beside it as a separate value, a CID:
# bafyreicnt42y6vo6pfpvyro234ac4o6ijug6adwwrh7awflgrqlt4zibxq -- a content
# hash, not a location. Editing the post and fetching it again would answer
# the identical uri and a different cid; this Recipe never observed that
# happen (nothing here edits anything), so it is stated as what the two
# values *are*, not as something watched change.
#
# **The DID is the identity. The handle is a rumour about it, and the
# protocol says so in as many words.** atproto.com/specs/handle: DIDs are
# "long-term persistent identifiers" and handles are "mutable and
# human-friendly account usernames" resolved by a DNS TXT record at
# _atproto.[handle] or a GET to https://[handle]/.well-known/atproto-did.
# The same page states the failure mode plainly: "If the handle for a known
# DID is confirmed to no longer resolve, it should be marked as invalid. In
# API responses, the special handle value handle.invalid can be used" --
# and requires the check to run both directions before a client trusts it
# at all: "The link between handle and DID must be confirmed bidirectionally,
# otherwise anybody could create handle aliases for third-party accounts."
# So a handle change does not touch the DID, does not touch any uri built
# from it, and a client that resolved the handle once and cached the DID
# keeps working through the rename; a client that re-resolves an old handle
# after it moves gets told the handle cannot be resolved (this Recipe's own
# resolveHandle case below, for a handle that never existed at all, answers
# the identical InvalidRequest shape the spec describes for one that used to
# and stopped).
#
# Checked live: fetching @bsky.app's profile by its handle and by its DID
# answer the byte-identical document. That is the portability the header
# above describes, demonstrated rather than only cited -- both requests
# below assert the same displayName, the same followersCount, the same
# pinned post.
#
# **Reading needs no credential at all**, and this host does not merely
# tolerate that, it ignores the alternative: a request carrying
# "Authorization: Bearer junktoken12345" against resolveHandle answers the
# identical 200 a bare request does (checked live), because nothing on this
# route ever inspects the header. That is the honest reading of "does
# reading require a credential at all" for the *public* AppView -- it is a
# different question from whether every route on bsky.app's own service
# does, and it does not: app.bsky.notification.getUnreadCount, on this same
# host, answered 401 {"error":"AuthMissing","message":"Authentication
# Required"} both with no Authorization header and with the same junk
# bearer, byte for byte -- absent and rejected are one sentence there, which
# this Recipe cannot route beside the public surface's scheme: none. See the
# fidelity gaps.
#
# **Deleted versus never-existed** has two different answers on this host
# depending on which endpoint is asked, and neither of them is a 404.
# com.atproto.repo.getRecord for a real repo and a record key that was never
# assigned answers 400 {"error":"RecordNotFound","message":"Could not locate
# record: at://<repo>/<collection>/<rkey>"}. app.bsky.feed.getPostThread for
# the identical uri answers 400 too, but a different code and a different
# sentence: {"error":"NotFound","message":"Post not found: at://..."}. Both
# were checked live and both are indistinguishable, from either endpoint,
# from a uri that once held a real post and had it deleted -- getRecord and
# getPostThread only ever see "nothing is there now," not why. What *can*
# say why, in-band, is a shape neither endpoint sends for a request naming
# the post directly: raw.githubusercontent.com/bluesky-social/atproto's own
# published lexicon (lexicons/app/bsky/feed/defs.json) declares a thread's
# parent and replies as a union of threadViewPost, notFoundPost
# ({"uri", "notFound": true}) and blockedPost ({"uri", "blocked": true,
# "author"}) -- so a reply that has been deleted since the thread was built
# shows up nested inside a live 200, marked notFound: true, rather than as
# an error at all. This Recipe's own getPostThread case fetched @bsky.app's
# pinned post with its first 160 replies and found none in that shape --
# unsurprising for a two-year-old post with an engaged audience, and not
# proof the shape does not occur -- so notFoundPost is cited from the
# lexicon rather than demonstrated, and carries no verified date.
#
# **Shape, then identity, then existence -- three separate checks, in that
# order, live.** getPostThread answers three different failures depending on
# what is wrong with the same parameter:
#
#   uri does not look like an at-uri at all      -> 400 InvalidRequest,
#                                                     "Invalid at-uri (got ...)"
#   uri is shaped right, repo and rkey are real,
#   the record is simply not there               -> 400 NotFound,
#                                                     "Post not found: at://..."
#
# and getRecord adds the third rung the same request cannot reach on
# getPostThread, because getRecord's repo and rkey are separate parameters:
#
#   repo does not resolve to any account at all   -> 400 InvalidRequest,
#                                                     "Could not find repo: did:..."
#
# Three different failures, all status 400 -- there is no 404 anywhere on
# this host -- kept apart only by the "error" code string, and getProfile
# disagrees with both of its siblings about how many of them it needs: a
# malformed actor param ("Invalid AT identifier (got ...)") and a
# well-formed one naming nobody ("Profile not found") answer the *same*
# code, InvalidRequest, differing only in the sentence. getRecord and
# getPostThread each mint their own dedicated not-found code
# (RecordNotFound, NotFound); getProfile does not have one and does not
# seem to need it enough to have minted it.
#
# **Routing and the HTTP method disagree with each other about which layer
# answers.** GET on a real, registered method -- one this Recipe declares --
# succeeds. GET on an *unregistered* xrpc method name -- a real HTTP verb, no
# such NSID -- reaches the origin app (X-Powered-By: Express,
# CDN-RequestPullSuccess: true, both present) and answers 501
# {"error":"MethodNotImplemented","message":"Method Not Implemented"}. POST
# on a *registered* method's own path -- the right NSID, the wrong verb --
# never reaches the app at all: no X-Powered-By, no CDN-RequestPullSuccess,
# a bare HTML "405 Method Not Allowed" page from BunnyCDN's own edge
# template. So an unknown path is routed by the application and a wrong verb
# is refused by the CDN in front of it, on the same host, and which one
# answers depends on the method rather than on the path -- the reverse of
# Census's split elsewhere in this collection, where the method decides
# whether the credential gate is reached at all rather than which piece of
# infrastructure answers.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - app.bsky.notification.getUnreadCount and every other route on this
#     host that genuinely requires a session are not routed. This Recipe's
#     one auth scheme (none, for the public reads that are this host's own
#     point) cannot also express a route that is always refused regardless
#     of credential -- the same reasoning Mezmo's Recipe in this collection
#     gives for leaving its own second, differently-authenticated surface
#     out of routes and into the header instead.
#   - getRecord's "repo does not exist" failure (InvalidRequest, "Could not
#     find repo") is cited above and not modelled as a case: Cauldron routes
#     this endpoint by rkey alone (id_from: query:rkey), because repo and
#     collection are two more query parameters this format's id_from names
#     one of at a time, so there is no lookup this Recipe's own routing can
#     fail in the "repo" direction to produce it.
#   - notFoundPost and blockedPost, the in-thread shapes deleted or
#     blocked replies actually take, are cited from the published lexicon
#     and not modelled -- see above.
#   - getAuthorFeed, getFollows, getFollowers, search and every write are
#     absent. This Recipe exists to answer the identifier and existence
#     questions the group was asked, not to be a second Bluesky client.
#   - No upstream.spec: AT Protocol's lexicons are one JSON file per NSID
#     (raw.githubusercontent.com/bluesky-social/atproto/main/lexicons/...),
#     with no single combined document to fingerprint -- the same gap
#     Mezmo's Recipe in this collection states for its own provider's
#     piecemeal reference pages.
#   - Every case below that needed real data used @bsky.app's own public
#     posts and profile, fetched live and cited by uri and cid. No handle,
#     did, uri or cid anywhere in this file was invented.

recipe: bluesky
capability: chat
version: 0.1.0

upstream:
  api: v1
  provider: bluesky
  docs: https://docs.bsky.app/docs/category/http-reference

auth:
  # The public AppView reads this Recipe models take no credential at all,
  # and checked live, do not merely accept its absence -- a junk bearer
  # token is not even inspected. See the header for the one route on this
  # same host that is never this permissive, and why it is not routed here.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: error

resources:
  # com.atproto.identity.resolveHandle's entire answer: a DID, and nothing
  # beside it. Looked up by the handle a request names (id_from below), not
  # by the did itself -- the did is the one field this resource declares,
  # and the fixture's own internal id is the handle string, kept off the
  # wire.
  identity:
    id:
      field: "-"
      style: opaque
    fields:
      did:
        type: string

  # app.bsky.actor.getProfile. Addressed by did (the identity) or handle
  # (the alias) -- both routes below fetch the same record through this one
  # mechanism, which is the live demonstration of the header's central
  # claim.
  profile:
    alias: handle
    id:
      field: did
      style: opaque
    fields:
      handle:
        type: string
      display_name:
        type: string
        as: displayName
        null_when_unset: true
      description:
        type: string
        null_when_unset: true
      created_at:
        type: datetime
        as: createdAt
      indexed_at:
        type: datetime
        as: indexedAt
      followers_count:
        type: integer
        as: followersCount
      follows_count:
        type: integer
        as: followsCount
      posts_count:
        type: integer
        as: postsCount

  # com.atproto.repo.getRecord: the raw repository record, addressed by
  # rkey. uri and cid sit at the top level; the record's own fields nest
  # under "value", the shape this route actually answers with.
  record:
    id:
      # Looked up by rkey (id_from below); not echoed under "id" at all,
      # because the wire has no bare "id" property on this shape -- uri and
      # cid are what a caller reads instead. The same "keyed internally,
      # not echoed" shape this collection already has for Marqeta's balance
      # and Dwolla's HAL records.
      field: "-"
      style: opaque
    fields:
      uri:
        type: string
      cid:
        type: string
      text:
        type: string
        in: value
      created_at:
        type: datetime
        as: createdAt
        in: value
      langs:
        type: list
        in: value
      # "$type" cannot be a resource-level dotted constant: this format's own
      # path check (internal/recipe/validate.go: plainSegment) requires a
      # segment to start with a letter or underscore, and AT Protocol's own
      # discriminator starts with "$". A field's "as" has no such
      # restriction -- it is written directly rather than walked as a path --
      # so the real wire name is reached through a renamed field instead.
      record_type:
        type: string
        default: app.bsky.feed.post
        as: "$type"
        in: value

  # app.bsky.feed.getPostThread: the AppView's own enriched view of the same
  # post -- author and engagement counts, not just the record's own bytes.
  # Wrapped under thread.post, which is where the real envelope nests it.
  thread_post:
    id:
      # The full at-uri is both how this route is addressed and what it
      # echoes back, unlike record above -- so it is the id here. The
      # "not shaped like an at-uri at all" failure (see the header's
      # three-rung ordering) is not expressed through id.pattern: this
      # format's own shape check is written for a path-segment identifier,
      # and this route addresses its record through a query parameter, so
      # the one literal malformed uri this Recipe checked live is routed
      # separately below via matches_query instead.
      field: uri
      style: opaque
    fields:
      cid:
        type: string
      # No "in" on these four: the envelope below already wraps this whole
      # resource under thread.post, so a field's own "in" only needs to name
      # what nests *further*, beneath that -- an "in" repeating thread.post
      # here nested the same object inside itself a second time, which is
      # what this Recipe shipped with until `cauldron verify` caught it.
      reply_count:
        type: integer
        as: replyCount
      repost_count:
        type: integer
        as: repostCount
      like_count:
        type: integer
        as: likeCount
      indexed_at:
        type: datetime
        as: indexedAt
      author_did:
        type: string
        as: did
        in: author
      author_handle:
        type: string
        as: handle
        in: author
      record_text:
        type: string
        as: text
        in: record
      record_created_at:
        type: datetime
        as: createdAt
        in: record

routes:
  - method: GET
    path: /xrpc/com.atproto.identity.resolveHandle
    resource: identity
    operation: get
    id_from: query:handle
    not_found: cannot_resolve_handle

  - method: GET
    path: /xrpc/app.bsky.actor.getProfile
    resource: profile
    operation: get
    id_from: query:actor
    not_found: profile_not_found

  - method: GET
    path: /xrpc/com.atproto.repo.getRecord
    resource: record
    operation: get
    id_from: query:rkey
    not_found: record_not_found

  # The one literal malformed uri this Recipe checked live, matched before
  # the ordinary get route below ever sees it -- see the header's three-rung
  # ordering and the resource comment above for why this is matches_query
  # rather than id.pattern.
  - method: GET
    path: /xrpc/app.bsky.feed.getPostThread
    matches_query:
      uri: not-a-valid-at-uri
    error: id_malformed

  - method: GET
    path: /xrpc/app.bsky.feed.getPostThread
    resource: thread_post
    operation: get
    id_from: query:uri
    not_found: thread_not_found
    envelope:
      style: wrapped
      key: thread.post
    fields:
      "thread.$type": app.bsky.feed.defs#threadViewPost

errors:
  cannot_resolve_handle:
    status: 400
    code: InvalidRequest
    message: Unable to resolve handle

  profile_not_found:
    status: 400
    code: InvalidRequest
    message: Profile not found

  # {detail} is the rkey alone (id_from: query:rkey names only that
  # parameter), so the repo and collection either side of it are fixed to
  # the one this Recipe's fixture actually holds -- faithful to the one live
  # case below, and not a claim that every getRecord miss names this same
  # repo.
  record_not_found:
    status: 400
    code: RecordNotFound
    message: "Could not locate record: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/{detail}"

  # {detail} here is the full uri sent, because id_from names the whole
  # thing on this route -- no fixed repo or collection needed.
  thread_not_found:
    status: 400
    code: NotFound
    message: "Post not found: {detail}"

  # The one literal malformed uri this Recipe checked live (see the
  # matches_query route below): a route declared with `error:` has no
  # request value to substitute -- {detail} is not available to it the way
  # it is for a not_found override -- so this is the literal live sentence
  # for that one value, not a general-purpose shape error.
  id_malformed:
    status: 400
    code: InvalidRequest
    message: 'Invalid app.bsky.feed.getPostThread params: Invalid at-uri (got "not-a-valid-at-uri")'

  # What an unregistered xrpc method name answers, live -- reached through
  # the origin app (X-Powered-By: Express), not the edge, which is why this
  # Recipe overrides its own unknown_route rather than leaving the generic
  # default: everything this host serves lives under /xrpc/, so "no such
  # route" really does mean this on every path here.
  unknown_route:
    status: 501
    code: MethodNotImplemented
    message: Method Not Implemented

  # The wrong HTTP method on a real, registered path, live -- BunnyCDN's own
  # edge template, reached before the origin app at all (see the header).
  # The real page is a styled HTML document; only the stable title is
  # reproduced.
  method_not_allowed:
    status: 405
    style: text
    headers:
      Content-Type: text/html
    message: <h1>405</h1><h2>Method Not Allowed</h2>

fixtures:
  empty: {}

  # @bsky.app's own account and its pinned post, fetched live on
  # 2026-09-02. Every value below is what the API answered, not a fixture
  # invented for this Recipe.
  bsky-app:
    identity:
      - id: bsky.app
        did: did:plc:z72i7hdynmk6r22z27h6tvur

    profile:
      - id: did:plc:z72i7hdynmk6r22z27h6tvur
        handle: bsky.app
        display_name: Bluesky
        description: |-
          official Bluesky account (check username👆)

          Bugs, feature requests, feedback: support@bsky.app
        created_at: "2023-04-12T04:53:57.057Z"
        indexed_at: "2025-10-27T21:05:26.152Z"
        followers_count: 34756489
        follows_count: 14
        posts_count: 822

    record:
      - id: "3l6oveex3ii2l"
        uri: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/3l6oveex3ii2l
        cid: bafyreicnt42y6vo6pfpvyro234ac4o6ijug6adwwrh7awflgrqlt4zibxq
        text: |-
          👋  Bluesky is an open social network that gives creators independence from platforms, developers the freedom to build, and users a choice in their experience. We're so excited to have you here!

          We share Bluesky updates & news from this account. A quick orientation thread: 🧵✨
        created_at: "2024-10-17T07:06:51.491Z"
        langs:
          - en

    thread_post:
      - id: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/3l6oveex3ii2l
        cid: bafyreicnt42y6vo6pfpvyro234ac4o6ijug6adwwrh7awflgrqlt4zibxq
        reply_count: 8581
        repost_count: 9525
        like_count: 63660
        indexed_at: "2024-10-17T07:06:51.491Z"
        author_did: did:plc:z72i7hdynmk6r22z27h6tvur
        author_handle: bsky.app
        record_text: |-
          👋  Bluesky is an open social network that gives creators independence from platforms, developers the freedom to build, and users a choice in their experience. We're so excited to have you here!

          We share Bluesky updates & news from this account. A quick orientation thread: 🧵✨
        record_created_at: "2024-10-17T07:06:51.491Z"

conformance:
  - name: resolveHandle answers only a did
    source: https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=bsky.app
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/com.atproto.identity.resolveHandle
      query:
        handle: bsky.app
    expect:
      status: 200
      body:
        did: did:plc:z72i7hdynmk6r22z27h6tvur
      absent:
        - handle
        - didDoc

  - name: a junk bearer token changes nothing, because nothing on this route reads it
    # Live: the identical 200 above, for the same request with
    # "Authorization: Bearer junktoken12345" attached. Reading here needs no
    # credential at all, and this is not merely tolerance -- the header is
    # not even inspected.
    source: https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=bsky.app
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/com.atproto.identity.resolveHandle
      query:
        handle: bsky.app
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 200
      body:
        did: did:plc:z72i7hdynmk6r22z27h6tvur

  - name: a handle that was never registered cannot be resolved
    source: https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=this-handle-should-not-exist-xyz123.bsky.social
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/com.atproto.identity.resolveHandle
      query:
        handle: this-handle-should-not-exist-xyz123.bsky.social
    expect:
      status: 400
      body:
        error: InvalidRequest
        message: Unable to resolve handle

  - name: the profile fetched by handle
    source: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=bsky.app
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/app.bsky.actor.getProfile
      query:
        actor: bsky.app
    expect:
      status: 200
      body:
        did: did:plc:z72i7hdynmk6r22z27h6tvur
        handle: bsky.app
        displayName: Bluesky
        followersCount: 34756489
        postsCount: 822

  - name: and the byte-identical profile fetched by did instead
    # This is the header's central claim, demonstrated rather than only
    # cited: the handle is a resolvable alias, the did is the identity, and
    # asking either way answers the same record. Checked live, both
    # requests answered the identical document.
    source: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=did:plc:z72i7hdynmk6r22z27h6tvur
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/app.bsky.actor.getProfile
      query:
        actor: did:plc:z72i7hdynmk6r22z27h6tvur
    expect:
      status: 200
      body:
        did: did:plc:z72i7hdynmk6r22z27h6tvur
        handle: bsky.app
        displayName: Bluesky
        followersCount: 34756489
        postsCount: 822

  - name: a well-formed actor naming nobody is InvalidRequest, not a dedicated not-found code
    source: https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=this-should-not-exist-xyz123456789.bsky.social
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/app.bsky.actor.getProfile
      query:
        actor: this-should-not-exist-xyz123456789.bsky.social
    expect:
      status: 400
      body:
        error: InvalidRequest
        message: Profile not found

  - name: the raw record sits under value, with uri and cid beside it
    source: https://public.api.bsky.app/xrpc/com.atproto.repo.getRecord?repo=did:plc:z72i7hdynmk6r22z27h6tvur&collection=app.bsky.feed.post&rkey=3l6oveex3ii2l
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/com.atproto.repo.getRecord
      query:
        repo: did:plc:z72i7hdynmk6r22z27h6tvur
        collection: app.bsky.feed.post
        rkey: "3l6oveex3ii2l"
    expect:
      status: 200
      body:
        uri: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/3l6oveex3ii2l
        cid: bafyreicnt42y6vo6pfpvyro234ac4o6ijug6adwwrh7awflgrqlt4zibxq
        "value.$type": app.bsky.feed.post
        "value.langs[0]": en
      absent:
        - id
        - "value.uri"

  - name: a record key that was never assigned is RecordNotFound, not a 404
    source: https://public.api.bsky.app/xrpc/com.atproto.repo.getRecord?repo=did:plc:z72i7hdynmk6r22z27h6tvur&collection=app.bsky.feed.post&rkey=zzzzzzzzzzzzz
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
      path: /xrpc/com.atproto.repo.getRecord
      query:
        repo: did:plc:z72i7hdynmk6r22z27h6tvur
        collection: app.bsky.feed.post
        rkey: zzzzzzzzzzzzz
    expect:
      status: 400
      body:
        error: RecordNotFound
        message: "Could not locate record: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/zzzzzzzzzzzzz"

  - name: the thread view nests the same post under author and engagement counts
    source: https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.post/3l6oveex3ii2l&depth=0
    verified: "2026-09-02"
    fixture: bsky-app
    request:
      method: GET
