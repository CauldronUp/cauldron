# Kiwi.com (Tequila) Recipe for Cauldron
#
# api.tequila.kiwi.com is alive. That is worth stating plainly before
# anything else, because the honest expectation going in -- a partner
# programme most integrators report as closed to new sign-ups since around
# 2022 -- was that this host might answer nothing at all, the way
# Justworks and Substack do elsewhere in this project's backlog. It does
# not. Every probe below, run unauthenticated against the live host on
# 2026-09-02, got a fast, specific, structured JSON answer -- fronted by
# Fastly (`X-Served-By: cache-yyz....-YYZ`, `via: 1.1 google, 1.1 varnish`)
# in front of a `server: uvicorn` application, which is a Python ASGI
# service. That is worth a second sentence: every piece of secondary
# documentation this Recipe could find describes Tequila as a Node/Express
# API, and whatever answers today is not that. Compare Duffel's Recipe in
# this collection, whose finding is about a header check that runs before
# routing -- this one is about a host that is unmistakably a live, current,
# specifically-engineered service, and a closed partner programme sitting
# in front of it regardless.
#
# **The programme's own documentation is what is actually gone, and it is
# gone behind a wall this Recipe can name precisely.** docs.kiwi.com --
# linked from Tequila's own portal as its current technical reference --
# redirects to a Google Cloud Identity-Aware Proxy sign-in page
# (`accounts.google.com/o/oauth2/v2/auth?hd=kiwi.com&client_id=...`,
# confirmed live 2026-09-02), meaning the account signing in has to belong
# to the kiwi.com Google Workspace. That is not a paywall or a login form;
# it is the same mechanism a company uses to keep an internal tool off the
# public internet, applied to what used to be developer documentation.
# tequila.kiwi.com/portal/docs/tequila_api/search_api, the older
# path, still answers 200 -- but it is a client-rendered single-page
# application (`<title>Tequila by Kiwi.com</title>` and nothing else
# fetchable without executing JavaScript, confirmed both by a direct fetch
# and by this project's own web-fetch tooling, which renders HTML and
# still found nothing past the shell). Between the two, this Recipe could
# not read one sentence of Tequila's own reference documentation from any
# source available to it, live or cached, at any point during its writing.
#
# That is the finding this group's central question turns into for Kiwi:
# **whether a search result carries a booking token and an explicit expiry
# cannot be established here, from any source, and that unreachability is
# itself the answer.** Not "undocumented" in the ordinary sense, where a
# schema exists and a worked example does not -- Duffel and Amadeus both
# have gaps of that shape elsewhere in this collection, and both can still
# say precisely what is missing. Here the reference that would answer the
# question has been withdrawn from public view entirely, mid-programme,
# and the API keeps answering underneath it. A caller who was integrated
# before the docs moved can presumably still read them; nobody starting
# today can, key or no key. Because of this, the routes this Recipe
# declares stop at the credential gate: no /v2/search, no booking_token, no
# /booking/check_flights, because modelling any of them here would mean
# inventing a shape nobody could confirm, which is exactly the mistake
# Step 3 of this collection's own process exists to prevent.
#
# What the credential gate itself does is fully live-verified, and it
# answers two of this group's other standing questions cleanly.
#
# **Absent and wrong are not the same failure, and they are not even the
# same status code.** No apikey header at all:
#
#   HTTP/1.1 403 Forbidden
#   {"error_code":403,"message":"'apikey' header is required"}
#
# A syntactically fine but wrong one:
#
#   HTTP/1.1 401 Unauthorized
#   {"error_code":401,"message":"Unauthorized"}
#
# both struck live, byte for byte, against /v2/search and against
# /locations/query, a second real path. That is a sharper distinction than
# most of this collection's Bearer-token APIs manage -- Fireworks and
# Bright Data, elsewhere here, differ only in wording at the same status;
# this host spends a whole status code on the difference. An apikey header
# sent with an empty value (`apikey;` in curl, which puts the header on the
# wire with nothing after the colon) answered the identical 403 the missing
# header does -- and needed no special handling to reproduce, because
# Cauldron's own credential check reads a header's value with Go's
# `http.Header.Get`, which returns "" for both "not sent" and "sent empty"
# alike (internal/runtime/auth.go). The live API and this project's engine
# draw the absent/malformed line in the same place by accident, which is
# the rare case where nothing needed reconciling.
#
# malformed_error is declared nowhere below, and that is a structural fact
# about this scheme rather than a gap this Recipe chose to leave. apikey
# carries no prefix and no pattern, so Cauldron's own verdict logic
# (internal/runtime/auth.go's credential function) has no path that can
# reach Malformed for it at all -- every non-empty value is either the
# fixture key (Accepted) or anything else (Rejected). There is nothing to
# probe for and nothing this Recipe is declining to model.
#
# **Auth is checked after routing, and after the method too.** A path this
# API has no route for at all:
#
#   HTTP/1.1 404 Not Found
#   {"detail":"Not Found"}
#
# with or without a credential of any kind -- identical bytes either way.
# A real path with the wrong HTTP method:
#
#   HTTP/1.1 405 Method Not Allowed
#   allow: GET
#   {"detail":"Method Not Allowed"}
#
# also identical with or without a credential. Both were struck on
# /v2/search and confirmed a second way on /locations/query and on OPTIONS.
# That is auth.after_routing: true, the same flag Fireworks' Recipe in this
# collection uses and for the same live evidence -- an unrouted path and a
# wrong method both answer without a credential ever being consulted, which
# is the opposite of Census, Airbyte and Temporal elsewhere here, all of
# which check the credential unconditionally before anything else. It also
# means the two failure shapes never collide: {"detail":...} is this ASGI
# framework's own routing-miss envelope (the "detail" key is what FastAPI's
# default exception handler emits, corroborating the uvicorn/ASGI reading
# above), entirely separate from {"error_code","message"}, the
# application's own credential-failure envelope. A client cannot mistake
# one for the other by shape alone, only by status.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No route in this file answers 200. Every conformance case is a
#     credential or routing failure, because those are the only shapes this
#     Recipe could verify against anything -- see the header above for why
#     the data shape a valid key would unlock could not be established from
#     any source.
#   - Consequently this Recipe declares no resource at all. There is
#     nothing typed to declare that was not either invented or copied from
#     a page this Recipe could not actually read.
#   - /v2/search and /locations/query are the two paths this Recipe struck
#     live; Tequila is documented (by every third-party client this Recipe
#     could find, none of them primary) to expose several more --
#     /booking/check_flights, /flights_multi, /locations/radius among them
#     -- and none of those are declared here. A path this Recipe never sent
#     a request to is not a path it can make a claim about.
#   - Whether this host still issues new partner API keys at all is a
#     business fact, not a wire one, and this Recipe does not claim to
#     answer it. What it answers is narrower and fully evidenced: the API
#     still runs, and its own current reference documentation does not.

recipe: kiwi
capability: scheduling
version: 0.1.0

upstream:
  api: v2
  docs: https://tequila.kiwi.com/portal/docs/tequila_api/search_api
  # No spec is recorded. Every documentation surface this Recipe could find
  # for this API -- the portal above and docs.kiwi.com -- is unreachable for
  # the reasons in the header, and no third-party mirror of a machine-
  # readable description turned up either. A spec_hash would fingerprint a
  # document this Recipe never actually read.

auth:
  scheme: header
  header: apikey
  keys:
    - cauldron-kiwi-tequila-fixture-apikey-0000000000
  # Checked after routing and after the method -- see the header. An
  # unrouted path and a wrong method both answer without this ever running.
  after_routing: true
  absent_error: apikey_required
  rejected_error: authentication_error
  # malformed_error is deliberately absent -- see the header. This scheme
  # has no prefix and no pattern, so the verdict this would name can never
  # be reached.

responses:
  error:
    style: flat
    message_field: message
    code_field: error_code
    type_field: "-"

routes:
  # No resource, no operation, and therefore no 200 anywhere on this route
  # -- see the header for why. It exists purely to carry the two live,
  # verified failure shapes below, and to be a real, routed path for
  # after_routing to check the credential against at all.
  - method: GET
    path: /v2/search
    error: apikey_required

  - method: GET
    path: /locations/query
    error: apikey_required

errors:
  apikey_required:
    status: 403
    code: 403
    message: "'apikey' header is required"

  authentication_error:
    status: 401
    code: 401
    message: Unauthorized

  # Named apart from Cauldron's own built-in unknown_route and
  # method_not_allowed so this file can carry Tequila's own wording -- a
  # FastAPI-shaped {"detail":...}, not this application's {"error_code",
  # "message"} envelope. See the header for why the two never collide.
  unknown_route:
    status: 404
    style: flat
    message_field: detail
    code_field: "-"
    message: Not Found

  method_not_allowed:
    status: 405
    style: flat
    message_field: detail
    code_field: "-"
    message: Method Not Allowed
    headers:
      allow: GET

fixtures:
  empty: {}

conformance:
  - name: no apikey header at all is a 403, not a 401
    source: https://api.tequila.kiwi.com/v2/search?fly_from=LON&fly_to=NYC&date_from=01%2F12%2F2026&date_to=02%2F12%2F2026
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/search
      query:
        fly_from: LON
        fly_to: NYC
        date_from: 01/12/2026
        date_to: 02/12/2026
    expect:
      status: 403
      headers:
        content-type: application/json
      body:
        error_code: 403
        message: "'apikey' header is required"

  - name: an apikey header sent with nothing after it answers the identical 403
    # curl's `-H 'apikey;'` puts the header on the wire with an empty value
    # rather than omitting it. The live API answered exactly the same 403
    # as no header at all, and this Recipe reproduces that with no special
    # handling: Go's http.Header.Get returns "" for both cases alike, so
    # Cauldron's own credential check already lands on the same verdict --
    # see the header.
    source: https://api.tequila.kiwi.com/v2/search?fly_from=LON&fly_to=NYC&date_from=01%2F12%2F2026&date_to=02%2F12%2F2026
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/search
      headers:
        apikey: ""
    expect:
      status: 403
      body:
        error_code: 403
        message: "'apikey' header is required"

  - name: a wrong apikey is a 401, and a different sentence entirely
    source: https://api.tequila.kiwi.com/v2/search?fly_from=LON&fly_to=NYC&date_from=01%2F12%2F2026&date_to=02%2F12%2F2026
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/search
      headers:
        apikey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      status: 401
      body:
        error_code: 401
        message: Unauthorized

  - name: a second real path answers the same absent-credential shape
    source: https://api.tequila.kiwi.com/locations/query?term=lon
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /locations/query
      query:
        term: lon
    expect:
      status: 403
      body:
        error_code: 403
        message: "'apikey' header is required"

  - name: a path this API does not route answers 404 with no credential consulted
    source: https://api.tequila.kiwi.com/v2/nonexistent_resource_xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/nonexistent_resource_xyz
    expect:
      status: 404
      body:
        detail: Not Found

  - name: the same unrouted path answers identically even with a credential
    source: https://api.tequila.kiwi.com/v2/nonexistent_resource_xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/nonexistent_resource_xyz
      headers:
        apikey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      status: 404
      body:
        detail: Not Found

  - name: a wrong method on a real path is a real 405, naming the one it wanted
    source: https://api.tequila.kiwi.com/v2/search
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /v2/search
    expect:
      status: 405
      headers:
        allow: GET
      body:
        detail: Method Not Allowed

  - name: the wrong method answers identically with a credential too
    source: https://api.tequila.kiwi.com/v2/search
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /v2/search
      headers:
        apikey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      status: 405
      body:
        detail: Method Not Allowed
