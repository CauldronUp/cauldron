# IONOS Cloud Recipe for Cauldron
#
# The datacentre listing, read from IONOS's own generated Go SDK
# (ionos-cloud/sdk-go), and struck live against api.ionos.com on 2026-09-13
# with no header, with a wrong bearer, with a Basic credential, on a path that
# does not exist, and with a method the path does not take.
#
# **One number is quoted and the other is not.** Struck live:
#
#   {"httpStatus":401,"messages":[{"errorCode":"315","message":"Unauthorized"}]}
#
# `httpStatus` is a JSON number and `errorCode` beside it is a JSON string, and
# both are integers. And `messages` is a plural array carrying one object.
#
# **That is the answer to every request.** A missing credential, a wrong bearer,
# a Basic header, an unrouted path and a wrong method all produce it, because
# the credential is checked before the path is. Nothing distinguishes a typo
# from an anonymous request.
#
# **`state` is documented as a prose list, typed `string`, and one of its
# members is listed twice.** The description runs through sixteen values, and
# `FAILED_HIBERNATING` appears at both ends of it, with the same explanatory
# clause each time. There is no enum; the list of legal values is a sentence.
#
# **And twelve of those states are about Kubernetes.** On a datacentre's
# metadata type, most of the documented states are annotated "relevant for
# Kubernetes cluster/nodepool" -- so the state field of every resource is the
# union of every resource's states, and almost none of them can apply here.
#
# **The type enum names twenty-six values and accepts thirty-five.** The SDK
# declares constants for `datacenter`, `server`, `collection` and so on, and its
# own validator then checks against a longer list containing `firewall-rule`,
# `flow-log`, `request-status`, `s3key`, `k8s`, `forwarding-rule`,
# `natgateway-rule`, `target-group` and `security-group`. Every one of the nine
# extra values has a hyphen in it, and a Go constant cannot -- so the naming
# convention quietly dropped a quarter of the enum.
#
# **A creation timestamp is documented as "The last time the resource was
# created."** On `createdDate`, in the metadata of every object.
#
# **Four fields for two facts.** `createdBy` and `createdByUserId`,
# `lastModifiedBy` and `lastModifiedByUserId` -- the name and the identifier of
# each, side by side.
#
# **The offset and the limit are floating point.** `Offset` and `Limit` are
# `float32` in the listing envelope, so the position in a collection is a real
# number.
#
# **And the collection is itself a resource.** The envelope carries `id`, `type`
# and `href` of its own, beside `items`, so a page of datacentres has an
# identity and an address the same way a datacentre does.
#
# Also pinned: `id` on a record is `[optional]`, so the identifier may be
# absent; the data is under `properties` while the identity sits beside it and
# the child collections sit under `entities`, all in one object; `etag` is a
# record field described by a link to RFC 2616, which RFC 7232 obsoleted in
# 2014, over plain HTTP; and the `Type` model's own documentation page has an
# empty properties table.

recipe: ionos
capability: infrastructure
version: 0.1.0

upstream:
  api: v6
  docs: https://api.ionos.com/docs/cloud/v6/
  # No spec: api.ionos.com/cloudapi/v6/swagger.json sits behind the credential
  # check, and no machine-readable description is served at any address this
  # Recipe could reach anonymously. The record shape below is the generated Go
  # SDK's own model documentation.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y000000000000000000
  absent_error: unauthorized
  rejected_error: unauthorized
  malformed_error: unauthorized
  # Checked before the path is: every request that gets it wrong gets this.

responses:
  list:
    style: wrapped
    key: items
    limit_field: limit
    page_field: offset
    cursor_field: links.next
    cursor_url: absolute
    prev_field: links.prev
    fields:
      # The page is a resource: it has an identity and an address of its own.
      id: datacenters
      type: collection
      href: https://api.ionos.com/cloudapi/v6/datacenters
      links.self: https://api.ionos.com/cloudapi/v6/datacenters?offset=0&limit=100
  error:
    style: list
    key: messages
    message_field: message
    # A string, beside an httpStatus that is a number.
    code_field: errorCode
    code_type: string
    fields:
      # The status again, on the envelope rather than inside the array, and a
      # number where the code beside it is a string.
      httpStatus: 401

resources:
  datacenter:
    id:
      field: id
      style: uuid
    fields:
      # "The type of object that has been created", on the object.
      type:
        type: string
      href:
        type: string
      metadata:
        type: map
      # Where the actual data lives, beside the identity rather than as it.
      properties:
        type: map
      # And the child collections, in the same object.
      entities:
        type: map

routes:
  - method: GET
    path: /cloudapi/v6/datacenters
    resource: datacenter
    operation: list
    pagination:
      style: offset
      first_page: 0
      limit: 100
      limit_param: limit
      cursor_param: offset

errors:
  unauthorized:
    status: 401
    code: "315"
    message: Unauthorized

fixtures:
  empty:
    datacenter: []

  estate:
    datacenter:
      - id: 8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60
        type: datacenter
        href: https://api.ionos.com/cloudapi/v6/datacenters/8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60
        metadata:
          # Described by a link to RFC 2616, over plain HTTP.
          etag: 0e08b27d7e4b6c1c1e0b8b1f6c2b3a4d
          # "The last time the resource was created."
          createdDate: "2026-02-11T08:44:12Z"
          # The name...
          createdBy: person@example.com
          # ...and the identifier of the same person.
          createdByUserId: 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
          lastModifiedDate: "2026-09-02T13:05:41Z"
          lastModifiedBy: person@example.com
          lastModifiedByUserId: 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
          # A value from a sixteen-item list written as a sentence.
          state: AVAILABLE
        properties:
          name: production
          description: staging, production
          location: de/txl
          version: 14
          features:
            - SSD
            - MULTIPLE_CPU
          secAuthProtection: false
          ipv6CidrBlock: 2001:db8:1234:5600::/56
          defaultSecurityGroupId: 6b1a9c8d-2e3f-4a5b-8c7d-0e1f2a3b4c5d
        entities:
          servers:
            id: 8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60/servers
            type: collection
            href: https://api.ionos.com/cloudapi/v6/datacenters/8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60/servers
      - id: 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21
        type: datacenter
        href: https://api.ionos.com/cloudapi/v6/datacenters/4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21
        metadata:
          etag: 5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d
          createdDate: "2026-07-30T16:20:00Z"
          createdBy: person@example.com
          createdByUserId: 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
          lastModifiedDate: "2026-07-30T16:20:00Z"
          lastModifiedBy: person@example.com
          lastModifiedByUserId: 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
          # A Kubernetes state, on a datacentre, because the field is the
          # union of every resource's states.
          state: BUSY
        properties:
          name: lab
          description: ""
          location: us/las
          version: 1
          features: []
          secAuthProtection: false
          # "either 'null' or ... It can neither be changed nor removed."
          ipv6CidrBlock: null
          defaultSecurityGroupId: null
        entities:
          servers:
            id: 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21/servers
            type: collection
            href: https://api.ionos.com/cloudapi/v6/datacenters/4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21/servers

conformance:
  - name: one number is quoted and the other is not
    source: https://api.ionos.com/cloudapi/v6/datacenters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers: {}
    expect:
      status: 401
      body:
        # A JSON number...
        httpStatus: 401
        # ...and a JSON string, both integers, in one object.
        'messages[0].errorCode': "315"
        # And a plural array carrying one of them.
        'messages[0].message': Unauthorized

  - name: a wrong bearer gets exactly the same object
    source: https://api.ionos.com/cloudapi/v6/datacenters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        httpStatus: 401
        'messages[0].errorCode': "315"

  - name: a Basic header gets it too
    source: https://api.ionos.com/cloudapi/v6/datacenters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Basic Zm9vOmJhcg=="
    expect:
      status: 401
      body:
        'messages[0].message': Unauthorized

  - name: a path that does not exist is answered by the credential check
    source: https://api.ionos.com/cloudapi/v6/cauldron-nope
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        # Nothing distinguishes a typo from an anonymous request.
        httpStatus: 401
        'messages[0].errorCode': "315"

  - name: a method the route does not take is answered by it as well
    source: https://api.ionos.com/cloudapi/v6/datacenters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: PUT
      path: /cloudapi/v6/datacenters
      headers: {}
    expect:
      status: 401
      body:
        httpStatus: 401
        'messages[0].message': Unauthorized

  - name: the data is under properties and the identity sits beside it
    source: https://github.com/ionos-cloud/sdk-go
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # One object: the identity, the payload, and the child collections.
        'items[0].id': 8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60
        'items[0].type': datacenter
        'items[0].href': https://api.ionos.com/cloudapi/v6/datacenters/8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60
        'items[0].properties.name': production
        'items[0].properties.location': de/txl
        'items[0].entities.servers.type': collection
        'items[0].entities.servers.href': https://api.ionos.com/cloudapi/v6/datacenters/8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60/servers

  - name: four fields for two facts and a creation date that keeps happening
    source: https://github.com/ionos-cloud/sdk-go
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # "The last time the resource was created."
        'items[0].metadata.createdDate': "2026-02-11T08:44:12Z"
        # The name and the identifier of the same person, twice over.
        'items[0].metadata.createdBy': person@example.com
        'items[0].metadata.createdByUserId': 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
        'items[0].metadata.lastModifiedBy': person@example.com
        'items[0].metadata.lastModifiedByUserId': 3c9d2e1f-7a5b-4c6d-8e0f-9a1b2c3d4e5f
        'items[0].metadata.lastModifiedDate': "2026-09-02T13:05:41Z"
        # Described by a link to RFC 2616, over plain HTTP.
        'items[0].metadata.etag': 0e08b27d7e4b6c1c1e0b8b1f6c2b3a4d

  - name: the state is one of sixteen values written as a sentence
    source: https://github.com/ionos-cloud/sdk-go
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # No enum anywhere: the legal values are a prose list, and
        # FAILED_HIBERNATING is in it twice.
        'items[0].metadata.state': AVAILABLE
        'items[1].metadata.state': BUSY

  - name: an address block that is either null or permanent
    source: https://github.com/ionos-cloud/sdk-go
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # "It can neither be changed nor removed."
        'items[0].properties.ipv6CidrBlock': 2001:db8:1234:5600::/56
        'items[1].properties.ipv6CidrBlock': null
        'items[0].properties.version': 14
        'items[0].properties.features[0]': SSD
        'items[1].properties.features': []
        'items[0].properties.secAuthProtection': false
        'items[0].properties.description': staging, production
        'items[1].properties.description': ""
        'items[0].properties.defaultSecurityGroupId': 6b1a9c8d-2e3f-4a5b-8c7d-0e1f2a3b4c5d
        'items[1].properties.defaultSecurityGroupId': null

  - name: the page is a resource and its position is a real number
    source: https://github.com/ionos-cloud/sdk-go
    fixture: estate
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
      query:
        limit: "1"
        offset: "0"
    expect:
      status: 200
      body:
        # The collection has an identity and an address of its own...
        id: datacenters
        type: collection
        href: https://api.ionos.com/cloudapi/v6/datacenters
        # ...and Offset and Limit are float32 in the SDK.
        offset: 0
        limit: 1
        'links.self': https://api.ionos.com/cloudapi/v6/datacenters?offset=0&limit=100
        'links.prev': null
      matches:
        'links.next': '\A\S+offset=1'

  - name: a contract with no datacentres still sends the collection resource
    source: https://github.com/ionos-cloud/sdk-go
    fixture: empty
    request:
      method: GET
      path: /cloudapi/v6/datacenters
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        items: []
        type: collection
        id: datacenters
