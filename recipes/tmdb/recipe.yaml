# TMDB Recipe for Cauldron
#
# The failure carries its own numeric status, separate from the HTTP one.
#
#   GET /3/movie/550          (no key)
#   ->  401  {"status_code":7,"status_message":"Invalid API key: You must be
#             granted a valid key.","success":false}
#
# status_code is not the HTTP status restated: TMDB's own error reference
# (https://developer.themoviedb.org/docs/errors) lists 47 of them against a
# handful of HTTP statuses, and twelve different status_codes -- 3, 7, 10, 14,
# 16, 17, 30, 31, 32, 33, 35, 36, 38, 39 -- all answer 401. A client that
# switches on the HTTP status alone cannot tell "no key", "suspended key",
# "expired token" and "email not verified" apart; it has to read the body.
#
# **And every failure this project could reach without a key is the identical
# body.** Checked against api.themoviedb.org on 2026-08-31: no key at all, a
# fake key, a fake key on a movie id that does not exist, a Bearer token that
# is not real, a POST instead of a GET, and a path that does not exist under
# /3 or /4 -- six different kinds of wrong request, one status_code, one
# sentence, byte for byte:
#
#   {"status_code":7,"status_message":"Invalid API key: You must be granted a
#    valid key.","success":false}
#
# 103 bytes every time. TMDB checks the key before it looks at anything else
# about the request, so a bad path and a bad id and a bad key all fail for the
# same reason as far as an unauthenticated caller can tell.
#
# **Except when the path is not TMDB's at all.** GET /xyz -- outside /3 and
# /4 entirely -- never reaches the application: it is a 404 from the edge
# (openresty), Content-Type text/html with no charset, a 150-byte HTML page,
# not the JSON error above. That is a real, different, verified behaviour and
# this Recipe cannot reproduce it: Cauldron checks a Recipe's auth scheme
# before it ever attempts to match a route (see internal/runtime/handler.go),
# so there is no way to serve "wrong or missing key" for versioned paths and
# "not this application's problem" for everything else. Stated rather than
# forced.
#
# No rate-limit header of any kind appears on api.themoviedb.org, on any of
# the probes above. (developer.themoviedb.org, the documentation site, sends
# x-ratelimit-* headers of its own -- that is ReadMe's docs platform limiting
# requests to the docs page, and has nothing to do with the API being
# described.)
#
# Two more the Recipe pins, both from the provider's own OpenAPI description
# (https://developer.themoviedb.org/openapi/tmdb-api.json), served as JSON and
# read rather than called -- nothing below this point was reachable without a
# key:
#
#   1. A movie is two different shapes depending on how you got to it. The
#      full record from /3/movie/{id} carries budget, revenue, runtime,
#      tagline, homepage, imdb_id and genres as {id, name} objects -- 25
#      fields. A hit from /3/search/movie carries 14: none of the above, and
#      genre_ids as a bare array of integers instead. One provider, one
#      concept, two wire shapes, distinguished only by which endpoint sent it.
#   2. Two list envelopes coexist on the same host. /3/search/movie wraps its
#      array in {page, results, total_pages, total_results}; /3/genre/movie/list
#      answers {"genres": [...]} and none of the other three keys exist at
#      all. A client that reads total_results off the second finds nothing.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - language and region are real query parameters (see the OpenAPI
#     description: language defaults to "en-US" on most routes) and are widely
#     reported, outside TMDB's own docs, to return empty strings rather than
#     null for a field with no localised value in the requested language. That
#     claim is not in TMDB's own OpenAPI description or its errors reference,
#     and there is no way to call the real API and check it without a key, so
#     it is deliberately not modelled here. The one hint in the evidence this
#     Recipe does have: the OpenAPI description's own worked example for
#     /3/genre/movie/list -- not a case this Recipe wrote, the provider's own
#     documentation sample -- comes back in German ("Komödie", not "Comedy")
#     for reasons the description never states. Suggestive, not confirmed, and
#     not retestable here.
#   - No 404 is documented anywhere in TMDB's own OpenAPI description, for any
#     route. status_code 6 ("Invalid id") and 34 ("The resource you requested
#     could not be found") both come from the separate errors reference page
#     rather than from the machine-readable description, and neither has been
#     called against the real API: there is no way to reach a 404 without a
#     key that TMDB accepts.
#   - Two records are served, of the real catalogue. The movie and both search
#     hits below are the OpenAPI description's own worked examples, not this
#     Recipe's invention -- but they were read from the description, not
#     fetched from /3/movie/11 or /3/search/movie by this project, so they
#     carry no verified date either.

recipe: tmdb
capability: media
version: 0.1.0

upstream:
  api: v3
  docs: https://developer.themoviedb.org/reference/intro/getting-started
  spec: https://developer.themoviedb.org/openapi/tmdb-api.json
  spec_hash: cb0306d6f44d297f00b2f53c4de37a70f4621408d8ba50df9c84b23288a7f953
  spec_seen: "2026-08-31"

auth:
  # Query, not a header: TMDB v3 takes api_key on the URL, and a key sent as
  # a query parameter belongs in logs and browser history the way this
  # emulator reproduces.
  scheme: query
  param: api_key
  keys:
    - cauldron-tmdb-fixture-key-000000000000

responses:
  list:
    # /3/search/movie's own envelope. /3/genre/movie/list is none of this,
    # and says so on its own route below.
    style: wrapped
    key: results
    count_field: total_results
    pages_field: total_pages
    page_field: page
  resource:
    style: bare
  error:
    # The message and the code are two different fields, and the code is a
    # number restated in words nowhere else in the body.
    style: flat
    message_field: status_message
    code_field: status_code
    code_type: number
    fields:
      success: false

resources:
  # The full record from /3/movie/{movie_id}. 25 fields, and none of them
  # is what /3/search/movie sends for the same movie -- see search_result.
  movie:
    id:
      style: numeric
      type: number
    fields:
      adult:
        type: boolean
      backdrop_path:
        type: string
      belongs_to_collection:
        type: map
      budget:
        type: integer
      genres:
        type: list
      homepage:
        type: string
      imdb_id:
        type: string
      origin_country:
        type: list
      original_language:
        type: string
      original_title:
        type: string
      overview:
        type: string
      popularity:
        type: number
      poster_path:
        type: string
      production_companies:
        type: list
      production_countries:
        type: list
      release_date:
        type: string
      revenue:
        type: integer
      runtime:
        type: integer
      spoken_languages:
        type: list
      status:
        type: string
      tagline:
        type: string
      title:
        type: string
      video:
        type: boolean
      vote_average:
        type: number
      vote_count:
        type: integer

  # A hit from /3/search/movie. 14 fields: genre_ids rather than genres, and
  # none of budget, revenue, runtime, tagline, homepage, imdb_id or the rest.
  search_result:
    id:
      style: numeric
      type: number
    fields:
      adult:
        type: boolean
      backdrop_path:
        type: string
      genre_ids:
        type: list
      original_language:
        type: string
      original_title:
        type: string
      overview:
        type: string
      popularity:
        type: number
      poster_path:
        type: string
      release_date:
        type: string
      title:
        type: string
      video:
        type: boolean
      vote_average:
        type: number
      vote_count:
        type: integer

  # /3/genre/movie/list's entries. No envelope fields beside them -- see the
  # route below.
  genre:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string

routes:
  - method: GET
    path: /3/movie/{id}
    resource: movie
    operation: get
    # status_code 6, not 34: TMDB's errors reference gives a bad id its own
    # code, separate from the generic "resource not found" a bad path gets.
    not_found: invalid_id

  - method: GET
    path: /3/search/movie
    resource: search_result
    operation: list
    pagination:
      style: page
      limit: 20
      # TMDB fixes the page at 20 and takes no size parameter at all --
      # "-" says so rather than leaving the runtime to guess "limit".
      limit_param: "-"
      cursor_param: page

  - method: GET
    path: /3/genre/movie/list
    resource: genre
    operation: list
    list:
      # A bare {"genres": [...]}. None of the search envelope's other three
      # keys exist on this route at all.
      key: genres
      count_field: "-"
      pages_field: "-"
      page_field: "-"
    pagination:
      # The OpenAPI description gives this route one parameter, language, and
      # no page or size of any kind: TMDB always answers with the whole
      # list. "-" on both names says so explicitly, rather than leaving the
      # runtime to default to a page of ten read from "limit", which TMDB
      # does not accept here either.
      style: page
      limit_param: "-"
      cursor_param: "-"

errors:
  # Verified: this is the one body every unauthenticated probe answered with,
  # whatever was wrong about the request.
  authentication_error:
    status: 401
    code: "7"
    message: "Invalid API key: You must be granted a valid key."
    headers:
      Content-Type: application/json; charset=utf-8

  # Documented only (developer.themoviedb.org/docs/errors), and not callable
  # here: reaching it needs a key TMDB accepts.
  invalid_id:
    status: 404
    code: "6"
    message: "Invalid id: The pre-requisite id is invalid or not found."

  # Overrides the runtime's own unknown_route default, so an authenticated
  # request for a path TMDB does not have gets TMDB's shape rather than a
  # generic one. Documented only, same caveat as invalid_id above.
  unknown_route:
    status: 404
    code: "34"
    message: "The resource you requested could not be found."

