conformance:
  - name: the body carries its own status_code, separate from the HTTP status
    source: https://api.themoviedb.org/3/movie/550
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /3/movie/550
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        status_code: 7
        status_message: "Invalid API key: You must be granted a valid key."
        success: false

  - name: a key that is simply wrong answers with the identical body
    source: https://api.themoviedb.org/3/movie/999999999?api_key=malformed_test_key_not_real
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /3/movie/999999999
      query:
        api_key: malformed_test_key_not_real
    expect:
      # A bad key and a bad id at once, and the answer is the same 103 bytes
      # as a bare missing key: TMDB never got far enough to notice the id.
      status: 401
      body:
        status_code: 7
        status_message: "Invalid API key: You must be granted a valid key."

  - name: a path outside every version prefix does not change this either
    source: https://api.themoviedb.org/3/nonexistentendpoint
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /3/nonexistentendpoint
    expect:
      # Still the key error, not a routing one: TMDB checks the key before
      # it checks the path, for any path this Recipe's engine can reach.
      status: 401
      body:
        status_code: 7

  - name: with a key, an unrouted path gets TMDB's own 404 instead
    source: https://developer.themoviedb.org/docs/errors
    fixture: catalogue
    request:
      method: GET
      path: /3/nonexistentendpoint
      query:
        api_key: cauldron-tmdb-fixture-key-000000000000
    expect:
      # Only reachable with a key this emulator accepts, which is why this
      # case has no verified date: nobody has a TMDB key to call it for
      # real. Documented, not observed.
      status: 404
      body:
        status_code: 34
        status_message: "The resource you requested could not be found."

  - name: a movie id that is not a movie gets its own status_code
    source: https://developer.themoviedb.org/docs/errors
    fixture: catalogue
    request:
      method: GET
      path: /3/movie/999999999
      query:
        api_key: cauldron-tmdb-fixture-key-000000000000
    expect:
      status: 404
      body:
        status_code: 6
        status_message: "Invalid id: The pre-requisite id is invalid or not found."

  - name: the full record carries budget, revenue and genres as objects
    source: https://developer.themoviedb.org/openapi/tmdb-api.json
    fixture: catalogue
    request:
      method: GET
      path: /3/movie/11
      query:
        api_key: cauldron-tmdb-fixture-key-000000000000
    expect:
      status: 200
      body:
        id: 11
        title: Star Wars
        budget: 11000000
        revenue: 775398007
        runtime: 121
        tagline: A long time ago in a galaxy far, far away...
        imdb_id: tt0076759
        "genres[0].id": 12
        "genres[0].name": Adventure
        "belongs_to_collection.name": Star Wars Collection

  - name: a search hit carries none of that, and genre_ids instead
    source: https://developer.themoviedb.org/openapi/tmdb-api.json
    fixture: catalogue
    request:
      method: GET
      path: /3/search/movie
      query:
        api_key: cauldron-tmdb-fixture-key-000000000000
        query: fight club
    expect:
      status: 200
      body:
        # Two records here against the description's own 39: the emulator
        # counts what its fixture holds, the same as this project's other
        # Recipes do when a real listing is bigger than what is seeded.
        page: 1
        total_pages: 1
        total_results: 2
        "results[0].id": 550
        "results[0].title": Fight Club
        "results[0].genre_ids[0]": 18
        "results[1].id": 289732
        "results[1].title": Zombie Fight Club
      absent:
        # None of the full record's fields leaked into the search shape.
        - "results[0].budget"
        - "results[0].genres"
        - "results[0].tagline"

  - name: the genre list is bare, with none of the search envelope's fields
    source: https://developer.themoviedb.org/openapi/tmdb-api.json
    fixture: catalogue
    request:
      method: GET
      path: /3/genre/movie/list
      query:
        api_key: cauldron-tmdb-fixture-key-000000000000
    expect:
      status: 200
      body:
        "genres[0].id": 28
        "genres[0].name": Action
        # The provider's own example, not this Recipe's: read in German for
        # reasons the description never explains.
        "genres[1].name": Komödie
      absent:
        - page
        - total_pages
        - total_results

  # The position. This route names no page size at all -- limit_param is
  # "-" -- so there is no way to show one, and the pair this generator
  # usually writes is a single case. page=2 answers something the first
  # request did not, which a name nobody read could not produce.
  - name: "page moves the page on for 3 search movie"
    source: "https://developer.themoviedb.org/openapi/tmdb-api.json"
    fixture: catalogue
    request:
      method: GET
      path: "/3/search/movie"
      query:
        "api_key": "cauldron-tmdb-fixture-key-000000000000"
        "query": "fight club"
        "page": "2"
    expect:
      status: 200
      absent:
        - "results[0]"

  # The names. This Recipe declares 17 field(s) on a movie that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 14 name(s) that came back at the paths they came back
  # under.
  - name: "a movie carries the field names this Recipe declares"
    source: "https://developer.themoviedb.org/openapi/tmdb-api.json"
    fixture: catalogue
    request:
      method: GET
      path: "/3/movie/11"
      query:
        "api_key": "cauldron-tmdb-fixture-key-000000000000"
    expect:
      status: 200
      body:
        "adult": false
        "backdrop_path": "/2w4xG178RpB4MDAIfTkqAuSJzec.jpg"
        "homepage": "http://www.starwars.com/films/star-wars-episode-iv-a-new-hope"
        "origin_country[0]": "US"
        "original_language": "en"
        "original_title": "Star Wars"
        "overview": "Princess Leia is captured and held hostage by the evil Imperial forces in their effort to take over the galactic Empire. Venturesome Luke Skywalker and dashing captain Han Solo team together with the loveable robot duo R2-D2 and C-3PO to rescue the beautiful princess and restore peace and justice in the Empire."
        "popularity": 20.6912
        "belongs_to_collection.poster_path": "/pWVLFh4OuejTpUaDQbB1C4zoS2p.jpg"
        "release_date": "1977-05-25"
        "status": "Released"
        "video": false
        "vote_average": 8.2
        "vote_count": 22061

  # The names. This Recipe declares 11 field(s) on a search_result that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 11 name(s) that came back at the paths they came
  # back under.
  - name: "a search_result carries the field names this Recipe declares"
    source: "https://developer.themoviedb.org/openapi/tmdb-api.json"
    fixture: catalogue
    request:
      method: GET
      path: "/3/search/movie"
      query:
        "api_key": "cauldron-tmdb-fixture-key-000000000000"
        "query": "fight club"
    expect:
      status: 200
      body:
        "results[0].adult": false
        "results[0].backdrop_path": "/hZkgoQYus5vegHoetLkCJzb17zJ.jpg"
        "results[0].original_language": "en"
        "results[0].original_title": "Fight Club"
        "results[0].overview": "A ticking-time-bomb insomniac and a slippery soap salesman channel primal male aggression into a shocking new form of therapy. Their concept catches on, with underground \"fight clubs\" forming in every town, until an eccentric gets in the way and ignites an out-of-control spiral toward oblivion."
        "results[0].popularity": 73.433
        "results[0].poster_path": "/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg"
        "results[0].release_date": "1999-10-15"
        "results[0].video": false
        "results[0].vote_average": 8.433
        "results[0].vote_count": 26279


