# Replit Recipe for Cauldron
#
# The project listing, read from the OpenAPI document Replit serves without a
# credential at api.replit.com/openapi.json, and struck live on 2026-09-13 with
# no credential, with a wrong key, on a path that does not exist, and with a
# method the path does not take.
#
# **Two paths have swapped names.** `/audit-logs` carries the operation
# `listAuditLogsLegacy`; `/compliance/messages` carries `listAuditLogs`, and its
# 200 is described as "Audit log event list." So the path named for audit logs
# is the legacy one and the path named for compliance messages is the current
# audit-log endpoint -- and a client picking by path name picks the wrong one.
#
# **The credential is checked before the path.** Struck live, every one of these
# answers `{"error":{"code":"unauthenticated","message":"No API key
# provided.","details":null}}`:
#
#   GET /v1/projects
#   GET /v1/compliance/messages
#   GET /v1/cauldron-nope
#   PUT /v1/projects
#
# So a typo in the path, a typo in the verb and a missing key are one answer,
# and nothing tells them apart.
#
# **`details` is always present and always null.** On every failure, a third
# key with nothing in it.
#
# **Paging is a `oneOf` discriminated by a boolean constant.** `pagination` is
# either `{cursor: string, hasMore: const true}` or
# `{cursor: null, hasMore: const false}`. Both branches require both keys, so
# the shape never changes -- but a validator has to match a literal `true` or
# `false` rather than read a field, and `cursor` is typed `string` in one branch
# and `null` in the other.
#
# **A field called creator is documented as the owner.** `creatorId` is "Current
# project owner user ID, or null when unavailable" -- present tense, ownership,
# under a name about who made it, and nullable on a `required` field.
#
# **And a project that has never been updated says it was.** `updatedAt` is
# "Last project update time, or createdAt when no update timestamp exists", so
# the two fields are equal for an untouched project and nothing distinguishes
# that from one updated in the same second it was made.
#
# **The page size is in the schema.** `data` is `{"maxItems": 100}`, so the cap
# on a page is a property of the response type rather than of the parameter that
# asks for it.
#
# Also pinned: `bearerFormat` is `"Replit API key"`, a human phrase where a
# token format name belongs; every schema is `additionalProperties: false`; and
# the workspace embedded in a project declares three patterns -- `^[A-Za-z0-9]+$`
# for the id, `^[0-9A-Za-z-]+$` for the slug, and none at all for the name --
# all of them anchored, which is worth saying because so few are.

recipe: replit
capability: hosting
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://docs.replit.com/replit-api
  spec: https://api.replit.com/openapi.json
  spec_hash: 53fd1607d151d239ef609ac573005f3e2e1659c259f9523b5f295185eeb88c14
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - rpl_cauldr0nf1xturek3y000000000000
  absent_error: no_api_key_provided
  malformed_error: no_api_key_provided
  rejected_error: invalid_api_key
  # Checked before the path is.

responses:
  list:
    style: wrapped
    key: data
    cursor_field: pagination.cursor
    cursor_null: true
    has_more_field: pagination.hasMore
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    fields:
      # Always there, and always empty.
      error.details: null

resources:
  project:
    id:
      field: id
      style: opaque
      length: 22
    fields:
      # "Current project owner user ID", under a name about who made it.
      creatorId:
      title:
        type: string
      slug:
        type: string
      workspace:
        type: map
      createdAt:
        type: string
      # "…or createdAt when no update timestamp exists."
      updatedAt:
        type: string

routes:
  - method: GET
    path: /v1/projects
    resource: project
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: cursor
    filters:
      - param: search
        field: title

errors:
  no_api_key_provided:
    status: 401
    code: unauthenticated
    message: No API key provided.

  invalid_api_key:
    status: 401
    code: unauthenticated
    message: Invalid API key.

fixtures:
  empty:
    project: []

  workspace:
    project:
      - id: 7Kq2mX9pLz4vB1nR8sT3wY
        creatorId: usr_4f3e2d1c0b9a8877
        title: Handbook
        slug: handbook
        workspace:
          id: wsp9Zx8Cv7Bn6Mq5Wp4Er3Ty
          name: Platform Team
          slug: platform-team
        createdAt: "2026-02-11T08:44:12.000Z"
        # Later than createdAt: this one really was updated.
        updatedAt: "2026-09-02T13:05:41.000Z"
      - id: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf0
        # Nullable, on a required field, under a name about the creator.
        creatorId: null
        title: Scratch
        slug: scratch
        workspace:
          id: wsp9Zx8Cv7Bn6Mq5Wp4Er3Ty
          name: Platform Team
          slug: platform-team
        createdAt: "2026-07-30T16:20:00.000Z"
        # Equal to createdAt, which is what "no update timestamp exists"
        # looks like on the wire.
        updatedAt: "2026-07-30T16:20:00.000Z"

conformance:
  - name: a missing key answers every kind of mistake
    source: https://api.replit.com/v1/projects
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers: {}
    expect:
      status: 401
      body:
        error.code: unauthenticated
        error.message: No API key provided.
        # Always there, and always empty.
        error.details: null

  - name: an unrouted path gets it too
    source: https://api.replit.com/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        error.code: unauthenticated
        error.message: No API key provided.

  - name: and so does a method the route does not take
    source: https://api.replit.com/v1/projects
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: PUT
      path: /v1/projects
      headers: {}
    expect:
      status: 401
      body:
        error.message: No API key provided.
        error.details: null

  - name: a wrong key differs by one sentence and nothing else
    source: https://api.replit.com/v1/projects
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_notarealkey"
    expect:
      status: 401
      body:
        # The same code, the same null, a different sentence.
        error.code: unauthenticated
        error.message: Invalid API key.
        error.details: null

  - name: a field called creator is documented as the owner
    source: https://api.replit.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
    expect:
      status: 200
      body:
        # "Current project owner user ID, or null when unavailable."
        'data[0].creatorId': usr_4f3e2d1c0b9a8877
        'data[1].creatorId': null
        'data[0].title': Handbook
        'data[0].slug': handbook

  - name: a project that was never updated says it was
    source: https://api.replit.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
    expect:
      status: 200
      body:
        # "Last project update time, or createdAt when no update timestamp
        # exists" -- so these two being equal means nothing in particular.
        'data[1].createdAt': "2026-07-30T16:20:00.000Z"
        'data[1].updatedAt': "2026-07-30T16:20:00.000Z"
        'data[0].createdAt': "2026-02-11T08:44:12.000Z"
        'data[0].updatedAt': "2026-09-02T13:05:41.000Z"

  - name: the workspace rides inside the project
    source: https://api.replit.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
      query:
        search: Handbook
    expect:
      status: 200
      body:
        # Three fields, two of them with anchored patterns and the third with
        # none.
        'data[0].workspace.id': wsp9Zx8Cv7Bn6Mq5Wp4Er3Ty
        'data[0].workspace.name': Platform Team
        'data[0].workspace.slug': platform-team
        'data[0].id': 7Kq2mX9pLz4vB1nR8sT3wY

  - name: paging is discriminated by a boolean constant
    source: https://api.replit.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        # {cursor: string, hasMore: const true}.
        'pagination.hasMore': true
      matches:
        'pagination.cursor': '\A\S+\z'

  - name: and the other branch types the cursor as null
    source: https://api.replit.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
      query:
        limit: "1"
        cursor: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf0
    expect:
      status: 200
      body:
        # {cursor: null, hasMore: const false} -- both required, both present,
        # and one of them typed "null" rather than nullable.
        'pagination.hasMore': false
        'pagination.cursor': null
        data: []

  - name: an account with no projects still sends both paging keys
    source: https://api.replit.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer rpl_cauldr0nf1xturek3y000000000000"
    expect:
      status: 200
      body:
        data: []
        'pagination.hasMore': false
        'pagination.cursor': null
