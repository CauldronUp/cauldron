# PagerDuty Recipe for Cauldron
#
# PagerDuty has no sandbox, and the thing you most want to test is the thing
# you least want to trigger: an incident wakes somebody up. A free developer
# account still pages whoever is on the schedule, so integrations get tested by
# creating incidents and resolving them quickly, or not at all. Escalation
# behaviour, which is the whole point of the product, is never exercised.
#
# Two things worth modelling exactly:
#
#   1. Authentication is not a bearer token. The header is
#      "Token token=<key>", and sending "Bearer <key>" fails in a way that
#      looks like a bad key rather than a bad scheme.
#   2. The error is nested with a code and a message and an array of detail
#      strings, and the code is PagerDuty's own numbering rather than the HTTP
#      status. Code that reads error.type finds nothing.
#
# Known fidelity gap, stated rather than hidden: PagerDuty identifiers are
# upper-case alphanumeric. Cauldron mints mixed case, so the shape is right and
# the character set is not.
#
# Keys below are fixtures, not secrets.

recipe: pagerduty
capability: observability
version: 0.1.0

upstream:
  api: "2"
  docs: https://developer.pagerduty.com/api-reference

auth:
  scheme: bearer
  header: Authorization
  # Not "Bearer ". Sending the wrong scheme reads like a bad key.
  prefix: "Token token="
  keys:
    - cauldron_api_key

responses:
  list:
    style: wrapped
    count_field: total
    has_more_field: more
    cursor_field: offset
  resource:
    style: wrapped
  error:
    style: nested
    # PagerDuty sends a code and a message. No type.
    type_field: "-"

resources:
  incident:
    collection: incidents
    constants:
      type: incident
      self: https://api.pagerduty.com/incidents
    id:
      prefix: P
      length: 6
    fields:
      incident_number:
        type: integer
      title:
        type: string
        required: true
      # No description. PagerDuty had one in v1 and replaced it with title,
      # and v2 sends title and summary and nothing called description -- so
      # code reading incident.description gets undefined against the real API
      # and a string here, which is the worse way round.
      # The lifecycle that matters. An acknowledged incident has stopped
      # escalating; a triggered one has not, and code that treats the two the
      # same lets a page keep climbing the rota.
      status:
        type: string
        default: triggered
      urgency:
        type: string
        default: high
      # Objects, not flat identifiers. PagerDuty sends a service and an
      # escalation policy as references with an id, a type and a summary
      # inside them, so comparing incident.service to a service id never
      # matches -- and it is truthy either way, so nothing throws.
      service_id:
        type: string
        in: service
        as: id
      escalation_policy_id:
        type: string
        in: escalation_policy
        as: id
      incident_key:
        type: string
      created_at:
        type: datetime
      last_status_change_at:
        type: datetime

  service:
    collection: services
    constants:
      type: service
    id:
      prefix: P
      length: 6
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      status:
        type: string
        default: active
      # An object here too, for the same reason.
      escalation_policy_id:
        type: string
        in: escalation_policy
        as: id
      auto_resolve_timeout:
        type: integer
      acknowledgement_timeout:
        type: integer
      created_at:
        type: datetime

  escalation_policy:
    collection: escalation_policies
    constants:
      type: escalation_policy
    id:
      prefix: P
      length: 6
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      num_loops:
        type: integer
        default: 2
      on_call_handoff_notifications:
        type: string
        default: if_has_services

routes:
  - method: GET
    path: /incidents
    resource: incident
    operation: list
    pagination:
      style: offset
      limit: 25
      # PagerDuty's own description declares limit and offset.
      limit_param: limit
      cursor_param: offset

  - method: POST
    path: /incidents
    resource: incident
    operation: create
    status: 201

  - method: GET
    path: /incidents/{id}
    resource: incident
    operation: get

  - method: PUT
    path: /incidents/{id}
    resource: incident
    operation: update

  - method: GET
    path: /services
    resource: service
    operation: list
    pagination:
      style: offset
      limit: 25
      # PagerDuty's own description declares limit and offset.
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /services/{id}
    resource: service
    operation: get

  - method: GET
    path: /escalation_policies
    resource: escalation_policy
    operation: list
    pagination:
      style: offset
      limit: 25
      # PagerDuty's own description declares limit and offset.
      limit_param: limit
      cursor_param: offset

webhooks:
  events:
    - incident.triggered
    - incident.acknowledged
    - incident.resolved
    - incident.escalated
    - incident.reassigned
    - incident.annotated
  signing:
    scheme: hmac-sha256
    header: X-PagerDuty-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: "2020"
    message: Rate limit exceeded
    headers:
      Retry-After: "30"

  # Confirmed live 2026-09-05 against api.pagerduty.com, no account and no
  # key -- both with no Authorization header at all and with the wrong
  # scheme (Bearer, sent from habit). This file's documented code-2006 body
  # is not what the API actually sends for either: it answers empty, zero
  # bytes, and the case that had asserted the JSON shape had never been
  # checked against it.
  authentication_error:
    status: 401
    empty: true

  resource_missing:
    status: 404
    code: "2100"
    message: "Not Found: {detail}"

  parameter_missing:
    status: 400
    code: "2001"
    message: "Invalid Input Provided: {detail} is required"

  # The From header is required to act on an incident as a person, and
  # omitting it is the first wall an automation hits.
  missing_from_header:
    status: 400
    code: "2001"
    message: Requester User Not Found. The From header must contain a valid user email.

  # PagerDuty deduplicates on incident_key, which is what stops a flapping
  # monitor paging a hundred times and what an integration must get right.
  duplicate_incident_key:
    status: 400
    code: "2002"
    message: An incident with this incident_key already exists and is not resolved.

fixtures:
  empty: {}

  small-account:
    escalation_policy:
      - id: PPOLICY
        name: Platform on-call
        num_loops: 2
    service:
      - id: PSVC001
        name: Checkout API
        status: active
        escalation_policy_id: PPOLICY
        auto_resolve_timeout: 14400
    incident:
      - id: PINC001
        incident_number: 1
        title: Checkout latency above threshold
        # Still escalating. Nobody has picked it up.
        status: triggered
        urgency: high
        service_id: PSVC001
        incident_key: checkout-latency
      - id: PINC002
        incident_number: 2
        title: Disk usage warning
        # Somebody is on it, so escalation has stopped.
        status: acknowledged
        urgency: low
        service_id: PSVC001
      - id: PINC003
        incident_number: 3
        title: Certificate expiring
        status: resolved
        urgency: low
        service_id: PSVC001

# Conformance cases, read from PagerDuty's API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: the credential scheme is Token, not Bearer
    # This asserted a code-2006 JSON body, sourced from PagerDuty's own
    # documentation, and passed because the Recipe served exactly that.
    # Confirmed live 2026-09-05: the real answer is empty, zero bytes. The
    # documented shape describes a failure this exact request does not
    # reach.
    source: https://api.pagerduty.com/incidents
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /incidents
      headers:
        Authorization: Bearer cauldron_api_key
    expect:
      status: 401
      no_body: true

  - name: no credential at all is the identical empty failure
    source: https://api.pagerduty.com/incidents
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /incidents
    expect:
      status: 401
      no_body: true

  - name: a single incident is wrapped under its resource name
    source: https://developer.pagerduty.com/api-reference/9d0b4b12e36f9-get-an-incident
    fixture: small-account
    request:
      method: GET
      path: /incidents/PINC001
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      body:
        incident:
          title: Checkout latency above threshold
          status: triggered
          urgency: high
          type: incident
          # PagerDuty stamps a self link on every object it sends. Declared as
          # a constant and asserted by nothing until now, so the name could
          # have been anything -- and it is the field a client follows to
          # fetch the thing again.
          self: https://api.pagerduty.com/incidents
      absent:
        - id
        - status

  - name: a reference is an object, and there is no description
    # PagerDuty sends a service and an escalation policy as references --
    # an object with an id inside it -- not as flat identifiers. Comparing
    # incident.service to a service id never matches, and the comparison is
    # against an object either way, so nothing throws and the branch is
    # simply never taken.
    #
    # description is a v1 field. v2 sends title and summary and nothing
    # called description, so code reading incident.description gets undefined
    # against the real API -- and got a string here, which is the worse way
    # round: it works locally and returns nothing in production.
    source: https://developer.pagerduty.com/api-reference/incidents
    fixture: small-account
    request:
      method: GET
      path: /incidents/PINC001
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      body:
        incident.service.id: PSVC001
        incident.title: Checkout latency above threshold
      absent:
        - incident.service_id
        - incident.escalation_policy_id
        - incident.description

  - name: an acknowledged incident has stopped escalating
    source: https://developer.pagerduty.com/docs/incident-lifecycle
    fixture: small-account
    request:
      method: GET
      path: /incidents/PINC002
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      body:
        # Code that treats acknowledged and triggered the same lets a page
        # keep climbing the rota after somebody has already picked it up.
        incident:
          status: acknowledged
          urgency: low

  - name: a collection reports a total and whether more remain
    source: https://developer.pagerduty.com/docs/pagination
    fixture: small-account
    request:
      method: GET
      path: /incidents
      query:
        limit: "2"
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      body:
        total: 3
        more: true
        incidents[0].incident_number: 1
        incidents[1].status: acknowledged
      absent:
        - incidents[2]
        - data

  - name: the error is nested with a code and a message and no type
    source: https://developer.pagerduty.com/docs/errors
    fixture: small-account
    request:
      method: GET
      path: /incidents/PNOPE00
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 404
      body:
        error:
          code: 2100
      matches:
        error.message: 'Not Found'
      # PagerDuty's code is its own numbering, not the HTTP status, and there
      # is no type field at all.
      absent:
        - error.type
        - message
        - errors

  - name: creating an incident answers 201 and starts it triggered
    source: https://developer.pagerduty.com/api-reference/a7d81b0e9200f-create-an-incident
    fixture: empty
    request:
      method: POST
      path: /incidents
      headers:
        Authorization: Token token=cauldron_api_key
      json:
        title: Database connection pool exhausted
        service_id: PSVC001
    expect:
      status: 201
      body:
        incident:
          title: Database connection pool exhausted
          # A new incident is escalating from the moment it exists.
          status: triggered
          urgency: high
          type: incident
      matches:
        incident.id: '^P[A-Za-z0-9]{6}$'

  - name: services carry the escalation policy that decides who is paged
    source: https://developer.pagerduty.com/api-reference/f1d7b0b8d6b1c-list-services
    fixture: small-account
    request:
      method: GET
      path: /services
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      body:
        services[0].name: Checkout API
        services[0].escalation_policy.id: PPOLICY
        services[0].status: active

  - name: the paging fields are named offset
    source: https://developer.pagerduty.com/api-reference
    fixture: small-account
    request:
      method: GET
      path: /incidents
      query:
        limit: "1"
      headers:
        Authorization: Token token=cauldron_api_key
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        offset: '.'


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads"
    source: "https://developer.pagerduty.com/docs/pagination"
    fixture: small-account
    request:
      method: GET
      path: "/incidents"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "incidents[0].id": "PINC002"
      absent:
        - "incidents[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads on incidents"
    source: "https://developer.pagerduty.com/docs/pagination"
    fixture: small-account
    request:
      method: GET
      path: "/incidents"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "incidents[0].id": "PINC002"
      absent:
        - "incidents[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the escalation_policy listing answers with what the fixture holds"
    source: "https://developer.pagerduty.com/api-reference/9d0b4b12e36f9-get-an-incident"
    fixture: small-account
    request:
      method: GET
      path: "/escalation_policies"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "escalation_policies[0].id": "PPOLICY"
      absent:
        - "escalation_policies[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but offset can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "offset moves past the only record, and the page comes back empty"
    source: "https://developer.pagerduty.com/api-reference/f1d7b0b8d6b1c-list-services"
    fixture: small-account
    request:
      method: GET
      path: "/services"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      absent:
        - "services[0]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but offset can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://developer.pagerduty.com/api-reference/9d0b4b12e36f9-get-an-incident"
    fixture: small-account
    request:
      method: GET
      path: "/escalation_policies"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      absent:
        - "escalation_policies[0]"

  # The names. This Recipe declares 3 field(s) on a escalation_policy
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "an escalation_policy carries the field names this Recipe declares"
    source: "https://developer.pagerduty.com/api-reference/9d0b4b12e36f9-get-an-incident"
    fixture: small-account
    request:
      method: GET
      path: "/escalation_policies"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "escalation_policies[0].num_loops": 2
        "escalation_policies[0].on_call_handoff_notifications": "if_has_services"

  # The names. This Recipe declares 4 field(s) on a incident that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an incident carries the field names this Recipe declares"
    source: "https://developer.pagerduty.com/docs/pagination"
    fixture: small-account
    request:
      method: GET
      path: "/incidents"
      query:
        "limit": "2"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "incidents[0].created_at": "2026-01-01T00:00:00Z"
        "incidents[0].incident_key": "checkout-latency"
        "incidents[0].last_status_change_at": "2026-01-01T00:00:00Z"
        "incidents[0].urgency": "high"

  # The names. This Recipe declares 4 field(s) on a service that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a service carries the field names this Recipe declares"
    source: "https://developer.pagerduty.com/api-reference/f1d7b0b8d6b1c-list-services"
    fixture: small-account
    request:
      method: GET
      path: "/services"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "services[0].auto_resolve_timeout": 14400
        "services[0].created_at": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 2 field(s) on an escalation_policy
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "an escalation_policy carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.pagerduty.com/api-reference/9d0b4b12e36f9-get-an-incident"
    fixture: small-account
    request:
      method: GET
      path: "/escalation_policies"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 200
      body:
        "escalation_policies[0].name": "Platform on-call"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://developer.pagerduty.com/api-reference"
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: "/incidents/PINC001"
      headers:
        "Authorization": "Token token=cauldron_api_key"
    expect:
      status: 429
      body:
        "error.code": 2020
        "error.message": "Rate limit exceeded"






