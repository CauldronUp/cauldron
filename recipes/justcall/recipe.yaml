# JustCall Recipe for Cauldron
#
# JustCall is one of three Recipes in this group asking the same question:
# a call has a recording that may be large and may not exist yet -- does the
# API return it inline, a URL, or nothing, and is that URL signed and
# time-limited? pdfmonkey/recipe.yaml and api2pdf/recipe.yaml already answer
# it for documents and both state a number: PDFMonkey's download_url is a
# "temporary signed URL... expires after 1 hour," Api2Pdf's FileUrl "will
# hold the PDF for only 24 hours." JustCall answers differently from both.
#
# THE RECORDING IS A URL ON THE RECORD ITSELF, AND JUSTCALL NEVER STATES A
# LIFETIME FOR IT. GET /v2.1/calls/{id}'s own OpenAPI schema -- fetched live
# from developer.justcall.io/reference/call_get_v21.md, 2026-09-01 -- gives
# call_info.recording the description "Recording link of the call" and this
# worked default value, quoted verbatim redactions and all:
#
#   https://bifrost.justcall.io/voice-tools-calling/v1/recording/get-presigned-url?recSid=REXXXXXac0aae0fXXXXXXedXXXXXa90&redirect=1&getSize=0&companyId=XXXX49
#
# The path segment names itself "get-presigned-url." Nothing in that
# description, or anywhere else this task found in JustCall's docs, states
# how long the link is good for. Presigned by name, undocumented by
# duration -- the one gap neither PDFMonkey nor Api2Pdf leaves open.
#
# It gets less stable than that, not more, elsewhere in JustCall's own
# materials. The Call Events webhook guide (docs/call-events.md) shows a
# SECOND shape for the same idea on a live "Missed Call in JustCall"
# payload:
#
#   https://callingservice.justcall.io/api/create_s3presigned_url.php?recsid=RE6d0754e4ab446abbxxxxxxxxxx&isnew=1&redirect=1&manid=26XXXX
#
# and its Sales Dialer sibling event (a separate product, same company) shows
# a third, with no query string and no signature-shaped parameter of any
# kind:
#
#   https://jc-recordings.s3.amazonaws.com/REcd1664567122baf51axxxxxxxxxxx.mp3
#
# Three documents, three hosts, three shapes, for what is described in each
# place as the same kind of link -- and not one of the three states an
# expiry. This Recipe declares only the REST field's own shape (the first
# one above), quoted from the endpoint this Recipe actually routes, and
# names the other two here rather than silently picking one.
#
# A SEPARATE, INDEPENDENT FETCH ALSO EXISTS: GET
# /v2.1/calls/{id}/recording/download. Its own OpenAPI 200 description is a
# curl command, not a JSON schema -- "curl --location
# '.../recording/download' --header 'Authorization: apikey:secretkey'
# --output recording.mp3" -- so a second, working mechanism streams the
# audio directly as bytes, addressed by the same call id, rather than
# handing back JSON with a link in it. This Recipe registers the route
# (confirmed live: it demands the same credential every other route does)
# and does not model a 200 for it: there is no credential to fetch real
# bytes with and no worked JSON body to cite, because the provider's own
# answer here is not JSON at all.
#
# A CALL STILL IN PROGRESS IS ADDRESSABLE, AND ITS RECORDING IS NOT.
# call_info.type's documented enum (same source) includes "In Progress" for
# both Incoming and Outgoing direction -- a live call has a call id and a GET
# on it is meaningful mid-call. What is refused is stated twice in JustCall's
# own words: the recording-download endpoint's description says "Recordings
# are generated only after the call has ended and cannot be accessed for
# ongoing or in-progress calls," and Update a call's says "Updates to ongoing
# or in-progress calls are not supported." Nothing this task read states
# whether GET itself is refused for one -- only that the recording and an
# update are -- so this Recipe fetches an in-progress call the same way as
# any other and simply leaves recording, recording_child and every duration
# field off it, which is the one part of that object no source here shows
# populated for a call that has not ended.
#
# JUSTCALL'S OWN LIST SCHEMA DISAGREES WITH ITSELF, WHICH IS WHY THIS RECIPE
# HAS NO LIST ROUTE. "List all calls"' own OpenAPI 200 response
# (call_list_v21.md) points its schema at #/components/schemas/CallResponse21DTO
# -- the single-call object, not an array, not any wrapper -- for a listing
# endpoint. Contrast the Contacts family in the same published spec, whose
# list endpoint properly references ListContactsResponseDto: {count,
# current_page, data: [...], next_page_link, per_page, prev_page_link}. That
# schema exists in this API; the Calls list just does not point at it, or at
# anything else array-shaped. Guessing the Contacts envelope for Calls would
# be inventing a shape nobody has shown for this resource. This Recipe
# declares get-by-id only and says why here instead of guessing.
#
# THE id PARAMETER TAKES EITHER FORM ON PURPOSE. call_get_v21's own
# description of the id path parameter: "This can be either the numeric Call
# ID or the alphanumeric Call SID." Modelled with this format's alias
# mechanism -- the same device jira/recipe.yaml uses for its numeric id and
# human-readable key -- so one route answers both.
#
# Credentials, routing and methods, struck live against api.justcall.io,
# 2026-09-01, with no account and no credential this task holds:
#
#   - No Authorization header, a garbage value, a Bearer-prefixed garbage
#     value, and a header present with an empty value all answered the
#     identical body: {"status":"failed","message":"Unauthorized"}, 401,
#     application/json. JustCall does not distinguish absent from malformed
#     from rejected in any way this task found; auth.absent_error,
#     .malformed_error and .rejected_error are left unset below because
#     naming three different entries for one observed sentence would claim a
#     distinction that is not there.
#   - Routing resolves before the credential does, and completely -- a path
#     this Recipe never registered and a real path with the wrong method
#     both answered 404 with no Authorization header sent at all, and
#     identically again with a wrong one:
#       GET /v2.1/this-is-not-a-real-endpoint -> 404
#       PATCH /v2.1/calls -> 404, "Cannot PATCH /v2.1/calls"
#       DELETE /v2.1/calls/12345 -> 404, "Cannot DELETE /v2.1/calls/12345"
#     Neither is a real 405: no Allow header on any of them, checked with
#     OPTIONS too. The body is Express's own default handler text --
#     "Cannot {METHOD} {path}" is the literal string Express's finalhandler
#     sends -- wrapped in JSON as {"status":"failed","message":"Cannot ..."}
#     rather than left as Express's default HTML page, which is what a
#     provider running Express and caring about its own envelope looks like
#     from outside. auth.after_routing: true carries this ordering.
#   - Cauldron's own unrouted-path handler passes only the path into
#     {detail}, not the method, so this Recipe's unknown_route case fixes
#     the verb at GET -- the one method this Recipe actually struck against
#     an unrouted path -- rather than claim a general "Cannot {METHOD}"
#     mechanism it cannot honestly provide. method_not_allowed does not have
#     this problem: Cauldron passes "METHOD /path" for that one, which is
#     exactly what JustCall's own wrong-method answer contains.
#   - A malformed id does not shortcut the credential check: GET
#     /v2.1/calls/not-a-real-id-@@@ with no Authorization header answered
#     the identical 401 Unauthorized every other unauthenticated GET on a
#     real route did, not a 404. Whatever JustCall does with a wrong-shaped
#     id happens behind the credential gate, which this task cannot see
#     without one.
#   - api.justcall.io/v2/calls (the legacy family the recording-download
#     endpoint's own curl example still uses, one version behind the v2.1
#     this Recipe targets) answers the identical 401 unauthenticated, so the
#     two families are still both live. Not modelled; this Recipe targets
#     v2.1 throughout, per its own docs.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Only the 401 and 404 cases below were struck live and carry a
#     verified date. The two call fixtures are this Recipe's own
#     construction from documented field names, the documented type enum
#     (which includes "In Progress"), and the documented recording-access
#     and update-refusal statements quoted above -- not a single worked
#     example combining every field, because none exists for either shape.
#   - Of roughly fifty documented Call fields (queue and queue_callback
#     metrics, ivr_info, justcall_ai coaching data, call_traits,
#     missed_call_reason, cost_incurred, and more) this Recipe declares
#     about fifteen: the ones the recording and in-progress questions turn
#     on, plus enough identity and timing fields to make the record
#     recognisable.
#   - List all calls, Update a call, Get call journey, Get voice agent data,
#     and every SMS/contact/agent endpoint are real and not modelled; this
#     group's question is about calls and recordings.
#   - Rate limits are documented with exact numbers and six named headers
#     (developer.justcall.io/docs/rate-limits.md) and never triggered live;
#     no specific header value is asserted for one.
#   - No spec is recorded. JustCall does not publish one combined
#     machine-readable description; each reference page embeds its own
#     single-path OpenAPI 3.0.0 fragment (confirmed across four separate
#     pages, each repeating the full component schema for just its own
#     endpoint), which is many partial descriptions rather than one this
#     project's drift machinery could point at and mean the whole API.
#
# The credential below is a fixture and belongs to no account.

recipe: justcall
capability: voice
version: 0.1.0

upstream:
  api: "2.1"
  docs: https://developer.justcall.io/reference/call_get_v21

auth:
  # The raw "api_key:api_secret" pair, no scheme word -- JustCall's own
  # words: "Authorization: api_key:api_secret". Every verdict this task
  # struck answered the same sentence; see the header.
  scheme: header
  header: Authorization
  keys:
    - "cauldron-justcall-0000000000:cauldron-justcall-secret-0000000000"
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    fields:
      status: "failed"

resources:
  call:
    id:
      style: numeric
    # Either identifier reaches the same call on the same path -- see the
    # header.
    alias: call_sid
    fields:
      call_sid:
        type: string
      justcall_number:
        type: string
      contact_number:
        type: string
      contact_name:
        type: string
        null_when_unset: true
      agent_name:
        type: string
        null_when_unset: true
      agent_email:
        type: string
        null_when_unset: true
      call_date:
        type: string
      call_time:
        type: string
      # Outgoing or Incoming.
      direction:
        type: string
        in: call_info
      # Answered, Missed, Voicemail, Abandoned before ringing, Busy, Failed,
      # Blocked, Unanswered, In Progress, Restricted -- per call_get_v21's
      # own enum. A live call reads "In Progress" here; see the header.
      type:
        type: string
        in: call_info
      # Archived or Unarchived -- whether this call has been archived in
      # JustCall. Not a delivery or connection state, and not the field an
      # in-progress call is recognised by.
      status:
        type: string
        in: call_info
      # "Recording link of the call" -- JustCall's own words, no more
      # specific than that. Absent until the call ends -- see the header for
      # what the populated value actually looks like and what it does not
      # say, and for why this Recipe leaves it off rather than nulling it
      # for a call still in progress.
      recording:
        type: string
        in: call_info
      recording_child:
        type: string
        in: call_info
      total_duration:
        type: integer
        in: call_duration
      friendly_duration:
        type: string
        in: call_duration

routes:
  - method: GET
    path: /v2.1/calls/{id}
    resource: call
    operation: get

  # Registered so its own auth gate can be shown -- confirmed live, 401,
  # identical envelope to every other route. Not modelled beyond that: a
  # success here is raw MP3 bytes per JustCall's own curl example, not JSON,
  # and this task never held a credential to fetch one. See the header.
  - method: GET
    path: /v2.1/calls/{id}/recording/download
    error: authentication_error

errors:
  authentication_error:
    status: 401
    message: "Unauthorized"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Cauldron passes only the path into {detail} here, not the method -- see
  # the header. Fixed at the one verb this Recipe actually struck against an
  # unrouted path.
  unknown_route:
    status: 404
    message: "Cannot GET {detail}"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Cauldron passes "METHOD /path" into {detail} for this one, which is
  # exactly what JustCall's own wrong-method answer contains.
  method_not_allowed:
    status: 404
    message: "Cannot {detail}"
    headers:
      Content-Type: "application/json; charset=utf-8"

fixtures:
  empty: {}

  # This Recipe's own construction -- see the header. Field names, the type
  # enum and the recording-access statements are JustCall's own; the
  # specific combination below was never returned by a live call this task
  # observed.
  small-account:
    call:
      # Completed and recorded. The recording value is quoted verbatim from
      # call_get_v21's own documented default, redactions included -- see
      # the header for why it is not completed with an invented signature.
      - id: 900000001
        call_sid: "CA00000000000000000000000000001"
        justcall_number: "12707705001"
        contact_number: "13801136001"
        contact_name: Rachel G.
        agent_name: John Smith
        agent_email: john@cauldron.test
        call_date: "2026-08-14"
        call_time: "09:00:00"
        direction: Outgoing
        type: Answered
        status: Unarchived
        recording: "https://bifrost.justcall.io/voice-tools-calling/v1/recording/get-presigned-url?recSid=REXXXXXac0aae0fXXXXXXedXXXXXa90&redirect=1&getSize=0&companyId=XXXX49"
        recording_child: "https://bifrost.justcall.io/voice-tools-calling/v1/recording/get-presigned-url?recSid=REXXXXXac0aae0fXXXXXXedXXXXXa90&redirect=1&getSize=0&companyId=XXXX49"
        total_duration: 155
        friendly_duration: "00:00:05"
      # Still in progress. type is the documented enum value; recording,
      # recording_child and both duration fields are left off rather than
      # guessed -- see the header for why.
      - id: 900000002
        call_sid: "CA00000000000000000000000000002"
        justcall_number: "12707705001"
        contact_number: "13801136002"
        agent_name: John Smith
        agent_email: john@cauldron.test
        call_date: "2026-08-14"
        call_time: "09:05:00"
        direction: Incoming
        type: In Progress
        status: Unarchived

conformance:
  - name: no credential at all
    source: https://api.justcall.io/v2.1/calls
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2.1/calls/900000001
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        status: "failed"
        message: Unauthorized

  - name: a wrong credential gets the identical sentence, not a different one
    source: https://api.justcall.io/v2.1/calls
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2.1/calls/900000001
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        status: "failed"
        message: Unauthorized

  - name: an unrouted path answers 404 with no credential examined at all
    source: https://api.justcall.io/v2.1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2.1/this-is-not-a-real-endpoint
    expect:
      status: 404
      body:
        status: "failed"
        message: "Cannot GET /v2.1/this-is-not-a-real-endpoint"

  - name: a wrong method on a real path echoes the method and path back, not a 405
    source: https://api.justcall.io/v2.1/calls/12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v2.1/calls/12345
    expect:
      status: 404
      body:
        status: "failed"
        message: "Cannot DELETE /v2.1/calls/12345"
      absent:
        - Allow

  - name: a wrong credential on that same wrong method changes nothing, because routing never lets it be examined
    source: https://api.justcall.io/v2.1/calls/12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v2.1/calls/12345
      headers:
        Authorization: junktoken12345
    expect:
      status: 404
      body:
        message: "Cannot PATCH /v2.1/calls/12345"

  - name: a malformed id still reaches the credential gate rather than 404ing first
    source: https://api.justcall.io/v2.1/calls/not-a-real-id-@@@
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2.1/calls/not-a-real-id-@@@
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: downloading a recording needs the same credential every other route does
    source: https://api.justcall.io/v2.1/calls/900000001/recording/download
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2.1/calls/900000001/recording/download
    expect:
      status: 401
      body:
        status: "failed"
        message: Unauthorized

  - name: a live call is addressable and its recording is not
    source: https://developer.justcall.io/reference/call_get_v21
    fixture: small-account
    request:
      method: GET
      path: /v2.1/calls/900000002
      headers:
        Authorization: "cauldron-justcall-0000000000:cauldron-justcall-secret-0000000000"
    expect:
      status: 200
      body:
        call_info.type: In Progress
        call_info.status: Unarchived
      absent:
        - call_info.recording
        - call_info.recording_child
        - call_duration.total_duration

  - name: a completed call carries the recording link JustCall's own docs show, presigned by name and undated by lifetime
    source: https://developer.justcall.io/reference/call_get_v21
    fixture: small-account
    request:
      method: GET
      path: /v2.1/calls/900000001
      headers:
        Authorization: "cauldron-justcall-0000000000:cauldron-justcall-secret-0000000000"
    expect:
      status: 200
      body:
        call_info.recording: "https://bifrost.justcall.io/voice-tools-calling/v1/recording/get-presigned-url?recSid=REXXXXXac0aae0fXXXXXXedXXXXXa90&redirect=1&getSize=0&companyId=XXXX49"
        call_info.type: Answered

  - name: the call SID reaches the identical call the numeric id does
    source: https://developer.justcall.io/reference/call_get_v21
    fixture: small-account
    request:
      method: GET
      path: /v2.1/calls/CA00000000000000000000000000001
      headers:
        Authorization: "cauldron-justcall-0000000000:cauldron-justcall-secret-0000000000"
    expect:
      status: 200
      body:
        id: 900000001
        contact_name: Rachel G.

  # The names. This Recipe declares 11 field(s) on a call that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 11 name(s) that came back at the paths they came back
  # under.
  - name: "a call carries the field names this Recipe declares"
    source: "https://developer.justcall.io/reference/call_get_v21"
    fixture: small-account
    request:
      method: GET
      path: "/v2.1/calls/900000001"
      headers:
        "Authorization": "cauldron-justcall-0000000000:cauldron-justcall-secret-0000000000"
    expect:
      status: 200
      body:
        "agent_email": "john@cauldron.test"
        "agent_name": "John Smith"
        "call_date": "2026-08-14"
        "call_sid": "CA00000000000000000000000000001"
        "call_time": "09:00:00"
        "contact_number": "13801136001"
        "call_info.direction": "Outgoing"
        "call_duration.friendly_duration": "00:00:05"
        "justcall_number": "12707705001"
        "call_info.recording_child": "https://bifrost.justcall.io/voice-tools-calling/v1/recording/get-presigned-url?recSid=REXXXXXac0aae0fXXXXXXedXXXXXa90&redirect=1&getSize=0&companyId=XXXX49"
        "call_duration.total_duration": 155

