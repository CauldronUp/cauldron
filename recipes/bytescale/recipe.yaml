# Bytescale Recipe for Cauldron
#
# The recent-jobs listing, read from Bytescale's own generated TypeScript SDK
# (src/public/shared/generated/models/index.ts), and struck live against
# api.bytescale.com on 2026-09-13 with no header, with a bearer value that is
# not a key, with a bearer value shaped like one, with a Basic header, and on a
# path that does not exist.
#
# **A nine-letter string is diagnosed as a malformed JWT.** Sending
# `Authorization: Bearer notarealkey` answers:
#
#   {"error":{"message":"Unauthenticated: your JWT must include an 'accountId'
#     field at the same level as the 'exp' field.",
#     "code":"jwt_missing_account_id_field", ...}}
#
# Nothing in that request was a JWT. The API explains the placement of two
# claims relative to each other to a caller who sent eleven characters, because
# "not a key" and "a JWT missing a field" are the same branch.
#
# **And a value that does look like a key gets part of itself back.**
# `Bearer public_notarealkey` answers `authentication_failed_account_not_found`
# with `details: {"accountId":"notarea"}` -- the seven characters after the
# prefix, which is how Bytescale derives an account id from a key. The refusal
# quotes a slice of the credential that was refused, and that same slice is in
# every URL: `/v2/accounts/{accountId}/jobs`. So the account id is a prefix of
# the secret, and every access log that records a path records it.
#
# **A third header shape gets a lecture about usernames.** `Basic Zm9vOmJhcg==`
# answers "Unauthenticated: incorrect username. Please provide 'apikey' as your
# username and your API key as the password." -- so Basic is supported, with a
# constant username, documented only in the failure you get for not knowing it.
#
# **An unrouted path is answered with an instruction that ends in "etc."**
#
#   {"error":{"message":"Check the URL for this GET request. (Hint: Ensure the
#     account ID in the URL is valid, etc.)","code":"check_path",
#     "details":{"path":"/v2/cauldron-nope"}}}
#
# The message is a to-do addressed to the caller, the hint is parenthesised, and
# the list of things to check is left unfinished.
#
# **The 401 sends both halves of a CORS pair browsers refuse together.**
# `access-control-allow-origin: *` and `access-control-allow-credentials: true`
# arrive on the same response. A browser rejects that combination outright, so
# the permissive one is what makes the credentialed one useless.
#
# **Every job record carries the same URL, and it is a link to the
# documentation.** `jobDocs` is typed
# `"https://www.bytescale.com/docs/job-api/GetJob"` -- an enum with one member --
# and described as "Link to the documentation that describes how to get a job's
# status from its job ID". Documentation as a record field, identical on every
# record in every response, forever.
#
# **A timestamp's generated type is an object with a property called `tYPE`.**
# `created` and `lastUpdated` are `OpaqueNumberEpochMillis`, which the published
# SDK defines as `{ tYPE: "EpochMillis" }` -- a branded wrapper for a value that
# arrives on the wire as a number, whose single property is `TYPE` with its
# first letter lowercased by the generator. It is declared twice, identically,
# as `OpaqueNumberEpochMillis` and `OpaqueNumberEpochMillisAllOf`.
#
# **Two listings on one API, two envelopes, and only one can be paged.**
# `ListRecentJobsResponse` is `{items}` and nothing else. `ListFolderResponse`
# beside it is `{cursor, folder, isPaginationComplete, items}` -- and its
# `cursor` is documented as "Absolute path to a file or folder. Begins with a
# `/`", so the paging token is a filesystem path and the comment says so.
#
# Also pinned: `MultipartUploadProtocol` is `"1.0" | "1.1"`, and the comment for
# `1.1` says it "fixes a known issue in the `2.0` protocol" -- naming a version
# the type does not contain, for an issue the comment above attributed to `1.0`.

recipe: bytescale
capability: storage
version: 0.1.0

upstream:
  api: v2
  docs: https://www.bytescale.com/docs/job-api
  # No spec: Bytescale publishes a generated TypeScript SDK rather than the
  # document it was generated from, and no OpenAPI description is served at any
  # address this Recipe could find. The record shape below is that SDK's.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # public_ or secret_ and then the account id, which is the next seven
  # characters and also the path segment.
  shape: "^(public|secret)_[0-9A-Za-z]{7,}$"
  keys:
    - secret_W142hJk3cauldr0nf1xture0000
  absent_error: authorization_header_missing
  # A bearer value that is not shaped like a key is read as a JWT.
  shape_error: jwt_missing_account_id_field
  # One that is gets as far as looking the account up, and says which one.
  rejected_error: authentication_failed_account_not_found
  # And a header the Bearer prefix cannot read gets the username lecture.
  malformed_error: invalid_authorization_header_user_syntax
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    # No cursor and no count: the folder listing next door has both.
  error:
    style: nested
    key: error
    message_field: message
    code_field: code

resources:
  job:
    id:
      field: jobId
      style: opaque
      length: 22
    fields:
      # The same documentation URL on every record ever returned.
      jobDocs:
        type: string
      jobType:
        type: string
      jobUrl:
        type: string
      # The path segment, and the first seven characters of the key.
      accountId:
        type: string
      # Epoch milliseconds, whose generated type is an object.
      created:
        type: integer
      lastUpdated:
        type: integer
      status:
        type: string
      error:
      summary:
        type: map

routes:
  - method: GET
    path: /v2/accounts/{accountId}/jobs
    resource: job
    operation: list
    pagination:
      style: none

errors:
  authorization_header_missing:
    status: 401
    code: authorization_header_missing
    message: "Unauthenticated: please provide a valid authorization header using either the 'Basic' or 'Bearer' scheme."
    fields:
      error.timestamp: "2026-09-13T22:10:47.526Z"
    headers:
      # A browser refuses these two together, so the permissive one is what
      # makes the credentialed one useless.
      Access-Control-Allow-Origin: "*"
      Access-Control-Allow-Credentials: "true"

  jwt_missing_account_id_field:
    status: 401
    code: jwt_missing_account_id_field
    # Said to a caller who sent eleven characters and no JWT at all.
    message: "Unauthenticated: your JWT must include an 'accountId' field at the same level as the 'exp' field."
    fields:
      error.timestamp: "2026-09-13T22:10:47.526Z"

  authentication_failed_account_not_found:
    status: 401
    code: authentication_failed_account_not_found
    message: "Unauthenticated: invalid API key."
    fields:
      error.timestamp: "2026-09-13T22:10:47.999Z"
      # Seven characters of the credential that was just refused.
      error.details.accountId: notarea

  invalid_authorization_header_user_syntax:
    status: 401
    code: invalid_authorization_header_user_syntax
    # The constant username, documented in the failure for not knowing it.
    message: "Unauthenticated: incorrect username. Please provide 'apikey' as your username and your API key as the password."
    fields:
      error.timestamp: "2026-09-13T22:10:47.682Z"

  unknown_route:
    status: 404
    code: check_path
    # A to-do addressed to the caller, with the list left unfinished.
    message: "Check the URL for this GET request. (Hint: Ensure the account ID in the URL is valid, etc.)"
    fields:
      error.timestamp: "2026-09-13T22:10:47.829Z"
      error.details.path: "{detail}"

fixtures:
  empty:
    job: []

  queue:
    job:
      - jobId: JOB_01HQ8Z5A9WQK3T2N
        # The same URL as the record below, and as every other record.
        jobDocs: https://www.bytescale.com/docs/job-api/GetJob
        jobType: ProcessVideoJob
        jobUrl: https://api.bytescale.com/v2/accounts/W142hJk/jobs/JOB_01HQ8Z5A9WQK3T2N
        # The path segment, and the front of the key that authorised this.
        accountId: W142hJk
        # Epoch milliseconds, whose generated type is { tYPE: "EpochMillis" }.
        created: 1789336701972
        lastUpdated: 1789336745310
        status: Succeeded
        error: null
        summary:
          filesProcessed: 12
      - jobId: JOB_01HQ8ZB0M4RV7C1D
        jobDocs: https://www.bytescale.com/docs/job-api/GetJob
        jobType: DeleteFolderBatchJob
        jobUrl: https://api.bytescale.com/v2/accounts/W142hJk/jobs/JOB_01HQ8ZB0M4RV7C1D
        accountId: W142hJk
        created: 1789336800000
        lastUpdated: 1789336812004
        status: Failed
        # The whole failure envelope again, nested on the record.
        error:
          timestamp: "2026-09-13T22:20:12.004Z"
          message: The folder was modified while the job was running.
          code: folder_modified_during_job
          details: null
        summary: {}

conformance:
  - name: a value that is not a JWT is refused as a malformed one
    source: https://api.bytescale.com/v2/accounts/W142hJk/jobs
    verified: "2026-09-13"
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # Two claim names and their relative placement, explained to a caller
        # who sent eleven characters.
        error.message: "Unauthenticated: your JWT must include an 'accountId' field at the same level as the 'exp' field."
        error.code: jwt_missing_account_id_field

  - name: a value shaped like a key gets part of itself back
    source: https://api.bytescale.com/v2/accounts/W142hJk/jobs
    verified: "2026-09-13"
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer public_notarealkey"
    expect:
      status: 401
      body:
        error.code: authentication_failed_account_not_found
        error.message: "Unauthenticated: invalid API key."
        # The seven characters after the prefix, which are also the account
        # id, which is also in every URL.
        error.details.accountId: notarea

  - name: a header the scheme cannot read gets a lecture about usernames
    source: https://api.bytescale.com/v2/accounts/W142hJk/jobs
    verified: "2026-09-13"
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Basic Zm9vOmJhcg=="
    expect:
      status: 401
      body:
        # The constant username, told to you only once you get it wrong.
        error.message: "Unauthenticated: incorrect username. Please provide 'apikey' as your username and your API key as the password."
        error.code: invalid_authorization_header_user_syntax

  - name: no header at all sends both halves of a CORS pair browsers refuse
    source: https://api.bytescale.com/v2/accounts/W142hJk/jobs
    verified: "2026-09-13"
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers: {}
    expect:
      status: 401
      body:
        error.message: "Unauthenticated: please provide a valid authorization header using either the 'Basic' or 'Bearer' scheme."
        error.code: authorization_header_missing
      headers:
        # A wildcard origin and credentials, on one response.
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Credentials: "true"

  - name: an unrouted path is answered with an instruction ending in etc
    source: https://api.bytescale.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: queue
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # A to-do, a parenthesised hint, and a list left unfinished.
        error.message: "Check the URL for this GET request. (Hint: Ensure the account ID in the URL is valid, etc.)"
        error.code: check_path
        error.details.path: /v2/cauldron-nope

  - name: every job carries the same link to the documentation
    source: https://github.com/bytescale/bytescale-javascript-sdk
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer secret_W142hJk3cauldr0nf1xture0000"
    expect:
      status: 200
      body:
        # An enum with one member, on every record in every response.
        'items[0].jobDocs': https://www.bytescale.com/docs/job-api/GetJob
        'items[1].jobDocs': https://www.bytescale.com/docs/job-api/GetJob
        'items[0].jobUrl': https://api.bytescale.com/v2/accounts/W142hJk/jobs/JOB_01HQ8Z5A9WQK3T2N

  - name: the account id is on the record and in the path and in the key
    source: https://github.com/bytescale/bytescale-javascript-sdk
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer secret_W142hJk3cauldr0nf1xture0000"
    expect:
      status: 200
      body:
        # The path segment above, the seven characters after secret_ in the
        # header, and a field on the record.
        'items[0].accountId': W142hJk
        'items[1].accountId': W142hJk
        'items[0].jobId': JOB_01HQ8Z5A9WQK3T2N

  - name: the timestamps are numbers whose generated type is an object
    source: https://github.com/bytescale/bytescale-javascript-sdk
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer secret_W142hJk3cauldr0nf1xture0000"
    expect:
      status: 200
      body:
        # On the wire: epoch milliseconds. In the published SDK:
        # { tYPE: "EpochMillis" }.
        'items[0].created': 1789336701972
        'items[0].lastUpdated': 1789336745310
        'items[1].created': 1789336800000
        'items[1].lastUpdated': 1789336812004

  - name: a failed job carries the whole failure envelope on the record
    source: https://github.com/bytescale/bytescale-javascript-sdk
    fixture: queue
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer secret_W142hJk3cauldr0nf1xture0000"
    expect:
      status: 200
      body:
        'items[1].status': Failed
        # timestamp, message, code, details -- the same four keys the HTTP
        # failures use, nested inside a successful response.
        'items[1].error.code': folder_modified_during_job
        'items[1].error.message': The folder was modified while the job was running.
        'items[1].error.timestamp': "2026-09-13T22:20:12.004Z"
        'items[1].error.details': null
        'items[0].error': null
        'items[0].status': Succeeded
        'items[0].jobType': ProcessVideoJob
        'items[1].jobType': DeleteFolderBatchJob
        'items[0].summary.filesProcessed': 12
        'items[1].summary': {}

  - name: the jobs listing has no cursor and no count
    source: https://github.com/bytescale/bytescale-javascript-sdk
    fixture: empty
    request:
      method: GET
      path: /v2/accounts/W142hJk/jobs
      headers:
        Authorization: "Bearer secret_W142hJk3cauldr0nf1xture0000"
    expect:
      status: 200
      body:
        # ListRecentJobsResponse is {items} and nothing else, while the folder
        # listing beside it carries a cursor and a completion flag.
        items: []
      absent:
        - cursor
        - isPaginationComplete
