# Hygraph Recipe for Cauldron
#
# The Content API, read from Hygraph's own API reference, and struck live
# against api-eu-central-1.hygraph.com on 2026-09-13 with a project identifier
# that is malformed and with one that is well formed and does not exist.
#
# **Getting the project id wrong two ways gives two content types.** Struck
# live:
#
#   /v2/cauldron-nope/master   400 text/plain  {"errors":[{"message":"project identifier \"cauldron-nope\" is invalid"}],"data":null}
#   /v2/<a valid-shaped id>/master  404 application/json  {"errors":[{"message":"project or environment not found"}],"data":null}
#
# Same envelope, same GraphQL shape, two statuses -- and the JSON body on the
# 400 is labelled `text/plain`. The mislabelled one is the one a caller reaches
# by mistyping the id, which is the more common of the two mistakes.
#
# **Both carry `"data": null` beside `errors`.** GraphQL's specification says a
# request that fails before execution begins should not carry a `data` entry at
# all -- "if an error was encountered before execution begins, the `data` entry
# should not be present". These never reached a resolver, and both have it,
# present and null.
#
# **And neither status is GraphQL's.** A GraphQL endpoint answers 200 for a
# query that fails, with the reason in `errors`. These answer 400 and 404 with
# the reason in `errors`. So one endpoint produces failures at three statuses in
# one envelope, and a client has to read `errors` whatever the status line says.
#
# **A GET is answered.** These were struck with no query, no body and no
# `Content-Type` -- and the endpoint replied with its error rather than
# refusing the method.
#
# **The second message merges two things.** "project **or** environment not
# found": the path carries both, and the failure does not say which of the two
# was wrong.
#
# **`publishedAt` is non-null on every content entry.** From the system-field
# table: `publishedAt  DateTime!  Timestamp for when the content entry was
# published`. The exclamation mark is GraphQL for "never null", on a timestamp
# recording an event that may not have happened -- an entry in the draft stage
# has not been published, and the schema says the field is always there.
#
# **Every entry carries three references to people.** `createdBy`, `updatedBy`
# and `publishedBy`, each a `User`. And the `User` model is documented as having
# the system fields "but not `createdBy`, `updatedBy`, and `publishedBy`" -- so
# the model that exists to record who did things is the one thing in the schema
# that does not record who did things to it.
#
# **A token is a kind of user.** `kind: UserKind!` is `MEMBER`, `PAT` or
# `PUBLIC`. So "who published this" can answer with a personal access token, or
# with the public -- and a client rendering an author's name has to handle both.
#
# **And every record can query itself in other stages.** `documentInStages` is a
# field on the entry that returns the same entry as it exists elsewhere, so one
# object is a handle to all of its own versions.

recipe: hygraph
capability: cms
version: 0.1.0

upstream:
  api: v2
  docs: https://hygraph.com/docs/api-reference
  # No spec: the Content API's schema is generated per project from the models
  # a customer defines, so there is no single description to fetch. The system
  # fields below are Hygraph's own and are the same in every project.

auth:
  # A permanent auth token, for projects that are not publicly readable.
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.hygraph.f1xturet0ken
  # Struck live with no credential at all, and answered: a project's read
  # access is a project setting rather than a property of the request.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data.users
  error:
    # GraphQL's envelope, on transport-level failures.
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"
    fields:
      # Present and null, which the specification says it should not be on a
      # request that never reached execution.
      data: null

resources:
  user:
    id:
      field: id
      style: opaque
      length: 25
    fields:
      name:
        type: string
      # MEMBER, PAT or PUBLIC: a token and the public are both kinds of user.
      kind:
        type: string
      picture:
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # Non-null in the schema, on an event that may not have happened.
      publishedAt:
        type: datetime

routes:
  - method: POST
    # The project and the environment, both in the path, and a failure that
    # does not say which of them was wrong.
    path: /v2/{project}/master
    resource: user
    operation: list
    selects: users
    pagination:
      style: cursor
      limit: 10
      max_limit: 1000
      limit_param: variables.first
      cursor_param: variables.after
      in: body

errors:
  unknown_route:
    # The shape a malformed project identifier gets: a JSON body under a
    # text/plain label.
    status: 400
    message: "project identifier \"cauldron-nope\" is invalid"
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    user: []

  project:
    user:
      - id: cm5k2qz1x0001xyz9abcd1234
        name: A Person
        # A human being.
        kind: MEMBER
        picture: https://media.graphassets.com/cm5k2qz1x0001xyz9abcd1234
        createdAt: "2026-01-15T09:30:00.000Z"
        updatedAt: "2026-06-02T14:12:05.000Z"
        publishedAt: "2026-01-15T09:32:10.000Z"
      - id: cm5k2qz1x0002xyz9abcd5678
        name: CI deploy token
        # A personal access token, in the same list as the person above.
        kind: PAT
        picture: null
        createdAt: "2026-04-02T11:05:00.000Z"
        updatedAt: "2026-04-02T11:20:00.000Z"
        publishedAt: "2026-04-02T11:20:00.000Z"

conformance:
  - name: a malformed project id is JSON labelled as text
    source: https://api-eu-central-1.hygraph.com/v2/cauldron-nope/master
    verified: "2026-09-13"
    fixture: project
    request:
      method: POST
      path: /v2/cauldron-nope/other
      json:
        query: "{ __typename }"
    expect:
      status: 400
      headers:
        # The body is JSON. The label is not.
        Content-Type: text/plain; charset=utf-8
      body:
        # GraphQL's envelope, with a data entry the specification says should
        # not be there on a failure that never reached execution.
        'errors[0].message': "project identifier \"cauldron-nope\" is invalid"
        data: null

  - name: the users of a project are a GraphQL collection
    source: https://hygraph.com/docs/api-reference/schema/system-fields
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id name kind } }"
    expect:
      status: 200
      body:
        'data.users[0].id': cm5k2qz1x0001xyz9abcd1234
        'data.users[0].name': A Person

  - name: a token is a kind of user
    source: https://hygraph.com/docs/api-reference/schema/system-fields
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id name kind } }"
    expect:
      status: 200
      body:
        # MEMBER, PAT or PUBLIC -- so "who published this" can answer with a
        # credential, and a client rendering an author handles both.
        'data.users[0].kind': MEMBER
        'data.users[1].kind': PAT
        'data.users[1].name': CI deploy token

  - name: publishedAt is present on every record
    source: https://hygraph.com/docs/api-reference/schema/system-fields
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id publishedAt createdAt updatedAt } }"
    expect:
      status: 200
      body:
        # DateTime! in the schema: never null, on a timestamp for an event
        # that an entry in the draft stage has not had.
        'data.users[0].publishedAt': "2026-01-15T09:32:10.000Z"
        'data.users[1].publishedAt': "2026-04-02T11:20:00.000Z"
        'data.users[0].createdAt': "2026-01-15T09:30:00.000Z"
        'data.users[0].updatedAt': "2026-06-02T14:12:05.000Z"

  - name: a picture is the one nullable field on the model
    source: https://hygraph.com/docs/api-reference/schema/system-fields
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id picture } }"
    expect:
      status: 200
      body:
        'data.users[0].picture': https://media.graphassets.com/cm5k2qz1x0001xyz9abcd1234
        'data.users[1].picture': null

  - name: the collection pages by cursor in the variables
    source: https://hygraph.com/docs/api-reference
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id } }"
        variables:
          first: 1
    expect:
      status: 200
      body:
        'data.users[0].id': cm5k2qz1x0001xyz9abcd1234

  - name: the cursor travels in the variables too
    source: https://hygraph.com/docs/api-reference
    fixture: project
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id } }"
        variables:
          first: 1
          # A position, in the same object as the page size, in the body of a
          # POST -- so paging a GraphQL collection means rewriting the
          # request rather than following a link.
          after: cm5k2qz1x0001xyz9abcd1234
    expect:
      status: 200
      body:
        'data.users[0].id': cm5k2qz1x0002xyz9abcd5678
        'data.users[0].kind': PAT

  - name: a project with no users answers an empty collection
    source: https://hygraph.com/docs/api-reference/schema/system-fields
    fixture: empty
    request:
      method: POST
      path: /v2/cauldron/master
      headers:
        Authorization: "Bearer cauldr0n.hygraph.f1xturet0ken"
      json:
        query: "{ users { id } }"
    expect:
      status: 200
      body:
        'data.users': []
