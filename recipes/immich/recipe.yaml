# Immich Recipe for Cauldron
#
# Written against Immich's own generated OpenAPI 3.0.0 document, published in
# its own repository -- github.com/immich-app/immich,
# open-api/immich-openapi-specs.json, 191 paths, version 3.2.0-rc.0 -- read on
# 2026-09-06. Immich is self-hosted and there is no public instance, so nothing
# here is verified live: every claim is the provider's own document.
#
# **The schema announces a null it has not sent yet.**
#
# Immich ships a vendor extension, `x-immich-history`, giving 141 fields a
# per-version lifecycle. On an album's description it reads:
#
#   [{"version": "v1", "state": "Added"},
#    {"version": "v3", "state": "Updated",
#     "description": "An empty string is returned instead of null for
#                     backwards compatibility; null will be returned in v4."}]
#
# So today `description` is `""` where it means absent, and in v4 it will be
# `null`. Both are falsy, so `if (album.description)` behaves the same on either
# side of that change and `album.description.length` throws on one of them. The
# warning is machine-readable, sits in the shipped document, and no standard
# OpenAPI tool reads it -- `x-` extensions are, by specification, ignored.
#
# **128 fields are deprecated, and four of them only in that extension.**
#
# 124 carry OpenAPI's own `deprecated: true` beside `x-immich-state:
# Deprecated`, so a generator warns about them. Four do not:
#
#   ApiKeyCreateResponseDto.apiKey    deprecated at v3.2.0
#   AssetResponseDto.libraryId        added at v1 and deprecated at v1
#   AssetResponseDto.resized          deprecated at v1.113.0
#   SearchAssetResponseDto.total      deprecated at v3.0.0
#
# The first has a mechanical excuse: it is a `$ref` with siblings, and OpenAPI
# 3.0 ignores keys beside a `$ref`, so `deprecated` there would have done
# nothing either. The other three are inline schemas that simply do not have it.
# All four are invisible to every tool that reads the standard keyword -- and the
# first is the field carrying a newly created API key.
#
# `AssetResponseDto.libraryId` was added and deprecated in the same version.
# `SearchAssetResponseDto.total` has a history with a Deprecated entry and no
# Added entry at all, so the document does not say when the total on a search
# response began existing, only that it should not be used.
#
# **An array whose index means something, and whose second element depends on
# who is asking.**
#
# `albumUsers`, in the document's own words: "First entry is always the album
# owner. Second entry is the auth user, if it differs from the owner. The rest
# are ordered alphabetically."
#
# So position 0 is the owner, position 1 is *you* -- unless you own the album,
# in which case position 1 is the alphabetically first of everyone else. The
# array's ordering carries information that exists nowhere else in the response,
# and it changes with the caller. Any client that sorts, filters, or renders
# these in a `Set` destroys it, and there is no field to recover it from.
#
# **A cookie is a first-class documented credential.**
#
# Three schemes on every authenticated operation: `bearer` (a JWT), `api_key`
# (`x-api-key`), and `cookie` -- `immich_access_token`, `in: cookie`. A cookie
# is sent by the browser automatically, on cross-site requests too unless
# SameSite says otherwise, and the document mentions no CSRF token anywhere. So
# every state-changing endpoint in a 191-path API is documented as reachable
# with an ambient credential.
#
# **A photo count is bounded by JavaScript.**
#
# `assetCount` and `SearchAssetResponseDto.total` both declare
# `maximum: 9007199254740991`. That is Number.MAX_SAFE_INTEGER -- the ceiling of
# the language the server is written in, published as a property of the data. A
# generated client in a language with real 64-bit integers gets a bound that
# means nothing about photographs.
#
# **A listing of albums has no paging at all.**
#
# GET /albums takes assetId, id, isOwned, isShared and name. No limit, no page,
# no cursor, no total. An account with five thousand albums answers five
# thousand albums, every time, and there is no parameter that would stop it.
#
# **The one public endpoint answers under a key called res.** GET /server/ping
# is the only operation in the document with no `security` at all, and it
# answers `{"res": "pong"}` -- not status, not message, not ok.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Immich is self-hosted and
#     there is no public instance.
#   - Albums and the ping. 191 paths is a photo library: assets, people, faces,
#     search, timeline, sharing, libraries, jobs and the upload surface each
#     want their own evidence.
#   - `description` is served as the empty string, which is what v3 sends. The
#     v4 null is recorded and not served, because serving a value the provider
#     does not send yet would be inventing a future.
#   - The cookie scheme is recorded and not served. The credential checked here
#     is the bearer token, and accepting an ambient cookie in local development
#     would teach exactly the habit the finding warns about.
#   - `albumUsers` is served in the documented order for the fixture's own
#     viewer. The Recipe cannot vary it by caller, because it does not know who
#     is calling beyond the credential -- which is the finding restated.

recipe: immich
capability: media
version: 0.1.0

upstream:
  api: "3.2.0"
  docs: https://immich.app/docs/api/
  spec: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
  spec_hash: 4c52962b3f0a239889f43a191e83de8d1903bc9efaac217784666f0202a36d8f
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.immich.jwt
  absent_error: unauthorized

responses:
  list:
    # No envelope, no paging, no total. A bare array of every album there is.
    style: bare
  error:
    style: flat
    message_field: message
    fields:
      error: Unauthorized
      statusCode: 401

resources:
  album:
    id:
      style: uuid
      field: id
    fields:
      albumName:
        type: string
        required: true
      # The empty string today, and null from v4, announced in the schema and
      # in a vendor extension no standard tool reads.
      description:
        type: string
        default: ""
      # Nullable, and the album may have assets while this is null.
      albumThumbnailAssetId:
        type: string
      # Bounded by Number.MAX_SAFE_INTEGER in the document.
      assetCount:
        type: number
        default: 0
      shared:
        type: boolean
        default: false
      hasSharedLink:
        type: boolean
        default: false
      isActivityEnabled:
        type: boolean
        default: true
      # Position 0 is the owner. Position 1 is the caller, unless the caller
      # is the owner. Untyped, because the claim is the ordering.
      albumUsers:
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

  ping:
    id:
      style: opaque
      field: res
    fields:
      res:
        type: string
        default: pong

routes:
  - method: GET
    path: /api/server/ping
    resource: ping
    operation: list
    # The only operation in 191 paths with no security at all.
    public: true
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    pagination:
      style: none

  - method: GET
    path: /api/albums
    resource: album
    operation: list
    pagination:
      # None. GET /albums takes assetId, id, isOwned, isShared and name, and
      # not one parameter that bounds the response.
      style: none
    filters:
      - field: shared
        param: isShared

  - method: GET
    path: /api/albums/{id}
    resource: album
    operation: get
    not_found: not_found

errors:
  unauthorized:
    status: 401
    message: "Authentication required"
    fields:
      error: Unauthorized
      statusCode: 401
  not_found:
    status: 400
    message: "Not found or no album.read access"
    fields:
      # Not 404. Immich answers 400 for an album you may not read and for one
      # that does not exist, with one message covering both -- so a client
      # cannot tell a permission problem from a typo.
      error: Bad Request
      statusCode: 400
  rate_limit:
    status: 429
    message: "ThrottlerException: Too Many Requests"
    fields:
      error: Too Many Requests
      statusCode: 429

fixtures:
  empty:
    album: []
    ping:
      - res: pong

  library:
    ping:
      - res: pong
    album:
      - id: 2f1b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        albumName: Iceland 2026
        description: ""
        albumThumbnailAssetId: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
        assetCount: 412
        shared: true
        hasSharedLink: false
        isActivityEnabled: true
        albumUsers:
          # The owner, always first.
          - user:
              id: 11111111-1111-4111-8111-111111111111
              email: owner@example.com
            role: editor
          # The caller, second, because the caller is not the owner.
          - user:
              id: 22222222-2222-4222-8222-222222222222
              email: cauldron@example.com
            role: viewer
          # And everyone else, alphabetically.
          - user:
              id: 33333333-3333-4333-8333-333333333333
              email: zoe@example.com
            role: viewer
        createdAt: "2026-06-02T10:15:00.000Z"
        updatedAt: "2026-09-01T08:42:11.000Z"
      - id: 7c6d5e4f-3a2b-4c1d-9e8f-7a6b5c4d3e2f
        albumName: Screenshots
        description: ""
        # Null while the album holds assets, which is the pairing worth
        # noticing: a thumbnail is not implied by a non-zero count.
        albumThumbnailAssetId: null
        assetCount: 37
        shared: false
        hasSharedLink: false
        isActivityEnabled: true
        albumUsers:
          - user:
              id: 22222222-2222-4222-8222-222222222222
              email: cauldron@example.com
            role: editor
        createdAt: "2026-01-19T21:04:00.000Z"
        updatedAt: "2026-08-30T12:00:00.000Z"

conformance:
  - name: the album users array is ordered and the order is the data
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        # "First entry is always the album owner. Second entry is the auth
        # user, if it differs from the owner. The rest are ordered
        # alphabetically." Nothing in the record says which user is the owner
        # except that they are at index nought.
        '[0].albumUsers[0].user.email': owner@example.com
        '[0].albumUsers[1].user.email': cauldron@example.com
        '[0].albumUsers[2].user.email': zoe@example.com
        # And on an album the caller owns, position one is not the caller --
        # there is no position one.
        '[1].albumUsers[0].user.email': cauldron@example.com
      absent:
        - '[1].albumUsers[1]'

  - name: description is an empty string today and null from v4
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        # The schema's own x-immich-history says: "An empty string is returned
        # instead of null for backwards compatibility; null will be returned
        # in v4." Both are falsy, so a truthiness check survives the change and
        # .length does not. The warning is in a vendor extension that standard
        # OpenAPI tooling ignores by specification.
        '[0].description': ""
        '[1].description': ""

  - name: a thumbnail is not implied by a non-zero asset count
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        # 37 assets and no thumbnail. albumThumbnailAssetId is nullable and
        # required, so it is always there and may be null, and code that
        # renders a tile from it needs a fallback the count does not predict.
        '[1].assetCount': 37
        '[1].albumThumbnailAssetId': null
        '[0].assetCount': 412

  - name: a listing of albums takes no parameter that would bound it
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        # A bare array, no envelope, no total, no next. GET /albums takes
        # assetId, id, isOwned, isShared and name -- and not one of them
        # limits the response.
        '[0].albumName': Iceland 2026
        '[1].albumName': Screenshots
      absent:
        - '[2]'
        - total

  - name: the shared filter is isShared
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      query:
        isShared: "true"
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        '[0].albumName': Iceland 2026
        '[0].shared': true
      absent:
        - '[1]'

  - name: the only public endpoint answers under a key called res
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/server/ping
      headers: {}
    expect:
      status: 200
      body:
        # Not status, not message, not ok. And this is the one operation in
        # 191 paths that declares no security at all.
        res: pong

  - name: an album fetched by id carries its timestamps
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums/2f1b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 200
      body:
        albumName: Iceland 2026
        createdAt: "2026-06-02T10:15:00.000Z"
        updatedAt: "2026-09-01T08:42:11.000Z"
        hasSharedLink: false
        isActivityEnabled: true

  - name: a missing album is a 400, and so is one you may not read
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums/00000000-0000-4000-8000-000000000000
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      # Not 404. One status and one message for "does not exist" and "not
      # yours", so a client cannot tell a permission problem from a typo.
      status: 400
      body:
        message: "Not found or no album.read access"
        error: Bad Request
        statusCode: 400

  - name: no credential is refused
    source: https://raw.githubusercontent.com/immich-app/immich/main/open-api/immich-openapi-specs.json
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers: {}
    expect:
      status: 401
      body:
        message: "Authentication required"
        # The Nest.js envelope: message, error and the status repeated as
        # statusCode.
        error: Unauthorized
        statusCode: 401

  - name: "the rate limit says so in these words"
    source: "https://immich.app/docs/api/"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/albums
      headers:
        Authorization: Bearer cauldron.immich.jwt
    expect:
      status: 429
      body:
        message: "ThrottlerException: Too Many Requests"
        error: Too Many Requests
        statusCode: 429
