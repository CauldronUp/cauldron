# Baseten Recipe for Cauldron
#
# The model listing from Baseten's management API, read from the OpenAPI
# document served at api.baseten.co/v1/spec, and struck live on 2026-09-13 with
# no credential, with a wrong one, and against the document's own address.
#
# **A sixty-three byte error carries a two-and-a-half kilobyte browser
# Content-Security-Policy.** The body is:
#
#   {"code": "PERMISSION_DENIED", "message": "Authorization error"}
#
# and the headers that arrive with it allow scripts from Google Tag Manager,
# HubSpot, Stripe, Segment, PostHog, New Relic and doubleclick, frames from
# YouTube, Vimeo and Wistia, and `'unsafe-eval'` and `'unsafe-inline'` besides.
# None of it can matter: nothing here renders, and a command-line client will
# never execute a script. Forty times the payload, spent on a browser that is
# not there.
#
# **And the directives come back in a different order every time.** Three
# consecutive requests to the same path:
#
#   frame-src worker-src connect-src form-action default-src style-src ...
#   connect-src worker-src default-src script-src form-action child-src ...
#   form-action frame-ancestors style-src font-src connect-src script-src ...
#
# Twelve directives, shuffled per response -- a hash iteration order escaping
# into a security header. The policy is the same policy and the bytes are never
# the same bytes, so nothing downstream can cache it, diff it, or sign it.
#
# **There is no way to be unauthenticated here.** No credential and a wrong
# credential both answer 403 with a byte-identical body. Forbidden means the
# request was understood and refused; a client that has not logged in at all
# receives the same sentence as one whose key was revoked, and `WWW-Authenticate`
# is on neither.
#
# **The code is from another protocol.** `PERMISSION_DENIED` is
# `google.rpc.Code` 7 -- a gRPC status name, in a JSON body, beside an HTTP
# status that already says the same thing.
#
# **`Vary` names a cookie and an origin, and not the header that decides the
# answer.** `Vary: Origin, Cookie` on an API whose responses turn entirely on
# `Authorization`.
#
# **The document's own address answers 202 Accepted with nothing in it.**
# `GET /openapi.json` returns `Content-Length: 0`, `Content-Type: text/html`,
# and `x-amzn-waf-action: challenge` -- a firewall block wearing the status code
# for "your request has been accepted for processing", with
# `Access-Control-Expose-Headers: x-amzn-waf-action` so a browser can read the
# refusal it is not told about.
#
# So drift reports every failure here as unbacked, and every report is correct:
# the 403 that answers every anonymous request, the 202 the firewall sends, and
# the address the documentation gives for the document itself are all outside
# the document.
#
# **The listing declares one response and it is the 200.** `Gets all models`
# lists no 403, no 401 and no 429, on an API that answered 403 to every request
# here and publishes a page about handling 429.
#
# **A required field holds a sentence where a machine wants numbers.**
# `instance_type_name` is "Name of the instance type", required, and reads
# `1x2 - 1 vCPU, 2 GiB RAM`. Anything that wants the core count parses English.
#
# Also pinned: `production_deployment_id` and `development_deployment_id` are
# both required and both nullable, so a model with neither is a legal model;
# and the securityScheme declares `bearer` while its own description admits
# "The legacy `Authorization: Api-Key <api_key>` scheme is also accepted" --
# a second prefix that no generated client will ever produce.

recipe: baseten
capability: ai
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://docs.baseten.co/reference/management-api/overview
  spec: https://api.baseten.co/v1/spec
  spec_hash: 436ba45f92aabb96103e78512b3f4845f661c3ac45d4e0d32fc0fe200b24c975
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xture.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01
  also:
    # The prefix the scheme does not declare and the description admits to.
    - scheme: bearer
      header: Authorization
      prefix: "Api-Key "
  # One sentence for both: there is no unauthenticated state.
  absent_error: authorization_error
  rejected_error: authorization_error
  after_routing: true

responses:
  list:
    style: wrapped
    key: models
  error:
    style: flat
    message_field: message
    # A gRPC status name, in a JSON body, beside the HTTP status that says it.
    code_field: code

resources:
  model:
    id:
      field: id
      style: opaque
      length: 6
    fields:
      name:
        type: string
      created_at:
        type: datetime
      deployments_count:
        type: integer
      # Required and nullable, both of them.
      production_deployment_id:
      development_deployment_id:
      # "Name of the instance type", required, and a sentence.
      instance_type_name:
        type: string
      team_name:
        type: string

routes:
  - method: GET
    path: /v1/models
    resource: model
    operation: list
    pagination:
      style: none

  - method: GET
    # The address the documentation gives for the spec, behind a firewall that
    # answers in the 2xx range.
    path: /openapi.json
    public: true
    error: waf_challenge

errors:
  authorization_error:
    # Forbidden, for a caller who never presented anything.
    status: 403
    # gRPC's name for it.
    code: PERMISSION_DENIED
    message: Authorization error
    headers:
      # Forty times the body, for a browser that is not there. The order of
      # these twelve directives is different on every live response.
      Content-Security-Policy: "form-action 'self' https://*.nvidia.com https://nvidia.com; worker-src 'self' blob: data:; child-src 'self' blob: https://www.youtube.com https://player.vimeo.com https://fast.wistia.net; img-src 'self' * data: blob: https://www.googletagmanager.com https://www.google-analytics.com http://www.googletagmanager.com/ https://cdn.baseten.co https://*.hubspot.com; frame-src 'self' *; font-src 'self' https://fonts.gstatic.com https://cdn.baseten.co https://cdn.jsdelivr.net https://widget.usepylon.com; frame-ancestors 'self' *; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com http://www.googletagmanager.com/ https://cdn.baseten.co https://bam.nr-data.net https://cdn.jsdelivr.net https://cdn.segment.com https://js.hs-scripts.com https://js.hs-analytics.net https://js.hsadspixel.net https://js.hs-banner.com https://js.hscollectedforms.net https://js.stripe.com https://widget.usepylon.com https://apichatwidget.usepylon.com https://*.pusher.com https://googleads.g.doubleclick.net https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.baseten.co https://cdn.jsdelivr.net https://widget.usepylon.com; connect-src 'self' https://analytics.google.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.baseten.co https://bam.nr-data.net https://cdn.segment.com https://api.segment.io https://graphql.datocms.com https://*.amazonaws.com https://*.ingest.sentry.io https://cdn.jsdelivr.net https://pypi.org https://files.pythonhosted.org https://js.hs-banner.com https://forms.hscollectedforms.net https://api.hubapi.com https://stats.g.doubleclick.net https://*.usepylon.com https://*.pusher.com wss://*.pusher.com https://us.i.posthog.com https://us-assets.i.posthog.com blob: data: https://api.baseten.co https://*.api.baseten.co https://inference.baseten.co https://inference-eu.baseten.co; media-src 'self' * data: blob: http://commondatastorage.googleapis.com https://cdn.baseten.co; default-src 'self' https://cdn.baseten.co https://bam.nr-data.net"
      # A cookie and an origin, and not the header the answer turns on.
      Vary: Origin, Cookie
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff
      Referrer-Policy: same-origin
      Cross-Origin-Opener-Policy: same-origin

  waf_challenge:
    # Accepted for processing, said to a request that was blocked.
    status: 202
    empty: true
    headers:
      Content-Type: text/html; charset=UTF-8
      x-amzn-waf-action: challenge
      # So a browser can read the refusal it is not told about.
      Access-Control-Expose-Headers: x-amzn-waf-action
      Access-Control-Allow-Origin: "*"
      Cache-Control: no-store, max-age=0

fixtures:
  empty:
    model: []

  workspace:
    model:
      - id: abc123
        name: HelloWorld
        created_at: "2026-03-04T18:22:01Z"
        deployments_count: 1
        production_deployment_id: def456
        development_deployment_id: null
        # A sentence, in a required field, where a machine wants two numbers.
        instance_type_name: 1x2 - 1 vCPU, 2 GiB RAM
        team_name: Research
      - id: ghi789
        name: whisper-large
        created_at: "2026-07-19T08:45:33Z"
        # Both identifiers null, on a model the listing still carries.
        deployments_count: 0
        production_deployment_id: null
        development_deployment_id: null
        instance_type_name: 4x16 - 4 vCPU, 16 GiB RAM, 1 A10G
        team_name: Research

conformance:
  - name: a sixty-three byte refusal carries a browser security policy
    source: https://api.baseten.co/v1/models
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      # Forbidden, to a caller who presented nothing at all.
      status: 403
      body:
        # A gRPC status name, beside the HTTP status that already says it.
        code: PERMISSION_DENIED
        message: Authorization error
      header_matches:
        # Scripts, frames and analytics hosts, for a client that renders
        # nothing.
        Content-Security-Policy: "script-src [^;]*'unsafe-eval'"
      headers:
        # The header the answer actually turns on is not in this list.
        Vary: Origin, Cookie

  - name: a wrong credential is refused in the same bytes as no credential
    source: https://api.baseten.co/v1/models
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 403
      body:
        # Identical to the anonymous refusal: there is no unauthenticated
        # state to be in.
        code: PERMISSION_DENIED
        message: Authorization error
      header_matches:
        Content-Security-Policy: "frame-src"

  - name: the address of the spec answers two hundred and two with nothing
    source: https://api.baseten.co/openapi.json
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /openapi.json
      headers: {}
    expect:
      # Accepted for processing, said to a request that was blocked.
      status: 202
      no_body: true
      headers:
        x-amzn-waf-action: challenge
        Content-Type: text/html; charset=UTF-8
        Access-Control-Expose-Headers: x-amzn-waf-action

  - name: the legacy prefix the scheme does not declare still works
    source: https://api.baseten.co/v1/spec
    fixture: workspace
    request:
      method: GET
      path: /v1/models
      headers:
        # "The legacy Authorization: Api-Key <api_key> scheme is also
        # accepted", said only in a description a generated client drops.
        Authorization: "Api-Key cauldr0nf1xture.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01"
    expect:
      status: 200
      body:
        'models[0].id': abc123

  - name: a required field holds a sentence where a machine wants numbers
    source: https://api.baseten.co/v1/spec
    fixture: workspace
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer cauldr0nf1xture.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01"
    expect:
      status: 200
      body:
        # "Name of the instance type", required, type string.
        'models[0].instance_type_name': 1x2 - 1 vCPU, 2 GiB RAM
        'models[1].instance_type_name': 4x16 - 4 vCPU, 16 GiB RAM, 1 A10G
        'models[0].name': HelloWorld
        'models[0].team_name': Research
        'models[0].created_at': "2026-03-04T18:22:01Z"

  - name: a model with neither deployment is a legal model
    source: https://api.baseten.co/v1/spec
    fixture: workspace
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer cauldr0nf1xture.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01"
    expect:
      status: 200
      body:
        # Both required, both nullable.
        'models[1].production_deployment_id': null
        'models[1].development_deployment_id': null
        'models[1].deployments_count': 0
        'models[0].production_deployment_id': def456
        'models[0].development_deployment_id': null
        'models[0].deployments_count': 1

  - name: a workspace with no models still sends the envelope
    source: https://api.baseten.co/v1/spec
    fixture: empty
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer cauldr0nf1xture.ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01"
    expect:
      status: 200
      body:
        models: []
