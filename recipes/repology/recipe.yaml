# Repology Recipe for Cauldron
#
# Asking for a project nobody packages is a 200 with an empty array.
#
# Every other registry in this collection answers a missing thing with a 404 --
# PyPI with {"message": "Not Found"}, RubyGems with a plain-text sentence,
# crates.io with an errors array naming the crate. Repology says yes, and hands
# back []. So `if (!response.ok) throw` never fires, and a typo in a project
# name is indistinguishable from a project that genuinely exists and is
# packaged nowhere.
#
# It is defensible: Repology is not a registry of projects, it is an index of
# how other registries package them, and "nobody packages this" is a real
# answer rather than an absence. It is also the one answer a client is least
# likely to have written code for.
#
# **And only five of the fourteen fields are on every entry.** One project's
# response is a bare array with an entry per packaging -- 806 of them for curl
# -- and across those 806:
#
#   repo, visiblename, version, origversion, status   806 each
#   srcname                                           794
#   vulnerable                                        632
#   licenses                                          568
#   summary                                           496
#   categories                                        462
#   subrepo                                           404
#   binname                                           347
#   maintainers                                       339
#   binnames                                          158
#
# Entries range from six keys to thirteen, in eight distinct shapes, in one
# array. srcname -- the field anybody reaches for first -- is missing from
# twelve of them. vulnerable is absent from a hundred and seventy-four, which
# is not the same as false. And binname and binnames are the same idea singular
# and plural: no entry carries both, so reading either alone misses half the
# repositories.
#
# Written against the live API rather than a document: Repology publishes no
# OpenAPI, the endpoint is public, and every case below was checked against
# repology.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. One project has six statuses at once. Of curl's 806 packagings: 377
#      outdated, 255 legacy, 163 newest, 7 rolling, 3 devel, 1 incorrect. So
#      "what version is curl" has 806 answers and no single one is
#      authoritative, which is the entire point of the index and the thing a
#      client written around one number gets wrong.
#   2. Repology's own judgement travels in the data. status: "incorrect" is
#      not an error and not a failure -- it is the index saying that a
#      repository's version string could not be parsed as a version. There is
#      one such entry for curl, and it sits in the array beside the others.
#   3. origversion is the one that can be null. version is the normalised
#      form and origversion the packaging's own string -- 7.50.2 against
#      7.50.2-1 -- and it is origversion, the more specific of the two, that
#      is missing on some entries.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - A missing User-Agent is a 403, which is served. Repology also asks for
#     no more than one request a second, and a rate this Recipe cannot keep
#     is a rule about time rather than a shape.
#   - Repositories, maintainers, problems and the experimental v2 endpoints
#     are absent.
#   - The fixture holds six packagings where curl has 806. The counts above
#     are from the live response and the cases assert shapes rather than
#     totals, because a bare array carries no count to assert.
#
# The fixture below is public data about a public project, recorded on the
# date in the cases.

recipe: repology
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://repology.org/api/v1

auth:
  # Public.
  scheme: none

required_headers:
  User-Agent: user_agent_required

responses:
  resource:
    style: bare
  list:
    # A bare array: no envelope, no count, no cursor.
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  packaging:
    id:
      style: opaque
      # An entry has no identifier of its own: it is one repository's
      # packaging of one project, and the pair is the identity.
      field: "-"
    fields:
      project:
        type: string
        in: "-"
      repo:
        type: string
      subrepo:
        type: string
      srcname:
        type: string
      binname:
        type: string
      binnames:
        type: list
      visiblename:
        type: string
      version:
        type: string
      origversion:
        type: string
      status:
        type: string
      vulnerable:
        type: boolean
      summary:
        type: string
      licenses:
        type: list
      categories:
        type: list
      maintainers:
        type: list

routes:
  - method: GET
    path: /api/v1/project/{project}
    resource: packaging
    operation: list
    scope: [project]

errors:
  user_agent_required:
    status: 403
    message: Please set a meaningful User-Agent header

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  index:
    packaging:
      # Seven keys: no licences, no summary, no categories, no maintainers.
      - project: curl
        repo: aix_osp
        srcname: curl
        visiblename: curl
        version: 7.50.2
        origversion: 7.50.2-1
        status: legacy
        vulnerable: true

      # Ten keys, and up to date.
      - project: curl
        repo: aixtoolbox
        srcname: curl
        visiblename: curl
        version: 8.21.0
        origversion: 8.21.0-1
        status: newest
        summary: get a file from a FTP or HTTP server.
        licenses:
          - MIT/X derivate
        categories:
          - Applications/Internet

      # Thirteen keys, binnames plural, and a pre-release.
      - project: curl
        repo: debian_unstable
        subrepo: sid/main
        srcname: curl
        binnames:
          - curl
          - libcurl4t64
          - libcurl4-gnutls
          - libcurl4-openssl-dev
        visiblename: curl
        version: 8.22.0~rc2
        origversion: 8.22.0~rc2-2
        status: devel
        maintainers:
          - team+curl@tracker.debian.org
          - samueloph@debian.org
        categories:
          - libs

      # binname singular, no srcname at all, and a null origversion.
      - project: curl
        repo: slackware64_current
        subrepo: slackware64
        binname: curl
        visiblename: curl
        version: 8.21.0
        origversion: null
        status: newest
        maintainers:
          - volkerdi@slackware.com

      # Repology's own judgement, in the array beside the rest.
      - project: curl
        repo: chromebrew
        srcname: curl_static
        visiblename: curl_static
        version: "20260301.1"
        origversion: null
        status: incorrect
        summary: Static curl 8.x via alpine build
        licenses:
          - GPL-3

      # Behind, and known to be so.
      - project: curl
        repo: aix_osp
        srcname: curl
        visiblename: curl
        version: 7.25.0
        origversion: 7.25.0-1
        status: legacy
        vulnerable: true

conformance:
  - name: a project nobody packages is a 200 with an empty array
    source: https://repology.org/api/v1/project/not-a-real-project-cauldron-fixture
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/not-a-real-project-cauldron-fixture
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      # Every other registry here answers 404. This one says yes and hands
      # back nothing, so `if (!response.ok) throw` never fires and a typo is
      # indistinguishable from a project packaged nowhere.
      status: 200
      absent:
        - "[0]"

  - name: one project has six statuses at once
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # Of curl's 806 live packagings: 377 outdated, 255 legacy, 163
        # newest, 7 rolling, 3 devel, 1 incorrect. No single entry is the
        # answer to "what version is curl".
        "[0].status": legacy
        "[1].status": newest
        "[2].status": devel
        "[4].status": incorrect

  - name: only five fields are on every entry
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # repo, visiblename, version, origversion and status are on all 806.
        "[0].repo": aix_osp
        "[0].visiblename": curl
        "[0].version": 7.50.2
        "[0].status": legacy
      absent:
        # And this entry has none of the rest.
        - "[0].licenses"
        - "[0].summary"
        - "[0].categories"
        - "[0].maintainers"

  - name: srcname is missing from some entries entirely
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # Twelve of curl's 806 have no srcname, and it is the field anybody
        # reaches for first. The other 794 carry it, so a client cannot even
        # tell from one response that the field is optional.
        "[0].srcname": curl
        "[3].repo": slackware64_current
        "[3].binname": curl
      absent:
        - "[3].srcname"

  - name: binname and binnames are the same idea and never both
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # 347 entries carry binname, 158 carry binnames, and none carries
        # both -- so reading either alone misses half the repositories.
        "[2].binnames[0]": curl
        "[2].binnames[1]": libcurl4t64
        "[3].binname": curl
      absent:
        - "[2].binname"
        - "[3].binnames"

  - name: vulnerable is absent rather than false
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # 632 of the 806 carry it. The other 174 are not saying no; they are
        # not saying anything.
        "[0].vulnerable": true
      absent:
        - "[1].vulnerable"

  - name: origversion is the one that can be null
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # version is normalised and origversion is the packaging's own
        # string, and it is the more specific of the two that goes missing.
        "[0].version": 7.50.2
        "[0].origversion": 7.50.2-1
        "[3].version": 8.21.0
        "[3].origversion": null

  - name: the index's own judgement travels in the data
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # Not an error and not a failure: the index saying this repository's
        # version string could not be read as a version, in an ordinary entry
        # beside the others.
        "[4].repo": chromebrew
        "[4].status": incorrect
        "[4].version": "20260301.1"

  - name: a request with no User-Agent is refused
    source: https://repology.org/api/v1/project/curl
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /api/v1/project/curl
    expect:
      # The second registry in this collection to refuse for attribution
      # rather than for permission, after crates.io.
      status: 403
      body:
        message: Please set a meaningful User-Agent header
