# Visual Crossing Recipe for Cauldron
#
# See weatherapi/recipe.yaml's header for the question this group of three
# Recipes -- WeatherAPI, Tomorrow.io and Visual Crossing -- exists to ask
# about a commercial weather API's own answer to "how old is this forecast."
# Visual Crossing turns out to be the odd one for a different reason than
# either sibling: it is the one of the three that bills by the record rather
# than by the request, and its response carries a figure that says what the
# call cost. It also turned out to be the sharpest of the three on almost
# every other axis this collection tracks, because its host is a plain
# Tomcat servlet container answering honestly about its own dispatch
# failures in a way neither of the other two vendors' gateways do.
#
# **The response tells a caller what the call cost, in the currency this API
# actually bills in.** Visual Crossing's own published example for the
# Timeline Weather endpoint --
# https://www.visualcrossing.com/resources/documentation/weather-api/timeline-weather-api/
# -- opens with "queryCost": 168, documented in the same page as "The record
# cost of this query." That is a genuinely different answer to "does the API
# tell a caller what a call cost" than either sibling Recipe in this group
# can give: WeatherAPI and Tomorrow.io both bill by the request, so neither
# response has anything to say about cost at all. Visual Crossing bills by
# how many day-and-hour records a query touches -- a multi-day, hourly-
# resolution request costs more than a single day's summary -- and says so
# on every successful call, unprompted, in the same envelope as the weather
# itself.
#
# **And that same response never says which units it is in.** unitGroup is a
# documented, optional request parameter -- "us", "uk", "metric" or "base",
# defaulting to "us" when omitted -- and nothing in the response body names
# which of the four produced the numbers in front of a caller: no units
# object the way Open-Meteo's hourly_units is, no per-field suffix the way
# WeatherAPI's temp_c/temp_f pair is, not even the bare pass-through
# Tomorrow.io's Recipe in this group already names for the identical
# problem. All three of this collection's commercial weather Recipes now
# answer the units question the same way in the end -- a client has to
# remember what it asked for, because nothing it gets back will remind it --
# and Visual Crossing is the version with no distinguishing field name at
# all: temp, humidity, windspeed and pressure hold whatever unitGroup
# produced them, silently.
#
# **Absent and wrong are two different sentences, in a shape neither sibling
# Recipe in this group finds.** Struck live, with no account and no key,
# against weather.visualcrossing.com:
#
#   GET /VisualCrossingWebServices/rest/services/timeline/London               -> 401 "No session or key found."
#   GET /VisualCrossingWebServices/rest/services/timeline/London?key=junkkey12345 -> 401 "No account found with API key"
#   GET /VisualCrossingWebServices/rest/services/timeline/London?key=            -> 401, byte-identical to the first
#   GET /VisualCrossingWebServices/rest/services/timeline/London?key=x           -> 401, byte-identical to the second
#
# Two real sentences, the way WeatherAPI's Recipe in this group finds two
# numbered codes -- but both of Visual Crossing's are plain prose, twenty-
# four and twenty-nine bytes, with no envelope of any kind around either
# one. **And Content-Type lies about it on every one of these four
# responses**: the header reads Content-Type: application/json and the body
# is not JSON at all -- no braces, no quotes, a sentence with a full stop.
# together/recipe.yaml in this collection already names a provider that
# answers two different media types for absent versus wrong credentials;
# Visual Crossing answers the identical, single, false media type for both,
# which is a different and in its own way more misleading version of the
# same finding -- a client trusting the header rather than sniffing the body
# gets an obviously wrong answer here rather than a merely inconsistent one.
#
# **A path this host has no route for answers honestly, with no Content-Type
# announced at all -- next to the credential failures' dishonest one.**
# Struck live, both ways:
#
#   GET /VisualCrossingWebServices/rest/services/nosuchroute                    -> 404 "Request did not match an endpoint.", no Content-Type header
#   GET /VisualCrossingWebServices/rest/services/nosuchroute?key=junkkey12345    -> 404, byte-identical, credential makes no difference
#
# auth.after_routing carries the ordering: the router refuses an unknown path
# before the credential check would ever run, exactly as HERE's, what3words'
# and both sibling Recipes in this group already establish for their own
# hosts.
#
# **And once a path does match, the HTTP method produces three different
# outcomes, not two -- because this host is a real servlet container that
# genuinely dispatches on method, and one of its three registered methods
# for this path is broken.** Struck live, six ways, all against the real
# path and all unaffected by whether a credential was sent:
#
#   PATCH  /timeline/London                        -> 405, a genuine Tomcat error page, Allow: POST,GET,OPTIONS
#   DELETE /timeline/London?key=junkkey12345         -> 405, byte-identical, credential makes no difference
#   PUT    /timeline/London                          -> 405, byte-identical again
#   POST   /timeline/London                          -> 500, a genuine Tomcat "Internal Server Error" page
#   POST   /timeline/London?key=junkkey12345          -> 500, byte-identical, credential makes no difference
#   OPTIONS /timeline/London                          -> 200 text/plain "HEAD, POST, GET, OPTIONS", a CORS preflight answer
#
# GET works. PATCH, DELETE and PUT are refused with a real, honest 405 and a
# real Allow header, exactly what this collection's other Recipes keep
# finding providers decline to send -- turso/recipe.yaml and both sibling
# Recipes in this group all record hosts with no genuine 405 anywhere; this
# one has one, from the servlet container itself, before the application's
# own auth logic is ever reached. But POST -- a method the Allow header
# itself lists as registered -- answers 500, not a business error and not a
# 405: the application has a handler mapped to POST on this path and that
# handler throws before it produces a response a caller could act on. This
# is the sharpest finding in this Recipe and arguably in this whole group: a
# wrong method is not always refused gracefully, and here the one that is
# "allowed" is the one that breaks -- verified credential-independent both
# ways, which is what makes it a finding about the servlet dispatch rather
# than about auth. It is recorded here rather than wired as a route: a route
# naming a fixed error is exactly the mechanism turso/recipe.yaml uses for
# its own retired-endpoint 410, but that mechanism and auth.after_routing
# both want to run at the same moment -- Cauldron checks the credential
# immediately after a route matches and before dispatching to that route's
# named error, so a POST this Recipe declared would answer 401 for a missing
# key rather than the credential-blind 500 the live host actually sends.
# Reproducing the crash exactly would mean abandoning this Recipe's
# absent/rejected verdict naming for every route to get one route's ordering
# right, which is a worse trade than leaving POST out and saying so -- see
# the known fidelity gaps. The Allow header is a smaller version of the same
# kind of gap: it is inconsistent between the two live failure shapes above,
# "POST,GET,OPTIONS" on the 405 page and "HEAD,POST,GET,OPTIONS" on the
# OPTIONS preflight answer, HEAD present in one and not the other, and this
# Recipe does not assert a value for it in the 405 conformance case below,
# for the same reason HERE's Recipe in this collection declines to assert
# one at all.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every 401, 404 and 405 below are struck live and carry a
#     verified date; the one 200 case is Visual Crossing's own documented
#     example and carries none.
#   - POST is not wired as a route at all, even though its credential-blind
#     500 is verified live two separate ways (see the header). Cauldron's
#     auth.after_routing checks the credential immediately after a route
#     matches and before dispatching to that route's own fixed error, so a
#     declared POST route would answer 401 for a missing key where the live
#     host answers 500 regardless -- reproducing the real ordering would mean
#     giving up this Recipe's absent/rejected verdict naming to get one
#     route right. Left out and said so here, rather than modelled as a
#     credential check the live crash never performs.
#   - The live 404 for an unrouted path carries no Content-Type header at
#     all. Cauldron's text error style cannot leave the header truly unset --
#     it falls back to text/plain; charset=utf-8 whenever a Recipe has not
#     declared one explicitly, the same default every text-style error here
#     needs for some other failure -- so this Recipe's own 404 carries a
#     Content-Type the live host does not send. Stated rather than asserted:
#     no conformance case below claims a value for it.
#   - No Allow header value is asserted on the 405 case, for the reason in
#     the header: the live host itself is not internally consistent about
#     what belongs in it, and Cauldron's own automatic Allow -- built from
#     whatever methods this Recipe declares as routes -- would not reproduce
#     either live string exactly regardless.
#   - Of the documented response fields this Recipe declares eight at the top
#     level (queryCost, latitude, longitude, resolvedAddress, address,
#     timezone, tzoffset, days, stations) and does not further type the day,
#     hour or station objects nested inside days and stations: those are
#     carried through as opaque list and map values holding exactly the
#     vendor's own published example, the same choice
#     nationalweatherservice/recipe.yaml makes for geometry and
#     openmeteo/recipe.yaml makes for hourly, rather than declaring several
#     dozen more named fields for a shape this Recipe's own findings are not
#     about.
#   - currentConditions -- a separate, documented include=current option
#     returning a single present-tense record alongside days -- is not
#     modelled. No worked example of it exists on the page this Recipe read,
#     and elements/include/date-range parameters that change which of the
#     documented fields actually appear are not modelled either: the one 200
#     case here proves the default shape only.
#   - No fetchable OpenAPI or Swagger document exists at a stable URL for
#     this API; the documentation page read for this Recipe is hand-written
#     prose with an inline JSON example. upstream.spec is not recorded for
#     that reason.
#   - No refresh cadence is documented anywhere this Recipe could find for
#     how often the underlying data changes, the same gap both sibling
#     Recipes in this group record for their own providers. No cache-related
#     header of any kind -- no Cache-Control, no ETag, no Age -- appeared on
#     any response this Recipe struck, error or success.

recipe: visualcrossing
capability: infrastructure
version: 0.1.0

upstream:
  api: rest
  docs: https://www.visualcrossing.com/resources/documentation/weather-api/timeline-weather-api/

auth:
  # In the query string -- the third data point for the question
  # here/recipe.yaml, what3words/recipe.yaml, weatherapi/recipe.yaml and
  # tomorrowio/recipe.yaml all ask the same thing about. Confirmed live: an
  # explicitly empty key= is treated exactly like an omitted one, and any
  # single non-empty character is enough to be classified as wrong rather
  # than missing -- see the header.
  scheme: query
  param: key
  keys:
    - cauldron_visualcrossing_fixture_key_00000000000
  # The route and the method are both resolved before the credential is ever
  # looked at. Verified with and without a key, on every failure shape this
  # Recipe struck: an unrouted path 404s, a disallowed method 405s, and the
  # one registered-but-broken method 500s, none of them changing when a
  # credential -- right, wrong or absent -- is added. See the header.
  after_routing: true
  # A key that is present and not one this Recipe holds gets Visual
  # Crossing's own second sentence. Absent -- and, live-confirmed, an
  # explicitly empty key= as well -- falls through to the default
  # authentication_error, whose wording is already Visual Crossing's first
  # one.
  rejected_error: invalid_key

responses:
  resource:
    style: bare
  error:
    # Every failure on this host is plain prose, never JSON, regardless of
    # what Content-Type claims -- see the header. Text is the honest style
    # for all four failure shapes; the two credential failures override
    # Content-Type to the (false) application/json the live host sends, and
    # the routing/method/crash failures below either accept this style's own
    # text/plain default (the 404, which the live host actually leaves
    # unset -- see the known fidelity gaps) or override it to the genuinely
    # correct text/html;charset=utf-8 a real Tomcat error page carries (the
    # 405 and the 500).
    style: text

resources:
  timeline:
    id:
      # The location segment in the path, e.g. "London" -- echoed nowhere in
      # the body under its own name; address and resolvedAddress are Visual
      # Crossing's own geocoded strings, not the identifier a caller sent.
      style: opaque
    fields:
      # The figure that answers this group's cost question -- see the
      # header. The record cost of this specific query, not a currency
      # amount.
      queryCost:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      resolvedAddress:
        type: string
      address:
        type: string
      timezone:
        type: string
      tzoffset:
        type: number
      # Carried through opaquely -- see the header and the known fidelity
      # gaps. Each entry is a full day record with its own nested hours
      # array, exactly Visual Crossing's own published shape.
      days:
        type: list
      # A map keyed by station code, each entry a name/lat/lon/distance
      # record. Carried through opaquely for the same reason as days.
      stations:
        type: map

routes:
  - method: GET
    path: /VisualCrossingWebServices/rest/services/timeline/{id}
    resource: timeline
    operation: get

  # POST is deliberately not declared -- see the header. The live host
  # answers a credential-blind 500 for it, and this Recipe cannot reproduce
  # that ordering without giving up its own absent/rejected verdict naming,
  # so it is left out rather than modelled as a 405 this host has never sent
  # for that verb, or a 401 the live crash never checks for either.

errors:
  # The default, absent-credential shape -- also what an explicitly empty
  # key= gets, live-confirmed. Content-Type is the live host's own lie: this
  # is not JSON. See the header and the auth block above.
  authentication_error:
    status: 401
    message: "No session or key found."
    headers:
      Content-Type: application/json

  # A key that is present, non-empty, and not one this Recipe holds. Live,
  # from a single character up. Same false Content-Type.
  invalid_key:
    status: 401
    message: "No account found with API key"
    headers:
      Content-Type: application/json

  # Overrides Cauldron's own built-in name so a routing miss gets the live
  # host's own wording. The live response carries no Content-Type at all;
  # this Recipe's own text-style default of text/plain; charset=utf-8 is a
  # stated gap rather than a claim -- see the known fidelity gaps.
  unknown_route:
    status: 404
    message: "Request did not match an endpoint."

  # A genuine Tomcat error page for a method this host really does refuse --
  # PATCH, DELETE and PUT all struck this live and byte-identical, with and
  # without a credential. See the header for the Allow header this Recipe
  # does not assert a value for.
  method_not_allowed:
    status: 405
    headers:
      Content-Type: "text/html;charset=utf-8"
    message: '<!doctype html><html lang="en"><head><title>HTTP Status 405 – Method Not Allowed</title><style type="text/css">body {font-family:Tahoma,Arial,sans-serif;} h1, h2, h3, b {color:white;background-color:#525D76;} h1 {font-size:22px;} h2 {font-size:16px;} h3 {font-size:14px;} p {font-size:12px;} a {color:black;} .line {height:1px;background-color:#525D76;border:none;}</style></head><body><h1>HTTP Status 405 – Method Not Allowed</h1></body></html>'

fixtures:
  empty: {}

  # Visual Crossing's own published example for the Timeline Weather API --
  # quoted, not observed. Reston, VA; a two-day window with the first day's
  # hourly detail trimmed to two of twenty-four hours, exactly as the
  # documentation page itself trims it.
  reston:
    timeline:
      - id: Reston,VA
        queryCost: 168
        latitude: 38.9598
        longitude: -77.3545
        resolvedAddress: "Reston, VA, United States"
        address: "Reston,VA"
        timezone: America/New_York
        tzoffset: -4.0
        days:
          - datetime: "2025-06-01"
            tempmax: 68.0
            tempmin: 44.9
            temp: 58.6
            humidity: 56.4
            precip: 0.0
            windspeed: 14.4
            pressure: 1009.5
            cloudcover: 61.6
            sunrise: "05:45:46"
            sunset: "20:29:24"
            conditions: Partially cloudy
            icon: partly-cloudy-day
            stations: [KIAD, KJYO]
            hours:
              - datetime: "00:00:00"
                temp: 52.9
                humidity: 59.3
                dew: 39.1
                windspeed: 5.3
                pressure: 1006.3
                cloudcover: 0.0
                conditions: Clear
                icon: clear-night
              - datetime: "12:00:00"
                temp: 65.8
                humidity: 43.1
                windspeed: 13.0
                pressure: 1010.5
                conditions: Partially cloudy
                icon: partly-cloudy-day
          - datetime: "2025-06-02"
            tempmax: 74.0
            tempmin: 47.0
            temp: 61.7
            humidity: 53.5
            precip: 0.0
            windspeed: 10.0
            pressure: 1016.7
            cloudcover: 32.1
            sunrise: "05:45:24"
            sunset: "20:30:04"
            conditions: Partially cloudy
            icon: partly-cloudy-day
        stations:
          KIAD:
            name: Washington Dulles Intl AP
            latitude: 38.95
            longitude: -77.45
            distance: 8339.0
          KJYO:
            name: Leesburg Executive Airport
            latitude: 39.08
            longitude: -77.56
            distance: 22247.0

conformance:
  - name: no credential at all is told in prose, under a Content-Type that lies
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London
    verified: "2026-09-02"
    fixture: reston
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/timeline/London
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body_matches: "^No session or key found\\.$"

  - name: a key that is present and wrong is told a different sentence, same false Content-Type
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London?key=junkkey12345
    verified: "2026-09-02"
    fixture: reston
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/timeline/London?key=junkkey12345
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body_matches: "^No account found with API key$"

  - name: an explicitly empty key answers the same as no key at all
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London?key=
    verified: "2026-09-02"
    fixture: reston
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/timeline/London?key=
    expect:
      status: 401
      body_matches: "^No session or key found\\.$"

  - name: a single character is already enough to be called wrong rather than missing
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London?key=x
    verified: "2026-09-02"
    fixture: reston
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/timeline/London?key=x
    expect:
      status: 401
      body_matches: "^No account found with API key$"

  - name: an unrouted path answers honestly, before the key is examined
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/nosuchroute
    expect:
      status: 404
      body_matches: "^Request did not match an endpoint\\.$"

  - name: and a key changes nothing about that answer
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/nosuchroute?key=junkkey12345
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/nosuchroute?key=junkkey12345
    expect:
      status: 404
      body_matches: "^Request did not match an endpoint\\.$"

  - name: a disallowed method gets a genuine 405 before the key is examined
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London
    verified: "2026-09-02"
    fixture: reston
    request:
      method: PATCH
      path: /VisualCrossingWebServices/rest/services/timeline/London
    expect:
      status: 405
      headers:
        Content-Type: "text/html;charset=utf-8"
      body_matches: "HTTP Status 405"

  - name: and a key changes nothing about that answer either
    source: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/London?key=junkkey12345
    verified: "2026-09-02"
    fixture: reston
    request:
      method: DELETE
      path: /VisualCrossingWebServices/rest/services/timeline/London?key=junkkey12345
    expect:
      status: 405
      body_matches: "HTTP Status 405"

  # No conformance case asserts the POST/500 finding -- see the header and
  # the known fidelity gaps for why Cauldron's own auth.after_routing cannot
  # reach a route's fixed error without checking the credential first, which
  # would misrepresent a failure verified live to be credential-independent.

  - name: an authenticated call answers a record cost and no units label anywhere
    # Visual Crossing's own documented example -- see the header for the
    # queryCost and units findings this proves.
    source: https://www.visualcrossing.com/resources/documentation/weather-api/timeline-weather-api/
    fixture: reston
    request:
      method: GET
      path: /VisualCrossingWebServices/rest/services/timeline/Reston,VA?key=cauldron_visualcrossing_fixture_key_00000000000
    expect:
      status: 200
      body:
        queryCost: 168
        latitude: 38.9598
        longitude: -77.3545
        resolvedAddress: "Reston, VA, United States"
        timezone: America/New_York
        tzoffset: -4.0
        "days[0].datetime": "2025-06-01"
        "days[0].tempmax": 68.0
        "days[0].hours[0].temp": 52.9
        "days[0].hours[1].datetime": "12:00:00"
        "days[1].datetime": "2025-06-02"
        "stations.KIAD.name": Washington Dulles Intl AP
        "stations.KJYO.distance": 22247.0
      absent:
        - units
        - unitGroup
        - unit
