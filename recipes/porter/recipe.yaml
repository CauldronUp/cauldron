# Porter Recipe for Cauldron
#
# The group this Recipe belongs to asks what a deploy create answers and what
# state machine sits behind the id it names. Porter's honest answer is that
# there is no such call to strike, and this Recipe exists to establish that
# carefully rather than assume it.
#
# api.porter.run is the host a client would guess from every other Recipe in
# this group -- app.koyeb.com/v1, api.northflank.com/v1, api.porter.run --
# and it is not serving anything. Every path struck, GET and POST alike,
# root and a plausible /v1/apps alike, answers the identical sixteen bytes:
# HTTP 521, "error code: 521", text/plain, Server: cloudflare, a CF-RAY id
# and nothing else -- Cloudflare's own "web server is down" page, sent from
# the edge because the origin behind api.porter.run never answers at all.
# That is not a 404, not a 401, not an application refusing a request: it is
# the thing this Recipe describes below, an origin that Porter's own DNS
# still points a hostname at and nothing behind it answers.
#
# docs.porter.run publishes no REST API reference of any kind. Its own
# machine-readable index (docs.porter.run/llms.txt) lists CLI command
# reference pages (porter apply, porter auth, porter config, porter target,
# porter job, porter cloud-accounts...), porter.yaml's configuration-as-code
# schema, and a Model Context Protocol server at mcp.porter.run -- "connect
# to Porter's remote MCP server first and use its tools before falling back
# to the Porter CLI" -- which "signs in through a browser using OAuth, so it
# cannot be used in headless environments." Not one page in that index is
# titled anything like API reference, and no page documents a request or
# response shape for creating or polling a deployment over HTTP. A deploy on
# Porter is triggered by a GitHub Actions workflow Porter itself opens a pull
# request for, or by `porter apply` reading porter.yaml, or by the MCP
# server's own tools -- none of them a plain REST call this format has a
# vocabulary for, and none of them documented as one.
#
# What is left, reachable without an account and worth being honest about
# rather than silent on, is dashboard.porter.run -- the web application at
# the other end of the CLI's browser-based login, and, underneath the
# React app it serves, a real backend. GET /api/projects and
# GET /api/users/current both answer 403 {"error":"Forbidden"}, live,
# checked with no credential, with an obviously wrong bearer token, and with
# an obviously wrong session cookie -- all three struck against
# /api/projects and all three byte-identical. That is not the OAuth-gated
# dashboard login rejecting a request Cauldron is built to reproduce -- there
# is no key or token this Recipe could ever hold for a session-cookie web
# login -- it is this host's own answer to "nothing plausible was
# presented," stated once and reused for the whole gate. This surface is
# real and it is not public: nothing publishes its shape, no version number
# labels it, and it could change on any deploy of the dashboard itself
# without anywhere to read that it had. It is modelled below because the
# group this Recipe belongs to is explicitly about establishing what is
# actually there rather than assuming a narrow answer means an empty file,
# and because the routing-and-refusal shape this backend actually has is
# itself an answer to this group's own questions -- just not the "create a
# deployment, poll its state" answer the other two Recipes in it found.
#
# Two more things checked live on this backend, both worth having pinned:
#
#   A path it does not route at all -- /api/this-is-not-a-real-endpoint --
#   answers 404 "404 page not found", text/plain, no credential needed to
#   see it: Go's own net/http default, the same unstyled fallback Turso's
#   and SingleStore's Recipes in this collection both find on their own
#   hosts, and a different shape entirely from the {"error": "..."} JSON
#   every real route on this backend answers with.
#
#   A wrong method on a real path -- PATCH or DELETE on /api/projects --
#   answers a genuine 405, Content-Type: application/json;charset=utf8,
#   Content-Length: 0. The header claims JSON and the body is zero bytes:
#   the same shape of infidelity Step 2 of this group's brief was written to
#   go looking for, found on the one provider in the group with no
#   documented API to check it against. No Allow header rides along either,
#   unlike Northflank's and SingleStore's Recipes in this collection, both
#   of which found a real Allow naming what would have worked.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No deployment, app, service, release or build resource is declared
#     anywhere in this file. That is not an oversight this Recipe forgot to
#     fill in -- it is the finding. See above.
#   - No account was ever created and no session was ever established.
#     Every case below is struck unauthenticated, live, and carries a
#     `verified:` date; nothing here is drafted from documentation, because
#     there is no documentation of this surface to draft from.
#   - mcp.porter.run is real, documented, and not modelled: it answers the
#     Model Context Protocol rather than REST, requires an interactive
#     OAuth browser sign-in this task's own rules forbid attempting, and
#     this format has no vocabulary for an MCP tool call in the first place.
#   - dashboard.porter.run's own frontend routes -- everything that is not
#     under /api/ -- answer 200 with the same compiled React shell
#     regardless of path, /livez and /readyz included, which is the client
#     router's catch-all rather than a real health check. Not modelled: it
#     is one HTML document, not an API response.
#   - Whatever dashboard.porter.run/api actually serves once authenticated
#     is entirely unknown to this Recipe. No login was attempted -- Claude
#     never signs into anything on a user's behalf -- so nothing past the
#     403 gate could be observed, and nothing past it is claimed.
#   - No upstream.spec is declared. There is nothing to fetch: Porter
#     publishes no OpenAPI, Swagger, or other machine-readable description
#     of dashboard.porter.run/api anywhere this task's research could find,
#     and api.porter.run has no description either, because it has no
#     server behind it to describe one.

recipe: porter
capability: hosting
version: 0.1.0

upstream:
  # Porter labels no version anywhere for either surface this Recipe
  # touches: api.porter.run has no server behind it to label one, and
  # dashboard.porter.run/api is the dashboard's own internal backend, not a
  # versioned public contract. "undocumented" states that plainly rather
  # than inventing a v1 nobody published.
  api: undocumented
  docs: https://docs.porter.run/
  # No spec: field. See the header -- there is nothing published to fetch.

auth:
  # Nothing below is gated by a credential this Recipe could ever hold.
  # api.porter.run answers before any application logic runs at all, and
  # dashboard.porter.run/api's one real gate answers identically to no
  # credential, a wrong bearer token and a wrong session cookie alike -- see
  # the header. scheme: none plus a fixed error on every route is the
  # honest expression of "checked, and found no verdict this format's
  # absent/malformed/rejected split would distinguish."
  scheme: none

responses:
  error:
    style: flat
    message_field: error
    code_field: "-"

routes:
  # api.porter.run. Every path and method struck answers the identical
  # sixteen bytes -- see the header. Two representative paths are declared
  # rather than one to make the point the header states in words: this is
  # not one route failing, it is the whole host.
  - method: GET
    path: /v1/apps
    status: 521
    raw:
      content_type: text/plain; charset=UTF-8
      text: "error code: 521"

  - method: POST
    path: /v1/apps
    status: 521
    raw:
      content_type: text/plain; charset=UTF-8
      text: "error code: 521"

  # dashboard.porter.run/api. Real, live, undocumented -- see the header.
  - method: GET
    path: /api/projects
    error: forbidden

  - method: GET
    path: /api/users/current
    error: forbidden

  # A real path, wrong method: a genuine 405, JSON claimed, zero bytes
  # sent, no Allow header. See the header.
  - method: PATCH
    path: /api/projects
    status: 405
    raw:
      content_type: "application/json;charset=utf8"
      empty: true

  - method: DELETE
    path: /api/projects
    status: 405
    raw:
      content_type: "application/json;charset=utf8"
      empty: true

errors:
  # {"error": "Forbidden"} -- 403, not 401, even with nothing presented at
  # all. See the header.
  forbidden:
    status: 403
    message: Forbidden
    headers:
      Content-Type: "application/json;charset=utf8"

  # Go's net/http default, text/plain, not this backend's own JSON shape.
  unknown_route:
    status: 404
    style: text
    message: "404 page not found"

fixtures:
  empty: {}

conformance:
  - name: the documented-sounding host is not a 404 or a 401, it is Cloudflare saying nothing is behind it
    source: https://api.porter.run/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/apps
    expect:
      status: 521
      headers:
        content-type: text/plain; charset=UTF-8
      body_matches: "^error code: 521$"

  - name: and a write to the same host fails identically, credential or body would not have mattered
    source: https://api.porter.run/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/apps
    expect:
      status: 521
      body_matches: "^error code: 521$"

  - name: no credential at all against the real dashboard backend is 403, not 401
    source: https://dashboard.porter.run/api/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/projects
    expect:
      status: 403
      headers:
        content-type: "application/json;charset=utf8"
      body:
        error: Forbidden

  - name: a wrong bearer token answers the byte-identical 403
    source: https://dashboard.porter.run/api/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/projects
      headers:
        Authorization: Bearer junkjunkjunk12345
    expect:
      status: 403
      body:
        error: Forbidden

  - name: and so does a wrong session cookie -- neither scheme this host might check tells wrong from missing
    source: https://dashboard.porter.run/api/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/projects
      headers:
        Cookie: porter_session=junkjunkjunk12345
    expect:
      status: 403
      body:
        error: Forbidden

  - name: a second real path answers the identical gate
    source: https://dashboard.porter.run/api/users/current
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/users/current
    expect:
      status: 403
      body:
        error: Forbidden

  - name: an unrouted path under the same prefix is Go's plain 404, not this backend's JSON
    source: https://dashboard.porter.run/api/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: text/plain; charset=utf-8
      body_matches: "^404 page not found$"

  - name: a wrong method on a real path is a genuine 405 that claims JSON and sends nothing
    source: https://dashboard.porter.run/api/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/projects
    expect:
      status: 405
      headers:
        content-type: "application/json;charset=utf8"

  - name: and the same is true for DELETE, with no Allow header naming what would have worked
    source: https://dashboard.porter.run/api/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /api/projects
    expect:
      status: 405
      absent:
        - headers.allow
