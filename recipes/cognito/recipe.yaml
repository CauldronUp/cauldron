  - name: the jwks route answers with no credential presented at all
    # Proves the exemption on this Recipe: every case above that reaches a
    # real operation is refused with no Authorization header -- see the
    # first case in this file. This route, alone, is not; it is refused for
    # the pool id instead, which is Cognito's own business logic rather
    # than an authentication failure. Re-struck live 2026-09-02, byte for
    # byte the same as the header's original probe.
    source: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZZZZZZZZZ/.well-known/jwks.json
    verified: "2026-09-02"
    request:
      method: GET
      path: /us-east-1_ZZZZZZZZZ/.well-known/jwks.json
    expect:
      status: 404
      body:
        message: User pool us-east-1_ZZZZZZZZZ does not exist.
      absent:
        - __type
        - code

  - name: and a syntactically valid credential attached does not change that either
    # Struck live with the same SigV4-shaped header the two ListUserPools
    # cases above use. Byte-identical to the case above: this route does
    # not examine a credential whether one is sent or not.
    source: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZZZZZZZZZ/.well-known/jwks.json
    verified: "2026-09-02"
    request:
      method: GET
      path: /us-east-1_ZZZZZZZZZ/.well-known/jwks.json
      headers:
        Authorization: "AWS4-HMAC-SHA256 Credential=AKIA-JUNK-JUNK-JUNK-JUNK/20260901/us-east-1/cognito-idp/aws4_request, SignedHeaders=host;x-amz-date, Signature=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    expect:
      status: 404
      body:
        message: User pool us-east-1_ZZZZZZZZZ does not exist.

  # The page size. Asking for one and receiving the first without the
  # second can only happen if MaxResults was read -- with the name
  # ignored the whole collection comes back, and this fixture holds 2
  # records. No record had to be invented for that.
  - name: "MaxResults is read, because a page of one is not the whole collection"
    source: "https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_ListUserPools.html"
    fixture: account
    request:
      method: POST
      path: "/"
