        "Authorization": "AWS4-HMAC-SHA256 Credential=CAULDRONKEY/20260115/us-east-1/cognito-idp/aws4_request, SignedHeaders=host;x-amz-date, Signature=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    expect:
      status: 200
      body:
        "UserPools[0].Id": "us-east-1_EXAMPLE"
      absent:
        - "UserPools[1]"

  # The names. This Recipe declares 4 field(s) on a UserPool that no
