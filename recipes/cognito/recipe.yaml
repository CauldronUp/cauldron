  # And the position. Asking for one page-worth from
  # NextToken=us-west-2_EXAMPLE1 answers the *second* record, which can
  # only happen if the name was read. Between them these two cases pin
  # both halves; either name renamed to what the runtime falls back on
  # fails one of them.
  - name: "NextToken moves the page on, and the second record is what comes back"
    source: "https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_ListUserPools.html"
    fixture: account
    request:
