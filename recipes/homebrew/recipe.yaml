# Homebrew Recipe for Cauldron
#
# An object called versions holds two strings and a boolean, and one of the
# three is a version.
#
#   "versions": {"stable": "8.21.0", "head": "HEAD", "bottle": true}
#
# stable is a version. head is the literal word HEAD, which is a git ref rather
# than a version and is the same four characters for every formula that has
# one. And bottle is true -- a boolean, inside versions, saying whether a
# prebuilt binary exists. So `Object.values(f.versions)` is
# ["8.21.0", "HEAD", true], and code that renders them as a version list shows
# a user the word true.
#
# **And four of its fields describe a computer that is not involved.**
# installed is [], pinned is false, outdated is false and linked_keg is null,
# on every formula the API serves, because this is a static document on a CDN
# and there is no machine behind it. The same schema is what `brew info --json`
# prints locally, where those four are the whole point. One shape, two
# producers, and half of it is unfillable by the one you are talking to.
#
# Written against the live API rather than a document: Homebrew publishes no
# OpenAPI, the endpoint is public, and every case below was checked against
# formulae.brew.sh on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A missing formula answers HTML. GET /api/formula/not-a-real-formula.json
#      is a 404 whose Content-Type is text/html and whose body is a full HTML
#      document, starting <!DOCTYPE html>. That is the third way this
#      collection has now seen a .json path refuse: PyPI sends a JSON object,
#      RubyGems a bare sentence, Homebrew a web page. A client calling .json()
#      throws against two of the three.
#   2. Ruby symbols leak into the JSON as strings with a leading colon.
#      keg_only_reason.reason is ":provided_by_macos" and every bottle file's
#      cellar is ":any". The colon is part of the value, so comparing against
#      "any" or "provided_by_macos" fails, and the reason is that the
#      serialiser was handed a Symbol and called to_s on it.
#   3. Install counts are keyed by command line. analytics.install["30d"] is
#      {"curl": 45041, "curl --HEAD": 20} -- the keys are the invocations
#      people typed, so the number of installs is a sum over shell commands
#      rather than a field.
#   4. The bottle files are keyed by macOS release names, and two of them are
#      Linux. arm64_sequoia, arm64_sonoma, arm64_tahoe and sonoma sit beside
#      arm64_linux and x86_64_linux in one object, so the namespace is
#      "platform" and the names are mostly cats.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The HTML 404 is served as a document with the right content type, and it
#     is a trimmed one: the real page carries a stylesheet, a content-security
#     policy and a redirect. What matters for a client is that it is HTML and
#     not JSON, and that is what the case asserts.
#   - Casks, taps, analytics endpoints, the formula list and the search API are
#     absent.
#   - variations, requirements, patches, service and the deprecation and
#     disable field families are carried as they arrive rather than modelled.
#
# The fixture below is public data about a public formula, recorded on the date
# in the cases.

recipe: homebrew
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://formulae.brew.sh/docs/api/

auth:
  # Public: a static document on a CDN.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: text

resources:
  formula:
    id:
      style: opaque
      field: name
    fields:
      full_name:
        type: string
      tap:
        type: string
      desc:
        type: string
      homepage:
        type: string
      license:
        type: string
      # Two strings and a boolean.
      versions:
        type: map
      urls:
        type: map
      bottle:
        type: map
      revision:
        type: integer
      version_scheme:
        type: integer
      # Former names that still resolve.
      oldnames:
        type: list
      aliases:
        type: list
      dependencies:
        type: list
      uses_from_macos:
        type: list
      conflicts_with:
        type: list
      keg_only:
        type: boolean
      keg_only_reason:
        type: map
      deprecated:
        type: boolean
      deprecation_reason:
        type: string
      disabled:
        type: boolean
      caveats:
        type: string
      analytics:
        type: map
      autobump:
        type: boolean
      # The four about a machine that is not there.
      installed:
        type: list
      linked_keg:
        type: string
      pinned:
        type: boolean
      outdated:
        type: boolean
      ruby_source_path:
        type: string
      tap_git_head:
        type: string

routes:
  - method: GET
    path: /api/formula/{id}.json
    resource: formula
    operation: get

errors:
  resource_missing:
    status: 404
    headers:
      Content-Type: text/html; charset=utf-8
    message: |
      <!DOCTYPE html>
      <html>
        <head>
          <meta http-equiv="Content-type" content="text/html; charset=utf-8">
          <title>404 Not Found</title>
        </head>
        <body>
          <h1>404 Not Found</h1>
        </body>
      </html>

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  tap:
    formula:
      - id: curl
        full_name: curl
        tap: homebrew/core
        desc: Get a file from an HTTP, HTTPS or FTP server
        homepage: https://curl.se
        license: curl
        versions:
          # A version.
          stable: 8.21.0
          # A git ref, spelled the same way on every formula that has one.
          head: HEAD
          # A boolean, in an object called versions.
          bottle: true
        urls:
          stable:
            url: https://curl.se/download/curl-8.21.0.tar.bz2
            tag: null
            revision: null
            checksum: ad6f2f94934b38e31e48272833c99b891d045b4565fe942a53fbd27bd3910e16
          head:
            url: https://github.com/curl/curl.git
            branch: master
        bottle:
          stable:
            rebuild: 0
            root_url: https://ghcr.io/v2/homebrew/core
            files:
              # macOS release names, and two that are not macOS at all.
              arm64_tahoe:
                cellar: ":any"
                url: https://ghcr.io/v2/homebrew/core/curl/blobs/sha256:33f3d4388cc2c8c8a2703b54dfd3f9988af1bb5d3c4e9ba9b4167891108d2333
                sha256: 33f3d4388cc2c8c8a2703b54dfd3f9988af1bb5d3c4e9ba9b4167891108d2333
              sonoma:
                cellar: ":any"
                url: https://ghcr.io/v2/homebrew/core/curl/blobs/sha256:11111111111111111111111111111111111111111111111111111111111111aa
                sha256: 11111111111111111111111111111111111111111111111111111111111111aa
              arm64_linux:
                cellar: ":any"
                url: https://ghcr.io/v2/homebrew/core/curl/blobs/sha256:22222222222222222222222222222222222222222222222222222222222222bb
                sha256: 22222222222222222222222222222222222222222222222222222222222222bb
              x86_64_linux:
                cellar: ":any"
                url: https://ghcr.io/v2/homebrew/core/curl/blobs/sha256:33333333333333333333333333333333333333333333333333333333333333cc
                sha256: 33333333333333333333333333333333333333333333333333333333333333cc
        revision: 0
        version_scheme: 0
        oldnames:
          - curl-openssl
          - wcurl
        aliases: []
        dependencies:
          - brotli
          - libnghttp2
          - openssl@3
          - zstd
        uses_from_macos:
          - krb5
          - openldap
        conflicts_with: []
        keg_only: true
        keg_only_reason:
          # A Ruby symbol, serialised with its colon.
          reason: ":provided_by_macos"
          explanation: ""
        deprecated: false
        deprecation_reason: null
        disabled: false
        caveats: null
        analytics:
          install:
            # Keyed by the command somebody typed, not by the formula.
            30d:
              curl: 45041
              curl --HEAD: 20
            90d:
              curl: 157648
              curl --HEAD: 158
            365d:
              curl: 788177
              curl --HEAD: 937
        autobump: true
        # The four that describe a machine that is not involved.
        installed: []
        linked_keg: null
        pinned: false
        outdated: false
        ruby_source_path: Formula/c/curl.rb
        tap_git_head: ef8d1007e2a23a6748baddb42f730d7a2135d5a5

conformance:
  - name: an object called versions holds two strings and a boolean
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # One of these is a version. head is a git ref spelled the same way on
        # every formula that has one, and bottle is a boolean saying whether a
        # prebuilt binary exists.
        "versions.stable": 8.21.0
        "versions.head": HEAD
        "versions.bottle": true

  - name: four fields describe a computer that is not involved
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # A static document on a CDN, with no machine behind it. The same
        # schema is what brew info --json prints locally, where these four are
        # the whole point.
        installed: []
        linked_keg: null
        pinned: false
        outdated: false

  - name: a missing formula answers a web page
    source: https://formulae.brew.sh/api/formula/not-a-real-formula-cauldron.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/not-a-real-formula-cauldron.json
    expect:
      # The third way this collection has seen a .json path refuse: PyPI sends
      # a JSON object, RubyGems a bare sentence, Homebrew a full HTML
      # document. A client calling .json() throws against two of the three.
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: "^<!DOCTYPE html>"

  - name: Ruby symbols arrive as strings with their colon
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # The serialiser was handed a Symbol and called to_s on it, so the
        # colon is part of the value and comparing against "provided_by_macos"
        # or "any" fails.
        "keg_only_reason.reason": ":provided_by_macos"
        "keg_only_reason.explanation": ""
        "bottle.stable.files.arm64_tahoe.cellar": ":any"

  - name: install counts are keyed by command line
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # The keys are the invocations people typed, so the number of installs
        # is a sum over shell commands rather than a field.
        "analytics.install.30d.curl": 45041
        "analytics.install.365d.curl": 788177

  - name: the bottle files are keyed by platform and two are Linux
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # arm64_tahoe and sonoma are macOS releases; arm64_linux and
        # x86_64_linux are in the same object, so the namespace is platform
        # and the names are mostly cats.
        "bottle.stable.files.sonoma.sha256": 11111111111111111111111111111111111111111111111111111111111111aa
        "bottle.stable.files.arm64_linux.sha256": 22222222222222222222222222222222222222222222222222222222222222bb
        "bottle.stable.root_url": https://ghcr.io/v2/homebrew/core

  - name: a formula answers to names it no longer has
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # oldnames are former names that still resolve, beside aliases which
        # are current alternatives. curl has two of the first and none of the
        # second, and nothing in either says which is which without reading
        # the key.
        name: curl
        "oldnames[0]": curl-openssl
        "oldnames[1]": wcurl
        aliases: []

  - name: keg_only is a boolean with an object of prose beside it
    source: https://formulae.brew.sh/api/formula/curl.json
    verified: "2026-08-25"
    fixture: tap
    request:
      method: GET
      path: /api/formula/curl.json
    expect:
      status: 200
      body:
        # true, with an explanation that is the empty string -- so the field
        # that would tell a user why is present, typed correctly, and says
        # nothing.
        keg_only: true
        "keg_only_reason.explanation": ""
        deprecated: false
        disabled: false

  # The names. This Recipe declares 16 field(s) on a formula that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 10 name(s) that came back at the paths they came
  # back under.
  - name: "a formula carries the field names this Recipe declares"
    source: "https://formulae.brew.sh/api/formula/curl.json"
    fixture: tap
    request:
      method: GET
      path: "/api/formula/curl.json"
    expect:
      status: 200
      body:
        "autobump": true
        "dependencies[0]": "brotli"
        "desc": "Get a file from an HTTP, HTTPS or FTP server"
        "homepage": "https://curl.se"
        "revision": 0
        "ruby_source_path": "Formula/c/curl.rb"
        "tap": "homebrew/core"
        "tap_git_head": "ef8d1007e2a23a6748baddb42f730d7a2135d5a5"
        "uses_from_macos[0]": "krb5"
        "version_scheme": 0

  # The names. This Recipe declares 6 field(s) on a formula that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a formula carries the field names this Recipe declares, and 1 more of them"
    source: "https://formulae.brew.sh/api/formula/curl.json"
    fixture: tap
    request:
      method: GET
      path: "/api/formula/curl.json"
    expect:
      status: 200
      body:
        "urls.head.branch": "master"

  # The names. This Recipe declares 5 field(s) on a formula that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a formula carries the field names this Recipe declares, and 2 more of them"
    source: "https://formulae.brew.sh/api/formula/curl.json"
    fixture: tap
    request:
      method: GET
      path: "/api/formula/curl.json"
    expect:
      status: 200
      body:
        "caveats": null
        "deprecation_reason": null



