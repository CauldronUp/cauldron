# Umami Recipe for Cauldron
#
# Umami Cloud, struck live against api.umami.is on 2026-09-11 with no
# credential, with a deliberately invalid one, with the self-hosted scheme's
# header, and on a path that does not exist. Record shapes are read from
# Umami's own source, which is open, rather than from its reference site --
# see the sources at the end.
#
# **A missing credential is a 400, not a 401.** Struck live:
#
#   (no header)                      400 {"error":{"message":"No API key specified.",
#                                          "code":"bad-request","status":400}}
#
#   x-umami-api-key: notreal         401 {"error":{"message":"Invalid API key.",
#                                          "code":"unauthorized","status":401}}
#
# The absence of authentication is modelled as a malformed request, and 401 is
# reserved for a credential that was present and wrong. There is an argument
# for it -- nothing was attempted, so there is nothing to be unauthorized about
# -- and it breaks the check every client writes. `if (res.status === 401)` is
# false for the commonest failure there is, so a token-refresh path keyed on
# 401 never fires, and a 400 handler that assumes a malformed body goes looking
# at the request it sent.
#
# What it buys is a real distinction: two failures, two statuses, two codes.
# Most providers in this collection cannot tell the two apart at all.
#
# **A header in the wrong scheme is an invalid key rather than a missing one.**
# `Authorization: Bearer notreal` answers "Invalid API key.", not "No API key
# specified." -- because self-hosted Umami authenticates with
# `Authorization: Bearer <token>` and Umami Cloud with `x-umami-api-key`, and
# one codebase serves both. So Cloud reads the self-hosted scheme's header,
# finds a credential in it, and rejects it as a key.
#
# That is the fourth provider in this collection on that axis and the first to
# read it this way round. [plausible](../plausible), [wise](../wise) and
# [todoist](../todoist) all answer "missing" to a header that is plainly
# present; Umami answers "invalid" to one that plainly is not its own. The same
# request, four providers, two opposite verdicts -- and no way for a client to
# know which it will get.
#
# **`code` is the status as a slug.** `bad-request` beside `status: 400`,
# `unauthorized` beside `status: 401` -- three representations of one fact, in
# the body twice and the status line once. Here they always agree, which is
# worth saying after [todoist](../todoist), whose `error_code` is 477 and
# matches nothing.
#
# **And the failure is nested.** `error.message`, where most of this collection
# puts the sentence at the top level. A client reading `body.message` or
# `body.error` as a string gets an object.
#
# **The listing says when its own count is a lie.** Umami's paged result
# carries `isCapped` beside `count` -- the response telling a client that the
# total it just reported was truncated rather than counted. Almost nothing else
# here admits that; [sourcegraph](../sourcegraph) faces the same cost and
# reports a flat `totalCount: 0`, and [matrix](../matrix) puts the word
# "estimate" in the field name.
#
# **A website may have no domain.** The schema types `domain` nullable, on a
# product whose entire purpose is measuring traffic to a domain.
#
# **And it may belong to nobody.** `userId`, `teamId` and `createdBy` are three
# separate nullable references -- an owner, a team and whoever made it -- so a
# record can carry all three, one, or none.
#
# **Deletes are soft.** `deletedAt` is a column, so a website that has been
# removed is still a row, and any endpoint that forgets to filter returns it.

recipe: umami
capability: analytics
version: 0.1.0

upstream:
  api: v1
  docs: https://umami.is/docs/api
  # No spec: Umami publishes a rendered reference site. The record and envelope
  # shapes here are read from the product's own source instead, which is a
  # better source than a docs page and is only available because Umami is open:
  #   prisma/schema.prisma  -- the Website model
  #   src/lib/types.ts      -- PageResult and PageParams

auth:
  # Umami Cloud's scheme. Self-hosted Umami uses Authorization: Bearer with a
  # login token instead, and this host reads that header too -- see the note
  # above.
  scheme: header
  header: x-umami-api-key
  keys:
    - cauldr0num4m1f1xturek3y
  # Two failures, two statuses, and the missing one is not a 401.
  absent_error: no_api_key
  rejected_error: invalid_api_key
  also:
    # The self-hosted scheme, read by the Cloud host and rejected as a key.
    - scheme: bearer
      header: Authorization
      prefix: "Bearer "

responses:
  list:
    style: wrapped
    key: data
    count_field: count
    page_field: page
    limit_field: pageSize
  error:
    # Nested, where most of this collection is flat.
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: string
    status_field: status

resources:
  website:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      # Nullable in the schema, on a product for measuring traffic to a
      # domain.
      domain:
      # Three separate nullable references: an owner, a team, and whoever
      # made it.
      userId:
      teamId:
      createdBy:
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # Soft deletes, so a removed website is still a row.
      deletedAt:
      resetAt:
      recorderEnabled:
        type: boolean

routes:
  - method: GET
    path: /v1/websites
    resource: website
    operation: list
    pagination:
      style: page
      limit: 10
      limit_param: pageSize
      cursor_param: page
    fields:
      # The response telling a client that the count it just reported was
      # truncated rather than counted.
      isCapped: false

errors:
  no_api_key:
    # Not a 401. The absence of authentication as a malformed request.
    status: 400
    code: bad-request
    message: "No API key specified."

  invalid_api_key:
    status: 401
    code: unauthorized
    message: "Invalid API key."

fixtures:
  empty:
    website: []

  account:
    website:
      - id: 7c41e8b2-5d90-4a63-9f18-2e6b47c05a13
        name: Cauldron
        domain: cauldron.example.invalid
        userId: 4d3dae3b-2a44-4aaa-baac-6bb55234a435
        createdBy: 4d3dae3b-2a44-4aaa-baac-6bb55234a435
        createdAt: "2026-04-11T08:30:00.000Z"
        updatedAt: "2026-08-22T13:45:10.000Z"
        # The day somebody wiped this site's statistics. Nullable, and on a
        # record that otherwise looks untouched.
        resetAt: "2026-07-01T00:00:00.000Z"
        recorderEnabled: false
      - id: b9d2f605-1c74-4e88-a30f-5f81ac9d2764
        name: Staging
        # No domain, which the schema permits on a product for measuring
        # traffic to one.
        domain: null
        # And no owner, no team and no creator: all three references are
        # nullable, so a website can belong to nobody.
        teamId: null
        createdAt: "2026-09-02T09:41:00.000Z"
        updatedAt: "2026-09-02T09:41:00.000Z"
        # Removed, and still a row.
        deletedAt: "2026-09-05T11:00:00.000Z"
        recorderEnabled: true

conformance:
  - name: a missing credential is a bad request rather than unauthorized
    source: https://api.umami.is/v1/websites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers: {}
    expect:
      # So `res.status === 401` is false for the commonest failure there is,
      # and a refresh path keyed on 401 never fires.
      status: 400
      body:
        'error.message': "No API key specified."
        'error.code': bad-request
        'error.status': 400

  - name: a wrong credential is the status the other one was not
    source: https://api.umami.is/v1/websites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: notreal
    expect:
      status: 401
      body:
        # Two failures, two statuses, two codes -- which most providers here
        # cannot manage at all.
        'error.message': "Invalid API key."
        'error.code': unauthorized
        'error.status': 401

  - name: the self-hosted scheme is read and rejected as a key
    source: https://api.umami.is/v1/websites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        # What self-hosted Umami authenticates with. One codebase serves both,
        # so Cloud finds a credential here and calls it an invalid key rather
        # than a missing one.
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        'error.message': "Invalid API key."

  - name: an unknown path answers the credential failure first
    source: https://api.umami.is/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        x-umami-api-key: notreal
    expect:
      # So nothing about this API's surface is discoverable without a key that
      # works.
      status: 401
      body:
        'error.code': unauthorized

  - name: the failure is nested under error
    source: https://api.umami.is/v1/websites
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers: {}
    expect:
      status: 400
      # A client reading body.message or body.error as a string gets an
      # object.
      body_matches: '"error"\s*:\s*\{'

  - name: websites are wrapped in a paged result
    source: https://github.com/umami-software/umami/blob/master/src/lib/types.ts
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        'data[0].name': Cauldron
        'data[0].id': 7c41e8b2-5d90-4a63-9f18-2e6b47c05a13
        count: 2

  - name: the listing says whether its own count was truncated
    source: https://github.com/umami-software/umami/blob/master/src/lib/types.ts
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        # The response telling a client the total it just reported may be a
        # cap rather than a count.
        isCapped: false
        page: 1
        pageSize: 10

  - name: a website may have no domain
    source: https://github.com/umami-software/umami/blob/master/prisma/schema.prisma
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        # Nullable in the schema, on a product whose purpose is measuring
        # traffic to a domain.
        'data[1].domain': null
        'data[0].domain': cauldron.example.invalid

  - name: a website may belong to nobody
    source: https://github.com/umami-software/umami/blob/master/prisma/schema.prisma
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        # userId, teamId and createdBy are three separate nullable references,
        # so a record can carry all three, one, or none.
        'data[1].teamId': null
        'data[0].userId': 4d3dae3b-2a44-4aaa-baac-6bb55234a435
        'data[0].createdBy': 4d3dae3b-2a44-4aaa-baac-6bb55234a435
      absent:
        - 'data[1].userId'

  - name: a deleted website is still a row
    source: https://github.com/umami-software/umami/blob/master/prisma/schema.prisma
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        # deletedAt is a column rather than a removal, so any endpoint that
        # forgets to filter returns it.
        'data[1].deletedAt': "2026-09-05T11:00:00.000Z"
        'data[1].recorderEnabled': true
        'data[1].updatedAt': "2026-09-02T09:41:00.000Z"
        # A separate nullable timestamp for wiping a site's statistics, which
        # is not the same event as deleting the site.
        'data[0].resetAt': "2026-07-01T00:00:00.000Z"
        'data[0].createdAt': "2026-04-11T08:30:00.000Z"
      absent:
        - 'data[0].deletedAt'

  - name: websites page on page and pageSize
    source: https://github.com/umami-software/umami/blob/master/src/lib/types.ts
    fixture: account
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
      query:
        page: "2"
        pageSize: "1"
    expect:
      status: 200
      body:
        'data[0].name': Staging
        page: 2
        pageSize: 1

  - name: an account with no websites answers an empty array
    source: https://github.com/umami-software/umami/blob/master/src/lib/types.ts
    fixture: empty
    request:
      method: GET
      path: /v1/websites
      headers:
        x-umami-api-key: cauldr0num4m1f1xturek3y
    expect:
      status: 200
      body:
        data: []
        count: 0
