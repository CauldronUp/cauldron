# Sardine Recipe for Cauldron
#
# Sardine's own field-level API reference is not public. docs.sardine.ai's
# home page, its getting-started guides and its knowledge base are open;
# every one of the /guides/api-reference/* pages -- the ones that would show
# the actual request and response schema for a risk decision -- 302s to a
# login wall, and the getting-started page says plainly what is behind it:
# "Reach out to your Sardine representative... to schedule a demo and get
# access to our sandbox, Integration Guides and API docs." No account was
# created and no demo was requested, so this Recipe cannot answer the
# question this whole group of three exists to ask -- score type and range,
# verdict enum, whether policy or reason codes ride along, whether a
# decision is addressable by id afterwards -- for the one provider in the
# group whose own documentation withholds it. That is itself the finding:
# not every "risk decision" API can be read from outside, and this Recipe
# says so rather than filling the gap with something plausible. See
# docs/backlog.md's standing rule and this project's own Step 3: a schema
# with no worked example gets an empty fixture or gets left out, never a
# guess.
#
# What is public is the wire's own auth and routing behaviour, struck live
# against api.sardine.ai with no account and a client id that was never
# registered to anyone. That turned out to be worth a Recipe on its own,
# because this host draws the auth/routing line three different ways
# depending on nothing but the method and the path, which is one more
# ordering than any single provider in this collection's own auth.go
# comment enumerates for a two-state boolean:
#
#   1. POST, PUT, PATCH, DELETE and OPTIONS to /v1/customers all reach the
#      same application-level credential check and answer JSON. No
#      Authorization header, and a header that is not Basic-shaped at all
#      ("Authorization: Bearer junk-not-real"), both answer 401
#      {"reason": "Credential are incorrect", "status": "Not Authorized"} --
#      Sardine's own grammar, not a typo introduced here. A syntactically
#      fine Basic pair whose client id is not recognised answers a different
#      401: {"reason": "error authenticating junkclient", "status":
#      "Not Authorized"} -- and the client id inside that sentence is
#      whichever one was actually sent, echoed back into the error. That
#      is the sharpest finding in this Recipe and also the one this format
#      cannot fully reproduce: the message is templated from the request,
#      and Cauldron's errors table holds fixed strings, so the case below
#      pins the literal probed value ("junkclient") rather than the general
#      shape. Every one of DELETE, PATCH and OPTIONS was struck too and
#      answered identically to POST; DELETE is the one built into a case,
#      to show it is the credential and not the verb.
#   2. GET to that same real path never reaches the credential check at
#      all. It answers 403 Forbidden, Content-Type text/html, a small
#      generic error page ("<!doctype html>...403 Forbidden") that this
#      collection's own Recipes recognise as the Google Cloud front end's
#      own default block page, whether or not a credential was sent -- no
#      Authorization header and a full Basic pair both answered the
#      byte-identical page. This is a WAF/edge rule scoped to the method,
#      not a 405: there is no Allow header, and the two other methods this
#      Recipe struck that GET could have been confused with (PUT, POST)
#      both reach the ordinary credential check instead.
#   3. A path this host has no route for at all -- /v1/nosuchroute, or
#      /v1/devices, or /v1/customers/ with a trailing slash Sardine's own
#      router does not also accept -- 404s before the credential is ever
#      examined, and the body says which layer answered. Most unrouted
#      paths never reach Sardine's own application at all: they answer
#      "default backend - 404", the literal words a Kubernetes ingress
#      sends when nothing behind it claims the path, in text/plain. The one
#      exception this Recipe found was the trailing slash on a path that
#      does exist without it: POST /v1/customers/ reaches Sardine's own Go
#      router, which answers its own "404 page not found" instead -- a
#      second, different 404 body, from a request one character away from a
#      real route, on the same host. Both are struck below.
#
# auth.after_routing is a single boolean and none of the five arrangements
# recipe/auth.go already documents is this one: GET's edge block, the
# routing-miss's ingress block, and the ordinary method's credential check
# are three separate layers with three separate shapes, not two. This
# Recipe follows recipes/census/recipe.yaml's own precedent for exactly
# this situation -- auth.scheme: none at the Recipe level, so Cauldron's own
# binary gate never runs, with every route below declaring its own
# matches_header and a header-less fallback to stand in for what the real
# host does per method and per path.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No success case exists anywhere in this Recipe, and none is faked.
#     Every route below answers a failure, because a failure is everything
#     this Recipe could establish without an account. A client id this
#     Recipe invented cannot become a real one no matter what shape it is
#     given, so there is no fixture credential here that would ever reach a
#     200 -- unlike every other Recipe in this collection, which mints a
#     fixture key its own emulator is configured to accept.
#   - The full 401 message ("error authenticating junkclient") is pinned to
#     the literal client id this Recipe's live probe sent. The real message
#     echoes whatever client id a caller actually presents; this format has
#     no mechanism to template a request value into a declared error, so
#     the case below claims exactly the one request it struck rather than
#     the general shape.
#   - POST /v1/sessions/ was struck once, live, and answered the identical
#     401 shape /v1/customers does once its own trailing slash is followed
#     -- so a second real route exists on this host. It is not built into
#     its own route below: everything this Recipe can say about it
#     ("reaches the same credential check") is already said about
#     /v1/customers, and a second copy would add a path rather than a
#     finding.
#   - PATCH and OPTIONS were struck live against /v1/customers and answered
#     identically to POST and DELETE. Neither is declared as its own route:
#     DELETE already demonstrates the finding ("it is the credential, not
#     the verb"), and this format has no way to declare "every method"
#     short of naming each one.
#
# The client id and secret below are fixtures invented for this Recipe and
# were never registered with Sardine. No account was ever created and no
# sandbox was ever requested to write it.

recipe: sardine
capability: identity
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.sardine.ai/guides/api-reference/overview

auth:
  # See the header: three layers, not two, is more than auth.after_routing's
  # single boolean can express. Every route below stands in for the
  # Recipe-wide gate this setting would otherwise run.
  scheme: none

responses:
  error:
    style: flat
    message_field: reason
    code_field: "-"
    type_field: "-"
    # "status" here is Sardine's own text label, not the HTTP status number
    # -- both structured 401s below carry it, so it is declared once here
    # rather than on each entry.
    fields:
      status: "Not Authorized"

routes:
  # A syntactically fine Basic pair, exactly as struck live -- see the
  # header for why the message it reaches is pinned rather than general.
  # Declared ahead of the fallback below because a route naming a header
  # value beats an equally-scoring route that names none.
  - method: POST
    path: /v1/customers
    matches_header:
      Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
    error: credential_rejected

  # No header at all, or a header that is not Basic-shaped -- everything
  # else this method can be sent with.
  - method: POST
    path: /v1/customers
    error: credential_missing

  # The same two routes, on DELETE, to show it is the credential being
  # checked and not the verb -- PATCH and OPTIONS were struck too and
  # answered identically; see the header's fidelity gaps for why they are
  # not both declared as well.
  - method: DELETE
    path: /v1/customers
    matches_header:
      Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
    error: credential_rejected

  - method: DELETE
    path: /v1/customers
    error: credential_missing

  # GET never reaches the credential check at all -- see finding 2. One
  # route, no matches_header, because the live host answered identically
  # with and without a credential.
  - method: GET
    path: /v1/customers
    error: method_blocked_at_edge

  # One character away from a real route. Sardine's own Go router answers
  # this rather than the shared Kubernetes ingress default -- see finding 3.
  - method: POST
    path: /v1/customers/
    error: app_route_not_found

errors:
  # No header, or a header that is not even Basic-shaped. See finding 1.
  credential_missing:
    status: 401
    message: "Credential are incorrect"

  # A well-formed pair whose client id is not recognised. The client id
  # inside this sentence is the live-probed value, not a general template
  # -- see the header's fidelity gap.
  credential_rejected:
    status: 401
    message: "error authenticating junkclient"

  # The Google Cloud front end's own default block page. text/html, no
  # Allow header, credential-blind.
  method_blocked_at_edge:
    status: 403
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: '<!doctype html><meta charset="utf-8"><meta name=viewport content="width=device-width, initial-scale=1"><title>403</title>403 Forbidden'

  # What a path this host has never heard of answers -- the Kubernetes
  # ingress's own default backend, not Sardine's application at all.
  # Overrides Cauldron's own generic unknown_route message so every
  # genuinely unrouted path in this Recipe answers what the live host does.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"
    message: "default backend - 404"

  # The other 404: a path one character off from a real route, which
  # Sardine's own application answers rather than the ingress in front of
  # it. Named apart from unknown_route on purpose, the same way
  # recipes/census/recipe.yaml keeps route_not_found apart from its
  # Recipe's other 404 -- two shapes on one host, and a shared name would
  # erase which is which.
  app_route_not_found:
    status: 404
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"
    message: "404 page not found"

fixtures:
  empty: {}

# Every case below carries a verified date. There is nothing in this Recipe
# read from documentation: Sardine's own schema reference is not reachable
# without an account (see the header), so nothing here is a decision's
# shape -- only what the wire answers before any decision is ever reached.
conformance:
  - name: no credential at all
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/customers
      json: {}
    expect:
      status: 401
      body:
        reason: "Credential are incorrect"
        status: "Not Authorized"

  - name: a header that is not even Basic-shaped answers the identical sentence
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/customers
      headers:
        Authorization: "Bearer junk-not-real"
      json: {}
    expect:
      status: 401
      body:
        reason: "Credential are incorrect"
        status: "Not Authorized"

  - name: a well-formed pair with an unrecognised client id answers a different sentence
    # Live, and the sharpest finding here: the message echoes the client id
    # this Recipe actually sent. See the header's fidelity gap on why this
    # case claims exactly that value rather than the general shape.
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/customers
      headers:
        Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
      json: {}
    expect:
      status: 401
      body:
        reason: "error authenticating junkclient"
        status: "Not Authorized"

  - name: a second method confirms it is the credential, not the verb
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v1/customers
    expect:
      status: 401
      body:
        reason: "Credential are incorrect"
        status: "Not Authorized"

  - name: and the recognised-shape pair still tells the same two verdicts apart on that verb
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v1/customers
      headers:
        Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
    expect:
      status: 401
      body:
        reason: "error authenticating junkclient"
        status: "Not Authorized"

  - name: GET never reaches the credential check at all
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/customers
    expect:
      status: 403
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "403 Forbidden"

  - name: and a credential does not change that either
    # Live: the byte-identical page, with a well-formed Basic pair attached.
    # The block is on the method, not on who is asking.
    source: https://api.sardine.ai/v1/customers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/customers
      headers:
        Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
    expect:
      status: 403
      body_matches: "403 Forbidden"

  - name: a path this host has never heard of answers before any credential is examined
    source: https://api.sardine.ai/v1/nosuchroute
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
    expect:
      status: 404
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "default backend - 404"

  - name: and a well-formed credential does not reach that path either
    source: https://api.sardine.ai/v1/nosuchroute
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/nosuchroute
      headers:
        Authorization: "Basic anVua2NsaWVudDpqdW5rc2VjcmV0"
      json: {}
    expect:
      status: 404
      body_matches: "default backend - 404"

  - name: one character away from a real route answers a second, different 404
    # Sardine's own Go router, not the shared ingress default -- see
    # finding 3 and the errors table's own note on why this is a separate
    # entry from unknown_route rather than the same one.
    source: https://api.sardine.ai/v1/customers/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/customers/
      json: {}
    expect:
      status: 404
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "404 page not found"
