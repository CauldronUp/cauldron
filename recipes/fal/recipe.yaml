# fal Recipe for Cauldron
#
# The queue status endpoint and the run endpoint beside it, read from fal's own
# published JavaScript client (fal-ai/fal-js), and struck live against
# fal.run, queue.fal.run and rest.alpha.fal.ai on 2026-09-13 with no
# credential, with a wrong one, on applications with two, three and four path
# segments, and on one that does not exist.
#
# **The refusal names an application you did not ask for.** Struck live:
#
#   POST /fal-ai/flux/dev                 401  Cannot access application "fal-ai/flux"
#   POST /fal-ai/flux                     401  Cannot access application "fal-ai/flux"
#   POST /fal-ai/flux/dev/image-to-image  401  Cannot access application "fal-ai/flux"
#
# Three different addresses, one name quoted back. The message keeps the first
# two path segments and drops the rest, so a caller debugging a 401 on
# `fal-ai/flux/dev` is told about `fal-ai/flux`, which is a different
# application.
#
# **And "authentication is required" is what a wrong key is told too.** The
# sentence does not change when a credential is present and refused.
#
# **A GET on a POST-only endpoint is a 401.** The credential is checked before
# the method, so the failure a browser produces is about a token.
#
# **Three hosts, three failure shapes.**
#
#   fal.run            {"detail":"Cannot access application \"fal-ai/flux\"..."}
#   queue.fal.run      {"status":"NOT_FOUND"}
#   rest.alpha.fal.ai  {"detail":"Authorization header is required"}
#
# The queue answers with `status` and an uppercase enum where the run host
# answers with `detail` and a sentence -- and the third host has `alpha` in its
# name and serves production token management.
#
# **A doc comment describes a different field from the one it is on.** In the
# published client, `UrlOptions.subdomain` is typed `string` and documented "If
# `true`, the function will use the queue to run the function asynchronously and
# return the result in a separate call."
#
# **The queue status is three shapes with no discriminator a type can use.**
# `queue_position` appears only when `IN_QUEUE`, `logs` only when it is not, and
# `metrics` only when `COMPLETED` and optionally even then. The client's own
# guard is `obj && obj.status && obj.response_url` -- a truthiness check, so a
# status of the empty string would fail it.
#
# **A log line's `source` is a type of one.** `source: "USER"`, and nothing
# else. Its `level` is `"STDERR" | "STDOUT" | "ERROR" | "INFO" | "WARN" |
# "DEBUG"` -- two stream names in a severity enum.
#
# **And the timestamp carries a note to the maintainer.** The shipped type says:
# `timestamp: string; // Using string to represent date-time format, but you
# could also use 'Date' type if you're going to construct Date objects.`
#
# Also pinned: `Metrics` has one member and it is nullable --
# `inference_time: number | null`; and the client's own `Result<T>` is
# `{data, requestId}`, camelCase, where every field on the wire is snake_case.

recipe: fal
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.fal.ai/model-apis/queue
  # No spec: fal documents this API as prose and publishes a JavaScript client.
  # No OpenAPI description is served at any address this Recipe could find, so
  # the record shape below is that client's own types.

auth:
  scheme: header
  header: Authorization
  prefix: "Key "
  keys:
    - cauldr0nf1xture:k3y0000000000000000000000000000
  # The same sentence whether a credential is absent or wrong.
  absent_error: cannot_access_application
  rejected_error: cannot_access_application
  malformed_error: cannot_access_application
  after_routing: true

responses:
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  request:
    id:
      field: request_id
      style: uuid
    fields:
      # IN_QUEUE, IN_PROGRESS or COMPLETED -- and which of the three decides
      # which other fields are there.
      status:
        type: string
      response_url:
        type: string
      status_url:
        type: string
      cancel_url:
        type: string
      # Only when IN_QUEUE.
      queue_position:
      # Only when it is not.
      logs:
      # Only when COMPLETED, and optional even then.
      metrics:

routes:
  - method: GET
    path: /fal-ai/flux/requests/{id}/status
    resource: request
    operation: get
    public: true
    not_found: queue_not_found

  - method: POST
    # The run endpoint. A real key answers with a model's output, which is not
    # a shape this Recipe can state, so the route is here for its failure.
    path: /fal-ai/flux/dev
    error: cannot_access_application

errors:
  cannot_access_application:
    status: 401
    # Two path segments, whatever was asked for.
    message: 'Cannot access application "fal-ai/flux". Authentication is required to access this application.'

  queue_not_found:
    # The queue's own envelope: a key and an uppercase enum, where the run
    # host sends a sentence under detail.
    status: 404
    message_field: "-"
    code_field: status
    code: NOT_FOUND

  unknown_route:
    status: 404
    message: 'Application "cauldron/nope" not found'

fixtures:
  empty:
    request: []

  queued:
    request:
      - request_id: 9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e
        status: COMPLETED
        response_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e
        status_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/status
        cancel_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/cancel
        # Absent from this shape.
        queue_position: null
        logs:
          - message: Loading weights
            # Two stream names in a severity enum.
            level: STDOUT
            # A type of one.
            source: USER
            timestamp: "2026-09-13T21:44:59.114Z"
        metrics:
          # One member, and nullable.
          inference_time: 1.842
      - request_id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
        status: IN_QUEUE
        response_url: https://queue.fal.run/fal-ai/flux/requests/4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
        status_url: https://queue.fal.run/fal-ai/flux/requests/4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80/status
        cancel_url: https://queue.fal.run/fal-ai/flux/requests/4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80/cancel
        # Only on this shape.
        queue_position: 3
        # And absent from it.
        logs: null
        metrics: null

conformance:
  - name: the refusal names an application you did not ask for
    source: https://fal.run/fal-ai/flux/dev
    verified: "2026-09-13"
    fixture: queued
    request:
      method: POST
      path: /fal-ai/flux/dev
      headers:
        Content-Type: application/json
      json: {}
    expect:
      status: 401
      body:
        # Three segments asked for, two quoted back.
        detail: 'Cannot access application "fal-ai/flux". Authentication is required to access this application.'

  - name: and a credential that was sent is told authentication is required
    source: https://fal.run/fal-ai/flux/dev
    verified: "2026-09-13"
    fixture: queued
    request:
      method: POST
      path: /fal-ai/flux/dev
      headers:
        Content-Type: application/json
        Authorization: "Key notarealkey"
      json: {}
    expect:
      status: 401
      body:
        # The sentence does not change when a credential is present.
        detail: 'Cannot access application "fal-ai/flux". Authentication is required to access this application.'

  - name: an application that does not exist is named in full
    source: https://fal.run/cauldron/nope
    verified: "2026-09-13"
    fixture: queued
    request:
      method: POST
      path: /cauldron/nope
      headers:
        Content-Type: application/json
      json: {}
    expect:
      status: 404
      body:
        # Two segments asked for, and two quoted back, which is the only case
        # where the name in the message is the name in the request.
        detail: 'Application "cauldron/nope" not found'

  - name: the queue answers a missing request in another envelope entirely
    source: https://queue.fal.run/fal-ai/flux/requests/00000000-0000-0000-0000-000000000000/status
    verified: "2026-09-13"
    fixture: queued
    request:
      method: GET
      path: /fal-ai/flux/requests/00000000-0000-0000-0000-000000000000/status
      headers: {}
    expect:
      status: 404
      body:
        # A key and an uppercase enum, where the run host sends a sentence
        # under detail.
        status: NOT_FOUND
      absent:
        - detail

  - name: three statuses and three shapes
    source: https://github.com/fal-ai/fal-js
    fixture: queued
    request:
      method: GET
      path: /fal-ai/flux/requests/4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80/status
      headers: {}
    expect:
      status: 200
      body:
        # queue_position only when IN_QUEUE...
        status: IN_QUEUE
        queue_position: 3
        # ...and logs only when it is not.
        logs: null
        metrics: null
        request_id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80

  - name: a log line's source is a type of one
    source: https://github.com/fal-ai/fal-js
    fixture: queued
    request:
      method: GET
      path: /fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/status
      headers: {}
    expect:
      status: 200
      body:
        # source: "USER", and nothing else.
        'logs[0].source': USER
        # Two stream names in a severity enum.
        'logs[0].level': STDOUT
        'logs[0].message': Loading weights
        'logs[0].timestamp': "2026-09-13T21:44:59.114Z"
        status: COMPLETED
        # One member, and nullable.
        'metrics.inference_time': 1.842
        queue_position: null

  - name: the record carries three addresses of itself
    source: https://github.com/fal-ai/fal-js
    fixture: queued
    request:
      method: GET
      path: /fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/status
      headers: {}
    expect:
      status: 200
      body:
        # The client's own guard is `obj.status && obj.response_url`, so this
        # field's presence is what makes the object a queue status at all.
        response_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e
        status_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/status
        cancel_url: https://queue.fal.run/fal-ai/flux/requests/9b1d3c5e-7f9a-4b2c-8d6e-0f1a2b3c4d5e/cancel
