# Lambda Cloud Recipe for Cauldron
#
# The instances listing, read from the OpenAPI document Lambda serves without a
# credential at cloud.lambda.ai/api/v1/openapi.json, and struck live on
# 2026-09-13 with no credential and with a deliberately invalid one.
#
# **The code cannot tell the two credential failures apart and the message
# can.** Struck live:
#
#   (no header)      401 {"error": {"code":"global/invalid-api-key",
#                                   "message":"No API key was provided.", ...}}
#   Bearer notreal   401 {"error": {"code":"global/invalid-api-key",
#                                   "message":"API key was invalid, expired, or deleted.", ...}}
#
# One code, two situations. A client branching on `error.code` -- which is the
# field put there to be branched on -- cannot distinguish a header it forgot to
# send from a key that has been revoked, and has to match on English to do it.
#
# **The code is namespaced with a slash.** `global/invalid-api-key`: a scope and
# a name, joined by a character that is also a path separator, in a string a
# client will put in a switch.
#
# **And the message names three different causes at once.** "API key was
# invalid, expired, **or** deleted" -- three states with three different
# remedies, in one sentence, under one code.
#
# **A secret is a field on the listing.** `jupyter_token` is on the instance
# record, described as "the secret token used to log into the JupyterLab server
# hosted on the instance", beside `jupyter_url`. Listing your instances hands
# you a working login for every one of them.
#
# **The same resource is at two paths.** The document declares
# `/api/v1/file-systems` and `/api/v1/filesystems` -- one hyphenated and one
# not -- while the fields on an instance spell it `file_system_names` and
# `file_system_mounts`. Three spellings of one word across one API.
#
# **And there are two production servers, with two brands.**
# `cloud.lambda.ai` and `cloud.lambdalabs.com`, both declared, both answering.
# A rename that reached the domain and not the old one.
#
# **Twenty-one error types, one of which is about a support ticket.** The
# document defines a separate schema per failure -- `ApiErrorQuotaExceeded`,
# `ApiErrorInsufficientCapacity`, `ApiErrorFileSystemInWrongRegion`,
# `ApiErrorInvalidBillingAddress` -- and among them `ApiErrorTicketCreationFailed`
# and `ApiErrorTicketNotFound`, so raising a support ticket is part of the API
# surface and can fail like anything else.
#
# **`name` may be the empty string.** `minLength: 0, maxLength: 64` on the field
# described as "the user-provided name of the instance", so a named thing may be
# named nothing.

recipe: lambdalabs
capability: infrastructure
version: 0.1.0

upstream:
  api: "1.10.0"
  docs: https://docs.lambda.ai/public-cloud/cloud-api/
  spec: https://cloud.lambda.ai/api/v1/openapi.json
  spec_hash: 76611797070424d508beae17bcc7a5b0ae0757a7669940d4476d1fa7babd80e3
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - secret_cauldr0nf1xture0000000000000000
  # One code for both, and two sentences.
  absent_error: api_key_not_provided
  rejected_error: api_key_invalid
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: string
    type_field: "-"

resources:
  instance:
    id:
      field: id
      style: hex
      length: 32
    fields:
      # minLength 0: a named thing may be named nothing.
      name:
        type: string
      status:
        type: string
      ip:
        type: string
      private_ip:
        type: string
      hostname:
        type: string
      region:
        type: map
      instance_type:
        type: map
      image:
        type: map
      ssh_key_names:
        type: list
      # Spelled without the hyphen the path uses.
      file_system_names:
        type: list
      actions:
        type: map
      tags:
        type: list
      # A working login for the machine, on the record a listing returns.
      jupyter_token:
        type: string
      jupyter_url:
        type: string

routes:
  - method: GET
    path: /api/v1/instances
    resource: instance
    operation: list
    pagination:
      # None declared and none offered: the operation takes no parameters.
      style: none

errors:
  api_key_not_provided:
    status: 401
    # A scope and a name joined by a path separator.
    code: global/invalid-api-key
    message: No API key was provided.
    fields:
      # setPath nests this inside the error object the style builds.
      error.suggestion: Make sure to pass an API key in the AUTHORIZATION header when making requests.

  api_key_invalid:
    status: 401
    # The same code as above, for a different situation.
    code: global/invalid-api-key
    # Three causes with three remedies, in one sentence.
    message: API key was invalid, expired, or deleted.
    fields:
      error.suggestion: Check your API key or create a new one, then try again.

fixtures:
  empty:
    instance: []

  account:
    instance:
      - id: 0920582c7ff041399e34823a0be62549
        name: training-01
        status: active
        ip: 198.51.100.10
        private_ip: 10.0.2.10
        hostname: 198-51-100-10.cloud.lambda.ai
        region:
          name: us-west-1
          description: California, USA
        instance_type:
          name: gpu_1x_a100
          description: 1x A100 (40 GB SXM4)
        image:
          id: 43eb2b17f7b043a4b1e7ca3f2a1c1de5
          family: lambda-stack
        ssh_key_names:
          - macbook
        file_system_names:
          - shared-datasets
        actions:
          restart:
            available: true
          terminate:
            available: true
        tags:
          - key: team
            value: research
        # A secret, on the record a listing returns.
        jupyter_token: n0tarealjupytert0ken000000000000
        jupyter_url: https://jupyter-198-51-100-10.cloud.lambda.ai/?token=n0tarealjupytert0ken000000000000
      - id: 1a2b3c4d5e6f708192a3b4c5d6e7f809
        # minLength 0, and here it is nothing.
        name: ""
        status: booting
        ip: 198.51.100.11
        private_ip: 10.0.2.11
        hostname: 198-51-100-11.cloud.lambda.ai
        region:
          name: us-east-1
          description: Virginia, USA
        instance_type:
          name: gpu_8x_h100_sxm5
          description: 8x H100 (80 GB SXM5)
        image:
          id: 43eb2b17f7b043a4b1e7ca3f2a1c1de5
          family: lambda-stack
        ssh_key_names: []
        file_system_names: []
        actions:
          restart:
            available: false
          terminate:
            available: true
        tags: []
        jupyter_token: n0tarealjupytert0ken111111111111
        jupyter_url: https://jupyter-198-51-100-11.cloud.lambda.ai/?token=n0tarealjupytert0ken111111111111

conformance:
  - name: one code answers two different credential failures
    source: https://cloud.lambda.ai/api/v1/instances
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers: {}
    expect:
      status: 401
      body:
        # A scope and a name, joined by a path separator.
        'error.code': global/invalid-api-key
        'error.message': No API key was provided.
        'error.suggestion': Make sure to pass an API key in the AUTHORIZATION header when making requests.

  - name: a wrong key gets the same code and three causes
    source: https://cloud.lambda.ai/api/v1/instances
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Identical to the case above, so the field a client branches on
        # cannot tell a forgotten header from a revoked key.
        'error.code': global/invalid-api-key
        # Invalid, expired or deleted: three states, three remedies, one
        # sentence.
        'error.message': API key was invalid, expired, or deleted.
        'error.suggestion': Check your API key or create a new one, then try again.

  - name: listing instances hands out a login for each one
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        # "The secret token used to log into the JupyterLab server hosted on
        # the instance", with the URL that uses it beside it.
        'data[0].jupyter_token': n0tarealjupytert0ken000000000000
        'data[0].jupyter_url': https://jupyter-198-51-100-10.cloud.lambda.ai/?token=n0tarealjupytert0ken000000000000
        'data[1].jupyter_token': n0tarealjupytert0ken111111111111

  - name: an instance may be named nothing
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        # minLength 0 on "the user-provided name of the instance".
        'data[0].name': training-01
        'data[1].name': ""
        'data[0].id': 0920582c7ff041399e34823a0be62549
        'data[0].status': active
        'data[1].status': booting

  - name: the filesystem is spelled without the hyphen the path uses
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        # The document declares both /api/v1/file-systems and
        # /api/v1/filesystems, and the record spells it a third way.
        'data[0].file_system_names[0]': shared-datasets
        'data[1].file_system_names': []
        'data[0].ssh_key_names[0]': macbook

  - name: an instance has two addresses and a hostname built from one
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        'data[0].ip': 198.51.100.10
        'data[0].private_ip': 10.0.2.10
        # The public address with its dots turned into hyphens.
        'data[0].hostname': 198-51-100-10.cloud.lambda.ai

  - name: the region and the machine are objects rather than names
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        'data[0].region.name': us-west-1
        'data[0].region.description': California, USA
        'data[0].instance_type.name': gpu_1x_a100
        'data[1].instance_type.name': gpu_8x_h100_sxm5
        'data[0].image.family': lambda-stack

  - name: what an instance will do is a map of availability
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: account
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        # A booting instance cannot be restarted and can be terminated.
        'data[0].actions.restart.available': true
        'data[1].actions.restart.available': false
        'data[1].actions.terminate.available': true
        'data[0].tags[0].key': team
        'data[0].tags[0].value': research
        'data[1].tags': []

  - name: an account with no instances still sends the envelope
    source: https://cloud.lambda.ai/api/v1/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/instances
      headers:
        Authorization: "Bearer secret_cauldr0nf1xture0000000000000000"
    expect:
      status: 200
      body:
        data: []
