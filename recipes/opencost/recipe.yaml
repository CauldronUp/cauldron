# OpenCost Recipe for Cauldron
#
# Written against OpenCost's own OpenAPI 3.0.1 document, published in its own
# repository -- github.com/opencost/opencost, docs/swagger.json, 5 paths,
# version 1.0.0 -- read on 2026-09-06. OpenCost runs inside a Kubernetes
# cluster and there is no public instance, so nothing here is verified live:
# every claim is the provider's own document.
#
# **`data` is an array of maps, and `data[0]` is not a record.**
#
# The response schema is:
#
#   data:
#     type: array
#     items:
#       type: object
#       additionalProperties:
#         $ref: Allocation
#
# So `data` is a list whose elements are objects keyed by allocation name. Each
# element is one time-step -- `step` slices the window -- and each step is a map
# from the thing you aggregated by to its costs.
#
# `data[0]` is a step, not an allocation. `data[0]["kube-system/coredns"]` is the
# allocation. So `data.map(a => a.totalCost)` yields undefined for every element,
# `data.length` counts time-steps rather than workloads, and a client that flattens
# the array into records loses the time dimension it was flattening.
#
# The keys of those maps are whatever `aggregate` asked for -- `namespace`,
# `controller`, `label:app` -- so the shape of the response depends on a query
# parameter, and no field in the body names the aggregation that produced it.
#
# **One parameter, four grammars.**
#
# `window` is documented as accepting: "words like `today`, `lastweek`;
# durations like `30m`, `7d`; RFC3339 date pairs; or Unix timestamps."
#
# Four syntaxes in one string, with no discriminator. `7d` and `today` and
# `2026-09-01T00:00:00Z,2026-09-06T00:00:00Z` and `1757116800,1757203200` are all
# valid values of the same parameter, and a client assembling one from user input
# has to know which grammar it is in to validate it.
#
# **The document's own error text names a parameter it does not declare.**
#
# The 400 on `/allocation` is described as "missing or invalid parameters (e.g.
# `window`, `step`, `accumulateBy`)". The operation declares `window`,
# `aggregate`, `step` and `accumulate`. There is no `accumulateBy`.
#
# So the error description references a parameter that does not exist in the
# operation it describes -- and a reader debugging a 400 goes looking for it.
#
# **A status in the body, beside a code that is not the HTTP status.**
# `AllocationResponse` carries `code` (integer) and `status` (string) alongside
# `data`. Same shape as Casdoor's in this collection: the transport says 200 and
# the body carries its own opinion.
#
# **No authentication of any kind, and here that is the design.** OpenCost runs
# as a service inside a cluster and is reached through the Kubernetes API server
# or a port-forward. The fourth document in this collection declaring no
# `securitySchemes` -- after Argo CD (an omission), Cilium (correct, a unix
# socket) and Exoscale (a signature OpenAPI cannot describe) -- and this one is
# correct for the same reason Cilium's is.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. OpenCost runs inside a
#     cluster.
#   - The allocation query only. Five paths, and the other four -- assets,
#     cloud costs and the two inference-cost endpoints -- each want their own
#     evidence.
#   - **The response is served raw.** An array whose elements are maps has no
#     representation among this format's list styles: `bare` is an array of
#     records, `map` is one object keyed by identifier, and this is a list of
#     those objects. Serving it raw reproduces the shape exactly and is the
#     honest option; the gap is recorded in the backlog.
#   - Because it is raw, the fixture is fixed: seeding different records does
#     not change what this route answers.

recipe: opencost
capability: observability
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://www.opencost.io/docs/integrations/api
  spec: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
  spec_hash: b6ccc5b2ae6c38d92c4a3db9cafdc4872a66da886c17ffdfd40c6871320c5af6
  spec_seen: "2026-09-06"

auth:
  # None. OpenCost runs inside a cluster and is reached through the API server
  # or a port-forward -- the same shape as Cilium's unix socket, and correct
  # for the same reason.
  scheme: none

responses:
  error:
    style: flat
    message_field: message

resources:
  allocation:
    id:
      style: opaque
      field: name
    fields:
      cpuCost:
        type: number
      ramCost:
        type: number
      pvCost:
        type: number
      networkCost:
        type: number
      totalCost:
        type: number
      # How long this allocation ran, in minutes, as a float.
      minutes:
        type: number

routes:
  # Served raw, because an array of maps has no list style here. The body below
  # is the shape the document declares.
  - method: GET
    path: /allocation
    public: true
    raw:
      content_type: application/json
      text: |
        {
          "code": 200,
          "status": "success",
          "data": [
            {
              "kube-system/coredns": {
                "name": "kube-system/coredns",
                "cpuCost": 0.0412,
                "ramCost": 0.0089,
                "pvCost": 0,
                "networkCost": 0.0003,
                "totalCost": 0.0504,
                "minutes": 1440,
                "window": {
                  "start": "2026-09-05T00:00:00Z",
                  "end": "2026-09-06T00:00:00Z"
                },
                "properties": {
                  "cluster": "cluster-one",
                  "namespace": "kube-system",
                  "controller": "coredns"
                }
              },
              "default/api": {
                "name": "default/api",
                "cpuCost": 1.2044,
                "ramCost": 0.6631,
                "pvCost": 0.0500,
                "networkCost": 0.0121,
                "totalCost": 1.9296,
                "minutes": 1440,
                "window": {
                  "start": "2026-09-05T00:00:00Z",
                  "end": "2026-09-06T00:00:00Z"
                },
                "properties": {
                  "cluster": "cluster-one",
                  "namespace": "default",
                  "controller": "api"
                }
              }
            }
          ]
        }

errors:
  invalid_window:
    status: 400
    message: "Bad request: invalid window"
  server_error:
    status: 500
    message: "Internal server error: the allocation query failed"

fixtures:
  empty:
    allocation: []

  cluster:
    allocation:
      - name: kube-system/coredns
        cpuCost: 0.0412
        ramCost: 0.0089
        pvCost: 0
        networkCost: 0.0003
        totalCost: 0.0504
        minutes: 1440

conformance:
  - name: data is an array of maps, so data[0] is not a record
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
    expect:
      status: 200
      body:
        # data[0] is a time-step; data[0]["kube-system/coredns"] is the
        # allocation. So data.map(a => a.totalCost) is undefined for every
        # element and data.length counts steps rather than workloads.
        'data[0].kube-system/coredns.totalCost': 0.0504
        'data[0].default/api.totalCost': 1.9296

  - name: the map keys are whatever the aggregation asked for
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
        # namespace, controller, label:app -- and the keys of the maps in
        # `data` become whatever this asked for. So the response's shape
        # depends on a query parameter, and no field in the body names the
        # aggregation that produced it.
        aggregate: controller
    expect:
      status: 200
      body:
        'data[0].default/api.name': default/api
        'data[0].default/api.properties.controller': api
        'data[0].default/api.properties.namespace': default

  - name: a status in the body beside a code that is not the HTTP status
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: today
    expect:
      status: 200
      body:
        # code and status, alongside data. The transport says 200 and the body
        # carries its own opinion -- the same shape Casdoor has, from a
        # completely unrelated project.
        code: 200
        status: success

  - name: the window parameter accepts four different grammars
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        # "words like today, lastweek; durations like 30m, 7d; RFC3339 date
        # pairs; or Unix timestamps." Four syntaxes, one string, no
        # discriminator -- so a client assembling one from user input has to
        # know which grammar it is in before it can validate it.
        window: "2026-09-05T00:00:00Z,2026-09-06T00:00:00Z"
    expect:
      status: 200
      body:
        # And the window comes back on each allocation as a start/end pair,
        # whichever of the four grammars asked for it -- so the response
        # normalises what the request did not.
        'data[0].default/api.window.start': "2026-09-05T00:00:00Z"
        'data[0].default/api.window.end': "2026-09-06T00:00:00Z"

  - name: minutes is a duration and every cost is a float
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
    expect:
      status: 200
      body:
        # Six numbers on one record: five costs and a duration in minutes.
        # None is typed as money, so a client that sums them accumulates
        # binary floating-point error across every workload in a cluster.
        'data[0].kube-system/coredns.cpuCost': 0.0412
        'data[0].kube-system/coredns.ramCost': 0.0089
        'data[0].kube-system/coredns.networkCost': 0.0003
        # Zero, and it is a real cost rather than an absence.
        'data[0].kube-system/coredns.pvCost': 0
        'data[0].kube-system/coredns.minutes': 1440

  - name: no credential is needed, and that is the design
    source: https://raw.githubusercontent.com/opencost/opencost/develop/docs/swagger.json
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
      headers: {}
    expect:
      # The fourth document in this collection declaring no securitySchemes,
      # after Argo CD, Cilium and Exoscale -- and correct here for the same
      # reason Cilium's is: it runs inside a cluster.
      status: 200
      body:
        status: success

  - name: "an invalid window says so in these words"
    source: "https://www.opencost.io/docs/integrations/api"
    arm: invalid_window
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
    expect:
      # The document's own 400 description names `accumulateBy`, which this
      # operation does not declare -- it declares `accumulate`. So a reader
      # debugging a 400 goes looking for a parameter that does not exist.
      status: 400
      body:
        message: "Bad request: invalid window"

  - name: "a failed query says so in these words"
    source: "https://www.opencost.io/docs/integrations/api"
    arm: server_error
    fixture: cluster
    request:
      method: GET
      path: /allocation
      query:
        window: 7d
    expect:
      status: 500
      body:
        message: "Internal server error: the allocation query failed"
