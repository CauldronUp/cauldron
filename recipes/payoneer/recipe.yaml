# Payoneer Recipe for Cauldron
#
# Payoneer's own developer portal, developer.payoneer.com, answers every
# request with a JavaScript challenge page rather than content -- checked
# live, 2026-09-01, with a plain HTTP client and no cookies, no path on that
# host ever returned anything but an obfuscated bot-detection script. Its
# Stoplight-hosted mirror, payoneer.stoplight.io, is a client-rendered
# single-page app with no server-side content either: the HTML Cauldron
# could fetch names no endpoint, no field and no status code. Neither is
# quoted anywhere in this file for that reason.
#
# What is not blocked is the wire itself, and Payoneer's own first-party
# integration examples on GitHub -- payoneer/chargeaccount-integration-
# example, a real Node.js reference client Payoneer publishes and maintains
# -- which is where every field, path and status value below actually comes
# from. Between the two, this Recipe answers the question its group exists
# to ask from real evidence rather than none: api.payoneer.com is reachable,
# it answers precisely, and no route on it was ever called with a credential
# that worked, because no account was ever opened to get one.
#
# **The "outbound payment" this API has is a debit, and it has no cancel
# call at all -- only a five-minute window that lapses on its own.**
# Payoneer's own reference client names the whole shape:
#
#   createDebit  ->  POST /v4/accounts/{accountHolderId}/balances/{balanceId}/payments/debit
#     "The debit is initially pending... asked to commit the transaction."
#     Response carries expires_at, five minutes after created_at in the
#     worked example (15:25:41.406397Z created, 15:30:41.406397Z expires) --
#     and no status field of any kind. A client that reads .status on the
#     object this call just returned finds nothing, because nothing has
#     happened to have a status yet.
#   commitCharge ->  PUT /v4/accounts/{accountHolderId}/payments/{commitId}
#     "This function must be called before the expiry_time... If a commit
#     fails it will be retried only once." Answers a payment_id and a
#     numeric status this time -- 2, "completed" in the worked example.
#   getChargeStatus -> GET /v4/accounts/{accountId}/payments/{clientReferenceId}?type=client_reference_id
#     status: 0 unknown, 1 in progress, 2 completed, 3 cancelled. The
#     doc-string's own word for 3 is final: "cancelled (failure, no retry)."
#
# There is no fourth call. Nothing in the reference client, its
# documentation or its source cancels a pending debit -- the only ways out
# of pending are commit, before expires_at, or silence, after it. Status 3
# is what "after" looks like from getChargeStatus, and it is reached by
# doing nothing rather than by calling anything. That is a different answer
# from both of this group's other two providers, and it is the honest one:
# asked "what does an attempt to cancel outside the window answer," the
# truthful reply for Payoneer is that there is no attempt to make, because
# there is no verb -- committing late is what answers instead, and
# commitCharge's own documentation says what that gets: a retry once, then
# "a timeout error." No worked body exists for that error either, so it is
# named here and not modelled as a route -- seebelow.
#
# **The object's own shape changes with its lifecycle, and the field that
# would tell a client where a debit is -- status -- is the one field that is
# not there yet.** Before commitCharge, the object has commit_id,
# expires_at, request_details and amounts, and status is absent, not null --
# there is nothing to poll. After, it has payment_id and a numeric status,
# and expires_at and commit_id are both gone. Two objects, same underlying
# debit, and a client holding one shape and checking the other field finds
# undefined either way it is out of sequence.
#
# **The get-status projection is thinner than either of those, on Payoneer's
# own worked example.** getChargeStatus's documented response is exactly
# three fields -- status, status_description, payment_id -- none of the
# amount, fee or request_details content the create and commit calls carry.
# A client that fetches status expecting to read the amount back finds it
# was never sent for that call at all, only for the two that create and
# settle the debit.
#
# **Missing, wrong-scheme and wrong-value credentials all answer the
# identical sentence, on every real route this Recipe could find.** Checked
# live, 2026-09-01, against a route that genuinely resolves --
# GET /v4/accounts/{id}/balances -- no Authorization header, "Authorization:
# junk" with no scheme, "Authorization: Bearer junktoken12345", and HTTP
# Basic "junk:junk" all answered the byte-identical body:
#
#   401 {"error":"Unauthorized","error_description":"Application is not
#        registered, or active","error_details":{"code":401,"sub_code":4016}}
#
# Four different ways of getting a credential wrong, one sentence. This is
# the common case Step 2a of this group's brief calls out explicitly --
# "most providers collapse them" -- and Payoneer is one of the ones that
# does, completely: absent, malformed and rejected are the same verdict
# here, so no field distinguishes them below.
#
# **Routing resolves before the credential is examined, on every path this
# Recipe struck.** /v4/programs is not a real collection on this host --
# checked with no credential, a wrong Bearer token, and a POST carrying a
# body, all three answered the identical 404 below, never the 401 a real
# route gives the same bad credentials. A real route (GET, DELETE or PATCH
# on /v4/accounts/{id}/balances) with no credential at all answers 401; the
# same path with an unregistered method -- DELETE, PATCH -- answers the
# identical 404 an invented path gets, not a 405. There is no real 405
# anywhere this Recipe found on this host.
#
#   GET    /v4/accounts/{id}/balances          no credential -> 401 (above)
#   DELETE /v4/accounts/{id}/balances          no credential -> 404 (below)
#   GET    /v4/programs                        no credential -> 404, identical body
#   POST   /v4/programs                        wrong Bearer  -> 404, identical body
#
# auth.after_routing: true reproduces this ordering exactly: a route this
# Recipe declares is gated on its credential; a route or method it does not
# 404s regardless of what was sent, which is what every line above shows.
#
# **A path Cauldron never has to route at all announces the gateway
# underneath the application by name.** A POST with no Content-Length header
# whatsoever -- not zero, absent -- answers neither of the shapes above:
#
#   {"fault":{"faultstring":"Content-Length is missing","detail":
#    {"errorcode":"messaging.adaptors.http.flow.LengthRequired"}}}
#
# "messaging.adaptors.http.flow" is Apigee's own internal vocabulary, not
# Payoneer's -- this host is an Apigee-fronted API, and a request malformed
# enough never reaches Payoneer's application at all. Every HTTP client
# Cauldron's conformance format can construct sends a correct Content-Length
# for whatever body it sends, so this specific failure cannot be struck as a
# case; it is recorded here because it answers, unprompted, a question the
# application-level bodies above never raise: there is a second piece of
# software in front of the one that wrote the 401 and 404 above, and it
# speaks a different vocabulary entirely when something is wrong with it
# rather than with the credential.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No debit was ever created against a real account and no commit was
#     ever attempted, so status 0 (unknown) and 1 (in progress) are named in
#     getChargeStatus's own documentation and not fixtured: no worked
#     example shows either one, and this Recipe does not invent one to fill
#     the gap.
#   - Status 3, cancelled-by-expiry, is likewise named in prose and not
#     fixtured for the same reason: no worked JSON body for a lapsed debit
#     is published anywhere this Recipe found. The mechanism -- do nothing
#     until expires_at -- is described in the header above rather than
#     forced into a route.
#   - What commitCharge answers on its second, retried failure ("a timeout
#     error") and what MFA's challenge_required shape looks like beyond the
#     one worked example in commitCharge's own docs (a session_id, a
#     challenge URL, an expires_at) are both named in the reference client's
#     documentation and not modelled: the former has no worked body at all,
#     and the latter's one example is already the whole of what is
#     published, nothing this Recipe could add a second case to.
#   - Two fields Payoneer's own worked examples publish as unresolved
#     template placeholders -- {AccountHolderId}/{BalanceId} inside a
#     request_details.url string, {partnerId} and {QuoteId} elsewhere -- are
#     kept exactly as published, braces included, rather than filled in.
#     That is not this Recipe declining to pick a value; it is Payoneer's
#     own "worked" example never resolving them either.
#   - commit_id, payment_id and client_reference_id are redacted to
#     "XXXXXXXXXXXXXXXX"-shaped strings of X characters in Payoneer's own
#     examples for createDebit and commitCharge. Those are not values --
#     they are redactions -- so this Recipe mints its own fixture ids for
#     them instead of reproducing a row of X's as though it were data.
#     getChargeStatus's own example is the one exception: its payment_id,
#     "4366181902103355", is concrete and is used verbatim.
#   - OAuth token issuance (POST /api/v2/oauth2/token on the separate
#     login.payoneer.com host, Basic-authenticated with the client id and
#     secret) is documented in the same reference client and not modelled:
#     this Recipe describes the payment-movement surface on api.payoneer.com,
#     not the credential-minting surface on a different host entirely.
#   - The sandbox host, api.sandbox.payoneer.com, answers identically to
#     production on every case this Recipe struck against both -- same 401,
#     same body -- so only one host is declared.
#
# Every id, timestamp and amount below that is not a live 2026-09-01 result
# is Payoneer's own published example, cited at the field it came from. No
# figure in this file was invented to fill a gap the source left empty.

recipe: payoneer
capability: payments
version: 0.1.0

upstream:
  api: v4
  docs: https://github.com/payoneer/chargeaccount-integration-example

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-payoneer-fixture-access-token-0000000000000000
  # No absent/malformed/rejected split -- see the header. Every shape of bad
  # credential this Recipe struck live answered the identical sentence, so
  # one message covers all three verdicts, which is what leaving these unset
  # already does.
  after_routing: true

responses:
  # Every successful body on this host is wrapped under "result", list and
  # single object alike -- Payoneer's own shape, not this format's default.
  # Only balance uses this mechanism: the payment routes below are raw --
  # see the header and the routes for why -- and wrap themselves.
  list:
    style: wrapped
    count_field: result.total
  resource:
    style: wrapped
    key: result
  error:
    style: flat
    message_field: error_description
    code_field: "-"
    type_field: "-"

resources:
  # A debit's two lifecycle stages -- see the header -- are not two states
  # of one addressable record this format's create/get/update operations
  # can share: the pending shape has no payment_id at all, and the field
  # that would look a record up changes identity partway through its own
  # life (commit_id, then payment_id, never both, never a rename). Routing,
  # not resource typing, is where that is modelled -- see routes below,
  # each raw and each answering exactly the worked body it is named for.
  balance:
    collection: result.items
    id:
      style: opaque
    fields:
      type:
        type: string
      currency:
        type: string
      # A string here -- "2" -- where the payment resource's own status is a
      # JSON number. Same API, same word, two different wire types.
      status:
        type: string
      status_name:
        type: string
      available_balance:
        type: string
      update_time:
        type: datetime

routes:
  - method: GET
    path: /v4/accounts/{account_id}/balances
    resource: balance
    operation: list
    pagination:
      # An account's balances are one row per currency the account holds,
      # and there is nothing to size or resume. A "page" of a balance sheet
      # is a balance sheet with money missing from it, which is worse than a
      # slow one.
      #
      # This Recipe's upstream reference is Payoneer's own integration
      # example repository rather than a published parameter table, so what
      # settles this is the shape of the resource rather than a sentence
      # anybody wrote about paging. Recorded that way rather than as a
      # documented absence.
      style: none

  # createDebit's own worked example (payoneer-service.js). Raw, not a
  # typed resource -- see the header on resources above. commit_id and
  # client_reference_id are Cauldron's own fixture ids: Payoneer's own
  # example redacts both to a row of X's, which is not a value to
  # reproduce -- see the header. description is one of the redacted fields
  # too and is simply omitted. Still gated by the ordinary credential check
  # below it in the pipeline, the same as every other route here.
  - method: POST
    path: /v4/accounts/{account_id}/balances/{balance_id}/payments/debit
    raw:
      content_type: application/json
      text: >-
        {"result":{"type":"debit","commit_id":"pay_cauldron_pending_0000001","client_reference_id":"cauldron-fixture-ref-000001","last_status":"2022-03-07T15:25:41.406397Z","created_at":"2022-03-07T15:25:41.406397Z","request_details":{"client_reference_id":"cauldron-fixture-ref-000001","amount":110.01,"currency":"USD","to":{"id":123456,"type":"partner"},"limit_level":"1"},"fees":[{"type":"charge_fee","amount":1,"currency":"USD"}],"amounts":{"charged":{"amount":109.01,"currency":"USD"},"target":{"amount":109.01,"currency":"USD"}},"expires_at":"2022-03-07T15:30:41.406397Z"}}

  # commitCharge's own worked example. payment_id and client_reference_id
  # are Cauldron's own fixture ids for the same reason as above.
  # request_details.url, to.id and fx.quote are published as literal,
  # unresolved template placeholders -- kept exactly as Payoneer wrote
  # them, braces included -- see the header.
  - method: PUT
    path: /v4/accounts/{account_id}/payments/{id}
    raw:
      content_type: application/json
      text: >-
        {"result":{"payment_id":"pay_cauldron_completed_0000001","status":2,"status_description":"completed","last_status":"2023-05-04T13:54:08.2121171Z","created_at":"2023-05-04T13:54:14.8276538Z","client_reference_id":"cauldron-fixture-ref-000002","request_details":{"url":"/accounts/{AccountHolderId}/balances/{BalanceId}/payments/debit","body":{"client_reference_id":"cauldron-fixture-ref-000002","amount":150,"currency":"USD","target_amount":true,"to":{"id":"{partnerId}","type":"partner"}}},"to":{"type":"partner","id":"{partnerId}"},"fees":[{"type":"charge_fee","amount":4.16,"currency":"CAD"},{"type":"partner_fee","amount":10,"currency":"USD"}],"fx":{"quote":"{QuoteId}","rate":0.7212925563,"source_currency":"CAD","target_currency":"USD"},"amounts":{"charged":{"amount":203.8,"currency":"CAD"},"target":{"amount":150,"currency":"USD"}}}}

  # getChargeStatus's own worked example, and the only one of the three
  # payment bodies whose identifying field is concrete rather than minted
  # -- Payoneer published this exact payment_id. Three fields, not the
  # fuller shape the two routes above answer -- see the header.
  - method: GET
    path: /v4/accounts/{account_id}/payments/{id}
    raw:
      content_type: application/json
      text: '{"result":{"status":2,"status_description":"completed","payment_id":"4366181902103355"}}'

errors:
  # The one sentence every shape of bad credential answers, live -- see the
  # header. error_description carries the message; error is a shorter label
  # beside it, declared per failure because "Unauthorized" is not "Not
  # Found".
  authentication_error:
    status: 401
    fields:
      error: Unauthorized
      error_details:
        code: 401
        sub_code: 4016
    message: "Application is not registered, or active"

  # What a route or method this Recipe does not register answers, live --
  # the identical body whether the path is invented or the method is wrong
  # on a real path. There is no real 405 on this host; see the header.
  unknown_route:
    status: 404
    fields:
      error: "Not Found"
      error_details:
        code: 404
        sub_code: null
    message: "The requested resource could not be found"

  method_not_allowed:
    status: 404
    fields:
      error: "Not Found"
      error_details:
        code: 404
        sub_code: null
    message: "The requested resource could not be found"

fixtures:
  empty: {}

  # account_id and balance_id are Cauldron's own fixture keys: no worked
  # example anywhere this Recipe found ever shows a concrete accountHolderId
  # or balanceId inside a URL, only the template variable names in
  # Payoneer's own reference client's source. The balance's own "id" is the
  # one exception, and is concrete -- see below.
  small-account:
    balance:
      # getBalances' own worked example (chargeaccount-integration-example,
      # payoneer-service.js). "id" here is concrete and cited; "total": 3 in
      # that same example is not reproduced, because the example shows one
      # item beside a "// additional currencies ..." comment for the other
      # two it never prints, and this fixture holds only the one Payoneer
      # actually published.
      - id: "4366181865108056"
        type: BALANCE
        currency: GBP
        status: "2"
        status_name: Active
        available_balance: "20.00"
        update_time: "2018-03-30T19:28:17Z"

# Every case below carries source. A verified date means api.payoneer.com
# was called with exactly the request shown, on 2026-09-01, with no account
# and no credential that worked -- and this is what came back. Its absence
# means the case reproduces a worked example from Payoneer's own published
# reference client rather than a live call, because reaching it needs a
# credential this Recipe was never issued.
conformance:
  - name: no credential at all gets the application's one sentence
    source: https://api.payoneer.com/v4/accounts/12345/balances
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v4/accounts/12345/balances
    expect:
      status: 401
      body:
        error: Unauthorized
        error_description: "Application is not registered, or active"
        error_details.code: 401
        error_details.sub_code: 4016

  - name: a wrong bearer token gets the byte-identical sentence
    source: https://api.payoneer.com/v4/accounts/12345/balances
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v4/accounts/12345/balances
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error_description: "Application is not registered, or active"

  - name: a Basic credential gets the same sentence too, not a different one
    source: https://api.payoneer.com/v4/accounts/12345/balances
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v4/accounts/12345/balances
      headers:
        Authorization: Basic anVuazpqdW5r
    expect:
      status: 401
      body:
        error_description: "Application is not registered, or active"

  - name: a route this Recipe never declares answers 404, not the auth sentence
    source: https://api.payoneer.com/v4/programs
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /v4/programs
    expect:
      status: 404
      body:
        error: "Not Found"
        error_description: "The requested resource could not be found"
        error_details.code: 404
        # Present and explicitly null, unlike the 401's sub_code (4016) --
        # so a client checking presence rather than the value learns
        # nothing here, and one checking the value correctly finds nothing
        # to act on.
        error_details.sub_code: null

  - name: and the same route still 404s with a wrong credential attached
    source: https://api.payoneer.com/v4/programs
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: POST
      path: /v4/programs
      headers:
        Authorization: Bearer junktoken12345
      json: {}
    expect:
      status: 404
      body:
        error_description: "The requested resource could not be found"

  - name: a method nothing registers on a real path 404s, not a 405
    source: https://api.payoneer.com/v4/accounts/12345/balances
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: DELETE
      path: /v4/accounts/12345/balances
    expect:
      status: 404
      body:
        error_description: "The requested resource could not be found"

  - name: a pending debit has no status field at all, because nothing has happened yet
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/src/payoneer-service.js
    fixture: small-account
    request:
      method: POST
      path: /v4/accounts/acc_cauldron00000001/balances/4366181865108056/payments/debit
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
      json:
        client_reference_id: cauldron-fixture-ref-000001
        amount: 110.01
        currency: USD
        target_amount: true
        to:
          type: partner
          id: 123456
    expect:
      status: 200
      body:
        result.type: debit
        result.amounts.charged.amount: 109.01
        result.expires_at: "2022-03-07T15:30:41.406397Z"
      absent:
        - result.status
        - result.payment_id

  - name: five minutes separate created and expires on the one worked example published
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/DOCUMENTATION.md
    fixture: small-account
    request:
      method: POST
      path: /v4/accounts/acc_cauldron00000001/balances/4366181865108056/payments/debit
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
      json:
        client_reference_id: cauldron-fixture-ref-000001
        amount: 110.01
        currency: USD
        target_amount: true
        to:
          type: partner
          id: 123456
    expect:
      status: 200
      body:
        result.created_at: "2022-03-07T15:25:41.406397Z"
        result.expires_at: "2022-03-07T15:30:41.406397Z"

  - name: committing answers a numeric status and payment_id, and the pending fields are gone
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/src/payoneer-service.js
    fixture: small-account
    request:
      method: PUT
      path: /v4/accounts/acc_cauldron00000001/payments/pay_cauldron_completed_0000001
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
    expect:
      status: 200
      body:
        result.status: 2
        result.status_description: completed
        result.payment_id: pay_cauldron_completed_0000001
      absent:
        - result.commit_id
        - result.expires_at

  - name: there is no cancel call -- committing late is the only documented way out, and it is not modelled
    # See the header: commitCharge's own documentation says a failed commit
    # is retried once and then answers "a timeout error", with no worked
    # body published for it anywhere this Recipe found. No route or case
    # claims one.
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/DOCUMENTATION.md
    fixture: small-account
    request:
      method: PUT
      path: /v4/accounts/acc_cauldron00000001/payments/pay_cauldron_completed_0000001
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
    expect:
      status: 200
      body:
        result.status: 2

  - name: the status-check projection is three fields, not the whole object
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/src/payoneer-service.js
    fixture: small-account
    request:
      method: GET
      path: /v4/accounts/acc_cauldron00000001/payments/4366181902103355
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
    expect:
      status: 200
      body:
        result.status: 2
        result.status_description: completed
        result.payment_id: "4366181902103355"
      absent:
        - result.amounts
        - result.fees
        - result.request_details

  - name: a balance's own status is a string, unlike a payment's numeric one
    source: https://github.com/payoneer/chargeaccount-integration-example/blob/main/DOCUMENTATION.md
    fixture: small-account
    request:
      method: GET
      path: /v4/accounts/acc_cauldron00000001/balances
      headers:
        Authorization: Bearer cauldron-payoneer-fixture-access-token-0000000000000000
    expect:
      status: 200
      body:
        result.items[0].status: "2"
        result.items[0].status_name: Active
        result.total: 1

  # The names. This Recipe declares 3 field(s) on a balance that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a balance carries the field names this Recipe declares"
    source: "https://github.com/payoneer/chargeaccount-integration-example/blob/main/DOCUMENTATION.md"
    fixture: small-account
    request:
      method: GET
      path: "/v4/accounts/4366181865108056/balances"
      headers:
        "Authorization": "Bearer cauldron-payoneer-fixture-access-token-0000000000000000"
    expect:
      status: 200
      body:
        "result.items[0].available_balance": "20.00"
        "result.items[0].currency": "GBP"
        "result.items[0].update_time": "2018-03-30T19:28:17Z"

