# Snyk Recipe for Cauldron
#
# Snyk has no sandbox. A token reaches a real organisation, and the data it
# returns is whatever vulnerabilities happen to exist in real projects on the
# day you run the test. That makes it the worst possible fixture: a suite
# asserting on a critical issue passes until the dependency is patched, and
# then fails for a reason that has nothing to do with the code under test.
#
# Two things worth modelling exactly:
#
#   1. A vulnerability with no fix is the interesting one. Severity says how
#      bad it is; isUpgradable and isPatchable say whether anything can be
#      done about it today. A gate that fails on critical severity alone
#      blocks every build until somebody upstream ships a release, which is
#      why the fields exist separately.
#   2. An ignored issue is still returned. Snyk records the ignore as a
#      decision rather than removing the finding, so code that counts rows
#      re-reports something a human already assessed.
#
# No account needed to check what api.snyk.io does with no credential at all,
# and struck live on 2026-09-05 that turned out to be worth checking: every
# v1 path answers an unauthenticated request the same way, and it is not the
# flat {code, message, userMessage} shape the rest of this file uses. It is
# JSON:API -- {"jsonapi":{"version":"1.0"},"errors":[{"status":"401",
# "details":"Unauthorized"}]}, application/vnd.api+json -- byte-identical
# whether nothing was sent, a garbage token was sent, or a Bearer-prefixed one
# was, on three different paths. A case in this file had asserted the flat
# shape for a Bearer-prefixed credential and had never been run; it was
# wrong, and is fixed below. A path nothing declares is a different failure
# again: 404, zero bytes, no Content-Type -- so routing is resolved before
# the credential is judged at all, which after_routing: true now says.
#
# Tokens below are fixtures, not secrets.

recipe: snyk
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.snyk.io/snyk-api

auth:
  # Snyk's own scheme. Not Bearer.
  scheme: bearer
  header: Authorization
  prefix: "token "
  keys:
    - cauldron-snyk-token
  # Verified live 2026-09-05: a path nothing declares is a 404 with no
  # credential sent, not the 401 an unauthenticated request to a real path
  # gets. Routing is resolved before the credential is judged.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: total
  error:
    style: flat
    code_field: code
    message_field: message
    # userMessage used to live here, as a field every error carries. Verified
    # live 2026-09-05: the one failure this Recipe could check without an
    # account -- an unauthenticated request -- carries no userMessage at all,
    # so a field declared here would have been served on a failure that does
    # not send it. It is declared per-error below instead, on the ones this
    # Recipe has not been able to check.

resources:
  issue:
    collection: issues
    id:
      style: opaque
      length: 20
    fields:
      project_id:
        type: string
      title:
        type: string
        required: true
      # low, medium, high, critical. On its own this says nothing about
      # whether anything can be done today.
      severity:
        type: string
        default: medium
      package_name:
        type: string
      version:
        type: string
      # Whether a fix exists at all. A critical issue with both of these
      # false cannot be resolved by this team today, and a gate that fails on
      # severity alone blocks every build until somebody upstream ships.
      isUpgradable:
        type: boolean
        default: false
      isPatchable:
        type: boolean
        default: false
      # An ignored issue is still returned. Snyk records the decision rather
      # than removing the finding.
      isIgnored:
        type: boolean
        default: false
      cvssScore:
        type: number
        default: 0
      identifiers_CVE:
        type: string
      disclosureTime:
        type: datetime
        stamped: false

  project:
    collection: projects
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      origin:
        type: string
        default: github
      type:
        type: string
        default: npm
      # A project that has never been tested reports no issues, which reads
      # identically to a clean one.
      totalDependencies:
        type: integer
        default: 0
      lastTestedDate:
        type: datetime
        stamped: false
      isMonitored:
        type: boolean
        default: true

  org:
    collection: orgs
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      slug:
        type: string
      group_id:
        type: string

routes:
  # POST, not GET. Snyk's v1 project listing takes a filters body, so it is
  # a POST that reads like a GET -- and a client that calls GET on it does
  # not get an empty list, it gets nothing that works.
  - method: POST
    path: /v1/org/{org_id}/projects
    resource: project
    operation: list
    pagination:
      # Somebody checked. Snyk's description declares no query parameters on
      # this listing at all -- not a limit, not an offset, not a cursor --
      # because the v1 API answers these with everything it has. So the page
      # size is fixed and no name is read, which is what "-" says.
      #
      # It matters in the direction nobody tests. A client that sends
      # ?limit=10 against a fake that honours it gets ten, writes a paging
      # loop around that, and gets every record in one response from Snyk --
      # where the loop either runs once or runs forever depending on how it
      # decides it has finished.
      # And the position, for the same reason and from the same reading: a
      # listing that answers with everything has nothing to resume from. Left
      # blank it is not silence -- the runtime reads "cursor" off a request
      # Snyk's v1 API takes no query parameters on at all.
      limit: 50
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v1/org/{org_id}/project/{id}
    resource: project
    operation: get

  # aggregated-issues, and a POST. There is no /issues on a project in
  # Snyk's v1 API at all: the endpoint is aggregated-issues, it takes filters
  # in the body, and this Recipe invented both the path and the method.
  - method: POST
    path: /v1/org/{org_id}/project/{project_id}/aggregated-issues
    resource: issue
    operation: list
    scope: [project_id]
    pagination:
      # Somebody checked. Snyk's description declares no query parameters on
      # this listing at all -- not a limit, not an offset, not a cursor --
      # because the v1 API answers these with everything it has. So the page
      # size is fixed and no name is read, which is what "-" says.
      #
      # It matters in the direction nobody tests. A client that sends
      # ?limit=10 against a fake that honours it gets ten, writes a paging
      # loop around that, and gets every record in one response from Snyk --
      # where the loop either runs once or runs forever depending on how it
      # decides it has finished.
      # And the position, for the same reason and from the same reading: a
      # listing that answers with everything has nothing to resume from. Left
      # blank it is not silence -- the runtime reads "cursor" off a request
      # Snyk's v1 API takes no query parameters on at all.
      limit: 50
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v1/orgs
    resource: org
    operation: list
    pagination:
      # Somebody checked. Snyk's description declares no query parameters on
      # this listing at all -- not a limit, not an offset, not a cursor --
      # because the v1 API answers these with everything it has. So the page
      # size is fixed and no name is read, which is what "-" says.
      #
      # It matters in the direction nobody tests. A client that sends
      # ?limit=10 against a fake that honours it gets ten, writes a paging
      # loop around that, and gets every record in one response from Snyk --
      # where the loop either runs once or runs forever depending on how it
      # decides it has finished.
      # And the position, for the same reason and from the same reading: a
      # listing that answers with everything has nothing to resume from. Left
      # blank it is not silence -- the runtime reads "cursor" off a request
      # Snyk's v1 API takes no query parameters on at all.
      limit: 50
      limit_param: "-"
      cursor_param: "-"

webhooks:
  events:
    - project_snapshot
    - ping
  signing:
    scheme: hmac-sha256
    header: X-Hub-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: "429"
    message: Rate limit exceeded
    headers:
      Retry-After: "1"
    fields:
      userMessage: An error occurred. Please contact support if it persists.

  # Verified live against api.snyk.io 2026-09-05, and not the flat {code,
  # message} shape below: an unauthenticated request to a v1 path -- with no
  # token, or with a garbage one, byte-identical either way -- is intercepted
  # before it reaches whatever answers the rest of this file and comes back
  # JSON:API shaped, application/vnd.api+json, {"jsonapi":{"version":"1.0"},
  # "errors":[{"status":"401","details":"Unauthorized"}]}. "details", not
  # "detail". Checked on three different v1 paths (GET and POST) to make sure
  # it was the gateway and not one route.
  #
  # The top-level "jsonapi" object is not reproduced: a named error's fields
  # nest inside its entry, not beside the envelope, and the envelope-level
  # fields belong to responses.error and would leak onto every other error in
  # this file, none of which could be checked without an account. Modelling
  # the part that could be checked rather than guessing the rest true.
  authentication_error:
    status: 401
    message: Unauthorized
    style: list
    key: errors
    message_field: details
    code_field: "-"
    headers:
      Content-Type: application/vnd.api+json
    fields:
      status: "401"

  # Verified live 2026-09-05: a path nothing declares answers 404 with zero
  # bytes and no Content-Type at all, unauthenticated. Not the JSON-API shape
  # above and not the flat one below -- silence, the same as api.snyk.io's
  # own credential-shaped answer is not once you are past its gateway to a
  # path that resolves to nothing.
  unknown_route:
    status: 404
    empty: true

  resource_missing:
    status: 404
    code: "404"
    message: "Not found: {detail}"
    fields:
      userMessage: An error occurred. Please contact support if it persists.

  parameter_missing:
    status: 400
    code: "400"
    message: "{detail} is required"
    fields:
      userMessage: An error occurred. Please contact support if it persists.

  # A token scoped to one organisation cannot read another's projects, and
  # the failure names neither the organisation nor the scope.
  forbidden:
    status: 403
    code: "403"
    message: Access to this resource is forbidden
    fields:
      userMessage: An error occurred. Please contact support if it persists.

  # Snyk refuses to test a project whose manifest it cannot parse, which is
  # the failure a monorepo with an unusual layout produces.
  unparseable_manifest:
    status: 422
    code: "422"
    message: Could not parse the manifest file for this project
    fields:
      userMessage: An error occurred. Please contact support if it persists.

fixtures:
  empty: {}

  small-org:
    org:
      - id: 11111111-1111-4111-8111-111111111111
        name: Cauldron
        slug: cauldron
    project:
      - id: 22222222-2222-4222-8222-222222222222
        name: cauldron/engine:package.json
        origin: github
        type: npm
        totalDependencies: 412
        lastTestedDate: "2026-01-14T02:00:00Z"
      - id: 33333333-3333-4333-8333-333333333333
        name: cauldron/experiment:package.json
        origin: github
        type: npm
        # Never tested. Reports no issues, which reads identically to a
        # clean project and is not the same thing at all.
        isMonitored: false
    issue:
      - id: SNYK-JS-CAULDRON-001
        project_id: 22222222-2222-4222-8222-222222222222
        title: Prototype Pollution
        severity: critical
        package_name: deep-merge
        version: 1.2.0
        # No fix exists. This team cannot resolve it today, and a gate that
        # fails on critical severity alone blocks every build until somebody
        # upstream ships a release.
        isUpgradable: false
        isPatchable: false
        cvssScore: 9.8
        identifiers_CVE: CVE-2026-00001
      - id: SNYK-JS-CAULDRON-002
        project_id: 22222222-2222-4222-8222-222222222222
        title: Regular Expression Denial of Service
        severity: high
        package_name: parse-path
        version: 4.0.1
        # Fixable today by upgrading.
        isUpgradable: true
        cvssScore: 7.5
      - id: SNYK-JS-CAULDRON-003
        project_id: 22222222-2222-4222-8222-222222222222
        title: Information Exposure
        severity: medium
        package_name: legacy-logger
        version: 0.9.0
        # A human already assessed this and chose to accept it. Counting
        # rows re-reports it.
        isIgnored: true
        cvssScore: 5.3

# Conformance cases, read from Snyk's API documentation rather than observed
# against a live organisation. The verify report says so.
conformance:
  - name: an unauthenticated v1 request answers JSON:API shaped, not the flat shape this file otherwise models
    # Struck on /v1/user/me, a path this Recipe does not model, to be sure the
    # shape belonged to the gateway rather than one route -- and confirmed
    # again on /v1/org/{id}/project/{id}, which this Recipe does. The request
    # below uses the one it declares, so the case can run.
    source: https://api.snyk.io/v1/user/me
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222
    expect:
      status: 401
      headers:
        Content-Type: application/vnd.api+json
      body:
        errors[0].status: "401"
        errors[0].details: Unauthorized
      absent:
        # The flat shape's fields. Neither is sent by the gateway that
        # answers an unauthenticated request.
        - code
        - message
        - userMessage

  - name: a garbage token answers byte-identical to no token at all
    source: https://api.snyk.io/v1/user/me
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: token garbage-invalid-token-000
    expect:
      status: 401
      body:
        errors[0].status: "401"
        errors[0].details: Unauthorized

  - name: a path nothing declares is a 404 with nothing in it
    source: https://api.snyk.io/v1/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/not-a-real-endpoint
    expect:
      status: 404
      no_body: true

  - name: listing projects is a POST, and a GET is not a smaller version of it
    # Snyk's v1 project listing takes its filters in a body, so the endpoint
    # that reads like a GET is a POST. A client that calls GET does not get
    # an unfiltered list -- it gets nothing that works, and the mistake looks
    # like an auth or permissions problem rather than a method one.
    #
    # This Recipe declared GET and every case passed, because none of them
    # listed projects.
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: POST
      path: /v1/org/11111111-1111-4111-8111-111111111111/projects
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        projects[0].name: cauldron/engine:package.json
        # Never tested, and it reports no issues -- which reads exactly like
        # a clean project and is not the same thing at all.
        projects[1].isMonitored: false

  - name: severity says nothing about whether a fix exists
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: POST
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222/aggregated-issues
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        # Critical, and neither upgradable nor patchable. A gate failing on
        # severity alone blocks every build until somebody upstream ships.
        issues[0].severity: critical
        issues[0].isUpgradable: false
        issues[0].isPatchable: false
        # High, and fixable today.
        issues[1].severity: high
        issues[1].isUpgradable: true

  - name: an ignored issue is still returned
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: POST
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222/aggregated-issues
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        total: 3
        # A human already assessed this one. Counting rows re-reports it.
        issues[2].isIgnored: true
        issues[0].isIgnored: false

  - name: a project that has never been tested has no test date
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: GET
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        isMonitored: false
        totalDependencies: 0
      # Never tested reads identically to clean unless you check this, and
      # stamping a date would make the difference invisible.
      absent:
        - lastTestedDate

  - name: the credential scheme is token, not Bearer -- and a Bearer prefix answers exactly like no credential at all
    source: https://api.snyk.io/v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222
    verified: "2026-09-05"
    fixture: small-org
    # This case used to send the request against /v1/orgs, a path this
    # Recipe never declared as a route, and assert a flat {code, message}
    # body that was never checked against the live API. Struck live, a
    # Bearer prefix answers byte-identical to the absent and garbage-token
    # cases above -- the gateway does not distinguish a malformed scheme
    # from a missing or a wrong credential.
    request:
      method: GET
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Bearer cauldron-snyk-token
    expect:
      status: 401
      body:
        errors[0].status: "401"
        errors[0].details: Unauthorized

  - name: the error carries a separate message for a person
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: GET
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/44444444-4444-4444-8444-444444444444
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 404
      body:
        code: 404
      matches:
        # One message for logs and one safe to show a person. Surfacing the
        # wrong one leaks internal detail.
        message: 'Not found'
        userMessage: 'contact support'
      absent:
        - error
        - errors

  - name: a collection is wrapped in issues, and a limit does nothing
    # Snyk's description declares no query parameters on this listing: not a
    # limit, not an offset, not a cursor. The v1 API answers with everything
    # it has, so the limit below is read by nobody and all three issues come
    # back.
    #
    # This case used to send the same limit and assert that two came back,
    # which is a paging loop's worth of difference: written against that, a
    # client asks for a page, gets a page, asks for the next one -- and
    # against Snyk gets the whole set every time, so it either stops after
    # one round or never stops at all.
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: POST
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222/aggregated-issues
      query:
        limit: "2"
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        total: 3
        # The third one, which a limit of two would have cut.
        issues[2].severity: medium
      absent:
        - data

  - name: a CVSS score sits alongside the severity word
    source: https://docs.snyk.io/snyk-api
    fixture: small-org
    request:
      method: POST
      path: /v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222/aggregated-issues
      headers:
        Authorization: token cauldron-snyk-token
    expect:
      status: 200
      body:
        issues[0].cvssScore: 9.8
        issues[0].identifiers_CVE: CVE-2026-00001
        issues[2].cvssScore: 5.3

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the org listing answers with what the fixture holds"
    source: "https://docs.snyk.io/snyk-api"
    fixture: small-org
    request:
      method: GET
      path: "/v1/orgs"
      headers:
        "Authorization": "token cauldron-snyk-token"
    expect:
      status: 200
      body:
        "orgs[0].id": "11111111-1111-4111-8111-111111111111"
      absent:
        - "orgs[1]"

  # The names. This Recipe declares 5 field(s) on a issue that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an issue carries the field names this Recipe declares"
    source: "https://docs.snyk.io/snyk-api"
    fixture: small-org
    request:
      method: POST
      path: "/v1/org/11111111-1111-4111-8111-111111111111/project/22222222-2222-4222-8222-222222222222/aggregated-issues"
      headers:
        "Authorization": "token cauldron-snyk-token"
    expect:
      status: 200
      body:
        "issues[0].package_name": "deep-merge"
        "issues[0].project_id": "22222222-2222-4222-8222-222222222222"
        "issues[0].title": "Prototype Pollution"
        "issues[0].version": "1.2.0"

  # The names. This Recipe declares 2 field(s) on a org that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an org carries the field names this Recipe declares"
    source: "https://docs.snyk.io/snyk-api"
    fixture: small-org
    request:
      method: GET
      path: "/v1/orgs"
      headers:
        "Authorization": "token cauldron-snyk-token"
    expect:
      status: 200
      body:
        "orgs[0].slug": "cauldron"

  # The names. This Recipe declares 3 field(s) on a project that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a project carries the field names this Recipe declares"
    source: "https://docs.snyk.io/snyk-api"
    fixture: small-org
    request:
      method: POST
      path: "/v1/org/11111111-1111-4111-8111-111111111111/projects"
      headers:
        "Authorization": "token cauldron-snyk-token"
    expect:
      status: 200
      body:
        "projects[0].lastTestedDate": "2026-01-14T02:00:00Z"
        "projects[0].origin": "github"
        "projects[0].type": "npm"

  # The names. This Recipe declares 2 field(s) on an org that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an org carries the field names this Recipe declares, and 1 more of them"
    source: "https://docs.snyk.io/snyk-api"
    fixture: small-org
    request:
      method: GET
      path: "/v1/orgs"
      headers:
        "Authorization": "token cauldron-snyk-token"
    expect:
      status: 200
      body:
        "orgs[0].name": "Cauldron"



