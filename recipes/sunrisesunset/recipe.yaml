# Sunrise-Sunset Recipe for Cauldron
#
# The sunset is before the sunrise.
#
#   GET /json?lat=43.6532&lng=-79.3832&date=2026-08-28
#   ->  {"sunrise": "10:35:37 AM", "sunset": "12:01:46 AM", ...}
#
# Both times are UTC, and both are formatted as a twelve-hour wall clock with no
# date and no zone on them. Toronto's sunset that evening is a minute past
# midnight UTC, which is the next calendar day -- so parsed against the date that
# was asked for, the sunset lands sixteen hours before the sunrise. Anything
# comparing the two, or drawing a bar between them, gets a negative interval, and
# nothing in the response says the day rolled over.
#
# **And the times are UTC while looking like local time.** "10:35:37 AM" reads
# as half past ten in the morning. Toronto's sunrise that day was 06:35. The only
# thing that says otherwise is tzid: "UTC", a sibling of results rather than a
# field inside it, and a client rendering results.sunrise straight into a page
# is four hours out and says nothing about it.
#
# Written against the live API rather than a document: every case below was
# checked against api.sunrise-sunset.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A latitude of 999 answers status "OK" with a full set of times. There is
#      no validation of the coordinate at all: 999 degrees is not a place, and
#      the response is a normal one.
#   2. A failure sets results to the empty string. A success has it as an
#      object, so typeof results is "object" on one and "string" on the other,
#      and results.sunrise is undefined rather than a crash -- until something
#      formats it.
#   3. day_length is "13:26:09", a duration in the same colon-separated shape as
#      the times beside it, and it is the only field in the object that is not a
#      clock reading. Twelve-hour with a suffix means a time; twenty-four hour
#      without one means an elapsed span.
#   4. At 78 degrees north on the solstice, every time in the object is
#      "12:00:01 AM" and day_length is "00:00:00", with status "OK". The sun
#      does not set there in June, and the API reports a zero-length day with
#      ten identical timestamps -- so the one latitude where the question is
#      hard is answered exactly backwards.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The ephemeris is served rather than computed. A real request takes any
#     coordinate and date; this Recipe answers with the days its fixture holds.
#   - formatted=0 switches every field to an ISO 8601 string with an offset,
#     which is a different document from the same path and is not modelled.
#     What is worth knowing is that the formatted form is the default.
#
# The coordinates below are public and were recorded on the date in the cases.

recipe: sunrisesunset
capability: infrastructure
version: 0.1.0

upstream:
  api: json
  docs: https://sunrise-sunset.org/api
  # Found by cauldron discover rather than recorded by hand. This
  # document declares the one route this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://api.sunrise-sunset.org/openapi.json
  spec_hash: c21a717f64328cde367c9c8ba35a13ba0fe7a0c041d4f9c97d37d9233c4ea81b
  spec_seen: "2026-09-05"

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    # results, with status and tzid beside it.
    style: wrapped
    key: results
  error:
    style: flat
    # The status string is the whole message.
    message_field: status
    fields:
      # The empty string, where a success has an object.
      results: ""

resources:
  sun:
    id:
      style: opaque
      # The latitude in the query string. Nothing in the response carries
      # it: the document says what the sun did and never says where.
      field: "-"
    fields:
      # Every one a twelve-hour wall clock with no date and no zone, in UTC.
      sunrise:
        type: string
      sunset:
        type: string
      solar_noon:
        type: string
      # A duration, in the same shape as the times above and on a
      # twenty-four hour clock with no suffix.
      day_length:
        type: string
      civil_twilight_begin:
        type: string
      civil_twilight_end:
        type: string

routes:
  - method: GET
    path: /json
    resource: sun
    operation: get
    id_from: query:lat
    not_found: invalid_request
    fields:
      # Beside results rather than inside it.
      status: OK
      # The only thing in the document that says the times are not local.
      tzid: UTC

errors:
  invalid_request:
    status: 400
    message: INVALID_REQUEST

  invalid_date:
    status: 400
    message: INVALID_DATE

fixtures:
  empty: {}

  toronto:
    sun:
      - id: "43.6532"
        # 06:35 in Toronto.
        sunrise: 10:35:37 AM
        # A minute past midnight UTC, which is the next calendar day, so
        # against the date that was asked for this is before the sunrise.
        sunset: 12:01:46 AM
        solar_noon: 5:18:42 PM
        # Twenty-four hour, no suffix: a span rather than a reading.
        day_length: "13:26:09"
        civil_twilight_begin: 10:07:18 AM
        civil_twilight_end: 12:30:05 AM

  # A latitude that is not a place, answered as though it were.
  nowhere:
    sun:
      - id: "999"
        sunrise: 3:55:27 PM
        sunset: 6:41:56 PM
        solar_noon: 5:18:42 PM
        day_length: "02:46:29"
        civil_twilight_begin: 12:48:22 PM
        civil_twilight_end: 9:49:01 PM

  # 78 degrees north on the solstice: the sun does not set.
  svalbard:
    sun:
      - id: "78"
        # Ten identical timestamps.
        sunrise: 12:00:01 AM
        sunset: 12:00:01 AM
        solar_noon: 11:01:49 AM
        # Zero, on the day the sun is up for all of it.
        day_length: "00:00:00"
        civil_twilight_begin: 12:00:01 AM
        civil_twilight_end: 12:00:01 AM

conformance:
  - name: the sunset is before the sunrise
    source: https://api.sunrise-sunset.org/json?lat=43.6532&lng=-79.3832&date=2026-08-28
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /json?lat=43.6532&lng=-79.3832&date=2026-08-28
    expect:
      status: 200
      body:
        # Parsed against the date that was asked for, the sunset lands sixteen
        # hours before the sunrise, and nothing says the day rolled over.
        "results.sunrise": 10:35:37 AM
        "results.sunset": 12:01:46 AM
        "results.civil_twilight_end": 12:30:05 AM

  - name: and the times are UTC while looking like local time
    source: https://api.sunrise-sunset.org/json?lat=43.6532&lng=-79.3832&date=2026-08-28
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /json?lat=43.6532&lng=-79.3832&date=2026-08-28
    expect:
      status: 200
      body:
        # Toronto's sunrise that day was 06:35. The only thing that says so is
        # a sibling of results rather than a field inside it.
        tzid: UTC
        status: OK
        "results.solar_noon": 5:18:42 PM
      absent:
        # A sibling of results, and not a field inside it, so code reading the
        # results object alone has no way to know what zone it is in.
        - results.tzid

  - name: the day length is a duration in the shape of a time
    source: https://api.sunrise-sunset.org/json?lat=43.6532&lng=-79.3832&date=2026-08-28
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /json?lat=43.6532&lng=-79.3832&date=2026-08-28
    expect:
      status: 200
      body:
        # Twenty-four hour and no suffix, in an object where every other
        # colon-separated string is a twelve-hour clock reading.
        "results.day_length": "13:26:09"

  - name: a latitude of 999 is answered as though it were a place
    source: https://api.sunrise-sunset.org/json?lat=999&lng=-79.3832
    verified: "2026-08-28"
    fixture: nowhere
    request:
      method: GET
      path: /json?lat=999&lng=-79.3832
    expect:
      # There is no validation of the coordinate at all. 999 degrees is not a
      # place and the response is a normal one.
      status: 200
      body:
        status: OK
        "results.sunrise": 3:55:27 PM
        "results.sunset": 6:41:56 PM
        "results.day_length": "02:46:29"

  - name: a request missing a coordinate sets results to the empty string
    source: https://api.sunrise-sunset.org/json?lng=-79.3832
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /json?lng=-79.3832
    expect:
      # typeof results is "object" on a success and "string" here, so
      # results.sunrise is undefined rather than a crash -- until something
      # formats it.
      status: 400
      body:
        results: ""
        status: INVALID_REQUEST

  - name: and a date it cannot read says so under the same key
    source: https://api.sunrise-sunset.org/json?lat=43.65&lng=-79.38&date=notadate
    verified: "2026-08-28"
    fixture: toronto
    arm: invalid_date
    request:
      method: GET
      path: /json?lat=43.65&lng=-79.38&date=notadate
    expect:
      status: 400
      body:
        results: ""
        status: INVALID_DATE

  - name: the polar day is reported as a day of zero length
    source: https://api.sunrise-sunset.org/json?lat=78&lng=15&date=2026-06-21
    verified: "2026-08-28"
    fixture: svalbard
    request:
      method: GET
      path: /json?lat=78&lng=15&date=2026-06-21
    expect:
      # The sun does not set at 78 north in June. Ten identical timestamps, a
      # zero-length day, and status OK -- so the one latitude where the
      # question is hard is answered exactly backwards.
      status: 200
      body:
        status: OK
        "results.sunrise": 12:00:01 AM
        "results.sunset": 12:00:01 AM
        "results.civil_twilight_begin": 12:00:01 AM
        "results.day_length": "00:00:00"

  - name: and solar noon is the only time that moves there
    source: https://api.sunrise-sunset.org/json?lat=78&lng=15&date=2026-06-21
    verified: "2026-08-28"
    fixture: svalbard
    request:
      method: GET
      path: /json?lat=78&lng=15&date=2026-06-21
    expect:
      status: 200
      body:
        # The one field computed from the sun's position rather than from a
        # crossing that never happens.
        "results.solar_noon": 11:01:49 AM
