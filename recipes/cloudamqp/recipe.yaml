# CloudAMQP Recipe for Cauldron
#
# The instance API, written against CloudAMQP's published OpenAPI document at
# docs.cloudamqp.com and struck live against api.cloudamqp.com on 2026-09-09
# with no credential and with a deliberately invalid one.
#
# **The challenge header is sent only to callers who already know the scheme.**
# Struck live:
#
#   GET /api/nodes    (no credential)
#   401  Content-Type: application/json
#   (no WWW-Authenticate)
#   <empty body>
#
#   GET /api/nodes    Authorization: Basic bm90cmVhbDpub3RyZWFs
#   401  Content-Type: application/json
#   WWW-Authenticate: Basic realm="CloudAMQP API"
#   {"error":"Not authorized"}
#
# That is backwards. RFC 9110 section 15.5.2 says a 401 MUST carry a
# `WWW-Authenticate` header, and the reason the field exists at all is to tell
# a caller that has not authenticated which scheme to use. CloudAMQP withholds
# it from exactly that caller and sends it to the one who has already
# demonstrated they know: a request with a Basic header gets told to use Basic.
#
# The body follows the same pattern. Nothing at all for the caller who sent
# nothing -- with `Content-Type: application/json` named over the empty bytes --
# and a sentence for the caller who sent something wrong.
#
# **And CloudAMQP's other API does it correctly.** The customer API at
# customer.cloudamqp.com, probed the same day, answers `WWW-Authenticate: Basic
# realm="Customer API"` to a missing credential and a wrong one alike, with
# `{"error":"Not authorized"}` in both. One vendor, two APIs, two behaviours on
# one header -- and the half that gets it wrong is wrong in the least useful
# direction available.
#
# The double quotes are worth noting on both. [buffer](../buffer) single-quotes
# its auth-params, which RFC 9110 does not permit for a quoted-string, so a
# conforming parser rejects the whole challenge. CloudAMQP's is well formed
# wherever it appears; the fault here is when it appears rather than how.
#
# **The credential is Basic with an empty username.** The API key is the
# *password* and the username is blank -- the mirror image of
# [close](../close) and [insightly](../insightly), which both put the key in
# the username and leave the password empty. Three providers, one scheme, two
# opposite conventions, and nothing in the header says which way round a given
# API wants it.
#
# OpenAPI has no way to express "leave the username blank", so the document
# invents two vendor extensions to say it: `x-username-optional: true` and
# `x-default-username: ""`, beside a description that spells out the curl
# invocation. A generator reading the standard keywords alone produces a client
# that asks for a username nobody has.
#
# **The document declares one response and it is the success.** `GET /nodes`
# lists only `200`, on an API that answers 401 to every request without a
# credential -- the same silence [middesk](../middesk) publishes, found on a
# second provider two days later. Nothing on a node is required either: the
# item schema has no `required` array at all.
#
# **Two of everything on a node.** `disk_size` and `additional_disk_size` are
# both integers in gigabytes and the total is neither of them. `hostname` and
# `hostname_internal` are both addresses for the same machine. `running` and
# `configured` are both booleans that read as "is it up", and a node can be
# configured and not running.

recipe: cloudamqp
capability: queue
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.cloudamqp.com/cloudamqp_api.html
  spec: https://docs.cloudamqp.com/openapi-instance.yaml
  spec_hash: 70a2a96d81db34bd18dea5decea13b06a25efba2d60bc8f4ade82b612e3b294d
  spec_seen: "2026-09-09"

auth:
  # The API key as the password with an empty username, which the document can
  # only say through two invented extensions.
  scheme: basic
  # The secret is the password half, not the username -- which is what the
  # document's x-username-optional and x-default-username extensions exist to
  # say, and the reverse of how Close and Insightly use the same scheme.
  credential: password
  keys:
    - cauldr0n-cloudamqp-key
  # Two failures, and the difference is which one gets told how to
  # authenticate.
  absent_error: unauthorized_silent
  rejected_error: unauthorized

responses:
  list:
    # A bare array of nodes: no envelope, no count, no paging anywhere in the
    # document.
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  node:
    id:
      field: name
      style: opaque
    fields:
      hostname:
        type: string
      # A second address for the same machine, for traffic that stays inside
      # the provider's network.
      hostname_internal:
        type: string
      rabbitmq_version:
        type: string
      erlang_version:
        type: string
      # Two booleans that both read as "is it up", and a node can be one
      # without the other.
      configured:
        type: boolean
      running:
        type: boolean
      # Two integers in gigabytes, and the total is neither of them.
      disk_size:
        type: integer
      additional_disk_size:
        type: integer
      availability_zone:
        type: string

routes:
  - method: GET
    path: /api/nodes
    resource: node
    operation: list
    pagination:
      # None declared, and none offered: the document gives this operation no
      # parameters at all.
      style: none

errors:
  unauthorized_silent:
    status: 401
    # Nothing in the body, and no challenge header -- so the caller who most
    # needs to be told which scheme to use is the one told nothing.
    empty: true
    headers:
      # Named over zero bytes.
      Content-Type: application/json

  unauthorized:
    status: 401
    message: Not authorized
    headers:
      # Well formed and double-quoted, and sent to the caller who has already
      # proved they know it is Basic.
      WWW-Authenticate: Basic realm="CloudAMQP API"

fixtures:
  empty:
    node: []

  cluster:
    node:
      - name: cauldron-rabbit-01
        hostname: cauldron-rabbit-01.rmq.cloudamqp.com
        hostname_internal: cauldron-rabbit-01.internal.cloudamqp.com
        rabbitmq_version: 4.1.2
        erlang_version: 27.3.4
        configured: true
        running: true
        disk_size: 40
        additional_disk_size: 0
        availability_zone: eu-west-1a
      - name: cauldron-rabbit-02
        hostname: cauldron-rabbit-02.rmq.cloudamqp.com
        hostname_internal: cauldron-rabbit-02.internal.cloudamqp.com
        rabbitmq_version: 4.1.2
        erlang_version: 27.3.4
        # Provisioned and not yet up, which is the pair of booleans doing
        # something a single one could not.
        configured: true
        running: false
        disk_size: 40
        additional_disk_size: 100
        availability_zone: eu-west-1b

conformance:
  - name: a missing credential gets no challenge header
    source: https://api.cloudamqp.com/api/nodes
    verified: "2026-09-09"
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers: {}
    expect:
      status: 401
      absent_headers:
        # RFC 9110 makes this mandatory on a 401, and the caller who has not
        # authenticated is the caller it exists for.
        - WWW-Authenticate
      no_body: true

  - name: the empty body still declares a media type
    source: https://api.cloudamqp.com/api/nodes
    verified: "2026-09-09"
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/json

  - name: a wrong credential is told which scheme to use
    source: https://api.cloudamqp.com/api/nodes
    verified: "2026-09-09"
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        # notreal:notreal
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      status: 401
      headers:
        # Sent to the one caller that has already demonstrated it knows.
        WWW-Authenticate: Basic realm="CloudAMQP API"
      body:
        error: Not authorized

  - name: only the wrong credential gets a sentence
    source: https://api.cloudamqp.com/api/nodes
    verified: "2026-09-09"
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      status: 401
      body:
        # Where the missing-credential case sends zero bytes.
        error: Not authorized

  - name: nodes are a bare array
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        # An empty username with the key as the password, which is what the
        # document's two vendor extensions exist to say.
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body:
        '[0].name': cauldron-rabbit-01
        '[0].rabbitmq_version': 4.1.2

  - name: a node carries two hostnames
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body:
        # One for traffic from outside and one for traffic that stays inside,
        # and only the suffix says which.
        '[0].hostname': cauldron-rabbit-01.rmq.cloudamqp.com
        '[0].hostname_internal': cauldron-rabbit-01.internal.cloudamqp.com

  - name: configured and running are separate booleans
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body:
        # A node can be provisioned and not up, which is the distinction one
        # boolean could not carry -- and neither is required by the schema.
        '[1].configured': true
        '[1].running': false
        '[0].running': true

  - name: the disk is two numbers and the total is neither
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body:
        # Base and additional, both in gigabytes, and a client wanting the
        # capacity has to add them.
        '[1].disk_size': 40
        '[1].additional_disk_size': 100
        '[0].additional_disk_size': 0

  - name: the runtime versions are two separate fields
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body:
        # RabbitMQ's version and the Erlang it runs on, which is the pair that
        # actually determines what a client can use.
        '[1].rabbitmq_version': 4.1.2
        '[1].erlang_version': 27.3.4
        '[1].availability_zone': eu-west-1b

  - name: an instance with no nodes answers an empty array
    source: https://docs.cloudamqp.com/openapi-instance.yaml
    fixture: empty
    request:
      method: GET
      path: /api/nodes
      headers:
        Authorization: "Basic OmNhdWxkcjBuLWNsb3VkYW1xcC1rZXk="
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
