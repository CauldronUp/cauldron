  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read, and a page of one is not the whole collection"
    source: "https://api.prod.koyeb.com/public.swagger.json"
    fixture: one-app
    request:
      method: GET
      path: "/v1/deployments"
      query:
        "service_id": "9b4e2f81-5a7c-4d90-8e3f-1c6b9a2d5f70"
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-koyeb-fixture-token-0000000000000000"
    expect:
      status: 200
      body:
        "deployments[0].id": "2e5c8b1a-9f3d-4c76-8a1e-5b0d3f7c2a91"
      absent:
        - "deployments[1]"

  # And the position. offset=1 answers a different record, which the
  # size alone cannot produce.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://api.prod.koyeb.com/public.swagger.json"
    fixture: one-app
    request:
      method: GET
      path: "/v1/deployments"
      query:
        "service_id": "9b4e2f81-5a7c-4d90-8e3f-1c6b9a2d5f70"
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-koyeb-fixture-token-0000000000000000"
    expect:
      status: 200
      body:
        "deployments[0].id": "a1c4e7b2-6d9f-4830-9b2e-7c1a5d8f3b60"
      absent:
        - "deployments[1]"

