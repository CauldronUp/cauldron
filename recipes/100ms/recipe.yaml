# 100ms Recipe for Cauldron
#
# 100ms is rooms and sessions, and the group's question is whether those are
# one record wearing two names or genuinely two. They are two: GET
# /v2/rooms/{id} and GET /v2/sessions/{id} answer with disjoint id spaces --
# a room's own id ("631a05390e6ffae22efa610b" in the retrieve-room worked
# example) never appears as a session id anywhere, and a session carries its
# own separate id ("63172c2d3e3d9fdb008322e1" in the retrieve-a-session
# worked example) plus a room_id field pointing back. GET /v2/sessions
# accepts a room_id filter, documented in as many words as narrowing "the
# list of active room sessions" to one room -- which only makes sense if one
# room can have many session records over its life, each one a fact about a
# particular span of occupancy rather than the room itself. Source:
# https://www.100ms.live/docs/server-side/v2/api-reference/Sessions/object
# and .../Sessions/retrieve-a-session.
#
# And a room's own "enabled" is not the same fact as any session's "active".
# Room.enabled is a standing, forward-looking permission -- the disable/enable
# reference states it plainly: "If you disable a room, that room can be used
# for only the current session and users will not be able to join the room
# later" -- while Session.active answers a narrower question, whether that
# one particular occupancy span is still open. A room can be enabled: true
# with zero sessions ever run in it, or with every session it ever had
# already active: false -- occupied once, now empty, and nothing about the
# room record itself changes when the last peer leaves. GET /v2/rooms/{id}
# answers the same shape either way: an empty, currently-unoccupied room and
# one mid-session are the identical response shape, distinguished only by
# asking a session, never by asking the room. A room that has never existed
# at all is the one case this Recipe could not observe directly -- see the
# fidelity gaps -- but it is a route this API declares (GET on an id nothing
# seeds), addressed the ordinary way, which a room with zero sessions is not:
# the empty room answers 200 with its own record, and only a genuinely
# unknown id would 404 at all.
#
# Set this beside the group's other two providers. Whereby, the control,
# answers a room's create with "no state, no status and no phase anywhere in
# it" and deletes the room itself on a clock the create request sets (see
# recipes/whereby/recipe.yaml). TalkJS's conversation exists the moment PUT
# answers and "is not the same fact" as being visible to anyone, forever,
# with no expiry stated anywhere its own reference discusses (see
# recipes/talkjs/recipe.yaml). 100ms is a third arrangement again: POST
# /v2/rooms answers 200 with enabled: true stamped on it from the first
# instant -- real state, unlike Whereby -- and nothing here expires on a
# clock at all. There is no DELETE /v2/rooms/{id} anywhere in 100ms's own
# reference -- checked by reading every page under the Rooms and Sessions
# categories in its published sitemap, and the only mutation past create is
# disable/enable. A created room, unlike a Whereby meeting, is permanent:
# the closest thing to undoing it is POST /v2/rooms/{id} with
# {"enabled": false}, and per the provider's own words above that does not
# undo anything already in progress, only refuses what has not started yet.
#
# Room codes are 100ms's answer to the URL a caller shares to join, and they
# answer the group's "commit and undo" question a third way again. Where
# Whereby mints one unsigned URL good for anyone, POST
# /v2/room-codes/room/{room_id} mints several codes in the SAME call, one per
# role defined on the room's template ("wpi-srjb-wer" for host, "dfj-ewbe-oqw"
# for guest, in the endpoint's own worked example) -- a room's join links are
# plural and role-scoped from the moment they exist, not one link everyone
# shares. And a code's own "enabled" is a THIRD independent toggle, apart
# from the room's and apart from any session's: the get-room-codes worked
# example shows a host code enabled: true sitting beside a guest code
# enabled: false on the identical room, at the identical moment -- one role's
# door closed, the room and the other role's door both untouched. This
# Recipe does not model the create-room-codes route -- see the fidelity
# gaps, on why a call that mints several records at once does not fit this
# format's single-resource create -- but the independently-toggled pair is
# read straight from that worked example and served as this Recipe's own
# fixture.
#
# Credentials, checked live against api.100ms.live with no account, no key
# ever created, and JWTs assembled to have the right shape and nothing else:
# every one of them named "Token validation error" at the top and a REAL
# credential library underneath it, distinguishable by how deep the check
# went before it gave up.
#
#   nothing sent, or "Authorization: junktoken12345" with no Bearer prefix,
#   or "Bearer " with nothing after it
#     -> details: ["Token is not provided"], < 2ms
#
#   Bearer junktoken12345 (present, not JWT-shaped: no dots)
#     -> details: ["token contains an invalid number of segments"], < 2ms
#
#   Bearer <3 segments, middle one not valid base64 JSON>
#     -> details: ["invalid character 'i' looking for beginning of value"], 1ms
#
#   Bearer <valid JWT shape, claims decode, access_key "junk">
#     -> details: ["invalid id"], < 2ms
#
#   Bearer <valid JWT shape, access_key a syntactically plausible 24-hex id>
#     -> details: ["not found"], 221ms (x-envoy-upstream-service-time)
#
# Five distinct sentences from one credential, and the last pair is the
# clearest evidence in this whole task: "invalid id" answers in the same
# sub-millisecond window as every syntactic failure above it, and "not found"
# alone costs 221ms, a hundred times longer -- the one credential shaped
# well enough to reach an actual database lookup, and the only one that pays
# for it. This format's own verdict mechanism has three buckets --
# auth.absent_error, auth.malformed_error, auth.rejected_error -- and no
# `pattern` this Recipe could declare captures four of these five sentences
# at once, because Cauldron's own credential check treats a declared pattern
# as accept-or-reject on the shape alone (see internal/runtime/auth.go): a
# Recipe naming both a pattern and a keys list cannot ask for "the right
# shape, and still checked against a list" the way 100ms's real pipeline
# does. absent_error and malformed_error both name the same entry below --
# "Token is not provided" answered a missing header, a header with no Bearer
# prefix, and Bearer with nothing after it identically, struck live all
# three ways -- and rejected_error names the deepest tier reached, "not
# found", because a credential a real integration sends is closer in shape
# to a plausible id than to a stray string with no dots in it. The three
# tiers between are recorded here, verified live, and not independently
# representable.
#
# Routing answers a sixth combination this collection has not recorded
# before. Struck live, no credential: PATCH and DELETE on /v2/rooms, a real
# path with the wrong method, both answered the identical 401 "Token is not
# provided" that GET and POST on the same path do -- the credential is still
# checked. GET on /v2/no-such-route-xyz, a path this API does not have,
# answered 404 with an empty body and no Content-Type at all, and the
# identical 404 came back with a wrong bearer token attached -- the
# credential is never reached at all. auth.go's own comment names five
# arrangements it has already seen and says a sixth belongs in its own
# Recipe's header rather than forced into the boolean: this is that sixth
# one, path-existence gates the credential check and method does not, and it
# is the reverse of CloudTalk's pairing in that same list (credential before
# an unrouted path, method skips the credential) -- 100ms checks the
# credential before a wrong method and skips it for an unrouted path, the
# opposite pairing from the one already on record. Cauldron's own
# after_routing flag ties both halves of routing, path and method, to one
# joint match, which cannot reproduce "method never matters, path always
# does" without declaring a route per method this Recipe was never able to
# credential-test in the first place. The choice made here is the plainer
# claim: auth.after_routing is left at its default, so every request is
# credentialed first regardless of path -- correct for all four live method
# probes on a real path, the more common shape of mistake an integration
# actually makes -- and the single unrouted-path 404 is reproduced with a
# valid credential sent, the same workaround recipes/rootly/recipe.yaml uses
# for the identical tension, carrying no verified date because that exact
# credentialed request was never the one struck live.
#
# Two more places 100ms's own published pages disagree with themselves,
# found by reading three worked examples side by side rather than any one in
# isolation:
#
#   - Session.peers is documented in prose, on the Session object page, as
#     "Array of peer objects". Both worked JSON examples this Recipe found
#     for a session -- retrieve-a-session and list-sessions -- show peers as
#     an OBJECT keyed by each peer's own uuid, not an array at all. This
#     Recipe follows the two examples over the one sentence, the same
#     precedence recipes/vultr/recipe.yaml's own header states for the same
#     kind of conflict, and types peers as a map rather than a list.
#   - The Room object carries a different field set on every one of the
#     three pages that show a worked example. create-via-api's response
#     carries app_id and template, and neither field appears on
#     retrieve-room's or disable-or-enable's. disable-or-enable's carries
#     recording_source_template, enabled_source_template, recording and
#     customer (a deprecated alias for customer_id, per its own name),
#     absent from the other two. retrieve-room's alone carries a populated
#     recording_info.upload_info. Three pages, three field sets, for what
#     the reference calls the same object -- recorded here rather than
#     merged into one invented shape.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no management token was ever
#     requested, guessed or used. Every 200 below is read from
#     www.100ms.live's published API reference and carries no verified date;
#     every credential and routing case below (bar the one workaround noted
#     above) was struck live with no account and carries today's date.
#   - POST /v2/room-codes/room/{room_id} is not routed. It mints one code
#     per role defined on the room's template in a single call and answers
#     an array, not the single freshly-identified record Cauldron's create
#     operation is built to hand back -- the same mismatch
#     recipes/whereby/recipe.yaml states for its own create route not
#     reshaping a caller's request the way the real one does, one step
#     further: there, one record comes back different; here, an unknown
#     number of them would. GET /v2/room-codes/room/{room_id} (list) is
#     routed instead, seeded with the get-room-codes reference's own worked
#     pair.
#   - Of the Room object's documented fields this Recipe declares id, name,
#     enabled, description, template_id, region, large_room, created_at and
#     updated_at. recording_info, size, max_duration_seconds, polls and
#     webhook are real, documented fields and none of them are typed here.
#   - Of the Session object's documented fields this Recipe declares id,
#     room_id, customer_id, active, peers, created_at and updated_at. The
#     nested peer object's own fields (name, role, user_id, joined_at,
#     left_at) are carried as raw map entries rather than declared
#     individually.
#   - A room id nothing seeds (GET /v2/rooms/{bad-id}, credentialed) is left
#     to Cauldron's own generic resource_missing fallback. No worked 404 body
#     for this case appears on any page this Recipe read.
#   - update-a-room's own documented fields beyond enabled (name, description,
#     region, and the rest) are not exercised; only the disable/enable toggle
#     is, because it is the one mutation 100ms's own reference discusses in
#     terms of what it does and does not undo.
#   - Webhooks (100ms sends its own event catalogue on room and session
#     lifecycle changes) are a real, documented part of this API and are not
#     modelled at all; this Recipe is scoped to what the group's question
#     turns on.
#   - No upstream.spec. www.100ms.live/docs references a Postman collection
#     for its server-side API rather than serving an OpenAPI document at any
#     conventional path this task probed (openapi.json under api.100ms.live,
#     under the docs site's server-side/v2 path, and at the docs site's own
#     root all 404).
#
# The token below is a fixture and belongs to no account.

recipe: 100ms
capability: voice
version: 0.1.0

upstream:
  api: v2
  docs: https://www.100ms.live/docs/server-side/v2/introduction/basics

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-hundredms-fixture-management-token-000000000000000000000000000000000000000000
  # Missing, no-prefix and empty-after-prefix all answered "Token is not
  # provided" live -- see the header. The four tiers a *presented* credential
  # can fail at (wrong segment count, unparsable claims, a malformed id, a
  # well-shaped id that is not found) collapse to this one rejected_error,
  # named for the deepest tier this Recipe could reach without a real
  # account -- see the header for what that collapse leaves out.
  absent_error: token_not_provided
  malformed_error: token_not_provided
  rejected_error: token_not_found

responses:
  list:
    style: wrapped
    cursor_field: last
  resource:
    style: bare
  error:
    style: flat
    message_field: details[]
    code_field: code
    code_type: number
    type_field: "-"
    fields:
      message: Token validation error

resources:
  room:
    collection: data
    id:
      # "631a05390e6ffae22efa610b" in every worked example this Recipe
      # found -- a 24-character hex string, the shape of a MongoDB
      # ObjectId, though no page states a format for it beyond "string".
      style: opaque
    fields:
      name:
        type: string
      # The standing, forward-looking permission -- see the header for why
      # this is not the same fact as any session's active. Stamped true on
      # create's own worked example from the first instant.
      enabled:
        type: boolean
        default: true
      description:
        type: string
        default: ""
      template_id:
        type: string
        null_when_unset: true
      region:
        type: string
        null_when_unset: true
      large_room:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime

  session:
    collection: data
    id:
      # "63172c2d3e3d9fdb008322e1" -- the identical 24-character hex shape
      # as a room id, and never the same value: a session's id space is its
      # own, and room_id is the field that points back.
      style: opaque
    fields:
      room_id:
        type: string
        required: true
      customer_id:
        type: string
      # Whether this one occupancy span is still open -- not whether the
      # room is usable. See the header.
      active:
        type: boolean
        default: false
      # A map keyed by peer uuid in both worked examples this Recipe found,
      # not the array the Session object page's own prose describes -- see
      # the header.
      peers:
        type: map
        default: {}
      created_at:
        type: datetime
      updated_at:
        type: datetime

  room_code:
    collection: data
    id:
      # Addressed by the code itself -- "wpi-srjb-wer" in the create
      # endpoint's own worked example -- the same choice
      # recipes/firehydrant/recipe.yaml makes for a severity with no
      # separate id field at all.
      style: opaque
      field: code
    fields:
      room_id:
        type: string
        required: true
      role:
        type: string
        required: true
      # A third, independent toggle -- apart from the room's own enabled and
      # apart from any session's active. See the header: the get-room-codes
      # worked example shows one role's code disabled while the room and the
      # other role's code are both untouched.
      enabled:
        type: boolean
        default: true
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: POST
    path: /v2/rooms
    resource: room
    operation: create

  - method: GET
    path: /v2/rooms/{id}
    resource: room
    operation: get

  - method: GET
    path: /v2/rooms
    resource: room
    operation: list
    pagination:
      # limit and start, from 100ms's own API reference read 2026-09-05:
      # "Determines the number of ... objects to be included in response.
      # Default : 10, Allowed values : Min : 10, Max : 100", and "start ...
      # Determines the starting point. last field of the response can be
      # used as start for the subsequent request."
      #
      # The **minimum** is the surprise. Most providers cap a page size;
      # this one also floors it, so a client asking for two rooms is
      # answered with ten and not told. max_limit can say the ceiling and
      # there is no key for a floor, so it is written here: asking for fewer
      # than ten does not get fewer than ten.
      #
      # The cursor is also not what it looks like. start takes the value of
      # the response's last field rather than a token the provider hands
      # over under that name, so a client looking for "next" or "cursor" in
      # the envelope finds neither.
      limit_param: limit
      cursor_param: start
      style: cursor
      limit: 10
      max_limit: 100

  # Disable/enable, the closest thing to undoing a create this API has --
  # see the header for what the provider's own words say this does and does
  # not affect.
  - method: POST
    path: /v2/rooms/{id}
    resource: room
    operation: update

  - method: GET
    path: /v2/sessions/{id}
    resource: session
    operation: get

  - method: GET
    path: /v2/sessions
    resource: session
    operation: list
    pagination:
      # limit and start, from 100ms's own API reference read 2026-09-05:
      # "Determines the number of ... objects to be included in response.
      # Default : 10, Allowed values : Min : 10, Max : 100", and "start ...
      # Determines the starting point. last field of the response can be
      # used as start for the subsequent request."
      #
      # The **minimum** is the surprise. Most providers cap a page size;
      # this one also floors it, so a client asking for two rooms is
      # answered with ten and not told. max_limit can say the ceiling and
      # there is no key for a floor, so it is written here: asking for fewer
      # than ten does not get fewer than ten.
      #
      # The cursor is also not what it looks like. start takes the value of
      # the response's last field rather than a token the provider hands
      # over under that name, so a client looking for "next" or "cursor" in
      # the envelope finds neither.
      limit_param: limit
      cursor_param: start
      style: cursor
      limit: 10
      max_limit: 100

  - method: GET
    path: /v2/room-codes/room/{room_id}
    resource: room_code
    operation: list
    scope: [room_id]
    pagination:
      # Still unnamed, and this is what was tried on 2026-09-05. 100ms
      # documents its Rooms and Sessions listings at
      # www.100ms.live/docs/server-side/v2/api-reference/{Rooms,Sessions}/
      # -- both settled above, limit and start, "Min : 10, Max : 100" -- and
      # every address this project could construct for the room-codes
      # listing answers 404, including the one the room-code page's own
      # anchor link points at.
      #
      # The neighbouring pair is very likely the same pair, because 100ms
      # uses one shape across its listings. "Very likely" is why nothing is
      # named here: copying a sibling's parameters onto a route is the
      # mistake this whole sweep keeps finding, and doing it deliberately
      # would be worse than doing it by accident.
      style: cursor
      limit: 20

errors:
  # Absent, no Bearer prefix, and Bearer-with-nothing-after all answered
  # this, live, in under 2ms. See the header.
  token_not_provided:
    status: 401
    code: 401
    message: Token is not provided

  # The deepest tier this Recipe could reach without a real account: a
  # syntactically valid JWT whose claims parse and whose access_key is
  # shaped like a real id, refused after a genuine lookup (221ms, not the
  # sub-millisecond shape-check every other tier answered in). See the
  # header for the three sentences between this and token_not_provided that
  # this format's three verdicts cannot carry at once.
  token_not_found:
    status: 401
    code: 401
    message: not found

fixtures:
  empty: {}

  small-account:
    room:
      # From the create-via-api reference's own worked example, quoted in
      # the header.
      - id: 631b2654f771854d9bf633df
        name: new-room-1662723668
        enabled: true
        description: This is a sample description for the room
        template_id: 63188115d11d6db790c73c60
        region: us
        large_room: false
        created_at: "2022-09-09T11:41:08.082Z"
        updated_at: "2022-09-09T11:41:08.074Z"
      # A second room, disabled -- from the disable-or-enable reference's
      # own worked example, quoted in the header for its own field set.
      - id: 6316d5cfae8c4271df5d0554
        name: new-room-1662440912
        enabled: false
        description: ""
        template_id: ""
        region: ""
        large_room: false
        created_at: "2022-09-06T05:08:31.935Z"
        updated_at: "2022-09-08T14:58:25.629Z"
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: 6316d5cfae8c4271df5d0555
        name: new-room-1662440912
        enabled: false
        description: ''
        template_id: ''
        region: ''
        large_room: false
        created_at: '2022-09-06T05:08:31.935Z'
        updated_at: '2022-09-08T14:58:25.629Z'

    session:
      # From the retrieve-a-session reference's own worked example.
      # Concluded (active: false) and, per the header, that says nothing
      # about whether the room itself is still enabled.
      - id: 63172c2d3e3d9fdb008322e1
        room_id: 631b2654f771854d9bf633df
        customer_id: 627cdddff2e4e30487862ad1
        active: false
        peers:
          2d873b0a-c2c9-41dc-ac72-c6ea9b2f2cc3:
            id: 2d873b0a-c2c9-41dc-ac72-c6ea9b2f2cc3
            session_id: 63172c2d3e3d9fdb008322e1
            name: Nixon K
            role: backstage
            user_id: Batch1-student
            joined_at: "2022-09-06T11:17:01.816Z"
            left_at: "2022-09-06T11:17:03.643Z"
        created_at: "2022-09-06T11:17:01.817Z"
        updated_at: "2022-09-06T11:17:03.65Z"

    room_code:
      # From the get-room-code-api reference's own worked example: one
      # role's code enabled, the other's not, on the identical room. See
      # the header.
      - code: hkj-sdf-fda
        room_id: 329d23d4f772854d9bf633df
        role: host
        enabled: true
        created_at: "2023-03-03T11:41:08.082Z"
        updated_at: "2023-03-03T11:41:08.082Z"
      - code: wiw-giw-bzs
        room_id: 329d23d4f772854d9bf633df
        role: guest
        enabled: false
        created_at: "2023-03-03T11:41:08.082Z"
        updated_at: "2023-03-03T11:41:08.082Z"

# Every case below carries source. A verified date means this Recipe called
# api.100ms.live with exactly the request shown and recorded exactly what
# came back; its absence means the case was read from
# www.100ms.live's published API reference and never called -- no account
# was ever created and no management token was ever requested, guessed or
# used.
conformance:
  - name: no credential at all names the shallowest tier
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/rooms
    expect:
      status: 401
      body:
        code: 401
        message: Token validation error
        "details[0]": Token is not provided

  - name: a header with no Bearer prefix reads the same as absent
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        "details[0]": Token is not provided

  - name: and so does Bearer with nothing after it
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        "details[0]": Token is not provided

  - name: a credential shaped well enough to be looked up gets a different sentence
    # Bearer eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJhY2Nlc3Nfa2V5Ijog
    # ImFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYSIsIC...9.bm90LWEtcmVhbC1zaWduYXR1cmUt
    # Ynl0ZXMtMDAwMDAw -- a syntactically valid JWT (three base64url
    # segments, valid JSON claims) whose access_key is a 24-character hex
    # string shaped like this API's own ids. It cost 221ms against the live
    # API, against under 2ms for every other credential struck -- see the
    # header. The token here is a fixture, not the one actually sent.
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: Bearer cauldron-hundredms-fixture-junk-jwt-000000000000000000
    expect:
      status: 401
      body:
        "details[0]": not found

  - name: a wrong method on a real path is still refused for its credentials
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v2/rooms
    expect:
      status: 401
      body:
        "details[0]": Token is not provided

  - name: a second wrong method confirms it, not a one-off
    source: https://api.100ms.live/v2/rooms
    verified: "2026-09-01"
