# HERE Geocoding & Search Recipe for Cauldron
#
# This Recipe, tomtom/recipe.yaml and what3words/recipe.yaml were written
# together as one group, on the same day, against the same question: all
# three carry their credential in the query string rather than a header, and
# the task that started them was what that means for the word
# "unauthenticated". Struck live, with no account and no key, against
# geocode.search.hereapi.com:
#
#   GET /v1/geocode                                    -> 401 {"error":"Unauthorized","error_description":"No credentials found"}
#   GET /v1/geocode?apiKey=junkkey12345                 -> 401 {"error":"Unauthorized","error_description":"apiKey invalid. apiKey not found."}
#   GET /v1/geocode?q=Berlin                            -> 401, byte-identical to the first
#   GET /v1/geocode?q=Berlin&apiKey=junkkey12345         -> 401, byte-identical to the second
#
# **Missing and wrong are not the same sentence here**, which answers the
# task's own question directly: an absent apiKey is not folded into the same
# "invalid" bucket a present-but-wrong one gets. Both are still 401 -- this is
# not TomTom's split of status codes, see tomtom/recipe.yaml -- but the prose
# differs every time, checked four separate ways above, and whether `q` was
# present or not never changed which of the two sentences came back. HERE
# checks the credential first and never lets a caller learn anything about
# its own query -- not even that `q` was missing -- until a key that exists
# is presented. That is the opposite of what US Census's Recipe elsewhere in
# this collection found for a different query-string-keyed API: Census's
# omitting `get` gets a 400 *before* the key gate fires, so leaving out the
# parameter that makes a request one is the only way to learn anything about
# it. HERE never opens that door at all.
#
# Cauldron's own credential check (internal/runtime/auth.go) now returns
# which way a check failed -- absent, malformed or rejected -- and a Recipe
# can name a different errors entry per verdict. That fits this finding
# exactly: `auth.rejected_error` names the "apiKey invalid" sentence for a
# key that is present and wrong, and the plain default covers "No credentials
# found" for a key that never arrived. Nothing here needed arming.
#
# **A wrong path outranks a wrong key, unconditionally, and so does a wrong
# method** -- the opposite ordering from the credential check itself, struck
# four more ways, no key required for any of them:
#
#   GET  /v1/totally-bogus-endpoint                     -> 404 {"error":"Resource not Found","error_description":"Requested resource not found"}
#   GET  /v1/totally-bogus-endpoint?apiKey=junkkey12345  -> 404, byte-identical
#   POST /v1/geocode                                     -> 405 {"error":"Method not allowed for this action","error_description":"Method not allowed for this action"}
#   POST /v1/geocode  (no apiKey at all)                 -> 405, byte-identical
#
# A path this host has no route for, and a method it does not accept on a
# path it does, both answer without ever once mentioning the credential --
# not "no credentials found", not "invalid" -- checked with a key present,
# checked with none, no difference. That makes HERE closer to Rootly than to
# FireHydrant among this collection's other Recipes: Rootly's router answers
# an unrouted path before its auth check ever runs; FireHydrant's auth check
# runs first for absolutely everything. HERE's ordering is Rootly's, and the
# same consequence follows. Cauldron's own request pipeline
# (internal/runtime/handler.go) checks the credential once, unconditionally,
# before the router is ever consulted -- so reaching either 404 or 405 shape
# through this emulator needs a credential this Recipe accepts, which is a
# call the live host never received with one. Both conformance cases below
# for these two shapes carry the real, live-observed status and body and
# carry no `verified` date, for exactly that reason -- the same trade-off
# Rootly's own Recipe states for its own unrouted-path case.
#
# One more asymmetry worth pinning precisely: Cauldron's own 405 handling
# always adds a real `Allow` header naming the methods a path does accept.
# HERE's live 405 carries no `Allow` header at all -- confirmed by reading
# the raw header list on the response, twice, with and without a key. The
# emulator is more informative here than the provider it is standing in for,
# which is worth stating plainly rather than leaving an unexplained header a
# real client would never see.
#
# **The two products on this host answer the credential question
# identically**, which is the comparison the task asked this Recipe to make
# against Mezmo's Recipe in this collection, and it is worth stating
# precisely because the answer is not the same shape of finding. Mezmo's two
# hosts (logs.mezmo.com and api.mezmo.com) run two unrelated credential
# schemes end to end and resolve routing against auth in opposite orders.
# HERE's two products -- geocode.search.hereapi.com (this Recipe) and
# router.hereapi.com, the Routing v8 API -- share one scheme (apiKey in the
# query string) and one gateway, and every failure shape above was struck
# against both hosts and came back byte-identical on router.hereapi.com too:
#
#   GET router.hereapi.com/v8/routes                                            -> 401, byte-identical "No credentials found"
#   GET router.hereapi.com/v8/routes?apiKey=junkkey12345                        -> 401, byte-identical "apiKey invalid. apiKey not found."
#   GET router.hereapi.com/v8/bogus-route                                       -> 404, byte-identical "Resource not Found"
#   PUT/PATCH/DELETE router.hereapi.com/v8/routes                               -> 405, byte-identical "Method not allowed for this action"
#
# One method does not agree, though, and it is the only divergence this
# Recipe found between the two products: POST to router.hereapi.com/v8/routes
# answers 401 ("No credentials found"), not 405 -- the gateway treats POST as
# a registered method on that path (the Routing API's own reference
# describes no POST operation for /v8/routes, so this is most likely the
# shared gateway's own generic allowlist rather than anything Routing itself
# does with a POST body) while the identical POST to this Recipe's own
# /v1/geocode is the 405 case pinned above. TomTom's Recipe in this
# collection finds the same shape of split between its own two products --
# POST reaching a gateway's generic auth gate while PUT and DELETE never do
# -- on one host rather than two, which is what makes the comparison worth
# having in both files rather than one: two different vendors, two different
# specific verbs, the same structural trap. router.hereapi.com is not routed
# by this Recipe: it is a separate hostname, and Mezmo's Recipe in this
# collection already states why a second host with a scheme this format can
# still describe is recorded as evidence in a header rather than mounted as
# routes of its own -- there, the reason was an incompatible scheme; here it
# is simply that a Recipe describes one upstream host, and this Recipe's
# upstream is the Geocoding & Search API.
#
# **A third, unwired credential scheme exists on this exact host and is
# worth naming rather than silently absorbing.** `apiKey` sent as a header
# instead of a query parameter is not recognised at all -- it answers the
# identical "No credentials found" a request with nothing does, confirming
# the query string really is the only place this parameter is read from, the
# structural fact this whole group of Recipes exists to pin. But
# `Authorization: Bearer <anything>` is read and produces a third sentence
# entirely: {"error":"Unauthorized","error_description":"Token Validation
# Failure - unrecognized kid null"}, live-observed with a plain garbage
# token. HERE's Geocoding & Search API accepts OAuth2 JWTs as an alternative
# to an apiKey, per its own published documentation, and this Recipe does not
# wire it: Cauldron's auth scheme is one mechanism per Recipe, and apiKey is
# the one this task is about. Recorded here as a live finding rather than a
# route.
#
# The success path could not be built from anything this Recipe actually
# saw. Every route on this host needs a key this project was never going to
# request, and HERE's own reference documentation -- the OpenAPI-derived
# schema published at docs.here.com -- declares the shape of a geocode result
# (items[], each with title, id, resultType, address, position, mapView,
# scoring) without a single worked example carrying real values anywhere
# this Recipe could find, across three separate documentation pages read for
# exactly that. Rather than invent a title, an address label or a
# lat/lng pair no request ever produced, the fields below are declared from
# that schema and the one fixture is empty: the only 200 conformance case
# this Recipe makes is that an authenticated request answers a list wrapped
# under "items", proven with zero entries in it rather than entries this
# Recipe made up. See tomtom/recipe.yaml for the same city of documentation
# answering the opposite way -- a real worked example, quoted rather than
# guessed.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no apiKey was ever requested, guessed
#     or used. Every 401 below is struck live and carries a verified date;
#     the 404 and 405 cases are live-observed shapes reached through this
#     emulator with a credential the live host never needed, and carry none;
#     the one 200 case proves an envelope, not a record, for the reason
#     above.
#   - The OAuth2 Bearer scheme described above is not wired. A client
#     authenticating that way against this emulator is refused with the
#     apiKey scheme's own sentence, not the JWT one HERE's real gateway
#     sends.
#   - router.hereapi.com (Routing v8) is not routed. See above.
#   - Of the documented result fields this Recipe declares a representative
#     dozen: title, resultType, and the address, position, mapView and
#     scoring sub-objects it nests them under. access, categories, contacts,
#     openingHours, chargingStation and every other per-resultType extension
#     HERE's schema documents are entirely absent.
#   - No rate-limit header was seen on any response this Recipe struck, 401,
#     404 or 405, so none is declared. That is an absence in what was
#     observed, not a claim that this host never sends one.
#   - No fetchable OpenAPI or Swagger document was found at a stable URL for
#     this API; docs.here.com serves the schema piecemeal through per-endpoint
#     reference pages rather than one machine-readable file. upstream.spec is
#     not recorded for that reason.
#
# The key below is a fixture and belongs to no account.

recipe: here
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.here.com/geocoding-and-search/reference/get_geocode

auth:
  # In the query string, which is the structural fact this whole group of
  # Recipes exists to pin -- see the header. HERE's own gateway also accepts
  # an OAuth2 Bearer token on this exact host, live-confirmed and not wired;
  # see the header for why.
  scheme: query
  param: apiKey
  keys:
    - cauldron_here_fixture_apikey_00000000000000000
  # A key that is present and does not match gets HERE's own second sentence.
  # Absent falls through to the default authentication_error, whose wording
  # is already HERE's first one -- the same device FireHydrant's Recipe in
  # this collection uses for the identical shape of finding.
  rejected_error: invalid_api_key

responses:
  list:
    # No key here: geocode_result's own collection: items below already
    # names it, and this format reads that instead.
    style: wrapped
  resource:
    style: bare
  error:
    # {"error": "...", "error_description": "..."} on every failure this
    # Recipe struck -- a short code-like word in "error" and the actual
    # sentence in "error_description", both populated every time, never
    # RFC 7807's type/title/detail. See tomtom/recipe.yaml for the provider
    # in this group whose 404 really is RFC 7807-shaped.
    style: flat
    message_field: error_description
    code_field: error

resources:
  geocode_result:
    collection: items
    id:
      # Documented only as a plain string, no format given anywhere in the
      # published schema -- the same gap Rootly's Recipe in this collection
      # names for its own incident id, and the same answer.
      style: opaque
    fields:
      title:
        type: string
      resultType:
        type: string
      address_label:
        type: string
        in: address
        as: label
      address_country_code:
        type: string
        in: address
        as: countryCode
      address_country_name:
        type: string
        in: address
        as: countryName
      address_city:
        type: string
        in: address
        as: city
      address_street:
        type: string
        in: address
        as: street
      address_house_number:
        type: string
        in: address
        as: houseNumber
      address_postal_code:
        type: string
        in: address
        as: postalCode
      # lat/lng, not lat/lon -- see tomtom/recipe.yaml, whose own documented
      # example spells the same pair "lon".
      position_lat:
        type: number
        in: position
        as: lat
      position_lng:
        type: number
        in: position
        as: lng
      map_view_west:
        type: number
        in: mapView
        as: west
      map_view_south:
        type: number
        in: mapView
        as: south
      map_view_east:
        type: number
        in: mapView
        as: east
      map_view_north:
        type: number
        in: mapView
        as: north
      scoring_query_score:
        type: number
        in: scoring
        as: queryScore

routes:
  - method: GET
    path: /v1/geocode
    resource: geocode_result
    operation: list

errors:
  # The default, absent-credential shape. Already HERE's own first sentence,
  # so auth.rejected_error is the only override this Recipe needs -- see the
  # header and the auth block above.
  authentication_error:
    status: 401
    code: Unauthorized
    message: No credentials found

  invalid_api_key:
    status: 401
    code: Unauthorized
    message: "apiKey invalid. apiKey not found."

  # Overrides Cauldron's own built-in name so a routing miss gets HERE's own
  # wording rather than the runtime's generic default -- the same device
  # Turso's and Census's Recipes in this collection use for the identical
  # purpose.
  unknown_route:
    status: 404
    code: Resource not Found
    message: Requested resource not found

  # See the header for the Allow-header asymmetry: HERE's own 405 carries
  # none, and Cauldron's built-in handling always adds one naming the
  # methods this Recipe declares.
  method_not_allowed:
    status: 405
    code: Method not allowed for this action
    message: Method not allowed for this action

fixtures:
  empty: {}

conformance:
  - name: no credential at all answers one sentence
    source: https://geocode.search.hereapi.com/v1/geocode
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/geocode
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error: Unauthorized
        error_description: No credentials found

  - name: a key that is present and wrong answers a different one
    source: https://geocode.search.hereapi.com/v1/geocode?apiKey=junkkey12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/geocode?apiKey=junkkey12345
    expect:
      status: 401
      body:
        error: Unauthorized
        error_description: "apiKey invalid. apiKey not found."

  - name: a real query parameter never gets a chance to matter
    # q=Berlin changes nothing: the credential is checked before anything
    # about the query is examined, missing or not. Compare US Census's
    # Recipe in this collection, where the opposite is true -- leaving off
    # the query parameter is the only way past its own key gate.
    source: https://geocode.search.hereapi.com/v1/geocode?q=Berlin&apiKey=junkkey12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/geocode?q=Berlin&apiKey=junkkey12345
    expect:
      status: 401
      body:
        error: Unauthorized
        error_description: "apiKey invalid. apiKey not found."

  - name: an unrouted path outranks the credential entirely
    # Struck live with no key and with a wrong one -- both answered this
    # exact body, meaning HERE's router refuses the path before its own auth
    # check ever runs. Reaching that shape through Cauldron needs a
    # credential this Recipe accepts, because this runtime's own check is
    # unconditional -- see the header, and see rootly/recipe.yaml for the
    # same trade-off over the same kind of finding.
    source: https://geocode.search.hereapi.com/v1/totally-bogus-endpoint
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-endpoint?apiKey=cauldron_here_fixture_apikey_00000000000000000
    expect:
      status: 404
      body:
        error: Resource not Found
        error_description: Requested resource not found

  - name: a wrong method outranks the credential too, and carries no Allow header on the real host
    # Struck live both with no key and with a wrong one -- identical body
    # either way. See the header for the Allow-header gap this emulator
    # cannot help but introduce.
    source: https://geocode.search.hereapi.com/v1/geocode
    fixture: empty
    request:
      method: POST
      path: /v1/geocode?apiKey=cauldron_here_fixture_apikey_00000000000000000
    expect:
      status: 405
      body:
        error: Method not allowed for this action
        error_description: Method not allowed for this action

  - name: with no worked example anywhere, the only claim made about a 200 is its envelope
    # See the header: three documentation pages read, no worked example
    # found. This proves items wraps a list rather than inventing what would
    # be inside one.
    source: https://docs.here.com/geocoding-and-search/reference/get_geocode
    fixture: empty
    request:
      method: GET
      path: /v1/geocode?q=Berlin&apiKey=cauldron_here_fixture_apikey_00000000000000000
    expect:
      status: 200
      body:
        items: []
