# Mercado Libre Recipe for Cauldron
#
# The endpoints this Recipe was sent to compare cannot be fetched at all.
#
#   GET /sites        -> 403 {"code":"PA_UNAUTHORIZED_RESULT_FROM_POLICIES",
#                              "message":"At least one policy returned UNAUTHORIZED.",
#                              "status":403,"blocked_by":"PolicyAgent"}
#   GET /sites/MLA     -> the same 403, byte-for-byte
#   GET /sites/MLB     -> the same 403, byte-for-byte
#   GET /currencies    -> the same 403, byte-for-byte
#   GET /users/me      -> the same 403, byte-for-byte, with no credential sent
#
# api.mercadolibre.com documents /sites and /currencies as public and
# keyless, and on 2026-08-31 they were reachable from a browser and blocked
# from this checkout: a "PolicyAgent" in front of the API answers every one
# of them -- the marketplace list, both named countries, the currency
# catalogue, and even the OAuth-only /users/me asked with no token at all --
# with the identical 403 above. Argentina and Brazil were the two sites this
# Recipe was asked to diff field by field, and the honest finding is that the
# diff is unobservable: whatever shape /sites/MLA and /sites/MLB carry, this
# vantage point cannot see it, and a Recipe claiming otherwise would be
# describing a screenshot rather than a response. No token was requested or
# used to try to get past it.
#
# **What is reachable tells its own regional story.** /categories/{id} and
# /countries/{id} are not behind the block, and between them they carry the
# shape-by-region finding this project exists to catch, just on different
# resources than the brief named:
#
#   category MLA1051 (root, Argentina): settings.vertical is the string
#     "consumer_electronics" and settings.sub_vertical is
#     "cellphones_telephones".
#   category MLB1051 (the same category, Brazil): settings.vertical is null
#     and settings.sub_vertical is null.
#
# Same category, same two keys, one country sends strings and the other
# sends null in their place. A client reading category.settings.vertical.length
# works in Argentina and throws in Brazil.
#
# Written against the live API rather than a document: every case below was
# checked against api.mercadolibre.com on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. permalink depends on depth, not region. A root category
#      (path_from_root has one entry) carries a real URL; a category
#      anywhere beneath the root (path_from_root has more than one) carries
#      permalink: null. MLA1051 has a permalink; MLA1051's own child MLA3502,
#      one level down, has null.
#   2. A category miss echoes the exact string sent, case included: asking
#      for NOTACATEGORY answers "Category not found: NOTACATEGORY" and
#      asking for the lowercase mla1051 -- a real id, wrong case -- answers
#      "Category not found: mla1051" rather than finding the category.
#   3. A country miss does not echo anything. /countries/ZZ answers the
#      constant "Country not found", with no ZZ anywhere in the sentence,
#      from what is otherwise the identical envelope -- message, error,
#      status, cause -- that the category failure above uses.
#   4. There are two unrelated 404 shapes on this host. A site id that names
#      nothing (/sites/ZZZZZ, itself not blocked) answers
#      {"error": "resource not found", "message": "..."} -- no status field
#      in the body at all, and a literal space after the first colon that
#      the rest of this API's JSON does not have anywhere else. A category or
#      country miss answers {"message", "error", "status", "cause"} from a
#      different service, with a normal Content-Type charset the first shape
#      lacks.
#   5. The collection and the record disagree about how much of a country
#      that word means. GET /countries answers a bare array of four fields
#      per entry -- id, name, locale, currency_id. GET /countries/AR answers
#      eleven, adding site, both separator characters, both time zone
#      fields, geo_information and the full list of states. Code that reads
#      country.site off a list entry finds nothing, because the collection
#      was never asked to carry it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - /sites, /sites/{id}, /sites/{id}/categories, /sites/{id}/listing_types
#     and /currencies are all documented as public and were all blocked at
#     the point this Recipe was written, so none of them is modelled as a
#     resource here -- only as the failure that was actually observed. If
#     the block lifts, every one of these deserves a real fixture.
#   - /sites/{id}/payment_methods is served (200, a bare array) and is not
#     modelled, because its own "id" field is not unique: MLA's list answers
#     "master" twice, once with payment_type_id credit_card and once with
#     prepaid_card, and "visa" three times across debit_card, credit_card
#     and prepaid_card. Cauldron keys a resource's records by id.field in a
#     single map, and seeding two records under the same id would silently
#     keep only the second. The real identity here is the pair (id,
#     payment_type_id), which nothing in this format has a way to say --
#     recorded rather than forced.
#   - OAuth-only endpoints (orders, items a user owns, /users/me) are out of
#     scope on principle: no token was requested or used, and what little
#     was observed of them (/users/me with no Authorization header) answered
#     the same PolicyAgent block as everything else, so even the shape of a
#     genuine 401 is unconfirmed from here.
#   - children_categories is trimmed to three entries per category, and
#     states to what a case needs; every entry kept is copied verbatim from
#     the response, not re-derived.

recipe: mercadolibre
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.mercadolibre.com

auth:
  # Every route this Recipe models is documented public and keyless. Routes
  # requiring OAuth exist on this API and are out of scope: see the header.
  scheme: none

responses:
  error:
    style: flat
    message_field: message

resources:
  category:
    id:
      # MLA (Argentina) and MLB (Brazil) are the two prefixes this fixture
      # data carries; the real API mints one of these per marketplace and
      # there are more than two marketplaces.
      prefix: MLA
      other_prefixes:
        - MLB
    fields:
      name:
        type: string
      picture:
        type: string
      # A URL on a root category (path_from_root has one entry) and null on
      # every category beneath it.
      permalink:
        type: string
      total_items_in_this_category:
        type: integer
      path_from_root:
        type: list
      children_categories:
        type: list
      attribute_types:
        type: string
      # vertical and sub_vertical live in here, and are strings in one
      # country's tree and null in another's for the same category id.
      settings:
        type: map
      channels_settings:
        type: list
      # Observed null on every category this Recipe fetched; its populated
      # type is not confirmed from here.
      meta_categ_id:
        type: string
      attributable:
        type: boolean
      date_created:
        type: datetime

  country:
    id:
      style: opaque
    fields:
      name:
        type: string
      locale:
        type: string
      site:
        type: string
      currency_id:
        type: string
      decimal_separator:
        type: string
      thousands_separator:
        type: string
      time_zone:
        type: string
      time_zone_name:
        type: string
      geo_information:
        type: map
      states:
        type: list

  # The same country, thinner. GET /countries answers this shape; GET
  # /countries/{id} answers `country` above. Two resources because the two
  # routes answer two different sets of fields for what a client would call
  # the same record, the same reading recorded for Open Library's bibentry
  # and edition.
  country_summary:
    id:
      style: opaque
    fields:
      name:
        type: string
      locale:
        type: string
      currency_id:
        type: string

routes:
  - method: GET
    path: /categories/{id}
    resource: category
    operation: get
    not_found: category_not_found
    headers:
      Content-Type: application/json; charset=utf-8

  - method: GET
    path: /countries/{id}
    resource: country
    operation: get
    not_found: country_not_found
    headers:
      Content-Type: application/json; charset=utf-8

  - method: GET
    path: /countries
    resource: country_summary
    operation: list
    list:
      style: bare
    headers:
      Content-Type: application/json; charset=utf-8

  # Every one of the six routes below is documented public and answered the
  # identical PolicyAgent block, or the identical unmatched-site 404, on
  # every attempt made while writing this Recipe. Each is a literal path
  # rather than a template, because the failure does not depend on the id --
  # a real one and a bogus one inside /currencies get the same 403, and only
  # /sites tells them apart.
  - method: GET
    path: /sites
    error: policy_agent_block

  - method: GET
    path: /sites/MLA
    error: policy_agent_block

  - method: GET
    path: /sites/MLB
    error: policy_agent_block

  # A site id naming nothing real is not blocked. It reaches a different
  # service and gets a different, unrelated 404.
  - method: GET
    path: /sites/ZZZZZ
    error: site_not_found

  - method: GET
    path: /currencies
    error: policy_agent_block

  - method: GET
    path: /currencies/ARS
    error: policy_agent_block

errors:
  # The block. Every field here, including the space after the first colon
  # nowhere else on this host has, was copied from the live response.
  policy_agent_block:
    status: 403
    message: At least one policy returned UNAUTHORIZED.
    headers:
      Content-Type: application/json
      x-policy-agent-block-code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
      x-policy-agent-block-reason: At least one policy returned UNAUTHORIZED.
    fields:
      code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
      status: 403
      blocked_by: PolicyAgent

  # A different service, a different shape: no status field in the body,
  # and a literal space after "error":.
  site_not_found:
    status: 404
    message: 'Si quieres conocer los recursos de la API que se encuentran disponibles visita el Sitio de Desarrolladores de MercadoLibre (http://developers.mercadolibre.com)'
    headers:
      Content-Type: application/json
      Cache-Control: no-cache
    fields:
      error: 'resource not found'

  # {detail} is the exact path segment sent, case included: a category
  # miss echoes it, which is the finding the case below pins.
  category_not_found:
    status: 404
    message: 'Category not found: {detail}'
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      error: not_found
      status: 404
      cause: []

  # The same four keys as category_not_found, and no echo: the sentence is
  # a constant regardless of what was asked for.
  country_not_found:
    status: 404
    message: Country not found
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      error: not_found
      status: 404
      cause: []

