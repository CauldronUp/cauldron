conformance:
  - name: the marketplace list is blocked before any auth check runs
    source: https://api.mercadolibre.com/sites
    verified: "2026-08-31"
    request:
      method: GET
      path: /sites
    expect:
      status: 403
      headers:
        x-policy-agent-block-code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
        x-policy-agent-block-reason: At least one policy returned UNAUTHORIZED.
      body:
        code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
        message: At least one policy returned UNAUTHORIZED.
        status: 403
        blocked_by: PolicyAgent

  - name: naming Argentina by id changes nothing
    source: https://api.mercadolibre.com/sites/MLA
    verified: "2026-08-31"
    request:
      method: GET
      path: /sites/MLA
    expect:
      status: 403
      body:
        code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
        blocked_by: PolicyAgent

  - name: and Brazil is blocked identically -- the regional diff this Recipe was asked to make is unobservable
    source: https://api.mercadolibre.com/sites/MLB
    verified: "2026-08-31"
    request:
      method: GET
      path: /sites/MLB
    expect:
      status: 403
      body:
        code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
        blocked_by: PolicyAgent

  - name: an id naming no real site is not blocked, it 404s instead
    source: https://api.mercadolibre.com/sites/ZZZZZ
    verified: "2026-08-31"
    request:
      method: GET
      path: /sites/ZZZZZ
    expect:
      status: 404
      body:
        error: resource not found
      matches:
        message: '^Si quieres conocer los recursos'
      absent_headers:
        - x-policy-agent-block-code

  - name: the currency catalogue is blocked the same way
    source: https://api.mercadolibre.com/currencies
    verified: "2026-08-31"
    request:
      method: GET
      path: /currencies
    expect:
      status: 403
      body:
        code: PA_UNAUTHORIZED_RESULT_FROM_POLICIES
        blocked_by: PolicyAgent

  - name: and a currency that genuinely exists is blocked too, not just the collection
    source: https://api.mercadolibre.com/currencies/ARS
    verified: "2026-08-31"
    request:
      method: GET
      path: /currencies/ARS
    expect:
      status: 403
      body:
        message: At least one policy returned UNAUTHORIZED.
        status: 403

  - name: a root category carries a permalink and a country-specific vertical
    source: https://api.mercadolibre.com/categories/MLA1051
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /categories/MLA1051
    expect:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        name: Celulares y Teléfonos
        permalink: https://www.mercadolibre.com.ar/c/celulares-y-telefonos
        total_items_in_this_category: 4602898
        "path_from_root[0].id": MLA1051
        "settings.currencies[0]": ARS
        "settings.vertical": consumer_electronics
        "settings.sub_vertical": cellphones_telephones
        "settings.minimum_price": 1000

  - name: the same category in Brazil sends null where Argentina sends a string
    source: https://api.mercadolibre.com/categories/MLB1051
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /categories/MLB1051
    expect:
      status: 200
      body:
        name: Celulares e Telefones
        "settings.currencies[0]": BRL
        "settings.vertical": null
        "settings.sub_vertical": null
        "settings.minimum_price": 0

  - name: one level under the root, permalink turns null and path_from_root grows
    source: https://api.mercadolibre.com/categories/MLA3502
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /categories/MLA3502
    expect:
      status: 200
      body:
        permalink: null
        "path_from_root[0].id": MLA1051
        "path_from_root[1].id": MLA3502

  - name: a category miss echoes the exact string sent
    source: https://api.mercadolibre.com/categories/NOTACATEGORY
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /categories/NOTACATEGORY
    expect:
      status: 404
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        message: 'Category not found: NOTACATEGORY'
        error: not_found
        status: 404

  - name: and the echo preserves case, so a real id in the wrong case still misses
    source: https://api.mercadolibre.com/categories/mla1051
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /categories/mla1051
    expect:
      status: 404
      body:
        message: 'Category not found: mla1051'

  - name: a country carries eleven fields a list entry does not
    source: https://api.mercadolibre.com/countries/AR
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /countries/AR
    expect:
      status: 200
      body:
        name: Argentina
        locale: es_AR
        site: MLA
        currency_id: ARS
        time_zone_name: America/Buenos_Aires
        "states[0].id": AR-B

  - name: and Brazil differs in value, not in shape
    source: https://api.mercadolibre.com/countries/BR
    verified: "2026-08-31"
    fixture: marketplace
    request:
      method: GET
      path: /countries/BR
    expect:
      status: 200
      body:
        locale: pt_BR
        site: MLB
        currency_id: BRL
        time_zone_name: America/Sao_Paulo
        "states[0].id": BR-AC

  - name: a country miss does not echo anything
    source: https://api.mercadolibre.com/countries/ZZ
    verified: "2026-08-31"
    fixture: marketplace
