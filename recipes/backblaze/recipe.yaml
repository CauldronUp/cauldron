  - name: S3 gateway -- a present, garbage Authorization header is a different status and a different Code
    # 400, not 403; AuthorizationHeaderMalformed, not AccessDenied -- the
    # opposite of the native pair above, which collapses this exact
    # distinction into one identical answer on the same account.
    source: https://s3.us-west-004.backblazeb2.com/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /
      headers:
        Authorization: junk
    expect:
      status: 400
      headers:
        Content-Type: application/xml
      body_matches: '<Code>AuthorizationHeaderMalformed</Code>\s*<Message>Authorization header must have type and credentials parts</Message>'

