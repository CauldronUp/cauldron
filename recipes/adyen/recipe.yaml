# Adyen Recipe for Cauldron
#
# Adyen has a test environment, and it is the good kind: a separate host, test
# cards, no real money. The reason to emulate it anyway is that the test
# environment is shared infrastructure on someone else's schedule. It has
# maintenance windows, it rate limits, it is slow enough that a payment suite
# doubles a build's runtime, and the card numbers that produce the interesting
# refusals change. A CI job that cannot run offline cannot run on a laptop with
# no network, and a test suite that depends on Adyen being up fails for reasons
# that have nothing to do with the code under test.
#
# Four things worth modelling exactly:
#
#   1. resultCode is spelled the British way. "Authorised", not "authorized".
#      Code ported from a provider that spells it the other way compares
#      against a string Adyen never sends, so every payment reads as failed.
#   2. resultCode has twelve values and only one of them is success. Three of
#      the others are not failures either: "Received" and "Pending" mean the
#      outcome arrives later by webhook, and "RedirectShopper" means the
#      shopper has not finished yet. Branching on != "Authorised" declines
#      payments that are going to settle.
#   3. A refusal carries prose and a code, and only the code is stable.
#      refusalReason is written for a human and Adyen changes the wording;
#      refusalReasonCode is the thing to branch on, and it is a string of
#      digits rather than a number.
#   4. Amounts are minor units. 1000 EUR in this API is ten euros, and a
#      currency without decimals is not scaled at all, so dividing everything
#      by a hundred is wrong for about a fifth of the world.
#
# The notification is worth reading closely too. It arrives as an array of
# notificationItems, each holding a NotificationRequestItem, and its success
# field is the string "true" rather than a boolean. A truth test on it is
# therefore also true for "false", so every failed payment reads as successful
# to code that writes the obvious thing.
#
# Keys and references below are fixtures, not secrets. They belong to no
# merchant account.

recipe: adyen
capability: payments
version: 0.1.0

upstream:
  api: v71
  docs: https://docs.adyen.com/api-explorer/Checkout/71/overview
  spec: https://raw.githubusercontent.com/Adyen/adyen-openapi/main/json/CheckoutService-v71.json
  spec_hash: a0730abb89c56e63290b046d2c528dc35db483881cb4fd505ddf746b1d523eb0
  spec_seen: "2026-08-30"

auth:
  # Adyen's own header. An Authorization bearer token gets nowhere.
  scheme: header
  header: X-API-Key
  keys:
    - AQEyhmfxK4cauldron

responses:
  list:
    style: wrapped
  resource:
    style: bare
  # Flat, with the HTTP status repeated inside the body and an errorType
  # beside the code.
  error:
    style: flat
    message_field: message
    code_field: errorCode
    # Adyen's codes are strings even where they look numeric. "000" carries
    # leading zeros a client matches on, and "14_006" is not a number at all.
    # Left to infer from the value, "000" would arrive as 0.
    code_type: string
    type_field: errorType
    status_field: status

resources:
  payment:
    collection: payments
    id:
      # Adyen's own reference: sixteen upper-case alphanumerics. It is the only
      # identifier that means anything to Adyen support, and it is not the
      # merchantReference the shop generated.
      #
      #
      # Declared hex, and the fixtures below are lower case to match. Adyen's
      # own references are upper case and contain letters past F, so this is
      # a stated infidelity: a pspReference from Cauldron is the right length
      # and the wrong alphabet.
      #
      # The fixtures used to be upper case, which made it a worse problem
      # than an infidelity -- seeded records and minted ones had two
      # different shapes inside one collection, which is the thing a Recipe
      # must never do. Nothing caught it, because the check that would have
      # was looking for the fixture id under "pspReference" and a fixture
      # writes it under "id".
      style: hex
      field: pspReference
      length: 16
    fields:
      # Twelve values, one of which is success. Three of the rest are not
      # failures: Received, Pending and RedirectShopper all mean "not yet".
      resultCode:
        type: string
        default: Authorised
      # The shop's own reference. Adyen does not enforce that it is unique,
      # so two payments can carry the same one and reconciliation keyed on it
      # merges two real transactions.
      merchantReference:
        type: string
      # Minor units. 1000 EUR is ten euros, and a currency without decimals
      # is not scaled at all.
      amount_value:
        type: integer
        in: amount
        as: value
      amount_currency:
        type: string
        in: amount
        as: currency
      # Written for a human, and Adyen changes the wording. Logging it is
      # fine; branching on it is not.
      refusalReason:
        type: string
      # A string of digits, and the stable half of the pair.
      refusalReasonCode:
        type: string
      paymentMethod_type:
        type: string
        in: paymentMethod
        as: type
      paymentMethod_brand:
        type: string
        in: paymentMethod
        as: brand
      # Present only when the shopper still has something to do. A payment
      # with an action has no outcome yet, and treating the absence of
      # Authorised as a decline abandons the shopper mid-flow.
      action_type:
        type: string
        in: action
        as: type
      action_url:
        type: string
        in: action
        as: url

  paymentMethod:
    collection: paymentMethods
    id:
      style: opaque
      length: 10
    fields:
      # scheme, ideal, sepadirectdebit, klarna. The type is what a client
      # switches on, and the brand underneath it is finer grained.
      type:
        type: string
        required: true
      name:
        type: string
      # An asynchronous method's payment is Received rather than Authorised,
      # and the money arrives days later.
      brands:
        type: string

  refund:
    collection: refunds
    id:
      # Same reference, same reasoning as payment above.
      style: hex
      field: pspReference
      length: 16
    fields:
      # The payment being refunded. Refunds carry their own pspReference, and
      # correlating one with its payment needs this rather than the id.
      paymentPspReference:
        type: string
      # A refund is accepted, not completed. "received" means Adyen has the
      # request; whether the money moves is a webhook away, and a refund can
      # still fail after this.
      status:
        type: string
        default: received
      # reference, not merchantReference. The two are your own identifier for
      # two different things and Adyen names them differently: a payment
      # answers with merchantReference, and a refund answers with reference.
      #
      # Checked against Adyen's own description: PaymentRefundResponse
      # declares amount, capturePspReference, lineItems, merchantAccount,
      # merchantRefundReason, paymentPspReference, pspReference, reference,
      # splits, status and store. No merchantReference among them.
      #
      # This Recipe sent merchantReference here, which is the payment's name
      # for it. Code reading refund.reference got nothing from the fake, and
      # code written against the fake got nothing from Adyen -- the same
      # field, invisible in both directions depending on which side you
      # wrote against.
      reference:
        type: string
      amount_value:
        type: integer
        in: amount
        as: value
      amount_currency:
        type: string
        in: amount
        as: currency

routes:
  - method: POST
    path: /v71/payments
    resource: payment
    operation: create
    status: 200

  # Adyen has no plain GET for a payment. The way a client learns the outcome
  # of a flow it had to hand back to the shopper is to post the opaque state
  # blob it was given, which is what id_from models here.
  - method: POST
    path: /v71/payments/details
    resource: payment
    operation: get
    id_from: body:paymentData

  - method: POST
    path: /v71/paymentMethods
    resource: paymentMethod
    operation: list
    pagination:
      # The request names a merchant account, an amount and a country, and
      # Adyen answers the payment methods available for that transaction.
      # From CheckoutService v71 read 2026-09-05 there is no size and no
      # position in it, because the answer is decided by the shopper's
      # context rather than by a window over a collection.
      #
      # So this does not page, and the runtime was serving ten of it while
      # reading a "limit" nobody sends.
      style: none
    status: 200
    # No pagination, checked against Adyen's own OpenAPI description: the
    # request takes no limit, offset, page or cursor of any kind, and the
    # response is paymentMethods beside storedPaymentMethods with nothing to
    # resume from. A limit was declared here, which claimed a page size the
    # provider does not accept.

  - method: POST
    path: /v71/payments/{paymentPspReference}/refunds
    resource: refund
    operation: create
    scope: [paymentPspReference]
    status: 201

webhooks:
  events:
    - AUTHORISATION
    - CANCELLATION
    - REFUND
    - REFUND_FAILED
    - CHARGEBACK
    - NOTIFICATION_OF_CHARGEBACK
    - CAPTURE_FAILED
  signing:
    scheme: hmac-sha256
    header: Adyen-Signature
    secret: cauldron-hmac-key
  payload:
    # A string, and it is the test environment saying so. Deciding which
    # account a notification belongs to by truth-testing this gets it wrong in
    # exactly the same way as success below.
    live: "false"
    # An array, because Adyen batches. Code that reads a notification as a
    # single object finds nothing at any level.
    notificationItems:
      - NotificationRequestItem:
          # The payment's own fields sit here, beside eventCode rather than
          # under it.
          "{object}": true
          eventCode: "{event}"
          # The string "true", not a boolean. if (item.success) is also true
          # for "false", so every failed payment reads as successful.
          success: "true"
          eventDate: "{created_iso}"

errors:
  rate_limit:
    status: 429
    code: "429"
    message: Too many requests
    headers:
      Retry-After: "1"

  # Verified live against checkout-test.adyen.com, both with no X-API-Key at
  # all and with an invented one: byte-identical 401 either way, and the
  # errorType is "security", not the "authentication_error" this file
  # defaulted to before that was checked -- see the case below.
  authentication_error:
    status: 401
    code: "000"
    type: security
    message: "HTTP Status Response - Unauthorized"

  resource_missing:
    status: 422
    code: "167"
    message: "Original pspReference required for this operation: {detail}"

  parameter_missing:
    status: 422
    code: "14_006"
    message: "Invalid request: {detail} is required"

  # The merchant account is part of every request body, and getting it wrong
  # looks like an auth failure without being one.
  invalid_merchant_account:
    status: 403
    code: "010"
    message: Not allowed

  # Adyen refuses a refund larger than what was captured, which is what a
  # partial-refund flow hits when it forgets an earlier partial.
  refund_exceeds_payment:
    status: 422
    code: "247"
    message: "Unable to refund: the amount exceeds the refundable balance"

  # A currency with no decimal places is not scaled, and sending scaled minor
  # units for one asks for a hundred times the money.
  invalid_amount:
    status: 422
    code: "130"
    message: "Reference Missing or amount is not a valid number for this currency"

fixtures:
  empty: {}

  small-merchant:
    paymentMethod:
      - id: pm00000001
        type: scheme
        name: Cards
        brands: visa,mc,amex
      - id: pm00000002
        type: ideal
        name: iDEAL
        brands: ideal
      - id: pm00000003
        type: sepadirectdebit
        name: SEPA Direct Debit
        brands: sepadirectdebit

    payment:
      # The only success in the list, and spelled the British way.
      - id: "8836183744aaaaaa"
        resultCode: Authorised
        merchantReference: order-1001
        amount_value: 1000
        amount_currency: EUR
        paymentMethod_type: scheme
        paymentMethod_brand: visa
      # Not a failure. A direct debit is collected days later, and the
      # outcome arrives by webhook. Treating this as a decline loses a sale
      # that was going to settle.
      - id: "8836183744bbbbbb"
        resultCode: Received
        merchantReference: order-1002
        amount_value: 2500
        amount_currency: EUR
        paymentMethod_type: sepadirectdebit
      # Also not a failure. The shopper is at their bank, and the payment has
      # no outcome at all until they come back.
      - id: "8836183744cccccc"
        resultCode: RedirectShopper
        merchantReference: order-1003
        amount_value: 4200
        amount_currency: EUR
        paymentMethod_type: ideal
        action_type: redirect
        action_url: https://test.adyen.com/hpp/checkout.shtml
      # A real decline. The prose is for a human and Adyen rewords it; the
      # code is the half worth branching on.
      - id: "8836183744dddddd"
        resultCode: Refused
        merchantReference: order-1004
        amount_value: 999
        amount_currency: EUR
        refusalReason: Refused
        refusalReasonCode: "2"
        paymentMethod_type: scheme
        paymentMethod_brand: mc
      # A currency without decimals. 5000 here is five thousand yen, not
      # fifty, and dividing by a hundred loses two orders of magnitude.
      - id: "8836183744eeeeee"
        resultCode: Authorised
        merchantReference: order-1005
        amount_value: 5000
        amount_currency: JPY
        paymentMethod_type: scheme
        paymentMethod_brand: visa

    refund:
      - id: "8836183744ffffff"
        paymentPspReference: "8836183744aaaaaa"
        # Accepted, not completed. Whether the money moves is a webhook away,
        # and a refund can still fail after this.
        status: received
        reference: order-1001
        amount_value: 1000
        amount_currency: EUR

# Conformance cases, read from Adyen's Checkout API explorer rather than
# observed against a live merchant account. The verify report says so.
conformance:
  - name: success is spelled the British way
    source: https://docs.adyen.com/api-explorer/Checkout/71/post/payments
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744aaaaaa"
    expect:
      status: 200
      body:
        # Code ported from a provider that spells it the other way compares
        # against a string Adyen never sends, and every payment reads as
        # failed.
        resultCode: Authorised
        merchantReference: order-1001

  - name: Received is not a failure
    source: https://docs.adyen.com/api-explorer/Checkout/71/post/payments
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744bbbbbb"
    expect:
      status: 200
      body:
        # A direct debit is collected days later and the outcome arrives by
        # webhook. Branching on != Authorised declines a sale that settles.
        resultCode: Received
        paymentMethod:
          type: sepadirectdebit
      absent:
        - refusalReason
        - refusalReasonCode

  - name: a redirect carries an action and no outcome
    source: https://docs.adyen.com/api-explorer/Checkout/71/post/payments
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744cccccc"
    expect:
      status: 200
      body:
        # The shopper is at their bank. Treating the absence of Authorised as
        # a decline abandons them mid-flow.
        resultCode: RedirectShopper
        action:
          type: redirect
          url: https://test.adyen.com/hpp/checkout.shtml
      absent:
        - refusalReasonCode

  - name: a refusal has stable code and unstable prose
    source: https://docs.adyen.com/development-resources/refusal-reasons
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744dddddd"
    expect:
      status: 200
      body:
        resultCode: Refused
        # A string of digits. A client comparing against the number 2 never
        # matches, and the prose beside it is reworded by Adyen at will.
        refusalReasonCode: "2"
        refusalReason: Refused

  - name: amounts are minor units and a currency without decimals is not scaled
    source: https://docs.adyen.com/development-resources/currency-codes
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744eeeeee"
    expect:
      status: 200
      body:
        amount:
          # Five thousand yen, not fifty. Dividing everything by a hundred is
          # wrong for about a fifth of the world.
          value: 5000
          currency: JPY

  - name: a refund is accepted rather than completed
    source: https://docs.adyen.com/api-explorer/Checkout/71/post/payments/_paymentPspReference_/refunds
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/8836183744aaaaaa/refunds
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        merchantAccount: CauldronECOM
        reference: refund-1001
        amount:
          value: 1000
          currency: EUR
    expect:
      status: 201
      body:
        # Whether the money moves is a webhook away, and a refund can still
        # fail after this.
        status: received
        paymentPspReference: "8836183744aaaaaa"
      absent:
        # The payment's name for it, which does not appear on a refund.
        #
        # Asserting the reference itself would prove nothing here: a create
        # echoes whatever the request sent, so the value comes back whether
        # or not the resource declares the field. That is written up in the
        # backlog. What holds this name in place is the fixture, which the
        # validator refuses if it sets a field the resource does not declare.
        - merchantReference
      matches:
        # Its own reference, not the payment's. Correlating a refund with its
        # payment needs paymentPspReference rather than this.
        pspReference: '^[0-9a-f]{16}$'

  - name: a payment method list is wrapped under its own key
    source: https://docs.adyen.com/api-explorer/Checkout/71/post/paymentMethods
    fixture: small-merchant
    request:
      method: POST
      path: /v71/paymentMethods
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        merchantAccount: CauldronECOM
    expect:
      status: 200
      body:
        paymentMethods[0].type: scheme
        # An asynchronous method. A payment on it is Received rather than
        # Authorised, and the money arrives days later.
        paymentMethods[2].type: sepadirectdebit
      absent:
        - data
        - items

  - name: the key goes in X-API-Key, not Authorization
    # Corrected against a live check: this case had asserted errorType
    # "authentication_error", which was never Adyen's own value -- it was
    # this file's key name leaking through as a default before anyone had
    # struck the live host to notice. checkout-test.adyen.com answers
    # errorType "security" for this exact request.
    source: https://docs.adyen.com/development-resources/api-credentials
    verified: "2026-09-05"
    fixture: small-merchant
    request:
      method: POST
      path: /v71/paymentMethods
      headers:
        Authorization: Bearer AQEyhmfxK4cauldron
      json:
        merchantAccount: CauldronECOM
    expect:
      status: 401
      body:
        status: 401
        errorCode: "000"
        errorType: security
      absent:
        - error
        - errors

  - name: no key at all is refused identically to a wrong one
    # Struck live with no X-API-Key header whatsoever: the same 401, the
    # same body, byte for byte, as the wrong-header case above. Adyen does
    # not distinguish an absent credential from a present, invalid one.
    source: https://checkout-test.adyen.com/v71/paymentMethods
    verified: "2026-09-05"
    fixture: small-merchant
    request:
      method: POST
      path: /v71/paymentMethods
      json:
        merchantAccount: CauldronECOM
    expect:
      status: 401
      body:
        status: 401
        errorCode: "000"
        errorType: security
        message: "HTTP Status Response - Unauthorized"

  - name: a failure repeats the status inside the body
    source: https://docs.adyen.com/development-resources/error-codes
    fixture: small-merchant
    request:
      method: POST
      path: /v71/payments/details
      headers:
        X-API-Key: AQEyhmfxK4cauldron
      json:
        paymentData: "8836183744999999"
    expect:
      status: 422
      body:
        status: 422
        # Adyen's codes are grouped by namespace and carry an underscore, so
        # they are strings even where they look numeric.
        errorCode: "167"
      matches:
        message: 'pspReference'

  # The names. This Recipe declares 2 field(s) on a paymentMethod that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a paymentMethod carries the field names this Recipe declares"
    source: "https://docs.adyen.com/api-explorer/Checkout/71/post/paymentMethods"
    fixture: small-merchant
    request:
      method: POST
      path: "/v71/paymentMethods"
      headers:
        "X-API-Key": "AQEyhmfxK4cauldron"
    expect:
      status: 200
      body:
        "paymentMethods[0].brands": "visa,mc,amex"
        "paymentMethods[0].name": "Cards"

  # The names. This Recipe declares 4 field(s) on a payment that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a payment carries the field names this Recipe declares"
    source: "https://docs.adyen.com/api-explorer/Checkout/71/post/payments"
    fixture: small-merchant
    request:
      method: POST
      path: "/v71/payments/details"
      json:
        paymentData: 8836183744aaaaaa
      headers:
        "X-API-Key": "AQEyhmfxK4cauldron"
    expect:
      status: 200
      body:
        "paymentMethod.brand": "visa"
        "amount.currency": "EUR"
        "amount.value": 1000

  # The names. This Recipe declares 3 field(s) on a refund that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a refund carries the field names this Recipe declares"
    source: "https://docs.adyen.com/api-explorer/Checkout/71/post/payments/_paymentPspReference_/refunds"
    fixture: small-merchant
    request:
      method: POST
      path: "/v71/payments/8836183744aaaaaa/refunds"
      json:
        merchantAccount: CauldronECOM
        reference: refund-1001
        amount:
          value: 1000
          currency: EUR
      headers:
        "X-API-Key": "AQEyhmfxK4cauldron"
    expect:
      status: 201
      body:
        "amount.currency": "EUR"
        "reference": "refund-1001"
        "amount.value": 1000

  # The names. This Recipe declares 1 field(s) on a payment that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a payment carries the field names this Recipe declares, and 1 more of them"
    source: "https://docs.adyen.com/api-explorer/Checkout/71/post/payments"
    fixture: small-merchant
    request:
      method: POST
      path: "/v71/payments/details"
      json:
        paymentData: 8836183744cccccc
      headers:
        "X-API-Key": "AQEyhmfxK4cauldron"
    expect:
      status: 200
      body:
        "action.url": "https://test.adyen.com/hpp/checkout.shtml"



