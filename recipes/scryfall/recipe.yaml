# Scryfall Recipe for Cauldron
#
# The prices are five nulls and one string.
#
#   "prices": {"usd": null, "usd_foil": null, "usd_etched": null,
#              "eur": null, "eur_foil": null, "tix": "46.91"}
#
# Six fields about money, five of them null and the sixth a string. So a client
# reading prices.usd gets null and one reading prices.tix gets text, and neither
# is a number -- summing a basket means parsing every value that is not null,
# and finding out which those are means checking all six.
#
# Scryfall is a well-built API, which is what makes it worth describing: the
# traps are not carelessness, they are decisions, and they are the harder kind
# to notice because everything around them is right.
#
# **Four failures, four typographies, and one of them is minified.**
#
#   /cards/named?exact=NoSuchCardAtAll -> curly double quotes: “NoSuchCardAtAll”
#   /cards/named                       -> Markdown backticks: `fuzzy` or `exact`
#   /cards/search?q=                   -> a left single quote as an apostrophe:
#                                         "You didn‘t enter anything"
#   /nosuchthing                       -> plain prose, no marks at all
#
# The apostrophe in "didn‘t" is U+2018, a left single quotation mark, which is
# the wrong one: a contraction takes U+2019. It appears in the only failure of
# the four that is not pretty-printed -- three arrive with newlines and
# two-space indentation, and that one arrives minified. Same host, same content
# type, same four keys, and no two of them formatted alike.
#
# Written against the live API rather than a document: every case below was
# checked against api.scryfall.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Sibling failures do not carry the same keys. The minified one has
#      "warnings": null and the other three do not have the key at all, so a
#      client reading err.warnings finds undefined on three failures and null
#      on the fourth, and cannot tell those apart without checking.
#   2. Every response says what it is. object is "card" on a card, "error" on a
#      failure and "related_card" inside all_parts -- a discriminator on a
#      typed API, which is the thing most JSON APIs here do not have and the
#      reason this one is worth reading.
#   3. A collector number is not a number. collector_number is "4", kept as a
#      string, because collector numbers carry stars and letters on other
#      cards -- so the one field that looks safe to parse is the one that is
#      not, while cmc beside it is a bare 0.
#
# And the card's own link carries the vendor's analytics: scryfall_uri ends
# ?utm_source=api, so an application rendering "view on Scryfall" passes on
# their attribution without deciding to.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One card is served, of tens of thousands, and only the fields the cases
#     name -- the real record carries sixty-odd.
#   - The whitespace is not reproduced. Three of the four failures arrive
#     pretty-printed with newlines and two-space indentation and the fourth
#     arrives minified; Cauldron writes JSON its own way, so the values match
#     and the bytes around them do not. It is recorded here rather than served.
#   - tix is Magic Online event tickets, and it moves. The figure is the one
#     that stood when this was checked.
#   - cmc arrives as 0.0 and is served as 0. Scryfall writes the mana value as
#     a float, and mana values are whole numbers in the game's own rules --
#     there is no card with a fractional one. Cauldron's JSON writer emits 0
#     for a zero float, so the decimal cannot be reproduced here. It is
#     recorded rather than served, and a mutation removing it was dropped for
#     the same reason rather than left looking like an unchecked claim.

recipe: scryfall
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: scryfall
  docs: https://scryfall.com/docs/api

auth:
  # Public, no key. Scryfall asks for a User-Agent and a delay between
  # requests, which is a courtesy a Recipe cannot enforce.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: details
    code_field: code
    code_type: string
    # Every response says what it is, including this one.
    type_field: object
    # The HTTP status again, in the body, as a number.
    status_field: status

resources:
  card:
    id:
      style: opaque
      field: id
    fields:
      object:
        type: string
      # A second identifier, for the card rather than this printing of it.
      oracle_id:
        type: string
      name:
        type: string
      lang:
        type: string
      released_at:
        type: string
      # The vendor's own analytics, on the card's own link.
      scryfall_uri:
        type: string
      uri:
        type: string
      layout:
        type: string
      mana_cost:
        type: string
      cmc:
        type: number
      type_line:
        type: string
      oracle_text:
        type: string
      colors:
        type: list
      color_identity:
        type: list
      keywords:
        type: list
      produced_mana:
        type: list
      # The same concept as an array and as a scalar, two fields apart.
      multiverse_ids:
        type: list
      mtgo_id:
        type: integer
      set:
        type: string
      set_name:
        type: string
      collector_number:
        type: string
      rarity:
        type: string
      reserved:
        type: boolean
      digital:
        type: boolean
      artist:
        type: string
      # Five nulls and one string.
      prices:
        type: map

routes:
  - method: GET
    path: /cards/named
    resource: card
    operation: get
    id_from: auth

  # A card that does not exist: curly double quotes around what was asked for.
  - method: GET
    path: /cards/named-no-match
    error: card_not_found

  # No parameter at all: Markdown backticks, in JSON.
  - method: GET
    path: /cards/named-without-parameter
    error: parameter_required

  # An empty search: a left single quotation mark, used as an apostrophe.
  - method: GET
    path: /cards/search
    error: nothing_to_search_for

  # A path that does not exist: plain prose, and no typography at all.
  - method: GET
    path: /nosuchthing
    error: not_found

errors:
  card_not_found:
    status: 404
    code: not_found
    type: error
    # Curly doubles, correctly paired.
    message: "No cards found matching “NoSuchCardAtAll”"

  parameter_required:
    status: 400
    code: bad_request
    type: error
    # Markdown, in a response that is not Markdown.
    message: "You must provide a `fuzzy` or `exact` parameter"

  nothing_to_search_for:
    status: 400
    code: bad_request
    type: error
    # A left single quotation mark, where a contraction wants a right one.
    message: "You didn‘t enter anything to search for."
    fields:
      # And a key the other three failures do not carry at all.
      warnings: null

  not_found:
    status: 404
    code: not_found
    type: error
    # No marks of any kind.
    message: The requested object or REST method was not found.

fixtures:
  empty: {}

  lotus:
    card:
      - id: bd8fa327-dd41-4737-8f19-2cf5eb1f7cdd
        object: card
        # A second identifier, for the card rather than this printing of it.
        oracle_id: 5089ec1a-f881-4d55-af14-5d996171203b
        name: Black Lotus
        lang: en
        released_at: "2014-06-16"
        # The vendor's analytics, on the card's own link.
        scryfall_uri: "https://scryfall.com/card/vma/4/black-lotus?utm_source=api"
        # And the API link beside it, which does not carry them.
        uri: "https://api.scryfall.com/cards/bd8fa327-dd41-4737-8f19-2cf5eb1f7cdd"
        layout: normal
        mana_cost: "{0}"
        # Scryfall sends 0.0 here. See the header: this cannot serve the
        # decimal, so it serves the number.
        cmc: 0
        type_line: Artifact
        oracle_text: "{T}, Sacrifice this artifact: Add three mana of any one color."
        # Three empty arrays, together.
        colors: []
        color_identity: []
        keywords: []
        # Sorted alphabetically rather than in the game's own colour order.
        produced_mana:
          - B
          - G
          - R
          - U
          - W
        # The same concept as an array...
        multiverse_ids:
          - 382866
        # ...and as a scalar, two fields apart.
        mtgo_id: 53155
        set: vma
        set_name: Vintage Masters
        # A number kept as a string, because collector numbers are not numbers.
        collector_number: "4"
        # A rarity that is not one of the four anybody names.
        rarity: bonus
        reserved: true
        digital: true
        artist: Chris Rahn
        prices:
          # Five nulls...
          usd: null
          usd_foil: null
          usd_etched: null
          eur: null
          eur_foil: null
          # ...and one string.
          tix: "46.91"

conformance:
  - name: the prices are five nulls and one string
    source: "https://api.scryfall.com/cards/named?exact=Black+Lotus"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named
    expect:
      status: 200
      body:
        # Five fields about money that hold nothing...
        prices.usd: null
        prices.usd_foil: null
        prices.usd_etched: null
        prices.eur: null
        prices.eur_foil: null
        # ...and one that holds text.
        prices.tix: "46.91"

  - name: a card that does not exist quotes what was asked for
    source: "https://api.scryfall.com/cards/named?exact=NoSuchCardAtAll"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named-no-match
    expect:
      status: 404
      body:
        # Curly doubles, correctly paired.
        details: "No cards found matching “NoSuchCardAtAll”"
        code: not_found
        # Every response says what it is, including this one.
        object: error
        # And the status again, in the body.
        status: 404
      absent:
        # A key its minified sibling carries.
        - warnings

  - name: and a missing parameter uses Markdown in JSON
    source: https://api.scryfall.com/cards/named
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named-without-parameter
    expect:
      status: 400
      body:
        # Backticks, in a response that is not Markdown.
        details: "You must provide a `fuzzy` or `exact` parameter"
        code: bad_request
        object: error
        status: 400
      absent:
        - warnings

  - name: and an empty search uses the wrong apostrophe and carries an extra key
    source: "https://api.scryfall.com/cards/search?q="
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/search
    expect:
      status: 400
      body:
        # U+2018, a left single quotation mark, where a contraction wants a
        # right one.
        details: "You didn‘t enter anything to search for."
        # And a key the other three failures do not have at all, so
        # err.warnings is undefined on three of four and null on this one.
        warnings: null
        code: bad_request
        object: error
        status: 400

  - name: and a path that does not exist has no typography at all
    source: https://api.scryfall.com/nosuchthing
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /nosuchthing
    expect:
      status: 404
      body:
        # Plain prose, where its three siblings each chose a different mark.
        details: The requested object or REST method was not found.
        code: not_found
        object: error
        status: 404

  - name: a collector number is not a number
    source: "https://api.scryfall.com/cards/named?exact=Black+Lotus"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named
    expect:
      status: 200
      body:
        # Zero, on a card that costs nothing. Scryfall writes it as 0.0 and
        # this serves 0; the header says so.
        cmc: 0
        # A cost written in the game's own brace notation, as a string.
        mana_cost: "{0}"
        # And a collector number that is a number and is kept as a string.
        collector_number: "4"

  - name: two identifiers, one for the card and one for this printing of it
    source: "https://api.scryfall.com/cards/named?exact=Black+Lotus"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named
    expect:
      status: 200
      body:
        # This printing...
        id: bd8fa327-dd41-4737-8f19-2cf5eb1f7cdd
        # ...and the card itself, which every printing shares.
        oracle_id: 5089ec1a-f881-4d55-af14-5d996171203b
        # The same concept as an array...
        "multiverse_ids[0]": 382866
        # ...and as a scalar, two fields apart.
        mtgo_id: 53155
        object: card
        name: Black Lotus

  - name: the card's own link carries the vendor's analytics
    source: "https://api.scryfall.com/cards/named?exact=Black+Lotus"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named
    expect:
      status: 200
      body:
        # utm_source, on the link an application would render.
        scryfall_uri: "https://scryfall.com/card/vma/4/black-lotus?utm_source=api"
        # And the API link beside it, which does not carry them.
        uri: "https://api.scryfall.com/cards/bd8fa327-dd41-4737-8f19-2cf5eb1f7cdd"
        set: vma
        set_name: Vintage Masters
        # A rarity that is not one of the four anybody names.
        rarity: bonus
        digital: true
        reserved: true

  - name: three empty arrays and a colour list in the wrong order
    source: "https://api.scryfall.com/cards/named?exact=Black+Lotus"
    verified: "2026-08-31"
    fixture: lotus
    request:
      method: GET
      path: /cards/named
    expect:
      status: 200
      body:
        # Three, together.
        colors: []
        color_identity: []
        keywords: []
        # And five colours sorted alphabetically rather than in the order the
        # game itself always writes them, which is W U B R G.
        "produced_mana[0]": B
        "produced_mana[4]": W
        type_line: Artifact
        oracle_text: "{T}, Sacrifice this artifact: Add three mana of any one color."
        artist: Chris Rahn
        lang: en
        released_at: "2014-06-16"
        layout: normal
