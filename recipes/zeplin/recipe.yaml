# Zeplin Recipe for Cauldron
#
# The project listing, read from the API reference at docs.zeplin.dev, and
# struck live on 2026-09-14 with no credential, with a wrong bearer token, with
# the token and no scheme, on a path that does not exist, with a method the
# path does not take, and on the root.
#
# **`message` holds the code and `detail` holds the sentence.** The two fields
# have swapped their conventional jobs:
#
#   {"message":"invalid_token","detail":"Authorization header is missing"}
#
# `message`, which a client library will print to a human, is a constant; and
# `detail`, which reads as the machine-readable extra, is the prose.
#
# **And on a routing failure the same field holds a sentence after all.**
# `{"message":"Not Found"}` -- so `message` carries `invalid_token` on one
# response and `Not Found` on the next, and nothing says which kind it is.
#
# **The commonest credential mistake gets the least help.** Struck live, three
# ways to fail:
#
#   (no header)             {"message":"invalid_token","detail":"Authorization header is missing"}
#   Bearer <wrong token>    {"message":"invalid_token"}
#   <token, no prefix>      {"message":"invalid_token","detail":"Did you forget to add authorization type \"Bearer\" as a prefix?"}
#
# A missing header is explained. A missing `Bearer ` prefix is explained, in a
# question, with escaped quotes inside the JSON string. A token that is simply
# wrong -- the thing that happens when a key is rotated or revoked, which is
# most of the time -- gets no `detail` at all: the field is absent rather than
# empty, so code reading `body.detail` finds undefined.
#
# **And the code is about a token on a request that has none.**
# `invalid_token`, for a request with no Authorization header.
#
# **Seven counters ride on one project record.** `number_of_members`,
# `number_of_screens`, `number_of_components`,
# `number_of_connected_components`, `number_of_text_styles`,
# `number_of_colors` and `number_of_spacing_tokens` -- seven aggregates
# computed over other collections, on the record that names the project.
#
# **Two fields are called status and they are different types.** `status` is a
# string, `active` or `archived`. `workflow_status` is an object. One record,
# two statuses, and the second exists only on organisation projects.
#
# **A parameter takes a magic word or an identifier in the same slot.**
# `workspace` is documented "it can be `personal` or the id of organization",
# so a workspace named by a real id and the absence of one share a field, and
# an organisation whose id were the string `personal` could not be addressed.
#
# Also pinned: `created` and `updated` are Unix integers under names with no
# suffix saying so; `organization` and `workflow_status` are present only on
# organisation projects, so the record's shape depends on where it lives; and
# `limit` defaults to 30 over a documented range of 1 to 100.

recipe: zeplin
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.zeplin.dev/reference/getprojects

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nzepl1nf1xturet0ken000000
  absent_error: header_missing
  # The prefix left off has its own sentence, phrased as a question.
  malformed_error: missing_prefix
  # And a token that is simply wrong gets no sentence at all.
  rejected_error: invalid_token
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    # The code, in the field a library prints to a human.
    message_field: message
    code_field: "-"

resources:
  project:
    id:
      field: id
      style: hex
      length: 24
    fields:
      name:
        type: string
      description:
        type: string
      platform:
        type: string
      thumbnail:
        type: string
      # A string, beside an object also called status.
      status:
        type: string
      # Unix integers, under names with no suffix saying so.
      created:
        type: integer
      updated:
        type: integer
      scene_url:
        type: string
      # Seven aggregates over other collections.
      number_of_members:
        type: integer
      number_of_screens:
        type: integer
      number_of_components:
        type: integer
      number_of_connected_components:
        type: integer
      number_of_text_styles:
        type: integer
      number_of_colors:
        type: integer
      number_of_spacing_tokens:
        type: integer

routes:
  - method: GET
    path: /v1/projects
    resource: project
    operation: list
    pagination:
      style: offset
      limit: 30
      max_limit: 100
      limit_param: limit
      cursor_param: offset
    filters:
      - param: status
        field: status

errors:
  header_missing:
    status: 401
    # The code, in message.
    message: invalid_token
    fields:
      # And the sentence, in detail.
      detail: Authorization header is missing

  missing_prefix:
    status: 401
    message: invalid_token
    fields:
      # A question, with escaped quotes inside the JSON string.
      detail: 'Did you forget to add authorization type "Bearer" as a prefix?'

  # The commonest mistake, and the one with no detail field at all.
  invalid_token:
    status: 401
    message: invalid_token

  # Here message holds a sentence instead of a code.
  unknown_route:
    status: 404
    message: Not Found

  method_not_allowed:
    status: 404
    message: Not Found

fixtures:
  empty:
    project: []

  workspace:
    project:
      - id: 5f4e3d2c1b0a998877665544
        name: Handbook
        description: The internal handbook
        platform: web
        thumbnail: https://example.com/thumbnails/handbook.png
        status: active
        # Unix seconds.
        created: 1770000000
        updated: 1789300000
        scene_url: https://app.zeplin.io/project/5f4e3d2c1b0a998877665544
        number_of_members: 12
        number_of_screens: 84
        number_of_components: 37
        number_of_connected_components: 9
        number_of_text_styles: 14
        number_of_colors: 22
        number_of_spacing_tokens: 6
      - id: 7d51b9ae2f044c868b153e9a
        name: Archived pitch
        description: ""
        platform: ios
        thumbnail: https://example.com/thumbnails/pitch.png
        # The other value of the string status.
        status: archived
        created: 1750000000
        updated: 1752000000
        scene_url: https://app.zeplin.io/project/7d51b9ae2f044c868b153e9a
        number_of_members: 3
        number_of_screens: 0
        number_of_components: 0
        number_of_connected_components: 0
        number_of_text_styles: 0
        number_of_colors: 0
        number_of_spacing_tokens: 0

conformance:
  - name: the code is in message and the sentence is in detail
    source: https://api.zeplin.dev/v1/projects
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers: {}
    expect:
      status: 401
      body:
        # A constant, in the field a library prints to a human.
        message: invalid_token
        # And the prose, in the field that reads as machine-readable.
        detail: Authorization header is missing

  - name: a token with no scheme is asked a question
    source: https://api.zeplin.dev/v1/projects
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        # No "Bearer " in front of it.
        Authorization: notarealtoken
    expect:
      status: 401
      body:
        message: invalid_token
        detail: 'Did you forget to add authorization type "Bearer" as a prefix?'

  - name: and a token that is simply wrong gets no detail at all
    source: https://api.zeplin.dev/v1/projects
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        message: invalid_token
      absent:
        # The commonest failure, and the least said about it.
        - detail

  - name: an unrouted path puts a sentence in the code's field
    source: https://api.zeplin.dev/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # message held invalid_token a moment ago.
        message: Not Found

  - name: and so does a method the path does not take
    source: https://api.zeplin.dev/v1/projects
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: PUT
      path: /v1/projects
      headers: {}
    expect:
      status: 404
      body:
        message: Not Found

  - name: seven counters ride on one project
    source: https://docs.zeplin.dev/reference/getprojects
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer cauldr0nzepl1nf1xturet0ken000000"
    expect:
      status: 200
      body:
        # Seven aggregates over other collections, on the record that names
        # the project.
        '[0].number_of_members': 12
        '[0].number_of_screens': 84
        '[0].number_of_components': 37
        '[0].number_of_connected_components': 9
        '[0].number_of_text_styles': 14
        '[0].number_of_colors': 22
        '[0].number_of_spacing_tokens': 6

  - name: timestamps are unix integers with no suffix saying so
    source: https://docs.zeplin.dev/reference/getprojects
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer cauldr0nzepl1nf1xturet0ken000000"
    expect:
      status: 200
      body:
        '[0].created': 1770000000
        '[0].updated': 1789300000
        '[0].name': Handbook
        '[0].description': The internal handbook
        '[0].platform': web
        '[0].thumbnail': https://example.com/thumbnails/handbook.png
        '[0].scene_url': https://app.zeplin.io/project/5f4e3d2c1b0a998877665544

  - name: the status filter narrows on the string one
    source: https://docs.zeplin.dev/reference/getprojects
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      query:
        status: archived
      headers:
        Authorization: "Bearer cauldr0nzepl1nf1xturet0ken000000"
    expect:
      status: 200
      body:
        # The one called status, not the one called workflow_status.
        '[0].status': archived
        '[0].name': Archived pitch
        '[0].number_of_screens': 0

  - name: paging is a limit of thirty and an offset
    source: https://docs.zeplin.dev/reference/getprojects
    fixture: workspace
    request:
      method: GET
      path: /v1/projects
      query:
        limit: "1"
        offset: "1"
      headers:
        Authorization: "Bearer cauldr0nzepl1nf1xturet0ken000000"
    expect:
      status: 200
      body:
        # A bare array, and nothing counting anything.
        '[0].id': 7d51b9ae2f044c868b153e9a

  - name: an account with no projects is a bare empty array
    source: https://docs.zeplin.dev/reference/getprojects
    fixture: empty
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: "Bearer cauldr0nzepl1nf1xturet0ken000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
