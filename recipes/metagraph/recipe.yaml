# Meta Graph API Recipe for Cauldron
#
# Written against Meta's Graph API reference at developers.facebook.com and
# struck live against graph.facebook.com on 2026-09-07 with no credential and
# then with a deliberately invalid one.
#
# **Every credential failure is HTTP 400.** Struck live:
#
#   GET /v21.0/me                              (no token)
#   400 {"error":{"message":"An active access token must be used to query information about the current user.",
#                 "type":"OAuthException","code":2500,
#                 "fbtrace_id":"Ax_aO2TO0AuY7zAL3_XwPPv"}}
#
#   GET /v21.0/me?access_token=notreal
#   400 {"error":{"message":"Invalid OAuth access token - Cannot parse access token",
#                 "type":"OAuthException","code":190,
#                 "fbtrace_id":"A3Q2jXILH9XCUMt5561RGqd"}}
#
# Not 401. Meta's whole API answers 400 to authentication problems, so the
# status a client re-authenticates on never arrives and the status it reads as
# "my request is malformed" is the one that means "your token expired". Every
# Facebook integration in existence has a branch that treats 400 as an auth
# failure, and that branch also catches every genuine validation error.
#
# **The codes are small integers with a large gap.** 2500 for a missing token,
# 190 for an unparseable one. Meta's own numbering, four digits and three,
# unrelated to HTTP -- and 190 is the one every developer knows by heart,
# because it is what an expired user token produces.
#
# **`type` is `OAuthException` for both.** A class name, again -- the same
# choice [saltedge](../saltedge) makes with `class` -- and here it is the same
# value on every credential failure, so the field that looks like a category is
# a constant and `code` is where the difference lives.
#
# **An unknown path is answered with the token error.** Struck live:
# `/v21.0/cauldron-nope?access_token=notreal` answers code 190, not a 404 --
# routing is judged after the token, so a path cannot be shown not to exist and
# a typo is reported as a credential problem.
#
# **`fbtrace_id` is 23 characters of base64url.** One correlation id, in the
# body, on every failure -- and it is the one thing Meta's support asks for, so
# it is doing its job.
#
# **The version is in the path and there are many.** `/v21.0/` -- a path
# segment carrying a decimal, so a client upgrades by string substitution and
# the versions run in parallel for two years each.

recipe: metagraph
capability: identity
version: 0.1.0

upstream:
  api: v21.0
  docs: https://developers.facebook.com/docs/graph-api/
  # No spec: Meta publishes a rendered reference site and a per-version
  # changelog rather than a machine-readable description.

auth:
  # The token travels in the query string, which is what the documentation
  # leads with -- so it lands in access logs, browser history and referrers.
  scheme: query
  param: access_token
  keys:
    - EAACauldr0nF1xtureT0ken00000000000000ZD
  absent_error: no_active_token
  rejected_error: cannot_parse_token

responses:
  list:
    style: wrapped
    key: data
    fields:
      paging:
        cursors:
          before: MAZDZD
          after: MjQZD
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: number
    # A class name, and the same value on every credential failure -- so the
    # field that looks like a category is a constant.
    type_field: type

resources:
  account:
    id:
      field: id
      style: digits
    fields:
      name:
        type: string
      access_token:
        type: string
      category:
        type: string
      tasks:
        type: list

routes:
  - method: GET
    path: /v21.0/me/accounts
    resource: account
    operation: list
    pagination:
      style: cursor
      limit: 25
      limit_param: limit
      cursor_param: after

errors:
  no_active_token:
    # 400, not 401. Struck live.
    status: 400
    code: "2500"
    type: OAuthException
    message: "An active access token must be used to query information about the current user."
    fields:
      # 23 characters of base64url, in the body, and the one thing Meta's
      # support asks for.
      error.fbtrace_id: Ax_aO2TO0AuY7zAL3_XwPPv

  cannot_parse_token:
    status: 400
    # The number every Facebook developer knows by heart, because it is what
    # an expired user token produces.
    code: "190"
    type: OAuthException
    message: "Invalid OAuth access token - Cannot parse access token"
    fields:
      error.fbtrace_id: A3Q2jXILH9XCUMt5561RGqd

fixtures:
  empty:
    account: []

  user:
    account:
      - id: "104521398476213"
        name: Cauldron Coffee
        # A page access token, in a listing, beside the page it opens. So
        # reading the list of pages hands the caller a credential per page,
        # and the response a client logs contains as many secrets as the user
        # has pages.
        access_token: EAACauldr0nPageT0ken0000000000000000ZD
        category: Coffee Shop
        tasks:
          - ANALYZE
          - ADVERTISE
          - MODERATE
          - CREATE_CONTENT
          - MANAGE
      - id: "104521398476214"
        name: Cauldron Roasters
        access_token: EAACauldr0nPageT0ken1111111111111111ZD
        category: Wholesaler
        # Fewer tasks: permissions are a list of verbs rather than a role, so
        # "can this person post" is an array membership test and there is no
        # name for the set.
        tasks:
          - ANALYZE
          - CREATE_CONTENT

conformance:
  - name: a missing token is 400 rather than 401
    source: https://graph.facebook.com/v21.0/me
    verified: "2026-09-07"
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query: {}
    expect:
      # Meta's whole API answers 400 to authentication problems, so the status
      # a client re-authenticates on never arrives and the one it reads as
      # "my request is malformed" is the one meaning "your token expired".
      status: 400
      body:
        'error.code': 2500
        'error.message': "An active access token must be used to query information about the current user."

  - name: an unparseable token is a different number
    source: https://graph.facebook.com/v21.0/me?access_token=notreal
    verified: "2026-09-07"
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: notreal
    expect:
      status: 400
      body:
        # 190, the one every Facebook developer knows by heart. Four digits
        # for one failure and three for the other, in Meta's own numbering.
        'error.code': 190
        'error.message': "Invalid OAuth access token - Cannot parse access token"

  - name: the type is a class name and never changes
    source: https://graph.facebook.com/v21.0/me
    verified: "2026-09-07"
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query: {}
    expect:
      status: 400
      body:
        # The same value on every credential failure, so the field that looks
        # like a category is a constant and code is where the difference is.
        'error.type': OAuthException

  - name: every failure carries a trace id
    source: https://graph.facebook.com/v21.0/me
    verified: "2026-09-07"
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query: {}
    expect:
      status: 400
      body:
        # 23 characters of base64url, in the body, and the one thing Meta's
        # support asks for -- so unlike most of the trace fields in this
        # collection, it is doing its job.
        'error.fbtrace_id': Ax_aO2TO0AuY7zAL3_XwPPv

  - name: an unknown path is a token failure
    source: https://graph.facebook.com/v21.0/cauldron-nope?access_token=notreal
    verified: "2026-09-07"
    fixture: user
    request:
      method: GET
      path: /v21.0/cauldron-nope
      query:
        access_token: notreal
    expect:
      # Routing is judged after the token, so a path cannot be shown not to
      # exist and a typo is reported as a credential problem.
      status: 400
      body:
        'error.code': 190

  - name: a listing of pages hands back a token per page
    source: https://developers.facebook.com/docs/graph-api/reference/user/accounts/
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
    expect:
      status: 200
      body:
        # A page access token, in the collection, beside the page it opens.
        # So the response a client logs contains as many credentials as the
        # user has pages.
        'data[0].access_token': EAACauldr0nPageT0ken0000000000000000ZD
        'data[0].name': Cauldron Coffee

  - name: permissions are a list of verbs rather than a role
    source: https://developers.facebook.com/docs/graph-api/reference/user/accounts/
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
    expect:
      status: 200
      body:
        # "Can this person post" is an array membership test, and there is no
        # name for the set -- so two pages with different tasks have no role
        # to compare.
        'data[1].tasks[0]': ANALYZE
        'data[1].tasks[1]': CREATE_CONTENT
        'data[1].category': Wholesaler

  - name: identifiers are digits sent as strings
    source: https://developers.facebook.com/docs/graph-api/reference/user/accounts/
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
    expect:
      status: 200
      body:
        # Fifteen digits, quoted -- and two pages one apart, which is what
        # sequential ids look like from outside.
        'data[0].id': "104521398476213"
        'data[1].id': "104521398476214"

  - name: paging is a cursor pair under its own object
    source: https://developers.facebook.com/docs/graph-api/results
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
        limit: "1"
    expect:
      status: 200
      body:
        # before and after together, under paging.cursors, so a client walking
        # forward carries a field it never reads and one walking backward has
        # to know the pair exists.
        'paging.cursors.before': MAZDZD
        'paging.cursors.after': MjQZD

  - name: the cursor parameter is named for the direction
    source: https://developers.facebook.com/docs/graph-api/results
    fixture: user
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
        limit: "1"
        # Sent by no other case, so this pins the name. It is `after` in the
        # request and `paging.cursors.after` in the response, which is one of
        # the few places in this collection where the two agree.
        after: "104521398476213"
    expect:
      status: 200
      body:
        'data[0].id': "104521398476214"

  - name: a user with no pages answers an empty array
    source: https://developers.facebook.com/docs/graph-api/reference/user/accounts/
    fixture: empty
    request:
      method: GET
      path: /v21.0/me/accounts
      query:
        access_token: EAACauldr0nF1xtureT0ken00000000000000ZD
    expect:
      status: 200
      body:
        data: []
