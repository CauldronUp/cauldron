# Hardcover Recipe for Cauldron
#
# Third of a group with recipes/openlibrary/recipe.yaml and
# recipes/gutendex/recipe.yaml, and the only one of the three whose schema
# says outright, in its own words, that an ISBN belongs to an edition and
# not to a book. From docs.hardcover.app/api/graphql/schemas/editions/,
# read today: "An Edition in Hardcover represents a specific published
# version of a book. While a book is the conceptual work (e.g., 'Pride and
# Prejudice'), an edition is a particular physical or digital manifestation
# with specific attributes like ISBN, publisher, format, and release date."
# That is this whole batch's question, answered in the provider's own
# prose rather than inferred from a shape.
#
# **The schema enforces the split structurally, not just in words.** Read
# from .../schemas/books/ and .../schemas/editions/ today: books carries no
# ISBN field anywhere -- title, pages, description, editions_count, an
# editions [editions!]! relation -- and editions carries isbn_10, isbn_13,
# asin (Amazon's own identifier, a vendor id beside the standard ones) and
# a book books! relation pointing back. Three kinds of identifier on one
# record: Hardcover's own integer id, the two ISBN forms, and asin, with
# nothing conflating any of them.
#
# **And it answers the checksum question by name, which neither sibling
# Recipe's provider does.** Two fields on every edition, quoted verbatim
# from the schema reference: isbn_10_valid ("Whether the ISBN-10 is a valid
# number") and isbn_13_valid ("Whether the ISBN-13 is a valid number") --
# plus isbns_match ("Whether the ISBN-10 and ISBN-13 point to the same
# edition"). Hardcover does not refuse to store a checksum-invalid ISBN; it
# stores what a cataloguer entered and carries a computed, separate boolean
# saying whether it passes the check-digit algorithm. That is a third
# answer this batch has not seen elsewhere: not silently accepted as
# though it were fine, and not rejected outright, but held and flagged.
# This Recipe could not observe a record where any of the three actually
# reads false -- see the fidelity gaps below for why -- so it declares the
# fields, sourced, and fixtures none of them with an invented value.
#
# **Unauthenticated introspection does not work, which is Hardcover's own
# answer to the question recipes/taddy/recipe.yaml's header poses for this
# mechanism, and it is the opposite answer.** Taddy lets any query through
# to its GraphQL layer and only degrades what comes back depending on the
# credential -- 200 with data nulled out for no key, 500 for a wrong one,
# and introspection answers regardless. Hardcover's gate sits in front of
# GraphQL entirely: every query this Recipe sent without a valid bearer
# token, introspection included, was refused before it was ever parsed,
# by an HTTP-layer check that does not know or care what the query asked
# for. Confirmed live today by sending an ordinary field query and an
# __schema introspection query through the identical absent-credential
# path and getting the identical refusal both times.
#
# **The credential check is a clean three-way split, and it lines up
# exactly onto this format's absent/malformed/rejected verdicts -- no
# workaround needed, unlike Taddy's status-code trick or Census's
# per-method routes elsewhere in this collection:**
#
#   no Authorization header at all
#     -> 400 {"error":"invalid_request","error_description":"No
#             Authorization header"}
#   Authorization: junkkey12345                (no "Bearer " prefix)
#     -> 400 {"error":"invalid_request","error_description":"Invalid
#             Authorization format. Use 'Bearer <token>'"}
#   Authorization: Bearer junkkey12345          (right shape, wrong token)
#     -> 401 {"error":"invalid_token","error_description":"Token is not
#             associated with a user"}
#
# every one of those also carries a WWW-Authenticate challenge header
# naming the same error and description a second time -- Bearer
# realm="hardcover", error="...", error_description="...". Hardcover's own
# published response-code table (docs.hardcover.app/api/getting-started/)
# documents only two of these three 400/401 shapes ("Malformed request
# body, or an unparseable GraphQL query" for 400, and "Missing, invalid, or
# expired token" for 401) -- the credential-format distinction above is not
# in that table at all, and this Recipe found it by sending the requests
# rather than reading about them.
#
# **Routing beats the credential for a path that plainly does not exist,
# and there the docs and the wire agree with each other and with Google
# Books' Recipe in this same batch: no 405 exists anywhere on this host
# either.** A path this API does not serve, with and without a credential:
#
#   POST /v1/nosuchroute            -> 404, a branded "Page Not Found |
#                                        Hardcover" HTML page, either way
#
# so after_routing: true. But the real finding is what happens on the
# *real* path with the *wrong* method, and it does not match either half
# of this format's own boolean. GET, PUT, DELETE and PATCH against
# /v1/graphql all answered the identical 400 "No Authorization header" the
# real POST route gets -- the same auth gate, not a routing miss -- while
# TRACE against the same path 404s exactly like an unrouted one does. So
# the gate here is bound to the *path*, not to the (method, path) pair
# Cauldron's own router keys on, and whether a method is "wrong" depends on
# whether the frontend recognises it as an HTTP verb at all, not on
# whether this particular route declares it. Once this Recipe declares a
# POST route for /v1/graphql, Cauldron will synthesise a 405 with
# Allow: POST for GET, PUT, DELETE, PATCH and TRACE alike -- a status this
# Recipe watched the real host never send on any of five methods it tried.
# No conformance case below claims one. See recipes/googlebooks/recipe.yaml's
# header for the sibling Recipe in this batch that hit the identical
# mechanism from the identical cause.
#
# **A fourth verdict, documented rather than observed: a token that
# authenticates and is refused anyway.** Hardcover's own response-code
# table names it directly -- 403, "Missing scope, disallowed operation,
# over the top-level query/mutation limit... or no access to the requested
# resource," with a worked *shape*, {"error": "insufficient_scope",
# "error_description": "...", "scope": "..."}, but no worked *text*: every
# value in that row is a placeholder in Hardcover's own docs, not a real
# example. The Actions & Scopes reference (docs.hardcover.app/api/graphql/
# actions/) confirms editions and books both need one of read:catalog,
# read:catalog:data or read:catalog:search, so a token holding some other
# scope entirely -- read:social, say -- would authenticate and be refused
# querying either. auth.unentitled below names a fixture key for exactly
# that token. Sending it was never possible without a real account, so
# this Recipe uses the mechanism Step 2a of this batch's own brief
# describes it for -- a documented valid-but-not-entitled refusal, proven
# as a request a conformance case can make rather than only as a shape a
# fault injection could demonstrate -- and it fixtures the status and the
# code only, because the description Hardcover's own table shows is itself
# a placeholder and inventing one would be worse than leaving it out.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No populated edition anywhere in this file. Every query example
#     docs.hardcover.app publishes for editions and books -- "Get Edition
#     Details by ISBN," "Get All Editions of a Book," and the rest -- shows
#     the *request* and never the JSON that came back, unlike Taddy's
#     Recipe in this collection, which could copy two full worked bodies
#     verbatim from taddy.org. And no key this Recipe held could reach a
#     real one: see the introspection finding above -- nothing gets past
#     the gate without a real bearer token. So the isbn_10_valid /
#     isbn_13_valid / isbns_match triad, and every other field below, is
#     declared with its documented name and type and fixtured in no record
#     at all.
#   - The one conformance case that does reach the editions route asserts
#     only that a filter matching nothing answers an empty array at 200,
#     which is not itself something Hardcover's docs state in words -- it
#     follows from what a GraphQL list-typed root field is contractually
#     guaranteed to resolve to (an array, never null, never a 404, because
#     GraphQL has no per-field HTTP status), applied to the where/_eq
#     filter syntax Hardcover's own query examples use. That case carries
#     no verified date for the same reason nothing else past the
#     credential gate does.
#   - The wrong-method finding above is not modelled as a case. See the
#     header for why: every synthesised 405 Cauldron could produce here
#     contradicts something this Recipe actually watched the real host do.
#   - No upstream.spec. GraphQL has no OpenAPI-shaped description to fetch
#     and fingerprint -- the identical gap recipes/taddy/recipe.yaml states
#     for the identical reason. What this Recipe read instead was
#     Hardcover's own hand-written schema reference pages, cited by URL
#     throughout rather than fingerprinted.
#   - Rate limits (daily/burst/per-minute, by plan) and the five-top-level-
#     query cap are documented at docs.hardcover.app/api/getting-started/
#     and not modelled: reaching either requires a real, working key this
#     Recipe never held.

recipe: hardcover
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.hardcover.app/api/getting-started/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - hardcover_cauldron_fixture_pat_00000000
  # A token that authenticates and is refused for scope -- see the header.
  # Never accepted; the validator refuses a Recipe naming a key in both
  # places.
  unentitled:
    - hardcover_cauldron_fixture_scoped_pat_00000000
  unentitled_error: insufficient_scope
  absent_error: no_auth_header
  malformed_error: bad_auth_format
  rejected_error: invalid_token
  # Routing beats the credential for a genuinely unrouted path -- see the
  # header for the real host's messier answer on a wrong method, which
  # this flag cannot express and this Recipe does not force.
  after_routing: true

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    # {"error": "...", "error_description": "..."} on every failure this
    # Recipe saw, credential and scope alike.
    style: flat
    message_field: error_description
    code_field: error

resources:
  edition:
    # A plain array under data.editions -- no edges, no node, no cursor.
    # Hardcover's own query examples filter it with where/_eq, the same
    # convention throughout its schema reference.
    collection: data.editions
    id:
      style: numeric
      field: id
      type: number
    fields:
      title:
        type: string
        null_when_unset: true
      # The pair this batch's checksum question asks about by name -- see
      # the header. Computed, not enforced: a checksum-invalid ISBN is
      # stored and flagged rather than refused.
      isbn_10:
        type: string
        null_when_unset: true
      isbn_10_valid:
        type: boolean
        null_when_unset: true
      isbn_13:
        type: string
        null_when_unset: true
      isbn_13_valid:
        type: boolean
        null_when_unset: true
      # "Whether the ISBN-10 and ISBN-13 point to the same edition" -- a
      # third, cross-field check beside the two above.
      isbns_match:
        type: boolean
        null_when_unset: true
      # Amazon's own identifier, a vendor id beside the two standard ones.
      # "For printed books, the ISBN-10 is usually the same as the ASIN" --
      # per docs.hardcover.app/librarians/resources/isbnandasin/ -- usually,
      # not always, which is why this is its own field rather than an
      # alias.
      asin:
        type: string
        null_when_unset: true
      edition_format:
        type: string
        null_when_unset: true
      pages:
        type: integer
        null_when_unset: true
      # A bare date (YYYY-MM-DD), not a full timestamp -- this format has
      # no "date" type, and "string" is the closer of the two lies to tell.
      release_date:
        type: string
        null_when_unset: true
      # The parent work -- title, id, rating and more, none of it
      # fixtured. The relation this whole header is about.
      book:
        type: map
        null_when_unset: true
      publisher:
        type: map
        null_when_unset: true

routes:
  # One path, one method, for the entire API -- no selects, because every
  # query this Recipe ever sent, introspection included, reaches the same
  # gate before anything about its content is examined. See the header.
  - method: POST
    path: /v1/graphql
    resource: edition
    operation: list

errors:
  # Never reached directly: every verdict below names its own entry.
  authentication_error:
    status: 401
    code: invalid_token
    message: Token is not associated with a user

  no_auth_header:
    status: 400
    code: invalid_request
    message: No Authorization header
    headers:
      Content-Type: application/json; charset=utf-8
      WWW-Authenticate: 'Bearer realm="hardcover", error="invalid_request", error_description="No Authorization header"'

  bad_auth_format:
    status: 400
    code: invalid_request
    message: "Invalid Authorization format. Use 'Bearer <token>'"
    headers:
      Content-Type: application/json; charset=utf-8
      WWW-Authenticate: 'Bearer realm="hardcover", error="invalid_request", error_description="Invalid Authorization format. Use ''Bearer <token>''"'

  invalid_token:
    status: 401
    code: invalid_token
    message: Token is not associated with a user
    headers:
      Content-Type: application/json; charset=utf-8
      WWW-Authenticate: 'Bearer realm="hardcover", error="invalid_token", error_description="Token is not associated with a user"'

  # Documented, not observed -- see the header. The code is Hardcover's own
  # quoted literal; the description is not, because Hardcover's own table
  # never shows one, only a placeholder. message_field is cleared for this
  # one entry rather than render a sentence nobody published.
  insufficient_scope:
    status: 403
    code: insufficient_scope
    message_field: "-"
    headers:
      Content-Type: application/json; charset=utf-8

  # Hardcover's own branded page, HTML, on a host whose every real answer
  # is JSON -- overrides the Recipe-wide flat style, because this is a
  # different program answering (the frontend router, not the GraphQL
  # gate).
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/html; charset=UTF-8
    message: |
      <!doctype html>

      <html lang="en">

      <head>
        <title>Page Not Found | Hardcover</title>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <meta name="robots" content="noindex, nofollow">
        <link rel="stylesheet" href="/error-pages.css">
        <link rel="icon" href="https://assets.hardcover.app/static/favicon.ico">
      </head>

      <body>

fixtures:
  empty: {}

conformance:
  - name: no Authorization header at all is refused before an ordinary query is even parsed
    source: https://api.hardcover.app/v1/graphql
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      json:
        query: "{ editions(where: {isbn_13: {_eq: \"9780547928227\"}}) { id } }"
    expect:
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
        WWW-Authenticate: 'Bearer realm="hardcover", error="invalid_request", error_description="No Authorization header"'
      body:
        error: invalid_request
        error_description: No Authorization header

  - name: and introspection gets refused by the identical gate, unparsed
    source: https://api.hardcover.app/v1/graphql
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      json:
        query: "{ __schema { queryType { name } } }"
    expect:
      status: 400
      body:
        error: invalid_request
        error_description: No Authorization header

  - name: a credential with no Bearer prefix is malformed, not merely wrong
    source: https://api.hardcover.app/v1/graphql
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      headers:
        Authorization: junkkey12345
      json:
        query: "{ __typename }"
    expect:
      status: 400
      headers:
        WWW-Authenticate: 'Bearer realm="hardcover", error="invalid_request", error_description="Invalid Authorization format. Use ''Bearer <token>''"'
      body:
        error: invalid_request
        error_description: "Invalid Authorization format. Use 'Bearer <token>'"

  - name: the right shape with a token nobody issued is a third status entirely
    source: https://api.hardcover.app/v1/graphql
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      headers:
        Authorization: Bearer junkkey12345
      json:
        query: "{ __typename }"
    expect:
      status: 401
      body:
        error: invalid_token
        error_description: Token is not associated with a user

  - name: a path this API does not serve gets a branded page, not the GraphQL gate
    source: https://api.hardcover.app/v1/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/nosuchroute
      json:
        query: "{ __typename }"
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=UTF-8
      body_matches: '^<!doctype html>'

  - name: and the identical page whether or not a credential is presented
    source: https://api.hardcover.app/v1/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v1/nosuchroute
      headers:
        Authorization: Bearer junkkey12345
      json:
        query: "{ __typename }"
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=UTF-8

  - name: a token missing the catalog scope authenticates and is refused anyway
    source: https://docs.hardcover.app/api/getting-started/
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      headers:
        Authorization: Bearer hardcover_cauldron_fixture_scoped_pat_00000000
      json:
        query: "{ editions(where: {isbn_13: {_eq: \"9780547928227\"}}) { id } }"
    expect:
      status: 403
      body:
        error: insufficient_scope

  - name: an ISBN-13 filter matching no edition answers an empty array, not a 404
    source: https://docs.hardcover.app/api/graphql/schemas/editions/
    fixture: empty
    request:
      method: POST
      path: /v1/graphql
      headers:
        Authorization: Bearer hardcover_cauldron_fixture_pat_00000000
      json:
        query: "{ editions(where: {isbn_13: {_eq: \"0000000000404\"}}) { id isbn_13 isbn_13_valid } }"
    expect:
      status: 200
      body:
        data.editions: []
