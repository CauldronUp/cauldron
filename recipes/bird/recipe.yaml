# Bird Recipe for Cauldron
#
# Written against Bird's API reference at docs.bird.com and struck live against
# api.bird.com on 2026-09-07 with no credential, with a deliberately invalid
# one, and on a path that does not exist.
#
# **The code is the status phrase and the message is the status phrase in a
# sentence.** Struck live, identically all three times:
#
#   401 {"code":"Unauthorized","message":"The request is not authorized"}
#
# `code` is `Unauthorized` -- the reason phrase, capitalised, in the field a
# client branches on. `message` is the same fact written out. Two fields, one
# of them machine-readable in shape and neither carrying anything the status
# line did not.
#
# It is the passive voice again, as in [revai](../revai): "The request is not
# authorized" names no actor and no reason. Nothing says whether a credential
# was sent, whether it was readable, or which header it belonged in.
#
# **One response to three mistakes.** A missing credential, a wrong credential
# and an unknown path, byte-identical -- so route existence is not discoverable
# and the two credential failures cannot be told apart.
#
# **The scheme is `AccessKey`.** `Authorization: AccessKey <key>`, which Bird
# inherited from MessageBird before the rename -- so the scheme name is a
# product that no longer exists, no HTTP library has a helper for it, and the
# refusal above does not mention it.
#
# **The company was renamed and the API kept the old shape.** MessageBird
# became Bird; the host is `api.bird.com`; the credential scheme still says
# MessageBird's word. The third provider in this collection whose name and wire
# format disagree, after [maxio](../maxio) at chargify.com and
# [terraformcloud](../terraformcloud) at app.terraform.io -- and here it is the
# credential rather than the hostname that carries the old name, which is the
# harder one to notice.

recipe: bird
capability: sms
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.bird.com/api
  # No spec: Bird publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  # MessageBird's word, on Bird's host, years after the rename -- and no HTTP
  # library has a helper for it.
  prefix: "AccessKey "
  keys:
    - cauldr0nb1rdf1xtureaccesskey0000
  # One response to everything, struck live.
  absent_error: unauthorized
  rejected_error: unauthorized
  malformed_error: unauthorized

responses:
  list:
    style: wrapped
    key: results
    cursor_field: nextPageToken
  error:
    style: flat
    message_field: message
    # The reason phrase, capitalised, in the field a client branches on.
    code_field: code
    code_type: string

resources:
  workspace:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      region:
        type: string
        default: eu
      createdAt:
        type: datetime
      plan:
        type: string

routes:
  - method: GET
    path: /workspaces
    resource: workspace
    operation: list
    pagination:
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: pageToken

errors:
  unauthorized:
    status: 401
    code: Unauthorized
    # Passive, naming no actor and no reason -- nothing says whether a
    # credential was sent, whether it was readable, or which header it
    # belonged in.
    message: "The request is not authorized"

fixtures:
  empty:
    workspace: []

  organization:
    workspace:
      - id: 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de
        name: Cauldron
        region: eu
        createdAt: "2026-04-11T08:30:00.000Z"
        plan: growth
      - id: 8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5
        name: Cauldron US
        # A second workspace in another region, on the same organisation --
        # so where messages are processed is per workspace and a client
        # cannot assume one jurisdiction for an account.
        region: us
        createdAt: "2026-07-19T15:40:22.000Z"

conformance:
  - name: the code is the status phrase
    source: https://api.bird.com/workspaces
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers: {}
    expect:
      status: 401
      body:
        # Capitalised, in the field a client branches on -- and derivable
        # from the status line, so it carries nothing new.
        code: Unauthorized
        message: "The request is not authorized"

  - name: the message is passive and names no actor
    source: https://api.bird.com/workspaces
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers: {}
    expect:
      status: 401
      body:
        # Nothing says whether a credential was sent, whether it was
        # readable, or which header it belonged in -- the same passive
        # construction Rev.ai uses.
        message: "The request is not authorized"

  - name: a wrong credential is byte-identical
    source: https://api.bird.com/workspaces
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey notreal"
    expect:
      status: 401
      body:
        code: Unauthorized
        message: "The request is not authorized"

  - name: an unknown path is the same response again
    source: https://api.bird.com/cauldron-nope
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /cauldron-nope
      headers:
        Authorization: "AccessKey notreal"
    expect:
      # Three mistakes, one answer -- so route existence is not discoverable
      # and the two credential failures cannot be told apart.
      status: 401
      body:
        code: Unauthorized

  - name: a Bearer prefix is not the scheme this API takes
    source: https://docs.bird.com/api
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        # What every HTTP library's built-in helper sends. Bird takes
        # `AccessKey`, which is MessageBird's word from before the rename,
        # and the refusal does not mention it.
        Authorization: "Bearer cauldr0nb1rdf1xtureaccesskey0000"
    expect:
      status: 401
      body:
        code: Unauthorized

  - name: workspaces are wrapped under a key called results
    source: https://docs.bird.com/api
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
    expect:
      status: 200
      body:
        'results[0].name': Cauldron
        'results[0].id': 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de

  - name: the region is per workspace rather than per organisation
    source: https://docs.bird.com/api
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
    expect:
      status: 200
      body:
        # Where messages are processed, on the record rather than on the
        # account -- so one organisation can span jurisdictions and a client
        # cannot assume one for all of them.
        'results[0].region': eu
        'results[1].region': us

  - name: a workspace without a plan omits the field
    source: https://docs.bird.com/api
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
    expect:
      status: 200
      body:
        'results[0].plan': growth
        'results[1].createdAt': "2026-07-19T15:40:22.000Z"
      absent:
        # So a client rendering a plan badge has to handle undefined, and
        # cannot tell "no plan" from "free".
        - 'results[1].plan'

  - name: the request and the response spell the cursor differently
    source: https://docs.bird.com/api
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'results[0].name': Cauldron
      matches:
        # `pageToken` going out and `nextPageToken` coming back, so a client
        # cannot pass the field straight through and has to rename it.
        nextPageToken: '.'

  - name: workspaces page on a token
    source: https://docs.bird.com/api
    fixture: organization
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
      query:
        limit: "1"
        # `pageToken` going out and `nextPageToken` coming back, so the
        # request and the response spell the same value two ways.
        pageToken: 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de
    expect:
      status: 200
      body:
        'results[0].name': Cauldron US
      absent:
        - nextPageToken

  - name: an organisation with no workspaces answers an empty array
    source: https://docs.bird.com/api
    fixture: empty
    request:
      method: GET
      path: /workspaces
      headers:
        Authorization: "AccessKey cauldr0nb1rdf1xtureaccesskey0000"
    expect:
      status: 200
      body:
        results: []
