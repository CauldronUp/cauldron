                amount: 24.99
                fractionalAmount: 2499
                fractionDigits: 2

conformance:
  - name: an order total names its currency four times
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 2) { edges { node { id number total { currency gross { amount fractionalAmount } } } } } }"
    expect:
      status: 200
      body:
        # Once on the TaxedMoney, and once inside each of gross, net and tax.
        "data.orders.edges[0].node.total.currency": EUR
        "data.orders.edges[0].node.total.gross.currency": EUR
        "data.orders.edges[0].node.total.net.currency": EUR
        "data.orders.edges[0].node.total.tax.currency": EUR

  - name: and the same amount twice, only one of which is safe to add up
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 2) { edges { node { total { gross { amount fractionalAmount fractionDigits } } } } } }"
    expect:
      status: 200
      body:
        # Three lines of 19.99. Summed as Floats that is 59.969999999999999;
        # summed as Ints it is 5997, and fractionDigits is the only thing
        # that says where the point goes.
        "data.orders.edges[0].node.total.gross.amount": 59.97
        "data.orders.edges[0].node.total.gross.fractionalAmount": 5997
        "data.orders.edges[0].node.total.gross.fractionDigits": 2
        "data.orders.edges[0].node.lines[0].unitPrice.gross.amount": 19.99
        "data.orders.edges[0].node.lines[0].unitPrice.gross.fractionalAmount": 1999

  - name: a product has no price on it
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ products(first: 2, channel: \"default-channel\") { edges { node { id name pricing { priceRange { start { gross { amount } } } } } } } }"
    expect:
      status: 200
      body:
        # Five levels from the product to a number, because variants differ
        # and the answer is a range rather than a price.
        "data.products.edges[0].node.pricing.priceRange.start.gross.amount": 19.99
        "data.products.edges[0].node.pricing.priceRange.stop.gross.amount": 24.99
      absent:
        # And nothing shorter. There is no amount and no price sitting on
        # pricing itself, so there is no single number to read: a caller has
        # to decide which bound of the range it means before it has a figure
        # at all.
        - "data.products.edges[0].node.pricing.amount"
        - "data.products.edges[0].node.pricing.price"

  - name: and the range is null when nothing is listed
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ products(first: 2) { edges { node { id pricing { priceRange { start { gross { amount } } } } } } } }"
    expect:
      status: 200
      body:
        # Every level of that path is nullable, and this is the product where
        # it matters: one guard short and the client throws on the second row
        # of a listing that worked on the first.
        "data.products.edges[1].node.name": Banana Juice
        "data.products.edges[1].node.pricing.priceRange": null

  - name: two fields are deprecated because they always return null
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ products(first: 1) { edges { node { pricing { priceRangeLocalCurrency { start { gross { amount } } } discountLocalCurrency { gross { amount } } } } } } }"
    expect:
      status: 200
      body:
        # Declared, typed, and null forever. The schema's own deprecation
        # reason is the sentence "Always returns `null`", so a client cannot
        # tell an absent value from a feature that was never built.
        "data.products.edges[0].node.pricing.priceRangeLocalCurrency": null
        "data.products.edges[0].node.pricing.discountLocalCurrency": null

  - name: metadata is an array and a lookup is a scan
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ products(first: 1) { edges { node { metadata { key value } metafields } } } }"
    expect:
      status: 200
      body:
        # Objects with a key and a value, in an array, so product.metadata.sku
        # is undefined and finding the sku means walking the list.
        "data.products.edges[0].node.metadata[1].key": sku
        "data.products.edges[0].node.metadata[1].value": AJ-1000
        # And the same two entries as a map, under a name a client has to
        # know to ask for.
        "data.products.edges[0].node.metafields.sku": AJ-1000
        "data.products.edges[0].node.metafields.warehouse": rotterdam

  - name: a mutation reports its failures twice
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "mutation { productCreate(input: {name: \"Cherry Juice\"}) { errors { field message } productErrors { field message } product { id } } }"
    expect:
      status: 200
      body:
        # Both arrays, both empty, both present. The second is deprecated with
        # the reason "Use `errors` field instead", and both are still served,
        # so a client can read either and be right for now.
        "data.productCreate.errors": []
        "data.productCreate.productErrors": []

  - name: an identifier is base64 and what it decodes to differs by type
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/core/utils/__init__.py
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 1) { edges { node { id number } } } }"
    expect:
      status: 200
      body:
        # base64 of "Order:" and a UUID. A product's is base64 of "Product:"
        # and an integer, so one decoder handles both and neither result is
        # comparable with the other.
        "data.orders.edges[0].node.id": T3JkZXI6NWQxZTZmMmEtOGIwNC00YzdlLTkxYTMtNmYwZDJiOGU0NTcx
        # And the number a person quotes, which is a String and is neither
        # the id nor an integer.
        "data.orders.edges[0].node.number": "1023"

  - name: the balance is a plainer kind of money and can be negative
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 2) { edges { node { number totalBalance { amount fractionalAmount } } } } }"
    expect:
      status: 200
      body:
        # A Money rather than a TaxedMoney, so there is no gross and no net to
        # read -- code that unwraps every money field the same way finds
        # undefined here.
        "data.orders.edges[1].node.totalBalance.amount": -10.0
        "data.orders.edges[1].node.totalBalance.fractionalAmount": -1000
      absent:
        - "data.orders.edges[1].node.totalBalance.gross"
        - "data.orders.edges[1].node.totalBalance.net"

  - name: a refusal is a 200 with the reason inside extensions
    source: https://github.com/saleor/saleor/blob/main/saleor/graphql/schema.graphql
    fixture: catalogue
    arm: permission_denied
    request:
      method: POST
      path: /graphql/
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 1) { edges { node { id } } } }"
    expect:
      # The half this Recipe shares with the other GraphQL one here, and it is
      # stated rather than claimed: response.ok is true for a request that
      # returned nothing.
      status: 200
      body:
        "errors[0].extensions.exception.code": PermissionDenied
        data: null
      matches:
        "errors[0].message": MANAGE_PRODUCTS

  - name: the endpoint ends in a slash
    source: https://github.com/saleor/saleor/blob/main/saleor/urls.py
    fixture: catalogue
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: Bearer cauldron.saleor.fixture.jwt.000000
        Content-Type: application/json
      json:
        query: "{ orders(first: 1) { edges { node { id } } } }"
    expect:
      # urls.py anchors the pattern as ^graphql/$, so this is not that route.
      # Django would answer a redirect and a client that follows one with a
      # POST can lose the body; here it is simply not found, which is the
      # same lesson arrived at more bluntly.
      status: 404
