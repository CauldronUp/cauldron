# Saleor Recipe for Cauldron
#
# Written against Saleor's own repository: the GraphQL schema it publishes at
# saleor/graphql/schema.graphql, and, for the things a schema cannot say, the
# Python beside it -- saleor/urls.py for the endpoint and saleor/core/auth.py
# for the credential. Every field name, type, deprecation reason and quoted
# sentence below was read out of one of those files.
#
# It is not a second Shopify GraphQL Recipe. Two things they share are stated
# as shared rather than claimed as findings: a connection is edges and node
# rather than an array, and a refusal arrives with HTTP 200. Both are already
# modelled in shopifygraphql and neither is why this file exists.
#
# What is different is the money.
#
# Saleor's Money type carries the same amount twice and the currency once:
#
#   Money { currency: String!, amount: Float!,
#           fractionalAmount: Int!, fractionDigits: Int! }
#
# and its TaxedMoney carries three of those plus a currency of its own:
#
#   TaxedMoney { currency: String!, gross: Money!, net: Money!, tax: Money! }
#
# So an order total names its currency four times and its value eight ways,
# and the two representations are not equally safe. `amount` is a GraphQL
# Float, which is an IEEE 754 double; `fractionalAmount` is an Int in the
# currency's smallest unit, with `fractionDigits` beside it saying how many
# there are. Three line items at 19.99 sum to 59.969999999999999 through the
# first field and to 5997 exactly through the second.
#
# The field a client reaches for is the unsafe one. It has the obvious name,
# it is a number rather than an integer count, and it agrees with the safe one
# on every small figure anybody checks by hand. The disagreement arrives on a
# basket, in a report, at the end of a month.
#
# Six more, each from the same repository:
#
#   1. A product has no price. It has pricing.priceRange.start.gross.amount --
#      five levels down -- because variants differ, so the price is a range
#      with a lower and an upper bound. Both bounds are nullable, and so is
#      the range, and so is pricing.
#   2. Metadata is an array of {key, value} objects, not a map, so
#      product.metadata.sku is undefined and the lookup is a scan. Saleor also
#      offers the same data as a map, under a different name -- metafields --
#      and a staff-only twin of both under privateMetadata.
#   3. Five fields in the schema are deprecated with the reason "Always
#      returns `null`". They are still declared, still typed, and answer null
#      forever, so a client cannot tell "no value" from "never implemented".
#   4. Every mutation returns its failures twice: an `errors` array and a
#      deprecated typed alias beside it -- productErrors, orderErrors -- with
#      the same contents. Reading either works; reading the wrong one on an
#      older or newer server does not.
#   5. One credential, three spellings. auth.py reads a header called
#      Authorization-Bearer with no prefix at all, and failing that reads
#      Authorization and accepts either JWT or BEARER in front of the token,
#      compared case-insensitively.
#   6. The endpoint is /graphql/ with a trailing slash. urls.py anchors the
#      pattern as ^graphql/$, so the path without it is not that route.
#
# Identifiers are base64. from_global_id_or_error's docstring lists the forms
# it accepts -- "'<type>:<int>' : Internal ID containing object type and ID as
# integer" and "'<type>:<UUID>'" -- so a product id decodes to Product:12 and
# an order id to Order: a UUID, and neither is a number a client can compare
# or sort.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No GraphQL is parsed. A query naming products gets the products fixture
#     whatever fields it asked for. This reproduces the envelope, the
#     connection shape, the money and the vocabulary rather than the query
#     language -- the same bargain the other GraphQL Recipe here makes.
#   - Only Authorization: Bearer is accepted. The other two spellings are
#     real and are not served, so a client using JWT or Authorization-Bearer
#     is refused here and accepted in production. That is the loud direction
#     of the mistake, which is why it is acceptable to leave standing.
#   - Nothing is filtered or ordered, and channel is accepted and honoured by
#     nothing. first and after used to be in that sentence: they are declared
#     on the route now as variables.first and variables.after, so a client
#     passing them as variables is paged. One inlining them in the query
#     document still is not -- no GraphQL is parsed here.
#   - Channels are the thing a real Saleor request cannot omit and this one
#     can: pricing depends on the channel a query names, and here it does not.
#     A single channel's prices are what the fixtures hold.
#   - Checkout, payment, shipping, attributes, translations and the whole
#     permission model are absent. Products and orders, read, plus one
#     mutation to show where failures live.
#
# No case here carries a verified date, and none can. Saleor is open source
# and self-hosted; there is no single API host the way there is for a SaaS
# product. Checked 2026-09-05: demo.saleor.io, the storefront Saleor itself
# points newcomers at, is a Next.js frontend, and /graphql/ on it answers
# that frontend's own generic 404 page, not a GraphQL response -- the
# storefront calls an API host of its own that is not exposed at this
# address. saleor-demo-store.saleor.cloud, an older hosted-demo hostname
# that used to serve one, still resolves but answers a bare "Not Found"
# from a CloudFront distribution with no origin behind it -- a
# Lambda@Edge fallback, not an application -- meaning the demo instance
# that once lived there is gone and the DNS record outlived it. Every
# route below is read from saleor/urls.py and saleor/core/auth.py in
# Saleor's own repository, which is a real, current, machine-readable
# source; there is simply nowhere unauthenticated to point a request that
# answers as the application rather than as infrastructure with nothing
# behind it.
#
# The token below is a fixture and belongs to no shop.

recipe: saleor
capability: commerce
version: 0.1.0

upstream:
  api: graphql
  docs: https://docs.saleor.io/api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.saleor.fixture.jwt.000000

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    # 200 with an errors array, which is GraphQL's shape and is the half this
    # Recipe shares with the other GraphQL one here.
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"
    fields:
      # Beside the array, and null. A refused request still answers with the
      # data key, holding nothing, so a client that checks for the key rather
      # than for its contents finds one either way.
      data: null

resources:
  product:
    collection: data.products.edges
    id:
      # base64 of "Product:12". Not a number, not sortable, and not the same
      # string on a server whose primary keys differ.
      style: opaque
      field: node.id
    fields:
      # The cursor belongs to the edge rather than to the product, which is
      # the entire reason an edge is a separate object.
      cursor:
        type: string
      name:
        type: string
        in: node
        as: name
      slug:
        type: string
        in: node
        as: slug
      # A range, because variants differ, with the money four levels below it.
      pricing:
        type: map
        in: node
        as: pricing
      # An array of {key, value}. Not a map, however much it reads like one.
      metadata:
        type: list
        in: node
        as: metadata
      # And the same data as a map, under a name a client has to know to ask
      # for.
      metafields:
        type: map
        in: node
        as: metafields

  order:
    collection: data.orders.edges
    id:
      # base64 of "Order:" and a UUID, where a product's is base64 of
      # "Product:" and an integer. One encoding, two kinds of key inside it.
      style: opaque
      field: node.id
    fields:
      cursor:
        type: string
      # A String, and the schema says so: "User-friendly number of an order".
      # It is not the id and it is not a number either.
      number:
        type: string
        in: node
        as: number
      status:
        type: string
        in: node
        as: status
      # The whole point of this Recipe: currency four times, value eight ways.
      total:
        type: map
        in: node
        as: total
      # "The difference between the paid and the order total amount", which
      # can be negative and is a Money rather than a TaxedMoney.
      totalBalance:
        type: map
        in: node
        as: totalBalance
      created:
        type: string
        in: node
        as: created
      lines:
        type: list
        in: node
        as: lines

routes:
  # One path for everything, and it ends in a slash. urls.py anchors the
  # pattern as ^graphql/$.
  - method: POST
    path: /graphql/
    resource: product
    operation: list
    pagination:
      # first and after, in the request body, under variables -- which is
      # where a client that passes them as GraphQL variables puts them, and
      # the only place anything here can read them from.
      #
      # This does not parse GraphQL, which is a gap this Recipe already
      # states. So a query that inlines its arguments in the document --
      # products(first: 10, after: "...") -- is still not read, and still
      # answers the whole fixture. What changes is the other spelling: a
      # client sending {"query": "...", "variables": {"first": 2}} now gets
      # two records instead of all of them, because the declaration names
      # where to look. The alternative was the engine's default, which reads
      # "limit" out of the query string of a POST -- a name no GraphQL
      # client has ever sent.
      #
      # No default is declared with them. Saleor requires first or last on a
      # connection rather than supplying a number of its own, so there is no
      # provider default to state and the engine's own ten stands as the
      # fallback for a request that names neither.
      style: cursor
      limit_param: variables.first
      cursor_param: variables.after
      in: body
    selects: products
    fields:
      data.products.pageInfo.hasNextPage: false
      data.products.pageInfo.endCursor: WyJwcm9kdWN0OjEzIl0=
      # Nullable on the connection, which is worth sending as a number so a
      # client can see it is there at all.
      data.products.totalCount: 2

  - method: POST
    path: /graphql/
    resource: order
    operation: list
    pagination:
      # first and after, in the request body, under variables -- which is
      # where a client that passes them as GraphQL variables puts them, and
      # the only place anything here can read them from.
      #
      # This does not parse GraphQL, which is a gap this Recipe already
      # states. So a query that inlines its arguments in the document --
      # products(first: 10, after: "...") -- is still not read, and still
      # answers the whole fixture. What changes is the other spelling: a
      # client sending {"query": "...", "variables": {"first": 2}} now gets
      # two records instead of all of them, because the declaration names
      # where to look. The alternative was the engine's default, which reads
      # "limit" out of the query string of a POST -- a name no GraphQL
      # client has ever sent.
      #
      # No default is declared with them. Saleor requires first or last on a
      # connection rather than supplying a number of its own, so there is no
      # provider default to state and the engine's own ten stands as the
      # fallback for a request that names neither.
      style: cursor
      limit_param: variables.first
      cursor_param: variables.after
      in: body
    selects: orders
    fields:
      data.orders.pageInfo.hasNextPage: false
      data.orders.pageInfo.endCursor: WyJvcmRlcjoyIl0=
      data.orders.totalCount: 2

  # A mutation that succeeds, and still carries both error arrays. Empty,
  # present, and duplicated -- which is the thing to look at.
  - method: POST
    path: /graphql/
    resource: product
    operation: create
    selects: productCreate
    fields:
      data.productCreate.errors: []
      # The same list under the deprecated name. "Use `errors` field instead."
      data.productCreate.productErrors: []

errors:
  # A refusal on permission grounds, which arrives at 200 like everything else
  # GraphQL refuses, with the reason inside extensions.
  permission_denied:
    status: 200
    message: "To access this path, you need one of the following permissions: MANAGE_PRODUCTS."
    fields:
      # Inside the entry, because that is where a GraphQL error carries its
      # reason and a request can be refused several ways at once.
      extensions.exception.code: PermissionDenied

  authentication_error:
    status: 401
    message: Signature has expired.

  rate_limit:
    status: 429
    message: Request was throttled.

fixtures:
  empty: {}

  catalogue:
    product:
      - id: UHJvZHVjdDoxMg==
        cursor: WyJwcm9kdWN0OjEyIl0=
        name: Apple Juice
        slug: apple-juice
        # Five levels from the product to a number, and every level nullable.
        pricing:
          onSale: false
          displayGrossPrices: true
          priceRange:
            start:
              currency: EUR
              gross:
                currency: EUR
                amount: 19.99
                fractionalAmount: 1999
                fractionDigits: 2
              net:
                currency: EUR
                amount: 16.24
                fractionalAmount: 1624
                fractionDigits: 2
              tax:
                currency: EUR
                amount: 3.75
                fractionalAmount: 375
                fractionDigits: 2
            stop:
              currency: EUR
              gross:
                currency: EUR
                amount: 24.99
                fractionalAmount: 2499
                fractionDigits: 2
              net:
                currency: EUR
                amount: 20.32
                fractionalAmount: 2032
                fractionDigits: 2
              tax:
                currency: EUR
                amount: 4.67
                fractionalAmount: 467
                fractionDigits: 2
          # Deprecated with the reason "Always returns `null`", and still
          # here, still typed.
          priceRangeLocalCurrency: null
          discountLocalCurrency: null
        metadata:
          - key: warehouse
            value: rotterdam
          - key: sku
            value: AJ-1000
        metafields:
          warehouse: rotterdam
          sku: AJ-1000
      # A product with no channel listing behind it, so the range is null and
      # so is everything under it. A client that reads
      # pricing.priceRange.start.gross.amount without four guards throws here
      # and not on the one above.
      - id: UHJvZHVjdDoxMw==
        cursor: WyJwcm9kdWN0OjEzIl0=
        name: Banana Juice
        slug: banana-juice
        pricing:
          onSale: false
          displayGrossPrices: true
          priceRange: null
          priceRangeLocalCurrency: null
          discountLocalCurrency: null
        metadata: []
        metafields: {}
    order:
      # Three lines at 19.99. Summing amount gives 59.969999999999999 and
      # summing fractionalAmount gives 5997.
      - id: T3JkZXI6NWQxZTZmMmEtOGIwNC00YzdlLTkxYTMtNmYwZDJiOGU0NTcx
        cursor: WyJvcmRlcjoxIl0=
        number: "1023"
        status: UNFULFILLED
        created: "2026-02-14T09:41:07.512883+00:00"
        total:
          currency: EUR
          gross:
            currency: EUR
            amount: 59.97
            fractionalAmount: 5997
            fractionDigits: 2
          net:
            currency: EUR
            amount: 48.72
            fractionalAmount: 4872
            fractionDigits: 2
          tax:
            currency: EUR
            amount: 11.25
            fractionalAmount: 1125
            fractionDigits: 2
        totalBalance:
          currency: EUR
          amount: 0.0
          fractionalAmount: 0
          fractionDigits: 2
        lines:
          - id: T3JkZXJMaW5lOjE=
            productName: Apple Juice
            quantity: 3
            unitPrice:
              currency: EUR
              gross:
                currency: EUR
                amount: 19.99
                fractionalAmount: 1999
                fractionDigits: 2
      # Part paid, so the balance is negative -- the difference between what
      # has been paid and what is owed, and a Money rather than a TaxedMoney,
      # so it has no gross and no net.
      - id: T3JkZXI6N2EyYzllMTQtM2Y2NS00YjgwLWExZDktNTJjZTA3YjNmNmE4
        cursor: WyJvcmRlcjoyIl0=
        number: "1024"
        status: PARTIALLY_FULFILLED
        created: "2026-02-15T16:02:55.104211+00:00"
        total:
          currency: EUR
          gross:
            currency: EUR
            amount: 24.99
            fractionalAmount: 2499
            fractionDigits: 2
          net:
            currency: EUR
