# Clever Recipe for Cauldron
#
# Clever is a rostering API, api.clever.com, Authorization: Bearer, and the
# roster this group's question is actually about lives one hop under a
# course: a Clever Section is a single class period -- one course, one
# teacher, one term, one array of enrolled student ids -- and
# GET /v3.0/sections/{id}/users is the route that answers who is in it.
# Clever's own published OpenAPI description (fetched from
# github.com/Clever/clever-go, the official Go client's own swagger.yml,
# "Data API" version 3.0.1, matching the v3.0 path prefix this Recipe
# probed) declares exactly one non-200 response for that route: 404 Entity
# Not Found. It has no 403 schema, no scoped-empty-array note, nothing at
# all about what a token that can see a section but may not see its roster
# receives. The question this group exists to ask has no answer in Clever's
# own reference either, and this Recipe holds no scoped token to observe one
# live -- stated in the fidelity gaps rather than guessed at.
#
# **The credential draws four distinct lines, not two, and this Recipe could
# reproduce three of them.** Checked live against api.clever.com on
# 2026-09-03, GET /v3.0/districts:
#
#   no Authorization header at all           -> 401 {"code":97,"error":
#                                                "No authorization provided",
#                                                "data":null}
#   Authorization: junktoken12345 (no scheme) -> 401 {"code":96,"error":
#                                                "Malformed authorization
#                                                header provided","data":null}
#   Authorization: Bearer   (nothing after)   -> byte-identical to the above
#   Authorization: Bearer junktoken12345      -> 401 {"code":101,"error":
#                                                "Unrecognized token string",
#                                                "data":null}
#   Authorization: Basic dXNlcjpwYXNz         -> 401 {"code":102,"error":
#                                                "Unrecognized API key",
#                                                "data":null}
#
# Four numeric codes, not one: absent (97), a header present and not a
# credential of any shape (96), a syntactically real bearer token that is
# simply wrong (101), and -- distinct from all three -- Basic-scheme
# credentials, refused under their own code as an "API key" rather than a
# bearer token. That last one is a second credential *transport* Clever
# recognises and this Recipe still cannot hold at once, though not for the
# reason recorded here. This said "Cauldron's auth.scheme is one mechanism per
# Recipe"; auth.also carries one secret through several carriers now, and
# Mezmo's Recipe -- cited below as making the same call -- has since wired all
# three of its own that way.
#
# This one is different, and the difference is the point of that field.
# auth.also is for one secret arriving several ways, and reports every carrier
# through the primary's error mapping. Clever's API-key transport is refused
# under its own code, 102, which is not the bearer scheme's. Wiring it as an
# alternative would serve the bearer sentence to somebody who sent an API key,
# so code 102 stays recorded here rather than reproduced. The
# other three map cleanly onto absent, malformed and rejected -- three
# distinct sentences for three distinct verdicts, more than most Recipes in
# this collection have found on one provider.
#
# **The fourth verdict this brief's mechanisms added -- a key that
# authenticates and is refused anyway -- has no answer here at all, live or
# documented.** This Recipe went looking: the swagger description's own
# securityDefinitions names one OAuth2 flow (accessCode) and declares no
# scopes map underneath it, no 403 response schema on any route, and no
# wording anywhere describing what a validly-authenticated, insufficiently-
# scoped token receives. Reaching a live example would need a registered
# OAuth application and a real district's consent, which this brief's rules
# forbid signing up for. auth.unentitled is not declared here for exactly
# the reason the mechanism exists to distinguish: arming a fault would show
# a shape and say nothing about what triggers it, and inventing a scopes
# vocabulary Clever has not published would be a claim nobody could check.
# Stated as an open gap rather than guessed at.
#
# **Routing and method both win over the credential, the same ordering
# Fireworks' Recipe in this collection verifies for a different provider.**
# Checked live, no Authorization header sent at all:
#
#   GET /v3.0/this-is-not-a-real-endpoint  -> 404 text/html, "Cannot GET
#                                              /v3.0/this-is-not-a-real-
#                                              endpoint" -- plain Express
#                                              text under a Content-Type
#                                              that claims HTML and is not
#   PUT /v3.0/districts (GET-only)         -> 405 Method Not Allowed
#   OPTIONS /v3.0/districts                -> 200 "OK", the CORS preflight
#
# Both the unrouted path and the wrong method answered with no credential
# needed at all, and the wrong method answered a genuine 405 -- the real
# thing this collection keeps finding providers do not send. auth.
# after_routing is true here, verified both ways.
#
# **The 405's own Allow header is not a header at all -- it is nine of
# them.** Checked live, repeatedly, deterministic every time: PUT
# /v3.0/districts answers Content-Length: 18 and a body of "Method Not
# Allowed", and instead of one "Allow: GET" line the raw response carries
# nine separate header fields named "0" through "8", each holding exactly
# one character, that spell out "Allow GET" read in order -- "0: A",
# "1: l", "2: l", "3: o", "4: w", "5: " (a literal space), "6: G", "7: E",
# "8: T". That is not a formatting quirk of any tool this Recipe used to
# read it; curl -D - shows the same nine fields raw, off the wire, on every
# retry. The shape matches a specific, ordinary JavaScript mistake: passing
# a whole string to Express's single-argument res.set(fields) -- which
# expects an object -- rather than res.set('Allow', 'GET'), so Node
# iterates the string's own numeric indices as if they were object keys and
# sends one header per character. This is Clever's own production API,
# live, on 2026-09-03, and it is the sharpest thing this Recipe found.
# Cauldron's own 405 handling computes a correct "Allow: GET" unconditionally
# whenever a Recipe declares this status as 405 -- which is the honest one,
# so this emulator's response carries both a properly-formed Allow header
# alongside the nine broken ones this Recipe declares, rather than only the
# broken ones the live host actually sent. Stated rather than hidden: the
# nine fragments are reproduced and verified; their real host sends no
# properly-named Allow header at all, and this one cannot help but add one.
#
# **The spec and the wire disagree about the shape of a failure, and this
# Recipe can only serve the one it watched happen.** Clever's own swagger.yml
# declares BadRequest, NotFound and InternalError as one identical shape,
# `{"message": "string"}`, with no worked example value for any of them
# anywhere in the document. The wire this Recipe actually reached -- every
# 401 above -- never matches that: `{code, error, data}`, three keys, none
# named message. A 404 Entity Not Found is a route this Recipe declares
# without a not_found override for exactly this reason: Clever's own
# credential check runs ahead of any id lookup (checked live: a bogus
# section id with a wrong bearer token answers the identical 401 the
# districts listing does, not a 404), so this Recipe's fixture credential
# never reaches a real 404 either, and the spec gives nothing to construct
# one from -- no message text, only the type. Left unmodelled rather than
# invented.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No OAuth application was ever registered and no token was ever
#     requested. Every 200 below carries source and no verified date, and
#     every field in it is a name and a type from Clever's own published
#     description -- no worked example exists anywhere in that document for
#     any resource, so every value in the fixture below is an obviously
#     synthetic placeholder rather than a cited real one, per this brief's
#     own instruction for this group.
#   - A Clever Section holds its roster as an array of student ids
#     (`students: [id, id, ...]`) and a user can sit in several sections at
#     once -- a genuine many-to-many relationship this format's scope
#     mechanism, built for a record naming its own single parent, cannot
#     express directly. This Recipe's user fixture carries one internal,
#     unechoed section_id field instead, which is a simplification stated
#     here rather than a claim about how Clever actually stores enrolment.
#   - Districts, schools, courses, terms, resources and events are all real,
#     documented top-level collections and only district and section are
#     modelled, alongside the users nested under a section. This Recipe is
#     about the roster-visibility question the group was written to ask,
#     not a full port of the rostering surface.
#   - GET /v3.0/students and /v3.0/teachers, both real in Clever's older
#     v2.1 API, answer 404 live on v3.0 with no credential presented at
#     all -- checked, and consistent with routing running ahead of the
#     credential. v3.0 unifies both under GET /v3.0/users, checked live as
#     401 (a real, gated route) at the same moment. Not modelled as a route
#     here because the finding is fully carried by the header; the case
#     below proving auth.after_routing already exercises the same 404
#     shape a request to either retired path would answer.
#   - No write operations, no events, no OneRoster comparison. Every route
#     here is a GET.
#
# The key below is a fixture and belongs to no district.

recipe: clever
capability: docs
version: 0.1.0

upstream:
  api: v3.0
  docs: https://dev.clever.com/
  spec: https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml
  spec_hash: 1584dc0fce1786715dd91f9244c2a0f857d25c35e55c0e34bfccb5d0f0eb5952
  spec_seen: "2026-09-03"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-clever-fixture-token-0000000000000000
  absent_error: no_authorization
  malformed_error: malformed_header
  rejected_error: unrecognized_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  resource:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: error
    code_field: code
    code_type: number
    fields:
      data: null

resources:
  district:
    id:
      style: opaque
    fields:
      name:
        type: string
      mdr_number:
        type: string
        null_when_unset: true
      nces_id:
        type: string
        null_when_unset: true
      sis_type:
        type: string
      # running, pending, error, paused, success -- Clever's own enum,
      # including its own documented empty string.
      state:
        type: string
        default: success
      last_sync:
        type: datetime
        null_when_unset: true
      portal_url:
        type: string
        null_when_unset: true

  section:
    id:
      style: opaque
    fields:
      district:
        type: string
        in: "-"
      school:
        type: string
      course:
        type: string
        null_when_unset: true
      term_id:
        type: string
        null_when_unset: true
      name:
        type: string
      section_number:
        type: string
        null_when_unset: true
      period:
        type: string
        null_when_unset: true
      teacher:
        type: string
        null_when_unset: true
      # english/language arts, math, science, social studies, language,
      # homeroom/advisory, interventions/online learning, technology and
      # engineering, PE and health, arts and music, other -- Clever's own
      # enum.
      subject:
        type: string
        null_when_unset: true
      # InfantToddler, Preschool, PreKindergarten, TransitionalKindergarten,
      # Kindergarten, 1-13, PostGraduate, Ungraded, Other -- Clever's own
      # enum, shared with Student.grade.
      grade:
        type: string
        null_when_unset: true
      # The roster: an array of student ids, not an array of records. See
      # the header for the many-to-many relationship this field names and
      # this Recipe's users route does not fully reproduce.
      students:
        type: list

  user:
    id:
      style: opaque
    fields:
      district:
        type: string
        in: "-"
      email:
        type: string
        null_when_unset: true
      first:
        type: string
        in: name
      middle:
        type: string
        in: name
        null_when_unset: true
      last:
        type: string
        in: name
      created:
        type: datetime
      last_modified:
        type: datetime
      # Internal only -- see the header. Clever's real User record carries
      # no such field; this exists purely so the fixture below can be
      # scoped to one section.
      section_id:
        type: string
        in: "-"

routes:
  - method: GET
    path: /v3.0/districts
    resource: district
    operation: list
    pagination:
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: starting_after

  - method: GET
    path: /v3.0/districts/{id}
    resource: district
    operation: get

  - method: GET
    path: /v3.0/sections
    resource: section
    operation: list
    pagination:
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: starting_after

  - method: GET
    path: /v3.0/sections/{id}
    resource: section
    operation: get

  # The roster. See the header for the question this route was written to
  # answer and the reason Clever's own description does not answer it.
  - method: GET
    path: /v3.0/sections/{section_id}/users
    resource: user
    operation: list
    scope: [section_id]
    pagination:
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: starting_after

  - method: GET
    path: /v3.0/users
    resource: user
    operation: list
    pagination:
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: starting_after

errors:
  # {"code":97,"error":"No authorization provided","data":null}. Named by
  # auth.absent_error.
  no_authorization:
    status: 401
    code: "97"
    message: No authorization provided
    headers:
      Www-Authenticate: Bearer

  # {"code":96,"error":"Malformed authorization header provided","data":
  # null}. Named by auth.malformed_error -- a header present that cannot be
  # a bearer credential of any shape, including "Bearer " with nothing
  # after it.
  malformed_header:
    status: 401
    code: "96"
    message: Malformed authorization header provided
    headers:
      Www-Authenticate: Bearer

  # {"code":101,"error":"Unrecognized token string","data":null}. Named by
  # auth.rejected_error -- a syntactically real bearer token this Recipe
  # does not hold.
  unrecognized_token:
    status: 401
    code: "101"
    message: Unrecognized token string
    headers:
      Www-Authenticate: Bearer
      X-Ratelimit-Bucket: bearer
      X-Ratelimit-Limit: "1200"

  # Express's own default handler, verbatim wording, live. Content-Type
  # claims text/html and the body is not: see the header.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: "Cannot GET {detail}"

  # See the header for the nine-header shredding this reproduces exactly as
  # observed, and for the properly-formed Allow header Cauldron adds beside
  # it that the real host never sends.
  method_not_allowed:
    status: 405
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"
      "0": A
      "1": l
      "2": l
      "3": o
      "4": w
      "5": " "
      "6": G
      "7": E
      "8": T
    message: Method Not Allowed

fixtures:
  empty: {}

  # Every value is an obviously synthetic placeholder -- Clever's own
  # description has no worked example for any resource to cite instead. See
  # the header.
  cauldron-district:
    district:
      - id: cauldron-fixture-district-000000000001
        name: Cauldron Fixture District
        sis_type: clever-placeholder
        state: success
        last_sync: "2026-09-01T00:00:00.000Z"

    section:
      - id: cauldron-fixture-section-000000000001
        district: cauldron-fixture-district-000000000001
        school: cauldron-fixture-school-000000000001
        name: Cauldron Fixture Section
        subject: math
        grade: "9"
        teacher: cauldron-fixture-teacher-000000000001
        students:
          - cauldron-fixture-student-000000000001

    user:
      - id: cauldron-fixture-student-000000000001
        district: cauldron-fixture-district-000000000001
        section_id: cauldron-fixture-section-000000000001
        first: Cauldron
        last: Fixture
        created: "2026-01-01T00:00:00.000Z"
        last_modified: "2026-01-01T00:00:00.000Z"

# Every case below carries source. A verified date means this Recipe called
# api.clever.com with exactly the request shown, on 2026-09-03, and recorded
# exactly what came back; its absence means the case was read from Clever's
# own published OpenAPI description and never called.
conformance:
  - name: no credential at all is absent, code 97
    source: https://api.clever.com/v3.0/districts
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/districts
    expect:
      status: 401
      headers:
        Www-Authenticate: Bearer
      body:
        code: 97
        error: No authorization provided
        data: null

  - name: a header with no scheme at all is malformed, a different code from absent
    source: https://api.clever.com/v3.0/districts
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/districts
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        code: 96
        error: Malformed authorization header provided

  - name: Bearer with nothing after the prefix is malformed too, not absent
    source: https://api.clever.com/v3.0/districts
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/districts
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        code: 96
        error: Malformed authorization header provided

  - name: a real, present, wrong bearer token is rejected, a third code again
    source: https://api.clever.com/v3.0/districts
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/districts
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        code: 101
        error: Unrecognized token string

  - name: an unrouted path is refused by the router with no credential examined
    source: https://api.clever.com/v3.0/this-is-not-a-real-endpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "^Cannot GET /v3\\.0/this-is-not-a-real-endpoint$"

  - name: a wrong method on a real path is a genuine 405, no credential needed
    # Live: PUT on the GET-only /v3.0/districts, no Authorization header
    # sent at all. See the header for the nine shredded header fields this
    # reproduces and the honest Allow header Cauldron adds beside them.
    source: https://api.clever.com/v3.0/districts
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PUT
      path: /v3.0/districts
    expect:
      status: 405
      header_matches:
        "0": "^A$"
        "6": "^G$"
        "7": "^E$"
        "8": "^T$"
      body_matches: "^Method Not Allowed$"

  - name: a section answers the fields Clever's own description declares
    source: https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml
    fixture: cauldron-district
    request:
      method: GET
      path: /v3.0/sections/cauldron-fixture-section-000000000001
      headers:
        Authorization: Bearer cauldron-clever-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        data.id: cauldron-fixture-section-000000000001
        data.name: Cauldron Fixture Section
        data.subject: math
        data.grade: "9"
        "data.students[0]": cauldron-fixture-student-000000000001

  - name: the roster answers a name nested under name, and no section_id at all
    source: https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml
    fixture: cauldron-district
    request:
      method: GET
      path: /v3.0/sections/cauldron-fixture-section-000000000001/users
      headers:
        Authorization: Bearer cauldron-clever-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        "data[0].id": cauldron-fixture-student-000000000001
        "data[0].name.first": Cauldron
        "data[0].name.last": Fixture
      absent:
        - "data[0].section_id"
        - "data[0].district"

  - name: an unrouted path answers the identical page with a valid credential too
    source: https://api.clever.com/v3.0/this-is-not-a-real-endpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v3.0/this-is-not-a-real-endpoint
      headers:
        Authorization: Bearer cauldron-clever-fixture-token-0000000000000000
    expect:
      status: 404
      body_matches: "^Cannot GET /v3\\.0/this-is-not-a-real-endpoint$"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the district listing answers with what the fixture holds"
    source: "https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml"
    fixture: cauldron-district
    request:
      method: GET
      path: "/v3.0/districts"
      headers:
        "Authorization": "Bearer cauldron-clever-fixture-token-0000000000000000"
    expect:
      status: 200
      body:
        "data[0].id": "cauldron-fixture-district-000000000001"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the section listing answers with what the fixture holds"
    source: "https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml"
    fixture: cauldron-district
    request:
      method: GET
      path: "/v3.0/sections"
      headers:
        "Authorization": "Bearer cauldron-clever-fixture-token-0000000000000000"
    expect:
      status: 200
      body:
        "data[0].id": "cauldron-fixture-section-000000000001"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the user listing answers with what the fixture holds"
    source: "https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml"
    fixture: cauldron-district
    request:
      method: GET
      path: "/v3.0/users"
      headers:
        "Authorization": "Bearer cauldron-clever-fixture-token-0000000000000000"
    expect:
      status: 200
      body:
        "data[0].id": "cauldron-fixture-student-000000000001"
      absent:
        - "data[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but starting_after can be shown, and it is the
  # half nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "starting_after moves past the only record, and the page comes back empty"
    source: "https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml"
    fixture: cauldron-district
    request:
      method: GET
      path: "/v3.0/districts"
      query:
        "limit": "1"
        "starting_after": "cauldron-fixture-district-000000000001"
      headers:
        "Authorization": "Bearer cauldron-clever-fixture-token-0000000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but starting_after can be: past the
  # only record the collection is empty, where a name the runtime
  # ignored would have answered with the record again.
  - name: "starting_after moves the page on, and what comes back is not page one"
    source: "https://raw.githubusercontent.com/Clever/clever-go/master/swagger.yml"
    fixture: cauldron-district
    request:
      method: GET
      path: "/v3.0/sections"
      query:
        "limit": "1"
        "starting_after": "cauldron-fixture-section-000000000001"
      headers:
        "Authorization": "Bearer cauldron-clever-fixture-token-0000000000000000"
    expect:
      status: 200
      absent:
