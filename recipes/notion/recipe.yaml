# Notion Recipe for Cauldron
#
# Notion is easy to integrate against and easy to get subtly wrong, because
# almost every mistake still returns something.
#
# Three things this Recipe insists on:
#
#   1. The Notion-Version header is mandatory. Forgetting it is the classic
#      Notion integration bug: everything works against a hand-rolled fake and
#      the first real call returns 400. Cauldron refuses it too.
#   2. Every object says what it is. A list is {"object": "list"}, a page is
#      {"object": "page"}, an error is {"object": "error"}. Client code
#      switches on that field before reading anything else.
#   3. Identifiers are UUIDs, not opaque strings. Code that string-matches a
#      prefix has nothing to match.
#
# Tokens below are fixtures, not secrets.

recipe: notion
capability: docs
version: 0.1.0

upstream:
  api: "2022-06-28"
  docs: https://developers.notion.com/reference/intro
  spec: https://developers.notion.com/openapi.json
  spec_hash: ac473d833c0dc881387dc70475ef634c85317f372fee9a40ba05d47d8fee3a15
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - secret_cauldron
  # A different sentence for no header at all, confirmed live 2026-09-05 --
  # see missing_authorization below. A wrong token matches this file's
  # existing authentication_error exactly.
  absent_error: missing_authorization

# Notion rejects a request with no version header, so the emulator does too.
required_headers:
  Notion-Version: missing_version

responses:
  list:
    style: wrapped
    key: results
    cursor_field: next_cursor
    has_more_field: has_more
    # A collection is an object in its own right, and it is not a page.
    fields:
      object: list
      type: page_or_database
  error:
    style: flat
    code_field: code
    status_field: status
    fields:
      object: error

resources:
  page:
    constants:
      object: page
      archived: false
    id:
      style: uuid
    fields:
      # Notion page properties are a rich structure; the Recipe models the
      # flat title-and-status case that most integrations actually read.
      title:
        type: string
        required: true
        in: properties
      status:
        type: string
        default: Not started
        in: properties
      # A permalink, and the id in it is not the id in the id field. Notion
      # writes the page's UUID with the dashes stripped and a title slug in
      # front of it, so the same page is
      # 11111111-1111-4111-8111-111111111111 here and
      # 11111111111141118111111111111111 there.
      #
      # That is the field somebody parses. Users paste Notion links, and
      # getting a page id out of one means taking the last thirty-two
      # characters and putting the dashes back. Code written against a fake
      # whose url has no id in it cannot be written at all, and code that
      # compares the two forms directly finds them unequal for every page.
      url:
        type: string
      created_time:
        type: datetime
      last_edited_time:
        type: datetime

  database:
    constants:
      object: database
    id:
      style: uuid
    fields:
      title:
        type: string
        required: true
      created_time:
        type: datetime

  user:
    constants:
      object: user
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      type:
        type: string
        default: person
      avatar_url:
        type: string

routes:
  # A note about what check reports against Notion's published description,
  # which is a fragment: eight paths, with /v1/pages/{id} and no /v1/pages,
  # /v1/users/{id} and no /v1/users. So this route and the users listing are
  # reported as paths it does not declare, and both are real endpoints Notion
  # documents.
  #
  # It also declares seven properties on the page update and twelve on the
  # get, with no url, cover, icon, created_by or last_edited_by on the update.
  # A trimmed description trims schemas too, so that narrower shape is a claim
  # to check against Notion rather than against that file. Not acted on here,
  # and written down so the next person does not have to work it out again.
  - method: POST
    path: /v1/pages
    resource: page
    operation: create

  - method: GET
    path: /v1/pages/{id}
    resource: page
    operation: get

  - method: PATCH
    path: /v1/pages/{id}
    resource: page
    operation: update

  - method: GET
    path: /v1/databases/{id}
    resource: database
    operation: get

  - method: GET
    path: /v1/users
    resource: user
    operation: list
    pagination:
      # Notion's own description declares page_size and start_cursor on this
      # route. Neither is limit and neither is cursor, which is what this
      # block was making the runtime read.
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: page_size
      cursor_param: start_cursor

  - method: GET
    path: /v1/users/{id}
    resource: user
    operation: get

webhooks:
  events:
    - page.created
    - page.updated
    - page.deleted
    - database.updated
  # Notion sends a reference, not the page. entity is an id and a type, and
  # an application wanting the title has to go and fetch it -- so a handler
  # reading a page title off the delivery is reading something Notion has
  # never sent.
  payload:
    id: "{id}"
    timestamp: "{created_iso}"
    workspace_id: 13950b26-c203-4f3b-b97d-93ec06319565
    workspace_name: Cauldron
    subscription_id: 3068da9c-6e2c-4a10-b8f8-b7b8b62b7c1a
    integration_id: 0c2e6e8d-6b3a-4e6d-9d0e-6cc5c8d1a2f4
    type: "{event}"
    attempt_number: 1
    authors:
      - id: 6c2b0ab4-8f8a-4a3e-9a1a-2ee8f7f4b3a2
        type: person
    entity:
      id: "{record_id}"
      type: "{resource}"
  signing:
    scheme: hmac-sha256
    header: X-Notion-Signature
    secret: cauldron-verification-token
    # sha256= and hex over the body.
    encoding: hex
    over: "{body}"
    value: "sha256={digest}"

errors:
  rate_limit:
    status: 429
    code: rate_limited
    message: You have been rate limited. Please try again later.
    headers:
      Retry-After: "1"

  # Confirmed live 2026-09-05 against api.notion.com, no account and no key.
  # A well-formed but wrong token gets this exactly.
  authentication_error:
    status: 401
    code: unauthorized
    message: API token is invalid.

  # No Authorization header at all gets a different sentence, also confirmed
  # live 2026-09-05.
  missing_authorization:
    status: 401
    code: unauthorized
    message: 'Authorization header must use the format "Bearer <token>".'

  resource_missing:
    status: 404
    code: object_not_found
    message: "Could not find {detail}. Make sure the relevant pages and databases are shared with your integration."

  parameter_missing:
    status: 400
    code: validation_error
    message: "body failed validation: {detail} is required"

  # The failure everybody meets first, and the reason required_headers exists.
  missing_version:
    status: 400
    code: missing_version
    message: Notion-Version header failed validation

  # The second failure everybody meets: the integration was never given access
  # to the page, which reads as a 404 rather than a 403.
  restricted_resource:
    status: 403
    code: restricted_resource
    message: Insufficient permissions for this endpoint.

fixtures:
  empty: {}

  small-workspace:
    page:
      - id: 11111111-1111-4111-8111-111111111111
        title: Conformance suite design
        status: In progress
        url: https://www.notion.so/Conformance-suite-design-11111111111141118111111111111111
      - id: 22222222-2222-4222-8222-222222222222
        title: Recipe format notes
        status: Done
        url: https://www.notion.so/Recipe-format-notes-22222222222242228222222222222222
    database:
      - id: 33333333-3333-4333-8333-333333333333
        title: Engineering tasks
    user:
      - id: 44444444-4444-4444-8444-444444444444
        name: Ada Lovelace
        type: person
      - id: 55555555-5555-4555-8555-555555555555
        name: Cauldron
        type: bot
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: 55555555-5555-4555-8555-555555555556
        name: Cauldron
        type: bot

# Conformance cases, read from Notion's API reference rather than observed
# against a live workspace. The verify report says so.
conformance:
  - name: a wrong token is invalid, and a missing header says so differently
    source: https://api.notion.com/v1/users
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /v1/users
      headers:
        Authorization: Bearer secret_wrongtoken
        Notion-Version: "2022-06-28"
    expect:
      status: 401
      body:
        object: error
        status: 401
        code: unauthorized
        message: API token is invalid.

  - name: no Authorization header at all names the expected format instead
    source: https://api.notion.com/v1/users
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /v1/users
      headers:
        Notion-Version: "2022-06-28"
    expect:
      status: 401
      body:
        object: error
        status: 401
        code: unauthorized
        message: 'Authorization header must use the format "Bearer <token>".'

  - name: a request without Notion-Version is refused
    source: https://developers.notion.com/reference/versioning
    fixture: small-workspace
    request:
      method: GET
      path: /v1/pages/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Bearer secret_cauldron
    expect:
      # The whole point of required_headers. A fake that waves this through
      # lets code ship that fails on its first real call.
      status: 400
      body:
        object: error
        code: missing_version
        status: 400

  - name: every object declares what it is
    source: https://developers.notion.com/reference/page
    fixture: small-workspace
    request:
      method: GET
      path: /v1/pages/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
    expect:
      status: 200
      body:
        object: page
        archived: false
        properties:
          title: Conformance suite design
          status: In progress
      absent:
        - title

  - name: a collection is a list object, not a page object
    source: https://developers.notion.com/reference/intro#pagination
    fixture: small-workspace
    request:
      method: GET
      path: /v1/users
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
    expect:
      status: 200
      body:
        object: list
        has_more: false
        results[0].object: user
        results[0].name: Ada Lovelace
      absent:
        - data

  - name: a page is created with a UUID, not a prefixed string
    source: https://developers.notion.com/reference/post-page
    fixture: empty
    request:
      method: POST
      path: /v1/pages
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
      json:
        properties:
          title: Written through the API
    expect:
      status: 200
      body:
        object: page
        properties:
          title: Written through the API
          status: Not started
      matches:
        id: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

  - name: the id in the url is the id without its dashes
    # The two forms of the same identifier, and the reason anybody cares:
    # users paste Notion links. Getting a page id out of one means taking the
    # last thirty-two characters and putting four dashes back, and there is
    # nothing in the response that does it for you.
    #
    # A fixture whose url was https://www.notion.so/conformance-suite-design
    # -- no id in it at all -- made that impossible to write against and
    # impossible to get wrong, which is the worse of the two.
    source: https://developers.notion.com/reference/retrieve-a-page
    fixture: small-workspace
    request:
      method: GET
      path: /v1/pages/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
    expect:
      status: 200
      body:
        # Dashes here.
        id: 11111111-1111-4111-8111-111111111111
      matches:
        # And none there, after a slug that is not the title either: Notion
        # capitalises it and joins the words with hyphens, so matching the
        # url against the title finds nothing.
        url: '^https://www[.]notion[.]so/.+-11111111111141118111111111111111$'

  - name: an unknown page explains that sharing may be the problem
    source: https://developers.notion.com/reference/status-codes
    fixture: small-workspace
    request:
      method: GET
      path: /v1/pages/99999999-9999-4999-8999-999999999999
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
    expect:
      status: 404
      body:
        object: error
        code: object_not_found
        status: 404
      matches:
        message: 'shared with your integration'

  - name: a bad token is rejected with the version header still required
    source: https://developers.notion.com/reference/authentication
    request:
      method: GET
      path: /v1/users
      headers:
        Notion-Version: "2022-06-28"
    expect:
      status: 401
      body:
        object: error
        code: unauthorized

  - name: paging carries a cursor and a has_more flag
    source: https://developers.notion.com/reference/intro#pagination
    fixture: small-workspace
    request:
      method: GET
      path: /v1/users
      query:
        # page_size, not limit. This case sent limit, which Notion does not
        # have -- and passed, because this Recipe was reading limit too. The
        # two wrongs agreed and the case asserted a page it never asked for.
        page_size: "1"
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
    expect:
      status: 200
      body:
        object: list
        has_more: true
      matches:
        next_cursor: '^[0-9a-f-]+$'
      absent:
        - results[1]

  - name: a delivery carries a reference to the page, not the page
    source: https://developers.notion.com/reference/webhooks-events-delivery
    fixture: small-workspace
    request:
      method: POST
      path: /v1/pages
      headers:
        Authorization: Bearer secret_cauldron
        Notion-Version: "2022-06-28"
      json:
        parent:
          database_id: 8e2c776b53064c9b9ef7ba6d4c0bb0a1
        properties:
          title: Kettle repair notes
    expect:
      status: 200
      webhook:
        event: page.created
        signature_header: X-Notion-Signature
        signature: '^sha256=[0-9a-f]{64}$'
        body:
          type: page.created
          entity.type: page
          attempt_number: 1
        absent:
          # The page is not in it. Its title cannot be read off a delivery.
          - entity.properties
          - properties
          - data.object

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # page_size=1 and start_cursor=44444444-4444-4444-8444-444444444444,
  # which is the identifier of the last record on the previous page, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "page_size and start_cursor are the two names this listing reads"
    source: "https://developers.notion.com/reference/intro#pagination"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/users"
      query:
        "page_size": "1"
        "start_cursor": "44444444-4444-4444-8444-444444444444"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "results[0].id": "55555555-5555-4555-8555-555555555555"
      absent:
        - "results[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # page_size=1 and start_cursor=44444444-4444-4444-8444-444444444444,
  # which is the identifier of the last record on the previous page, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "page_size and start_cursor are the two names this listing reads on v1 users"
    source: "https://developers.notion.com/reference/intro#pagination"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/users"
      query:
        "page_size": "1"
        "start_cursor": "44444444-4444-4444-8444-444444444444"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "results[0].id": "55555555-5555-4555-8555-555555555555"
      absent:
        - "results[1]"

  # The names. This Recipe declares 2 field(s) on a database that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a database carries the field names this Recipe declares"
    source: "https://developers.notion.com/reference/page"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/databases/33333333-3333-4333-8333-333333333333"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "created_time": "2026-01-01T00:00:00Z"
        "title": "Engineering tasks"

  # The names. This Recipe declares 3 field(s) on a page that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a page carries the field names this Recipe declares"
    source: "https://developers.notion.com/reference/page"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/pages/11111111-1111-4111-8111-111111111111"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "created_time": "2026-01-01T00:00:00Z"
        "last_edited_time": "2026-01-01T00:00:00Z"
        "properties.title": "Conformance suite design"

  # The names. This Recipe declares 2 field(s) on a user that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an user carries the field names this Recipe declares"
    source: "https://developers.notion.com/reference/intro#pagination"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/users"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "results[0].type": "person"

  # The names. This Recipe declares 1 field(s) on a page that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a page carries the field names this Recipe declares, and 1 more of them"
    source: "https://developers.notion.com/reference/page"
    fixture: small-workspace
    request:
      method: GET
      path: "/v1/pages/11111111-1111-4111-8111-111111111111"
      headers:
        "Authorization": "Bearer secret_cauldron"
        "Notion-Version": "2022-06-28"
    expect:
      status: 200
      body:
        "properties.status": "In progress"


