# Close Recipe for Cauldron
#
# Written against Close's published OpenAPI document at developer.close.com and
# struck live against api.close.com on 2026-09-09 with no credential, with a
# deliberately invalid one, and on a path that does not exist.
#
# **Three rate-limit vocabularies on one response, and they disagree.** Struck
# live, on a request carrying a deliberately invalid credential:
#
#   ratelimit:          limit=100; remaining=100; reset=1
#   ratelimit-limit:    60
#   ratelimit-remaining: 59
#   ratelimit-reset:    1
#   x-ratelimit-limit:  60, 60;w=1, 100;w=1
#
# Three conventions at once. `ratelimit` is the IETF draft's single structured
# field. `ratelimit-limit` and its siblings are the same draft's earlier
# split-header form. `x-ratelimit-limit` is the legacy name carrying the
# draft's quota-policy syntax inside it.
#
# And the numbers do not agree: the structured field says the limit is 100, the
# split header beside it says 60, and the legacy one says both. A client reading
# any single header gets a different answer about the same request, and the two
# that a reasonable client is most likely to read -- `ratelimit-limit` and
# `x-ratelimit-limit` -- are the two that disagree with the field the draft
# actually standardises.
#
# **They are sent to a caller with no credential**, so the limits are public
# and a request that has been refused still spends quota and says so.
#
# **The document declares two security schemes and applies neither.**
# `components.securitySchemes` defines `ApiKeyAuth` (HTTP Basic, "use your API
# key as the username and leave the password empty") and `OAuth2`. Top-level
# `security` is absent, and no operation declares one either. What every
# operation does declare is a plain header parameter, named `Authorization`,
# with `required: true` and `type: string`.
#
# So the machinery OpenAPI has for describing authentication is present,
# populated, and unreferenced, and the actual requirement is expressed as a
# string a caller has to assemble itself. A generator reading this emits a
# client whose every method takes an `authorization` string.
#
# It is the opposite mistake to [adobesign](../adobesign), whose document marks
# `Authorization` `required: false` on an API that refuses every request without
# it. Close over-declares the header and under-declares the scheme; Adobe
# declares the scheme and lets the header be optional.
#
# **`name` is required and nullable.** So are `url`, `description`,
# `created_by` and `updated_by`. A lead -- the record a CRM exists to hold --
# must carry a `name` key, and that key is permitted to be null, which is the
# distinction between "present" and "has a value" written into the schema. Code
# that checks `if ("name" in lead)` is satisfied by a lead with no name.
#
# **And two fields have no type at all.** `primary_email` and `primary_phone`
# are declared with a description and no `type`, so the document says those
# fields exist and nothing about what they hold.
#
# **The three declared failures are typed "Any type".** 400, 401 and 404 each
# carry a description and a schema whose entire content is
# `{"description": "Any type"}`. Three providers in this collection now sit on
# that spectrum: [attentive](../attentive) declares five failure statuses and
# gives none of them a body, Close declares three and types them as anything,
# and Middesk declares no failure at all.
#
# **The 404 is Flask's, and it is addressed to a person.**
#
#   {"error": "The requested URL was not found on the server. If you entered
#              the URL manually please check your spelling and try again."}
#
# The framework's default 404 text, wrapped in the API's own `error` field.
# It tells a machine to check its spelling.

recipe: close
capability: crm
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.close.com/
  spec: https://developer.close.com/openapi.json
  spec_hash: 773cbb3dbed38186632ae537453e00602f38082f5a3d295919de797c77509818
  spec_seen: "2026-09-09"

auth:
  # The API key as the username and an empty password, which is what the
  # unreferenced securityScheme says and what the required header parameter
  # does not.
  scheme: basic
  keys:
    - api_cauldr0nclosef1xturekey
  # One sentence for both, and it is the reason phrase.
  absent_error: unauthorized
  rejected_error: unauthorized
  # An unknown path answers Flask's 404 with a wrong credential in hand, so
  # the router runs before the credential check.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    # A boolean and an offset, so paging means counting requests rather than
    # following anything the response gives back.
    has_more_field: has_more
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  lead:
    id:
      field: id
      style: prefixed
      prefix: "lead_"
    fields:
      # Required in the schema and nullable in the same breath, so the key is
      # guaranteed and the value is not.
      name:
      description:
      display_name:
        type: string
      status_id:
        type: string
      status_label:
        type: string
      organization_id:
        type: string
      html_url:
        type: string
      # Declared with a description and no type at all, so the document says
      # the field exists and nothing about what is in it.
      primary_email:
      primary_phone:
      date_created:
        type: datetime
      date_updated:
        type: datetime
      created_by:
      contact_ids:
        type: list

routes:
  - method: GET
    # With the trailing slash, which is the document's own spelling and
    # Flask's convention rather than an API one.
    path: /api/v1/lead/
    resource: lead
    operation: list
    pagination:
      style: offset
      limit: 100
      limit_param: _limit
      cursor_param: _skip

errors:
  unauthorized:
    status: 401
    # A space after the colon, which is a serialiser configured for reading
    # rather than for bytes.
    message: Unauthorized
    headers:
      # Public: sent to a caller holding no credential, so a refused request
      # still reports what the quota is and that it spent some.
      RateLimit: "limit=100; remaining=100; reset=1"
      RateLimit-Limit: "60"
      X-RateLimit-Limit: "60, 60;w=1, 100;w=1"

  unknown_route:
    status: 404
    # Flask's default 404 sentence, wrapped in the API's own error field, and
    # addressed to a person rather than to the client that will read it.
    message: "The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again."

fixtures:
  empty:
    lead: []

  organization:
    lead:
      - id: lead_8Kx2Qm4RvT9pLdY3
        name: Northwind Traders
        description: Referred by the London office
        display_name: Northwind Traders
        status_id: stat_7Jc1Nb5UwE2qMfZ8
        status_label: Qualified
        organization_id: orga_3Hd9Pk6VxG1rNaW4
        html_url: https://app.close.com/lead/lead_8Kx2Qm4RvT9pLdY3/
        primary_email: ada@example.invalid
        primary_phone: "+16135550142"
        date_created: "2026-05-14T09:22:31.000Z"
        date_updated: "2026-08-30T14:02:11.000Z"
        created_by: user_5Ff8Rj2WyH7sQbX1
        contact_ids:
          - cont_2Aa4Bb6Cc8Dd0Ee1
      - id: lead_4Tn7Gh1ZqK5wRcV6
        # Required by the schema and null on the wire, which is what
        # "required and nullable" means in practice.
        name: null
        description: null
        display_name: ""
        status_id: stat_9Lm3Xp8YtI4uOgD7
        status_label: Potential
        organization_id: orga_3Hd9Pk6VxG1rNaW4
        html_url: https://app.close.com/lead/lead_4Tn7Gh1ZqK5wRcV6/
        date_created: "2026-08-02T16:45:09.000Z"
        date_updated: "2026-08-02T16:45:09.000Z"
        created_by: null
        contact_ids: []

conformance:
  - name: a missing credential is the reason phrase in a field called error
    source: https://api.close.com/api/v1/lead/
    verified: "2026-09-09"
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers: {}
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: the refusal reports three rate limits that disagree
    source: https://api.close.com/api/v1/lead/
    verified: "2026-09-09"
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers: {}
    expect:
      status: 401
      headers:
        # The IETF draft's structured field says 100; its own split-header
        # form beside it says 60. A client reading one header gets a
        # different answer from a client reading the other.
        RateLimit: "limit=100; remaining=100; reset=1"
        RateLimit-Limit: "60"

  - name: the legacy header carries the structured quota syntax
    source: https://api.close.com/api/v1/lead/
    verified: "2026-09-09"
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers: {}
    expect:
      status: 401
      headers:
        # Under the X- name a client parses as an integer. parseInt stops at
        # the comma and gets 60 by luck rather than by design.
        X-RateLimit-Limit: "60, 60;w=1, 100;w=1"

  - name: a wrong credential is the same body
    source: https://api.close.com/api/v1/lead/
    verified: "2026-09-09"
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        # The API key as the username with an empty password, wrong.
        Authorization: "Basic bm90cmVhbDo="
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: an unknown path answers Flasks own sentence
    source: https://api.close.com/api/v1/cauldron-nope/
    verified: "2026-09-09"
    fixture: organization
    request:
      method: GET
      path: /api/v1/cauldron-nope/
      headers:
        Authorization: "Basic bm90cmVhbDo="
    expect:
      # Reached with a wrong credential, so routing is not hidden behind
      # authentication -- and the sentence tells a machine to check its
      # spelling.
      status: 404
      body:
        error: "The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again."

  - name: leads are wrapped under data beside a boolean
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        'data[0].id': lead_8Kx2Qm4RvT9pLdY3
        'data[0].display_name': Northwind Traders

  - name: the name is required and null
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        # The schema lists name in `required` and types it ["string","null"],
        # so a lead with no name still satisfies the contract and a client
        # testing for the key's presence learns nothing.
        'data[1].name': null
        'data[0].name': Northwind Traders

  - name: several more required fields are nullable too
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        # description, created_by, updated_by and url are all in the same
        # position: guaranteed to be there and permitted to be nothing.
        'data[1].description': null
        'data[1].created_by': null
        'data[0].created_by': user_5Ff8Rj2WyH7sQbX1

  - name: the untyped fields are absent rather than null
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        'data[0].primary_email': ada@example.invalid
      absent:
        # Declared with a description and no type, so the document says the
        # field exists and nothing about what it holds -- and a lead with no
        # contact simply does not carry it.
        - 'data[1].primary_email'
        - 'data[1].primary_phone'

  - name: the record carries its own console URL and both timestamps
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        # A full app URL on the record, so the identifier is sent twice --
        # once as a field and once inside an address a browser can open.
        'data[0].html_url': https://app.close.com/lead/lead_8Kx2Qm4RvT9pLdY3/
        'data[0].organization_id': orga_3Hd9Pk6VxG1rNaW4
        'data[0].date_created': "2026-05-14T09:22:31.000Z"
        'data[0].date_updated': "2026-08-30T14:02:11.000Z"
        'data[0].primary_phone': "+16135550142"
        # Created and updated are the same string on a lead nobody has
        # touched, so `date_updated` cannot find changed records on its own.
        'data[1].date_created': "2026-08-02T16:45:09.000Z"
        'data[1].date_updated': "2026-08-02T16:45:09.000Z"
        'data[0].contact_ids[0]': cont_2Aa4Bb6Cc8Dd0Ee1
        'data[1].contact_ids': []

  - name: the status is an identifier and a label side by side
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        # The label is the organisation's own wording and can be renamed
        # under the identifier, so a client switching on the label breaks
        # when somebody edits a pipeline.
        'data[0].status_id': stat_7Jc1Nb5UwE2qMfZ8
        'data[0].status_label': Qualified
        'data[1].status_label': Potential

  - name: leads page on an underscored limit and skip
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
      query:
        # Leading underscores, which distinguish paging from the filter
        # parameters that share the query string -- and no cursor anywhere,
        # so paging is counting.
        _limit: "1"
        _skip: "1"
    expect:
      status: 200
      body:
        'data[0].id': lead_4Tn7Gh1ZqK5wRcV6
        has_more: false

  - name: the first page says there is more
    source: https://developer.close.com/openapi.json
    fixture: organization
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
      query:
        _limit: "1"
    expect:
      status: 200
      body:
        'data[0].id': lead_8Kx2Qm4RvT9pLdY3
        has_more: true

  - name: an organisation with no leads answers an empty array
    source: https://developer.close.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/lead/
      headers:
        Authorization: "Basic YXBpX2NhdWxkcjBuY2xvc2VmMXh0dXJla2V5Og=="
    expect:
      status: 200
      body:
        data: []
        has_more: false
