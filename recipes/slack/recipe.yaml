# Slack Recipe for Cauldron
#
# Slack is the provider people fake worst, because faking it badly still looks
# like it works. Three things catch applications out, and all three are
# modelled here:
#
#   1. Errors come back with HTTP 200. A client that branches on the status
#      code sees every failure as a success. The signal is the "ok" field, and
#      an emulator that returns 404 teaches exactly the wrong habit.
#   2. Every response, success or failure, carries "ok". Real clients check it
#      first and read nothing else until they have.
#   3. The Web API is RPC, not REST. The identifier arrives as a query
#      parameter or a body field, never as a path segment.
#
# Getting a workspace to test against means creating an app, a workspace, and
# a bot token, then finding somewhere to post that will not annoy colleagues.
# But not every claim needs one: an unauthenticated request is a checkable
# claim by itself, and slack.com was struck live, unauthenticated, on
# 2026-09-05 to check it.
#
# It found this Recipe's own credential case wrong. It was named "a bad token
# is also an HTTP 200" and sent no Authorization header at all while asserting
# the code a present-but-wrong token gets (invalid_auth). Live, sending nothing
# gets not_authed instead -- a different code, both still on a 200. Split into
# two cases below, with auth.absent_error carrying the distinction the way it
# is meant to.
#
# Two more observed and not modelled as cases, because reproducing them would
# mean changing how every route in this Recipe orders routing against auth,
# which is more than this one finding earns: a method name nothing declares
# (/api/not.a.real.method) answers 200 {"ok":false,"error":"unknown_method"}
# with NO Authorization header sent at all -- so for an unrecognised method,
# Slack resolves the name before it ever asks who is calling, the opposite
# order from every declared method above. And the HTTP verb is not checked:
# DELETE against /api/conversations.list, unauthenticated, answers the same
# not_authed a GET does rather than a 405 -- Slack's Web API takes the method
# name from the path and does not appear to care which verb carried it.
#
# Tokens below are fixtures, not secrets.

recipe: slack
capability: chat
version: 0.1.0

upstream:
  api: "2026-05"
  docs: https://api.slack.com/web
  # Published in the provider's own organisation on GitHub, and it
  # declares all three listings this Recipe models. It is where the
  # paging parameter names below were read from.
  spec: https://raw.githubusercontent.com/slackapi/slack-api-specs/master/web-api/slack_web_openapi_v2.json
  spec_hash: ef7ef91beacaf4b851e97a6499d027c790f012d925188d73fae48334fc8786cf
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - xoxb-cauldron
  # Verified live against slack.com 2026-09-05: no Authorization header at
  # all is not_authed, and a well-formed-but-wrong one is invalid_auth --
  # two different codes, both wrapped in the same HTTP 200. This Recipe's
  # own case for the second used to send the first and check for the
  # second's code; see errors.no_credential below for what that missed.
  absent_error: no_credential

responses:
  # Everything Slack sends carries ok. It is the first thing a client reads.
  success:
    fields:
      ok: true
  list:
    style: wrapped
    cursor_field: response_metadata.next_cursor
  resource:
    style: wrapped
  # A Slack error is {"ok": false, "error": "channel_not_found"}. No message,
  # no code field, and the status is 200.
  error:
    style: flat
    message_field: "-"
    code_field: error
    fields:
      ok: false

resources:
  channel:
    collection: channels
    id:
      prefix: C
      length: 10
    fields:
      name:
        type: string
        required: true
      is_private:
        type: boolean
        default: false
      is_archived:
        type: boolean
        default: false
      topic:
        type: string
      num_members:
        type: integer
        default: 0
      created:
        type: timestamp

  message:
    collection: messages
    id:
      # Slack identifies a message by the second it arrived plus a counter,
      # which is why threading code passes "ts" around rather than an id.
      style: timestamp
      field: ts
    fields:
      # Slack sends the channel beside the message, not inside it:
      # chat.postMessage answers {ok, channel, ts, message: {...}} and the
      # message object carries no channel of its own. conversations.history
      # carries none either -- you asked by channel.
      #
      # So it comes off the wire. The top-level channel is not modelled:
      # responses.success.fields puts fixed values on the envelope and there
      # is no way to put a record's own field there, which is the gap.
      channel:
        type: string
        required: true
        in: "-"
      text:
        type: string
        required: true
      user:
        type: string
        default: U0CAULDRON
      type:
        type: string
        default: message
      thread_ts:
        type: string

  user:
    collection: members
    id:
      prefix: U
      length: 10
    fields:
      name:
        type: string
        required: true
      real_name:
        type: string
      is_bot:
        type: boolean
        default: false
      deleted:
        type: boolean
        default: false
      tz:
        type: string
        default: Europe/London

routes:
  - method: GET
    path: /api/conversations.list
    resource: channel
    operation: list
    pagination:
      # Slack's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right by
      # coincidence rather than by checking. limit is "an integer no larger
      # than 1000", and cursor is set "to a next_cursor attribute returned
      # by a previous request's response_metadata", which is where this
      # Recipe already serves it.
      style: cursor
      limit: 100
      max_limit: 1000
      limit_param: limit
      cursor_param: cursor

  # The identifier is a query parameter. This is the shape almost every
  # RPC-style provider uses, and it is why id_from exists.
  - method: GET
    path: /api/conversations.info
    resource: channel
    operation: get
    id_from: query:channel

  - method: POST
    path: /api/conversations.create
    resource: channel
    operation: create
    emits: channel_created

  - method: POST
    path: /api/conversations.rename
    resource: channel
    operation: update
    emits: channel_rename
    id_from: body:channel

  - method: POST
    path: /api/chat.postMessage
    resource: message
    operation: create
    emits: message

  - method: GET
    path: /api/conversations.history
    resource: message
    operation: list
    pagination:
      # Slack's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right by
      # coincidence rather than by checking. limit is "an integer no larger
      # than 1000", and cursor is set "to a next_cursor attribute returned
      # by a previous request's response_metadata", which is where this
      # Recipe already serves it.
      style: cursor
      limit: 100
      max_limit: 1000
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /api/users.list
    resource: user
    operation: list
    pagination:
      # Slack's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right by
      # coincidence rather than by checking. limit is "an integer no larger
      # than 1000", and cursor is set "to a next_cursor attribute returned
      # by a previous request's response_metadata", which is where this
      # Recipe already serves it.
      style: cursor
      limit: 100
      max_limit: 1000
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /api/users.info
    resource: user
    operation: get
    id_from: query:user

webhooks:
  # Slack calls these Events API deliveries. The signing scheme is its own:
  # a versioned base string hashed with the signing secret.
  # Underscores, not dots. Slack's event types are channel_created and
  # channel_rename, and a Recipe declaring channel.created names something no
  # Slack workspace has ever sent -- a handler keyed on the real name would
  # match nothing here, and one written against this would match nothing
  # there.
  events:
    - message
    - channel_created
    - channel_rename
    - app_mention
    - reaction_added
    - team_join
  # The Events API envelope. The record goes under event, and the top-level
  # type is the literal string event_callback for every delivery -- it says
  # this is an event rather than a url_verification handshake, and says
  # nothing about which event. Code switching on body.type sees one value
  # forever; the discriminator is body.event.type.
  payload:
    token: cauldron-verification-token
    team_id: T0CAULDRON01
    api_app_id: A0CAULDRON01
    type: event_callback
    event_id: "{id}"
    event_time: "{created}"
    event:
      "{object}": true
      type: "{event}"
  signing:
    scheme: hmac-sha256
    header: X-Slack-Signature
    secret: cauldron-signing-secret
    # v0= and hex, over "v0:<timestamp>:<body>" rather than over the body.
    #
    encoding: hex
    over: "v0:{timestamp}:{body}"
    value: "v0={digest}"
    # The timestamp the signature was taken over. Without it a verifier has
    # the signature and no way to rebuild what was signed, so the delivery
    # would carry a value nothing could check.
    timestamp_header: X-Slack-Request-Timestamp

errors:
  # Every one of these is an HTTP 200. That is not a mistake in this file, it
  # is the single most surprising thing about the Slack API.
  rate_limit:
    status: 429
    code: rate_limited
    message: The request was rate limited.
    headers:
      Retry-After: "30"

  authentication_error:
    status: 200
    code: invalid_auth
    message: The token is invalid.

  # Verified live 2026-09-05: no Authorization header sent at all. A
  # different code than a present-but-wrong token gets, on the same 200.
  no_credential:
    status: 200
    code: not_authed
    message: No authentication token provided.

  resource_missing:
    status: 200
    code: channel_not_found
    message: No such channel.

  parameter_missing:
    status: 200
    code: invalid_arguments
    message: A required argument is missing.

  not_in_channel:
    status: 200
    code: not_in_channel
    message: The bot is not a member of that channel.

  message_too_long:
    status: 200
    code: msg_too_long
    message: The message text is longer than Slack allows.

  restricted_action:
    status: 200
    code: restricted_action
    message: A workspace policy prevents this action.

fixtures:
  empty: {}

  small-workspace:
    channel:
      - id: C0000000001
        name: general
        is_private: false
        topic: Company-wide announcements
        num_members: 24
      - id: C0000000002
        name: engineering
        is_private: false
        topic: Builds, deploys and incidents
        num_members: 9
      - id: C0000000003
        name: leadership
        is_private: true
        num_members: 3
    user:
      - id: U0000000001
        name: ada
        real_name: Ada Lovelace
        is_bot: false
      - id: U0000000002
        name: cauldron
        real_name: Cauldron
        is_bot: true
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: U0000000003
        name: cauldron
        real_name: Cauldron
        is_bot: true
    message:
      - id: "1767225600.000100"
        channel: C0000000002
        text: Deploy finished in 41 seconds.
        user: U0000000002
      - id: "1767225601.000200"
        channel: C0000000002
        text: Nice. Who is on call?
        user: U0000000001

# Conformance cases, read from Slack's Web API reference rather than observed
# against a live workspace. The verify report says so.
conformance:
  - name: a failure is an HTTP 200 carrying ok false
    source: https://api.slack.com/web#responses
    fixture: small-workspace
    request:
      method: GET
      path: /api/conversations.info
      query:
        channel: C9999999999
      headers:
        Authorization: Bearer xoxb-cauldron
    expect:
      # The whole point. A client branching on the status code sees success.
      status: 200
      body:
        ok: false
        error: channel_not_found
      absent:
        - message
        - error.message

  - name: no token at all is also an HTTP 200 -- and its own code, not the wrong-token one
    source: https://slack.com/api/conversations.list
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/conversations.list
    expect:
      # This case used to be named "a bad token is also an HTTP 200" and
      # send no token at all while asserting invalid_auth -- the code a
      # present-but-wrong token gets. Checked live, sending nothing gets
      # not_authed instead: a distinct code for a distinct thing not sent.
      status: 200
      body:
        ok: false
        error: not_authed

  - name: a token that is present and wrong is a different code than none at all
    source: https://slack.com/api/conversations.list
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/conversations.list
      headers:
        Authorization: Bearer xoxb-not-a-real-token
    expect:
      status: 200
      body:
        ok: false
        error: invalid_auth

  - name: a channel is fetched by a query parameter, not a path segment
    source: https://api.slack.com/methods/conversations.info
    fixture: small-workspace
    request:
      method: GET
      path: /api/conversations.info
      query:
        channel: C0000000002
      headers:
        Authorization: Bearer xoxb-cauldron
    expect:
      status: 200
      body:
        ok: true
        channel:
          id: C0000000002
          name: engineering
          is_private: false

  - name: a listing is wrapped, flagged ok and paged with a nested cursor
    source: https://api.slack.com/methods/conversations.list
    fixture: small-workspace
    request:
      method: GET
      path: /api/conversations.list
      query:
        limit: "2"
      headers:
        Authorization: Bearer xoxb-cauldron
    expect:
      status: 200
      body:
        ok: true
        channels[0].name: general
        channels[1].name: engineering
      matches:
        response_metadata.next_cursor: '^C[0-9]+$'
      absent:
        - channels[2]
        - data

  - name: posting a message returns the ts a thread reply needs
    source: https://api.slack.com/methods/chat.postMessage
    fixture: small-workspace
    request:
      method: POST
      path: /api/chat.postMessage
      headers:
        Authorization: Bearer xoxb-cauldron
      json:
        channel: C0000000002
        text: Deploy failed on the third attempt
    expect:
      status: 200
      body:
        ok: true
        message:
          text: Deploy failed on the third attempt
          type: message
      matches:
        message.ts: '^[0-9]{10}\.[0-9]{6}$'
      # Slack puts the channel beside the message, not inside it: the answer
      # is {ok, channel, ts, message: {...}}. This asserted message.channel
      # and passed, because the Recipe put it there. Code reading
      # response.message.channel to thread a reply reads undefined against
      # Slack, and the value it needs is one level up.
      absent:
        - message.channel
        - message.id

  - name: renaming takes the channel from the request body
    source: https://api.slack.com/methods/conversations.rename
    fixture: small-workspace
    request:
      method: POST
      path: /api/conversations.rename
      headers:
        Authorization: Bearer xoxb-cauldron
      json:
        channel: C0000000001
        name: announcements
    expect:
      status: 200
      body:
        ok: true
        channel:
          id: C0000000001
          name: announcements

  - name: a user lookup wraps the member, not a channel
    source: https://api.slack.com/methods/users.info
    fixture: small-workspace
    request:
      method: GET
      path: /api/users.info
      query:
        user: U0000000002
      headers:
        Authorization: Bearer xoxb-cauldron
    expect:
      status: 200
      body:
        ok: true
        user:
          name: cauldron
          is_bot: true

  - name: rate limiting is the one failure that is not a 200
    source: https://api.slack.com/apis/rate-limits
    fixture: small-workspace
    request:
      method: GET
      path: /api/users.list
      headers:
        Authorization: Bearer xoxb-cauldron
    expect:
      status: 200
      body:
        ok: true
        members[0].name: ada

  - name: the delivery type is event_callback and the event type is inside
    source: https://api.slack.com/apis/events-api#callback-field
    fixture: small-workspace
    request:
      method: POST
      path: /api/conversations.create
      headers:
        Authorization: Bearer xoxb-cauldron
      json:
        name: incident-response
    expect:
      status: 200
      webhook:
        event: channel_created
        signature_header: X-Slack-Signature
        signature: '^v0=[0-9a-f]{64}$'
        header_matches:
          X-Slack-Request-Timestamp: '^[0-9]{10}$'
        body:
          # The same string on every delivery. Branching on it tells an
          # application only that this was not the url_verification
          # handshake.
          type: event_callback
          # The discriminator, one level down.
          event.type: channel_created
          event.name: incident-response
        absent:
          # Not the default envelope. Anything reading data.object here is
          # being taught Stripe's shape under Slack's name.
          - data
          - data.object

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=U0000000001, which is the identifier of the last
  # record on the previous page, and asserts the second record came back
  # on its own: one to skip, one to return, and a third behind it to
  # prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads"
    source: "https://api.slack.com/apis/rate-limits"
    fixture: small-workspace
    request:
      method: GET
      path: "/api/users.list"
      query:
        "limit": "1"
        "cursor": "U0000000001"
      headers:
        "Authorization": "Bearer xoxb-cauldron"
    expect:
      status: 200
      body:
        "members[0].id": "U0000000002"
      absent:
        - "members[1]"
