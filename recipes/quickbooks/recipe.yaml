  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/account"
    arm: rate_limit
    fixture: small-company
    request:
      method: GET
      path: "/v3/company/cauldron/query"
      query:
        "query": "select * from Customer"
      headers:
        "Authorization": "Bearer cauldron_qbo_token"
    expect:
      status: 429
      body:
        "fault.error[0].code": "3001"
        "fault.error[0].message": "Rate limit exceeded"
        "fault.type": "ValidationFault"
        "time": "2026-01-15T09:00:00.000Z"





