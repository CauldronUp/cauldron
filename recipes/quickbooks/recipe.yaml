# QuickBooks Online Recipe for Cauldron
#
# QuickBooks gives you a sandbox company, and it is a fixed demo file you
# cannot reset to a known state, cannot seed, and cannot make match the chart
# of accounts a real customer uses. The interesting behaviour is accounting
# behaviour: an invoice that is partly paid, one voided after payment, a
# customer who is also a supplier. None of that can be arranged on demand, and
# a real company file is somebody's actual books.
#
# Three things worth modelling exactly:
#
#   1. The query response is doubly nested. A customer list arrives under
#      QueryResponse.Customer in the XML this Recipe was originally written
#      from, so a client reading data or customers finds nothing at either
#      level. Whether the live JSON keeps that capitalisation is now in
#      doubt -- see the live-checked note below, which confirms the
#      sibling field is lowercase queryResponse on the wire and leaves this
#      one an open question rather than a tested claim.
#   2. Failures arrive under fault.error as an array (lowercase, confirmed
#      live -- see below), with the HTTP status often still 200 for a
#      batch. Code reading a top-level message finds nothing.
#   3. SyncToken is the optimistic concurrency check, and it is a string of
#      digits. Sending a stale one is refused, and sending none at all
#      overwrites whatever changed since you read.
#
# Checked live against quickbooks.api.intuit.com, unauthenticated, 2026-09-05.
# Two findings:
#
#   - With no Accept header at all, the API answers XML, not JSON --
#     <IntuitResponse><Fault type="AUTHENTICATION"><Error code="3200">...
#     -- for every one of no credential, a fictitious bearer, an unrouted
#     path and a wrong method alike, all four landing on the identical
#     authentication failure regardless of what was wrong with the request.
#     Cauldron serves only the JSON this Recipe models; the XML default is
#     stated here rather than reproduced.
#   - Adding Accept: application/json changes more than the wire format.
#     The envelope this file had modelled, Fault.Error with a capital F and
#     a capital E, is the XML element naming carried straight into prose
#     without being tested against the JSON body -- and the real JSON body
#     is bottom-cased: {"fault":{"error":[{"message":"...","detail":null,
#     "code":"3200","element":null}],"type":"AUTHENTICATION"},...,
#     "queryResponse":null,...}. Every top-level field on the shared
#     response object follows the same rule, first letter lowercased from
#     its XML name -- queryResponse sits right there, null, beside fault,
#     in this very error body. The error envelope below is corrected to
#     match what was actually seen. What is NOT corrected, because it was
#     not observed and reaching it needs a real company: whether the same
#     rule reaches every field a step further in, like Customer.DisplayName
#     becoming customer.displayName inside a successful query response.
#     That is the obvious next question this finding raises, and it is
#     flagged rather than guessed at.
#
# Tokens below are fixtures, not secrets.

recipe: quickbooks
capability: accounting
version: 0.1.0

upstream:
  api: v3
  docs: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/account

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_qbo_token

responses:
  list:
    style: wrapped
    fields:
      QueryResponse:
        startPosition: 1
      # Every response carries the server time, which reconciliation code
      # uses to decide whether its view is stale.
      time: "2026-01-15T09:00:00.000Z"
  resource:
    style: wrapped
  # An array under fault.error, with a fault type beside it. Verified live,
  # 2026-09-05, with Accept: application/json: the JSON body is bottom-cased
  # from the XML element names this file originally read the shape from --
  # fault, not Fault; error, not Error; message, not Message. See the file
  # header.
  error:
    style: list
    key: fault.error
    message_field: message
    code_field: code
    # A string of digits, confirmed live -- 3200, not the number 3200.
    code_type: string
    # fault.type is fixed at the Recipe level rather than declared per error,
    # because this engine's list style places a named error's own fields
    # inside the array entry, and fault.type sits beside it instead -- there
    # is no hook to vary an outside-the-array field per error name. Verified
    # live, 2026-09-05: the authentication failure actually carries
    # AUTHENTICATION here, not the ValidationFault every other error in this
    # file assumes from documentation. That is a real difference this
    # mechanism cannot express, so it is stated in the file header rather
    # than asserted wrong in a passing case.
    fields:
      fault:
        type: ValidationFault
      time: "2026-01-15T09:00:00.000Z"

resources:
  Customer:
    collection: QueryResponse.Customer
    id:
      style: numeric
    fields:
      DisplayName:
        type: string
        required: true
      CompanyName:
        type: string
      # A string of digits, and the optimistic concurrency check. Sending a
      # stale one is refused; sending none overwrites whatever changed.
      SyncToken:
        type: string
        default: "0"
      # An inactive customer is still returned by a query that does not
      # filter, and still counts against the list.
      Active:
        type: boolean
        default: true
      # QuickBooks lets the same entity be both, and code that assumes a
      # name is unique across the two gets the wrong record.
      Job:
        type: boolean
        default: false
      Balance:
        type: number
        default: 0
      PrimaryEmailAddr:
        type: string

  Invoice:
    collection: QueryResponse.Invoice
    id:
      style: numeric
    fields:
      CustomerRef:
        type: string
      DocNumber:
        type: string
      SyncToken:
        type: string
        default: "0"
      TotalAmt:
        type: number
        default: 0
      # The part that matters. An invoice with a balance below its total is
      # partly paid, and code that treats any balance as unpaid chases a
      # customer who has already sent most of the money.
      Balance:
        type: number
        default: 0
      TxnDate:
        type: string
      DueDate:
        type: string
      # A voided invoice keeps its number and its record, and its total goes
      # to zero. It is not deleted and not paid.
      PrivateNote:
        type: string

  Account:
    collection: QueryResponse.Account
    id:
      style: numeric
    fields:
      Name:
        type: string
        required: true
      AccountType:
        type: string
        default: Income
      # Whether the account increases with a debit or a credit, which is the
      # thing a naive ledger import gets backwards.
      Classification:
        type: string
        default: Revenue
      CurrentBalance:
        type: number
        default: 0
      Active:
        type: boolean
        default: true
      SyncToken:
        type: string
        default: "0"

routes:
  - method: GET
    path: /v3/company/{realm}/query
    resource: Customer
    operation: list
    pagination:
      # This endpoint takes one query parameter and it is not a paging one.
      # The route is /query and its argument is query, whose value is a
      # statement -- "select * from Customer", as the case below sends --
      # rather than a filter. Whatever paging QuickBooks offers here is
      # written inside that statement, which is a place this format cannot
      # address: a paging parameter here is a substring of another
      # parameter's value.
      #
      # So both names say the provider accepts none. Left blank the runtime
      # reads "limit" and "cursor" from a query string that carries neither,
      # and a client sending either against the real endpoint is ignored --
      # the fake honouring them is the quiet direction to be wrong in.
      #
      # The two sibling listings below take the same treatment and for a
      # weaker reason: Intuit's own reference for them could not be reached
      # on 2026-09-05 -- its documentation site serves its navigation and
      # not its content to anything that is not a browser -- so what is
      # declared there is what this endpoint establishes, not what those
      # were read to do.
      limit: 100
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v3/company/{realm}/customer/{id}
    resource: Customer
    operation: get

  - method: POST
    path: /v3/company/{realm}/customer
    resource: Customer
    operation: create
    emits: Customer.Create

  - method: GET
    path: /v3/company/{realm}/invoice/{id}
    resource: Invoice
    operation: get

  - method: GET
    path: /v3/company/{realm}/invoices
    resource: Invoice
    operation: list
    pagination:
      # This endpoint takes one query parameter and it is not a paging one.
      # The route is /query and its argument is query, whose value is a
      # statement -- "select * from Customer", as the case below sends --
      # rather than a filter. Whatever paging QuickBooks offers here is
      # written inside that statement, which is a place this format cannot
      # address: a paging parameter here is a substring of another
      # parameter's value.
      #
      # So both names say the provider accepts none. Left blank the runtime
      # reads "limit" and "cursor" from a query string that carries neither,
      # and a client sending either against the real endpoint is ignored --
      # the fake honouring them is the quiet direction to be wrong in.
      #
      # The two sibling listings below take the same treatment and for a
      # weaker reason: Intuit's own reference for them could not be reached
      # on 2026-09-05 -- its documentation site serves its navigation and
      # not its content to anything that is not a browser -- so what is
      # declared there is what this endpoint establishes, not what those
      # were read to do.
      limit: 100
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v3/company/{realm}/accounts
    resource: Account
    operation: list
    pagination:
      # This endpoint takes one query parameter and it is not a paging one.
      # The route is /query and its argument is query, whose value is a
      # statement -- "select * from Customer", as the case below sends --
      # rather than a filter. Whatever paging QuickBooks offers here is
      # written inside that statement, which is a place this format cannot
      # address: a paging parameter here is a substring of another
      # parameter's value.
      #
      # So both names say the provider accepts none. Left blank the runtime
      # reads "limit" and "cursor" from a query string that carries neither,
      # and a client sending either against the real endpoint is ignored --
      # the fake honouring them is the quiet direction to be wrong in.
      #
      # The two sibling listings below take the same treatment and for a
      # weaker reason: Intuit's own reference for them could not be reached
      # on 2026-09-05 -- its documentation site serves its navigation and
      # not its content to anything that is not a browser -- so what is
      # declared there is what this endpoint establishes, not what those
      # were read to do.
      limit: 100
      limit_param: "-"
      cursor_param: "-"

webhooks:
  events:
    - Customer.Create
    - Customer.Update
    - Invoice.Create
    - Invoice.Update
    - Invoice.Void
    - Payment.Create
  # Three levels of nesting to say one thing happened, and no record at any
  # of them. QuickBooks names the entity and its id and leaves you to fetch
  # it, so an application reading a customer's name off a delivery is reading
  # something Intuit has never sent.
  #
  # Customer.Create arrives as two fields, name and operation, which is what
  # {resource} and {action} are for.
  payload:
    eventNotifications:
      - realmId: "1185883450"
        dataChangeEvent:
          entities:
            - name: "{resource}"
              id: "{record_id}"
              operation: "{action}"
              lastUpdated: "{created_iso}"
  signing:
    scheme: hmac-sha256
    header: intuit-signature
    secret: cauldron-verifier-token
    # Base64 of the digest over the body, which Intuit compares as a string.
    encoding: base64
    over: "{body}"
    value: "{digest}"

errors:
  rate_limit:
    status: 429
    code: "3001"
    message: Rate limit exceeded
    headers:
      Retry-After: "60"

  # Verified live, 2026-09-05, with Accept: application/json: no credential,
  # a fictitious bearer, an unrouted path and a wrong method all answer this
  # exact body -- the credential is checked before anything else.
  authentication_error:
    status: 401
    code: "3200"
    message: "message=AuthenticationFailed; errorCode=003200; statusCode=401"

  resource_missing:
    status: 404
    code: "610"
    message: "Object Not Found: {detail}"

  parameter_missing:
    status: 400
    code: "2020"
    message: "Required param missing, need to supply the required value for the API: {detail}"

  # The optimistic concurrency failure, which is the one an integration hits
  # as soon as two people edit the same customer.
  stale_object:
    status: 400
    code: "5010"
    message: "Stale Object Error: You and another user were working on the same object at the same time."

  # QuickBooks refuses a duplicate name, which is what breaks a customer
  # import halfway through.
  duplicate_name:
    status: 400
    code: "6240"
    message: "Duplicate Name Exists Error: The name supplied already exists."

  # An invoice already voided cannot be voided again, and a retried request
  # after a timeout hits exactly this.
  invalid_transaction:
    status: 400
    code: "6000"
    message: "A business validation error has occurred: the transaction is already void."

fixtures:
  empty: {}

  small-company:
    Account:
      - id: "79"
        Name: Sales
        AccountType: Income
        Classification: Revenue
        CurrentBalance: 12400
      - id: "80"
        Name: Accounts Receivable
        AccountType: Accounts Receivable
        # Increases with a debit. A ledger import that assumes every account
        # behaves the same way posts it backwards.
        Classification: Asset
        CurrentBalance: 3600
    Customer:
      - id: "1"
        DisplayName: Analytical Engines
        CompanyName: Analytical Engines Ltd
        SyncToken: "3"
        Balance: 1200
        PrimaryEmailAddr: ada@example.com
      - id: "2"
        DisplayName: Former Client
        SyncToken: "0"
        # Inactive, and still returned by a query that does not filter.
        Active: false
    Invoice:
      - id: "101"
        CustomerRef: "1"
        DocNumber: "1001"
        SyncToken: "1"
        TotalAmt: 2400
        # Partly paid. Code that treats any balance as unpaid chases a
        # customer who has already sent half.
        Balance: 1200
        TxnDate: "2026-01-05"
        DueDate: "2026-02-04"
      - id: "102"
        CustomerRef: "1"
        DocNumber: "1002"
        SyncToken: "2"
        # Voided. Keeps its number and its record, total goes to zero, and it
        # is neither deleted nor paid.
        TotalAmt: 0
        Balance: 0
        PrivateNote: Voided, raised against the wrong customer
        TxnDate: "2026-01-06"

# Conformance cases. The two auth cases below were checked live against
# quickbooks.api.intuit.com, unauthenticated, with Accept: application/json,
# on 2026-09-05 -- see the file header. Everything else, which needs a real
# company to reach, is read from Intuit's Accounting API reference rather
# than observed.
conformance:
  - name: no credential at all, checked live, is fault.error lowercase
    source: https://quickbooks.api.intuit.com/v3/company/123/companyinfo/123
    verified: "2026-09-05"
    request:
      method: GET
      path: /v3/company/cauldron/customer/9999
    expect:
      status: 401
      body:
        fault.error[0].code: "3200"
        fault.error[0].message: "message=AuthenticationFailed; errorCode=003200; statusCode=401"
      # Live, fault.type reads AUTHENTICATION here rather than the
      # ValidationFault this file assumes for everything else -- not
      # asserted, because this engine's list style has no hook to vary an
      # outside-the-array field per error name. The file header says so.
      absent:
        - message
        - Fault

  - name: and the same failure meets an unrouted path and a wrong method too
    source: https://quickbooks.api.intuit.com/v3/nonexistent
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /v3/nonexistent
    expect:
      # The credential is checked before the route or the method, so a path
      # this Recipe does not serve and a verb it does not support both land
      # on the identical authentication failure rather than a 404 or a 405.
      status: 401
      body:
        fault.error[0].code: "3200"

  - name: a query response is doubly nested and capitalised
    source: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/customer
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/query
      query:
        query: select * from Customer
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        # Two levels down and capitalised. A client reading data or customers
        # finds nothing at either level.
        QueryResponse.Customer[0].DisplayName: Analytical Engines
        QueryResponse.startPosition: 1
      absent:
        - data
        - customers
        - Customer

  - name: a partly paid invoice has a balance below its total
    source: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/invoice
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/invoice/101
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        Invoice:
          # Half paid. Treating any balance as unpaid chases a customer who
          # has already sent most of the money.
          TotalAmt: 2400
          Balance: 1200
          DocNumber: "1001"

  - name: a voided invoice keeps its number and zeroes its total
    source: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/invoice
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/invoice/102
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        Invoice:
          # Neither deleted nor paid. A report that sums totals sees nothing
          # here, and a report that counts invoices still sees one.
          DocNumber: "1002"
          TotalAmt: 0
          Balance: 0

  - name: SyncToken is a string of digits
    source: https://developer.intuit.com/app/developer/qbo/docs/develop/rest-api-features
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/customer/1
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        Customer:
          # A string, not a number. Sending a stale one is refused, and
          # sending none overwrites whatever changed since you read.
          SyncToken: "3"
          DisplayName: Analytical Engines

  - name: an inactive customer is still returned
    source: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/customer
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/query
      query:
        query: select * from Customer
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        QueryResponse.Customer[0].Active: true
        # Still in the list. A count that does not filter includes somebody
        # the business has stopped trading with.
        QueryResponse.Customer[1].Active: false

  - name: an account classification says which way it moves
    source: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/account
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/accounts
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 200
      body:
        QueryResponse.Account[0].Classification: Revenue
        # Increases with a debit. A ledger import that assumes every account
        # behaves the same way posts this one backwards.
        QueryResponse.Account[1].Classification: Asset
        QueryResponse.Account[1].AccountType: Accounts Receivable

  - name: failures arrive under fault.error as an array
    source: https://developer.intuit.com/app/developer/qbo/docs/develop/handle-errors
    fixture: small-company
    request:
      method: GET
      path: /v3/company/cauldron/customer/9999
      headers:
        Authorization: Bearer cauldron_qbo_token
    expect:
      status: 404
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        fault.error[0].code: '.'
        fault.error[0].message: 'Object Not Found'
      # Code reading a top-level message, or an errors array, finds nothing.
      absent:
        - message
        - Message
        - errors

  - name: an event arrives as an entity name and an operation, three levels down
    source: https://developer.intuit.com/app/developer/qbo/docs/develop/webhooks
    fixture: small-company
    request:
      method: POST
      path: /v3/company/1185883450/customer
      headers:
        Authorization: Bearer cauldron_qbo_token
      json:
        DisplayName: Grace Hopper
    expect:
      status: 200
      webhook:
        event: Customer.Create
        signature: '^[A-Za-z0-9+/]{43}=$'
        signature_header: intuit-signature
        body:
          # The two halves of Customer.Create, in different fields.
          eventNotifications[0].dataChangeEvent.entities[0].name: Customer
          eventNotifications[0].dataChangeEvent.entities[0].operation: Create
        matches:
          eventNotifications[0].dataChangeEvent.entities[0].id: '^[0-9]+$'
        absent:
          # No customer in it. Not the name that was just sent, not anything.
          - eventNotifications[0].dataChangeEvent.entities[0].DisplayName
          - data.object

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the Invoice listing answers with what the fixture holds"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/customer"
    fixture: small-company
    request:
      method: GET
      path: "/v3/company/79/invoices"
      headers:
        "Authorization": "Bearer cauldron_qbo_token"
    expect:
      status: 200
      body:
        "QueryResponse.Invoice[0].id": "101"
        "QueryResponse.Invoice[1].id": "102"
      absent:
        - "QueryResponse.Invoice[2]"

  # The names. This Recipe declares 3 field(s) on a Account that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an Account carries the field names this Recipe declares"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/account"
    fixture: small-company
    request:
      method: GET
      path: "/v3/company/79/accounts"
      headers:
        "Authorization": "Bearer cauldron_qbo_token"
    expect:
      status: 200
      body:
        "QueryResponse.Account[0].CurrentBalance": 12400
        "QueryResponse.Account[0].Name": "Sales"
        "QueryResponse.Account[0].SyncToken": "0"

  # The names. This Recipe declares 5 field(s) on a Customer that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a Customer carries the field names this Recipe declares"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/customer"
    fixture: small-company
    request:
      method: GET
      path: "/v3/company/79/query"
      query:
        "query": "select * from Customer"
      headers:
        "Authorization": "Bearer cauldron_qbo_token"
    expect:
      status: 200
      body:
        "QueryResponse.Customer[0].Balance": 1200
        "QueryResponse.Customer[0].CompanyName": "Analytical Engines Ltd"
        "QueryResponse.Customer[0].Job": false
        "QueryResponse.Customer[0].PrimaryEmailAddr": "ada@example.com"
        "QueryResponse.Customer[0].SyncToken": "3"

  # The names. This Recipe declares 8 field(s) on a Invoice that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "an Invoice carries the field names this Recipe declares"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/customer"
    fixture: small-company
    request:
      method: GET
      path: "/v3/company/79/invoices"
      headers:
        "Authorization": "Bearer cauldron_qbo_token"
    expect:
      status: 200
      body:
        "QueryResponse.Invoice[0].Balance": 1200
        "QueryResponse.Invoice[0].CustomerRef": "1"
        "QueryResponse.Invoice[0].DocNumber": "1001"
        "QueryResponse.Invoice[0].DueDate": "2026-02-04"
        "QueryResponse.Invoice[0].SyncToken": "1"
        "QueryResponse.Invoice[0].TotalAmt": 2400
        "QueryResponse.Invoice[0].TxnDate": "2026-01-05"

  # The names. This Recipe declares 1 field(s) on an Account that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an Account carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.intuit.com/app/developer/qbo/docs/api/accounting/most-commonly-used/account"
