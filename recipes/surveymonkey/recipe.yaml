# SurveyMonkey Recipe for Cauldron
#
# First of this group's three -- read typeform/recipe.yaml alongside this
# one; jotform/recipe.yaml and tally/recipe.yaml are its siblings. Where
# Jotform bakes the question's own label onto every answer (see
# jotform/recipe.yaml's header), SurveyMonkey answers this group's central
# question the way Typeform does: an answer names ids, never text.
#
# **A response answer is choice_id/row_id/col_id/other_id and, for an
# open-ended question only, a bare "text" of what the respondent typed --
# never the question's own wording, never a choice's label.** This is
# SurveyMonkey's own published schema for the nested answers array under
# GET /surveys/{id}/responses (developer.surveymonkey.com/api/v3/, Survey
# Responses section): {choice_id, row_id, col_id, other_id, text,
# download_url, ...}, every one of the first four an integer id addressing
# a piece of the CURRENT survey's structure. No worked JSON example of a
# populated response exists anywhere in SurveyMonkey's own documentation --
# every GET example under Survey Responses is the literal, empty `{}` --
# so this exact nested shape is cited from the field-by-field schema table
# and, for the four id fields together in one object, from the create
# request body SurveyMonkey's own docs show as a POST payload sample
# (same section): `"answers":[{"choice_id":"123456","row_id":"","col_id":"",
# "other_id":"","text":""}]`. A request body and a response body are not
# the same claim, and this Recipe says so rather than presenting the create
# sample as an observed GET.
#
# **Nothing about a response says which version of the survey it answers.**
# The Survey object itself carries date_modified (a real, worked example
# below: "2021-07-26T14:18:00"), and the Response object carries its OWN,
# separate date_modified -- documented as "Date the response was last
# modified," which is what lets a response in progress be read twice and
# differ (this group's own backlog note on this provider). Neither field
# references the other. A response's questions[].id is a bare integer with
# no revision suffix, no family id, nothing that would let a caller ask
# "was this the survey's third question when this was answered, or its
# fifth." If a question is edited or removed after an answer exists, this
# provider's documentation says nothing about what becomes of that answer
# -- no worked example, no prose, unlike jotform/recipe.yaml's isDeleted
# field or tally/recipe.yaml's persisted-question finding. That silence is
# itself the finding for this provider: two of three members of this group
# publish an answer, one does not.
#
# **Absent and wrong are two different numbered sentences, verified live,
# and the doc's own worked example gets the wire type wrong.** Struck
# against GET /surveys with no key at all and again with
# "Authorization: Bearer junktoken12345":
#
#   no header       -> 401 {"error":{"id":1010,"name":"Authorization Error",
#                       "docs":"https://developer.surveymonkey.com/api/v3/
#                       #error-codes","message":"The authorization token
#                       was not provided.","http_status_code":401}}
#   junk bearer     -> 401 {"error":{"id":1011,...,"message":"The
#                       authorization token provided was invalid."}}
#
# Same envelope, same status, different id, different sentence -- a real
# absent/rejected split, confirmed live both ways. SurveyMonkey's OWN
# published example for this exact envelope (developer.surveymonkey.com/
# api/v3/#error-codes) sends `"id": "1050"` as a quoted STRING; the live
# wire sends `"id": 1010` and `"id": 1011` as bare JSON numbers, both
# checked. The documentation's own worked example disagrees with what the
# documented API actually sends.
#
# **A wrong method on a real path answers with a different code
# vocabulary than every other failure on this host, still without a
# credential.** Struck live: `PATCH /v3/surveys`, no Authorization header at
# all, answers 405 `{"error":"MethodNotAllowed","message":"The specified
# HTTP method is not allowed.","error_data":{"method":"PATCH"}}` -- "error"
# a bare STRING here, not the {id, name, docs, message, http_status_code}
# object every 401 and 403 on this host sends. Numeric ids (1010, 1011,
# ...) name the credential failures; a short PascalCase word
# ("MethodNotAllowed", matching error 1061's own name column in the error
# table) names this one. Two vocabularies, one host, and the field named
# "error" holds an object in one and a string in the other.
#
# **That same probe, with no credential sent, is what proves routing
# resolves before the credential does.** `OPTIONS /v3/surveys` answers 204
# with `Allow: HEAD,GET,POST` -- a real Allow header exists on this host --
# and `PATCH /v3/surveys` with no Authorization header answers the 405
# above, not a 401. So the method is checked, and refused, before anybody
# asks who is calling. `GET /v3/no-such-route-xyz`, also with no
# credential, answers 404 -- not the 401 a real path gets bare-handed --
# with SurveyMonkey's own branded marketing 404 page: several kilobytes of
# HTML, `Content-Type: text/html; charset=UTF-8`, the site's own "We're
# sorry!" template, not an API error at all. Both are auth.after_routing:
# a route that does not exist, or a method it does not take, gets answered
# on its own terms before the credential is ever examined. This Recipe
# does not attempt to reproduce the branded HTML byte for byte -- see the
# gaps below, and compare together/recipe.yaml's Next.js 404 in the same
# collection, which draws the identical line for the identical reason.
#
# **Content-Type never lied, on anything struck.** Every JSON error
# answered `application/json`; the marketing 404 answered `text/html;
# charset=UTF-8` and was HTML. Checked specifically because several
# providers in this collection announce one and send the other; this is
# the clean negative result, stated because it was checked rather than
# assumed.
#
# **Two rate-limit ceilings are documented, by name, as separate headers --
# and there is no per-minute-only or per-day-only provider to compare it
# against inside this group.** developer.surveymonkey.com/api/v3/
# #request-and-response-limits names six headers in one table:
# X-Ratelimit-App-Global-Minute-Limit, -Remaining, -Reset, and the
# identical three with -Day- in place of -Minute-. The same page states the
# actual ceiling for a Draft or Private app: 120 requests per minute, 500
# requests per day (both floors -- "requests per day (starting at)" -- a
# paid or reviewed app's may be higher). Contrast jotform/recipe.yaml,
# whose rate limit is a per-day-only body field with no headers at all, and
# tally/recipe.yaml, whose own docs state a per-minute figure in prose with
# no headers and no per-day figure anywhere. Three members of one group,
# three different answers to "does this API tell you both."
#
# **A documented plan-based refusal exists and is deliberately not wired as
# auth.unentitled.** "Response Details for Basic Plans"
# (developer.surveymonkey.com/api/v3/#response-details-for-basic-plans):
# a Basic-plan account may retrieve up to 25 responses per survey through
# the responses_read_detail scope; the 26th answers error 1005 (402 Payment
# Required) "Account must be upgraded to access this feature." That is a
# credential that authenticates and is refused anyway -- authorisation, not
# authentication -- which is exactly what auth.unentitled names. It is not
# used here because the refusal is graduated by REQUEST QUANTITY (the
# first 25 succeed, the 26th does not), and auth.unentitled's own contract
# is that a named key is refused every time it is presented, unconditional
# on what was asked for. Naming a fixture key as unentitled here would
# claim a Basic-plan token can never read a single response, which
# contradicts the documentation this finding is drawn from. Recorded as a
# real errors-table entry (1005) instead, reachable only by fault
# injection, with the graduated trigger stated rather than approximated.
#
# **Even the doc's own worked list example does not add up.** GET
# /surveys' published example shows `"total": 1` beside a `links.next`
# pointing at page 2 and a `links.last` pointing at page 5 -- five pages
# of one record, on fifty per page. The field names and shapes below are
# taken from it; the internal contradiction is not reproduced.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No key was ever created, so nothing behind a real 200 was watched
#     directly. Every 200-status case below is drawn from SurveyMonkey's
#     own worked examples (the survey list and single-survey samples,
#     both real and non-empty) or, for the responses/answers shape, from
#     the schema table plus the one real worked example of that shape --
#     the create request body -- see the header above. No case built on
#     these carries a verified date.
#   - The links{self, next, prev, first, last} object this API sends
#     alongside every list is not modelled. This format's own next-page
#     mechanisms are a single cursor field or an HTTP Link header, not a
#     four-way object of URLs in the body, and reproducing it would need a
#     mechanism this format does not have -- the same gap Airbrake and
#     several others in this collection state for their own paging shapes.
#   - date_modified on the Response object is documented, in
#     SurveyMonkey's own schema table, with the type "object" -- not
#     DateString, unlike its sibling date_created and unlike the Survey
#     object's own date_modified two paragraphs up. No worked example
#     gives it a value. Declared here as a plain string rather than
#     datetime, and the type itself is stated as probably a documentation
#     slip rather than silently corrected or silently reproduced.
#   - The branded marketing HTML for an unrecognised path is not modelled
#     byte for byte -- see the header.
#   - error_data.method on a 405 is not modelled: Cauldron's error
#     templating fills a message's {detail} placeholder from the request,
#     never a Fields constant, so a name that is supposed to vary with
#     which method was actually wrong cannot be declared once for every
#     wrong-method case. Every case below that reaches this error uses
#     PATCH specifically.
#   - Every quiz/multiple-choice/matrix question-type variant, custom
#     variables, translations, the question bank, and every write route are
#     unmodelled. This Recipe covers the surface the central question is
#     about: surveys, their responses, and how a response is refused.
#
# Every case below not carrying a verified date was read from
# https://developer.surveymonkey.com/api/v3/ (fetched directly; it is a
# single-page reference with no separate machine-readable description this
# Recipe could fingerprint -- see upstream below) rather than observed
# against a real account. No key was ever created. Keys below are
# fixtures, not secrets.

recipe: surveymonkey
capability: forms
version: 0.1.0

upstream:
  api: v3
  docs: https://developer.surveymonkey.com/api/v3/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron00survmonkey00fixture000
  # A real absent/rejected split, verified live -- see the header. No
  # malformed_error: a no-prefix header and an empty "Bearer " value were
  # not struck differently from a well-formed wrong token in this probe, so
  # this stays unset rather than claiming a third sentence unheard.
  absent_error: authorization_error_absent
  rejected_error: authorization_error_invalid
  # The route and the method are both resolved before the credential --
  # verified live with no Authorization header sent at all, on both an
  # unrouted path (404, branded HTML) and a wrong method on a real one
  # (405, JSON). See the header.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: total
    page_field: page
    limit_field: per_page
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: id
    code_type: number
    type_field: name
    status_field: http_status_code
    # No Recipe-wide "docs" constant: method_not_allowed below overrides
    # this envelope's own style to flat, where "error" is a bare string
    # rather than an object, and a dotted Recipe-wide field would nest
    # into a string and clobber it. "docs" is declared per nested-style
    # error entry instead -- see each one below.

resources:
  survey:
    collection: data
    id:
      style: digits
      length: 9
    fields:
      title:
        type: string
        required: true
      nickname:
        type: string
      language:
        type: string
        default: en
      folder_id:
        type: string
      category:
        type: string
      question_count:
        type: integer
        default: 0
      page_count:
        type: integer
        default: 1
      response_count:
        type: integer
        default: 0
      date_created:
        type: datetime
      date_modified:
        type: datetime
      owner:
        type: string
      is_owner:
        type: boolean
        default: true
      footer:
        type: boolean
        default: true
      href:
        type: string
      analyze_url:
        type: string
      edit_url:
        type: string
      collect_url:
        type: string
      summary_url:
        type: string
      custom_variables:
        type: map
      # Nested under buttons_text on the wire; four fixed labels, not a
      # free-form map.
      next_button:
        type: string
        default: Next
        in: buttons_text
      prev_button:
        type: string
        default: Prev
        in: buttons_text
      done_button:
        type: string
        default: Done
        in: buttons_text
      exit_button:
        type: string
        default: Exit
        in: buttons_text

  response:
    collection: data
    id:
      style: opaque
    fields:
      survey_id:
        type: string
        in: "-"
      collector_id:
        type: string
      recipient_id:
        type: string
        null_when_unset: true
      total_time:
        type: integer
      custom_value:
        type: string
      edit_url:
        type: string
      analyze_url:
        type: string
      ip_address:
        type: string
      # "This will be null if the data is not available" -- SurveyMonkey's
      # own words.
      language:
        type: string
        null_when_unset: true
      custom_variables:
        type: map
      # completed, partial, overquota, or disqualified -- SurveyMonkey's
      # own four-way enum, one more state than Typeform's
      # completed/partial split in this same collection.
      response_status:
        type: string
        default: completed
      # default, preview, data_entry, survey_preview, or edit.
      collection_mode:
        type: string
        default: default
      date_created:
        type: datetime
      # Documented as type "object" in SurveyMonkey's own schema table,
      # unlike its sibling above -- see the header. Declared as a plain
      # string, not datetime, and not silently corrected to match its
      # sibling.
      date_modified:
        type: string
      # pages[].questions[].answers[] -- the central shape. See the
      # header for why this is cited to the create-request sample rather
      # than to an observed GET.
      pages:
        type: list

routes:
  - method: GET
    path: /surveys
    resource: survey
    operation: list
    pagination:
      style: page
      limit_param: per_page
      cursor_param: page
      limit: 50
      max_limit: 1000

  - method: GET
    path: /surveys/{id}
    resource: survey
    operation: get

  - method: GET
    path: /surveys/{survey_id}/responses
    resource: response
    operation: list
    scope: [survey_id]
    pagination:
      style: page
      limit_param: per_page
      cursor_param: page
      limit: 50
      max_limit: 1000

  - method: GET
    path: /surveys/{survey_id}/responses/{id}
    resource: response
    operation: get
    scope: [survey_id]

errors:
  # id 1010, verified live.
  authorization_error_absent:
    status: 401
    code: "1010"
    type: Authorization Error
    message: The authorization token was not provided.
    fields:
      error.docs: https://developer.surveymonkey.com/api/v3/#error-codes

  # id 1011, verified live. Also reached by a header with no "Bearer "
  # prefix or an empty value after it -- not struck differently in this
  # probe, so no malformed_error is declared; see auth above.
  authorization_error_invalid:
    status: 401
    code: "1011"
    type: Authorization Error
    message: The authorization token provided was invalid.
    fields:
      error.docs: https://developer.surveymonkey.com/api/v3/#error-codes

  # A different envelope and a different code vocabulary from every error
  # above -- see the header. Overrides the Recipe-wide nested style rather
  # than sharing it.
  method_not_allowed:
    status: 405
    style: flat
    code_field: error
    message_field: message
    code: MethodNotAllowed
    message: The specified HTTP method is not allowed.

  # Documented (developer.surveymonkey.com/api/v3/#error-codes), never
  # triggered -- this Recipe never sent enough requests to earn it, on
  # purpose. Reachable only by fault injection.
  rate_limit:
    status: 429
    code: "1040"
    type: Rate Limit Reached
    message: Too many requests were made, try again later.
    headers:
      X-Ratelimit-App-Global-Minute-Limit: "120"
      X-Ratelimit-App-Global-Day-Limit: "500"

  # The Basic-plan response ceiling -- see the header on why this is not
  # auth.unentitled. Documented, never triggered: no account of either
  # plan tier exists to read past 25 responses against.
  payment_required:
    status: 402
    code: "1005"
    type: Payment Required
    message: Account must be upgraded to access this feature.

fixtures:
  empty: {}

  small-account:
    survey:
      # SurveyMonkey's own worked examples, verbatim: the GET /surveys
      # list sample and the GET/PUT/PATCH /surveys single-resource sample,
      # both real and non-empty -- developer.surveymonkey.com/api/v3/.
      - id: "309683094"
        title: New Survey
        nickname: ""
        language: en
        folder_id: "0"
        category: ""
        question_count: 0
        page_count: 1
        response_count: 0
        date_created: "2021-07-26T14:18:00"
        date_modified: "2021-07-26T14:18:00"
        owner: "309683094"
        is_owner: true
        footer: true
        href: https://api.surveymonkey.com/v3/surveys/309683094
        analyze_url: https://www.surveymonkey.com/analyze/tdx6osJq3_2BVcoKKHn_2BZbgTOq9Dj4_2BqWejehwAh1_2BfQA_3D
        edit_url: https://www.surveymonkey.com/create/?sm=tdx6osJq3_2BVcoKKHn_2BZbgTOq9Dj4_2BqWejehwAh1_2BfQA_3D
        collect_url: https://www.surveymonkey.com/collect/list?sm=tdx6osJq3_2BVcoKKHn_2BZbgTOq9Dj4_2BqWejehwAh1_2BfQA_3D
        summary_url: https://www.surveymonkey.com/summary/tdx6osJq3_2BVcoKKHn_2BZbgTOq9Dj4_2BqWejehwAh1_2BfQA_3D

    response:
      # No worked GET example exists anywhere in SurveyMonkey's docs for
      # this resource -- see the header. The four answer id fields and
      # their empty-string shape are SurveyMonkey's own create-request
      # sample, cited and not observed as a response; every other field
      # value here is this Recipe's own small-account scenario, typed from
      # the schema table.
      - id: cauldron-resp-0001
        survey_id: "309683094"
        collector_id: cauldron-coll-0001
        recipient_id: ""
        total_time: 42
        custom_value: ""
        response_status: completed
        collection_mode: default
        date_created: "2026-01-05T12:00:00"
        date_modified: "2026-01-05T12:04:00"
        pages:
          - id: "1234"
            questions:
              - id: "1234"
                variable_id: ""
                answers:
                  - choice_id: "123456"
                    row_id: ""
                    col_id: ""
                    other_id: ""
                    text: ""

conformance:
  - name: no credential at all is the first numbered sentence
    source: https://api.surveymonkey.com/v3/surveys
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /surveys
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error.id: 1010
        error.name: Authorization Error
        error.message: The authorization token was not provided.
        error.docs: https://developer.surveymonkey.com/api/v3/#error-codes

  - name: a junk bearer token is the second, different sentence
    source: https://api.surveymonkey.com/v3/surveys
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /surveys
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.id: 1011
        error.message: The authorization token provided was invalid.

  - name: the error id travels as a JSON number, not the string the docs themselves show
    source: https://api.surveymonkey.com/v3/surveys
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /surveys
    expect:
      status: 401
      matches:
        error.id: "^1010$"

  - name: a wrong method on a real path is refused before any credential is examined
    # Live, no Authorization header at all. A different envelope than the
    # two cases above -- error is a bare string here, not an object -- and
    # a different status. Proves auth.after_routing together with the next
    # case.
    source: https://api.surveymonkey.com/v3/surveys
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: PATCH
      path: /surveys
    expect:
      status: 405
      body:
        error: MethodNotAllowed
        message: The specified HTTP method is not allowed.
      absent:
        - error.id
        - error.name

  - name: an unrecognised path, also with no credential, is refused on its own terms
    # Live: SurveyMonkey's own branded 404 page, HTML, not the numbered
    # JSON error every real path sends. Not reproduced byte for byte -- see
    # the header -- only the status and the honest Content-Type are
    # asserted.
    source: https://api.surveymonkey.com/v3/no-such-route-xyz
    verified: "2026-09-03"
    fixture: small-account
    request:
      method: GET
      path: /no-such-route-xyz
    expect:
      status: 404

  - name: a survey list is wrapped under data, beside per_page, page and total
    source: https://developer.surveymonkey.com/api/v3/
    fixture: small-account
    request:
      method: GET
      path: /surveys
      headers:
        Authorization: Bearer cauldron00survmonkey00fixture000
    expect:
      status: 200
      body:
        data[0].title: New Survey
        data[0].id: "309683094"
        per_page: 50
        page: 1
        total: 1

  - name: a single survey is bare, with no data wrapper at all
    source: https://developer.surveymonkey.com/api/v3/
    fixture: small-account
    request:
      method: GET
      path: /surveys/309683094
      headers:
        Authorization: Bearer cauldron00survmonkey00fixture000
    expect:
      status: 200
      body:
        title: New Survey
        date_modified: "2021-07-26T14:18:00"
      absent:
        - data

  - name: an answer names a choice id, never the choice's own text
    # The central finding -- see the header on why this case's source is
    # the create-request sample rather than an observed GET.
    source: https://developer.surveymonkey.com/api/v3/#api-endpoints-survey-responses
    fixture: small-account
    request:
      method: GET
      path: /surveys/309683094/responses/cauldron-resp-0001
      headers:
        Authorization: Bearer cauldron00survmonkey00fixture000
    expect:
      status: 200
      body:
        pages[0].questions[0].answers[0].choice_id: "123456"
        response_status: completed
      absent:
        - pages[0].questions[0].text
        - pages[0].questions[0].title
        - pages[0].questions[0].answers[0].label

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the response listing answers with what the fixture holds"
    source: "https://developer.surveymonkey.com/api/v3/"
    fixture: small-account
    request:
      method: GET
      path: "/surveys/309683094/responses"
      headers:
        "Authorization": "Bearer cauldron00survmonkey00fixture000"
    expect:
      status: 200
      body:
        "data[0].id": "cauldron-resp-0001"
      absent:
        - "data[1]"

