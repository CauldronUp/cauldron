# PatentsView Recipe for Cauldron
#
# This task's own brief describes PatentsView as a live US government API
# with an X-Api-Key header and a query language passed as a JSON parameter
# in the query string, and asks this Recipe to establish what a malformed
# query answers versus a bad key. Probed live today (2026-09-03), against
# every host that API has ever answered on, with no account and no key ever
# requested: PatentsView does not exist any more. That is the finding this
# Recipe models, and it is where this Recipe differs from both CourtListener
# and ProPublica in the sharpest way this group of Recipes has to offer --
# both of those are live, answering real data today, one of them fully open
# and the other split by viewset. PatentsView is the one member of this
# whole task that is simply gone.
#
# ## What "gone" means, precisely, checked live today
#
# GET, POST and DELETE against https://api.patentsview.org (any path --
# /patents/query, /apis, the bare root, an invented deep path), and the
# identical requests against https://patentsview.org and
# https://www.patentsview.org, all answer 301 with
# `Location: https://data.uspto.gov/support/transition-guide/patentsview`,
# whether or not a request carries an X-Api-Key header at all. Checked with
# a real-looking header attached and with none: byte-identical. This is not
# a slow migration where old and new coexist -- it is a blanket redirect at
# the edge (Cloudflare, per the Server header on every one of these
# responses), in front of whatever, if anything, still runs behind it.
#
# The fourth host this API used to answer on, search.patentsview.org --
# the one this task's brief specifically named, and the one the X-Api-Key
# and JSON-query-string shape actually lived on -- does not resolve at all.
# `nslookup search.patentsview.org` answers "Non-existent domain" against
# this machine's own resolver, checked today. That is a DIFFERENT failure
# from the other three hosts' redirect, and Cauldron's own HTTP-response
# emulation has no way to represent it: a Recipe can describe what a server
# answers, not that a name resolves to nothing before any server is ever
# reached. Stated here rather than modelled, because there is nothing to
# model -- this Recipe's routes cover the three hosts that still answer
# something.
#
# USPTO's own transition guide -- the redirect target itself, an Angular
# single-page app at data.uspto.gov that this Recipe could not read past its
# shell without a browser -- confirms in its own URL slug what this Recipe
# independently found: PatentsView is being folded into USPTO's Open Data
# Portal (ODP). This Recipe did not create an ODP account or probe it:
# ODP is a distinct product with its own registration this task's rules
# forbid signing up for, and nothing about ODP was asked for here.
#
# ## What PatentsView used to be, established from what it left behind
#
# Nothing below this point carries a verified date, because there is no
# live API left to verify it against. Every fact here comes from one of two
# kinds of evidence, cited individually: PatentsView's own published Search
# API Reference (docs cached by the Wayback Machine, since the live site no
# longer serves it) and archived HTTP responses the Wayback Machine itself
# captured from search.patentsview.org while it was still live -- as
# recently as 2026-03-26, per that capture's own timestamp, which is this
# Recipe's evidence that the shape below was current within the last six
# months, not a relic from years ago.
#
# **The credential.** Quoted verbatim from the archived Search API Reference
# (web.archive.org/web/20240416104741/https://search.patentsview.org/docs/docs/Search%20API/SearchAPIReference/):
# "The Search API uses API Keys to authenticate requests but there are no
# specific authorization enforced. i.e. if you have an API Key you can
# access all publicly available endpoints. All API requests must include
# the header X-Api-Key: {your_key}" -- exactly the shape this task's brief
# named. The same page: "Currently, the API Keys do not expire", each user
# is "allowed only one API Key", and the rate limit is "45 requests/minute".
#
# **What a missing key actually answered, struck by the Wayback Machine's
# own crawler, not by this Recipe with a real key (none was ever held):**
# GET https://search.patentsview.org/api/v1/assignee/{id}/, captured
# 2026-03-26, no X-Api-Key present -> 403 Forbidden,
# `{"detail":"You do not have permission to perform this action."}` --
# Django REST Framework's own default PermissionDenied sentence. That
# status is worth stating plainly against what PatentsView's own reference
# documents: its "HTTP Response Codes" table (quoted below) lists 200, 400,
# 404, 429 and 500, and nothing else -- no 401, no 403 anywhere in the
# provider's own published table of what it answers. The one credential
# failure this Recipe could actually observe is a status the provider's own
# reference never lists.
#
# **What the provider's own reference documents for the codes it DOES
# list**, quoted verbatim: "400 Request Invalid — Review X-Status-Reason and
# X-Status-Reason-Code response headers for more details" and "404 Resource
# not found — Verify the endpoint URL is correct. If using GET resource
# locator, verify the supplied ID is valid" and "429 Too many requests —
# ... Use Retry-After response header". A malformed query is documented to
# answer 400 with the REASON carried in response HEADERS rather than the
# body -- a shape this Recipe never got to strike, because no request this
# Recipe could make ever got past the credential check the archived capture
# shows firing first, on a route needing no query at all.
#
# **Malformed query versus bad key, in which order: not established.** This
# task asked this Recipe to establish that ordering, and the honest answer
# is that the evidence available does not settle it. Every archived capture
# this Recipe could find is a crawler request with no X-Api-Key at all, so
# every one of them shows the credential failing and none show a malformed
# query being reached at all -- there is no archived pair of "good key, bad
# query" against "bad key, good query" to compare, and this Recipe declines
# to invent one. What can be said, as an informed inference and not an
# observation, is that DRF's own request lifecycle -- the same lifecycle
# CourtListener's Recipe in this collection documents in detail, checking
# permissions in `initial()` before the view method or its query parameters
# are ever touched -- makes credential-before-query the structurally likely
# order for a DRF application answering a bare PermissionDenied. That is a
# reason to expect it, not a citation of having seen it, and the difference
# matters enough that this Recipe states it this plainly rather than
# blurring the two together.
#
# **The response envelope**, quoted verbatim from the same reference: every
# response carries `error` (boolean), `count` (integer) and `total_hits`
# (integer) beside the endpoint's own data. Both `count` and `total_hits`
# on one response is itself worth stating -- one is how many records this
# page carries and the other is how many matched in total, distinct fields
# for a distinction several APIs elsewhere in this collection (Zendesk, for
# one) only give one field for.
#
# **The identifier scheme, and the shift this Recipe could see directly by
# comparing two different eras of the same provider's own archived
# traffic.** The legacy, pre-2020 API (www.patentsview.org/api/..., no key
# of any kind, itself archived) addressed a patent by `patent_number` -- an
# archived request reads `q={"_contains":{"assignee_organization":
# "boeing"}}` with `f=["patent_id","assignee_organization",...]` in ONE
# capture and `patent_number` in an f-list on an older one, and the Search
# API's own g_claim endpoint (search.patentsview.org/api/v1/g_claim/,
# archived 2025-03-19) is addressed with `q={"patent_id":"10536224"}` --
# `patent_id`, not `patent_number`. Two generations of the same provider,
# two different field names for what a patent's own USPTO number is called
# on the wire, both observed directly in archived request URLs rather than
# read off a changelog. Neither generation aggregates across jurisdictions
# the way OpenCorporates does -- every patent here is a USPTO grant, one
# register, one country -- so there is no separate jurisdiction field the
# way there is on a company; a patent_id IS a USPTO number, unqualified.
#
# **Legal status is a gap this Recipe went looking for and did not find.**
# The whole point of a register, this task's own brief says, is that a
# record that no longer exists is still retrievable -- for a patent, the
# analogue of a struck-off company is an EXPIRED patent, one whose term has
# lapsed or that was invalidated. Nothing in the archived Search API
# Reference this Recipe could read names a legal-status, expiration or
# in-force field anywhere. `patent_type` (utility, design -- confirmed
# live in an archived worked example: "this query string will return all
# patents that are not design patents") categorises the KIND of patent, not
# whether its term is still running. That absence is stated as "not found
# in what this Recipe could review," not as "confirmed absent" -- the
# archived documentation captured is not a complete mirror of everything
# PatentsView ever published, and a field could exist on a page this
# Recipe's own searches did not surface.
#
# **The query language itself**, confirmed from a worked example in the
# same reference: `_not`, `_and`, `_or` as join/negation operators, and a
# bare array as a value meaning "match any of these" -- the reference's own
# example queries `inventors.inventor_name_last` against
# `["Whitney","Hopper"]`. Those are two real historical inventors named in
# PatentsView's own documentation, not this Recipe's invention -- and this
# task's rule against putting named individuals in a fixture is followed
# here anyway, by not reproducing that example as a servable case at all
# (query-language operators are described in prose above rather than
# fixtured), rather than deciding two long-dead 18th/20th-century inventors
# used as a vendor's own textbook example fall outside the spirit of the
# rule.
#
# ## Known fidelity gaps, stated rather than hidden
#
#   - This Recipe's ROUTES model only the current, live, verified reality:
#     an unconditional redirect. The pre-retirement X-Api-Key/query-language
#     surface is established above in prose, with citations, and is NOT
#     served as working routes -- doing that would make this Recipe claim an
#     emulator stands in for an API that, as of today, answers nothing at
#     all. That would misrepresent the one fact checked most thoroughly
#     here.
#   - search.patentsview.org's DNS non-existence cannot be modelled -- see
#     above.
#   - No upstream.spec is recorded. The Swagger UI this provider used to
#     publish (search.patentsview.org/swagger-ui/, archived as recently as
#     2025-12-31) answers the same redirect every other path on that family
#     of hosts does now, and USPTO's own ODP transition page is a client
#     -rendered app this Recipe could not read a machine-readable
#     description out of without a browser.
#   - Malformed-query-vs-bad-key ordering is not established -- see above.

recipe: patentsview
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://data.uspto.gov/support/transition-guide/patentsview

auth:
  # Nothing gates the one behaviour this Recipe can still verify live: the
  # redirect fires identically whether or not a request carries an
  # X-Api-Key. See the header for the credential scheme this host used to
  # enforce and no longer reaches.
  scheme: none

routes:
  # Every one of these answers the identical redirect -- struck live today
  # across three hosts, several paths, three methods, and with and without
  # a credential attached. One raw body serves all of them because the
  # provider itself does not distinguish; see the header.
  - method: GET
    path: /
    status: 301
    headers:
      Location: https://data.uspto.gov/support/transition-guide/patentsview
    raw:
      content_type: text/html; charset=UTF-8
      text: |
        <html>
        <head><title>301 Moved Permanently</title></head>
        <body>
        <center><h1>301 Moved Permanently</h1></center>
        <hr><center>cloudflare</center>
        </body>
        </html>

  - method: GET
    path: /apis
    status: 301
    headers:
      Location: https://data.uspto.gov/support/transition-guide/patentsview
    raw:
      content_type: text/html; charset=UTF-8
      text: |
        <html>
        <head><title>301 Moved Permanently</title></head>
        <body>
        <center><h1>301 Moved Permanently</h1></center>
        <hr><center>cloudflare</center>
        </body>
        </html>

  - method: GET
    path: /patents/query
    status: 301
    headers:
      Location: https://data.uspto.gov/support/transition-guide/patentsview
    raw:
      content_type: text/html; charset=UTF-8
      text: |
        <html>
        <head><title>301 Moved Permanently</title></head>
        <body>
        <center><h1>301 Moved Permanently</h1></center>
        <hr><center>cloudflare</center>
        </body>
        </html>

  # A wrong method on the same path. Byte-identical -- see the header.
  - method: POST
    path: /patents/query
    status: 301
    headers:
      Location: https://data.uspto.gov/support/transition-guide/patentsview
    raw:
      content_type: text/html; charset=UTF-8
      text: |
        <html>
        <head><title>301 Moved Permanently</title></head>
        <body>
        <center><h1>301 Moved Permanently</h1></center>
        <hr><center>cloudflare</center>
        </body>
        </html>

  # An invented, deeply nested path that was never a real endpoint on any
  # generation of this API. Byte-identical to a real one -- routing has
  # nothing left to distinguish, because nothing behind the edge is being
  # routed to any more.
  - method: DELETE
    path: /this-is-not-a-real-endpoint/deep/path
    status: 301
    headers:
      Location: https://data.uspto.gov/support/transition-guide/patentsview
    raw:
      content_type: text/html; charset=UTF-8
      text: |
        <html>
        <head><title>301 Moved Permanently</title></head>
        <body>
        <center><h1>301 Moved Permanently</h1></center>
        <hr><center>cloudflare</center>
        </body>
        </html>

fixtures:
  empty: {}

# Every case below was struck live today against the hosts named in each
# source URL, with no account and no key ever requested. Nothing in this
# Recipe carries an unverified 2xx from the provider itself, because the
# provider no longer answers with one at all -- see the header for the
# pre-retirement shape this Recipe could only establish from archived and
# documentary evidence, none of it fixtured as a route.
conformance:
  - name: the root path redirects to USPTO's own transition guide
    source: https://patentsview.org/
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview
        Content-Type: text/html; charset=UTF-8

  - name: the api host answers the identical redirect
    source: https://api.patentsview.org/patents/query
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /patents/query
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview

  - name: a credential attached to the request changes nothing -- routing, not auth, answers first and last
    source: https://api.patentsview.org/patents/query
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /patents/query
      headers:
        X-Api-Key: junkjunkjunk12345
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview

  - name: a wrong method on a real path redirects exactly the way GET does
    source: https://api.patentsview.org/patents/query
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /patents/query
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview

  - name: an invented deep path redirects exactly the way a real one does -- there is no router left to tell them apart
    source: https://patentsview.org/this-is-not-a-real-endpoint/deep/path
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /this-is-not-a-real-endpoint/deep/path
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview

  - name: the marketing host and the api host agree
    source: https://patentsview.org/apis
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /apis
    expect:
      status: 301
      headers:
        Location: https://data.uspto.gov/support/transition-guide/patentsview
