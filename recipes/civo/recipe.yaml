# Civo Recipe for Cauldron
#
# The instances listing, struck live against api.civo.com on 2026-09-13 with no
# credential, with a deliberately invalid one, and on a path that does not
# exist. Record shapes come from civogo, Civo's own Go client, which is open.
#
# **Neither credential failure is a 401.** Struck live:
#
#   (no header)      403 {"code":"authentication_access_denied","reason":"Access denied, you don't have permission on this resource"}
#   Bearer notreal   404 {"code":"database_account_not_found","reason":"Failed to find the account within the internal database"}
#   /cauldron-nope   404 404 page not found
#
# A caller who has said nothing is told they lack permission. A caller whose
# token was read and rejected is told the **account** was not found -- with a
# 404, a code naming a database, and a sentence naming it again: "the internal
# database". So the rejection of a credential is reported as a missing row in
# storage the caller has never heard of, and 404 is the status for it.
#
# A client cannot tell any of this apart from a genuinely missing resource:
# both the wrong-credential case and an unrouted path answer 404, in two
# different shapes, one of them not JSON at all.
#
# **The field is `reason`, not `message`.** Two keys, `code` and `reason`, and
# neither is the name almost every other API in this collection uses.
#
# **An instance carries two passwords.** `initial_password` and
# `rescue_password` are fields on the record a listing returns, beside
# `initial_user` and an `ssh_key`.
#
# **And a second credential.** `civostatsd_token` sits on the same record --
# the metrics agent's key, on the object that describes the machine.
#
# **The cloud underneath shows through.** `openstack_server_id` and
# `openstack_image_id` are the identifiers of the same machine in the system
# Civo is built on, beside Civo's own `id` and `template_id`. Four identifiers
# for two things.
#
# **Three fields are the address.** `public_ip`, `reserved_ip` and `pseudo_ip`,
# plus `private_ip` and `ipv6` -- five address fields, with `reserved_ip_id` and
# `reserved_ip_name` beside them, and nothing saying which one a caller should
# connect to.
#
# **And the client omits every zero value it sends.** Every field on civogo's
# `Instance` is tagged `omitempty`, including `volume_backed bool` and the four
# integer counts. Go's encoder drops those when they are false or zero, so a
# request that means `volume_backed: false` or `gpu_count: 0` leaves the field
# out entirely and the server is told nothing rather than told the value. The
# boolean can be sent as true and cannot be sent as false.

recipe: civo
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://www.civo.com/api
  # No spec: Civo documents this API as prose. There is no OpenAPI document at
  # any address this Recipe could find; the record shape below is read from
  # civogo, which is the artefact a description would have produced.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nc1v0f1xturet0ken
  # A permission failure for the caller who said nothing, and a missing
  # database row for the one whose token was read.
  absent_error: access_denied
  rejected_error: account_not_found
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    page_field: page
    limit_field: per_page
    # How many pages, and never how many records: the envelope has no total
    # in it at all.
    pages_field: pages
  error:
    style: flat
    # Not `message`, which is what almost everything else in this collection
    # calls this field.
    message_field: reason
    code_field: code
    code_type: string

resources:
  instance:
    id:
      field: id
      style: uuid
    fields:
      hostname:
        type: string
      reverse_dns:
        type: string
      size:
        type: string
      region:
        type: string
      network_id:
        type: string
      status:
        type: string
      # Five address fields on one record, and nothing saying which to use.
      private_ip:
        type: string
      public_ip:
        type: string
      ipv6:
        type: string
      pseudo_ip:
        type: string
      reserved_ip:
        type: string
      reserved_ip_id:
        type: string
      reserved_ip_name:
        type: string
      # The cloud underneath, named on the public record.
      openstack_server_id:
        type: string
      openstack_image_id:
        type: string
      template_id:
        type: string
      source_type:
        type: string
      source_id:
        type: string
      initial_user:
        type: string
      # Two passwords, on the object a listing returns.
      initial_password:
        type: string
      rescue_password:
        type: string
      ssh_key_id:
        type: string
      # A second credential: the metrics agent's key.
      civostatsd_token:
        type: string
      firewall_id:
        type: string
      notes:
        type: string
      tags:
        type: list
      cpu_cores:
        type: integer
      ram_mb:
        type: integer
      disk_gb:
        type: integer
      gpu_count:
        type: integer
      gpu_type:
        type: string
      # Tagged omitempty in the client, so a false here is sent as nothing.
      volume_backed:
        type: boolean
      volume_type:
        type: string
      created_at:
        type: datetime

routes:
  - method: GET
    path: /v2/instances
    resource: instance
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 20
      limit_param: per_page
      cursor_param: page

errors:
  access_denied:
    # A permission failure, for a caller who has not said who they are.
    status: 403
    code: authentication_access_denied
    message: Access denied, you don't have permission on this resource

  account_not_found:
    # 404 for a credential that was read and rejected, naming the storage it
    # was looked up in.
    status: 404
    code: database_account_not_found
    message: Failed to find the account within the internal database

  unknown_route:
    status: 404
    # Go's http.NotFound string, in plain text, from an API whose other
    # failures are JSON -- and at the same status as the one above.
    style: text
    message: 404 page not found
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    instance: []

  account:
    instance:
      - id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        hostname: web-01.example.com
        reverse_dns: web-01.example.com
        size: g3.small
        region: LON1
        network_id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        status: ACTIVE
        private_ip: 192.168.1.10
        public_ip: 203.0.113.10
        ipv6: "2001:db8::10"
        pseudo_ip: 10.250.0.10
        reserved_ip: 203.0.113.200
        reserved_ip_id: 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        reserved_ip_name: web-vip
        # The same machine, in the system Civo is built on.
        openstack_server_id: b8f9b663-0a3b-cf45-587a-be880946e881
        openstack_image_id: cf2e9a71-4d3b-4a8e-9f1c-2b7d5e6a3c90
        template_id: ubuntu-24-04
        source_type: diskimage
        source_id: ubuntu-24-04
        initial_user: civo
        # Two passwords, on the record a listing returns.
        initial_password: n0tarealpassw0rd
        rescue_password: n0tarealrescuepw
        ssh_key_id: 1a2b3c4d-5e6f-4a1b-8c2d-9e0f1a2b3c4d
        # And a second credential beside them.
        civostatsd_token: n0tarealstatsdt0ken
        firewall_id: d2a9c1b0-4e55-4d3f-8b2a-7f6d3e5c9b21
        notes: ""
        tags:
          - web
          - production
        cpu_cores: 2
        ram_mb: 4096
        disk_gb: 50
        gpu_count: 0
        gpu_type: ""
        volume_backed: true
        volume_type: ssd
        created_at: "2026-03-11T08:30:00Z"

conformance:
  - name: a caller who says nothing lacks permission
    source: https://api.civo.com/v2/instances
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers: {}
    expect:
      # 403, not 401, for a caller who has not said who they are.
      status: 403
      body:
        code: authentication_access_denied
        # `reason`, not `message`.
        reason: Access denied, you don't have permission on this resource

  - name: a wrong credential is a missing row in an internal database
    source: https://api.civo.com/v2/instances
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      # 404 for a rejected credential, which a client cannot tell from a
      # genuinely missing resource.
      status: 404
      body:
        # The code names the storage layer and the sentence names it again.
        code: database_account_not_found
        reason: Failed to find the account within the internal database

  - name: an unrouted path is the same status in a different shape
    source: https://api.civo.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 404
      headers:
        # Not JSON at all, at the same status as the JSON failure above.
        Content-Type: text/plain; charset=utf-8
      body_matches: '\A404 page not found\s*\z'

  - name: an instance carries two passwords
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        # On the record a listing returns, beside the user they belong to.
        'items[0].initial_user': civo
        'items[0].initial_password': n0tarealpassw0rd
        'items[0].rescue_password': n0tarealrescuepw

  - name: and a second credential beside them
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        # The metrics agent's key, on the object that describes the machine.
        'items[0].civostatsd_token': n0tarealstatsdt0ken
        'items[0].ssh_key_id': 1a2b3c4d-5e6f-4a1b-8c2d-9e0f1a2b3c4d
        'items[0].firewall_id': d2a9c1b0-4e55-4d3f-8b2a-7f6d3e5c9b21

  - name: the cloud underneath shows through
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        # Four identifiers for two things: Civo's and OpenStack's.
        'items[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        'items[0].openstack_server_id': b8f9b663-0a3b-cf45-587a-be880946e881
        'items[0].openstack_image_id': cf2e9a71-4d3b-4a8e-9f1c-2b7d5e6a3c90
        'items[0].template_id': ubuntu-24-04
        'items[0].source_id': ubuntu-24-04
        'items[0].source_type': diskimage

  - name: five fields are the address
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        # And nothing on the record says which one to connect to.
        'items[0].public_ip': 203.0.113.10
        'items[0].private_ip': 192.168.1.10
        'items[0].ipv6': "2001:db8::10"
        'items[0].pseudo_ip': 10.250.0.10
        'items[0].reserved_ip': 203.0.113.200
        'items[0].reserved_ip_name': web-vip
        'items[0].reserved_ip_id': 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        'items[0].reverse_dns': web-01.example.com

  - name: the size is a name and the shape is four numbers
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        'items[0].size': g3.small
        'items[0].cpu_cores': 2
        'items[0].ram_mb': 4096
        'items[0].disk_gb': 50
        # Zero, which the client's own encoder would drop on the way back.
        'items[0].gpu_count': 0
        'items[0].gpu_type': ""
        'items[0].volume_backed': true
        'items[0].volume_type': ssd
        'items[0].status': ACTIVE
        'items[0].region': LON1
        'items[0].hostname': web-01.example.com
        'items[0].network_id': 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        'items[0].tags[0]': web
        'items[0].notes': ""
        'items[0].created_at': "2026-03-11T08:30:00Z"
        # The envelope says which page this is, how big a page is, and how
        # many pages there are -- and never how many instances exist.
        page: 1
        per_page: 20
        pages: 1

  - name: the second page is asked for by number
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: account
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
      query:
        per_page: "1"
        page: "1"
    expect:
      status: 200
      body:
        'items[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        per_page: 1
        page: 1

  - name: an account with no instances still sends the envelope
    source: https://github.com/civo/civogo/blob/master/instance.go
    fixture: empty
    request:
      method: GET
      path: /v2/instances
      headers:
        Authorization: "Bearer cauldr0nc1v0f1xturet0ken"
    expect:
      status: 200
      body:
        items: []
        page: 1
        pages: 0
