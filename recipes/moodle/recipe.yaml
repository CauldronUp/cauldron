# Moodle Recipe for Cauldron
#
# Moodle is self-hosted, so there is no single api.moodle.com to point at --
# every case below not carrying a verified date was read from Moodle's own
# published developer documentation, and every case that does carry one was
# struck against school.moodledemo.net, the demonstration school Moodle HQ
# itself operates and publicly links from moodle.org's own "Demo" navigation
# item. That is the "their public demo, if it answers" half of this brief's
# instruction for a self-hosted product; it answered, on 2026-09-03, and
# every live case below names it in `source`.
#
# **One endpoint, one signature, and the operation lives inside the request
# rather than in the path.** Every call this Recipe makes is to
# POST /webservice/rest/server.php with three parameters -- wstoken (the
# credential), wsfunction (which operation), moodlewsrestformat (json, to
# ask for the format this Recipe can actually serve; see the last gap
# below) -- the same shape this collection has already recorded twice.
# Alchemy's JSON-RPC puts the operation in a `method` field inside a POST
# body Cauldron reads with selects_body; GraphQL puts it in a `query` string
# Cauldron reads with selects. Moodle's is a third variant of the same idea,
# and it does not fit either existing mechanism: the operation name here is
# not inside the request body at all, and not a whole word inside a larger
# document -- it is the plain value of one named parameter, wsfunction,
# travelling in the query string or an ordinary form field. That is exactly
# what matches_query already reads for Clover's ?expand= and Asana's
# opt_fields in this collection, so this Recipe reuses it rather than
# reaching for a fourth mechanism: each operation below is its own route on
# the identical path and method, told apart by matches_query: {wsfunction:
# ...}, and a route declaring none of them is the fallback every
# unrecognised or absent wsfunction reaches.
#
# **Every failure this endpoint sends -- and this Recipe tested nine
# different ways to reach one -- answers HTTP 200.** Not 400, not 401: 200,
# every time, with the failure signalled entirely by an "exception" key in
# the body. Checked live against school.moodledemo.net on 2026-09-03:
#
#   GET  ?wsfunction=core_course_get_courses&moodlewsrestformat=json
#        (no wstoken at all)                     -> 200
#   GET  ?wstoken=junk...&wsfunction=core_course_get_courses&...           -> 200
#   GET  ?wstoken=0123456789abcdef0123456789abcdef&wsfunction=...&...      -> 200
#   GET  ?wstoken=x&wsfunction=...&...            -> 200
#   GET  ?wstoken=&wsfunction=...&...             -> 200
#   GET  ?wstoken=junk&wsfunction=this_is_not_a_real_function&...          -> 200
#   GET  ?wsfunction=this_is_not_a_real_function&moodlewsrestformat=json
#        (no wstoken)                             -> 200
#   GET  ?wstoken=junk&moodlewsrestformat=json (no wsfunction at all)      -> 200
#   PUT/DELETE, same query, same credential       -> 200, byte-identical
#
# and every one of the nine answered the identical body:
#
#   {"exception":"core\\exception\\moodle_exception","errorcode":
#    "invalidtoken","message":"Invalid token - token not found"}
#
# A client written the way this collection's other 91 Recipes have taught --
# check the status code first -- never even opens this body. Every one of
# those nine requests looks like success at the transport layer.
#
# **A bad token and an unknown wsfunction are the same failure, because the
# token is checked before the function name is ever read.** The pairing
# above is not nine coincidences: "no wstoken, real wsfunction",
# "no wstoken, made-up wsfunction" and "no wstoken, no wsfunction at all"
# all answer the byte-identical body. Whatever function was asked for --
# real, invented, or never named -- makes no difference until a credential
# that resolves to a user is presented. This is Alchemy's own finding
# restated on a different transport: there, an invalid key in a JSON-RPC
# path answered the identical envelope to no key at all; here, the credential
# gate is checked so far ahead of the operation dispatch that "unknown
# operation" is not a sentence this host has ever had the chance to say to
# an unauthenticated caller.
#
# **Nor does the shape of the token change the sentence.** A 32-character
# hex string built to look exactly like a real Moodle token, a single
# character "x", an empty wstoken= with nothing after the equals sign, and
# no wstoken parameter at all -- all four, checked live, answer this same
# "Invalid token - token not found." Turso's Recipe in this collection draws
# a line between a credential that is absent and one that is merely the
# wrong shape ("token contains an invalid number of segments" vs "could not
# parse jwt id"); Moodle draws none. absent_error, malformed_error and
# rejected_error are all left unset here on purpose -- the honest way this
# format has to say a provider does not tell the three apart, the same
# choice Rootly's Recipe in this collection makes for its own single
# sentence.
#
# **Any HTTP method reaches the identical result, because nothing here reads
# the verb at all.** GET, POST, PUT and DELETE against the exact same query
# string all answered this byte-identical 200 -- checked live, all four. PHP
# reading $_REQUEST does not distinguish a query-string parameter from a
# posted form field or care what verb delivered either, so there is no
# method this host refuses and no 405 anywhere on this endpoint for any
# request this Recipe could construct. auth.after_routing is declared true
# here for a different reason entirely -- see the next paragraph -- and does
# not change this: once a request reaches this one path, method has never
# been part of what decides its answer.
#
# **A path this host does not have wins over the credential, though.**
# GET /webservice/rest/this-is-not-a-real-endpoint.php answered 404, an
# ordinary small HTML "Not Found" page, Content-Type text/html;charset=UTF-8
# -- with a wstoken attached and without one, byte-identical either way,
# checked live. That is a different server making that decision: the JSON
# exception body above always carries Content-Type: application/json and no
# semicolon-space before charset the way this 404 page's header lacks a
# space too, and neither looks like the other's envelope. Nothing about a
# wrong path ever reaches the PHP web-service dispatcher that decides
# invalidtoken; whatever answers this 404 -- most likely the web server or a
# CDN in front of the PHP application, not Moodle itself -- resolves the
# path first. auth.after_routing: true carries this ordering rather than
# approximating it: a request to a route this Recipe declares nowhere 404s
# with no credential examined at all, exactly what was observed.
#
# **The format parameter is validated by exactly one string, and it is not
# an enum.** moodlewsrestformat=json, checked live, gets JSON;
# moodlewsrestformat=xml, moodlewsrestformat=some-made-up-value, and leaving
# the parameter off entirely all get the identical XML document --
# `<?xml version="1.0" encoding="UTF-8" ?><EXCEPTION
# class="core\exception\moodle_exception"><ERRORCODE>invalidtoken</ERRORCODE>
# <MESSAGE>Invalid token - token not found</MESSAGE></EXCEPTION>`, checked
# live. There is no validation error for an unrecognised format value; there
# is exactly one string this host treats specially and everything else,
# including a typo, silently falls back to the default rather than being
# refused. See the fidelity gaps for why this Recipe cannot serve that
# fallback itself.
#
# **This is the format the group's central question was written for, in a
# third shape again.** Moodle's own Enrolment API reference draws the
# deleted/marked line explicitly, in its own words: "Unenrolment is
# irreversible operation that purges user participation information," and
# separately, "Instead of full unenrolment it is usually better to only
# suspend user enrolment" -- $enrol_plugin->unenrol_user() removes the
# user_enrolments row outright, and $enrol_plugin->update_user_enrol(...,
# ENROL_USER_SUSPENDED) merely flips a status flag on a row that still
# exists. "Enrolments have two states defined by two constants:
# ENROL_USER_ACTIVE ... ENROL_USER_SUSPENDED" -- two words, not Canvas's
# seven, and unlike Canvas's "deleted" enrolment state (a queryable value a
# caller can still ask for by name, see canvas/recipe.yaml), a purged Moodle
# enrolment is not a state at all: there is no value of any field a caller
# could filter for to find it, because the row a status would live on is
# gone. Marked and deleted are both real, both named, both reachable through
# the plugin API -- and only one of them leaves anything behind to read.
#
# Separately, and worth having exactly because it looks like the same
# finding and is not: Moodle's own official mobile client -- moodleapp,
# published at github.com/moodlehq/moodleapp, which every worked field below
# is read from -- types the record core_enrol_get_enrolled_users answers
# with (CoreUserParticipant, in src/core/features/user/services/user.ts) and
# that type carries no enrolment-status field at all: no active/suspended
# flag anywhere on the per-participant record the app itself consumes. That
# is not proof the wire never sends one -- only that Moodle's own client
# never reads one from this call if it does -- and this Recipe does not
# resolve which, because no source it could fetch says so either way. It is
# recorded here rather than guessed at: unlike Canvas, where a caller who
# reads the default roster cannot tell "never enrolled" from "dropped" from
# "suspended" because all three are silently excluded from the same field's
# vocabulary, a caller reading Moodle's participant list may have no field
# to make that same distinction on at all.
#
# **Field-level redaction has one explicit, dated, first-party admission in
# the same source.** core_webservice_get_site_info -- the call that answers
# who a token belongs to, Moodle's own version of GitHub's /user or Slack's
# auth.test, addressed by id_from: auth below because there is nothing to
# read one of by -- types a field the moodleapp client itself only reads
# conditionally: "sitesecret?: string; // @since 5.2. The site secret, only
# returned to users with moodle/site:config capability (usually admins)."
# TypeScript's `?` there is the client's own admission that the key is
# sometimes simply not in the body -- present with a value for an admin
# caller, absent for everyone else, and nothing in the response says which
# happened. That is the exact shape the group's question asks about, dated
# to the current stable release (5.2) rather than inferred, and it is one
# this Recipe's fixture cannot show both sides of: a single static record
# is either the admin shape or the ordinary one, never a route that answers
# differently depending on who asked. The fixture below omits sitesecret
# entirely -- the ordinary caller's shape -- and says so rather than
# guessing at the admin one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists on school.moodledemo.net and no wstoken was ever
#     requested, guessed or used. Every 200 below carries source and no
#     verified date, and every field in it is read from moodleapp's own
#     published TypeScript models (course.ts, courses.ts, user.ts,
#     unauthenticated-site.ts), not invented and not observed against a
#     real course.
#   - This format has no XML body support at all -- docs/backlog.md names
#     the same gap for S3, SNS and Azure Blob -- so moodlewsrestformat's
#     documented XML default, confirmed live above, is recorded in this
#     header and not served by any route. Every route and conformance case
#     here forces moodlewsrestformat=json, exactly as a real integration
#     always would.
#   - core_enrol_get_enrolled_users's participant record does not declare an
#     enrolment-status field -- see the header for why, and for the
#     distinction from Canvas's own silent-exclusion finding this is not a
#     restatement of.
#   - Only three of Moodle's several hundred web-service functions are
#     modelled: the two list calls this group's question turns on and the
#     one identity call every client calls first. Course and user creation,
#     grading, forum, assignment and file-upload functions are all out of
#     scope.
#   - No upstream.spec. Moodle's function schemas are generated per
#     installation, behind an admin login (Site administration > Server >
#     Web services > API Documentation), and no static, fetchable document
#     describing them exists for this Recipe to fingerprint.
#
# The wstoken below is a fixture and belongs to no Moodle installation.

recipe: moodle
capability: docs
version: 0.1.0

upstream:
  api: rest
  provider: moodle
  docs: https://moodledev.io/docs/apis/subsystems/external

auth:
  scheme: query
  param: wstoken
  keys:
    - cauldron-moodle-fixture-token-00000000000000000000000000000000
  # absent_error, malformed_error and rejected_error are all left unset on
  # purpose: no wstoken, an empty one, a single stray character and a
  # 32-character string built to look exactly like a real one all answered
  # the identical sentence, live -- see the header. One name covers every
  # verdict, which is the honest description of a host that draws no line
  # at all.
  after_routing: true

responses:
  list:
    style: bare
  resource:
    style: bare
  error:
    # {"exception":"...","errorcode":"...","message":"..."} -- flat, no
    # wrapper, live-verified on every failure this Recipe reached.
    style: flat
    message_field: message
    code_field: errorcode
    type_field: exception

resources:
  course:
    id:
      style: numeric
      type: number
    fields:
      fullname:
        type: string
      shortname:
        type: string
      summary:
        type: string
      categoryid:
        type: integer
      idnumber:
        type: string
        null_when_unset: true
      visible:
        type: integer
        default: 1
      # weeks, topics, social, site -- Moodle's own course.ts words for it.
      format:
        type: string
        default: topics
      startdate:
        type: timestamp
        null_when_unset: true
      enddate:
        type: timestamp
        null_when_unset: true
      timecreated:
        type: timestamp
      timemodified:
        type: timestamp
        null_when_unset: true

  # A row from core_enrol_get_enrolled_users. See the header for the field
  # this record does not carry.
  participant:
    id:
      style: numeric
      type: number
    fields:
      fullname:
        type: string
      email:
        type: string
        null_when_unset: true
      # {roleid, name, shortname, sortorder} per entry -- Moodle's own
      # CoreUserRole shape.
      roles:
        type: list
      # The filter this record is scoped by. Never echoed on the wire --
      # Moodle answers a participant record with no courseid field of its
      # own, the same way Fly does not send app_name on a machine in this
      # collection's own precedent for a scope that lives only in the
      # request.
      course_id:
        type: integer
        in: "-"

  # core_webservice_get_site_info answers about whoever the token belongs
  # to, the same shape as GitHub's /user and Slack's auth.test in this
  # collection -- there is nothing to read one of by, so id_from: auth
  # below rather than a path parameter.
  site_info:
    id:
      style: opaque
      field: "-"
    fields:
      sitename:
        type: string
      username:
        type: string
      fullname:
        type: string
      siteurl:
        type: string
      userid:
        type: integer
      release:
        type: string
      version:
        type: string
      # {name, version} per entry, per Moodle's own documented shape.
      functions:
        type: list
      # Real, documented, admin-only, and deliberately absent from this
      # fixture -- see the header. This Recipe's site_info shows the
      # ordinary caller's record, which is the one it can actually source.

routes:
  - method: GET
    path: /webservice/rest/server.php
    matches_query:
      wsfunction: core_course_get_courses
    resource: course
    operation: list

  - method: GET
    path: /webservice/rest/server.php
    matches_query:
      wsfunction: core_enrol_get_enrolled_users
    resource: participant
    operation: list
    filters:
      - param: courseid
        field: course_id

  - method: GET
    path: /webservice/rest/server.php
    matches_query:
      wsfunction: core_webservice_get_site_info
    resource: site_info
    operation: get
    id_from: auth

  # The fallback every other wsfunction value, or none at all, reaches --
  # see the header for why the credential check needs a route to land on
  # before it can run at all once after_routing is declared. No case here
  # exercises this with a credential that resolves, because no source says
  # what Moodle would dispatch it to; every case that reaches this route is
  # a failing one, which is the only shape this Recipe holds evidence for.
  - method: GET
    path: /webservice/rest/server.php
    resource: site_info
    operation: get
    id_from: auth

  # PUT/POST/DELETE all answered the identical body live -- see the header.
  # One more method declared here to prove it is the credential being
  # checked and not the verb.
  - method: POST
    path: /webservice/rest/server.php
    resource: site_info
    operation: get
    id_from: auth

errors:
  # What every failure this Recipe reached actually answers with -- status
  # 200, not 4xx. See the header: no verdict this format can distinguish
  # changes this sentence, and neither does the wsfunction asked for.
  authentication_error:
    status: 200
    message: Invalid token - token not found
    code: invalidtoken
    type: 'core\exception\moodle_exception'

  # A path this Recipe declares nowhere. Live: a small HTML page, answered
  # by whatever server or CDN fronts the demo school ahead of Moodle's own
  # PHP dispatcher -- see the header. style: text because the body is not
  # JSON, and the real page is not reproduced byte for byte here, the same
  # call Together's Recipe in this collection makes for its own unrouted
  # HTML.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html;charset=UTF-8"
    message: 404 Not Found

fixtures:
  empty: {}

  # A course and its roster. Every field is read from moodleapp's own
  # published TypeScript models, cited in the header -- no account was ever
  # reached to observe a real one.
  demo-school:
    course:
      - id: 2
        fullname: Introduction to Moodle Web Services
        shortname: WSDEMO101
        summary: A course used to demonstrate the External Services API.
        categoryid: 1
        idnumber: WSDEMO-101
        visible: 1
        format: topics
        startdate: 1767225600
        timecreated: 1767225600

    participant:
      - id: 5
        fullname: Demo Participant
        email: demo-participant@example.invalid
        course_id: 2
        roles:
          - roleid: 5
            name: Student
            shortname: student
            sortorder: 5

    site_info:
      - id: self
        sitename: Moodle Demo School
        username: demo
        fullname: Demo User
        siteurl: https://school.moodledemo.net
        userid: 2
        release: "5.2"
        version: "2026080500"
        functions:
          - name: core_course_get_courses
            version: "3.0"
          - name: core_enrol_get_enrolled_users
            version: "3.0"
          - name: core_webservice_get_site_info
            version: "3.0"

# Every case below carries source. A verified date means this Recipe called
# school.moodledemo.net with exactly the request shown, on 2026-09-03, and
# recorded exactly what came back; its absence means the case was read from
# moodleapp's own published TypeScript models and never called.
conformance:
  - name: no wstoken at all answers the generic sentence, at HTTP 200
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        exception: 'core\exception\moodle_exception'
        errorcode: invalidtoken
        message: Invalid token - token not found

  - name: a 32-character token built to look real answers the identical sentence
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: "0123456789abcdef0123456789abcdef"
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: a single stray character answers the same
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: x
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: an empty wstoken answers the same
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: ""
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: a made-up wsfunction paired with a bad token is still just invalidtoken
    # Live: the token is checked so far ahead of the function name that an
    # unrecognised operation never gets its own sentence -- see the header.
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: junktoken12345
        wsfunction: this_is_not_a_real_function
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: no wsfunction at all is the same failure too
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: junktoken12345
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: POST answers the identical failure GET does
    source: https://school.moodledemo.net/webservice/rest/server.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /webservice/rest/server.php
      query:
        wstoken: junktoken12345
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        errorcode: invalidtoken

  - name: a path this host has no route for answers 404 with no credential examined
    source: https://school.moodledemo.net/webservice/rest/this-is-not-a-real-endpoint.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/this-is-not-a-real-endpoint.php
    expect:
      status: 404
      headers:
        Content-Type: "text/html;charset=UTF-8"
      body_matches: 404 Not Found

  - name: the same unrouted path answers identically with a credential attached
    source: https://school.moodledemo.net/webservice/rest/this-is-not-a-real-endpoint.php
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /webservice/rest/this-is-not-a-real-endpoint.php
      query:
        wstoken: junktoken12345
    expect:
      status: 404
      body_matches: 404 Not Found

  - name: a course answers the fields moodleapp's own CoreCourseGetCoursesData declares
    source: https://github.com/moodlehq/moodleapp/blob/main/src/core/features/courses/services/courses.ts
    fixture: demo-school
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: cauldron-moodle-fixture-token-00000000000000000000000000000000
        wsfunction: core_course_get_courses
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        "[0].id": 2
        "[0].fullname": Introduction to Moodle Web Services
        "[0].shortname": WSDEMO101
        "[0].categoryid": 1
      absent:
        - data
        - courses

  - name: enrolled users are scoped by the courseid query filter, never an echoed field
    source: https://github.com/moodlehq/moodleapp/blob/main/src/core/features/user/services/user.ts
    fixture: demo-school
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: cauldron-moodle-fixture-token-00000000000000000000000000000000
        wsfunction: core_enrol_get_enrolled_users
        moodlewsrestformat: json
        courseid: "2"
    expect:
      status: 200
      body:
        "[0].id": 5
        "[0].fullname": Demo Participant
        "[0].roles[0].shortname": student
      absent:
        - "[0].course_id"
        - "[0].courseid"

  - name: site info answers about whoever the token belongs to, and never sitesecret
    # The ordinary caller's shape. See the header for the admin-only field
    # this fixture deliberately does not carry.
    source: https://github.com/moodlehq/moodleapp/blob/main/src/core/classes/sites/unauthenticated-site.ts
    fixture: demo-school
    request:
      method: GET
      path: /webservice/rest/server.php
      query:
        wstoken: cauldron-moodle-fixture-token-00000000000000000000000000000000
        wsfunction: core_webservice_get_site_info
        moodlewsrestformat: json
    expect:
      status: 200
      body:
        sitename: Moodle Demo School
        username: demo
        userid: 2
        release: "5.2"
      absent:
        - sitesecret
