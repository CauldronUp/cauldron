# Squadcast Recipe for Cauldron
#
# The service listing, read from the OpenAPI document Squadcast publishes for
# its own reference site, and struck live against api.squadcast.com on
# 2026-09-13 with no header, with a wrong bearer, on a path that does not
# exist, and with a method the path does not take.
#
# **Every service hands out its own ingestion key.** `api_key` is a `required`
# property of the service record, so `GET /v3/services` returns the alert-intake
# key for every service in the organisation to anyone who can read the listing.
# A credential that was scoped to read configuration ends up holding the keys
# that write alerts.
#
# **Two refusals, two content types, one shape.** Struck live:
#
#   (no header)     401 application/json  {"meta":{"status":401,"error_message":"No credentials sent"}}
#   Bearer notreal  401 text/plain        {"meta":{"error_message":"invalid access token","status":401}}
#
# The same object, the same status, and one of them announced as plain text --
# with the keys in the other order, which is two code paths rather than one.
#
# **And the status inside is declared as either a string or a number.**
# `Common.V3.ErrorMeta.status` is `anyOf: [{type: string}, {type: integer}]`, so
# a client switching on it has to handle `401` and `"401"`. The description of
# that error type reads "Represents a single response containing data of type
# T." -- a generic envelope's docstring, left on the failure shape.
#
# **Everything is under `meta` or under `data`, and never both.** A success is
# `{"data": [...]}` and a failure is `{"meta": {...}}`, so the two halves of the
# envelope never appear together and a client cannot read a status off a
# successful response.
#
# **The listing declares twelve responses.** 200, 400, 401, 402, 403, 404, 409,
# 422, 500, 502, 503 and 504 -- including Payment Required, described as "Client
# error", and Gateway Timeout, described as "Server error", on an operation that
# lists services.
#
# **Four configuration fields, three named after features and one named
# nothing.** A service `required`s `auto_pause_transient_alerts_config`,
# `intelligent_alerts_grouping_config`, `delay_notification_config` -- and
# `config`, a bare object beside them.
#
# **And the record names two specific third-party products.** `slack` and
# `jira_cloud` are typed fields on the service, so the shape of a Squadcast
# service depends on which integrations Squadcast has built.
#
# Also pinned: the credential is checked before the path, so an unrouted path
# and a wrong method both answer "No credentials sent"; a service carries an
# `email` address of its own, for alerts that arrive by mail; and the
# organisation-wide failure is served from `api.squadcast.com` and
# `api.eu.squadcast.com` alike, two servers in one document with no field on any
# record saying which one answered.

recipe: squadcast
capability: observability
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://apidocs.squadcast.com
  spec: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
  spec_hash: 578d371438bd0bf6228de2b7495f7235e4742c4b3b195d0dc79fc7f205c722f2
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y00000000000000000000
  absent_error: no_credentials_sent
  malformed_error: no_credentials_sent
  rejected_error: invalid_access_token
  # Checked before the path is.

responses:
  list:
    style: wrapped
    key: data
  error:
    # Everything a failure says is under meta; everything a success says is
    # under data, and the two never appear together.
    style: nested
    key: meta
    message_field: error_message
    code_field: "-"
    # Declared anyOf [string, integer], so a client handles 401 and "401".
    status_field: status

resources:
  service:
    id:
      field: id
      style: hex
      length: 24
    fields:
      name:
        type: string
      slug:
        type: string
      # A service has an address, for alerts that arrive by mail.
      email:
        type: string
      escalation_policy_id:
        type: string
      organization_id:
        type: string
      # Required, on every record the listing returns.
      api_key:
        type: string
      description:
        type: string
      on_maintenance:
        type: boolean
      owner:
        type: map
      maintainer:
        type: map
      tags:
        type: list
      # Named after a feature...
      auto_pause_transient_alerts_config:
        type: map
      intelligent_alerts_grouping_config:
        type: map
      delay_notification_config:
        type: map
      # ...and named nothing.
      config:
        type: map
      # Two third-party products, as fields on the record.
      slack:
        type: map
      jira_cloud:
        type: map
      created_at:
        type: string
      updated_at:
        type: string

routes:
  - method: GET
    path: /v3/services
    resource: service
    operation: list
    pagination:
      style: none
    filters:
      - param: name
        field: name

errors:
  no_credentials_sent:
    status: 401
    message: No credentials sent
    headers:
      Content-Type: application/json

  invalid_access_token:
    status: 401
    # The same object and status, announced as plain text.
    message: invalid access token
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    service: []

  org:
    service:
      - id: 6192269e0822a81d955d1a4b
        name: checkout
        slug: checkout
        email: checkout@squadcast-example.incidents.squadcast.com
        escalation_policy_id: 5f462c1561cf8a766464ffc4
        organization_id: 5e2f1a0b3c4d5e6f7a8b9c0d
        # The alert-intake key, handed out by a read of the listing.
        api_key: 1f2e3d4c5b6a79880123456789abcdef0123456789abcdef
        description: Checkout and payments.
        on_maintenance: false
        owner:
          id: 5f462c1561cf8a766464ffc4
          type: squad
        maintainer:
          id: 5e2f1a0b3c4d5e6f7a8b9c0d
          type: user
        tags:
          - name: tier
            value: "1"
        auto_pause_transient_alerts_config:
          is_enabled: true
          timeout: 120
        intelligent_alerts_grouping_config:
          is_enabled: false
          rolling_window: 30
        delay_notification_config:
          is_enabled: false
          fixed_timeslot_config: {}
        config:
          dedup_key_enabled: true
        slack:
          channel_id: C0123ABCDEF
          channel_name: incidents-checkout
        jira_cloud:
          enabled: false
          project_key: ""
        created_at: "2026-02-19T11:18:07.570Z"
        updated_at: "2026-08-30T09:41:52.220Z"
      - id: 71a3c4d5e6f708192a3b4c5d
        name: search
        slug: search
        email: search@squadcast-example.incidents.squadcast.com
        escalation_policy_id: 5f462c1561cf8a766464ffc4
        organization_id: 5e2f1a0b3c4d5e6f7a8b9c0d
        api_key: 90abcdef1234567890abcdef1234567890abcdef12345678
        description: ""
        on_maintenance: true
        owner:
          id: 5e2f1a0b3c4d5e6f7a8b9c0d
          type: user
        maintainer:
          id: 5e2f1a0b3c4d5e6f7a8b9c0d
          type: user
        tags: []
        auto_pause_transient_alerts_config:
          is_enabled: false
          timeout: 0
        intelligent_alerts_grouping_config:
          is_enabled: false
          rolling_window: 0
        delay_notification_config:
          is_enabled: false
          fixed_timeslot_config: {}
        config: {}
        slack:
          channel_id: ""
          channel_name: ""
        jira_cloud:
          enabled: false
          project_key: ""
        created_at: "2026-05-02T08:00:00.000Z"
        updated_at: "2026-05-02T08:00:00.000Z"

conformance:
  - name: two refusals two content types and one shape
    source: https://api.squadcast.com/v3/services
    verified: "2026-09-13"
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        # Everything under meta, including a status the schema declares as
        # either a string or a number.
        meta.status: 401
        meta.error_message: No credentials sent

  - name: a wrong token gets the same object announced as plain text
    source: https://api.squadcast.com/v3/services
    verified: "2026-09-13"
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      headers:
        # The same shape and status, typed text.
        Content-Type: text/plain; charset=utf-8
      body:
        meta.error_message: invalid access token
        meta.status: 401

  - name: a path that does not exist is answered by the credential check
    source: https://api.squadcast.com/v3/cauldron-nope
    verified: "2026-09-13"
    fixture: org
    request:
      method: GET
      path: /v3/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        meta.error_message: No credentials sent
        meta.status: 401

  - name: a method the route does not take gets it too
    source: https://api.squadcast.com/v3/services
    verified: "2026-09-13"
    fixture: org
    request:
      method: PUT
      path: /v3/services
      headers: {}
    expect:
      status: 401
      body:
        meta.error_message: No credentials sent

  - name: every service hands out its own ingestion key
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
    expect:
      status: 200
      body:
        # api_key is a required property of the record, so reading the
        # listing reads every service's alert-intake key.
        'data[0].api_key': 1f2e3d4c5b6a79880123456789abcdef0123456789abcdef
        'data[1].api_key': 90abcdef1234567890abcdef1234567890abcdef12345678
        'data[0].name': checkout
        'data[0].slug': checkout

  - name: four configuration fields three named after features
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
    expect:
      status: 200
      body:
        'data[0].auto_pause_transient_alerts_config.is_enabled': true
        'data[0].auto_pause_transient_alerts_config.timeout': 120
        'data[0].intelligent_alerts_grouping_config.is_enabled': false
        'data[0].intelligent_alerts_grouping_config.rolling_window': 30
        'data[0].delay_notification_config.is_enabled': false
        # And the one that is just called config.
        'data[0].config.dedup_key_enabled': true
        'data[1].config': {}

  - name: the record names two third-party products
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
    expect:
      status: 200
      body:
        # The shape of a service depends on which integrations exist.
        'data[0].slack.channel_name': incidents-checkout
        'data[0].slack.channel_id': C0123ABCDEF
        'data[0].jira_cloud.enabled': false
        'data[0].jira_cloud.project_key': ""
        'data[1].slack.channel_name': ""

  - name: a service has an address of its own
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
    expect:
      status: 200
      body:
        # For alerts that arrive by mail.
        'data[0].email': checkout@squadcast-example.incidents.squadcast.com
        'data[1].email': search@squadcast-example.incidents.squadcast.com
        'data[0].escalation_policy_id': 5f462c1561cf8a766464ffc4
        'data[0].organization_id': 5e2f1a0b3c4d5e6f7a8b9c0d
        'data[0].description': Checkout and payments.
        'data[1].description': ""
        'data[0].on_maintenance': false
        'data[1].on_maintenance': true
        'data[0].owner.type': squad
        'data[1].owner.type': user
        'data[0].maintainer.type': user
        'data[0].tags[0].name': tier
        'data[1].tags': []
        'data[0].created_at': "2026-02-19T11:18:07.570Z"
        'data[0].updated_at': "2026-08-30T09:41:52.220Z"

  - name: a named service is the only one that comes back
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: org
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
      query:
        name: search
    expect:
      status: 200
      body:
        'data[0].id': 71a3c4d5e6f708192a3b4c5d
        'data[0].name': search

  - name: an organisation with no services sends data and no meta
    source: https://openapi.gitbook.com/o/rNxiyZGOoRfKnq7j5RX6/spec/Squadcast-API-Spec.json
    fixture: empty
    request:
      method: GET
      path: /v3/services
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000"
    expect:
      status: 200
      body:
        data: []
      absent:
        # The half of the envelope that only failures carry.
        - meta
