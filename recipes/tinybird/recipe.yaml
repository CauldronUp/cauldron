# Tinybird Recipe for Cauldron
#
# Written against Tinybird's API reference at docs.tinybird.co and struck live
# against api.tinybird.co on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The refusal echoes the token as a Python bytes literal.** Struck live:
#
#   GET /v0/pipes                            Authorization: Bearer notreal
#   403 {"error": "invalid authentication token. Invalid token b'notreal': ",
#        "documentation": "https://docs.tinybird.co/api-reference/overview#authentication"}
#
# `b'notreal'` is Python's `repr` of a bytes object, with the prefix, the
# quotes and all. So the string a caller sent comes back wrapped in the
# syntax of the language that rejected it -- and a real token would come back
# the same way, in a body a client is likely to log.
#
# The sentence also ends `": "` -- a colon, a space, and nothing. Something was
# meant to follow: an exception's own message, empty because the exception
# carried none. Two failures are concatenated into one sentence and the second
# half is missing.
#
# **Every failure carries a documentation link, and it is a deep one.** The
# credential failures point at the authentication anchor; the routing failure
# points at the API reference index. Two links, each aimed at the page for its
# own failure.
#
# That is the second-best `documentation_url` in this collection.
# [saltedge](../saltedge) deep-links to the anchor for the *exact* error class,
# which is better still; Tinybird links to the section, which is more than
# GitHub, [docspring](../docspring) or [statsig](../statsig) manage.
#
# **A credential failure is 403.** Not 401, for a request carrying nothing at
# all -- so the status that tells a client to authenticate never arrives.
#
# **The JSON is pretty-printed with a space after each colon** -- `{"error":
# "..."}` rather than `{"error":"..."}` -- Python's `json.dumps` default. The
# same class of tell as [gong](../gong)'s space *before* the colon, which is
# Jackson's.

recipe: tinybird
capability: analytics
version: 0.1.0

upstream:
  api: v0
  docs: https://docs.tinybird.co/api-reference/overview
  # No spec: Tinybird publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken
  # 403 for both, struck live, and the second echoes what was sent.
  absent_error: invalid_authentication_token
  rejected_error: invalid_token_echo

responses:
  list:
    style: wrapped
    key: pipes
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  pipe:
    id:
      field: id
      style: prefixed
      prefix: "t_"
    fields:
      name:
        type: string
      description:
        type: string
      type:
        type: string
        default: endpoint
      endpoint:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /v0/pipes
    resource: pipe
    operation: list
    pagination:
      style: none

errors:
  invalid_authentication_token:
    # 403 rather than 401, for a request carrying nothing at all.
    status: 403
    message: "invalid authentication token"
    fields:
      # The anchor for authentication, not the front page. The second-best
      # documentation link in this collection.
      documentation: "https://docs.tinybird.co/api-reference/overview#authentication"

  invalid_token_echo:
    status: 403
    # Python's repr of the bytes it was handed, prefix and quotes included --
    # so a real token comes back in the syntax of the language that rejected
    # it. And the sentence ends with a colon and a space: something was meant
    # to follow, and the exception it came from carried no message.
    message: "invalid authentication token. Invalid token b'notreal': "
    fields:
      documentation: "https://docs.tinybird.co/api-reference/overview#authentication"

  unknown_route:
    status: 404
    message: "API method not found, check the API reference for available methods"
    fields:
      # A different link for a different failure, aimed at the reference index
      # rather than the authentication section.
      documentation: "https://docs.tinybird.co/api-reference/api-reference.html"

fixtures:
  empty:
    pipe: []

  workspace:
    pipe:
      - id: t_9f2c14a8b73e05d6
        name: top_events_daily
        description: Rolling daily counts by event name
        type: endpoint
        endpoint: t_9f2c14a8b73e05d6
        created_at: "2026-05-14T09:02:11.000Z"
        updated_at: "2026-09-02T18:40:03.000Z"
      - id: t_3d7b0e52f14a89c6
        name: raw_events_copy
        description: ""
        # A copy pipe rather than an endpoint: it writes to a datasource on a
        # schedule and has no URL to call, so `endpoint` is null and a client
        # building a query URL from a pipe listing builds a broken one.
        type: copy
        endpoint: null
        created_at: "2026-07-01T00:00:00.000Z"
        updated_at: "2026-07-01T00:00:00.000Z"

conformance:
  - name: the refusal echoes the token as a Python bytes literal
    source: https://api.tinybird.co/v0/pipes
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 403
      body:
        # b'notreal' -- the prefix, the quotes and all. The string a caller
        # sent, back in the syntax of the language that rejected it, in a body
        # a client is likely to log.
        error: "invalid authentication token. Invalid token b'notreal': "

  - name: the sentence ends with a colon and nothing
    source: https://api.tinybird.co/v0/pipes
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 403
      matches:
        # Two failures concatenated into one sentence, and the second half is
        # an exception's own message, empty because it carried none.
        error: ': $'

  - name: no credential is 403 with a shorter sentence
    source: https://api.tinybird.co/v0/pipes
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers: {}
    expect:
      # Not 401, for a request carrying nothing at all -- so the status that
      # tells a client to authenticate never arrives.
      status: 403
      body:
        error: "invalid authentication token"

  - name: every failure links its own documentation
    source: https://api.tinybird.co/v0/pipes
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers: {}
    expect:
      status: 403
      body:
        # The authentication anchor, not the front page. Second only to Salt
        # Edge, which links the anchor for the exact error class.
        documentation: "https://docs.tinybird.co/api-reference/overview#authentication"

  - name: the routing failure links somewhere else
    source: https://api.tinybird.co/v0/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /v0/cauldron-nope
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 404
      body:
        # A different link for a different failure -- the reference index
        # rather than the authentication section.
        documentation: "https://docs.tinybird.co/api-reference/api-reference.html"
        error: "API method not found, check the API reference for available methods"

  - name: pipes are wrapped under their own plural
    source: https://docs.tinybird.co/api-reference/pipe-api
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 200
      body:
        'pipes[0].name': top_events_daily
        'pipes[0].id': t_9f2c14a8b73e05d6

  - name: a copy pipe has no endpoint to call
    source: https://docs.tinybird.co/api-reference/pipe-api
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 200
      body:
        # A copy pipe writes to a datasource on a schedule and has no URL, so
        # `endpoint` is null -- and a client building a query URL from a pipe
        # listing builds a broken one for every pipe of this kind.
        'pipes[1].type': copy
        'pipes[1].endpoint': null

  - name: an endpoint pipe names itself as its endpoint
    source: https://docs.tinybird.co/api-reference/pipe-api
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 200
      body:
        # `endpoint` holds the pipe's own id rather than a URL, so the field
        # named for an endpoint is not one and a client has to build the URL
        # from a name it already had.
        'pipes[0].endpoint': t_9f2c14a8b73e05d6

  - name: an untouched pipe has equal timestamps
    source: https://docs.tinybird.co/api-reference/pipe-api
    fixture: workspace
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 200
      body:
        'pipes[1].created_at': "2026-07-01T00:00:00.000Z"
        'pipes[1].updated_at': "2026-07-01T00:00:00.000Z"
        'pipes[1].description': ""

  - name: a workspace with no pipes answers an empty array
    source: https://docs.tinybird.co/api-reference/pipe-api
    fixture: empty
    request:
      method: GET
      path: /v0/pipes
      headers:
        Authorization: "Bearer p.eyJ1IjogImNhdWxkcm9uIn0.cauldronf1xturet0ken"
    expect:
      status: 200
      body:
        pipes: []
