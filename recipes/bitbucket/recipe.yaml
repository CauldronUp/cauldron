# Bitbucket Recipe for Cauldron
#
# Bitbucket Cloud has no sandbox. An app password reaches real repositories,
# and a test that opens a pull request notifies reviewers and triggers
# Pipelines that consume build minutes. Declining a pull request leaves it in
# the history permanently, so a test suite that opens and closes them leaves a
# visible trail in a real repository.
#
# Two things worth modelling exactly, and the first catches people arriving
# from GitHub:
#
#   1. A pull request that is DECLINED was not merged, and SUPERSEDED is a
#      third terminal state again. Code that treats anything other than OPEN
#      as merged ships changes somebody rejected.
#   2. The error is nested under "error" with only a message, while the
#      response also carries a top-level type saying it is an error. Code
#      written for a flat message finds nothing, and code reading error.code
#      finds nothing either.
#
# Known fidelity gap, stated rather than hidden: Bitbucket pages with a full
# URL in "next" rather than a cursor, and Cauldron issues its own cursor there.
#
# Tokens below are fixtures, not secrets.

recipe: bitbucket
capability: vcs
version: 0.1.0

upstream:
  api: "2.0"
  docs: https://developer.atlassian.com/cloud/bitbucket/rest/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_bitbucket_token

responses:
  list:
    style: wrapped
    count_field: size
    cursor_field: next
    # The page it served and the size it used, rather than the constants 10
    # and 1 that used to sit here. Bitbucket reports both, and paging code
    # that trusts the response rather than its own counter reads them -- a
    # field whose whole purpose is to say where you are is worse than absent
    # when it always says the same thing.
    page_field: page
    limit_field: pagelen
  error:
    style: flat
    message_field: error.message
    fields:
      # Bitbucket labels the response itself, the same way it labels every
      # other object.
      type: error

resources:
  repository:
    collection: values
    constants:
      type: repository
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      full_name:
        type: string
      description:
        type: string
      # Bitbucket calls it is_private rather than a visibility enum, and a
      # private repository in a public workspace is still private.
      is_private:
        type: boolean
        default: true
      mainbranch:
        type: string
        default: main
      created_on:
        type: datetime

  pullrequest:
    collection: values
    constants:
      type: pullrequest
    id:
      style: numeric
      type: number
    fields:
      repository_uuid:
        type: string
      title:
        type: string
        required: true
      description:
        type: string
      # OPEN, MERGED, DECLINED, SUPERSEDED. Only one of the three terminal
      # states means the change landed.
      state:
        type: string
        default: OPEN
      source_branch:
        type: string
      destination_branch:
        type: string
        default: main
      # Bitbucket tracks whether the author closed it themselves, which
      # matters when deciding whether to notify anybody.
      close_source_branch:
        type: boolean
        default: false
      created_on:
        type: datetime
      updated_on:
        type: datetime

  pipeline:
    collection: values
    constants:
      type: pipeline
    id:
      style: uuid
    fields:
      repository_uuid:
        type: string
      build_number:
        type: integer
      # PENDING, IN_PROGRESS, COMPLETED, ERROR, STOPPED. COMPLETED says the
      # pipeline finished, not that it passed: the result is a separate
      # field, and conflating the two reports every finished build as green.
      state_name:
        type: string
        default: PENDING
      result_name:
        type: string
        in: state_result
      created_on:
        type: datetime
      completed_on:
        type: datetime
        stamped: false

routes:
  - method: GET
    path: /2.0/repositories/{workspace}
    resource: repository
    operation: list
    pagination:
      # Checked against Bitbucket's own description. Its paged envelope
      # declares page, pagelen, size and next, and those first two are the
      # query parameters as well as the reported values. Pages count from one.
      style: page
      limit: 10
      limit_param: pagelen
      cursor_param: page

  - method: GET
    path: /2.0/repositories/{workspace}/{id}
    resource: repository
    operation: get

  - method: GET
    path: /2.0/repositories/{workspace}/{repository_uuid}/pullrequests
    resource: pullrequest
    operation: list
    scope: [repository_uuid]
    pagination:
      # Checked against Bitbucket's own description. Its paged envelope
      # declares page, pagelen, size and next, and those first two are the
      # query parameters as well as the reported values. Pages count from one.
      style: page
      limit: 10
      limit_param: pagelen
      cursor_param: page

  - method: POST
    path: /2.0/repositories/{workspace}/{repository_uuid}/pullrequests
    resource: pullrequest
    operation: create
    emits: pullrequest:created
    scope: [repository_uuid]
    status: 201

  - method: GET
    path: /2.0/repositories/{workspace}/{repository_uuid}/pullrequests/{id}
    resource: pullrequest
    operation: get
    scope: [repository_uuid]

  - method: GET
    path: /2.0/repositories/{workspace}/{repository_uuid}/pipelines
    resource: pipeline
    operation: list
    scope: [repository_uuid]
    pagination:
      # Checked against Bitbucket's own description. Its paged envelope
      # declares page, pagelen, size and next, and those first two are the
      # query parameters as well as the reported values. Pages count from one.
      style: page
      limit: 10
      limit_param: pagelen
      cursor_param: page

webhooks:
  events:
    - repo:push
    - pullrequest:created
    - pullrequest:fulfilled
    - pullrequest:rejected
    - repo:commit_status_created
  # Keyed on what changed, with the repository and the actor beside it. The
  # event name is in X-Event-Key and nowhere in the body, so a handler
  # switching on a body field has nothing to switch on -- it has to look at
  # which key is present instead.
  payload:
    "{resource}":
      "{object}": true
    repository:
      type: repository
      uuid: "{22222222-2222-2222-2222-222222222222}"
      full_name: cauldron/kettle
    actor:
      type: user
      nickname: cauldron
  signing:
    scheme: hmac-sha256
    header: X-Hub-Signature
    secret: cauldron-webhook-secret
    # sha256= and then hex, over the body alone. The prefix is part of the
    # value rather than a description of it, and a verifier that strips it
    # expects it to be there.
    format: prefixed-hex

errors:
  rate_limit:
    status: 429
    message: Rate limit for this resource has been exceeded
    headers:
      Retry-After: "1"

  authentication_error:
    status: 401
    message: Access token expired or invalid

  # Bitbucket's own wording, checked against api.bitbucket.org on 2026-08-22.
  # It is deliberately ambiguous and says so: a 404 here does not mean the
  # repository is gone, it means gone or private or not yours. Code that
  # treats a 404 as a deletion -- dropping a row, ending a sync, marking a
  # connection dead -- is acting on a message that explicitly declines to say
  # that, and the one case it gets wrong is a repository somebody made private
  # this morning.
  #
  # There was a generic "Resource not found: {detail}" here, which is what
  # every other provider says and what this one pointedly does not.
  resource_missing:
    status: 404
    message: You may not have access to this repository or it no longer exists in this workspace. If you think this repository exists and you have access, make sure you are authenticated.

  parameter_missing:
    status: 400
    message: "{detail} is required"

  # Bitbucket refuses a pull request whose source and destination are the same
  # branch, which is what a misconfigured automation produces.
  same_branch:
    status: 400
    message: The source branch and destination branch must be different

  # A pull request already declined cannot be declined again, and a retried
  # request after a timeout hits exactly this.
  invalid_state:
    status: 409
    message: The pull request is not in a state that allows this action

fixtures:
  empty: {}

  small-workspace:
    repository:
      - id: 11111111-1111-4111-8111-111111111111
        name: engine
        full_name: cauldron/engine
        is_private: true
        mainbranch: main
      - id: 22222222-2222-4222-8222-222222222222
        name: docs
        full_name: cauldron/docs
        is_private: false
    pullrequest:
      - id: "1"
        repository_uuid: 11111111-1111-4111-8111-111111111111
        title: Add the conformance suite
        state: MERGED
        source_branch: conformance
      - id: "2"
        repository_uuid: 11111111-1111-4111-8111-111111111111
        title: Rejected approach
        # Declined is not merged. Somebody said no.
        state: DECLINED
        source_branch: other-approach
      - id: "3"
        repository_uuid: 11111111-1111-4111-8111-111111111111
        title: Replaced by a rebase
        # A third terminal state, and also not merged.
        state: SUPERSEDED
        source_branch: old-base
    pipeline:
      - id: 33333333-3333-4333-8333-333333333333
        repository_uuid: 11111111-1111-4111-8111-111111111111
        build_number: 41
        state_name: COMPLETED
        result_name: SUCCESSFUL
        completed_on: "2026-01-12T10:05:00Z"
      - id: 44444444-4444-4444-8444-444444444444
        repository_uuid: 11111111-1111-4111-8111-111111111111
        build_number: 42
        # Finished, and failed. COMPLETED says it stopped, not that it
        # passed, and conflating the two reports every finished build green.
        state_name: COMPLETED
        result_name: FAILED
        completed_on: "2026-01-12T11:20:00Z"
      - id: 55555555-5555-4555-8555-555555555555
        repository_uuid: 11111111-1111-4111-8111-111111111111
        build_number: 43
        state_name: IN_PROGRESS

# Conformance cases, read from Bitbucket's REST reference rather than observed
# against a live workspace. The verify report says so.
conformance:
  - name: DECLINED and SUPERSEDED are terminal but not merged
    source: https://developer.atlassian.com/cloud/bitbucket/rest/api-group-pullrequests/
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/11111111-1111-4111-8111-111111111111/pullrequests
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        # Unquoted. A Bitbucket pull request id is a JSON number.
        values[0].id: 1
        values[0].state: MERGED
        # Somebody said no. Code that treats anything other than OPEN as
        # merged ships changes that were rejected.
        values[1].state: DECLINED
        # A third terminal state, and also not merged.
        values[2].state: SUPERSEDED

  - name: COMPLETED says a pipeline stopped, not that it passed
    source: https://developer.atlassian.com/cloud/bitbucket/rest/api-group-pipelines/
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/11111111-1111-4111-8111-111111111111/pipelines
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        values[0].state_name: COMPLETED
        values[0].state_result:
          result_name: SUCCESSFUL
        # Also COMPLETED, and it failed. Reading only the state reports every
        # finished build as green.
        values[1].state_name: COMPLETED
        values[1].state_result:
          result_name: FAILED

  - name: a running pipeline has no completion time
    source: https://developer.atlassian.com/cloud/bitbucket/rest/api-group-pipelines/
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/11111111-1111-4111-8111-111111111111/pipelines
      query:
        limit: "3"
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        values[2].state_name: IN_PROGRESS
      absent:
        - values[2].completed_on
        - values[2].state_result

  - name: a collection is wrapped in values with a size
    # Checked against api.bitbucket.org/2.0/repositories/atlassian on
    # 2026-08-22, which needs no token for a public workspace. The envelope is
    # exactly values, size, pagelen, page and next. No data, no items -- the
    # two names a client reaches for first, both finding undefined rather than
    # an error. size was 407 against a pagelen of 2, so it counts everything
    # rather than what arrived.
    source: https://developer.atlassian.com/cloud/bitbucket/rest/intro/
    verified: "2026-08-22"
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        size: 2
        pagelen: 10
        page: 1
        values[0].name: engine
        values[0].type: repository
      absent:
        - data
        - items

  - name: the error is nested under error with only a message
    # Checked against api.bitbucket.org on 2026-08-22. A missing repository
    # answers two keys, type and error, and error holds nothing but message.
    # No message at the top level, no error.code, no errors.
    #
    # The message itself is the finding, and it is now the one in errors
    # above: Bitbucket refuses to say whether the repository is gone or merely
    # invisible to you.
    source: https://developer.atlassian.com/cloud/bitbucket/rest/intro/
    verified: "2026-08-22"
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/99999999-9999-4999-8999-999999999999
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 404
      body:
        # The response says it is an error, and the detail is one level down.
        type: error
      matches:
        # Bitbucket's real wording, which refuses to say whether the thing
        # is missing or merely invisible.
        error.message: 'no longer exists in this workspace'
      # Code written for a flat message finds nothing, and code reading
      # error.code finds nothing either.
      absent:
        - message
        - error.code
        - errors

  - name: privacy is a boolean, not a visibility enum
    # Checked against api.bitbucket.org on 2026-08-22: a repository carries
    # is_private as a JSON boolean and type as "repository", and there is no
    # visibility key on it at all. Code ported from a provider with a
    # visibility enum reads undefined and treats every repository as public.
    source: https://developer.atlassian.com/cloud/bitbucket/rest/api-group-repositories/
    verified: "2026-08-22"
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        is_private: false
        name: docs
        type: repository
      absent:
        - visibility

  - name: a bad token is refused with the same shape
    source: https://developer.atlassian.com/cloud/bitbucket/rest/intro/
    request:
      method: GET
      path: /2.0/repositories/cauldron
    expect:
      status: 401
      body:
        type: error
      matches:
        error.message: 'expired or invalid'

  - name: the page size is pagelen, and the envelope reports where it is
    # Not "limit", which Bitbucket does not accept. Read from the wrong name
    # nothing was there, so the first response held every pull request and
    # reported no next page.
    #
    # This case existed twice, byte for byte. A duplicate adds no coverage
    # and hid how little there was: both copies sent ?limit=1 and asserted
    # only that next was non-empty.
    # Checked against api.bitbucket.org on 2026-08-22, and this is the one
    # worth reading twice. ?pagelen=1 answers pagelen 1 and one value.
    # ?limit=1 answers pagelen 10 and ten values -- the wrong name is not
    # refused, it is ignored, and a full page comes back looking like a
    # successful request for one.
    #
    # That is the failure this project keeps describing, watched happening: a
    # paging loop written against it runs once, collects everything, and
    # passes.
    source: https://api.bitbucket.org/swagger.json
    verified: "2026-08-22"
    fixture: small-workspace
    request:
      method: GET
      path: /2.0/repositories/cauldron/11111111-1111-4111-8111-111111111111/pullrequests
      query:
        pagelen: "1"
      headers:
        Authorization: Bearer cauldron_bitbucket_token
    expect:
      status: 200
      body:
        page: 1
        pagelen: 1
      matches:
        next: '.'
      absent:
        - values[1]


  - name: the body says what changed by which key it uses, and names no event
    source: https://support.atlassian.com/bitbucket-cloud/docs/event-payloads/
    fixture: small-workspace
    request:
      method: POST
      path: /2.0/repositories/cauldron/{11111111-1111-1111-1111-111111111111}/pullrequests
      headers:
        Authorization: Bearer cauldron_bitbucket_token
      json:
        title: Fix the kettle
    expect:
      status: 201
      webhook:
        event: pullrequest:created
        signature_header: X-Hub-Signature
        signature: '^sha256=[0-9a-f]{64}$'
        body:
          pullrequest.title: Fix the kettle
          actor.nickname: cauldron
        absent:
          # The event travels in X-Event-Key. Nothing in the body carries it.
          - type
          - event
          - eventType
          - data.object
