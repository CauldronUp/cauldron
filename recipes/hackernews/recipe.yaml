# Hacker News Recipe for Cauldron
#
# A thing that is not there is the four bytes "null", with a 200.
#
#   GET /v0/item/999999999999.json  ->  200  null
#   GET /v0/user/zzznotarealuser.json  ->  200  null
#
# Not an empty object, not a 404, not an error field: the JSON literal null, sent
# as application/json. So response.ok is true, .json() succeeds, and what comes
# back is the value that means "no value" in the language you are writing in.
# Code doing (await res.json()).title throws a TypeError on a null and a 200,
# with no status anywhere to have branched on first. It is the same for items and
# for users, and it is the only answer either endpoint gives for a miss.
#
# **And two of the endpoints have no envelope at all.** /v0/maxitem.json answers
# a bare integer -- 49475165, and that is the whole document -- while
# /v0/topstories.json answers a bare array of five hundred integers. Not objects:
# identifiers. Rendering a front page is one request for the list and five
# hundred for the items, and there is no batch endpoint anywhere in the API.
#
# Written against the live API rather than a document: every case below was
# checked against hacker-news.firebaseio.com on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. id is a number on an item and the username on a user. The same field
#      name, two types, and the user's identifier is the string somebody chose.
#   2. text is HTML inside a JSON string -- "<p>Tell you what, I'll..." -- with
#      no plain-text companion field, so anything rendering it has to strip tags
#      and anything not rendering it shows the tags.
#   3. time is epoch seconds. Ten digits, where most of this collection is
#      thirteen, so a client that guesses the unit from the field name puts a
#      2011 comment in 1970.
#   4. One resource serves five kinds of thing and the keys depend on which. A
#      story has title, url, score and descendants; a comment has parent and
#      text and none of those. Nothing but type says which shape arrived.
#   5. kids is the direct replies and descendants is the total. A story with
#      descendants 71 has four entries in kids, so neither field is the length
#      of the other and the comment count is not the array.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - topstories is served with three of its five hundred identifiers. The
#     length is the point and cannot be held in a fixture; the shape -- a bare
#     array of numbers, no envelope -- is what the case asserts.
#   - maxitem moves every few seconds and topstories every minute. Both are
#     served as recorded.
#   - The bare values are served as declared bytes with an application/json
#     content type, because this format describes records and neither a number
#     nor an array of numbers is one. That is the same reading recorded for
#     Frankfurter's /v1/currencies, and here it is served rather than skipped
#     because the shape is the finding.
#   - Only item, user, maxitem and topstories are modelled. newstories,
#     beststories, askstories, showstories, jobstories and updates answer the
#     same bare-array shape, and the realtime Firebase stream is not an HTTP
#     API at all.
#
# The items below are public and were recorded on the date in the cases.

recipe: hackernews
capability: infrastructure
version: 0.1.0

upstream:
  api: v0
  docs: https://github.com/HackerNews/API

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # None of the four failures below is JSON in the ordinary sense: two are a
    # bare literal, and the other two are a number and an array.
    style: text

resources:
  item:
    id:
      style: numeric
      field: id
      # A number here, and the username on a user.
      type: number
    fields:
      # story, comment, job, poll or pollopt. The keys below depend on it.
      type:
        type: string
      by:
        type: string
      # Epoch seconds, not milliseconds.
      time:
        type: integer
      # On a story.
      title:
        type: string
      url:
        type: string
      score:
        type: integer
      # The total under this story, where kids is the direct replies.
      descendants:
        type: integer
      kids:
        type: list
      # On a comment.
      parent:
        type: integer
      # HTML, inside a JSON string, with no plain-text companion.
      text:
        type: string

  user:
    id:
      style: opaque
      # The username. A number on an item.
      field: id
    fields:
      created:
        type: integer
      karma:
        type: integer
      about:
        type: string
      submitted:
        type: list

routes:
  - method: GET
    path: /v0/item/{id}.json
    resource: item
    operation: get
    not_found: absent

  - method: GET
    path: /v0/user/{id}.json
    resource: user
    operation: get
    not_found: absent

  # A bare integer, and that is the whole document.
  - method: GET
    path: /v0/maxitem.json
    error: max_item

  # A bare array of identifiers, five hundred of them.
  - method: GET
    path: /v0/topstories.json
    error: top_stories

errors:
  # The four bytes "null", as application/json, with a 200.
  absent:
    status: 200
    headers:
      Content-Type: application/json; charset=utf-8
    message: "null"

  max_item:
    status: 200
    headers:
      Content-Type: application/json; charset=utf-8
    message: "49475165"

  # Three of the five hundred.
  top_stories:
    status: 200
    headers:
      Content-Type: application/json; charset=utf-8
    message: "[49468083,49466917,49474143]"

fixtures:
  empty: {}

  news:
    item:
      # The first story on the site.
      - id: "1"
        type: story
        by: pg
        # Ten digits.
        time: 1160418111
        title: Y Combinator
        url: http://ycombinator.com
        score: 57
        # Three under the story, four in kids: neither is the length of the
        # other.
        descendants: 3
        kids:
          - 15
          - 487171
          - 234509
          - 82729

      # A comment. No title, no url, no score, no descendants.
      - id: "2921983"
        type: comment
        by: norvig
        time: 1314211127
        parent: 2921506
        # HTML in a JSON string, and the only form of the comment there is.
        text: "Aw shucks, guys ... you make me blush with your compliments.<p>Tell you what, Ill make a deal: I'll keep writing if you keep reading. K?"
        kids:
          - 2922097
          - 2922429
          - 2924562
          - 2922709
          - 2922573
          - 2922140
          - 2922141

    user:
      - id: pg
        created: 1160418092
        karma: 157316

conformance:
  - name: an item that is not there is the literal null, with a 200
    source: https://hacker-news.firebaseio.com/v0/item/999999999999.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/item/999999999999.json
    expect:
      # response.ok is true, .json() succeeds, and the value it gives back is
      # the one that means "no value" in the language you are writing in.
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
      body_matches: '^null$'

  - name: and a user that is not there is the same four bytes
    source: https://hacker-news.firebaseio.com/v0/user/zzznotarealuserxyz.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/user/zzznotarealuserxyz.json
    expect:
      # Two endpoints, two kinds of thing, one answer, and no status to branch
      # on before dereferencing it.
      status: 200
      body_matches: '^null$'

  - name: the largest identifier is a bare integer
    source: https://hacker-news.firebaseio.com/v0/maxitem.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/maxitem.json
    expect:
      # No envelope, no object, no key. The whole document is a number.
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
      body_matches: '^49475165$'

  - name: the front page is a bare array of identifiers
    source: https://hacker-news.firebaseio.com/v0/topstories.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/topstories.json
    expect:
      # Five hundred of them live, three here. Rendering the page is one
      # request for this and five hundred for the items, with no batch
      # endpoint anywhere in the API.
      status: 200
      body_matches: '^\[49468083,49466917,49474143\]$'

  - name: the identifier is a number on an item and a name on a user
    source: https://hacker-news.firebaseio.com/v0/item/1.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/item/1.json
    expect:
      status: 200
      body:
        # The same field name, two types.
        id: 1
        type: story
        by: pg
        title: Y Combinator
        # http, on a site that has been https for a decade.
        url: http://ycombinator.com
        score: 57

  - name: and the user's identifier is the string somebody chose
    source: https://hacker-news.firebaseio.com/v0/user/pg.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/user/pg.json
    expect:
      status: 200
      body:
        id: pg
        # Epoch seconds here too.
        created: 1160418092
        karma: 157316

  - name: a story and a comment share one resource and disagree on its keys
    source: https://hacker-news.firebaseio.com/v0/item/2921983.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/item/2921983.json
    expect:
      status: 200
      body:
        # A comment has parent and text; the story above has title, url, score
        # and descendants and no parent. Nothing but type says which arrived.
        type: comment
        parent: 2921506
      absent:
        - title
        - url
        - score
        - descendants

  - name: the text is HTML inside a JSON string
    source: https://hacker-news.firebaseio.com/v0/item/2921983.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/item/2921983.json
    expect:
      status: 200
      matches:
        # No plain-text companion, so anything rendering it strips tags and
        # anything not rendering it shows them.
        text: '^Aw shucks, guys \.\.\. you make me blush with your compliments\.<p>Tell you what'

  - name: kids is the replies and descendants is the total
    source: https://hacker-news.firebaseio.com/v0/item/1.json
    verified: "2026-08-28"
    fixture: news
    request:
      method: GET
      path: /v0/item/1.json
    expect:
      status: 200
      body:
        # Three under the story and four in kids, so neither is the length of
        # the other and the comment count is not the array.
        descendants: 3
        "kids[0]": 15
        "kids[3]": 82729
        # Ten digits.
        time: 1160418111
      absent:
        - kids[4]
