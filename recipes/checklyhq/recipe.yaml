# Checkly Recipe for Cauldron
#
# The check listing, read from the OpenAPI document Checkly serves without a
# credential at api.checklyhq.com/openapi.json, and struck live on 2026-09-13
# with no header, with a wrong bearer, on a path that does not exist, and with
# a method the path does not take.
#
# **The published cURL example does not send the header it is about.** From the
# security scheme's own description:
#
#   curl -H "Authorization: Bearer [apiKey]" "X-Checkly-Account: [accountId]"
#
# There is no `-H` on the second string, so curl reads it as the URL. Copied and
# pasted, that command tries to fetch a host called `X-Checkly-Account` and
# never sends the account header at all -- which is the header this API refuses
# requests for lacking.
#
# **And that description is HTML in a machine-readable field.** It carries an
# `<a href=... target="_blank">`, a `<b>`, a `<code>`, a `<br>`, and five
# `</br>` -- a closing tag for a void element, which is not HTML at all. A
# generated client prints the markup.
#
# **A refusal repeats itself in a fourth key.** Struck live with a wrong token:
#
#   {"statusCode":401,"error":"Unauthorized","message":"Bad token","attributes":{"error":"Bad token"}}
#
# `statusCode` restates the status line, `error` restates its reason phrase,
# and `attributes.error` restates `message`. Four keys, one fact, and the
# fourth is the framework's internal bag surfacing on the wire.
#
# **A wrong method is the same 404 as a wrong path.** Both answer
# `{"statusCode":404,"error":"Not Found","message":"Not Found"}` -- where
# `error` and `message` are the same two words again.
#
# The operation does declare a 400, a 401, a 403 and a 429 -- and no 404, which
# is the status both of those answers carry, so drift reports them as unbacked.
#
# **The listing is an `anyOf` of thirteen shapes with no discriminator.**
# Heartbeat, Playwright, ICMP, traceroute, gRPC, SSL, API, TCP, URL, DNS,
# browser, multi-step and generic -- and nothing in the schema tells a client
# which one it is holding. Each member carries its own `checkType` enum of one,
# so the discriminator exists thirteen times and is declared nowhere.
#
# **Thirty-nine properties and one of them is required.** On an API check, only
# `name` must be present: not `id`, not `frequency`, not `locations`.
#
# **Two of those thirty-nine are snake_case.** `created_at` and `updated_at`,
# among `doubleCheck`, `shouldFail`, `useGlobalAlertSettings`, `groupOrder`,
# `runtimeId`, `aiAutoRepairEnabled` and thirty-one more.
#
# **`frequency` is a closed list of minutes that includes zero.**
# `[0, 1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440]`, default 10 -- so
# "how often" has a legal value that is not a frequency.
#
# **Three booleans have three states each.** `member`, `pending` and
# `logicalId` are `nullable: true`, and their descriptions say what the null
# means: "Null when not managed by code." A field called `member` is documented
# as "True when the project owns this check" -- membership standing in for
# ownership -- and `pending` is "True when the binding is reserved by an import
# plan that has not been deployed yet", which is the deployment tool's internal
# state, on the public record.
#
# Also pinned: `bearerFormat` is `"Bearer"`, repeating the scheme name where the
# format belongs; the account identifier travels as an ordinary header
# parameter on every operation rather than as part of the security scheme; and
# `intent.goal` is a two-thousand-character prose field for "the user or system
# outcome this check protects", on a monitoring check.

recipe: checklyhq
capability: observability
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.checklyhq.com/reference
  spec: https://api.checklyhq.com/openapi.json
  spec_hash: 4cbd0cb2d8ee87b8b2442b255a68619e4d30521921993e67526bfecb87db186b
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y0000000000000000
  absent_error: missing_authentication
  rejected_error: bad_token
  malformed_error: bad_token
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    # The reason phrase, restating the status line.
    code_field: error
    status_field: statusCode

resources:
  check:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      # An enum of one, on each of the thirteen shapes, and declared as a
      # discriminator on none of them.
      checkType:
        type: string
      activated:
        type: boolean
      muted:
        type: boolean
      doubleCheck:
        type: boolean
      shouldFail:
        type: boolean
      # A closed list of minutes with a zero in it.
      frequency:
        type: integer
      locations:
        type: list
      tags:
        type: list
      useGlobalAlertSettings:
        type: boolean
      groupId:
      groupOrder:
      runtimeId:
      runParallel:
        type: boolean
      description:
        type: string
      aiAutoRepairEnabled:
        type: boolean
      # Two thousand characters for what a check is for.
      intent:
      # "Null when not managed by code", three times over.
      logicalId:
      member:
      pending:
      # And the two fields in the other convention.
      created_at:
        type: string
      updated_at:

routes:
  - method: GET
    path: /v1/checks
    resource: check
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: limit
      cursor_param: page
    filters:
      - param: checkType
        field: checkType

errors:
  missing_authentication:
    status: 401
    code: Unauthorized
    message: Missing authentication

  bad_token:
    status: 401
    code: Unauthorized
    message: Bad token
    fields:
      # The framework's internal bag, on the wire, restating the message.
      attributes.error: Bad token

  unknown_route:
    status: 404
    code: Not Found
    # The same two words as the code beside it.
    message: Not Found

  method_not_allowed:
    status: 404
    code: Not Found
    message: Not Found

fixtures:
  empty:
    check: []

  account:
    check:
      - id: 6f1e2d3c-4b5a-4968-8776-554433221100
        name: Checkout API
        checkType: API
        activated: true
        muted: false
        doubleCheck: true
        shouldFail: false
        frequency: 10
        locations:
          - eu-west-1
          - us-east-1
        tags:
          - tier-1
        useGlobalAlertSettings: true
        groupId: null
        groupOrder: null
        runtimeId: "2025.04"
        runParallel: false
        description: ""
        aiAutoRepairEnabled: false
        intent:
          goal: Customers can complete a purchase.
        # Managed by code, so the three fields say so.
        logicalId: checkout-api
        member: true
        pending: false
        created_at: "2026-03-19T10:12:44.000Z"
        updated_at: "2026-09-08T15:41:02.000Z"
      - id: 00112233-4455-4677-8899-aabbccddeeff
        name: Heartbeat
        checkType: HEARTBEAT
        activated: true
        muted: true
        doubleCheck: false
        shouldFail: false
        # The zero in the list of minutes.
        frequency: 0
        locations: null
        tags: []
        useGlobalAlertSettings: false
        groupId: 4211
        groupOrder: 2
        runtimeId: null
        runParallel: false
        description: Nightly batch reports in.
        aiAutoRepairEnabled: true
        intent: null
        # "Null when not managed by code", three times over.
        logicalId: null
        member: null
        pending: null
        created_at: "2026-06-01T00:00:00.000Z"
        updated_at: null

conformance:
  - name: a refusal repeats itself in a fourth key
    source: https://api.checklyhq.com/v1/checks
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # The status line, its reason phrase, the sentence, and the sentence
        # again inside the framework's internal bag.
        statusCode: 401
        error: Unauthorized
        message: Bad token
        attributes.error: Bad token

  - name: a missing credential drops the fourth key
    source: https://api.checklyhq.com/v1/checks
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers: {}
    expect:
      status: 401
      body:
        statusCode: 401
        error: Unauthorized
        message: Missing authentication
      absent:
        - attributes

  - name: an unrouted path says the same two words twice
    source: https://api.checklyhq.com/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        error: Not Found
        message: Not Found
        statusCode: 404

  - name: and a wrong method says them again
    source: https://api.checklyhq.com/v1/checks
    verified: "2026-09-13"
    fixture: account
    request:
      method: PUT
      path: /v1/checks
      headers: {}
    expect:
      status: 404
      body:
        error: Not Found
        message: Not Found

  - name: the discriminator exists thirteen times and is declared nowhere
    source: https://api.checklyhq.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
    expect:
      status: 200
      body:
        # Each member of the anyOf carries its own checkType enum of one, and
        # the anyOf has no discriminator.
        '[0].checkType': API
        '[1].checkType': HEARTBEAT
        '[0].name': Checkout API
        '[1].name': Heartbeat

  - name: a closed list of minutes with a zero in it
    source: https://api.checklyhq.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
    expect:
      status: 200
      body:
        # [0, 1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720, 1440], default 10.
        '[0].frequency': 10
        '[1].frequency': 0
        '[0].locations[0]': eu-west-1
        # nullable, on the field that says where a check runs from.
        '[1].locations': null
        '[0].tags[0]': tier-1
        '[1].tags': []

  - name: three fields whose null means not managed by code
    source: https://api.checklyhq.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
    expect:
      status: 200
      body:
        # "True when the project owns this check" -- membership standing in
        # for ownership -- and a deployment tool's internal state beside it.
        '[0].logicalId': checkout-api
        '[0].member': true
        '[0].pending': false
        '[1].logicalId': null
        '[1].member': null
        '[1].pending': null

  - name: two of thirty-nine names are in the other convention
    source: https://api.checklyhq.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
    expect:
      status: 200
      body:
        # created_at and updated_at, among doubleCheck, shouldFail,
        # useGlobalAlertSettings, groupOrder, runtimeId and thirty-one more.
        '[0].created_at': "2026-03-19T10:12:44.000Z"
        '[0].updated_at': "2026-09-08T15:41:02.000Z"
        '[1].updated_at': null
        '[0].doubleCheck': true
        '[0].shouldFail': false
        '[0].useGlobalAlertSettings': true
        '[1].groupId': 4211
        '[1].groupOrder': 2
        '[0].groupId': null
        '[0].runtimeId': "2025.04"
        '[1].runtimeId': null
        '[0].activated': true
        '[1].muted': true
        '[0].runParallel': false

  - name: a monitoring check carries two thousand characters of prose
    source: https://api.checklyhq.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
      query:
        checkType: API
        limit: "100"
        page: "1"
    expect:
      status: 200
      body:
        # "The user or system outcome this check protects."
        '[0].intent.goal': Customers can complete a purchase.
        '[0].aiAutoRepairEnabled': false
        '[0].description': ""

  - name: an account with no checks answers a bare empty array
    source: https://api.checklyhq.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/checks
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y0000000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
