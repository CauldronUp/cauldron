# Pylon Recipe for Cauldron
#
# The account listing, read from the OpenAPI document Pylon serves without a
# credential at api.usepylon.com/openapi.json, and struck live on 2026-09-13
# with no credential, with a wrong token, on a path that does not exist, and
# with a method the path does not take.
#
# **A refusal cites a section of an RFC.** Struck live, with no `Authorization`
# header:
#
#   {"errors":["Token must follow Bearer authorization scheme:
#     https://www.rfc-editor.org/rfc/rfc6750#section-2.1."],
#    "request_id":"4ba417ae-...","code":"invalid_authorization_header"}
#
# A URL with an anchor, pointing at RFC 6750 §2.1, inside the sentence a client
# prints -- said to a request that sent no header to be wrong about.
#
# **And two of the four failures end in an exclamation mark.** `Invalid API
# token!` and `Not a valid API URL!` do; `Method not allowed` and the RFC one do
# not. One API, one error array, two registers.
#
# **The messages are bare strings in an array.** `errors` is a list of
# sentences, not of objects, so there is nothing machine-readable inside it --
# and the thing a client would branch on sits outside, in `code`, beside a
# `request_id` that every response carries, failures and successes alike.
#
# **The document names the vendor's Go packages.** Every schema carries
# `x-go-name` and `x-go-package`: `Account` is
# `"x-go-package": "pylon/api/apiserver/apitypes"` and the response body is
# `"pylon/api/apiserver/endpoints"`. The published contract states the internal
# module layout and the Go identifier for each field.
#
# **Three fields hold the domain and two of them are documented identically.**
# `domain` is "The primary domain of the account." `primary_domain` is "The
# primary domain of the account." -- the same sentence, word for word, on two
# fields, with `domains` beside them holding the list.
#
# **Nothing on an account is required.** `Account` has no `required` array at
# all, so `id` is optional in the contract that describes it.
#
# **One resource, two names for its identifier.** Six paths take
# `{account_id}` -- highlights, relationships, notebook blocks -- and three take
# `{id}`, for the same account.
#
# **And the listing declares 200, 400, 403, 404 and 500.** Not the 401 every
# anonymous caller meets, and not the 405 a wrong method gets -- so drift
# reports both as unbacked.
#
# Also pinned: `/accounts/{account_id}/relationship` is a POST and
# `/accounts/{account_id}/relationships` is a GET, so the singular creates and
# the plural lists; and the document declares a US server and an EU one with no
# field on any record saying which answered.

recipe: pylon
capability: support
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://docs.usepylon.com/pylon-docs/developer/api
  spec: https://api.usepylon.com/openapi.json
  spec_hash: 9c17d7928e5a2a02fcf4af7882f2ecc4b890c8b23a1e09665ca3949bd9e7af63
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturet0k3n000000000000000000
  absent_error: invalid_authorization_header
  malformed_error: invalid_authorization_header
  rejected_error: invalid_api_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    cursor_field: pagination.cursor
    has_more_field: pagination.has_next_page
    fields:
      # On every response, successes included.
      request_id: 4ba417ae-08bf-48e1-90b9-79d87c730cff
  error:
    # Sentences, not objects: nothing machine-readable inside the array.
    style: string_list
    key: errors
    fields:
      request_id: 4ba417ae-08bf-48e1-90b9-79d87c730cff

resources:
  account:
    id:
      field: id
      style: opaque
      length: 24
    fields:
      name:
        type: string
      type:
        type: string
      # "The primary domain of the account."
      domain:
        type: string
      # "The primary domain of the account." -- the same sentence, again.
      primary_domain:
        type: string
      # And the list.
      domains:
        type: list
      channels:
        type: list
      custom_fields:
        type: map
      external_ids:
        type: list
      tags:
        type: list
      owner:
        type: map
      crm_settings:
        type: map
      is_disabled:
        type: boolean
      parent_account_id:
      subaccount_ids:
        type: list
      logo_url:
        type: string
      latest_customer_activity_time:
        type: string
      created_at:
        type: string
      updated_at:
        type: string

routes:
  - method: GET
    path: /accounts
    resource: account
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: cursor

errors:
  invalid_authorization_header:
    status: 401
    # A URL with an anchor, inside the sentence a client prints.
    message: "Token must follow Bearer authorization scheme: https://www.rfc-editor.org/rfc/rfc6750#section-2.1."
    fields:
      # The thing a client branches on, outside the array of sentences.
      code: invalid_authorization_header

  invalid_api_token:
    status: 401
    # With an exclamation mark.
    message: Invalid API token!
    fields:
      code: invalid_api_token

  unknown_route:
    status: 404
    # And another.
    message: Not a valid API URL!
    fields:
      code: not_found

  method_not_allowed:
    status: 405
    # And not this one.
    message: Method not allowed
    fields:
      code: method_not_allowed

fixtures:
  empty:
    account: []

  book:
    account:
      - id: acc_4f3e2d1c0b9a8877
        name: Example Industries
        type: customer
        # Two fields, one sentence of documentation.
        domain: example.com
        primary_domain: example.com
        domains:
          - example.com
          - example.co.uk
        channels:
          - id: chn_1a2b3c4d
            type: slack
        custom_fields:
          plan:
            value: enterprise
        external_ids:
          - external_id: SF-00041
            source: salesforce
        tags:
          - tier-1
        owner:
          id: usr_9f8e7d6c
          email: person@example.com
        crm_settings:
          is_synced: true
        is_disabled: false
        parent_account_id: null
        subaccount_ids:
          - acc_998877665544aabb
        logo_url: https://example.com/logo.png
        latest_customer_activity_time: "2026-09-12T18:03:07Z"
        created_at: "2026-02-11T08:44:12Z"
        updated_at: "2026-09-02T13:05:41Z"
      - id: acc_998877665544aabb
        name: Example Industries EU
        type: customer
        # The primary domain, and no list at all.
        domain: example.eu
        primary_domain: example.eu
        domains: []
        channels: []
        custom_fields: {}
        external_ids: []
        tags: []
        owner: {}
        crm_settings: {}
        is_disabled: true
        parent_account_id: acc_4f3e2d1c0b9a8877
        subaccount_ids: []
        logo_url: ""
        latest_customer_activity_time: ""
        created_at: "2026-06-19T09:00:00Z"
        updated_at: "2026-06-19T09:00:00Z"

conformance:
  - name: a refusal cites a section of an RFC
    source: https://api.usepylon.com/accounts
    verified: "2026-09-13"
    fixture: book
    request:
      method: GET
      path: /accounts
      headers: {}
    expect:
      status: 401
      body:
        # A URL with an anchor, inside a bare string in an array.
        errors:
          - "Token must follow Bearer authorization scheme: https://www.rfc-editor.org/rfc/rfc6750#section-2.1."
        # The machine-readable part, outside the array.
        code: invalid_authorization_header
      matches:
        request_id: '\A[0-9a-f-]{36}\z'

  - name: a wrong token is refused with an exclamation mark
    source: https://api.usepylon.com/accounts
    verified: "2026-09-13"
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        errors:
          - Invalid API token!
        code: invalid_api_token

  - name: an unrouted path gets another one
    source: https://api.usepylon.com/cauldron-nope
    verified: "2026-09-13"
    fixture: book
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        errors:
          - Not a valid API URL!
        code: not_found

  - name: and a wrong method gets none
    source: https://api.usepylon.com/accounts
    verified: "2026-09-13"
    fixture: book
    request:
      method: PUT
      path: /accounts
      headers: {}
    expect:
      # A real 405, where most of this collection's providers answer 404.
      status: 405
      body:
        errors:
          - Method not allowed
        code: method_not_allowed

  - name: three fields hold the domain and two are documented identically
    source: https://api.usepylon.com/openapi.json
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
    expect:
      status: 200
      body:
        # "The primary domain of the account." on both of these.
        'data[0].domain': example.com
        'data[0].primary_domain': example.com
        # And the list beside them.
        'data[0].domains[0]': example.com
        'data[0].domains[1]': example.co.uk
        'data[1].domains': []

  - name: an account carries its parents and its children
    source: https://api.usepylon.com/openapi.json
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
    expect:
      status: 200
      body:
        'data[0].parent_account_id': null
        'data[0].subaccount_ids[0]': acc_998877665544aabb
        'data[1].parent_account_id': acc_4f3e2d1c0b9a8877
        'data[1].subaccount_ids': []
        'data[0].is_disabled': false
        'data[1].is_disabled': true

  - name: the record carries external systems and custom fields
    source: https://api.usepylon.com/openapi.json
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
    expect:
      status: 200
      body:
        'data[0].custom_fields.plan.value': enterprise
        'data[0].external_ids[0].external_id': SF-00041
        'data[0].external_ids[0].source': salesforce
        'data[0].channels[0].type': slack
        'data[0].tags[0]': tier-1
        'data[0].owner.email': person@example.com
        'data[0].crm_settings.is_synced': true
        'data[1].custom_fields': {}
        'data[1].owner': {}
        'data[0].name': Example Industries
        'data[0].type': customer
        'data[0].logo_url': https://example.com/logo.png
        'data[1].logo_url': ""
        'data[0].latest_customer_activity_time': "2026-09-12T18:03:07Z"
        'data[1].latest_customer_activity_time': ""
        'data[0].created_at': "2026-02-11T08:44:12Z"
        'data[0].updated_at': "2026-09-02T13:05:41Z"

  - name: every response carries a request id including the successful ones
    source: https://api.usepylon.com/openapi.json
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        request_id: 4ba417ae-08bf-48e1-90b9-79d87c730cff
        'pagination.has_next_page': true
        'data[0].id': acc_4f3e2d1c0b9a8877
      matches:
        'pagination.cursor': '\A\S+\z'

  - name: following the cursor reaches the last page
    source: https://api.usepylon.com/openapi.json
    fixture: book
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
      query:
        limit: "1"
        cursor: acc_4f3e2d1c0b9a8877
    expect:
      status: 200
      body:
        'data[0].id': acc_998877665544aabb
        'pagination.has_next_page': false

  - name: an empty book still says whether there is more
    source: https://api.usepylon.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0nf1xturet0k3n000000000000000000"
    expect:
      status: 200
      body:
        data: []
        'pagination.has_next_page': false
        request_id: 4ba417ae-08bf-48e1-90b9-79d87c730cff
