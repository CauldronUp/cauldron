# PayU Recipe for Cauldron
#
# Written against PayU's API reference at developers.payu.com and struck live
# against secure.payu.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **Four fields for one failure, and three of them say the same thing.** Struck
# live, both ways, byte-identical:
#
#   GET /api/v2_1/orders                     (no credential)
#   401 {"status":{"statusCode":"UNAUTHORIZED",
#                  "code":"401",
#                  "codeLiteral":"INVALID_OR_MISSING_ACCESS_TOKEN",
#                  "statusDesc":"Incorrect authentication"}}
#
# `statusCode` is a word. `code` is the HTTP status as a *string*. `codeLiteral`
# is a screaming-snake constant. `statusDesc` is prose. Three vocabularies for
# one fact, plus a restatement of the status line, inside an object called
# `status` whose `statusCode` is not a code and whose `code` is not a status.
#
# The one that carries information no other field has is `codeLiteral`:
# `INVALID_OR_MISSING_ACCESS_TOKEN` names both cases, which is the same honest
# ambiguity [pulumi](../pulumi) writes as a sentence. Everything else in the
# object is derivable from the status line.
#
# **A missing credential and a wrong one are identical.** So the field naming
# both cases is the accurate one, and there is nothing anywhere that separates
# them.
#
# **An unknown path is a 302.** Struck live: no body, no JSON, a redirect --
# to PayU's merchant panel login. So a client following redirects by default,
# which most do, receives an HTML sign-in page with a 200 on it and has to
# work out that its URL was wrong from the content type.
#
# That is the worst not-found in this collection so far. [openphone](../openphone)
# and [triggerdev](../triggerdev) answer HTML with a 404, which at least keeps
# the status honest. Here the status a client finally sees is a success.
#
# **The envelope has no data key on a failure.** `status` is the only top-level
# field, and on success it is one of several -- so the same key means "how it
# went" on both paths, which is the good half and is why the emulator serves it
# on successes too.

recipe: payu
capability: payments
version: 0.1.0

upstream:
  api: v2_1
  docs: https://developers.payu.com/europe/docs/get-started/
  # No spec: PayU publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-payu-f1xture-0000-000000000000
  # One response for both, struck live -- and the one field that carries
  # information says so.
  absent_error: invalid_or_missing_access_token
  rejected_error: invalid_or_missing_access_token

responses:
  list:
    style: wrapped
    key: orders
    fields:
      # The same key that carries a failure carries the success, which is the
      # good half of this envelope: one field to check on both paths.
      status:
        statusCode: SUCCESS
  error:
    style: nested
    key: status
    message_field: statusDesc
    # The screaming-snake constant, which is the only field here that carries
    # anything the status line does not.
    code_field: codeLiteral
    code_type: string
    # A word, in the field named for a code.
    type_field: statusCode

resources:
  order:
    id:
      field: orderId
      style: opaque
    fields:
      extOrderId:
        type: string
      orderCreateDate:
        type: datetime
      currencyCode:
        type: string
        default: PLN
      totalAmount:
        type: string
      status:
        type: string
        default: NEW

routes:
  - method: GET
    path: /api/v2_1/orders
    resource: order
    operation: list
    pagination:
      style: none

errors:
  invalid_or_missing_access_token:
    status: 401
    code: INVALID_OR_MISSING_ACCESS_TOKEN
    type: UNAUTHORIZED
    message: "Incorrect authentication"
    fields:
      # The HTTP status as a string, inside an object called status whose
      # statusCode is a word. Four fields, three facts, one of them new.
      status.code: "401"

fixtures:
  empty:
    order: []

  merchant:
    order:
      - orderId: WZHF5FFDRJ140731GUEST000P01
        extOrderId: cauldron-order-0001
        orderCreateDate: "2026-09-03T10:15:02.000+02:00"
        currencyCode: PLN
        totalAmount: "21000"
        status: COMPLETED
      - orderId: XKQ2M8ZTNP240902GUEST000P01
        extOrderId: cauldron-order-0002
        orderCreateDate: "2026-09-05T16:48:31.000+02:00"
        currencyCode: PLN
        totalAmount: "4999"
        # Waiting for a bank confirmation that may never come. NEW, PENDING
        # and WAITING_FOR_CONFIRMATION are three different not-yet states and
        # only one of them means somebody has to act.
        status: WAITING_FOR_CONFIRMATION

conformance:
  - name: one failure is described four times
    source: https://secure.payu.com/api/v2_1/orders
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers: {}
    expect:
      status: 401
      body:
        # A word, a status-as-string, a constant and a sentence. Three
        # vocabularies for one fact, in an object whose statusCode is not a
        # code and whose code is not a status.
        'status.statusCode': UNAUTHORIZED
        'status.code': "401"
        'status.codeLiteral': INVALID_OR_MISSING_ACCESS_TOKEN
        'status.statusDesc': "Incorrect authentication"

  - name: the only informative field names both failures
    source: https://secure.payu.com/api/v2_1/orders
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # INVALID_OR_MISSING -- the same honest ambiguity Pulumi writes as a
        # sentence, here as a constant. Everything else in the object is
        # derivable from the status line.
        'status.codeLiteral': INVALID_OR_MISSING_ACCESS_TOKEN

  - name: a wrong credential is byte-identical to none
    source: https://secure.payu.com/api/v2_1/orders
    verified: "2026-09-07"
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        'status.statusCode': UNAUTHORIZED
        'status.statusDesc': "Incorrect authentication"

  - name: the status key carries the success too
    source: https://developers.payu.com/europe/docs/
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # The good half: one field to check on both paths, rather than a
        # success shape and a failure shape that share nothing.
        'status.statusCode': SUCCESS
        'orders[0].orderId': WZHF5FFDRJ140731GUEST000P01

  - name: money is minor units in a string
    source: https://developers.payu.com/europe/docs/
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # "21000" is 210 zloty. A string, so it is exact; minor units, so it
        # is a hundred times what a person would say; and the only thing that
        # says which is the currency code beside it.
        'orders[0].totalAmount': "21000"
        'orders[0].currencyCode': PLN

  - name: there are three ways of not being finished
    source: https://developers.payu.com/europe/docs/
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # NEW, PENDING and WAITING_FOR_CONFIRMATION are all "not yet", and
        # only the last means a person has to act. A client testing status
        # !== COMPLETED cannot tell which of the three it has.
        'orders[1].status': WAITING_FOR_CONFIRMATION
        'orders[0].status': COMPLETED

  - name: an order carries the merchant's own reference beside PayU's
    source: https://developers.payu.com/europe/docs/
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # Two identifiers on one record, and only one of them is unique on
        # PayU's side -- so a client keying on extOrderId is keying on a value
        # it chose itself and PayU does not enforce.
        'orders[1].orderId': XKQ2M8ZTNP240902GUEST000P01
        'orders[1].extOrderId': cauldron-order-0002

  - name: dates carry a fixed offset rather than UTC
    source: https://developers.payu.com/europe/docs/
    fixture: merchant
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # +02:00, Warsaw's summer offset, so the same instant is written
        # differently in winter and a client sorting strings gets the order
        # wrong across the change.
        'orders[0].orderCreateDate': "2026-09-03T10:15:02.000+02:00"

  - name: a merchant with no orders answers an empty array
    source: https://developers.payu.com/europe/docs/
    fixture: empty
    request:
      method: GET
      path: /api/v2_1/orders
      headers:
        Authorization: "Bearer cauldr0n-payu-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        orders: []
