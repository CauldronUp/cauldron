# Gandi Recipe for Cauldron
#
# The domain listing, read from the `go-gandi` client's published wire types,
# and struck live against api.gandi.net on 2026-09-13 with no header, with a
# wrong bearer, and on a path that does not exist.
#
# **Three failures, three formats, one hostname.** Struck live:
#
#   (no header)     401  {"message":"You must provide an access token or an API Key. See https://api.gandi.net/docs/authentication/"}
#   Bearer notreal  403  {"object":"HTTPForbidden","cause":"Forbidden","code":403,"message":"Access was denied to this resource."}
#   /v5/cauldron-nope  404  <html>...<pre>Cannot GET /v5/cauldron-nope</pre>...
#
# A one-key JSON object, a four-key JSON object, and an HTML page. The status
# changes too: a credential that is missing is 401 and one that is wrong is 403,
# so the two halves of "you may not do this" are on opposite sides of the
# authentication boundary.
#
# **And the four-key one names a Python class.** `"object": "HTTPForbidden"` is
# the exception type from the framework that raised it, serialised into the
# response. `"cause": "Forbidden"` beside it is the HTTP reason phrase, and
# `"code": 403` is the status a third time. Four keys, three of which restate
# the status line.
#
# **The HTML one is a different stack entirely.** `Cannot GET /v5/...` inside a
# minimal document is Express's default handler -- so one host answers with a
# Python exception on one path and a Node router's error page on another.
#
# **`autorenew` is a boolean or an object, depending on the endpoint.** In the
# listing it is `*bool`; on the detail record it is an object of
# `{href, dates, duration, enabled, org_id}`. One key, two JSON types, and which
# one arrives is decided by whether you asked for one domain or for all of them.
#
# **So is the nameserver field, and it changes number too.** The listing carries
# `nameserver`, an object; the detail carries `nameservers`, an array of
# strings. Singular and plural, object and array, for the same thing.
#
# **Three fields say who owns the domain.** `owner`, `domain_owner` and
# `orga_owner` sit beside each other on the listing record, with `sharing_id`
# making four, and the detail record replaces all of them with a
# `sharing_space` object.
#
# **The domain name is on the record twice.** `fqdn` and `fqdn_unicode` -- the
# punycode form and the readable one, and for an ASCII domain they are the same
# string.
#
# **The lifecycle is eleven timestamps in a flat bag.** `dates` carries
# `registry_created_at`, `updated_at`, `authinfo_expires_at`, `created_at`,
# `deletes_at`, `hold_begins_at`, `hold_ends_at`, `pending_delete_ends_at`,
# `registry_ends_at`, `renew_begins_at` and `renew_ends_at`, nine of them
# optional -- so which of them is present is the actual state machine.
#
# **And `status` is a list.** A domain is in several states at once, and nothing
# orders them.

recipe: gandi
capability: infrastructure
version: 0.1.0

upstream:
  api: v5
  docs: https://api.gandi.net/docs/domains/
  # No spec: api.gandi.net/v5/domain/openapi.json is behind the credential
  # check, and no machine-readable description is served at any address this
  # Recipe could reach anonymously. The record shape below is the go-gandi
  # client's own wire types.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y00000000000000
  # 401 for absent...
  absent_error: token_required
  # ...and 403 for wrong, in a different envelope.
  rejected_error: access_denied
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  domain:
    id:
      field: id
      style: uuid
    fields:
      # The punycode form...
      fqdn:
        type: string
      # ...and the readable one, which for ASCII is the same string.
      fqdn_unicode:
        type: string
      href:
        type: string
      tld:
        type: string
      # Several at once, in no order.
      status:
        type: list
      dates:
        type: map
      # A boolean here. An object on the record next door.
      autorenew:
      # Singular, and an object.
      nameserver:
        type: map
      owner:
        type: string
      domain_owner:
        type: string
      orga_owner:
        type: string
      sharing_id:
        type: string
      tags:
        type: list

routes:
  - method: GET
    path: /v5/domain/domains
    resource: domain
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: per_page
      cursor_param: page

errors:
  token_required:
    status: 401
    # One key, and a documentation URL inside it.
    message: You must provide an access token or an API Key. See https://api.gandi.net/docs/authentication/

  access_denied:
    # Forbidden, for a credential that was merely wrong.
    status: 403
    message: Access was denied to this resource.
    fields:
      # The framework's exception class, in the response.
      object: HTTPForbidden
      # The reason phrase...
      cause: Forbidden
      # ...and the status, a third time.
      code: 403

  unknown_route:
    status: 404
    # Not JSON at all: a different stack answers this one.
    style: text
    message: Cannot GET {detail}
    headers:
      Content-Type: text/html; charset=utf-8

fixtures:
  empty:
    domain: []

  portfolio:
    domain:
      - id: 9f8a7b6c-5d4e-4f3a-2b1c-0d9e8f7a6b5c
        fqdn: cauldron-example.com
        # The same string, because the name is ASCII.
        fqdn_unicode: cauldron-example.com
        href: https://api.gandi.net/v5/domain/domains/cauldron-example.com
        tld: com
        # Several at once.
        status:
          - clientTransferProhibited
          - serverTransferProhibited
        dates:
          registry_created_at: "2019-03-04T09:12:00Z"
          updated_at: "2026-03-05T02:00:00Z"
          created_at: "2019-03-04T09:12:03Z"
          registry_ends_at: "2027-03-04T09:12:00Z"
          renew_begins_at: "2020-01-01T00:00:00Z"
          renew_ends_at: "2027-04-08T09:12:00Z"
          authinfo_expires_at: "2027-01-04T09:12:00Z"
        # A boolean, in the listing.
        autorenew: true
        # Singular, and an object.
        nameserver:
          current: livedns
        owner: AB1234-GANDI
        domain_owner: A. Person
        orga_owner: AB1234-GANDI
        sharing_id: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
        tags:
          - production
      - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        # A punycode name...
        fqdn: xn--caf-dma.example
        # ...and the readable form of it, which is not the same string.
        fqdn_unicode: café.example
        href: https://api.gandi.net/v5/domain/domains/xn--caf-dma.example
        tld: example
        status: []
        dates:
          registry_created_at: "2024-11-19T14:40:00Z"
          updated_at: "2026-08-01T00:00:00Z"
          created_at: "2024-11-19T14:40:11Z"
          registry_ends_at: "2026-11-19T14:40:00Z"
          # The end of the lifecycle, present only when it applies.
          deletes_at: "2027-01-03T14:40:00Z"
          hold_begins_at: "2026-11-19T14:40:00Z"
          hold_ends_at: "2026-12-19T14:40:00Z"
          pending_delete_ends_at: "2027-02-02T14:40:00Z"
        autorenew: false
        nameserver:
          current: other
        owner: CD5678-GANDI
        domain_owner: Another Person
        orga_owner: AB1234-GANDI
        sharing_id: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
        tags: []

conformance:
  - name: a missing credential is one key and a wrong one is four
    source: https://api.gandi.net/v5/domain/domains
    verified: "2026-09-13"
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers: {}
    expect:
      status: 401
      body:
        # A single key, with a documentation URL inside the sentence.
        message: You must provide an access token or an API Key. See https://api.gandi.net/docs/authentication/
      absent:
        - object
        - cause
        - code

  - name: a wrong credential names the framework's exception class
    source: https://api.gandi.net/v5/domain/domains
    verified: "2026-09-13"
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      # Forbidden, where the missing credential was Unauthorized.
      status: 403
      body:
        # A Python exception type, serialised into the body.
        object: HTTPForbidden
        # The reason phrase, and the status again.
        cause: Forbidden
        code: 403
        message: Access was denied to this resource.

  - name: an unrouted path is answered by a different stack in HTML
    source: https://api.gandi.net/v5/cauldron-nope
    verified: "2026-09-13"
    fixture: portfolio
    request:
      method: GET
      path: /v5/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # Not JSON: Express's own error page.
        Content-Type: text/html; charset=utf-8
      body_matches: '\ACannot GET /v5/cauldron-nope\s*\z'

  - name: autorenew is a boolean here and an object on the detail record
    source: https://github.com/go-gandi/go-gandi
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # *bool in ListResponse; *AutoRenew, an object of five fields, in
        # Details.
        '[0].autorenew': true
        '[1].autorenew': false
        # And singular-and-an-object here, plural-and-an-array there.
        '[0].nameserver.current': livedns
        '[1].nameserver.current': other

  - name: three fields say who owns the domain
    source: https://github.com/go-gandi/go-gandi
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        '[0].owner': AB1234-GANDI
        '[0].domain_owner': A. Person
        '[0].orga_owner': AB1234-GANDI
        '[0].sharing_id': 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
        '[1].owner': CD5678-GANDI
        '[1].domain_owner': Another Person
        '[1].orga_owner': AB1234-GANDI

  - name: the domain name is on the record twice
    source: https://github.com/go-gandi/go-gandi
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # The same string for an ASCII name...
        '[0].fqdn': cauldron-example.com
        '[0].fqdn_unicode': cauldron-example.com
        # ...and two different ones otherwise.
        '[1].fqdn': xn--caf-dma.example
        '[1].fqdn_unicode': café.example
        '[0].tld': com
        '[0].href': https://api.gandi.net/v5/domain/domains/cauldron-example.com

  - name: the lifecycle is which of eleven timestamps are present
    source: https://github.com/go-gandi/go-gandi
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # Nine of the eleven are optional, so presence is the state machine.
        '[0].dates.registry_created_at': "2019-03-04T09:12:00Z"
        '[0].dates.renew_begins_at': "2020-01-01T00:00:00Z"
        '[0].dates.renew_ends_at': "2027-04-08T09:12:00Z"
        '[0].dates.authinfo_expires_at': "2027-01-04T09:12:00Z"
        '[1].dates.deletes_at': "2027-01-03T14:40:00Z"
        '[1].dates.hold_begins_at': "2026-11-19T14:40:00Z"
        '[1].dates.hold_ends_at': "2026-12-19T14:40:00Z"
        '[1].dates.pending_delete_ends_at': "2027-02-02T14:40:00Z"
        '[1].dates.registry_ends_at': "2026-11-19T14:40:00Z"
        '[0].dates.updated_at': "2026-03-05T02:00:00Z"
        '[0].dates.created_at': "2019-03-04T09:12:03Z"

  - name: status is a list so a domain is in several states at once
    source: https://github.com/go-gandi/go-gandi
    fixture: portfolio
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
      query:
        per_page: "1"
        page: "1"
    expect:
      status: 200
      body:
        # Two at once, in no stated order.
        '[0].status[0]': clientTransferProhibited
        '[0].status[1]': serverTransferProhibited
        '[0].tags[0]': production

  - name: an account with no domains answers a bare empty array
    source: https://github.com/go-gandi/go-gandi
    fixture: empty
    request:
      method: GET
      path: /v5/domain/domains
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
