# Apollo.io Recipe for Cauldron
#
# Apollo answers "no credential" and "wrong credential" with two different
# HTTP status codes, not just two different sentences -- the sharpest version
# of the absent/rejected split this collection keeps finding, and the one
# member of this trio where the two verdicts disagree about the number
# before the colon rather than only the words after it.
#
# **Absent is 422; wrong is 401, and both were struck live against two
# routes.** No x-api-key header at all against POST /api/v1/people/match and
# GET /api/v1/organizations/enrich, on 2026-09-02, both answered
# 422 Unprocessable Entity, {"error":"Api key required"}, 28 bytes,
# byte-identical between the two routes. A syntactically ordinary but wrong
# header -- "x-api-key: junk12345" -- answered 401 Unauthorized instead,
# {"error":"Invalid API key. See https://docs.apollo.io/reference/
# authentication for how to authenticate."}, also identical across both
# routes. An empty header value ("x-api-key: ") answered the same 422 the
# missing header does. Compare hunterio/recipe.yaml and clearbit/recipe.yaml,
# written alongside this one: both of those providers also draw the
# absent/wrong line somewhere, but only ever with two different SENTENCES on
# the same status code. Apollo is the one member of this trio -- and the
# first in this collection's auth.go notes -- where absent and wrong are two
# different numbers.
#
# **The fourth credential verdict this collection has been circling is
# real, documented, and this Recipe can establish its shape without ever
# holding the key that would trigger it.** Apollo's own OpenAPI description,
# embedded in https://docs.apollo.io/reference/organization-enrichment
# (fetched 2026-09-02), documents a third failure beside 401 and 422 for
# this exact route: 403, {"error":"This API key is not authorized to access
# api/v1/organizations/enrich. Request an API key from your administrator
# that includes this endpoint in its configured scope.","error_code":
# "API_INACCESSIBLE"}. That is Apollo's own answer to "a valid key on the
# wrong plan": a distinct status, a distinct error_code no other failure in
# this Recipe carries, and a sentence naming the specific endpoint rather
# than the credential. It could not be observed live -- reaching it needs a
# real, scope-restricted key, which this Recipe is not permitted to obtain
# -- but it did not need to be: Apollo wrote the request and response down
# itself, as a named example in its own machine-readable description, and
# this Recipe quotes it rather than guesses at it. It is declared as an
# ordinary error and demonstrated by fault injection rather than wired into
# the credential check, because Cauldron's own Verdict enum has exactly
# three failing members -- Absent, Malformed, Rejected -- and none of them
# means "the credential is fine and the account is not," so there is no
# fourth slot this Recipe could set a field on even if it held a key to
# verify it with.
#
# **A missing key and a missing parameter share a status code and nothing
# else.** Organization Enrichment's own OpenAPI examples document a second,
# unrelated 422: {"error":"Required parameter 'domain' missing"}, for a
# request that has a working key and forgot the query string. That is a
# different failure from the credential one above -- reachable only with a
# key this Recipe does not hold, so it is declared and armed separately
# rather than folded into api_key_required, which would claim Apollo cannot
# tell "you sent nothing" from "you sent no domain."
#
# **Routing order matches this collection's hunterio/recipe.yaml almost
# exactly, down to the same architectural shape from an unrelated
# codebase.** A path Apollo has no route for at all -- GET /api/v1/
# nosuchroute -- answered 404 text/html, identically whether no credential
# or a junk one was sent: struck live both ways, both 404, both HTML,
# neither ever reaching the 422/401 pair above. GET on the POST-only
# /api/v1/people/match -- the wrong method for that specific path, but one
# Apollo's app answers requests on generally -- reached the credential check
# anyway, 422 absent / 401 wrong, exactly as POST does. DELETE on that same
# path -- a verb this API never uses anywhere -- answered the identical
# unrouted 404 HTML the wholly bogus path gets, credential never examined.
# So: which verbs Apollo's router recognises ANYWHERE decides whether the
# credential is ever checked, not which verb this specific path wants,
# and not whether the path exists -- the same rule hunterio/recipe.yaml
# states for an unrelated provider, reached independently here. Unlike
# Hunter, whose wrong-verb 404 is a distinct JSON body from its
# wholly-unrouted one, Apollo's two 404s are the same HTML page; this Recipe
# does not model either, the same call this collection's Together AI Recipe
# already makes for its own marketing-site catch-all. auth.after_routing is
# left at its default because that is what every route this Recipe declares
# actually receives.
#
# **Neither route this Recipe models says how many credits it charged --
# but a sibling of one of them does, in writing.** People Enrichment's own
# description states the pricing rule in prose: "Credits are charged only
# if credit-consuming data is found: 1 credit for demographics or email,
# plus 8 credits if a mobile phone is returned. If no credit-consuming data
# is found, the request consumes 0 credits" -- a formula, not a number the
# response carries. Organization Enrichment's is flatter still: "1 credit
# per organization," unconditionally. Neither response body has a field for
# it. The Bulk People Enrichment endpoint (POST /api/v1/people/bulk_match),
# not modelled here, is the one place in this trio -- Clearbit, Hunter,
# Apollo alike -- that actually answers the question: its own documented
# response carries credits_consumed, described in Apollo's own schema as
# "The total credits this request consumed... can be a fraction rather than
# a whole number, depending on your plan's credit pricing, so parse it as a
# decimal rather than an integer," and explicitly absent when waterfall
# enrichment is requested instead. This Recipe does not model bulk_match --
# see the gaps below -- but the finding stands on its own: whether a credit
# count is disclosed is not a property of the vendor, it is a property of
# the specific endpoint, even within one vendor's own API.
#
# **No-match is documented in exactly one sentence, and the sentence names
# no shape.** People Enrichment's own page: "If you only provide general
# information, such as a name without a domain or email address, you might
# receive a 200 response, but the response indicates that no records have
# been enriched." Nothing anywhere on that page or Organization Enrichment's
# says whether "person" is then null, an empty object, or omitted, or
# whether any other field changes. This Recipe declares no route for that
# case rather than pick one of three shapes the documentation never commits
# to -- compare hunterio/recipe.yaml's Email Finder, which has exactly the
# same gap in the exact same words ("if no email can be found, no credit is
# charged," with no shape given either).
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of roughly ninety documented organization fields and forty documented
#     person fields, this Recipe declares about fourteen and twelve.
#     employment_history, funding_events, current_technologies, org chart
#     fields, and every contact/phone-reveal field are entirely absent.
#   - Bulk People Enrichment, phone-number waterfall (which replies
#     asynchronously to a caller-supplied webhook rather than in the HTTP
#     response) and every write are absent. Every route here is a GET or a
#     single-record POST.
#   - OAuth 2.0 bearer-token authentication is documented as a second,
#     partner-only scheme (security: apiKey or bearerAuth) beside the
#     x-api-key header this Recipe models; it was never probed and is not
#     declared.
#
# Every case below not carrying a verified date was read from
# https://docs.apollo.io/reference/people-enrichment and
# https://docs.apollo.io/reference/organization-enrichment, both fetched
# 2026-09-02, not observed against a real account -- this Recipe was written
# with no API key and created no account. Keys below are fixtures, not
# secrets.

recipe: apolloio
capability: crm
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.apollo.io/reference/people-enrichment

auth:
  scheme: header
  header: x-api-key
  keys:
    - cauldron0000000000000000000000
  # Two different status codes, not just two sentences -- see the header.
  # Neither is Cauldron's built-in 401 default, so both need naming.
  absent_error: api_key_required
  rejected_error: invalid_api_key

responses:
  resource:
    style: wrapped
    key: person
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  person:
    id:
      style: hex
      length: 24
    fields:
      first_name:
        type: string
        null_when_unset: true
      last_name:
        type: string
        null_when_unset: true
      name:
        type: string
      linkedin_url:
        type: string
        null_when_unset: true
      title:
        type: string
        null_when_unset: true
      headline:
        type: string
        null_when_unset: true
      email:
        type: string
        null_when_unset: true
      # verified/guessed/unavailable -- Apollo's own vocabulary for how
      # confident it is in the email address, sitting beside a second,
      # separate confidence field for the case that is a guess rather than
      # a verified address.
      email_status:
        type: string
        null_when_unset: true
      # Only meaningful when email_status is not "verified" -- Apollo's own
      # schema shows it null on a verified record, the same shape Hunter's
      # score/verification.status pair uses to separate a confidence number
      # from a confirmation. See hunterio/recipe.yaml for that provider's
      # version of the same distinction.
      extrapolated_email_confidence:
        type: string
        null_when_unset: true
      photo_url:
        type: string
        null_when_unset: true
      organization_id:
        type: string
        null_when_unset: true
      employment_history:
        type: list

  organization:
    id:
      style: hex
      length: 24
    fields:
      name:
        type: string
      website_url:
        type: string
        null_when_unset: true
      linkedin_url:
        type: string
        null_when_unset: true
      twitter_url:
        type: string
        null_when_unset: true
      logo_url:
        type: string
        null_when_unset: true
      primary_domain:
        type: string
      industry:
        type: string
        null_when_unset: true
      estimated_num_employees:
        type: integer
        null_when_unset: true
      founded_year:
        type: integer
        null_when_unset: true
      city:
        type: string
        null_when_unset: true
      state:
        type: string
        null_when_unset: true
      country:
        type: string
        null_when_unset: true
      short_description:
        type: string
        null_when_unset: true
      annual_revenue:
        type: integer
        null_when_unset: true
      annual_revenue_printed:
        type: string
        null_when_unset: true

routes:
  - method: POST
    path: /api/v1/people/match
    resource: person
    operation: get
    id_from: body:email
    lookup_by: email
    headers:
      Content-Type: application/json; charset=utf-8

  - method: GET
    path: /api/v1/organizations/enrich
    resource: organization
    operation: get
    id_from: query:domain
    lookup_by: primary_domain
    envelope:
      key: organization
    headers:
      Content-Type: application/json; charset=utf-8

errors:
  # Struck live, identical on both routes: no x-api-key header at all, and
  # separately an empty one.
  api_key_required:
    status: 422
    message: Api key required
    headers:
      Content-Type: application/json; charset=utf-8

  # Struck live, identical on both routes: a syntactically ordinary
  # x-api-key value this Recipe does not hold.
  invalid_api_key:
    status: 401
    message: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.
    headers:
      Content-Type: application/json; charset=utf-8

  # Documented, never triggered -- see the header for why this is declared
  # and demonstrated by fault injection rather than wired into auth.*: a
  # valid credential locked out of this specific endpoint's configured
  # scope is not one of Cauldron's three credential verdicts. error_code
  # rides beside error, which the Recipe-wide envelope's code_field: "-"
  # does not carry for the other two failures above -- overridden here
  # because this is the one failure in this Recipe that has one.
  insufficient_scope:
    status: 403
    message: This API key is not authorized to access api/v1/organizations/enrich. Request an API key from your administrator that includes this endpoint in its configured scope.
    code_field: error_code
    code: API_INACCESSIBLE

  # Documented, never triggered: a valid key, no domain in the query string.
  # Same status as api_key_required and a wholly different sentence -- see
  # the header.
  missing_domain:
    status: 422
    message: Required parameter 'domain' missing

  # Documented, never triggered. message_field overridden per-error: unlike
  # every other failure in this Recipe, Apollo's own 429 example nests the
  # sentence under "message" rather than "error".
  rate_limit:
    status: 429
    message_field: message
    message: The maximum number of api calls allowed for api/v1/organizations/enrich is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.

fixtures:
  empty: {}

  # Tim Zheng (Apollo's own co-founder and CEO) and Apollo.io's own company
  # record are Apollo's published worked examples, embedded in its own
  # OpenAPI description at the two doc URLs named in the header -- not a
  # real lookup this Recipe performed.
  worked-examples:
    person:
      - id: 64a7ff0cc4dfae00013df1a5
        first_name: Tim
        last_name: Zheng
        name: Tim Zheng
        linkedin_url: http://www.linkedin.com/in/tim-zheng-677ba010
        title: Founder & CEO
        headline: Founder & CEO at Apollo
        email: tim@apollo.io
        email_status: verified
        extrapolated_email_confidence: null
        photo_url: https://static.licdn.com/aero-v1/sc/h/uzfsocwl05iywf1hd7ba3915x
        organization_id: 5e66b6381e05b4008c8331b8
        employment_history:
          - id: 66d7af8c200cad0001404c1f
            organization_id: 5e66b6381e05b4008c8331b8
            organization_name: Apollo
            title: Founder & CEO
            current: true
            start_date: "2016-01-01"

    organization:
      - id: 5e66b6381e05b4008c8331b8
        name: Apollo.io
        website_url: http://www.apollo.io
        linkedin_url: http://www.linkedin.com/company/apolloio
        twitter_url: https://twitter.com/meetapollo/
        logo_url: https://zenprospect-production.s3.amazonaws.com/uploads/pictures/79049be00ff8e398b5935de8/picture
        primary_domain: apollo.io
        industry: information technology & services
        estimated_num_employees: 1600
        founded_year: 2015
        city: San Francisco
        state: California
        country: United States
        short_description: "Apollo.io combines a buyer database..."
        annual_revenue: 100000000
        annual_revenue_printed: 100M

# Every case below carries source. A verified date means this Recipe called
# api.apollo.io with exactly the request shown and recorded exactly what
# came back; its absence means the case was read from Apollo's own published
# documentation, cited above, and never called.
conformance:
  - name: no credential at all is a 422, not a 401
    source: https://api.apollo.io/api/v1/organizations/enrich
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/organizations/enrich?domain=apollo.io
    expect:
      status: 422
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: Api key required
      absent:
        - error_code
        - errors

  - name: a wrong credential is the other status, on the other route
    source: https://api.apollo.io/api/v1/people/match
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: POST
      path: /api/v1/people/match
      headers:
        x-api-key: junk12345
        Content-Type: application/json
      json:
        email: person@example.com
    expect:
      status: 401
      body:
        error: Invalid API key. See https://docs.apollo.io/reference/authentication for how to authenticate.

  - name: an empty x-api-key header answers the same as a missing one
    source: https://api.apollo.io/api/v1/people/match
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: POST
      path: /api/v1/people/match
      headers:
        x-api-key: ""
        Content-Type: application/json
      json:
        email: person@example.com
    expect:
      status: 422
      body:
        error: Api key required

  - name: the wrong method on a real path still reaches the credential check
    # GET on a POST-only path, no credential at all -- reached the same 422
    # POST gets, never a 404 or a 405. See the header for the DELETE
    # contrast, not modelled because Apollo's DELETE answers the same
    # unrouted HTML page a wholly bogus path does.
    source: https://api.apollo.io/api/v1/people/match
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/people/match
    expect:
      status: 422
      body:
        error: Api key required

  - name: a person is wrapped under its own key, with the confidence field null on a verified match
    source: https://docs.apollo.io/reference/people-enrichment
    fixture: worked-examples
    request:
      method: POST
      path: /api/v1/people/match
      headers:
        x-api-key: cauldron0000000000000000000000
        Content-Type: application/json
      json:
        email: tim@apollo.io
    expect:
      status: 200
      body:
        "person.id": 64a7ff0cc4dfae00013df1a5
        "person.name": Tim Zheng
        "person.email_status": verified
        "person.extrapolated_email_confidence": null
      absent:
        - id
        - name
        - data

  - name: an organization is wrapped under organization, not the Recipe-wide person key
    source: https://docs.apollo.io/reference/organization-enrichment
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/organizations/enrich?domain=apollo.io
      headers:
        x-api-key: cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "organization.id": 5e66b6381e05b4008c8331b8
        "organization.name": Apollo.io
        "organization.primary_domain": apollo.io
        "organization.estimated_num_employees": 1600
      absent:
        - person
        - data
        - organization.person

  - name: a valid key locked out of this endpoint's scope is a 403 with its own error_code
    source: https://docs.apollo.io/reference/organization-enrichment
    arm: insufficient_scope
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/organizations/enrich?domain=apollo.io
      headers:
        x-api-key: cauldron0000000000000000000000
    expect:
      status: 403
      body:
        error: This API key is not authorized to access api/v1/organizations/enrich. Request an API key from your administrator that includes this endpoint in its configured scope.
        error_code: API_INACCESSIBLE
      absent:
        - errors

  - name: a missing domain parameter is a different 422 than a missing key
    source: https://docs.apollo.io/reference/organization-enrichment
    arm: missing_domain
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/organizations/enrich
      headers:
        x-api-key: cauldron0000000000000000000000
    expect:
      status: 422
      body:
        error: Required parameter 'domain' missing

  - name: the rate limit nests its sentence under message, not error
    source: https://docs.apollo.io/reference/organization-enrichment
    arm: rate_limit
    fixture: worked-examples
    request:
      method: GET
      path: /api/v1/organizations/enrich?domain=apollo.io
      headers:
        x-api-key: cauldron0000000000000000000000
    expect:
      status: 429
      body:
        message: The maximum number of api calls allowed for api/v1/organizations/enrich is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      absent:
        - error

  # The names. This Recipe declares 12 field(s) on a organization that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 12 name(s) that came back at the paths they came
  # back under.
  - name: "an organization carries the field names this Recipe declares"
    source: "https://docs.apollo.io/reference/organization-enrichment"
    fixture: worked-examples
    request:
      method: GET
      path: "/api/v1/organizations/enrich"
      query:
        "domain": "apollo.io"
      headers:
        "x-api-key": "cauldron0000000000000000000000"
    expect:
      status: 200
      body:
        "organization.annual_revenue": 100000000
        "organization.annual_revenue_printed": "100M"
        "organization.city": "San Francisco"
        "organization.country": "United States"
        "organization.founded_year": 2015
        "organization.industry": "information technology & services"
        "organization.linkedin_url": "http://www.linkedin.com/company/apolloio"
        "organization.logo_url": "https://zenprospect-production.s3.amazonaws.com/uploads/pictures/79049be00ff8e398b5935de8/picture"
        "organization.short_description": "Apollo.io combines a buyer database..."
        "organization.state": "California"
        "organization.twitter_url": "https://twitter.com/meetapollo/"
        "organization.website_url": "http://www.apollo.io"

