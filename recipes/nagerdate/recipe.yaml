# Nager.Date Recipe for Cauldron
#
# "fixed" is false on Christmas Day.
#
#   {"date": "2026-12-25", "localName": "Christmas Day", "fixed": false, ...}
#
# The twenty-fifth of December is as fixed as a date gets, and the field that
# says whether a holiday falls on the same date every year says no. It says no
# for New Year's Day too, and for every other holiday: across Canada, the United
# States, the United Kingdom and Germany -- eighty-one holidays in 2026 -- fixed
# is false eighty-one times. It is a boolean that has one value, so branching on
# it is branching on a constant.
#
# launchYear is the same: null on all eighty-one.
#
# **And one date carries six holidays, none of them national.** The third of
# August 2026 in Canada is the Civic Holiday, British Columbia Day, Heritage Day,
# New Brunswick Day, Natal Day and Saskatchewan Day -- six entries, one date,
# thirteen provinces and territories between them, and every one has
# global: false. So `holidays.find(h => h.date === today)` returns whichever the
# array happened to order first, and calling it "the holiday" is wrong in five
# provinces out of six.
#
# Written against the live API rather than a document: every case below was
# checked against date.nager.at on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. The field naming a subdivision is called counties, and it holds Canadian
#      provinces, German states and US states. It is null rather than empty when
#      the holiday is national, so the type is array-or-null and the name is
#      wrong outside a handful of countries.
#   2. Twenty-three of Canada's thirty-one holidays are not global. A client
#      showing the list without reading global tells someone in Ontario about
#      Saskatchewan Day.
#   3. localName and name are separate fields and identical on all thirty-one.
#      They differ only where a country has more than one official language, so
#      the duplication is invisible until it is not.
#   4. types is an array on a field that has one value everywhere here:
#      ["Public"]. The API supports Bank, School, Authorities, Optional and
#      Observance, and none of them appears in a national list.
#
# The failures share an envelope and disagree about the rest of it. An unknown
# country is
#
#   404  {"title": "Unknown country code", "status": 404, "detail": "..."}
#
# and a year outside the range is
#
#   400  {"title": "One or more validation errors occurred.", "status": 400,
#         "errors": {"year": ["The specified year '1600' is not supported."]}}
#
# So title and status are in both, detail is in one, errors is in the other, and
# the title on the second is a framework's default validation sentence rather
# than anything about years. The thing that actually says what went wrong is
# nested two levels down, inside an array, under a key named after the parameter.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The calendar is served rather than computed. A real request works out
#     moveable feasts for any supported country and year; this Recipe answers
#     with the holidays its fixture holds.
#   - Canada's thirty-one holidays are trimmed to six, chosen to show the
#     shapes: two national, and four of the six that share the third of August.
#   - Only PublicHolidays is modelled. NextPublicHolidays, IsTodayPublicHoliday,
#     LongWeekend, CountryInfo and AvailableCountries answer different documents.
#
# The holidays below are public and were recorded on the date in the cases.

recipe: nagerdate
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://date.nager.at/swagger/index.html

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    # A bare array. There is no envelope of any kind.
    style: bare
  error:
    style: flat
    message_field: title
    status_field: status

resources:
  holiday:
    id:
      style: opaque
      # A holiday has no identifier: it is addressed by country and year, and
      # six of them can share a date.
      field: "-"
      carried_by: localName
    fields:
      # The path's first segment, and never in the body.
      year:
        type: string
        in: "-"
      date:
        type: string
      # Identical to name on every Canadian holiday, and separate fields.
      localName:
        type: string
      name:
        type: string
      # The path's second segment, and the body does echo this one.
      countryCode:
        type: string
      # False on all eighty-one, including Christmas.
      fixed:
        type: boolean
      global:
        type: boolean
      # Provinces, in a field called counties, and null rather than empty.
      counties:
        type: list
      # Null on all eighty-one.
      launchYear:
        type: integer
      # An array holding one value everywhere here.
      types:
        type: list

routes:
  - method: GET
    path: /api/v3/PublicHolidays/{year}/{countryCode}
    resource: holiday
    operation: list
    scope:
      - year
      - countryCode
    not_found: unknown_country

errors:
  unknown_country:
    status: 404
    message: Unknown country code
    fields:
      # Where the other failure has errors.
      detail: The country code provided is invalid or not recognized.

  # The same envelope, and the sentence that says what happened is two levels
  # down inside an array.
  unsupported_year:
    status: 400
    message: One or more validation errors occurred.
    fields:
      errors:
        year:
          - The specified year '1600' is not supported.

fixtures:
  empty: {}

  canada:
    holiday:
      - id: New Year's Day
        year: "2026"
        date: "2026-01-01"
        localName: New Year's Day
        name: New Year's Day
        countryCode: CA
        # The first of January, and this is false.
        fixed: false
        global: true
        # Null rather than empty, on a national holiday.
        counties: null
        launchYear: null
        types:
          - Public

      # Four of the six that share the third of August. None is national.
      - id: Civic Holiday
        year: "2026"
        date: "2026-08-03"
        localName: Civic Holiday
        name: Civic Holiday
        countryCode: CA
        fixed: false
        global: false
        # Provinces and territories, in a field called counties.
        counties:
          - CA-MB
          - CA-NL
          - CA-NT
          - CA-NU
          - CA-ON
        launchYear: null
        types:
          - Public

      - id: British Columbia Day
        year: "2026"
        date: "2026-08-03"
        localName: British Columbia Day
        name: British Columbia Day
        countryCode: CA
        fixed: false
        global: false
        counties:
          - CA-BC
        launchYear: null
        types:
          - Public

      - id: Heritage Day
        year: "2026"
        date: "2026-08-03"
        localName: Heritage Day
        name: Heritage Day
        countryCode: CA
        fixed: false
        global: false
        counties:
          - CA-AB
          - CA-YT
        launchYear: null
        types:
          - Public

      - id: Saskatchewan Day
        year: "2026"
        date: "2026-08-03"
        localName: Saskatchewan Day
        name: Saskatchewan Day
        countryCode: CA
        fixed: false
        global: false
        counties:
          - CA-SK
        launchYear: null
        types:
          - Public

      # The same holiday a year earlier, on a different date, so a request
      # for 2026 must not return it.
      - id: Christmas Day 2025
        year: "2025"
        date: "2025-12-25"
        localName: Christmas Day
        name: Christmas Day
        countryCode: CA
        fixed: false
        global: true
        counties: null
        launchYear: null
        types:
          - Public

      - id: Christmas Day
        year: "2026"
        date: "2026-12-25"
        localName: Christmas Day
        name: Christmas Day
        countryCode: CA
        # The twenty-fifth of December, and this is false.
        fixed: false
        global: true
        counties: null
        launchYear: null
        types:
          - Public

conformance:
  - name: fixed is false on Christmas Day
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # The twenty-fifth of December is as fixed as a date gets, and the
        # field that says so says no -- as it does on all eighty-one holidays
        # across the four countries checked.
        "[5].date": "2026-12-25"
        "[5].localName": Christmas Day
        "[5].fixed": false
        # And on the first of January.
        "[0].date": "2026-01-01"
        "[0].fixed": false

  - name: one date carries six holidays and none of them is national
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # Four of the six here. find(h => h.date === today) returns whichever
        # the array ordered first, and calling it "the holiday" is wrong in
        # five provinces out of six.
        "[1].date": "2026-08-03"
        "[2].date": "2026-08-03"
        "[3].date": "2026-08-03"
        "[4].date": "2026-08-03"
        "[1].localName": Civic Holiday
        "[2].localName": British Columbia Day
        "[4].localName": Saskatchewan Day
        "[4].name": Saskatchewan Day

  - name: the subdivisions are provinces in a field called counties
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # Five provinces and territories under one holiday, and the field is
        # named for an English administrative division.
        "[1].counties[0]": CA-MB
        "[1].counties[4]": CA-ON
        "[2].counties[0]": CA-BC
        "[3].counties[1]": CA-YT

  - name: and it is null rather than empty on a national one
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # So the type is array-or-null, and .length throws on the national
        # holidays rather than reading zero.
        "[0].counties": null
        "[0].global": true
        "[1].global": false

  - name: launchYear is null and types is an array of one
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # Null on all eighty-one, and an array whose only value in a national
        # list is "Public".
        "[0].launchYear": null
        "[5].launchYear": null
        "[0].types[0]": Public
        "[5].types[0]": Public
        "[5].counties": null
      absent:
        - "[0].types[1]"
        - "[5].types[1]"
        # The year is a path segment and is never echoed, where the country
        # code beside it is.
        - "[0].year"
        # And a request for 2026 does not carry 2025's holidays.
        - "[6]"

  - name: the local name and the name are separate and identical
    source: https://date.nager.at/api/v3/PublicHolidays/2026/CA
    verified: "2026-08-28"
    fixture: canada
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/CA
    expect:
      status: 200
      body:
        # Two fields, one value, on every Canadian holiday. They differ only
        # where a country has more than one official language.
        "[0].localName": New Year's Day
        "[0].name": New Year's Day
        "[5].localName": Christmas Day
        "[5].name": Christmas Day
        "[0].countryCode": CA

  - name: an unknown country carries detail
    source: https://date.nager.at/api/v3/PublicHolidays/2026/ZZ
    verified: "2026-08-28"
    fixture: canada
    arm: unknown_country
    request:
      method: GET
      path: /api/v3/PublicHolidays/2026/ZZ
    expect:
      status: 404
      body:
        title: Unknown country code
        status: 404
        detail: The country code provided is invalid or not recognized.
      absent:
        - errors

  - name: and an unsupported year carries errors instead
    source: https://date.nager.at/api/v3/PublicHolidays/1600/CA
    verified: "2026-08-28"
    fixture: canada
    arm: unsupported_year
    request:
      method: GET
      path: /api/v3/PublicHolidays/1600/CA
    expect:
      # Same title and status keys, and the sentence that says what happened is
      # two levels down inside an array, under a key named after the parameter
      # -- while the title is a framework's default validation message.
      status: 400
      body:
        title: One or more validation errors occurred.
        status: 400
        "errors.year[0]": The specified year '1600' is not supported.
      absent:
        - detail
