# Food Hygiene Rating Scheme Recipe for Cauldron
#
# The same digit means best in one field and worst in another.
#
#   "RatingValue": "5"                        <- the best rating there is
#   "scores": {"ConfidenceInManagement": 0}   <- the best score there is
#
# The two scales run in opposite directions. RatingValue counts up to five, and
# the scores count points against you, so zero is perfect. In one object, "5" is
# the top of one scale and 5 is a middling result on the other -- and the first
# is a string while the second is a number, so they do not even compare without
# a cast.
#
# **And absence is spelled three ways in one record.** Phone is "", Distance is
# null, and AddressLine2 is "" while AddressLine3 holds the town -- so an empty
# line is not the end of the address, it is a gap in the middle of it.
#
# Written against the live API rather than a document: every case below was
# checked against api.ratings.food.gov.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A forgotten header is reported as a path that does not exist. The API
#      requires x-api-version: 2, and without it /Authorities/basic answers
#      "The API 'Authorities' doesn't exist" -- blaming the URL for a missing
#      header, on a path that works the moment the header is sent.
#   2. That failure is a bare JSON string. Not an object: the whole body is
#      "The API 'Version2.NoSuchThing' doesn't exist", quotes included. So
#      JSON.parse succeeds and hands back a string, body.Message is undefined
#      rather than throwing, and the name inside it is the internal handler --
#      the version and the path joined by a dot -- rather than anything the
#      client asked for. The other failure, for an establishment that does not
#      exist, is an ordinary object with a capitalised Message.
#   3. The coordinates are strings and the scores are numbers. geocode.latitude
#      is "52.1976012" and scores.Hygiene is 5, in the same record.
#
# And RatingKey is three things in one underscored string: "fhrs_5_en-gb" packs
# the scheme, the rating and the locale, so reading the rating from it means
# splitting on underscores and taking the middle -- while RatingValue holds the
# same digit one field away.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One establishment is served, of hundreds of thousands.
#   - The header is not enforced. Cauldron can require a header, and requiring
#     this one would make every case in this file send it, which would hide the
#     finding rather than show it. The version failure is served on its own
#     path instead.

recipe: fhrs
capability: docs
version: 0.1.0

upstream:
  api: fhrs
  docs: https://api.ratings.food.gov.uk/help

auth:
  # Public, no key -- but a version header, and forgetting it looks like a
  # missing path.
  scheme: none

responses:
  list:
    style: wrapped
    key: establishments
  resource:
    style: bare
  error:
    # The object one. The other failure is a bare string and is declared below.
    style: flat
    message_field: Message

resources:
  establishment:
    id:
      style: numeric
      field: FHRSID
      type: number
    fields:
      BusinessName:
        type: string
      BusinessType:
        type: string
      BusinessTypeID:
        type: integer
      # An empty line in the middle of an address, not at the end of it.
      AddressLine1:
        type: string
      AddressLine2:
        type: string
      AddressLine3:
        type: string
      AddressLine4:
        type: string
      PostCode:
        type: string
      # Empty rather than null, where Distance is null rather than empty.
      Phone:
        type: string
      RightToReply:
        type: string
      Distance:
        type: number
      LocalAuthorityBusinessID:
        type: string
      LocalAuthorityCode:
        type: string
      LocalAuthorityName:
        type: string
      LocalAuthorityEmailAddress:
        type: string
      LocalAuthorityWebSite:
        type: string
      NewRatingPending:
        type: boolean
      ChangesByServerID:
        type: integer
      # A date wearing a time, at midnight, with no zone.
      RatingDate:
        type: string
      # Scheme, rating and locale in one underscored string.
      RatingKey:
        type: string
      # A string, where the scores below are numbers -- and the top of a scale
      # that counts the other way.
      RatingValue:
        type: string
      SchemeType:
        type: string
      # Strings, in a record whose scores are numbers.
      geocode:
        type: map
      # Numbers, counting points against you, so zero is perfect.
      scores:
        type: map

routes:
  - method: GET
    path: /Establishments
    resource: establishment
    operation: list

  - method: GET
    path: /Establishments/{id}
    resource: establishment
    operation: get
    not_found: establishment_not_found

  # A path that does not exist, answered with a bare string naming the internal
  # handler.
  - method: GET
    path: /NoSuchThing
    error: api_does_not_exist

  # The same failure, for a path that does exist, when the version header is
  # not sent.
  - method: GET
    path: /Authorities/basic
    error: version_header_missing

errors:
  # An object, with a capitalised key.
  establishment_not_found:
    status: 404
    message: "No establishment found with EstablishmentId: 1"

  # A bare JSON string. JSON.parse succeeds and hands back a string, so
  # body.Message is undefined rather than throwing.
  api_does_not_exist:
    status: 404
    style: string
    # The internal handler name: the version and the path joined by a dot.
    message: "The API 'Version2.NoSuchThing' doesn't exist"

  # The same shape, blaming the URL for a missing header.
  version_header_missing:
    status: 404
    style: string
    message: "The API 'Authorities' doesn't exist"

fixtures:
  empty: {}

  ratings:
    establishment:
      - id: "1472773"
        FHRSID: 1472773
        BusinessName: "196"
        BusinessType: Restaurant/Cafe/Canteen
        BusinessTypeID: 1
        AddressLine1: 196 Mill Road
        # Empty in the middle: the town is on line 3 and the county on line 4.
        AddressLine2: ""
        AddressLine3: Cambridge
        AddressLine4: Cambridgeshire
        PostCode: CB1 3NF
        # Empty strings...
        Phone: ""
        RightToReply: ""
        # ...and a null, in the same record.
        Distance: null
        LocalAuthorityBusinessID: "9200371"
        LocalAuthorityCode: "027"
        LocalAuthorityName: Cambridge City
        LocalAuthorityEmailAddress: env.health@cambridge.gov.uk
        # Plain HTTP.
        LocalAuthorityWebSite: http://www.cambridge.gov.uk
        NewRatingPending: false
        ChangesByServerID: 0
        # Midnight, no zone: a date wearing a time.
        RatingDate: "2026-02-25T00:00:00"
        # Scheme, rating and locale, underscored.
        RatingKey: fhrs_5_en-gb
        # A string, and the top of its scale.
        RatingValue: "5"
        SchemeType: FHRS
        geocode:
          # Strings.
          longitude: "0.1440631"
          latitude: "52.1976012"
        scores:
          # Numbers, counting the other way: zero is perfect.
          Hygiene: 5
          Structural: 5
          ConfidenceInManagement: 0

conformance:
  - name: the same digit means best in one field and not in the other
    source: https://api.ratings.food.gov.uk/Establishments?localAuthorityId=1&pageSize=1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments
    expect:
      status: 200
      body:
        # The top of a scale that counts up...
        "establishments[0].RatingValue": "5"
        # ...beside a scale that counts points against you, where zero is
        # perfect and five is not.
        "establishments[0].scores.ConfidenceInManagement": 0
        "establishments[0].scores.Hygiene": 5
        "establishments[0].scores.Structural": 5

  - name: and one of them is a string
    source: https://api.ratings.food.gov.uk/Establishments?localAuthorityId=1&pageSize=1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments
    expect:
      status: 200
      body:
        # Quoted, where the scores are not, so they do not compare without a
        # cast -- and the same digit is one field away in both.
        "establishments[0].RatingValue": "5"
        # Scheme, rating and locale in one underscored string, so reading the
        # rating from here means splitting and taking the middle.
        "establishments[0].RatingKey": fhrs_5_en-gb
        "establishments[0].SchemeType": FHRS

  - name: absence is spelled three ways in one record
    source: https://api.ratings.food.gov.uk/Establishments?localAuthorityId=1&pageSize=1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments
    expect:
      status: 200
      body:
        # Empty strings...
        "establishments[0].Phone": ""
        "establishments[0].RightToReply": ""
        # ...a null...
        "establishments[0].Distance": null
        # ...and an empty line in the middle of an address, with the town on
        # the line after it.
        "establishments[0].AddressLine2": ""
        "establishments[0].AddressLine3": Cambridge
        "establishments[0].AddressLine4": Cambridgeshire

  - name: the coordinates are strings and the scores are numbers
    source: https://api.ratings.food.gov.uk/Establishments?localAuthorityId=1&pageSize=1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments
    expect:
      status: 200
      body:
        # Quoted, in the same record whose scores are not.
        "establishments[0].geocode.latitude": "52.1976012"
        "establishments[0].geocode.longitude": "0.1440631"
        # A date wearing a time, at midnight, with no zone.
        "establishments[0].RatingDate": "2026-02-25T00:00:00"

  - name: the rest of the record
    source: https://api.ratings.food.gov.uk/Establishments?localAuthorityId=1&pageSize=1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments
    expect:
      status: 200
      body:
        "establishments[0].FHRSID": 1472773
        # A business whose name is a number, as a string.
        "establishments[0].BusinessName": "196"
        "establishments[0].BusinessType": Restaurant/Cafe/Canteen
        "establishments[0].BusinessTypeID": 1
        "establishments[0].PostCode": CB1 3NF
        "establishments[0].LocalAuthorityName": Cambridge City
        # Plain HTTP, for a government website.
        "establishments[0].LocalAuthorityWebSite": http://www.cambridge.gov.uk
        "establishments[0].NewRatingPending": false

  - name: an establishment that does not exist is an object
    source: https://api.ratings.food.gov.uk/Establishments/1
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Establishments/1
    expect:
      status: 404
      body:
        # A capitalised key, in an ordinary object.
        Message: "No establishment found with EstablishmentId: 1"

  - name: and a path that does not exist is a bare string
    source: https://api.ratings.food.gov.uk/NoSuchThing
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /NoSuchThing
    expect:
      # The whole body, quotes included. JSON.parse succeeds and hands back a
      # string, so body.Message is undefined rather than throwing -- and the
      # name inside is the internal handler, the version and the path joined by
      # a dot, rather than anything the client asked for.
      status: 404
      body_matches: '^"The API .Version2\.NoSuchThing. doesn.t exist"'

  - name: a forgotten header is reported as a path that does not exist
    source: https://api.ratings.food.gov.uk/Authorities/basic
    verified: "2026-08-30"
    fixture: ratings
    request:
      method: GET
      path: /Authorities/basic
    expect:
      # The API requires x-api-version: 2. Without it this path answers as
      # though it were not a path at all -- and it works the moment the header
      # is sent.
      status: 404
      body_matches: '^"The API .Authorities. doesn.t exist"'
