# ClickHouse Cloud Recipe for Cauldron
#
# ClickHouse Cloud splits exactly the way this group's question expects: a
# control plane at api.clickhouse.cloud that creates and lists Services, and
# a data plane -- the actual SQL-over-HTTP interface a client would run a
# query against -- on a per-service host handed back only by that control
# plane. That per-service host was never observed: no account exists, no
# service was ever created, and the control plane's own published
# description gives no worked example for it either (see the gaps). This
# Recipe models the half it can reach and states the other, the same trade
# Milvus's Recipe in this collection makes for Zilliz Cloud, and does not
# invent a per-cluster hostname to fill the gap.
#
# GET https://api.clickhouse.cloud/v1 answers 200 with the control plane's
# own OpenAPI 3.1 description, unauthenticated, 1.2MB of JSON -- the
# document this Recipe is written against is the live API's own root, not a
# docs-site mirror of it. spec_hash is taken from exactly that response.
#
# The credential really is HTTP Basic, key and secret, verified live rather
# than assumed from the docs page's own claim:
#
#   no Authorization header at all           -> 401 "UNAUTHORIZED: No
#                                                Authorization header
#                                                provided."
#   Basic <base64 junkkey:junksecret>        -> 401 "UNAUTHORIZED: Key is
#                                                not found"
#   Authorization: garbagenotbase64          -> 400 "BAD_REQUEST: Bad
#                                                Authorization header format"
#   Basic <base64 of "notbase64", no colon>  -> 400 "BAD_REQUEST: Bad
#                                                Authorization header
#                                                user:password format"
#
# Four sentences, not three, and the status code itself splits on which one:
# absent and rejected are both 401, and the two malformed shapes above are
# both 400 -- a verdict-status asymmetry no Recipe in this collection had
# pinned before. This Recipe keeps one malformed_error, "Bad Authorization
# header format" at 400, because that is what the plainest accidental
# mistake (a raw value with no "Basic " prefix at all) earns; the second
# malformed sentence, for a well-formed Basic header whose decoded payload
# has no colon in it, is real, live, dated below, and not modelled as its
# own verdict, the same discipline Milvus's Recipe applies to its own
# untestable middle case.
#
# There is a fifth sentence this Recipe does not model at all.
# Authorization: Bearer junktoken12345 -- a shape this format's basic scheme
# treats as simply malformed, since it does not parse as "Basic ..." --
# answers 401 "UNAUTHORIZED: Invalid JWT token" live, not the 400 malformed
# sentence above. That is not noise: it means this host accepts a second,
# undocumented credential type on the identical routes, a short-lived JWT
# presumably meant for the web console's own session rather than the
# published Basic key/secret API. Recorded here rather than asserted as a
# case that would fail its own build, the same phrase Milvus's Recipe uses
# for its own credential shape this format cannot draw a fourth verdict for.
# This is not auth.also's gap, on purpose: also exists for one credential
# reachable through several carriers, and the wire evidence here says the
# opposite -- a keyId:keySecret pair on one route and a short-lived JWT
# issued to a browser session on the other, two credentials of genuinely
# different kinds that happen to share a path. Declaring the JWT as an
# alternative carrier would claim the Basic key itself authenticates that
# way, which nothing here observed and nothing about a session token makes
# plausible. Stays recorded in prose.
#
# Routing runs to completion, credential included, before any check on it:
# checked live, both ways, on the two questions that matter most. A path
# this host does not register -- /v1/this-is-not-a-real-endpoint -- answers
# the identical 404 whether or not a credential is sent at all, so an
# unrouted path never reaches the credential check. And PATCH and POST on
# /v1/organizations -- a real path registered for GET only -- answer 404
# too, not 401 and not a 405: auth.after_routing carries this, and it is the
# opposite arrangement from Tiger Data's Recipe in this collection, checked
# against the identical two questions and splitting the other way (absent
# and malformed block before routing there; only a well-formed wrong
# credential reaches the router). There is no 405 anywhere on this host that
# was reachable without a credential -- confirmed on a real path (DELETE
# /v1/organizations/00000000-0000-4000-9000-000000000000, only GET and
# PATCH registered) and an unrouted one alike. Every case is Express's own
# unstyled default, "Cannot GET /v1/organizations" and so on -- HTML, not
# JSON, the one host in this batch where the failure envelope changes shape
# depending on which check refused the request. The exact sentence echoes
# the request's own method and path, which this format has no mechanism to
# reproduce dynamically for an unrouted path (only method_not_allowed's
# built-in detail carries the method); this Recipe pins the one stable
# fragment, "Cannot ", declared as the whole message, rather than a
# fabricated full echo. unknown_route and method_not_allowed are declared
# with the identical body for the same reason Turso's Recipe in this
# collection gives for its own host: a mistyped path and a mistyped method
# are the same failure here too.
#
# The finding this Recipe was sent to find, read from the same live root
# document rather than a worked example -- POST .../services has none in
# the description, and none was invented:
#
# Creating a Service answers 200 with the FULL record, not a truncated
# projection. ServicePostResponse is {service: Service, password: string} --
# the entire Service schema, fifty-odd fields, nested one level deeper than
# every other operation on this resource: GET answers {"result": {...
# Service fields directly ...}}, POST answers {"result": {"service": {...
# the identical fields ...}, "password": "..."}}. state rides on that nested
# service object from the first response onward, with fourteen values in
# its enum -- starting, stopping, terminating, softdeleting, awaking,
# partially_running, provisioning, running, stopped, terminated,
# softdeleted, degraded, failed, idle -- none of them marked terminal or
# otherwise in the description; terminated and softdeleted read as the ends
# of the delete path by their own names, and nothing in the schema commits
# to that reading being complete, so this Recipe does not assert it. Set
# against this group's other two Recipes: Turso's create withholds the
# state field entirely, because the Database resource carries none anywhere
# to withhold; SingleStore's create carries a groupID and a generated
# password but no state either. ClickHouse's create carries state from the
# very first response -- genuinely pollable without a second request just to
# learn there is nothing to poll -- and the honesty costs an extra nesting
# level a client has to know about.
#
# The password is the same finding Neon's and SingleStore's Recipes in this
# collection already make for their own hosts: a live credential, generated
# server-side, sent exactly once, in the create response and nowhere else.
# Here it rides beside the nested service object rather than inside it,
# which is what the extra "service" key in the envelope is for.
#
# Deleting a Service answers less than either of those two providers'
# equivalents: {"status": 200, "requestId": "..."} and nothing else --  not
# even the id being deleted, the one thing every other delete_body shape
# this format has echoes back. This is the only Recipe in the collection
# where a delete's own response carries no identifying trace of what it
# deleted at all.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Insert, query and every other data-plane verb are not modelled at
#     all. A service's endpoints field -- protocol, host, port, username --
#     is real, declared on the resource below, and deliberately never
#     populated with a value in any fixture or conformance case: the
#     control plane's own description gives no worked example for a real
#     hostname, this task created no service to read one from, and
#     inventing one would be exactly the mistake this group's Milvus and
#     Pinecone Recipes both refuse to make for their own hosts.
#   - requestId, present on every envelope, real and random, is never
#     asserted, the same gap Milvus's Recipe states for its own request_id.
#   - Only organizations and services (list, get, create, update, delete)
#     are modelled. Backups, ClickPipes, private endpoints, UDFs, usage
#     cost, quotas, roles, members, invitations, BYOC infrastructure and the
#     Postgres-service half of this same host -- more than seventy other
#     paths in the live description -- are real and absent. This Recipe is
#     about the create/state/credential questions this group exists to
#     answer, not a full port of the control plane.
#   - Every 200 below is read from the live root document at
#     api.clickhouse.cloud/v1 and carries no verified: date, because no
#     account exists to call a write against. The 400s, 401s and 404s are
#     struck live, unauthenticated, and each carries one.
#
# The key below is a fixture and belongs to no organisation.

recipe: clickhouse
capability: database
version: 0.1.0

upstream:
  api: v1
  docs: https://clickhouse.com/docs/cloud/manage/api/api-overview
  spec: https://api.clickhouse.cloud/v1
  spec_hash: be488ae30122ebfbcb72264005e40024f34b7504f220354e6ab701c9384b53cb
  spec_seen: "2026-09-01"

auth:
  scheme: basic
  # ClickHouse's key is keyId:keySecret. Only the username half (keyId) is
  # what "Key is not found" checks first, verified live: junk paired with
  # junk fails on the id lookup before any secret comparison is reachable.
  # What a real id paired with a wrong secret answers is not stated -- no
  # real id was ever available to pair one against.
  credential: username
  keys:
    - cauldronclickhousefixturekeyid0
  absent_error: no_authorization_header
  malformed_error: bad_authorization_header
  rejected_error: key_not_found
  # Routing runs to completion before the credential is examined, checked
  # live both ways -- see the header.
  after_routing: true

responses:
  list:
    style: wrapped
    key: result
  resource:
    style: wrapped
    key: result
  success:
    fields:
      status: 200
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  organization:
    id:
      style: uuid
      field: id
    fields:
      name:
        type: string
      createdAt:
        type: datetime
      enableCoreDumps:
        type: boolean
        default: false

  service:
    id:
      style: uuid
      field: id
    fields:
      name:
        type: string
        required: true
      # aws, gcp or azure.
      provider:
        type: string
      region:
        type: string
      # starting, stopping, terminating, softdeleting, awaking,
      # partially_running, provisioning, running, stopped, terminated,
      # softdeleted, degraded, failed or idle. See the header: none of these
      # is documented as terminal.
      state:
        type: string
        default: provisioning
      createdAt:
        type: datetime
      # Real, declared, and deliberately never given a value -- see the
      # header. A client reaching for a service's own query endpoint has
      # nothing here this Recipe can hand it.
      endpoints:
        type: list
      # The partition lives in the path and is not repeated in the body --
      # the real Service schema has no organizationId property at all.
      organizationId:
        type: string
        in: "-"

routes:
  - method: GET
    path: /v1/organizations
    resource: organization
    operation: list

    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
  - method: GET
    path: /v1/organizations/{id}
    resource: organization
    operation: get

  - method: GET
    path: /v1/organizations/{organizationId}/services
    resource: service
    operation: list
    pagination:
      # The description declares filter on this route and no paging
      # parameter of any kind, which says more than silence would: the query
      # string was written down and paging is not in it.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
    scope: [organizationId]

  - method: GET
    path: /v1/organizations/{organizationId}/services/{id}
    resource: service
    operation: get
    scope: [organizationId]

  # 200, never 201, and nested one level deeper than every other route on
  # this resource -- see the header.
  - method: POST
    path: /v1/organizations/{organizationId}/services
    resource: service
    operation: create
    scope: [organizationId]
    status: 200
    returns: [id, name, provider, region, state, createdAt]
    envelope:
      key: result.service
    fields:
      result.password: cauldronFixtureClickHousePassword!

  - method: PATCH
    path: /v1/organizations/{organizationId}/services/{id}
    resource: service
    operation: update
    scope: [organizationId]
    returns: [id, name, provider, region, state, createdAt]

  # {"status": 200, "requestId": "..."} and nothing else -- not even the id.
  # See the header. bare drops the "result" wrapper entirely rather than
  # sending an empty one, which is what the live response actually omits.
  - method: DELETE
    path: /v1/organizations/{organizationId}/services/{id}
    resource: service
    operation: delete
    scope: [organizationId]
    deleted_body: empty
    envelope:
      style: bare

errors:
  no_authorization_header:
    status: 401
    message: "UNAUTHORIZED: No Authorization header provided."
    fields:
      status: 401

  # The stable fragment of two live sentences that share this status and
  # this verdict -- see the header for the second one's exact wording.
  bad_authorization_header:
    status: 400
    message: "BAD_REQUEST: Bad Authorization header format"
    fields:
      status: 400

  key_not_found:
    status: 401
    message: "UNAUTHORIZED: Key is not found"
    fields:
      status: 401

  # Express's own default, not this API's wording -- see the header. The
  # live body echoes the request's own method and path; this Recipe pins
  # only the stable prefix rather than fabricating the echo.
  unknown_route:
    status: 404
    style: text
    message: "Cannot "
    headers:
      content-type: "text/html; charset=utf-8"

  method_not_allowed:
    status: 404
    style: text
    message: "Cannot "
    headers:
      content-type: "text/html; charset=utf-8"

fixtures:
  empty: {}

  account:
    organization:
      - id: "00000000-0000-4000-9000-000000000001"
        name: Cauldron Fixture
        createdAt: "2026-01-10T09:00:00Z"
        enableCoreDumps: false

    service:
      - id: "00000000-0000-4000-9000-000000000002"
        organizationId: "00000000-0000-4000-9000-000000000001"
        name: cauldron-shop
        provider: aws
        region: us-east-1
        state: running
        createdAt: "2026-01-10T09:05:00Z"

conformance:
  - name: no credential at all names the missing header, not a generic word
    source: https://api.clickhouse.cloud/v1/organizations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/organizations
    expect:
      status: 401
      body:
        error: "UNAUTHORIZED: No Authorization header provided."
        status: 401

  - name: a well-formed key and secret that are simply wrong is a different sentence
    source: https://api.clickhouse.cloud/v1/organizations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/organizations
      headers:
        Authorization: "Basic anVua2tleTpqdW5rc2VjcmV0"
    expect:
      status: 401
      body:
        error: "UNAUTHORIZED: Key is not found"
        status: 401

  - name: a header with no recognisable scheme at all is a 400, not a 401
    source: https://api.clickhouse.cloud/v1/organizations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/organizations
      headers:
        Authorization: garbagenotbase64
    expect:
      status: 400
      body:
        error: "BAD_REQUEST: Bad Authorization header format"
        status: 400

  - name: an unrouted path answers the same 404 with or without a credential
    source: https://api.clickhouse.cloud/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: "text/html; charset=utf-8"
      body_matches: "^Cannot "

  - name: and the identical check runs for a credential that was actually sent
    source: https://api.clickhouse.cloud/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
      headers:
        Authorization: "Basic anVua2tleTpqdW5rc2VjcmV0"
    expect:
      status: 404
      body_matches: "^Cannot "

  - name: a wrong method on a real path is a 404 too, not a 405
    source: https://api.clickhouse.cloud/v1/organizations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/organizations
    expect:
      status: 404
      headers:
        content-type: "text/html; charset=utf-8"
      body_matches: "^Cannot "

  - name: a POST to the same path is the identical routing failure, not an auth one
    source: https://api.clickhouse.cloud/v1/organizations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/organizations
    expect:
      status: 404
      body_matches: "^Cannot "

  - name: a real route with no matching id still reaches the credential check
    source: https://api.clickhouse.cloud/v1/organizations/00000000-0000-4000-9000-000000000000
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/organizations/00000000-0000-4000-9000-000000000000
    expect:
      status: 401
      body:
        error: "UNAUTHORIZED: No Authorization header provided."

  - name: creating a service answers the full record nested one level deeper, plus a password
    source: https://api.clickhouse.cloud/v1
    fixture: account
    request:
      method: POST
      path: /v1/organizations/00000000-0000-4000-9000-000000000001/services
      headers:
        Authorization: "Basic Y2F1bGRyb25jbGlja2hvdXNlZml4dHVyZWtleWlkMDpzZWNyZXQ="
      json:
        name: cauldron-newservice
        provider: aws
        region: us-east-1
    expect:
      status: 200
      body:
        result.password: cauldronFixtureClickHousePassword!
      matches:
        result.service.id: "^[0-9a-f-]{36}$"
        result.service.name: ".+"
      absent:
        - result.id
        - password

  - name: only a GET shows the state the create response nests but a client would still have to poll for
    source: https://api.clickhouse.cloud/v1
    fixture: account
    request:
      method: GET
      path: /v1/organizations/00000000-0000-4000-9000-000000000001/services/00000000-0000-4000-9000-000000000002
      headers:
        Authorization: "Basic Y2F1bGRyb25jbGlja2hvdXNlZml4dHVyZWtleWlkMDpzZWNyZXQ="
    expect:
      status: 200
      body:
        result.id: "00000000-0000-4000-9000-000000000002"
        result.state: running
      absent:
        - result.service
        - result.password

  - name: deleting a service answers no trace of what it deleted, not even the id
    source: https://api.clickhouse.cloud/v1
    fixture: account
    request:
      method: DELETE
      path: /v1/organizations/00000000-0000-4000-9000-000000000001/services/00000000-0000-4000-9000-000000000002
      headers:
        Authorization: "Basic Y2F1bGRyb25jbGlja2hvdXNlZml4dHVyZWtleWlkMDpzZWNyZXQ="
    expect:
      status: 200
      body:
        status: 200
      absent:
        - result
        - id
