# Missive Recipe for Cauldron
#
# Missive is the control in this group of three, and it is inbox-shaped
# rather than telephony-shaped: there is no call, no recording, and the
# question this group exists to answer -- does a large body come back
# inline, as a URL, or as nothing, and is that URL signed and time-limited?
# -- does not have a recording to ask it about. It has the closer thing an
# inbox actually holds: an email body that can run to any length, and
# attachments that can be arbitrarily large binary files. Missive answers
# both halves of the analogous question directly, in its own published
# words, and lands in a third place next to pdfmonkey/recipe.yaml (a signed
# URL, "1 hour," stated) and api2pdf/recipe.yaml (a signed URL, "24 hours,"
# stated): signed, undated.
#
#   - The body is inline, always, no separate fetch. GET /v1/messages/:id's
#     own worked response puts the full body HTML directly on the message
#     object: "body": "<div>A message from Sam</div>...". There is no
#     pending state, no polling, no second call -- a message either exists,
#     with its body on it, or the id does not resolve.
#   - An attachment is a URL, and Missive's own Attachment properties table
#     says outright what PDFMonkey and Api2Pdf each had to be quoted at
#     length to establish: the `url` column's one-line description reads
#     "Signed URL to download the file." Signed, in Missive's own single
#     word. What is missing is everything PDFMonkey and Api2Pdf both
#     supply next to that word: no lifetime, no expiry, no re-fetch
#     instruction, anywhere in this task's reading of Missive's docs. A
#     signed URL with a stated hour and a signed URL with a stated day both
#     already exist in this collection; Missive is the signed URL with no
#     stated duration at all -- the gap in the middle of the other two.
#
# THE SMALLEST INDEPENDENTLY ADDRESSABLE UNIT IS THE MESSAGE, NOT THE
# CONVERSATION, AND THAT IS A REAL DISTINCTION HERE. GET /v1/messages/:id
# is a real route with its own uuid, and Missive even batches it --
# GET /v1/messages/:id,:id2,:id3 fetches several by comma-separated id in
# one call, per Missive's own Rate Limits guide, which recommends exactly
# this to stay under 300 requests/minute. A Post -- the OTHER content unit
# this API has, created by POST /v1/posts to leave an integration's trace
# on a conversation ("Ticket resolved," a Github push summary) -- has no
# such route at all: it is created and deleted, listed nested under a
# conversation's own /posts path, and never independently fetched by its
# own id anywhere in Missive's published API. A message is addressable on
# its own; a post is reachable only through the conversation that holds it --
# an inbox-shaped version of the same split cloudtalk/recipe.yaml finds
# between a call (its own id, its own route) and a call leg (reachable only
# nested inside the call that holds it, never fetched on its own).
#
# A MESSAGE ITSELF DOES NOT SAY WHICH CONVERSATION IT IS ON, THE IDENTICAL
# FINDING front/recipe.yaml MAKES ABOUT THE SAME KIND OF OBJECT FOR A
# DIFFERENT PROVIDER. Missive's own Message properties table lists id, type,
# preview, delivered_at, updated_at, created_at, from_field, to_fields,
# attachments, references, subject and a dozen more -- no conversation_id
# anywhere on it, checked against the property table itself rather than
# only the worked examples. Code that lists a conversation's messages and
# groups the results by message.conversation_id groups everything under
# undefined, on Missive exactly as it does on Front.
#
# A GET request and a POST both need the identical bearer token, and
# Missive does not distinguish absent from wrong. Struck live,
# 2026-09-01, against public.missiveapp.com, with no account and no token
# this task holds -- no Authorization header, a garbage bearer token, a
# Bearer prefix with nothing after it, a raw non-Bearer value, and a
# header present with an empty value all answered the byte-identical
# {"error":{"message":"Authentication token is invalid or has been
# revoked"}}, 401. auth.absent_error, .malformed_error and .rejected_error
# are all left unset below for exactly that reason -- naming three entries
# for one observed sentence would claim a distinction Missive does not
# make. POST /v1/drafts with no body and no credential reaches the same
# 401, confirmed live, which is also how this Recipe knows the route
# exists without ever having to draft anything.
#
# Routing resolves before the credential does, completely. Struck live,
# no Authorization header sent at all:
#
#   GET /v1/this-is-not-a-real-endpoint -> 404
#     {"error":{"message":"Invalid request URL. Reference: 031cd125-..."}}
#   PATCH /v1/conversations (a real path, wrong method) -> 404, the
#     identical shape, a fresh reference each time
#   OPTIONS /v1/conversations -> 404, the same shape again
#
# checked a second time on each with a garbage bearer token attached:
# byte-identical. No 405 anywhere on this host, on any method this task
# tried; a wrong method gets exactly the same "Invalid request URL" 404 an
# unrouted path does, not a distinct shape. auth.after_routing: true
# carries this. The message embeds a fresh reference id -- the same value
# as the response's own x-request-id header -- on every call, which is why
# this Recipe's matching cases use a pattern rather than a literal string:
# the live sentence is never byte-identical twice.
#
# GET /v1/conversations/:id wraps its single result in an ARRAY under
# "conversations", the identical top-level key AND shape the list endpoint
# uses -- {"conversations": [ {...} ]} -- not the bare object
# GET /v1/messages/:id returns under "messages". This is Xero's own
# invoice-get shape, restated by a completely different provider: a client
# that assumes "get one" means "one object" is reading conversations[0]
# correctly by accident, on the one resource where a fetch can genuinely
# return a DIFFERENT id than the one asked for -- Missive's own words, "The
# returned conversation may have a different id. This happens when
# conversations get merged."
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Posts, Drafts and Send a message are real, documented, and not
#     modelled. A live team inbox has no sandbox and no undo, the same
#     reason front/recipe.yaml and ringcentral/recipe.yaml both give for
#     leaving every write path out of their own Recipes: "nothing here
#     dials anything," in RingCentral's words. Nothing here drafts, posts
#     or sends anything either.
#   - List conversations requires at least one mailbox filter
#     (`inbox`, `all`, `assigned`, ...) or answers a 400 naming that,
#     per Missive's own hint; not exercised by a case, because reaching it
#     needs a credential this task does not have -- see below.
#   - Pagination on List conversations and List conversation messages is
#     declared below, as cursor paging on `until` with `limit` for the
#     size. That is the closest of this format's styles and it is not an
#     exact fit: `until` is a timestamp the caller computes from the LAST
#     ITEM'S OWN `last_activity_at` (conversations) or `delivered_at`
#     (messages), and none of cursor, offset or page describes "read it
#     off the last record yourself". The other half used to be unmodelled
#     too -- "A page may return more [items] than limit", documented for
#     both endpoints, which max_limit and over_limit could not express
#     because both were built for a provider that trims or refuses. That is
#     no longer true: may_overshoot says it, and both listings declare it.
#   - No account was ever created and no API token was ever requested,
#     guessed or used. Only the auth and routing cases below were struck
#     live and carry a verified date; the message, conversation and
#     attachment shapes are Missive's own worked examples from its
#     published reference, quoted and typed as shown, and carry none.
#   - Rate limits are documented with exact numbers (5 concurrent, 300/min,
#     900/15 min) and four named headers and never triggered live; no
#     specific header value is asserted for one.
#   - No spec is recorded. Missive's REST API reference is GitBook prose
#     with worked JSON examples, not a machine-readable OpenAPI document at
#     any URL this task found.
#
# The token below is a fixture and belongs to no account.

recipe: missive
capability: support
version: 0.1.0

upstream:
  api: v1
  docs: https://missiveapp.com/docs/developers/rest-api/endpoints
  provider: Missive

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - "missive_pat-cauldron00000000000000000000000000000000"
  after_routing: true

responses:
  list:
    # No key: each resource's own collection name below ("conversations",
    # "messages") is the wrapping key, matching Missive's own bare-array
    # envelope for both list endpoints -- see the header.
    style: wrapped
  error:
    # {"error":{"message":"..."}} -- Missive sends no code and no type
    # beside it, on every failure this task reached.
    style: nested
    key: error
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  conversation:
    collection: conversations
    id:
      style: uuid
    fields:
      subject:
        type: string
        null_when_unset: true
      latest_message_subject:
        type: string
        null_when_unset: true
      created_at:
        type: timestamp
      # Newest activity, not creation -- the field this Recipe's list and
      # get cases both key on, and the one a real client pages with.
      last_activity_at:
        type: timestamp
      messages_count:
        type: integer
        default: 0
      attachments_count:
        type: integer
        default: 0
      web_url:
        type: string

  message:
    collection: messages
    id:
      style: uuid
    fields:
      # In the path on every route that reaches this, and never repeated on
      # the object -- see the header. Missive's own property table has no
      # conversation_id at all.
      conversation_id:
        type: string
        in: "-"
      subject:
        type: string
        null_when_unset: true
      type:
        type: string
        default: email
      preview:
        type: string
      delivered_at:
        type: timestamp
      created_at:
        type: timestamp
      # HTML, inline, always -- see the header. Only absent from the list
      # shape, which this Recipe's list route enforces with returns below,
      # not with this field's own declaration.
      body:
        type: string
      # Each entry carries its own url. "Signed URL to download the file"
      # -- Missive's own words, no lifetime stated anywhere this task read.
      # See the header.
      attachments:
        type: list
        default: []

routes:
  - method: GET
    path: /v1/conversations
    resource: conversation
    operation: list
    pagination:
      # limit and until, from Missive's own reference: limit defaults to 25
      # here and caps at 50.
      #
      # until is a Unix timestamp rather than a token, and the caller
      # computes it from the last record of the page it just read -- see the
      # header for what that costs. cursor is the closest style this format
      # has; the name is right and the mechanism is approximate, which is
      # stated rather than smoothed over.
      # And Missive's own sentence, which nothing could say until now: "A
      # page may return more [items] than limit". The size is advice. A
      # client looping `while len(page) == limit` terminates on the first
      # page of 26 when it asked for 25 -- no error, nothing short, more
      # data than requested, and a partial collection reported as the whole
      # one. Declared, this fake serves one extra record on every page that
      # is not the last, so that loop breaks here instead.
      style: cursor
      limit: 25
      max_limit: 50
      limit_param: limit
      cursor_param: until
      may_overshoot: true

  - method: GET
    path: /v1/conversations/{id}
    resource: conversation
    operation: get
    # A single result, wrapped in an array under the same key the list uses
    # -- see the header. Xero's own device for the identical shape.
    envelope:
      style: wrapped
      key: conversations
      array: true

  - method: GET
    path: /v1/messages/{id}
    resource: message
    operation: get
    envelope:
      style: wrapped
      key: messages

  - method: GET
    path: /v1/conversations/{conversation_id}/messages
    resource: message
    operation: list
    pagination:
      # limit and until, from Missive's own reference -- and here the
      # default and the maximum are the same number, **10**. Two listings on
      # one provider, the same parameter name, and a ceiling on one that is
      # half the other's default: a client that walks conversations 50 at a
      # time and reuses the number on messages is silently answered with 10.
      #
      # until is a Unix timestamp rather than a token, and the caller
      # computes it from the last record of the page it just read -- see the
      # header for what that costs. cursor is the closest style this format
      # has; the name is right and the mechanism is approximate, which is
      # stated rather than smoothed over.
      # And the same overshoot Missive documents for both endpoints -- see
      # the conversations listing above. Here it lands next to a ceiling
      # equal to the default, so this route can answer both more and fewer
      # records than a caller asks for, depending on which side of ten the
      # number was.
      style: cursor
      limit: 10
      max_limit: 10
      limit_param: limit
      cursor_param: until
      may_overshoot: true
    scope: [conversation_id]
    # body is only ever sent by Get a Message -- Missive's own words. This
    # route answers without it, and without conversation_id, which is
    # already off the wire by declaration above.
    returns: [id, subject, type, preview, delivered_at, created_at, attachments]

  # Registered to show its own credential gate live, per the header. Not
  # modelled beyond that: a live inbox has no sandbox and this task never
  # drafted anything real.
  - method: POST
    path: /v1/drafts
    error: authentication_error

errors:
  authentication_error:
    status: 401
    message: Authentication token is invalid or has been revoked
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Cauldron passes "METHOD /path" into {detail} for a wrong-method miss
  # and only the path for an unrouted one; Missive's own message is
  # identical either way and never repeats the METHOD verb at all, so one
  # declaration serves both -- unlike justcall/recipe.yaml in this same
  # group, whose unrouted-path sentence does include the verb and needed a
  # separate, fixed one. The trailing reference id is a fresh value every
  # call and is asserted with a pattern below, never a literal string.
  unknown_route:
    status: 404
    message: "Invalid request URL. Reference: 00000000-0000-0000-0000-000000000000"

  method_not_allowed:
    status: 404
    message: "Invalid request URL. Reference: 00000000-0000-0000-0000-000000000000"

fixtures:
  empty: {}

  # Missive's own worked examples from GET /v1/messages/:id and List
  # conversations, quoted and typed as shown; not struck against a real
  # inbox -- see the header.
  small-inbox:
    conversation:
      - id: 6d3c9b1c-7067-4a28-8ea6-ea91340b67cc
        subject: null
        latest_message_subject: "Question?"
        created_at: 1654544954
        last_activity_at: 1654544954
        messages_count: 1
        attachments_count: 0
        web_url: "https://mail.missiveapp.com/#inbox/conversations/6d3c9b1c-7067-4a28-8ea6-ea91340b67cc"

    message:
      - id: 3fa4bcf5-e57e-47a4-9422-de2cce5f802e
        conversation_id: 6d3c9b1c-7067-4a28-8ea6-ea91340b67cc
        subject: A Message
        type: email
        preview: A message from Sam
        delivered_at: 1563806347
        created_at: 1563807320
        body: "<div>A message from Sam</div><br><img style=\"max-width: 100%\" alt=\"inline-image.png\" data-missive-attachment-id=\"81eed561-4908-4738-9a9f-2da886b1de43\">"
        attachments:
          - id: 81eed561-4908-4738-9a9f-2da886b1de43
            filename: inline-image.png
            extension: png
            url: "https://..."
            media_type: image
            sub_type: png
            size: 114615
            width: 668
            height: 996

conformance:
  - name: no credential at all
    source: https://public.missiveapp.com/v1/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/conversations
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error.message: Authentication token is invalid or has been revoked

  - name: a wrong credential gets the identical sentence, not a different one
    source: https://public.missiveapp.com/v1/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/conversations
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.message: Authentication token is invalid or has been revoked

  - name: an unrouted path answers 404 with no credential examined at all
    source: https://public.missiveapp.com/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
    expect:
      status: 404
      matches:
        error.message: "^Invalid request URL\\. Reference: "

  - name: a wrong method on a real path is the identical 404, not a distinct shape, and a credential changes nothing
    source: https://public.missiveapp.com/v1/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/conversations
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      matches:
        error.message: "^Invalid request URL\\. Reference: "
      absent:
        - Allow

  - name: creating a draft needs the same credential every other route does
    source: https://public.missiveapp.com/v1/drafts
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/drafts
    expect:
      status: 401
      body:
        error.message: Authentication token is invalid or has been revoked

  - name: a message's body is inline HTML, not a URL, not a second fetch
    source: https://missiveapp.com/docs/developers/rest-api/endpoints
    fixture: small-inbox
    request:
      method: GET
      path: /v1/messages/3fa4bcf5-e57e-47a4-9422-de2cce5f802e
      headers:
        Authorization: "Bearer missive_pat-cauldron00000000000000000000000000000000"
    expect:
      status: 200
      body:
        messages.body: "<div>A message from Sam</div><br><img style=\"max-width: 100%\" alt=\"inline-image.png\" data-missive-attachment-id=\"81eed561-4908-4738-9a9f-2da886b1de43\">"

  - name: an attachment is a signed URL with no stated lifetime
    source: https://missiveapp.com/docs/developers/rest-api/endpoints
    fixture: small-inbox
    request:
      method: GET
      path: /v1/messages/3fa4bcf5-e57e-47a4-9422-de2cce5f802e
      headers:
        Authorization: "Bearer missive_pat-cauldron00000000000000000000000000000000"
    expect:
      status: 200
      body:
        messages.attachments[0].id: 81eed561-4908-4738-9a9f-2da886b1de43
        messages.attachments[0].url: "https://..."

  - name: a single get wraps its result in an array under the same key the list uses
    source: https://missiveapp.com/docs/developers/rest-api/endpoints
    fixture: small-inbox
    request:
      method: GET
      path: /v1/conversations/6d3c9b1c-7067-4a28-8ea6-ea91340b67cc
      headers:
        Authorization: "Bearer missive_pat-cauldron00000000000000000000000000000000"
    expect:
      status: 200
      body:
        conversations[0].subject: null
        conversations[0].latest_message_subject: "Question?"

  - name: a listed message carries no conversation_id and no body
    source: https://missiveapp.com/docs/developers/rest-api/endpoints
    fixture: small-inbox
    request:
      method: GET
      path: /v1/conversations/6d3c9b1c-7067-4a28-8ea6-ea91340b67cc/messages
      headers:
        Authorization: "Bearer missive_pat-cauldron00000000000000000000000000000000"
    expect:
      status: 200
      body:
        messages[0].id: 3fa4bcf5-e57e-47a4-9422-de2cce5f802e
        messages[0].preview: A message from Sam
      absent:
        - messages[0].conversation_id
        - messages[0].body

  - name: the list envelope is a bare array under the resource's own plural name
    source: https://missiveapp.com/docs/developers/rest-api/endpoints
    fixture: small-inbox
    request:
      method: GET
      path: /v1/conversations
      headers:
        Authorization: "Bearer missive_pat-cauldron00000000000000000000000000000000"
    expect:
      status: 200
      body:
        conversations[0].id: 6d3c9b1c-7067-4a28-8ea6-ea91340b67cc
      absent:
        - data
        - results
