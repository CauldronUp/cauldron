# Radar Recipe for Cauldron
#
# Radar is the control for this group, and it is different in kind from the
# other two. Flexport and Bringg both move a shipment or a task through the
# world; Radar moves nothing. It is geofencing and geocoding -- it answers
# "where is this address" and "has this device entered a place I defined" --
# so the question this group exists to ask (what is the smallest unit of
# movement, and what does a status change attach to) does not have a
# shipment-shaped answer here at all. The thing that moves is a user's
# device, tracked by a POST to /v1/track, and the event is a geofence entry.
# There is no tracking number, no container, no task id -- only a device, an
# optional logged-in identity layered on top of it, and the geofences that
# device is currently standing inside.
#
# **Three identifiers for one moving thing, and only one of them is
# required.** Every case below cites api.radar.com/api directly (fetched
# 2026-09-01). A tracked entity carries deviceId ("used to identify logged
# out users"), an optional userId ("used with deviceId to identify logged in
# users. Not required for logged out users"), and Radar's own storage key,
# _id -- a Mongo-shaped 24-character hex string the caller never chooses and
# rarely sees, because every documented example addresses the record by
# userId or deviceId instead. The device is the one identifier this API
# cannot do without; the user is optional decoration on top of it. That is
# the literal shape of "the thing that moves is a device," not an inference
# from the product description.
#
# **Containment is a field, and the entry is documented as a value in a list
# beside it -- both at once, which is not the same answer this format's
# other Recipes give.** Radar's own worked example for POST /v1/track
# (docs.radar.com/api, the Track section, fetched 2026-09-01) returns three
# things in one body: meta, an events array, and a user object. The user
# object carries a "geofences" array -- documented in as many words as "which
# geofences currently contain them" -- with no separate status word anywhere
# on the record; a geofence is either in that array or it is not. The events
# array is the other half: each entry carries its own _id, a fixed type
# ("user.entered_geofence"), a createdAt, and the geofence it names, and nothing
# on the user object points back at any of them. So Radar keeps both
# mechanisms Cauldron's other providers usually choose between -- a
# containment *field* for "is it happening right now" and a *list* of named
# events for "what happened, and when" -- in the same response, answering
# each of this group's two framings at once rather than picking one.
#
# **The events array is not retained anywhere this Recipe could find, and it
# is not independently addressable.** No GET /v1/events or GET
# /v1/users/{userId} endpoint appears anywhere in the fetched reference
# page, and the only other POST named "events" in the same document is an
# unrelated conversion-logging endpoint ("name=conversion") documented with
# its own curl example carrying "Authorization: prj_live_pk_..." -- itself
# worth citing, because it is Radar's own worked example of the header this
# Recipe's auth section states from the live probes below: the credential
# travels in Authorization with no scheme word in front of it. Put
# together: the events a single POST /v1/track returns are handed back once,
# synchronously, in that one response, and Radar's documented way to learn
# about a later one is a webhook, not a query. History exists -- Radar's own
# dashboard shows it -- but this Recipe found no addressable API for it, and
# says so rather than inventing a route.
#
# **The credential really does travel in Authorization with no scheme
# word.** Checked live, 2026-09-01, against api.radar.io: a wrong value with
# no prefix ("Authorization: junktoken12345"), the same value with a stray
# "Bearer " glued on the front, and a value shaped exactly like Radar's own
# documented key format (prj_test_pk_...) all landed on the identical 47-byte
# body. Radar does not merely tolerate a bare header; every one of those
# probes proves the "Bearer " prefix is not part of what it reads at all --
# whatever comes after "Authorization: " is compared directly.
#
# **Absent and present-but-wrong are different verdicts, and the absent one
# is wrong about which key you need.** Checked live, 2026-09-01, on every
# route this Recipe could reach without an account -- /v1/geocode/forward,
# /v1/context, /v1/track, /v1/search/geofences, and /v1/search/users:
#
#   nothing sent at all         -> {"meta":{"code":401,"message":
#                                  "Unauthorized. Publishable API key
#                                  required."}}    (77 bytes, every route)
#   present, wrong, any shape   -> {"meta":{"code":401,"message":
#                                  "Unauthorized."}}                (47 bytes)
#
# The interesting part is which routes say the first sentence. Radar's own
# published reference (docs.radar.com/api, fetched 2026-09-01) documents
# /v1/search/users as requiring a Secret key -- "only safe to call
# server-side" -- and a Publishable key cannot call it at all, by design.
# Checked live: an unauthenticated GET to that same secret-only route
# answers "Unauthorized. Publishable API key required." -- the identical
# sentence a publishable-only route gives, telling a caller who is missing
# the *server-side* credential to go get the *client-side* one instead. The
# front door does not know, or does not say, which of the two kinds of key a
# route actually needs; it has exactly one absent-credential sentence and
# every route gets it.
#
# **Publishable and secret answer two different questions, per Radar's own
# words, and this Recipe can state the split without being able to verify
# the boundary live.** "Publishable keys can call endpoints marked
# Publishable... safe to call client-side... geocoding, routing, search, and
# tracking." "Secret keys can call endpoints marked Secret... only safe to
# call server-side" -- /v1/search/users is the example given. A publishable
# key answers "where is this address, and has this device entered this
# geofence" from inside a browser or a mobile app without leaking anything an
# attacker could turn into an account takeover; a secret key answers "who is
# this user, by their internal record" from a backend that already trusts
# itself. No account exists here and no key of either shape was ever held,
# so which specific sentence a wrong-capability key gets -- a publishable key
# calling a secret-only route -- was not checked, and this Recipe does not
# claim it.
#
# **Routing and method both resolve before the credential does.** Checked
# live, 2026-09-01: a path this Recipe made up, GET or POST, answers the
# identical Express default -- "Cannot GET /v1/nosuchroute12345",
# text/html, 404 -- with or without a credential attached. A real path with
# a method nothing registers -- PATCH or POST on /v1/geocode/forward, which
# only takes GET -- answers the same shape, same status, same framework
# fallback, also unchanged by whether a credential was sent. Nothing about
# either failure ever mentions a key. auth.after_routing: true below is
# earned by four separate live pairs (path x method x with/without a
# credential), not asserted from one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists and no key of either kind -- publishable or secret,
#     live or test -- was ever requested, guessed or used. Every 401 and
#     every 404 below was struck live and carries a verified date; the
#     track route's 200 is read from Radar's own published worked example
#     and carries none, because no key exists that could have called it.
#   - The events array Radar's own example shows alongside a track response
#     is quoted in full above and is not reproduced as a route below.
#     Cauldron's beside mechanism -- one endpoint, several named collections
#     in one body -- only wires into a list operation, and /v1/track is a
#     create; stamping the array as a route-level constant regardless of
#     what a caller sent would assert that every track call enters the same
#     geofence, which is not a claim this Recipe makes. The user resource
#     it does return carries an honestly empty geofences list when nothing
#     seeds it.
#   - country, state, dma, postalCode, beacons, fraud, segments, topChains
#     and place are all real, documented fields on the returned user object
#     and none of them are declared; this Recipe's fixture never triggers
#     the region-enrichment or fraud-detection features that would give any
#     of them a worked value to cite honestly.
#   - Geocoding (/v1/geocode/forward, /v1/geocode/reverse, /v1/geocode/ip),
#     context (/v1/context) and search (/v1/search/geofences,
#     /v1/search/users) are all real, all live-probed for their auth and
#     routing behaviour below, and none of them has a resource or a 200
#     route declared. Each needs a key this Recipe does not hold to see a
#     real success body, and Radar's docs page for this collection did not
#     yield a worked example precise enough to cite for any of them the way
#     it did for Track.
#   - No stable, independently fetchable OpenAPI description was found.
#     docs.radar.com/api is a hand-authored reference page, not a spec file
#     at a fixed URL, so upstream.spec is left unset rather than pointed at
#     something that cannot be refetched and fingerprinted.

recipe: radar
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.radar.com/api

auth:
  # Genuinely no scheme word -- see the header. Radar reads whatever comes
  # after "Authorization: " directly; a "Bearer " prefix glued onto a wrong
  # value was checked live and changes nothing about the answer.
  scheme: header
  header: Authorization
  keys:
    - prj_test_sk_cauldron00000000000000000000000000
  # The one verdict Radar answers differently, and it is not the one this
  # format's Absent/Malformed/Rejected split expects to be the informative
  # one: a request with nothing in the header at all gets a sentence naming
  # the wrong key type for every route this Recipe checked, including a
  # documented Secret-only one. rejected_error and malformed_error are left
  # unset on purpose -- every present-but-wrong value this Recipe sent,
  # prefixed or not, real-shaped or not, landed on the same generic
  # authentication_error below, and naming that collapse explicitly would
  # only repeat what leaving it unset already says.
  absent_error: missing_key
  after_routing: true

responses:
  resource:
    style: wrapped
    key: user
  error:
    style: nested
    key: meta
    message_field: message
    code_field: "-"
    # Radar's own meta.code is a bare echo of the HTTP status, on every
    # response this Recipe struck -- 401 on a failure, 200 on the one
    # success below -- not a separate error code the way AfterShip's or
    # Rootly's is. status_field is the field built for exactly that:
    # whatever the HTTP status was, repeated in the body.
    status_field: code
  success:
    fields:
      meta.code: 200

resources:
  # The moving thing itself: a device, optionally carrying a logged-in
  # user's identity on top of it. See the header for why deviceId is
  # required and userId is not, and why _id -- Radar's own storage key --
  # is the identifier every worked example in the fetched reference
  # addresses least often.
  user:
    id:
      # A Mongo-shaped ObjectId, per every _id this Recipe's citations show
      # (e.g. "56db1f4613012711002229f4"). Radar mints it; no documented
      # request ever supplies one.
      style: hex
      length: 24
    fields:
      userId:
        type: string
        null_when_unset: true
      deviceId:
        type: string
      live:
        type: boolean
        default: true
      stopped:
        type: boolean
        default: false
      foreground:
        type: boolean
        default: false
      deviceType:
        type: string
        null_when_unset: true
      # GeoJSON, per every location this Recipe's citations show:
      # {"type": "Point", "coordinates": [longitude, latitude]}.
      location:
        type: map
      locationAccuracy:
        type: integer
        null_when_unset: true
      # The containment field the header is about: which geofences hold
      # this device right now, with no separate status word anywhere on the
      # record to say so a second way. Empty rather than defaulted to the
      # cited example's populated list -- see the fidelity gaps for why
      # this Recipe will not stamp that array onto every create.
      geofences:
        type: list
        default: []
      updatedAt:
        type: datetime
      createdAt:
        type: datetime

routes:
  # These two are stubs, declared only so the engine's own auth-after-
  # routing gate has a real route to match -- see the header. Neither one
  # models a 200: no key exists here that could reach one honestly, and a
  # request that did present a valid credential would still answer this
  # same authentication_error, which is a gap in the emulator's coverage of
  # this path rather than a claim about the live one. Every conformance
  # case against these two is a credential or routing failure only.
  - method: GET
    path: /v1/geocode/forward
    error: authentication_error

  - method: GET
    path: /v1/search/users
    error: authentication_error

  - method: POST
    path: /v1/track
    resource: user
    operation: create
    # Radar's own reference states 200 for a successful track, not 201 --
    # this route is an upsert, not strictly a creation, and the status
    # reflects Radar's own word for it.
    status: 200
    returns:
      - id
      - userId
      - deviceId
      - live
      - stopped
      - foreground
      - deviceType
      - location
      - locationAccuracy
      - geofences
      - updatedAt
      - createdAt

errors:
  # The sentence every route on this host gives when nothing was sent at
  # all -- verified on a documented Publishable route and, separately, on a
  # documented Secret-only one, with the identical wording both times. See
  # the header: it names the wrong key type for the second case.
  missing_key:
    status: 401
    message: "Unauthorized. Publishable API key required."
    headers:
      Content-Type: "application/json; charset=utf-8"

  # What every present-but-wrong credential gets, whatever shape it was --
  # no prefix, a stray "Bearer " prefix, or a value shaped exactly like
  # Radar's own documented key format. authentication_error is this
  # Recipe's default, so malformed_error and rejected_error do not need to
  # repeat it.
  authentication_error:
    status: 401
    message: "Unauthorized."
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Express's own default handler, reached whether or not a credential was
  # sent -- see the header. {detail} is the request's own path; the verb is
  # not substitutable the same way, so this is pinned to GET, the one this
  # Recipe actually struck for an unrouted path.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Error</title>
      </head>
      <body>
      <pre>Cannot GET {detail}</pre>
      </body>
      </html>

  # The identical Express fallback, struck live for PATCH on a real path
  # that only takes GET. {detail} here is the runtime's own method+path
  # pair, not the bare path unknown_route gets -- see
  # internal/runtime/handler.go's two call sites for writeRecipeError, which
  # is why the two error entries in this file use the placeholder
  # differently rather than share one.
  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Error</title>
      </head>
      <body>
      <pre>Cannot {detail}</pre>
      </body>
      </html>

fixtures:
  empty: {}

conformance:
  - name: nothing sent at all is told to get a key it may not even need
    source: https://api.radar.io/v1/geocode/forward
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: "/v1/geocode/forward?query=20%20jay%20street%20brooklyn%20ny"
    expect:
      status: 401
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        meta.code: 401
        meta.message: "Unauthorized. Publishable API key required."

  - name: a documented Secret-only route gives the identical absent sentence
    # /v1/search/users is documented (docs.radar.com/api) as requiring a
    # Secret key -- a Publishable key cannot call it. The front door's
    # absent-credential message does not know that: it names the wrong key
    # type here exactly as it does on a Publishable route.
    source: https://api.radar.io/v1/search/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/search/users
    expect:
      status: 401
      body:
        meta.message: "Unauthorized. Publishable API key required."

  - name: a wrong credential with no scheme word is a shorter, different sentence
    source: https://api.radar.io/v1/geocode/forward
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: "/v1/geocode/forward?query=test"
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        meta.code: 401
        meta.message: "Unauthorized."

  - name: gluing a Bearer prefix on top changes nothing -- there is no scheme to strip
    source: https://api.radar.io/v1/geocode/forward
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: "/v1/geocode/forward?query=test"
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      body:
        meta.message: "Unauthorized."

  - name: a value shaped exactly like a real key is still just wrong
    source: https://api.radar.io/v1/geocode/forward
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: "/v1/geocode/forward?query=test"
      headers:
        Authorization: "prj_test_pk_0000000000000000000000000000000000"
    expect:
      status: 401
      body:
        meta.message: "Unauthorized."

  - name: an unrouted path 404s the same with or without a credential
    source: https://api.radar.io/v1/nosuchroute12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute12345
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "Cannot GET /v1/nosuchroute12345"

  - name: and a credential attached to that same unrouted path changes nothing
    source: https://api.radar.io/v1/nosuchroute12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute12345
      headers:
        Authorization: junktoken12345
    expect:
      status: 404
      body_matches: "Cannot GET /v1/nosuchroute12345"

  - name: a method a real path does not take 404s rather than 405, no credential needed
    source: https://api.radar.io/v1/geocode/forward
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/geocode/forward
    expect:
      status: 404
      body_matches: "Cannot PATCH /v1/geocode/forward"

  - name: tracking a device mints a record from the request, not a fixture
    # deviceId, userId, latitude, longitude and accuracy are the exact
    # values in Radar's own sample curl for this endpoint
    # (docs.radar.com/api, the Track section). No key exists here that
    # could call this live, so it carries no verified date -- geofences is
    # honestly empty rather than stamped with the cited example's populated
    # array; see the fidelity gaps for why.
    source: https://docs.radar.com/api
    fixture: empty
    request:
      method: POST
      path: /v1/track
      headers:
        Authorization: prj_test_sk_cauldron00000000000000000000000000
      json:
        deviceId: C305F2DB-56DC-404F-B6C1-BC52F0B680D8
        userId: "1"
        latitude: 40.78382
        longitude: -73.97536
        accuracy: 65
    expect:
      status: 200
      body:
        meta.code: 200
        user.deviceId: C305F2DB-56DC-404F-B6C1-BC52F0B680D8
        user.userId: "1"
        user.geofences: []

  # The names. This Recipe declares 8 field(s) on an user that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "an user carries the field names this Recipe declares"
    source: "https://docs.radar.com/api"
    fixture: empty
    request:
      method: POST
      path: "/v1/track"
      json:
        deviceId: C305F2DB-56DC-404F-B6C1-BC52F0B680D8
        userId: '1'
        latitude: 40.78382
        longitude: -73.97536
        accuracy: 65
      headers:
        "Authorization": "prj_test_sk_cauldron00000000000000000000000000"
    expect:
      status: 200
      body:
        "user.createdAt": "2026-01-01T00:00:00Z"
        "user.foreground": false
        "user.live": true
        "user.stopped": false
        "user.updatedAt": "2026-01-01T00:00:00Z"

