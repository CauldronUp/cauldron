# Permit.io Recipe for Cauldron
#
# The projects listing, read from the OpenAPI document Permit serves without a
# credential at api.permit.io/openapi.json, and struck live on 2026-09-13 with
# no credential and with a deliberately invalid one.
#
# **The document declares two responses and neither is the one you get first.**
# `GET /v2/projects` lists `200` and `422` -- a success and a validation error
# -- on an API that answers 401 to every request arriving without a token. The
# only failure in the contract is the one a well-formed request cannot cause.
#
# **The failure mentions a login cookie.** Struck live:
#
#   (no header)      401 {"detail":"An authorization header or login cookie is required"}
#   Bearer notreal   401 {"detail":"Invalid credentials"}
#
# A browser session, named to a caller that has no browser -- and the two
# sentences share one key and nothing else, so a client cannot branch on
# anything but the text.
#
# **A regular expression that anchors nothing.** `urn_namespace` is declared
# `pattern: "[a-z0-9-]{2,}"`. There is no `^` and no `$`, and a pattern in JSON
# Schema is a *search*, not a match -- so `Not A Namespace At All!` satisfies it
# on the strength of the `ot` in the middle. The field that exists to constrain
# a namespace constrains nothing a caller would get wrong.
#
# **Every property carries a title that is its own name.** `"title": "Urn
# Namespace"` on `urn_namespace`, `"title": "Id"` on `id`, `"title": "Created
# At"` on `created_at` -- the field name with its underscores turned into
# spaces and each word capitalised, generated by the framework and shipped in
# the published contract. Ten properties, ten titles, no information.
#
# **And the success schema's own title is a sentence about the operation.**
# `"title": "Response List Projects V2 Projects Get"` -- the handler name and the
# path, Title Cased, as the name of the response type. A generated client makes
# a class out of it.
#
# **Two identifiers, and the one you query by is not the primary one.** `id` is
# a uuid and `key` is "a URL-friendly name of the project (i.e: slug). You will
# be able to query later by this key" -- so the field that addresses a project
# is the slug, and the uuid is the one that never appears in a path.
#
# **The listing pages and says nothing about the pages.** `page` and `per_page`
# are declared parameters and the response is a bare array: no total, no next,
# no count. A caller asks for page two and finds out there was nothing there by
# receiving nothing.

recipe: permit
capability: auth
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://api.permit.io/redoc
  spec: https://api.permit.io/openapi.json
  spec_hash: 3880557f3cdfa7cb27b0194f4837996d56fb727546b9e11ba11702155a0a4fe2
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - permit_key_cauldr0nf1xture000000000000
  absent_error: authorization_required
  rejected_error: invalid_credentials
  after_routing: true

responses:
  list:
    # A bare array, under parameters that page it.
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  project:
    id:
      field: id
      style: uuid
    fields:
      # The slug, which is what a path takes -- the uuid above never appears
      # in one.
      key:
        type: string
      name:
        type: string
      description:
        type: string
      organization_id:
        type: string
      settings:
        type: map
      created_at:
        type: datetime
      updated_at:
        type: datetime
      # Constrained by a pattern that is not anchored, so it constrains
      # nothing.
      urn_namespace:
      active_policy_repo_id:

routes:
  - method: GET
    path: /v2/projects
    resource: project
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 30
      limit_param: per_page
      cursor_param: page

errors:
  authorization_required:
    status: 401
    # A browser session, named to a caller that has no browser.
    message: An authorization header or login cookie is required

  invalid_credentials:
    status: 401
    message: Invalid credentials

fixtures:
  empty:
    project: []

  workspace:
    project:
      - id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        key: default
        name: Default Project
        description: The project every account starts with.
        organization_id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        settings: {}
        created_at: "2026-01-15T09:30:00+00:00"
        updated_at: "2026-06-02T14:12:05+00:00"
        urn_namespace: default
        active_policy_repo_id: null
      - id: b8f9b663-0a3b-cf45-587a-be880946e881
        key: staging
        name: Staging
        description: ""
        organization_id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        settings: {}
        created_at: "2026-04-02T11:05:00+00:00"
        updated_at: "2026-04-02T11:20:00+00:00"
        # A value the declared pattern would accept, and so would almost
        # anything else.
        urn_namespace: null
        active_policy_repo_id: 57350688-5a28-49d1-b5a9-086ae0d4c0d2

conformance:
  - name: a missing credential mentions a login cookie
    source: https://api.permit.io/v2/projects
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers: {}
    expect:
      # Undeclared: this operation lists 200 and 422 and nothing else.
      status: 401
      body:
        # A browser session, named to a caller that has no browser.
        detail: An authorization header or login cookie is required

  - name: a wrong credential shares the key and nothing else
    source: https://api.permit.io/v2/projects
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Two sentences, one key, and nothing to branch on but the text.
        detail: Invalid credentials

  - name: the identifier a path takes is the slug
    source: https://api.permit.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer permit_key_cauldr0nf1xture000000000000"
    expect:
      status: 200
      body:
        # "You will be able to query later by this key" -- while the uuid
        # beside it never appears in a path.
        '[0].key': default
        '[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        '[0].name': Default Project

  - name: the unanchored pattern accepts anything
    source: https://api.permit.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer permit_key_cauldr0nf1xture000000000000"
    expect:
      status: 200
      body:
        # pattern "[a-z0-9-]{2,}" with no ^ or $, on a field whose whole job
        # is to constrain a namespace.
        '[0].urn_namespace': default
        '[1].urn_namespace': null

  - name: a project carries its organisation and its policy repository
    source: https://api.permit.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer permit_key_cauldr0nf1xture000000000000"
    expect:
      status: 200
      body:
        '[0].organization_id': 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        '[1].active_policy_repo_id': 57350688-5a28-49d1-b5a9-086ae0d4c0d2
        '[0].active_policy_repo_id': null
        '[0].settings': {}
        '[0].description': The project every account starts with.
        '[1].description': ""
        '[0].created_at': "2026-01-15T09:30:00+00:00"
        '[0].updated_at': "2026-06-02T14:12:05+00:00"

  - name: the listing pages and says nothing about the pages
    source: https://api.permit.io/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer permit_key_cauldr0nf1xture000000000000"
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        # A bare array, so no total, no next and no count: asking for a page
        # past the end is how a caller learns there is no page past the end.
        '[0].key': staging
        '[0].name': Staging

  - name: an account with no projects answers an empty array
    source: https://api.permit.io/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Bearer permit_key_cauldr0nf1xture000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
