# Open Food Facts Recipe for Cauldron
#
# A product that is not there is a 200 with status 0.
#
#   GET /api/v2/product/4061458000000
#   ->  200  {"code": "4061458000000", "status": 0,
#            "status_verbose": "product not found"}
#
# The HTTP status says it worked and the truth is a number in the body, so
# response.ok is true and there is no product key at all -- meaning
# body.product.product_name throws a TypeError on the answer the request was
# most likely to get. And status 0 has more than one cause:
# "no code or invalid code" is the other message under the same number, so a
# client branching on the number cannot tell a barcode that does not exist from
# a barcode it should not have sent.
#
# **And the code you sent is not always the code that comes back.** Asking for
# 0000000000000 -- thirteen zeros, the shape of an EAN-13 -- answers with
# "code": "00000000". Eight. The service normalised the barcode and echoed
# something the caller never sent, and there is no field anywhere recording what
# was asked for.
#
# Written against the live API rather than a document: every case below was
# checked against world.openfoodfacts.org on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. energy is kilojoules. The same object carries energy: 2252 and
#      energy-kcal: 539, and the unqualified name is the kJ figure, so a client
#      reading energy and labelling it calories is out by a factor of 4.18.
#   2. Every nutriment is repeated. fat, fat_100g, fat_value and fat_unit are
#      four keys for one number and its unit, and energy has twelve of them --
#      energy, energy_100g, energy_unit, energy_value, and the same four again
#      for -kcal and for -kj.
#   3. The key names mix separators: added-sugars_100g has a hyphen inside the
#      nutrient name and an underscore before the qualifier, in one key.
#   4. brands is a comma-joined string rather than a list, and it is
#      crowd-sourced: "Nutella, Ferrero, Yum yum" on the reference product.
#      Splitting on ", " is the only way in, and one of the three is not a
#      brand.
#   5. nutriments_estimated is a parallel object of the same nutrients,
#      computed rather than declared, keyed identically and sitting beside the
#      real one with nothing inside either saying which is which.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The database is served rather than searched. /api/v2/search takes tag and
#     nutrient filters and this Recipe answers with the products its fixture
#     holds.
#   - Without ?fields= a product comes back with several hundred keys, most of
#     them *_tags and *_hierarchy arrays. The fixture holds the subset the
#     cases turn on and says so; the count is the finding, not the contents.
#   - nutriments holds twelve of its fifty-two keys and nutriments_estimated
#     three of its thirty-five.
#   - The world. subdomain is served. The per-country subdomains answer the
#     same paths with localised fields, and the v0 API is a different envelope
#     again.
#
# The products below are public and were recorded on the date in the cases.

recipe: openfoodfacts
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://openfoodfacts.github.io/openfoodfacts-server/api/

auth:
  # Public for reading.
  scheme: none

responses:
  resource:
    # code, status and status_verbose beside the product.
    style: wrapped
    key: product
  error:
    style: flat
    message_field: status_verbose
    fields:
      # The truth, as a number in the body of a 200.
      status: 0

resources:
  product:
    id:
      style: opaque
      field: code
    fields:
      product_name:
        type: string
      # A comma-joined string, crowd-sourced.
      brands:
        type: string
      # Empty, on a product with a size on the jar.
      quantity:
        type: string
      nutriscore_grade:
        type: string
      nutrition_data:
        type: string
      nutrition_data_prepared_per:
        type: string
      # Twelve keys for energy alone, and the unqualified one is kilojoules.
      nutriments:
        type: map
      # The same nutrients again, computed rather than declared.
      nutriments_estimated:
        type: map

routes:
  - method: GET
    path: /api/v2/product/{id}
    resource: product
    operation: get
    not_found: product_missing
    fields:
      # 1 when it worked. The HTTP status is 200 either way, so this number is
      # the only thing that distinguishes a hit from a miss.
      status: 1
      status_verbose: product found

errors:
  # A 200. The status number is the only thing that says otherwise.
  product_missing:
    status: 200
    message: product not found

fixtures:
  empty: {}

  shelf:
    product:
      - id: "3017620422003"
        product_name: Nutella
        # Three names, comma-joined, and one of them is not a brand.
        brands: Nutella, Ferrero, Yum yum
        # Empty, on a jar that says 400 g.
        quantity: ""
        nutriscore_grade: e
        nutrition_data: "on"
        nutrition_data_prepared_per: 100g
        nutriments:
          # Twelve keys for one quantity, and the unqualified name is the
          # kilojoule figure.
          energy: 2252
          energy_100g: 2252
          energy_unit: kJ
          energy_value: 2252
          energy-kcal: 539
          energy-kcal_100g: 539
          energy-kcal_unit: kcal
          energy-kcal_value: 539
          energy-kj: 2252
          energy-kj_100g: 2252
          energy-kj_unit: kJ
          energy-kj_value: 2252
          # Four keys for one number and its unit.
          fat: 30.9
          fat_100g: 30.9
          fat_unit: g
          fat_value: 30.9
          sugars: 56.3
          sugars_100g: 56.3
          sugars_unit: g
          sugars_value: 56.3
          salt: 0.107
          salt_100g: 0.107
          salt_unit: g
          salt_value: 0.107
          # A hyphen inside the nutrient name and an underscore before the
          # qualifier, in one key.
          added-sugars: 52.13
          added-sugars_100g: 52.13
          added-sugars_unit: g
          added-sugars_value: 52.13
        nutriments_estimated:
          # Computed rather than declared, keyed the same way, and nothing in
          # either object says which is which.
          sucrose_100g: 52.711217
          water_100g: 1.448196
          starch_100g: 0.63205

conformance:
  - name: a product that is not there is a 200 with status zero
    source: https://world.openfoodfacts.org/api/v2/product/4061458000000
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/4061458000000
    expect:
      # response.ok is true, there is no product key at all, and
      # body.product.product_name throws on the answer a scan is most likely
      # to get.
      status: 200
      body:
        status: 0
        status_verbose: product not found
      absent:
        - product

  - name: a product that is there says so with the same fields
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # 1 rather than 0, and the same 200 either way.
        status: 1
        status_verbose: product found
        "product.product_name": Nutella
        "product.code": "3017620422003"

  - name: energy is kilojoules and the calories are beside it
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # A client reading energy and labelling it calories is out by 4.18.
        "product.nutriments.energy": 2252
        "product.nutriments.energy-kcal": 539
        "product.nutriments.energy_unit": kJ
        "product.nutriments.energy-kcal_unit": kcal

  - name: every nutriment is repeated under four keys
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # One number, one unit, four keys -- and energy has twelve.
        "product.nutriments.fat": 30.9
        "product.nutriments.fat_100g": 30.9
        "product.nutriments.fat_value": 30.9
        "product.nutriments.fat_unit": g
        "product.nutriments.sugars": 56.3
        "product.nutriments.salt": 0.107

  - name: the key names mix hyphens and underscores
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # A hyphen inside the nutrient name and an underscore before the
        # qualifier, in one key.
        "product.nutriments.added-sugars": 52.13
        "product.nutriments.added-sugars_100g": 52.13
        "product.nutriments.energy-kj_value": 2252

  - name: brands is a comma-joined string and one of them is not a brand
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # Splitting on ", " is the only way in, and the data is crowd-sourced.
        "product.brands": Nutella, Ferrero, Yum yum
        # Empty, on a jar that says 400 g.
        "product.quantity": ""
        "product.nutriscore_grade": e

  - name: the estimated nutrients sit beside the declared ones
    source: https://world.openfoodfacts.org/api/v2/product/3017620422003
    verified: "2026-08-28"
    fixture: shelf
    request:
      method: GET
      path: /api/v2/product/3017620422003
    expect:
      status: 200
      body:
        # Computed rather than declared, keyed identically, and nothing inside
        # either object says which is which.
        "product.nutriments_estimated.sucrose_100g": 52.711217
        "product.nutriments_estimated.water_100g": 1.448196
      absent:
        - product.nutriments.sucrose_100g

  # The names. This Recipe declares 2 field(s) on a product that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a product carries the field names this Recipe declares"
    source: "https://world.openfoodfacts.org/api/v2/product/4061458000000"
    fixture: shelf
    request:
      method: GET
      path: "/api/v2/product/3017620422003"
    expect:
      status: 200
      body:
        "product.nutrition_data": "on"
        "product.nutrition_data_prepared_per": "100g"

