# Cal.com Recipe for Cauldron
#
# The profile endpoint, read from the OpenAPI document Cal.com publishes at
# cal.com/docs/api-reference/v2/openapi.json, and struck live against
# api.cal.com on 2026-09-13 with no credential, with a wrong key, on a path
# that does not exist, and with a method the path does not take.
#
# **Every failure says the same sentence twice.** Struck live:
#
#   {"status":"error","timestamp":"...","path":"/v2/me","error":{
#     "code":"UnauthorizedException",
#     "message":"ApiAuthStrategy - api key - Your api key is not valid",
#     "details":{
#       "message":"ApiAuthStrategy - api key - Your api key is not valid",
#       "error":"Unauthorized","statusCode":401}}}
#
# `error.message` and `error.details.message` are byte-identical on every
# failure checked, so the prose is in the body twice, four levels deep.
#
# **And the status is in it three ways.** `error.code` is a class name with
# `Exception` appended; `error.details.error` is HTTP's reason phrase; and
# `error.details.statusCode` is the number -- beside a status line that already
# said it.
#
# **The message begins with the name of the class that raised it.**
# `ApiAuthStrategy - api key - Your api key is not valid`: the guard's class
# name, then which branch of it ran, then the sentence, joined by
# space-hyphen-space.
#
# **A wrong method is a NotFoundException.** `PUT /v2/me` answers
# `"code":"NotFoundException"` with `"Cannot PUT /v2/me"` -- the path that does
# exist, reported missing, under a code named after a 404.
#
# **The anonymous failure teaches the whole auth contract.** "Either pass an API
# key as 'Bearer' header or OAuth client credentials as 'x-cal-secret-key' and
# 'x-cal-client-id' headers" -- three header names, in a message, on an API
# whose published document declares no `securitySchemes` at all.
#
# **The document declares no servers either.** `servers` is `[]`, so a generated
# client has an operation for each of its 228 paths and no address to send them
# to.
#
# **And `/v2/me` declares one response, the 200.** Not the 401 every anonymous
# caller meets, not the 404 a typo meets -- so drift reports all four of this
# Recipe's failures as unbacked, and each report is right.
#
# **`status` is an enum of `["success", "error"]` on the success envelope.** The
# same key carries the same two values on failures, so `status` is not what
# tells them apart -- and a 200 may legally say `"error"`.
#
# **`timeFormat` is a number.** Twelve or twenty-four, as an integer, on a field
# whose name says format.
#
# Also pinned: twelve fields are `required` on the profile and none is declared
# nullable -- including `bio`, `avatarUrl` and `organizationId`, which a
# personal account has none of; and the operation is `MeController_getMe`, the
# controller class and the method name joined by an underscore.

recipe: cal
capability: scheduling
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://cal.com/docs/api-reference/v2/introduction
  spec: https://cal.com/docs/api-reference/v2/openapi.json
  spec_hash: 1bf0a48e37f37b9a09339ee7c70370b4dbb1e85815eca6a370284e343891e876
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cal_cauldr0nf1xturek3y00000000000000
  absent_error: no_authentication_method
  rejected_error: api_key_not_valid
  malformed_error: no_authentication_method
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    collapse_single: true
    fields:
      # The same key, and the same two values, as every failure carries.
      status: success
  error:
    style: nested
    key: error
    message_field: message
    # A class name with Exception appended.
    code_field: code
    fields:
      status: error

resources:
  profile:
    id:
      field: id
      style: numeric
      type: number
    fields:
      username:
        type: string
      email:
        type: string
      name:
        type: string
      # Required, and not declared nullable.
      avatarUrl:
        type: string
      bio:
        type: string
      # Twelve or twenty-four, as an integer.
      timeFormat:
        type: integer
      defaultScheduleId:
        type: integer
      weekStart:
        type: string
      timeZone:
        type: string
      locale:
        type: string
      organizationId:
        type: integer

routes:
  - method: GET
    path: /v2/me
    resource: profile
    operation: list
    pagination:
      style: none

errors:
  no_authentication_method:
    status: 401
    # The class that raised it, with Exception appended.
    code: UnauthorizedException
    # The guard's class name, the branch, and then the sentence.
    message: "ApiAuthStrategy - No authentication method provided. Either pass an API key as 'Bearer' header or OAuth client credentials as 'x-cal-secret-key' and 'x-cal-client-id' headers"
    fields:
      timestamp: "2026-09-14T01:31:15.092Z"
      path: /v2/me
      # The same sentence again, four levels down.
      error.details.message: "ApiAuthStrategy - No authentication method provided. Either pass an API key as 'Bearer' header or OAuth client credentials as 'x-cal-secret-key' and 'x-cal-client-id' headers"
      # The reason phrase, and the number, beside a status line that said both.
      error.details.error: Unauthorized
      error.details.statusCode: 401

  api_key_not_valid:
    status: 401
    code: UnauthorizedException
    message: ApiAuthStrategy - api key - Your api key is not valid
    fields:
      timestamp: "2026-09-14T01:31:15.267Z"
      path: /v2/me
      error.details.message: ApiAuthStrategy - api key - Your api key is not valid
      error.details.error: Unauthorized
      error.details.statusCode: 401

  unknown_route:
    status: 404
    code: NotFoundException
    message: Cannot GET {detail}
    fields:
      timestamp: "2026-09-14T01:31:15.622Z"
      path: "{detail}"
      error.details.message: Cannot GET {detail}
      error.details.error: Not Found
      error.details.statusCode: 404

  method_not_allowed:
    # The path that does exist, under a code named after a 404.
    status: 404
    code: NotFoundException
    message: Cannot PUT /v2/me
    fields:
      timestamp: "2026-09-14T01:31:15.842Z"
      path: /v2/me
      error.details.message: Cannot PUT /v2/me
      error.details.error: Not Found
      error.details.statusCode: 404

fixtures:
  empty:
    profile: []

  account:
    profile:
      - id: 4127
        username: a-person
        email: person@example.com
        name: A. Person
        avatarUrl: https://cal.com/api/avatar/4127.png
        bio: ""
        # An integer, on a field whose name says format.
        timeFormat: 24
        defaultScheduleId: 88213
        weekStart: Monday
        timeZone: Europe/London
        locale: en
        organizationId: 0

conformance:
  - name: every failure says the same sentence twice
    source: https://api.cal.com/v2/me
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/me
      headers:
        Authorization: "Bearer cal_notarealkey"
    expect:
      status: 401
      body:
        # Once here...
        error.message: ApiAuthStrategy - api key - Your api key is not valid
        # ...and again, four levels down.
        error.details.message: ApiAuthStrategy - api key - Your api key is not valid
        # And the status three ways: a class name, a reason phrase, a number.
        error.code: UnauthorizedException
        error.details.error: Unauthorized
        error.details.statusCode: 401
        status: error
        path: /v2/me

  - name: the anonymous failure teaches the whole auth contract
    source: https://api.cal.com/v2/me
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/me
      headers: {}
    expect:
      status: 401
      body:
        # Three header names, in a message, on an API whose document declares
        # no securitySchemes at all.
        error.message: "ApiAuthStrategy - No authentication method provided. Either pass an API key as 'Bearer' header or OAuth client credentials as 'x-cal-secret-key' and 'x-cal-client-id' headers"
        error.code: UnauthorizedException
        error.details.statusCode: 401

  - name: an unrouted path is a NotFoundException that quotes the verb
    source: https://api.cal.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        error.code: NotFoundException
        error.message: Cannot GET /v2/cauldron-nope
        error.details.message: Cannot GET /v2/cauldron-nope
        error.details.error: Not Found
        path: /v2/cauldron-nope

  - name: and a wrong method on a real path is the same exception
    source: https://api.cal.com/v2/me
    verified: "2026-09-13"
    fixture: account
    request:
      method: PUT
      path: /v2/me
      headers: {}
    expect:
      status: 404
      body:
        # The path that does exist, reported missing.
        error.code: NotFoundException
        error.message: Cannot PUT /v2/me
        error.details.statusCode: 404
        path: /v2/me

  - name: status is the same key and the same values on both sides
    source: https://cal.com/docs/api-reference/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me
      headers:
        Authorization: "Bearer cal_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # enum ["success", "error"] on the success envelope, so a 200 may
        # legally say "error" and status is not what tells them apart.
        status: success
        'data.id': 4127
        'data.username': a-person

  - name: a time format is a number
    source: https://cal.com/docs/api-reference/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me
      headers:
        Authorization: "Bearer cal_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # Twelve or twenty-four, as an integer.
        'data.timeFormat': 24
        'data.weekStart': Monday
        'data.timeZone': Europe/London
        'data.locale': en
        'data.defaultScheduleId': 88213

  - name: twelve required fields and none of them nullable
    source: https://cal.com/docs/api-reference/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me
      headers:
        Authorization: "Bearer cal_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # bio, avatarUrl and organizationId are required and not declared
        # nullable, on an account that has none of them.
        'data.bio': ""
        'data.organizationId': 0
        'data.avatarUrl': https://cal.com/api/avatar/4127.png
        'data.email': person@example.com
        'data.name': A. Person
