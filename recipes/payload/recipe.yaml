# Payload CMS Recipe for Cauldron
#
# The collection listing, struck live on 2026-09-14 against payloadcms.com --
# Payload's own website, whose REST API answers without a credential -- on a
# collection that does not exist, with a method the path does not take, with a
# delete, on a document that does not exist, on a malformed identifier, and on
# a page past the end.
#
# **Nine paging fields, and three of them say the same thing.** The envelope is
#
#   docs, totalDocs, limit, totalPages, page, pagingCounter,
#   hasPrevPage, hasNextPage, prevPage, nextPage
#
# `hasNextPage: true`, `nextPage: 2`, and `page < totalPages` are one fact
# written three ways, and `pagingCounter` is the one-based index of the first
# record on the page, which is `(page - 1) * limit + 1` and is sent anyway.
#
# **And a page past the end is reported as if it existed.** Struck live with
# `?limit=1&page=9999` against a collection of 116:
#
#   {"docs":[],"totalDocs":116,"limit":1,"totalPages":116,"page":9999,
#    "pagingCounter":9999,"hasPrevPage":true,"hasNextPage":false,
#    "prevPage":9998,"nextPage":null}
#
# `page` is 9999, `pagingCounter` is 9999, and `prevPage` is 9998 -- a previous
# page that does not exist either, offered to a caller who has walked off the
# end.
#
# **Two error envelopes, on the same status, from the same API.** Struck live:
#
#   GET /api/cauldron-nope   404 {"message":"Route not found \"/api/cauldron-nope\""}
#   PUT /api/posts           404 {"message":"Route not found \"/api/posts\""}
#   GET /api/posts/000…000   404 {"errors":[{"message":"Not Found"}]}
#
# A bare `message` on one, an `errors` array on the other. And a verb the path
# does not take is reported as the *path* not being found, with the path quoted
# inside the sentence -- so the JSON carries escaped quotes around a value that
# could have been a field.
#
# **A malformed identifier is a 404, not a 400.** `GET /api/posts/not-an-objectid`
# answers the same "Not Found" as a well-formed id that is not there, so a
# client cannot tell a bug in its own code from a document that was deleted.
#
# **An unauthenticated DELETE reaches body validation.** `DELETE /api/posts`
# with no credential answers `400 {"errors":[{"message":"Missing 'where' query
# of documents to delete."}]}` -- a sentence explaining how to phrase a bulk
# delete, to a caller who has not identified themselves.
#
# **A field's value is the name of another field.** `featuredMedia` is
# `"videoUrl"`, and the record carries both `image: null` and a populated
# `videoUrl`. The discriminator is a field name, in a string, resolved by the
# reader.
#
# **The content is an editor's internal state.** `excerpt` and `content` are
# Lexical documents -- `{"root":{"children":[{"detail":0,"format":0,"mode":
# "normal",...}]}}` -- so the API's representation of prose is the shape one
# particular editor keeps in memory, `detail` and `format` integers included.
#
# **And a content field contains a component tag.** `addToDocs` is the string
# `<Resource id="6aa2f41763d0ba1d0ceeb5ee" />` -- JSX, as data, waiting for
# something downstream to parse and render it.
#
# Also pinned: `id` is the last key of the record and `createdAt` and
# `updatedAt` are the first two, so the identifier arrives after every piece of
# content; `_status` carries an underscore among eighteen fields that do not;
# `guestSocials` is `{}` rather than null; and `/api/users` on this deployment
# answers 200 to anyone, names and photographs included, which is a
# configuration choice rather than a property of Payload.

recipe: payload
capability: cms
version: 0.1.0

upstream:
  api: v3
  docs: https://payloadcms.com/docs/rest-api/overview

auth:
  # This deployment answers reads to anyone.
  scheme: none

responses:
  list:
    style: wrapped
    key: docs
    count_field: totalDocs
    limit_field: limit
    pages_field: totalPages
    page_field: page
    has_more_field: hasNextPage
    prev_field: prevPage
    cursor_field: nextPage
    cursor_null: true
    # Page numbers, not tokens.
    cursor_number: true
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  post:
    id:
      field: id
      style: hex
      length: 24
    fields:
      createdAt:
        type: string
      updatedAt:
        type: string
      title:
        type: string
      slug:
        type: string
      # A field whose value is the name of another field.
      featuredMedia:
        type: string
      image:
      videoUrl:
      # An editor's internal document tree.
      excerpt:
        type: map
      content:
        type: list
      authors:
        type: list
      # Empty object rather than null.
      guestSocials:
        type: map
      publishedOn:
        type: string
      # JSX, as a string, in a content field.
      addToDocs:
        type: string
      # An underscore, among fields that have none.
      _status:
        type: string

routes:
  - method: GET
    path: /api/posts
    resource: post
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 10
      limit_param: limit
      cursor_param: page

  - method: GET
    path: /api/posts/{id}
    resource: post
    operation: get
    not_found: not_found

errors:
  # The path, quoted, inside the sentence.
  unknown_route:
    status: 404
    message: 'Route not found "{detail}"'

  # A verb the path does not take, reported as the path not being found.
  method_not_allowed:
    status: 404
    message: 'Route not found "/api/posts"'

  # A second envelope, on the same status.
  not_found:
    status: 404
    style: list
    key: errors
    message: Not Found

fixtures:
  empty:
    post: []

  blog:
    post:
      - id: 6aa2f41763d0ba1d0ceeb5ee
        createdAt: "2026-09-10T18:16:55.896Z"
        updatedAt: "2026-09-10T18:23:59.507Z"
        title: A post with a video
        slug: a-post-with-a-video
        # The name of another field on this record.
        featuredMedia: videoUrl
        image: null
        videoUrl: https://example.com/watch/abc123
        excerpt:
          root:
            children:
              - children:
                  - detail: 0
                    format: 0
                    mode: normal
                    text: A short summary.
                    type: text
                type: paragraph
            type: root
        content:
          - blockType: blogContent
            blogContentFields:
              settings: {}
        authors:
          - firstName: Dana
            lastName: Okoye
        guestSocials: {}
        publishedOn: "2026-09-10T18:00:00.000Z"
        # A component tag, as data.
        addToDocs: '<Resource id="6aa2f41763d0ba1d0ceeb5ee" />'
        _status: published
      - id: 71b4c8d2e5f309a6b7c1d248
        createdAt: "2026-08-21T09:02:11.000Z"
        updatedAt: "2026-09-01T17:44:30.000Z"
        title: A post with a picture
        slug: a-post-with-a-picture
        # The other branch of the same discriminator.
        featuredMedia: image
        image:
          alt: A diagram
          url: https://example.com/media/diagram.png
        videoUrl: null
        excerpt:
          root:
            children: []
            type: root
        content: []
        authors:
          - firstName: Sam
            lastName: Ruiz
        guestSocials: {}
        publishedOn: "2026-08-21T09:05:00.000Z"
        addToDocs: ""
        _status: published

conformance:
  - name: a collection that does not exist quotes the path in the sentence
    source: https://payloadcms.com/api/cauldron-nope
    verified: "2026-09-14"
    fixture: blog
    request:
      method: GET
      path: /api/cauldron-nope
    expect:
      status: 404
      body:
        # Escaped quotes around a value that could have been a field.
        message: 'Route not found "/api/cauldron-nope"'

  - name: and a verb the path does not take is reported as a missing path
    source: https://payloadcms.com/api/posts
    verified: "2026-09-14"
    fixture: blog
    request:
      method: PUT
      path: /api/posts
    expect:
      status: 404
      body:
        message: 'Route not found "/api/posts"'

  - name: a document that is not there uses a different envelope
    source: https://payloadcms.com/api/posts/000000000000000000000000
    verified: "2026-09-14"
    fixture: blog
    request:
      method: GET
      path: /api/posts/000000000000000000000000
    expect:
      status: 404
      body:
        # An array, where the route failures send a bare message.
        'errors[0].message': Not Found

  - name: and a malformed identifier is the same answer
    source: https://payloadcms.com/api/posts/not-an-objectid
    verified: "2026-09-14"
    fixture: blog
    request:
      method: GET
      path: /api/posts/not-an-objectid
    expect:
      status: 404
      # A bug in the caller's code and a deleted document read the same.
      body:
        'errors[0].message': Not Found

  - name: nine paging fields and three of them say one thing
    source: https://payloadcms.com/api/posts?limit=1
    fixture: blog
    request:
      method: GET
      path: /api/posts
      query:
        limit: "1"
        page: "1"
    expect:
      status: 200
      body:
        totalDocs: 2
        limit: 1
        totalPages: 2
        page: 1
        # hasNextPage, nextPage and page < totalPages are one fact.
        hasNextPage: true
        nextPage: 2
        prevPage: null

  - name: a page past the end is reported as if it existed
    source: https://payloadcms.com/api/posts?limit=1&page=9999
    fixture: blog
    request:
      method: GET
      path: /api/posts
      query:
        limit: "1"
        page: "9999"
    expect:
      status: 200
      body:
        docs: []
        totalDocs: 2
        # The page that does not exist, reported back.
        page: 9999
        totalPages: 2
        hasNextPage: false
        nextPage: null

  - name: a field's value is the name of another field
    source: https://payloadcms.com/api/posts
    fixture: blog
    request:
      method: GET
      path: /api/posts
    expect:
      status: 200
      body:
        # "videoUrl" is a field on this same record.
        'docs[0].featuredMedia': videoUrl
        'docs[0].videoUrl': https://example.com/watch/abc123
        'docs[0].image': null
        # And the other branch.
        'docs[1].featuredMedia': image
        'docs[1].videoUrl': null
        'docs[1].image.url': https://example.com/media/diagram.png

  - name: the content is an editor's internal state
    source: https://payloadcms.com/api/posts
    fixture: blog
    request:
      method: GET
      path: /api/posts
    expect:
      status: 200
      body:
        # detail and format integers, from Lexical's own node shape.
        'docs[0].excerpt.root.type': root
        'docs[0].excerpt.root.children[0].children[0].detail': 0
        'docs[0].excerpt.root.children[0].children[0].format': 0
        'docs[0].excerpt.root.children[0].children[0].mode': normal
        'docs[0].content[0].blockType': blogContent
        'docs[1].content': []

  - name: a content field contains a component tag
    source: https://payloadcms.com/api/posts
    fixture: blog
    request:
      method: GET
      path: /api/posts
    expect:
      status: 200
      body:
        # JSX, as data.
        'docs[0].addToDocs': '<Resource id="6aa2f41763d0ba1d0ceeb5ee" />'
        'docs[1].addToDocs': ""
        # An underscore, among fields that have none.
        'docs[0]._status': published
        'docs[0].title': A post with a video
        'docs[0].slug': a-post-with-a-video
        'docs[0].createdAt': "2026-09-10T18:16:55.896Z"
        'docs[0].updatedAt': "2026-09-10T18:23:59.507Z"
        'docs[0].publishedOn': "2026-09-10T18:00:00.000Z"
        'docs[0].authors[0].firstName': Dana
        'docs[0].guestSocials': {}

  - name: one document travels bare rather than wrapped
    source: https://payloadcms.com/api/posts
    fixture: blog
    request:
      method: GET
      path: /api/posts/71b4c8d2e5f309a6b7c1d248
    expect:
      status: 200
      body:
        id: 71b4c8d2e5f309a6b7c1d248
        title: A post with a picture
        featuredMedia: image

  - name: an empty collection keeps every paging field
    source: https://payloadcms.com/api/posts
    fixture: empty
    request:
      method: GET
      path: /api/posts
    expect:
      status: 200
      body:
        docs: []
        totalDocs: 0
        page: 1
        hasNextPage: false
        nextPage: null
        prevPage: null
