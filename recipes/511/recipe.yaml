# 511 SF Bay Transit Recipe for Cauldron
#
# Named 511, not fivenineone. Checked before writing: this format's recipe
# name pattern (internal/recipe/validate.go, namePattern) is
# `^[a-z0-9]+(?:-[a-z0-9]+)*$`, which accepts a leading digit -- `100ms`
# already ships one elsewhere in this collection -- and `511` matches it
# outright, three digits and nothing else, no letter required by the rule.
# Nothing here collides with an existing Recipe directory either. Since the
# plain spelling is genuinely valid rather than merely close, this Recipe
# uses it rather than the fallback `fivenineone`.
#
# Last of a group of three with recipes/mbta/recipe.yaml,
# recipes/tfl/recipe.yaml and recipes/transitland/recipe.yaml. Every case
# below was struck live against api.511.org on 2026-09-03, with no account
# and no key -- 511 SF Bay requires one (https://511.org/open-data/transit,
# "api_key=[your_key]") for every JSON-returning endpoint, so nothing past
# the credential gate could be observed directly. What follows the gate
# comes from 511's own published specification PDF instead, cited by page
# rather than assumed.
#
# **The BOM claim this batch's brief asks about could not be confirmed
# either way, and that is stated rather than guessed.** 511's plain-text
# failure bodies -- "The API key is not provided.", "This API key provided
# is invalid." -- carry no byte-order mark; checked byte by byte, both begin
# with 0x54 ("T"). Whether a genuine 200 JSON body carries one is a separate
# question this Recipe cannot answer: every JSON-returning path on this host
# demands a real key, none was ever created, and the "511 SF Bay Open Data
# Specification - Transit" PDF (fetched live 2026-09-03, cited throughout
# below) documents field shapes and worked examples, never raw bytes on the
# wire. The famous complaint may be current, fixed, or specific to one
# endpoint this Recipe never reached -- unresolved, on purpose, rather than
# asserted from a reputation.
#
# **Scheduled and predicted are "Aimed" and "Expected," and the provider's
# own worked example shows them diverging.** The StopMonitoring service (SIRI
# format) answers a MonitoredCall carrying AimedArrivalTime/
# AimedDepartureTime beside ExpectedArrivalTime/ExpectedDepartureTime --
# quoted verbatim from the spec's own JSON worked example (PDF page 87,
# section B.1.10, timestamps preserved exactly as published):
#
#   "AimedArrivalTime": "2004-12-17T09:40:46-05:00",
#   "ExpectedArrivalTime": "2004-12-17T09:40:46-05:00",
#   "AimedDepartureTime": "2004-12-17T09:42:47-05:00",
#   "ExpectedDepartureTime": "2004-12-17T09:40:47-05:00"
#
# Arrival is on time -- Aimed and Expected agree to the second. Departure is
# not: Aimed says 09:42:47 and Expected says 09:40:47, two minutes earlier,
# in the provider's own example of what its own service sends. A client
# reading only one of the two fields cannot see that gap exist at all.
#
# **A cancelled visit is not a flag on the entry -- it is a different entry
# entirely, in a different array, and a client reading only the departures
# list never sees it.** The same StopMonitoringDelivery that carries
# MonitoredStopVisit (one entry per visit, live-tracked or not) carries a
# sibling array, MonitoredStopVisitCancellation, documented in the spec's own
# field table (PDF page 101) as: "This contains cancellation information for
# a trip." -- Optional, separate from MonitoredStopVisit's own "Required."
# The provider's own worked example (PDF pages 87-88) shows two such entries
# addressed by ItemRef or by MonitoringRef+LineRef+DirectionRef+VisitNumber,
# neither of which corresponds to any MonitoredStopVisit entry present in the
# same response -- the visit it cancels is not there to be flagged, because
# a StopMonitoringDelivery only lists visits that are still visits. A client
# walking `MonitoredStopVisit` and never touching
# `MonitoredStopVisitCancellation` sees a cancelled departure vanish
# silently, which is precisely the failure this whole collection exists to
# surface.
#
# **Staleness is two clocks, not one, and the field descriptions say so in
# as many words.** ResponseTimestamp, per the spec's own table (PDF page
# 101): "Timestamp of response from server" -- when the whole delivery was
# assembled. RecordedAtTime, on each MonitoredStopVisit: "The timestamp of
# the last real-time update from the particular vehicle" -- per-visit, and
# independent of the first. A response assembled a second ago can still
# carry a visit whose last real update was minutes earlier; nothing about
# the shape flags the gap between the two, the same finding OpenSky's Recipe
# in this collection reaches independently for a different provider's
# time_position/last_contact pair against its own top-level "time".
#
# **The static (non-real-time) GTFS operator list carries its own staleness
# field, and it is not ISO-8601.** GET /transit/gtfsoperators answers a bare
# array -- Id, Name, LastGenerated -- and LastGenerated is a .NET-style
# locale date, "6/6/2017 1:26:30 PM", not a sortable timestamp: month before
# day, a 12-hour clock, and a literal "AM"/"PM" suffix, quoted here exactly
# as published (PDF page 93, section B.1.15) rather than reformatted. A
# client that assumes every timestamp on this host parses the way
# AimedArrivalTime does gets a parse error or, worse, a silently wrong month
# on the 1st through the 12th of any month.
#
# **A path is checked for a credential before it is checked for routing --
# except when its own final segment carries a dot, in which case IIS answers
# first and the API is never reached at all.** Confirmed live and
# reproducible: /transit/nosuchroute (no extension) answers the ordinary
# missing-key 401; /transit/foo.json, /transit/foo.xml, /transit/foo.html
# and even /transit/gtfsoperators.json -- a real route name with an
# extension appended -- all answer a completely different thing, IIS's own
# static-file-handler 404, text/html, 1245 bytes, with no api_key check ever
# reached. This is a third axis on top of the ones auth.after_routing was
# built to express (method, route existence, id shape): here the deciding
# factor is whether the last path segment merely *looks* like a filename,
# decided by IIS ahead of ASP.NET's own routing, let alone its credential
# check. Nothing in this format can express "this specific shape of path
# bypasses the API layer entirely," so it is declared as its own error on
# its own literal path rather than forced into auth.after_routing, which
# would claim a routing-order fact that is not what is actually happening.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful StopMonitoring, cancellation or real-time response
#     anywhere in this file's routes or fixtures. Every Aimed/Expected and
#     MonitoredStopVisitCancellation value quoted above is cited in the
#     header, not modelled as a resource or asserted in a conformance case,
#     because SIRI's nested nature (nested calls, nested journeys, nested
#     cancellations addressed three different ways) does not compress into
#     this format's resource system without inventing structure the spec
#     itself does not fix in one place.
#   - Only one route is declared, GET /transit/gtfsoperators, because it is
#     the one endpoint this Recipe holds a genuine, complete, provider-
#     published worked example for (the six operator codes and names below,
#     BART included, are copied verbatim from the spec, not chosen).
#   - The BOM question -- see above.
#   - No upstream.spec. The only machine-readable description 511.org
#     publishes is the PDF cited throughout; there is no OpenAPI or Swagger
#     document at any URL this Recipe tried, and a fingerprint needs
#     something `cauldron drift` can refetch and hash, which a PDF served
#     from a CMS is not a stable candidate for.

recipe: "511"
capability: infrastructure
version: 0.1.0

upstream:
  api: "1"
  provider: 511-sf-bay
  docs: https://511.org/open-data/transit

auth:
  scheme: query
  param: api_key
  keys:
    - cauldron-511-fixture-key-00000000-0000-0000-0000-000000000000
  absent_error: api_key_not_provided
  rejected_error: api_key_invalid

responses:
  list:
    style: bare
  error:
    style: text
    message_field: "-"

resources:
  # Id, Name, LastGenerated -- three fields, bare array, no wrapper. Every
  # value in the fixture below is copied from the spec's own worked example
  # (PDF page 93) rather than invented.
  gtfs_operator:
    id:
      style: opaque
      field: Id
    fields:
      Name:
        type: string
      # A .NET locale date string, not ISO-8601 -- see the header. Typed as
      # a plain string because this format has no locale-date type and
      # "string" is the truthful one to declare.
      LastGenerated:
        type: string

routes:
  - method: GET
    path: /transit/gtfsoperators
    resource: gtfs_operator
    operation: list

  # The extension-triggered IIS bypass, on the one real route this Recipe
  # declares -- see the header. Answers before the API layer, let alone the
  # credential check, is ever reached; confirmed live with and without a
  # credential present, identical either way.
  - method: GET
    path: /transit/gtfsoperators.json
    # Not gated -- see the header. IIS answers this one before the API's own
    # credential check is ever reached, credential present or not, so the
    # route is exempt from it rather than merely answering the same refusal
    # every other unrouted path gets.
    public: true
    error: iis_static_file_not_found

errors:
  api_key_not_provided:
    status: 401
    message: The API key is not provided.

  api_key_invalid:
    status: 401
    message: This API key provided is invalid.

  # IIS's own default 404, reached before ASP.NET routing and its api_key
  # check, for any path whose last segment carries a dot-extension -- see
  # the header. text/html, iso-8859-1, byte for byte as observed.
  iis_static_file_not_found:
    status: 404
    headers:
      Content-Type: text/html
    message: |
      <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
      <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
      <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1"/>
      <title>404 - File or directory not found.</title>
      <style type="text/css">
      <!--
      body{margin:0;font-size:.7em;font-family:Verdana, Arial, Helvetica, sans-serif;background:#EEEEEE;}
      fieldset{padding:0 15px 10px 15px;}
      h1{font-size:2.4em;margin:0;color:#FFF;}
      h2{font-size:1.7em;margin:0;color:#CC0000;}
      h3{font-size:1.2em;margin:10px 0 0 0;color:#000000;}
      #header{width:96%;margin:0 0 0 0;padding:6px 2% 6px 2%;font-family:"trebuchet MS", Verdana, sans-serif;color:#FFF;
      background-color:#555555;}
      #content{margin:0 0 0 2%;position:relative;}
      .content-container{background:#FFF;width:96%;margin-top:8px;padding:10px;position:relative;}
      -->
      </style>
      </head>
      <body>
      <div id="header"><h1>Server Error</h1></div>
      <div id="content">
       <div class="content-container"><fieldset>
        <h2>404 - File or directory not found.</h2>
        <h3>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</h3>
       </fieldset></div>
      </div>
      </body>
      </html>

fixtures:
  empty: {}

  regional:
    gtfs_operator:
      - Id: 3D
        Name: Tri Delta Transit
        LastGenerated: 9/8/2017 5:22:04 PM
      - Id: AC
        Name: AC Transit
        LastGenerated: 8/27/2017 6:06:13 PM
      - Id: AM
        Name: Capitol Corridor Joint Powers Authority
        LastGenerated: 8/22/2017 11:23:13 AM
      - Id: AT
        Name: Angel Island Tiburon Ferry
        LastGenerated: 9/13/2017 12:07:06 PM
      - Id: AY
        Name: American Canyon Transit
        LastGenerated: 9/13/2017 12:02:18 PM
      - Id: RG
        Name: Regional GTFS
        LastGenerated: 6/15/2020 5:11:56 AM
      - Id: BA
        Name: BART
        LastGenerated: 6/6/2017 1:26:30 PM

conformance:
  - name: no key at all is told plainly, in plain text
    source: https://api.511.org/transit/gtfsoperators
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /transit/gtfsoperators
    expect:
      status: 401
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: "The API key is not provided\\."

  - name: a wrong key is told a different sentence, still plain text
    source: https://api.511.org/transit/gtfsoperators
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /transit/gtfsoperators
      query:
        api_key: junk12345
    expect:
      status: 401
      body_matches: "This API key provided is invalid\\."

  - name: the same missing-key sentence follows a wrong method too
    source: https://api.511.org/transit/gtfsoperators
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /transit/gtfsoperators
    expect:
      status: 401
      body_matches: "The API key is not provided\\."

  - name: appending .json to a real route name bypasses the API layer entirely
    # No api_key check is ever reached -- see the header. IIS answers before
    # ASP.NET routing does, identically whether a credential was sent or not.
    source: https://api.511.org/transit/gtfsoperators.json
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /transit/gtfsoperators.json
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: "404 - File or directory not found\\."

  - name: and it does not matter whether a credential was on the request
    source: https://api.511.org/transit/gtfsoperators.json
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /transit/gtfsoperators.json
      query:
        api_key: junk12345
    expect:
      status: 404
      body_matches: "404 - File or directory not found\\."

  - name: the operator list is a bare array, and LastGenerated is not ISO-8601
    # Every value here is the spec's own worked example (PDF page 93), not
    # observed against a real key -- no credential exists to call this
    # route successfully, so this case carries no verified date.
    source: https://511.org/sites/default/files/2025-05/511%20SF%20Bay%20Open%20Data%20Specification%20-%20Transit.pdf
    fixture: regional
    request:
      method: GET
      path: /transit/gtfsoperators
      query:
        api_key: cauldron-511-fixture-key-00000000-0000-0000-0000-000000000000
    expect:
      status: 200
      body:
        "[0].Id": 3D
        "[0].Name": Tri Delta Transit
        "[6].Id": BA
        "[6].Name": BART
        # Month before day, a 12-hour clock, a literal AM/PM suffix -- see
        # the header.
        "[6].LastGenerated": 6/6/2017 1:26:30 PM
