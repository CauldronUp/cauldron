# deps.dev Recipe for Cauldron
#
# Capitalising a package name gets you a different package, and a 200.
#
# On npm, deps.dev treats the name as case-sensitive, because npm does. So:
#
#   GET /v3/systems/npm/packages/express   ->  200, 288 versions, default 5.2.1
#   GET /v3/systems/npm/packages/Express   ->  200, 3 versions, default 3.0.1
#
# Express is a real package: three releases in 2016, all deprecated, and the
# deprecation text is the only thing in the response that says anything is
# wrong -- "Package unsupported. Please use the express package (all lowercase)
# instead." Nothing else differs in shape. packageKey.name echoes back Express
# as though it were right, isDefault is set on one of the three, and a client
# that title-cased a name reads a version history that is nine years stale and
# gets no error at all.
#
# **And the other ecosystems do not agree.** On PyPI the same request normalises
# instead:
#
#   GET /v3/systems/pypi/packages/Django   ->  200, packageKey.name == "django"
#
# The name you asked for is silently replaced with the one it resolved to. So
# one API, one path, and two opposite readings of the same mistake -- neither of
# them signalled anywhere in the response.
#
# Written against the live API rather than a document: every case below was
# checked against api.deps.dev on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. The system is echoed in upper case. The path takes npm and pypi; the
#      body answers NPM and PYPI. A client round-tripping packageKey.system
#      into the next URL is relying on the path being case-insensitive, which
#      it is, and on nothing else.
#   2. A version that is not deprecated carries deprecatedReason: "". An empty
#      string, present, rather than an absent field -- the opposite of the npm
#      registry, whose Recipe here pins that `deprecated` is absent rather than
#      false when it does not apply. Two APIs describing one registry, and code
#      testing "deprecatedReason" in v is true for every version on this one.
#   3. The dependency graph is nodes and edges with integer indices, not a
#      tree. An edge is {fromNode: 0, toNode: 2, requirement: "~2.1.34"} and the
#      numbers are positions in the nodes array. Filter that array and the
#      edges point at the wrong packages.
#   4. And the nodes are in alphabetical order, not dependency order. For
#      accepts 1.3.8 the array is accepts, mime-db, mime-types, negotiator --
#      so nodes[1] is INDIRECT while nodes[2] and nodes[3] are DIRECT. The
#      package itself is node 0 with relation SELF, so the array is one longer
#      than the dependency count.
#   5. A successful graph carries error: "" beside its 200. An empty string,
#      present, as the way of saying nothing went wrong.
#
# The failures are bare plain text. Not JSON, not a body with a message field:
# seventeen bytes reading "package not found", content-type
# text/plain; charset=utf-8, with no trailing newline. A client calling .json()
# on that throws. And an ecosystem that does not exist reports a missing
# package -- /v3/systems/notasystem/packages/express answers "package not
# found", naming the wrong one of the two things in the URL.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The version lists are trimmed. express has 288 versions and django has
#     434; the fixtures below carry four and two, chosen to show the shape.
#     Express carries all three it has.
#   - The graph is served rather than computed. deps.dev resolves a real
#     manifest; this Recipe answers with the graph its fixture holds, the same
#     reading recorded for Google Drive's q and Maven Central's Solr
#     expressions.
#   - :dependencies is served for the version it holds. The other colon verbs
#     the API offers -- :requirements, and the v3alpha query and purl lookups --
#     are not modelled.
#   - The version route's name scope is declared and cannot be exercised, and
#     the reason is the headline. express and Express BOTH have a 3.0.1 -- one
#     published 2012-11-02, the other 2016-12-07, four years and two packages
#     apart -- and this format's identifier space is one per resource rather
#     than one per scope, so seeding both is refused as a duplicate identifier.
#     The scope is right and the cases stop short of proving it, exactly as
#     recorded for the Go module proxy, where two modules could not both be
#     called toml. Asserting the emulator's behaviour there would mean
#     asserting a 404 deps.dev does not send.
#
# The packages below are public and were recorded on the date in the cases.

recipe: depsdev
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://docs.deps.dev/api/v3/

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  list:
    style: wrapped
    # Every resource names its own collection, so there is no key here.
  error:
    # Bare plain text, no envelope, no trailing newline.
    style: text

resources:
  # The package endpoint answers with a key and a version history, and the key
  # is the only place the name you asked for is reflected back.
  package:
    id:
      style: opaque
      # Addressed by the name in the path and echoed only inside packageKey.
      field: "-"
    fields:
      # The path partition. Never on the wire: the body carries it inside
      # packageKey instead, and in upper case.
      system:
        type: string
        in: "-"
      packageKey:
        type: map
      versions:
        type: list

  version:
    id:
      style: opaque
      field: "-"
    fields:
      # The path partition. Never on the wire: the body carries it inside
      # packageKey instead, and in upper case.
      system:
        type: string
        in: "-"
      name:
        type: string
        in: "-"
      versionKey:
        type: map
      publishedAt:
        type: string
      isDefault:
        type: boolean
      isDeprecated:
        type: boolean
      # An empty string when it does not apply, rather than an absent field.
      deprecatedReason:
        type: string
      licenses:
        type: list
      advisoryKeys:
        type: list
      registries:
        type: list

  # A node in the resolved graph. Alphabetical, with the package itself first
  # only because its name sorts first here.
  node:
    collection: nodes
    id:
      style: opaque
      field: "-"
    fields:
      # The path partition. Never on the wire: the body carries it inside
      # packageKey instead, and in upper case.
      system:
        type: string
        in: "-"
      name:
        type: string
        in: "-"
      version:
        type: string
        in: "-"
      versionKey:
        type: map
      bundled:
        type: boolean
      relation:
        type: string
      errors:
        type: list

  # An edge names its ends by position in the nodes array and by nothing else.
  edge:
    collection: edges
    id:
      style: opaque
      field: "-"
    fields:
      # The path partition. Never on the wire: the body carries it inside
      # packageKey instead, and in upper case.
      system:
        type: string
        in: "-"
      name:
        type: string
        in: "-"
      version:
        type: string
        in: "-"
      fromNode:
        type: integer
      toNode:
        type: integer
      requirement:
        type: string

routes:
  - method: GET
    path: /v3/systems/{system}/packages/{id}
    resource: package
    operation: get
    scope:
      - system
    not_found: package_missing

  - method: GET
    path: /v3/systems/{system}/packages/{name}/versions/{id}
    resource: version
    operation: get
    scope:
      - system
      - name
    not_found: version_missing

  - method: GET
    path: /v3/systems/{system}/packages/{name}/versions/{version}:dependencies
    resource: node
    operation: list
    pagination:
      # Struck live on 2026-09-05: this answers a whole dependency graph --
      # 71 nodes and 128 edges for express 4.18.2 -- in one response, with
      # no size or position parameter of any kind. A graph is not a page,
      # and half of one is not a smaller graph.
      #
      # So this does not page, and the runtime serving ten nodes of it was
      # not a short answer, it was a broken one.
      style: none
    scope:
      - system
      - name
      - version
    beside:
      - edge
    fields:
      # An empty string, present, as the way of saying nothing went wrong.
      error: ""

errors:
  # Seventeen bytes and no JSON.
  package_missing:
    status: 404
    message: package not found

  version_missing:
    status: 404
    message: version not found

fixtures:
  empty: {}

  registries:
    package:
      # Four of 288, chosen to show the shape.
      - id: express
        system: npm
        packageKey:
          # NPM, where the path said npm.
          system: NPM
          name: express
        versions:
          - versionKey:
              system: NPM
              name: express
              version: 0.14.0
            publishedAt: "2010-12-29T19:38:25Z"
            isDefault: false
            isDeprecated: true
            deprecatedReason: express 0.x series is deprecated
          - versionKey:
              system: NPM
              name: express
              version: 4.18.2
            publishedAt: "2022-10-08T20:14:32Z"
            isDefault: false
            isDeprecated: false
            deprecatedReason: ""
          - versionKey:
              system: NPM
              name: express
              version: 5.0.0
            publishedAt: "2024-09-10T04:40:34Z"
            isDefault: false
            isDeprecated: false
            deprecatedReason: ""
          - versionKey:
              system: NPM
              name: express
              version: 5.2.1
            publishedAt: "2025-12-01T20:49:43Z"
            isDefault: true
            isDeprecated: false
            deprecatedReason: ""

      # A different package. Three releases in 2016, all of them deprecated,
      # and the deprecation text is the only thing that says so.
      - id: Express
        system: npm
        packageKey:
          system: NPM
          name: Express
        versions:
          - versionKey:
              system: NPM
              name: Express
              version: 2.0.0
            publishedAt: "2016-11-16T23:58:34Z"
            isDefault: false
            isDeprecated: true
            deprecatedReason: Package unsupported. Please use the express package (all lowercase) instead.
          - versionKey:
              system: NPM
              name: Express
              version: 3.0.0
            publishedAt: "2016-12-03T01:17:38Z"
            isDefault: false
            isDeprecated: true
            deprecatedReason: Package unsupported. Please use the express package (all lowercase) instead.
          - versionKey:
              system: NPM
              name: Express
              version: 3.0.1
            publishedAt: "2016-12-07T21:27:27Z"
            # Set, on a package nobody should be using.
            isDefault: true
            isDeprecated: true
            deprecatedReason: Package unsupported. Please use the express package (all lowercase) instead.

      # The same request on PyPI, which normalises instead. Asked for Django;
      # the key says django.
      - id: Django
        system: pypi
        packageKey:
          system: PYPI
          name: django
        versions:
          - versionKey:
              system: PYPI
              name: django
              version: 1.1.3
            publishedAt: "2010-12-23T05:14:23Z"
            isDefault: false
            isDeprecated: false
            deprecatedReason: ""
          - versionKey:
              system: PYPI
              name: django
              version: 6.1.0
            publishedAt: "2026-08-05T19:21:47Z"
            isDefault: true
            isDeprecated: false
            deprecatedReason: ""

    version:
      - id: 4.18.2
        system: npm
        name: express
        versionKey:
          system: NPM
          name: express
          version: 4.18.2
        publishedAt: "2022-10-08T20:14:32Z"
        isDefault: false
        isDeprecated: false
        # Present and empty, where the npm registry omits the field entirely.
        deprecatedReason: ""
        licenses:
          - MIT
        advisoryKeys:
          - id: GHSA-qw6h-vgh9-j6wx
          - id: GHSA-rv95-896h-c2vc
        registries:
          - https://registry.npmjs.org/

      - id: 3.0.1
        system: npm
        name: Express
        versionKey:
          system: NPM
          name: Express
          version: 3.0.1
        publishedAt: "2016-12-07T21:27:27Z"
        isDefault: true
        isDeprecated: true
        deprecatedReason: Package unsupported. Please use the express package (all lowercase) instead.
        licenses:
          - ISC
        advisoryKeys: []
        registries:
          - https://registry.npmjs.org/

  # accepts 1.3.8 resolves to three dependencies and four nodes.
  graph:
    node:
      # Alphabetical. The package itself sorts first here by accident of its
      # name, and its relation is SELF.
      - id: accepts
        system: npm
        name: accepts
        version: 1.3.8
        versionKey:
          system: NPM
          name: accepts
          version: 1.3.8
        bundled: false
        relation: SELF
        errors: []
      # Second in the array and indirect.
      - id: mime-db
        system: npm
        name: accepts
        version: 1.3.8
        versionKey:
          system: NPM
          name: mime-db
          version: 1.52.0
        bundled: false
        relation: INDIRECT
        errors: []
      - id: mime-types
        system: npm
        name: accepts
        version: 1.3.8
        versionKey:
          system: NPM
          name: mime-types
          version: 2.1.35
        bundled: false
        relation: DIRECT
        errors: []
      - id: negotiator
        system: npm
        name: accepts
        version: 1.3.8
        versionKey:
          system: NPM
          name: negotiator
          version: 0.6.3
        bundled: false
        relation: DIRECT
        errors: []

    edge:
      # Positions in the array above, and nothing else.
      - id: e0
        system: npm
        name: accepts
        version: 1.3.8
        fromNode: 0
        toNode: 2
        requirement: ~2.1.34
      - id: e1
        system: npm
        name: accepts
        version: 1.3.8
        fromNode: 0
        toNode: 3
        requirement: 0.6.3
      - id: e2
        system: npm
        name: accepts
        version: 1.3.8
        fromNode: 2
        toNode: 1
        requirement: 1.52.0

conformance:
  - name: capitalising the name gets a different package and a 200
    source: https://api.deps.dev/v3/systems/npm/packages/Express
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/Express
    expect:
      status: 200
      body:
        # Echoed back as though it were right, with a default version set.
        "packageKey.name": Express
        "versions[2].versionKey.version": 3.0.1
        "versions[2].isDefault": true
        # The only thing in the response that says anything is wrong.
        "versions[0].deprecatedReason": Package unsupported. Please use the express package (all lowercase) instead.
      absent:
        # Three releases, all from 2016.
        - versions[3]

  - name: and the lowercase one is a different package entirely
    source: https://api.deps.dev/v3/systems/npm/packages/express
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/express
    expect:
      status: 200
      body:
        # 288 versions live; four here. Nothing about the two responses says
        # one of them is the package everybody means.
        "packageKey.name": express
        "versions[3].versionKey.version": 5.2.1
        "versions[3].isDefault": true

  - name: on PyPI the same mistake is normalised away instead
    source: https://api.deps.dev/v3/systems/pypi/packages/Django
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/pypi/packages/Django
    expect:
      status: 200
      body:
        # Asked for Django. The key says django, and nothing says it changed.
        "packageKey.name": django
        "packageKey.system": PYPI
        "versions[1].versionKey.name": django

  - name: the system comes back in upper case
    source: https://api.deps.dev/v3/systems/npm/packages/express
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/express
    expect:
      status: 200
      body:
        # The path took npm. The body answers NPM, on every key in it.
        "packageKey.system": NPM
        "versions[0].versionKey.system": NPM

  - name: a version that is not deprecated carries an empty reason
    source: https://api.deps.dev/v3/systems/npm/packages/express/versions/4.18.2
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/express/versions/4.18.2
    expect:
      status: 200
      body:
        # Present and empty, where the npm registry omits `deprecated`
        # entirely. Code testing "deprecatedReason" in v is true for every
        # version here and true for almost none there.
        isDeprecated: false
        deprecatedReason: ""
        "advisoryKeys[0].id": GHSA-qw6h-vgh9-j6wx

  - name: the squat's own version record says what it is
    source: https://api.deps.dev/v3/systems/npm/packages/Express/versions/3.0.1
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/Express/versions/3.0.1
    expect:
      status: 200
      body:
        # Same registry, same shape, and an empty advisory list -- so a
        # vulnerability scan of the wrong package comes back clean.
        "versionKey.name": Express
        isDefault: true
        isDeprecated: true
        licenses[0]: ISC
      absent:
        - advisoryKeys[0]

  - name: the graph is nodes and edges with integer indices
    source: https://api.deps.dev/v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    verified: "2026-08-28"
    fixture: graph
    request:
      method: GET
      path: /v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    expect:
      status: 200
      body:
        # An edge names its ends by position in the nodes array. Filter that
        # array and every edge points somewhere else.
        "edges[0].fromNode": 0
        "edges[0].toNode": 2
        "edges[0].requirement": ~2.1.34
        "edges[2].fromNode": 2

  - name: the nodes are alphabetical rather than in dependency order
    source: https://api.deps.dev/v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    verified: "2026-08-28"
    fixture: graph
    request:
      method: GET
      path: /v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    expect:
      status: 200
      body:
        # accepts, mime-db, mime-types, negotiator -- so the second entry is
        # indirect and the two after it are direct.
        "nodes[1].versionKey.name": mime-db
        "nodes[1].relation": INDIRECT
        "nodes[2].relation": DIRECT
        "nodes[3].relation": DIRECT

  - name: the package itself is node zero, so the array is one too long
    source: https://api.deps.dev/v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    verified: "2026-08-28"
    fixture: graph
    request:
      method: GET
      path: /v3/systems/npm/packages/accepts/versions/1.3.8:dependencies
    expect:
      status: 200
      body:
        # Four nodes for three dependencies.
        "nodes[0].versionKey.name": accepts
        "nodes[0].relation": SELF
        # And a successful graph says so with an empty string.
        error: ""
      absent:
        - nodes[4]

  - name: a package that is not there is bare plain text
    source: https://api.deps.dev/v3/systems/npm/packages/cauldron-not-real-xyz
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/cauldron-not-real-xyz
    expect:
      # Seventeen bytes, no JSON, no trailing newline. Calling .json() on this
      # throws.
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '^package not found$'

  - name: and a missing version says something else
    source: https://api.deps.dev/v3/systems/npm/packages/express/versions/99.99.99
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/npm/packages/express/versions/99.99.99
    expect:
      status: 404
      body_matches: '^version not found$'

  - name: an ecosystem that does not exist is reported as a missing package
    source: https://api.deps.dev/v3/systems/notasystem/packages/express
    verified: "2026-08-28"
    fixture: registries
    request:
      method: GET
      path: /v3/systems/notasystem/packages/express
    expect:
      # express exists. notasystem does not. The message names the wrong one
      # of the two things in the URL.
      status: 404
      body_matches: '^package not found$'

  # The names. This Recipe declares 2 field(s) on a version that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a version carries the field names this Recipe declares"
    source: "https://api.deps.dev/v3/systems/npm/packages/express/versions/4.18.2"
    fixture: registries
    request:
      method: GET
      path: "/v3/systems/npm/packages/express/versions/4.18.2"
    expect:
      status: 200
      body:
        "publishedAt": "2022-10-08T20:14:32Z"
        "registries[0]": "https://registry.npmjs.org/"

  # The names. This Recipe declares 2 field(s) on a node that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a node carries the field names this Recipe declares"
    source: "https://api.deps.dev/v3/systems/npm/packages/accepts/versions/1.3.8:dependencies"
    fixture: graph
    request:
      method: GET
      path: "/v3/systems/npm/packages/accepts/versions/1.3.8:dependencies"
    expect:
      status: 200
      body:
        "nodes[0].bundled": false


