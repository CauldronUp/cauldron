# GrowthBook Recipe for Cauldron
#
# The field everybody branches on has no declared values, and the field beside
# it does.
#
# An Experiment requires both type and status. type is
# enum: [standard, multi-armed-bandit, holdout] -- three values, written down.
# status is `{"type": "string"}` and nothing else: no enum, no example, no
# description, in a document 2.7 megabytes long. And resultSummary carries a
# second field called status, also a bare string, meaning something different.
#
# So the property a dashboard filters on, an alert watches and a deploy gate
# reads is the one the document declines to constrain, twice, on one object.
#
# Written against spec.yaml in growthbook/growthbook -- the OpenAPI document
# GrowthBook generates and ships inside its own back end, 285 paths and 146
# schemas, and the source of every quotation here.
#
# Four more the Recipe pins:
#
#   1. Six fields to answer one question. A listing's envelope carries limit,
#      offset, count, total, hasMore and nextOffset. count is this page and
#      total is everything; hasMore is a boolean; nextOffset is
#      anyOf [integer, null], so it is present and null on the last page
#      rather than absent. Four independent ways to decide whether to ask
#      again, and a loop written against any one of them ignores the rest.
#   2. Two identifiers, and the useful one is not the id. id and trackingKey
#      are both required. trackingKey is what appears in the analytics
#      warehouse, so joining an experiment to its data means using the field
#      that is not called id -- the third provider in this collection with
#      that shape, after Grafana's uid and ConfigCat's key.
#   3. owner holds two different kinds of value depending on when the record
#      was made: "The userId of the owner (or raw owner name/email for legacy
#      records)". And ownerEmail beside it is only "the email address of the
#      owner, when the owner can be resolved to a known user" -- so owner may
#      already be an email, ownerEmail may be missing, and neither field
#      alone tells you which case you are in.
#   4. Three version numbers govern which variation a user sees.
#      hashVersion is anyOf [const 1, const 2] -- a union of constants rather
#      than an enum -- with bucketVersion and minBucketVersion beside it.
#      Changing any of them re-buckets people mid-experiment, and nothing in
#      the object says which combination is in force.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - offset is the one paging field this format cannot name, so it is absent
#     from the envelope here while the other five are served. It echoes the
#     request parameter rather than describing the result, which is why it is
#     the least costly of the six to leave out -- but it is left out, and this
#     says so.
#   - The document declares no failure at all on the experiment endpoints:
#     GET /v1/experiments/{id} lists a 200 and nothing else, in a document
#     that describes 285 paths. The errors below are the shape GrowthBook
#     documents elsewhere rather than anything this file could quote from the
#     endpoint.
#   - Starting, stopping, scheduling and the start checklist are absent, along
#     with results snapshots: an experiment's results are the output of SQL
#     queries against a warehouse, and queryIds on the results object points
#     at the queries that produced them. That is a pipeline rather than a
#     shape.
#   - Features, metrics, data sources, segments, SDK connections and the other
#     twenty-odd resources are absent.
#
# The key and experiments below are fixtures and belong to no organisation.

recipe: growthbook
capability: flags
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.growthbook.io/api

auth:
  # "If using Bearer auth, pass the Secret Key as the token."
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - secret_cauldronFixtureKeyNotARealOne00000

responses:
  resource:
    style: bare
  list:
    style: wrapped
    limit_field: limit
    # count is this page; total is everything.
    page_count_field: count
    count_field: total
    has_more_field: hasMore
    cursor_field: nextOffset
    # "anyOf": [{"type": "integer"}, {"type": "null"}] -- present and null on
    # the last page rather than left out.
    cursor_null: true
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  experiment:
    collection: experiments
    id:
      style: opaque
    fields:
      # The identifier that reaches the warehouse, which is not the id.
      trackingKey:
        type: string
      name:
        type: string
      # Three declared values.
      type:
        type: string
      # And none at all.
      status:
        type: string
      project:
        type: string
      hypothesis:
        type: string
      description:
        type: string
      tags:
        type: list
      # "The userId of the owner (or raw owner name/email for legacy records)".
      owner:
        type: string
      ownerEmail:
        type: string
      archived:
        type: boolean
      autoRefresh:
        type: boolean
      hashAttribute:
        type: string
      hashVersion:
        type: integer
      bucketVersion:
        type: integer
      minBucketVersion:
        type: integer
      variations:
        type: list
      phases:
        type: list
      resultSummary:
        type: map
      shareLevel:
        type: string
      dateCreated:
        type: datetime
      dateUpdated:
        type: datetime

routes:
  - method: GET
    path: /api/v1/experiments
    resource: experiment
    operation: list
    filters:
      - param: projectId
        field: project
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 10

  - method: GET
    path: /api/v1/experiments/{id}
    resource: experiment
    operation: get

errors:
  authentication_error:
    status: 401
    message: Invalid API key

  resource_missing:
    status: 404
    message: Could not find experiment

  invalid_request:
    status: 400
    message: Invalid request

fixtures:
  empty: {}

  organisation:
    experiment:
      # A modern record: owner is a userId and ownerEmail resolves.
      - id: exp_cauldron0000001
        trackingKey: checkout-button-colour
        name: Checkout button colour
        type: standard
        status: running
        project: prj_cauldron000001
        hypothesis: A green button converts better than a blue one.
        description: Two variations on the checkout page.
        tags:
          - checkout
        owner: u_cauldron00000001
        ownerEmail: ada@cauldron.test
        archived: false
        autoRefresh: true
        hashAttribute: id
        hashVersion: 2
        bucketVersion: 0
        minBucketVersion: 0
        variations:
          - variationId: var_0
            key: "0"
            name: Control
          - variationId: var_1
            key: "1"
            name: Green
        phases:
          - name: Main
            dateStarted: "2026-04-01T00:00:00Z"
        resultSummary:
          # A second status, on the same object, also unconstrained.
          status: won
          winner: var_1
        shareLevel: organization
        dateCreated: "2026-03-30T09:00:00Z"
        dateUpdated: "2026-05-18T16:40:00Z"

      # A legacy record: owner is a raw email and ownerEmail is absent,
      # because the owner could not be resolved to a known user.
      - id: exp_cauldron0000002
        trackingKey: signup-copy
        name: Signup copy
        type: holdout
        status: stopped
        project: prj_cauldron000001
        hypothesis: Shorter copy converts better.
        description: Legacy record.
        tags: []
        owner: grace@cauldron.test
        archived: true
        autoRefresh: false
        hashAttribute: id
        hashVersion: 1
        bucketVersion: 0
        minBucketVersion: 0
        variations:
          - variationId: var_0
            key: "0"
            name: Control
        phases: []
        resultSummary:
          status: inconclusive
        shareLevel: organization
        dateCreated: "2025-11-02T09:00:00Z"
        dateUpdated: "2026-01-14T12:00:00Z"

conformance:
  - name: the status has no declared values and the type beside it does
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # type is enum: [standard, multi-armed-bandit, holdout]. status is
        # {"type": "string"} and nothing else, in a 2.7MB document -- and it
        # is the one anything branches on.
        type: standard
        status: running

  - name: and resultSummary carries a second status meaning something else
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # running is about the experiment; won is about the outcome. Two bare
        # strings called status on one object.
        status: running
        "resultSummary.status": won
        "resultSummary.winner": var_1

  - name: the identifier that reaches the warehouse is not the id
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # Both required. The id addresses the experiment in this API; the
        # trackingKey is what the analytics events were tagged with, so a
        # join uses the field that is not called id.
        id: exp_cauldron0000001
        trackingKey: checkout-button-colour

  - name: owner holds a user id on one record and an email on another
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000002
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # "The userId of the owner (or raw owner name/email for legacy
        # records)". This is a legacy record, so owner is already an email
        # and ownerEmail -- only sent "when the owner can be resolved to a
        # known user" -- is not there at all.
        owner: grace@cauldron.test
        # And its outcome summary carries the third value of a field the
        # document never enumerates.
        "resultSummary.status": inconclusive
      absent:
        - ownerEmail
        - resultSummary.winner

  - name: and the modern record has both, disagreeing in shape
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # So code that displays owner shows a user id here and an email
        # address on the record above, from one field.
        owner: u_cauldron00000001
        ownerEmail: ada@cauldron.test

  - name: three version numbers decide which variation a user sees
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments/exp_cauldron0000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # hashVersion is anyOf [const 1, const 2] -- a union of constants
        # rather than an enum -- and the two bucket versions sit beside it.
        hashVersion: 2
        bucketVersion: 0
        minBucketVersion: 0
        hashAttribute: id

  - name: a listing answers the same question five ways
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments?limit=1
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # count is this page, total is everything, hasMore is a boolean, and
        # nextOffset points at the next one. A loop written against any one
        # of them ignores the rest.
        limit: 1
        count: 1
        total: 2
        hasMore: true
        "experiments[0].id": exp_cauldron0000001
      absent:
        - experiments[1]

  - name: and the last page sends a null cursor rather than none
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        # anyOf [integer, null]: the key is there and its value is null, so a
        # loop written as `while ('nextOffset' in body)` never terminates.
        nextOffset: null
        hasMore: false
        count: 2
        total: 2

  - name: filtering by project narrows the listing
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments?projectId=prj_cauldron000001
      headers:
        Authorization: Bearer secret_cauldronFixtureKeyNotARealOne00000
    expect:
      status: 200
      body:
        total: 2
        "experiments[0].project": prj_cauldron000001

  - name: a key this organisation does not know is refused
    source: https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml
    fixture: organisation
    request:
      method: GET
      path: /api/v1/experiments
      headers:
        Authorization: Bearer secret_notThisOrganisationsKey00000000
    expect:
      status: 401
      body:
        message: Invalid API key

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml"
    fixture: organisation
    request:
      method: GET
      path: "/api/v1/experiments"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer secret_cauldronFixtureKeyNotARealOne00000"
    expect:
      status: 200
      body:
        "experiments[0].id": "exp_cauldron0000001"
      absent:
        - "experiments[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://github.com/growthbook/growthbook/blob/main/packages/back-end/generated/spec.yaml"
    fixture: organisation
    request:
      method: GET
      path: "/api/v1/experiments"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer secret_cauldronFixtureKeyNotARealOne00000"
    expect:
      status: 200
      body:
        "experiments[0].id": "exp_cauldron0000002"
      absent:
        - "experiments[1]"

