  - name: v3 -- a subscriber wraps under its own singular key, same as v4's
    source: https://developers.kit.com/api-reference/v3/subscribers
    fixture: small-account-v3
    request:
      method: GET
      path: /v3/subscribers/501
      query:
        api_secret: cauldron-kit-fixture-v3-secret-0000000000
    expect:
      status: 200
      body:
        "subscriber.id": 501
        "subscriber.email_address": carol@example.com
        "subscriber.state": active

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the subscriber listing answers with what the fixture holds"
    source: "https://developers.kit.com/api-reference/subscribers/get-a-subscriber"
    fixture: small-account
    request:
      method: GET
      path: "/v4/subscribers"
      headers:
        "X-Kit-Api-Key": "cauldron-kit-fixture-key-0000000000000000"
    expect:
      status: 200
      body:
        "subscribers[0].id": 9001
        "subscribers[1].id": 9002

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and after=9001, which is the identifier of the last
  # record on the previous page, and asserts the second record came back
  # on its own: one to skip, one to return, and a third behind it to
  # prove the size stopped the page.
  - name: "per_page and after are the two names this listing reads"
    source: "https://developers.kit.com/api-reference/subscribers/get-a-subscriber"
    fixture: small-account
    request:
      method: GET
      path: "/v4/subscribers"
      query:
        "per_page": "1"
        "after": "9001"
      headers:
        "X-Kit-Api-Key": "cauldron-kit-fixture-key-0000000000000000"
    expect:
      status: 200
      body:
        "subscribers[0].id": 9002
      absent:
        - "subscribers[1]"
