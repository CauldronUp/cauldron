# Gutendex Recipe for Cauldron
#
# A filter it cannot parse is dropped, and you get the whole catalogue.
#
#   /books/?ids=84   ->  200  {"count": 1,     "results": [ ... ]}
#   /books/?ids=abc  ->  200  {"count": 79296, "results": [ ... ]}
#
# The second asked for a book whose identifier is "abc". There is no such book,
# and there is no error either: the parameter is discarded and the answer is
# every book Project Gutenberg has. A client filtering by an identifier it built
# wrong receives seventy-nine thousand records where it expected one, at 200,
# with nothing anywhere saying its filter was ignored.
#
# **And the invalid parameter is carried faithfully into the next link.**
#
#   "next": "https://gutendex.com/books/?ids=abc&page=2"
#
# So a client that pages by following the link it was given walks the entire
# catalogue, page by page, still asking for "abc" every time, and still being
# answered with everything. The parameter is preserved exactly where it does
# nothing and dropped exactly where it would.
#
# Written against the live API rather than a document: every case below was
# checked against gutendex.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. One array, two naming conventions. bookshelves holds four entries
#      carrying a "Category: " prefix and then four that do not, in the same
#      list, with nothing marking where one convention ends and the other
#      begins except the prefix itself.
#   2. The keys of formats are MIME types, so they carry slashes, plus signs,
#      a semicolon and a space: "text/html", "application/epub+zip" and
#      "text/plain; charset=utf-8". Not one of them can be written after a dot,
#      and the last would need quoting in almost any configuration language.
#   3. The same title appears twice in one record, capitalised two ways. title
#      is "Frankenstein; or, the modern prometheus" and the summary beside it
#      opens by quoting "Frankenstein; Or, The Modern Prometheus" -- so the
#      field a client renders disagrees with the prose it renders underneath.
#
# And a subject heading carries its own punctuation. "Frankenstein's monster
# (Fictitious character) -- Fiction" holds an apostrophe, a parenthetical and a
# double hyphen, the last of which is Library of Congress subdivision syntax
# arriving unannounced in a JSON string.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One book is served, of seventy-nine thousand, and download_count moves.
#     The figure is the one that stood at the moment in the verified field.
#   - The count on the unfiltered answer is a declared constant. It read 79293
#     and 79296 within a minute of itself while this was being written, so no
#     number could be right for long; what the case pins is that the filter was
#     dropped and the parameter survived into the next link.
#   - The catalogue's first record is Pride and Prejudice by download count,
#     and that ordering is the provider's default rather than a promise.
#   - Three of the seven subjects and six of the eight bookshelves are served,
#     and both are a contiguous prefix of the real array rather than a
#     selection, so an index here means what it means upstream.

recipe: gutendex
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: gutendex
  docs: https://gutendex.com

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: results
  error:
    # The only failure on the host is the site's own page.
    style: text

resources:
  book:
    id:
      style: numeric
      field: id
      type: number
    fields:
      title:
        type: string
      authors:
        type: list
      # Where the title appears again, capitalised differently.
      summaries:
        type: list
      subjects:
        type: list
      # Where two naming conventions share one array.
      bookshelves:
        type: list
      languages:
        type: list
      editors:
        type: list
      translators:
        type: list
      copyright:
        type: boolean
      media_type:
        type: string
      # Where the keys are MIME types.
      formats:
        type: map
      download_count:
        type: integer

routes:
  # A filter it can parse.
  - method: GET
    path: /books/
    resource: book
    operation: list
    pagination:
      # page, and no size at all. Struck live on 2026-09-05: a bare request
      # answers thirty-two books with next
      # "https://gutendex.com/books/?page=2", and ?page_size=2 answers the
      # same thirty-two -- the size is fixed and no name changes it, which
      # is what "-" says.
      #
      # This Recipe already knew the position's name without writing it
      # down. Its own live finding is that an unparseable filter is "carried
      # faithfully into the next link, ?ids=abc&page=2" -- so page was in a
      # string this file was already asserting.
      style: page
      limit: 32
      limit_param: "-"
      cursor_param: page
      first_page: 1
    matches_query:
      ids: "84"
    fields:
      count: 1
      next: null
      previous: null

  # A filter it cannot: dropped, and the whole catalogue answered instead.
  - method: GET
    path: /books/
    resource: book
    operation: list
    pagination:
      # page, and no size at all. Struck live on 2026-09-05: a bare request
      # answers thirty-two books with next
      # "https://gutendex.com/books/?page=2", and ?page_size=2 answers the
      # same thirty-two -- the size is fixed and no name changes it, which
      # is what "-" says.
      #
      # This Recipe already knew the position's name without writing it
      # down. Its own live finding is that an unparseable filter is "carried
      # faithfully into the next link, ?ids=abc&page=2" -- so page was in a
      # string this file was already asserting.
      style: page
      limit: 32
      limit_param: "-"
      cursor_param: page
      first_page: 1
    matches_query:
      ids: abc
    fields:
      # Seventy-nine thousand, for a request that named one book.
      count: 79296
      # And the parameter that did nothing, carried into the next page.
      next: "https://gutendex.com/books/?ids=abc&page=2"
      previous: null

  # A path that does not exist: the site's own page.
  - method: GET
    path: /nosuchthing
    error: page_not_found
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  page_not_found:
    status: 404
    message: "<!doctype html><html lang='en'><head><title>Gutendex</title></head></html>"

fixtures:
  empty: {}

  frankenstein:
    book:
      - id: "84"
        # Lower case, where the summary below quotes it in title case.
        title: "Frankenstein; or, the modern prometheus"
        authors:
          # Surname first, comma, then the rest.
          - name: "Shelley, Mary Wollstonecraft"
            birth_year: 1797
            death_year: 1851
        summaries:
          # And here the same title, capitalised the other way.
          - '"Frankenstein; Or, The Modern Prometheus" by Mary Wollstonecraft Shelley is a Gothic novel published in 1818.'
        subjects:
          # A double hyphen, which is Library of Congress subdivision syntax,
          # twice before a heading that has none.
          - "Frankenstein's monster (Fictitious character) -- Fiction"
          - "Frankenstein, Victor (Fictitious character) -- Fiction"
          - Gothic fiction
        bookshelves:
          # Four with a prefix...
          - "Category: British Literature"
          - "Category: Classics of Literature"
          - "Category: Novels"
          - "Category: Science-Fiction & Fantasy"
          # ...and then, in the same array, four without.
          - Gothic Fiction
          - Movie Books
        languages:
          - en
        editors: []
        translators: []
        copyright: false
        media_type: Text
        formats:
          # Slashes, plus signs, a semicolon and a space: none of these keys
          # can be written after a dot.
          "text/html": "https://www.gutenberg.org/ebooks/84.html.images"
          "application/epub+zip": "https://www.gutenberg.org/ebooks/84.epub3.images"
          "application/rdf+xml": "https://www.gutenberg.org/ebooks/84.rdf"
          "text/plain; charset=utf-8": "https://www.gutenberg.org/ebooks/84.txt.utf-8"
          "image/jpeg": "https://www.gutenberg.org/cache/epub/84/pg84.cover.medium.jpg"
        download_count: 58824

conformance:
  - name: a filter it can parse answers one book
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        count: 1
        next: null
        previous: null
        "results[0].id": 84
        "results[0].title": "Frankenstein; or, the modern prometheus"

  - name: and a filter it cannot is dropped for the whole catalogue
    source: "https://gutendex.com/books/?ids=abc"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: abc
    expect:
      # Two hundred, for a filter that matched nothing because it was never
      # applied.
      status: 200
      body:
        # Seventy-nine thousand, for a request that named one book.
        count: 79296
        # And the parameter that did nothing, carried faithfully into the next
        # page, so a client following its own links walks the whole catalogue
        # still asking for "abc".
        next: "https://gutendex.com/books/?ids=abc&page=2"
        previous: null

  - name: one array, two naming conventions
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        # Four with a prefix...
        "results[0].bookshelves[0]": "Category: British Literature"
        "results[0].bookshelves[1]": "Category: Classics of Literature"
        "results[0].bookshelves[2]": "Category: Novels"
        "results[0].bookshelves[3]": "Category: Science-Fiction & Fantasy"
        # ...and then, at index four, the convention changes with nothing
        # marking the boundary.
        "results[0].bookshelves[4]": Gothic Fiction
        "results[0].bookshelves[5]": Movie Books

  - name: the keys of formats are MIME types
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        # A slash...
        "results[0].formats.text/html": "https://www.gutenberg.org/ebooks/84.html.images"
        # ...a plus sign, twice...
        "results[0].formats.application/epub+zip": "https://www.gutenberg.org/ebooks/84.epub3.images"
        "results[0].formats.application/rdf+xml": "https://www.gutenberg.org/ebooks/84.rdf"
        # ...and a semicolon with a space after it.
        "results[0].formats.text/plain; charset=utf-8": "https://www.gutenberg.org/ebooks/84.txt.utf-8"
        "results[0].formats.image/jpeg": "https://www.gutenberg.org/cache/epub/84/pg84.cover.medium.jpg"

  - name: the same title twice, capitalised two ways
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        # The field a client renders...
        "results[0].title": "Frankenstein; or, the modern prometheus"
        # ...and the prose it renders underneath, disagreeing with it.
        "results[0].summaries[0]": '"Frankenstein; Or, The Modern Prometheus" by Mary Wollstonecraft Shelley is a Gothic novel published in 1818.'

  - name: a subject heading carries its own punctuation
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        # A double hyphen, arriving unannounced in a JSON string -- and the
        # first heading also carries an apostrophe and a parenthesis.
        "results[0].subjects[0]": "Frankenstein's monster (Fictitious character) -- Fiction"
        "results[0].subjects[1]": "Frankenstein, Victor (Fictitious character) -- Fiction"
        # Beside one with no subdivision at all.
        "results[0].subjects[2]": Gothic fiction
        # An author written surname first.
        "results[0].authors[0].name": "Shelley, Mary Wollstonecraft"
        "results[0].authors[0].birth_year": 1797
        "results[0].authors[0].death_year": 1851

  - name: two empty arrays and a boolean for a three-valued fact
    source: "https://gutendex.com/books/?ids=84"
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /books/
      query:
        ids: "84"
    expect:
      status: 200
      body:
        "results[0].editors": []
        "results[0].translators": []
        # False, where the field it describes is really true, false or unknown.
        "results[0].copyright": false
        "results[0].media_type": Text
        "results[0].languages[0]": en
        "results[0].download_count": 58824

  - name: a path that does not exist answers the site
    source: https://gutendex.com/nosuchthing
    verified: "2026-08-31"
    fixture: frankenstein
    request:
      method: GET
      path: /nosuchthing
    expect:
      status: 404
      headers:
        # HTML, on a host whose every other answer is JSON.
        Content-Type: text/html
      body_matches: "^<!doctype html><html lang='en'><head><title>Gutendex</title></head></html>$"

  # The position. This route names no page size at all -- limit_param is
  # "-" -- so there is no way to show one, and the pair this generator
  # usually writes is a single case. page=2 answers something the first
  # request did not, which a name nobody read could not produce.
  - name: "page moves the page on for books"
    source: "https://gutendex.com/books/?ids=84"
    fixture: frankenstein
    request:
      method: GET
      path: "/books/"
      query:
        "ids": "84"
        "page": "2"
    expect:
      status: 200
      absent:
        - "results[0]"

