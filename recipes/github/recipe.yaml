# GitHub — Cauldron Recipe
#
# This Recipe exists as much to prove the format generalises as to be useful.
# GitHub disagrees with Stripe on two things that a Stripe-shaped emulator
# would otherwise have baked in permanently:
#
#   1. Lists are bare JSON arrays, not an object with a data key. A client
#      unmarshalling into a slice must not receive an object.
#   2. Identifiers are integers, not prefixed strings.
#
# Scope is issues on one repository. Multi-segment owner/repo addressing is
# not modelled yet — see the routes below.

recipe: github
version: 0.1.0

upstream:
  api: "2022-11-28"
  docs: https://docs.github.com/rest

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - ghp_cauldron

responses:
  list:
    style: bare

resources:
  issue:
    id:
      style: numeric
    fields:
      title:
        type: string
        required: true
      body:
        type: string
      state:
        type: string
        default: open
      created_at:
        type: timestamp

  label:
    id:
      style: numeric
    fields:
      name:
        type: string
        required: true
      color:
        type: string
        default: ededed

routes:
  # The owner and repository are fixed for now. Modelling /repos/{owner}/{repo}
  # properly needs composite identifiers, which the store does not have yet.
  - method: GET
    path: /repos/octocat/hello-world/issues
    resource: issue
    operation: list
    pagination:
      style: page
      limit: 30

  - method: POST
    path: /repos/octocat/hello-world/issues
    resource: issue
    operation: create

  - method: GET
    path: /repos/octocat/hello-world/issues/{id}
    resource: issue
    operation: get

  - method: PATCH
    path: /repos/octocat/hello-world/issues/{id}
    resource: issue
    operation: update

  - method: GET
    path: /repos/octocat/hello-world/labels
    resource: label
    operation: list

  - method: POST
    path: /repos/octocat/hello-world/labels
    resource: label
    operation: create

errors:
  rate_limit:
    status: 403
    code: rate_limit_exceeded
    message: API rate limit exceeded.
    headers:
      x-ratelimit-remaining: "0"
      x-ratelimit-reset: "1767225600"

  authentication_error:
    status: 401
    code: bad_credentials
    message: Bad credentials.

  resource_missing:
    status: 404
    code: not_found
    message: Not Found.

  validation_failed:
    status: 422
    code: validation_failed
    message: Validation Failed.

fixtures:
  empty: {}

  small-repo:
    issue:
      - id: "1"
        title: Cauldron cannot fake NetSuite yet
        body: Sandboxes for it take weeks to obtain.
        state: open
      - id: "2"
        title: Add a wrapped list envelope for Shopify
        state: closed
    label:
      - id: "1"
        name: bug
        color: d73a4a
