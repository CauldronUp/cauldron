# CockroachDB Cloud Recipe for Cauldron
#
# The cluster listing, read from the OpenAPI document Cockroach Labs publishes
# in its own Go SDK (internal/spec/openapi.json), and struck live against
# cockroachlabs.cloud on 2026-09-13 with no header, with a wrong bearer, on a
# path that does not exist, and with a method the path does not take.
#
# **The error code is a bare 16.** Struck live:
#
#   {
#     "code": 16,
#     "message": "missing authorization header; see https://www.cockroachlabs.com/docs/cockroachcloud/cloud-api.html#call-the-api"
#   }
#
# Sixteen is `UNAUTHENTICATED` in `google.rpc.Code`, and nothing in the response
# says so. A client switching on `code` has an integer from a gRPC enum, in a
# REST body, beside an HTTP status that already carried the same meaning.
#
# **And the message carries a URL with a file extension and an anchor.**
# `cloud-api.html#call-the-api`, inside the prose field, so the sentence a
# client prints contains a link to the section of a web page.
#
# **A wrong bearer names the two things it would have accepted.** "invalid
# secret provided in authorization header; expected either an API key or a JWT"
# -- two credential kinds, disclosed by the failure, in an API whose document
# declares one `securityScheme`, `{"type": "http", "scheme": "bearer"}`, and
# never mentions either.
#
# **A path that does not exist is answered by the credential check.**
# `GET /api/v1/cauldron-nope` with no header answers the same 401, so a typo in
# a path is reported as a missing header.
#
# **Five declared failures, and the document describes the body of none of
# them.** `CockroachCloud_ListClusters` lists 400, 401, 403, 404 and 500, each
# with `"schema": {}` -- an empty schema, which constrains nothing. Only
# `default`, the response nobody looks up, points at a real type. And that type,
# `Status`, is `{code: int32, details: [Any], message}`: the shape the live
# failures actually have, declared once, referenced by no status a caller will
# meet.
#
# **Three status fields, and the type names cross over the field names.** A
# cluster carries `state` (typed `ClusterState.Type`), `operation_status` (typed
# `ClusterStatus.Type`) and `upgrade_status` (typed `ClusterUpgradeStatus.Type`).
# So the field called status is typed Status, the field called state is typed
# State, and the two words mean different things that nothing on the record
# explains.
#
# **`DELETED` is a state a cluster can be in.** `ClusterState.Type` is
# `["CREATING", "CREATED", "CREATION_FAILED", "DELETED", "LOCKED"]`, and
# `deleted_at` is a field beside it, so a deleted cluster is a cluster you can
# still be handed.
#
# **And `LOCKED` is an instruction to the caller.** Its description: "An
# exclusive operation is being performed on this cluster. Other operations
# should not proceed if they did not set a cluster into the LOCKED state." A
# mutual-exclusion protocol, written into an enum member's description, and
# enforced by whoever reads it.
#
# **The paging parameters have dots in their names.** `pagination.page`,
# `pagination.limit`, `pagination.as_of_time`, `pagination.sort_order`,
# `pagination.sort_by` -- a nested message flattened into a query string by a
# gRPC gateway, so the dot is a literal character in the parameter name.
#
# **And one field names a single cloud vendor.**
# `azure_cluster_identity_client_id`, thirty-two characters, on the record that
# also carries `cloud_provider` with `GCP`, `AWS` and `AZURE` in it.
#
# Also pinned: `info.version` is `2024-09-16`, a date; the enum descriptions
# begin with a space and a hyphen because they are protobuf comments rendered as
# a bulleted list of members; and a `PUT` answers 411 Length Required with an
# HTML page whose text reads "POST requests require a Content-length header".

recipe: cockroach
capability: database
version: 0.1.0

upstream:
  api: "2024-09-16"
  docs: https://www.cockroachlabs.com/docs/cockroachcloud/cloud-api
  spec: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
  spec_hash: befbc24a6b230d80b470de34520ad6d3b4eb652f71f8947bcf0ed7d9ece13927
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - ccdb_cauldr0nf1xturek3y00000000000000
  absent_error: missing_authorization_header
  rejected_error: invalid_secret
  # The credential is checked before the path is: an unrouted path answers the
  # same 401, so nothing distinguishes a typo from an anonymous request.

responses:
  list:
    style: wrapped
    key: clusters
    # A keyset token, under a dotted key, with no total anywhere.
    cursor_field: pagination.next_page
  error:
    style: flat
    message_field: message
    # google.rpc.Code, as a bare integer, with nothing naming the enum.
    code_field: code
    code_type: number

resources:
  cluster:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      cockroach_version:
        type: string
      plan:
        type: string
      cloud_provider:
        type: string
      # Typed ClusterState.Type, and DELETED is one of its values.
      state:
        type: string
      # Typed ClusterStatus.Type, on the field whose name says status.
      operation_status:
        type: string
      # And a third, for upgrades alone.
      upgrade_status:
        type: string
      creator_id:
        type: string
      account_id:
        type: string
      parent_id:
        type: string
      cidr_range:
        type: string
      sql_dns:
        type: string
      labels:
        type: map
      regions:
        type: list
      created_at:
        type: datetime
      updated_at:
        type: datetime
      deleted_at:
      # Thirty-two characters naming one cloud vendor, on the generic record.
      azure_cluster_identity_client_id:

routes:
  - method: GET
    path: /api/v1/clusters
    resource: cluster
    operation: list
    pagination:
      style: cursor
      limit: 200
      # The dots are literal: a nested message flattened into a query string.
      limit_param: pagination.limit
      cursor_param: pagination.page

errors:
  missing_authorization_header:
    status: 401
    # UNAUTHENTICATED, as a number, with nothing saying which enum.
    code: "16"
    # With a documentation URL, file extension and anchor, inside the prose.
    message: missing authorization header; see https://www.cockroachlabs.com/docs/cockroachcloud/cloud-api.html#call-the-api

  invalid_secret:
    status: 401
    code: "16"
    # Naming two credential kinds the document declares neither of.
    message: invalid secret provided in authorization header; expected either an API key or a JWT

fixtures:
  empty:
    cluster: []

  estate:
    cluster:
      - id: 7a2b1c9d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        name: production
        cockroach_version: v25.2.4
        plan: ADVANCED
        cloud_provider: AWS
        state: CREATED
        # No ongoing operation, said by a field called status.
        operation_status: UNSPECIFIED
        upgrade_status: FINALIZED
        creator_id: 3f8c2d1e-6a7b-4c5d-9e0f-1a2b3c4d5e6f
        account_id: crl-prod-7a2b1c9d
        parent_id: 11111111-2222-3333-4444-555555555555
        cidr_range: 172.28.0.0/16
        sql_dns: production-7a2b.aws-us-east-1.cockroachlabs.cloud
        labels:
          team: platform
        regions:
          - name: us-east-1
            node_count: 3
            sql_dns: production-7a2b.aws-us-east-1.cockroachlabs.cloud
        created_at: "2026-03-11T14:02:09Z"
        updated_at: "2026-08-30T09:41:52Z"
        deleted_at: null
        azure_cluster_identity_client_id: null
      - id: 9d8c7b6a-5e4f-4d3c-2b1a-0f9e8d7c6b5a
        name: staging
        cockroach_version: v25.1.9
        plan: STANDARD
        cloud_provider: AZURE
        # Deleted, and still in the listing, with the timestamp beside it.
        state: DELETED
        operation_status: UNSPECIFIED
        upgrade_status: UPGRADE_AVAILABLE
        creator_id: 3f8c2d1e-6a7b-4c5d-9e0f-1a2b3c4d5e6f
        account_id: crl-prod-7a2b1c9d
        parent_id: 11111111-2222-3333-4444-555555555555
        cidr_range: 172.29.0.0/16
        sql_dns: staging-9d8c.azure-eastus2.cockroachlabs.cloud
        labels: {}
        regions:
          - name: eastus2
            node_count: 1
            sql_dns: staging-9d8c.azure-eastus2.cockroachlabs.cloud
        created_at: "2026-05-02T08:15:00Z"
        updated_at: "2026-09-01T22:10:44Z"
        deleted_at: "2026-09-01T22:10:44Z"
        azure_cluster_identity_client_id: 8b7a6c5d-4e3f-4a2b-1c0d-9e8f7a6b5c4d

conformance:
  - name: the code is a bare sixteen and the message carries a URL
    source: https://cockroachlabs.cloud/api/v1/clusters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers: {}
    expect:
      status: 401
      body:
        # UNAUTHENTICATED in google.rpc.Code, with nothing naming the enum.
        code: 16
        # A file extension and an anchor, inside the prose a client prints.
        message: missing authorization header; see https://www.cockroachlabs.com/docs/cockroachcloud/cloud-api.html#call-the-api

  - name: a wrong bearer names two credential kinds the document does not
    source: https://cockroachlabs.cloud/api/v1/clusters
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # The one securityScheme is {"type":"http","scheme":"bearer"} and says
        # nothing about API keys or JWTs.
        message: invalid secret provided in authorization header; expected either an API key or a JWT
        code: 16

  - name: a path that does not exist is reported as a missing header
    source: https://cockroachlabs.cloud/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        # The same answer as a real path with no credential, so nothing
        # distinguishes a typo from an unauthenticated request.
        code: 16
        message: missing authorization header; see https://www.cockroachlabs.com/docs/cockroachcloud/cloud-api.html#call-the-api

  - name: a cluster carries three status fields
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # state is ClusterState.Type, operation_status is ClusterStatus.Type,
        # upgrade_status is ClusterUpgradeStatus.Type.
        'clusters[0].state': CREATED
        'clusters[0].operation_status': UNSPECIFIED
        'clusters[0].upgrade_status': FINALIZED
        'clusters[1].upgrade_status': UPGRADE_AVAILABLE
        'clusters[0].name': production
        'clusters[0].cockroach_version': v25.2.4

  - name: a deleted cluster is a cluster the listing still hands you
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # DELETED is a member of ClusterState.Type, beside CREATING and LOCKED.
        'clusters[1].state': DELETED
        'clusters[1].deleted_at': "2026-09-01T22:10:44Z"
        'clusters[0].deleted_at': null
        'clusters[0].created_at': "2026-03-11T14:02:09Z"
        'clusters[0].updated_at': "2026-08-30T09:41:52Z"

  - name: one field names a single cloud vendor
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # Thirty-two characters for one provider, on a record that also
        # carries cloud_provider with three values in it.
        'clusters[1].azure_cluster_identity_client_id': 8b7a6c5d-4e3f-4a2b-1c0d-9e8f7a6b5c4d
        'clusters[0].azure_cluster_identity_client_id': null
        'clusters[0].cloud_provider': AWS
        'clusters[1].cloud_provider': AZURE
        'clusters[0].plan': ADVANCED
        'clusters[1].plan': STANDARD

  - name: the record carries its network and its owners
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        'clusters[0].cidr_range': 172.28.0.0/16
        # The same name on the record and on the region inside it.
        'clusters[0].sql_dns': production-7a2b.aws-us-east-1.cockroachlabs.cloud
        'clusters[0].regions[0].sql_dns': production-7a2b.aws-us-east-1.cockroachlabs.cloud
        'clusters[0].regions[0].name': us-east-1
        'clusters[0].regions[0].node_count': 3
        'clusters[0].creator_id': 3f8c2d1e-6a7b-4c5d-9e0f-1a2b3c4d5e6f
        'clusters[0].account_id': crl-prod-7a2b1c9d
        'clusters[0].parent_id': 11111111-2222-3333-4444-555555555555
        'clusters[0].labels.team': platform
        'clusters[1].labels': {}

  - name: the paging parameters have dots in their names
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
      query:
        # A nested message flattened into a query string, dots and all.
        pagination.limit: "1"
    expect:
      status: 200
      body:
        'clusters[0].id': 7a2b1c9d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      matches:
        # A keyset token, with no total and no count anywhere in the envelope.
        pagination.next_page: '\A\S+\z'

  - name: following the cursor leaves nothing to say you have finished
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: estate
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
      query:
        pagination.limit: "1"
        pagination.page: 7a2b1c9d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    expect:
      status: 200
      body:
        'clusters[0].id': 9d8c7b6a-5e4f-4d3c-2b1a-0f9e8d7c6b5a
      absent:
        # The key simply stops arriving: there is no has_more, no total and no
        # count, so an empty page is how a caller learns it is done.
        - pagination.next_page

  - name: an organisation with no clusters still sends the collection
    source: https://raw.githubusercontent.com/cockroachdb/cockroach-cloud-sdk-go/master/internal/spec/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/clusters
      headers:
        Authorization: "Bearer ccdb_cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        clusters: []
