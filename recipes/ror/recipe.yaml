# ROR (Research Organization Registry) Recipe for Cauldron
#
# A path that does not exist says your authentication is missing, on an API
# that has none.
#
#   GET /v2/nosuchthing  ->  403  {"message": "Missing Authentication Token"}
#
# ROR needs no credential. There is nothing to authenticate with, nothing to
# get wrong, and no header that would make this go away. The message is the
# gateway's default for an unmatched route, and it sends whoever typed the path
# wrong to look for an API key that does not exist -- past the one place the
# fault actually is.
#
# It is a 403 rather than a 404, so a client branching on the status treats a
# typo as a permissions problem and, if it retries anything, retries the wrong
# thing.
#
# **And the identifier is a whole URL, inside the path.**
#
#   GET /v2/organizations/https://ror.org/02mhbdp94
#           ->  200  {"id": "https://ror.org/02mhbdp94", ...}
#
# The record's id is not 02mhbdp94; it is the address of the record. Fetching
# one means putting a URL, scheme and slashes and all, into the path of another
# URL -- so a client that percent-encodes its path segments correctly gets a
# 404, and one that does not gets the record.
#
# Written against the live API rather than a document: every case below was
# checked against api.ror.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Two error shapes, and the one that is not your fault answers 200. An
#      invalid identifier is 404 with {"errors": ["'notanid' is not a valid ROR
#      ID"]} -- an array of bare strings, so a client reading .errors[0].message
#      finds undefined. A page outside the range is the same shape at 200:
#      {"errors": ["page '99999' outside of range 1-500"]}. Same key, same
#      array of sentences, and one of them is not an HTTP failure at all.
#   2. The record carries two schema versions and says which is which.
#      admin.created.schema_version is "1.0" and admin.last_modified
#      .schema_version is "2.1" -- created under one version of the schema,
#      last touched under another, in one object. A client validating against
#      either has a record claiming both.
#   3. The display name is chosen by a magic string inside an array inside an
#      array element. names is a list of {lang, types, value}, and the one to
#      show is whichever has "ror_display" among its types -- so picking a name
#      means a nested search rather than reading a field.
#
# And the page range is 1-500. At the default page size that is 12,500 records,
# of a registry with far more, so the last page is not the end of the data.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One organisation is served, with two of its names, two of its links and
#     one of its relationships. The real record carries eleven top-level keys
#     and far more of each list.
#   - locations and external_ids are left out. Both are arrays of deeply
#     nested objects and neither is what this Recipe is about.
#   - The 403 is served under Cauldron's own content type. Upstream sends
#     application/json, which this matches; what is not reproduced is that the
#     gateway answers before the application is reached at all.

recipe: ror
capability: docs
version: 0.1.0

upstream:
  api: v2
  provider: ror
  docs: https://ror.readme.io/v2/docs/rest-api

auth:
  # Public, and no credential exists -- which is what makes the 403 below
  # remarkable.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # An array of bare strings. A client reading .errors[0].message finds
    # undefined on every one.
    style: string_list
    key: errors

resources:
  organization:
    id:
      style: opaque
      field: id
    fields:
      status:
        type: string
      # A bare year, as an integer.
      established:
        type: integer
      types:
        type: list
      domains:
        type: list
      names:
        type: list
      links:
        type: list
      relationships:
        type: list
      # Two schema versions, in one object, saying which is which.
      admin:
        type: map

routes:
  # A URL inside a URL's path.
  - method: GET
    path: /v2/organizations/https://ror.org/02mhbdp94
    resource: organization
    operation: get
    id_from: auth

  # An identifier that is not one.
  - method: GET
    path: /v2/organizations/notanid
    error: invalid_id

  # A page outside the range: the same shape, at two hundred.
  - method: GET
    path: /v2/organizations-page-out-of-range
    error: page_out_of_range

  # A path that does not exist: the gateway, asking for a credential that does
  # not exist either.
  - method: GET
    path: /v2/nosuchthing
    error: missing_authentication_token

errors:
  invalid_id:
    status: 404
    message: "'notanid' is not a valid ROR ID"

  page_out_of_range:
    # Two hundred, for a request that failed.
    status: 200
    message: "page '99999' outside of range 1-500"

  missing_authentication_token:
    # Not 404, and not this API's shape either: the gateway answers before the
    # application is reached.
    status: 403
    style: flat
    message: Missing Authentication Token

fixtures:
  empty: {}

  uniandes:
    organization:
      # The identifier is the address of the record.
      - id: "https://ror.org/02mhbdp94"
        status: active
        # A bare year.
        established: 1948
        types:
          - education
          - funder
        domains:
          - uniandes.edu.co
        names:
          - lang: es
            types:
              - alias
            value: Uniandes
          # The one to display, chosen by a string inside an array inside an
          # array element.
          - lang: es
            types:
              - ror_display
              - label
            value: Universidad de Los Andes
        links:
          # Typed pairs rather than named fields, and the website is http.
          - type: website
            value: "http://www.uniandes.edu.co/"
          - type: wikipedia
            value: "http://en.wikipedia.org/wiki/University_of_Los_Andes_(Colombia)"
        relationships:
          # A related record, identified by its address again.
          - label: Centro Interdisciplinario de Estudios sobre Desarrollo
            type: child
            id: "https://ror.org/023y7b165"
        admin:
          created:
            date: "2018-11-14"
            # Created under one version of the schema...
            schema_version: "1.0"
          last_modified:
            date: "2026-08-25"
            # ...and last touched under another.
            schema_version: "2.1"

conformance:
  - name: a path that does not exist asks for a credential that does not exist
    source: https://api.ror.org/v2/nosuchthing
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/nosuchthing
    expect:
      # Not 404. A client branching on the status treats a typo as a
      # permissions problem, on an API with no permissions.
      status: 403
      body:
        # The gateway's default, in the gateway's shape rather than this API's.
        message: Missing Authentication Token
      absent:
        # Not the errors array every other failure here uses.
        - "errors[0]"

  - name: the identifier is a whole URL inside the path
    source: "https://api.ror.org/v2/organizations/https://ror.org/02mhbdp94"
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations/https://ror.org/02mhbdp94
    expect:
      status: 200
      body:
        # The record's id is its own address, not the bare 02mhbdp94.
        id: "https://ror.org/02mhbdp94"
        status: active
        # And a related record is identified the same way.
        "relationships[0].id": "https://ror.org/023y7b165"
        "relationships[0].type": child

  - name: an invalid identifier is an array of bare strings
    source: https://api.ror.org/v2/organizations/notanid
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations/notanid
    expect:
      status: 404
      body:
        # A sentence, not an object, so .errors[0].message is undefined.
        "errors[0]": "'notanid' is not a valid ROR ID"

  - name: and a page outside the range is the same shape at two hundred
    source: "https://api.ror.org/v2/organizations?page=99999"
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations-page-out-of-range
    expect:
      # Two hundred, for a request that failed, in the shape reserved for
      # failures.
      status: 200
      body:
        # And the range, which at the default page size stops well short of
        # the registry.
        "errors[0]": "page '99999' outside of range 1-500"

  - name: the record carries two schema versions and says which is which
    source: "https://api.ror.org/v2/organizations/https://ror.org/02mhbdp94"
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations/https://ror.org/02mhbdp94
    expect:
      status: 200
      body:
        # Created under one...
        admin.created.schema_version: "1.0"
        admin.created.date: "2018-11-14"
        # ...and last touched under another, in one object.
        admin.last_modified.schema_version: "2.1"
        admin.last_modified.date: "2026-08-25"

  - name: the display name is chosen by a string inside an array
    source: "https://api.ror.org/v2/organizations/https://ror.org/02mhbdp94"
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations/https://ror.org/02mhbdp94
    expect:
      status: 200
      body:
        # Picking a name means searching a nested list for a magic string
        # rather than reading a field.
        "names[1].types[0]": ror_display
        "names[1].types[1]": label
        "names[1].value": Universidad de Los Andes
        "names[1].lang": es
        # Beside one that is only an alias.
        "names[0].types[0]": alias
        "names[0].value": Uniandes
        "names[0].lang": es

  - name: a bare year and typed pairs where named fields would do
    source: "https://api.ror.org/v2/organizations/https://ror.org/02mhbdp94"
    verified: "2026-08-30"
    fixture: uniandes
    request:
      method: GET
      path: /v2/organizations/https://ror.org/02mhbdp94
    expect:
      status: 200
      body:
        # A year, as an integer, with no month and no day.
        established: 1948
        # Links as typed pairs, and the organisation's own website is http.
        "links[0].type": website
        "links[0].value": "http://www.uniandes.edu.co/"
        "links[1].type": wikipedia
        "links[1].value": "http://en.wikipedia.org/wiki/University_of_Los_Andes_(Colombia)"
        # Two types, one of which is what it does with money.
        "types[0]": education
        "types[1]": funder
        "domains[0]": uniandes.edu.co
