# Scaleway Recipe for Cauldron
#
# The zone is in the path, and the path is not decoration.
#
#   GET /instance/v1/zones/fr-par-1/products/servers   -> 125 server types
#   GET /instance/v1/zones/pl-waw-1/products/servers   -> 40 server types
#
# Both are 200, both are the same map-keyed-by-type-name shape, and the second
# is a strict subset of the first: every one of pl-waw-1's forty names also
# appears in fr-par-1's hundred and twenty-five, and pl-waw-1 has nothing of
# its own. Checked by taking the full three-page catalogue from each zone and
# comparing the two key sets directly, not by eyeballing page one -- page one
# alone is misleading, because fr-par-1's alphabetically-early BASIC2/BASIC3
# families fill it completely and pl-waw-1's legacy PLAY2/POP2/PRO2 lineup
# does not surface until page two of the larger zone.
#
# **The object shape does not change. The catalogue does.** Every entry in
# every zone checked -- fr-par-1, nl-ams-1, pl-waw-1 -- carries exactly the
# same seventeen keys (alt_names, arch, ncpus, ram, gpu, gpu_info, mig_profile,
# volumes_constraint, per_volume_constraint, scratch_storage_max_size,
# scratch_storage_max_volumes_count, monthly_price, hourly_price, capabilities,
# network, block_bandwidth, end_of_service), and a type present in two zones is
# byte-identical between them: PRO2-S and PRO2-L were fetched from fr-par-1 and
# from pl-waw-1 and diffed field for field, and both matched exactly, prices
# included. So the trap here is not a client reading a field that changed
# meaning by region -- it is a client that hardcodes a server type name.
# BASIC2-A12C-24G and the L4 GPU family exist in fr-par-1 and nl-ams-1 and do
# not exist at all in pl-waw-1, and asking for one there is not a different
# shape, it is a hole in the map: the key is simply absent, the same way an
# empty Pusher channel is absent rather than present with a zero.
#
# **Three failures, three shapes, and none of them nest.** All three are flat
# JSON objects with no envelope, and no two of them carry the same fields:
#
#   GET /instance/v1/zones/xx-invalid-9/products/servers
#   ->  400  {"message": "unknown zone in path"}
#
#   GET /instance/v1/zones/fr-par-1/products/serverzz
#   ->  404  {"type": "404", "message": "The requested URL was not found on
#              the server. If you entered the URL manually please check your
#              spelling and try again."}
#
#   GET /instance/v1/products/servers                     (no zone segment)
#   ->  404  {"message": "Not Found"}
#
# The middle one and the last one are both 404 and neither is a subset of the
# other: the middle carries a type field holding the status as a string, the
# last carries no type at all and eleven fewer words. A client that learned
# "a 404 from this API has a type" from the first shape finds nothing where it
# looked on the second.
#
# **And the fourth shape is not a 404 at all.** Every path this Recipe tried
# that is not the two whitelisted product-catalogue routes -- the real,
# documented compute-instance listing at /instance/v1/zones/{zone}/servers,
# and a path that does not exist anywhere, /instance/v1/zones/fr-par-1/nonsense
# -- answered the identical 401 before anything about the path itself was
# checked:
#
#   GET /instance/v1/zones/fr-par-1/servers        (real endpoint, no key)
#   GET /instance/v1/zones/fr-par-1/nonsense       (not a real endpoint)
#   ->  401  {"message": "authentication is denied", "method": "api_key",
#              "reason": "invalid_argument", "type": "denied_authentication"}
#
# Both landed on the same status, the same body, byte for byte. The
# authentication gate runs before routing decides whether the resource on the
# other side of it exists, so an unauthenticated client asking for a typo'd
# path and one asking for the real one it forgot to sign cannot tell the two
# apart from the response alone -- a 401 here says nothing about whether the
# path was even spelled correctly.
#
# Written against the live API rather than a document, with no credential
# ever requested, guessed at, or sent: every case below was checked against
# api.scaleway.com on the date in its verified field.
#
# Why this Recipe does not use Cauldron's scope mechanism for the zone
# segment, even though the path plainly partitions by it: scope matches one
# field against one value, which fits a record that belongs to exactly one
# partition. Scaleway's catalogue does not work that way -- PRO2-S is not
# "pl-waw-1's PRO2-S" and "fr-par-1's PRO2-S" as two records that happen to
# agree, it is one price list answered from several zones at once, and most
# server types here are available from more than one. A scope field can only
# ever equal one zone, so it cannot express "the same record answers for
# fr-par-1 and for nl-ams-1 and not for pl-waw-1" -- it can only express
# disjoint partitions, which is not the shape this catalogue has. What is
# modelled instead is two independent fixtures, one per zone, each a
# deliberately small slice of the real set, picked so their overlap and their
# gaps match what the live catalogues actually contain.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The catalogue is trimmed to four representative types (fr-par-1) and two
#     (pl-waw-1) out of the real 125 and 40. Every one of the four is real,
#     unrounded data; nothing about a type not included here should be
#     inferred from what is.
#   - Pagination is real -- the live endpoint pages at 50 per page by default,
#     accepts page and per_page, and advertises the next page in a Link
#     header -- and only the "next" relation is modelled. The live response
#     also carries rel="first" and rel="last", and its previous-page relation
#     is spelled rel="previous"; Cauldron's own link_header mechanism only
#     ever emits rel="prev", which is not the same four characters, so turning
#     it on here would put a real-looking but wrong relation on the wire. It
#     is left off. x-total-count is a response header on the real endpoint,
#     and Cauldron's count fields are body properties only, so the true total
#     is stated in this file's prose (125 for fr-par-1, 115 for nl-ams-1, 40
#     for pl-waw-1) rather than served anywhere a client could read it.
#   - mig_profile was null on every one of the 125 + 115 + 40 entries this
#     Recipe fetched. It is declared because the field is real and documented,
#     and every fixture below leaves it null because that is the only value
#     ever observed.
#   - Only three zones were checked (fr-par-1, nl-ams-1, pl-waw-1), of the
#     roughly twenty Scaleway publishes. nl-ams-1's catalogue was fetched and
#     spot-checked against fr-par-1's rather than fixtured separately: its
#     BASIC3-X2C-4G entry matched fr-par-1's byte for byte, which is the
#     evidence behind the "identical between zones" claim above, but it does
#     not get its own fixture or routes.
#   - x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-reset were sent
#     on every response this Recipe fetched, success and failure alike, and
#     are not modelled: their value moves with every request this Recipe
#     itself sent while probing, which is the opposite of the fixed fact a
#     Recipe pins down.
#   - The real, authenticated instance-management API (creating, listing and
#     controlling actual servers) is not modelled beyond the one 401 gate
#     above. This Recipe never requested, guessed at or used a credential, so
#     nothing behind that gate could be observed.
#   - GPU entries were only checked with an NVIDIA gpu_manufacturer. Whether
#     any other manufacturer appears anywhere in the catalogue was not
#     surveyed.

recipe: scaleway
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://www.scaleway.com/en/developers/api/instance/

auth:
  # The two product-catalogue routes below take no credential at all, which is
  # the finding: this is the one corner of Scaleway's API that is genuinely
  # public. Everything else -- including the real compute-instance listing --
  # sits behind a key this Recipe never had, so it is modelled below as a
  # fixed 401 rather than as a Recipe-wide scheme that would wrongly gate the
  # public routes too.
  scheme: none

responses:
  list:
    # Keyed by the server type's own name -- BASIC2-A12C-24G, L4-4-24G,
    # PRO2-S -- not an array. Looping over it as a list finds nothing, and a
    # type not sold in a zone is absent from the object entirely rather than
    # present with nothing in it, the same way an unoccupied Pusher channel
    # is absent from its own listing.
    style: map
    key: servers
  error:
    # All three failure shapes below are flat objects with no envelope. They
    # disagree about which other fields ride beside the message, which is why
    # none of the three declares a code_field or type_field here: each one
    # states its own extra keys as literal fields on the named error instead,
    # because a Recipe-wide type_field would stamp the same key onto all
    # three and none of them actually agree on it.
    style: flat
    message_field: message

resources:
  # The product catalogue: what a zone can build, not what an account has
  # built. Named server_type rather than server so it is never confused with
  # the real, authenticated /servers endpoint this Recipe does not reach --
  # that resource is an account's running instances, and this one is a price
  # list.
  server_type:
    collection: servers
    id:
      # BASIC2-A12C-24G, L4-4-24G, PRO2-S: structured, not random, and not
      # numeric, hex, timestamp or UUID either. Left at the default field
      # ("id") on purpose -- the map style above needs the identifier to
      # survive internally under exactly that name so it can key each entry
      # by it and then strip it back out, the same reason uscensus's
      # variable codes and PDBe's entry ids both stay at the default here.
      style: opaque
    fields:
      alt_names:
        type: list
      arch:
        type: string
      ncpus:
        type: integer
      ram:
        type: integer
      gpu:
        type: integer
      # An object with a manufacturer, a name and a memory size when the type
      # carries a GPU, and null on every type that does not. Never a zero or
      # an empty object -- absence is spelled null here, not omission.
      gpu_info:
        type: map
      # Real, documented, and null on every one of the 280 entries this
      # Recipe fetched across three zones. See the header comment.
      mig_profile:
        type: string
      volumes_constraint:
        type: map
      per_volume_constraint:
        type: map
      scratch_storage_max_size:
        type: integer
      scratch_storage_max_volumes_count:
        type: integer
      # A float, not a string -- 115.194, not "115.194" -- and not the same
      # number of decimal places from one entry to the next.
      monthly_price:
        type: number
      hourly_price:
        type: number
      capabilities:
        type: map
      network:
        type: map
      block_bandwidth:
        type: integer
      end_of_service:
        type: boolean

  # /products/servers/availability: the same map, the same keys, and one field
  # in each value instead of seventeen.
  availability:
    collection: servers
    id:
      style: opaque
    fields:
      # available, scarce or shortage -- all three seen live. Not a boolean:
      # a client that only checks for "available" cannot tell scarce from
      # shortage, and both are real states between "yes" and "no".
      availability:
        type: string
        default: available

routes:
  - method: GET
    path: /instance/v1/zones/{zone}/products/servers
    resource: server_type
    operation: list
    # The real default: 50 per page, page and per_page as the parameter
    # names, confirmed by requesting per_page=2 and reading page 2 back.
    pagination:
      style: page
      limit: 50
      limit_param: per_page
      cursor_param: page
    list:
      # Only next -- see the header comment on why prev, first and last are
      # not modelled here.
      link_header: true

  - method: GET
    path: /instance/v1/zones/{zone}/products/servers/availability
    resource: availability
    operation: list
    pagination:
      style: page
      limit: 50
      limit_param: per_page
      cursor_param: page
    list:
      link_header: true

  # Synthetic: Cauldron routes on a path's literal shape and has no way to
  # say "any string that is not a real zone," so this is the exact literal
  # example checked live. A real client would send a real zone name here;
  # what this pins down is what happens when it does not.
  - method: GET
    path: /instance/v1/zones/xx-invalid-9/products/servers
    error: unknown_zone

  # A valid zone and a resource name that is not "servers" -- checked against
  # fr-par-1 only, not asserted to hold for every zone.
  - method: GET
    path: /instance/v1/zones/fr-par-1/products/serverzz
    error: not_found_typed

  # Synthetic: the real path with its {zone} segment removed entirely, which
  # is a different failure from asking for an invalid zone value -- see the
  # header comment on why the two 404s below do not share a shape.
  - method: GET
    path: /instance/v1/products/servers
    error: not_found_bare

  # The real, documented compute-instance listing. Modelled only as the one
  # thing this Recipe could observe without a credential: the refusal.
  - method: GET
    path: /instance/v1/zones/{zone}/servers
    error: authentication_denied

  # Not a real endpoint at all -- and refused identically to the real one
  # above, because the authentication gate runs before routing checks whether
  # anything is on the other side of it.
  - method: GET
    path: /instance/v1/zones/fr-par-1/nonsense
    error: authentication_denied

errors:
  unknown_zone:
    status: 400
    message: "unknown zone in path"

  # Carries a type holding the status as a string, which the other 404 below
  # does not. Not modelled through type_field, because that would apply to
  # every error in this Recipe uniformly and only this one carries it -- it
  # is stated as a literal extra field on this failure alone instead.
  not_found_typed:
    status: 404
    message: "The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again."
    fields:
      type: "404"

  # Same status as not_found_typed, eleven fewer words, and no type field at
  # all -- a different layer of the stack answering a differently-shaped path.
  not_found_bare:
    status: 404
    message: "Not Found"

  # The gate every non-public route sits behind. type here is a category --
  # denied_authentication -- not the status as a string, which is the other
  # thing "type" means in this same Recipe two errors up.
  authentication_denied:
    status: 401
    message: "authentication is denied"
    fields:
      method: api_key
      reason: invalid_argument
      type: denied_authentication

fixtures:
  empty: {}

  fr-par-1-catalog:
    server_type:
      # arm64. Not sold in pl-waw-1 at all -- see the pl-waw-1-catalog
      # fixture below, where this key is simply absent.
      - id: BASIC2-A12C-24G
        alt_names: []
        arch: arm64
        ncpus: 12
        ram: 25769803776
        gpu: 0
        gpu_info: null
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 115.194
        hourly_price: 0.1578
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 0
        network:
          ipv6_support: true
          sum_internal_bandwidth: 1200000000
          sum_internet_bandwidth: 1200000000
          interfaces:
            - internal_bandwidth: 1200000000
              internet_bandwidth: 1200000000
        block_bandwidth: 335544320
        end_of_service: false

      # A GPU type. Four NVIDIA L4s, not one -- gpu is 4, not a boolean --
      # and also not sold in pl-waw-1.
      - id: L4-4-24G
        alt_names: []
        arch: x86_64
        ncpus: 32
        ram: 206158430208
        gpu: 4
        gpu_info:
          gpu_manufacturer: NVIDIA
          gpu_name: L4
          gpu_memory: 25769803776
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 2299.5
        hourly_price: 3.15
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 8
        network:
          ipv6_support: true
          sum_internal_bandwidth: 10000000000
          sum_internet_bandwidth: 10000000000
          interfaces:
            - internal_bandwidth: 10000000000
              internet_bandwidth: 10000000000
        block_bandwidth: 2621440000
        end_of_service: false

      # Legacy x86_64. Sold in pl-waw-1 too, at the identical values below --
      # this is the "same shape, same values, different zone" half of the
      # comparison.
      - id: PRO2-S
        alt_names: []
        arch: x86_64
        ncpus: 8
        ram: 34359738368
        gpu: 0
        gpu_info: null
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 163.0674
        hourly_price: 0.22338
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 0
        network:
          ipv6_support: true
          sum_internal_bandwidth: 1500000000
          sum_internet_bandwidth: 1500000000
          interfaces:
            - internal_bandwidth: 1500000000
              internet_bandwidth: 1500000000
        block_bandwidth: 524288000
        end_of_service: false

      # Also sold in pl-waw-1, at the identical values below.
      - id: PRO2-L
        alt_names: []
        arch: x86_64
        ncpus: 32
        ram: 137438953472
        gpu: 0
        gpu_info: null
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 653.0142
        hourly_price: 0.89454
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 0
        network:
          ipv6_support: true
          sum_internal_bandwidth: 6000000000
          sum_internet_bandwidth: 6000000000
          interfaces:
            - internal_bandwidth: 6000000000
              internet_bandwidth: 6000000000
        block_bandwidth: 2097152000
        end_of_service: false

    availability:
      - id: BASIC2-A12C-24G
        availability: available
      # Four of these are hard to keep in stock.
      - id: L4-4-24G
        availability: shortage
      - id: PRO2-S
        availability: available
      - id: PRO2-L
        availability: scarce

  # pl-waw-1's real catalogue is forty types, every one of which is also in
  # fr-par-1's hundred and twenty-five. This fixture holds the two that
  # overlap with the fr-par-1-catalog fixture above, at the same values, and
  # omits the two that do not exist here at all.
  pl-waw-1-catalog:
    server_type:
      - id: PRO2-S
        alt_names: []
        arch: x86_64
        ncpus: 8
        ram: 34359738368
        gpu: 0
        gpu_info: null
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 163.0674
        hourly_price: 0.22338
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 0
        network:
          ipv6_support: true
          sum_internal_bandwidth: 1500000000
          sum_internet_bandwidth: 1500000000
          interfaces:
            - internal_bandwidth: 1500000000
              internet_bandwidth: 1500000000
        block_bandwidth: 524288000
        end_of_service: false

      - id: PRO2-L
        alt_names: []
        arch: x86_64
        ncpus: 32
        ram: 137438953472
        gpu: 0
        gpu_info: null
        mig_profile: null
        volumes_constraint:
          min_size: 0
          max_size: 0
        per_volume_constraint:
          l_ssd:
            min_size: 0
            max_size: 0
        scratch_storage_max_size: 0
        scratch_storage_max_volumes_count: 0
        monthly_price: 653.0142
        hourly_price: 0.89454
        capabilities:
          boot_types: [local, rescue]
          placement_groups: true
          block_storage: true
          hot_snapshots_local_volume: false
          private_network: 8
          max_file_systems: 0
        network:
          ipv6_support: true
          sum_internal_bandwidth: 6000000000
          sum_internet_bandwidth: 6000000000
          interfaces:
            - internal_bandwidth: 6000000000
              internet_bandwidth: 6000000000
        block_bandwidth: 2097152000
        end_of_service: false

    availability:
      - id: PRO2-S
        availability: available
      - id: PRO2-L
        availability: scarce

conformance:
  - name: the catalogue is a map keyed by the server type's own name
    source: https://api.scaleway.com/instance/v1/zones/fr-par-1/products/servers
    verified: "2026-08-31"
    fixture: fr-par-1-catalog
    request:
      method: GET
      path: /instance/v1/zones/fr-par-1/products/servers
    expect:
      status: 200
      body:
        servers.BASIC2-A12C-24G.arch: arm64
        servers.BASIC2-A12C-24G.ncpus: 12
        servers.BASIC2-A12C-24G.monthly_price: 115.194
      absent:
        # Not an array. Indexing into it finds nothing.
        - servers[0]
        - id

  - name: a GPU type carries a manufacturer, a name and a memory size nested under it
    source: https://api.scaleway.com/instance/v1/zones/fr-par-1/products/servers
    verified: "2026-08-31"
    fixture: fr-par-1-catalog
    request:
      method: GET
      path: /instance/v1/zones/fr-par-1/products/servers
    expect:
      status: 200
      body:
        # Four GPUs, not a boolean.
        servers.L4-4-24G.gpu: 4
        servers.L4-4-24G.gpu_info.gpu_manufacturer: NVIDIA
        servers.L4-4-24G.gpu_info.gpu_name: L4
        servers.L4-4-24G.gpu_info.gpu_memory: 25769803776
        # An ordinary type's gpu_info is null, not an empty object and not
        # simply absent.
        servers.BASIC2-A12C-24G.gpu_info: null

  - name: the object shape is identical from a zone that does not sell either type
    source: https://api.scaleway.com/instance/v1/zones/pl-waw-1/products/servers
    verified: "2026-08-31"
    fixture: pl-waw-1-catalog
    request:
      method: GET
      path: /instance/v1/zones/pl-waw-1/products/servers
    expect:
      status: 200
      # Neither key exists here at all -- not present with an empty object,
      # not present with a null. pl-waw-1 does not sell arm64 or GPU types,
      # and the map simply has no entry for either.
      absent:
        - servers.BASIC2-A12C-24G
        - servers.L4-4-24G

  - name: a type both zones sell answers with the identical values in each
    source: https://api.scaleway.com/instance/v1/zones/fr-par-1/products/servers
    verified: "2026-08-31"
    fixture: fr-par-1-catalog
    request:
      method: GET
      path: /instance/v1/zones/fr-par-1/products/servers
    expect:
      status: 200
      body:
        servers.PRO2-S.monthly_price: 163.0674
        servers.PRO2-S.hourly_price: 0.22338
        servers.PRO2-S.ram: 34359738368
        servers.PRO2-L.network.sum_internal_bandwidth: 6000000000

  - name: and the same type from pl-waw-1 answers with exactly the same values
    source: https://api.scaleway.com/instance/v1/zones/pl-waw-1/products/servers
    verified: "2026-08-31"
    fixture: pl-waw-1-catalog
    request:
      method: GET
      path: /instance/v1/zones/pl-waw-1/products/servers
    expect:
      status: 200
      body:
        # Priced, specced and byte-identical to the fr-par-1 case above --
        # the same product, sold from two zones at once, not two coincidences.
        servers.PRO2-S.monthly_price: 163.0674
        servers.PRO2-S.hourly_price: 0.22338
        servers.PRO2-S.ram: 34359738368
