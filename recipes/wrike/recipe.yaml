# Wrike Recipe for Cauldron
#
# Written against Wrike's API reference at developers.wrike.com and struck live
# against www.wrike.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The same body arrives as text/plain on one path and application/json on
# another.** Struck live, three requests:
#
#   GET /api/v4/tasks                     (no credential)
#   401  Content-Type: text/plain
#   {"errorDescription":"Authorization method unknown","error":"not_authorized"}
#
#   GET /api/v4/tasks                     Authorization: Bearer not-a-real-token
#   401  Content-Type: text/plain
#   {"errorDescription":"Access token is unknown or invalid","error":"not_authorized"}
#
#   GET /api/v4/cauldron-nope             Authorization: Bearer not-a-real-token
#   401  Content-Type: application/json
#   {"errorDescription":"Access token is unknown or invalid","error":"not_authorized"}
#
# The second and third are byte-identical JSON. The declared type is not. A
# route Wrike serves says text/plain; a route it does not says
# application/json -- so the header is right on the path that does not exist and
# wrong on the one that does.
#
# The consequence is precise: any client that checks the content type before
# parsing -- Guzzle with a JSON middleware, Axios' default transform, Go's
# encoding/json behind a type switch -- refuses to parse the refusal it will
# actually receive, and parses the one it gets only when the URL is wrong.
# Which means the failure looks like a transport bug on the correct path and
# like a clean error on the incorrect one, exactly backwards.
#
# **An unknown path is a 401, not a 404.** The credential is judged before the
# route, so a typo in a URL is reported as an authentication problem for as long
# as the credential is also wrong -- and there is no way, from outside, to find
# out whether a path exists without a working token.
#
# **The two credential failures differ, and usefully.** "Authorization method
# unknown" for a request with no header, "Access token is unknown or invalid"
# for one with a token nobody issued. Both under `error: "not_authorized"`, so
# the machine-readable field is the same and the sentence is the part that
# separates them -- the ordinary trade, and here the sentences are at least
# accurate about which mistake was made.
#
# **The field is called `errorDescription`.** Not message, not detail, not
# error_description. One camel-case field carrying the prose beside a
# snake-free `error` carrying the code, in an API whose record fields are
# camel-case too -- so the envelope is consistent with the records and with
# nothing else.

recipe: wrike
capability: issues
version: 0.1.0

upstream:
  api: v4
  docs: https://developers.wrike.com/overview/
  # No spec: Wrike's reference is a rendered documentation site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000
  # Two sentences under one code, struck live.
  absent_error: method_unknown
  rejected_error: token_unknown

responses:
  # Struck live on every route Wrike actually serves. The header says text and
  # the body is JSON, so a client that trusts the header does not parse the
  # refusal it will really get. Served exactly as observed, because a fake
  # sending application/json here would hide the whole finding.
  content_type: text/plain
  list:
    style: wrapped
    key: data
    # A token, and absent rather than null when there is no next page.
    cursor_field: nextPageToken
    fields:
      # Wrike stamps the entity kind on every collection.
      kind: tasks
  error:
    style: flat
    # Camel-case prose beside a lower-case code, in an envelope whose only two
    # fields disagree about how to spell a name.
    message_field: errorDescription
    code_field: "-"

resources:
  task:
    id:
      # Wrike's identifiers are two base64-ish tokens: an account-scoped
      # prefix and the record. Not a UUID, not a number.
      field: id
      style: opaque
    fields:
      accountId:
        type: string
      title:
        type: string
      status:
        type: string
        default: Active
      importance:
        type: string
        default: Normal
      createdDate:
        type: datetime
      updatedDate:
        type: datetime
      permalink:
        type: string
      customStatusId:
        type: string

routes:
  - method: GET
    path: /api/v4/tasks
    resource: task
    operation: list
    pagination:
      # Wrike pages with pageSize and a nextPageToken, and only when
      # pageSize is sent -- an unpaged request answers everything.
      style: cursor
      limit: 100
      limit_param: pageSize
      cursor_param: nextPageToken

errors:
  method_unknown:
    status: 401
    # A request with no Authorization header at all. "Method" here means the
    # authentication method, not the HTTP verb, which is a word this sentence
    # picks badly.
    message: "Authorization method unknown"
    fields:
      error: not_authorized

  token_unknown:
    status: 401
    message: "Access token is unknown or invalid"
    fields:
      error: not_authorized

fixtures:
  empty:
    task: []

  account:
    task:
      - id: IEACJ7L6KQAAAAAA
        accountId: IEACJ7L6
        title: Draft the migration plan
        status: Active
        importance: High
        createdDate: "2026-08-11T09:14:00Z"
        updatedDate: "2026-09-02T16:40:00Z"
        permalink: "https://www.wrike.com/open.htm?id=1180000001"
        customStatusId: IEACJ7L6JMAAAAAA
      - id: IEACJ7L6KQAAAAAB
        accountId: IEACJ7L6
        title: Review the API contract
        # Completed, and still Active-shaped: Wrike's `status` is one of four
        # fixed values and the account's own workflow lives in
        # customStatusId, so two tasks that look identical here can be in
        # different columns on the board.
        status: Completed
        importance: Normal
        createdDate: "2026-07-30T11:02:00Z"
        updatedDate: "2026-08-28T08:15:00Z"
        permalink: "https://www.wrike.com/open.htm?id=1180000002"
        customStatusId: IEACJ7L6JMAAAAAB

conformance:
  - name: a refusal is JSON declared as text
    source: https://www.wrike.com/api/v4/tasks
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers: {}
    expect:
      status: 401
      headers:
        # Struck live. The body below is JSON and the header says otherwise,
        # so a client checking the type before parsing refuses the refusal.
        Content-Type: text/plain
      body:
        errorDescription: "Authorization method unknown"
        error: not_authorized

  - name: a wrong token says so in a different sentence
    source: https://www.wrike.com/api/v4/tasks
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer not-a-real-token"
    expect:
      status: 401
      body:
        # A different sentence under the same code, which is the useful half:
        # `error` is not_authorized for both and only the prose separates
        # "you sent nothing" from "you sent something wrong".
        errorDescription: "Access token is unknown or invalid"
        error: not_authorized

  - name: an unknown path is a credential failure
    source: https://www.wrike.com/api/v4/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v4/cauldron-nope
      headers:
        Authorization: "Bearer not-a-real-token"
    expect:
      # Struck live: 401, not 404. The credential is judged before the route,
      # so a path cannot be shown not to exist without a working token.
      status: 401
      body:
        errorDescription: "Access token is unknown or invalid"

  - name: a task listing wraps its records and names their kind
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        # kind beside data on every collection, naming the entity type.
        kind: tasks
        'data[0].title': Draft the migration plan

  - name: an identifier is an opaque token rather than a number
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        # Sixteen characters of base64 alphabet, and the account id is a
        # prefix of it -- so a task id carries which account it belongs to and
        # nothing validates it as a UUID or an integer.
        'data[0].id': IEACJ7L6KQAAAAAA
        'data[0].accountId': IEACJ7L6

  - name: the permalink is not built from the identifier
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        # The URL a person opens carries a decimal number that appears nowhere
        # else on the record, so a client cannot construct one from `id` and
        # cannot recover `id` from a link somebody pasted.
        'data[0].permalink': "https://www.wrike.com/open.htm?id=1180000001"

  - name: the status a client reads is not the status on the board
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        # `status` is one of four fixed values; the account's own workflow is
        # customStatusId, which needs a second request to resolve. Two tasks
        # reading Completed here can sit in different columns.
        'data[1].status': Completed
        'data[1].customStatusId': IEACJ7L6JMAAAAAB
        'data[0].importance': High

  - name: dates are UTC with no offset
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        'data[1].createdDate': "2026-07-30T11:02:00Z"
        'data[1].updatedDate': "2026-08-28T08:15:00Z"

  - name: paging needs pageSize before a token appears
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
      query:
        pageSize: "1"
    expect:
      status: 200
      body:
        'data[0].id': IEACJ7L6KQAAAAAA
      matches:
        # Wrike hands back a nextPageToken only once a pageSize is asked for.
        # A caller who never sends one is served the whole collection and
        # never sees a cursor, so paging is opt-in and its absence looks like
        # a complete answer either way.
        nextPageToken: '.'

  - name: the last page carries no token forward
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: account
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
      query:
        pageSize: "1"
        nextPageToken: IEACJ7L6KQAAAAAB
    expect:
      status: 200
      absent:
        - nextPageToken

  - name: an account with no tasks answers an empty array
    source: https://developers.wrike.com/api/v4/tasks/
    fixture: empty
    request:
      method: GET
      path: /api/v4/tasks
      headers:
        Authorization: "Bearer eyJ0dCI6InAifQ.cauldronwrikefixturetoken000000"
    expect:
      status: 200
      body:
        kind: tasks
        data: []
