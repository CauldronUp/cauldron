# Percy Recipe for Cauldron
#
# The build listing, read from Percy's own published CLI client
# (percy/cli's packages/client/src/client.js), and struck live against
# percy.io on 2026-09-13 with no credential and with a wrong token.
#
# **A missing credential is Forbidden and a wrong one is Unauthorized.** Struck
# live:
#
#   (no header)          403  {"errors":[{"status":"forbidden"}]}
#   Token notarealtoken  401  {"errors":[{"status":"unauthorized","detail":"Invalid API token."}]}
#
# The two statuses are the wrong way round -- 401 is for a caller who has not
# authenticated -- and the prose field appears on only one of them, so the
# failure with nothing to say is the one you get for sending nothing.
#
# **And `status` is a word.** JSON:API defines the member as "the HTTP status
# code applicable to this problem, expressed as a string value". Percy sends
# `"forbidden"` and `"unauthorized"`, which are reason phrases, lowercased.
# There is no `title` and no `code` on either.
#
# **Every multi-word attribute is kebab-case.** `target-branch`, `commit-sha`,
# `commit-author-email`, `pull-request-number`, `parallel-nonce`,
# `cli-start-time`, `skip-base-build` -- so in the JavaScript client that reads
# them, every access is `attributes['commit-sha']` and never a property.
#
# **A build carries two people's email addresses.** `commit-author-email` and
# `commit-committer-email` are sent on every build and stored on the record, so
# a visual-testing run holds the git identities of whoever wrote and whoever
# applied the commit.
#
# **An absent state and a pending one are the same thing.** The vendor's own
# poller reads `!state || state === 'pending' || state === 'processing'` -- so a
# build whose `state` is missing entirely is treated as still running, and the
# field's absence is a value.
#
# **Another product's identifiers are on the record.** `testhub-build-uuid` and
# `testhub-build-run-id` travel with every build, and one of the `source`
# values a build can carry is `bstack_sdk_created` -- the parent company's
# initials, in an enum, on a Percy build.
#
# **And the client ships a comment saying one field does nothing.** From
# `client.js`: "PER-9724: internal-only priority request... percy-api only
# honors this for eligible internal build types, so it is a no-op for customer
# builds." A ticket number, an internal product name, and an admission that the
# attribute is inert for everyone reading it, in published code.

recipe: percy
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://www.browserstack.com/docs/percy/api-reference
  # No spec: Percy publishes an open-source CLI client rather than a
  # machine-readable description, and no OpenAPI document is served at any
  # address this Recipe could find. The record shape below is that client's own
  # attribute names.

auth:
  scheme: bearer
  header: Authorization
  # Percy's own scheme word.
  prefix: "Token "
  keys:
    - web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000
  # Forbidden, to a caller who presented nothing...
  absent_error: forbidden
  # ...and Unauthorized to one who presented something.
  rejected_error: unauthorized
  malformed_error: forbidden
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    message_field: detail
    # Where JSON:API asks for the status code as a string, and this is a word.
    code_field: status

resources:
  build:
    id:
      field: id
      style: numeric
      type: number
    fields:
      # JSON:API's own discriminator.
      type:
        type: string
      state:
        in: attributes
      branch:
        type: string
        in: attributes
      # Kebab-case, so every read in JavaScript is a bracket.
      target-branch:
        in: attributes
      target-commit-sha:
        in: attributes
      commit-sha:
        in: attributes
      commit-committed-at:
        in: attributes
      commit-author-name:
        in: attributes
      # Two people's addresses, on a visual-testing record.
      commit-author-email:
        in: attributes
      commit-committer-name:
        in: attributes
      commit-committer-email:
        in: attributes
      commit-message:
        in: attributes
      pull-request-number:
        in: attributes
      parallel-nonce:
        in: attributes
      parallel-total-shards:
        in: attributes
      partial:
        in: attributes
      tags:
        type: list
        in: attributes
      cli-start-time:
        in: attributes
      source:
        type: string
        in: attributes
      skip-base-build:
        in: attributes
      # Another product's identifiers, on this one's record.
      testhub-build-uuid:
        in: attributes
      testhub-build-run-id:
        in: attributes

routes:
  - method: GET
    path: /api/v1/builds
    resource: build
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: page[limit]
      cursor_param: page[number]

errors:
  forbidden:
    # Forbidden, to a caller who presented nothing at all.
    status: 403
    # A reason phrase, lowercased, where JSON:API asks for a status code.
    code: forbidden
    # And nothing else: no detail, no title.
    message_field: "-"

  unauthorized:
    status: 401
    code: unauthorized
    message: Invalid API token.

fixtures:
  empty:
    build: []

  project:
    build:
      - id: 48213771
        type: builds
        state: finished
        branch: main
        target-branch: main
        target-commit-sha: 0f1e2d3c4b5a69788796a5b4c3d2e1f009182736
        commit-sha: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
        commit-committed-at: "2026-09-08T14:22:10Z"
        commit-author-name: A. Person
        # Two addresses, on every build.
        commit-author-email: person@example.com
        commit-committer-name: A. Person
        commit-committer-email: person@example.com
        commit-message: Tighten the checkout layout
        pull-request-number: 4127
        parallel-nonce: null
        parallel-total-shards: null
        partial: false
        tags: []
        cli-start-time: "2026-09-08T14:23:01.114Z"
        source: user_created
        skip-base-build: false
        # Another product's identifiers.
        testhub-build-uuid: null
        testhub-build-run-id: null
      - id: 48213998
        type: builds
        # Missing entirely, which the vendor's own poller reads as running.
        state: null
        branch: feature/pricing
        target-branch: main
        target-commit-sha: 0f1e2d3c4b5a69788796a5b4c3d2e1f009182736
        commit-sha: 998877665544332211000faced0ffice0badc0de
        commit-committed-at: "2026-09-12T09:00:00Z"
        commit-author-name: Another Person
        commit-author-email: another@example.com
        commit-committer-name: A. Person
        commit-committer-email: person@example.com
        commit-message: Pricing page
        pull-request-number: null
        parallel-nonce: 4f3e2d1c
        parallel-total-shards: 4
        partial: true
        tags:
          - nightly
        cli-start-time: null
        # The parent company's initials, in an enum value.
        source: bstack_sdk_created
        skip-base-build: true
        testhub-build-uuid: 6c5b4a39-2817-4605-9483-726150493827
        testhub-build-run-id: "918273645"

conformance:
  - name: a missing credential is Forbidden and a wrong one is Unauthorized
    source: https://percy.io/api/v1/builds
    verified: "2026-09-13"
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers: {}
    expect:
      # The wrong way round: 403 for the request carrying nothing.
      status: 403
      body:
        # A reason phrase, lowercased, where JSON:API asks for a status code
        # as a string.
        'errors[0].status': forbidden
      absent:
        # No prose at all on the failure you get for sending nothing.
        - errors[0].detail

  - name: and the one carrying something gets a sentence with it
    source: https://percy.io/api/v1/builds
    verified: "2026-09-13"
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token notarealtoken"
    expect:
      status: 401
      body:
        'errors[0].status': unauthorized
        'errors[0].detail': Invalid API token.

  - name: every multi-word attribute is kebab-case
    source: https://github.com/percy/cli
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Every read of these in the vendor's own JavaScript is a bracket.
        'data[0].attributes.target-branch': main
        'data[0].attributes.commit-sha': a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
        'data[0].attributes.target-commit-sha': 0f1e2d3c4b5a69788796a5b4c3d2e1f009182736
        'data[0].attributes.pull-request-number': 4127
        'data[0].attributes.cli-start-time': "2026-09-08T14:23:01.114Z"
        'data[0].attributes.skip-base-build': false

  - name: a build carries two people's email addresses
    source: https://github.com/percy/cli
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Whoever wrote the commit, and whoever applied it.
        'data[0].attributes.commit-author-email': person@example.com
        'data[0].attributes.commit-committer-email': person@example.com
        'data[1].attributes.commit-author-email': another@example.com
        'data[1].attributes.commit-committer-email': person@example.com
        'data[0].attributes.commit-author-name': A. Person
        'data[1].attributes.commit-committer-name': A. Person
        'data[0].attributes.commit-message': Tighten the checkout layout
        'data[0].attributes.commit-committed-at': "2026-09-08T14:22:10Z"

  - name: an absent state is a state
    source: https://github.com/percy/cli
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # !state || state === 'pending' || state === 'processing', in the
        # vendor's own poller.
        'data[1].attributes.state': null
        'data[0].attributes.state': finished
        'data[0].attributes.branch': main
        'data[1].attributes.branch': feature/pricing

  - name: another product's identifiers travel on this one's record
    source: https://github.com/percy/cli
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        'data[1].attributes.testhub-build-uuid': 6c5b4a39-2817-4605-9483-726150493827
        'data[1].attributes.testhub-build-run-id': "918273645"
        'data[0].attributes.testhub-build-uuid': null
        # And the parent company's initials, in an enum value.
        'data[1].attributes.source': bstack_sdk_created
        'data[0].attributes.source': user_created

  - name: the shard fields are null on a build that is not sharded
    source: https://github.com/percy/cli
    fixture: project
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
      query:
        page[limit]: "2"
        page[number]: "1"
    expect:
      status: 200
      body:
        'data[0].attributes.parallel-nonce': null
        'data[0].attributes.parallel-total-shards': null
        'data[1].attributes.parallel-nonce': 4f3e2d1c
        'data[1].attributes.parallel-total-shards': 4
        'data[0].attributes.partial': false
        'data[1].attributes.partial': true
        'data[0].attributes.tags': []
        'data[1].attributes.tags[0]': nightly
        # JSON:API's discriminator, on every entry.
        'data[0].type': builds
        'data[0].id': 48213771

  - name: a project with no builds still sends the JSON:API envelope
    source: https://github.com/percy/cli
    fixture: empty
    request:
      method: GET
      path: /api/v1/builds
      headers:
        Authorization: "Token web_cauldr0nf1xturet0k3n00000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        data: []
