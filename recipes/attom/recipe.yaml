# ATTOM Data Solutions Recipe for Cauldron
#
# See rentcast/recipe.yaml for the header this group of three Recipes
# shares: does a valuation admit a confidence score or a range, does any
# field distinguish a county's own record date from the date the API last
# recomputed, and does an uncovered address answer differently from a
# malformed one. ATTOM is the thinnest of the three on that question, and
# the reason is structural rather than evasive: every live call this Recipe
# made failed authentication, by design (no account exists, no key was ever
# requested), and the publicly crawlable half of ATTOM's own documentation
# gates every worked response example behind a login wall its parameter
# tables sit in front of. What this Recipe can show is the wire's own
# failure shapes, in unusual and precise detail, and what its own status-
# code reference states about success -- not a property record with real
# numbers in it, because none was ever found or observed.
#
# **The gateway answers a "success" inside a status the HTTP layer never
# calls 200 -- and it is a 400, not the 200 the task that started this group
# of Recipes expected to find.** ATTOM's own Response/Status Codes reference
# lists code 0 as "SuccessWithResult" and code 400 as "SuccessWithoutResult"
# -- "Your request was successful but returned no results" -- both inside
# the same {"status": {"code", "msg", ...}} object every response on this
# host carries. That pairing (400, "SuccessWithoutResult") could not be
# triggered live -- no credential exists to reach a route that would need
# one -- so it is stated as the strongest available reading rather than
# served as an observed fact: ATTOM's own billing page states that "only
# queries that respond with a 200 response code... are counted towards
# monthly allowances," language that only makes sense if some real queries
# answer with something other than 200, and every status this Recipe COULD
# observe live had its "code" mirror the actual HTTP status number exactly
# (401 rode inside a "code": "401", 404 inside "code": "404"). Putting those
# two facts together, the likeliest reading is that a well-formed,
# uncovered address answers real HTTP 400, with the word "Success" sitting
# inside that 400's own message -- the mirror image of the success-shaped-
# failure this task named as its fourth data point (Expensify, Google Maps,
# VWO already carry the shape the other way: a 200 wrapping a failure).
# Here, if this reading holds, it is a 400 wrapping something that calls
# itself success. Recorded below with no verified date, and the header says
# so twice on purpose.
#
# **Missing and wrong collapse to one sentence, the same way Airbyte's does
# elsewhere in this collection -- and that sentence is itself status-shaped.**
# Struck live, api.gateway.attomdata.com, 2026-09-02, no account, no key:
#
#   GET /propertyapi/v1.0.0/property/basicprofile?address1=...&address2=...
#     no apikey header at all       -> 401
#     apikey: junk-obviously-fake-key-0000000000  -> 401, byte-identical
#     apikey: (empty string)        -> 401, byte-identical
#
#   {"Response":{"status":{"version":"1.0.0","code":"401","msg":"Unauthorized",
#     "total":"0","page":"0","pagesize":"0"}}}
#
# code travels as a JSON STRING here ("401", not 401) on every failure this
# Recipe observed -- worth pinning precisely, since assuming a bare number
# is exactly the mistake this shape invites.
#
# **Whether ANY credential was presented at all, not whether it was any
# good, decides whether an unrouted path 404s or 401s -- Sendcloud's split,
# named in this project's auth.go, on a second and unrelated provider.**
# Four more, live, same date:
#
#   GET /propertyapi/v1.0.0/this-is-not-a-real-endpoint   no apikey  -> 401,
#     byte-identical to the matched-route 401 above
#   GET /propertyapi/v1.0.0/this-is-not-a-real-endpoint   apikey: junk -> 404
#     {"Response":{"status":{"version":"1.0.0","code":"404","msg":
#     "No rule matched","total":"0","page":"0","pagesize":"0"}}}
#   GET https://search.onboard-apis.com/propertyapi/v1.0.0/property/basicprofile...
#     no apikey  -> 401, byte-identical to the current host -- a legacy
#     hostname, still live, answering from the same gateway
#   GET /completely-bogus-xyz  (outside /propertyapi/* entirely)  no apikey
#     -> 404, Content-Type: text/html, body "The path could not be found."
#     -- a THIRD envelope, from the outer Azure App Service layer rather
#     than the 3scale-style API gateway that answers everything under
#     /propertyapi/*, not modelled below because it is a platform page
#     rather than this API's own shape.
#
# So: no credential refuses everything under /propertyapi/* unconditionally,
# whether or not the path exists -- routing is never consulted. ANY
# credential, however wrong, is enough to reach the router; only THEN does
# an unmatched path answer its own 404 "No rule matched," a check that
# apparently never even asks whether the credential that got it there was
# valid. Cauldron's own credential check is unconditional and binary
# (authorised(r), checked once, before the router is ever consulted) and
# has no lever for "any non-blank value passes this gate, only a real one
# passes the next," so the 404 case below needs this Recipe's own accepted
# fixture key to reach Cauldron's router at all -- a request the live API
# was never actually sent -- and says so by carrying no verified date, the
# identical trade Rootly's Recipe in this collection makes for its own,
# differently-shaped version of the same gap.
#
# **A wrong method bypasses the credential check entirely, which is a THIRD
# tier this format's after_routing boolean cannot reach either direction.**
# Struck live, no apikey header at all:
#
#   DELETE /propertyapi/v1.0.0/property/basicprofile?address1=...  -> 405,
#     empty body, Content-Length: 0, no Content-Type, two separate response
#     header lines: Allow: GET and Allow: POST
#   OPTIONS   same path, same absence of a credential                -> 405,
#     identical
#
# after_routing: false (Cauldron's default, and what this Recipe declares)
# reproduces the first two tiers above correctly: absent-credential-on-any-
# path is 401, any-credential-reaches-the-router is how a matched route's
# real data would be reached. It CANNOT also reproduce a wrong method
# skipping the credential check, because the check runs before the method is
# even looked at. after_routing: true would not fit either -- it would 404
# an unrouted GET with no credential, and the live host answers 401 for
# that case, not 404. Genius's Recipe in this collection names a
# structurally identical problem ("two different programs answer... its own
# application and the OAuth library in front of it") for a provider that
# splits on the credential's VERDICT rather than the request's METHOD; this
# is a third axis auth.go's own boolean was never going to reach, so the two
# 405 cases below are armed rather than left unmodelled -- installing the
# failure ahead of both checks Cauldron actually has, for a request that is,
# byte for byte, the one this Recipe actually sent with no credential at
# all, and the response that came back is the literal one recorded. Arming
# is not being used here to assert an ordering Cauldron's own engine
# reaches on its own; it is being used because no ordering Cauldron's engine
# has reaches this shape, and the header says so rather than letting the
# arm imply otherwise.
#
# **Confidence, forecast standard deviation: not found, not modelled, and
# the gap is real rather than a probing failure.** ATTOM's AVM product is
# known industry-wide to publish a confidenceScore and an fsd (forecast
# standard deviation) field -- estated/recipe.yaml's own metadata, for the
# API ATTOM itself now runs, documents forecast_standard_deviation by name.
# Neither name appears anywhere in the parameter tables and status-code
# reference this Recipe could actually fetch from api.developer.attomdata.com
# without an account. That could mean the field exists on a response schema
# this Recipe could not reach, or that ATTOM's public marketing surface
# simply does not repeat what its interactive, login-gated reference states.
# Either way, nothing here asserts a confidenceScore or fsd field, because
# neither was read anywhere this Recipe could cite.
#
# **Record freshness has a name on the query side and no confirmed name on
# the response side.** The AVM Detail endpoint's own parameter table
# documents startCalendarDate/endCalendarDate as "the date the record was
# last updated" and startAddedDate/endAddedDate as "the date the record was
# added to the system" -- two distinct concepts, in ATTOM's own words, and
# genuinely the distinction this group of Recipes was sent to look for. Both
# are INPUT filters for narrowing a search, not confirmed RESPONSE field
# names, and no response example naming either concept was found. Filtering
# by a range implies the underlying record carries the date being filtered
# on, but that is an inference about the schema, not a citation of it, and
# this Recipe does not turn an input parameter's existence into a claimed
# response field.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no key was ever requested, guessed or
#     used. Every 401 below that Cauldron's own credential check reaches on
#     its own, both 405s (armed, see above) and the legacy-host case are
#     struck live and carry a verified date; the 404 (needs an accepted
#     credential Cauldron's engine requires and the live probe never held),
#     the 200 and the SuccessWithoutResult 400 all carry none.
#   - No property, address, valuation or AVM field with a real value is
#     modelled anywhere in this Recipe. Every live call failed
#     authentication by construction, and no worked JSON response example --
#     for a property lookup, an AVM detail, or anything else -- was found in
#     the documentation this Recipe could fetch without logging in. The one
#     "success" case below proves only the {"Response":{"status":{...}}}
#     envelope's shape, using the code and message ATTOM's own status-code
#     table gives for "0" -- SuccessWithResult -- rather than any actual
#     property data, because none exists anywhere this Recipe could cite.
#   - /attomavm/detail (AVM Detail -- note the path is attomavm, not
#     avm/detail), /avm/snapshot, /avmhistory/detail and
#     /valuation/rentalavm are real, documented paths and none of them are
#     routed: this Recipe's one property/basicprofile route already carries
#     every failure shape this group of Recipes needed, and a second or
#     third endpoint would repeat the same unauthenticated ceiling rather
#     than add a new finding.
#   - No upstream.spec. Every swagger.json / openapi.json path this Recipe
#     tried on both the gateway host and the docs host answered either the
#     gateway's own 401 or a 403 HTML page; ATTOM's interactive reference is
#     a login-gated SPA, not a fetchable static description.
#   - The outer Azure App Service 404 (text/html, "The path could not be
#     found.", for a path outside /propertyapi/* entirely) is real, struck
#     live, and not modelled as a route: it is the hosting platform's own
#     catch-all page, one layer further out than the API gateway this
#     Recipe otherwise describes, and belongs to Azure rather than to ATTOM.

recipe: attom
capability: infrastructure
version: 0.1.0

upstream:
  api: v1.0.0
  docs: https://api.developer.attomdata.com/docs

auth:
  scheme: header
  header: apikey
  keys:
    - cauldron-attom-fixture-key-000000000000000000
  # Absent and a present-but-wrong key answer byte-identically on this host
  # -- see the header -- so absent_error and rejected_error are both left
  # unset and both verdicts fall through to the one generic sentence, which
  # is the honest default and matches what was actually observed.

responses:
  resource:
    style: bare
  error:
    # {"Response":{"status":{"version","code","msg","total","page",
    # "pagesize"}}} -- three levels deep, which style: nested cannot reach
    # (its own Key wraps exactly one level, undotted). style: flat's
    # message_field/code_field DO nest on a dotted path, so the whole
    # envelope is built from a flat body whose every field happens to live
    # three levels down.
    style: flat
    message_field: "Response.status.msg"
    code_field: "Response.status.code"
    code_type: string
    # Present, static, and identical on every failure this Recipe observed.
    fields:
      Response.status.version: "1.0.0"
      Response.status.total: "0"
      Response.status.page: "0"
      Response.status.pagesize: "0"

resources:
  # No field on this resource carries a real, observed or documented value
  # -- see the header. What is real and citable is the enveloping status
  # object itself, which every response on this host carries, success or
  # failure alike; only the numbers and words inside it change. "0" and
  # "SuccessWithResult" are ATTOM's own status-code table entries, not an
  # observed body.
  property:
    id:
      style: opaque
      field: "-"
    constants:
      Response.status.version: "1.0.0"
      Response.status.code: "0"
      Response.status.msg: SuccessWithResult

routes:
  # Address1/address2 are two of ATTOM's own documented identifier
  # parameters for this route (alongside attomId, ID, and fips+APN). No
  # example address exists in any documentation this Recipe could fetch, so
  # the one below is obviously synthetic rather than composed to look real.
  - method: GET
    path: /propertyapi/v1.0.0/property/basicprofile
    resource: property
    operation: get
    id_from: query:address1
    # Any address this Recipe's one fixture record does not recognise --
    # see the header's SuccessWithoutResult finding, hedged there and again
    # in the errors table below.
    not_found: no_result

  # DELETE and OPTIONS bypass the credential check entirely on this host --
  # see the header. Armed: Cauldron's engine has no ordering that reaches
  # this on its own, and arming is what installs the shape for a request
  # that, sent live, carried no credential at all.

errors:
  # What the ordinary, unconditional credential check produces on its own --
  # see the header: absent and wrong collapse to this one sentence, and the
  # runtime reaches it without any Recipe-side arming.
  authentication_error:
    status: 401
    code: "401"
    fields:
      Response.status.msg: Unauthorized

  # Reached only with this Recipe's own accepted credential -- see the
  # header for why the live request that produced this exact body carried a
  # junk key Cauldron's engine would have refused before ever routing it.
  unknown_route:
    status: 404
    code: "404"
    fields:
      Response.status.msg: No rule matched

  # Documented, hedged, never observed -- see the header at length. The
  # word "Success" inside an HTTP 400 is ATTOM's own status-code table
  # entry for code 400, not this Recipe's invention; whether a real,
  # uncovered address actually answers with HTTP 400 rather than some other
  # status was never confirmed live, because no credential exists to reach
  # this route at all.
  no_result:
    status: 400
    fields:
      Response.status.code: "400"
      Response.status.msg: SuccessWithoutResult

  # Empty body, Content-Length: 0, no Content-Type -- struck live, with no
  # credential presented at all. See the header for the ordering this
  # demonstrates rather than proves: Cauldron's engine has no lever that
  # reaches an empty 405 ahead of its own credential check, so this is
  # armed, and the request/response pair below is the literal one this
  # Recipe sent and received.
  method_not_allowed:
    status: 405
    empty: true
    headers:
      # Two separate response header lines on the real host; Cauldron's own
      # headers map holds one value per name, so the two are joined the way
      # a client reading Header.Get("Allow") would see them regardless.
      Allow: "GET, POST"

fixtures:
  empty: {}

  fixture-account:
    # No field beyond id: the resource carries no confirmed response field
    # at all -- see the header. The id is address1's value, matched by
    # id_from below, and it is not echoed on the wire (id.field: "-").
    property:
      - id: "100 Fixture Lane"

# Every case below carries source. A verified date means this Recipe called
# api.gateway.attomdata.com with exactly the request shown and recorded
# exactly what came back; its absence means either the credential in the
# request is this Recipe's own fixture key, which the live host was never
# asked to accept, or the expectation was read from ATTOM's own published
# status-code reference and never observed at all.
conformance:
  - name: no credential at all
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
    expect:
      status: 401
      body:
        "Response.status.version": "1.0.0"
        "Response.status.code": "401"
        "Response.status.msg": Unauthorized
        "Response.status.total": "0"

  - name: a wrong credential answers byte-identically
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
      headers:
        apikey: junk-obviously-fake-key-0000000000
    expect:
      status: 401
      body:
        "Response.status.code": "401"
        "Response.status.msg": Unauthorized

  - name: an empty credential answers byte-identically too
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
      headers:
        apikey: ""
    expect:
      status: 401
      body:
        "Response.status.msg": Unauthorized

  - name: no credential refuses an unrouted path too, before routing is ever consulted
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/this-is-not-a-real-endpoint
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/this-is-not-a-real-endpoint
    expect:
      status: 401
      body:
        "Response.status.msg": Unauthorized

  - name: any credential, however wrong, is enough to reach the router
    # Struck live with a junk apikey -- see the header. Reproduced here with
    # this Recipe's own accepted key instead, because Cauldron's own
    # credential check would otherwise refuse the request before routing is
    # ever attempted, which the live gateway does not do once any
    # credential is present. No verified date for that reason.
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/this-is-not-a-real-endpoint
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/this-is-not-a-real-endpoint
      headers:
        apikey: cauldron-attom-fixture-key-000000000000000000
    expect:
      status: 404
      body:
        "Response.status.version": "1.0.0"
        "Response.status.code": "404"
        "Response.status.msg": No rule matched

  - name: a wrong method answers empty and 405, ignoring the credential entirely
    # Armed -- see the header at length for why Cauldron's engine has no
    # ordering that reaches this on its own. The request below, no
    # credential at all, is the literal one this Recipe sent live; the
    # response is the literal one that came back.
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    arm: method_not_allowed
    fixture: fixture-account
    request:
      method: DELETE
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
    expect:
      status: 405
      no_body: true
      headers:
        Allow: GET

  - name: OPTIONS is refused the identical way
    source: https://api.gateway.attomdata.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    arm: method_not_allowed
    fixture: fixture-account
    request:
      method: OPTIONS
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
    expect:
      status: 405
      no_body: true

  - name: the legacy hostname answers the identical gateway shape
    source: https://search.onboard-apis.com/propertyapi/v1.0.0/property/basicprofile
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
    expect:
      status: 401
      body:
        "Response.status.msg": Unauthorized

  - name: a matched route's success carries the status table's own code and word for it
    # ATTOM's own status-code reference, not an observed body -- see the
    # header. No property field is asserted because none was ever found
    # documented with a real value.
    source: https://api.developer.attomdata.com/docs
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=100%20Fixture%20Lane&address2=Cauldron%20Falls,%20ZZ%2099999
      headers:
        apikey: cauldron-attom-fixture-key-000000000000000000
    expect:
      status: 200
      body:
        "Response.status.code": "0"
        "Response.status.msg": SuccessWithResult

  - name: an address this Recipe's fixture does not recognise is a 400 that calls itself success
    # The finding this Recipe was sent to check for, and the most hedged
    # claim in it -- see the header at length. Read from ATTOM's own status-
    # code table and a separate billing sentence, triangulated rather than
    # observed; no credential exists to call this route and see the real
    # answer.
    source: https://api.developer.attomdata.com/docs
    fixture: fixture-account
    request:
      method: GET
      path: /propertyapi/v1.0.0/property/basicprofile?address1=1%20Nonexistent%20Fixture%20Court&address2=Nowhere,%20ZZ%2000000
      headers:
        apikey: cauldron-attom-fixture-key-000000000000000000
    expect:
      status: 400
      body:
        "Response.status.code": "400"
        "Response.status.msg": SuccessWithoutResult
