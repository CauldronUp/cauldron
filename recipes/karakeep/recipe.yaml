# Karakeep Recipe for Cauldron
#
# Written against Karakeep's own OpenAPI 3.0 document, published in its own
# repository -- github.com/karakeep-app/karakeep,
# packages/open-api/karakeep-openapi-spec.json, 35 paths, version 1.0.0 -- read
# on 2026-09-06, and struck live against try.karakeep.app the same day. The
# live cases needed no account: both of them are refusals.
#
# **The only response that is not JSON is the one you most need to read.**
#
# Struck live on 2026-09-06:
#
#   GET /api/v1/bookmarks?limit=1                     (no credential)
#   HTTP 401  Content-Type: text/plain;charset=UTF-8
#   Unauthorized
#
#   GET /api/v1/bookmarks?limit=1                     (Bearer ak1_notreal…)
#   HTTP 401  Content-Type: text/plain;charset=UTF-8
#   Unauthorized
#
# Twelve bytes of prose. Every success in this API is `application/json`, and
# the document declares an `Error` schema with `code` and `message`, both
# required -- and the 401 does not use it. Its declared content type in the
# document is `text/plain` too, so this is intended rather than accidental.
#
# A client that calls `.json()` on every response throws here, and throws on the
# one response whose meaning it most needs. What it reports is a JSON parse
# error at position 0, which is not "your credential is wrong".
#
# **And the two refusals are byte-identical.** Sending nothing and sending a
# token that will not decode produce the same status, the same content type and
# the same twelve bytes. Nothing distinguishes "I have no credential" from "my
# credential is bad", which are a configuration problem and an expiry.
#
# **Null is a member of the enum, not the absence of one.**
#
# A bookmark carries three status fields -- `taggingStatus`,
# `summarizationStatus`, `embeddingStatus` -- and each is declared:
#
#   enum: ["success", "failure", "pending", null]
#
# So `null` is a fourth declared value meaning the work was never attempted, not
# a missing field. Four states, three independent copies of them on one record,
# and the fourth is the one every client's `if (status)` and `status ?? "..."`
# quietly collapses into the others.
#
# `source` is the same shape: eight members and `null`, where null means the
# bookmark predates the field.
#
# **A bookmark's payload is a oneOf, and one variant has no payload.**
#
# `content` is discriminated by its own `type`:
#
#   link     23 fields -- url, title, description, favicon, htmlContent,
#            crawlStatus, readerViewScore, author, publisher, datePublished…
#   text      3 fields
#   asset     7 fields
#   unknown   1 field, which is `type`
#
# `unknown` is a declared variant carrying nothing but its own name. So an
# exhaustive switch over the four has to handle a case with no data in it, and a
# client that reads `bookmark.content.url` finds undefined on three of the four.
#
# `assets[].assetType` has twelve members and one of them is also `unknown`.
#
# **Tags say whether a machine wrote them.** Each tag carries `attachedBy`,
# `"ai"` or `"human"`, both required. So the tags a model invented are marked --
# and only if you look. A client that renders `tags` uniformly presents guesses
# and decisions identically, and one that syncs them into another system copies
# the guesses in as facts.
#
# **Two creation timestamps, and only one is required.** `createdAt` is in the
# schema's `required` list and `firstCreatedAt` is not, with no description on
# either saying how they differ. So a client sorting by "when was this made" has
# two candidates, one of which may be absent.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Bookmarks, listed and fetched. 35 paths is a bookmark manager: lists,
#     tags, highlights, assets, feeds and the whole backup surface each want
#     their own evidence.
#   - `content` is served as the `link` variant. The other three are recorded
#     and not served: serving a oneOf would mean deciding per fixture which
#     variant each record is, and what the finding needs is that the `unknown`
#     variant exists at all.
#   - The two refusals are served identically, because that is what the live
#     API does. This Recipe therefore cannot tell a caller which mistake they
#     made either -- which is the finding, not a gap.

recipe: karakeep
capability: files
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://docs.karakeep.app/API/karakeep-api
  spec: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
  spec_hash: fcb2b73769f8714c5e4eac602a3c438024b4e5ac527ffde7d512daec62cf1516
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - ak1_cauldron_0000000000000000000000
  absent_error: unauthorized
  # The same error, because the live API answers the same twelve bytes for a
  # token that will not decode.
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: bookmarks
    cursor_field: nextCursor
    # Required and nullable in the schema, so the key is always there and only
    # its value moves.
    cursor_null: true
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  bookmark:
    id:
      style: opaque
    fields:
      title:
        type: string
      archived:
        type: boolean
        default: false
      favourited:
        type: boolean
        default: false
      # Three fields, one enum, and null is a member of it rather than an
      # absence -- so there are four states and the fourth is falsy.
      taggingStatus:
        type: string
        default: success
      summarizationStatus:
        type: string
      embeddingStatus:
        type: string
      # Eight members plus null, where null means the bookmark predates the
      # field.
      source:
        type: string
      note:
        type: string
      summary:
        type: string
      userId:
        type: string
        in: "-"
      # Required, and the one a client should sort by.
      createdAt:
        type: datetime
      # Not required, and nothing says how it differs.
      firstCreatedAt:
        type: datetime
      modifiedAt:
        type: datetime
      # Each tag says whether a model or a person attached it.
      tags:
      # The oneOf, served as its link variant.
      content:
      assets:

routes:
  - method: GET
    path: /api/v1/bookmarks
    resource: bookmark
    operation: list
    pagination:
      style: cursor
      limit_param: limit
      cursor_param: cursor
      limit: 20
    filters:
      - field: archived
        param: archived
      - field: favourited
        param: favourited

  - method: GET
    path: /api/v1/bookmarks/{id}
    resource: bookmark
    operation: get
    not_found: not_found

errors:
  # Struck live: text/plain, twelve bytes, no code and no message, in an API
  # whose every success is JSON and which declares an Error schema it does not
  # use here.
  unauthorized:
    status: 401
    style: text
    message: "Unauthorized"
    headers:
      Content-Type: text/plain;charset=UTF-8
  not_found:
    status: 404
    code: NOT_FOUND
    message: "Bookmark not found."
  rate_limit:
    status: 429
    code: TOO_MANY_REQUESTS
    message: "Too many requests."

fixtures:
  empty:
    bookmark: []

  library:
    bookmark:
      - id: k9x2mq4p7r1t
        title: "How to page a cursor API"
        archived: false
        favourited: true
        taggingStatus: success
        summarizationStatus: pending
        # The fourth state: never attempted. A declared enum member, and falsy.
        embeddingStatus: null
        source: extension
        note: "Read the second half."
        summary: null
        userId: u1
        createdAt: "2026-08-14T09:12:00.000Z"
        firstCreatedAt: "2026-08-14T09:12:00.000Z"
        modifiedAt: "2026-08-30T17:40:00.000Z"
        tags:
          - id: t1
            name: pagination
            attachedBy: human
          # A tag a model invented, marked as such -- and only if you look.
          - id: t2
            name: api-design
            attachedBy: ai
        content:
          type: link
          url: https://example.com/cursor-paging
          title: "How to page a cursor API"
          description: "A short piece about cursors."
          crawlStatus: success
          author: null
          publisher: example.com
        assets:
          - id: a1
            assetType: screenshot
            fileName: null
      - id: p4w8vn2c6y0s
        title: null
        archived: true
        favourited: false
        # All three never attempted, which is what a bookmark looks like
        # before any background job has touched it.
        taggingStatus: null
        summarizationStatus: null
        embeddingStatus: null
        # Null because this one predates the field, which is a different
        # nothing from "created by no source".
        source: null
        note: null
        summary: null
        userId: u1
        createdAt: "2026-02-03T21:05:00.000Z"
        firstCreatedAt: "2026-02-03T21:05:00.000Z"
        modifiedAt: null
        tags: []
        content:
          type: link
          url: https://example.com/old
          title: null
          description: null
          crawlStatus: failure
          author: null
          publisher: null
        assets: []

conformance:
  - name: no credential is twelve bytes of prose, not JSON
    source: https://try.karakeep.app/api/v1/bookmarks
    verified: "2026-09-06"
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers: {}
    expect:
      status: 401
      headers:
        # Struck live, exactly this -- no space after the semicolon. Every
        # success in this API is application/json, so a client that calls
        # .json() on every response throws here and reports a parse error at
        # position 0 rather than a credential problem.
        Content-Type: text/plain;charset=UTF-8
      body_matches: '^Unauthorized$'

  - name: a rejected token is byte-identical to no token
    source: https://try.karakeep.app/api/v1/bookmarks
    verified: "2026-09-06"
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers:
        Authorization: Bearer ak1_notreal_notreal
    expect:
      # Struck live one request after the other. Same status, same content
      # type, same twelve bytes -- so nothing distinguishes "I have no
      # credential" from "my credential expired".
      status: 401
      headers:
        Content-Type: text/plain;charset=UTF-8
      body_matches: '^Unauthorized$'

  - name: null is a member of the status enum, not an absence
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        # enum: ["success", "failure", "pending", null] -- four values, and
        # the fourth means never attempted. Every `if (status)` and
        # `status ?? "unknown"` collapses it into the others.
        'bookmarks[0].taggingStatus': success
        'bookmarks[0].summarizationStatus': pending
        'bookmarks[0].embeddingStatus': null
        # And a record where all three are the fourth value, which is what a
        # bookmark looks like before any background job has touched it.
        'bookmarks[1].taggingStatus': null
        'bookmarks[1].embeddingStatus': null

  - name: a tag says whether a model or a person attached it
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        # attachedBy is required on every tag: "ai" or "human". A client that
        # renders tags uniformly presents a guess and a decision identically,
        # and one that syncs them elsewhere copies the guesses in as facts.
        'bookmarks[0].tags[0].attachedBy': human
        'bookmarks[0].tags[1].attachedBy': ai
        'bookmarks[0].tags[1].name': api-design

  - name: the payload is discriminated by a nested type
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        # link has 23 fields, text has 3, asset has 7, and unknown has one --
        # its own name. So an exhaustive switch has to handle a variant with
        # no data, and bookmark.content.url is undefined on three of four.
        'bookmarks[0].content.type': link
        'bookmarks[0].content.url': https://example.com/cursor-paging
        'bookmarks[0].content.crawlStatus': success
        # A crawl that failed, on a bookmark that still exists and still has a
        # url -- so content being present says nothing about it having been
        # fetched.
        'bookmarks[1].content.crawlStatus': failure
        'bookmarks[1].content.title': null

  - name: the cursor is always present and null at the end
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      query:
        limit: "1"
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      matches:
        # nextCursor is required AND nullable, so the key is always there and
        # only its value moves -- which makes `"nextCursor" in body` useless
        # and `body.nextCursor === null` the only correct end-of-listing test.
        nextCursor: '.'
      body:
        'bookmarks[0].id': k9x2mq4p7r1t
      absent:
        - 'bookmarks[1]'

  - name: the last page sends the cursor as null rather than dropping it
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      query:
        limit: "1"
        cursor: k9x2mq4p7r1t
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        nextCursor: null
        'bookmarks[0].id': p4w8vn2c6y0s

  - name: two creation timestamps, and only one is required
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks/k9x2mq4p7r1t
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        # createdAt is in the schema's required list; firstCreatedAt is not,
        # and nothing on either says how they differ. A client sorting by
        # "when was this made" has two candidates and one may be absent.
        createdAt: "2026-08-14T09:12:00.000Z"
        firstCreatedAt: "2026-08-14T09:12:00.000Z"
        # And modifiedAt is nullable on a record nobody has edited, which is
        # not the same as it equalling createdAt.
        modifiedAt: "2026-08-30T17:40:00.000Z"
        source: extension
        title: "How to page a cursor API"
        # A person's own note, and a model's summary, side by side and
        # separately nullable -- so the one a client shows depends on which
        # background job has run, and both being null is a real state.
        note: "Read the second half."
        summary: null
        assets:
          - id: a1
            assetType: screenshot
            fileName: null

  - name: the archived filter is a boolean in the query string
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      query:
        archived: "true"
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        'bookmarks[0].id': p4w8vn2c6y0s
        'bookmarks[0].archived': true
      absent:
        - 'bookmarks[1]'

  - name: the favourited filter uses the British spelling
    source: https://raw.githubusercontent.com/karakeep-app/karakeep/main/packages/open-api/karakeep-openapi-spec.json
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      query:
        # favourited, with the u. Both the field and the parameter, and a
        # client written to the American spelling filters nothing and reads
        # undefined.
        favourited: "true"
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 200
      body:
        'bookmarks[0].favourited': true
        'bookmarks[0].id': k9x2mq4p7r1t
      absent:
        - 'bookmarks[1]'

  - name: "a missing bookmark answers JSON, unlike the refusal"
    source: "https://docs.karakeep.app/API/karakeep-api"
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks/nosuchbookmark
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 404
      body:
        # The declared Error shape -- code and message, both required -- which
        # the 401 does not use.
        code: NOT_FOUND
        message: "Bookmark not found."

  - name: "the rate limit says so in these words"
    source: "https://docs.karakeep.app/API/karakeep-api"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/v1/bookmarks
      headers:
        Authorization: Bearer ak1_cauldron_0000000000000000000000
    expect:
      status: 429
      body:
        code: TOO_MANY_REQUESTS
        message: "Too many requests."
