# Whereby Recipe for Cauldron
#
# Whereby is the control this task's group was built around, and the reason
# is structural rather than incidental: a meeting here is not a container
# messages accumulate in, it is a URL with a lifetime. POST /v1/meetings'
# own request schema, read from the OpenAPI fragment GitBook renders inline
# on docs.whereby.com's Meetings reference page, requires exactly one field
# -- endDate -- and the 201 response is a flat object with no state, no
# status and no phase anywhere in it:
#
#   {"meetingId":"9cf691bf-f2d5-4420-bda9-ee8607bb558b",
#    "startDate":"2025-05-12T16:42:49Z","endDate":"2025-05-12T17:42:49Z",
#    "roomUrl":"https://subdomain.whereby.com/room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd"}
#
# that is the spec's own worked example, quoted verbatim, and it is the
# entire shape a create answers with by default. roomUrl is not signed. There
# is no query string, no token, no expiring parameter appended to it -- it is
# a plain URL whose only unguessable part is a UUID the room name carries,
# checked against the same worked example on every one of the spec's four
# operations for this resource (POST, GET list, GET one, DELETE all render
# the identical roomUrl for the identical meeting). hostRoomUrl and
# viewerRoomUrl are real, documented fields on the same schema and are never
# in the default response at all -- the spec's own words: "This field is
# optional and will only be returned if requested through the fields
# parameter" -- so the URL every participant gets by default carries no more
# privilege than a link, and the one that would needs to be asked for by
# name.
#
# And the room does not wait to be asked for. The spec's own sentence, on the
# same reference page: "Creates a transient room that is available between
# creation and an hour after the given endDate. After this time the room
# will be automatically deleted." A room exists the moment POST answers, with
# nobody in it, and it stops existing on a clock the create request set --
# not on activity, not on a message count, because there is no message count
# on this resource for anything to count.
#
# Set this beside the group's other two providers, both of which answer a
# URL rather than a resource to poll. pdfmonkey/recipe.yaml quotes PDFMonkey's
# own FAQ giving download_url exactly one hour: "Each download URL is a
# temporary signed link valid for 1 hour. After that, it returns a 403
# Forbidden error." api2pdf/recipe.yaml quotes Api2Pdf's own FAQ giving
# FileUrl twenty-four hours: "This link will hold the PDF for only 24 hours."
# Both providers state a specific lifetime in writing, in hours, and the two
# numbers disagree with each other by a factor of twenty-four -- there is no
# one answer in this collection to "how long does a generated-content link
# last," only providers who each picked their own number and wrote it down.
# Whereby's roomUrl carries a lifetime too, and it is a different kind of
# fact from either one: PDFMonkey and Api2Pdf sign a URL to a file that
# already exists and let the signature itself expire while the file, and the
# document record that names it, persist independently. Whereby deletes the
# room the URL addresses -- the meeting record and the destination both go
# at once, an hour after endDate, and there is nothing left to fetch a fresh
# link for the way PDFMonkey's own FAQ says a caller should ("Fetch the
# document again via the API to get a fresh URL"). A signed link expiring
# and a room being deleted are not the same event wearing two names: one
# revokes access to a thing that is still there, and the other removes the
# thing.
#
# The credential check answers this task's other question more completely
# than either chat provider in this group could -- struck live, repeatedly,
# against api.whereby.dev with no account and no key ever created:
#
#   no Authorization header at all
#     -> 401 {"error":"authorization required","data":{},
#        "message":"authorization required"}
#        WWW-Authenticate: Bearer realm="Authorization Required"
#
#   Authorization: Bearer junktoken12345
#     -> 401 {"error":"Invalid accessToken error: Invalid accessToken.",
#        "errorId":"invalid_token","data":{},
#        "message":"Invalid accessToken error: Invalid accessToken."}
#        WWW-Authenticate: Bearer realm="Authorization Required", error="invalid_token"
#
# two different sentences, two different bodies -- errorId only exists on
# the second -- and two different WWW-Authenticate challenges, the header
# itself growing an error="invalid_token" parameter only once something was
# actually presented and refused. And the boundary between "nothing" and
# "something" is drawn at the scheme prefix, checked live both ways:
# "Authorization: junktoken12345" with no "Bearer " at all, and
# "Authorization: Bearer " with nothing after the prefix, both answered the
# identical absent-credential sentence above, not the rejected one -- so a
# request that is missing the one word "Bearer" is read the same as a
# request that sent nothing.
#
# Credential and routing answer in the opposite order from both chat
# providers in this group. Struck live with no Authorization header
# whatsoever: GET /v1/nosuchroute and PATCH /v1/meetings both answered the
# identical absent-credential 401 above, not a 404 and not a 405 -- the
# credential is examined before routing is even attempted, on every path and
# every method this task tried, which is Cauldron's own default ordering and
# needed no auth.after_routing declaration to reproduce.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - A created meeting's roomName and roomUrl are one fixed fixture value
#     regardless of what roomNamePrefix a create request names -- see the
#     resource's own comment. Only meetingId varies per call; a real create
#     mints all three together.
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every 401 below was struck live and carries a verified date;
#     every 200 and the one documented 404 are read from the OpenAPI
#     fragment GitBook renders on the Meetings reference page and carry
#     none.
#   - hostRoomUrl and viewerRoomUrl are real, optional fields gated behind a
#     fields request parameter this Recipe does not implement -- see above.
#     Every route here answers the default shape, which never carries
#     either one, and this Recipe does not claim a request naming fields
#     would change that.
#   - GET /v1/meetings (list) and DELETE /v1/meetings/{meetingId} are real
#     paths on this same resource and neither is routed. The list response
#     nests a cursor alongside the array in a way this task could not pin
#     precisely from the rendered fragment alone, and DELETE's own success
#     shape was not confirmed by any worked example on the page this task
#     read. Create and get are what the group's question turns on.
#   - recording, liveTranscription and streaming are real, documented
#     objects on the create request and are not modelled: each is a nested
#     configuration block with its own schema, and no worked example gives
#     any of them a populated value to build a fixture from honestly.
#   - roomNamePattern (uuid or human-short) and templateType (viewerMode,
#     which adds hostRoomUrl and viewerRoomUrl to the response
#     unconditionally per the spec's own words) are real, documented request
#     fields and neither changes this Recipe's response: the one worked
#     example this Recipe cites never varies either one.
#   - No upstream.spec is recorded. The OpenAPI description exists and is
#     real -- it is what every documented case below cites -- but it is
#     rendered inline inside a GitBook page rather than served at a
#     fetchable URL of its own, the same gap fireworks/recipe.yaml states for
#     an OpenAPI fragment embedded the identical way.
#
# The token below is a fixture and belongs to no account.

recipe: whereby
capability: voice
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.whereby.com/reference/whereby-rest-api-reference/meetings

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-fixture-whereby-token-0000000000000000
  # Two different sentences and two different bodies, struck live -- see the
  # header. errorId is the field that only exists on the rejected one.
  absent_error: authorization_required
  # A header with no "Bearer " prefix, and "Bearer " with nothing after it,
  # both answered the identical absent-credential sentence live -- not a
  # third one. Named the same entry as absent_error on purpose: that
  # identity is the finding, not an omission.
  malformed_error: authorization_required
  rejected_error: invalid_token

responses:
  resource:
    style: bare
  error:
    # {"error": "<message>", "data": {}, "message": "<same text>"} -- error
    # and message carry the identical sentence on every failure this task
    # struck, and data is always an empty object. message_field targets the
    # field that is templated per entry; error and data are stamped as
    # constants below because they are not a second, independent claim.
    style: flat
    message_field: message
    code_field: "-"

resources:
  meeting:
    id:
      # Server-minted -- meetingId is not a property POST's own request
      # schema accepts. A different contract from talkjs/recipe.yaml's
      # caller-chosen path segment and cometchat/recipe.yaml's caller-chosen
      # guid: this is the one provider in the group where the identifier is
      # the server's decision alone.
      style: uuid
      field: meetingId
    fields:
      # Real create requests get a fresh UUID-bearing name and URL every
      # time, the same way meetingId does. This Recipe cannot derive a room
      # name or URL from the newly minted id the way Whereby's own server
      # does -- there is no per-request string composition for it, the same
      # limitation cometchat/recipe.yaml states for conversationId -- so a
      # create route answers the one fixed default below regardless of
      # roomNamePrefix, rather than a value that varies per call the way the
      # real one would.
      roomName:
        type: string
        default: /cauldron-fixture-room-00000000-0000-4000-8000-000000000000
      # Not signed -- see the header. A plain URL whose only unguessable
      # part is the UUID roomName carries.
      roomUrl:
        type: string
        default: https://cauldron-fixture.whereby.com/cauldron-fixture-room-00000000-0000-4000-8000-000000000000
      # Real fields, gated behind a fields request parameter this Recipe
      # does not implement -- see the fidelity gaps. Never emitted by any
      # route below, on purpose: the default response never carries either.
      hostRoomUrl:
        type: string
        in: "-"
      viewerRoomUrl:
        type: string
        in: "-"
      startDate:
        type: datetime
      endDate:
        type: datetime

routes:
  - method: POST
    path: /v1/meetings
    resource: meeting
    operation: create
    status: 201
    returns: [id, roomName, roomUrl, startDate, endDate]

  - method: GET
    path: /v1/meetings/{id}
    resource: meeting
    operation: get
    not_found: resource_missing

errors:
  # Struck live: no Authorization header, a header with no "Bearer " prefix,
  # and "Bearer " with nothing after it all answered this identical body and
  # this identical challenge.
  authorization_required:
    status: 401
    message: authorization required
    headers:
      WWW-Authenticate: 'Bearer realm="Authorization Required"'
    fields:
      error: authorization required
      data: {}

  # Struck live: a well-formed but wrong bearer token. errorId is the field
  # that does not exist on the absent case above, and the challenge itself
  # grows an error parameter only here.
  invalid_token:
    status: 401
    message: "Invalid accessToken error: Invalid accessToken."
    headers:
      WWW-Authenticate: 'Bearer realm="Authorization Required", error="invalid_token"'
    fields:
      error: "Invalid accessToken error: Invalid accessToken."
      errorId: invalid_token
      data: {}

  # The spec's own words for a 404 on this resource: "The requested resource
  # doesn't exist" -- no worked example, no verified date. Every live probe
  # this task ran hit the credential check first, on every path and every
  # method, so a genuinely unauthenticated route-miss could never reach this
  # far -- see the header.
  resource_missing:
    status: 404
    message: "The requested resource doesn't exist"

fixtures:
  empty: {}

  scheduled:
    meeting:
      # The spec's own worked example on the Meetings reference page,
      # quoted verbatim in the header, cited rather than observed.
      - id: 9cf691bf-f2d5-4420-bda9-ee8607bb558b
        roomName: /room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        roomUrl: https://subdomain.whereby.com/room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        startDate: "2025-05-12T16:42:49Z"
        endDate: "2025-05-12T17:42:49Z"

conformance:
  - name: no Authorization header at all is refused before anything else is examined
    source: https://api.whereby.dev/v1/meetings
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer realm="Authorization Required"'
      body:
        error: authorization required
        message: authorization required
        data: {}
      absent:
        - errorId

  - name: a well-formed but wrong bearer token is a different body and a different challenge
    source: https://api.whereby.dev/v1/meetings
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer realm="Authorization Required", error="invalid_token"'
      body:
        error: "Invalid accessToken error: Invalid accessToken."
        errorId: invalid_token

  - name: a header with no Bearer prefix reads as absent, not as a third sentence
    source: https://api.whereby.dev/v1/meetings
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        error: authorization required
      absent:
        - errorId

  - name: and "Bearer " with nothing after it reads as absent too
    source: https://api.whereby.dev/v1/meetings
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        error: authorization required
      absent:
        - errorId

  - name: an unrouted path is refused by the credential check, not by routing
    source: https://api.whereby.dev/v1/nosuchroute
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
    expect:
      status: 401
      body:
        error: authorization required

  - name: and so is a wrong method on a real path, with no credential examined either way
    source: https://api.whereby.dev/v1/meetings
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
    expect:
      status: 401
      body:
        error: authorization required

  - name: creating a meeting requires only endDate, and mints an unsigned roomUrl
    source: https://docs.whereby.com/reference/whereby-rest-api-reference/meetings
    fixture: empty
    request:
      method: POST
      path: /v1/meetings
      headers:
        Authorization: Bearer cauldron-fixture-whereby-token-0000000000000000
      json:
        endDate: "2025-05-12T17:42:49Z"
    expect:
      status: 201
      matches:
        meetingId: ".+"
        roomUrl: "^https://.*\\.whereby\\.com/.+$"
      absent:
        # Optional, gated behind a fields parameter this Recipe does not
        # implement -- see the header. Never in the default response.
        - hostRoomUrl
        - viewerRoomUrl

  - name: the room a meeting answers with is a plain URL, not a signed one
    # Compare pdfmonkey/recipe.yaml's download_url, an S3 link with a query
    # string carrying the signature, and api2pdf/recipe.yaml's FileUrl,
    # documented the same way. This one has neither: no query string, no
    # token, nothing past the room name itself.
    source: https://docs.whereby.com/reference/whereby-rest-api-reference/meetings
    fixture: scheduled
    request:
      method: GET
      path: /v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b
      headers:
        Authorization: Bearer cauldron-fixture-whereby-token-0000000000000000
    expect:
      status: 200
      body:
        meetingId: 9cf691bf-f2d5-4420-bda9-ee8607bb558b
        roomUrl: https://subdomain.whereby.com/room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd
        startDate: "2025-05-12T16:42:49Z"
        endDate: "2025-05-12T17:42:49Z"
      matches:
        roomUrl: '^[^?]+$'

  # The names. This Recipe declares 1 field(s) on a meeting that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a meeting carries the field names this Recipe declares"
    source: "https://docs.whereby.com/reference/whereby-rest-api-reference/meetings"
    fixture: scheduled
    request:
      method: GET
      path: "/v1/meetings/9cf691bf-f2d5-4420-bda9-ee8607bb558b"
      headers:
        "Authorization": "Bearer cauldron-fixture-whereby-token-0000000000000000"
    expect:
      status: 200
      body:
        "roomName": "/room-prefix-793e9ec1-c686-423d-9043-9b7a10c553fd"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for resource missing and nothing
  # asserted any of them, so the wording could have been changed to
  # anything and every case would have stayed green. This makes the
  # refusal happen -- asking for an id nothing was seeded under -- and
  # asserts what came back, envelope and all.
  - name: "an id nothing was seeded under is refused in these words"
    source: "https://docs.whereby.com/reference/whereby-rest-api-reference/meetings"
    fixture: scheduled
    request:
      method: GET
      path: "/v1/meetings/cauldron-no-such-id"
      headers:
        "Authorization": "Bearer cauldron-fixture-whereby-token-0000000000000000"
    expect:
      status: 404
      body:
        "message": "The requested resource doesn't exist"


