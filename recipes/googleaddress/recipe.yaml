# Google Address Validation Recipe for Cauldron
#
# There is no field that says whether the address is valid.
#
# The verdict has three granularities and five booleans and not one of them is
# called valid, correct, deliverable or ok. Every integration wants a yes or a
# no and this API refuses to give one: you have to decide what valid means
# from validationGranularity, addressComplete and the four hasSomething flags,
# and whatever you decide is a policy your business owns rather than something
# Google told you.
#
# Teams discover this at the point where they have already written
# `if (result.valid)`, found undefined, and reached for the nearest field that
# looked decisive.
#
# Five more the Recipe pins:
#
#   1. The booleans are absent when false. Google's own words on
#      addressComplete: if unset, indicates that the value is false. This is
#      proto3 JSON, which omits every false and every zero, so a perfect
#      address has a verdict with almost nothing in it and a broken one has
#      more fields, not fewer. Reading the presence of a key tells you the
#      opposite of what it looks like.
#   2. Three granularities that can all disagree. inputGranularity is what
#      you typed, validationGranularity is what could be confirmed, and
#      geocodeGranularity is how precisely it can be placed. Google's own
#      example: a flat whose existence is known but whose position is not
#      gives SUB_PREMISE validation and PREMISE geocode.
#   3. OTHER means undeliverable. It is documented as all other
#      granularities, bucketed together since they are not deliverable, so
#      the value that reads like a shrug is the one that means do not ship.
#   4. Google will change your data and tell you in a nested boolean.
#      replaced means the component was swapped for a completely different
#      one -- their example is a wrong postal code replaced with the right
#      one. The corrected address is in formattedAddress and the fact that
#      it was corrected is a flag on one component several levels down.
#   5. Unconfirmed comes in two flavours and only one is alarming.
#      UNCONFIRMED_BUT_PLAUSIBLE is a flat number that probably exists;
#      UNCONFIRMED_AND_SUSPICIOUS is one that probably does not. Both are
#      "unconfirmed" to anything matching on a prefix.
#
# And the field names on the wire are not the field names in the definition.
# Google publishes this API as a proto, in snake_case, and serves it as JSON,
# in camelCase: address_complete becomes addressComplete and
# missing_component_types becomes missingComponentTypes. A client written from
# the proto reads nothing at all, and the proto is the more precise document.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing is validated. Every request gets the same worked example back,
#     and the example chosen is an address that was silently corrected and is
#     still incomplete, because that is the case nobody writes a test for.
#     This reproduces the shape of a verdict rather than the judgement.
#   - responseId is a constant here and is per-request there. It is the value
#     the feedback endpoint wants, so a real integration has to keep it.
#   - The feedback endpoint, the USPS deliverability block, session tokens
#     and address metadata are not modelled.
#
# Keys below are fixtures, not secrets.

recipe: googleaddress
capability: shipping
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.google.com/maps/documentation/address-validation

auth:
  scheme: header
  header: X-Goog-Api-Key
  keys:
    - AIzaCauldron00000000000000000000000000

responses:
  list:
    style: bare
  # The whole answer is nested under result, with the response id beside it.
  resource:
    style: wrapped
    key: result
  success:
    fields:
      responseId: 6a3f8b21-9c40-4e7d-b5a2-1f8e0c7d3946
  # Google's standard error envelope: a status word, a numeric code and a
  # message, all under error.
  error:
    style: nested
    key: error
    code_field: code
    message_field: message
    type_field: status

resources:
  validation:
    collection: results
    id:
      style: uuid
      # Nothing in the result identifies itself. responseId sits outside it,
      # beside result rather than in it.
      field: "-"
    fields:
      # --- the verdict, which has no verdict in it ---

      # What you typed.
      inputGranularity:
        type: string
        in: verdict
        as: inputGranularity
      # What could be confirmed. Coarser than the input whenever something
      # could not be matched.
      validationGranularity:
        type: string
        in: verdict
        as: validationGranularity
      # How precisely it can be placed, which is a third answer again.
      geocodeGranularity:
        type: string
        in: verdict
        as: geocodeGranularity
      # Absent when false, in Google's own words, so this key missing is the
      # bad case and this key present is the good one.
      addressComplete:
        type: boolean
        in: verdict
        as: addressComplete
      hasUnconfirmedComponents:
        type: boolean
        in: verdict
        as: hasUnconfirmedComponents
      hasInferredComponents:
        type: boolean
        in: verdict
        as: hasInferredComponents
      hasReplacedComponents:
        type: boolean
        in: verdict
        as: hasReplacedComponents

      # --- the address, and what was done to it ---

      # The corrected one. Not what was sent.
      formattedAddress:
        type: string
        in: address
        as: formattedAddress
      # What is missing, by component type, which is the other half of why
      # addressComplete is not set.
      missingComponentTypes:
        type: list
        in: address
        as: missingComponentTypes
      # Words Google could not place anywhere.
      unresolvedTokens:
        type: list
        in: address
        as: unresolvedTokens

      # The component that was quietly rewritten. Its old value is not here
      # and is not anywhere.
      replacedComponentType:
        type: string
        in: address.addressComponents[0]
        as: componentType
      replacedComponentText:
        type: string
        in: address.addressComponents[0].componentName
        as: text
      replacedComponentConfirmation:
        type: string
        in: address.addressComponents[0]
        as: confirmationLevel
      replacedComponentReplaced:
        type: boolean
        in: address.addressComponents[0]
        as: replaced

      # And one that is merely suspicious, which is a different problem.
      suspectComponentType:
        type: string
        in: address.addressComponents[1]
        as: componentType
      suspectComponentText:
        type: string
        in: address.addressComponents[1].componentName
        as: text
      suspectComponentConfirmation:
        type: string
        in: address.addressComponents[1]
        as: confirmationLevel

      # --- the geocode, which is a fourth opinion ---
      placeId:
        type: string
        in: geocode
        as: placeId
      latitude:
        type: number
        in: geocode.location
        as: latitude
      longitude:
        type: number
        in: geocode.location
        as: longitude

routes:
  # A colon in the path, which is how Google names a method rather than a
  # resource. A POST that reads rather than writes: nothing is created, and
  # the request carries no identifier, so the answer is about the one address
  # this sandbox holds.
  - method: POST
    path: /v1:validateAddress
    resource: validation
    operation: get
    id_from: auth

errors:
  # The key is fine and the API is not turned on for this project, which is
  # a console setting rather than anything about the request.
  api_not_enabled:
    status: 403
    code: "403"
    type: PERMISSION_DENIED
    message: "Address Validation API has not been used in project 000000000000 before or it is disabled."

  invalid_key:
    status: 400
    code: "400"
    type: INVALID_ARGUMENT
    message: "API key not valid. Please pass a valid API key."

  # An address with no lines at all. The request was well formed and there
  # was nothing in it.
  empty_address:
    status: 400
    code: "400"
    type: INVALID_ARGUMENT
    message: "Invalid request. Missing address."

  quota:
    status: 429
    code: "429"
    type: RESOURCE_EXHAUSTED
    message: "Quota exceeded for quota metric 'Address Validation requests'"

fixtures:
  empty: {}

  # One worked example: an address that was silently corrected and is still
  # incomplete. Every request gets this back, and the header says so.
  corrected-and-incomplete:
    validation:
      - id: 6a3f8b21-9c40-4e7d-b5a2-1f8e0c7d3946
        # A flat number was typed, so the input was granular to SUB_PREMISE.
        inputGranularity: SUB_PREMISE
        # It could not be confirmed, so validation is coarser than the input.
        validationGranularity: PREMISE
        # And the building can be placed, but not the flat inside it.
        geocodeGranularity: PREMISE
        # addressComplete is absent, which is how this API says false.
        hasUnconfirmedComponents: true
        hasReplacedComponents: true

        # The corrected address. The postal code in it is not the one that
        # was sent.
        formattedAddress: "Flat 4, 221B Baker Street, London NW1 6XE, UK"
        missingComponentTypes: [subpremise]
        unresolvedTokens: ["Flat", "4"]

        # The component Google rewrote. What it used to say is not recorded
        # anywhere in this response.
        replacedComponentType: postal_code
        replacedComponentText: "NW1 6XE"
        replacedComponentConfirmation: CONFIRMED
        replacedComponentReplaced: true

        # And one it could not confirm but is willing to believe.
        suspectComponentType: subpremise
        suspectComponentText: "4"
        suspectComponentConfirmation: UNCONFIRMED_BUT_PLAUSIBLE

        placeId: ChIJdd4hrwug2EcRmSrV3Vo6llI
        latitude: 51.523767
        longitude: -0.1585557

# Every case below is derived from the protocol buffer definitions Google
# publishes for this API. None has been run against a real project, because
# calling it needs a billed key. The verify report says so.
conformance:
  - name: there is no field that says whether the address is valid
    # Three granularities and four booleans and not one of them is called
    # valid, correct, deliverable or ok. What counts as valid is a policy
    # your business owns.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address_validation_service.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.verdict.validationGranularity: PREMISE
      absent:
        - result.verdict.valid
        - result.verdict.isValid
        - result.verdict.deliverable
        - result.valid

  - name: the boolean is absent when it is false
    # Google's own words on addressComplete: if unset, indicates that the
    # value is false. This is proto3 JSON, which omits every false, so the
    # key missing is the bad case and the key present is the good one.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address_validation_service.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.verdict.hasUnconfirmedComponents: true
        result.verdict.hasReplacedComponents: true
      absent:
        - result.verdict.addressComplete
        - result.verdict.hasInferredComponents

  - name: three granularities and they do not agree
    # inputGranularity is what was typed, validationGranularity is what
    # could be confirmed, geocodeGranularity is how precisely it can be
    # placed. Google's own example is exactly this.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address_validation_service.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.verdict.inputGranularity: SUB_PREMISE
        result.verdict.validationGranularity: PREMISE
        result.verdict.geocodeGranularity: PREMISE

  - name: Google changed the data and said so in a nested boolean
    # replaced means the component was swapped for a completely different
    # one. The corrected value is in formattedAddress; what it used to be is
    # not in this response at all.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.address.addressComponents[0].componentType: postal_code
        result.address.addressComponents[0].replaced: true
        result.address.formattedAddress: "Flat 4, 221B Baker Street, London NW1 6XE, UK"

  - name: unconfirmed comes in two flavours
    # UNCONFIRMED_BUT_PLAUSIBLE is a flat number that probably exists.
    # UNCONFIRMED_AND_SUSPICIOUS is one that probably does not. Both start
    # with the same word.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.address.addressComponents[1].confirmationLevel: UNCONFIRMED_BUT_PLAUSIBLE
        result.address.addressComponents[0].confirmationLevel: CONFIRMED

  - name: what is missing is named, and what could not be placed is listed
    # The other half of why addressComplete is not set: a component type
    # that should be there and is not, and words nothing could be done with.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        result.address.missingComponentTypes[0]: subpremise
        result.address.unresolvedTokens[0]: "Flat"
        result.address.unresolvedTokens[1]: "4"

  - name: the response id is beside the result, not inside it
    # It is the value the feedback endpoint wants later, so it has to be
    # kept, and it is the one field that is not part of the judgement.
    source: https://github.com/googleapis/googleapis/blob/master/google/maps/addressvalidation/v1/address_validation_service.proto
    fixture: corrected-and-incomplete
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 200
      body:
        responseId: 6a3f8b21-9c40-4e7d-b5a2-1f8e0c7d3946
        result.geocode.placeId: ChIJdd4hrwug2EcRmSrV3Vo6llI
      absent:
        - result.responseId
        # And the result carries no identifier of its own: responseId beside
        # it is the only handle there is.
        - result.id

  - name: the API being off is a 403 about the project
    # The key is fine. Somebody has not turned this on in a console, and the
    # message names a project number rather than anything about the address.
    source: https://developers.google.com/maps/documentation/address-validation
    fixture: corrected-and-incomplete
    arm: api_not_enabled
    request:
      method: POST
      path: /v1:validateAddress
      headers:
        X-Goog-Api-Key: AIzaCauldron00000000000000000000000000
      json:
        regionCode: GB
    expect:
      status: 403
      body:
        error.code: 403
        error.status: PERMISSION_DENIED
        error.message: "Address Validation API has not been used in project 000000000000 before or it is disabled."
      absent:
        - result
