# Basecamp Recipe for Cauldron
#
# Basecamp has no sandbox. An OAuth token reaches a real account, and a test
# that posts a message posts it where the whole project sees it and emails
# everybody subscribed. Basecamp deliberately has no hard delete either:
# everything goes to the trash and is recoverable for thirty days, so a test
# suite leaves a trail somebody has to clear.
#
# Two things worth modelling exactly:
#
#   1. Basecamp requires a User-Agent that identifies your application and
#      gives a contact address, and it refuses the request outright without
#      one. Nearly every HTTP client sends something by default, so this is
#      the rule people only discover from a server that sends nothing.
#   2. Everything is soft deleted. A trashed record still exists, is still
#      reachable by id, and comes back with status "trashed" rather than a
#      404. Code that treats a successful fetch as proof a thing is live
#      shows deleted content.
#
# Known fidelity gap, stated rather than hidden: Basecamp pages with a Link
# header, which Cauldron does not model.
#
# Tokens below are fixtures, not secrets.

recipe: basecamp
capability: issues
version: 0.1.0

upstream:
  api: "3"
  docs: https://github.com/basecamp/bc3-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_basecamp_token

# Basecamp refuses a request that does not identify the application making it.
required_headers:
  User-Agent: missing_user_agent

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: error

resources:
  project:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      purpose:
        type: string
        default: topic
      # active, archived, trashed. Trashed is recoverable for thirty days and
      # still reachable by id, so a successful fetch proves nothing.
      status:
        type: string
        default: active
      # A project can be visible to the whole account or only to the people
      # on it, and the API returns both the same way.
      bookmarked:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime

  todo:
    id:
      style: numeric
      type: number
    fields:
      project_id:
        type: string
      content:
        type: string
        required: true
      description:
        type: string
      status:
        type: string
        default: active
      # Basecamp records completion separately from status, so a todo can be
      # completed and later trashed, and both facts survive.
      completed:
        type: boolean
        default: false
      due_on:
        type: string
      # Set only when somebody actually ticked it.
      completed_at:
        type: datetime
        stamped: false
      created_at:
        type: datetime

  message:
    id:
      style: numeric
      type: number
    fields:
      project_id:
        type: string
      subject:
        type: string
        required: true
      content:
        type: string
      status:
        type: string
        default: active
      # A draft has been written and not posted, so nobody has been emailed
      # yet. Publishing is a separate call.
      published:
        type: boolean
        default: false
      created_at:
        type: datetime

routes:
  - method: GET
    path: /projects.json
    resource: project
    operation: list
    # Active projects only. Archived and trashed ones are still there and
    # still readable by id, and they are not in this list, so a client that
    # syncs by listing decides they were deleted.
    #
    # There is no value that asks for everything. Basecamp takes
    # ?status=archived or ?status=trashed one at a time, so seeing the whole
    # account means three requests and knowing to make them.
    filters:
      - param: status
        field: status
        default: active
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

  - method: GET
    path: /projects/{id}.json
    resource: project
    operation: get

  - method: POST
    path: /projects.json
    resource: project
    operation: create
    status: 201

  - method: GET
    path: /buckets/{project_id}/todos.json
    resource: todo
    operation: list
    scope: [project_id]
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

  - method: POST
    path: /buckets/{project_id}/todos.json
    resource: todo
    operation: create
    scope: [project_id]
    status: 201

  - method: GET
    path: /buckets/{project_id}/todos/{id}.json
    resource: todo
    operation: get
    scope: [project_id]

  - method: GET
    path: /buckets/{project_id}/messages.json
    resource: message
    operation: list
    scope: [project_id]
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 50

webhooks:
  events:
    - Comment
    - Todo
    - Todolist
    - Message
    - Document
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    message: You have exceeded the rate limit of 50 requests per 10 seconds
    headers:
      Retry-After: "10"

  authentication_error:
    status: 401
    message: The access token is invalid or has expired

  resource_missing:
    status: 404
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    message: "{detail} is required"

  missing_user_agent:
    status: 400
    message: A User-Agent header identifying your application and a contact address is required

  # Basecamp refuses to write to an archived project, which is what a sync
  # discovers when somebody tidies up mid-quarter.
  project_archived:
    status: 403
    message: The project is archived and cannot be modified

  # A token that can read a project cannot always write to it, and the
  # message does not say which permission is missing.
  forbidden:
    status: 403
    message: You are not authorized to perform this action

fixtures:
  empty: {}

  small-account:
    project:
      - id: "1001"
        name: Cauldron
        description: The engine and its Recipes
        status: active
      - id: "1002"
        name: Old experiment
        # Archived. Readable, and writes to it are refused.
        status: archived
      - id: "1003"
        name: Deleted last week
        # Trashed, recoverable for thirty days, and still reachable by id.
        # A successful fetch proves nothing about whether it is live.
        status: trashed
    todo:
      - id: "2001"
        project_id: "1001"
        content: Ship the conformance suite
        status: active
        completed: false
      - id: "2002"
        project_id: "1001"
        content: Write the Basecamp Recipe
        status: active
        completed: true
        completed_at: "2026-01-12T14:00:00Z"
      - id: "2003"
        project_id: "1001"
        content: Completed, then trashed
        # Both facts survive. Basecamp records completion separately from
        # status, so this is not the same as either alone.
        status: trashed
        completed: true
        completed_at: "2026-01-10T09:00:00Z"
    message:
      - id: "3001"
        project_id: "1001"
        subject: Release notes
        content: Fifty Recipes shipped.
        published: true
      - id: "3002"
        project_id: "1001"
        subject: Half-written draft
        # Written, not posted. Nobody has been emailed, and publishing is a
        # separate call.
        published: false

# Conformance cases, read from Basecamp's BC3 API documentation rather than
# observed against a live account. The verify report says so.
conformance:
  - name: a request without a User-Agent is refused
    source: https://github.com/basecamp/bc3-api#identifying-your-application
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
    expect:
      # Nearly every HTTP client sends a User-Agent by default, so this is
      # the rule people only discover from a server that sends nothing.
      status: 400
      matches:
        error: 'User-Agent'

  - name: the same request with one succeeds
    source: https://github.com/basecamp/bc3-api#identifying-your-application
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0]':
          # Unquoted. Basecamp ids are JSON numbers.
          id: 1001
          name: Cauldron
          status: active

  - name: a listing is active projects, and the others are still there
    # The account holds an archived project and a trashed one. Neither is
    # here, both are readable by id, and nothing said so. A client that
    # syncs by listing and deletes what it no longer sees deletes both.
    source: https://github.com/basecamp/bc3-api#projects
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0].status': active
      absent:
        - '[1]'

  - name: archived projects are a separate request, one status at a time
    # And there is no value that asks for everything, so seeing the whole
    # account means three requests and knowing to make them.
    source: https://github.com/basecamp/bc3-api#projects
    fixture: small-account
    request:
      method: GET
      path: /projects.json?status=archived
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0].status': archived
        '[0].name': Old experiment
      absent:
        - '[1]'

  - name: a trashed project is still reachable by id
    source: https://github.com/basecamp/bc3-api
    fixture: small-account
    request:
      method: GET
      path: /projects/1003.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      # Not a 404. Code that treats a successful fetch as proof a thing is
      # live shows deleted content.
      status: 200
      body:
        status: trashed
        name: Deleted last week

  - name: an archived project reads fine and refuses writes
    source: https://github.com/basecamp/bc3-api
    fixture: small-account
    request:
      method: GET
      path: /projects/1002.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        status: archived
        name: Old experiment

  - name: completion is recorded separately from status
    source: https://github.com/basecamp/bc3-api/blob/master/sections/todos.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/todos.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[1]':
          completed: true
          status: active
        # Completed and then trashed. Both facts survive, and neither alone
        # describes it.
        '[2]':
          completed: true
          status: trashed

  - name: an incomplete todo has no completion time
    source: https://github.com/basecamp/bc3-api/blob/master/sections/todos.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/todos/2001.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        completed: false
      absent:
        - completed_at

  - name: an unpublished message has emailed nobody
    source: https://github.com/basecamp/bc3-api/blob/master/sections/messages.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/messages.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0]':
          published: true
        # Written, not posted. Publishing is a separate call, and counting
        # this as sent overstates what anybody has seen.
        '[1]':
          published: false
          subject: Half-written draft
