# Conformance cases, read from Basecamp's BC3 API documentation rather than
# observed against a live account. The verify report says so.
conformance:
  - name: a request without a User-Agent is refused
    source: https://github.com/basecamp/bc3-api#identifying-your-application
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
    expect:
      # Nearly every HTTP client sends a User-Agent by default, so this is
      # the rule people only discover from a server that sends nothing.
      status: 400
      matches:
        error: 'User-Agent'

  - name: the same request with one succeeds
    source: https://github.com/basecamp/bc3-api#identifying-your-application
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0]':
          # Unquoted. Basecamp ids are JSON numbers.
          id: 1001
          name: Cauldron
          status: active

  - name: a listing is active projects, and the others are still there
    # The account holds an archived project and a trashed one. Neither is
    # here, both are readable by id, and nothing said so. A client that
    # syncs by listing and deletes what it no longer sees deletes both.
    source: https://github.com/basecamp/bc3-api#projects
    fixture: small-account
    request:
      method: GET
      path: /projects.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0].status': active
      absent:
        - '[1]'

  - name: archived projects are a separate request, one status at a time
    # And there is no value that asks for everything, so seeing the whole
    # account means three requests and knowing to make them.
    source: https://github.com/basecamp/bc3-api#projects
    fixture: small-account
    request:
      method: GET
      path: /projects.json?status=archived
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0].status': archived
        '[0].name': Old experiment
      absent:
        - '[1]'

  - name: a trashed project is still reachable by id
    source: https://github.com/basecamp/bc3-api
    fixture: small-account
    request:
      method: GET
      path: /projects/1003.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      # Not a 404. Code that treats a successful fetch as proof a thing is
      # live shows deleted content.
      status: 200
      body:
        status: trashed
        name: Deleted last week

  - name: an archived project reads fine and refuses writes
    source: https://github.com/basecamp/bc3-api
    fixture: small-account
    request:
      method: GET
      path: /projects/1002.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        status: archived
        name: Old experiment

  - name: completion is recorded separately from status
    source: https://github.com/basecamp/bc3-api/blob/master/sections/todos.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/todos.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[1]':
          completed: true
          status: active
        # Completed and then trashed. Both facts survive, and neither alone
        # describes it.
        '[2]':
          completed: true
          status: trashed

  - name: an incomplete todo has no completion time
    source: https://github.com/basecamp/bc3-api/blob/master/sections/todos.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/todos/2001.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        completed: false
      absent:
        - completed_at

  - name: an unpublished message has emailed nobody
    source: https://github.com/basecamp/bc3-api/blob/master/sections/messages.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/messages.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0]':
          published: true
        # Written, not posted. Publishing is a separate call, and counting
        # this as sent overstates what anybody has seen.
        '[1]':
          published: false
          subject: Half-written draft

  - name: the page size is not the caller's to choose
    # Basecamp accepts no page-size parameter at all: the size is geared and
    # server-chosen, fifteen on page one and more on each page after. A
    # client that tries to ask for a smaller page is ignored, and one that
    # computes offsets from page numbers is wrong from page two onwards --
    # which is why Basecamp's own documentation says to follow the Link
    # header and "please don't build the pagination URLs yourself".
    #
    # An emulator that honoured limit or per_page here would let that code
    # work locally and be ignored in production.
    source: https://raw.githubusercontent.com/basecamp/bc3-api/master/README.md
    fixture: small-account
    request:
      method: GET
      path: /buckets/1001/todos.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
      query:
        limit: "1"
        per_page: "1"
    expect:
      status: 200
      body:
        # All three, because neither name means anything to Basecamp.
        '[0]':
          id: 2001
        '[2]':
          id: 2003

  - name: page one holds fifteen and advertises the next in a Link header
    # Basecamp's own words: follow the Link header to retrieve the next page
    # of data, please don't build the pagination URLs yourself. Fifteen is
    # what page one holds.
    source: https://raw.githubusercontent.com/basecamp/bc3-api/master/README.md
    fixture: busy-project
    request:
      method: GET
      path: /buckets/1002/todos.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
    expect:
      status: 200
      body:
        '[0]':
          id: 3001
        '[14]':
          id: 3015
      absent:
        - '[15]'
      header_matches:
        Link: '^<http://[^>]*/buckets/1002/todos\.json\?page=2>; rel="next"$'

  - name: the page parameter fetches the rest, and the last page has no Link
    # "If the Link header is blank, that's the last page." A client following
    # the header stops here; one that kept asking for page three would be
    # inventing a URL Basecamp never gave it.
    source: https://raw.githubusercontent.com/basecamp/bc3-api/master/README.md
    fixture: busy-project
    request:
      method: GET
      path: /buckets/1002/todos.json
      headers:
        Authorization: Bearer cauldron_basecamp_token
        User-Agent: Cauldron (cauldron@example.com)
      query:
        page: "2"
    expect:
      status: 200
      body:
        # The sixteenth and seventeenth, not the first fifteen over again.
        '[0]':
          id: 3016
        '[1]':
          id: 3017
      absent:
        - '[2]'
      absent_headers:
        - Link

  # The position. This route names no page size at all -- limit_param is
  # "-" -- so there is no way to show one, and the pair this generator
  # usually writes is a single case. page=2 answers something the first
  # request did not, which a name nobody read could not produce.
  - name: "page moves the page on for projects.json"
    source: "https://github.com/basecamp/bc3-api#identifying-your-application"
    fixture: small-account
    request:
      method: GET
      path: "/projects.json"
      query:
        "page": "2"
      headers:
        "Authorization": "Bearer cauldron_basecamp_token"
        "User-Agent": "Cauldron (cauldron@example.com)"
    expect:
      status: 200
      absent:
        - "[0]"

  # The position. This route names no page size at all -- limit_param is
  # "-" -- so there is no way to show one, and the pair this generator
  # usually writes is a single case. page=2 answers something the first
  # request did not, which a name nobody read could not produce.
  - name: "page moves the page on for buckets messages.json"
    source: "https://github.com/basecamp/bc3-api/blob/master/sections/messages.md"
    fixture: small-account
    request:
      method: GET
      path: "/buckets/1001/messages.json"
      query:
        "page": "2"
      headers:
        "Authorization": "Bearer cauldron_basecamp_token"
        "User-Agent": "Cauldron (cauldron@example.com)"
    expect:
      status: 200
      absent:
        - "[0]"

  # The names. This Recipe declares 5 field(s) on a message that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a message carries the field names this Recipe declares"
    source: "https://github.com/basecamp/bc3-api/blob/master/sections/messages.md"
    fixture: small-account
    request:
      method: GET
      path: "/buckets/1001/messages.json"
      headers:
        "Authorization": "Bearer cauldron_basecamp_token"
        "User-Agent": "Cauldron (cauldron@example.com)"
    expect:
      status: 200
      body:
        "[0].content": "Fifty Recipes shipped."
        "[0].created_at": "2026-01-01T00:00:00Z"
        "[0].project_id": "1001"
        "[0].published": true
        "[0].subject": "Release notes"

  # The names. This Recipe declares 5 field(s) on a project that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a project carries the field names this Recipe declares"
    source: "https://github.com/basecamp/bc3-api#identifying-your-application"
    fixture: small-account
    request:
      method: GET
      path: "/projects.json"
      headers:
        "Authorization": "Bearer cauldron_basecamp_token"
        "User-Agent": "Cauldron (cauldron@example.com)"
    expect:
      status: 200
      body:
