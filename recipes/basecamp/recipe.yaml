# Basecamp Recipe for Cauldron
#
# Basecamp has no sandbox. An OAuth token reaches a real account, and a test
# that posts a message posts it where the whole project sees it and emails
# everybody subscribed. Basecamp deliberately has no hard delete either:
# everything goes to the trash and is recoverable for thirty days, so a test
# suite leaves a trail somebody has to clear.
#
# Tried live anyway, on 2026-09-05: every route this Recipe models lives
# under 3.basecampapi.com/{account_id}, and an account id this project
# invents is not one Basecamp has ever heard of. Struck with a made-up
# numeric id, with no credential, with a made-up one, and with and without a
# User-Agent header, the answer is identical every time -- a real backend
# process (X-Runtime and X-Request-Id are both present, so this is not an
# edge cache) answers 404 with Basecamp's own branded "Sorry, we don't have
# anything to show you here" page, before anything about a credential or a
# User-Agent is ever reached. That rules out checking this file's two
# central claims live: whether a missing User-Agent is refused, and whether
# a trashed record still answers 200, both need requests inside a real
# account this project does not have, and the account gate is the first
# thing hit regardless of what else is sent.
#
# One live thing was reachable and is out of scope rather than untested: the
# separate OAuth host, launchpad.37signals.com/authorization/new, answers
# unauthenticated and distinguishes a missing response_type from an
# unregistered client_id in its own words. This Recipe does not model OAuth
# authorization, only the BC3 resource API, so that host's answers do not
# bear on any claim made below.
#
# Two things worth modelling exactly:
#
#   1. Basecamp requires a User-Agent that identifies your application and
#      gives a contact address, and it refuses the request outright without
#      one. Nearly every HTTP client sends something by default, so this is
#      the rule people only discover from a server that sends nothing.
#   2. Everything is soft deleted. A trashed record still exists, is still
#      reachable by id, and comes back with status "trashed" rather than a
#      404. Code that treats a successful fetch as proof a thing is live
#      shows deleted content.
#
# Known fidelity gap, stated rather than hidden: Basecamp pages with a Link
# header, which Cauldron does not model.
#
# Tokens below are fixtures, not secrets.

recipe: basecamp
capability: issues
version: 0.1.0

upstream:
  api: "3"
  docs: https://github.com/basecamp/bc3-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_basecamp_token

# Basecamp refuses a request that does not identify the application making it.
required_headers:
  User-Agent: missing_user_agent

responses:
  list:
    style: bare
    # "The Basecamp API follows the RFC5988 convention of using the Link
    # header to provide URLs for the next page. Follow this convention to
    # retrieve the next page of data -- please don't build the pagination
    # URLs yourself!" If the Link header is blank, that is the last page.
    link_header: true
  error:
    style: flat
    message_field: error

resources:
  project:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      purpose:
        type: string
        default: topic
      # active, archived, trashed. Trashed is recoverable for thirty days and
      # still reachable by id, so a successful fetch proves nothing.
      status:
        type: string
        default: active
      # A project can be visible to the whole account or only to the people
      # on it, and the API returns both the same way.
      bookmarked:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime

  todo:
    id:
      style: numeric
      type: number
    fields:
      project_id:
        type: string
      content:
        type: string
        required: true
      description:
        type: string
      status:
        type: string
        default: active
      # Basecamp records completion separately from status, so a todo can be
      # completed and later trashed, and both facts survive.
      completed:
        type: boolean
        default: false
      due_on:
        type: string
      # Set only when somebody actually ticked it.
      completed_at:
        type: datetime
        stamped: false
      created_at:
        type: datetime

  message:
    id:
      style: numeric
      type: number
    fields:
      project_id:
        type: string
      subject:
        type: string
        required: true
      content:
        type: string
      status:
        type: string
        default: active
      # A draft has been written and not posted, so nobody has been emailed
      # yet. Publishing is a separate call.
      published:
        type: boolean
        default: false
      created_at:
        type: datetime

routes:
  - method: GET
    path: /projects.json
    resource: project
    operation: list
    # Active projects only. Archived and trashed ones are still there and
    # still readable by id, and they are not in this list, so a client that
    # syncs by listing decides they were deleted.
    #
    # There is no value that asks for everything. Basecamp takes
    # ?status=archived or ?status=trashed one at a time, so seeing the whole
    # account means three requests and knowing to make them.
    filters:
      - param: status
        field: status
        default: active
    pagination:
      # Checked against Basecamp's own documentation and its published
      # OpenAPI: page in the query, and no page-size parameter at all. The
      # size is Basecamp's to choose, so limit_param is "-" rather than a
      # name it does not accept.
      #
      # Basecamp is emphatic about the Link header -- "follow this convention
      # to retrieve the next page of data, please don't build the pagination
      # URLs yourself" -- and if the Link header is blank, that is the last
      # page.
      #
      # Stated gap: Basecamp uses geared pagination. Fifteen results on page
      # one, thirty on page two, fifty on three, a hundred on four and above,
      # so the page size changes as you go. Cauldron serves one size, which
      # is why building the URLs yourself is the thing their documentation
      # tells you not to do: a client computing offsets from page numbers is
      # wrong from page two onwards. It cannot make that mistake against a
      # Recipe that pages evenly, which is the half of the lesson this
      # cannot teach.
      #
      # Also not modelled: X-Total-Count, which Basecamp sends beside Link.
      style: page
      # Fifteen, which is what Basecamp puts on page one. The declaration
      # cannot say "and thirty on the next", so page one is the honest
      # number to pick.
      limit: 15
      limit_param: "-"
      cursor_param: page

  - method: GET
    path: /projects/{id}.json
    resource: project
    operation: get

  - method: POST
    path: /projects.json
    resource: project
    operation: create
    status: 201

  - method: GET
    path: /buckets/{project_id}/todos.json
    resource: todo
    operation: list
    scope: [project_id]
    pagination:
      # Checked against Basecamp's own documentation and its published
      # OpenAPI: page in the query, and no page-size parameter at all. The
      # size is Basecamp's to choose, so limit_param is "-" rather than a
      # name it does not accept.
      #
      # Basecamp is emphatic about the Link header -- "follow this convention
      # to retrieve the next page of data, please don't build the pagination
      # URLs yourself" -- and if the Link header is blank, that is the last
      # page.
      #
      # Stated gap: Basecamp uses geared pagination. Fifteen results on page
      # one, thirty on page two, fifty on three, a hundred on four and above,
      # so the page size changes as you go. Cauldron serves one size, which
      # is why building the URLs yourself is the thing their documentation
      # tells you not to do: a client computing offsets from page numbers is
      # wrong from page two onwards. It cannot make that mistake against a
      # Recipe that pages evenly, which is the half of the lesson this
      # cannot teach.
      #
      # Also not modelled: X-Total-Count, which Basecamp sends beside Link.
      style: page
      # Fifteen, which is what Basecamp puts on page one. The declaration
      # cannot say "and thirty on the next", so page one is the honest
      # number to pick.
      limit: 15
      limit_param: "-"
      cursor_param: page

  - method: POST
    path: /buckets/{project_id}/todos.json
    resource: todo
    operation: create
    scope: [project_id]
    status: 201

  - method: GET
    path: /buckets/{project_id}/todos/{id}.json
    resource: todo
    operation: get
    scope: [project_id]

  - method: GET
    path: /buckets/{project_id}/messages.json
    resource: message
    operation: list
    scope: [project_id]
    pagination:
      # Checked against Basecamp's own documentation and its published
      # OpenAPI: page in the query, and no page-size parameter at all. The
      # size is Basecamp's to choose, so limit_param is "-" rather than a
      # name it does not accept.
      #
      # Basecamp is emphatic about the Link header -- "follow this convention
      # to retrieve the next page of data, please don't build the pagination
      # URLs yourself" -- and if the Link header is blank, that is the last
      # page.
      #
      # Stated gap: Basecamp uses geared pagination. Fifteen results on page
      # one, thirty on page two, fifty on three, a hundred on four and above,
      # so the page size changes as you go. Cauldron serves one size, which
      # is why building the URLs yourself is the thing their documentation
      # tells you not to do: a client computing offsets from page numbers is
      # wrong from page two onwards. It cannot make that mistake against a
      # Recipe that pages evenly, which is the half of the lesson this
      # cannot teach.
      #
      # Also not modelled: X-Total-Count, which Basecamp sends beside Link.
      style: page
      # Fifteen, which is what Basecamp puts on page one. The declaration
      # cannot say "and thirty on the next", so page one is the honest
      # number to pick.
      limit: 15
      limit_param: "-"
      cursor_param: page

webhooks:
  events:
    - Comment
    - Todo
    - Todolist
    - Message
    - Document
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    message: You have exceeded the rate limit of 50 requests per 10 seconds
    headers:
      Retry-After: "10"

  authentication_error:
    status: 401
    message: The access token is invalid or has expired

  resource_missing:
    status: 404
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    message: "{detail} is required"

  missing_user_agent:
    status: 400
    message: A User-Agent header identifying your application and a contact address is required

  # Basecamp refuses to write to an archived project, which is what a sync
  # discovers when somebody tidies up mid-quarter.
  project_archived:
    status: 403
    message: The project is archived and cannot be modified

  # A token that can read a project cannot always write to it, and the
  # message does not say which permission is missing.
  forbidden:
    status: 403
    message: You are not authorized to perform this action

fixtures:
  empty: {}

  small-account:
    project:
      - id: "1001"
        name: Cauldron
        description: The engine and its Recipes
        status: active
      - id: "1002"
        name: Old experiment
        # Archived. Readable, and writes to it are refused.
        status: archived
      - id: "1003"
        name: Deleted last week
        # Trashed, recoverable for thirty days, and still reachable by id.
        # A successful fetch proves nothing about whether it is live.
        status: trashed
    todo:
      - id: "2001"
        project_id: "1001"
        content: Ship the conformance suite
        status: active
        completed: false
      - id: "2002"
        project_id: "1001"
        content: Write the Basecamp Recipe
        status: active
        completed: true
        completed_at: "2026-01-12T14:00:00Z"
      - id: "2003"
        project_id: "1001"
        content: Completed, then trashed
        # Both facts survive. Basecamp records completion separately from
        # status, so this is not the same as either alone.
        status: trashed
        completed: true
        completed_at: "2026-01-10T09:00:00Z"
    message:
      - id: "3001"
        project_id: "1001"
        subject: Release notes
        content: Fifty Recipes shipped.
        published: true
      - id: "3002"
        project_id: "1001"
        subject: Half-written draft
        # Written, not posted. Nobody has been emailed, and publishing is a
        # separate call.
        published: false

  # More than one page of to-dos. Basecamp puts fifteen on page one, so a
  # project needs sixteen before the second page exists at all -- and
  # without a second page neither the page parameter nor the Link header
  # is being checked by anything.
  busy-project:
    project:
      - id: "1002"
        name: Busy project
        purpose: topic
    todo:
      - id: "3001"
        project_id: "1002"
        content: Item 1
        status: active
        completed: false
      - id: "3002"
