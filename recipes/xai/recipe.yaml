# xAI Recipe for Cauldron
#
# Two kinds of evidence, kept apart. Observed: struck live against
# api.x.ai on 2026-08-31, with no API key at all -- every case below
# carrying a `verified:` date was read off the wire that day, bytes and
# status line and all. Documented: everything else -- the model listing's
# pricing fields, the chat completion shape, reasoning_content -- is read
# from the OpenAPI 3.1 description at docs.x.ai/openapi.json and carries no
# `verified:` date, because a result from those routes needs an account,
# and a chat completion costs money. Nothing here was called with a real
# key, and nothing ever will be.
#
# The description's own words: "REST API for xAI compatible with other
# providers." Plural, and it means it -- /v1/chat/completions answers
# OpenAI's shape, /v1/messages answers Anthropic's, /v1/responses answers
# OpenAI's newer Responses shape, all on the same host. Only the first is
# modelled here, to match the surface the other two Recipes in this
# collection compare against.
#
# Missing a key and sending the wrong one are not the same failure, and
# both are observed:
#
#   No credentials:   401  {"code":"unauthenticated:no-credentials","error":"No credentials presented."}
#   Wrong credentials: 400  {"code":"invalid-argument","error":"Incorrect API key provided. ..."}
#
# Different status, different code, different sentence. Mistral's own
# Recipe in this collection answers the identical body for both; this host
# answers two.
#
# And the code beside the message is not one thing. "unauthenticated:
# no-credentials" and "invalid-argument" are slugs, chosen; sent to
# /v1/chat/completions with an empty message list, the code is the string
# "400" -- the status line, restated, as if nothing more specific existed
# for this failure. Three failures, three different ideas of what a "code"
# is, on one host.
#
# A path nothing maps to is the sharpest envelope switch of all: plain
# text, not JSON. "The requested resource was not found. Please check the
# URL and try again. Documentation is available at https://docs.x.ai/" --
# Content-Type text/plain, and a client that calls .json() on every
# response because every other route on this host answers JSON throws on
# this one.
#
# None of these three are declared anywhere in the machine-readable
# description. /v1/models documents only "400: Bad request. The request is
# invalid or an invalid API key is provided." -- one status for what turned
# out to be two, on live inspection, with no schema for either body. The
# shape of every failure in this Recipe is observed knowledge, not read
# knowledge, because there is nothing to read.
#
# Four more, from the description:
#
#   1. A model prices itself, in a unit nothing else here uses. Pricing
#      lives on /v1/models, which is already a stop OpenAI never made --
#      its own Model schema has no price field at all. And the number is an
#      integer, in USD cents per hundred million tokens, so a completion
#      model prices at 80000 and an image model prices per image in the
#      same currency and a different field entirely.
#   2. Reasoning is a string, not a number withheld. OpenAI's own Recipe in
#      this collection is about a hidden reasoning count that is billed and
#      never shown; this host's ChoiceMessage carries reasoning_content
#      directly in the response, readable text rather than a count sitting
#      in a details object nobody opens.
#   3. The bill rides inside the answer, in ticks. usage.cost_in_usd_ticks
#      is required on every response, an integer at 10,000,000,000 to the
#      dollar -- OpenAI's Usage has never had a cost field, and this host's
#      is denominated in a unit invented for this API alone.
#   4. A model publishes its own aliases; nothing points backward. This
#      host's Model carries an "aliases" array on the canonical entry.
#      OpenRouter's own Recipe in this collection runs the naming the other
#      direction -- an alias model carries alias_target pointing at the
#      real one, and the real one says nothing about being pointed at. Two
#      "OpenAI-compatible" catalogues, two opposite ideas of which record
#      owns the relationship.
#
# And a fifth thing that is not a finding so much as a warning: a
# completion here is a bare UUID, chatcmpl- is OpenAI's and cmpl- is
# Mistral's, and none of the three collide. Code written against any one of
# these prefixes and pointed at either of the other two Recipes in this
# collection matches nothing.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No model runs. A completion answers with whatever the resource's own
#     defaults say, always the same shape, because a create route cannot
#     branch on what was asked. There is also no GET for a stored
#     completion here, the way OpenAI's Recipe has one -- this host does
#     not document one either -- so the create route's own default is the
#     only chat completion shape this Recipe can ever answer with.
#   - The runtime checks credentials before it checks anything else the
#     provider might say no to, for every Recipe, unconditionally. This
#     host checks the opposite way around on two routes observed directly:
#     an empty message list is refused with 400 before credentials are
#     read at all, and an unsupported method on /v1/models answers 405 with
#     an empty body and an Allow header, also before credentials. Both are
#     real and dated; neither is a conformance case, because this Recipe
#     cannot make the runtime ask in that order. invalid_credentials and
#     empty_messages below are reached with `arm` instead, which installs
#     the failure directly and proves the shape without proving the
#     ordering.
#   - Streaming is not modelled.
#   - /v1/messages, /v1/responses, /v1/completions (the legacy
#     non-chat form), embeddings, images, videos, files and skills are not
#     modelled. Chat completions and models only, to match the surface the
#     other two Recipes in this collection cover.
#
# The key below is a fixture and belongs to no account.

recipe: xai
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.x.ai/docs/api-reference
  spec: https://docs.x.ai/openapi.json
  spec_hash: aa41af572d8c83b14cd8a83806001b6f836e3e877f943f3710b0abef631969c0
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - xai-cauldron0000000000000000000000000000000000

responses:
  # No has_more_field or cursor_field: ListModelsResponse is {data, object}
  # and nothing else, and the only list route this Recipe has is this one,
  # so there is no case that could ever assert either name where its value
  # exists.
  list:
    style: wrapped
    key: data
    fields:
      object: list
  resource:
    style: bare
  # Flat, {code, error} -- no nested "error" object the way OpenAI wraps
  # one, no "type", no "param". code is a slug on two of the three failures
  # this Recipe declares and the HTTP status restated as a string on the
  # third; forced to string here because that third one is all digits and
  # would otherwise be inferred as a JSON number, which is not what the
  # live body sent.
  error:
    style: flat
    message_field: error
    code_field: code
    code_type: string
    type_field: "-"

resources:
  model:
    id:
      style: opaque
    constants:
      object: model
    fields:
      created:
        type: timestamp
      owned_by:
        type: string
        default: xai
      aliases:
        type: list
      # Absent on the image model below, exactly as the description's own
      # example for it does: the key is not sent at all rather than sent
      # null.
      context_length:
        type: integer
      # USD cents per hundred million tokens, an integer, on a route
      # OpenAI's own Model schema has never carried a price on at all.
      # Absent rather than null on the image model below: the description's
      # own example for it omits these keys entirely rather than nulling
      # them.
      prompt_text_token_price:
        type: integer
      completion_text_token_price:
        type: integer
      # Only the image-generation model carries this, in the same
      # currency and a completely different field.
      image_price:
        type: integer

  # A create route cannot branch on what was asked, and this host documents
  # no GET for a stored completion either, so the one shape below is the
  # only chat completion this Recipe can ever answer with.
  completion:
    id:
      style: uuid
    constants:
      object: chat.completion
    fields:
      created:
        type: timestamp
      model:
        type: string
      system_fingerprint:
        type: string
        default: fp_xai_cauldron0001
      service_tier:
        type: string
        default: default
      index:
        type: integer
        in: choices[0]
        as: index
        default: 0
      finish_reason:
        type: string
        in: choices[0]
        as: finish_reason
        default: stop
      role:
        type: string
        in: choices[0].message
        as: role
        default: assistant
      content:
        type: string
        in: choices[0].message
        as: content
        default: The rings of Saturn are made mostly of water ice.
      # Readable text, not a count. OpenAI's own Recipe in this collection
      # is about this exact quantity arriving only as a number inside
      # usage, never as words -- this host puts the words in the message.
      reasoning_content:
        type: string
        in: choices[0].message
        as: reasoning_content
        default: The user is asking about Saturn's rings; I recall they are composed primarily of ice particles with some rocky debris.
      prompt_tokens:
        type: integer
        in: usage
        as: prompt_tokens
        default: 24
      completion_tokens:
        type: integer
        in: usage
        as: completion_tokens
        default: 11
      total_tokens:
        type: integer
        in: usage
        as: total_tokens
        default: 35
      reasoning_tokens:
        type: integer
        in: usage.completion_tokens_details
        as: reasoning_tokens
        default: 42
      # 10,000,000,000 ticks to the dollar, per the description. The bill
      # for this exact request, inside the response that made it, in a unit
      # OpenAI's Usage schema has never needed because it has no such field
      # at all.
      cost_in_usd_ticks:
        type: integer
        in: usage
        as: cost_in_usd_ticks
        default: 3500000

routes:
  - method: GET
    path: /v1/models
    resource: model
    operation: list

    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
  - method: GET
    path: /v1/models/{id}
    resource: model
    operation: get

  - method: POST
    path: /v1/chat/completions
    resource: completion
    operation: create
    # Nothing sent comes back. What is served is an answer and a bill, the
    # same claim OpenRouter's Recipe in this collection makes about its own
    # completions route.
    returns:
      - id
      - object
      - created
      - model
      - system_fingerprint
      - service_tier
      - index
      - finish_reason
      - role
      - content
      - reasoning_content
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - reasoning_tokens
      - cost_in_usd_ticks

errors:
  # Observed on api.x.ai on 2026-08-31, sent with no Authorization header
  # at all.
  authentication_error:
    status: 401
    code: "unauthenticated:no-credentials"
    message: "No credentials presented."

  # Observed the same day, sent with a syntactically plausible bearer token
  # that is not a real key. A different status and a different code from
  # the one above -- this host tells the two failures apart, which the
  # emulator's own single credentials check cannot: every request this
  # sandbox refuses for its Authorization header answers with
  # authentication_error above, regardless of whether the header was
  # absent or merely wrong. This entry is reached with `arm` so the shape
  # can still be asserted.
  invalid_credentials:
    status: 400
    code: "invalid-argument"
    message: "Incorrect API key provided. You can obtain an API key from https://console.x.ai."

  # Observed the same day, sent to POST /v1/chat/completions with an empty
  # message list and no Authorization header at all -- the request was
  # refused for its body before its credentials were ever read, which is
  # the opposite of every other Recipe's check order and is stated as a
  # fidelity gap in the header rather than reproduced. code here is the
  # HTTP status restated as a string, not a slug like the two entries
  # above -- a third idea of what "code" means, on the same host. Reached
  # with `arm`.
  empty_messages:
    status: 400
    code: "400"
    message: "Bad data: Messages cannot be empty"

  # Observed the same day, against a path nothing maps to, with no
  # Authorization header sent. Plain text, not the {code, error} JSON every
  # other failure on this host answers with -- a client calling .json() on
  # this one throws.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/plain
    message: "The requested resource was not found. Please check the URL and try again. Documentation is available at https://docs.x.ai/"

fixtures:
  empty: {}

  catalogue:
    model:
      # A language model. Two prices, in cents per hundred million tokens --
      # a route OpenAI's own Model schema has never put a price on at all.
      - id: grok-420-reasoning
        aliases: []
        context_length: 256000
        created: 1768003200
        owned_by: xai
        prompt_text_token_price: 20000
        completion_text_token_price: 80000

      # An image model. No context_length worth a ceiling, no text-token
      # prices at all -- image_price instead, same currency, a field the
      # language model above never carries.
      - id: grok-imagine-image
        aliases: []
        created: 1769472000
        owned_by: xai
        image_price: 200000000

      # A model naming its own alias. The description's own example for
      # "latest" carries exactly this array.
      - id: latest
        aliases: ["grok-4-latest"]
        context_length: 131072
        created: 1776556800
        owned_by: xai
        prompt_text_token_price: 12500
        completion_text_token_price: 25000

# Cases carrying `verified: "2026-08-31"` were checked that day against
# api.x.ai with no API key. The rest are derived from docs.x.ai/openapi.json
# and carry no date, because reaching them with a result needs an account
# this Recipe will never hold.
conformance:
  - name: no credentials is a 401 with a slug for a code
    source: https://api.x.ai/v1/models
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /v1/models
    expect:
      status: 401
      body:
        code: "unauthenticated:no-credentials"
        error: "No credentials presented."
      absent:
        # No nested "error" object the way OpenAI wraps one, and the
        # message lives under "error" rather than under "message" -- a
        # client written against OpenAI's {error: {message, type, code,
        # param}} reads error.message here and finds a string, not an
        # object, and .message on a string is undefined.
        - error.message
        - message
        - error.type
        - error.param
        - type

  - name: wrong credentials is a different status and a different code
    # Reached with `arm`, because the emulator's own check cannot tell an
    # absent header from a wrong one -- both answer authentication_error
    # above on this sandbox. What is asserted here is the shape the real
    # host sends for the case the emulator cannot naturally reach: 400,
    # not 401, and invalid-argument, not unauthenticated:no-credentials.
    source: https://api.x.ai/v1/models
    verified: "2026-08-31"
    fixture: empty
    arm: invalid_credentials
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer notarealkey
    expect:
      status: 400
      body:
        code: "invalid-argument"
        error: "Incorrect API key provided. You can obtain an API key from https://console.x.ai."

  - name: a code can be a slug or the status restated, on the same host
    # unauthenticated:no-credentials chooses a word. This one is just "400"
    # -- the line already in the status, typed again into the body, as if
    # nothing more specific existed for a request this shape.
    source: https://api.x.ai/v1/chat/completions
    verified: "2026-08-31"
    fixture: empty
    arm: empty_messages
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
      json:
        model: grok-420-reasoning
        messages: []
    expect:
      status: 400
      body:
        code: "400"
        error: "Bad data: Messages cannot be empty"

  - name: a path nothing maps to answers in plain text, not the usual JSON
    # Observed with no Authorization header sent whatsoever. Sent here with
    # the fixture key so the emulator's own route table is reached -- see
    # the fidelity gap above about check order -- but the body asserted is
    # the one the real host sent with no credential present at all.
    source: https://api.x.ai/v1/nonexistent-path-xyz
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /v1/nonexistent-path-xyz
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^The requested resource was not found\.'

  - name: the catalogue prices itself in a unit OpenAI's Model has never needed
    source: https://docs.x.ai/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        object: list
        "data[0].id": grok-420-reasoning
        "data[0].prompt_text_token_price": 20000
        "data[0].completion_text_token_price": 80000

  - name: an image model prices per image and has no text-token price at all
    source: https://docs.x.ai/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        "data[1].id": grok-imagine-image
        "data[1].image_price": 200000000
      absent:
        - data[1].prompt_text_token_price
        - data[1].completion_text_token_price
        - data[1].context_length

  - name: a model here publishes its own aliases; nothing points backward
    # OpenRouter's own Recipe in this collection runs the relationship the
    # other way: an alias entry carries alias_target pointing at the real
    # model, and the real model says nothing about being pointed at. Here
    # the canonical entry -- "latest" -- lists the alias itself, and there
    # is no separate record for "grok-4-latest" to look up at all.
    source: https://docs.x.ai/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        "data[2].id": latest
        "data[2].aliases[0]": grok-4-latest
      absent:
        - data[2].alias_target
        - data[2].canonical_slug

  - name: a completion here is a bare UUID, not chatcmpl- or cmpl-
    source: https://docs.x.ai/openapi.json
    fixture: empty
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
      json:
        model: grok-420-reasoning
        messages:
          - role: user
            content: What are Saturn's rings made of?
    expect:
      status: 200
      body:
        object: chat.completion
        model: grok-420-reasoning
        "choices[0].finish_reason": stop
        "choices[0].message.content": The rings of Saturn are made mostly of water ice.
      matches:
        id: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      absent:
        - messages

  - name: reasoning is words in the message, not a count sitting in usage
    # OpenAI's own Recipe in this collection is about this exact quantity
    # arriving only as a number, invisible unless the details object is
    # opened. This host puts the words themselves in the response.
    source: https://docs.x.ai/openapi.json
    fixture: empty
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
      json:
        model: grok-420-reasoning
        messages:
          - role: user
            content: What are Saturn's rings made of?
    expect:
      status: 200
      body:
        "choices[0].message.reasoning_content": The user is asking about Saturn's rings; I recall they are composed primarily of ice particles with some rocky debris.
        "usage.completion_tokens_details.reasoning_tokens": 42

  - name: the bill for this request rides inside its own response
    # cost_in_usd_ticks, required on every completion, at ten billion
    # ticks to the dollar. OpenAI's Usage has never had a field for what a
    # request cost; this host answers with one, denominated in a unit
    # invented for it alone.
    source: https://docs.x.ai/openapi.json
    fixture: empty
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer xai-cauldron0000000000000000000000000000000000
      json:
        model: grok-420-reasoning
        messages:
          - role: user
            content: What are Saturn's rings made of?
    expect:
      status: 200
      body:
        "usage.cost_in_usd_ticks": 3500000
        "usage.prompt_tokens": 24
        "usage.total_tokens": 35

  # The names. This Recipe declares 3 field(s) on a model that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a model carries the field names this Recipe declares"
    source: "https://docs.x.ai/openapi.json"
    fixture: catalogue
    request:
      method: GET
      path: "/v1/models"
      headers:
        "Authorization": "Bearer xai-cauldron0000000000000000000000000000000000"
    expect:
      status: 200
      body:
        "data[0].context_length": 256000
        "data[0].created": 1768003200
        "data[0].owned_by": "xai"

