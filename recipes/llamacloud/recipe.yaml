# LlamaCloud Recipe for Cauldron
#
# The pipeline listing, read from the OpenAPI document LlamaCloud serves
# without a credential at api.cloud.llamaindex.ai/api/openapi.json, and struck
# live on 2026-09-13 with no header, with a wrong key, on a path that does not
# exist, and with a method the path does not take.
#
# **A wrong key is explained as a geography problem.** Struck live:
#
#   {"detail":"Invalid API Key. Please check your region
#     https://developers.llamaindex.ai/python/cloud/general/regions."}
#
# The key was wrong; the sentence tells you to check which continent you are
# calling, and links to a page about it. A missing key gets FastAPI's own
# `{"detail":"Not authenticated"}` instead, so the two failures share a field
# and nothing else.
#
# **The document declares no servers at all.** `servers` is absent, so a
# generated client has an operation for every one of the 147 paths and no base
# URL to send any of them to.
#
# **The listing declares two responses and neither is a failure a caller will
# meet.** `search_pipelines_api_v1_pipelines_get` lists a 200 and a 422, on an
# API that answers 401 to everything anonymous and 404 to a mistyped path -- so
# drift reports every failure this Recipe serves as unbacked, and each report is
# right.
#
# **Three paths end in a colon and a verb.** `/api/v1/beta/agent-data/:search`,
# `/:aggregate` and `/:delete`, all POSTs -- and `DELETE
# /api/v1/beta/agent-data/{item_id}` exists beside them, so one resource has two
# ways to be deleted and one of them is a POST to a path named delete. Three
# paths out of a hundred and forty-seven use that convention.
#
# **Thirty-three of the paths are under `/beta/`.** Agent data, batch
# processing, configurations, directories, attachments and data sinks are all
# beta, in the same document and under the same version number as the rest.
#
# **Three fields for the embedding configuration, and the required one has no
# description.** A pipeline carries `embedding_model_config_id` ("The ID of the
# EmbeddingModelConfig this pipeline is using"), `embedding_model_config` ("The
# embedding model configuration for this pipeline") and `embedding_config` --
# and `embedding_config`, the one with no description, is the one in `required`.
#
# **Seven configuration fields and two suffixes for the idea.**
# `embedding_model_config`, `embedding_config`, `sparse_model_config`,
# `transform_config`, `metadata_config`, `preset_retrieval_parameters` and
# `llama_parse_parameters`: five `_config` and two `_parameters`, on one record.
#
# **A field that only means something for half the records.**
# `managed_pipeline_id` is "The ID of the ManagedPipeline this playground
# pipeline is linked to" -- a description that presumes `pipeline_type` is
# `PLAYGROUND`, on a record whose type is "Either PLAYGROUND or MANAGED".
#
# **And the timestamps are optional.** `created_at` and `updated_at` are
# nullable and absent from `required`, so a pipeline may not know when it was
# made, while `id`, `name`, `project_id` and `embedding_config` must be there.
#
# Also pinned: `config_hash` is "Hashes for the configuration of the pipeline",
# plural, under a singular name; the listing takes a `session` query parameter;
# and the operation is `search_pipelines_api_v1_pipelines_get`, the handler name
# with the path and the verb appended, so a generated client's method is called
# `searchPipelinesApiV1PipelinesGet`.

recipe: llamacloud
capability: ai
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://developers.llamaindex.ai/python/cloud/
  spec: https://api.cloud.llamaindex.ai/api/openapi.json
  spec_hash: b96741b6f92c2ae9d65fe5fdbd678dc0eb69d109e33fe298c8eceb1816d242e6
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - llx-cauldr0nf1xturek3y000000000000000000000000000000
  absent_error: not_authenticated
  rejected_error: invalid_api_key
  malformed_error: not_authenticated
  after_routing: true

responses:
  list:
    # A bare array, under six query parameters.
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  pipeline:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      project_id:
        type: string
      # Either PLAYGROUND or MANAGED.
      pipeline_type:
        type: string
      # Optional, and nullable, where name and project_id are required.
      created_at:
      updated_at:
      # Three fields for one configuration...
      embedding_model_config_id:
      embedding_model_config:
      # ...and the one with no description is the required one.
      embedding_config:
        type: map
      sparse_model_config:
      transform_config:
      metadata_config:
      preset_retrieval_parameters:
        type: map
      llama_parse_parameters:
      # "The ID of the ManagedPipeline this playground pipeline is linked to."
      managed_pipeline_id:
      # "Hashes", plural, under a singular name.
      config_hash:
      data_sink:
      status:

routes:
  - method: GET
    path: /api/v1/pipelines
    resource: pipeline
    operation: list
    pagination:
      style: none
    filters:
      - param: pipeline_name
        field: name
      - param: project_id
        field: project_id

errors:
  not_authenticated:
    status: 401
    # FastAPI's own words, for a request carrying nothing.
    message: Not authenticated

  invalid_api_key:
    status: 401
    # The key was wrong; the sentence is about continents.
    message: "Invalid API Key. Please check your region https://developers.llamaindex.ai/python/cloud/general/regions."

  method_not_allowed:
    # Live, a method the route does not take is answered by the credential
    # check, while an unrouted path is answered by the router.
    status: 401
    message: Not authenticated

  unknown_route:
    status: 404
    message: Not Found

fixtures:
  empty:
    pipeline: []

  workspace:
    pipeline:
      - id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        name: handbook
        project_id: 7a6b5c4d-3e2f-4a1b-9c8d-0e1f2a3b4c5d
        pipeline_type: MANAGED
        created_at: "2026-04-18T10:03:22.418Z"
        updated_at: "2026-09-01T07:45:10.002Z"
        # The id of the configuration...
        embedding_model_config_id: 2f1e0d9c-8b7a-4655-9443-322110ffeedd
        # ...the configuration itself...
        embedding_model_config:
          id: 2f1e0d9c-8b7a-4655-9443-322110ffeedd
          name: default-openai
        # ...and the required one, which the document does not describe.
        embedding_config:
          type: OPENAI_EMBEDDING
          component:
            model_name: text-embedding-3-small
        sparse_model_config: null
        transform_config:
          mode: auto
        metadata_config: null
        preset_retrieval_parameters:
          dense_similarity_top_k: 30
          sparse_similarity_top_k: 30
          alpha: 0.5
        llama_parse_parameters:
          premium_mode: false
        # Null on a pipeline that is not a playground one.
        managed_pipeline_id: null
        config_hash:
          embedding_config_hash: 8d1f2a3b4c5d6e7f
          parsing_config_hash: 0a9b8c7d6e5f4a3b
        data_sink: null
        status: SUCCESS
      - id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
        name: scratch
        project_id: 7a6b5c4d-3e2f-4a1b-9c8d-0e1f2a3b4c5d
        # The production index type that is called playground.
        pipeline_type: PLAYGROUND
        # Not required, and not here.
        created_at: null
        updated_at: null
        embedding_model_config_id: null
        embedding_model_config: null
        embedding_config:
          type: OPENAI_EMBEDDING
          component:
            model_name: text-embedding-3-small
        sparse_model_config: null
        transform_config: null
        metadata_config: null
        preset_retrieval_parameters:
          dense_similarity_top_k: 30
          sparse_similarity_top_k: 30
          alpha: 0.5
        llama_parse_parameters: null
        # And the field whose description only makes sense here.
        managed_pipeline_id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        config_hash: null
        data_sink: null
        status: null

conformance:
  - name: a wrong key is explained as a geography problem
    source: https://api.cloud.llamaindex.ai/api/v1/pipelines
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-notarealkey"
    expect:
      status: 401
      body:
        # The key was wrong; the sentence is about which continent you called.
        detail: "Invalid API Key. Please check your region https://developers.llamaindex.ai/python/cloud/general/regions."

  - name: a missing key gets the framework's own two words
    source: https://api.cloud.llamaindex.ai/api/v1/pipelines
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers: {}
    expect:
      status: 401
      body:
        # The two failures share a field and nothing else.
        detail: Not authenticated

  - name: a method the route does not take is answered by the credential check
    source: https://api.cloud.llamaindex.ai/api/v1/pipelines
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: PUT
      path: /api/v1/pipelines
      headers: {}
    expect:
      status: 401
      body:
        detail: Not authenticated

  - name: and an unrouted path is answered by the router
    source: https://api.cloud.llamaindex.ai/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        detail: Not Found

  - name: three fields for the embedding configuration
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body:
        # The id of it, the object itself, and a third one -- which is the
        # only one in required and the only one with no description.
        '[0].embedding_model_config_id': 2f1e0d9c-8b7a-4655-9443-322110ffeedd
        '[0].embedding_model_config.id': 2f1e0d9c-8b7a-4655-9443-322110ffeedd
        '[0].embedding_config.type': OPENAI_EMBEDDING
        '[0].embedding_config.component.model_name': text-embedding-3-small
        '[1].embedding_model_config_id': null
        '[1].embedding_model_config': null

  - name: a field whose description only fits half the records
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body:
        # "The ID of the ManagedPipeline this playground pipeline is linked
        # to", on a record whose type is either PLAYGROUND or MANAGED.
        '[0].pipeline_type': MANAGED
        '[0].managed_pipeline_id': null
        '[1].pipeline_type': PLAYGROUND
        '[1].managed_pipeline_id': 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e

  - name: the timestamps are optional and the configuration is not
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body:
        # required is [id, name, project_id, embedding_config] and nothing
        # else, so a pipeline may not know when it was made.
        '[1].created_at': null
        '[1].updated_at': null
        '[0].created_at': "2026-04-18T10:03:22.418Z"
        '[0].updated_at': "2026-09-01T07:45:10.002Z"
        '[0].id': 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        '[0].name': handbook
        '[0].project_id': 7a6b5c4d-3e2f-4a1b-9c8d-0e1f2a3b4c5d

  - name: seven configuration fields and two suffixes for the idea
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Five _config and two _parameters, on one record.
        '[0].sparse_model_config': null
        '[0].transform_config.mode': auto
        '[0].metadata_config': null
        '[0].preset_retrieval_parameters.dense_similarity_top_k': 30
        '[0].preset_retrieval_parameters.sparse_similarity_top_k': 30
        '[0].preset_retrieval_parameters.alpha': 0.5
        '[0].llama_parse_parameters.premium_mode': false
        '[1].llama_parse_parameters': null

  - name: hashes plural under a singular name
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body:
        # "Hashes for the configuration of the pipeline."
        '[0].config_hash.embedding_config_hash': 8d1f2a3b4c5d6e7f
        '[0].config_hash.parsing_config_hash': 0a9b8c7d6e5f4a3b
        '[1].config_hash': null
        '[0].data_sink': null
        '[0].status': SUCCESS
        '[1].status': null

  - name: a named pipeline is the only one that comes back
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
      query:
        pipeline_name: scratch
        project_id: 7a6b5c4d-3e2f-4a1b-9c8d-0e1f2a3b4c5d
    expect:
      status: 200
      body:
        '[0].id': 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
        '[0].name': scratch

  - name: a project with no pipelines answers a bare empty array
    source: https://api.cloud.llamaindex.ai/api/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/pipelines
      headers:
        Authorization: "Bearer llx-cauldr0nf1xturek3y000000000000000000000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
