# Jisho Recipe for Cauldron
#
# There is no failure. Every search answers 200, including one with no search
# in it.
#
#   /search/words?keyword=school      ->  200  {"meta": {"status": 200},
#                                               "data": [ ... ]}
#   /search/words?keyword=zzzzqqqxxx  ->  200  {"meta": {"status": 200},
#                                               "data": []}
#   /search/words                     ->  200  {"meta": {"status": 200},
#                                               "data": []}
#
# The third has no keyword at all -- the one parameter the endpoint exists for
# -- and it is answered the same way as a word nobody has heard of. A client
# whose query string was built wrong gets an empty result and no reason.
#
# **And meta.status is a field that can only hold one value.** It is 200 on all
# three, because the only non-200 on the host is an HTML page from a path that
# never reaches this code. So a client checking body.meta.status is checking a
# constant, which is worse than not checking: it looks like a guard and is not
# one.
#
# Written against the live API rather than a document: every case below was
# checked against jisho.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Sibling objects in one array do not have the same keys. A word's senses
#      are three objects of the same shape except that the third has a
#      "sentences" key and the first two do not. Nothing distinguishes them but
#      their position and their content, so a client mapping over senses and
#      reading .sentences.length throws on two of three.
#   2. attribution holds two booleans and a URL. {"jmdict": true, "jmnedict":
#      true, "dbpedia": "http://dbpedia.org/resource/School"} -- so
#      Object.values gives [true, true, "http://..."] and any code treating the
#      object as a set of flags renders a URL as a tick.
#   3. A part of speech that is not one. The third sense's parts_of_speech is
#      ["Wikipedia definition"], which says where the definition came from
#      rather than what kind of word it is, in the field a client uses to
#      decide whether something is a noun.
#
# And the links it gives are pinned to a Wikipedia revision from 2012, over
# plain http, with the Japanese one carrying an unescaped Japanese character in
# its path. The text around them uses curly quotation marks.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One word is served, of the twenty the query returns and the dictionary's
#     far larger set.
#   - The third sense's Japanese Wikipedia link is served with its path
#     percent-encoded rather than raw. The raw form is what arrives; this file
#     records it in the header and serves the encoded one, because the finding
#     is that the provider does not encode it and reproducing that faithfully
#     would put an unescaped character where a Recipe cannot carry it.
#   - The empty arrays a sense carries are served as they arrive. There are
#     seven of them on the first sense and eight on the third.

recipe: jisho
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: jisho
  docs: https://jisho.org/forum/54fefc1f6e73340b1f160000-is-there-any-kind-of-api-for-jisho

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: data
  error:
    # The only failure on the host is an HTML page, so there is no JSON error
    # shape to declare.
    style: text

resources:
  word:
    id:
      style: opaque
      field: slug
    fields:
      is_common:
        type: boolean
      # A third-party learning app's level, in a dictionary's public tags.
      tags:
        type: list
      # The field's own name, repeated inside its value.
      jlpt:
        type: list
      japanese:
        type: list
      # Three objects of the same shape, except where they are not.
      senses:
        type: list
      # Two booleans and a URL.
      attribution:
        type: map

routes:
  - method: GET
    path: /api/v1/search/words
    resource: word
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05 and abandoned deliberately. Jisho publishes no
    # API reference at all -- this Recipe's upstream.docs is a forum
    # thread, which is the only thing there has ever been -- so the only
    # source is the endpoint itself, and the endpoint stopped returning
    # parseable JSON to this task partway through. That is a rate limit in
    # everything but name, and re-hitting it to find out is not something
    # this project does.
    #
    # The unofficial convention is a page parameter and no size.
    # Convention is not a source, so nothing is declared, and the three
    # routes keep the engine's guess with this note beside them.
    fields:
      # A status inside the body, which is 200 on every answer this endpoint
      # gives.
      meta.status: 200

  # A word nobody has heard of: the same status, an empty list.
  - method: GET
    path: /api/v1/search/words-no-match
    resource: word
    operation: list
    # This route is the same search with a keyword nothing matches. There
    # is no word in it to describe, which is the point of it.
    empty: true
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05 and abandoned deliberately. Jisho publishes no
    # API reference at all -- this Recipe's upstream.docs is a forum
    # thread, which is the only thing there has ever been -- so the only
    # source is the endpoint itself, and the endpoint stopped returning
    # parseable JSON to this task partway through. That is a rate limit in
    # everything but name, and re-hitting it to find out is not something
    # this project does.
    #
    # The unofficial convention is a page parameter and no size.
    # Convention is not a source, so nothing is declared, and the three
    # routes keep the engine's guess with this note beside them.
    fields:
      meta.status: 200

  # No keyword at all: the same again, for the one parameter the endpoint
  # exists for.
  - method: GET
    path: /api/v1/search/words-no-keyword
    resource: word
    operation: list
    # And this one is the same search with no keyword at all. Jisho answers
    # 200 with an empty data array rather than refusing the request.
    empty: true
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05 and abandoned deliberately. Jisho publishes no
    # API reference at all -- this Recipe's upstream.docs is a forum
    # thread, which is the only thing there has ever been -- so the only
    # source is the endpoint itself, and the endpoint stopped returning
    # parseable JSON to this task partway through. That is a rate limit in
    # everything but name, and re-hitting it to find out is not something
    # this project does.
    #
    # The unofficial convention is a page parameter and no size.
    # Convention is not a source, so nothing is declared, and the three
    # routes keep the engine's guess with this note beside them.
    fields:
      meta.status: 200

  # A path that does not exist: the site's own page, and the only non-200.
  - method: GET
    path: /api/v1/nosuchthing
    error: page_not_found
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  page_not_found:
    status: 404
    message: "<!DOCTYPE html><html><head><title>Jisho.org | The page you were looking for doesn't exist (404)</title></head></html>"

fixtures:
  empty: {}

  school:
    word:
      - id: "学校"
        is_common: true
        # WaniKani is a different company's application. Its level seven is in
        # this API's public tags.
        tags:
          - wanikani7
        # The field's own name, repeated inside its value.
        jlpt:
          - jlpt-n5
        japanese:
          - word: "学校"
            reading: "がっこう"
        senses:
          # Seven empty arrays, and no sentences key.
          - english_definitions:
              - school
            parts_of_speech:
              - Noun
            links: []
            tags: []
            restrictions: []
            see_also: []
            antonyms: []
            source: []
            info: []
          - english_definitions:
              - Gakkou
            parts_of_speech:
              - Place
            links: []
            tags: []
            restrictions: []
            see_also: []
            antonyms: []
            source: []
            info: []
          # And this one has eight, because it also has sentences.
          - english_definitions:
              - School
            # A part of speech that says where the definition came from.
            parts_of_speech:
              - Wikipedia definition
            links:
              # A revision from 2012, over plain http, with curly quotation
              # marks around the title.
              - text: "Read “School” on English Wikipedia"
                url: "http://en.wikipedia.org/wiki/School?oldid=491526576"
              - text: "Read “学校” on Japanese Wikipedia"
                url: "http://ja.wikipedia.org/wiki/%E5%AD%A6%E6%A0%A1?oldid=42766206"
            tags: []
            restrictions: []
            see_also: []
            antonyms: []
            source: []
            info: []
            sentences: []
        attribution:
          # Two booleans...
          jmdict: true
          jmnedict: true
          # ...and a URL, in one object.
          dbpedia: "http://dbpedia.org/resource/School"

conformance:
  - name: a search with no keyword answers the same as one that finds nothing
    source: https://jisho.org/api/v1/search/words
    verified: "2026-08-30"
    fixture: empty
    request:
      method: GET
      path: /api/v1/search/words-no-keyword
    expect:
      # The one parameter the endpoint exists for, missing, and answered 200.
      status: 200
      body:
        meta.status: 200
      absent:
        - "data[0]"

  - name: and a word nobody has heard of is answered the same way again
    source: "https://jisho.org/api/v1/search/words?keyword=zzzzqqqxxx"
    verified: "2026-08-30"
    fixture: empty
    request:
      method: GET
      path: /api/v1/search/words-no-match
    expect:
      status: 200
      body:
        # A status field that has held one value on every request made of it.
        meta.status: 200
      absent:
        - "data[0]"

  - name: sibling objects in one array do not have the same keys
    source: "https://jisho.org/api/v1/search/words?keyword=%23jlpt-n5"
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/search/words
    expect:
      status: 200
      body:
        # The third sense has sentences...
        "data[0].senses[2].sentences": []
        "data[0].senses[2].english_definitions[0]": School
        "data[0].senses[0].english_definitions[0]": school
      absent:
        # ...and the two above it do not, so mapping over senses and reading
        # .sentences.length throws on two of three.
        - "data[0].senses[0].sentences"
        - "data[0].senses[1].sentences"

  - name: attribution holds two booleans and a URL
    source: "https://jisho.org/api/v1/search/words?keyword=%23jlpt-n5"
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/search/words
    expect:
      status: 200
      body:
        # Object.values gives [true, true, "http://..."], so code treating the
        # object as a set of flags renders a URL as a tick.
        "data[0].attribution.jmdict": true
        "data[0].attribution.jmnedict": true
        "data[0].attribution.dbpedia": "http://dbpedia.org/resource/School"

  - name: a part of speech that is not one
    source: "https://jisho.org/api/v1/search/words?keyword=%23jlpt-n5"
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/search/words
    expect:
      status: 200
      body:
        # Where the definition came from, in the field that says what kind of
        # word it is.
        "data[0].senses[2].parts_of_speech[0]": Wikipedia definition
        # Beside two that really are.
        "data[0].senses[0].parts_of_speech[0]": Noun
        "data[0].senses[1].parts_of_speech[0]": Place

  - name: the field's own name is repeated inside its value
    source: "https://jisho.org/api/v1/search/words?keyword=%23jlpt-n5"
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/search/words
    expect:
      status: 200
      body:
        # A client wanting the level must strip the prefix that is the field.
        "data[0].jlpt[0]": jlpt-n5
        # And a third-party learning application's level, in this API's tags.
        "data[0].tags[0]": wanikani7
        "data[0].is_common": true
        # The headword is the identifier, and it is the word itself.
        "data[0].slug": "学校"
        "data[0].japanese[0].word": "学校"
        # The reading is kana where the word is kanji, in one object.
        "data[0].japanese[0].reading": "がっこう"
        # And the second sense's definition, which is the word romanised
        # rather than translated.
        "data[0].senses[1].english_definitions[0]": Gakkou
        # The status, on the answer that found something, which is the same
        # number it sends when it finds nothing.
        meta.status: 200

  - name: the links are pinned to a revision from 2012 over plain http
    source: "https://jisho.org/api/v1/search/words?keyword=%23jlpt-n5"
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/search/words
    expect:
      status: 200
      body:
        # A fourteen-year-old revision, and no TLS.
        "data[0].senses[2].links[0].url": "http://en.wikipedia.org/wiki/School?oldid=491526576"
        "data[0].senses[2].links[1].url": "http://ja.wikipedia.org/wiki/%E5%AD%A6%E6%A0%A1?oldid=42766206"
        # With curly quotation marks in the text beside them.
        "data[0].senses[2].links[0].text": "Read “School” on English Wikipedia"

  - name: the only failure on the host is the site's own HTML page
    source: https://jisho.org/api/v1/nosuchthing
    verified: "2026-08-30"
    fixture: school
    request:
      method: GET
      path: /api/v1/nosuchthing
    expect:
      # The one non-200, and it never reaches the code that would send meta.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: "The page you were looking for doesn't exist \\(404\\)"
