# Asana Recipe for Cauldron
#
# Asana has no sandbox. A personal access token reaches a real workspace, and
# a test that creates tasks creates them where people can see them, notifies
# followers, and counts against the workspace. Teams end up with a graveyard
# project full of "test task 47", or they never exercise the API at all.
#
# Three things worth modelling exactly:
#
#   1. The identifier is called gid, not id, and it is a numeric string. Code
#      that reads task.id finds nothing, and code that parses the gid as a
#      number loses precision on a real one.
#   2. Every object declares a resource_type, and a client is expected to read
#      it before deciding what the object is.
#   3. Everything, single object or collection, is wrapped under "data". A
#      client reading the response body directly finds nothing either way.
#
# Tokens below are fixtures, not secrets.

recipe: asana
capability: issues
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://developers.asana.com/reference/rest-api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron/1234567890

responses:
  list:
    style: wrapped
    # Asana's cursor is nested under next_page, and next_page is null when
    # there is nothing more.
    cursor_field: next_page.offset
  resource:
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    message_field: message

resources:
  task:
    collection: data
    constants:
      resource_type: task
    id:
      style: digits
      field: gid
      length: 16
    fields:
      name:
        type: string
        required: true
      notes:
        type: string
      # An array of compact project objects, which is what Asana sends. This
      # was project_gid, a flat string Asana has never had: a task belongs to
      # several projects, and the shape says so.
      projects:
        type: list
      # A completed task is still returned by a plain task list, which is the
      # bug most integrations ship: a "remaining work" count that includes
      # everything ever done.
      completed:
        type: boolean
        default: false
      due_on:
        type: string
      # Asana sends the assignee as an object, not a flat gid, so this emits
      # assignee.gid. Code reading task.assignee_gid found a value here and
      # undefined against the real API; code reading task.assignee got a
      # string here and an object there, which is worse -- it does not throw.
      assignee_gid:
        type: string
        in: assignee
        as: gid
      created_at:
        type: datetime
      modified_at:
        type: datetime

  project:
    collection: data
    constants:
      resource_type: project
    id:
      style: digits
      field: gid
      length: 16
    fields:
      name:
        type: string
        required: true
      notes:
        type: string
      archived:
        type: boolean
        default: false
      color:
        type: string
      created_at:
        type: datetime

  user:
    collection: data
    constants:
      resource_type: user
    id:
      style: digits
      field: gid
      length: 16
    fields:
      name:
        type: string
        required: true
      email:
        type: string

routes:
  # Asana's listings are compact. GET /tasks answers with gid, name and the
  # resource type, and nothing else: no completed, no due_on, no assignee.
  # The full record needs opt_fields on the query, and without it every one
  # of those reads is undefined.
  #
  # This route used to send the whole task, which is the fiction that costs
  # most -- code reads task.completed off a listing, works against the fake,
  # and quietly reads undefined in production. Cauldron cannot expand
  # opt_fields yet, so the compact form is the only shape here.
  - method: GET
    path: /api/1.0/tasks
    resource: task
    operation: list
    returns:
      - id
      - name
    pagination:
      style: cursor
      limit: 50

  - method: POST
    path: /api/1.0/tasks
    resource: task
    operation: create
    emits: task.added
    status: 201

  - method: GET
    path: /api/1.0/tasks/{id}
    resource: task
    operation: get

  - method: PUT
    path: /api/1.0/tasks/{id}
    resource: task
    operation: update
    emits: task.changed

  # 200 with an empty data object, which is what Asana answers. Not 204: a
  # client calling .json() succeeds against Asana and throws on a 204, and
  # that difference is the whole reason to say which one a provider does.
  - method: DELETE
    path: /api/1.0/tasks/{id}
    resource: task
    operation: delete
    # removed, not deleted. Asana's word.
    emits: task.removed
    status: 200
    deleted_body: empty

  # Compact, like every Asana listing: gid, name and the resource type.
  - method: GET
    path: /api/1.0/projects
    resource: project
    operation: list
    returns:
      - id
      - name
    pagination:
      style: cursor
      limit: 50

  - method: GET
    path: /api/1.0/projects/{id}
    resource: project
    operation: get

  # Compact too, and this one bites: a user listing carries no email, so an
  # invite flow that reads user.email off it sends nowhere.
  - method: GET
    path: /api/1.0/users
    resource: user
    operation: list
    returns:
      - id
      - name
    pagination:
      style: cursor
      limit: 50

  - method: GET
    path: /api/1.0/users/{id}
    resource: user
    operation: get

webhooks:
  events:
    - task.added
    - task.changed
    - task.removed
    - task.deleted
    - project.changed
    - story.added
  signing:
    scheme: hmac-sha256
    header: X-Hook-Signature
    secret: cauldron-webhook-secret

errors:
  # Declared for cauldron fault rather than found in a description: Asana's description
  # declares no 429 on any operation, and a client that has never been made to
  # handle one is a client that will not. The wording is a placeholder rather
  # than something observed, and check reports it every run.
  rate_limit:
    status: 429
    code: rate_limit_enforced
    message: Server rate limit exceeded
    headers:
      Retry-After: "30"

  authentication_error:
    status: 401
    code: not_authorized
    message: "Not Authorized: authentication is required"

  resource_missing:
    status: 404
    code: not_found
    message: "Not Found: {detail}"

  parameter_missing:
    status: 400
    code: invalid_request
    message: "{detail}: Missing input"

  # Asana enforces a hard cap on tasks per project, and an import that hits it
  # fails halfway with real data already written.
  project_full:
    status: 400
    code: project_full
    message: The project has reached its maximum number of tasks.

  # A token that can read a workspace cannot always write to a given project,
  # and the failure looks like a missing resource until you read the code.
  forbidden:
    status: 403
    code: forbidden
    message: You do not have access to this resource.

fixtures:
  empty: {}

  small-workspace:
    user:
      - id: "1000000000000001"
        name: Ada Lovelace
        email: ada@example.com
    project:
      - id: "2000000000000001"
        name: Platform roadmap
        color: dark-blue
      - id: "2000000000000002"
        name: Archived experiments
        archived: true
    task:
      - id: "3000000000000001"
        name: Ship the conformance suite
        projects:
          - gid: "2000000000000001"
            name: Cauldron
            resource_type: project
        completed: false
        assignee_gid: "1000000000000001"
      - id: "3000000000000002"
        name: Write the Asana Recipe
        projects:
          - gid: "2000000000000001"
            name: Cauldron
            resource_type: project
        # Completed, and still returned by a plain task list. A "remaining
        # work" count that does not filter on this is wrong from day one.
        completed: true
      - id: "3000000000000003"
        name: Review the format additions
        projects:
          - gid: "2000000000000001"
            name: Cauldron
            resource_type: project
        completed: false
        due_on: "2026-02-01"

# Conformance cases, read from Asana's REST API reference rather than observed
# against a live workspace. The verify report says so.
conformance:
  - name: deleting a task answers an empty data object, not an empty response
    # 200 with {"data": {}}. A client calling .json() to confirm the delete
    # succeeds against Asana and throws on a 204, so the difference between
    # an empty object and no body at all is the whole point of saying which
    # one this is.
    source: https://developers.asana.com/reference/deletetask
    fixture: small-workspace
    request:
      method: DELETE
      path: /api/1.0/tasks/3000000000000001
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      body:
        data: {}
      absent:
        - data.gid
        - errors

  - name: the identifier is gid, and there is no id anywhere
    source: https://developers.asana.com/reference/tasks
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/tasks/3000000000000001
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      body:
        data:
          gid: "3000000000000001"
          name: Ship the conformance suite
          resource_type: task
      # Code reading task.id finds nothing.
      absent:
        - data.id
        - gid

  - name: a single object is wrapped under data, like a collection
    source: https://developers.asana.com/reference/rest-api-reference
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/projects/2000000000000001
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      body:
        data:
          name: Platform roadmap
          resource_type: project
          archived: false
      # A client reading the body directly finds nothing, either way round.
      absent:
        - name
        - project

  - name: a completed task is in the list and the list will not say which
    # Both halves matter. The completed task is returned by a plain task
    # list, so a "remaining work" count that does not filter is wrong from
    # the first sprint -- and the listing does not carry completed, so the
    # filter cannot be written from what came back. Asking for it means
    # opt_fields, and code that reads task.completed off this response gets
    # undefined for every task rather than an error.
    #
    # This case used to assert completed: false and completed: true here.
    # Both passed, and Asana sends neither.
    source: https://developers.asana.com/reference/gettasks
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/tasks
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      body:
        # The gid survives the trim. A listing whose entries carry no
        # identifier is a listing nothing can be fetched from, and trimming
        # it away is a one-line mistake that no other case here would notice.
        data[1].gid: "3000000000000002"
        data[1].name: Write the Asana Recipe
      absent:
        - data[0].completed
        - data[1].completed
        - data[0].due_on
        - data[0].assignee
        - data[0].projects

  - name: the assignee is an object and the projects are a list
    # Asana sends neither as a flat gid. A task belongs to several projects,
    # so projects is an array, and the assignee is a compact object -- which
    # means task.assignee is truthy whether or not anybody is assigned, and
    # comparing it to a gid string never matches.
    #
    # The single task is where these appear at all: the listing above is
    # compact and carries neither.
    source: https://developers.asana.com/reference/gettask
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/tasks/3000000000000001
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      body:
        data.assignee.gid: "1000000000000001"
        data.projects[0].gid: "2000000000000001"
        data.projects[0].resource_type: project
      absent:
        - data.assignee_gid
        - data.project_gid

  - name: the paging cursor is nested under next_page
    source: https://developers.asana.com/reference/pagination
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/tasks
      query:
        limit: "2"
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 200
      matches:
        next_page.offset: '^[0-9]{16}$'
      # A client reading response.offset or response.next_cursor finds
      # nothing.
      absent:
        - offset
        - next_cursor
        - data[2]

  - name: identifiers are long numeric strings, not numbers
    source: https://developers.asana.com/reference/rest-api-reference
    fixture: empty
    request:
      method: POST
      path: /api/1.0/tasks
      headers:
        Authorization: Bearer cauldron/1234567890
      json:
        name: Created through the API
    expect:
      status: 201
      body:
        data:
          name: Created through the API
          completed: false
          resource_type: task
      matches:
        # Sixteen digits. Parsing a real gid as a number loses precision.
        data.gid: '^[1-9][0-9]{15}$'

  - name: failures are an array of messages
    source: https://developers.asana.com/reference/errors
    fixture: small-workspace
    request:
      method: GET
      path: /api/1.0/tasks/9999999999999999
      headers:
        Authorization: Bearer cauldron/1234567890
    expect:
      status: 404
      matches:
        errors[0].message: 'Not Found'
      absent:
        - error
        - message
        - data

  - name: a missing token is refused before any task is read
    source: https://developers.asana.com/docs/authentication
    request:
      method: GET
      path: /api/1.0/tasks
    expect:
      status: 401
      matches:
        errors[0].message: 'authentication is required'
