  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if per_page was read --
  # with the name ignored the whole collection comes back, because the
  # whole collection is two records. No third record is needed for that,
  # and none is invented.
  - name: "per_page is read, because a page of one out of two is not the whole collection"
    source: "https://developer.wordpress.org/rest-api/reference/posts/"
    fixture: small-site
    request:
      method: GET
      path: "/wp-json/wp/v2/pages"
      query:
        "per_page": "1"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb24gYXBwIHBhc3Mgd29yZCBoZXJl"
    expect:
      status: 200
      body:
        "[0].id": 2
      absent:
        - "[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://developer.wordpress.org/rest-api/reference/posts/"
    fixture: small-site
    request:
      method: GET
      path: "/wp-json/wp/v2/pages"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb24gYXBwIHBhc3Mgd29yZCBoZXJl"
    expect:
      status: 200
      body:
        "[0].id": 9
      absent:
        - "[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://developer.wordpress.org/rest-api/reference/posts/"
    fixture: small-site
    request:
      method: GET
      path: "/wp-json/wp/v2/media"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb24gYXBwIHBhc3Mgd29yZCBoZXJl"
    expect:
      status: 200
      absent:
        - "[0]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if per_page was read.
  - name: "per_page is read, and a page of one is not the whole collection"
    source: "https://developer.wordpress.org/rest-api/reference/categories/"
    fixture: small-site
    request:
      method: GET
      path: "/wp-json/wp/v2/categories"
      query:
        "per_page": "1"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb24gYXBwIHBhc3Mgd29yZCBoZXJl"
    expect:
      status: 200
      body:
        "[0].slug": "cauldrons"
      absent:
        - "[1]"

  # And the position. page=2 answers a different record, which the size
  # alone cannot produce.
  - name: "page moves the page on, and what comes back is not page one"
    source: "https://developer.wordpress.org/rest-api/reference/categories/"
    fixture: small-site
    request:
      method: GET
      path: "/wp-json/wp/v2/categories"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb24gYXBwIHBhc3Mgd29yZCBoZXJl"
    expect:
      status: 200
      body:
        "[0].slug": "drafts-corner"
      absent:
        - "[1]"

  # The names. This Recipe declares 3 field(s) on a category that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a category carries the field names this Recipe declares"
