# NeverBounce Recipe for Cauldron
#
# NeverBounce's own result vocabulary sits between the other two email
# validators in this collection in size -- five values against Kickbox's
# four and ZeroBounce's seven (see kickbox/recipe.yaml and
# zerobounce/recipe.yaml) -- and it is the only one of the three whose own
# documentation defines "unknown" the same narrow way twice, in different
# words, and neither time as "ambiguous." The Result Codes table on
# developers.neverbounce.com/reference/single-check says plainly:
#
#   valid      - Verified as real address.
#   invalid    - Verified as not valid.
#   disposable - A temporary, disposable address.
#   catchall   - A domain wide-setting, also known as Accept-all (Unverifiable).
#   unknown    - The server cannot be reached.
#
# "The server cannot be reached" is a narrower, more mechanical claim than
# ZeroBounce's "we couldn't validate for one reason or another" or
# Kickbox's four separate reasons folded under one word (timeout,
# no_connect, unavailable_smtp, unexpected_error) -- NeverBounce's own
# words describe a single failure mode, a connection that did not succeed,
# not a category. Whether NeverBounce's real engine actually collapses
# every kind of "could not tell" into that one sentence, or the
# documentation is just terser than the other two providers' about it, is
# not something this Recipe can settle without a real key; it is recorded
# as what the documentation says, not extended into a claim about the
# implementation.
#
# **catchall is a first-class top-level result, the same shape as
# ZeroBounce's, and NeverBounce's own words for it borrow the word
# "Unverifiable" outright:** "A domain wide-setting, also known as
# Accept-all (Unverifiable)." That is this collection's central question
# answered in NeverBounce's own parenthetical -- a catch-all domain's
# result is not folded into valid with a footnote (Kickbox's accept_all
# flag does that, always landing on risky rather than a plain success; see
# kickbox/recipe.yaml) and not sorted between two different top-level
# words depending on how much history the provider has on the domain
# (ZeroBounce's accept_all-vs-catch-all split; see zerobounce/recipe.yaml).
# NeverBounce puts it in one place, always: its own fifth word, catchall,
# sitting beside valid and invalid rather than inside either.
#
# **flags is the second field, and it is a list, not a single reason --
# the widest secondary-information field of the three providers in this
# collection.** Twenty-six named flags are documented on the same
# reference page, and unlike Kickbox's reason (one value chosen from a
# fixed set) or ZeroBounce's sub_status (also one value), a single
# NeverBounce result can carry several of them at once: the "Address Info"
# worked example for support@neverbounce.com carries
# ["has_dns", "has_dns_mx", "role_account"] together on one valid result --
# a role-based address (support@) is not disqualifying on its own here the
# way it is one of ZeroBounce's do_not_mail sub-reasons, it is simply one
# more fact layered onto an otherwise-valid answer. free_email_host,
# government_host, academic_host, military_host, international_host,
# squatter_host, spamtrap_network, disposable_email and historical_response
# are documented but demonstrated in no worked example this Recipe could
# find; see Known fidelity gaps.
#
# **Two optional query parameters change the shape of the response, not
# just what it contains -- the same shift-in-shape idea Clover's and
# Asana's Recipes elsewhere in this collection record for an unrelated
# reason.** address_info=1 adds an address_info object (original_email,
# normalized_email, addr, alias, host, fqdn, domain, subdomain, tld) built
# by parsing the address rather than checking it; credits_info=1 adds a
# credits_info object instead. The OpenAPI schema on the same reference
# page declares these as a oneOf across three response shapes rather than
# one object with optional fields, and the field this collection's
# question is about -- whether a check costs a credit -- has exactly one
# citable data point: the credits_info worked example, for a result: valid
# call, shows paid_credits_used: 1, free_credits_used: 0. Nothing on this
# page or anywhere else this Recipe could find states whether an unknown
# or catchall result also consumes a credit, refunds one the way
# ZeroBounce's documentation says outright for its own unknown (see
# zerobounce/recipe.yaml), or costs something different again. This
# Recipe declares that gap rather than assuming symmetry with a provider
# that happens to answer the question.
#
# NeverBounce also publishes a help-centre page specifically about result
# codes (neverbounce.com/help/understanding-and-downloading-results/
# result-codes) that would very plausibly answer the credit-per-result-type
# question directly. It sits behind PerimeterX's bot-interstitial --
# checked live 2026-09-02, "Access to this page has been denied," a
# px-captcha challenge -- and this Recipe does not attempt to solve it, per
# the standing rule against solving CAPTCHAs. The gap above is recorded as
# genuinely unresolved rather than quietly filled from a page this Recipe
# was blocked from reading.
#
# **A Bearer Authorization header does NOT authenticate this endpoint,
# despite being a documented credential carrier on other APIs in this
# collection's email-validation trio.** Checked live against both
# api.neverbounce.com/v4/single/check and .../v4.2/single/check on
# 2026-09-02: "Authorization: Bearer junktoken12345", with no key query
# parameter at all, answered {"status":"auth_failure","message":
# "Invalid API key ''","execution_time":N} -- the identical body a request
# with no credential of any kind gets. The empty quotes inside the message
# are the tell: NeverBounce echoed back an empty string, meaning the
# Bearer header was never read as a credential at all, not that it was
# read and rejected. Every credential this Recipe could get NeverBounce to
# accept travelled as the query parameter key=; scheme: query is declared
# below on that finding, not on an assumption.
#
# **The wrong credential's own error message echoes back whatever value
# was sent, verbatim, inside single quotes -- and that is the one part of
# NeverBounce's behaviour this Recipe cannot serve faithfully.** Checked
# live: key=invalidkey123 answers message: "Invalid API key
# 'invalidkey123'"; a different wrong value would echo that value instead.
# Cauldron's errors table holds one static sentence per named failure, so
# auth.rejected_error below serves a fixed placeholder value inside the
# quotes rather than whatever a real caller actually sent -- stated here
# rather than silently claimed as a literal match for every possible wrong
# key.
#
# **Absent and empty collapse to one answer; the v4 and v4.2 API versions
# do not disagree about any of this.** key missing entirely and key=
# (empty string) both answered message: "Invalid API key ''" -- the same
# empty-quotes body -- checked live against both. /v4/single/check and
# /v4.2/single/check (the version the reference page's own OpenAPI
# description actually declares as the server) answered identically for
# every case this Recipe tried; the route below is declared at /v4/, the
# path NeverBounce's own widely-referenced base URL and most third-party
# client libraries use.
#
# **Routing beats the credential for an unrouted path, and a genuine 405
# reaches the application with no credential needed either -- unlike
# Kickbox, whose wrong-method answer is a 404 dressed as "not found," not a
# real 405 (see kickbox/recipe.yaml).** GET /v4/nosuchroute answered 404
# "File not found" (checked with no key and again with a wrong one, byte
# identical) and PUT /v4/single/check?email=...&key=... answered a genuine
# 405 -- {"status":"internal_failure","message":"Internal API Error.
# Please contact support for assistance."}, mislabelled: this is a routing
# failure, not an internal server error, and NeverBounce's own status
# vocabulary has no better word for "wrong method" than the one it uses
# for its own bugs. auth.after_routing: true reproduces both without an
# armed workaround: the case below sends no credential and still reaches
# each shape.
#
# **POST is accepted as a full alternate to GET on the same path,
# identically.** POST /v4/single/check?email=...&key=<wrong> answered the
# same 200 auth_failure body the GET form does -- not a routing failure,
# a genuine second method NeverBounce's own application handles the same
# way. Not modelled as a second route (Cauldron's routing does not need a
# second declaration to prove a method works when GET already does; this
# is stated here as a live finding rather than duplicated into a case).
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The exact wrong-credential value is not echoed in this Recipe's
#     served message -- see above.
#   - Whether unknown or catchall results consume, refund or partially
#     charge a credit is unestablished -- see above; the one citable
#     credits_info example is for a result: valid call only.
#   - Of twenty-six documented flags, four are demonstrated in a worked
#     example this Recipe found (has_dns, has_dns_mx, role_account,
#     smtp_connectable) and are declared; the remaining twenty-two are
#     documented on the same reference page and not declared, because no
#     worked JSON this Recipe could find shows any of them set.
#   - address_info and credits_info are declared as fields on the
#     resource, populated only in the fixtures/cases that specifically
#     demonstrate them, because the live API only includes either when the
#     matching query parameter is sent -- and no case here sends both at
#     once, because no worked example shows all three response shapes
#     merged into one.
#   - Bulk verification (the Jobs API: create, upload, status, callbacks)
#     is a separate, much larger documented surface and not touched here
#     at all.
#   - No 429 was ever triggered and no rate-limit figure is quoted,
#     because this Recipe found no page stating one for the single-check
#     endpoint specifically.
#
# No account was created and no real key was ever used. Every case below
# carrying a verified date was called against api.neverbounce.com with
# exactly the request shown; every case without one was read from
# developers.neverbounce.com and cited individually. Keys below are
# fixtures, not secrets.

recipe: neverbounce
capability: email
version: 0.1.0

upstream:
  api: v4.2
  docs: https://developers.neverbounce.com/reference/single-check
  spec: https://developers.neverbounce.com/reference/single-check.md

auth:
  scheme: query
  param: key
  keys:
    - cauldron_neverbounce_0000000000000000000000000000
  # Absent and empty both echo back an empty string inside the same
  # sentence -- see the header. One name covers both verdicts.
  absent_error: auth_failure
  rejected_error: auth_failure
  # Routing wins over the credential for both an unrouted path and a
  # genuine wrong-method 405 -- see the header. Verified live with no
  # credential sent for either.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  verification:
    id:
      # No identifier is echoed at all -- not even the address, unlike
      # both other Recipes in this trio. A caller correlates the response
      # with the request it made, not with anything in the body.
      style: opaque
      field: "-"
    fields:
      status:
        type: string
      result:
        type: string
      # A list, not a single reason string -- see the header's contrast
      # with Kickbox's reason and ZeroBounce's sub_status.
      flags:
        type: list
      suggested_correction:
        type: string
        default: ""
      execution_time:
        type: integer
      # Only present when address_info=1 was sent -- see Known fidelity
      # gaps. Nested one level under address_info on the wire via in:/as:,
      # the same mechanism Rootly's severity fields use elsewhere in this
      # collection.
      address_info_original_email:
        type: string
        null_when_unset: true
        in: address_info
        as: original_email
      address_info_normalized_email:
        type: string
        null_when_unset: true
        in: address_info
        as: normalized_email
      address_info_addr:
        type: string
        null_when_unset: true
        in: address_info
        as: addr
      address_info_alias:
        type: string
        null_when_unset: true
        in: address_info
        as: alias
      address_info_host:
        type: string
        null_when_unset: true
        in: address_info
        as: host
      address_info_fqdn:
        type: string
        null_when_unset: true
        in: address_info
        as: fqdn
      address_info_domain:
        type: string
        null_when_unset: true
        in: address_info
        as: domain
      address_info_subdomain:
        type: string
        null_when_unset: true
        in: address_info
        as: subdomain
      address_info_tld:
        type: string
        null_when_unset: true
        in: address_info
        as: tld
      # Only present when credits_info=1 was sent -- the one field this
      # collection's credits question has a citable answer for, and only
      # for a result: valid call. See the header.
      credits_info_paid_credits_used:
        type: integer
        null_when_unset: true
        in: credits_info
        as: paid_credits_used
      credits_info_free_credits_used:
        type: integer
        null_when_unset: true
        in: credits_info
        as: free_credits_used
      credits_info_paid_credits_remaining:
        type: integer
        null_when_unset: true
        in: credits_info
        as: paid_credits_remaining
      credits_info_free_credits_remaining:
        type: integer
        null_when_unset: true
        in: credits_info
        as: free_credits_remaining

routes:
  - method: GET
    path: /v4/single/check
    resource: verification
    operation: get
    id_from: query:email
    # No lookup_by and no not_found: this route always answers something
    # for a syntactically addressable request, the same structural shape
    # ZeroBounce's validate route has and Kickbox's verify route has --
    # none of the three providers in this trio ever says "not found" for
    # an email address itself.

errors:
  # What an absent, empty or wrong key all answer -- see the header for
  # why the echoed value inside the quotes is a placeholder here rather
  # than whatever a real caller actually sent.
  auth_failure:
    status: 200
    message: "Invalid API key ''"
    fields:
      status: auth_failure
      execution_time: 6

  # An unrecognised path -- checked live with no credential and again with
  # a wrong one, byte identical. Genuinely not JSON: text/html
  # Content-Type carrying fifteen bytes of plain text, not a document --
  # style: text serves the message verbatim rather than wrapping it.
  unknown_route:
    status: 404
    style: text
    message: File not found
    headers:
      Content-Type: "text/html; charset=UTF-8"

  # A real path, wrong method -- a genuine 405, mislabelled by
  # NeverBounce's own application as an internal error. See the header.
  method_not_allowed:
    status: 405
    fields:
      status: internal_failure
      message: Internal API Error. Please contact support for assistance.

fixtures:
  empty: {}

  # The plain Result Codes worked example on the reference page itself --
  # a valid address with two flags, no address_info or credits_info
  # requested.
  worked-example:
    verification:
      - id: seed-1
        status: success
        result: valid
        flags:
          - has_dns
          - has_dns_mx
        suggested_correction: ""
        execution_time: 499

  # The catchall result -- the central finding, from the same reference
  # page's Result Codes table.
  catchall:
    verification:
      - id: catchall@example.com
        status: success
        result: catchall
        flags:
          - has_dns
          - has_dns_mx
        suggested_correction: ""
        execution_time: 350

  # The Address Info worked example -- support@neverbounce.com, three
  # flags at once (including role_account), and the address breakdown
  # populated because address_info=1 was sent.
  address-info:
    verification:
      - id: support@neverbounce.com
        status: success
        result: valid
        flags:
          - has_dns
          - has_dns_mx
          - role_account
        suggested_correction: ""
        address_info_original_email: support@neverbounce.com
        address_info_normalized_email: support@neverbounce.com
        address_info_addr: support
        address_info_alias: ""
        address_info_host: neverbounce.com
        address_info_fqdn: neverbounce.com
        address_info_domain: neverbounce
        address_info_subdomain: ""
        address_info_tld: com
        execution_time: 399

  # The Credits Info worked example -- one credit used on a result: valid
  # call. See the header: this is the only citable number this Recipe
  # found for any result type.
  credits-info:
    verification:
      - id: support@neverbounce.com
        status: success
        result: valid
        flags:
          - smtp_connectable
          - has_dns
          - has_dns_mx
        suggested_correction: ""
        credits_info_paid_credits_used: 1
        credits_info_free_credits_used: 0
        credits_info_paid_credits_remaining: 9950778
        credits_info_free_credits_remaining: 0
        execution_time: 350

# Every case below carries source. A verified date means this Recipe
# called api.neverbounce.com with exactly the request shown and recorded
# exactly what came back; its absence means the case was read from
# developers.neverbounce.com and never called with a real key.
conformance:
  - name: no key at all answers an empty-quotes message inside a 200
    source: https://api.neverbounce.com/v4/single/check
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: GET
      path: /v4/single/check
      query:
        email: test@example.com
    expect:
      status: 200
      body:
        status: auth_failure
        message: "Invalid API key ''"
      absent:
        - result
        - flags

  - name: an empty key= answers the identical body
    source: https://api.neverbounce.com/v4/single/check
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: GET
      path: /v4/single/check
      query:
        email: test@example.com
        key: ""
    expect:
      status: 200
      body:
        status: auth_failure
        message: "Invalid API key ''"

  - name: a Bearer Authorization header is not read as a credential at all
    # The tell is the empty quotes -- see the header. This is the same
    # body an absent credential gets, not a rejected-Bearer-token body.
    source: https://api.neverbounce.com/v4/single/check
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: GET
      path: /v4/single/check
      query:
        email: test@example.com
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 200
      body:
        status: auth_failure
        message: "Invalid API key ''"

  - name: a wrong, non-empty key gets a 200 auth_failure too, not a 401 or 403
    source: https://api.neverbounce.com/v4/single/check
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: GET
      path: /v4/single/check
      query:
        email: test@example.com
        key: invalidkey123
    expect:
      status: 200
      body:
        status: auth_failure
      absent:
        - result

  - name: an unrouted path 404s with no credential needed at all
    source: https://api.neverbounce.com/v4/nosuchroute
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: GET
      path: /v4/nosuchroute-xyz
    expect:
      status: 404
      body_matches: "File not found"

  - name: a wrong method on the real path is a genuine 405, mislabelled internal_failure, still with no credential
    source: https://api.neverbounce.com/v4/single/check
    verified: "2026-09-02"
    fixture: worked-example
    request:
      method: PUT
      path: /v4/single/check
      query:
        email: test@example.com
    expect:
      status: 405
      body:
        status: internal_failure
        message: Internal API Error. Please contact support for assistance.

  - name: catchall is its own top-level result, described in NeverBounce's own words as Unverifiable
    # The central finding -- see the header.
    source: https://developers.neverbounce.com/reference/single-check
    fixture: catchall
    request:
      method: GET
      path: /v4/single/check
      query:
        email: catchall@example.com
        key: cauldron_neverbounce_0000000000000000000000000000
    expect:
      status: 200
      body:
        status: success
        result: catchall
      absent:
        - accept_all
        - catch_all
        - sub_status

  - name: a role-based address carries three flags at once on an otherwise-valid result
    # flags is a list, not a single reason -- see the header's contrast
    # with Kickbox's reason and ZeroBounce's sub_status, neither of which
    # can hold more than one value.
    source: https://developers.neverbounce.com/reference/single-check
    fixture: address-info
    request:
      method: GET
      path: /v4/single/check
      query:
        email: support@neverbounce.com
        address_info: "1"
        key: cauldron_neverbounce_0000000000000000000000000000
    expect:
      status: 200
      body:
        result: valid
        "flags[0]": has_dns
        "flags[2]": role_account
        address_info.addr: support
        address_info.domain: neverbounce
        address_info.tld: com

  - name: credits_info shows one credit used, and only for a valid result
    # The one citable number this collection's credits question has for
    # NeverBounce -- see the header for what remains unestablished
    # (unknown and catchall results).
    source: https://developers.neverbounce.com/reference/single-check
    fixture: credits-info
    request:
      method: GET
      path: /v4/single/check
      query:
        email: support@neverbounce.com
        credits_info: "1"
        key: cauldron_neverbounce_0000000000000000000000000000
    expect:
      status: 200
      body:
        result: valid
        credits_info.paid_credits_used: 1
        credits_info.free_credits_used: 0
        credits_info.paid_credits_remaining: 9950778
