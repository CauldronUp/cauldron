# Northflank Recipe for Cauldron
#
# One create response carries three different opinions about whether it is
# done, and none of them is a poll-able resource's own field the way Render's
# or Temporal's neighbours in this collection are.
#
# POST .../services/{serviceId}/build answers 200 -- not 201 -- with
# {"data": {id, branch, pullRequestId, sha, registry: {uri}, createdAt,
# status, concluded}}, quoted from Northflank's own published OpenAPI
# description (id example "joyous-view-6290", status example "PENDING").
# concluded is real, present from the first response onward, and answers
# exactly one question -- "has this stopped moving" -- with nothing about
# whether it stopped moving well. That second question needs a second field,
# and GET .../build/{buildId} is where it lives: the same object, plus
# success (a boolean the create response never carries at all) and message
# ("Image successfully built" on the description's own worked example) and
# buildConcludedAt. So a client that creates a build and reads success off
# the response it just got reads a field that is not there -- not false, not
# null, absent -- and a client that reads concluded alone cannot tell a build
# that finished from one that is still running, only whether it has stopped.
# Three fields, three different questions, and only a second GET answers all
# three: status, whose enum -- QUEUED, PENDING, UNSCHEDULABLE, STARTING,
# CLONING, BUILDING, UPLOADING, ABORTED, FAILURE, SUBMISSION_FAILURE,
# SUCCESS, CRASHED, IN_PROGRESS, thirteen values, all from the same
# description -- names which of five failure shapes (ABORTED, FAILURE,
# SUBMISSION_FAILURE, CRASHED, and a SUCCESS that is not a failure at all)
# the build settled into; concluded, which only says whether it settled;
# and success, which is the one field that actually answers "did it work" --
# and describes builds only. A build that FAILUREs is still a 200 on this
# same GET, the same shape as one that SUCCEEDs, and the http status never
# carries the news at all.
#
# PandaDoc's Recipe in this collection is the closest sibling to this shape,
# not the identical one. Its create and its poll answer with the same
# resource under the same field names, and the only difference between the
# unfinished answer and the finished one is the value of the one field
# PandaDoc's own prose names as the thing to watch. Northflank's create is
# the same trade with a second field added: concluded moves independently
# of status, so a client has one boolean that only ever answers "has this
# stopped" and one enum that answers everything else, where PandaDoc gives
# a single field for both questions at once. Sumologic's Recipe in this
# collection is the shape neither of them is: its create answers with an id
# and a link addressing the poll endpoint and nothing that could be mistaken
# for the record itself, where Northflank's create is unmistakably the
# record, just an incomplete one.
#
# createdAt is an ISO-8601 string ("2021-07-28T15:55:38.296Z") and
# buildConcludedAt, on the identical object, is a bare Unix-seconds number
# (1606237973) -- both timestamps, two representations, on two fields of one
# record, per the same worked example.
#
# A finished build is not a finished deploy. Northflank's own separate
# rollout history -- GET .../services/{serviceId}/deployments, "Lists the
# deployments of the given service, newest first" -- answers an array whose
# entries carry active (a boolean: "Whether the deployment is currently
# serving traffic") and name, which is explicitly documented as
# "null until the first pod of the deployment has been observed", and
# nothing else that reads as a status. No status field, no enum, no
# concluded, no success -- the shape Turso's Recipe in this collection
# already found for a created-but-unpollable record, arrived at
# independently, on a resource that is not even the one the create call
# above returns from. And correlating the two -- which build produced which
# deployment -- has no pointer either: a deployment entry carries
# commit.sha (the git commit an image was built from) and image.sha (the
# pushed image's digest), and a build carries its own sha (the same git
# commit) -- so matching a build to the deployment it produced means
# matching two records that both happen to carry a field spelled "sha",
# neither of which names the other's id.
#
# Checked live, with no account and no key, against api.northflank.com on
# the date below:
#
#   no Authorization header at all      -> 401 {"error":{"status":401,
#                                           "message":"Unauthorized"}}
#   Authorization: Bearer junkjunkjunk  -> the byte-identical 401
#   GET  /v1/this-is-not-a-real-path    -> 404 JSON, no credential needed
#   PATCH /v1/projects (real path)      -> 405 text/plain "Method Not
#                                           Allowed", Allow: HEAD, GET,
#                                           POST, PUT -- a different
#                                           Content-Type than every other
#                                           failure on this host, and the
#                                           only one that is not JSON
#   POST .../build, no body, no auth    -> 400, not 401 -- see below
#   POST .../build, a body, no auth     -> 401, the ordinary sentence
#
# Missing and wrong collapse to one sentence, byte for byte -- the collapse
# Render's and Temporal Cloud's Recipes in this collection also find, on
# providers otherwise nothing alike. Routing runs before authentication
# without exception on the two shallow probes above: an unrouted path 404s
# and a wrong method 405s, credential present or not, matching Fireworks'
# Recipe in this collection rather than Together's neighbour.
#
# The nested build-creation route disagrees with that ordering on its own,
# and this is the sharpest single finding in this Recipe. POST
# .../services/{serviceId}/build with no credential and no request body
# answers 400, Northflank's own payload-validation failure --
# {"error":{"status":400,"message":"Request failed payload validation - see
# details.","id":"nf-invalid-request-body","details":{"object":["\"value\"
# is required. Received \"undefined\""]}}} -- and never mentions
# authentication at all. Attach any body that satisfies the shape check --
# this Recipe sent {"branch":"main"}, still with no credential -- and the
# answer reverts to the ordinary 401. Struck at the shallow, unscoped
# POST /v1/projects with the identical absence of both credential and body,
# the order is the opposite: 401 immediately, body never examined. So this
# host has (at least) two different pipelines, credential-first on a
# collection route and validation-first on a nested create action, and which
# one a given path runs is not something either request alone predicts.
# That is a sixth arrangement beside the five auth.go already names for
# Census, Rootly, NocoDB, Baserow and the boolean itself: here the split
# runs along how deep the route sits and what it is trying to create, not
# along method or path-existence. Cauldron's own after_routing is a
# Recipe-wide flag and has no way to make one route check its body before
# its credential while a shallower route does the reverse, so the shallow
# behaviour is what auth.after_routing expresses here, and the nested
# route's no-credential-no-body case is reached only by arming it -- the
# device Bunny's and Rootly's Recipes in this collection use for a second
# failure pipeline routing alone cannot select between.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API token was ever requested,
#     guessed or used. Every 200 below is drafted from
#     api.northflank.com/v1/swagger-json (an OpenAPI 3 description, fetched
#     directly), not observed, and carries no `verified:` date. The 401s,
#     the 404, the 405 and the armed 400 are struck live, unauthenticated,
#     and carry one.
#   - pullRequestId is real and not modelled: the description types it
#     anyOf string or integer, nullable, and this format's fields are
#     single-typed.
#   - Pagination on the deployments listing is real and only half modelled.
#     per_page (default 50, maximum 100), page and cursor are all accepted
#     query parameters per the description, and the response body echoes
#     none of them back -- no next cursor, no total, no has-more flag of any
#     kind. This Recipe pages by per_page/page, the two the description
#     gives a stated default and maximum for, and does not model cursor,
#     which the description gives no default or interaction rule for
#     alongside the other two.
#   - releaseType's own description is worth having verbatim rather than
#     summarised: "Release type tracks the current role rather than how the
#     deployment was created, so promoting a canary moves it out of the
#     `canary` results and into `stable`." Filtering by it is modelled;
#     promoting a canary is not a route this Recipe has fixtures to move.
#   - This host answers the identical project/service/build surface at two
#     different path prefixes -- /v1/projects/{projectId}/... and
#     /v1/teams/{teamId}/projects/{projectId}/... -- per the description.
#     Only the first is modelled. Whether the two are the same underlying
#     data reached two ways, or genuinely separate scopes, is not
#     established by anything this task's probing could reach.
#   - GET .../build (no id -- "the current build") is a real, separate path
#     from GET .../build/{buildId} and is not modelled: the description
#     gives it the identical response shape, and a second route would
#     repeat the same finding rather than add one.
#   - Projects, jobs, addons, pipelines, secrets, volumes, teams and the
#     rollout-promotion and rollback actions are all real, documented
#     surface and none of it is modelled. This Recipe is about the one
#     mechanism its group exists to find: what a create answers, and the
#     state machine behind the id it names.

recipe: northflank
capability: hosting
version: 0.1.0

upstream:
  api: v1
  docs: https://northflank.com/docs/v1/api/introduction
  spec: https://api.northflank.com/v1/swagger-json
  spec_hash: 0d8c30d8f59abf22ef05e79333e99123bb49baa82a7e60752b8104e3d9f628aa
  spec_seen: "2026-09-01"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-northflank-fixture-token-0000000000000000
  # Missing and wrong collapse to the identical sentence, checked live -- see
  # the header. Left unset rather than pointed at the same name twice, which
  # is the honest default this format falls back to on its own.
  #
  # Routing (and, on the two shallow paths this Recipe struck, method
  # matching) runs before the credential is examined at all. The nested
  # build-create route disagrees with its own recipe-wide flag -- see the
  # header for why that split is armed rather than forced into this boolean.
  after_routing: true

responses:
  # {"data": {...}} on every route this Recipe declares -- the single
  # envelope this host wraps both a lone record and a named collection
  # inside, one level apart. See the list override below for the collection
  # case.
  resource:
    style: wrapped
    key: data
  list:
    style: wrapped
    key: data.deployments
  # {"error": {"status": ..., "message": ...}}, checked live. No code, no
  # type, on the ordinary failures; the armed payload-validation failure
  # below adds two more fields inside the same wrapper via its own
  # declaration rather than a Recipe-wide one, because only that one failure
  # carries them.
  error:
    style: nested
    message_field: message
    status_field: status
    code_field: "-"
    type_field: "-"

resources:
  build:
    collection: builds
    id:
      style: opaque
    fields:
      # The partition. Neither id ever appears in a build's own body on the
      # live description -- both live only in the path.
      projectId:
        type: string
        in: "-"
      serviceId:
        type: string
        in: "-"
      branch:
        type: string
      sha:
        type: string
      registry_uri:
        type: string
        in: registry
        as: uri
        null_when_unset: true
      createdAt:
        type: datetime
      # QUEUED, PENDING, UNSCHEDULABLE, STARTING, CLONING, BUILDING,
      # UPLOADING, ABORTED, FAILURE, SUBMISSION_FAILURE, SUCCESS, CRASHED or
      # IN_PROGRESS. The create response's own worked example sits at
      # PENDING -- see the header.
      status:
        type: string
        default: PENDING
      # Whether the build has stopped moving. Present from the first
      # response onward and answers nothing about whether it stopped moving
      # well -- see the header.
      concluded:
        type: boolean
        default: false
      # Whether it stopped moving well. Not on the create response at
      # all -- trimmed by returns: below -- and only meaningful once
      # concluded is true.
      success:
        type: boolean
        null_when_unset: true
      message:
        type: string
        null_when_unset: true
      # A bare Unix-seconds number on the same record whose createdAt is an
      # ISO-8601 string. See the header.
      buildConcludedAt:
        type: timestamp
        null_when_unset: true

  # No id.style addressing this by itself -- see the header. Listed only,
  # newest first per the description's own words, under its owning service.
  # collection is left undeclared on purpose: this resource's list route
  # nests two levels down, under the recipe-wide data wrapper and then under
  # its own name, and a declared collection would take over that placement
  # and silently drop the outer data wrapper the live envelope actually
  # sends -- see responses.list.key below.
  deployment:
    id:
      style: opaque
    fields:
      projectId:
        type: string
        in: "-"
      serviceId:
        type: string
        in: "-"
      # "Null until the first pod of the deployment has been observed" --
      # the description's own words, and the only readiness signal this
      # record carries besides active. See the header.
      name:
        type: string
        null_when_unset: true
      createdAt:
        type: datetime
      # "Whether the deployment is currently serving traffic. During a
      # gradual rollout both the stable and the canary deployment are
      # active." Not a status -- the record's only other readiness signal,
      # and the only field on it at all that is a plain boolean.
      active:
        type: boolean
        default: false
      # stable or canary. Absent for a service with no gradual rollout
      # strategy -- see the header for what mutating this field means.
      releaseType:
        type: string
        null_when_unset: true
      image_sha:
        type: string
        in: image
        as: sha
        null_when_unset: true
      # The same commit a build's own `sha` names -- see the header for why
      # that is the only thing that lets the two resources be correlated at
      # all.
      commit_sha:
        type: string
        in: commit
        as: sha
        null_when_unset: true
      commit_message:
        type: string
        in: commit
        as: message
        null_when_unset: true
      instances:
        type: number
        null_when_unset: true
      reason_id:
        type: string
        in: reason
        as: id
        null_when_unset: true

routes:
  # Never a 201, and never the fields a second GET adds -- see the header.
  - method: POST
    path: /v1/projects/{projectId}/services/{serviceId}/build
    resource: build
    operation: create
    scope: [projectId, serviceId]
    status: 200
    returns: [id, branch, sha, registry_uri, createdAt, status, concluded]

  - method: GET
    path: /v1/projects/{projectId}/services/{serviceId}/build/{id}
    resource: build
    operation: get
    scope: [projectId, serviceId]

  - method: GET
    path: /v1/projects/{projectId}/services/{serviceId}/deployments
    resource: deployment
    operation: list
    scope: [projectId, serviceId]
    filters:
      - param: releaseType
        field: releaseType
    pagination:
      style: page
      limit: 50
      max_limit: 100
      limit_param: per_page
      cursor_param: page
      first_page: 1

  # A shallow, unscoped path with no resource of its own modelled -- see the
  # header. Declared purely to carry the plain credential-collapse and
  # routing-order findings this Recipe struck against it directly, and the
  # wrong-method probe beside it.
  # A shallow, unscoped path with no resource of its own modelled -- see the
  # header. Declared purely to carry the plain credential-collapse finding
  # this Recipe struck against it directly. PATCH and DELETE on this same
  # path are not declared: Cauldron's own built-in method_not_allowed
  # fallback answers them, automatically and before the credential is
  # checked, because after_routing is set and only GET is a declared method
  # here -- the same reason unknown_route below needs no route of its own
  # either.
  - method: GET
    path: /v1/projects
    error: authentication_error

errors:
  authentication_error:
    status: 401
    message: Unauthorized

  unknown_route:
    status: 404
    message: "Not found. The requested route does not exist"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # text/plain, empty otherwise -- checked live. The only failure on this
  # host that is not the JSON envelope every other route uses, and the only
  # one with no body at all beyond the six words below.
  method_not_allowed:
    status: 405
    style: text
    message: "Method Not Allowed"
    headers:
      Allow: "HEAD, GET, POST, PUT"

  # Reached only by arming it -- the live failure this reproduces needs a
  # request with no body at all on the nested build route specifically, and
  # Cauldron's own credential check has no way to defer to a body-shape
  # check on one route while running first on every other -- see the
  # header. Quoted verbatim, including the malformed-looking escaped quotes
  # inside details.object, which is how the live host actually sent it.
  missing_body:
    status: 400
    message: "Request failed payload validation - see details."
    # Dotted, so these two land inside the same "error" wrapper the status
    # and message above do -- a bare "id"/"details" would instead sit beside
    # it, one level too shallow for what the live host actually sent.
    fields:
      error.id: nf-invalid-request-body
      error.details.object:
        - "\"value\" is required. Received \"undefined\""

fixtures:
  empty: {}

  one-service:
    build:
      # What the create route above leaves behind -- PENDING, freshly
      # started, nothing about whether it will work.
      - id: joyous-view-6290
        projectId: cauldron-fixture-project
        serviceId: cauldron-fixture-service
        branch: main
        sha: 12c15e7ee25fd78f567ebf87f9178b8ad70025b3
        createdAt: "2021-07-28T15:55:38.296Z"
        status: PENDING
        concluded: false

      # Finished, and successful -- every field the create response above
      # trims back in. Values quoted from the description's own worked
      # example for GET .../build/{buildId}.
      - id: silent-forest-1148
        projectId: cauldron-fixture-project
        serviceId: cauldron-fixture-service
        branch: main
        sha: 12c15e7ee25fd78f567ebf87f9178b8ad70025b3
        createdAt: "2021-07-28T15:40:02.100Z"
        status: SUCCESS
        concluded: true
        success: true
        message: Image successfully built
        buildConcludedAt: 1606237973

      # Finished, and not successful -- concluded is true on both this
      # record and the one above, and only success tells them apart. No
      # message is cited anywhere in the description for this state, so
      # none is invented here -- see the header's rule on empty fixtures.
      - id: quiet-harbor-3302
        projectId: cauldron-fixture-project
        serviceId: cauldron-fixture-service
        branch: main
        sha: e83a105f2c471d9b6e8a0c3f7d5b291a4e6c8f70
        createdAt: "2026-06-30T04:00:03.000Z"
        status: FAILURE
        concluded: true
        success: false

    deployment:
      # Settled: a pod has been observed, the name is no longer null, and
      # it is serving traffic. Field values quoted from the description's
      # own worked example for the deployments listing.
      - id: "6560a1b2c3d4e5f6a7b8c9d0"
        projectId: cauldron-fixture-project
        serviceId: cauldron-fixture-service
        name: example-service-7d9f8b6c5d
        createdAt: "2024-01-15T10:30:00.000Z"
        active: true
        releaseType: canary
        image_sha: "sha256:9c8f8d"
        commit_sha: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        commit_message: "fix: handle empty payload"
        instances: 2
        reason_id: service-updated

      # Not settled: per the description's own words, name stays null until
      # a pod is observed, and this Recipe reads active as false here for
      # the same reason -- nothing can be serving traffic for a deployment
      # whose first pod has not yet been seen. That inference is this
      # Recipe's own, not a second worked example; no other field on this
      # record is cited from anywhere.
      - id: "6560a1b2c3d4e5f6a7b8c9e1"
        projectId: cauldron-fixture-project
        serviceId: cauldron-fixture-service
        name: null
        createdAt: "2026-08-30T14:02:00.000Z"
        active: false

conformance:
  - name: no credential at all is one flat sentence
    source: https://api.northflank.com/v1/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/projects
    expect:
      status: 401
      body:
        error.status: 401
        error.message: Unauthorized

  - name: and a junk bearer token collapses into the byte-identical answer
    source: https://api.northflank.com/v1/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: Bearer junkjunkjunk12345
    expect:
      status: 401
      body:
        error.status: 401
        error.message: Unauthorized

  - name: an unrouted path 404s in JSON, no credential needed
    source: https://api.northflank.com/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: application/json; charset=utf-8
      body:
        error.message: "Not found. The requested route does not exist"

  - name: the same unrouted path with a credential attached answers identically
    source: https://api.northflank.com/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
      headers:
        Authorization: Bearer junkjunkjunk12345
    expect:
      status: 404
      body:
        error.message: "Not found. The requested route does not exist"

  - name: a wrong method on a real path is a real 405, with Allow, and it is not JSON
    source: https://api.northflank.com/v1/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/projects
    expect:
      status: 405
      headers:
        content-type: text/plain; charset=utf-8
        allow: "HEAD, GET, POST, PUT"
      body_matches: "^Method Not Allowed$"

  - name: a credential does not change the 405 either
    source: https://api.northflank.com/v1/projects
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v1/projects
      headers:
        Authorization: Bearer junkjunkjunk12345
    expect:
      status: 405
      headers:
        allow: "HEAD, GET, POST, PUT"

  - name: the nested build route checks the body before it checks who is asking
    # Live: no Authorization header, no request body at all, against a
    # project and service that do not exist either -- and the answer is
    # about the payload, not the credential and not the missing project.
    # See the header for why this is armed rather than reached by routing.
    source: https://api.northflank.com/v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build
    verified: "2026-09-01"
    arm: missing_body
    fixture: empty
    request:
      method: POST
      path: /v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build
    expect:
      status: 400
      body:
        error.status: 400
        error.message: "Request failed payload validation - see details."
        error.id: nf-invalid-request-body

  - name: the identical request with a body attached reverts to the ordinary credential check
    source: https://api.northflank.com/v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build
      json:
        branch: main
    expect:
      status: 401
      body:
        error.message: Unauthorized

  - name: creating a build answers a status and a concluded flag and nothing about whether it succeeded
    source: https://api.northflank.com/v1/swagger-json
    fixture: empty
    request:
      method: POST
      path: /v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build
      headers:
        Authorization: Bearer cauldron-northflank-fixture-token-0000000000000000
      json:
        branch: main
    expect:
      status: 200
      body:
        data.status: PENDING
        data.concluded: false
      absent:
        - data.success
        - data.message
        - data.buildConcludedAt

  - name: polling the finished build shows the field the create response never carried
    source: https://api.northflank.com/v1/swagger-json
    fixture: one-service
    request:
      method: GET
      path: /v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build/silent-forest-1148
      headers:
        Authorization: Bearer cauldron-northflank-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        data.status: SUCCESS
        data.concluded: true
        data.success: true
        data.message: Image successfully built
        data.buildConcludedAt: 1606237973

  - name: a failed build is concluded too, and only success tells the two states apart
    source: https://api.northflank.com/v1/swagger-json
    fixture: one-service
    request:
      method: GET
      path: /v1/projects/cauldron-fixture-project/services/cauldron-fixture-service/build/quiet-harbor-3302
      headers:
        Authorization: Bearer cauldron-northflank-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        data.status: FAILURE
        data.concluded: true
        data.success: false

  - name: the deployment history has no status field at all, only a boolean and a name that starts null
    source: https://api.northflank.com/v1/swagger-json
