# ClickUp Recipe for Cauldron
#
# ClickUp has no sandbox. A personal token reaches a real workspace, and a test
# that creates tasks creates them where people can see them, notifies watchers
# and counts against the plan. Deleting a task moves it to the trash rather
# than removing it, so a suite that creates and deletes leaves a growing pile
# somebody has to empty by hand.
#
# Two things worth modelling exactly:
#
#   1. A task's status is an object, not a string. It carries the name, the
#      colour and a type, and the type is what says whether the status counts
#      as done. Code that compares task.status to "complete" compares an
#      object to a string and is false forever.
#   2. The error shape is its own thing: "err" carries the prose and "ECODE"
#      a machine-readable code. Nothing is called message or error, so code
#      written for any other provider finds nothing at all.
#
# Tokens below are fixtures, not secrets.

recipe: clickup
capability: issues
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.clickup.com/reference

auth:
  # A personal token is sent raw, with no scheme in front of it.
  scheme: header
  header: Authorization
  keys:
    - pk_cauldron_00000000

responses:
  list:
    style: wrapped
  error:
    style: flat
    message_field: err
    code_field: ECODE

resources:
  task:
    collection: tasks
    id:
      style: opaque
      length: 9
    fields:
      list_id:
        type: string
      name:
        type: string
        required: true
      description:
        type: string
      # The status is an object. Comparing task.status to a string compares
      # an object to a string and is false forever.
      status:
        type: string
        default: open
        in: status
        # Explicit, because status.status looks like a mistake and is not:
        # ClickUp really does send a status object with a status inside it.
        as: status
      color:
        type: string
        default: "#d3d3d3"
        in: status
      # "closed" or "done" here is what actually means finished, not the
      # status name, which a workspace admin can rename to anything.
      type:
        type: string
        default: open
        in: status
      priority:
        type: string
      # ClickUp sends timestamps as Unix milliseconds in a string, which is
      # two conversions away from a date -- and this sent the number, which is
      # nought conversions away and works.
      #
      # new Date(task.date_created) is a valid date for a number and Invalid
      # Date for a string of the same digits, so the fake made the parse
      # succeed where ClickUp makes it fail. Arithmetic on it concatenates
      # for the same reason.
      date_created:
        type: timestamp_ms_string
      date_closed:
        type: timestamp_ms_string
        stamped: false
      archived:
        type: boolean
        default: false

  list:
    collection: lists
    id:
      style: opaque
      length: 9
    fields:
      folder_id:
        type: string
      name:
        type: string
        required: true
      # A list counts only unarchived tasks here, so a total that disagrees
      # with the task list is not a bug.
      task_count:
        type: integer
        default: 0
      archived:
        type: boolean
        default: false

  space:
    collection: spaces
    id:
      style: opaque
      length: 9
    fields:
      name:
        type: string
        required: true
      private:
        type: boolean
        default: false
      # A space with multiple assignees disabled silently drops all but the
      # first assignee on any task written to it.
      multiple_assignees:
        type: boolean
        default: true
      archived:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/v2/list/{list_id}/task
    resource: task
    operation: list
    scope: [list_id]
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 100

  - method: POST
    path: /api/v2/list/{list_id}/task
    resource: task
    operation: create
    emits: taskCreated
    scope: [list_id]

  - method: GET
    path: /api/v2/task/{id}
    resource: task
    operation: get

  - method: PUT
    path: /api/v2/task/{id}
    resource: task
    operation: update
    # taskUpdated. taskStatusUpdated is beside it and is narrower -- a status
    # change is one kind of update, not the general one, so it hangs off the
    # field rather than off the write.
    emits: taskUpdated
    emits_when:
      - event: taskStatusUpdated
        field: status

  - method: DELETE
    path: /api/v2/task/{id}
    resource: task
    operation: delete
    emits: taskDeleted

  - method: GET
    path: /api/v2/folder/{folder_id}/list
    resource: list
    operation: list
    scope: [folder_id]
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 100

  - method: GET
    path: /api/v2/team/{team_id}/space
    resource: space
    operation: list
    pagination:
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 100

webhooks:
  events:
    - taskCreated
    - taskUpdated
    - taskDeleted
    - taskStatusUpdated
    - listCreated
  # ClickUp does not send the task. A delivery carries the event, the id of
  # the thing that changed, and a history_items array describing the change --
  # and nothing else. An application has to fetch the task to know anything
  # about it, the same bargain Mollie makes.
  #
  # history_items is deliberately not declared. Its contents depend on what
  # changed (a status move carries before and after status objects, an
  # assignment carries users) and a payload template cannot compute that. A
  # fixed literal would be inventing a shape rather than modelling one, so
  # what is here is what is true for every delivery, and the array's absence
  # is a stated gap rather than a claim that ClickUp omits it.
  payload:
    event: "{event}"
    task_id: "{record_id}"
    webhook_id: whk_cauldron00000001
  signing:
    scheme: hmac-sha256
    header: X-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: RATE_001
    message: Rate limit reached
    headers:
      Retry-After: "60"
      X-RateLimit-Remaining: "0"

  authentication_error:
    status: 401
    code: OAUTH_019
    message: Token invalid

  resource_missing:
    status: 404
    code: OAUTH_027
    message: "Resource not found: {detail}"

  parameter_missing:
    status: 400
    code: INPUT_005
    message: "{detail} is required"

  # ClickUp refuses a status that is not configured on the list, which is what
  # breaks an import the moment somebody renames a column.
  status_not_found:
    status: 400
    code: CAT_001
    message: Status not found on this list

  # The plan wall. A workspace over its task limit refuses writes while reads
  # keep working.
  plan_limit_reached:
    status: 403
    code: TEAM_110
    message: The workspace has reached its plan limit

fixtures:
  empty: {}

  small-workspace:
    space:
      - id: spc000001
        name: Engineering
        private: false
        multiple_assignees: true
      - id: spc000002
        name: Solo work
        # Silently drops all but the first assignee on any task written here.
        multiple_assignees: false
    list:
      - id: lst000001
        folder_id: fld000001
        name: Sprint
        task_count: 2
    task:
      - id: tsk000001
        list_id: lst000001
        name: Ship the conformance suite
        status: in progress
        color: "#4194f6"
        # Not done, whatever the status is called.
        type: custom
      - id: tsk000002
        list_id: lst000001
        name: Write the ClickUp Recipe
        # A workspace admin renamed the done column. The name says nothing;
        # the type is what counts.
        status: shipped
        color: "#6bc950"
        type: closed
        date_closed: "1767225600000"
      - id: tsk000003
        list_id: lst000001
        name: Archived, still returned by id
        status: open
        type: open
        archived: true

# Conformance cases, read from ClickUp's API reference rather than observed
# against a live workspace. The verify report says so.
conformance:
  - name: a task status is an object, not a string
    source: https://developer.clickup.com/reference/gettask
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/task/tsk000001
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 200
      body:
        # Comparing task.status to "complete" compares an object to a string
        # and is false forever.
        status:
          status: in progress
          color: "#4194f6"
          type: custom
        name: Ship the conformance suite

  - name: the status type says done, not the status name
    source: https://developer.clickup.com/reference/gettask
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/task/tsk000002
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 200
      body:
        status:
          # An admin renamed the done column to "shipped". Matching on the
          # name breaks the moment somebody edits it; the type does not.
          status: shipped
          type: closed

  - name: an open task has no closed date
    source: https://developer.clickup.com/reference/gettask
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/task/tsk000001
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 200
      body:
        archived: false
      absent:
        - date_closed

  - name: timestamps are milliseconds, written as text
    # Both halves. Thirteen digits, so treating them as seconds lands in
    # 1970 -- and quoted, so new Date() of one is Invalid Date rather than a
    # date thirteen digits later.
    #
    # The regex below could not tell the two apart: ^[0-9]{13}$ matches the
    # number and the string equally, so the case passed while the Recipe sent
    # a number ClickUp does not send. The quoted literal is what distinguishes
    # them.
    source: https://developer.clickup.com/reference/gettask
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/task/tsk000002
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 200
      body:
        # Both quoted, and date_created is the one that proves it: it comes
        # from the sandbox clock rather than the fixture, so its type is the
        # Recipe's answer and not the fixture's.
        date_closed: "1767225600000"
        date_created: "1767225600000"
      matches:
        # Thirteen digits. Treating these as seconds lands in 1970.
        date_created: '^[0-9]{13}$'

  - name: the error uses err and ECODE, not message
    source: https://developer.clickup.com/docs/errors
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/task/doesnotex
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 404
      body:
        ECODE: OAUTH_027
      matches:
        err: 'Resource not found'
      # Nothing is called message or error, so code written for any other
      # provider finds nothing at all.
      absent:
        - message
        - error
        - errors

  - name: the token is sent raw, with no scheme
    source: https://developer.clickup.com/reference/authentication
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/list/lst000001/task
      headers:
        Authorization: Bearer pk_cauldron_00000000
    expect:
      # Adding Bearer breaks it, which is the opposite of what everybody
      # expects and worth being able to reproduce.
      status: 401
      body:
        ECODE: OAUTH_019

  - name: a space can silently drop extra assignees
    source: https://developer.clickup.com/reference/getspaces
    fixture: small-workspace
    request:
      method: GET
      path: /api/v2/team/team01/space
      headers:
        Authorization: pk_cauldron_00000000
    expect:
      status: 200
      body:
        spaces[0].multiple_assignees: true
        # Any task written to this space keeps only the first assignee, and
        # nothing in the response says so.
        spaces[1].multiple_assignees: false

  - name: moving a status announces the narrower event as well as the general one
    source: https://clickup.com/api/developer-portal/webhooks/
    fixture: small-workspace
    request:
      method: PUT
      path: /api/v2/task/tsk000001
      headers:
        Authorization: pk_cauldron_00000000
      json:
        status: review
    expect:
      status: 200
      webhook:
        event: taskStatusUpdated
        body:
          # The id and nothing about the task. Reading the new status off the
          # delivery is not possible against ClickUp and is not possible here.
          task_id: tsk000001
        absent:
          - data
          - data.object
          - status

  - name: renaming a task is not a status change
    source: https://clickup.com/api/developer-portal/webhooks/
    fixture: small-workspace
    request:
      method: PUT
      path: /api/v2/task/tsk000001
      headers:
        Authorization: pk_cauldron_00000000
      json:
        name: Ship the conformance suite (v2)
    expect:
      status: 200
      webhook:
        event: taskUpdated
        absent_events:
          # A subscriber to taskStatusUpdated must not wake up because
          # somebody edited a title.
          - taskStatusUpdated

  - name: a status sent flat on a write comes back inside the status object
    source: https://clickup.com/api/clickupreference/operation/UpdateTask/
    fixture: small-workspace
    request:
      method: PUT
      path: /api/v2/task/tsk000001
      headers:
        Authorization: pk_cauldron_00000000
      json:
        # Flat going in. ClickUp takes a string here and answers with the
        # object, and a Recipe that assumed the write mirrored the response
        # discarded this silently: the task came back 200 with its old
        # status and nothing said the change had not been made.
        status: review
    expect:
      status: 200
      body:
        status.status: review
        # Untouched by the write, and still present -- the wrapper is rebuilt
        # from the record rather than echoed from the request.
        status.color: "#4194f6"
        status.type: custom
