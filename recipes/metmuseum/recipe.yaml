# Metropolitan Museum of Art Recipe for Cauldron
#
# artistGender is "Female" or the empty string.
#
#   Mary Cassatt      -> "artistGender": "Female"
#   Vincent van Gogh  -> "artistGender": ""
#   Edgar Degas       -> "artistGender": ""
#
# There is no "Male". A man is recorded as the absence of a value -- and the
# absence of a value is what twenty other fields on the same record use to mean
# "this does not apply". culture, period, dynasty, reign, portfolio,
# geographyType, city, state, county, country, region, subregion, locale, locus
# and excavation are all "" on the van Gogh, so artistGender's empty string sits
# in a crowd of empty strings that mean something else entirely.
#
# Anything counting women in the collection can do it. Anything counting men
# cannot tell them from the unattributed, the anonymous, and the records nobody
# has filled in.
#
# **And absence is spelled "" rather than null, on twenty-one of fifty-seven
# fields.** `if (object.culture)` is falsy, `object.culture === null` is false,
# and `"culture" in object` is true, so the three ordinary ways of asking
# whether a field is set disagree with each other.
#
# Written against the live API rather than a document: every case below was
# checked against collectionapi.metmuseum.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. Three year fields, two types. accessionYear is the string "1993",
#      artistBeginDate is the string "1853", and objectBeginDate is the number
#      1889 -- on one record, with nothing distinguishing them but which one you
#      happen to read.
#   2. The same field uses two multiplication signs. The van Gogh's dimensions
#      read "28 13/16 x 36 3/4 in." with U+00D7 and the Cassatt's read
#      "25 13/16 x 36 7/16 in." with the letter x. Anything splitting on the
#      character has to know both.
#   3. A missing image is "" where a URL goes. The Cassatt is not public domain,
#      so primaryImage is the empty string rather than absent or null -- and a
#      client that assigns it to an img src asks the page for the current URL.
#   4. GalleryNumber is the only capitalised field name on the record, and
#      tags[].AAT_URL and artistWikidata_URL are shouted in the middle. Fifty-
#      seven fields, three naming conventions.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two objects are served, not 490,000: a van Gogh and a Cassatt, chosen so
#     that the gender field can be seen holding both of its values.
#   - Each is trimmed from 57 fields to the 30 the cases read, and constituents
#     and tags to one entry each.
#   - Only the object lookup is modelled. Search, departments and the object-id
#     listing answer other documents.

recipe: metmuseum
capability: infrastructure
version: 0.1.0

upstream:
  api: metmuseum
  docs: https://metmuseum.github.io/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  object:
    id:
      style: numeric
      field: objectID
      type: number
    fields:
      isHighlight:
        type: boolean
      accessionNumber:
        type: string
      # A year, as a string.
      accessionYear:
        type: string
      isPublicDomain:
        type: boolean
      # "" when the object is not public domain, where a URL goes.
      primaryImage:
        type: string
      department:
        type: string
      objectName:
        type: string
      title:
        type: string
      # "" on a Dutchman and "American" on an American.
      culture:
        type: string
      artistRole:
        type: string
      artistDisplayName:
        type: string
      artistDisplayBio:
        type: string
      artistAlphaSort:
        type: string
      artistNationality:
        type: string
      # Years again, as strings.
      artistBeginDate:
        type: string
      artistEndDate:
        type: string
      # "Female", or the empty string. There is no other value.
      artistGender:
        type: string
      artistWikidata_URL:
        type: string
      artistULAN_URL:
        type: string
      # The year as a person reads it.
      objectDate:
        type: string
      # And the same year as a number.
      objectBeginDate:
        type: integer
      objectEndDate:
        type: integer
      medium:
        type: string
      # Two multiplication signs across two records.
      dimensions:
        type: string
      creditLine:
        type: string
      classification:
        type: string
      metadataDate:
        type: string
      repository:
        type: string
      objectURL:
        type: string
      objectWikidata_URL:
        type: string
      isTimelineWork:
        type: boolean
      # The only capitalised field name on the record.
      GalleryNumber:
        type: string
      constituents:
        type: list
      tags:
        type: list

routes:
  - method: GET
    path: /public/collection/v1/objects/{id}
    resource: object
    operation: get
    not_found: object_not_found

errors:
  object_not_found:
    status: 404
    message: ObjectID not found

fixtures:
  empty: {}

  paintings:
    object:
      # A man, recorded as the absence of a value.
      - id: "436535"
        isHighlight: true
        accessionNumber: "1993.132"
        # A year, quoted.
        accessionYear: "1993"
        isPublicDomain: true
        primaryImage: https://images.metmuseum.org/CRDImages/ep/original/DP-42549-001.jpg
        department: European Paintings
        objectName: Painting
        title: Wheat Field with Cypresses
        # Empty on a Dutch painter.
        culture: ""
        artistRole: Artist
        artistDisplayName: Vincent van Gogh
        artistDisplayBio: Dutch, Zundert 1853–1890 Auvers-sur-Oise
        artistAlphaSort: Gogh, Vincent van
        artistNationality: Dutch
        artistBeginDate: "1853"
        artistEndDate: "1890"
        # Not "Male". The same empty string fifteen other fields use to mean
        # "does not apply".
        artistGender: ""
        artistWikidata_URL: https://www.wikidata.org/wiki/Q5582
        artistULAN_URL: http://vocab.getty.edu/page/ulan/500115588
        objectDate: "1889"
        # And the same year, unquoted.
        objectBeginDate: 1889
        objectEndDate: 1889
        medium: Oil on canvas
        # U+00D7, where the other record uses the letter x.
        dimensions: 28 13/16 × 36 3/4 in. (73.2 × 93.4 cm)
        creditLine: Purchase, The Annenberg Foundation Gift, 1993
        classification: Paintings
        metadataDate: "2026-07-29T04:54:31.183Z"
        repository: Metropolitan Museum of Art, New York, NY
        objectURL: https://www.metmuseum.org/art/collection/search/436535
        objectWikidata_URL: https://www.wikidata.org/wiki/Q18689458
        isTimelineWork: true
        # Filled here, empty on the other.
        GalleryNumber: "822"
        constituents:
          - constituentID: 161947
            role: Artist
            name: Vincent van Gogh
            constituentULAN_URL: http://vocab.getty.edu/page/ulan/500115588
            constituentWikidata_URL: https://www.wikidata.org/wiki/Q5582
            # The same empty string, one level down.
            gender: ""
        tags:
          - term: Landscapes
            AAT_URL: http://vocab.getty.edu/page/aat/300132294
            Wikidata_URL: https://www.wikidata.org/wiki/Q191163

      # A woman, recorded with a value.
      - id: "10393"
        isHighlight: true
        accessionNumber: "65.184"
        accessionYear: "1965"
        # Not public domain, and the image field is empty rather than absent.
        isPublicDomain: false
        primaryImage: ""
        department: The American Wing
        objectName: Painting
        title: Lydia Crocheting in the Garden at Marly
        # Filled here, empty on the van Gogh.
        culture: American
        artistRole: Artist
        artistDisplayName: Mary Cassatt
        artistDisplayBio: American, Pittsburgh, Pennsylvania 1844–1926 Le Mesnil-Théribus, Oise
        artistAlphaSort: Cassatt, Mary
        artistNationality: American
        artistBeginDate: "1844"
        artistEndDate: "1926"
        # The only value the field ever holds besides the empty string.
        artistGender: Female
        artistWikidata_URL: https://www.wikidata.org/wiki/Q173223
        artistULAN_URL: http://vocab.getty.edu/page/ulan/500012368
        objectDate: "1880"
        objectBeginDate: 1880
        objectEndDate: 1880
        medium: Oil on canvas
        # The letter x, where the other record uses U+00D7.
        dimensions: 25 13/16 x 36 7/16 in. (65.6 x 92.6 cm)
        creditLine: Gift of Mrs. Gardner Cassatt, 1965
        # Empty on a painting, where the other painting says "Paintings".
        classification: ""
        metadataDate: "2026-08-11T04:50:09.357Z"
        repository: Metropolitan Museum of Art, New York, NY
        objectURL: https://www.metmuseum.org/art/collection/search/10393
        objectWikidata_URL: https://www.wikidata.org/wiki/Q20170951
        isTimelineWork: true
        GalleryNumber: ""
        constituents:
          - constituentID: 161757
            role: Artist
            name: Mary Cassatt
            constituentULAN_URL: http://vocab.getty.edu/page/ulan/500012368
            constituentWikidata_URL: https://www.wikidata.org/wiki/Q173223
            gender: Female
        tags:
          - term: Gardens
            AAT_URL: http://vocab.getty.edu/page/aat/300008090
            Wikidata_URL: https://www.wikidata.org/wiki/Q1107656

conformance:
  - name: a woman has a gender and a man has an empty string
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/10393
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/10393
    expect:
      status: 200
      body:
        artistDisplayName: Mary Cassatt
        # The only value the field holds besides "".
        artistGender: Female
        # And the same value again, one level down.
        "constituents[0].gender": Female

  - name: the man's gender is the same value as the fields that do not apply
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/436535
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/436535
    expect:
      status: 200
      body:
        artistDisplayName: Vincent van Gogh
        # Not "Male". Anything counting men cannot tell them from the
        # unattributed.
        artistGender: ""
        "constituents[0].gender": ""
        # And the same empty string, meaning something else entirely, on a
        # field about the object rather than the artist.
        culture: ""

  - name: absence is an empty string and not null
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/10393
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/10393
    expect:
      status: 200
      body:
        # Not public domain, so no image -- and the field is "" rather than
        # absent, so assigning it to an img src asks the page for its own URL.
        isPublicDomain: false
        primaryImage: ""
        # A painting with no classification, where the other painting says
        # "Paintings".
        classification: ""
        GalleryNumber: ""
        # And a culture that is filled here and empty on the Dutchman.
        culture: American

  - name: three year fields and two types
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/436535
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/436535
    expect:
      status: 200
      body:
        # Quoted.
        accessionYear: "1993"
        artistBeginDate: "1853"
        objectDate: "1889"
        # Unquoted, on the same record.
        objectBeginDate: 1889
        objectEndDate: 1889
        # And the identifier is a number too.
        objectID: 436535

  - name: the same field uses two multiplication signs
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/436535
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/436535
    expect:
      status: 200
      body:
        # U+00D7 here.
        dimensions: 28 13/16 × 36 3/4 in. (73.2 × 93.4 cm)

  - name: and the letter x on the other record
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/10393
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/10393
    expect:
      status: 200
      body:
        # The letter, in the same field, in the same collection.
        dimensions: 25 13/16 x 36 7/16 in. (65.6 x 92.6 cm)

  - name: three naming conventions on one record
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/436535
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/436535
    expect:
      status: 200
      body:
        # camelCase.
        objectName: Painting
        # SHOUTED in the middle, twice.
        artistWikidata_URL: https://www.wikidata.org/wiki/Q5582
        "tags[0].AAT_URL": http://vocab.getty.edu/page/aat/300132294
        # And Capitalised at the front, once.
        GalleryNumber: "822"

  - name: the rest of the record, so nothing here is unread
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/436535
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/436535
    expect:
      status: 200
      body:
        isHighlight: true
        accessionNumber: "1993.132"
        title: Wheat Field with Cypresses
        # An en dash in the years, inside a prose bio.
        artistDisplayBio: Dutch, Zundert 1853–1890 Auvers-sur-Oise
        # The surname first, with the particle moved to the end.
        artistAlphaSort: Gogh, Vincent van
        artistNationality: Dutch
        artistEndDate: "1890"
        objectWikidata_URL: https://www.wikidata.org/wiki/Q18689458
        artistULAN_URL: http://vocab.getty.edu/page/ulan/500115588
        # The only ISO 8601 timestamp on a record full of bare years.
        metadataDate: "2026-07-29T04:54:31.183Z"
        repository: Metropolitan Museum of Art, New York, NY
        objectURL: https://www.metmuseum.org/art/collection/search/436535
        department: European Paintings
        medium: Oil on canvas
        creditLine: Purchase, The Annenberg Foundation Gift, 1993
        isTimelineWork: true
        classification: Paintings
        "constituents[0].constituentID": 161947
        "constituents[0].role": Artist
        "constituents[0].constituentWikidata_URL": https://www.wikidata.org/wiki/Q5582
        "tags[0].term": Landscapes
        "tags[0].Wikidata_URL": https://www.wikidata.org/wiki/Q191163

  - name: the other record's own values
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/10393
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/10393
    expect:
      status: 200
      body:
        objectID: 10393
        accessionNumber: "65.184"
        accessionYear: "1965"
        title: Lydia Crocheting in the Garden at Marly
        artistDisplayBio: American, Pittsburgh, Pennsylvania 1844–1926 Le Mesnil-Théribus, Oise
        artistAlphaSort: Cassatt, Mary
        artistBeginDate: "1844"
        artistEndDate: "1926"
        objectDate: "1880"
        objectBeginDate: 1880
        objectEndDate: 1880
        department: The American Wing
        metadataDate: "2026-08-11T04:50:09.357Z"
        objectWikidata_URL: https://www.wikidata.org/wiki/Q20170951
        "constituents[0].constituentID": 161757
        "tags[0].term": Gardens
        "tags[0].AAT_URL": http://vocab.getty.edu/page/aat/300008090

  - name: an object that does not exist
    source: https://collectionapi.metmuseum.org/public/collection/v1/objects/99999999
    verified: "2026-08-30"
    fixture: paintings
    request:
      method: GET
      path: /public/collection/v1/objects/99999999
    expect:
      status: 404
      body:
        message: ObjectID not found
