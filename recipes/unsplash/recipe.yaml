# Unsplash Recipe for Cauldron
#
# Unsplash has no sandbox, and its own demo tier is fifty requests an hour
# against a real, shared application -- a suite calling it on every run
# burns the whole allowance on failures before it reaches a single test
# that exercises anything else. Everything under "Checked live" below was
# answered with no credential and with a credential no account issued,
# against api.unsplash.com, and nothing past that heading was ever
# answered with a 200: this Recipe has no key, asked for none, and made
# none.
#
# Checked live, 2026-09-01, against GET /photos, GET /photos/{id}, GET /me
# and GET /search/photos:
#
#   1. Every failure is {"errors": [...]}, an array of bare strings, not
#      objects. api.unsplash.com/photos?per_page=1 with no Authorization
#      header at all answers 401 with
#      {"errors":["OAuth error: The access token is invalid"]} -- a plain
#      string sitting where SendGrid or Clerk would put {"message": ...}.
#      Code that reads errors[0].message the way it would for either of
#      those finds undefined on a string that already says exactly what
#      went wrong.
#   2. Missing and wrong are the same failure. No Authorization header,
#      an empty one, one with no "Client-ID " prefix, and one with a
#      twenty-character junk key all answer the identical 401 body above,
#      on all four endpoints tried. There is no "you didn't send a key"
#      message distinct from "that key is not one" -- both read exactly
#      like a revoked or mistyped credential.
#   3. X-Ratelimit-Limit and X-Ratelimit-Remaining, which Unsplash's own
#      rate-limiting docs describe as arriving "on each request," do not
#      arrive on any of the failures above. Every one of the four 401s
#      checked carries neither header -- only
#      access-control-expose-headers listing their names as ones CORS is
#      allowed to expose, which is a header naming other headers rather
#      than the headers themselves. This is stated as a finding because
#      the opposite was the working assumption going in.
#   4. An address outside every route this API has -- checked against
#      /totally/bogus/path -- answers 404 with {"errors":["Not found"]}
#      and no credential at all, which is the one case here where a
#      completely wrong request needs no key to be refused correctly:
#      routing happens before whatever checks the Authorization header
#      does, for a path recognisable as not being one of Unsplash's at
#      all. It shares the same {"errors": [...]} shape as everything
#      else, which is the one piece of good news in this list.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - X-Total and X-Per-Page, which Unsplash's docs say a listing answers
#     with beside the Link header, are not modelled. Cauldron has route
#     headers, and they are constants; these two describe the collection
#     the caller just asked for, and a constant here would report the
#     same total whatever per_page was sent. GitLab and Basecamp's
#     Recipes already state the identical gap about their own X-Total,
#     and this is the same shape of absence rather than a new one.
#   - X-Ratelimit-Limit and X-Ratelimit-Remaining are declared on the two
#     routes below as constants from the demo-tier number in Unsplash's
#     own docs (fifty an hour), sourced rather than verified: no call
#     made for this Recipe ever carried a valid key, so no 200 was ever
#     available to check them against, and the constant does not
#     decrement between requests the way the real counter would.
#   - No case here exercises what a well-formed but non-existent photo id
#     answers with a valid key. It could not be reached (every reachable
#     call here answered 401 before any id was looked at), so
#     resource_missing below is sourced to Unsplash's own generic error
#     documentation -- the same {"errors": [...]} shape stated to apply
#     "with standard HTTP status codes" -- rather than to an observed
#     404. It is a narrower inference than the verified cases above and
#     is marked as such.
#   - Search is not routed. Its listing envelope in Unsplash's own docs is
#     {"total", "total_pages", "results"} -- a different shape from the
#     bare array GET /photos answers with -- and adding it without a way
#     to verify either shape live would be one more documented guess
#     rather than a finding.
#   - Neither api.unsplash.com nor unsplash.com/documentation serves a
#     resolvable OpenAPI document at any conventional path, so this
#     Recipe has no upstream.spec and nothing was recorded with
#     `cauldron drift`.
#
# The key below is a fixture and belongs to no account.

recipe: unsplash
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://unsplash.com/documentation

auth:
  # "Authorization: Client-ID <access key>" -- not Bearer, and the prefix
  # is part of what a client has to get right.
  scheme: header
  header: Authorization
  prefix: "Client-ID "
  keys:
    - cauldron_unsplash_fixture_key

responses:
  list:
    style: bare
    # Paging travels in a Link header and in the X-Total/X-Per-Page
    # headers the gap above states are not modelled.
    link_header: true
    prev_link: true
  resource:
    style: bare
  error:
    # {"errors": ["..."]} -- bare strings in the array, not
    # {"errors": [{"message": "..."}]}. list would be the SendGrid shape;
    # this is Datadog's, and it is the one Unsplash actually sends.
    style: string_list
    key: errors

resources:
  photo:
    id:
      # Eleven characters, base62-ish and case-sensitive -- SendGrid's
      # bare-random shape, not a UUID and not numeric.
      style: opaque
      length: 11
    fields:
      created_at:
        type: string
      updated_at:
        type: string
      width:
        type: integer
      height:
        type: integer
      color:
        type: string
      blur_hash:
        type: string
      description:
        type: string
      alt_description:
        type: string
      likes:
        type: integer
      current_user_collections:
        type: list
      urls:
        type: map
      links:
        type: map
      user:
        type: map
      # Documented as present on a single photo and absent from the list
      # envelope -- Braze's campaigns/list-vs-details shape, and the
      # reason this Recipe's list route below declares `returns`.
      downloads:
        type: integer
      public_domain:
        type: boolean
      exif:
        type: map
      location:
        type: map
      tags:
        type: list

routes:
  - method: GET
    path: /photos
    resource: photo
    operation: list
    pagination:
      style: page
      limit_param: per_page
      cursor_param: page
      limit: 10
    # The abbreviated shape a listing answers with. downloads, exif,
    # location, tags and public_domain are single-photo-only fields, and
    # leaving `returns` off here would put them on every list entry too --
    # which is not what Unsplash's own docs show a listing answering.
    returns:
      - id
      - created_at
      - updated_at
      - width
      - height
      - color
      - blur_hash
      - description
      - alt_description
      - likes
      - current_user_collections
      - urls
      - links
      - user
    headers:
      # Documented, not verified -- see the fidelity gaps above.
      X-Ratelimit-Limit: "50"
      X-Ratelimit-Remaining: "49"

  - method: GET
    path: /photos/{id}
    resource: photo
    operation: get
    headers:
      X-Ratelimit-Limit: "50"
      X-Ratelimit-Remaining: "49"

errors:
  authentication_error:
    status: 401
    message: "OAuth error: The access token is invalid"

  # Documented, not observed -- see the fidelity gaps above.
  resource_missing:
    status: 404
    message: "Not found"

