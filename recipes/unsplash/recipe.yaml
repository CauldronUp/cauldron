conformance:
  # -- Verified, 2026-09-01, no credential and no account. --

  - name: an unauthenticated call answers errors as an array of bare strings
    source: https://api.unsplash.com/photos?per_page=1
    verified: "2026-09-01"
    fixture: gallery
    request:
      method: GET
      path: /photos
    expect:
      status: 401
      body:
        # A string, sitting where an object would sit under the list and
        # string_list styles. errors[0].message would read undefined
        # against this on a body that already names the problem.
        "errors[0]": "OAuth error: The access token is invalid"
      absent:
        - "errors[0].message"
        - message

  - name: a junk token answers exactly the same failure as no token at all
    source: https://api.unsplash.com/photos?per_page=1
    verified: "2026-09-01"
    fixture: gallery
    request:
      method: GET
      path: /photos
      headers:
        Authorization: Client-ID JUNKTOKEN12345
    expect:
      status: 401
      body:
        "errors[0]": "OAuth error: The access token is invalid"

  - name: neither rate-limit header appears on the auth failure
    source: https://api.unsplash.com/photos?per_page=1
    verified: "2026-09-01"
    fixture: gallery
    request:
      method: GET
      path: /photos
    expect:
      status: 401
      # The opposite of the working assumption going in: Unsplash's own
      # docs say these arrive "on each request," and this one carries
      # neither. See the header comment for what was actually there
      # instead (an access-control-expose-headers entry naming them).
      absent_headers:
        - X-Ratelimit-Limit
        - X-Ratelimit-Remaining

  - name: a path outside every route here is refused without needing a key
    source: https://api.unsplash.com/totally/bogus/path
    verified: "2026-09-01"
    fixture: gallery
    request:
      method: GET
      path: /totally/bogus/path
      headers:
        # Sent here because Cauldron checks the credential before it
        # resolves a route (see internal/runtime/handler.go); the live
        # call this is checked against carried no Authorization header at
        # all and was refused the same way before ever reaching that
        # check.
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 404
      body:
        "errors[0]": Not found

  # -- Documented from unsplash.com/documentation, not verified: nothing
  #    below this line was ever answered with a 200. --

  - name: a listing is a bare array with no envelope at all
    source: https://unsplash.com/documentation
    fixture: gallery
    request:
      method: GET
      path: /photos
      headers:
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 200
      body:
        "[0].id": eOePcOakgOA
        "[1].id": Dwu85P9SOIk
      # No downloads, exif, tags or public_domain -- the fields a single
      # photo carries and a listing does not.
      absent:
        - "[0].downloads"
        - "[0].exif"
        - "[0].tags"

  - name: the next page is advertised in a Link header
    source: https://unsplash.com/documentation
    fixture: gallery
    request:
      method: GET
      path: /photos?per_page=1
      headers:
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 200
      header_matches:
        Link: 'rel="next"'

  - name: a single photo carries fields a listing leaves out
    source: https://unsplash.com/documentation
    fixture: gallery
    request:
      method: GET
      path: /photos/eOePcOakgOA
      headers:
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 200
      body:
        id: eOePcOakgOA
        downloads: 5123
        "exif.model": Fixture Camera
        "tags[0].title": warehouse

  - name: rate-limit headers are declared on a success response too
    source: https://unsplash.com/documentation
    fixture: gallery
    request:
      method: GET
      path: /photos/eOePcOakgOA
      headers:
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 200
      headers:
        # A constant from the demo tier's own documented ceiling, not a
        # counter -- see the fidelity gap above.
        X-Ratelimit-Limit: "50"

  - name: a well-formed id nothing owns is refused the same shape as everything else
    source: https://unsplash.com/documentation
    fixture: gallery
    request:
      method: GET
      path: /photos/doesnotexist1
      headers:
        Authorization: Client-ID cauldron_unsplash_fixture_key
    expect:
      status: 404
      body:
        "errors[0]": Not found

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://unsplash.com/documentation"
    fixture: gallery
    request:
      method: GET
      path: "/photos"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Client-ID cauldron_unsplash_fixture_key"
    expect:
      status: 200
      body:
        "[0].id": "Dwu85P9SOIk"
      absent:
        - "[1]"
