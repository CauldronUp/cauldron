# Plaid Recipe for Cauldron
#
# Plaid has a sandbox, and it is still the wrong tool for local development.
# It needs credentials, it needs network, and the interesting states are the
# ones you cannot summon on demand: an item whose login has expired, an
# institution that is down, a product that is not yet ready. Those are exactly
# the branches banking code gets wrong, and exactly the ones nobody exercises.
#
# Three things this Recipe models:
#
#   1. Every endpoint is a POST and the identifier arrives in the body. There
#      is no /accounts/{id} to route on.
#   2. Credentials are two headers, not one, and forgetting the client id is a
#      distinct failure from a bad secret.
#   3. The error category is a separate field from the code, and clients
#      switch on the category first: it decides whether to retry, send the
#      user back through Link, or give up.
#
# Checked live against sandbox.plaid.com, unauthenticated, 2026-09-05, after
# first checking the published OpenAPI document's own security block (it
# declares clientId and secret as header-carried apiKey schemes, not body
# fields, even though the request schemas also list client_id/secret as
# optional body properties for SDK convenience) -- so the question worth
# testing was whether the live host actually reads the headers or only the
# body. It reads the headers: sending PLAID-CLIENT-ID and PLAID-SECRET with
# no client_id/secret in the body at all still gets past field-presence
# checking and on to credential validation, exactly as claim 2 above says
# and exactly as this Recipe already modelled it before this check ran. Two
# genuinely fake but well-formed headers answer 400 INVALID_API_KEYS,
# "invalid client_id or secret provided" -- byte for byte what this file
# already had, unverified, from documentation.
#
# What the live probe complicates rather than confirms: omitting a header
# entirely does not answer that sentence at all. It answers 400
# MISSING_FIELDS, "the following required fields are missing: secret" (or
# client_id, or both, named explicitly and by their body-field spelling) --
# a different code, a different category, and a message that names the
# field Plaid actually wants rather than the header carrying it. Cauldron's
# required-header mechanism can raise the right error name for a missing
# PLAID-CLIENT-ID, but the {detail} it substitutes is the header's own name
# ("PLAID-CLIENT-ID"), because that is what the runtime hands a Recipe at
# that call site -- there is no hook to say "the field is spelled
# differently from the header that carries it." So the case is described
# here rather than written as one that would silently assert the wrong
# text as verified.
#
# Keys below are fixtures, not secrets.

recipe: plaid
capability: banking
version: 0.1.0

upstream:
  api: "2020-09-14"
  docs: https://plaid.com/docs/api
  spec: https://raw.githubusercontent.com/plaid/plaid-openapi/master/2020-09-14.yml
  spec_hash: 702fa507f281e5a858c78776575ee58f94d168c64d09d1186a23dabdb4d96cde
  spec_seen: "2026-08-30"

auth:
  scheme: header
  header: PLAID-SECRET
  keys:
    - cauldron-sandbox-secret
  # A wholly missing secret is, live, a MISSING_FIELDS 400 rather than the
  # INVALID_API_KEYS 400 a wrong-but-present one gets -- category-correct
  # here even though the {detail} text this engine can substitute is not
  # the field name Plaid names. See the file header.
  absent_error: parameter_missing

# Plaid rejects a request that carries a secret but no client id, and that is
# a different failure from a bad secret.
required_headers:
  PLAID-CLIENT-ID: parameter_missing

responses:
  list:
    style: wrapped
    count_field: total_transactions
    # Every response carries the item the data belongs to, which is how a
    # client knows which connection produced it.
    fields:
      item:
        item_id: item-sandbox-cauldron
        institution_id: ins_109508
        available_products:
          - balance
          - identity
        billed_products:
          - transactions
        webhook: https://example.com/plaid/webhook
        error: null
  error:
    style: flat
    type_field: error_type
    code_field: error_code
    message_field: error_message
    # No status_field: Plaid's own schema documents a status property on this
    # object, described as returned "only... when the error information is
    # provided via a webhook" -- never on the synchronous HTTP error body a
    # request gets back, which is what this Recipe serves. A live, direct
    # error checked 2026-09-05 carried no such field, confirming the spec's
    # own words rather than just reading them.
    fields:
      request_id: cauldron00000001
      # Plaid distinguishes the message meant for logs from the one meant for
      # a person, and sends null when there is nothing safe to show.
      display_message: null
      causes: []

resources:
  account:
    collection: accounts
    id:
      style: opaque
      field: account_id
      length: 24
    fields:
      name:
        type: string
        required: true
      official_name:
        type: string
      mask:
        type: string
      type:
        type: string
        default: depository
      subtype:
        type: string
        default: checking
      # Plaid's balances are nested, and code reads account.balances.available
      # rather than account.available.
      available:
        type: number
        in: balances
      current:
        type: number
        in: balances
      iso_currency_code:
        type: string
        default: GBP
        in: balances

  transaction:
    collection: transactions
    id:
      style: opaque
      field: transaction_id
      length: 24
    fields:
      account_id:
        type: string
        required: true
      name:
        type: string
        required: true
      amount:
        type: number
        required: true
      iso_currency_code:
        type: string
        default: GBP
      date:
        type: string
      pending:
        type: boolean
        default: false
      merchant_name:
        type: string

routes:
  # Every endpoint is a POST, and the access token in the body is what selects
  # the data. There is no path parameter to route on anywhere in this API.
  # Neither account listing pages. Plaid returns every account on the Item and
  # accepts no count, offset or cursor for them, so the cursor style declared
  # here was a claim about a round trip that does not exist.
  - method: POST
    path: /accounts/get
    resource: account
    operation: list
    pagination:
      # The body's options object carries account_ids and nothing else, from
      # Plaid's own 2020-09-14 description read 2026-09-05. An Item has the
      # accounts it has, and Plaid answers all of them -- which is why count
      # and offset live under options on the transactions endpoints and not
      # on these.
      #
      # So this does not page, and the runtime was serving ten of it while
      # reading a "limit" nobody sends.
      style: none

  - method: POST
    path: /accounts/balance/get
    resource: account
    operation: list
    pagination:
      # The body's options object carries account_ids and nothing else, from
      # Plaid's own 2020-09-14 description read 2026-09-05. An Item has the
      # accounts it has, and Plaid answers all of them -- which is why count
      # and offset live under options on the transactions endpoints and not
      # on these.
      #
      # So this does not page, and the runtime was serving ten of it while
      # reading a "limit" nobody sends.
      style: none

  - method: POST
    path: /transactions/get
    resource: transaction
    operation: list
    pagination:
      # Offset, not a cursor, and nested: Plaid keeps count and offset inside
      # options in the request body. Read from the query string as "limit"
      # they were never there, so the caller's count did nothing and the
      # first response carried every transaction with no second page -- which
      # is the one thing total_transactions exists to tell you to expect.
      style: offset
      limit: 100
      limit_param: options.count
      cursor_param: options.offset
      in: body

webhooks:
  # The webhook codes that matter are the ones announcing that a connection
  # has broken, which is the state a sandbox cannot produce on request.
  events:
    - TRANSACTIONS.INITIAL_UPDATE
    - TRANSACTIONS.DEFAULT_UPDATE
    - TRANSACTIONS.TRANSACTIONS_REMOVED
    - ITEM.ERROR
    - ITEM.PENDING_EXPIRATION
    - ITEM.USER_PERMISSION_REVOKED
    - ITEM.NEW_ACCOUNTS_AVAILABLE
  signing:
    scheme: hmac-sha256
    header: Plaid-Verification
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: RATE_LIMIT
    type: RATE_LIMIT_EXCEEDED
    message: Too many requests. Please retry after a short delay.
    headers:
      Retry-After: "1"

  authentication_error:
    status: 400
    code: INVALID_API_KEYS
    type: INVALID_INPUT
    message: invalid client_id or secret provided

  resource_missing:
    status: 400
    code: INVALID_ACCESS_TOKEN
    type: INVALID_INPUT
    message: "provided access token is in an invalid format: {detail}"

  parameter_missing:
    status: 400
    code: MISSING_FIELDS
    type: INVALID_REQUEST
    message: "the following required fields are missing: {detail}"

  # The one every banking integration eventually meets in production and
  # almost never rehearses: the user changed their password and the connection
  # needs to go back through Link.
  item_login_required:
    status: 400
    code: ITEM_LOGIN_REQUIRED
    type: ITEM_ERROR
    message: the login details of this item have changed and a user login is required to update this information

  # The bank is down. Retrying immediately is wrong; retrying later is right.
  institution_down:
    status: 400
    code: INSTITUTION_DOWN
    type: INSTITUTION_ERROR
    message: this institution is not currently responding to this request

  # The data is not ready yet. New connections hit this and code that treats
  # it as a hard failure loses the connection.
  product_not_ready:
    status: 400
    code: PRODUCT_NOT_READY
    type: ITEM_ERROR
    message: the requested product is not yet ready, please provide a webhook or try again later

fixtures:
  empty: {}

  small-item:
    account:
      - id: acc0000000000000000000001
        name: Everyday Current
        official_name: Everyday Current Account
        mask: "4471"
        type: depository
        subtype: checking
        available: 1284.31
        current: 1310.09
      - id: acc0000000000000000000002
        name: Instant Saver
        mask: "9920"
        type: depository
        subtype: savings
        available: 8400
        current: 8400
      - id: acc0000000000000000000003
        name: Rewards Card
        mask: "3310"
        type: credit
        subtype: credit card
        available: 2150.5
        current: -849.5
    transaction:
      - id: txn0000000000000000000001
        account_id: acc0000000000000000000001
        name: Pret A Manger
        merchant_name: Pret A Manger
        amount: 4.85
        date: "2026-01-01"
      - id: txn0000000000000000000002
        account_id: acc0000000000000000000001
        name: Direct Debit, Council Tax
        amount: 168
        date: "2026-01-01"
      - id: txn0000000000000000000003
        account_id: acc0000000000000000000003
        name: Pending card authorisation
        amount: 32.4
        date: "2026-01-01"
        pending: true

# Conformance cases, read from Plaid's API reference rather than observed
# against a live sandbox except where a case says otherwise.
conformance:
  - name: two fake but well-formed credentials are INVALID_API_KEYS
    source: https://sandbox.plaid.com/accounts/get
    verified: "2026-09-05"
    request:
      method: POST
      path: /accounts/get
      headers:
        PLAID-CLIENT-ID: cauldron-fake-client-id-probe-only
        PLAID-SECRET: cauldron-fake-secret-probe-only
      json:
        access_token: access-sandbox-cauldron-probe-only
    expect:
      status: 400
      body:
        error_type: INVALID_INPUT
        error_code: INVALID_API_KEYS
        error_message: "invalid client_id or secret provided"
      absent:
        # Documented as webhook-only and confirmed absent on a direct,
        # synchronous error -- see the file header.
        - status
        - status_code

  - name: a request without the client id header is refused
    source: https://plaid.com/docs/api/#api-host
    fixture: small-item
    request:
      method: POST
      path: /accounts/get
      headers:
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
    expect:
      status: 400
      body:
        error_type: INVALID_REQUEST
        error_code: MISSING_FIELDS
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides. Live, this exact case names the field ("client_id")
        # rather than the header; the file header says why that text is
        # not asserted here.
        error_message: '.'

  - name: balances are nested under balances, not on the account
    source: https://plaid.com/docs/api/accounts/#accounts-get
    fixture: small-item
    request:
      method: POST
      path: /accounts/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
    expect:
      status: 200
      body:
        accounts[0].name: Everyday Current
        accounts[0].balances:
          available: 1284.31
          current: 1310.09
          iso_currency_code: GBP
      # Code reading account.available finds nothing, because Plaid does not
      # put it there.
      absent:
        - accounts[0].available
        - data

  - name: the identifier is account_id, and every response names its item
    source: https://plaid.com/docs/api/accounts/#accounts-get
    fixture: small-item
    request:
      method: POST
      path: /accounts/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
    expect:
      status: 200
      body:
        accounts[0].account_id: acc0000000000000000000001
        item:
          item_id: item-sandbox-cauldron
          institution_id: ins_109508
      absent:
        - accounts[0].id

  - name: an expired login is an ITEM_ERROR, not a generic failure
    source: https://plaid.com/docs/errors/item/#item_login_required
    fixture: small-item
    request:
      method: POST
      path: /accounts/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: wrong-secret
      json:
        access_token: access-sandbox-cauldron
    expect:
      # A bad secret is INVALID_INPUT. The category is what a client branches
      # on first, because it decides whether to retry or re-authenticate.
      status: 400
      body:
        error_type: INVALID_INPUT
        error_code: INVALID_API_KEYS
        display_message: null
      absent:
        - error
        - message

  - name: transactions report a total separate from the page
    source: https://plaid.com/docs/api/products/transactions/#transactionsget
    fixture: small-item
    request:
      method: POST
      path: /transactions/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
        # Inside options, where Plaid reads it. A top-level count is ignored,
        # and so was the ?limit=2 that used to sit beside it.
        options:
          count: 2
    expect:
      status: 200
      body:
        total_transactions: 3
        transactions[0].name: Pret A Manger
        transactions[0].amount: 4.85
      absent:
        - transactions[2]

  - name: the second page is an offset into the same total
    # total_transactions counts the whole set, not the page, so a client pages
    # by asking again from further in until it has collected that many. That
    # loop is the reason the field exists, and nothing here took it: read from
    # the query string, options.offset was never seen and every request
    # answered with the first page again.
    source: https://plaid.com/docs/api/products/transactions/#transactionsget
    fixture: small-item
    request:
      method: POST
      path: /transactions/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
        options:
          count: 2
          offset: 2
    expect:
      status: 200
      body:
        # Still three in total, one on this page.
        total_transactions: 3
        transactions[0].name: Pending card authorisation
      absent:
        - transactions[1]

  - name: a pending transaction says so
    source: https://plaid.com/docs/api/products/transactions/#transactions-get-response-transactions-pending
    fixture: small-item
    request:
      method: POST
      path: /transactions/get
      headers:
        PLAID-CLIENT-ID: cauldron
        PLAID-SECRET: cauldron-sandbox-secret
      json:
        access_token: access-sandbox-cauldron
    expect:
      status: 200
      body:
        transactions[2].pending: true
        transactions[0].pending: false

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the account listing answers with what the fixture holds"
    source: "https://plaid.com/docs/api/accounts/#accounts-get"
    fixture: small-item
    request:
      method: POST
      path: "/accounts/balance/get"
      headers:
        "PLAID-CLIENT-ID": "cauldron"
        "PLAID-SECRET": "cauldron-sandbox-secret"
    expect:
      status: 200
      body:
        "accounts[0].account_id": "acc0000000000000000000001"
        "accounts[1].account_id": "acc0000000000000000000002"

  # The names. This Recipe declares 7 field(s) on a account that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "an account carries the field names this Recipe declares"
    source: "https://plaid.com/docs/api/accounts/#accounts-get"
    fixture: small-item
    request:
      method: POST
      path: "/accounts/get"
      headers:
        "PLAID-CLIENT-ID": "cauldron"
        "PLAID-SECRET": "cauldron-sandbox-secret"
    expect:
      status: 200
      body:
        "accounts[0].balances.available": 1284.31
        "accounts[0].balances.current": 1310.09
        "accounts[0].balances.iso_currency_code": "GBP"
        "accounts[0].mask": "4471"
        "accounts[0].official_name": "Everyday Current Account"
        "accounts[0].subtype": "checking"
        "accounts[0].type": "depository"

  # The names. This Recipe declares 3 field(s) on a transaction that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a transaction carries the field names this Recipe declares"
    source: "https://plaid.com/docs/api/products/transactions/#transactionsget"
    fixture: small-item
    request:
      method: POST
      path: "/transactions/get"
      headers:
        "PLAID-CLIENT-ID": "cauldron"
        "PLAID-SECRET": "cauldron-sandbox-secret"
    expect:
      status: 200
      body:
        "transactions[0].date": "2026-01-01"
        "transactions[0].iso_currency_code": "GBP"
        "transactions[0].merchant_name": "Pret A Manger"

