# Chroma Recipe for Cauldron
#
# Meilisearch's write hands back a number and the word enqueued: a receipt
# for the specific thing you just asked for, pollable at its own address.
# Chroma's write hands back less than that. Adding records to a collection
# answers 201 with a body whose own published schema is, verbatim,
# AddCollectionRecordsResponse: {"type": "object"} -- an object, shape
# unspecified, no properties listed at all. Not a task id. Not a count. Not
# even a boolean saying yes. Confirmed live against api.trychroma.com's own
# OpenAPI document (fetched whole, unauthenticated, 2026-09-01 -- see
# upstream.spec below) rather than read from a rendered page: the schema
# really does declare zero fields for the one response in this API that
# tells you whether a write happened.
#
# What exists instead is not a per-write receipt at all. It is a
# per-collection gauge: GET .../collections/{id}/indexing_status, added to
# Chroma Cloud on 2026-01-16 (Chroma's own changelog, quoted below), answers
# {"num_indexed_ops", "num_unindexed_ops", "op_indexing_progress",
# "total_ops"} -- four numbers describing the whole collection's backlog,
# with no way to ask "is *my* write, specifically, in the indexed count or
# the unindexed one." The changelog's own words for why this exists: "When
# data is written to Chroma, it's first committed to our write-ahead log
# (Wal3), then indexed and persisted to object storage asynchronously. This
# architecture lets Chroma handle high-throughput writes without blocking,
# but until now, there was no way to know how much of your data had actually
# been indexed." Fast because it does not wait, honest that it does not
# wait, and the honesty is a collection-wide dial rather than a per-write
# answer -- which is a third shape again, next to Meilisearch's per-write
# handle and, as the sibling Recipe in this group finds, Milvus's per-read
# consistency-level knob.
#
# Set against the same four answers Meilisearch's own header sets itself
# against: Temporal Cloud hands back a second object built to be polled.
# Sumo Logic hands back an id and a link.href addressing that second object,
# plus a warning pre-emptively naming its own failure mode. PandaDoc hands
# back the *same* resource a GET would, watchably incomplete under one field
# whose value changes. Turso hands back a truncated projection of the row
# itself, no state field anywhere. Chroma's add is the plainest of the five:
# no id, no link, no projection, no state field, nothing pollable about the
# specific write at all -- and the one thing that exists to answer the
# question this write raises is scoped to the whole collection, not to it.
#
# Five more, checked live against api.trychroma.com with no account and no
# key, on 2026-09-01:
#
#   1. Missing and wrong collapse into one sentence, unconditionally.
#      No x-chroma-token header, "x-chroma-token: junktoken12345", and
#      "Authorization: Bearer junktoken12345" (a second, undocumented-here
#      accepted header) all three answer the identical 401
#      {"error":"ChromaError","message":"Permission denied."} -- checked on
#      /tenants/default_tenant, /auth/identity and the collections listing.
#      auth.absent_error, auth.malformed_error and auth.rejected_error are
#      all left unset because there is nothing to tell them apart with: this
#      is the same collapse Papertrail's Recipe in this collection already
#      records for its own provider, reached the same way -- probing all
#      three verdicts and finding one sentence.
#   2. Routing runs to completion regardless of the credential, verified two
#      ways with nothing sent at all. GET /api/v2/totally-bogus-endpoint-xyz
#      answers 404 with Content-Length: 0 and no Content-Type header
#      whatsoever -- not even the "application/json" every real failure on
#      this host otherwise carries -- checked with no header and again with
#      a wrong x-chroma-token, byte-identical both times, empty both times.
#      PUT on the indexing_status path this Recipe declares (a real,
#      GET-and-HEAD-only route) answers 405 with a genuine
#      Allow: GET,HEAD and a zero-byte body, no credential sent; DELETE on
#      the collections path (GET and POST both real) answers 405 with
#      Allow: POST,GET,HEAD, also with nothing sent. auth.after_routing
#      carries all of this, and every case below sends exactly what the
#      live host was sent -- no header -- and carries a verified date.
#      Cauldron auto-allows only the methods a Recipe declares, never HEAD,
#      and joins them with ", " rather than ",": the two 405 cases below
#      assert the status this emulator actually produces and not the exact
#      Allow text, which is a stated gap rather than a claim this file
#      cannot back. One case beneath this file's discipline either way is
#      recorded here instead of served: PATCH /tenants/default_tenant with
#      no credential and no body answers 400 "Failed to parse the request
#      body as JSON: EOF while parsing a value at line 1 column 0" -- a real,
#      undocumented rename-tenant route, reached and told its body was
#      missing before its credential was ever examined. Body-shape
#      validation, not only routing, precedes auth on this host; the finding
#      is real and the route is not modelled, because renaming a tenant is
#      outside what this group exists to answer.
#   3. The v1 API answers 410, not 404, for its own former paths, with a
#      genuinely different message from the routing failures above, for
#      every method rather than only the one a client would try first:
#      GET /api/v1/heartbeat -> 410 {"error":"Unimplemented","message":
#      "The v1 API is deprecated. Please use /v2 apis"}, and DELETE on the
#      identical path answers the same 410 rather than 405 -- the shim
#      answers for the whole retired surface, not route by route, credential
#      or not: the 410 above was sent with no Authorization at all. A
#      retired version is not the same failure as a typo, and this host
#      keeps them apart. Not modelled as a route below for the same reason
#      as the next paragraph -- Cauldron's auth is one setting for the whole
#      Recipe, and v1's own shim answers before that setting would ever be
#      consulted for real.
#   4. GET /api/v2/heartbeat, /api/v2/version, /api/v2/pre-flight-checks and
#      the whole retired /api/v1/* surface above are genuinely public -- no
#      credential needed, checked live -- and none of them is modelled, for
#      the reason FireHydrant's Recipe in this collection states for its own
#      GET /v1/noauth/ping: Cauldron's auth scheme is one setting for the
#      whole Recipe, with no per-route exemption, so declaring any of these
#      would make them demand the credential every other route here
#      genuinely needs. heartbeat's own body is one more thing worth having
#      pinned even unmodelled: {"nanosecond heartbeat": <int>} -- the key
#      contains a literal space, in a JSON body Content-Type:
#      application/json describes correctly, which is odd enough on its own
#      to be worth a sentence and not odd enough to be worth inventing a
#      rename mechanism for a route that cannot be routed here regardless.
#   5. Nothing about this host splits into a control plane and a data plane.
#      api.trychroma.com answers both the collection-management calls this
#      Recipe declares and the record-write and query calls in the same
#      breath, on the same host, at the same time. That is worth stating
#      because it is the one place this Recipe's two siblings in this task's
#      group disagree with each other and with Chroma: Pinecone's own
#      Recipe in this collection describes an index whose data plane lives
#      at a second host handed back only once, discoverable no other way,
#      and Milvus's Recipe in this task's own group describes the identical
#      split for Zilliz Cloud. Chroma is the only one of the three vector
#      databases in this batch with nothing to discover: every address a
#      client needs is the one it already has.
#
# Every envelope on this host disagrees with the next. Adding records is an
# object with nothing in it. Listing collections is a bare array (checked in
# the OpenAPI document: 200 -> #/components/schemas/Vec, "type": "array",
# no wrapper). Counting records is a bare integer (u32). Getting or creating
# one collection is the full object. Four routes, four shapes, and nothing
# in this API's own description says a client should expect the next one to
# look like the last.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing is embedded, indexed or searched. A query answers the fixture's
#     own recorded hits, in fixture order, whatever query_embeddings or
#     query_texts was sent. HNSW, SPANN, full-text filtering and the where /
#     where_document query language are not modelled.
#   - No add, get, query or create-collection case below carries a verified
#     date. Every route past auth needs a credential this task was never
#     going to hold, so every 200 here is read from the schema this file
#     fetched live (proving the envelope) or from Chroma's own published
#     Getting Started example (proving one worked case) -- never both, and
#     never invented in between. See each case's own source: line.
#   - The 201 add case proves the schema's own claim -- an object with
#     nothing guaranteed in it -- by asserting absence rather than presence.
#     A real Chroma Cloud response might carry keys this schema simply never
#     lists; the claim made below is only that none of the ordinary ones
#     (an id, a count, a status) are promised.
#   - indexing_status's four fields are declared from the same live schema
#     and Chroma's own changelog, and the fixture pins one plausible-shaped
#     state (some ops indexed, some not) rather than a real collection's
#     real backlog, which no unauthenticated probe could ever produce.
#   - schema, functions (attached_functions, conditional/commit,
#     conditional/get), fork, and the update / upsert / delete record
#     routes are real, live-routed paths (confirmed in the OpenAPI document)
#     and are not modelled: this group's question is about reading what was
#     just written, not a full port of the collection-administration API.
#   - x-chroma-token is the header Chroma Cloud's own client libraries send
#     (confirmed by search of Chroma's client documentation); a plain
#     Authorization: Bearer header was also live-confirmed accepted on this
#     exact host and answers identically. Only x-chroma-token is declared,
#     because Cauldron's auth scheme is one header per Recipe and either
#     would tell the identical story.
#
# The collection_id used in the routes and fixture below is this file's own
# fixture key. No worked example anywhere in Chroma's documentation shows a
# real collection UUID, so nothing below asserts one as a value a live call
# produced -- every place a UUID would matter is proven with a matches:
# pattern instead of a literal identity. "my_collection", "id1", "id2" and
# the two document strings are Chroma's own Getting Started example, quoted
# verbatim, not invented.

recipe: chroma
capability: search
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.trychroma.com/docs/overview/getting-started
  spec: https://api.trychroma.com/openapi.json
  spec_hash: d9a6cf902699fd4f95e1f9f3fe7f0eac295ad9d7ffcc31f18c9444812c747f38
  spec_seen: "2026-09-01"

auth:
  scheme: header
  header: x-chroma-token
  keys:
    - cauldron-chroma-fixture-token-0000000000000000
  # Absent, malformed and rejected all answer the identical sentence on this
  # host -- see the header. None of the three overrides is set, so every
  # verdict falls to authentication_error, which is what Auth.ErrorFor does
  # automatically when a Recipe declares none of them.
  after_routing: true

responses:
  list:
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: error

resources:
  collection:
    collection: results
    id:
      style: uuid
    fields:
      name:
        type: string
      tenant:
        type: string
        default: default_tenant
      database:
        type: string
        default: default_database
      # Absent on a collection with no fixed embedding dimension configured
      # -- the schema declares it nullable and this file leaves it unset
      # rather than guess a number nobody published.
      dimension:
        type: integer
        null_when_unset: true
      log_position:
        type: integer
      version:
        type: integer
        default: 0
      configuration_json:
        type: map
      metadata:
        type: map
        null_when_unset: true

  # The whole answer to "did my write land": a collection-wide count of
  # operations still in the WAL against operations already indexed, not a
  # per-write receipt. See the header for the changelog quote this is read
  # from.
  indexing_status:
    collection: results
    id:
      # Addressed by the same id as the collection it describes -- this
      # route has no identifier of its own.
      style: uuid
    fields:
      num_indexed_ops:
        type: integer
      num_unindexed_ops:
        type: integer
      op_indexing_progress:
        type: number
      total_ops:
        type: integer
      # Scope only. Chroma's own route carries tenant and database in the
      # path and does not repeat either in this body.
      tenant:
        type: string
        in: "-"
      database:
        type: string
        in: "-"

  # AddCollectionRecordsResponse, verbatim from the live schema: an object,
  # nothing declared inside it. See the header. returns names "id" alone so
  # this create keeps only the identifier and then suppresses it -- field:
  # "-" -- which is how this file proves an object with nothing in it
  # rather than the request body echoing back.
  add_result:
    collection: results
    id:
      style: opaque
      field: "-"
    fields:
      tenant:
        type: string
        in: "-"
      database:
        type: string
        in: "-"

  # collection.query()'s own printed result, Chroma's Getting Started
  # example, quoted rather than invented. ids, documents and distances are
  # nested one level for the (unmodelled) case of more than one query
  # embedding in a single request -- Chroma's own shape, not this file's.
  hit:
    collection: results
    id:
      style: opaque
      field: "-"
    fields:
      hit_ids:
        type: list
        as: ids
      hit_documents:
        type: list
        as: documents
      hit_distances:
        type: list
        as: distances
      hit_metadatas:
        type: list
        as: metadatas
      include:
        type: list
      tenant:
        type: string
        in: "-"
      database:
        type: string
        in: "-"

routes:
  - method: POST
    path: /api/v2/tenants/{tenant}/databases/{database}/collections
    resource: collection
    operation: create
    scope: [tenant, database]

  - method: GET
    path: /api/v2/tenants/{tenant}/databases/{database}/collections
    resource: collection
    operation: list
    scope: [tenant, database]

  - method: GET
    path: /api/v2/tenants/{tenant}/databases/{database}/collections/{id}
    resource: collection
    operation: get
    scope: [tenant, database]

  - method: GET
    path: /api/v2/tenants/{tenant}/databases/{database}/collections/{id}/indexing_status
    resource: indexing_status
    operation: get
    scope: [tenant, database]

  - method: POST
    path: /api/v2/tenants/{tenant}/databases/{database}/collections/{id}/add
    resource: add_result
    operation: create
    scope: [tenant, database]
    status: 201
    # Keeps only the (suppressed) identifier, so the body this emulator
    # sends is genuinely {} rather than the request payload echoed back.
    # See the header and the resource comment above.
    returns:
      - id

  # get, not create: nothing here is computed from the POST body. This
  # emulator answers the fixture's own recorded hits for this collection's
  # id, whatever query_embeddings or query_texts was sent -- see the
  # "nothing is searched" fidelity gap.
  - method: POST
    path: /api/v2/tenants/{tenant}/databases/{database}/collections/{id}/query
    resource: hit
    operation: get
    scope: [tenant, database]

errors:
  authentication_error:
    status: 401
    code: ChromaError
    message: Permission denied.

  # Empty on the real host: Content-Length 0, no Content-Type at all. This
  # emulator cannot answer with zero bytes and no header from its text
  # style, so one space stands in for it -- the same one-byte gap
  # Papertrail's Recipe in this collection already states for its own
  # 405, and the same device.
  unknown_route:
    status: 404
    style: text
    message: " "

  method_not_allowed:
    status: 405
    style: text
    message: " "

fixtures:
  empty: {}

  # my_collection, id1, id2 and both document strings are Chroma's own
  # Getting Started example, quoted verbatim. The collection's uuid is a
  # fixture key with no worked example behind it -- see the header.
  quickstart:
    collection:
      - id: 4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d
        name: my_collection
        tenant: default_tenant
        database: default_database
        log_position: 0
        version: 0
        configuration_json: {}

    indexing_status:
      - id: 4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d
        tenant: default_tenant
        database: default_database
        # Some of what was written is indexed; some is still in the WAL.
        # Shaped from the schema and the changelog's own description of
        # what these four numbers mean, not from a real collection's real
        # backlog -- no unauthenticated probe could ever produce one. See
        # the header.
        num_indexed_ops: 7
        num_unindexed_ops: 2
        op_indexing_progress: 0.7777778
        total_ops: 9

    add_result:
      - id: 4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d
        tenant: default_tenant
        database: default_database

    hit:
      - id: 4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d
        tenant: default_tenant
        database: default_database
        hit_ids:
          - id1
          - id2
        hit_documents:
          - This is a document about pineapple
          - This is a document about oranges
        hit_distances:
          - 1.0404009819030762
          - 1.243080496788025
        hit_metadatas:
          - null
          - null
        include:
          - documents
          - distances
          - metadatas

conformance:
  - name: adding records answers with an object and nothing promised inside it
    # AddCollectionRecordsResponse, verbatim from the live schema fetched
    # 2026-09-01 (see upstream.spec): "type": "object", no properties
    # listed. No credential exists to call this live, so the claim below is
    # only what the schema itself promises -- nothing.
    source: https://api.trychroma.com/openapi.json
    fixture: quickstart
    request:
      method: POST
      path: /api/v2/tenants/default_tenant/databases/default_database/collections/4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d/add
      headers:
        x-chroma-token: cauldron-chroma-fixture-token-0000000000000000
      json:
        ids:
          - id1
          - id2
        documents:
          - This is a document about pineapple
          - This is a document about oranges
    expect:
      status: 201
      absent:
        - id
        - count
        - status
        - insertCount
        - insertedIds

  - name: whether a write landed lives on the collection, not on the write
    # num_unindexed_ops is the count of operations Chroma's own changelog
    # describes as "still in the WAL, pending indexing" -- not zero, on a
    # collection that has just been written to. Documented, not observed;
    # see the header.
    source: https://www.trychroma.com/changelog/indexingstatus
    fixture: quickstart
    request:
      method: GET
      path: /api/v2/tenants/default_tenant/databases/default_database/collections/4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d/indexing_status
      headers:
        x-chroma-token: cauldron-chroma-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        num_indexed_ops: 7
        num_unindexed_ops: 2
        total_ops: 9
      matches:
        op_indexing_progress: '^0\.'

  - name: a query answers ids, documents and distances, and nothing about their freshness
    # collection.query()'s own printed output, Chroma's Getting Started
    # example, quoted verbatim -- see the header. Nothing in this response,
    # or in the live schema behind it, says whether the collection was
    # fully indexed when the query ran.
    source: https://docs.trychroma.com/docs/overview/getting-started
    fixture: quickstart
    request:
      method: POST
      path: /api/v2/tenants/default_tenant/databases/default_database/collections/4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d/query
      headers:
        x-chroma-token: cauldron-chroma-fixture-token-0000000000000000
      json:
        query_texts:
          - This is a query document about hawaii
        n_results: 2
    expect:
      status: 200
      body:
        ids[0]: id1
        ids[1]: id2
        documents[0]: This is a document about pineapple
        distances[0]: 1.0404009819030762
        distances[1]: 1.243080496788025
      absent:
        - num_unindexed_ops
        - indexing_status
        - stale
        - consistency

  - name: listing collections is a bare array, unlike every other envelope on this host
    source: https://api.trychroma.com/openapi.json
    fixture: quickstart
    request:
      method: GET
      path: /api/v2/tenants/default_tenant/databases/default_database/collections
      headers:
        x-chroma-token: cauldron-chroma-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        "[0].name": my_collection
        "[0].tenant": default_tenant
      absent:
        - data
        - results
        - collections

  - name: a collection with no fixed dimension configured says null rather than zero
    # The live schema declares dimension "type": ["integer", "null"] and does
    # not list it as required, so this file cannot say from the schema alone
    # whether an unset dimension is omitted or sent as null -- no credential
    # exists to call this and see. null is the reading declared here, and it
    # is a reading rather than a quotation.
    source: https://api.trychroma.com/openapi.json
    fixture: quickstart
    request:
      method: GET
      path: /api/v2/tenants/default_tenant/databases/default_database/collections/4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d
      headers:
        x-chroma-token: cauldron-chroma-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        name: my_collection
        database: default_database
        dimension: null

  - name: no credential at all is refused
    source: https://api.trychroma.com/api/v2/tenants/default_tenant
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/tenants/default_tenant/databases/default_database/collections
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error: ChromaError
        message: Permission denied.

  - name: a wrong token is refused with the identical sentence
    source: https://api.trychroma.com/api/v2/tenants/default_tenant
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/tenants/default_tenant/databases/default_database/collections
      headers:
        x-chroma-token: junktoken12345
    expect:
      status: 401
      body:
        error: ChromaError
        message: Permission denied.

  - name: an unrouted path outranks the credential and answers nothing at all
    # Struck live with no token and again with a wrong one -- 404,
    # Content-Length 0, no Content-Type, byte-identical both times.
    # auth.after_routing carries this; sent here the way it was sent there.
    source: https://api.trychroma.com/api/v2/totally-bogus-endpoint-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/totally-bogus-endpoint-xyz
    expect:
      status: 404

  - name: a wrong method on a GET-only path is a real 405, also reached with no credential
    # Live: PUT on this exact indexing_status path answers 405,
    # Allow: GET,HEAD, with nothing sent. Cauldron never auto-allows HEAD --
    # see the header -- so this asserts the status this emulator actually
    # produces rather than the exact Allow text.
    source: https://api.trychroma.com/api/v2/tenants/default_tenant/databases/default_database/collections/00000000-0000-0000-0000-000000000000/indexing_status
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/v2/tenants/default_tenant/databases/default_database/collections/4a7c6e2e-6f3b-4b8a-9d1e-2c5f8a0b3c4d/indexing_status
    expect:
      status: 405

  - name: a wrong method on a path with two real methods is still a real 405
    # Live: DELETE on the collections path (GET to list, POST to create)
    # answers 405, Allow: POST,GET,HEAD, with nothing sent.
    source: https://api.trychroma.com/api/v2/tenants/default_tenant/databases/default_database/collections
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /api/v2/tenants/default_tenant/databases/default_database/collections
    expect:
      status: 405
