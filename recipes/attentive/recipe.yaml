# Attentive Recipe for Cauldron
#
# Written against Attentive's published OpenAPI document for the V2 API and
# struck live against api.attentivemobile.com on 2026-09-07 with no credential,
# with a deliberately invalid one, and on a path that does not exist.
#
# **A 401 with nothing in it at all.** Struck live, both with no Authorization
# header and with `Bearer notreal`:
#
#   HTTP/1.1 401 Unauthorized
#   x-content-type-options: nosniff
#   <no body>
#
# No body, no `Content-Type`, and -- the part that matters -- no
# `WWW-Authenticate`. RFC 9110 section 15.5.2 says a 401 response **MUST**
# include one. It is the only mandatory field on the status, and it is the only
# field this response does not have. So there is no way, anywhere in the
# response, to tell a request that carried no credential from one that carried
# a wrong credential, and no way to learn which scheme the API wants.
#
# The one header it does send is `nosniff`: an instruction to a browser not to
# guess the media type of a body that is not there.
#
# [buffer](../buffer) sends an empty 401 too and puts the whole failure in
# `WWW-Authenticate` -- malformed, but there. This one sends the empty half and
# not the other.
#
# **The 404 is the static-file handler.** An unknown API path answers Spring
# Boot's default error attributes:
#
#   {"timestamp":"2026-09-07T22:39:48.884+00:00","path":"/v2/cauldron-nope",
#    "status":404,"error":"Not Found","requestId":"c645e37d-6576697",
#    "message":"No static resource v2/cauldron-nope."}
#
# "No static resource" is the resource handler at the end of the chain
# reporting a missing **file**, because nothing before it claimed the path -- so
# a REST API's answer to an unknown endpoint is a filesystem lookup that failed.
# And the sentence spells the path without its leading slash where the `path`
# field beside it keeps one, so one body carries the same path two ways.
#
# `requestId` is `c645e37d-6576697`: eight hex characters, a hyphen, then
# seven. It looks like the first two groups of a UUID and is not one, so
# anything validating it against a UUID pattern rejects the identifier support
# would ask for.
#
# **The document declares five failures and describes none of them.** `GET
# /v2/segments` lists 400, 401, 403, 429 and 500, and each is a `description`
# string with no `content` and no schema. A generator reading it produces a
# client that knows the statuses and nothing about the bodies -- which for the
# 401 above happens to be exactly right, by accident.
#
# **A segment has no identifier of its own.** `SegmentResponse` is
# `externalId`, `name`, `description`, `created` and `updated`. The only
# identifier is the one the caller supplied, `/v2/segments/external/{externalId}`
# is the only lookup path, and a segment made without one cannot be addressed
# at all. The schema also has no `required` array, so not even that field is
# guaranteed.
#
# **Two fields for one fact.** The listing carries `cursor`, documented as
# "null if no more results", and `hasMore` beside it. Either alone would do.
# [affirm](../affirm) has the same pair with the cursor missing -- a boolean
# saying more exists and nothing to ask for it with -- so between the two
# providers the flag is redundant once and load-bearing once.
#
# **Authentication is declared twice, in two vocabularies, and they disagree.**
# The document has a real `security` block, top-level and per-operation, and
# also a vendor extension `x-requires-auth` on five of its seven paths. `/v2/me`
# and `/v2/user/attributes` carry the standard declaration and not the custom
# one.

recipe: attentive
capability: sms
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.attentivemobile.com/api-reference
  spec: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
  spec_hash: 4b38093ee75faee2a9fd71e31ac8c0002fb457edc8bf487115b2fd9ff54e26a8
  spec_seen: "2026-09-07"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n4ttent1vef1xturet0ken0000
  # One empty response to both, so the two are indistinguishable.
  absent_error: unauthorized
  rejected_error: unauthorized
  # An unknown path reaches the static-resource handler rather than the
  # credential check.
  after_routing: true

responses:
  list:
    style: wrapped
    key: segments
    cursor_field: cursor
    # Documented as null when there is nothing more, rather than absent.
    cursor_null: true
    has_more_field: hasMore
  error:
    # Spring Boot's default error attributes, which is what the only failure
    # with a body sends.
    style: flat
    message_field: message
    code_field: error
    code_type: string
    status_field: status

resources:
  segment:
    id:
      # The only identifier on the record, and the caller supplies it.
      field: externalId
      style: opaque
    fields:
      name:
        type: string
      description:
        type: string
      created:
        type: datetime
      updated:
        type: datetime

routes:
  - method: GET
    path: /v2/segments
    resource: segment
    operation: list
    pagination:
      style: cursor
      limit: 50
      limit_param: limit
      cursor_param: cursor

errors:
  unauthorized:
    status: 401
    # Nothing at all: no body, no content type, and not the WWW-Authenticate
    # header RFC 9110 makes mandatory on this status.
    empty: true
    headers:
      # The only header sent -- an instruction not to guess the media type of
      # a body that is not there.
      X-Content-Type-Options: nosniff

  unknown_route:
    status: 404
    code: Not Found
    # The resource handler at the end of the chain, reporting a missing file
    # -- and spelling the path without the leading slash the path field keeps.
    message: "No static resource v2/cauldron-nope."
    headers:
      Content-Type: application/json
      X-Content-Type-Options: nosniff
    fields:
      timestamp: "2026-09-07T22:39:48.884+00:00"
      path: /v2/cauldron-nope
      # Eight hex, a hyphen, seven hex: the first two groups of a UUID, and
      # not a UUID.
      requestId: c645e37d-6576697

fixtures:
  empty:
    segment: []

  account:
    segment:
      - externalId: loyalty_gold_2026
        name: Loyalty Gold Members
        description: Customers with gold loyalty status
        created: "2026-01-30T12:00:00Z"
        updated: "2026-08-14T09:12:44Z"
      - externalId: lapsed_90d
        name: Lapsed 90 days
        description: No order in the last ninety days
        created: "2026-04-02T15:20:11Z"
        updated: "2026-04-02T15:20:11Z"

conformance:
  - name: a missing credential answers nothing at all
    source: https://api.attentivemobile.com/v2/segments
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers: {}
    expect:
      status: 401
      no_body: true

  - name: the mandatory challenge header is not sent
    source: https://api.attentivemobile.com/v2/segments
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers: {}
    expect:
      status: 401
      absent_headers:
        # RFC 9110 section 15.5.2 says a 401 MUST carry one. It is the only
        # required field on this status and the only one missing, so nothing
        # in the response names the scheme the API wants.
        - WWW-Authenticate
        - Content-Type

  - name: the only header is an instruction about a body that is absent
    source: https://api.attentivemobile.com/v2/segments
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers: {}
    expect:
      status: 401
      headers:
        X-Content-Type-Options: nosniff

  - name: a wrong credential is indistinguishable from none
    source: https://api.attentivemobile.com/v2/segments
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Byte for byte, and there are no bytes -- so a client cannot tell the
      # two apart on any channel.
      status: 401
      no_body: true

  - name: an unknown path is answered by the static-file handler
    source: https://api.attentivemobile.com/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      body:
        # A REST API's answer to an unknown endpoint is a filesystem lookup
        # that failed.
        message: "No static resource v2/cauldron-nope."
        error: Not Found
        status: 404

  - name: the 404 spells the same path two ways
    source: https://api.attentivemobile.com/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      body:
        # With the leading slash in `path` and without it in `message`.
        path: /v2/cauldron-nope
        message: "No static resource v2/cauldron-nope."

  - name: the request identifier is not a UUID
    source: https://api.attentivemobile.com/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      matches:
        # Eight hex, a hyphen, seven hex -- the first two groups of a UUID
        # and nothing more, so a UUID validator rejects the identifier
        # support would ask for.
        requestId: '^[0-9a-f]{8}-[0-9a-f]{7}$'
      body:
        timestamp: "2026-09-07T22:39:48.884+00:00"

  - name: segments are wrapped under their own plural
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
    expect:
      status: 200
      body:
        'segments[0].name': Loyalty Gold Members
        'segments[0].description': Customers with gold loyalty status

  - name: the only identifier on a segment is the one the caller supplied
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
    expect:
      status: 200
      body:
        # There is no `id` in the schema at all, and the only lookup path is
        # /v2/segments/external/{externalId} -- so a segment made without one
        # cannot be addressed.
        'segments[0].externalId': loyalty_gold_2026
        'segments[1].externalId': lapsed_90d
      absent:
        - 'segments[0].id'

  - name: a segment never edited has two identical timestamps
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
    expect:
      status: 200
      body:
        # So `updated` cannot be used to find changed records without
        # comparing it to `created` first.
        'segments[1].created': "2026-04-02T15:20:11Z"
        'segments[1].updated': "2026-04-02T15:20:11Z"
        'segments[0].updated': "2026-08-14T09:12:44Z"

  - name: the listing says twice whether there is more
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'segments[0].externalId': loyalty_gold_2026
        # A boolean beside a cursor documented as null when there is nothing
        # more, so either field alone would answer the question.
        hasMore: true
      matches:
        cursor: '.'

  - name: the cursor is null rather than absent on the last page
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: account
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
      query:
        limit: "1"
        cursor: loyalty_gold_2026
    expect:
      status: 200
      body:
        'segments[0].externalId': lapsed_90d
        cursor: null
        hasMore: false

  - name: an account with no segments answers an empty array
    source: https://docs.attentivemobile.com/openapi/attentive-api-bundled-v2.yaml
    fixture: empty
    request:
      method: GET
      path: /v2/segments
      headers:
        Authorization: "Bearer cauldr0n4ttent1vef1xturet0ken0000"
    expect:
      status: 200
      body:
        segments: []
        hasMore: false
