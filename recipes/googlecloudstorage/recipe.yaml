# Google Cloud Storage Recipe for Cauldron
#
# Written against the discovery document Google publishes and generates its
# own client libraries from, at
# googleapis.com/discovery/v1/apis/storage/v1/rest -- 250 kilobytes, and the
# source of every description quoted here.
#
# The folders come back in a different array from the files.
#
# There are no directories in a bucket. There are object names with slashes in
# them, and a listing can be asked to pretend otherwise. Of delimiter:
#
#   "Returns results in a directory-like mode. items will contain only objects
#   whose names, aside from the prefix, do not contain delimiter. Objects whose
#   names, aside from the prefix, contain delimiter will have their name,
#   truncated after the delimiter, returned in prefixes. Duplicate prefixes are
#   omitted."
#
# So a listing of a bucket with ten thousand files in folders and two at the
# top level answers with two items and a handful of prefixes. Code that reads
# items and moves on has seen two objects and concluded the bucket is nearly
# empty, and nothing in the response is wrong: the array it read is complete,
# accurate, and not the answer to the question it was asking.
#
# And the paging counts both arrays at once, so a short page is not the last
# page. Of maxResults:
#
#   "Maximum number of items plus prefixes to return in a single page of
#   responses. As duplicate prefixes are omitted, fewer total results may be
#   returned than requested."
#
# Which breaks the loop everybody writes. `while (items.length === pageSize)`
# stops early on the first page where two objects shared a folder, because the
# duplicate prefix was dropped and the page came back one short -- and one
# short reads as the end.
#
# Three more, each from the same document:
#
#   1. The id is not the object's identity. Of id: "The ID of the object,
#      including the bucket name, object name, and generation number." So
#      overwriting a file changes its id, because the id names a version
#      rather than a thing. name is the stable one, and it is the field that
#      is not called id -- which is the reverse of every other provider in
#      this collection.
#   2. Numbers arrive as text. size is "Content-Length of the data in bytes"
#      and is a string; so are generation and metageneration. A bucket can
#      hold objects larger than a double can count, so the safe thing is to
#      send digits as text and let the caller decide -- and a client that
#      adds up sizes with + concatenates them instead.
#   3. Being deleted is two states, not one. timeDeleted is set "if and only
#      if this version of the object has been deleted", and softDeleteTime is
#      "the time at which the object became soft-deleted" -- so an object can
#      be gone from a listing, still billed, and still restorable, and which
#      of those it is lives in whichever of two timestamps is present.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The delimiter is served for the one value everybody uses, "/", by way of
#     a route that answers with prefixes and one that does not. Arbitrary
#     delimiters are not modelled: the format selects a route by a value, and
#     synthesising truncated names for any delimiter would be implementing the
#     feature rather than describing it.
#   - matchGlob, startOffset, endOffset, versions, softDeleted and
#     includeFoldersAsPrefixes are all real and none is modelled. Each narrows
#     or widens the same listing, and the claim this file makes is about the
#     shape that comes back rather than about which rows are in it.
#   - Fetching one object by name is not served, and the reason is worth
#     recording. An object's name goes into the path URL-encoded, so
#     invoices/2026-01.csv is addressed as invoices%2F2026-01.csv and a slash
#     in a name is emphatically not a path separator. Go decodes the path
#     before this format's router sees it, so the encoded name arrives as
#     three segments and matches nothing. Every claim below is asserted from
#     the listing instead, which is where a client meets these objects
#     anyway.
#   - Uploads and downloads are absent: object data travels on a different
#     host with a different protocol, and this Recipe serves metadata.
#   - Buckets, ACLs, HMAC keys, notifications and the rest are absent.
#     Objects only.
#
# Probed live, unauthenticated, on 2026-09-05, against storage.googleapis.com:
#
#   1. GET .../b/{bucket}/o against a bucket name this task invented, with
#      no credential at all, answers 404 {"error":{"code":404,"message":
#      "The specified bucket does not exist.","errors":[...]}} -- GCS
#      treats an anonymous request as a public-access attempt and checks
#      whether the bucket exists (and would be readable) before ever
#      validating a credential that was never sent. The same route with an
#      invented Bearer token answers a completely different failure first:
#      401 {"error":{"code":401,"message":"Invalid Credentials",
#      "errors":[...]}} -- no "status" string anywhere in either body,
#      which this file's own code_field:status mapping invented; fixed on
#      authentication_error below. Not modelled as a general absent/present
#      split: this Recipe's fixture bucket has real seeded objects and is
#      "existing" from the fixture's own perspective, so importing "no
#      credential means check existence first" here would teach a bucket
#      the fixture treats as populated to answer as though it were not
#      there. Confirmed against a real, live public bucket
#      (gcp-public-data-landsat) for context: reading a genuinely public
#      bucket's objects needs no credential at all and answers normally,
#      which is the reason GCS can tell "does not exist" apart from
#      "exists and needs a token" without ever checking one.
#   2. GET .../not-a-real-endpoint and PATCH on the objects-listing route (a
#      method this Recipe does not declare for it), both with no
#      credential, answer the identical plain-text "Not Found" -- not JSON,
#      a different backend layer from the storage API's own error shape --
#      reached without the credential mattering, which auth.after_routing
#      below declares.
#
# The token and the ids below are fixtures and belong to no project.

recipe: googlecloudstorage
capability: storage
version: 0.1.0

upstream:
  api: v1
  docs: https://cloud.google.com/storage/docs/json_api/v1

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true
  keys:
    - ya29.cauldron-gcs-fixture-token

responses:
  list:
    style: wrapped
    key: items
    cursor_field: nextPageToken
    fields:
      kind: storage#objects
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    # Struck live twice, on two different failures: neither carries a
    # "status" string at all. This is the older v1 JSON API shape --
    # {code, message, errors[]} -- not the newer google.rpc.Status
    # convention Gemini and the Address Validation API in this collection
    # use, and code_field: status borrowed that convention wrongly before
    # this probe.
    code_field: "-"
    status_field: code
    type_field: "-"

resources:
  object:
    id:
      # The id includes the generation, so it names a version rather than a
      # file. The stable name is the field below.
      style: opaque
    constants:
      kind: storage#object
    fields:
      name:
        type: string
      bucket:
        type: string
      # Digits as text, because a bucket can hold objects a double cannot
      # count.
      generation:
        type: string
      metageneration:
        type: string
      size:
        type: string
      contentType:
        type: string
      md5Hash:
        type: string
      timeCreated:
        type: datetime
      updated:
        type: datetime
      # Set if and only if this version has been deleted.
      timeDeleted:
        type: datetime
        stamped: false
      # And the other kind of gone.
      softDeleteTime:
        type: datetime
        stamped: false
      storageClass:
        type: string
        default: STANDARD
      # Which listing this object belongs to once a delimiter is in play.
      # GCS works this out from the name; it is declared here, hidden from
      # the wire, because the route needs something to select on.
      depth:
        type: string
        in: "-"

routes:
  # The flat listing: every object in the bucket, folders and all, because
  # without a delimiter there is no such thing as a folder.
  - method: GET
    path: /storage/v1/b/{bucket}/o
    resource: object
    operation: list
    scope:
      - bucket
    pagination:
      style: cursor
      cursor_param: pageToken
      limit_param: maxResults
      limit: 1000

  # The same path in "directory-like mode", which is where the folders go
  # somewhere else.
  - method: GET
    path: /storage/v1/b/{bucket}/o
    resource: object
    operation: list
    scope:
      - bucket
    matches_query:
      delimiter: /
    filters:
      - param: delimiter
        field: depth
        values:
          /:
            - top
    fields:
      # "Objects whose names, aside from the prefix, contain delimiter will
      # have their name, truncated after the delimiter, returned in
      # prefixes." Two of the seeded objects live under invoices/ and one
      # under receipts/, and the two under invoices/ collapse to one entry --
      # "Duplicate prefixes are omitted."
      prefixes:
        - invoices/
        - receipts/
    pagination:
      style: cursor
      cursor_param: pageToken
      limit_param: maxResults
      limit: 1000

errors:
  # Struck live with an invented Bearer token.
  authentication_error:
    status: 401
    message: Invalid Credentials

  # Struck live with no credential at all: Google's own edge, plain text,
  # not the storage API's JSON shape. Reached before authentication is
  # ever consulted, which auth.after_routing declares.
  unknown_route:
    status: 404
    style: text
    message: "Not Found"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical plain-text 404 an unrouted path gets.
  method_not_allowed:
    status: 404
    style: text
    message: "Not Found"

  resource_missing:
    status: 404
    message: No such object.

  invalid_request:
    status: 400
    message: Invalid Value

fixtures:
  empty: {}

  bucket:
    object:
      # At the top level, so a directory-like listing shows it.
      - id: cauldron-fixtures/README.txt/1712345678901234
        bucket: cauldron-fixtures
        depth: top
        name: README.txt
        generation: "1712345678901234"
        metageneration: "1"
        size: "482"
        contentType: text/plain
        md5Hash: 9e107d9d372bb6826bd81d3542a419d6
        timeCreated: "2026-01-04T09:00:00.000Z"
        updated: "2026-01-04T09:00:00.000Z"
        storageClass: STANDARD
      # Two under one folder. The folder is one prefix, not two.
      - id: cauldron-fixtures/invoices/2026-01.csv/1712345678901235
        bucket: cauldron-fixtures
        depth: nested
        name: invoices/2026-01.csv
        generation: "1712345678901235"
        metageneration: "1"
        size: "20481"
        contentType: text/csv
        timeCreated: "2026-02-01T10:00:00.000Z"
        updated: "2026-02-01T10:00:00.000Z"
        storageClass: STANDARD
      - id: cauldron-fixtures/invoices/2026-02.csv/1712345678901236
        bucket: cauldron-fixtures
        depth: nested
        name: invoices/2026-02.csv
        generation: "1712345678901236"
        metageneration: "1"
        size: "21300"
        contentType: text/csv
        timeCreated: "2026-03-01T10:00:00.000Z"
        updated: "2026-03-01T10:00:00.000Z"
        storageClass: STANDARD
      # And one under another, soft-deleted: gone from the ordinary view,
      # still billed, still restorable.
      - id: cauldron-fixtures/receipts/old.pdf/1712345678901237
        bucket: cauldron-fixtures
        depth: nested
        name: receipts/old.pdf
        generation: "1712345678901237"
        metageneration: "2"
        size: "884210"
        contentType: application/pdf
        timeCreated: "2025-11-02T08:15:00.000Z"
        updated: "2026-01-06T09:00:00.000Z"
        softDeleteTime: "2026-01-06T09:00:00.000Z"
        storageClass: NEARLINE

# The resource cases below are read from Google's own discovery document
# rather than a real project -- no bucket for one was ever created. The
# refusal cases carrying a verified date were struck live, unauthenticated,
# against storage.googleapis.com; see the header.
conformance:
  - name: the flat listing has every object and no folders at all
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # Without a delimiter there is no such thing as a folder: the names
        # simply contain slashes.
        kind: storage#objects
        "items[0].name": README.txt
        "items[1].name": invoices/2026-01.csv
        "items[3].name": receipts/old.pdf
      absent:
        - prefixes

  - name: asking for directories moves the folders into a different array
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o?delimiter=/
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # One item, because only one object's name has no slash in it -- and
        # the three that do are represented by two entries in a second array
        # most code never reads. "Duplicate prefixes are omitted", so the two
        # invoices become one.
        "items[0].name": README.txt
        "prefixes[0]": invoices/
        "prefixes[1]": receipts/
      absent:
        # A bucket with four objects, and the array everybody reads has one.
        - items[1]
        - prefixes[2]

  - name: the id names a version and the name names the file
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # "The ID of the object, including the bucket name, object name, and
        # generation number." Overwrite the file and this changes; the name
        # does not. The stable identifier is the field that is not called id.
        "items[1].id": cauldron-fixtures/invoices/2026-01.csv/1712345678901235
        "items[1].name": invoices/2026-01.csv
        "items[1].generation": "1712345678901235"
        "items[1].kind": storage#object

  - name: a size is digits in a string
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # A bucket can hold objects a double cannot count, so the safe thing
        # is text -- and a client that adds sizes with + concatenates them.
        "items[0].size": "482"
        # And the bucket, which GCS does repeat on every object even though
        # the path already named it -- so a record pulled out of a listing
        # still knows where it lives, unlike most partitioned APIs here.
        "items[0].bucket": cauldron-fixtures
        "items[0].generation": "1712345678901234"
        "items[0].metageneration": "1"

  - name: soft-deleted is a third state with a timestamp of its own
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # softDeleteTime is set and timeDeleted is not: the object is gone
        # from the ordinary view, still billed, and still restorable.
        "items[3].softDeleteTime": "2026-01-06T09:00:00.000Z"
        "items[3].storageClass": NEARLINE
      absent:
        - items[3].timeDeleted

  - name: and a live object carries neither timestamp
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        "items[0].name": README.txt
      absent:
        # The other end of the distinction, so both are pinned: absence is
        # the third state and it has no field of its own.
        - items[0].softDeleteTime
        - items[0].timeDeleted

  - name: another bucket's objects are not in this bucket's listing
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/somebody-elses-bucket/o
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        kind: storage#objects
      absent:
        - items[0]

  - name: a token the project does not know is refused
    # Struck live: no "status" string anywhere in the real body -- this
    # file had invented one before the probe.
    source: https://storage.googleapis.com/storage/v1/b/cauldron-fixtures/o
    verified: "2026-09-05"
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o
      headers:
        Authorization: Bearer ya29.not-this-projects-token
    expect:
      status: 401
      body:
        "error.message": Invalid Credentials
      absent:
        - "error.status"

  - name: a short page is not the last page
    source: https://www.googleapis.com/discovery/v1/apis/storage/v1/rest
    fixture: bucket
    request:
      method: GET
      path: /storage/v1/b/cauldron-fixtures/o?maxResults=2
      headers:
        Authorization: Bearer ya29.cauldron-gcs-fixture-token
    expect:
      status: 200
      body:
        # "Maximum number of items plus prefixes to return in a single page
        # of responses. As duplicate prefixes are omitted, fewer total
        # results may be returned than requested." So the count a client
        # compares against covers two arrays, and a page can be short for a
        # reason that has nothing to do with reaching the end.
        "items[0].name": README.txt
        "items[1].name": invoices/2026-01.csv
      matches:
        # Which is why the token is the only thing that says whether there is
        # more, and comparing the page length against maxResults is not.
        nextPageToken: '^.+$'
      absent:
        - items[2]

  - name: a path this API does not route needs no credential either
    # Struck live with no credential at all. Google's own edge, plain
    # text, not the storage API's JSON shape -- reached before
    # authentication is ever consulted, which auth.after_routing declares.
    source: https://storage.googleapis.com/storage/v1/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /storage/v1/not-a-real-endpoint
    expect:
      status: 404
      body_matches: "Not Found"

  - name: a wrong method on a real path is the identical plain-text 404
    # PATCH on the objects-listing route, a method this Recipe does not
    # declare for it. Struck live with no credential at all.
    source: https://storage.googleapis.com/storage/v1/b/cauldron-fixtures/o
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PATCH
      path: /storage/v1/b/cauldron-fixtures/o
    expect:
      status: 404
      body_matches: "Not Found"


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # maxResults=1 and
  # pageToken=cauldron-fixtures/README.txt/1712345678901234, which is
  # the identifier of the last record on the previous page, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "maxResults and pageToken are the two names this listing reads"
    source: "https://www.googleapis.com/discovery/v1/apis/storage/v1/rest"
    fixture: bucket
    request:
      method: GET
      path: "/storage/v1/b/cauldron-fixtures/o"
      query:
        "maxResults": "1"
        "pageToken": "cauldron-fixtures/README.txt/1712345678901234"
      headers:
        "Authorization": "Bearer ya29.cauldron-gcs-fixture-token"
    expect:
      status: 200
      body:
        "items[0].id": "cauldron-fixtures/invoices/2026-01.csv/1712345678901235"
      absent:
        - "items[1]"


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # maxResults=1 and
  # pageToken=cauldron-fixtures/README.txt/1712345678901234, which is
  # the identifier of the last record on the previous page, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "maxResults and pageToken are the two names this listing reads on storage v1 b {bucket} o"
    source: "https://www.googleapis.com/discovery/v1/apis/storage/v1/rest"
    fixture: bucket
    request:
      method: GET
      path: "/storage/v1/b/cauldron-fixtures/o"
      query:
        "maxResults": "1"
        "pageToken": "cauldron-fixtures/README.txt/1712345678901234"
      headers:
        "Authorization": "Bearer ya29.cauldron-gcs-fixture-token"
    expect:
      status: 200
      body:
        "items[0].id": "cauldron-fixtures/invoices/2026-01.csv/1712345678901235"
      absent:
        - "items[1]"

  # The names. This Recipe declares 5 field(s) on a object that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an object carries the field names this Recipe declares"
    source: "https://www.googleapis.com/discovery/v1/apis/storage/v1/rest"
    fixture: bucket
    request:
      method: GET
      path: "/storage/v1/b/cauldron-fixtures/o"
      headers:
        "Authorization": "Bearer ya29.cauldron-gcs-fixture-token"
    expect:
      status: 200
      body:
        "items[0].contentType": "text/plain"
        "items[0].md5Hash": "9e107d9d372bb6826bd81d3542a419d6"
        "items[0].timeCreated": "2026-01-04T09:00:00.000Z"
        "items[0].updated": "2026-01-04T09:00:00.000Z"

