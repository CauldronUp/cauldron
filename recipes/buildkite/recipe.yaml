# Buildkite Recipe for Cauldron
#
# Buildkite has no sandbox, and its whole model makes local testing worse than
# usual: builds run on your own agents, so exercising an integration means
# either standing up an agent or triggering builds that queue forever with
# nothing to run them. A build that never starts looks exactly like a slow one.
#
# Two things worth modelling exactly:
#
#   1. "blocked" is a state, and it means a build is waiting at a manual
#      block step for somebody to unblock it. It is neither a pass nor a
#      failure, and neither is "scheduled" or "not_run". A deployment gate
#      that treats anything other than "passed" as failed rejects a build
#      that is waiting for a human.
#   2. A build that has not started has no started_at, and one that has not
#      finished has no finished_at. Computing a duration from either without
#      checking produces a date in 1970.
#
# Known fidelity gap, stated rather than hidden: Buildkite pages with a Link
# header, which Cauldron does not model.
#
# Tokens below are fixtures, not secrets.

recipe: buildkite
capability: ci
version: 0.1.0

upstream:
  api: v2
  docs: https://buildkite.com/docs/apis/rest-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - bkua_cauldron

responses:
  list:
    style: bare
    # Buildkite's documentation leads with it -- the pagination
    # information is in the Link response header -- before it mentions the
    # query parameters at all.
    link_header: true
  error:
    style: flat
    message_field: message

resources:
  pipeline:
    id:
      # The slug, because that is what a Buildkite URL takes:
      # /v2/organizations/{org}/pipelines/{slug}. A pipeline has a UUID too
      # and Buildkite sends it, but no path accepts it.
      #
      # This Recipe knew: the build routes below address their parent
      # pipeline as {pipeline_slug} while the pipeline routes addressed it as
      # a UUID, so one Recipe answered to two different names for the same
      # thing and a case fetched a pipeline by an identifier no Buildkite URL
      # would take.
      field: slug
      style: opaque
      length: 12
    fields:
      # The UUID, which Buildkite sends and no path accepts.
      uuid:
        type: string
        as: id
      name:
        type: string
        required: true
      repository:
        type: string
      default_branch:
        type: string
        default: main
      # Buildkite counts builds by outcome on the pipeline itself, and a
      # dashboard reading only running_builds_count misses the queue.
      builds_count:
        type: integer
        default: 0
      running_builds_count:
        type: integer
        default: 0
      scheduled_builds_count:
        type: integer
        default: 0
      created_at:
        type: datetime

  build:
    id:
      # The number, which is what a build URL takes:
      # .../pipelines/{pipeline}/builds/{number}. Builds are numbered per
      # pipeline and start at one, so the number is small and repeats across
      # pipelines -- the UUID beside it is global and goes in no path.
      field: number
      style: numeric
      type: number
    fields:
      pipeline_slug:
        type: string
      # The UUID again: sent, and not addressable.
      uuid:
        type: string
        as: id
      # running, scheduled, passed, failed, blocked, canceled, canceling,
      # skipped, not_run. Only "passed" is a pass, and three of the others
      # are neither a pass nor a failure.
      state:
        type: string
        default: scheduled
      # Separate from state: a build can be blocked and also have failed
      # jobs before the block step.
      blocked:
        type: boolean
        default: false
      branch:
        type: string
        default: main
      commit:
        type: string
      message:
        type: string
      source:
        type: string
        default: webhook
      created_at:
        type: datetime
      # Absent until an agent picks it up. A build that never starts looks
      # exactly like a slow one unless you check.
      started_at:
        type: datetime
        stamped: false
      finished_at:
        type: datetime
        stamped: false

  agent:
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      # connected, disconnected, stopping, stopped, lost. A "lost" agent
      # stopped answering mid-build, which is why its build is still running
      # and never will be.
      connection_state:
        type: string
        default: connected
      hostname:
        type: string
      version:
        type: string
      created_at:
        type: datetime
      last_job_finished_at:
        type: datetime
        stamped: false

routes:
  - method: GET
    path: /v2/organizations/{org}/pipelines
    resource: pipeline
    operation: list
    pagination:
      # Checked against Buildkite's own documentation: page, defaulting to
      # one, and per_page, defaulting to thirty and capped at a hundred.
      #
      # Buildkite's documentation leads with the Link response header -- "the
      # pagination information can be found in the Link HTTP response header
      # containing zero or more of next, prev, first and last" -- and this
      # Recipe's list envelope declares link_header, so it is sent.
      #
      # This used to read "and Cauldron sends no Link header". That was true
      # when it was written and stopped being true when Link was modelled,
      # and the sentence stayed behind. A gap recorded in prose does not
      # notice when it is closed.
      style: page
      limit: 30
      limit_param: per_page
      cursor_param: page

  - method: GET
    path: /v2/organizations/{org}/pipelines/{id}
    resource: pipeline
    operation: get

  - method: GET
    path: /v2/organizations/{org}/pipelines/{pipeline_slug}/builds
    resource: build
    operation: list
    scope: [pipeline_slug]
    pagination:
      # Checked against Buildkite's own documentation: page, defaulting to
      # one, and per_page, defaulting to thirty and capped at a hundred.
      #
      # Buildkite's documentation leads with the Link response header -- "the
      # pagination information can be found in the Link HTTP response header
      # containing zero or more of next, prev, first and last" -- and this
      # Recipe's list envelope declares link_header, so it is sent.
      #
      # This used to read "and Cauldron sends no Link header". That was true
      # when it was written and stopped being true when Link was modelled,
      # and the sentence stayed behind. A gap recorded in prose does not
      # notice when it is closed.
      style: page
      limit: 30
      limit_param: per_page
      cursor_param: page

  - method: POST
    path: /v2/organizations/{org}/pipelines/{pipeline_slug}/builds
    resource: build
    operation: create
    scope: [pipeline_slug]
    status: 201

  - method: GET
    path: /v2/organizations/{org}/pipelines/{pipeline_slug}/builds/{id}
    resource: build
    operation: get
    scope: [pipeline_slug]

  - method: GET
    path: /v2/organizations/{org}/agents
    resource: agent
    operation: list
    pagination:
      # Checked against Buildkite's own documentation: page, defaulting to
      # one, and per_page, defaulting to thirty and capped at a hundred.
      #
      # Buildkite's documentation leads with the Link response header -- "the
      # pagination information can be found in the Link HTTP response header
      # containing zero or more of next, prev, first and last" -- and this
      # Recipe's list envelope declares link_header, so it is sent.
      #
      # This used to read "and Cauldron sends no Link header". That was true
      # when it was written and stopped being true when Link was modelled,
      # and the sentence stayed behind. A gap recorded in prose does not
      # notice when it is closed.
      style: page
      limit: 30
      limit_param: per_page
      cursor_param: page

webhooks:
  events:
    - build.scheduled
    - build.running
    - build.finished
    - job.finished
    - agent.connected
    - agent.lost
  signing:
    scheme: hmac-sha256
    header: X-Buildkite-Signature
    secret: cauldron-webhook-token

errors:
  rate_limit:
    status: 429
    message: Too many requests
    headers:
      Retry-After: "1"
      RateLimit-Remaining: "0"

  # Verified live against api.buildkite.com, with no Authorization header at
  # all and with a made-up Bearer token: byte-identical 401 either way. This
  # message had been truncated to its first three words.
  authentication_error:
    status: 401
    message: "Authentication required. Please supply a valid API Access Token: https://buildkite.com/docs/apis/rest-api#authentication"

  resource_missing:
    status: 404
    message: "Not Found: {detail}"

  parameter_missing:
    status: 422
    message: "{detail} is required"

  # Buildkite refuses to unblock a build that is not actually blocked, which
  # is what a retried approval hits after the first one succeeded.
  not_blocked:
    status: 422
    message: The build is not in a blocked state

  # A token without the right scope reads as a missing pipeline, because
  # Buildkite does not confirm that a private pipeline exists.
  forbidden:
    status: 403
    message: Forbidden

fixtures:
  empty: {}

  small-org:
    pipeline:
      - id: engine
        uuid: 11111111-1111-4111-8111-111111111111
        name: Engine
        repository: git@github.com:cauldron/engine.git
        builds_count: 43
        running_builds_count: 1
        scheduled_builds_count: 1
    build:
      - id: "41"
        uuid: 22222222-2222-4222-8222-222222222222
        pipeline_slug: engine
        state: passed
        branch: main
        commit: 4f21c9ab
        started_at: "2026-01-12T10:00:00Z"
        finished_at: "2026-01-12T10:05:00Z"
      - id: "42"
        uuid: 33333333-3333-4333-8333-333333333333
        pipeline_slug: engine
        # Waiting at a manual block step. Not a pass, not a failure, and a
        # gate that rejects anything other than passed rejects this.
        state: blocked
        blocked: true
        branch: main
        started_at: "2026-01-12T11:00:00Z"
      - id: "43"
        uuid: 44444444-4444-4444-8444-444444444444
        pipeline_slug: engine
        # Queued with no agent to run it. Never started, and it looks exactly
        # like a slow build unless you check started_at.
        state: scheduled
        branch: feature
      - id: 55555555-5555-4555-8555-555555555555
        pipeline_slug: engine
        number: 44
        # Its filters excluded this commit. Also not a failure.
        state: not_run
        branch: docs
    agent:
      - id: 66666666-6666-4666-8666-666666666666
        name: cauldron-agent-1
        connection_state: connected
        hostname: runner-01
        version: 3.70.0
      - id: 77777777-7777-4777-8777-777777777777
        name: cauldron-agent-2
        # Stopped answering mid-build. Its build is still running and never
        # will be, which is why a timeout is the only way out.
        connection_state: lost
        hostname: runner-02

# Conformance cases, read from Buildkite's REST API documentation rather than
# observed against a live organisation. The verify report says so.
conformance:
  - name: no token and a wrong one are refused identically, in full
    # Struck live both ways: no Authorization header, and a made-up Bearer
    # token. Byte-identical 401. This message had been truncated to
    # "Authentication required"; Buildkite sends a longer sentence with a
    # link.
    source: https://buildkite.com/docs/apis/rest-api#authentication
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines
    expect:
      status: 401
      body:
        message: "Authentication required. Please supply a valid API Access Token: https://buildkite.com/docs/apis/rest-api#authentication"

  - name: a build is fetched by its number, and a pipeline by its slug
    # Neither is the UUID beside it. Buildkite addresses a pipeline as
    # /organizations/{org}/pipelines/{slug} and a build as
    # .../builds/{number}, and sends a UUID on both that no path accepts.
    #
    # This Recipe contradicted itself about it: the build routes addressed
    # their parent pipeline as {pipeline_slug} while the pipeline routes
    # addressed the same pipeline as a UUID, and a case fetched one by an
    # identifier no Buildkite URL would take. Code that stores build.id and
    # asks for it back gets nothing.
    source: https://buildkite.com/docs/apis/rest-api/builds
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 404

  - name: blocked, scheduled and not_run are neither passes nor failures
    source: https://buildkite.com/docs/apis/rest-api/builds
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        '[0]':
          state: passed
        # Waiting at a manual block step for a human.
        '[1]':
          state: blocked
          blocked: true
        # Queued, with no agent to run it.
        '[2]':
          state: scheduled
        # Filtered out. Also not a failure.
        '[3]':
          state: not_run

  - name: a queued build has never started
    source: https://buildkite.com/docs/apis/rest-api/builds
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds/43
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        state: scheduled
      # Computing a duration from either of these without checking produces a
      # date in 1970, and a build that never starts looks exactly like a slow
      # one until you look here.
      absent:
        - started_at
        - finished_at

  - name: a blocked build started but did not finish
    source: https://buildkite.com/docs/apis/rest-api/builds
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds/42
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        state: blocked
        started_at: "2026-01-12T11:00:00Z"
      absent:
        - finished_at

  - name: a lost agent explains a build that will never finish
    source: https://buildkite.com/docs/apis/rest-api/agents
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/agents
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        '[0]':
          connection_state: connected
        # Stopped answering mid-build. Its build is still running and never
        # will be, so a timeout is the only way out.
        '[1]':
          connection_state: lost
          name: cauldron-agent-2

  - name: a pipeline counts scheduled builds separately from running ones
    source: https://buildkite.com/docs/apis/rest-api/pipelines
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        # A dashboard reading only running_builds_count misses the queue
        # entirely, which is the number that matters when agents are down.
        running_builds_count: 1
        scheduled_builds_count: 1
        builds_count: 43

  - name: a collection is a bare array
    source: https://buildkite.com/docs/apis/rest-api
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 200
      body:
        '[0]':
          slug: engine
      absent:
        - data
        - items
        - '[1]'

  - name: a missing build is a flat message
    source: https://buildkite.com/docs/apis/rest-api
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds/9999
      headers:
        Authorization: Bearer bkua_cauldron
    expect:
      status: 404
      matches:
        message: 'Not Found'
      absent:
        - error
        - errors

  - name: builds page by per_page and page, counting from one
    # Not "limit", which Buildkite does not accept. per_page defaults to
    # thirty, larger than any fixture, so read from the wrong name the first
    # response held every build and reported no second page.
    source: https://raw.githubusercontent.com/buildkite/docs/main/pages/apis/rest_api.md
    fixture: small-org
    request:
      method: GET
      path: /v2/organizations/cauldron/pipelines/engine/builds
      headers:
        Authorization: Bearer bkua_cauldron
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        # The second build, because Buildkite counts pages from one.
        '[0]':
          number: 42
      absent:
        - '[1]'

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if per_page was read --
  # with the name ignored the whole collection comes back, because the
  # whole collection is two records. No third record is needed for that,
  # and none is invented.
  - name: "per_page is read, because a page of one out of two is not the whole collection"
    source: "https://buildkite.com/docs/apis/rest-api/agents"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/cauldron/agents"
      query:
        "per_page": "1"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "66666666-6666-4666-8666-666666666666"
      absent:
        - "[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://buildkite.com/docs/apis/rest-api/agents"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/cauldron/agents"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "77777777-7777-4777-8777-777777777777"
      absent:
        - "[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://buildkite.com/docs/apis/rest-api"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/cauldron/pipelines"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      absent:
        - "[0]"

  # The names. This Recipe declares 6 field(s) on a agent that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "an agent carries the field names this Recipe declares"
    source: "https://buildkite.com/docs/apis/rest-api/agents"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/engine/agents"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].connection_state": "connected"
        "[0].created_at": "2026-01-01T00:00:00Z"
        "[0].hostname": "runner-01"
        "[0].name": "cauldron-agent-1"
        "[0].version": "3.70.0"

  # The names. This Recipe declares 7 field(s) on a build that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "a build carries the field names this Recipe declares"
    source: "https://buildkite.com/docs/apis/rest-api/builds"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/engine/pipelines/engine/builds"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].blocked": false
        "[0].branch": "main"
        "[0].commit": "4f21c9ab"
        "[0].created_at": "2026-01-01T00:00:00Z"
        "[0].finished_at": "2026-01-12T10:05:00Z"
        "[0].pipeline_slug": "engine"
        "[0].source": "webhook"

  # The names. This Recipe declares 4 field(s) on a pipeline that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a pipeline carries the field names this Recipe declares"
    source: "https://buildkite.com/docs/apis/rest-api"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/engine/pipelines"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].created_at": "2026-01-01T00:00:00Z"
        "[0].default_branch": "main"
        "[0].name": "Engine"
        "[0].repository": "git@github.com:cauldron/engine.git"

  # The names. This Recipe declares 2 field(s) on a build that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a build carries the field names this Recipe declares, and 1 more of them"
    source: "https://buildkite.com/docs/apis/rest-api/builds"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/engine/pipelines/engine/builds"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "22222222-2222-4222-8222-222222222222"

  # The names. This Recipe declares 1 field(s) on a pipeline that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a pipeline carries the field names this Recipe declares, and 1 more of them"
    source: "https://buildkite.com/docs/apis/rest-api"
    fixture: small-org
    request:
      method: GET
      path: "/v2/organizations/engine/pipelines"
      headers:
        "Authorization": "Bearer bkua_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "11111111-1111-4111-8111-111111111111"




