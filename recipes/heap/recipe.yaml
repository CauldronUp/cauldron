# Heap Recipe for Cauldron
#
# Heap's server-side track endpoint carries no credential header at all.
# app_id travels inside the JSON body, beside the event, the same shape
# Mixpanel's properties.token and Amplitude's api_key both take -- and unlike
# either of those two, Heap never checks whether the value names a project
# that exists. Checked live, 2026-09-03, POST https://heapanalytics.com/api/track:
#
#   {"app_id":123456789,"identity":"cauldron-test-id","event":"cauldron_test_event"}
#     -> 200  "OK"   (text/plain, 2 bytes -- and 123456789 belongs to no real project)
#
# 123456789 was never registered to anything. This Recipe never signed up
# for Heap or created a project; there is no fixture that could make this
# app_id real. Yet the answer is the same 200 "OK" a genuine project would
# get, which is this trio's third and starkest answer to the question this
# group exists to ask: Amplitude names the key back and refuses; Mixpanel's
# own reference at least admits, in writing, that its 1 "does not signify a
# valid project token"; Heap says nothing at all, ever, about whether app_id
# was real, because nothing here checks.
#
# A DOCUMENTATION ERROR, caught live rather than assumed: Heap's own
# reference (developers.heap.io/reference/track-1) states the successful
# response is `{}` -- an empty JSON object. Every call behind the finding
# above answered `OK`, two ASCII bytes, Content-Type text/plain; charset=utf-8,
# not `{}` and not JSON at all. This Recipe serves what the wire actually
# sends, verified, rather than what the reference claims, and says so rather
# than quietly picking the more convenient of the two.
#
# THE SHAPE CHECK THAT DOES EXIST is real, and it is AJV -- a JSON Schema
# validator -- answering directly, in its own generated sentences, under an
# HTTP status that Content-Type calls text/html and is not:
#
#   {}                                            -> 400 "postBody should have required property 'app_id'"
#   {"identity":"x","event":"y"}  (no app_id)     -> 400 "postBody should have required property 'app_id'"
#   {"app_id":"0000000000", ...}  (a string, not an integer, that AJV's
#    oneOf could not match either half of)        -> 400 "postBody.app_id should be non-negative string,integer"
#
# all checked live, 2026-09-03, all Content-Type: text/html; charset=utf-8
# over what is, byte for byte, plain text -- a lie about the body as literal
# as the ones text/plain "1" and text/html "invalid_request_path" tell
# elsewhere in this group, except Heap's points the other way: prose labelled
# as markup instead of a bit labelled as prose.
#
# TWO SHAPES, ONE ENDPOINT, undocumented on the page cited above. A single
# event at the top level -- app_id, identity, event, properties -- and a
# batch -- app_id, events: [...] -- both answer 200 "OK" for the identical
# reasons; checked live, 2026-09-03,
# `{"app_id":123456789,"events":[{"identity":"x","event":"y"}]}` answers
# exactly what the single-event form does. Omitting identity from the
# single-event form leaks which internal shape actually ran: the live error
# is "postBody.events[0] should have required property 'identity'" -- an
# events[0] path index on a request that named no events array at all,
# because Heap normalises the single-event form into a one-item batch
# before validating it. Omitting event instead answers a different, odder
# sentence again -- "postBody should NOT have additional properties" -- an
# artefact of the same normalisation failing to recognise identity as
# belonging to either shape once event is gone. Neither is served: see the
# fidelity gaps below for why this Recipe's routing cannot reach past
# app_id's presence at all.
#
# ROUTING: no 405 anywhere. A wrong method on the one real path answers
# Express's own default, not Heap's: GET /api/track -> 404 "Cannot GET
# /api/track" (18 bytes, text/html; charset=utf-8, checked live 2026-09-03),
# and PUT gets the identical shape with PUT substituted -- confirmed live so
# it is a pattern rather than one route's accident, the same "answer the
# framework's own bare sentence" shape turso/recipe.yaml and mezmo/recipe.yaml
# were both picked for. A genuinely unrouted path -- checked live against
# /api/nonexistent-cauldron-path -- answers a THIRD 404, Heap's own branded
# marketing "Oops, we can't find the page you're looking for" page, several
# kilobytes of the public site's own HTML with its own nav and footer. So
# there are two different 404s behind two different reasons -- a real path
# with the wrong method gets Express's one-line default, and a path Heap
# never routed at all gets the marketing site -- and only the first is
# served here; see the fidelity gaps.
#
# ANOTHER SELF-CONTRADICTION, in the response headers rather than the body:
# every successful and every malformed response alike carries
# `Access-Control-Allow-Methods: POST, PUT, GET`, advertising PUT as a
# supported verb on this exact path. It is not -- the PUT probe above is
# the proof, checked the same day as the header that claims otherwise.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No resource is declared, and this Recipe's one route answers with raw
#     bytes on both branches, not a record: see mixpanel/recipe.yaml, right
#     beside this file, for the sibling reasoning. Ordinary field validation
#     (Field.Required) could reach "app_id is missing," but the other three
#     sentences above need either a second required-field template this
#     mechanism does not have (Amplitude's problem) or a real numeric-shape
#     pattern check on a field value (this format's Field has no such
#     pattern, only ID.Pattern, which addresses a record rather than
#     validating one being created) -- so raw was chosen for consistency
#     with how this group's other two Recipes made the identical call.
#   - Routing between the two routes below is decided by
#     `selects_body: "app_id"` -- whether the literal key appears anywhere in
#     the request body -- because that is the one distinction this format's
#     body-marker mechanism can make and it is also the one distinction that
#     matters most: present-and-any-value succeeds, absent refuses. It is
#     coarser than Heap's real validator: a request naming app_id and
#     omitting identity or event is, in this Recipe, indistinguishable from
#     a complete one and answers 200 "OK," where the live host answers 400
#     with one of the two odd sentences quoted above. Stated rather than
#     hidden, and not resolvable without the per-field validation this
#     format does not have for a create route with no genuine schema.
#   - The malformed-shape sentence ("should be non-negative string,integer")
#     and the batch-normalisation leaks (events[0], "additional properties")
#     are live-cited prose only, for the same reason.
#   - The marketing-site 404 for a genuinely unrouted path is not served;
#     this Recipe's one declared path answers Express's bare sentence for
#     the wrong method, and anything else falls through to Cauldron's own
#     generic unknown-route handler, which matches neither of Heap's two
#     real 404s. See census/recipe.yaml's header for the same caveat made
#     about a different provider.
#   - EU ingestion (a separate documented host, eu.heapanalytics.com) was
#     never called.
recipe: heap
capability: analytics
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.heap.io/reference/track-1

auth:
  scheme: none

routes:
  # Whether app_id appears anywhere in the body is the whole of what this
  # Recipe can check -- see the header. Any value succeeds; nothing here
  # was ever a real project.
  - method: POST
    path: /api/track
    selects_body: "app_id"
    raw:
      content_type: "text/plain; charset=utf-8"
      text: "OK"

  # No app_id anywhere in the body -- the fallback selects_body cannot win
  # against.
  - method: POST
    path: /api/track
    error: track_missing_app_id

errors:
  track_missing_app_id:
    status: 400
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: "postBody should have required property 'app_id'"

  # No 405 anywhere on this host -- see the header. {detail} is
  # "METHOD /path", the same pair every Recipe's built-in fallback already
  # computes, which is what lets "Cannot {detail}" reproduce Express's
  # sentence exactly for any method this Recipe never declared for this
  # path.
  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: "Cannot {detail}"

fixtures:
  empty: {}

conformance:
  - name: an app_id nobody registered is exactly as good as a real one
    # The finding this Recipe exists to carry -- see the header. 123456789
    # was never a Heap project; nothing here ever signed up for one.
    source: https://heapanalytics.com/api/track
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /api/track
      json:
        app_id: 123456789
        identity: cauldron-test-id
        event: cauldron_test_event
    expect:
      status: 200
      headers:
        Content-Type: "text/plain; charset=utf-8"
      # Two bytes, not the "{}" Heap's own reference claims -- see the
      # header's documentation-error finding.
      body_matches: '^OK$'

  - name: no app_id anywhere in the body is the one thing that is refused
    source: https://heapanalytics.com/api/track
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /api/track
      json:
        identity: cauldron-test-id
        event: cauldron_test_event
    expect:
      status: 400
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "postBody should have required property 'app_id'"

  - name: a wrong method answers Express's own sentence, not a 405
    source: https://heapanalytics.com/api/track
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/track
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "Cannot GET /api/track"

  - name: and a second method confirms it is the pattern, not one route's accident
    source: https://heapanalytics.com/api/track
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PUT
      path: /api/track
    expect:
      status: 404
      body_matches: "Cannot PUT /api/track"
