# NewsAPI Recipe for Cauldron
#
# This is the shape the collection's "status inside the body" question was
# written for. Every response NewsAPI sends, success or failure, carries
#
#   {"status": "ok" | "error", ...}
#
# beside the HTTP status line, and the two were checked against each other in
# every case this research could reach: every 401 answered "error" and every
# request that never got a real key back always answered 401, unauthenticated
# against api.newsapi.org on 2026-09-01. No case here shows the two
# disagreeing. What the research could not do is call a genuine success --
# see "what could not be verified" below -- so whether "status": "ok" and 200
# ever part ways on this API is a real question this Recipe cannot close.
#
# Where that puts NewsAPI among the five shapes this collection has now found
# for a status word living inside the body next to the one on the status
# line:
#
#   EPSS         states the SAME fact twice in the body -- "status": "OK" and
#                "status-code": 200 -- an English word and the integer it
#                repeats, with a hyphen in the second key that a dot operator
#                cannot reach.
#   Paystack     a real boolean: true or false.
#   Flutterwave  a six-and-five-letter word pair: "success" or "error" --
#                truthy as a string on both branches, which is worse than a
#                boolean that is at least sometimes false.
#   Wise         a THIRD kind of value again on its one reachable failure: the
#                quoted numeral "404", echoing the status line as text rather
#                than restating it as a word.
#   NewsAPI      a fifth: two lowercase words, "ok" and "error". Not "OK"
#                (EPSS, capitalised, paired with an integer). Not a boolean
#                (Paystack). Not "success" (Flutterwave -- NewsAPI's failure
#                word is the same "error", but its success word is not).
#                Not a quoted number (Wise). Four Recipes, four different
#                answers to "what does the success word look like", and this
#                is the fourth different success word in five Recipes to
#                write one down at all.
#
# **Missing and wrong are two different failures here, at the same status.**
# No key at all answers 401 with code "apiKeyMissing"; a key that is present
# and simply wrong -- checked both as ?apiKey=junkjunkjunk123 and as an
# X-Api-Key header carrying the same value -- answers the same 401 with code
# "apiKeyInvalid" instead. Same status, different code, different sentence.
# That is a real, live distinction, and this Recipe cannot serve both of it:
# Cauldron raises one error, authentication_error, for every failed
# credential check regardless of what was presented or whether anything was
# presented at all (internal/runtime/auth.go's authorised() has a single
# boolean outcome, and internal/runtime/handler.go fires the one named error
# on the strength of it). This Recipe declares apiKeyMissing, because a
# request carrying no credential at all is the one every integration meets
# first; apiKeyInvalid is recorded here in prose rather than as a second case,
# the same way Wise's invalid_token could not get one either.
#
# **Auth is checked before every parameter this endpoint has.** Country
# omitted, country set to a two-letter code nobody has heard of ("zz"), and no
# parameter at all: every one of those, sent with no key, answers the
# identical apiKeyMissing 401 -- not a 400 about the parameter. NewsAPI's own
# documentation names parametersMissing and parameterInvalid as 400s, and
# sourceDoesNotExist, sourcesTooMany, rateLimited and apiKeyDisabled besides,
# and not one of them was reachable here: the credential is checked first,
# unconditionally, on every route this research tried, the same ordering
# Paystack and Flutterwave already found on their own APIs. Those codes are
# cited from https://newsapi.org/docs/errors rather than modelled, because
# reaching any of them needs a key that actually works.
#
# **A malformed path answers a 404 that is not this API at all.** GET
# /v2/totally-not-a-route -- with no key, with a junk key in the query, with a
# junk X-Api-Key header, all three tried -- answers the same 1245-byte,
# byte-for-byte identical (checked twice) classic IIS "File or directory not
# found" page, text/html, regardless of any credential. That is the layer in
# front of the API refusing to route the request, the same distinction
# spaceflightnews's Recipe already drew between an error table and a raw
# body: an error table describes what a provider does when something is
# wrong, and this is what the host in front of it sends when there is no
# provider to ask at all. It is modelled below as a raw route rather than an
# error for exactly that reason. Reaching it through this emulator needs the
# fixture credential in the query string, because Cauldron's own auth check
# runs unconditionally before the router ever sees a path -- the same
# mismatch Wise's Recipe already named for its own unknown-route case. The
# live 404 does not need one.
#
# No rate-limit header of any kind -- no X-RateLimit-*, no Retry-After --
# appeared on any response checked here, success or failure.
#
# What could not be verified: every route on this API needs a real,
# registered key, including top-headlines with nothing else in the query, and
# none was requested, guessed, or used. So the 200 shape below -- the article
# object, its nullable fields, and the envelope's own totalResults and
# articles -- is built from https://newsapi.org/docs/endpoints/top-headlines
# and carries no verified date anywhere it appears. Three things worth
# pinning in it, all from that same documentation and none of them checked
# against a live 200:
#
#   1. An article has no id of its own anywhere in the record. What a client
#      would key it by is its own url, which is why the id below is declared
#      carried_by url rather than a field named id.
#   2. source is a nested object with just two keys, id and name, and id is
#      documented as frequently null -- NewsAPI aggregates thousands of
#      unaffiliated outlets, most of which were never assigned one of its own
#      source slugs. name is the one always worth trusting.
#   3. author, description and urlToImage are the three fields the
#      documentation itself flags as absent often enough to matter, and this
#      Recipe declares all three null_when_unset rather than merely optional,
#      because NewsAPI's own examples show the key present and null rather
#      than the key missing outright.
#
# content is declared a plain string with no nullability claim: the
# documentation says only that it is truncated to 200 characters on the free
# plan, which is a length behaviour this format has no way to assert and is
# recorded here rather than modelled.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - country, category, sources and q are real, documented filters on this
#     route and none of them is wired below. Every one of them selects which
#     upstream sources get polled rather than matching a field the article
#     record itself carries, so there is no field on article a Filter could
#     narrow by -- unlike Paystack's country, which matches a real column on
#     the bank record. The fixture below answers the same small set of
#     headlines regardless of what is asked for.
#   - Every article in a real response is fresh; NewsAPI recomputes
#     top-headlines continuously. The one seeded below is illustrative of the
#     documented shape and was never read off the wire, because reading it
#     off the wire needs the key this research never used.

recipe: newsapi
capability: docs
version: 0.1.0

upstream:
  api: v2
  docs: https://newsapi.org/docs

auth:
  # In the query string, which is where every live probe here sent it, and in
  # X-Api-Key, which NewsAPI documents as the equivalent header form. That was
  # checked live too: a junk value there answered the identical apiKeyInvalid
  # 401.
  #
  # Only the query form was modelled, on the reasoning that "Cauldron declares
  # one transport per Recipe" -- true when this was written, and what auth.also
  # was added for. Both are served now, so the header form is accepted here as
  # NewsAPI accepts it instead of being refused by a fake stricter than the
  # provider.
  scheme: query
  param: apiKey
  keys:
    - cauldron-newsapi-fixture-key-000000000000
  also:
    - scheme: header
      header: X-Api-Key

responses:
  success:
    fields:
      # The word this whole Recipe exists to place among the others like it.
      status: ok
  list:
    style: wrapped
    key: articles
    count_field: totalResults
  resource:
    style: bare
  error:
    style: flat
    code_field: code
    message_field: message
    fields:
      # The same field, the other spelling, on every failure this research
      # reached.
      status: error

resources:
  article:
    id:
      style: opaque
      # No field on the wire carries one at all.
      field: "-"
      # The nearest thing to an identifier a client actually has.
      carried_by: url
    fields:
      # {id, name}. id is documented as null on most aggregated sources; name
      # is not.
      source:
        type: map
      author:
        type: string
        null_when_unset: true
      title:
        type: string
      description:
        type: string
        null_when_unset: true
      url:
        type: string
      urlToImage:
        type: string
        null_when_unset: true
      publishedAt:
        type: datetime
      # Truncated to 200 characters on the free plan, per the documentation --
      # a length behaviour this format cannot assert and does not.
      content:
        type: string

routes:
  - method: GET
    path: /v2/top-headlines
    resource: article
    operation: list
    pagination:
      style: page
      # The documented default and its parameter names.
      limit: 20
      limit_param: pageSize
      cursor_param: page
      first_page: 1

  # Standing in for any path this API does not route, the same way
  # spaceflightnews's /v4/nosuchthing does. Answered by the host in front of
  # the API, not by NewsAPI itself -- see the header.
  - method: GET
    path: /v2/totally-not-a-route
    status: 404
    raw:
      content_type: text/html
      text: "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=iso-8859-1\"/>\n<title>404 - File or directory not found.</title>\n<style type=\"text/css\">\n<!--\nbody{margin:0;font-size:.7em;font-family:Verdana, Arial, Helvetica, sans-serif;background:#EEEEEE;}\nfieldset{padding:0 15px 10px 15px;} \nh1{font-size:2.4em;margin:0;color:#FFF;}\nh2{font-size:1.7em;margin:0;color:#CC0000;} \nh3{font-size:1.2em;margin:10px 0 0 0;color:#000000;} \n#header{width:96%;margin:0 0 0 0;padding:6px 2% 6px 2%;font-family:\"trebuchet MS\", Verdana, sans-serif;color:#FFF;\nbackground-color:#555555;}\n#content{margin:0 0 0 2%;position:relative;}\n.content-container{background:#FFF;width:96%;margin-top:8px;padding:10px;position:relative;}\n-->\n</style>\n</head>\n<body>\n<div id=\"header\"><h1>Server Error</h1></div>\n<div id=\"content\">\n <div class=\"content-container\"><fieldset>\n  <h2>404 - File or directory not found.</h2>\n  <h3>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</h3>\n </fieldset></div>\n</div>\n</body>\n</html>\n"

errors:
  authentication_error:
    status: 401
    code: apiKeyMissing
    message: "Your API key is missing. Append this to the URL with the apiKey param, or use the x-api-key HTTP header."

fixtures:
  empty: {}

  headlines:
    article:
      # Built from the documented shape, not read off the wire -- see the
      # header. Two records, so source.id's nullability has both of its
      # values seeded rather than just one.
      - source:
          id: null
          name: Reuters
        author: null
        title: "Roman Space Telescope enters final health checks before Sunday launch"
        description: "NASA and ESA engineers confirmed the observatory's instruments are nominal ahead of its scheduled Falcon Heavy launch."
        url: https://www.reuters.com/science/roman-space-telescope-final-checks-2026-08-30/
        urlToImage: null
        publishedAt: "2026-08-30T09:14:00Z"
        content: "The Nancy Grace Roman Space Telescope completed its final pre-launch health checks on Sunday, mission managers said, clearing the way for liftoff later this week from Kennedy Space Center… [+1832 chars]"
      - source:
          id: bbc-news
          name: BBC News
        author: "Jonathan Amos"
        title: "What a Hubble-class mirror is doing on a budget space telescope"
        description: "A donated spy-satellite mirror is at the heart of NASA's newest observatory."
        url: https://www.bbc.co.uk/news/science-environment-roman-telescope-mirror
        urlToImage: https://ichef.bbci.co.uk/news/1024/branded_news/roman-mirror.jpg
        publishedAt: "2026-08-29T22:40:11Z"
        content: "It began as hardware for a reconnaissance satellite that never flew its intended mission. Now it is the primary mirror of NASA's Roman Space Telescope… [+2210 chars]"
      # A third, sparser than either: all three of the nullable fields null
      # at once, which a syndication feed carrying only a headline and a link
      # genuinely looks like.
      - source:
          id: null
          name: Local Wire Feed
        author: null
        title: "Falcon Heavy rollout begins ahead of Sunday window"
        description: null
        url: https://example-syndication.test/wire/falcon-heavy-rollout
        urlToImage: null
        publishedAt: "2026-08-30T14:02:00Z"
        content: "Rollout operations began Sunday morning ahead of the planned afternoon launch window… [+412 chars]"

conformance:
  - name: no key at all is an error, in the body and on the status line together
    source: https://newsapi.org/v2/top-headlines?country=us
    verified: "2026-09-01"
    request:
      method: GET
      path: /v2/top-headlines
    expect:
      status: 401
      body:
        status: error
        code: apiKeyMissing
        message: "Your API key is missing. Append this to the URL with the apiKey param, or use the x-api-key HTTP header."

  - name: leaving every parameter out is the same failure as a bad one, because auth goes first
    source: https://newsapi.org/v2/top-headlines
    verified: "2026-09-01"
    request:
      method: GET
      path: /v2/top-headlines
      query:
        country: zz
    expect:
      # The invalid country never gets looked at: this is byte-for-byte the
      # same 401 as the case above, live and here alike.
      status: 401
      body:
        status: error
        code: apiKeyMissing

  - name: a path this API does not route is answered by the host in front of it, not by NewsAPI
    source: https://newsapi.org/v2/totally-not-a-route
    verified: "2026-09-01"
    request:
      method: GET
      path: /v2/totally-not-a-route
      # Needed only to clear Cauldron's own auth gate, which runs before
      # routing. The live 404 needed no credential at all -- see the header.
      query:
        apiKey: cauldron-newsapi-fixture-key-000000000000
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '404 - File or directory not found\.'

  - name: the envelope states its status the same way on a success as on a failure, one word instead of the other
    source: https://newsapi.org/docs/endpoints/top-headlines
    fixture: headlines
    request:
      method: GET
      path: /v2/top-headlines
      query:
        apiKey: cauldron-newsapi-fixture-key-000000000000
    expect:
      status: 200
      body:
        status: ok
        totalResults: 3
        "articles[0].title": "Roman Space Telescope enters final health checks before Sunday launch"

  - name: an article carries no id of its own, and its source's id is not the same thing as its name
    source: https://newsapi.org/docs/endpoints/top-headlines
    fixture: headlines
    request:
      method: GET
      path: /v2/top-headlines
      query:
        apiKey: cauldron-newsapi-fixture-key-000000000000
    expect:
      status: 200
      body:
        "articles[0].source.id": null
        "articles[0].source.name": Reuters
        # A second source that does have one -- id is a real, sometimes-set
        # field, not a column that is always empty.
        "articles[1].source.id": bbc-news
        "articles[1].source.name": BBC News

  - name: three fields are null rather than merely absent
    source: https://newsapi.org/docs/endpoints/top-headlines
    fixture: headlines
    request:
      method: GET
      path: /v2/top-headlines
      query:
        apiKey: cauldron-newsapi-fixture-key-000000000000
    expect:
      status: 200
      body:
        "articles[0].author": null
        "articles[0].urlToImage": null
        # The second record carries real values for the same three fields,
        # so the nullability is a real branch and not the only value seeded.
        "articles[1].author": "Jonathan Amos"
        "articles[1].urlToImage": https://ichef.bbci.co.uk/news/1024/branded_news/roman-mirror.jpg

  - name: description is the third field that goes null rather than missing
    source: https://newsapi.org/docs/endpoints/top-headlines
    fixture: headlines
    request:
      method: GET
      path: /v2/top-headlines
      query:
        apiKey: cauldron-newsapi-fixture-key-000000000000
    expect:
      status: 200
      body:
        "articles[1].description": "A donated spy-satellite mirror is at the heart of NASA's newest observatory."
        # All three nullable fields null at once, on a third record -- a
        # syndication entry with nothing but a headline and a link.
        "articles[2].author": null
        "articles[2].description": null
        "articles[2].urlToImage": null
        "articles[2].title": "Falcon Heavy rollout begins ahead of Sunday window"
