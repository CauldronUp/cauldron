# ElevenLabs Recipe for Cauldron
#
# Written against the OpenAPI 3.1.0 document ElevenLabs serves from its own
# API host at api.elevenlabs.io/openapi.json -- two megabytes, 300 paths, 387
# operations -- and quoted from the parameter and field descriptions in it.
#
# The credential is optional on every endpoint that needs it.
#
# There is no securitySchemes block in this document and no security
# requirement anywhere in it. What there is instead is xi-api-key, declared
# as an ordinary header parameter on 383 separate operations, and on every
# one of those 383 it says:
#
#   "required": false
#
# with a schema of string-or-null and this description:
#
#   "Your API key. This is required by most endpoints to access our API
#   programmatically."
#
# Most. Not all, and the document never says which. So the prose hedges and
# the machine-readable contract says the key is an optional, nullable header
# on everything -- which means every client generated from this document has
# an API key you can leave out, on every call, without the type system
# noticing.
#
# And the document has almost nothing to say about what happens when you do.
# Of 387 operations, 385 document exactly one failure: 422, validation. Two
# document a 401. Eleven document a 404. So a generated client has a branch
# for a malformed request nearly everywhere and a branch for a wrong key
# almost nowhere, and the shape it does have is FastAPI's -- detail is an
# array of {loc, msg, type}, where loc mixes strings and integers in one
# list.
#
# This Recipe enforces the key and answers 401, which the document does not
# describe on the endpoints modelled here. That is the point: the emulator
# refuses what the real API refuses, and the contract a client was generated
# from did not tell it so.
#
# Four more, each from the same document:
#
#   1. The main endpoint of the product does not answer JSON. Text To Speech
#      is 200 with audio/mpeg, and thirteen more operations do the same;
#      three answer a zip and one an mp4. A client calling .json() on the
#      thing it came for throws, and the document is quite clear about it
#      while every example in every quickstart writes the bytes to a file and
#      moves on.
#   2. The history leaves out a category and cannot be made to show it: "Music
#      and SFX generations are not included and cannot currently be retrieved
#      via the API." Not filtered out -- unavailable. That is Ecwid's and
#      Squarespace's shape with the escape hatch removed.
#   3. What a generation cost is a subtraction. A history item carries
#      character_count_change_from and character_count_change_to, so the price
#      of a request is the difference between two running totals rather than
#      a number anybody sends you. Code that wants "how many characters did
#      this cost" computes it, and code that reads either field alone has
#      read a meter reading.
#   4. A boolean deprecated in favour of an inequality on another field. Of
#      allowed_to_extend_character_limit: "Deprecated: use
#      `max_credit_limit_extension != 0`". The replacement for a yes-or-no is
#      an expression, and the field it names is one whose documented value
#      may be the string "unlimited".
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Text to speech is not modelled, and claim 1 is why. Its success is
#     audio, this format serves JSON, and answering that route with an empty
#     body under an audio content type would be a different lie from the one
#     it exists to warn about. The claim is stated here and the routes served
#     are the ones whose successes really are JSON.
#   - Music and SFX are not modelled either, for the same reason claim 2
#     gives: there is no endpoint that returns them.
#   - The character counters are fixtures. The emulator does not meter, so
#     the two numbers on a history item are seeded to differ by the length of
#     the text that produced it, which is the relationship the claim is
#     about.
#   - Voice cloning, dubbing, Studio projects, conversational agents, audio
#     isolation, samples and the other two hundred and eighty paths are
#     absent. History, voices and the subscription only.
#
# The key and the ids below are fixtures and belong to no account.

recipe: elevenlabs
capability: ai
version: 0.1.0

auth:
  # A bare header, no scheme word, and a name of the vendor's own choosing --
  # which is why the document declaring it as a parameter rather than a
  # security scheme costs a generated client so much.
  scheme: header
  header: xi-api-key
  keys:
    - sk_cauldron_elevenlabs_fixture_key

upstream:
  api: v1
  docs: https://elevenlabs.io/docs/api-reference/introduction

responses:
  list:
    style: wrapped
    key: history
    has_more_field: has_more
    cursor_field: last_history_item_id
  resource:
    style: bare
  error:
    # FastAPI's shape: an array under detail, each entry a loc, a msg and a
    # type. loc is a list mixing strings and integers, which is why a client
    # rendering it has to think about what a path even is.
    style: list
    key: detail
    message_field: msg
    code_field: type
    type_field: "-"

resources:
  history_item:
    id:
      style: opaque
      field: history_item_id
    fields:
      request_id:
        type: string
      voice_id:
        type: string
      voice_name:
        type: string
      voice_category:
        type: string
      model_id:
        type: string
      text:
        type: string
      date_unix:
        type: timestamp
      # A meter reading before the generation.
      character_count_change_from:
        type: integer
      # And after it. The cost is the difference.
      character_count_change_to:
        type: integer
      content_type:
        type: string
        default: audio/mpeg
      state:
        type: string
        default: created
      source:
        type: string
      output_format:
        type: string

  voice:
    id:
      style: opaque
      field: voice_id
    fields:
      name:
        type: string
      category:
        type: string
      description:
        type: string
      labels:
        type: map

  subscription:
    id:
      style: opaque
      field: "-"
    fields:
      tier:
        type: string
      character_count:
        type: integer
      character_limit:
        type: integer
      can_extend_character_limit:
        type: boolean
        default: false
      # Deprecated in favour of an inequality on the field below.
      allowed_to_extend_character_limit:
        type: boolean
        default: false
      max_credit_limit_extension:
        type: integer
        default: 0
      next_character_count_reset_unix:
        type: timestamp
      voice_slots_used:
        type: integer
      voice_limit:
        type: integer

routes:
  - method: GET
    path: /v1/history
    resource: history_item
    operation: list
    filters:
      - param: voice_id
        field: voice_id
    pagination:
      style: cursor
      cursor_param: start_after_history_item_id
      limit_param: page_size
      limit: 100

  - method: GET
    path: /v1/history/{id}
    resource: history_item
    operation: get

  # 200 with a body rather than the 204 the verb suggests, which is what the
  # document declares.
  - method: DELETE
    path: /v1/history/{id}
    resource: history_item
    operation: delete
    status: 200
    deleted_body: record

  - method: GET
    path: /v1/voices
    resource: voice
    operation: list
    list:
      style: wrapped
      key: voices
      has_more_field: "-"
      cursor_field: "-"

  # One account, one subscription, and nothing in the path to name it.
  - method: GET
    path: /v1/user/subscription
    resource: subscription
    operation: get
    id_from: auth

errors:
  authentication_error:
    status: 401
    message: Invalid API key.
    code: invalid_api_key

  resource_missing:
    status: 404
    message: History item not found.
    code: not_found

  invalid_request:
    status: 422
    message: Field required.
    code: missing

fixtures:
  empty: {}

  account:
    subscription:
      - id: sub_cauldron_0001
        tier: creator
        character_count: 44210
        character_limit: 100000
        can_extend_character_limit: true
        allowed_to_extend_character_limit: true
        max_credit_limit_extension: 50000
        next_character_count_reset_unix: 1756684800
        voice_slots_used: 3
        voice_limit: 30

    voice:
      - id: 21m00Tcm4TlvDq8ikWAM
        name: Rachel
        category: premade
        description: A calm, measured narration voice.
        labels:
          accent: american
          age: young
      - id: AZnzlk1XvdvUeBnXmlld
        name: Domi
        category: premade
        description: A confident, direct voice.
        labels:
          accent: american
          age: young

    history_item:
      # Sixty-two characters of text, and two meter readings sixty-two
      # apart. Neither number is the cost.
      - id: hst_cauldron000000000000000001
        request_id: req_cauldron00000001
        voice_id: 21m00Tcm4TlvDq8ikWAM
        voice_name: Rachel
        voice_category: premade
        model_id: eleven_multilingual_v2
        text: The kettle boils at one hundred degrees Celsius at sea level.
        date_unix: 1755000000
        character_count_change_from: 44148
        character_count_change_to: 44210
        content_type: audio/mpeg
        state: created
        source: TTS
        output_format: mp3_44100_128
      # A shorter one, earlier, on the other voice.
      - id: hst_cauldron000000000000000002
        request_id: req_cauldron00000002
        voice_id: AZnzlk1XvdvUeBnXmlld
        voice_name: Domi
        voice_category: premade
        model_id: eleven_multilingual_v2
        text: Drain the queue first.
        date_unix: 1754900000
        character_count_change_from: 44126
        character_count_change_to: 44148
        content_type: audio/mpeg
        state: created
        source: TTS
        output_format: mp3_44100_128

conformance:
  - name: the key the document calls optional is the one the API refuses without
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history
    expect:
      # No xi-api-key at all, which the document declares as required: false
      # on all 383 operations that take it -- and which 385 of 387 operations
      # never mention a 401 for. A client generated from that contract can
      # omit it without a type error and has nowhere to put this answer.
      status: 401
      body:
        "detail[0].msg": Invalid API key.
        "detail[0].type": invalid_api_key

  - name: and a key the account does not know is refused the same way
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history
      headers:
        xi-api-key: sk_not_this_accounts_key
    expect:
      status: 401
      body:
        "detail[0].type": invalid_api_key

  - name: what a generation cost is the difference between two meter readings
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history/hst_cauldron000000000000000001
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # Sixty-two characters of text, 44148 before and 44210 after. The
        # price of this request appears nowhere: it is a subtraction, and
        # either field read alone is a running total for the billing period.
        character_count_change_from: 44148
        character_count_change_to: 44210
        text: The kettle boils at one hundred degrees Celsius at sea level.
        # And the item says what it would have been, which is not JSON.
        content_type: audio/mpeg

  - name: and the item before it moved the same meter by a different amount
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history/hst_cauldron000000000000000002
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # The other end of the same counter: this one's "to" is the next
        # one's "from", which is what makes them readings rather than costs.
        character_count_change_from: 44126
        character_count_change_to: 44148

  - name: the history pages by the last item rather than by a number
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history?page_size=1
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # The cursor is the id of the last item on the page, under a name
        # that says so, and the parameter that consumes it is called
        # something else entirely: start_after_history_item_id.
        "history[0].history_item_id": hst_cauldron000000000000000001
        last_history_item_id: hst_cauldron000000000000000001
        has_more: true
      absent:
        - history[1]

  - name: filtering the history by voice leaves the other voice out
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history?voice_id=AZnzlk1XvdvUeBnXmlld
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        "history[0].voice_name": Domi
        has_more: false
      absent:
        - history[1]

  - name: the voices listing pages by nothing and names itself differently
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/voices
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # A different collection key from the history's, and no cursor and no
        # has_more at all. Two listings, one API, two contracts.
        "voices[0].name": Rachel
        "voices[1].name": Domi
      absent:
        - has_more
        - last_history_item_id

  - name: a boolean and the inequality that replaced it both ship
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/user/subscription
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # "Deprecated: use `max_credit_limit_extension != 0`". Both are here
        # and both agree today, which is exactly how a client comes to depend
        # on the one that is going away.
        allowed_to_extend_character_limit: true
        max_credit_limit_extension: 50000
        character_count: 44210
        character_limit: 100000

  - name: a history item that is not there is refused with a code and a path
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history/hst_cauldron0000000000000000ff
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 404
      body:
        # An array under detail even for a single failure, because the shape
        # is FastAPI's and FastAPI expects several.
        "detail[0].type": not_found
        "detail[0].msg": History item not found.

  - name: deleting a history item answers rather than staying silent
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: DELETE
      path: /v1/history/hst_cauldron000000000000000002
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      # 200 with a body, not the 204 the verb suggests -- which is what the
      # document declares for this one, and what makes a client that checks
      # for 204 report a failure it did not have.
      status: 200
      body:
        # The whole record that was deleted, echoed back, so the caller knows
        # what went rather than only that something did. A receipt carrying
        # the id and a deleted flag would satisfy a client reading the id and
        # would not be this.
        history_item_id: hst_cauldron000000000000000002
        text: Drain the queue first.
        voice_name: Domi

  - name: the cursor goes back under a name that is not the one it arrived as
    source: https://api.elevenlabs.io/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/history?page_size=1&start_after_history_item_id=hst_cauldron000000000000000001
      headers:
        xi-api-key: sk_cauldron_elevenlabs_fixture_key
    expect:
      status: 200
      body:
        # It came back as last_history_item_id and goes out as
        # start_after_history_item_id. Two names for one value, and a client
        # that echoes the field it received gets the first page again for
        # ever.
        "history[0].history_item_id": hst_cauldron000000000000000002
        has_more: false
      absent:
        - history[1]
