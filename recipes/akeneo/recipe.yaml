# Akeneo PIM Recipe for Cauldron
#
# Written against the Swagger 2.0 description Akeneo publishes in its own
# documentation repository, at akeneo/pim-api-docs under
# content/swagger/akeneo-web-api.json -- a megabyte of it, covering
# seventy-eight paths. The fixtures below are built from the worked example
# that document ships beside the product listing, so the shapes are Akeneo's
# rather than invented to suit them.
#
# The reason this Recipe exists is that a product has no name.
#
# It has a list of names. Every attribute's value is an array, and each entry
# in that array is tagged with a locale and a channel:
#
#   "values": {
#     "name": [
#       {"data": "Top",       "locale": "en_US", "scope": null},
#       {"data": "Debardeur", "locale": "fr_FR", "scope": null}
#     ],
#     "description": [
#       {"data": "Summer top",              "locale": "en_US", "scope": "ecommerce"},
#       {"data": "Top",                     "locale": "en_US", "scope": "tablet"},
#       {"data": "Debardeur pour l'ete",    "locale": "fr_FR", "scope": "ecommerce"},
#       {"data": "Debardeur",               "locale": "fr_FR", "scope": "tablet"}
#     ]
#   }
#
# So product.name is undefined, product.values.name is an array, and
# product.values.name.data is undefined too. Reading "the description" means
# choosing a locale and a channel and finding the one entry that matches both
# -- and there may not be one, because an attribute is only present in the
# combinations somebody filled in. Four entries for one field is the ordinary
# case in a two-locale, two-channel catalogue; a real one has more.
#
# This is what a PIM is for, and it is the shape every storefront integration
# has to unwrap. A client that reads values.name[0].data gets whichever locale
# happens to be first.
#
# Six more, each from the same document:
#
#   1. The envelope is HAL. The array is at _embedded.items, two levels down
#      and behind an underscore, so response.items and response.data are both
#      undefined. Each item carries its own _links.self as well.
#   2. Paging is a link, not a number. The document says of both the page and
#      the search_after parameters, in bold: "Should never be set manually".
#      A client follows _links.next; constructing the URL is going around the
#      contract.
#   3. There are two paging mechanisms on one endpoint, chosen by
#      pagination_type -- page and search_after -- and only the first has page
#      numbers.
#   4. The count is off by default and the reason is stated: with_count is
#      false, and "Be carefull with that, on a big catalog, it can decrease
#      performance in a significant way." That is the third provider in this
#      collection to make counting opt in, after Shopware and commercetools,
#      so it is noted here as a recurring shape rather than a finding.
#   5. A price is a list of amounts and the amounts are strings without a
#      fixed scale. The published example has "15.5" and "15" in the same
#      product, so "15" and "15.00" are the same price and not the same
#      string, and sorting by that field sorts lexically.
#   6. The identifier is itself an attribute -- "the value of the only
#      pim_catalog_identifier attribute" -- and the same product also has a
#      uuid, addressed on a different path. /products/{code} and
#      /products-uuid/{uuid} are the same records under two keys.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - scope, locales and attributes filter inside each product rather than
#     filtering which products come back: the same product is a different
#     payload depending on the query, which is worth knowing and is not
#     served here. A request for one locale gets every locale.
#   - with_count=true adds a count to the envelope and this document does not
#     name the field it arrives under, so the Recipe serves the default and
#     does not model the opt in. Naming it would be a guess.
#   - _links.self and _links.first are fixtures. Only next is rendered from
#     the request, so following it works and following the others reaches
#     nothing.
#   - search_after paging is documented and not served. One mechanism is
#     modelled, and it is the one with page numbers.
#   - Product models, variants, families, attributes, categories, channels,
#     media files and the whole reference-entity model are absent. Reading
#     products only.
#
# The token below is a fixture and belongs to no catalogue.

recipe: akeneo
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://api.akeneo.com/api-reference-index.html

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.akeneo.fixture.token.0000

responses:
  list:
    style: wrapped
    # Two levels down, behind an underscore. HAL puts the payload where a
    # client looking for an array does not.
    key: _embedded.items
    page_field: current_page
    # The link to follow rather than a cursor to put in a parameter, because
    # the document says the parameter should never be set by hand.
    cursor_field: _links.next.href
    cursor_url: absolute
  resource:
    style: bare
  error:
    # {code, message}, where code is the HTTP status again rather than a
    # machine-readable error code. A client switching on it switches on 404.
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"
    status_field: code

resources:
  product:
    id:
      # A slug, and it is itself an attribute value: "the value of the only
      # pim_catalog_identifier attribute".
      style: opaque
      field: identifier
    fields:
      # The other key for the same product, addressed on its own path.
      uuid:
        type: string
      family:
        type: string
      groups:
        type: list
      categories:
        type: list
      enabled:
        type: boolean
        default: true
      # Every attribute, each holding an array of locale and channel variants.
      values:
        type: map
      # Keyed by association type, in capitals.
      associations:
        type: map
      created:
        type: string
      updated:
        type: string

routes:
  - method: GET
    path: /api/rest/v1/products
    resource: product
    operation: list
    fields:
      # The rest of the HAL links. next is rendered from the request; these
      # two are fixtures, which the note at the top of this file says.
      _links.self.href: https://demo.akeneo.test/api/rest/v1/products?page=1&limit=10
      _links.first.href: https://demo.akeneo.test/api/rest/v1/products?page=1&limit=10
    pagination:
      style: page
      # The documented default.
      limit: 10
      limit_param: limit
      cursor_param: page
      first_page: 1

  # By identifier, which is the older of the two keys.
  - method: GET
    path: /api/rest/v1/products/{id}
    resource: product
    operation: get

  # And the same records by uuid, on a path of their own. Cauldron binds the
  # last segment as {id} whatever it is called, so lookup_by is what says the
  # value is matched against the uuid rather than against the identifier.
  - method: GET
    path: /api/rest/v1/products-uuid/{id}
    resource: product
    operation: get
    lookup_by: uuid

errors:
  authentication_error:
    status: 401
    message: Authentication required.

  resource_missing:
    status: 404
    message: Product "missing" does not exist or you do not have permission to access it.

  # Akeneo's own name for a payload it understood and would not accept.
  unprocessable:
    status: 422
    message: Property "values" expects a valid attribute code. Attribute "unknown" does not exist.

  rate_limit:
    status: 429
    message: Too many requests.

fixtures:
  empty: {}

  # The two products from the document's own worked example, with a uuid added
  # to each because the uuid endpoint needs one and the 1.7 example predates
  # it.
  catalogue:
    product:
      - id: top
        uuid: 4d8f5e1a-2b70-4c93-8e06-5a1fd7b3c942
        family: tshirt
        groups: []
        categories:
          - summer_collection
        enabled: true
        values:
          # Two locales, no channel: a name is the same in every channel and
          # different in every language.
          name:
            - data: Top
              locale: en_US
              scope: null
            - data: Debardeur
              locale: fr_FR
              scope: null
          # Two locales times two channels. Four entries for one field, and
          # the two English ones differ -- so a storefront showing the tablet
          # copy on the web is a bug nothing reports.
          description:
            - data: Summer top
              locale: en_US
              scope: ecommerce
            - data: Top
              locale: en_US
              scope: tablet
            - data: Debardeur pour l'ete
              locale: fr_FR
              scope: ecommerce
            - data: Debardeur
              locale: fr_FR
              scope: tablet
          # One entry, no locale and no channel, and the data is itself a list
          # -- one amount per currency, as strings.
          price:
            - locale: null
              scope: null
              data:
                - amount: "15.5"
                  currency: EUR
                - amount: "15"
                  currency: USD
          color:
            - locale: null
              scope: null
              data: black
          size:
            - locale: null
              scope: null
              data: m
        associations:
          PACK:
            products:
              - sunglasses
            groups: []
        created: "2016-06-23T18:24:44+02:00"
        updated: "2016-06-25T17:56:12+02:00"
      - id: cap
        uuid: 91c7e0b4-63da-4f28-a5b1-0e93f6d84271
        family: caps
        groups: []
        categories:
          - summer_collection
        enabled: true
        values:
          name:
            - data: Cap
              locale: en_US
              scope: null
            - data: Casquette
              locale: fr_FR
              scope: null
          description:
            - data: Cap unisex
              locale: en_US
              scope: ecommerce
            - data: Cap unisex
              locale: en_US
              scope: tablet
            - data: Casquette unisexe
              locale: fr_FR
              scope: ecommerce
            - data: Casquette unisexe
              locale: fr_FR
              scope: tablet
          price:
            - locale: null
              scope: null
              data:
                - amount: "20"
                  currency: EUR
                - amount: "20"
                  currency: USD
          color:
            - locale: null
              scope: null
              data: black
        associations: {}
        created: "2016-06-23T18:24:44+02:00"
        updated: "2016-06-25T17:56:12+02:00"

conformance:
  - name: a product has no name
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products/top
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # It has a list of names, each tagged with the language it is in.
        "values.name[0].data": Top
        "values.name[0].locale": en_US
        "values.name[0].scope": null
        "values.name[1].data": Debardeur
        "values.name[1].locale": fr_FR
      absent:
        # Not on the product, and not under values either: values.name is an
        # array, so values.name.data is undefined as well.
        - name
        - "values.name.data"

  - name: and the same attribute appears once per channel as well
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products/top
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # Four entries for one field: two languages times two channels. The
        # two English ones say different things, so picking the wrong channel
        # shows the tablet copy on the web and nothing reports it.
        "values.description[0].locale": en_US
        "values.description[0].scope": ecommerce
        "values.description[0].data": Summer top
        "values.description[1].locale": en_US
        "values.description[1].scope": tablet
        "values.description[1].data": Top
        "values.description[3].locale": fr_FR
        "values.description[3].scope": tablet

  - name: the collection is two levels down behind an underscore
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products?limit=1
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # HAL. response.items and response.data are both undefined, and the
        # page number sits beside the envelope rather than inside it.
        "_embedded.items[0].identifier": top
        current_page: 1
      absent:
        - items
        - data
        - products

  - name: paging is a link to follow rather than a number to construct
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products?limit=1
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        current_page: 1
      matches:
        # The document says of the page parameter, in bold, "Should never be
        # set manually" -- and of search_after the same. The next page is a
        # URL the server built.
        "_links.next.href": page=2
        "_links.self.href": /api/rest/v1/products

  - name: a price is a list of amounts and the amounts are strings
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products/top
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # One value entry with no locale and no channel, whose data is a list
        # with one amount per currency.
        "values.price[0].locale": null
        "values.price[0].scope": null
        "values.price[0].data[0].amount": "15.5"
        "values.price[0].data[0].currency": EUR
        # And no fixed scale: this is fifteen pounds fifty and the next one is
        # fifteen, in the same product, from the document's own example. "15"
        # and "15.00" are the same price and different strings, and sorting on
        # the field sorts lexically.
        "values.price[0].data[1].amount": "15"

  - name: the same product answers on two paths under two keys
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products-uuid/4d8f5e1a-2b70-4c93-8e06-5a1fd7b3c942
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # Reached by uuid, and carrying the identifier that reaches the same
        # record on the other path. The identifier is itself an attribute
        # value, which is why it is a slug rather than a number.
        identifier: top
        uuid: 4d8f5e1a-2b70-4c93-8e06-5a1fd7b3c942
        family: tshirt

  - name: and a uuid is not accepted on the identifier path
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products/4d8f5e1a-2b70-4c93-8e06-5a1fd7b3c942
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      # Two keys, two paths, and they are not interchangeable. A client that
      # stores whichever one it saw and uses whichever path it knows finds
      # nothing.
      status: 404
      body:
        # The HTTP status again, which is what Akeneo puts in code.
        code: 404
      matches:
        message: does not exist

  - name: associations are keyed by a type in capitals
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products/top
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # Not an array of associations with a type field, but an object whose
        # keys are the types -- so the set of keys depends on the catalogue's
        # configuration and code cannot enumerate it in advance.
        "associations.PACK.products[0]": sunglasses
        "associations.PACK.groups": []

  - name: a request naming no page size gets ten
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products
      headers:
        Authorization: Bearer cauldron.akeneo.fixture.token.0000
    expect:
      status: 200
      body:
        # The documented default. Both products fit on it, so there is no next
        # link to follow -- which is the other half of a link-driven pager: it
        # stops by the link being absent rather than by a count running out.
        current_page: 1
        "_embedded.items[1].identifier": cap
      absent:
        - "_links.next"

  - name: the error body repeats the status rather than naming a code
    source: https://github.com/akeneo/pim-api-docs/blob/master/content/swagger/akeneo-web-api.json
    fixture: catalogue
    request:
      method: GET
      path: /api/rest/v1/products
      headers:
        Authorization: Bearer not-a-real-token
    expect:
      status: 401
      body:
        # code is "HTTP status code" in the schema's own words, so a client
        # switching on error.code switches on the number it already has.
        code: 401
        message: Authentication required.
