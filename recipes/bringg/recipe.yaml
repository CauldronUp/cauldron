# Bringg Recipe for Cauldron
#
# The smallest thing Bringg moves is a task -- Bringg's own newer material
# calls it an order, the reference pages still say task throughout, and the
# two words name the identical record. It carries three identifiers at
# once, and Bringg's own documentation ranks them for you.
# developers.bringg.com/reference/order-task-object (fetched 2026-09-01)
# lists id ("The unique ID of this order in Bringg", an integer this Recipe
# never has to mint because no route below can create one -- see why),
# uuid ("A universally unique identifier (UUID) for this order"), and
# external_id ("Your external system's ID for this order"). Then, in its own
# words, a callout on the same page: "We recommend using external IDs...
# This reduces the need for you to map entities that already exist in your
# other systems." Bringg mints two identifiers of its own for every task and
# tells you, in the reference for the object itself, to use neither of them.
#
# **status is a field, a fixed and genuinely small vocabulary, and the
# numbers do not sort in the order the stages happen.**
# developers.bringg.com/reference/task-status (fetched 2026-09-01) gives the
# full table: created=0, assigned=1, on_the_way=2, checked_in=3, done=4,
# accepted=6, cancelled=7, rejected=8, unacknowledged=9. Read that in the
# order a task actually moves through a normal happy path -- created,
# assigned, accepted, on the way, checked in, done -- and the numbers run
# 0, 1, 6, 2, 3, 4. accepted sits third in the sequence and sixth in the
# numbering. Code that treats a bigger status number as "further along" --
# a natural enough guess from a list that starts at 0 and mostly climbs --
# is wrong the moment a task it is watching gets accepted, because 6 is
# bigger than 2, 3 and 4, all three of which are still ahead of it.
#
# **There is a second, independent status field for a different clock
# entirely, and confusing the two is easy because both are just called
# "status" in conversation.** The same reference page's own response table
# also documents preparation_status: acknowledged=0, preparation started=1,
# preparation ended=2, ready for pickup=3, picked up=4, send to preparation
# failed=5 -- a kitchen or warehouse workflow running in parallel with the
# driver's own five-stage status above, on the same record, with its own
# numbering that does not correspond to the driver's at all. A task can be
# accepted (status 6) and still sit at preparation started (preparation_status
# 1); the two fields answer different questions about the same task and nothing
# on the record says so beyond the field names themselves.
#
# **Two of Bringg's own pages disagree about what type status even is.**
# The dedicated task-status reference presents it as a plain name/id table --
# an implicit integer, the way an enum usually is. The Order Details page's
# own "Response and Webhook Data" table, for the identical field on the
# identical object, types status as **string** and then lists the same nine
# digits -- 0, 1, 2, 3, 4, 6, 7, 8, 9 -- as its "Possible values." Both pages
# were fetched today from developers.bringg.com; neither is a cache or a
# stale mirror of the other. A client that trusts the documented type over
# the documented values writes `if (status === "4")`; a client that trusts
# the values writes `if (status === 4)`; Bringg's own materials do not agree
# which one is right, and this Recipe has no live-observed body to settle it
# with either -- see the fidelity gaps for why.
#
# **History is not a list beside the record -- it is a spread of individual
# timestamp fields on the record itself, plus events that are not retained
# anywhere this Recipe could find.** The same Order Details response table
# names accept_time, acknowledged_at, cancelled_at, ended_time, started_time,
# last_assigned_time, and five more preparation_*_time_actual /
# preparation_*_time_planned columns -- one column per milestone, all on the
# one order object, rather than an array of {event, time} entries the way
# Onfleet's completionDetails.events or Radar's events array (see
# radar/recipe.yaml) are. Separately, Bringg fires a webhook per transition --
# order-created, order-accepted-by-driver, order-eta-changed, order-is-done,
# order-is-cancelled and others are each their own reference page -- but
# nothing in the 243-page reference index this Recipe crawled documents a
# GET that lists a task's own event history back. The webhooks are pushed
# once, live, to whichever endpoint you registered; asking Bringg "what
# happened to this task last Tuesday" through the API is not a request this
# reference describes how to make.
#
# **None of the above is modelled as a route, and the reason is the API's
# own addressing scheme, not laziness.** Every task and order operation this
# Recipe found -- create_task, get_task, cancel_task, get_open_tasks,
# update_driver_location, all 40-plus of them -- resolves to a path shaped
# /{opaque_action_code}/{service_uuid1}/{service_uuid2}, confirmed by
# fetching get_task, create_task, get_open_tasks, cancel_task and
# update_driver_location directly and reading each one's embedded api.path:
# a fixed short code identifying the operation (get_open_tasks is Qkdi30cw,
# create_task is 6f15901b, cancel_task is kmae04kd -- three different codes
# for three different verbs on the same resource), followed by two UUIDs
# that identify the calling merchant's own service integration and exist
# only after an account is created. There is no fixed, documented literal
# value for either UUID anywhere in the reference -- they are not a
# constant Bringg publishes, they are minted per merchant -- so there is no
# path this Recipe could write down that would mean anything to a second
# Bringg account, let alone to nobody's account at all. Declaring a route
# on invented UUIDs would be inventing an account identifier, which this
# task was told not to do, so the task and order surface is described here,
# in full, and served nowhere below.
#
# **The one surface with fixed, documented, unauthenticated-reachable paths
# is the OAuth layer itself, at a different host --
# admin-api.bringg.com -- and it is what this Recipe actually serves.**
# Checked live, 2026-09-01: GET /oauth/token/info with no Authorization
# header at all, and the identical request with "Authorization: Bearer
# junktoken12345", answer the byte-identical body --
# {"error":"invalid_token","error_description":"The access token is
# invalid","state":"unauthorized"}, 401, with a
# WWW-Authenticate: Bearer realm="Doorkeeper", error="invalid_token"...
# header repeating the same two words. Doorkeeper -- the Ruby OAuth2
# provider gem this error shape and the realm both name outright -- does
# not distinguish a request that presented nothing from one that presented
# rubbish; both fail the identical token lookup the identical way.
#
# **Bringg's own OAuth error text is broken for the one case an integrator
# is likeliest to hit first.** POST /oauth/token with no grant_type (the
# simplest possible mistake configuring a first request) answers 400 with
# error_description: "Translation missing:
# en.doorkeeper.errors.messages.invalid_request.missing_param" -- an
# untranslated Rails i18n lookup key, sent as though it were the sentence,
# to production, over HTTPS, on the response body of a public API. Checked
# live, 2026-09-01. Nobody who reads that string learns which parameter was
# missing.
#
# **Two different auth schemes answer on this one host, and this Recipe
# wires only one of them.** POST /oauth/token, GET /oauth/token/info and
# POST /oauth/introspect are Doorkeeper's OAuth2 Bearer flow, described
# above. GET /oauth/applications and /oauth/scopes -- the Applications and
# Scopes management APIs, which Bringg's own docs say need "an admin user
# in Bringg" authenticating with "username and password" -- answer a
# completely different envelope: {"message":"Unauthorized"}, checked live
# with no credential and with a junk HTTP Basic value, both landing on the
# identical body. Cauldron's own auth check is one scheme per Recipe (see
# internal/recipe/auth.go), and the Bearer flow is the one every ordinary
# API consumer actually uses, so it is the one wired; the Basic-authenticated
# management surface is recorded here as observed rather than served.
#
# **Routing and method both resolve before the credential does, and the
# failure carries no body at all.** Checked live, 2026-09-01, against
# admin-api.bringg.com: a made-up path answers 404 with Content-Length: 0 --
# not an empty JSON object, zero bytes -- whether or not a credential is
# attached. DELETE on /oauth/token/info and PATCH on /oauth/applications,
# neither of which registers either verb, answer the identical empty 404,
# also with no credential needed to reach it. Nothing about any of these
# three failures ever mentions a token.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The task/order object -- id, uuid, external_id, status,
#     preparation_status, every per-milestone timestamp, the
#     automatically_assigned / automatically_cancelled / automatically_ended /
#     automatically_started attribution enums, and everything else on that
#     object -- is documented at length in this header and declared nowhere
#     below. See above for why: there is no path this Recipe could write
#     down for it without fabricating a merchant's own service UUIDs.
#   - GET /oauth/applications, GET /oauth/scopes and POST /oauth/introspect
#     are real, documented, and checked live for their auth behaviour (see
#     the header); none of the three is routed, because the first two sit
#     behind Basic admin credentials rather than the Bearer scheme this
#     Recipe wires, and introspect's own useful response needs a genuinely
#     valid token this Recipe does not hold to demonstrate honestly.
#   - POST /oauth/token itself -- the token-mint exchange -- is not routed.
#     Its two live failure shapes (invalid_client for a bad client_id/secret
#     pair, invalid_request for a missing grant_type) are quoted verbatim
#     above with a verified date, but the route would need to sit outside
#     this Recipe's Bearer-credential gate entirely, the same way this
#     format already states for Census's PUT and DELETE routes, and adding
#     a second ungated route just to carry two error bodies already fully
#     quoted in prose was judged not worth the mechanism.
#   - No upstream.spec. Bringg's reference lives on ReadMe.io as ordinary
#     per-endpoint pages; no combined OpenAPI document at a stable,
#     independently fetchable URL was found for either the OAuth surface or
#     the task API.
#   - No account exists and no client_id, client_secret or access token was
#     ever requested, guessed or used. Every case below carrying a verified
#     date was struck against a live, unauthenticated or deliberately
#     wrong-credentialed request; the one case that is not -- GET
#     /oauth/token/info answering its documented success body -- is quoted
#     from developers.bringg.com/docs/bringg-api-access-management exactly
#     as published and carries no verified date, because no token exists
#     here that could have called it.

recipe: bringg
capability: shipping
version: 0.1.0

upstream:
  api: oauth2
  docs: https://developers.bringg.com/docs/bringg-api-access-management

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-bringg-fixture-access-token-0000000000000000
  # No header at all and a well-formed-but-wrong bearer token land on the
  # identical Doorkeeper body -- see the header. absent_error,
  # malformed_error and rejected_error are all left unset on purpose: one
  # message, authentication_error below, covers everything this Recipe
  # actually struck.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    # {"error": "invalid_token", "error_description": "...", ...} -- RFC
    # 6749's own error shape, which Doorkeeper implements by default. error
    # is the short code; error_description carries the sentence.
    style: flat
    message_field: error_description
    code_field: error

resources:
  # What GET /oauth/token/info answers about the credential itself -- no id
  # in the path, nothing to scope, the same shape Turso's api_token and
  # GitHub's /user are: the whole point of the route is that there is
  # nothing to address by. See the header for why this is the only surface
  # on this whole provider this Recipe could reach without fabricating an
  # account.
  token_info:
    id:
      style: opaque
      field: "-"
    fields:
      resource_owner_id:
        type: string
      scope:
        type: list
      expires_in:
        type: integer
      # {"uid": "..."} -- the OAuth application this token was minted for.
      application:
        type: map
      created_at:
        type: timestamp

routes:
  - method: GET
    path: /oauth/token/info
    resource: token_info
    operation: get
    id_from: auth

errors:
  # The one sentence this Recipe ever saw from the Bearer flow, whether the
  # header was absent or merely wrong -- see the header.
  authentication_error:
    status: 401
    code: invalid_token
    message: "The access token is invalid"
    headers:
      Www-Authenticate: 'Bearer realm="Doorkeeper", error="invalid_token", error_description="The access token is invalid"'
    fields:
      # Doorkeeper's own third field on this one failure -- not present on
      # its other two shapes (invalid_client, invalid_request), which is
      # why this is declared per-error rather than as a Recipe-wide
      # constant. Quoted in the header, not routed -- see the fidelity gaps.
      state: unauthorized

  # unknown_route is left undeclared: Cauldron's own generic 404 already
  # matches Bringg's status. method_not_allowed is overridden for status
  # alone -- Cauldron's own default is 405, and Bringg's admin-api gives no
  # 405 anywhere this Recipe could find; a wrong method on a real path
  # answers the identical 404 an unrouted path does. Neither entry's body
  # is overridden: the live body for both cases is zero bytes --
  # Content-Length: 0, no JSON, no text, nothing -- and this format's error
  # table has no way to say that. An Error's message is applied only when
  # it is non-empty (internal/runtime/errors.go), so a declared message: ""
  # is read as "not overridden" rather than as "override with nothing," and
  # this Recipe's cases below assert the status genuinely struck live
  # rather than claim a zero-byte body the mechanism cannot produce.
  method_not_allowed:
    status: 404

fixtures:
  empty: {}

  account:
    token_info:
      - resource_owner_id: "Merchant:1"
        scope:
          - services
        expires_in: 1779
        application:
          uid: "KjBYkBNQEIxjhDZ_3kNtM28oBvvJEq0yUJKDIiYCCDg"
        created_at: 1582558663

conformance:
  - name: no credential at all is invalid_token
    source: https://admin-api.bringg.com/oauth/token/info
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /oauth/token/info
    expect:
      status: 401
      headers:
        Www-Authenticate: 'Bearer realm="Doorkeeper", error="invalid_token", error_description="The access token is invalid"'
      body:
        error: invalid_token
        error_description: "The access token is invalid"
        state: unauthorized

  - name: a well-formed but wrong bearer token answers the identical body
    source: https://admin-api.bringg.com/oauth/token/info
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /oauth/token/info
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error: invalid_token
        error_description: "The access token is invalid"
        state: unauthorized

  - name: an unrouted path 404s with no credential needed to reach it
    # The live body is Content-Length 0 -- see the header and the note
    # above the errors table for why this Recipe asserts the status and
    # not the exact emptiness.
    source: https://admin-api.bringg.com/nosuchroute12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute12345
    expect:
      status: 404

  - name: and attaching a credential to that same unrouted path changes nothing
    source: https://admin-api.bringg.com/nosuchroute12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute12345
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404

  - name: a method a real path does not register also 404s, not 405
    source: https://admin-api.bringg.com/oauth/token/info
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /oauth/token/info
    expect:
      status: 404

  - name: a valid token's own info answers Bringg's documented shape
    # Quoted exactly from developers.bringg.com/docs/bringg-api-access-management
    # ("Should your token be valid, you will get a response like this").
    # No token exists here that could call this live -- see the header.
    source: https://developers.bringg.com/docs/bringg-api-access-management
    fixture: account
    request:
      method: GET
      path: /oauth/token/info
      headers:
        Authorization: Bearer cauldron-bringg-fixture-access-token-0000000000000000
    expect:
      status: 200
      body:
        resource_owner_id: "Merchant:1"
        scope:
          - services
        expires_in: 1779
        application.uid: "KjBYkBNQEIxjhDZ_3kNtM28oBvvJEq0yUJKDIiYCCDg"
        created_at: 1582558663
