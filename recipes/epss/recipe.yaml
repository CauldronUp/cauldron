# FIRST EPSS Recipe for Cauldron
#
# One of the keys has a hyphen in it.
#
#   {"status": "OK", "status-code": 200, ...}
#
# status-code cannot be reached with a dot in any language whose dot operator
# takes an identifier. In JavaScript, response["status-code"] is 200 and
# response.status-code is response.status minus a variable called code, which is
# "OK" minus undefined -- NaN, at runtime, with no error and no warning. The
# field most likely to be read by code checking whether the request worked is
# the one most likely to be read wrong.
#
# **And the status is stated three times.** The HTTP status line says 200,
# "status" says "OK", and "status-code" says 200 again. Three sources for one
# fact, in one response, and a client has to decide which one it trusts.
#
# Written against the live API rather than a document: every case below was
# checked against api.first.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The probability is a string, to nine decimal places. epss is
#      "0.999990000" and percentile is "1.000000000" -- quoted, padded, and
#      wrong for every numeric comparison that does not parse them first. A
#      client sorting by epss as text puts "0.09" above "0.1".
#   2. A CVE that is not a CVE is a 200. ?cve=notacve answers total 0 and an
#      empty array, exactly as an unknown but well-formed CVE does, so there is
#      nothing to tell a typo from a genuine absence. Omitting cve entirely,
#      though, is a 404 -- the malformed request succeeds and the incomplete
#      one fails.
#   3. Failing makes the data private. A 200 carries "access": "public" and a
#      404 carries "access": "private", so a field describing what may be done
#      with the data changes because the request did not work. And "message" on
#      a failure is "errorNotFound" -- an identifier in camelCase, in a field
#      named for a sentence.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Scores move. The values served are the ones recorded on the date in the
#     cases, and the real endpoint rescores every CVE daily.
#   - Two scores are served, of 366,298.
#   - limit is clamped rather than refused: ?limit=99999 answers 200 with
#     "limit": 10000. That is recorded here rather than served, because the
#     Recipe does not model the parameter.

recipe: epss
capability: observability
version: 0.1.0

upstream:
  api: epss
  docs: https://www.first.org/epss/api

auth:
  # Public, no key.
  scheme: none

responses:
  success:
    fields:
      # Three statements of one fact, two of them in the body.
      status: OK
      # The hyphen. Unreachable with a dot in most languages, and silently
      # wrong rather than loud about it in JavaScript.
      status-code: 200
      version: "1.0"
      # "private" on a failure.
      access: public
      offset: 0
      limit: 100
  list:
    style: wrapped
    key: data
    count_field: total
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  score:
    id:
      style: opaque
      field: cve
    fields:
      # Declared as well as named above, so the listing can be narrowed by it.
      cve:
        type: string
      # A probability, quoted, to nine decimal places.
      epss:
        type: string
      percentile:
        type: string
      # The day it was scored, not the day it was asked for.
      date:
        type: string

routes:
  - method: GET
    path: /data/v1/epss
    resource: score
    operation: list
    pagination:
      # limit and offset, struck live on 2026-09-05 and echoed straight back
      # in the envelope this Recipe already serves: a bare request answers
      # "offset": 0, "limit": 100, "total": 368543, and ?limit=2&offset=2
      # moves the window -- a different CVE first, two records deep.
      #
      # A hundred by default, from that same echo, where this Recipe was
      # being paged at ten.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
    filters:
      - param: cve
        field: cve

  # Leaving cve out entirely, which is the one way of asking that fails.
  - method: GET
    path: /data/v1/epss-no-cve
    error: not_found

errors:
  not_found:
    status: 404
    # An identifier in camelCase, in a field named for a sentence.
    message: errorNotFound
    fields:
      status: Not Found
      status-code: 404
      version: "1.0"
      # Public on a 200, private on a 404. The licence follows the outcome.
      access: private
      data: []

fixtures:
  empty: {}

  scores:
    score:
      # Log4Shell, at the top of the distribution.
      - id: CVE-2021-44228
        cve: CVE-2021-44228
        epss: "0.999990000"
        percentile: "1.000000000"
        date: "2026-08-29"
      - id: CVE-2026-9999
        cve: CVE-2026-9999
        epss: "0.002250000"
        percentile: "0.130190000"
        date: "2026-08-29"

conformance:
  - name: one of the keys has a hyphen in it
    source: https://api.first.org/data/v1/epss?cve=CVE-2021-44228
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss?cve=CVE-2021-44228
    expect:
      status: 200
      body:
        # Reachable only with a subscript. A dot makes this a subtraction.
        status-code: 200
        # And the same fact again, in words, beside it.
        status: OK

  - name: the probability is a string to nine decimal places
    source: https://api.first.org/data/v1/epss?cve=CVE-2021-44228
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss?cve=CVE-2021-44228
    expect:
      status: 200
      body:
        "data[0].cve": CVE-2021-44228
        # Quoted, padded, and wrong for any numeric comparison that does not
        # parse it first.
        "data[0].epss": "0.999990000"
        "data[0].percentile": "1.000000000"
        "data[0].date": "2026-08-29"

  - name: and the padding is not cosmetic
    source: https://api.first.org/data/v1/epss?limit=2
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss
    expect:
      status: 200
      body:
        # Nine decimals on a score three orders of magnitude smaller, so the
        # width is fixed and the precision is not.
        "data[1].epss": "0.002250000"
        "data[1].percentile": "0.130190000"

  - name: the envelope states a version and a licence
    source: https://api.first.org/data/v1/epss?cve=CVE-2021-44228
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss?cve=CVE-2021-44228
    expect:
      status: 200
      body:
        version: "1.0"
        access: public
        offset: 0
        limit: 100
        total: 1

  - name: leaving the parameter out entirely is a 404
    source: https://api.first.org/data/v1/epss&limit=2
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss-no-cve
    expect:
      # Where a malformed CVE is a 200. The incomplete request fails and the
      # wrong one succeeds.
      status: 404
      body:
        # An identifier in camelCase, in a field named for a sentence.
        message: errorNotFound
        status: Not Found
        status-code: 404

  - name: and failing makes the data private
    source: https://api.first.org/data/v1/epss&limit=2
    verified: "2026-08-30"
    fixture: scores
    request:
      method: GET
      path: /data/v1/epss-no-cve
    expect:
      status: 404
      body:
        # "public" on a 200. A field describing what may be done with the data
        # changes because the request did not work.
        access: private
      body_matches: '"data": ?\[\]'
