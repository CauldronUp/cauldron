# Crossref Recipe for Cauldron
#
# A date is an array inside an array, and it is not always the same length.
#
#   "issued": {"date-parts": [[2013, 7, 31]]}
#   "issued": {"date-parts": [[1970, 6]]}
#
# The outer array is there because the field can hold a range; almost every
# record uses one element. The inner one is year, month, day -- and it stops
# wherever the metadata stopped. Codd's 1970 paper has two elements and no day.
# Nothing anywhere says which precision arrived, so date-parts[0][2] is a number
# on one work and undefined on the next, and building a Date from three
# positional arguments silently reads the month as the day.
#
# **And one work has three publication dates at two precisions.** The same
# document carries
#
#   "published":        {"date-parts": [[2013, 7, 31]]}
#   "published-online": {"date-parts": [[2013, 7, 31]]}
#   "published-print":  {"date-parts": [[2013, 8]]}
#
# so "when was this published" has three answers, one of them a month, and the
# print date is after the online one.
#
# Written against the live API rather than a document: every case below was
# checked against api.crossref.org on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. title is an array. So are container-title, short-container-title,
#      original-title and ISSN. A paper has one title and it arrives in a list
#      of one, so work.title renders as an array everywhere it is printed.
#   2. A DOI that does not resolve is the bare plain text "Resource not found."
#      with a 404 -- no envelope, no status field, text/plain -- from an API
#      whose every success is a four-field JSON envelope.
#   3. created carries the same instant three ways: date-parts, date-time and
#      timestamp, the last in epoch milliseconds. published and issued carry
#      only date-parts, so two date fields in one record disagree about how
#      much of a date they will give you.
#   4. The envelope is status, message-type, message-version and message. The
#      version is of the envelope rather than the API, it has read 1.0.0 for
#      years, and status is the string "ok" beside an HTTP 200.
#   5. score is on a single-work lookup. It is the relevance of the result to
#      the query, on a request that was not a query, and it is 1.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The index is served rather than searched. /works?query= takes a free-text
#     search with filters and facets, and this Recipe answers with the works its
#     fixture holds.
#   - A work comes back with forty-odd top-level keys including reference, which
#     is one object per citation. The fixture holds the subset the cases turn
#     on and says so.
#   - indexed moves whenever the record is re-crawled, and its timestamp and
#     build version move with it. Both are served as recorded.
#   - The polite pool is not modelled. Sending a mailto in the User-Agent gets a
#     request onto a better-resourced set of machines, which is a routing
#     decision rather than a response shape.
#
# The works below are public and were recorded on the date in the cases.

recipe: crossref
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://api.crossref.org/swagger-ui/index.html

auth:
  # Public.
  scheme: none

responses:
  resource:
    # status, message-type and message-version beside the work.
    style: wrapped
    key: message
  error:
    # Bare prose, from an API whose successes are a four-field envelope.
    style: text

resources:
  work:
    id:
      style: opaque
      # A DOI is a prefix and a suffix with a slash between them, so the path
      # carries it in two segments and the body carries it whole.
      field: "-"
      carried_by: DOI
    fields:
      DOI:
        type: string
      # The registrant's half of the DOI, which is also the path's first
      # segment, and the API does echo it.
      prefix:
        type: string
      # A list of one, for a paper with one title.
      title:
        type: list
      container-title:
        type: list
      short-container-title:
        type: list
      type:
        type: string
      publisher:
        type: string
      # A numeric string.
      member:
        type: string
      # A hyphen inside a string, not two numbers.
      page:
        type: string
      volume:
        type: string
      issue:
        type: string
      ISSN:
        type: list
      language:
        type: string
      URL:
        type: string
      source:
        type: string
      # The relevance of the result to a query, on a request that made none.
      score:
        type: number
      reference-count:
        type: integer
      is-referenced-by-count:
        type: integer
      author:
        type: list
      # Three publication dates at two precisions.
      published:
        type: map
      published-online:
        type: map
      published-print:
        type: map
      issued:
        type: map
      # The same instant three ways.
      created:
        type: map
      deposited:
        type: map
      indexed:
        type: map

routes:
  - method: GET
    path: /works/{prefix}/{id}
    resource: work
    operation: get
    scope:
      - prefix
    not_found: resource_missing
    fields:
      # The envelope. The version is of the envelope rather than the API, and
      # status is the string "ok" beside an HTTP 200.
      status: ok
      message-type: work
      message-version: 1.0.0

errors:
  resource_missing:
    status: 404
    headers:
      # No charset, and not JSON.
      Content-Type: text/plain
    message: Resource not found.

fixtures:
  empty: {}

  library:
    work:
      - id: nature12373
        prefix: "10.1038"
        DOI: 10.1038/nature12373
        # One title, in a list.
        title:
          - Nanometre-scale thermometry in a living cell
        container-title:
          - Nature
        short-container-title:
          - Nature
        type: journal-article
        publisher: Springer Science and Business Media LLC
        member: "297"
        page: 54-58
        volume: "500"
        issue: "7460"
        ISSN:
          - 0028-0836
          - 1476-4687
        language: en
        URL: https://doi.org/10.1038/nature12373
        source: Crossref
        # Relevance, on a lookup that asked nothing.
        score: 1
        reference-count: 30
        is-referenced-by-count: 1810
        author:
          - given: G.
            family: Kucsko
            sequence: first
            affiliation: []
            role:
              - vocabulary: crossref
                role: author
        # Three dates, two precisions, and the print one is after the online.
        published:
          date-parts:
            - - 2013
              - 7
              - 31
        published-online:
          date-parts:
            - - 2013
              - 7
              - 31
        published-print:
          # Two elements. No day.
          date-parts:
            - - 2013
              - 8
        issued:
          date-parts:
            - - 2013
              - 7
              - 31
        # The same instant three ways, where published carries only one.
        created:
          date-parts:
            - - 2013
              - 7
              - 30
          date-time: "2013-07-30T08:59:50Z"
          timestamp: 1375174790000
        deposited:
          date-parts:
            - - 2023
              - 5
              - 18
          date-time: "2023-05-18T14:13:47Z"
          timestamp: 1684419227000
        indexed:
          date-parts:
            - - 2026
              - 8
              - 28
          date-time: "2026-08-28T03:37:03Z"
          timestamp: 1787888223227
          version: build-2784847793

      # A 1970 paper whose metadata stops at the month.
      # Quoted: unquoted, YAML reads this suffix as a floating-point number.
      - id: "362384.362685"
        prefix: "10.1145"
        DOI: 10.1145/362384.362685
        title:
          - A relational model of data for large shared data banks
        type: journal-article
        issued:
          # Two elements, where the work above has three.
          date-parts:
            - - 1970
              - 6
        published:
          date-parts:
            - - 1970
              - 6
        author:
          - given: E. F.
            family: Codd
            sequence: first
            affiliation:
              - name: IBM Research Lab, San Jose, CA
            role:
              - vocabulary: crossref
                role: author

conformance:
  - name: a date is an array inside an array
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # The outer array is for ranges and almost nothing uses one; the inner
        # is year, month, day.
        "message.issued.date-parts[0][0]": 2013
        "message.issued.date-parts[0][1]": 7
        "message.issued.date-parts[0][2]": 31
      absent:
        - message.issued.date-parts[1]

  - name: and it stops wherever the metadata stopped
    source: https://api.crossref.org/works/10.1145/362384.362685
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1145/362384.362685
    expect:
      status: 200
      body:
        # Two elements and no day, with nothing saying so, so date-parts[0][2]
        # is a number on one work and undefined on the next.
        "message.issued.date-parts[0][0]": 1970
        "message.issued.date-parts[0][1]": 6
      absent:
        - message.issued.date-parts[0][2]

  - name: one work has three publication dates at two precisions
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # "When was this published" has three answers, one of them a month, and
        # the print date is after the online one.
        "message.published-online.date-parts[0][2]": 31
        "message.published-print.date-parts[0][1]": 8
        "message.published.date-parts[0][1]": 7
      absent:
        - message.published-print.date-parts[0][2]

  - name: the title is an array
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # A paper has one title and it arrives in a list of one, and so does
        # the journal's name, twice.
        "message.title[0]": Nanometre-scale thermometry in a living cell
        "message.container-title[0]": Nature
        "message.short-container-title[0]": Nature
        "message.ISSN[0]": 0028-0836
      absent:
        - message.title[1]

  - name: created carries the same instant three ways
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # date-parts, an ISO string and epoch milliseconds -- where published
        # beside it carries only the first.
        "message.created.date-parts[0][2]": 30
        "message.created.date-time": "2013-07-30T08:59:50Z"
        "message.created.timestamp": 1375174790000
      absent:
        - message.published.date-time
        - message.published.timestamp

  - name: the envelope carries a version of itself
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # The version is of the envelope rather than the API, it has read
        # 1.0.0 for years, and status is the string "ok" beside an HTTP 200.
        status: ok
        message-type: work
        message-version: 1.0.0
        # And the DOI whole, where the path carried it in two segments.
        "message.DOI": 10.1038/nature12373
        "message.prefix": "10.1038"

  - name: a lookup carries a relevance score for a query it did not make
    source: https://api.crossref.org/works/10.1038/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1038/nature12373
    expect:
      status: 200
      body:
        # 1, on a request that asked for one DOI by name.
        "message.score": 1
        # And two counts with hyphenated names pointing in opposite
        # directions: what this work cites, and what cites it.
        "message.reference-count": 30
        "message.is-referenced-by-count": 1810
        "message.member": "297"
        "message.page": 54-58

  - name: a DOI that does not resolve is bare prose
    source: https://api.crossref.org/works/10.9999/notarealdoi
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.9999/notarealdoi
    expect:
      # No envelope, no status field, text/plain with no charset -- from an
      # API whose every success is a four-field JSON envelope.
      status: 404
      header_matches:
        Content-Type: '^text/plain$'
      body_matches: '^Resource not found\.$'

  - name: a real suffix under the wrong registrant is not found
    source: https://api.crossref.org/works/10.1145/nature12373
    verified: "2026-08-28"
    fixture: library
    request:
      method: GET
      path: /works/10.1145/nature12373
    expect:
      # The two halves of a DOI are not independent: nature12373 exists under
      # 10.1038 and nowhere else, and asking for it under another registrant
      # gets the same prose as a DOI nobody has ever minted.
      status: 404
      body_matches: '^Resource not found\.$'

  # The names. This Recipe declares 10 field(s) on a work that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "a work carries the field names this Recipe declares"
    source: "https://api.crossref.org/works/10.1038/nature12373"
    fixture: library
    request:
      method: GET
      path: "/works/10.1038/nature12373"
    expect:
      status: 200
      body:
        "message.URL": "https://doi.org/10.1038/nature12373"
        "message.issue": "7460"
        "message.language": "en"
        "message.publisher": "Springer Science and Business Media LLC"
        "message.source": "Crossref"
        "message.type": "journal-article"
        "message.volume": "500"

  # The names. This Recipe declares 3 field(s) on a work that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a work carries the field names this Recipe declares, and 3 more of them"
    source: "https://api.crossref.org/works/10.1038/nature12373"
    fixture: library
    request:
      method: GET
      path: "/works/10.1038/nature12373"
    expect:
      status: 200
      body:
        "message.author[0].family": "Kucsko"
        "message.deposited.date-parts[0][0]": 2023
        "message.indexed.date-parts[0][0]": 2026


