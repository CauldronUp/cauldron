# Builder.io Content API Recipe for Cauldron
#
# The content listing, struck live on 2026-09-13 with no key, with a wrong key,
# on a path that does not exist, with a method the path does not take, on a
# model that does not exist, on three API versions, and -- for the record
# shapes -- with the public demo key Builder publishes in its own quickstart.
#
# **One API, three error envelopes.** Struck live:
#
#   no key, or a wrong one
#     401 {"status":401,"message":"Authorization required",
#          "detail":"For help please contact support@builder.io"}
#
#   a model that does not exist
#     404 {"status":404,"message":"Model not found"}
#
#   a path that does not exist, or a method it does not take
#     404 {"errors":[{"status":"404","title":"Route Does Not Exist",
#          "detail":"Cannot GET `/api/v3/cauldron-nope`"}]}
#
# Three shapes: a bare object with `message`, the same object without `detail`,
# and an array under `errors` whose entries use `title` instead. And `status` is
# the number 401 in the first two and the string "404" in the third, so code
# comparing it has to know which failure it is looking at before it can read the
# field that says which failure it is.
#
# **Every mistake made without a key is the same 401.** No key, a wrong key, an
# unrouted path, a wrong method and a version that serves something else all
# answer "Authorization required" with a support email address in `detail`. The
# other two envelopes only appear once a valid key is in the URL.
#
# **`/api/v1/content/{model}` answers 200 with Builder's marketing homepage.**
# With a valid key:
#
#   GET /api/v1/content/page   200  text/html   <title>Builder.io: Collaborative Development Platform</title>
#   GET /api/v2/content/page   200  application/json
#   GET /api/v3/content/page   200  application/json
#
# A client pinned to v1 gets a web page, with a success status, and `.json()`
# throws on it.
#
# **Two fields that read as booleans are strings.** `published` is
# `"published"`, and `hidden` is the string `"false"` -- so `if (item.hidden)`
# is true for a page that is not hidden, and `if (item.published)` is true
# whatever the state.
#
# **The envelope has no count, no cursor and no end.** `{"results":[…]}` and
# nothing else. Paging is `limit` and `offset`, an offset past the end answers
# `{"results":[]}`, and nothing in a full page says whether another exists.
#
# **`rev` is the same on unrelated records.** Two pages created a year apart,
# by different users, both carry `"rev":"taqizx9mb0d"` -- a field named for a
# revision that does not vary with the record.
#
# **A publicly readable record carries a preview URL with a permission grant in
# it.** `meta.lastPreviewUrl` is a link whose query string includes
# `builder.user.permissions=read,create,publish,editCode,editDesigns,admin,…`,
# percent-encoded, on content any reader of the public key can fetch.
#
# **The same asset is addressed two ways in one response.** `screenshot` is
# `…/assets%2F<key>%2F<id>` and an image inside the page body is
# `…/assets/<key>/<id>` -- the slashes encoded in one and not the other.
#
# Also pinned: `createdBy` and `lastUpdatedBy` are 28-character Firebase auth
# uids, served to anyone holding the public read key; `query` carries the
# record's own targeting rules as objects tagged `"@type":
# "@builder.io/core:Query"`, and the blocks inside `data` are tagged
# `"@type": "@builder.io/sdk:Element"` with an `@version`, which look like
# JSON-LD and are not; `testRatio` and `variations` put A/B state on every
# record; and the credential is a query parameter, by design, because it is
# meant to ship inside a browser.

recipe: builderio
capability: cms
version: 0.1.0

upstream:
  api: v3
  docs: https://www.builder.io/c/docs/content-api

auth:
  scheme: query
  param: apiKey
  # A bare secret, meant to be public: it ships in client-side JavaScript.
  keys:
    - Cau1dr0nF1xtureK3y0
  absent_error: authorization_required
  rejected_error: authorization_required
  malformed_error: authorization_required
  # Everything is this 401 until a valid key is in the URL.

responses:
  list:
    style: wrapped
    key: results
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  content:
    id:
      field: id
      style: hex
      length: 32
    fields:
      name:
        type: string
      # The string "published", under a key called published.
      published:
        type: string
      modelId:
        type: string
      createdDate:
        type: timestamp_ms
      firstPublished:
        type: timestamp_ms
      lastUpdated:
        type: timestamp_ms
      # 28-character Firebase auth uids.
      createdBy:
        type: string
      lastUpdatedBy:
        type: string
      data:
        type: map
      meta:
        type: map
      query:
        type: list
      folders:
        type: list
      # The same value on records that share nothing else.
      rev:
        type: string
      screenshot:
        type: string
      testRatio:
        type: number
      variations:
        type: map

routes:
  # A success status, a web page, and a client that called .json() on it.
  - method: GET
    path: /api/v1/content/page
    raw:
      content_type: text/html; charset=utf-8
      text: "<!doctype html><html lang=\"en\"><head><meta charset=\"UTF-8\"/><title>Builder.io: Collaborative Development Platform</title></head><body></body></html>"

  - method: GET
    path: /api/v3/content/page
    resource: content
    operation: list
    pagination:
      style: offset
      limit: 30
      limit_param: limit
      cursor_param: offset

  # Any other model, once the key is good.
  - method: GET
    path: /api/v3/content/{model}
    error: model_not_found

errors:
  authorization_required:
    status: 401
    message: Authorization required
    fields:
      # A number here, a string in the third envelope.
      status: 401
      # An email address, as the machine-readable detail.
      detail: For help please contact support@builder.io

  model_not_found:
    status: 404
    message: Model not found
    fields:
      status: 404
    # And no detail at all, unlike the 401.

  unknown_route:
    status: 404
    # A third envelope: an array, under errors, with title instead of message.
    style: list
    key: errors
    message_field: detail
    type_field: title
    message: "Cannot GET `{detail}`"
    type: Route Does Not Exist
    fields:
      # The same field, as a string this time.
      status: "404"

  method_not_allowed:
    status: 404
    style: list
    key: errors
    message_field: detail
    type_field: title
    message: "Cannot PUT `/api/v3/content/page`"
    type: Route Does Not Exist
    fields:
      status: "404"

fixtures:
  empty:
    content: []

  pages:
    content:
      - id: 42f1c11ede97484ebb7e5d2e5386dbad
        name: Platform overview
        # The string, not the boolean.
        published: published
        modelId: 38834b40eced4c24947a3909cb42be3e
        createdDate: 1773159317174
        firstPublished: 1773159317174
        lastUpdated: 1773159941778
        createdBy: EePg86twR1c0vPeTl0c9xrEEna83
        lastUpdatedBy: EePg86twR1c0vPeTl0c9xrEEna83
        data:
          title: Platform overview
          url: /platform-overview
          description: A page in a Builder space
          # Also a string.
          hidden: "false"
          state:
            deviceSize: large
            location:
              path: ""
              query: {}
        meta:
          kind: page
          hasAutosaves: true
          hasLinks: false
          breakpoints:
            small: 767
            medium: 1023
          # A permission grant, in a link, on a publicly readable record.
          lastPreviewUrl: https://example.builder.codes/platform-overview?apiKey=Cau1dr0nF1xtureK3y0&builder.user.permissions=read%2Ccreate%2Cpublish%2CeditCode%2CeditDesigns%2Cadmin
        query:
          - "@type": "@builder.io/core:Query"
            operator: is
            property: urlPath
            value: /platform-overview
        folders: []
        rev: taqizx9mb0d
        # Percent-encoded slashes.
        screenshot: https://cdn.builder.io/api/v1/image/assets%2FCau1dr0nF1xtureK3y0%2F628eef8791ff479b9f8e448e43d3a53c
        testRatio: 1
        variations: {}
      - id: b106e82551da4955a1c69a6defbe2eb8
        name: Pricing
        published: published
        modelId: 38834b40eced4c24947a3909cb42be3e
        createdDate: 1762780174694
        firstPublished: 1762780200633
        lastUpdated: 1762795142342
        createdBy: b0272BAHcDTw8MCeDwLmdq7Uykp2
        lastUpdatedBy: b0272BAHcDTw8MCeDwLmdq7Uykp2
        data:
          title: Pricing
          url: /pricing
          hidden: "false"
          themeId: false
          state:
            deviceSize: large
            location:
              path: ""
              query: {}
        meta:
          kind: page
          hasAutosaves: true
          hasLinks: false
          breakpoints:
            small: 767
            medium: 1023
          lastPreviewUrl: https://example.builder.codes/pricing?apiKey=Cau1dr0nF1xtureK3y0&builder.user.permissions=read%2Cadmin
        query:
          - "@type": "@builder.io/core:Query"
            operator: is
            property: urlPath
            value: /pricing
        folders: []
        # The same revision string as a record it shares nothing else with.
        rev: taqizx9mb0d
        screenshot: https://cdn.builder.io/api/v1/image/assets%2FCau1dr0nF1xtureK3y0%2F4b8f62e97ba34547a0723684a68794e3
        testRatio: 1
        variations: {}

conformance:
  - name: no key is a 401 with a support address as the detail
    source: https://cdn.builder.io/api/v3/content/page
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
    expect:
      status: 401
      body:
        message: Authorization required
        # An email address, in the machine-readable field.
        detail: For help please contact support@builder.io
        # A number here.
        status: 401

  - name: a wrong key is the same body
    source: https://cdn.builder.io/api/v3/content/page?apiKey=notarealkey
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: notarealkey
    expect:
      status: 401
      body:
        message: Authorization required
        detail: For help please contact support@builder.io

  - name: and so is an unrouted path without a key
    source: https://cdn.builder.io/api/v3/cauldron-nope
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v3/cauldron-nope
    expect:
      status: 401
      body:
        # The routing failure is invisible until the key is good.
        message: Authorization required
        status: 401

  - name: with a key the same path is a third envelope entirely
    source: https://cdn.builder.io/api/v3/cauldron-nope?apiKey=YJIGb4i01jvw0SRdL5Bt
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v3/cauldron-nope
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 404
      body:
        # An array, under errors, with title rather than message.
        'errors[0].title': Route Does Not Exist
        'errors[0].detail': "Cannot GET `/api/v3/cauldron-nope`"
        # And the status as a string.
        'errors[0].status': "404"

  - name: a wrong method echoes the verb in backticks
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    verified: "2026-09-13"
    fixture: pages
    request:
      method: PUT
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 404
      body:
        'errors[0].title': Route Does Not Exist
        'errors[0].detail': "Cannot PUT `/api/v3/content/page`"

  - name: a model that does not exist is a second envelope with no detail
    source: https://cdn.builder.io/api/v3/content/cauldron-nope-model?apiKey=YJIGb4i01jvw0SRdL5Bt
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/cauldron-nope-model
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 404
      body:
        message: Model not found
        status: 404
      absent:
        # The 401 carries one. This does not.
        - detail

  - name: version one answers a web page with a success status
    source: https://cdn.builder.io/api/v1/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    verified: "2026-09-13"
    fixture: pages
    request:
      method: GET
      path: /api/v1/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 200
      headers:
        # Not JSON, and not an error.
        Content-Type: text/html; charset=utf-8
      body_matches: '[\s\S]*<title>Builder\.io: Collaborative Development Platform</title>[\s\S]*'

  - name: two fields that read as booleans are strings
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 200
      body:
        # if (item.published) is true whatever this says.
        'results[0].published': published
        # And so is if (item.data.hidden).
        'results[0].data.hidden': "false"
        'results[0].name': Platform overview
        'results[0].data.title': Platform overview
        'results[0].data.url': /platform-overview

  - name: a revision that does not vary with the record
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 200
      body:
        # Two records, created eleven months apart by different users.
        'results[0].rev': taqizx9mb0d
        'results[1].rev': taqizx9mb0d
        'results[0].createdDate': 1773159317174
        'results[1].createdDate': 1762780174694
        'results[0].createdBy': EePg86twR1c0vPeTl0c9xrEEna83
        'results[1].createdBy': b0272BAHcDTw8MCeDwLmdq7Uykp2
        'results[0].lastUpdatedBy': EePg86twR1c0vPeTl0c9xrEEna83
        'results[0].lastUpdated': 1773159941778
        'results[0].firstPublished': 1773159317174
        'results[0].modelId': 38834b40eced4c24947a3909cb42be3e

  - name: a public record carries a preview link with a permission grant
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
        limit: "1"
    expect:
      status: 200
      body:
        'results[0].meta.kind': page
        'results[0].meta.breakpoints.medium': 1023
        'results[0].folders': []
        'results[0].variations': {}
        'results[0].testRatio': 1
      matches:
        # read, create, publish, editCode, editDesigns, admin.
        'results[0].meta.lastPreviewUrl': '\A.*builder\.user\.permissions=.*admin.*\z'
        # Percent-encoded slashes, where the body's own images use bare ones.
        'results[0].screenshot': '\Ahttps://cdn\.builder\.io/api/v1/image/assets%2F.*\z'

  - name: targeting rules ride on the record tagged with an sdk class name
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 200
      body:
        # Looks like JSON-LD. Is not.
        'results[0].query[0].@type': "@builder.io/core:Query"
        'results[0].query[0].operator': is
        'results[0].query[0].property': urlPath
        'results[0].query[0].value': /platform-overview
        'results[0].data.state.deviceSize': large

  - name: an offset past the end is an empty array and nothing else
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt&offset=9000
    fixture: pages
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
        offset: "9000"
        limit: "1"
    expect:
      status: 200
      body:
        results: []
      absent:
        # No count, no cursor, no end.
        - count
        - total
        - nextPage

  - name: an empty space is the same empty array
    source: https://cdn.builder.io/api/v3/content/page?apiKey=YJIGb4i01jvw0SRdL5Bt
    fixture: empty
    request:
      method: GET
      path: /api/v3/content/page
      query:
        apiKey: Cau1dr0nF1xtureK3y0
    expect:
      status: 200
      body:
        results: []
