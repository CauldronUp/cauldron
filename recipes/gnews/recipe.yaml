# GNews Recipe for Cauldron
#
# GNews and NewsAPI answer the same question -- give me some headlines -- and
# neither one plays the "status" game the same way, or at all. NewsAPI
# stamps {"status": "ok" | "error", ...} on every response it sends, success
# and failure alike -- see that Recipe for where that puts it among the five
# shapes this collection has now catalogued for a body carrying a second
# opinion about its own HTTP status. GNews stamps nothing of the kind on a
# success: no ok flag, no status word, no echo of 200 anywhere in the body.
# Checked live against gnews.io on 2026-09-01, its only self-description at
# all is a bare {"errors": [...]} array, and only on a failure. A provider
# does not have to join this collection's running list of status
# conventions to be interesting: GNews is the plain-REST control case beside
# NewsAPI's textbook example, and the two paired together were worth writing
# down for the contrast as much as for either one alone.
#
# **A missing credential and a wrong one really do differ here -- but only
# past a shape check this Recipe cannot reproduce.** Four probes settle it,
# all live, all on 2026-09-01:
#
#   apikey absent entirely                       -> 400 "You did not provide an API key."
#   apikey=junkjunkjunk123 (15 chars, not hex)    -> 400 "You did not provide an API key."
#   apikey=<32 hex characters, wrong>             -> 401 "Invalid API Key provided."
#   apikey=<32 chars, not hex>                    -> 400 "You did not provide an API key."
#
# A plausible-looking key is not what decides it. Length and alphabet do: a
# value that is not exactly 32 hexadecimal characters is bucketed
# with "no key at all" before anything is looked up, and only a value that
# clears that shape check gets as far as being told it is wrong. One
# character over or under the count, one uppercase letter, one character
# outside 0-9a-f, and the 401 becomes the 400 instead.
#
# Cauldron cannot serve both branches of that. Its query-scheme auth check
# (internal/runtime/auth.go's authorised()) is one boolean: a presented value
# either matches a key on the list or it does not, with no notion of "looks
# like a key" in between, and internal/runtime/handler.go fires exactly one
# named error, authentication_error, on the strength of that one boolean --
# regardless of whether anything was presented at all. So this Recipe cannot
# encode "well-formed but wrong" as a distinct branch from "nothing sent";
# every failing credential this emulator is given, shaped or not, answers
# the same declared shape. That is a sharper version of the collapse Wise's
# Recipe already found for missing_token and invalid_token: Wise's two
# wordings differ only in prose and the same status; GNews's differ in
# status too, and this research could name the exact rule -- exactly 32
# hexadecimal characters, in either case -- that decides which one a live
# request gets. The Recipe
# below declares the "no key at all" shape, 400, because that is the one a
# credential-free request actually meets, live and here alike; the 401
# "Invalid API Key provided." wording is recorded here in prose rather than
# as a second case, for exactly the reason it could not get one.
#
# **Auth is still checked before anything else.** A bad language code
# ("lang=zz") sent alongside a shaped-but-wrong key answers the 401 above,
# not a language-specific 400 -- the credential check runs first,
# unconditionally, on every route tried, the same ordering NewsAPI,
# Paystack and Flutterwave already found on their own APIs.
#
# **A malformed path is answered by a large, branded HTML error page, not by
# the API.** GET /api/v4/totally-not-a-route -- checked with no key at all --
# answers 404, text/html, roughly 9.8 KB of the same GNews marketing site
# that serves the docs: a full page shell, Tawk.to chat widget, Google Tag
# Manager, a reCAPTCHA site key, mobile-device-sniffing regex, and one
# meta csrf-token value that changes between two otherwise-identical requests
# a few seconds apart -- checked twice, same path, same headers, different
# token. None of that is the API's own JSON contract; it is the same
# marketing site every unmatched path under gnews.io/... falls through to.
# Embedding several kilobytes of chat-widget and analytics script as a raw
# body would not describe this API's behaviour any more precisely than
# naming it does, so it is recorded here -- status, content type, rough
# size, the one volatile field -- and not modelled as a route. That is the
# "do not force it" this research was asked to honour when something
# genuinely does not fit.
#
# No rate-limit header of any kind appeared on any response checked here,
# 400 or 401 alike, though GNews's own documentation names a 403 for a
# daily-quota exhaustion and a separate 429 for a burst limit -- two
# different failures for two different kinds of "too many", cited from
# https://docs.gnews.io/error-handling and never reached, because reaching
# either needs a key that actually works.
#
# What could not be verified: every route here needs a real, registered key,
# the same as NewsAPI, and none was requested, guessed or used. So the 200
# shape below -- the envelope, the article object, and its nested source --
# is built entirely from https://docs.gnews.io/json-response and carries no
# verified date anywhere it appears. Two things worth pinning from that page,
# neither of them checked against a live 200:
#
#   1. Unlike NewsAPI, whose articles carry no identifier of their own at
#      all, a GNews article has its own id field, documented plainly as
#      "unique identifier for the article." The two APIs answer the same
#      question -- what is this record's id -- oppositely.
#   2. source is a nested object here too, but a richer one: id, name and
#      url are documented on every article, and a fourth field,
#      source.country, is documented as present only on /search responses
#      and absent from top-headlines. This Recipe models the endpoint it was
#      asked to check, top-headlines, and so source.country is not seeded:
#      claiming it here would describe the wrong endpoint's shape.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - GNews pages by page and max rather than by a cursor, and paginates
#     differently from NewsAPI in exactly that way: NewsAPI's page size
#     parameter is pageSize and defaults to 20; GNews's is max, defaults to
#     10, and is documented capped at 100 with pagination itself capped at
#     1000 articles total. The cap's own enforcement -- refused or trimmed
#     past 100 -- is not stated in what this research could read without a
#     key, so it is not modelled as max_limit here.
#   - category, country, lang, q, from, to and truncate are real, documented
#     filters and only lang was exercised live; none is wired as a Filter
#     below, for the same reason NewsAPI's country, category and sources are
#     not: each selects which upstream sources get polled rather than
#     matching a field the article record itself carries.
#   - A nullable query parameter is documented that this format has no
#     mechanism for at all: naming description, content or image in
#     ?nullable=... makes GNews send null for that field instead of its
#     ordinary value when the field would otherwise be empty, on a
#     per-request basis. Cauldron's field declarations are fixed by the
#     Recipe, not switched per request, so this Recipe cannot model the
#     parameter's effect either way and does not seed a fixture claiming to
#     know what an omitted-and-not-nulled field looks like on the wire.
#   - The 400 GNews documents for a bad or missing q on /search --
#     {"errors": {"q": "The query is required."}} -- nests an object keyed by
#     parameter name under "errors" rather than an array, a THIRD shape
#     alongside the plain array this Recipe does model. None of Cauldron's
#     error styles (nested, flat, list, string_list, text, string) is an
#     object keyed by the parameter that failed, so this shape does not fit
#     the vocabulary at all and is cited rather than declared. It was never
#     reached here either way: q is a /search parameter and this Recipe
#     models top-headlines, and every probe against /search still hit the
#     credential check first.
#   - Every article in a real response is fresh; GNews recomputes
#     top-headlines continuously. The ones seeded below are illustrative of
#     the documented shape and were never read off the wire, because reading
#     them off the wire needs the key this research never used.

recipe: gnews
capability: docs
version: 0.1.0

upstream:
  api: v4
  docs: https://docs.gnews.io/

auth:
  # In the query string, which is where every live probe here sent it. The
  # fixture key below is deliberately shaped like a real one -- 32 hex
  # hex characters -- because that shape is exactly what the header above
  # says the live API treats differently, even though Cauldron's own check
  # does not look at shape at all: any string not on this list fails the
  # same way, however it is shaped.
  scheme: query
  param: apikey
  keys:
    - c0ffee00c0ffee00c0ffee00c0ffee00

responses:
  # No success envelope fields at all -- see the header. Nothing is stamped
  # here because nothing is stamped live.
  list:
    style: wrapped
    key: articles
    count_field: totalArticles
  resource:
    style: bare
  error:
    # {"errors": ["..."]} -- a bare array of strings, not of objects, the
    # same shape OneSignal and Datadog already needed this style for.
    style: string_list
    key: errors

resources:
  article:
    id:
      # Documented as a real field, unlike NewsAPI's article, which has none.
      style: opaque
      field: id
    fields:
      title:
        type: string
      description:
        type: string
      content:
        type: string
      url:
        type: string
      image:
        type: string
      publishedAt:
        type: datetime
      lang:
        type: string
      # {id, name, url} on top-headlines. source.country exists on /search
      # only and is not modelled here -- see the header.
      source:
        type: map

routes:
  - method: GET
    path: /api/v4/top-headlines
    resource: article
    operation: list
    pagination:
      style: page
      # The documented default, and GNews's own names for both parameters --
      # neither one spelled the way NewsAPI spells its equivalent.
      limit: 10
      limit_param: max
      cursor_param: page
      first_page: 1

errors:
  authentication_error:
    status: 400
    # No code field, no type field -- just the one sentence, in the one
    # array. See the header for the 401 wording this collapses with.
    message: You did not provide an API key.

fixtures:
  empty: {}

  headlines:
    article:
      # Built from the documented shape, not read off the wire -- see the
      # header.
      - id: gnews-2026-08-30-roman-telescope
        title: "Roman Space Telescope cleared for Sunday launch"
        description: "Engineers confirmed the observatory's systems are ready ahead of its Falcon Heavy launch window."
        content: "The Nancy Grace Roman Space Telescope passed its final pre-launch review on Saturday, mission managers confirmed, clearing the way for liftoff this weekend from Kennedy Space Center… [1620 chars]"
        url: https://example-news.test/roman-telescope-cleared-for-launch
        image: https://example-news.test/images/roman-telescope.jpg
        publishedAt: "2026-08-30T08:05:00Z"
        lang: en
        source:
          id: example-news
          name: Example News Network
          url: https://example-news.test
      - id: gnews-2026-08-30-mirror-history
        title: "The spy-satellite mirror inside NASA's newest telescope"
        description: "A donated Hubble-class mirror is the heart of the Roman observatory."
        content: "It began as hardware for a reconnaissance satellite that never flew. Now it sits at the core of NASA's Roman Space Telescope… [1980 chars]"
        url: https://example-wire.test/mirror-history-roman-telescope
        image: https://example-wire.test/images/mirror.jpg
        publishedAt: "2026-08-29T21:12:00Z"
        lang: en
        source:
          id: example-wire
          name: Example Wire Service
          url: https://example-wire.test

conformance:
  - name: no key at all is a 400, not a 401, and the array holds one bare string
    source: https://gnews.io/api/v4/top-headlines?lang=en
    verified: "2026-09-01"
    request:
      method: GET
      path: /api/v4/top-headlines
      query:
        lang: en
    expect:
      status: 400
      body:
        errors[0]: You did not provide an API key.

  - name: a key that is present but wrong is bucketed with no key at all here
    source: https://gnews.io/api/v4/top-headlines?lang=en&apikey=junkjunkjunk123
    verified: "2026-09-01"
    request:
      method: GET
      path: /api/v4/top-headlines
      query:
        lang: en
        apikey: junkjunkjunk123
    expect:
      # The live API bucketed this exact value with "no key" too, at 400 --
      # it is 15 characters and not hex. A 32-character hexadecimal value
      # in its place gets a 401 live and cannot get one here; see the header.
      status: 400
      body:
        errors[0]: You did not provide an API key.

  - name: an invalid language never gets looked at, because auth runs first
    source: https://gnews.io/api/v4/top-headlines?lang=zz&apikey=junkjunkjunk123
    verified: "2026-09-01"
    request:
      method: GET
      path: /api/v4/top-headlines
      query:
        lang: zz
        apikey: junkjunkjunk123
    expect:
      status: 400
      body:
        errors[0]: You did not provide an API key.

  - name: unlike NewsAPI, an article here carries its own id
    source: https://docs.gnews.io/json-response
    fixture: headlines
    request:
      method: GET
      path: /api/v4/top-headlines
      query:
        apikey: c0ffee00c0ffee00c0ffee00c0ffee00
    expect:
      status: 200
      body:
        totalArticles: 2
        "articles[0].id": gnews-2026-08-30-roman-telescope
        "articles[0].source.name": Example News Network
        "articles[0].source.url": https://example-news.test
        "articles[1].id": gnews-2026-08-30-mirror-history

  - name: the envelope carries no status word or ok flag of any kind
    source: https://docs.gnews.io/json-response
    fixture: headlines
    request:
      method: GET
      path: /api/v4/top-headlines
      query:
        apikey: c0ffee00c0ffee00c0ffee00c0ffee00
    expect:
      status: 200
      absent:
        - status
        - ok
