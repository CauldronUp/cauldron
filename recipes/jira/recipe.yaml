      headers:
        Authorization: Basic d29ya0BjYXVsZHJvbi50ZXN0OmNhdWxkcm9uLWppcmEtYXBpLXRva2VuLTAwMDA=
    expect:
      status: 400
      body:
        errorMessages: []
        errors:
