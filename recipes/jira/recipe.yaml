    # Confirmed live 2026-09-05, POST with an empty body against a real site
    # -- refused before creating anything -- see the header. Whether an
    # anonymous caller reaches this validation at all is a permission this
    # particular site happens to grant; most Jira Cloud sites answer the
    # credential failure above first, and this fault is armed rather than
    # reached through routing because the emulator has no field validation of
    # its own to exercise honestly.
    source: https://your-domain.atlassian.net/rest/api/3/issue
    verified: "2026-09-05"
    arm: missing_project
    fixture: empty
    request:
      method: POST
      path: /rest/api/3/issue
