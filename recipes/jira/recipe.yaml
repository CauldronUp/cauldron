  - name: the event is called webhookEvent and the issue sits beside it
    source: https://developer.atlassian.com/server/jira/platform/webhooks/
    fixture: platform-project
    request:
      method: POST
      path: /rest/api/3/issue
      headers:
        Authorization: Basic d29ya0BjYXVsZHJvbi50ZXN0OmNhdWxkcm9uLWppcmEtYXBpLXRva2VuLTAwMDA=
      json:
        fields:
          summary: The kettle is broken
    expect:
      status: 201
      webhook:
        event: jira:issue_created
        signature_header: X-Hub-Signature
        signature: '^sha256=[0-9a-f]{64}$'
        body:
          webhookEvent: jira:issue_created
        matches:
          timestamp: '^[0-9]{13}$'
          issue.id: '^[0-9]+$'
        absent:
          - type
          - data
          - data.object


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # maxResults=1 and nextPageToken=10001, which is the identifier of the
  # last record on the previous page, and asserts the second record came
  # back on its own: one to skip, one to return, and a third behind it
  # to prove the size stopped the page.
  - name: "maxResults and nextPageToken are the two names this listing reads"
    source: "https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-search/"
    fixture: platform-project
    request:
      method: GET
      path: "/rest/api/3/search/jql"
      query:
        "jql": "project = PLAT"
        "maxResults": "1"
        "nextPageToken": "10001"
      headers:
        "Authorization": "Basic d29ya0BjYXVsZHJvbi50ZXN0OmNhdWxkcm9uLWppcmEtYXBpLXRva2VuLTAwMDA="
    expect:
      status: 200
      body:
        "issues[0].id": "10002"
      absent:
        - "issues[1]"

