        summary: Added by a test
      headers:
        Authorization: Basic d29ya0BjYXVsZHJvbi50ZXN0OmNhdWxkcm9uLWppcmEtYXBpLXRva2VuLTAwMDA=
    expect:
      status: 201
      body:
        key: PLAT-45
      matches:
        id: '^[0-9]+$'
      # No fields object, so nothing sent in comes back and a suite asserting
      # on the create response is asserting on almost nothing. The issue has
      # to be fetched before anything about it is known.
      absent:
