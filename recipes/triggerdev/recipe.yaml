# Trigger.dev Recipe for Cauldron
#
# Written against Trigger.dev's API reference at trigger.dev/docs and struck
# live against api.trigger.dev on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **One endpoint, two error models, and which you get depends on which mistake
# you made.** Struck live:
#
#   GET /api/v1/runs                (no Authorization header)
#   401  Content-Type: application/problem+json
#   {"title": "Unauthorized",
#    "status": 401,
#    "type": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401",
#    "detail": "No authorization header provided",
#    "error": "No authorization header provided"}
#
#   GET /api/v1/runs                Authorization: Bearer tr_dev_notreal
#   401  Content-Type: application/json
#   {"error":"Invalid API key"}
#
# The first is RFC 9457, properly typed and properly labelled. The second is a
# single field with a different media type. Same route, same status, two
# unrelated shapes -- so a client cannot write one parser for a 401 from this
# endpoint. It has to look at the content type first, on a failure, which is
# the code path least likely to have been exercised.
#
# **`type` points at MDN.** RFC 9457 says the type URI "identifies the problem
# type" and that dereferencing it should give human-readable documentation *of
# that problem*. This one gives the Mozilla Developer Network's page on the
# HTTP 401 status code -- a correct and useful page about a status the response
# already carries in two other fields, and nothing at all about Trigger.dev. So
# the field that exists to distinguish one provider's problems from another's
# is filled with something identical across every provider that does this.
#
# **`detail` and `error` carry the same string.** RFC 9457 defines `title`,
# `status`, `type`, `detail` and `instance`. `error` is not one of them: it is
# the shape of the *other* failure, welded onto this one so that a client
# reading `body.error` works either way. Which is a thoughtful thing to do and
# also means the document is 5 fields carrying 4 facts.
#
# **An unknown path is HTML.** 404, `text/html`, a full application shell with
# a stale-asset recovery script in it -- the marketing and dashboard app
# answering, because api.trigger.dev and the web app are one deployment. So the
# 404 a client meets while getting a URL wrong is the one `.json()` throws on,
# and what it throws on is a React page.

recipe: triggerdev
capability: queue
version: 0.1.0

upstream:
  api: v1
  docs: https://trigger.dev/docs/management/overview
  # No spec: Trigger.dev's reference is a rendered documentation site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - tr_pat_cauldronfixture000000000000
  # Two different documents, struck live. The absent case is problem+json and
  # the rejected case is a bare object, which is why they are separate errors
  # with separate styles rather than two messages under one shape.
  absent_error: no_authorization_header
  rejected_error: invalid_api_key

responses:
  list:
    style: wrapped
    key: data
    cursor_field: pagination.next
  error:
    # The rejected case, which is the commoner one and the plainer one.
    style: flat
    message_field: error
    code_field: "-"

resources:
  run:
    id:
      field: id
      style: prefixed
      prefix: run_
    fields:
      taskIdentifier:
        type: string
      status:
        type: string
        default: COMPLETED
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      isTest:
        type: boolean
        default: false
      idempotencyKey:
        type: string
      version:
        type: string

routes:
  - method: GET
    path: /api/v1/runs
    resource: run
    operation: list
    pagination:
      style: cursor
      limit: 20
      max_limit: 100
      limit_param: "page[size]"
      cursor_param: "page[after]"

errors:
  no_authorization_header:
    status: 401
    # RFC 9457, and correct about everything except what type is for.
    message: "No authorization header provided"
    style: flat
    message_field: detail
    headers:
      Content-Type: application/problem+json
    fields:
      title: Unauthorized
      status: 401
      # The Mozilla Developer Network's page about the 401 status code, in the
      # field RFC 9457 reserves for identifying *this provider's* problem.
      type: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401"
      # The same string as detail, in the key the other failure uses, so a
      # client reading body.error works against both shapes.
      error: "No authorization header provided"

  invalid_api_key:
    status: 401
    # Three words and a different media type, on the same route as the
    # document above.
    message: "Invalid API key"
    headers:
      Content-Type: application/json

fixtures:
  empty:
    run: []

  project:
    run:
      - id: run_cm3k8p2xq0001abc
        taskIdentifier: send-welcome-email
        status: COMPLETED
        createdAt: "2026-09-05T08:12:44.101Z"
        updatedAt: "2026-09-05T08:12:47.882Z"
        isTest: false
        idempotencyKey: welcome-ada-2026-09-05
        version: "20260904.1"
      - id: run_cm3k8p2xq0002def
        taskIdentifier: send-welcome-email
        # Failed and still carrying an idempotency key, which is the state
        # that decides whether a retry is a new run or the same one.
        status: FAILED
        createdAt: "2026-09-05T09:40:02.556Z"
        updatedAt: "2026-09-05T09:40:19.004Z"
        isTest: false
        idempotencyKey: welcome-grace-2026-09-05
        version: "20260904.1"
      - id: run_cm3k8p2xq0003ghi
        taskIdentifier: nightly-rollup
        # A test run in the same listing as production ones, separated only by
        # a boolean nobody has to filter on.
        status: COMPLETED
        createdAt: "2026-09-06T02:00:00.000Z"
        updatedAt: "2026-09-06T02:04:31.210Z"
        isTest: true
        version: "20260905.2"

conformance:
  - name: no credential answers a full problem document
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers: {}
    expect:
      status: 401
      headers:
        # RFC 9457's media type, struck live.
        Content-Type: application/problem+json
      body:
        title: Unauthorized
        status: 401
        detail: "No authorization header provided"

  - name: the problem type is a page about the status code
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers: {}
    expect:
      status: 401
      body:
        # RFC 9457 reserves this URI for identifying the problem type. It
        # points at MDN's page on HTTP 401 -- a correct page about a status
        # this document already carries twice, and nothing about Trigger.dev.
        type: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401"

  - name: detail and error carry the same string
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers: {}
    expect:
      status: 401
      body:
        # error is not an RFC 9457 member. It is the other failure's only
        # field, welded on so body.error works against both shapes -- five
        # fields carrying four facts.
        detail: "No authorization header provided"
        error: "No authorization header provided"

  - name: a wrong key answers a different shape entirely
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_dev_notreal"
    expect:
      status: 401
      headers:
        # Not problem+json. Same route, same status, a different media type
        # and a different document.
        Content-Type: application/json
      body:
        error: "Invalid API key"
      absent:
        - title
        - detail
        - type

  - name: runs are wrapped in data with prefixed identifiers
    source: https://trigger.dev/docs/management/runs/list
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
    expect:
      status: 200
      body:
        'data[0].id': run_cm3k8p2xq0001abc
        'data[0].taskIdentifier': send-welcome-email

  - name: a failed run keeps its idempotency key
    source: https://trigger.dev/docs/management/runs/list
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
    expect:
      status: 200
      body:
        # The key survives the failure, which is what decides whether a retry
        # is the same run or a new one -- and nothing in the record says which
        # way this deployment resolves it.
        'data[1].status': FAILED
        'data[1].idempotencyKey': welcome-grace-2026-09-05

  - name: test runs share the listing with real ones
    source: https://trigger.dev/docs/management/runs/list
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
    expect:
      status: 200
      body:
        # A boolean separates a test run from a production one, in the same
        # array, with no default filter. A dashboard counting runs counts both.
        'data[2].isTest': true
        'data[0].isTest': false

  - name: a run with no idempotency key omits the field
    source: https://trigger.dev/docs/management/runs/list
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
    expect:
      status: 200
      body:
        'data[2].version': "20260905.2"
        # Millisecond precision on both halves of every timestamp.
        'data[2].createdAt': "2026-09-06T02:00:00.000Z"
        'data[2].updatedAt': "2026-09-06T02:04:31.210Z"
      absent:
        - 'data[2].idempotencyKey'

  - name: the cursor is nested under a pagination object
    source: https://trigger.dev/docs/management/runs/list
    fixture: project
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
      query:
        "page[size]": "1"
        # Sent by no other case, so this pair is what pins the bracketed names.
        "page[after]": run_cm3k8p2xq0001abc
    expect:
      status: 200
      body:
        'data[0].id': run_cm3k8p2xq0002def
      matches:
        # Not a top-level next: a pagination object holding it, and the
        # parameters that drive it are bracketed -- page[size] and
        # page[after] -- so a client building a query string has to encode
        # brackets that most URL builders escape differently.
        'pagination.next': '.'

  - name: a project with no runs answers an empty array
    source: https://trigger.dev/docs/management/runs/list
    fixture: empty
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_pat_cauldronfixture000000000000"
    expect:
      status: 200
      body:
        data: []
