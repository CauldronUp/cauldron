# HashiCorp Vault KV Recipe for Cauldron
#
# The same read gives you the secret, or a box containing the secret, and
# which one depends on a decision somebody made when the mount was created.
#
# Vault's key-value store has two versions. On KV v1, response.data is your
# secret. On KV v2, response.data.data is your secret and response.data is a
# box holding it beside a metadata block. Same product, same client, same
# call, one extra layer -- and nothing in the path says which you are talking
# to, because the version is a property of the mount rather than of the URL.
#
# So `secret = response.data` is correct code against one mount and returns
# {data: {...}, metadata: {...}} against the next. It does not throw. It
# yields an object, truthily, and the failure surfaces later as a password
# that is an object.
#
# Written against openapi.json in hashicorp/vault-client-go -- the document
# HashiCorp generates its official Go client from -- and the response samples
# in developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2.
#
# Reading those two together is the other half of this file, because neither
# is enough on its own. The generated document omits three separate things
# that every real request and response has:
#
#   1. The URL prefix. info.description says "All API routes are prefixed
#      with `/v1/`" and not one of the document's 715 paths carries it. The
#      prefix is stated in prose, in a field no generator reads.
#   2. The response envelope. The document says a KV v2 read answers with
#      KvV2ReadResponse, which is {data, metadata}. The real body has that
#      one level down, inside a wrapper carrying request_id, lease_id,
#      renewable and lease_duration. The wrapper is hand-written, outside the
#      generated code, as Response[T any] in response.go.
#   3. Authentication. components.securitySchemes is {} -- empty -- for an
#      API whose entire purpose is holding secrets. Every request needs
#      X-Vault-Token and the document never says so.
#
# The pattern is the same each time: the generator emits the middle, and a
# person supplies both ends. A client built from this document alone would
# call the wrong URL, without credentials, and misread the answer.
#
# Three more the Recipe pins:
#
#   1. A write does not answer with what you wrote. KvV2WriteResponse is
#      created_time, custom_metadata, deletion_time, destroyed and version --
#      metadata, and no secret. The request schema says so in passing, of
#      data: "The contents of the data map will be stored and returned on
#      read." Returned on read. Not returned.
#   2. And on KV v1 the same write answers 204 with no body at all, where v2
#      answers 200 with that metadata. One operation, one product, two status
#      codes and two body policies, decided by the mount.
#   3. Not deleted is two fields. deletion_time is "" -- an empty string,
#      not null and not absent -- and destroyed is false. A soft-deleted
#      version has a deletion_time and destroyed false; a destroyed one has
#      both. Code checking `if (metadata.deletion_time)` is right by accident
#      and code checking `!= null` is wrong.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - /sys/health is the most striking thing in the document and it is not
#     served. Its five declared responses are 200 "initialized, unsealed, and
#     active", 429 "unsealed and standby", 472 "data recovery mode
#     replication secondary and active", 501 "not initialized" and 503
#     "sealed". A healthy standby answers 429 Too Many Requests; an
#     uninitialised Vault answers 501 Not Implemented; and 472 is not an HTTP
#     status code at all. The codes are chosen so that a load balancer's
#     default "2xx is healthy" rule sends traffic only to the active node,
#     which means every generic monitor reports a working standby as rate
#     limited. It is not served because those are states of the server rather
#     than properties of a request, and this format cannot be asked to be
#     sealed. It is also x-vault-unauthenticated, which used to be a second
#     reason -- "authentication here is one setting for a whole Recipe" -- and
#     is not one any more: a route may be marked public, which is exactly an
#     endpoint that needs no credential on a Recipe whose others do. The first
#     reason stands on its own.
#   - Listing answers with names rather than records: {"data": {"keys":
#     ["a", "b/"]}}, an array of strings, where a trailing slash means a
#     folder with more below it. This format's listings carry records, so the
#     route is left out rather than served with the wrong entry shape. The
#     selector is worth recording even so: a list is a GET to the same path
#     with a trailing slash AND ?list=true, whose schema is an enum of one
#     value with the description "Must be set to `true`".
#   - The document declares no failure whose cause is the caller. Across 715
#     paths and 1059 declared responses there is no 400, 401, 403 or 404 --
#     the only non-2xx are that /sys/health set and three 304s on PKI
#     issuers. The {"errors": [...]} shape below comes from Vault's
#     documentation rather than from the document.
#   - wrap_info, warnings and auth are named by Response[T] and absent from
#     every published response sample, so they are left off rather than
#     guessed at. Only the four fields the wrapper carries by value are
#     declared.
#   - A secret's path may contain slashes, which this format's router reads
#     as segments. The fixtures use flat names.
#   - Versioning, cas, delete-versions, undelete, destroy, and every secrets
#     engine that is not KV are absent.
#
# Nothing here was checked against a live server, and it could not be, on
# 2026-09-05 or any other day. Vault is self-hosted software with no shared
# public address: a self-managed install binds to whatever host an operator
# chose, and HashiCorp Cloud Platform's managed Vault mints a private
# per-cluster hostname behind a customer's own network rather than
# publishing one shared endpoint. vault.hashicorp.com does not resolve --
# that domain is HashiCorp's marketing site, not a Vault instance -- and no
# other candidate host exists to try. That is a DNS failure rather than a
# refusal: there was no server on the other end, unauthenticated or
# otherwise, so every conformance case below stays sourced to Vault's own
# published API documentation for exactly that reason.
#
# The token and paths below are fixtures and belong to no Vault.

recipe: vault
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2

auth:
  scheme: header
  header: X-Vault-Token
  keys:
    - hvs.CAESICauldronFixtureTokenNotARealVaultToken

responses:
  resource:
    # The wrapper the generated document does not describe. Everything a
    # backend returns arrives under data, which is why KV v2 -- whose own
    # payload also has a data key -- ends up doubled.
    style: wrapped
    key: data
  error:
    # {"errors": ["permission denied"]}. A list, even when there is one.
    style: string_list
    key: errors

resources:
  secret:
    id:
      style: opaque
      # The path names the secret. Nothing in the body does.
      field: "-"
    fields:
      data:
        type: map
      metadata:
        type: map

  version:
    id:
      style: opaque
      field: "-"
    fields:
      # What a write answers with, and it is all metadata. Defaults rather
      # than an echo, because the request body is not what comes back.
      created_time:
        type: string
        default: "2026-03-22T02:36:43.986212308Z"
      custom_metadata:
        type: map
      deletion_time:
        type: string
        default: ""
      destroyed:
        type: boolean
        default: false
      version:
        type: integer
        default: 1

  secret_metadata:
    id:
      style: opaque
      field: "-"
    fields:
      cas_required:
        type: boolean
      created_time:
        type: string
      current_version:
        type: integer
      custom_metadata:
        type: map
      max_versions:
        type: integer
      oldest_version:
        type: integer
      updated_time:
        type: string
      versions:
        type: map

  v1_secret:
    id:
      style: opaque
      field: "-"
    fields:
      # A KV v1 secret has no fixed shape: its keys are whatever was written.
      # These are the fixture's, and they sit directly under data.
      username:
        type: string
      password:
        type: string

routes:
  - method: GET
    path: /v1/kv-v2/data/{id}
    resource: secret
    operation: get
    fields:
      # The wrapper's own fields, hand-written in the client and absent from
      # the document. lease_id is empty and lease_duration is nought on every
      # KV response: the envelope was built for backends that issue leases,
      # and a key-value store does not.
      request_id: 8f1b9c22-4e3d-4a19-9d2f-6c0a7b5e1d43
      lease_id: ""
      renewable: false
      lease_duration: 0

  - method: POST
    path: /v1/kv-v2/data/{name}
    resource: version
    operation: create
    fields:
      request_id: 2c7d5a90-1f64-4b03-8e77-9a4c2d6f8b15
      lease_id: ""
      renewable: false
      lease_duration: 0

  - method: GET
    path: /v1/kv-v2/metadata/{id}
    resource: secret_metadata
    operation: get
    fields:
      request_id: b34e7f18-6c25-4d90-a1e8-3f5b0c9d2a67
      lease_id: ""
      renewable: false
      lease_duration: 0

  - method: GET
    path: /v1/kv-v1/{id}
    resource: v1_secret
    operation: get
    fields:
      request_id: d91a6b47-8e02-4c35-b7f6-5a2d1e8c4093
      lease_id: ""
      renewable: false
      lease_duration: 0

  - method: POST
    path: /v1/kv-v1/{name}
    resource: v1_secret
    operation: create
    # 204 and nothing at all, where the v2 write answers 200 with metadata.
    status: 204
    empty_body: true

errors:
  authentication_error:
    status: 403
    message: permission denied

  resource_missing:
    status: 404
    message: ""

  invalid_request:
    status: 400
    message: invalid request

fixtures:
  empty: {}

  store:
    secret:
      - id: app-database
        data:
          username: cauldron
          password: not-a-real-password
        metadata:
          created_time: "2026-03-22T02:24:06.945319214Z"
          custom_metadata:
            owner: jdoe
          deletion_time: ""
          destroyed: false
          version: 2

    secret_metadata:
      - id: app-database
        cas_required: false
        created_time: "2026-03-22T02:24:06.945319214Z"
        current_version: 3
        custom_metadata:
          owner: jdoe
        max_versions: 0
        oldest_version: 0
        updated_time: "2026-03-24T09:11:52.114820100Z"
        versions:
          "1":
            created_time: "2026-03-22T02:24:06.945319214Z"
            deletion_time: ""
            destroyed: false
          "2":
            created_time: "2026-03-23T14:02:31.774310022Z"
            deletion_time: "2026-03-24T09:11:52.114820100Z"
            destroyed: false

    v1_secret:
      - id: legacy-database
        username: cauldron
        password: not-a-real-password

conformance:
  - name: a KV v2 read puts the secret under data.data
    source: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
    fixture: store
    request:
      method: GET
      path: /v1/kv-v2/data/app-database
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
    expect:
      status: 200
      body:
        # response.data is a box. response.data.data is the secret.
        "data.data.password": not-a-real-password
        "data.metadata.version": 2
      absent:
        # There is no password here, and reading data as the secret finds an
        # object rather than nothing -- which is why it survives to become a
        # password that is an object.
        - data.password

  - name: and a KV v1 read puts the secret under data
    source: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v1
    fixture: store
    request:
      method: GET
      path: /v1/kv-v1/legacy-database
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
    expect:
      status: 200
      body:
        # One layer, from the same client, against the same server. The
        # version is a property of the mount and the path does not mention
        # it.
        "data.password": not-a-real-password
      absent:
        - data.data
        - data.metadata

  - name: the wrapper the generated document leaves out
    source: https://github.com/hashicorp/vault-client-go/blob/main/response.go
    fixture: store
    request:
      method: GET
      path: /v1/kv-v2/data/app-database
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
    expect:
      status: 200
      body:
        # KvV2ReadResponse in the OpenAPI document is {data, metadata} at the
        # top level. These four sit around it on the wire, declared only in
        # hand-written Go, and the lease pair is empty because a key-value
        # store issues no leases.
        request_id: 8f1b9c22-4e3d-4a19-9d2f-6c0a7b5e1d43
        lease_id: ""
        renewable: false
        lease_duration: 0

  - name: a write answers with metadata and not with the secret
    source: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
    fixture: store
    request:
      method: POST
      path: /v1/kv-v2/data/app-queue
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
      json:
        data:
          password: something-new
    expect:
      status: 200
      body:
        # "The contents of the data map will be stored and returned on read"
        # -- the request schema's own words. Read, not write.
        "data.version": 1
        "data.destroyed": false
        # Generated here rather than stored, and still an empty string.
        "data.deletion_time": ""
      absent:
        - data.data
        - data.data.password

  - name: not deleted is an empty string beside a false
    source: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
    fixture: store
    request:
      method: GET
      path: /v1/kv-v2/data/app-database
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
    expect:
      status: 200
      body:
        # Not null, and not absent. A soft delete fills this in and leaves
        # destroyed false; a destroy sets both.
        "data.metadata.deletion_time": ""
        "data.metadata.destroyed": false

  - name: a version number is an integer until it is a key
    source: https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2
    fixture: store
    request:
      method: GET
      path: /v1/kv-v2/metadata/app-database
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
    expect:
      status: 200
      body:
        # current_version is a number. The same versions, used as keys in the
        # versions map, are strings -- so code that looks up
        # versions[current_version] finds nothing in a language that does not
        # coerce.
        "data.current_version": 3
        "data.versions.2.deletion_time": "2026-03-24T09:11:52.114820100Z"

  - name: the v1 write answers with nothing at all
    source: https://raw.githubusercontent.com/hashicorp/vault-client-go/main/openapi.json
    fixture: store
    request:
      method: POST
      path: /v1/kv-v1/legacy-queue
      headers:
        X-Vault-Token: hvs.CAESICauldronFixtureTokenNotARealVaultToken
      json:
        password: something-new
    expect:
      # 204, where the v2 write answered 200 with a metadata body. Calling
      # .json() on this throws, and which one you get depends on the mount.
      status: 204
      no_body: true

  - name: a wrong token is refused with a list of one
    source: https://developer.hashicorp.com/vault/api-docs
    fixture: store
    request:
      method: GET
      path: /v1/kv-v2/data/app-database
      headers:
        X-Vault-Token: hvs.NotThisVaultsToken000000000000000000
    expect:
      status: 403
      body:
        "errors[0]": permission denied

  # The names. This Recipe declares 6 field(s) on a secret_metadata that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 5 name(s) that came back at the paths they came
  # back under.
  - name: "a secret_metadata carries the field names this Recipe declares"
    source: "https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2"
    fixture: store
    request:
      method: GET
      path: "/v1/kv-v2/metadata/app-database"
      headers:
        "X-Vault-Token": "hvs.CAESICauldronFixtureTokenNotARealVaultToken"
    expect:
      status: 200
      body:
        "data.cas_required": false
        "data.created_time": "2026-03-22T02:24:06.945319214Z"
        "data.max_versions": 0
        "data.oldest_version": 0
        "data.updated_time": "2026-03-24T09:11:52.114820100Z"

  # The names. This Recipe declares 1 field(s) on a v1_secret that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a v1_secret carries the field names this Recipe declares"
    source: "https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v1"
    fixture: store
    request:
      method: GET
      path: "/v1/kv-v1/legacy-database"
      headers:
        "X-Vault-Token": "hvs.CAESICauldronFixtureTokenNotARealVaultToken"
    expect:
      status: 200
      body:
        "data.username": "cauldron"

