# TalkJS Recipe for Cauldron
#
# TalkJS answers the group's central question in the sharpest way any of the
# three providers do: a conversation is created with PUT, and the id in the
# URL is chosen by the caller, not minted by the server. Quoted verbatim from
# TalkJS's own REST API reference, in the words the page itself uses:
# "use a PUT request method to create a conversation," with the identifier
# named in the path -- POST does not appear anywhere in the create story.
# That is a different contract from every create route elsewhere in this
# collection that answers with an id: a POST that fails cannot be retried
# byte-for-byte without minting a second record, and a PUT that fails can be
# retried with the identical request until it lands, because the id was never
# the server's decision to make. Whereby, the control this group was built
# around, makes the opposite choice -- POST /v1/meetings mints meetingId
# itself, per its own OpenAPI description, and never asks the caller for one.
#
# And TalkJS states outright, in its own words, that creating a conversation
# and a conversation existing are not the same fact: "This step does not make
# a conversation visible to users. The Inbox only shows a conversation that
# contains one or more messages." A conversation created and never used is
# not nothing -- GET answers it in full, with an id, participants, subject
# and timestamps -- it is a real record that no user interface will ever
# surface. lastMessage is null on it, and TalkJS's own response schema for
# GET names lastMessage: Message | null as a genuine field, not an omission.
# This Recipe's one seeded conversation is exactly that: created and never
# messaged, to make the empty shape checkable rather than asserted in prose.
#
# What could not be answered from outside an account is where the interesting
# half of this group's other question -- does a wrong credential read
# differently from an absent one -- normally lives, and the reason is worth
# stating precisely rather than folding into a vague "not modelled."
# TalkJS addresses every conversation by an app id in the path itself:
# /v1/{appId}/conversations/.... Struck live, repeatedly, against
# api.talkjs.com with no account and three different credential shapes --
# no Authorization header at all, "Authorization: Bearer junktoken12345", and
# "Authorization: junktoken12345" with no Bearer prefix -- every one of them,
# against a path shaped like a real endpoint under an app id this task never
# provisioned, answered the byte-identical 404:
#
#   HTTP/1.1 404 Not Found
#   access-control-allow-origin: *
#   (no Content-Type header at all)
#
#   Not found.
#
# ten bytes, a trailing period, no braces. The credential was never examined,
# because the app id was resolved first and failed before there was anything
# left to check it against -- confirmed by sending PUT, GET and DELETE at
# recognised path shapes (conversations, conversations/{id}, users) under the
# same fake app id and getting the identical answer regardless of method.
# A path shape TalkJS does not recognise at all answers a different 404 --
# checked live against /v1/{appId}/nosuchresource and against PATCH on
# /conversations, a method-path pair nothing here declares -- content-type
# application/json, eleven bytes, the JSON string "Not found" with no
# trailing period and no CORS headers at all. Two tiers, struck live: a
# route TalkJS recognises but cannot resolve an app for, and a route it does
# not recognise in the first place. Neither one ever reaches a credential
# check, so this task could not observe -- and TalkJS's own docs do not show,
# beyond the bare status "401 Unauthorized" with no example body anywhere in
# the REST API reference or the Advanced Authentication guide -- what a
# well-formed secret key that is simply wrong looks like against a real app.
# That is a structural fact about how far outside probing can reach, not a
# provider that collapses the distinction the way most of this collection's
# subjects do: TalkJS may draw the line as sharply as it draws every other
# one here, and this task's own account-less vantage point cannot find out.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron's create operation always mints its own identifier and has no
#     mechanism for a caller-supplied path segment to become one on a fresh
#     write. The PUT route below is modelled as update against the one
#     conversation the fixture already seeds, which demonstrates that the
#     path segment addresses the record -- PUT it again and the identical id
#     comes back -- without claiming to reproduce a brand-new conversation
#     springing into existence at an id nobody has used yet. See the route's
#     own comment.
#   - The credential check inside a real app is not modelled with any
#     specific wire shape, for the reason above. errors.authentication_error
#     carries only the one fact that is documented (401) and no body: writing
#     one would be inventing the exact thing this header says could not be
#     observed.
#   - participants reshapes on the wire: a create request sends an array of
#     user ids and a GET answers a map keyed by id, each entry carrying
#     access, notify, isUnread, joinedAt and readUntil. Cauldron's field
#     mapping does not reshape a create request's array into that map, so
#     this Recipe's create route always answers the one fixed fixture map
#     below regardless of which participants the request actually named.
#   - Of the documented Message fields on lastMessage (id, conversationId,
#     senderId, type, origin, createdAt, text, attachment, content, custom,
#     readBy, reactions, ...), none are typed here. The one conversation this
#     Recipe seeds never has a message, so lastMessage is only ever null, and
#     inventing a populated shape nobody's fixture produces would be a claim
#     this Recipe cannot back.
#   - Users, user presence, messages, notifications, participation, import,
#     batch and rate limits are real REST API sections and none of them are
#     routed. This Recipe is scoped to what the group's question turns on:
#     whether a conversation exists before a message does, and whether the
#     id is chosen or minted.
#   - No upstream.spec. TalkJS's documentation is a Next.js app; no path
#     under api.talkjs.com or talkjs.com/docs answered a machine-readable
#     description.
#   - Message retention is not stated anywhere in TalkJS's REST API reference
#     this task read (Getting Started, Conversations, Messages, Rate Limits,
#     Troubleshooting, Advanced Authentication) -- an absence in what was
#     published, not a claim that TalkJS keeps messages forever.
#
# The app id and secret key below are fixtures and belong to no account.

recipe: talkjs
capability: chat
version: 0.1.0

upstream:
  api: v1
  docs: http://talkjs.com/docs/REST_API/

auth:
  # Genuinely bearer, per TalkJS's own Advanced Authentication guide -- but
  # expressed as scheme none plus literal-vs-wildcard routes below, the same
  # device pubnub/recipe.yaml and census/recipe.yaml use, because the check
  # this task could actually strike live is not "is the key right", it is
  # "does the app id in the path resolve at all" -- and that happens before
  # any Authorization value is examined, confirmed identically across an
  # absent header, a wrong bearer token and an unprefixed one. See the
  # header.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # Every failure this Recipe answers is plain text on the wire -- see the
    # header. There is no JSON envelope here to default to.
    style: text

resources:
  conversation:
    id:
      # Caller-chosen at create time -- see the header. "order_391_fc" is
      # TalkJS's own worked example from the Conversations reference page.
      style: opaque
      field: id
    fields:
      subject:
        type: string
        null_when_unset: true
      photoUrl:
        type: string
        null_when_unset: true
      welcomeMessages:
        type: list
        null_when_unset: true
      custom:
        type: map
        default: {}
      # A map keyed by user id, each entry {access, notify, isUnread,
      # joinedAt, readUntil}. Not derived from a create request's
      # participants array -- see the header's fidelity gap.
      participants:
        type: map
      # Message | null on TalkJS's own response schema. Only ever null in
      # this Recipe, on purpose: the one conversation seeded below has never
      # had a message sent to it, which is the empty shape this group's
      # question turns on. See the header.
      lastMessage:
        type: map
        null_when_unset: true
      createdAt:
        type: timestamp_ms
      everyoneReadUntil:
        type: timestamp_ms
      topicId:
        type: string
        null_when_unset: true

routes:
  # The one fixture app this Recipe holds, addressed by a literal path
  # segment rather than a template variable so it outscores the wildcard
  # fallback below -- the same "literal beats wildcard" rule turso/recipe.yaml
  # and pubnub/recipe.yaml already rely on for an identical reason.
  # Modelled as update, not create -- stated plainly rather than glossed
  # over. Cauldron's create operation always mints its own identifier; there
  # is no mechanism here for a caller-supplied path segment to become the
  # record's id on a fresh write, which is exactly the freedom PUT-to-create
  # is for. What this route demonstrates instead is the other half of the
  # same contract, which TalkJS's own docs call idempotent: sending this
  # request again against the conversation the fixture below already seeds
  # addresses the identical record by the identical path segment and answers
  # it back, unmoved. A real PUT to an id nobody has used yet would create
  # it; this Recipe cannot reproduce that half honestly, so it does not
  # claim to.
  - method: PUT
    path: /v1/cauldron-fixture-app/conversations/{id}
    resource: conversation
    operation: update
    returns: [id, subject, photoUrl, welcomeMessages, custom, participants, createdAt, everyoneReadUntil, topicId]

  - method: GET
    path: /v1/cauldron-fixture-app/conversations/{id}
    resource: conversation
    operation: get

  - method: GET
    path: /v1/cauldron-fixture-app/conversations
    resource: conversation
    operation: list
    pagination:
      # limit and startingAfter, from TalkJS's own REST reference read
      # 2026-09-05: you "can request at most 30 conversations at once", and
      # startingAfter takes a conversation id -- "results will start with
      # the conversation right after the selected one".
      #
      # The cursor is the previous page's last record id, which is Stripe's
      # starting_after with the underscore moved. TalkJS also documents an
      # offsetTs that offsets by sort order, so there are two positions on
      # one route; the id one is declared because it is the one that walks a
      # collection without depending on the ordering the caller chose.
      #
      # No default page size is stated -- only the ceiling of thirty -- so
      # none is declared and the engine's ten stands as the fallback.
      style: cursor
      max_limit: 30
      limit_param: limit
      cursor_param: startingAfter

  # Any other app id, on the same recognised path shapes -- what was actually
  # struck live, regardless of method or credential. See the header.
  - method: PUT
    path: /v1/{appId}/conversations/{id}
    error: app_not_found

  - method: GET
    path: /v1/{appId}/conversations/{id}
    error: app_not_found

  - method: GET
    path: /v1/{appId}/conversations
    error: app_not_found

  # Declared explicitly so Cauldron's own Allow-header synthesis never gets a
  # say: the two GET routes above are unconditional, and without this the
  # unmatched-method fallback below would answer a 405 this host never
  # sends -- PDFMonkey's Recipe in this collection states the identical
  # trade for the identical reason. What was actually struck live is PATCH;
  # this is what was tried, not a claim about every method.
  - method: PATCH
    path: /v1/{appId}/conversations
    error: unknown_route

errors:
  # Ten bytes, a trailing period, no Content-Type at all on the live
  # response -- Cauldron always sets one for a text-style error, which this
  # Recipe cannot avoid; declared here as the closest honest approximation
  # rather than pretending the header is absent. Struck live against three
  # credential shapes and three recognised path shapes -- see the header.
  app_not_found:
    status: 404
    style: text
    message: "Not found."

  # The JSON string "Not found" -- quotes and all, no trailing period -- for
  # a path shape TalkJS does not recognise, or a method it does not accept on
  # one it does. Struck live with no credential at all.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: application/json; charset=utf-8
    message: '"Not found"'

  # Never observed and never documented with a body -- see the header. The
  # only fact this carries is the one TalkJS's own docs state: 401.
  authentication_error:
    status: 401
    style: text
    message: ""

fixtures:
  empty: {}

  app:
    conversation:
      # order_391_fc is TalkJS's own worked example id from the Conversations
      # reference page's PUT curl example. participants, subject and custom
      # below are the same example's request body; everything past that is
      # this Recipe's own fixture, not an echo of anything TalkJS published.
      - id: order_391_fc
        subject: What a lovely day!
        photoUrl: null
        welcomeMessages: null
        custom:
          category: order_inquiry
        participants:
          "12081":
            access: ReadWrite
            notify: true
            isUnread: false
            joinedAt: 1767225600000
            readUntil: 1767225600000
          "8029":
            access: ReadWrite
            notify: true
            isUnread: true
            joinedAt: 1767225600000
            readUntil: null
        # Never messaged. This is the shape the header's central finding
        # turns on: a conversation that exists, is fully readable, and has
        # no message on it at all.
        lastMessage: null
        createdAt: 1767225600000
        everyoneReadUntil: 0
        topicId: null

conformance:
  - name: no Authorization header at all resolves the app id first and never reaches a credential check
    source: https://api.talkjs.com/v1/faketestapp/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/faketestapp/conversations
    expect:
      status: 404
      body_matches: '^Not found\.$'

  - name: a wrong bearer token answers the byte-identical sentence
    source: https://api.talkjs.com/v1/faketestapp/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/faketestapp/conversations
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      body_matches: '^Not found\.$'

  - name: and a header with no Bearer prefix at all answers the same sentence too
    source: https://api.talkjs.com/v1/faketestapp/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/faketestapp/conversations
      headers:
        Authorization: junktoken12345
    expect:
      status: 404
      body_matches: '^Not found\.$'

  - name: the path segment is the id -- PUT it again and the identical conversation answers back
    # Sending the same subject again is what makes this idempotent rather
    # than destructive; the request does not send participants, because the
    # array a create sends and the map a get answers with are not the same
    # shape -- see the header's fidelity gap. What this proves is the one
    # thing this Recipe can prove honestly: order_391_fc addresses one
    # record, not a fresh one per call.
    source: http://talkjs.com/docs/REST_API/Start_Conversation/
    fixture: app
    request:
      method: PUT
      path: /v1/cauldron-fixture-app/conversations/order_391_fc
      json:
        subject: What a lovely day!
        custom:
          category: order_inquiry
    expect:
      status: 200
      body:
        id: order_391_fc
        subject: What a lovely day!
        participants:
          "12081":
            isUnread: false

  - name: an empty conversation is fully readable, and lastMessage is null rather than absent
    # The header's central finding. TalkJS's own words: "This step does not
    # make a conversation visible to users. The Inbox only shows a
    # conversation that contains one or more messages." A conversation with
    # no message is not nothing -- it is a real record with an id,
    # participants and timestamps, and lastMessage is the one field that
    # says so by being null rather than by being missing.
    source: http://talkjs.com/docs/REST_API/Conversations/
    fixture: app
    request:
      method: GET
      path: /v1/cauldron-fixture-app/conversations/order_391_fc
    expect:
      status: 200
      body:
        id: order_391_fc
        subject: What a lovely day!
        lastMessage: null
        participants:
          "12081":
            isUnread: false
          "8029":
            isUnread: true
      matches:
        createdAt: '^[0-9]+$'

  - name: a route shape TalkJS does not recognise answers a different 404 than an unresolved app id
    source: https://api.talkjs.com/v1/faketestapp/totally-bogus-endpoint-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/faketestapp/totally-bogus-endpoint-xyz
    expect:
      status: 404
      headers:
        Content-Type: application/json; charset=utf-8
      body_matches: '^"Not found"$'

  - name: and a method nothing declares on a real path answers the identical unrecognised-route body
    source: https://api.talkjs.com/v1/faketestapp/conversations
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/faketestapp/conversations
    expect:
      status: 404
      headers:
        Content-Type: application/json; charset=utf-8
      body_matches: '^"Not found"$'

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for it with the credential the rest of the file uses,
  # and asserts the 1 record(s) that came back rather than the ones the
  # fixture lists: the store does not serve them in the order a fixture
  # writes them.
  - name: "the conversation listing answers, which nothing here had shown"
    source: "http://talkjs.com/docs/REST_API/Start_Conversation/"
    fixture: app
    request:
      method: GET
      path: "/v1/cauldron-fixture-app/conversations"
    expect:
      status: 200
      body:
        "data[0].id": "order_391_fc"
      absent:
        - "data[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but startingAfter can be: past the
  # only record the collection is empty, where a name the runtime
  # ignored would have answered with the record again.
  - name: "startingAfter moves the page on, and what comes back is not page one"
    source: "http://talkjs.com/docs/REST_API/Start_Conversation/"
    fixture: app
    request:
      method: GET
      path: "/v1/cauldron-fixture-app/conversations"
      query:
        "limit": "1"
        "startingAfter": "order_391_fc"
    expect:
      status: 200
      absent:
        - "data[0]"


