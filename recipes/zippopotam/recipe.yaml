# Zippopotam.us Recipe for Cauldron
#
# The keys have spaces in them.
#
#   {"country": "United States",
#    "country abbreviation": "US",
#    "post code": "90210",
#    "places": [{"place name": "Beverly Hills",
#                "state abbreviation": "CA", ...}]}
#
# "country abbreviation", "post code", "place name", "state abbreviation". Not
# camelCase, not snake_case, not kebab-case: a space, in the key. Nothing here
# can be destructured, nothing can be reached with a dot, and every access is a
# bracket with a quoted string in it. It is legal JSON and almost nothing else
# does it.
#
# **And "CA" is two different things in one response.** The country
# abbreviation for Canada is CA. The state abbreviation for California is CA.
# The same two letters, in fields whose names differ by one word, and on the
# Beverly Hills lookup one of them is present and the other is not.
#
# Written against the live API rather than a document: every case below was
# checked against api.zippopotam.us on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. latitude and longitude are strings. "-118.4065", not -118.4065, so
#      arithmetic concatenates and a comparison sorts lexically -- and the
#      minus sign means the lexical order is not even close.
#   2. A postcode that does not exist is {} with a 404. An empty object, so
#      .json() succeeds and every field is undefined; the status is the only
#      thing that says so, and a country code that does not exist answers
#      exactly the same way.
#   3. places holds objects of two different shapes depending on which endpoint
#      answered. Looking up a postcode gives entries with state and state
#      abbreviation; looking up a place gives entries with post code instead.
#      One key, two record types, and nothing in either says which arrived.
#   4. The reverse lookup repeats "place name" at both levels. It is a
#      top-level field and it is inside every entry of places, with the same
#      value, on the request that was made by place name in the first place.
#
# One more, not a shape but the reason a Canadian address looks wrong: Canada's
# forward sortation areas cover several neighbourhoods, so M5V's place name is a
# hundred and thirty characters of slash-separated district names inside
# parentheses. It is one string in one field, and it is not a name anybody would
# print.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The gazetteer is served rather than looked up. The service covers around
#     sixty countries with different postcode grammars, and this Recipe answers
#     with the codes its fixture holds.
#   - The reverse lookup's places array holds three of the five Beverly Hills
#     postcodes.
#   - The nearby endpoints -- /nearby and the country-level lists -- are not
#     modelled.
#
# The postcodes below are public and were recorded on the date in the cases.

recipe: zippopotam
capability: infrastructure
version: 0.1.0

upstream:
  api: zippopotam
  docs: https://api.zippopotam.us/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # {} and a 404. There is no message anywhere.
    style: text

resources:
  postcode:
    id:
      style: opaque
      # "post code", with a space, so it cannot be reached with a dot.
      field: post code
    fields:
      # The path's first segment, which is "us" or "ca" in lower case and is
      # never echoed: the body carries the country's name and its abbreviation
      # in upper case instead.
      cc:
        type: string
        in: "-"
      country:
        type: string
      # CA here means Canada. CA inside places means California.
      country abbreviation:
        type: string
      # Entries with state and state abbreviation, on this endpoint.
      places:
        type: list

  # The same service answering the other way round, and places holds a
  # different record type.
  placename:
    id:
      style: opaque
      field: "-"
      carried_by: place name
    fields:
      cc:
        type: string
        in: "-"
      # The path's second segment, lower case, where the body carries the
      # state's name and its abbreviation in upper case.
      region:
        type: string
        in: "-"
      country:
        type: string
      country abbreviation:
        type: string
      state:
        type: string
      state abbreviation:
        type: string
      # At the top level, and again inside every entry below.
      place name:
        type: string
      # Entries with post code, on this endpoint.
      places:
        type: list

routes:
  - method: GET
    path: /{cc}/{id}
    resource: postcode
    operation: get
    scope:
      - cc
    not_found: nothing_there

  - method: GET
    path: /{cc}/{region}/{id}
    resource: placename
    operation: get
    scope:
      - cc
      - region
    not_found: nothing_there

errors:
  # An empty object. The status is the only thing that says anything.
  nothing_there:
    status: 404
    headers:
      Content-Type: application/json
    message: "{}"

fixtures:
  empty: {}

  codes:
    postcode:
      - id: "90210"
        cc: us
        country: United States
        # US here. CA below means California.
        country abbreviation: US
        places:
          - place name: Beverly Hills
            # Strings, both of them.
            longitude: "-118.4065"
            latitude: "34.0901"
            state: California
            # The same two letters that mean Canada one field up.
            state abbreviation: CA

      # A Canadian forward sortation area, whose place name is a list of
      # districts run together.
      - id: M5V
        cc: ca
        country: Canada
        # CA. On the other record the same two letters are a state.
        country abbreviation: CA
        places:
          - place name: Downtown Toronto (CN Tower / King and Spadina / Railway Lands / Harbourfront West / Bathurst Quay / South Niagara / YTZ)
            longitude: "-79.3686"
            latitude: "43.6525"
            state: Ontario
            state abbreviation: ON

    placename:
      - id: beverly hills
        cc: us
        region: ca
        country: United States
        country abbreviation: US
        state: California
        state abbreviation: CA
        # At the top level, and again in every entry below.
        place name: Beverly Hills
        places:
          # post code where the other endpoint has state, and three of five.
          - place name: Beverly Hills
            longitude: "-118.2987"
            latitude: "33.7866"
            post code: "90209"
          - place name: Beverly Hills
            longitude: "-118.4065"
            latitude: "34.0901"
            post code: "90210"
          - place name: Beverly Hills
            longitude: "-118.383"
            latitude: "34.0652"
            post code: "90211"

conformance:
  - name: the keys have spaces in them
    source: https://api.zippopotam.us/us/90210
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /us/90210
    expect:
      status: 200
      body:
        # Not camelCase, not snake_case: a space, so nothing here can be
        # destructured or reached with a dot.
        "post code": "90210"
        "country abbreviation": US
        "places[0].place name": Beverly Hills
        "places[0].state abbreviation": CA

  - name: CA is the country in one place and the state in another
    source: https://api.zippopotam.us/ca/M5V
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /ca/M5V
    expect:
      status: 200
      body:
        # Two letters, two meanings, in fields whose names differ by one word.
        country: Canada
        "country abbreviation": CA
        "places[0].state abbreviation": ON
        "places[0].longitude": "-79.3686"
        "places[0].latitude": "43.6525"

  - name: the coordinates are strings
    source: https://api.zippopotam.us/us/90210
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /us/90210
    expect:
      status: 200
      body:
        # Arithmetic on these concatenates, and the minus sign puts the lexical
        # order nowhere near the numeric one.
        "places[0].latitude": "34.0901"
        "places[0].longitude": "-118.4065"
        "places[0].state": California
      absent:
        # The path's first segment is never echoed: the body carries the
        # country's name and its abbreviation in upper case instead.
        - cc

  - name: a postcode that does not exist is an empty object
    source: https://api.zippopotam.us/us/00000
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /us/00000
    expect:
      # .json() succeeds and every field is undefined. The status is the only
      # thing that says anything.
      status: 404
      headers:
        Content-Type: application/json
      body_matches: '^\{\}$'

  - name: and a country that does not exist answers exactly the same way
    source: https://api.zippopotam.us/zz/12345
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /zz/12345
    expect:
      # Two different mistakes, one response, and no message anywhere to tell
      # them apart.
      status: 404
      body_matches: '^\{\}$'

  - name: places holds a different record type on the other endpoint
    source: https://api.zippopotam.us/us/ca/beverly%20hills
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /us/ca/beverly hills
    expect:
      status: 200
      body:
        # post code where the postcode lookup has state, under the same key,
        # with nothing in either saying which arrived.
        "places[0].post code": "90209"
        "places[1].post code": "90210"
        "places[1].latitude": "34.0901"
      absent:
        - places[0].state
        - places[0].state abbreviation

  - name: the reverse lookup repeats the place name at both levels
    source: https://api.zippopotam.us/us/ca/beverly%20hills
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /us/ca/beverly hills
    expect:
      status: 200
      body:
        # A top-level field and a field inside every entry, with the same
        # value, on the request that named it in the first place.
        "place name": Beverly Hills
        "places[0].place name": Beverly Hills
        "places[2].place name": Beverly Hills
        state: California
        "state abbreviation": CA

  - name: a Canadian place name is a list of districts run together
    source: https://api.zippopotam.us/ca/M5V
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /ca/M5V
    expect:
      status: 200
      body:
        # One string, one field, a hundred and thirty characters, and not a
        # name anybody would print.
        "places[0].place name": Downtown Toronto (CN Tower / King and Spadina / Railway Lands / Harbourfront West / Bathurst Quay / South Niagara / YTZ)
        "places[0].state": Ontario

  - name: a US postcode under the Canadian country code is not found
    source: https://api.zippopotam.us/ca/90210
    verified: "2026-08-28"
    fixture: codes
    request:
      method: GET
      path: /ca/90210
    expect:
      # The country and the code are not independent. 90210 exists under us
      # and nowhere else, and asking for it under ca gets the same empty
      # object as a code nobody has issued.
      status: 404
      body_matches: '^\{\}$'
