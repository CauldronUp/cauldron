# Estated Recipe for Cauldron
#
# See rentcast/recipe.yaml for the header this group of three Recipes
# shares. Estated is the group's honest edge case: the task that started
# this group asked whether it "still operates as a standalone API," and the
# answer, checked live rather than assumed, is no -- and the wire says so in
# its own words, not just a company blog post.
#
# **Estated was bought by ATTOM Data Solutions on 2022-08-16 -- and the
# gateway that answers today, in 2026, still runs and still credits ATTOM
# by name, live, on the one route that needs no credential at all.**
#
#   GET https://apis.estated.com/
#     -> 200 {"name":"APIGateway","version":"1.26.0806.0816",
#        "environment":"PROD-EUS","copyright":"Copyright © ATTOM Data
#        Solutions 2026","message":"I'm alive!"}
#
# That is not marketing copy quoted from a press release; it is the
# gateway's own self-description, struck live, 2026-09-02, with no
# credential presented at all. api.estated.com (singular) and
# developer.estated.com both NXDOMAIN -- the real host is apis.estated.com
# (plural), which the marketing site at estated.com (itself now an ATTOM
# lead-gen page, headed "Estated is now part of ATTOM Data") still links to
# under "Legacy Estated API Documentation." That page states its own
# retirement in as many words: "We are in the process of migrating
# components of the Estated API architecture to ATTOM infrastructure...
# your existing API keys will remain valid... the Estated documentation
# will be deprecated at some point in 2026. While no specific date has been
# set." So: not dead, not standalone, not actively developed either -- a
# knowingly temporary shim over infrastructure ATTOM already runs, kept
# alive for existing integrations and given no announced shutdown date.
# attom/recipe.yaml, in this same group, is the surface Estated is
# migrating INTO -- and shares this Recipe's exact three-tier gateway
# envelope, byte for byte, on the two hosts this Recipe could compare.
#
# **The one field this group of Recipes was sent to find -- something that
# says when the underlying county record was last touched, separate from
# when the API last computed a number -- exists here, confirmed, by name,
# on the API that is otherwise this group's thinnest evidence for anything
# else.** Estated's own schema page, quoted verbatim:
#
#   metadata.attom_id (integer): "The unique ATTOM ID associated with this
#     property."
#   metadata.publishing_date (string, YYYY-MM-DD): "The date on which
#     assessor roll data is published or received from the county assessor
#     for the property's county."
#   valuation.date (string, YYYY-MM-DD): "The date the valuation was
#     performed."
#   valuation.value / valuation.high / valuation.low (integer): a genuine
#     range, not a single figure.
#   valuation.forecast_standard_deviation (integer, percentage 0-100):
#     "Forecast standard deviation" -- a real, named, statistical confidence
#     measure. Compare rentcast/recipe.yaml, which has a range and nothing
#     named confidence, and attom/recipe.yaml, whose AVM product is known
#     industry-wide to publish one and could not be confirmed to on the
#     wire at all.
#
# publishing_date and valuation.date are two different dates on two
# different objects, and Estated's own words for each are exactly the
# distinction this group of Recipes was sent to look for: one says when the
# county published its roll, the other says when Estated (now ATTOM) last
# computed a number from it. Neither field carries a documented example
# VALUE -- Estated's schema page gives names, types and one-sentence
# descriptions and, checked across the overview and schema pages both, no
# full worked JSON response anywhere with real numbers in it. That gap is
# stated below rather than filled with an invented figure: this Recipe
# names the fields it can cite and serves none of their values, because
# none was ever found to cite.
#
# **Missing and wrong are not merely different sentences here -- they are
# different PROGRAMS answering, in different envelopes, and the gap between
# them is exactly Sendcloud's split, named in this project's auth.go, on a
# second and unrelated provider (see attom/recipe.yaml for the first).**
# Struck live, apis.estated.com, 2026-09-02/03, no account, no real token:
#
#   GET /v4/property   no token at all
#     -> 401 {"Response":{"status":{"version":"1.0.0","code":"401",
#        "msg":"Unauthorized","total":"0","page":"0","pagesize":"0"}}}
#   GET /v4/property?token=   (blank)
#     -> 401, byte-identical to the line above
#   GET /v4/property?token=junk...
#     -> 403 {"error":{"code":"AE02","status_code":403,"title":"Forbidden",
#        "description":"The given token is invalid"},"warnings":null,
#        "metadata":{"timestamp":"...","version":"0.4.2-1.8.2"}}
#
# The first two are the SAME outer Azure-hosted gateway shape
# attom/recipe.yaml describes -- cookies domained to
# 3scale-gw-lx-eus.azurewebsites.net, the identical {"Response":{"status":
# {...}}} envelope, the identical "1.0.0" version stamp. The third is a
# completely different envelope, from a completely different program: the
# real Estated/ATTOM backend, reached only once the gateway decides SOME
# token was presented, however wrong. code (AE02), title (Forbidden) and
# description (the sentence) are the backend's own documented vocabulary,
# matching this exact live body word for word. metadata.version --
# "0.4.2-1.8.2" -- is worth noting on its own: it is the SAME string
# Estated's own documentation shows in a worked example dated 2019. Seven
# years, one acquisition, and the backend software's own version stamp has
# not moved, which is one more small, concrete piece of evidence for "not
# actively developed" beside the deprecation notice already quoted above.
#
# **Whether any token was presented at all decides whether an unrouted path
# 404s or 401s -- routing is never reached at all with nothing presented.**
#
#   GET /v4/totally-bogus-xyz   no token
#     -> 401, byte-identical to the matched-route absent case above
#   GET /v4/totally-bogus-xyz?token=junk
#     -> 404 {"Response":{"status":{"version":"1.0.0","code":"404",
#        "msg":"No rule matched","total":"0","page":"0","pagesize":"0"}}}
#
# Cauldron's own credential check is unconditional and binary -- refused
# before the router is ever consulted, for any verdict that is not
# Accepted -- so the second case above needs this Recipe's own accepted
# fixture token to reach Cauldron's router at all, a request the live host
# was never actually sent, and carries no verified date for exactly that
# reason. See attom/recipe.yaml and rootly/recipe.yaml for the identical
# trade, made for two different reasons on two different hosts.
#
# **A wrong method bypasses every credential check on this host too, a
# THIRD tier auth.after_routing cannot reach in either direction -- see
# attom/recipe.yaml for the identical structural gap on its sibling API.**
#
#   PUT /v4/property   no token at all       -> 405, empty body,
#     Content-Length: 0, no Content-Type, Allow: GET + Allow: POST as two
#     separate header lines
#   PUT /v4/property   token=junk            -> 405, byte-identical --
#     the method check does not look at the credential either way
#   PUT /v4/totally-bogus-xyz   no token     -> 405, byte-identical --
#     it does not look at the path either
#
# Armed below, for the same reason attom/recipe.yaml's are: Cauldron's
# engine has no ordering that reaches an empty 405 ahead of its own
# credential check, whichever way after_routing is set.
#
# **A coverage gap is a 200, not an error, and it says so by name.**
# Estated's own overview page, quoted verbatim: property warnings answer
# HTTP 200 with "data": null and a warnings array; "These requests will be
# billed if a property object is returned" -- meaning the null-data case is
# not. The exact codes, Estated's own words:
#
#   PW01  "No property was found for the given input"
#   PW02  "Multiple properties were found for the given input"
#   APE01 "Address Parser Error - The address was unable to be parsed"
#
# So a well-formed, uncovered address and a malformed one are NOT the same
# failure here -- PW01 and APE01 are two different codes, in a warnings
# array that never touches the ordinary error envelope at all, which is a
# real, positive, documented answer to the question this group of Recipes
# exists to ask. It could not be checked live -- no token exists to reach
# it -- and is served below with no verified date. A warning object's own
# shape (code, title, description, metadata), and the envelope it rides in
# ({"data", "metadata", "warnings"}), are both quoted from the same page.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no token was ever requested, guessed
#     or used. The absent/blank-token 401s, both armed 405s, and the public
#     root ping below are struck live and carry a verified date; the
#     matched-route 403 (reached automatically by Cauldron's own credential
#     check, since it distinguishes absent from wrong) is struck live too.
#     The unrouted-path 404, the PW01 warning and the one thin matched-
#     property case all needed a credential the live host was never asked
#     to accept, and carry none.
#   - No property, structure, parcel, tax, assessment or deed field is
#     modelled with a real value anywhere in this Recipe. Estated's schema
#     page names every one of them and gives none a worked example; this
#     Recipe declares metadata.version as its one confirmed constant --
#     observed live on a failure and matched against a seven-year-old
#     documentation example -- rather than inventing numbers for fields
#     whose real shape was never seen.
#   - PW02 (multiple matches) and APE01 (parse error) are documented above
#     and not routed: this Recipe's one property/get route already carries
#     the PW01 shape, and a second and third warning code would repeat the
#     same unauthenticated ceiling rather than add a new finding.
#   - No upstream.spec. Estated's documentation is hand-written prose pages
#     under a domain its own docs say will be retired sometime in 2026, not
#     a fetchable machine-readable description.
#   - GET / (the public root) is the whole of what this Recipe models on
#     the bare hostname; every other route needs the /v4 prefix.

recipe: estated
capability: infrastructure
version: 0.1.0

upstream:
  api: v4
  docs: https://estated.com/developers/docs/v4/property/overview

auth:
  scheme: query
  param: token
  keys:
    - cauldron-estated-fixture-token-00000000000000
  # Absent falls through to authentication_error, matching the outer
  # gateway's own sentence for "nothing was presented." rejected_error
  # reaches the backend's completely different envelope -- see the header:
  # two programs, two shapes, and this is the field that tells Cauldron's
  # single credential check which one to serve.
  rejected_error: token_invalid

responses:
  resource:
    style: bare
  error:
    # The outer gateway's own shape -- see the header and
    # attom/recipe.yaml, which shares it byte for byte. Only
    # authentication_error and unknown_route use this default; token_invalid
    # overrides every part of it, because it is a different program's
    # envelope entirely.
    style: flat
    message_field: "Response.status.msg"
    code_field: "Response.status.code"
    code_type: string

resources:
  # No field on this resource carries a real, observed or documented value
  # -- see the header. metadata.version is the one confirmed constant: real,
  # live, and matched against a seven-year-old documentation example.
  property:
    id:
      style: opaque
      field: "-"
    constants:
      metadata.version: "0.4.2-1.8.2"

routes:
  # street_address is one of Estated's own documented identifier parameters
  # (alongside city/state/zip_code, a combined address string, or a
  # fips+APN pair). 151 Battle Green Dr, Rochester, NY 14624 is Estated's
  # own worked example address, quoted from its overview page -- not
  # composed, not looked up.
  - method: GET
    path: /v4/property
    resource: property
    operation: get
    id_from: query:street_address
    # Any address this Recipe's one fixture record does not recognise --
    # the PW01 shape, documented at length in the header.
    not_found: property_not_found

  # Genuinely public: the gateway's own self-description, needing no
  # credential at all -- see the header for what it proves. Fixed and
  # verbatim, not a record.
  - method: GET
    path: /
    public: true
    raw:
      content_type: application/json
      text: '{"name":"APIGateway","version":"1.26.0806.0816","environment":"PROD-EUS","copyright":"Copyright © ATTOM Data Solutions 2026","message":"I''m alive!"}'

  # PUT bypasses every credential check on this host -- see the header.
  # Armed rather than wired.

errors:
  # What the ordinary, unconditional credential check produces on its own
  # for an absent or blank token -- see the header. No arming needed.
  authentication_error:
    status: 401
    code: "401"
    fields:
      Response.status.version: "1.0.0"
      Response.status.msg: Unauthorized
      Response.status.total: "0"
      Response.status.page: "0"
      Response.status.pagesize: "0"

  # Reached only with this Recipe's own accepted token -- see the header for
  # why the live request that produced this exact body carried a junk token
  # Cauldron's engine would have refused before ever routing it.
  unknown_route:
    status: 404
    code: "404"
    fields:
      Response.status.version: "1.0.0"
      Response.status.msg: No rule matched
      Response.status.total: "0"
      Response.status.page: "0"
      Response.status.pagesize: "0"

  # The backend's own envelope -- a completely different program from the
  # gateway shapes above, see the header. Reached automatically: named by
  # auth.rejected_error, so Cauldron's credential check serves this on its
  # own for any present-but-wrong token, on a route that exists.
  token_invalid:
    status: 403
    style: nested
    key: error
    message_field: description
    code_field: code
    code: AE02
    message: The given token is invalid
    fields:
      error.title: Forbidden
      error.status_code: 403
      warnings: null
      metadata.version: "0.4.2-1.8.2"

  # Documented, never observed -- see the header at length. data: null and
  # a warnings array, not an error envelope at all: this coverage-gap
  # answer is a 200.
  property_not_found:
    status: 200
    style: flat
    message_field: "-"
    code_field: "-"
    fields:
      data: null
      warnings:
        - code: PW01
          title: Property Warning
          description: No property was found for the given input

  # Empty body, Content-Length: 0, no Content-Type -- struck live, with no
  # credential presented at all, and byte-identical with a junk one. See
  # the header: Cauldron's engine has no ordering that reaches an empty 405
  # ahead of its own credential check, so this is armed, and the
  # request/response pairs below are the literal ones this Recipe sent and
  # received.
  method_not_allowed:
    status: 405
    empty: true
    headers:
      Allow: "GET, POST"

fixtures:
  empty: {}

  fixture-account:
    property:
      - id: "151 Battle Green Dr"

# Every case below carries source. A verified date means this Recipe called
# apis.estated.com with exactly the request shown and recorded exactly what
# came back; its absence means either the credential in the request is this
# Recipe's own fixture token, which the live host was never asked to
# accept, or the expectation was read from Estated's own documentation and
# never observed at all.
conformance:
  - name: no token at all
    source: https://apis.estated.com/v4/property
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /v4/property?street_address=151%20Battle%20Green%20Dr&city=Rochester&state=NY&zip_code=14624
    expect:
      status: 401
      body:
        "Response.status.version": "1.0.0"
        "Response.status.code": "401"
        "Response.status.msg": Unauthorized

  - name: a blank token answers byte-identically to no token at all
    source: https://apis.estated.com/v4/property
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /v4/property?street_address=151%20Battle%20Green%20Dr&city=Rochester&state=NY&zip_code=14624&token=
    expect:
      status: 401
      body:
        "Response.status.msg": Unauthorized

  - name: a present, wrong token reaches a different program entirely
    source: https://apis.estated.com/v4/property
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /v4/property?street_address=151%20Battle%20Green%20Dr&city=Rochester&state=NY&zip_code=14624&token=junk-obviously-fake-token-0000000000
    expect:
      status: 403
      body:
        "error.code": AE02
        "error.status_code": 403
        "error.title": Forbidden
        "error.description": The given token is invalid
        warnings: null
      absent:
        - Response

  - name: no token refuses an unrouted path too, before routing is ever consulted
    source: https://apis.estated.com/v4/totally-bogus-xyz
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /v4/totally-bogus-xyz
    expect:
      status: 401
      body:
        "Response.status.msg": Unauthorized

  - name: any token, however wrong, is enough to reach the router
    # Struck live with a junk token -- see the header. Reproduced here with
    # this Recipe's own accepted token instead, because Cauldron's own
    # credential check would otherwise refuse the request before routing is
    # ever attempted. No verified date for that reason.
    source: https://apis.estated.com/v4/totally-bogus-xyz
    fixture: fixture-account
    request:
      method: GET
      path: /v4/totally-bogus-xyz?token=cauldron-estated-fixture-token-00000000000000
    expect:
      status: 404
      body:
        "Response.status.version": "1.0.0"
        "Response.status.code": "404"
        "Response.status.msg": No rule matched

  - name: a wrong method answers empty and 405, ignoring the credential entirely
    # Armed -- see the header. The request below, no token at all, is the
    # literal one this Recipe sent live; the response is the literal one
    # that came back.
    source: https://apis.estated.com/v4/property
    verified: "2026-09-02"
    arm: method_not_allowed
    fixture: fixture-account
    request:
      method: PUT
      path: /v4/property
    expect:
      status: 405
      no_body: true
      headers:
        Allow: GET

  - name: and a wrong method ignores an unrouted path too
    source: https://apis.estated.com/v4/totally-bogus-xyz
    verified: "2026-09-02"
    arm: method_not_allowed
    fixture: fixture-account
    request:
      method: PUT
      path: /v4/totally-bogus-xyz
    expect:
      status: 405
      no_body: true

  - name: the gateway's own self-description credits ATTOM, live, with no credential at all
    # The finding this whole Recipe exists to carry -- see the header.
    source: https://apis.estated.com/
    verified: "2026-09-02"
    fixture: fixture-account
    request:
      method: GET
      path: /
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        name: APIGateway
        environment: PROD-EUS
        copyright: "Copyright © ATTOM Data Solutions 2026"
        message: I'm alive!

  - name: an unresolved address is a 200 that says so by name, not an error
    # Documented, never observed -- see the header at length. Every field
    # here is Estated's own vocabulary from its overview page.
    source: https://estated.com/developers/docs/v4/property/overview
    fixture: fixture-account
    request:
      method: GET
      path: /v4/property?street_address=1%20Nonexistent%20Fixture%20Court&city=Nowhere&state=ZZ&zip_code=00000&token=cauldron-estated-fixture-token-00000000000000
    expect:
      status: 200
      body:
        data: null
        "warnings[0].code": PW01
        "warnings[0].description": No property was found for the given input

  - name: a matched property answers under the same envelope, seven years unchanged
    # metadata.version is real: observed live on the 403 above and matched
    # against a documentation example dated 2019. This case infers it also
    # rides on a genuine 200 rather than asserting it was seen there
    # directly -- no token exists to have called this route and matched a
    # real record. No property field is asserted for the same reason: none
    # was ever found documented with a real value.
    source: https://estated.com/developers/docs/v4/property/schema
    fixture: fixture-account
    request:
      method: GET
      path: /v4/property?street_address=151%20Battle%20Green%20Dr&city=Rochester&state=NY&zip_code=14624&token=cauldron-estated-fixture-token-00000000000000
    expect:
      status: 200
      body:
        metadata.version: "0.4.2-1.8.2"
