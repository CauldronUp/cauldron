# MongoDB Atlas Administration API Recipe for Cauldron
#
# Written against the OpenAPI 3.0.1 document MongoDB publishes at
# github.com/mongodb/openapi -- openapi/v2.json, four megabytes, 333 paths --
# and quoted from the content types and schema names in it.
#
# The version of the API you are talking to is a date inside a content type.
#
# GET /api/atlas/v2/groups/{groupId}/clusters documents one success, 200, with
# three different content types under it:
#
#   application/vnd.atlas.2023-01-01+json  -> PaginatedLegacyClusterView
#   application/vnd.atlas.2023-02-01+json  -> PaginatedAdvancedClusterDescriptionView
#   application/vnd.atlas.2024-08-05+json  -> PaginatedClusterDescription20240805
#
# Three separately named schemas. Not one shape with fields added over time --
# three views, all current, all reachable today, chosen by a date a client puts
# in its Accept header.
#
# And the difference is not cosmetic. LegacyAtlasCluster carries mongoURI,
# mongoURIWithOptions, srvAddress, diskSizeGB, numShards, replicationFactor and
# providerSettings. ClusterDescription20240805 carries none of them. So the
# field an application uses to actually connect to the database is present
# under one date and absent under the next, on the same URL, with the same
# credentials, at the same moment.
#
# A client that upgrades its Accept header loses mongoURI. A client that never
# thought about the Accept header is pinned to whichever date it happened to
# get. The version is not in the path, not in a query parameter, and not in a
# header of its own -- it is a suffix on a media type, which is the one part of
# a request most people never look at and most libraries set for you.
#
# Three more, each from the same document:
#
#   1. The schema names carry the date too. ClusterDescription20240805 is what
#      the type is called, so a generated client has a class whose name is a
#      release date, and upgrading means changing the type your code refers to
#      rather than adding a field to it.
#   2. Failure is better documented than success. Of 333 paths, more
#      operations describe a 401 (540) and a 403 (540) than describe a 200
#      (420), and 429 appears 528 times. That is the opposite of ElevenLabs,
#      where 385 of 387 operations documented one failure and two documented a
#      401 -- two published specifications for two cloud APIs, and the same
#      question answered as thoroughly as possible by one and barely at all by
#      the other.
#   3. The credential is HTTP Digest. The document declares DigestAuth with
#      scheme: digest -- challenge-response, two round trips, a nonce -- on a
#      cloud API written in the 2020s, beside a modern OAuth flow for service
#      accounts. Every other provider in this collection is a header.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Digest is not served. This format authenticates with a header, a query
#     parameter, basic or bearer, and digest needs a challenge and a second
#     request. The Recipe uses the service-account bearer token, which is the
#     other scheme the same document declares, and this gap is why.
#   - What an unversioned request receives is a reading rather than a quote.
#     The document lists three content types for the success and no plain
#     application/json, and it documents no 406 anywhere in 333 paths. This
#     Recipe refuses a request that names no version, because that teaches the
#     lesson the versioning exists to teach; the status it refuses with is not
#     one MongoDB has written down.
#   - Atlas echoes the version it served in the response's own Content-Type,
#     and this emulator answers application/json. The runtime sets that header
#     itself and a Recipe cannot override it, so what is served here is the
#     half that matters -- two different bodies from one URL -- and not the
#     label on them.
#   - Two of the three dated views are served -- the oldest and the newest --
#     because they are the two that differ most and because serving the middle
#     one would be the same claim a third time.
#   - With no create route nothing here mints a cluster, so the twenty-four
#     hexadecimal characters declared for an identifier are checked against
#     the fixtures and cannot be exercised by a case.
#   - Clusters only. Projects, organisations, database users, network access,
#     backups, alerts, the Data API and the other three hundred paths are
#     absent.
#
# The token and the ids below are fixtures and belong to no project.

recipe: mongodbatlas
capability: database
version: 0.1.0

upstream:
  api: v2
  docs: https://www.mongodb.com/docs/atlas/reference/api-resources-spec/v2/

auth:
  # A service-account access token. The document declares HTTP Digest beside
  # this and Digest is the one most Atlas keys use -- see the gaps above.
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-atlas-fixture-token
  # Confirmed live 2026-09-05 -- see the errors table below. No
  # Authorization header at all answers a Digest challenge with a real
  # JSON body; a Bearer-shaped credential nobody issued gets no body at
  # all, empty, which reads like the API is confused by a scheme it was
  # not expecting rather than refusing a key it recognised and rejected.
  absent_error: not_authorized
  rejected_error: unauthorized_empty

responses:
  list:
    style: wrapped
    key: results
    count_field: totalCount
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: errorCode
    status_field: error
    type_field: "-"
    fields:
      reason: Not Acceptable

resources:
  cluster:
    id:
      style: hex
      length: 24
    fields:
      name:
        type: string
      groupId:
        type: string
      clusterType:
        type: string
        default: REPLICASET
      stateName:
        type: string
        default: IDLE
      mongoDBVersion:
        type: string
      createDate:
        type: datetime
      # The fields the 2023-01-01 view has and the 2024-08-05 view does not.
      mongoURI:
        type: string
      mongoURIWithOptions:
        type: string
      srvAddress:
        type: string
      diskSizeGB:
        type: number
      numShards:
        type: integer
      replicationFactor:
        type: integer
      providerSettings:
        type: map
      # And the ones only the newer view has.
      connectionStrings:
        type: map
      effectiveReplicationSpecs:
        type: list
      redactClientLogData:
        type: boolean
        default: false
      retainBackups:
        type: boolean
        default: false

routes:
  # The oldest of the three dated views, which is the one that still carries
  # the connection string on the cluster itself.
  - method: GET
    path: /api/atlas/v2/groups/{groupId}/clusters
    resource: cluster
    operation: list
    pagination:
      # itemsPerPage and pageNum, from Atlas's own v2 description read
      # 2026-09-05: itemsPerPage is the "number of items that the response
      # returns per page", typed with a default of 100 and a maximum of 500,
      # and pageNum is the "number of the page that displays the current
      # set", defaulting to 1.
      #
      # Neither name is limit and neither is cursor, so both halves were
      # wrong and the page was a tenth of what Atlas serves. The route also
      # takes includeCount, defaulting to true -- the total is a thing a
      # caller can switch off, which is worth knowing before writing a loop
      # that depends on it.
      style: page
      limit: 100
      max_limit: 500
      limit_param: itemsPerPage
      cursor_param: pageNum
      first_page: 1
    scope:
      - groupId
    matches_header:
      Accept: application/vnd.atlas.2023-01-01+json
    returns:
      - id
      - name
      - clusterType
      - stateName
      - mongoDBVersion
      - createDate
      - mongoURI
      - mongoURIWithOptions
      - srvAddress
      - diskSizeGB
      - numShards
      - replicationFactor
      - providerSettings

  # The newest, where those fields are gone and the connection details have
  # moved into an object of their own.
  - method: GET
    path: /api/atlas/v2/groups/{groupId}/clusters
    resource: cluster
    operation: list
    pagination:
      # itemsPerPage and pageNum, from Atlas's own v2 description read
      # 2026-09-05: itemsPerPage is the "number of items that the response
      # returns per page", typed with a default of 100 and a maximum of 500,
      # and pageNum is the "number of the page that displays the current
      # set", defaulting to 1.
      #
      # Neither name is limit and neither is cursor, so both halves were
      # wrong and the page was a tenth of what Atlas serves. The route also
      # takes includeCount, defaulting to true -- the total is a thing a
      # caller can switch off, which is worth knowing before writing a loop
      # that depends on it.
      style: page
      limit: 100
      max_limit: 500
      limit_param: itemsPerPage
      cursor_param: pageNum
      first_page: 1
    scope:
      - groupId
    matches_header:
      Accept: application/vnd.atlas.2024-08-05+json
    returns:
      - id
      - name
      - clusterType
      - stateName
      - mongoDBVersion
      - createDate
      - connectionStrings
      - effectiveReplicationSpecs
      - redactClientLogData
      - retainBackups

  # And a request that names no version at all. See the gaps at the top of
  # this file: the refusal is the lesson, the status is a reading.
  - method: GET
    path: /api/atlas/v2/groups/{groupId}/clusters
    error: unsupported_version

errors:
  # Confirmed live 2026-09-05 against cloud.mongodb.com, no account and no
  # key -- no Authorization header at all. This file's own detail sentence
  # matched exactly; the errorCode did not, and a Digest challenge header
  # was not modelled at all.
  not_authorized:
    status: 401
    message: You are not authorized for this resource.
    code: UNEXPECTED_ERROR
    headers:
      WWW-Authenticate: 'Digest realm="MMS Public API", domain="", algorithm=MD5, qop="auth", stale=false'
    fields:
      reason: Unauthorized

  # A Bearer-shaped credential nobody issued. Confirmed live 2026-09-05: no
  # body at all, not the JSON above -- this file's own existing case
  # expected the JSON shape here and had never been checked against it.
  unauthorized_empty:
    status: 401
    empty: true

  unsupported_version:
    status: 406
    message: >-
      The Accept header must name a supported API version, as in
      application/vnd.atlas.2024-08-05+json.
    code: UNSUPPORTED_API_VERSION

  resource_missing:
    status: 404
    message: No cluster found.
    code: CLUSTER_NOT_FOUND

  invalid_request:
    status: 400
    message: The request was invalid.
    code: INVALID_ATTRIBUTE

fixtures:
  empty: {}

  project:
    cluster:
      - id: 32b6e34b3d91647abb20e7b8
        groupId: 5f7d7b8e9c1a2b3c4d5e6f70
        name: production
        clusterType: REPLICASET
        stateName: IDLE
        mongoDBVersion: 8.0.4
        createDate: "2026-02-11T09:30:00.000Z"
        # What the 2023-01-01 view hands back and the newer one does not.
        mongoURI: mongodb://production-shard-00-00.abcde.mongodb.net:27017
        mongoURIWithOptions: mongodb://production-shard-00-00.abcde.mongodb.net:27017/?ssl=true&authSource=admin
        srvAddress: mongodb+srv://production.abcde.mongodb.net
        diskSizeGB: 40
        numShards: 1
        replicationFactor: 3
        providerSettings:
          providerName: AWS
          instanceSizeName: M10
          regionName: EU_WEST_1
        # And what the 2024-08-05 view hands back instead.
        connectionStrings:
          standard: mongodb://production-shard-00-00.abcde.mongodb.net:27017/?ssl=true&authSource=admin
          standardSrv: mongodb+srv://production.abcde.mongodb.net
        effectiveReplicationSpecs:
          - id: 62b6e34b3d91647abb20e7c1
            zoneName: Zone 1
        redactClientLogData: false
        retainBackups: true
      - id: 44c7f45c4ea2758bcc31f8c9
        groupId: 5f7d7b8e9c1a2b3c4d5e6f70
        name: staging
        clusterType: REPLICASET
        stateName: UPDATING
        mongoDBVersion: 8.0.4
        createDate: "2026-05-04T14:12:00.000Z"
        mongoURI: mongodb://staging-shard-00-00.abcde.mongodb.net:27017
        srvAddress: mongodb+srv://staging.abcde.mongodb.net
        diskSizeGB: 10
        numShards: 1
        replicationFactor: 3
        providerSettings:
          providerName: AWS
          instanceSizeName: M0
          regionName: EU_WEST_1
        connectionStrings:
          standardSrv: mongodb+srv://staging.abcde.mongodb.net
        redactClientLogData: false
        retainBackups: false

conformance:
  - name: an older date hands back the address you connect with
    source: https://github.com/mongodb/openapi
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
      headers:
        Authorization: Bearer cauldron-atlas-fixture-token
        Accept: application/vnd.atlas.2023-01-01+json
    expect:
      status: 200
      body:
        # PaginatedLegacyClusterView. mongoURI and srvAddress are on the
        # cluster, which is where an application looks for them.
        "results[0].name": production
        "results[0].mongoURI": mongodb://production-shard-00-00.abcde.mongodb.net:27017
        "results[0].srvAddress": mongodb+srv://production.abcde.mongodb.net
        "results[0].diskSizeGB": 40
        # Twenty-four hexadecimal characters, which is what comes out of the
        # database underneath and what every path expects back.
        "results[0].id": 32b6e34b3d91647abb20e7b8
      absent:
        - results[0].connectionStrings

  - name: and a newer date on the same URL takes them away
    source: https://github.com/mongodb/openapi
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
      headers:
        Authorization: Bearer cauldron-atlas-fixture-token
        Accept: application/vnd.atlas.2024-08-05+json
    expect:
      status: 200
      body:
        # PaginatedClusterDescription20240805. Same URL, same credentials,
        # same instant -- and the connection details have moved into an
        # object while mongoURI, srvAddress and diskSizeGB are simply gone.
        "results[0].name": production
        "results[0].connectionStrings.standardSrv": mongodb+srv://production.abcde.mongodb.net
        "results[0].retainBackups": true
      absent:
        - results[0].mongoURI
        - results[0].srvAddress
        - results[0].diskSizeGB
        - results[0].numShards

  - name: a request that names no version is refused
    source: https://github.com/mongodb/openapi
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
      headers:
        Authorization: Bearer cauldron-atlas-fixture-token
    expect:
      # The document lists three content types for the success and no plain
      # application/json. Refusing is the reading; the status is not one
      # MongoDB has written down -- see the gaps at the top of the file.
      status: 406
      body:
        errorCode: UNSUPPORTED_API_VERSION
        detail: >-
          The Accept header must name a supported API version, as in
          application/vnd.atlas.2024-08-05+json.

  - name: both versions agree about the state a cluster is in
    source: https://github.com/mongodb/openapi
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
      headers:
        Authorization: Bearer cauldron-atlas-fixture-token
        Accept: application/vnd.atlas.2024-08-05+json
    expect:
      status: 200
      body:
        # stateName is in both views, and it is the field that says a cluster
        # is not ready. The second cluster is UPDATING, which is not a
        # failure and is not IDLE either.
        "results[1].name": staging
        "results[1].stateName": UPDATING
        "results[0].stateName": IDLE
        totalCount: 2

  - name: another project's clusters are not in this project's listing
    source: https://github.com/mongodb/openapi
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/0000000000000000000000ff/clusters
      headers:
        Authorization: Bearer cauldron-atlas-fixture-token
        Accept: application/vnd.atlas.2024-08-05+json
    expect:
      status: 200
      body:
        totalCount: 0
      absent:
        - results[0]

  - name: a token the organisation does not know gets no body at all
    # This asserted a JSON body with error and errorCode and passed, because
    # the Recipe served one. Confirmed live 2026-09-05: a Bearer-shaped
    # credential nobody issued answers empty, zero bytes -- see the header.
    source: https://cloud.mongodb.com/api/atlas/v2/groups
    verified: "2026-09-05"
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
      headers:
        Authorization: Bearer not-this-organisations-token
        Accept: application/vnd.atlas.2024-08-05+json
    expect:
      status: 401
      no_body: true

  - name: no credential at all gets a real Digest challenge instead
    source: https://cloud.mongodb.com/api/atlas/v2/groups
    verified: "2026-09-05"
    fixture: project
    request:
      method: GET
      path: /api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters
    expect:
      status: 401
      body:
        error: 401
        reason: Unauthorized
        detail: You are not authorized for this resource.
        errorCode: UNEXPECTED_ERROR
      header_matches:
        WWW-Authenticate: '^Digest realm="MMS Public API"'

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if itemsPerPage was read --
  # with the name ignored the whole collection comes back, because the
  # whole collection is two records. No third record is needed for that,
  # and none is invented.
  - name: "itemsPerPage is read, because a page of one out of two is not the whole collection"
    source: "https://github.com/mongodb/openapi"
    fixture: project
    request:
      method: GET
      path: "/api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters"
      query:
        "itemsPerPage": "1"
      headers:
        "Authorization": "Bearer cauldron-atlas-fixture-token"
        "Accept": "application/vnd.atlas.2023-01-01+json"
    expect:
      status: 200
      body:
        "results[0].id": "32b6e34b3d91647abb20e7b8"
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from pageNum=2 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "pageNum moves the page on, and the second record is what comes back"
    source: "https://github.com/mongodb/openapi"
    fixture: project
    request:
      method: GET
      path: "/api/atlas/v2/groups/5f7d7b8e9c1a2b3c4d5e6f70/clusters"
      query:
        "itemsPerPage": "1"
        "pageNum": "2"
      headers:
        "Authorization": "Bearer cauldron-atlas-fixture-token"
        "Accept": "application/vnd.atlas.2023-01-01+json"
    expect:
      status: 200
      body:
        "results[0].id": "44c7f45c4ea2758bcc31f8c9"
      absent:
        - "results[1]"

