# Finnhub Recipe for Cauldron
#
# c is a list of closing prices on one endpoint and the current price on
# another.
#
# Finnhub's own descriptions, verbatim: on a candle, c is "List of close
# prices for returned candles". On a quote, c is "Current price". Same
# letter, same API, and not merely a different meaning -- a different type.
# One is an array and the other is a number.
#
# o, h and l do it too. Five one-letter fields that are arrays here and
# scalars there, so a helper written to read a price out of a Finnhub
# response works against one endpoint and returns an array from the other,
# and an array is truthy, and a chart drawn from it is empty rather than
# wrong.
#
# Five more the Recipe pins:
#
#   1. A candle response is columns, not rows. Seven parallel arrays, one
#      per field, and a bar is an index across all of them. There is no
#      object for a bar and nothing to iterate that represents one, so
#      every read is a zip and every zip assumes the arrays are the same
#      length.
#   2. no_data is a 200. The status is a string called s inside the body,
#      it says ok or no_data, and when it says no_data the arrays are not
#      empty -- they are absent. So response.c.length throws rather than
#      returning zero, on a request that succeeded.
#   3. The response does not say what you asked for. No symbol, no
#      resolution, no from, no to. If a plan returns two years where ten
#      were requested, nothing in the body says the range was shortened;
#      the only way to know is to compare t[0] against what you sent, and
#      nobody does.
#   4. The same sentence arrives with two different statuses. "You don't
#      have access to this resource." is documented as a 403 and reported
#      as a 401, so neither the message nor the status tells you whether
#      the key is wrong or the plan is.
#   5. A quote has no timestamp in this description. The four prices, the
#      change and the percent change, and nothing saying when. Which
#      trading day o, h and l belong to is a question the object does not
#      answer.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing is truncated. Whether a plan shortens a range or refuses it
#     outright is an account fact, not a documented one, and this Recipe
#     reproduces the shape that makes either invisible rather than claiming
#     which one your key gets.
#   - No arithmetic and no market. The arrays are the fixture's, in the
#     fixture's order, whatever symbol, resolution or range was asked for.
#   - Some Finnhub failures are reported as not being JSON at all. This
#     Recipe sends the documented JSON shape, so a client that copes with
#     it may still meet something else in production.
#   - Fundamentals, news, sentiment, filings, forex, crypto, the websocket
#     feed and every premium endpoint are not modelled.
#
# Probed live, unauthenticated, on 2026-09-05, against finnhub.io:
#
#   1. GET /api/v1/quote with no credential of any kind answers 401
#      {"error":"Please use an API key."}. An invented value in the
#      X-Finnhub-Token header answers a different sentence, still 401:
#      {"error":"Invalid API key."}. This file had declared only the second
#      of the two, under a name (invalid_key) nothing wired to
#      authentication at all -- no case armed it and no auth field named it,
#      so every credential failure in this emulator answered a hardcoded
#      generic sentence neither struck value matches. auth.absent_error
#      below fixes both problems: the name is now reachable and the two
#      verdicts carry the two different sentences actually sent.
#   2. The identical invented value sent as a query parameter (?token=...)
#      answers the identical "Invalid API key." rather than "Please use an
#      API key." -- Finnhub reads a token from the query string as readily
#      as from the header, which this file did not declare at all.
#      auth.also below adds that channel.
#   3. GET /api/v1/not-a-real-endpoint and POST on the real quote path (a
#      method this Recipe does not declare for it), both with no credential,
#      answer the identical "Please use an API key." rather than a 404 or a
#      405 -- Finnhub checks the credential before it looks at the path or
#      the method at all, which is Cauldron's own default ordering and
#      needed no change here.
#
# Keys below are fixtures, not secrets.

recipe: finnhub
capability: brokerage
version: 0.1.0

upstream:
  api: v1
  docs: https://finnhub.io/docs/api

auth:
  scheme: header
  header: X-Finnhub-Token
  # Struck live: a token in the query string is read as readily as one in
  # the header, and answers the same "Invalid API key." for a wrong value.
  also:
    - scheme: query
      param: token
  # Struck live: no credential at all names its own absence, a different
  # sentence from a present-but-wrong one. See the header.
  absent_error: no_api_key
  keys:
    - cauldron000000000000finnhub

responses:
  list:
    style: bare
  resource:
    style: bare
  # No code, no type, no envelope: a failure is one key called error with a
  # sentence in it.
  error:
    style: flat
    code_field: "-"
    message_field: error
    type_field: "-"

resources:
  # Seven parallel arrays. A bar is an index across all of them, and there
  # is no object anywhere that represents one.
  candle:
    collection: candles
    id:
      style: opaque
      length: 5
      # Finnhub does not echo the symbol. What you asked about is in the
      # query string and nowhere in the answer.
      field: "-"
    fields:
      o:
        type: list
      h:
        type: list
      l:
        type: list
      # List of close prices. On the quote below, this letter is a number.
      c:
        type: list
      v:
        type: list
      t:
        type: list
      # ok or no_data, inside a 200. When it says no_data the arrays are
      # absent rather than empty.
      s:
        type: string
        default: ok

  # The same five letters, as numbers.
  quote:
    collection: quotes
    id:
      style: opaque
      length: 5
      field: "-"
    fields:
      o:
        type: number
      h:
        type: number
      l:
        type: number
      # Current price. On the candle above, this letter is an array.
      c:
        type: number
      pc:
        type: number
      d:
        type: number
      dp:
        type: number

routes:
  # The symbol is a query parameter and does not come back.
  - method: GET
    path: /api/v1/stock/candle
    resource: candle
    operation: get
    id_from: query:symbol

  - method: GET
    path: /api/v1/quote
    resource: quote
    operation: get
    id_from: query:symbol

errors:
  # Documented as a 403 and reported as a 401 by people who hit it, so
  # neither half of this tells you whether the key is wrong or the plan is.
  no_access:
    status: 403
    message: "You don't have access to this resource."

  # Struck live with an invented header token and, separately, an invented
  # query token -- the identical sentence either way. This name now wires
  # to authentication; before this probe it was declared and never reached.
  authentication_error:
    status: 401
    message: "Invalid API key."

  # Struck live with no credential of any kind.
  no_api_key:
    status: 401
    message: "Please use an API key."

  rate_limit:
    status: 429
    message: "API limit reached. Please try again later."

fixtures:
  empty: {}

  two-symbols:
    candle:
      # Three sessions, seven arrays, and the only thing tying them
      # together is the index.
      - id: AAPL
        o: [214.32, 216.50, 218.95]
        h: [217.85, 219.12, 221.40]
        l: [213.90, 215.77, 218.02]
        c: [216.44, 218.90, 220.77]
        v: [48213700, 51002300, 46887100]
        t: [1786924800, 1787011200, 1787184000]

      # no_data, at 200, with no arrays at all. Not empty ones: absent
      # ones, so anything reading a length throws on a request that
      # succeeded.
      - id: ZZZZ
        s: no_data

    quote:
      # The same letters as the first candle above, as numbers, and c is a
      # different quantity: the current price rather than a list of closes.
      - id: AAPL
        o: 218.95
        h: 221.40
        l: 218.02
        c: 220.77
        pc: 218.90
        d: 1.87
        dp: 0.8552

# The resource cases below are derived from the Swagger description Finnhub
# publishes and from its own documentation, rather than a real account -- no
# key for one was ever created. The refusal cases carrying a verified date
# were struck live, unauthenticated, against finnhub.io; see the header.
conformance:
  - name: c is a list of closing prices here
    # Finnhub's own words. Seven parallel arrays, and a bar is an index
    # across all of them rather than an object anywhere.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/stock/candle
      query:
        symbol: AAPL
        resolution: D
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        s: ok
        "c[0]": 216.44
        "c[2]": 220.77
        "t[0]": 1786924800

  - name: and the current price there
    # Same letter, same API, a number instead of an array. A helper written
    # to read a price out of a Finnhub response returns an array from one
    # of these two, and an array is truthy.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/quote
      query:
        symbol: AAPL
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        c: 220.77
        pc: 218.90
        d: 1.87

  - name: o, h and l change type too
    # Five one-letter fields that are arrays on the candle and scalars on
    # the quote, and nothing but the endpoint says which you have.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/quote
      query:
        symbol: AAPL
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        o: 218.95
        h: 221.40
        l: 218.02
      absent:
        - "o[0]"
        - s
        - t

  - name: no_data is a 200 and the arrays are gone
    # Not empty arrays: absent ones. So reading a length throws, on a
    # request that succeeded, and the only thing that said so is a string
    # called s.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/stock/candle
      query:
        symbol: ZZZZ
        resolution: D
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        s: no_data
      absent:
        - c
        - t
        - o
        - error

  - name: the answer does not say what was asked
    # No symbol, no resolution, no from, no to. If a plan returns less
    # history than was requested, nothing here says the range was
    # shortened: the only way to know is to compare t[0] against what you
    # sent.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/stock/candle
      query:
        symbol: AAPL
        resolution: D
        from: "1735689600"
        to: "1787184000"
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        "t[0]": 1786924800
      absent:
        - symbol
        - resolution
        - from
        - to

  - name: the arrays are only aligned by position
    # Nothing ties o[1] to c[1] except the index, and nothing in the
    # response promises the seven are the same length.
    source: https://finnhub.io/static/swagger.json
    fixture: two-symbols
    request:
      method: GET
      path: /api/v1/stock/candle
      query:
        symbol: AAPL
        resolution: D
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 200
      body:
        "o[1]": 216.50
        "h[1]": 219.12
        "l[1]": 215.77
        "c[1]": 218.90
        "v[1]": 51002300
        "t[1]": 1787011200

  - name: a premium endpoint refuses with a sentence and no code
    # Documented as a 403 and reported as a 401, with the same message
    # either way, so neither tells you whether the key is wrong or the plan
    # is.
    source: https://finnhub.io/docs/api/authentication
    fixture: two-symbols
    arm: no_access
    request:
      method: GET
      path: /api/v1/stock/candle
      query:
        symbol: AAPL
        resolution: D
      headers:
        X-Finnhub-Token: cauldron000000000000finnhub
    expect:
      status: 403
      body:
        error: "You don't have access to this resource."
      absent:
        - code
        - message
        - s

  - name: no credential at all is a different sentence from a wrong one
    source: https://finnhub.io/api/v1/quote
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v1/quote
      query:
        symbol: AAPL
    expect:
      status: 401
      body:
        error: "Please use an API key."

  - name: an invented header token is refused with a different sentence
    source: https://finnhub.io/api/v1/quote
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v1/quote
      query:
        symbol: AAPL
      headers:
        X-Finnhub-Token: totally-invented-wrong-token
    expect:
      status: 401
      body:
        error: "Invalid API key."

  - name: the token also travels in the query string
    # Struck live: an invented value here answers the identical "Invalid
    # API key." a wrong header value gets, so Finnhub reads this channel as
    # readily as the header.
    source: https://finnhub.io/api/v1/quote
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v1/quote
      query:
        symbol: AAPL
        token: totally-invented-wrong-token
    expect:
      status: 401
      body:
        error: "Invalid API key."

  - name: an unrouted path with no credential is the same refusal, not a 404
    # Struck live. Finnhub checks the credential before it looks at the
    # path at all.
    source: https://finnhub.io/api/v1/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v1/not-a-real-endpoint
    expect:
      status: 401
      body:
        error: "Please use an API key."

  - name: a wrong method with no credential is the same refusal, not a 405
    source: https://finnhub.io/api/v1/quote
    verified: "2026-09-05"
    fixture: empty
    request:
      method: POST
      path: /api/v1/quote
      query:
        symbol: AAPL
    expect:
      status: 401
      body:
        error: "Please use an API key."

  # The names. This Recipe declares 1 field(s) on a quote that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a quote carries the field names this Recipe declares"
    source: "https://finnhub.io/static/swagger.json"
    fixture: two-symbols
    request:
      method: GET
      path: "/api/v1/quote"
      query:
        "symbol": "AAPL"
      headers:
        "X-Finnhub-Token": "cauldron000000000000finnhub"
    expect:
      status: 200
      body:
        "dp": 0.8552

