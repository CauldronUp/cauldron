# Radarr Recipe for Cauldron
#
# Written against Radarr's own generated OpenAPI document, published in its own
# repository -- github.com/Radarr/Radarr, src/Radarr.Api.V3/openapi.json, 164
# paths, info.version 3.0.0 -- read on 2026-09-06. Radarr is self-hosted, so
# there is no public instance to strike: nothing here is verified live, and the
# claims are the provider's own document.
#
# This Recipe exists in a pair with `sonarr`, and the pair is the point.
#
# **Radarr and Sonarr are the same API until they are not.**
#
# Same fork, same framework, same `/api/v3` prefix, same `info.version` string
# of "3.0.0", same two credential schemes with the same names. 134 paths appear
# in both documents. A client written for one and pointed at the other connects,
# authenticates, and answers 200.
#
# Thirteen of those shared paths take different parameters. GET /api/v3/history
# takes `movieIds` and `includeMovie` here, and `seriesIds` and `includeSeries`
# on Sonarr. GET /api/v3/calendar takes four parameters on Sonarr that this one
# does not have. The framework is ASP.NET Core, whose model binding drops a
# query key with no matching property rather than refusing it -- so the wrong
# parameter is not an error, it is a filter that does not filter, and the
# response is every record instead of none.
#
# **And the same integer means different things on the two.**
#
# `eventType` is a filter taking an array of integers, and a response field
# holding a string. The two documents list their members in this order:
#
#   position | Radarr                 | Sonarr
#   ---------|------------------------|-----------------------
#      0     | unknown                | unknown
#      1     | grabbed                | grabbed
#      2     | downloadFolderImported | seriesFolderImported
#      3     | downloadFailed         | downloadFolderImported
#      4     | movieFileDeleted       | downloadFailed
#      5     | movieFolderImported    | episodeFileDeleted
#      6     | movieFileRenamed       | episodeFileRenamed
#      7     | downloadIgnored        | downloadIgnored
#
# Only nought, one and seven agree. Neither document pins explicit values, so
# the integers a caller sends are the members' declaration positions -- which
# means `?eventType=3` asks for failed downloads here and successful imports on
# Sonarr. A monitoring job counting failures against the wrong one of the pair
# counts successes, and nothing anywhere returns an error.
#
# What tells them apart is `appName` on GET /api/v3/system/status, and nothing
# else: not the path, not the version, not the credential, not the shape of a
# listing.
#
# **The same field is an integer going out and a string coming back.**
#
# You filter with `eventType=3` and read back `"eventType": "downloadFailed"`.
# One name, one endpoint, two types, and no client type can round-trip it.
#
# **The credential is documented as a query parameter as well as a header.**
#
# Both schemes are declared: `X-Api-Key` in a header, and `apikey` in the query
# string, described in the document as "Apikey passed as query parameter". A
# credential in a URL reaches access logs, proxy logs, browser history and
# Referer headers -- and these are self-hosted boxes commonly put behind a
# reverse proxy that logs full URLs by default.
#
# One more difference the pair makes visible: this document declares OpenAPI
# 3.0.4 and Sonarr's declares 3.0.1, from the same generator on the same fork.
# A toolchain pinned to one patch of the specification reads one of them and
# refuses the other, and neither project's release notes mentions it.
#
# **The status endpoint is a host inventory.** SystemResource carries
# startupPath, appData, osName, osVersion, isDocker, sqliteVersion,
# migrationVersion, runtimeVersion, branch and packageUpdateMechanism. Absolute
# filesystem paths and host details, behind a credential that the same document
# says may travel in the query string.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Sonarr is self-hosted and
#     there is no public instance; every claim is the generated document's.
#   - History and system status. 164 paths is a media manager: movies, files,
#     queue, indexers, download clients, import lists, notifications, quality
#     profiles, collections and the command endpoint each want their own
#     evidence.
#   - The eventType filter is served as a filter over the string field, not
#     over the integers. Serving the integer mapping would mean asserting the
#     declaration positions are the wire values, which the document does not
#     state -- it is inferred from the enum having no explicit values, and the
#     inference is written down rather than encoded.
#   - The credential is checked in the header. The query-string scheme is
#     recorded and not served, because serving it would make a credential in a
#     URL the easy path in local development.

recipe: radarr
capability: media
version: 0.1.0

upstream:
  api: "v3"
  docs: https://radarr.video/docs/api/
  spec: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
  spec_hash: 69f2de2c6c1663b013a283444f533084d3560c3b68ad3b9f0f5320e990be65f5
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldronradarrapikey0000000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: records
    count_field: totalRecords
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message

resources:
  history:
    id:
      style: numeric
      type: number
    fields:
      # The scope field Sonarr does not have. Its counterpart there is
      # seriesId, and a client sending the wrong one filters nothing.
      #
      # One identifier where Sonarr has two, because a series has episodes and
      # a movie is the whole thing -- so a record here cannot be narrowed
      # below the title.
      movieId:
        type: number
      sourceTitle:
        type: string
      # A string here and an integer in the filter of the same name.
      eventType:
        type: string
        default: grabbed
      downloadId:
        type: string
      # An ISO 8601 string, unlike most of this document's numbers.
      date:
        type: datetime
      qualityCutoffNotMet:
        type: boolean
        default: false

  status:
    id:
      style: opaque
      field: appName
    fields:
      # The only field in the whole API that says which of the pair you are
      # talking to.
      appName:
        type: string
      instanceName:
        type: string
      version:
        type: string
      branch:
        type: string
      # Host inventory, behind a credential the same document says may travel
      # in a query string.
      appData:
        type: string
      startupPath:
        type: string
      osName:
        type: string
      isDocker:
        type: boolean
        default: false
      sqliteVersion:
        type: string
      migrationVersion:
        type: number

routes:
  - method: GET
    path: /api/v3/history
    resource: history
    operation: list
    pagination:
      style: page
      limit_param: pageSize
      cursor_param: page
      limit: 10
      first_page: 1
    filters:
      # The one that exists here and not on Sonarr.
      - field: movieId
        param: movieIds
      - field: eventType
        param: eventType

  - method: GET
    path: /api/v3/system/status
    resource: status
    operation: list
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
  not_found:
    status: 404
    message: "NotFound"
  rate_limit:
    status: 429
    message: "Too Many Requests"

fixtures:
  empty:
    history: []
    status: []

  library:
    status:
      - appName: Radarr
        instanceName: Radarr
        version: 5.26.2.10099
        branch: master
        appData: /config
        startupPath: /app/radarr/bin
        osName: ubuntu
        isDocker: true
        sqliteVersion: 3.45.1
        migrationVersion: 216
    history:
      - id: 9001
        movieId: 12
        sourceTitle: "Example.Film.2024.1080p"
        eventType: grabbed
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-05T18:22:41Z"
        qualityCutoffNotMet: false
      - id: 9002
        movieId: 12
        sourceTitle: "Example.Film.2024.1080p"
        # Position 2 here. Position 2 on Sonarr is seriesFolderImported, and
        # what Sonarr calls position 2's name lands at position 3 there.
        eventType: downloadFolderImported
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-05T18:41:09Z"
        qualityCutoffNotMet: false
      - id: 9003
        movieId: 40
        sourceTitle: "Other.Film.2019.720p"
        # Position 3 here, which is where Sonarr puts downloadFolderImported.
        # Same integer, opposite meaning: one is a success and one is a
        # failure.
        eventType: downloadFailed
        downloadId: "F6E5D4C3B2A1"
        date: "2026-09-06T02:10:55Z"
        qualityCutoffNotMet: true

conformance:
  - name: only appName says which of the pair this is
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # Not the path, not the version string, not the credential, not the
        # shape of a listing. This field.
        appName: Radarr
        # And info.version is 3.0.0 in the document on both sides of the pair,
        # so it discriminates nothing.
        version: 5.26.2.10099

  - name: the status endpoint is a host inventory
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # Absolute filesystem paths and host details, behind a credential the
        # same document says may travel in a query string.
        appData: /config
        startupPath: /app/radarr/bin
        osName: ubuntu
        isDocker: true
        sqliteVersion: 3.45.1
        migrationVersion: 216

  - name: the paged envelope names its own page and size back
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        page: "1"
        pageSize: "2"
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # page, pageSize, totalRecords, records. Not data, not results, and
        # the count is of the whole set.
        page: 1
        pageSize: 2
        totalRecords: 3
        'records[0].id': 9001
      absent:
        - 'records[2]'

  - name: eventType is a string coming back and an integer going out
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        # The filter takes an array of integers upstream. This Recipe filters
        # on the string, because encoding the integer mapping would mean
        # asserting that the enum's declaration positions are its wire values
        # -- which is inferred and not stated. The name is what is pinned here.
        eventType: downloadFolderImported
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # A string coming back, where the filter of the same name takes
        # integers going out. No client type round-trips it.
        'records[0].eventType': downloadFolderImported
        'records[0].id': 9002
      absent:
        - 'records[1]'

  - name: the scope field is movieId, which Sonarr does not have
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        # movieIds here; seriesIds on Sonarr. ASP.NET Core model binding drops
        # a query key with no matching property, so sending the wrong one is
        # not an error -- it is a filter that returns everything.
        movieIds: "40"
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        'records[0].movieId': 40
        'records[0].id': 9003
      absent:
        - 'records[1]'

  - name: a record names one identifier where Sonarr names two
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # One identifier where Sonarr has two, because a series has episodes
        # and a movie is the whole thing.
        'records[0].movieId': 12
        'records[0].sourceTitle': "Example.Film.2024.1080p"
        'records[0].downloadId': "A1B2C3D4E5F6"
        'records[0].date': "2026-09-05T18:22:41Z"
        'records[0].qualityCutoffNotMet': false

  - name: no credential is refused
    source: https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"

  - name: "the rate limit says so in these words"
    source: "https://radarr.video/docs/api/"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 429
      body:
        message: "Too Many Requests"

  - name: "a missing record says so in these words"
    source: "https://radarr.video/docs/api/"
    arm: not_found
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 404
      body:
        message: "NotFound"

  - name: "the instance names itself separately from the product"
    source: "https://raw.githubusercontent.com/Radarr/Radarr/develop/src/Radarr.Api.V3/openapi.json"
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronradarrapikey0000000000000
    expect:
      status: 200
      body:
        # instanceName is settable and defaults to the product name, so it
        # looks like a discriminator and is not one: an operator running two
        # Radarrs renames one of them, and an operator running Radarr and
        # Sonarr may rename both to the same thing.
        instanceName: Radarr
        branch: master
