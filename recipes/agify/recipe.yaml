# Agify Recipe for Cauldron
#
# Three APIs, three hostnames, one budget.
#
# api.agify.io, api.genderize.io and api.nationalize.io are presented as
# separate services with separate documentation, and they share a single daily
# allowance of twenty-five requests. Interleaved calls decrement one counter:
#
#   GET api.agify.io/?name=a1        ->  X-Rate-Limit-Remaining: 15
#   GET api.genderize.io/?name=a2    ->  X-Rate-Limit-Remaining: 14
#   GET api.nationalize.io/?name=a3  ->  X-Rate-Limit-Remaining: 13
#   GET api.agify.io/?name=a4        ->  X-Rate-Limit-Remaining: 12
#   GET api.genderize.io/?name=a5    ->  X-Rate-Limit-Remaining: 11
#
# One number, three hosts, minus one each time. So the obvious thing to build --
# ask all three about a name and show age, gender and country together -- costs
# three of the day's twenty-five, and a page that does it for eight visitors is
# finished until midnight.
#
# **And X-Rate-Limit-Reset is seconds until midnight UTC, not a timestamp.** It
# read 60485 while there were 60501 seconds left in the UTC day. A client
# passing it to new Date(reset * 1000) lands in January 1971; a client treating
# it as a window length waits sixteen hours it did not need to.
#
# Written against the live API rather than a document: every case below was
# checked against api.agify.io on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A name nobody has ever heard of is a 200, not a 404. ?name=zzzzqqqxyz
#      answers {"count": 0, "name": "zzzzqqqxyz", "age": null} -- the request
#      echoed back with the answer set to null, so a client that checks the
#      status code and reads .age gets null and no reason for it.
#   2. Present-but-empty and absent are different. ?name= answers 200 with
#      {"count": 0, "name": "", "age": null}; omitting the parameter entirely
#      answers 422 {"error": "Missing 'name' parameter"}. Most HTTP stacks
#      collapse those two into one case. This one does not.
#   3. The 422 is the only response that carries no rate-limit headers at all --
#      no limit, no remaining, no reset -- and it comes back on a different
#      content type: application/json, without the charset=utf-8 every success
#      declares. The response that tells a client it is doing something wrong is
#      the one that will not tell it how much budget is left. It is also free:
#      remaining went 10 -> 9 across two successes with a 422 between them.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The counter is a real quota against a real host, so the numbers in the
#     cases are the ones recorded on the date shown and not a running total.
#   - ?name= with an empty value answers 200 on the real API and the 422 here.
#     An absent identifier and an empty one are the same thing to a router, so
#     the distinction is recorded above rather than served.
#   - Two names are served: one the API knows and one it does not. It echoes
#     back whatever it is sent, which an emulator holding recorded records
#     cannot do for arbitrary input.
#   - The sibling hosts are not served. One Recipe is one API, and the shared
#     budget is evidence recorded above rather than a shape to emulate.

recipe: agify
capability: identity
version: 0.1.0

upstream:
  api: agify
  docs: https://agify.io/documentation

auth:
  # Public. A key raises the allowance; without one there are twenty-five a day.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # A bare {"error": "..."} and nothing else -- no code, no type, no status.
    style: flat
    message_field: error

resources:
  estimate:
    id:
      style: opaque
      # The name is the identifier and the API echoes it back under its own
      # key, so nothing separate identifies the record.
      field: "-"
      carried_by: name
    fields:
      # How many records the estimate is drawn from. Zero when there is no
      # answer, which is the only signal that null means "unknown".
      count:
        type: integer
      name:
        type: string
      # null for a name the API does not know, on a 200.
      age:
        type: integer

routes:
  - method: GET
    path: /
    resource: estimate
    operation: get
    id_from: query:name
    # Omitting the parameter entirely, which is the one thing that is an error.
    not_found: missing_name
    headers:
      # Every success carries all three. The 422 carries none of them.
      X-Rate-Limit-Limit: "25"
      X-Rate-Limit-Remaining: "20"
      # Seconds until midnight UTC, not a timestamp and not a window.
      X-Rate-Limit-Reset: "60511"
      Access-Control-Allow-Origin: "*"

errors:
  missing_name:
    # Not a 400 and not a 404.
    status: 422
    message: "Missing 'name' parameter"

fixtures:
  empty: {}

  names:
    estimate:
      - id: michael
        count: 311558
        name: michael
        age: 57
      # A name the API has never seen: still a 200, with the answer set to null
      # and the count set to zero.
      - id: zzzzqqqxyz
        count: 0
        name: zzzzqqqxyz
        age: null

conformance:
  - name: a name the API knows
    source: https://api.agify.io?name=michael
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /?name=michael
    expect:
      status: 200
      body:
        count: 311558
        name: michael
        age: 57

  - name: a name nobody has heard of is a 200, not a 404
    source: https://api.agify.io?name=zzzzqqqxyz
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /?name=zzzzqqqxyz
    expect:
      # The request echoed back with the answer set to null, so a client that
      # checks the status and reads .age gets null and no reason for it.
      status: 200
      body:
        count: 0
        name: zzzzqqqxyz
        age: null

  - name: one budget of twenty-five, shared with two other hostnames
    source: https://api.agify.io?name=michael
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /?name=michael
    expect:
      status: 200
      headers:
        # api.genderize.io and api.nationalize.io draw on this same number.
        X-Rate-Limit-Limit: "25"
        X-Rate-Limit-Remaining: "20"
        # Open to any origin, so the twenty-five a day are spendable straight
        # from a browser -- by anyone who can read the page.
        Access-Control-Allow-Origin: "*"

  - name: the reset is seconds until midnight UTC, not a timestamp
    source: https://api.agify.io?name=michael
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /?name=michael
    expect:
      status: 200
      headers:
        # Recorded as 60485 with 60501 seconds left in the UTC day. Five
        # digits, so a client reading it as a Unix epoch lands in January 1971.
        X-Rate-Limit-Reset: "60511"

  - name: omitting the parameter is a 422, not a 400 or a 404
    source: https://api.agify.io
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /
    expect:
      status: 422
      body:
        # A bare error string: no code, no type, no field name, no status.
        error: "Missing 'name' parameter"

  - name: and the failure carries no rate-limit headers at all
    source: https://api.agify.io
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /
    expect:
      status: 422
      absent_headers:
        # The response that says a client is doing something wrong is the one
        # that will not say how much budget is left. It is also free: it does
        # not decrement the counter.
        - X-Rate-Limit-Limit
        - X-Rate-Limit-Remaining
        - X-Rate-Limit-Reset

  - name: the answer is bare, with no envelope around it
    source: https://api.agify.io?name=michael
    verified: "2026-08-30"
    fixture: names
    request:
      method: GET
      path: /?name=michael
    expect:
      status: 200
      absent:
        # Three keys at the top level and nothing wrapping them.
        - data
        - result
        - id
