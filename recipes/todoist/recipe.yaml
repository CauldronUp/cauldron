# Todoist Recipe for Cauldron
#
# Written against Todoist's published OpenAPI document at
# developer.todoist.com and struck live against api.todoist.com on 2026-09-11
# with no credential, with a deliberately invalid one, on a path that does not
# exist, and on two retired ones.
#
# **The retired endpoint answers 410 with prose, a wink, and the wrong version
# number.** Struck live at `/rest/v2/projects`:
#
#   410 Gone   Content-Type: text/plain
#
#   This endpoint is deprecated.
#
#   If you're reading this on a browser, there's a good chance you can change
#   the v9 part on the URL to v1 and get away with it. ;)
#
#   If you're using the API directly, please update your use case to rely
#   on the new API endpoints, available under /api/v1/ prefixes.
#
#   For more details, please see documentation at https://developer.todoist.com/
#
# 410 rather than 404 is exactly right: the path was real, the endpoint is
# gone, and retrying will not help. Almost nothing else in this collection
# sends one.
#
# And then the message tells the reader to change "the v9 part on the URL",
# which the URL does not contain -- this was `/rest/v2/`. One handler serves
# every retired version with a sentence hardcoded to name one of them. Struck
# live, `/rest/v9/projects` answers **404**, so the version the advice names is
# the version that no longer routes, and the version that does route is told to
# look for it.
#
# It is also addressed to a person, in a `text/plain` body, on an API endpoint:
# "if you're reading this on a browser" and a winking emoticon, delivered to
# whatever HTTP client asked.
#
# **The current API says the status three times, in three vocabularies.**
# Struck live at `/api/v1/projects` with no credential:
#
#   401 {"error":"Unauthorized",
#        "error_code":477,
#        "error_extra":{"event_id":"0e17262e...","retry_after":3},
#        "error_tag":"UNAUTHORIZED",
#        "http_code":401}
#
# `http_code` repeats the status line. `error_tag` is the reason phrase in
# screaming snake. `error_code` is 477 -- which is not an HTTP status at all,
# and is the only one of the three that carries information the status line
# did not.
#
# **And `retry_after` escalates on a failure that retrying cannot fix.** Four
# consecutive unauthenticated calls answered 18, 35, 67 and 128 -- roughly
# doubling. That is a backoff schedule, attached to a 401. No amount of waiting
# turns a missing credential into a present one, and a client that honours the
# hint sleeps two minutes before failing the same way.
#
# Probing stopped there: a number that climbs per attempt is the provider
# asking to be left alone, and this Recipe records the escalation rather than
# mapping its ceiling.
#
# **The challenge header is sent only to callers who already sent something.**
# A missing credential gets no `WWW-Authenticate` at all; a wrong one gets:
#
#   WWW-Authenticate: Bearer error="invalid_token",
#     error_description="Unauthorized",
#     resource_metadata="https://api.todoist.com/.well-known/oauth-protected-resource"
#
# Which is RFC 6750's error parameters and RFC 9728's metadata pointer
# together, and is one of the two best challenge headers in this collection --
# withheld from the one caller who needs it. [cloudamqp](../cloudamqp) has the
# same fault with a plainer header; [fastmail](../fastmail) sends the good one
# to everybody.
#
# **The published document declares no authentication whatsoever.**
# `components.securitySchemes` is empty and `security` is null, on an API that
# answers 401 to every request without a credential. Not a scheme defined and
# left unreferenced, as [close](../close) and [middesk](../middesk) do, and not
# a hand-rolled header parameter either: nothing at all.
#
# **A project carries four ordering fields.** `child_order` and `default_order`
# are integers; `order_key` and `default_order_key` are fractional-indexing
# strings. Two orderings, each expressed twice in two different schemes, all
# four required.
#
# **And `is_deleted` is required on every project in the listing**, so a list
# of projects contains deleted projects and a client that does not filter shows
# them.

recipe: todoist
capability: issues
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.todoist.com/
  spec: https://developer.todoist.com/openapi.json
  spec_hash: 47bf558f29e3c186e6f0e08988f6ec0cc50c9de59cf0782a369a45cb92970138
  spec_seen: "2026-09-11"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nt0d01stf1xturet0ken000000000000
  # The difference between the two is which one gets told how to authenticate.
  absent_error: unauthorized_silent
  rejected_error: unauthorized
  after_routing: true

responses:
  list:
    style: wrapped
    key: results
    cursor_field: next_cursor
    # Documented as null when there are no more results, and required either
    # way -- so the key is always there and only its value moves.
    cursor_null: true
  error:
    style: flat
    message_field: error
    code_field: error_tag
    code_type: string
    # The status a third time, in the body, beside the status line and the
    # screaming-snake tag.
    status_field: http_code

resources:
  project:
    id:
      field: id
      style: opaque
    fields:
      name:
        type: string
      description:
        type: string
      color:
        type: string
      view_style:
        type: string
      # Two orderings, each in two schemes: an integer position and a
      # fractional-indexing key, twice over.
      child_order:
        type: integer
      order_key:
        type: string
      default_order:
        type: integer
      default_order_key:
        type: string
      # Required on every project in a listing of projects.
      is_deleted:
        type: boolean
      is_archived:
        type: boolean
      is_favorite:
        type: boolean
      is_shared:
        type: boolean
      is_collapsed:
        type: boolean
      is_frozen:
        type: boolean
      can_assign_tasks:
        type: boolean
      can_comment:
        type: boolean
      # Required and nullable, both of them.
      created_at:
      updated_at:

routes:
  - method: GET
    path: /api/v1/projects
    resource: project
    operation: list
    pagination:
      style: cursor
      limit: 50
      limit_param: limit
      cursor_param: cursor

  # The retired surface. 410 rather than 404, which is right, with a message
  # naming a version the caller did not use.
  - method: GET
    path: /rest/v2/projects
    public: true
    error: deprecated_endpoint

errors:
  unauthorized_silent:
    status: 401
    code: UNAUTHORIZED
    message: Unauthorized
    fields:
      # Not an HTTP status, and the only one of the three codes here that
      # carries anything the status line did not.
      error_code: 477
      error_extra:
        event_id: 0e17262ede104c6ba5720487ee53de28
        # A backoff hint on an authentication failure. Live it climbed 18, 35,
        # 67, 128 across four consecutive calls; this Recipe serves one value
        # and records the escalation in the README rather than reproducing a
        # number that depends on how many times you have already failed.
        retry_after: 3

  unauthorized:
    status: 401
    code: UNAUTHORIZED
    message: Unauthorized
    headers:
      # RFC 6750's error parameters and RFC 9728's metadata pointer together,
      # and sent only to the caller who already knew enough to send something.
      WWW-Authenticate: Bearer error="invalid_token", error_description="Unauthorized", resource_metadata="https://api.todoist.com/.well-known/oauth-protected-resource"
    fields:
      error_code: 477
      error_extra:
        event_id: 34429c942c5c4194a97b6f169b40e7b1
        retry_after: 2

  unknown_route:
    status: 404
    code: NOT_FOUND
    message: Not found
    fields:
      # A different internal number for a different failure, and a retry hint
      # on a 404 as well.
      error_code: 478
      error_extra:
        event_id: 5bb89856723f450ba96b638398395e13
        retry_after: 5

  deprecated_endpoint:
    status: 410
    # Prose, in text/plain, addressed to a person -- wink included -- and
    # naming "the v9 part" of a URL that says v2.
    style: text
    message: |-
      This endpoint is deprecated.

      If you're reading this on a browser, there's a good chance you can change
      the v9 part on the URL to v1 and get away with it. ;)

      If you're using the API directly, please update your use case to rely
      on the new API endpoints, available under /api/v1/ prefixes.

      For more details, please see documentation at https://developer.todoist.com/
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    project: []

  workspace:
    project:
      - id: "6cfCcrrCFg2xf3Vv"
        name: Inbox
        description: ""
        color: charcoal
        view_style: list
        child_order: 0
        order_key: a0
        default_order: 0
        default_order_key: a0
        is_deleted: false
        is_archived: false
        is_favorite: false
        is_shared: false
        is_collapsed: false
        is_frozen: false
        can_assign_tasks: false
        can_comment: true
        created_at: "2026-04-11T08:30:00.000000Z"
        updated_at: "2026-08-22T13:45:10.000000Z"
      - id: "6cfHhqqHJk8yt1Pp"
        name: Migration
        description: Ship the new API
        color: berry_red
        view_style: board
        child_order: 1
        order_key: a1
        default_order: 1
        default_order_key: a1
        # Deleted, and in a listing of projects, because the schema requires
        # the flag rather than excluding the record.
        is_deleted: true
        is_archived: false
        is_favorite: true
        is_shared: true
        is_collapsed: false
        is_frozen: false
        can_assign_tasks: true
        can_comment: true
        # Required and nullable, and null on a project nobody has touched
        # since it was made by an import.
        created_at: null
        updated_at: null

conformance:
  - name: a retired endpoint answers 410 rather than 404
    source: https://api.todoist.com/rest/v2/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /rest/v2/projects
      headers: {}
    expect:
      # The path was real, the endpoint is gone, and retrying will not help --
      # which is what 410 means and what almost nothing else here sends.
      status: 410
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: 'This endpoint is deprecated\.'

  - name: the deprecation notice names a version the URL does not contain
    source: https://api.todoist.com/rest/v2/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /rest/v2/projects
      headers: {}
    expect:
      status: 410
      # Served to /rest/v2/ and telling the reader to change "the v9 part".
      # Live, /rest/v9/projects answers 404, so the version the advice names
      # is the one that no longer routes.
      body_matches: 'change\s+the v9 part on the URL to v1'

  - name: the deprecation notice is addressed to a person
    source: https://api.todoist.com/rest/v2/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /rest/v2/projects
      headers: {}
    expect:
      status: 410
      # "If you're reading this on a browser", and a winking emoticon, in a
      # response to whatever HTTP client asked.
      body_matches: "reading this on a browser"

  - name: a missing credential says the status three ways
    source: https://api.todoist.com/api/v1/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers: {}
    expect:
      status: 401
      body:
        # http_code repeats the status line, error_tag is the reason phrase in
        # screaming snake, and error_code is a number that is not an HTTP
        # status at all.
        http_code: 401
        error_tag: UNAUTHORIZED
        error_code: 477
        error: Unauthorized

  - name: a retry hint rides on the authentication failure
    source: https://api.todoist.com/api/v1/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers: {}
    expect:
      status: 401
      matches:
        # Live this climbed 18, 35, 67, 128 across four consecutive calls --
        # a backoff schedule on a failure no amount of waiting fixes.
        'error_extra.retry_after': '^[0-9]+$'

  - name: only a wrong credential is told how to authenticate
    source: https://api.todoist.com/api/v1/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      header_matches:
        # RFC 6750's error parameters and RFC 9728's metadata pointer at once
        # -- and the caller with no credential gets none of it.
        WWW-Authenticate: 'resource_metadata='

  - name: a missing credential gets no challenge at all
    source: https://api.todoist.com/api/v1/projects
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers: {}
    expect:
      status: 401
      absent_headers:
        - WWW-Authenticate

  - name: an unknown path has its own internal number
    source: https://api.todoist.com/api/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      body:
        error_code: 478
        error_tag: NOT_FOUND
        http_code: 404

  - name: projects are wrapped under results beside a cursor
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        'results[0].name': Inbox
        'results[0].id': "6cfCcrrCFg2xf3Vv"

  - name: a project carries four ordering fields
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        # Two orderings, each expressed twice: an integer position and a
        # fractional-indexing key, and all four required by the schema.
        'results[1].child_order': 1
        'results[1].order_key': a1
        'results[1].default_order': 1
        'results[1].default_order_key': a1

  - name: a deleted project is in the listing
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        # is_deleted is required on every project, so the listing carries
        # deleted ones and a client that does not filter shows them.
        'results[1].is_deleted': true
        'results[0].is_deleted': false
        'results[1].is_archived': false

  - name: the timestamps are required and nullable
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        # anyOf string or null, and both in the required list -- so the key is
        # guaranteed and the value is not.
        'results[1].created_at': null
        'results[1].updated_at': null
        'results[0].created_at': "2026-04-11T08:30:00.000000Z"

  - name: eight booleans describe one project
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        # Every one of them required, and two of them about what the caller
        # may do rather than about the project.
        'results[1].is_favorite': true
        'results[1].is_shared': true
        'results[1].is_collapsed': false
        'results[1].is_frozen': false
        'results[1].can_assign_tasks': true
        'results[1].can_comment': true
        'results[0].view_style': list
        'results[1].color': berry_red
        'results[1].description': Ship the new API

  - name: projects page on a cursor that is null at the end
    source: https://developer.todoist.com/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
      query:
        limit: "1"
        cursor: "6cfCcrrCFg2xf3Vv"
    expect:
      status: 200
      body:
        'results[0].id': "6cfHhqqHJk8yt1Pp"
        # Required, and null rather than absent when there is no more.
        next_cursor: null

  - name: an account with no projects answers an empty array
    source: https://developer.todoist.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /api/v1/projects
      headers:
        Authorization: "Bearer cauldr0nt0d01stf1xturet0ken000000000000"
    expect:
      status: 200
      body:
        results: []
        next_cursor: null
