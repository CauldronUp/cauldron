# OpenAIRE Recipe for Cauldron
#
# The JSON is XML wearing a costume.
#
#   "size":      {"$": 1}
#   "language":  {"@classid": "eng", "@classname": "English",
#                 "@schemeid": "dnet:languages", "@schemename": "dnet:languages"}
#   "metadata":  {"oaf:entity": {"oaf:result": { ... }}}
#
# Every text value sits under "$". Every attribute sits under a key beginning
# "@". The element names keep their XML namespaces, colons and all. This is not
# a JSON API that happens to look odd -- it is an XML document run through a
# mechanical transliteration, and the shape of the original shows through every
# field.
#
# The practical consequence is that no client can use dot notation. Reading a
# title means
#
#   result.metadata["oaf:entity"]["oaf:result"].title[0]["$"]
#
# because oaf:entity is not an identifier in any language a client is written
# in, and neither is $.
#
# **And "total" is a number when it is not zero and a string when it is.**
#
#   ?doi=10.1038/nature12373  ->  "total": {"$": 1},   "results": {...}
#   ?doi=10.9999/nope         ->  "total": {"$": "0"}, "results": null
#
# One field, two JSON types, chosen by the value. A client doing total.$ > 0
# survives in JavaScript by coercion and fails in anything typed, and the empty
# case sends null where the populated one sends an object -- so the two paths
# through the response share neither type.
#
# Written against the live API rather than a document: every case below was
# checked against api.openaire.eu on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The useful sentence is in the wrong field. A page size out of range
#      answers 400 with {"message": "400 - Illegal argument exception."} and
#      {"exception": "Size and page arguments have exceeded the maximum number
#      of returned results."} -- so message repeats the status a client already
#      has, and exception holds the only text that says what happened. code is
#      the string "400" beside an HTTP status of 400, and trace is null.
#   2. A path that does not exist answers Apache Tomcat's error report, which
#      names its own version twice: once in the title and once in an h3.
#      The version is 7.0.68, released in 2016, printed on a public API's 404
#      along with an inline stylesheet. Its message field is <u></u> -- an
#      empty underline element.
#   3. The language code is a scheme identifier, not a language tag. The
#      record served here carries "@classid": "eng" -- ISO 639-2, not the
#      "en" a client's own locale handling expects -- under a scheme named
#      dnet:languages that is the provider's own registry rather than any
#      standard. A French record seen while this was written carried
#      "fra/fre", two of that standard's codes joined by a slash, so the
#      separator appears only for the languages that have two and nothing
#      announces it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One publication is served, of 237,304,810, fetched by its DOI so the
#     result does not move. A search without that constraint returns whatever
#     is newest.
#   - Only the parts of the record the cases name are served. The real
#     oaf:result carries twenty-one children, several of them arrays of
#     attribute-laden objects.
#   - The French "fra/fre" code is described above and not served. It was seen
#     on a record the listing returned once and does not return again, so it
#     is recorded as an observation rather than pinned by a case.
#   - The Tomcat page is served as recorded bytes under a text error style,
#     with its inline stylesheet dropped and the structure kept. Nothing
#     fetches it and the point is what a client receives instead of JSON.

recipe: openaire
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: openaire
  docs: https://graph.openaire.eu/docs/apis/search-api/

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: response.results.result
  error:
    style: flat
    message_field: message
    code_field: code
    # A string, beside an HTTP status that is a number.
    code_type: string
    type_field: "-"

resources:
  publication:
    id:
      style: opaque
      field: "-"
      carried_by: metadata
    fields:
      metadata:
        type: map

routes:
  - method: GET
    path: /search/publications
    resource: publication
    operation: list
    pagination:
      # size and page, which this Recipe establishes twice over without
      # needing a reference. Its own live-verified failure names them --
      # "Size and page arguments have exceeded the maximum number of
      # returned results" -- and the response header it pins carries size
      # and page back at the caller.
      #
      # Neither is limit and neither is cursor, which is what the runtime
      # was reading.
      style: page
      limit: 10
      limit_param: size
      cursor_param: page
      first_page: 1
    fields:
      # Every one of these is a text node in disguise.
      response.header.query.$: "(oaftype exact result) and (resulttypeid exact publication) and ((pidclassid exact doi and pid exact 10.1038/nature12373))"
      response.header.locale.$: en_US
      response.header.size.$: 1
      response.header.page.$: 1
      # A number, because it is not zero.
      response.header.total.$: 1
      response.header.fields: null

  # The same query for something absent: a string, and a null.
  - method: GET
    path: /search/publications-no-match
    resource: publication
    operation: list
    pagination:
      # size and page, which this Recipe establishes twice over without
      # needing a reference. Its own live-verified failure names them --
      # "Size and page arguments have exceeded the maximum number of
      # returned results" -- and the response header it pins carries size
      # and page back at the caller.
      #
      # Neither is limit and neither is cursor, which is what the runtime
      # was reading.
      style: page
      limit: 10
      limit_param: size
      cursor_param: page
      first_page: 1
    fields:
      response.header.size.$: 1
      response.header.page.$: 1
      # A string, because it is zero.
      response.header.total.$: "0"

  # A page size out of range: the sentence that matters is in the wrong field.
  - method: GET
    path: /search/publications-bad-size
    error: illegal_argument

  # A path that does not exist: Tomcat, naming its own version.
  - method: GET
    path: /search/nosuchthing
    error: tomcat_not_found
    headers:
      Content-Type: text/html;charset=utf-8

errors:
  illegal_argument:
    status: 400
    # A string, beside an HTTP status of 400.
    code: "400"
    # The status a client already has, restated.
    message: "400 - Illegal argument exception."
    fields:
      status: error
      # And the only sentence that says what actually happened.
      exception: "Size and page arguments have exceeded the maximum number of returned results."
      trace: null

  tomcat_not_found:
    status: 404
    # The server's own error report, naming its version twice. The inline
    # stylesheet is dropped; the structure and the version are what matter.
    style: text
    message: "<html><head><title>Apache Tomcat/7.0.68 - Error report</title></head><body><h1>HTTP Status 404 - </h1><HR size=\"1\" noshade=\"noshade\"><p><b>type</b> Status report</p><p><b>message</b> <u></u></p><p><b>description</b> <u>The requested resource is not available.</u></p><HR size=\"1\" noshade=\"noshade\"><h3>Apache Tomcat/7.0.68</h3></body></html>"

fixtures:
  empty: {}

  thermometry:
    publication:
      - metadata:
          # A namespace in a JSON key, so dot notation is out from here down.
          "oaf:entity":
            "oaf:result":
              title:
                # Four attributes and one text node, in one object.
                - "@classid": main title
                  "@classname": main title
                  "@schemeid": dnet:dataCite_title
                  "@schemename": dnet:dataCite_title
                  $: Nanometre-scale thermometry in a living cell
              language:
                "@classid": eng
                "@classname": English
                "@schemeid": dnet:languages
                "@schemename": dnet:languages
              bestaccessright:
                "@classid": OPEN
                "@classname": Open Access
                "@schemeid": dnet:access_modes
                "@schemename": dnet:access_modes
              # A date, wrapped.
              dateofacceptance:
                $: "2013-07-31"
              publisher:
                $: Springer Science and Business Media LLC

conformance:
  - name: every value is a text node and every key may carry a namespace
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/publications
    expect:
      status: 200
      body:
        # The whole path a client must walk, with two namespaced keys and a
        # dollar sign in it -- none of which is an identifier in any language.
        "response.results.result[0].metadata.oaf:entity.oaf:result.title[0].$": Nanometre-scale thermometry in a living cell
        # And the four attributes riding beside it.
        "response.results.result[0].metadata.oaf:entity.oaf:result.title[0].@classid": main title
        "response.results.result[0].metadata.oaf:entity.oaf:result.title[0].@classname": main title
        "response.results.result[0].metadata.oaf:entity.oaf:result.title[0].@schemeid": dnet:dataCite_title
        "response.results.result[0].metadata.oaf:entity.oaf:result.title[0].@schemename": dnet:dataCite_title

  - name: the total is a number when it is not zero
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/publications
    expect:
      status: 200
      body:
        # A number.
        response.header.total.$: 1
        response.header.size.$: 1
        response.header.page.$: 1
        response.header.locale.$: en_US
        # And a field that is null rather than absent.
        response.header.fields: null

  - name: and a string when it is
    source: "https://api.openaire.eu/search/publications?doi=10.9999/nope&format=json"
    verified: "2026-08-30"
    fixture: empty
    request:
      method: GET
      path: /search/publications-no-match
    expect:
      status: 200
      body:
        # The same field, the other JSON type, chosen by the value.
        response.header.total.$: "0"
        response.header.size.$: 1
      absent:
        # And nothing where the populated response sends an object.
        - "response.results.result[0].metadata"

  - name: the sentence that matters is in the wrong field
    source: "https://api.openaire.eu/search/publications?size=99999&format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/publications-bad-size
    expect:
      status: 400
      body:
        # The status a client already has, restated as prose...
        message: "400 - Illegal argument exception."
        # ...while the only text that says what happened sits under a key named
        # for a Java class.
        exception: "Size and page arguments have exceeded the maximum number of returned results."
        # A string, beside an HTTP status of 400.
        code: "400"
        status: error
        trace: null

  - name: a path that does not exist names the server's own version twice
    source: "https://api.openaire.eu/search/nosuchthing?format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/nosuchthing
    expect:
      status: 404
      headers:
        # HTML, on a host whose every other answer is JSON.
        Content-Type: text/html
      # Released in 2016, printed on a public API's 404, in the title and again
      # at the foot of the page.
      body_matches: '^<html><head><title>Apache Tomcat/7\.0\.68 - Error report</title>.*<h3>Apache Tomcat/7\.0\.68</h3></body></html>$'

  - name: and its message is an empty underline element
    source: "https://api.openaire.eu/search/nosuchthing?format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/nosuchthing
    expect:
      status: 404
      # A field called message, holding nothing, inside a tag for underlining.
      body_matches: '^<html>.*<p><b>message</b> <u></u></p>.*</html>$'

  - name: the language is two standards codes in one string
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/publications
    expect:
      status: 200
      body:
        # English has one code, so the slash only shows up on the languages
        # that have two, and nothing announces it.
        "response.results.result[0].metadata.oaf:entity.oaf:result.language.@classid": eng
        "response.results.result[0].metadata.oaf:entity.oaf:result.language.@classname": English
        "response.results.result[0].metadata.oaf:entity.oaf:result.language.@schemeid": dnet:languages
        # An access right whose code is shouted and whose name is not.
        "response.results.result[0].metadata.oaf:entity.oaf:result.bestaccessright.@classid": OPEN
        "response.results.result[0].metadata.oaf:entity.oaf:result.bestaccessright.@classname": Open Access
        "response.results.result[0].metadata.oaf:entity.oaf:result.bestaccessright.@schemeid": dnet:access_modes

  - name: a date and a publisher are text nodes like everything else
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    verified: "2026-08-30"
    fixture: thermometry
    request:
      method: GET
      path: /search/publications
    expect:
      status: 200
      body:
        # Both wrapped, because in the XML they were text.
        "response.results.result[0].metadata.oaf:entity.oaf:result.dateofacceptance.$": "2013-07-31"
        "response.results.result[0].metadata.oaf:entity.oaf:result.publisher.$": Springer Science and Business Media LLC

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether size was read or not -- but page can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "page moves the page on for search publications"
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    fixture: thermometry
    request:
      method: GET
      path: "/search/publications"
      query:
        "size": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "response.results.result[0]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether size was read or not -- but page can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "page moves the page on for search publications-no-match"
    source: "https://api.openaire.eu/search/publications?doi=10.9999/nope&format=json"
    fixture: thermometry
    request:
      method: GET
      path: "/search/publications-no-match"
      query:
        "size": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "response.results.result[0]"

  # The half of this listing the Recipe can show. No fixture in the file
  # holds a publication, so there is no record to assert -- but the
  # route answers, with the status and the envelope beside it, and every
  # case here until now was checking a refusal. This says what an empty
  # answer looks like and asserts the collection is empty rather than
  # absent, which is the distinction a client gets wrong. The record
  # shape stays unevidenced: verify counts this listing as one shown
  # only empty until a fixture holds a record.
  - name: "the publication listing answers, and this fixture has none"
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    fixture: thermometry
    request:
      method: GET
      path: "/search/publications-no-match"
      query:
        "size": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "response.results.result[0]"

  # The half of this listing the Recipe can show. No fixture in the file
  # holds a publication, so there is no record to assert -- but the
  # route answers, with the status and the envelope beside it, and every
  # case here until now was checking a refusal. This says what an empty
  # answer looks like and asserts the collection is empty rather than
  # absent, which is the distinction a client gets wrong. The record
  # shape stays unevidenced: verify counts this listing as one shown
  # only empty until a fixture holds a record.
  - name: "the publication listing answers, and this fixture has none (/search/publications-no-match)"
    source: "https://api.openaire.eu/search/publications?doi=10.1038/nature12373&format=json"
    fixture: thermometry
    request:
      method: GET
      path: "/search/publications-no-match"
      query:
        "size": "1"
        "page": "2"
    expect:
      status: 200
      absent:
        - "response.results.result[0]"




