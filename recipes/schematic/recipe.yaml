# Schematic Recipe for Cauldron
#
# The company listing, read from the API reference at docs.schematichq.com and
# from the types in Schematic's own Go SDK, and struck live on 2026-09-14 with
# no key, with a wrong key, with an empty header, on a path that does not
# exist, with a method the path does not take, and on the root.
#
# **This API says almost everything twice, once singular and once plural.** On
# the company record:
#
#   plan                  *CompanyPlanWithBillingSubView   optional
#   plans                 []*GenericPreviewObject          always sent
#   billing_subscription  *BillingSubscriptionView         optional
#   billing_subscriptions []*BillingSubscriptionView       always sent
#   billing_profile       *CompanyBillingProfileResponseData optional
#   billing_profiles      []*CompanyBillingProfileResponseData optional
#
# Three pairs, each an optional singular beside an array of the same thing, and
# nothing saying whether the singular is the first of the array, the current
# one, or something else. `traits` and `entity_traits` are a fourth pair in two
# different shapes -- a `map[string]any` of names to values, and an array of
# trait objects.
#
# **And the listing's parameters do it too.** Twenty-one query parameters, among
# them `plan_id` and `plan_ids`, `plan_version_id` and `plan_version_ids`, and
# three pairs of opposites: `with_subscription` and `without_subscription`,
# `without_plan`, `with_entitlement_for` and `without_feature_override_for`.
# Nothing documents what happens when a caller sends both halves of a pair.
#
# **The listing has no count and no cursor.** The envelope is `{data, params}`
# -- the records, and the request's own parameters echoed back. Paging is
# `limit` (default 100) and `offset` (default 0), and nothing in a full page
# says whether another exists.
#
# **A missing key and a wrong key say different things; an empty header counts
# as missing.** Struck live:
#
#   (no header)                      401 {"error":"Unauthorized"}
#   X-Schematic-Api-Key: (empty)     401 {"error":"Unauthorized"}
#   X-Schematic-Api-Key: notrealkey  401 {"error":"API key invalid"}
#
# Two distinct sentences, which is rarer than it should be -- and the header
# present but empty is judged absent.
#
# **A wrong path and a wrong method are Go's default page, in plain text**,
# answered before the credential: `404 page not found`, `text/plain`, from an
# API that is JSON everywhere else.
#
# **And the API host serves a web application at its root.** `GET /` answers
# `200` with `text/html` and `<title>Schematic</title>`.
#
# **Money is a floating-point number.** `billing_credit_balances` is
# `map[string]float64` -- credit balances, per credit type, in binary floating
# point, on a billing record.
#
# Also pinned: the generated Go SDK gives every struct a private
# `explicitFields *big.Int`, commented "Private bitmask of fields set to an
# explicit value and therefore not to be omitted", so a caller's intent to send
# a zero is carried in a big integer beside the data; and a company record
# carries `pending_migration` and `scheduled_downgrade`, two pieces of billing
# process state, on the same object as its name.

recipe: schematic
capability: flags
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://docs.schematichq.com/api-reference/companies/list-companies

auth:
  scheme: header
  header: X-Schematic-Api-Key
  keys:
    - cauldr0n_sch3mat1c_f1xture_key
  # A header present but empty is judged absent, not malformed.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: api_key_invalid
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    fields:
      # The request's own parameters, echoed back. There is no count.
      params.limit: 100
      params.offset: 0
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  company:
    id:
      field: id
      style: prefixed
      prefix: comp_
      length: 22
    fields:
      name:
        type: string
      environment_id:
        type: string
      created_at:
        type: string
      updated_at:
        type: string
      last_seen_at:
      logo_url:
      user_count:
        type: integer
      # A map of trait names to trait values.
      traits:
        type: map
      # The same idea again, as an array of objects.
      entity_traits:
        type: list
      # Optional singular.
      plan:
      # Always sent plural.
      plans:
        type: list
      billing_subscription:
      billing_subscriptions:
        type: list
      billing_profile:
      billing_profiles:
        type: list
      # Money, in binary floating point.
      billing_credit_balances:
        type: map

routes:
  - method: GET
    path: /companies
    resource: company
    operation: list
    pagination:
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
    filters:
      - param: q
        field: name

errors:
  unauthorized:
    status: 401
    message: Unauthorized

  # A different sentence for a key that was sent and is wrong.
  api_key_invalid:
    status: 401
    message: API key invalid

  unknown_route:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      Content-Type: text/plain

  # A verb the path does not take, answered as a page that is not there.
  method_not_allowed:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    company: []

  accounts:
    company:
      - id: comp_7Kq2mX9pLz4vB1nR8sT3wY
        name: Northwind Traders
        environment_id: env_4f3e2d1c0b9a88
        created_at: "2026-02-11T08:44:12Z"
        updated_at: "2026-09-02T13:05:41Z"
        last_seen_at: "2026-09-13T22:10:05Z"
        logo_url: null
        user_count: 42
        # A map of names to values.
        traits:
          tier: enterprise
          seats: 50
        # The same idea, as objects.
        entity_traits:
          - id: etr_91b3e7c4
            definition_id: etd_22ffa1
            value: enterprise
        # The optional singular.
        plan:
          id: pl_8812
          name: Enterprise
        # And the array beside it.
        plans:
          - id: pl_8812
            name: Enterprise
        billing_subscription:
          id: sub_5f4e3d2c
          status: active
        billing_subscriptions:
          - id: sub_5f4e3d2c
            status: active
        billing_profile:
          id: bp_1a2b3c
          payment_method_type: card
        billing_profiles:
          - id: bp_1a2b3c
            payment_method_type: card
        # Credit balances in binary floating point.
        billing_credit_balances:
          ct_tokens: 1250.5
          ct_seats: 3
      - id: comp_4Nb6Vc8Xz2Qa9Ws1Ed3Rf
        name: Scratch Co
        environment_id: env_4f3e2d1c0b9a88
        created_at: "2026-07-30T16:20:00Z"
        updated_at: "2026-07-30T16:20:00Z"
        # Never seen.
        last_seen_at: null
        logo_url: null
        user_count: 0
        traits: {}
        entity_traits: []
        # The singular absent and the plural empty, on the same record.
        plan: null
        plans: []
        billing_subscription: null
        billing_subscriptions: []
        billing_profile: null
        billing_profiles: []
        billing_credit_balances: {}

conformance:
  - name: a missing key and a wrong key say different things
    source: https://api.schematichq.com/companies
    verified: "2026-09-14"
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers: {}
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: and the wrong one names the key
    source: https://api.schematichq.com/companies
    verified: "2026-09-14"
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: notrealkey
    expect:
      status: 401
      # A second sentence, which is rarer than it should be.
      body:
        error: API key invalid

  - name: a path that does not exist is go's default page
    source: https://api.schematichq.com/cauldron-nope
    verified: "2026-09-14"
    fixture: accounts
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # Plain text, from an API that is JSON everywhere else.
        Content-Type: text/plain
      body_matches: '\A404 page not found\s*\z'

  - name: and so is a method the path does not take
    source: https://api.schematichq.com/companies
    verified: "2026-09-14"
    fixture: accounts
    request:
      method: PUT
      path: /companies
      headers: {}
    expect:
      status: 404
      body_matches: '\A404 page not found\s*\z'

  - name: three fields are singular and plural at once
    source: https://github.com/schematichq/schematic-go
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
    expect:
      status: 200
      body:
        # An optional singular beside an array of the same thing, three times.
        'data[0].plan.id': pl_8812
        'data[0].plans[0].id': pl_8812
        'data[0].billing_subscription.id': sub_5f4e3d2c
        'data[0].billing_subscriptions[0].id': sub_5f4e3d2c
        'data[0].billing_profile.id': bp_1a2b3c
        'data[0].billing_profiles[0].id': bp_1a2b3c

  - name: and they disagree in the same direction when there is nothing
    source: https://github.com/schematichq/schematic-go
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
    expect:
      status: 200
      body:
        # null on the singular, empty on the plural.
        'data[1].plan': null
        'data[1].plans': []
        'data[1].billing_subscription': null
        'data[1].billing_subscriptions': []
        'data[1].billing_profile': null
        'data[1].billing_profiles': []
        'data[1].last_seen_at': null
        'data[1].user_count': 0

  - name: traits arrive twice in two shapes
    source: https://github.com/schematichq/schematic-go
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
    expect:
      status: 200
      body:
        # A map of names to values, and an array of objects.
        'data[0].traits.tier': enterprise
        'data[0].entity_traits[0].value': enterprise
        'data[0].name': Northwind Traders
        'data[0].environment_id': env_4f3e2d1c0b9a88
        'data[0].created_at': "2026-02-11T08:44:12Z"
        'data[0].updated_at': "2026-09-02T13:05:41Z"
        'data[0].last_seen_at': "2026-09-13T22:10:05Z"
        'data[0].logo_url': null
        'data[0].user_count': 42

  - name: credit balances are floating point
    source: https://github.com/schematichq/schematic-go
    fixture: accounts
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
      query:
        q: Northwind Traders
    expect:
      status: 200
      body:
        # map[string]float64, on a billing record.
        'data[0].billing_credit_balances.ct_tokens': 1250.5
        'data[0].billing_credit_balances.ct_seats': 3

  - name: the envelope echoes the request and counts nothing
    source: https://docs.schematichq.com/api-reference/companies/list-companies
    fixture: accounts
    request:
      method: GET
      path: /companies
      query:
        limit: "1"
        offset: "0"
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
    expect:
      status: 200
      body:
        # The parameters, back again.
        'params.limit': 100
        'params.offset': 0
      absent:
        # No count, no total, no next.
        - count
        - total
        - next

  - name: an environment with no companies keeps the envelope
    source: https://docs.schematichq.com/api-reference/companies/list-companies
    fixture: empty
    request:
      method: GET
      path: /companies
      headers:
        X-Schematic-Api-Key: cauldr0n_sch3mat1c_f1xture_key
    expect:
      status: 200
      body:
        data: []
        'params.limit': 100
