# Intercom Recipe for Cauldron
#
# Intercom has no sandbox. A development workspace is a real workspace: real
# seats, real message sending, and a contact list that fills with test people
# who then receive real onboarding campaigns. Teams either pay for a second
# workspace or test against production and hope the automation rules are off.
#
# Two things worth modelling exactly:
#
#   1. Every object declares its own type, and a collection is a type in its
#      own right. A list is {"type": "list"}, a contact is {"type": "contact"},
#      and an error response is {"type": "error.list"}. Client code switches on
#      that field before reading anything else.
#   2. Paging state is nested under "pages", so the cursor a client needs sits
#      at pages.next.starting_after rather than at the top level.
#
# The pages object carries all five of its fields: a type, the cursor, and
# page, per_page and total_pages beside them. That used to be a stated gap --
# this file said Cauldron did not model the last three -- and it was already
# untrue when it was written, because they nest exactly the way the cursor
# above does. A limitation nobody rechecks outlives the limitation.
#
# Tokens below are fixtures, not secrets.
#
# Struck live against api.intercom.io on 2026-09-05, no account and no key --
# and the auth failure this file declared was wrong in both halves. The file
# said a bad token answers {code: token_unauthorized, message: "Not
# authorized to access resource"}. What the live API actually sends for that
# case is {code: unauthorized, message: "Access Token Invalid"} -- and the
# case that was supposed to prove it sent no Authorization header at all,
# which is a different failure with its own code and sentence,
# missing_authorization / "No authorization was provided". Two mistakes
# compounding: the case's own name said "a bad token" and its request sent
# no token, so nothing here had ever actually been asked what Intercom says
# to either one. Both are fixed below, split under auth.absent_error and
# auth.rejected_error rather than collapsed into one, because they are
# genuinely two different sentences.
#
# Observed and deliberately not modelled: a path with no route at all, and
# /contacts addressed with PATCH (a method Intercom does not route for that
# collection), both answer 404 -- {code: not_found, message: "The requested
# resource does not exist; check your path and try again"} -- without ever
# checking the credential, confirmed both with and without one present. That
# reads like routing being checked ahead of auth, and it would be simple to
# state as a rule if /contacts stopped there. It does not: DELETE /contacts
# and PUT /contacts, neither one a documented route either, still answer the
# missing-credential 401 above rather than this 404, checked the same way.
# Intercom's real router tells PATCH apart from PUT and DELETE on a path this
# file does not model any of; this format's auth check is a single Recipe-wide
# switch between "before every route" and "after a route matches," and
# neither position reproduces a provider that disagrees with itself by verb
# on an undocumented path. Stated rather than forced into a case that would
# have to pick a side reality does not.

recipe: intercom
capability: support
version: 0.1.0

upstream:
  api: "2.11"
  docs: https://developers.intercom.com/docs/references/rest-api
  spec: https://raw.githubusercontent.com/intercom/Intercom-OpenAPI/main/descriptions/2.11/api.intercom.io.yaml
  spec_hash: bd9b012d22986a8a634e68e5c13ba7101de76d7a2b2645ef02175ebaccdf822c
  spec_seen: "2026-08-30"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - dG9rOmNhdWxkcm9u
  # Two different sentences, confirmed live -- see the header. No credential
  # at all gets missing_authorization; a credential that is present and not
  # recognised gets invalid_token.
  absent_error: missing_authorization
  rejected_error: invalid_token

responses:
  list:
    style: wrapped
    count_field: total_count
    # The cursor is nested, which is why a client reads
    # response.pages.next.starting_after rather than response.next_cursor.
    cursor_field: pages.next.starting_after
    # Intercom sends these beside the cursor and they nest the same way, so
    # the pages object is the whole pages object rather than two of its five
    # fields. page is one-based.
    page_field: pages.page
    limit_field: pages.per_page
    pages_field: pages.total_pages
    fields:
      type: list
      pages:
        type: pages
  error:
    style: list
    key: errors
    code_field: code
    message_field: message
    # Beside the array. The request id identifies the call, not one failure.
    fields:
      type: error.list
      request_id: cauldron00000000000000000001

resources:
  contact:
    collection: data
    constants:
      type: contact
      workspace_id: cauldron01
    id:
      style: hex
      length: 24
    fields:
      role:
        type: string
        default: user
      external_id:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      unsubscribed_from_emails:
        type: boolean
        default: false
      created_at:
        type: timestamp
      updated_at:
        type: timestamp
      last_seen_at:
        type: timestamp

  conversation:
    collection: data
    constants:
      type: conversation
    id:
      style: numeric
    fields:
      title:
        type: string
      state:
        type: string
        default: open
      open:
        type: boolean
        default: true
      read:
        type: boolean
        default: false
      priority:
        type: string
        default: not_priority
      created_at:
        type: timestamp
      updated_at:
        type: timestamp
      waiting_since:
        type: timestamp

  company:
    collection: data
    constants:
      type: company
    id:
      style: hex
      length: 24
    fields:
      company_id:
        type: string
        required: true
      name:
        type: string
        required: true
      plan:
        type: string
      monthly_spend:
        type: number
        default: 0
      user_count:
        type: integer
        default: 0
      # Intercom counts sessions on a company and on a visitor. Not on a
      # contact: its own description declares session_count on those two
      # schemas and nowhere else, and this Recipe had it on the contact,
      # where segmentation rules would read it and find nothing.
      session_count:
        type: integer
        default: 0
      created_at:
        type: timestamp

routes:
  - method: GET
    path: /contacts
    resource: contact
    operation: list
    pagination:
      # Intercom's own description declares per_page -- "Defaults to 15" --
      # and starting_after, "String used to get the next page". Neither is
      # limit and neither is cursor, which is what this block was making the
      # runtime read.
      style: cursor
      limit: 15
      limit_param: per_page
      cursor_param: starting_after

  - method: POST
    path: /contacts
    resource: contact
    operation: create

  - method: GET
    path: /contacts/{id}
    resource: contact
    operation: get

  - method: PUT
    path: /contacts/{id}
    resource: contact
    operation: update

  # 200 with a receipt: the id, the type and deleted: true. A 204 sends
  # nothing, so code reading the response to confirm which contact went has
  # nothing to read against the real API.
  #
  # flagged rather than receipt, because Stripe's discriminator is called
  # object and Intercom's is called type -- which this Recipe already has a
  # case about. The type is named on the route below.
  - method: DELETE
    path: /contacts/{id}
    resource: contact
    operation: delete
    status: 200
    deleted_body: flagged
    # The discriminator, named here rather than taken from the resource:
    # Intercom stamps workspace_id on a contact and sends none of it on a
    # delete, so the route says exactly what the receipt carries.
    fields:
      type: contact

  - method: GET
    path: /conversations
    resource: conversation
    operation: list
    pagination:
      # Intercom's own description declares per_page -- "Defaults to 15" --
      # and starting_after, "String used to get the next page". Neither is
      # limit and neither is cursor, which is what this block was making the
      # runtime read.
      style: cursor
      limit: 15
      limit_param: per_page
      cursor_param: starting_after

  - method: GET
    path: /conversations/{id}
    resource: conversation
    operation: get

  - method: GET
    path: /companies
    resource: company
    operation: list
    pagination:
      # And this listing pages differently from the two above it. Intercom's
      # description gives companies page and per_page and no starting_after
      # at all -- so it is page numbering where contacts and conversations
      # are cursors, on the same API, with nothing in the response saying
      # which.
      style: page
      limit: 15
      limit_param: per_page
      cursor_param: page
      first_page: 1

  - method: POST
    path: /companies
    resource: company
    operation: create

webhooks:
  events:
    - contact.created
    - contact.signed_up
    - conversation.user.created
    - conversation.user.replied
    - conversation.admin.replied
    - conversation.admin.closed
    - company.created
  # The top-level type is the literal notification_event on every delivery.
  # The discriminator is topic, one field over -- the same trap Slack sets,
  # and Intercom sets it twice, because data.type is another constant string
  # and the record's own type sits at data.item.type.
  #
  # So there are four fields called type in one payload, three of them fixed,
  # and the one an application actually wants is the innermost.
  payload:
    type: notification_event
    id: "{id}"
    topic: "{event}"
    app_id: cauldron01
    created_at: "{created}"
    # Intercom sends the delivery's own state beside the data. An application
    # retrying on delivery_attempts needs it to exist.
    delivery_status: pending
    delivery_attempts: 1
    delivered_at: 0
    first_sent_at: "{created}"
    links: {}
    data:
      type: notification_event_data
      item:
        "{object}": true
  signing:
    scheme: hmac-sha256
    header: X-Hub-Signature
    secret: cauldron-client-secret

errors:
  rate_limit:
    status: 429
    code: rate_limit_exceeded
    message: You have exceeded the rate limit
    headers:
      X-RateLimit-Remaining: "0"
      Retry-After: "10"

  # No Authorization header at all. Confirmed live 2026-09-05 -- see the
  # header.
  missing_authorization:
    status: 401
    code: missing_authorization
    message: No authorization was provided

  # A credential that is present and is not one Intercom recognises.
  # Confirmed live 2026-09-05 -- see the header. This used to be named
  # authentication_error and to say something else entirely.
  invalid_token:
    status: 401
    code: unauthorized
    message: Access Token Invalid

  resource_missing:
    status: 404
    code: not_found
    message: "Resource Not Found: {detail}"

  parameter_missing:
    status: 400
    code: parameter_not_found
    message: "Missing required parameter: {detail}"

  # Intercom's own name for the conflict every contact import meets: an email
  # that already belongs to somebody.
  # Declared for cauldron fault rather than found in a description: Intercom's description
  # declares no 409 on any operation, and a client that has never been made to
  # handle one is a client that will not. The wording is a placeholder rather
  # than something observed, and check reports it every run.
  conflict:
    status: 409
    code: conflict
    message: A contact matching those details already exists with id=cauldron

  # A workspace over its seat or contact limit starts refusing writes while
  # reads keep working, which is a state a live workspace will not enter on
  # request.
  limit_reached:
    status: 403
    code: limit_reached
    message: The workspace has reached its contact limit

fixtures:
  empty: {}

  small-workspace:
    contact:
      - id: "000000000000000000000001"
        role: user
        email: ada@example.com
        name: Ada Lovelace
        external_id: cust_1001
      - id: "000000000000000000000002"
        role: user
        email: grace@example.com
        name: Grace Hopper
        external_id: cust_1002
      - id: "000000000000000000000003"
        role: lead
        name: Anonymous visitor
    conversation:
      - id: "1"
        title: Cannot connect my account
        state: open
        open: true
        priority: priority
      - id: "2"
        title: Billing question
        state: closed
        open: false
        read: true
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '3'
        title: Billing question
        state: closed
        open: false
        read: true
    company:
      - id: "000000000000000000000010"
        company_id: acme-001
        name: Analytical Engines
        plan: Growth
        monthly_spend: 499
        user_count: 12
        session_count: 42

# Conformance cases, read from Intercom's REST API reference rather than
# observed against a live workspace. The verify report says so.
conformance:
  - name: deleting a contact answers a receipt keyed on type, not object
    # {type: contact, id, deleted: true}. Stripe's discriminator is called
    # object and Intercom's is called type, so code checking
    # response.object === 'contact' never matches -- and a 204, which this
    # answered before, gives it nothing to check at all.
    source: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/deletecontact
    fixture: small-workspace
    request:
      method: DELETE
      path: /contacts/000000000000000000000001
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 200
      body:
        type: contact
        id: "000000000000000000000001"
        deleted: true
      # The workspace is stamped on a contact and is not on the receipt.
      absent:
        - object
        - workspace_id

  - name: a collection is a list object with a total count
    source: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/listcontacts
    fixture: small-workspace
    request:
      method: GET
      path: /contacts
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 200
      body:
        type: list
        total_count: 3
        data[0].type: contact
        data[0].email: ada@example.com
      absent:
        - results
        - has_more

  - name: the paging cursor is nested under pages
    source: https://developers.intercom.com/docs/build-an-integration/learn-more/rest-apis/pagination
    fixture: small-workspace
    request:
      method: GET
      path: /contacts
      query:
        # per_page, not limit. This case sent limit -- which Intercom does not
        # have on this route -- against a Recipe that was reading limit too, so
        # the two agreed and a page of two came back looking asked for. Its own
        # description says per_page, "Defaults to 15".
        per_page: "2"
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 200
      body:
        type: list
        pages:
          type: pages
        # The rest of the pages object, which used to be a stated gap: the
        # Recipe said Cauldron did not model page, per_page and total_pages,
        # and it does -- the same nesting the cursor above already used.
        pages.page: 1
        pages.per_page: 2
        pages.total_pages: 2
      matches:
        pages.next.starting_after: '^[0-9a-f]{24}$'
      # A client reading response.next_cursor finds nothing.
      absent:
        - next_cursor
        - data[2]

  - name: every object declares its own type
    source: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/showcontact
    fixture: small-workspace
    request:
      method: GET
      path: /contacts/000000000000000000000001
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 200
      body:
        type: contact
        workspace_id: cauldron01
        role: user
      # session_count belongs to a company and to a visitor. This asserted it
      # on a contact and passed, because the Recipe declared it there.
      absent:
        - session_count

  - name: an error response is itself a typed list
    source: https://developers.intercom.com/docs/references/rest-api/errors/http-responses
    fixture: small-workspace
    request:
      method: GET
      path: /contacts/ffffffffffffffffffffffff
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 404
      body:
        type: error.list
        errors[0].code: not_found
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        errors[0].message: '.'
        request_id: '^cauldron[0-9]+$'
      # The request id belongs to the call, not to one failure in it.
      absent:
        - errors[0].request_id
        - error
        - message

  - name: a new contact gets a hex identifier, not a prefixed one
    source: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/createcontact
    fixture: empty
    request:
      method: POST
      path: /contacts
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
      json:
        email: alan@example.com
        name: Alan Turing
    expect:
      status: 200
      body:
        type: contact
        email: alan@example.com
        role: user
        unsubscribed_from_emails: false
      matches:
        id: '^[0-9a-f]{24}$'

  - name: no credential at all names the missing header, not the token
    # This case used to be named "a bad token" and sent none at all, so
    # nothing here had ever actually asked Intercom what a bad token gets.
    # Fixed below and split into two, verified live -- see the header.
    source: https://api.intercom.io/contacts
    verified: "2026-09-05"
    request:
      method: GET
      path: /contacts
    expect:
      status: 401
      body:
        type: error.list
        errors[0].code: missing_authorization
        errors[0].message: No authorization was provided

  - name: a bad token is refused with the same typed error shape
    source: https://api.intercom.io/contacts
    verified: "2026-09-05"
    request:
      method: GET
      path: /contacts
      headers:
        Authorization: "Bearer dG9rOmp1bms6"
    expect:
      status: 401
      body:
        type: error.list
        errors[0].code: unauthorized
        errors[0].message: Access Token Invalid

  - name: a conversation carries the state a routing rule reads
    source: https://developers.intercom.com/docs/references/rest-api/api.intercom.io/conversations/listconversations
    fixture: small-workspace
    request:
      method: GET
      path: /conversations
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
    expect:
      status: 200
      body:
        type: list
        data[0].type: conversation
        data[0].state: open
        data[0].open: true
        data[0].priority: priority
        data[1].state: closed

  - name: three of the four types in a delivery are fixed strings
    source: https://developers.intercom.com/docs/references/webhooks/webhook-models
    fixture: small-workspace
    request:
      method: POST
      path: /contacts
      headers:
        Authorization: Bearer dG9rOmNhdWxkcm9u
      json:
        email: hopper@example.com
    expect:
      status: 200
      webhook:
        event: contact.created
        body:
          # Says this is a notification, not which one.
          type: notification_event
          # Says the data is notification data. Also not which one.
          data.type: notification_event_data
          # The one that says what happened.
          topic: contact.created
          # And the one that says what the thing is.
          data.item.type: contact
          delivery_status: pending
          delivery_attempts: 1
        absent:
          # The record is at data.item, not data.object.
          - data.object


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and starting_after=000000000000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and starting_after are the two names this listing reads"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/listcontacts"
    fixture: small-workspace
    request:
      method: GET
      path: "/contacts"
      query:
        "per_page": "1"
        "starting_after": "000000000000000000000001"
      headers:
        "Authorization": "Bearer dG9rOmNhdWxkcm9u"
    expect:
      status: 200
      body:
        "data[0].id": "000000000000000000000002"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and starting_after=000000000000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and starting_after are the two names this listing reads on contacts"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/listcontacts"
    fixture: small-workspace
    request:
      method: GET
      path: "/contacts"
      query:
        "per_page": "1"
        "starting_after": "000000000000000000000001"
      headers:
        "Authorization": "Bearer dG9rOmNhdWxkcm9u"
    expect:
      status: 200
      body:
        "data[0].id": "000000000000000000000002"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and starting_after=1, which is the identifier of the last
  # record on the previous page, and asserts the second record came back
  # on its own: one to skip, one to return, and a third behind it to
  # prove the size stopped the page.
  - name: "per_page and starting_after are the two names this listing reads on conversations"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/conversations/listconversations"
    fixture: small-workspace
    request:
      method: GET
      path: "/conversations"
      query:
        "per_page": "1"
        "starting_after": "1"
      headers:
        "Authorization": "Bearer dG9rOmNhdWxkcm9u"
    expect:
      status: 200
      body:
        "data[0].id": "2"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the company listing answers with what the fixture holds"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/deletecontact"
    fixture: small-workspace
    request:
      method: GET
      path: "/companies"
      headers:
        "Authorization": "Bearer dG9rOmNhdWxkcm9u"
    expect:
      status: 200
      body:
        "data[0].id": "000000000000000000000010"
      absent:
        - "data[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/deletecontact"
    fixture: small-workspace
    request:
      method: GET
      path: "/companies"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer dG9rOmNhdWxkcm9u"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The names. This Recipe declares 7 field(s) on a company that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "a company carries the field names this Recipe declares"
    source: "https://developers.intercom.com/docs/references/rest-api/api.intercom.io/contacts/deletecontact"
    fixture: small-workspace
    request:
