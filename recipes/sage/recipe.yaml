# Sage Accounting Recipe for Cauldron
#
# Written against Sage's API reference at developer.sage.com and struck live
# against api.accounting.sage.com on 2026-09-07 with no credential and then
# with a deliberately invalid one.
#
# **Two failures, two shapes, and one of them is a bare array with
# dollar-prefixed keys.** Struck live:
#
#   GET /v3.1/contacts                        (no credential)
#   401 { "error": "Authorization missing. Please, add an authorization token at the 'Authorization' HTTP header."}
#
#   GET /v3.1/contacts                        Authorization: Bearer notreal
#   401 [{"$severity":"error",
#         "$dataCode":"AccessTokenVerificationError",
#         "$message":"Access token is invalid (JWT malformed or missing).",
#         "$source":"Authorization"}]
#
# The first is an object with one field. The second is a **top-level array**
# whose every key begins with a dollar sign.
#
# A bare array is the shape [salesforce](../salesforce) has, and it means
# `body.error` is `undefined` -- a client has to index before it can read
# anything. The `$` prefixes are rarer still: they are legal JSON and they are
# awkward in every language that maps JSON onto objects, because `$severity`
# is not an identifier and has to be reached by string.
#
# So one API answers two documents that share no field, no shape and no naming
# convention, on one route, one status apart from nothing.
#
# **`$source` names the header.** `"Authorization"` -- which is the useful
# thing, and it is on the shape that is hardest to read.
#
# **The first message has a stray comma and a leading space.** `{ "error":` --
# a space after the brace -- and "Please, add an authorization token", with a
# comma after Please. Small, and it is the kind of thing that survives into
# every test fixture anybody records by hand.
#
# **An unknown path answers the token failure**, so routing is judged after the
# credential and a path cannot be shown not to exist.

recipe: sage
capability: accounting
version: 0.1.0

upstream:
  api: v3.1
  docs: https://developer.sage.com/accounting/reference/
  # No spec: Sage publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig
  # Two documents that share no field, no shape and no naming convention.
  absent_error: authorization_missing
  rejected_error: access_token_verification_error

responses:
  list:
    style: wrapped
    key: "$items"
    count_field: "$total"
    page_field: "$page"
    limit_field: "$itemsPerPage"
  error:
    # The rejected case, which is the bare array.
    style: list
    key: "-"
    message_field: "$message"
    code_field: "$dataCode"
    code_type: string
    type_field: "$severity"

resources:
  contact:
    id:
      field: id
      style: hex
    fields:
      displayed_as:
        type: string
      name:
        type: string
      reference:
        type: string
      created_at:
        type: datetime
      balance:
        type: number
        default: 0

routes:
  - method: GET
    path: /v3.1/contacts
    resource: contact
    operation: list
    pagination:
      style: page
      limit: 20
      max_limit: 200
      limit_param: items_per_page
      cursor_param: page

errors:
  authorization_missing:
    status: 401
    # An object with one field, and a comma after "Please". The other failure
    # on this route is a bare array.
    style: flat
    message_field: error
    code_field: "-"
    message: "Authorization missing. Please, add an authorization token at the 'Authorization' HTTP header."

  access_token_verification_error:
    status: 401
    code: AccessTokenVerificationError
    type: error
    # "(JWT malformed or missing)" -- both cases in one parenthesis, on the
    # failure where the token was present.
    message: "Access token is invalid (JWT malformed or missing)."
    fields:
      # The header at fault, which is the useful part, on the shape that is
      # hardest to read.
      "$source": Authorization

fixtures:
  empty:
    contact: []

  business:
    contact:
      - id: 4f1a9c3e8b274d6a9f102c5e7b3a8d41
        displayed_as: "Northwind Traders (NORTH01)"
        name: Northwind Traders
        reference: NORTH01
        created_at: "2026-04-02T10:15:00Z"
        balance: 1249.50
      - id: 7c2d5e813f944a0bb6e29d18c4a70e35
        # The display string is the name alone when there is no reference, so
        # a client parsing displayed_as to recover the reference finds none
        # and has no way to tell that from a parse failure.
        displayed_as: Contoso Ltd
        name: Contoso Ltd
        created_at: "2026-06-18T09:05:44Z"
        balance: 0

conformance:
  - name: a missing credential is an object with one field
    source: https://api.accounting.sage.com/v3.1/contacts
    verified: "2026-09-07"
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers: {}
    expect:
      status: 401
      body:
        # A comma after "Please", and the header named in single quotes
        # inside the sentence.
        error: "Authorization missing. Please, add an authorization token at the 'Authorization' HTTP header."

  - name: a wrong credential is a bare array
    source: https://api.accounting.sage.com/v3.1/contacts
    verified: "2026-09-07"
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # A top-level array, so body.error is undefined and a client has to
        # index before it can read anything -- the shape Salesforce has.
        '[0].$message': "Access token is invalid (JWT malformed or missing)."
        '[0].$dataCode': AccessTokenVerificationError

  - name: every key in the array begins with a dollar sign
    source: https://api.accounting.sage.com/v3.1/contacts
    verified: "2026-09-07"
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # Legal JSON, and awkward in every language that maps JSON onto
        # objects: $severity is not an identifier and has to be reached by
        # string.
        '[0].$severity': error
        '[0].$source': Authorization

  - name: the two failures share no field at all
    source: https://api.accounting.sage.com/v3.1/contacts
    verified: "2026-09-07"
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      absent:
        # `error` is the whole of the other failure and is not here. One
        # route, one status, two documents with nothing in common.
        - error

  - name: an unknown path answers the token failure
    source: https://api.accounting.sage.com/v3.1/cauldron-nope
    verified: "2026-09-07"
    fixture: business
    request:
      method: GET
      path: /v3.1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Routing is judged after the credential, so a path cannot be shown not
      # to exist.
      status: 401
      body:
        '[0].$dataCode': AccessTokenVerificationError

  - name: the listing envelope is dollar-prefixed too
    source: https://developer.sage.com/accounting/reference/
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig"
    expect:
      status: 200
      body:
        # $items, $total, $page -- the same convention as the failure array,
        # so the one thing the two shapes share is a sigil.
        '$total': 2
        '$items[0].name': Northwind Traders

  - name: the display string folds the reference into the name
    source: https://developer.sage.com/accounting/reference/
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig"
    expect:
      status: 200
      body:
        # "Name (REFERENCE)" when there is a reference and the bare name when
        # there is not, so a client parsing displayed_as to recover the
        # reference cannot tell an absent one from a parse failure.
        '$items[0].displayed_as': "Northwind Traders (NORTH01)"
        '$items[1].displayed_as': Contoso Ltd

  - name: a contact without a reference omits the field
    source: https://developer.sage.com/accounting/reference/
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig"
    expect:
      status: 200
      body:
        '$items[0].reference': NORTH01
        # And the balance is a bare double on an accounting API, with no
        # currency field on the contact at all -- it belongs to the business.
        '$items[0].balance': 1249.50
        '$items[0].created_at': "2026-04-02T10:15:00Z"
      absent:
        - '$items[1].reference'

  - name: contacts page on page and items_per_page
    source: https://developer.sage.com/accounting/reference/
    fixture: business
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig"
      query:
        page: "2"
        items_per_page: "1"
    expect:
      status: 200
      body:
        # The request parameters are snake case and the response fields are
        # dollar-prefixed camel case, so the name a client sends and the name
        # it reads back are spelled two different ways.
        '$items[0].name': Contoso Ltd
        '$page': 2
        '$itemsPerPage': 1

  - name: a business with no contacts answers an empty array
    source: https://developer.sage.com/accounting/reference/
    fixture: empty
    request:
      method: GET
      path: /v3.1/contacts
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesig"
    expect:
      status: 200
      body:
        '$items': []
        '$total': 0
