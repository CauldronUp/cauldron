# Dokploy Recipe for Cauldron
#
# The project listing, read from the OpenAPI document Dokploy serves at
# docs.dokploy.com/openapi.json and from Dokploy's own source, and struck live
# on 2026-09-14 against app.dokploy.com with no key, with a wrong key, on a
# path that does not exist, with a method the path does not take, and without a
# required parameter.
#
# **Every success in the document is declared to be empty.** All 604
# operations -- every one of them -- give their 200 as
#
#   {"type": "object", "properties": {}, "additionalProperties": false}
#
# An object with no properties and no others permitted: the document says every
# endpoint in this API returns exactly `{}`. `/project.all` says it. So does
# `/application.one`, `/server.all`, `/deployment.allByType` and the other six
# hundred. The implementation returns rows -- `db.query.projects.findMany` with
# nested relations -- so the schema does not merely omit the shape, it forbids
# it.
#
# **The only reusable types in a 1.8 MB document are its errors.**
# `components.schemas` holds five entries: `error.BAD_REQUEST`,
# `error.UNAUTHORIZED`, `error.FORBIDDEN`, `error.NOT_FOUND` and
# `error.INTERNAL_SERVER_ERROR`. Each is fully specified -- `message`, `code`,
# an `issues` array, examples, a title. Every failure is typed and no success
# is.
#
# **And the live failure does not match the error schema either.**
# `error.UNAUTHORIZED` requires `message` and `code`, with the example message
# "Authorization not provided" and code "UNAUTHORIZED". Struck live:
#
#   {"message":"Unauthorized"}
#
# No `code`, on a schema that requires it, and a different sentence.
#
# **One answer for every mistake.** No key, a wrong key, a path that does not
# exist, a verb a path does not take, and a required parameter left out all
# answer that same 401. Nothing distinguishes them.
#
# **The document's only server is a hostname that does not exist.**
# `servers: [{"url": "https://your-dokploy-instance.com/api"}]`. Checked
# 2026-09-14: `your-dokploy-instance.com` does not resolve -- NXDOMAIN -- so a
# client generated from this document points at an unregistered domain, and
# whoever registers it receives the traffic.
#
# **One authentication scheme is declared twice.** `securitySchemes` has
# `apiKey` and `x-api-key`, both `{"type": "apiKey", "in": "header", "name":
# "x-api-key"}`, differing only in their description; the global `security` is
# `[{"apiKey": []}, {"x-api-key": []}]`, which reads as two alternatives and is
# one requirement written twice.
#
# **A project's environment is encrypted at rest and fails open on read.**
# Dokploy's `encryptedText` column type decrypts in `fromDriver` and, on
# failure, returns the raw value with a log line -- so `env` can arrive as
# AES-256-GCM ciphertext in the same string field that usually holds the
# variables, with nothing on the record saying which it is.
#
# Also pinned: paths are RPC names with dots -- `/project.all`, `/project.one`,
# `/application.deployNginxQuickstart` -- and the verbs are not consistent:
# `network.all` and `certificates.all` beside `gitProvider.getAll` and
# `ai.getAll`, with `deployment.allByCompose`, `deployment.allByServer`,
# `deployment.allCentralized` and `deployment.allByType` on one resource;
# `createdAt` is a `text` column holding an ISO string rather than a timestamp;
# and the listing nests one key per service type -- `applications`, `libsql`,
# `mariadb`, `mongo`, `mysql`, `postgres` and the rest -- so the response grows
# a top-level key every time Dokploy supports another engine.

recipe: dokploy
capability: hosting
version: 1.0.0

upstream:
  api: "1.0.0"
  docs: https://docs.dokploy.com/docs/api
  spec: https://docs.dokploy.com/openapi.json
  spec_hash: 8080c5873298827ed2ddc58517ab4c2f79d2cd15df83fb7a9e4bbf9ca2ae7789
  spec_seen: "2026-09-14"

auth:
  scheme: header
  header: x-api-key
  keys:
    - cauldr0n-dokploy-fixture-key
  # One sentence for everything, including routing failures.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    # Required by the document's own error schema. Not sent.
    code_field: "-"

resources:
  project:
    id:
      # A nanoid, in a column called projectId rather than id.
      field: projectId
      style: opaque
      length: 21
    fields:
      name:
        type: string
      description:
      # A text column holding an ISO string.
      createdAt:
        type: string
      organizationId:
        type: string
      # Encrypted at rest, and the decrypt fails open.
      env:
        type: string
      environments:
        type: list

routes:
  - method: GET
    path: /api/project.all
    resource: project
    operation: list
    # The document declares no parameters on it at all.
    pagination:
      style: none

  - method: GET
    path: /api/project.one
    resource: project
    operation: get
    # A query parameter, required, on a GET that reads one record.
    id_from: query:projectId
    not_found: not_found

errors:
  unauthorized:
    status: 401
    # The document's own schema requires a code beside this. There is none.
    message: Unauthorized

  # Live, with no key, these are the same 401 as everything else.
  unknown_route:
    status: 401
    message: Unauthorized

  method_not_allowed:
    status: 401
    message: Unauthorized

  # Declared by the document as error.NOT_FOUND. Not observed: reaching it
  # needs a real key, and the README says so.
  not_found:
    status: 404
    message: Not found

fixtures:
  empty:
    project: []

  projects:
    project:
      - projectId: kY3nQ7pLzR9vB2mX8sT4w
        name: platform
        description: The main platform stack
        # An ISO string in a text column.
        createdAt: "2026-04-02T10:15:33.129Z"
        organizationId: org_4f3e2d1c0b9a8877
        # Plaintext here. Live, a key mismatch returns the ciphertext in this
        # same field.
        env: "NODE_ENV=production"
        environments:
          - environmentId: env_7a1c4d20
            name: production
            applications:
              - applicationId: app_91b3e7
                name: web
                applicationStatus: done
            postgres:
              - postgresId: pg_22ffa1
                name: primary
                applicationStatus: done
            mariadb: []
            mongo: []
            mysql: []
            libsql: []
      - projectId: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf
        name: scratch
        # Nullable, and null.
        description: null
        createdAt: "2026-07-30T16:20:00.000Z"
        organizationId: org_4f3e2d1c0b9a8877
        # The column's default is the empty string, not null.
        env: ""
        environments: []

conformance:
  - name: a missing key is a message with no code beside it
    source: https://app.dokploy.com/api/project.all
    verified: "2026-09-14"
    fixture: projects
    request:
      method: GET
      path: /api/project.all
      headers: {}
    expect:
      status: 401
      body:
        message: Unauthorized
      absent:
        # error.UNAUTHORIZED requires this.
        - code

  - name: and a wrong key is the same body
    source: https://app.dokploy.com/api/project.all
    verified: "2026-09-14"
    fixture: projects
    request:
      method: GET
      path: /api/project.all
      headers:
        x-api-key: notarealkey
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: a path that does not exist is the same body again
    source: https://app.dokploy.com/api/cauldron.nope
    verified: "2026-09-14"
    fixture: projects
    request:
      method: GET
      path: /api/cauldron.nope
      headers: {}
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: and so is a method the path does not take
    source: https://app.dokploy.com/api/project.all
    verified: "2026-09-14"
    fixture: projects
    request:
      method: PUT
      path: /api/project.all
      headers: {}
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: and so is a required parameter left out
    source: https://app.dokploy.com/api/project.one
    verified: "2026-09-14"
    fixture: projects
    request:
      method: GET
      path: /api/project.one
      headers:
        x-api-key: notarealkey
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: the listing returns rows the document forbids
    source: https://docs.dokploy.com/openapi.json
    fixture: projects
    request:
      method: GET
      path: /api/project.all
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 200
      body:
        # The 200 is declared {"properties": {}, "additionalProperties": false}.
        '[0].projectId': kY3nQ7pLzR9vB2mX8sT4w
        '[0].name': platform
        '[0].description': The main platform stack
        '[1].description': null
        '[0].organizationId': org_4f3e2d1c0b9a8877
        '[0].createdAt': "2026-04-02T10:15:33.129Z"

  - name: an environment field that may arrive as ciphertext
    source: https://github.com/Dokploy/dokploy
    fixture: projects
    request:
      method: GET
      path: /api/project.all
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 200
      body:
        # encryptedText decrypts on read and returns the raw value on failure.
        '[0].env': "NODE_ENV=production"
        # The column default is the empty string.
        '[1].env': ""

  - name: one nested key per database engine
    source: https://github.com/Dokploy/dokploy
    fixture: projects
    request:
      method: GET
      path: /api/project.all
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 200
      body:
        # applications, libsql, mariadb, mongo, mysql, postgres, each its own.
        '[0].environments[0].name': production
        '[0].environments[0].applications[0].name': web
        '[0].environments[0].postgres[0].name': primary
        '[0].environments[0].mariadb': []
        '[0].environments[0].mongo': []
        '[1].environments': []

  - name: one project is read by a required query parameter
    source: https://docs.dokploy.com/openapi.json
    fixture: projects
    request:
      method: GET
      path: /api/project.one
      query:
        projectId: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 200
      body:
        projectId: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf
        name: scratch
        env: ""

  - name: a project that is not there is the document's own not found
    source: https://docs.dokploy.com/openapi.json
    fixture: projects
    request:
      method: GET
      path: /api/project.one
      query:
        projectId: AAAAAAAAAAAAAAAAAAAAA
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 404
      body:
        message: Not found

  - name: an organisation with no projects is a bare empty array
    source: https://github.com/Dokploy/dokploy
    fixture: empty
    request:
      method: GET
      path: /api/project.all
      headers:
        x-api-key: cauldr0n-dokploy-fixture-key
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
