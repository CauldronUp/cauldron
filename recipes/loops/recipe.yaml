# Loops Recipe for Cauldron
#
# Written against Loops' developer documentation at loops.so/docs/api and struck
# live against app.loops.so on 2026-09-06 with no credential and then with a
# deliberately invalid one.
#
# **You cannot see a 404 without sending something in the Authorization
# header.** Struck live:
#
#   GET /api/v1/cauldron-nope                  (no header)
#   401 {"success":false,"message":"Invalid API key","error":"Invalid API key"}
#
#   GET /api/v1/cauldron-nope                  Authorization: Bearer <anything>
#   404 {"message":"Not found"}
#
# So an unknown path is reported as a credential failure until a credential is
# present, and it does not have to be a valid one -- any string flips the
# answer. A developer with a typo in a URL and no key configured is told their
# key is wrong, which is the wrong thing to go and check.
#
# **And the two failures have different envelopes.** The auth failure is
# `{success, message, error}`; the not-found is `{message}` alone -- no
# `success`, no `error`. A client reading `body.success === false` to decide
# whether a call failed reads `undefined` on the 404 and treats it as fine.
#
# **`message` and `error` are the same string.** "Invalid API key" twice, in one
# body, in two fields. So the envelope has three keys and carries two facts, and
# neither field is the one to branch on because there is no code anywhere.
#
# **A missing key and a wrong key are the same response**, both "Invalid API
# key" -- so the sentence is wrong about one of the two cases it covers, and it
# is wrong about the one where nothing was sent.

recipe: loops
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://loops.so/docs/api
  # No spec: Loops publishes a rendered documentation site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron0loops0fixture0key000000
  # One error for both, because Loops answers one response to both -- and the
  # sentence it chose describes only the second.
  absent_error: invalid_api_key
  rejected_error: invalid_api_key

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    # No envelope constants: success and error ride the auth failure and not
    # the 404, which is the finding, so they are declared per error below.

resources:
  contact:
    id:
      field: id
      style: opaque
    fields:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      subscribed:
        type: boolean
        default: true
      userGroup:
        type: string
      source:
        type: string
        default: API

routes:
  - method: GET
    path: /api/v1/contacts/find
    resource: contact
    operation: list
    filters:
      - param: email
        field: email
    pagination:
      # None. contacts/find answers every match as a bare array, and the
      # documentation offers no limit, offset or cursor for it.
      style: none

errors:
  invalid_api_key:
    status: 401
    # Struck live for both a missing credential and a wrong one.
    message: "Invalid API key"
    fields:
      # Two fields, one string. And `success`, which the 404 beside it does
      # not send.
      success: false
      error: "Invalid API key"

  unknown_route:
    status: 404
    # Two words and nothing else: no success, no error. A different envelope
    # from every other failure here, reachable only once something is in the
    # Authorization header.
    message: "Not found"

fixtures:
  empty:
    contact: []

  audience:
    contact:
      - id: clx7k2p9a0001mb08h3n1qz4t
        email: ada@example.invalid
        firstName: Ada
        lastName: Lovelace
        subscribed: true
        userGroup: Founders
        source: API
      - id: clx7k2p9a0002mb08j5r2wy6u
        email: grace@example.invalid
        firstName: Grace
        lastName: Hopper
        # Unsubscribed and still in the audience, which is the state a
        # marketing tool has to keep and must not send to.
        subscribed: false
        userGroup: Founders
        source: API

conformance:
  - name: no credential says the key is invalid rather than missing
    source: https://app.loops.so/api/v1/contacts/find?email=a@b.invalid
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: ada@example.invalid
      headers: {}
    expect:
      status: 401
      body:
        # Struck live with no Authorization header at all. The sentence
        # describes the other case.
        message: "Invalid API key"
        success: false

  - name: message and error carry the same string
    source: https://app.loops.so/api/v1/contacts/find?email=a@b.invalid
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: ada@example.invalid
      headers: {}
    expect:
      status: 401
      body:
        # Three keys, two facts. And no code anywhere, so neither field is the
        # one to branch on.
        message: "Invalid API key"
        error: "Invalid API key"

  - name: a wrong credential is the same response as none
    source: https://app.loops.so/api/v1/contacts/find?email=a@b.invalid
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: ada@example.invalid
      headers:
        Authorization: "Bearer not-a-real-key"
    expect:
      status: 401
      body:
        message: "Invalid API key"
        success: false

  - name: an unknown path with no credential is a credential failure
    source: https://app.loops.so/api/v1/cauldron-nope
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      # Struck live. A typo in a URL, with no key configured, is reported as a
      # key problem -- which sends the reader to the wrong file.
      status: 401
      body:
        message: "Invalid API key"

  - name: the same path with any credential is a not-found
    source: https://app.loops.so/api/v1/cauldron-nope
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer cauldron0loops0fixture0key000000"
    expect:
      # Struck live with a credential that was merely present, not valid. Any
      # string flips the answer.
      status: 404
      body:
        message: "Not found"

  - name: the not-found envelope is missing the field a client tests
    source: https://app.loops.so/api/v1/cauldron-nope
    verified: "2026-09-06"
    fixture: audience
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer cauldron0loops0fixture0key000000"
    expect:
      status: 404
      absent:
        # No success and no error, where every other failure here has both.
        # A client reading body.success === false to decide whether a call
        # failed reads undefined and treats this as fine.
        - success
        - error

  - name: a contact search answers a bare array
    source: https://loops.so/docs/api-reference/find-contact
    fixture: audience
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: ada@example.invalid
      headers:
        Authorization: "Bearer cauldron0loops0fixture0key000000"
    expect:
      status: 200
      body:
        # No envelope at all on success, where both failures have one. So the
        # shape of a response depends on whether it worked, and a client has
        # to know before it parses.
        '[0].email': ada@example.invalid
        '[0].firstName': Ada

  - name: an unsubscribed contact is still a contact
    source: https://loops.so/docs/api-reference/find-contact
    fixture: audience
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: grace@example.invalid
      headers:
        Authorization: "Bearer cauldron0loops0fixture0key000000"
    expect:
      status: 200
      body:
        # Present in the audience and not to be sent to. A listing that hid
        # them would make an unsubscribe look like a deletion.
        '[0].subscribed': false
        '[0].userGroup': Founders
        '[0].source': API
        '[0].lastName': Hopper

  - name: an address nobody knows answers an empty array
    source: https://loops.so/docs/api-reference/find-contact
    fixture: empty
    request:
      method: GET
      path: /api/v1/contacts/find
      query:
        email: nobody@example.invalid
      headers:
        Authorization: "Bearer cauldron0loops0fixture0key000000"
    expect:
      status: 200
      # An empty array rather than a 404, so "no such contact" is a successful
      # request with nothing in it -- and the bare-array success shape means
      # there is no envelope key to look at either way.
      body_matches: '^\[\s*\]\s*$'
