# Adapty Recipe for Cauldron
#
# Checked live against api.adapty.io/api/v2/server-side-api with no account
# and no credential. Adapty's own OpenAPI document (downloaded from the URL
# below, 3313 lines) is precise about almost everything it describes, which
# is what makes the one place it is wrong worth pinning exactly.
#
# The documented credential scheme is not the one that actually
# authenticates a request. Adapty's own securitySchemes entry, quoted
# verbatim: "API requests must be authenticated by your secret API key as
# the Authorization header with the value `Api-Key {your_secret_api_key}`,
# for example, `Api-Key secret_live_...`." Sending exactly that shape live
# -- "Authorization: Api-Key secret_live_junkjunkjunkjunkjunkjunkjunk", the
# documented prefix and everything -- answers 401 {"errors":[{"source":
# null,"errors":["Authentication credentials were not provided."]}],
# "error_code":"not_authenticated","status_code":401}: the *exact same
# body* a request with no Authorization header at all gets. The documented
# scheme is not recognised as a credential being present; it is read as
# though nothing had been sent. What the live gateway actually parses is
# undocumented: "Authorization: Bearer junktoken12345" reaches a real
# rejection -- {"errors":[{"source":null,"errors":["Invalid token."]}],
# "error_code":"authentication_failed","status_code":401} -- a different
# verdict from the same-shaped request under the documented keyword. This
# Recipe models the scheme that actually works (Bearer), states the
# documented one is not it, and does not carry a conformance case for it:
# Cauldron's own credential check classifies any header present with the
# wrong prefix as malformed, never as absent, so there is no way to make
# this emulator answer not_authenticated for a request that carried
# "Authorization: Api-Key ..." -- it would answer authentication_failed
# instead, which is a true statement about the emulator and not the one
# this finding is about. Read the prose here, not the assumption "the docs
# must be right", if a bearer-scheme client written against this Recipe
# does not match a client written against Adapty's own reference page.
#
# One more shape was found and is not modelled: "Authorization: Api-Key "
# (the documented keyword, empty value) answers 403, Content-Type
# text/plain, body "invalid API key provided" -- Cloudflare-fronted headers
# (CF-RAY, no X-Request-Id), no WWW-Authenticate, nothing resembling the
# DRF envelope every other failure on this host uses. It does not fit
# absent, malformed or rejected -- it is a fourth thing, apparently caught
# by whatever sits in front of the Django application rather than by the
# application itself, and it could not be identified further from outside.
# Recorded here rather than forced into a verdict it does not belong to.
#
# Using the scheme that does work, the three verdicts this format names are
# all real and all different sentences, checked live:
#
#   no Authorization header at all        -> not_authenticated,
#                                             "Authentication credentials
#                                             were not provided."
#   "Bearer " with nothing after it       -> authentication_failed,
#                                             "Invalid token header. No
#                                             credentials provided."
#   "Bearer junktoken12345"               -> authentication_failed,
#                                             "Invalid token."
#
# malformed and rejected share one error_code and differ only in the
# sentence -- the DRF authenticator that parses "Bearer " tells an empty
# value from a wrong one, even though both answer the same code.
#
# Routing genuinely runs before authentication for a path with no matching
# URL pattern, and does not for one that has one -- Rootly's split, named
# again: a path with no route at all, /api/v2/server-side-api/
# no-such-route-xyz/, answers a plain, unbranded 404 (Werkzeug/Django's own
# default page, 179 bytes, reproduced in full below) with or without a
# credential, byte-identical either way, checked live both ways. A path
# this host *does* route, including with a method the resource does not
# support -- PUT on /profile/, which is not among the GET, POST, PATCH,
# DELETE, HEAD, OPTIONS the same response's own Allow header lists --
# still answers 401, not 405 and not 404: Django REST Framework checks
# authentication in APIView.dispatch() before it ever asks whether
# request.method has a handler, so an unsupported method on a real path
# reaches the credential check before it can be told the method is wrong.
# No genuine 405 was ever observed on this host for this reason: reaching
# one would need a valid credential to get past the authentication check
# first, and none exists. Cauldron's own default -- check the credential
# first, unconditionally, before routing is consulted -- reproduces both
# matched-path rows exactly, verified live. It cannot reproduce the
# unrouted-path row without a credential, for the reason
# rootly/recipe.yaml already states for its own Recipe: an absent
# credential 401s here before any path is examined, so the case
# demonstrating the 404 shape below carries a valid credential to reach
# Cauldron's own router-miss handling, which is not the request Adapty
# itself needed a credential for.
#
# Entitlements are computed exactly as far as RevenueCat's and no further,
# and the comparison is the point (see revenuecat/recipe.yaml, same group).
# AccessLevel has no is_active field either: the comparison a caller has to
# make by hand is the same one RevenueCat's own header describes --
# expires_at null means lifetime, not expired, and a caller comparing it to
# `now` gets that right only if they know null is the special case. The
# worked example in Adapty's own documentation, quoted rather than
# invented, is the identical trap: an access_level with
# renewal_cancelled_at set (the customer turned off auto-renewal) and
# expires_at null (the access never expires) in the same object -- cancelled
# and permanently active, at once, on purpose, the same shape RevenueCat's
# unsubscribe_detected_at-without-expiry fixture demonstrates. Where Adapty
# goes one step further than RevenueCat is is_in_grace_period: a
# precomputed boolean sitting right beside the raw
# billing_issue_detected_at timestamp it is presumably derived from.
# RevenueCat leaves that comparison to the caller entirely
# (grace_period_expires_date vs now); Adapty computes exactly this one
# signal and still leaves is_active undone. Server-side and raw are not two
# camps with RevenueCat and Adapty on opposite sides of a line -- Adapty
# sits on the raw side for the field that matters most (is this entitled)
# and on the computed side for one narrower field nobody asked it to
# precompute.
#
# access_levels and subscriptions are arrays, not maps, and that is a
# structural difference from RevenueCat rather than a wording one.
# RevenueCat's entitlements and subscriptions are both objects keyed by the
# identifier you chose (customerInfo.entitlements.premium), so a lookup is
# a property read. Adapty's Profile schema declares both as bare arrays of
# AccessLevel / Subscription objects -- confirmed in the OpenAPI document
# and in its own worked example, where a profile with exactly one access
# level still gets `"access_levels": [...]`, not `{"premium": {...}}` -- so
# the identical lookup here is a caller-written .find(a => a.access_level_id
# === "premium"), not a property read, and returns undefined rather than
# throwing when it fails to match. The two arrays do share a join key,
# store_product_id, present on both AccessLevel and Subscription -- the
# nearest thing here to RevenueCat's entitlement.product_identifier
# bridging its own two differently-keyed maps.
#
# There is no schema endpoint for either vocabulary a customer defines
# here. access_level_id values ("premium") are configured in the Adapty
# dashboard the same way a RevenueCat entitlement identifier is, and
# custom_attributes keys are chosen freely by whatever calls the client
# SDK, but nothing in this API's twelve documented paths lists either one
# -- no GET that enumerates an app's access levels, no schema for its
# custom attribute keys. Compare Clio (GET /custom_fields.json) and Aha!
# (GET /custom_field_definitions), both real, documented endpoints for
# exactly this question, in this same group. Adapty's answer to "can an
# integration discover the shape, or must it be told" is: it must be told,
# or it must read a profile that happens to carry the value already.
#
# custom_attributes is the one place a genuinely free-form, customer-typed
# field exists on this API, and it is the plainest shape any of the three
# providers in this group uses: an array of {key, value} pairs, up to
# thirty per profile, key capped at 30 characters and restricted to
# "letters, numbers, dashes, points, and underscores", value a string or a
# float and nothing else. No id, no type discriminator, no nested
# definition -- the WooCommerce meta_data shape this format already has
# precedent for (see field.go's own comment on `type: list`), and the
# plainest of the three because there is nothing else on the object to
# describe: no picklist options, no field_type enum, no per-field id at
# all.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - GET /profile/ addresses the record by an adapty-profile-id or
#     adapty-customer-user-id request *header* (Adapty's own OpenAPI
#     parameters list, `in: header` on both), and this format's id_from
#     only reads a path segment, a query parameter, or the caller's own
#     credential (see route.go: "query:name" or "body:name", plus the
#     special "auth" case) -- there is no header source. This Recipe
#     declares id_from: query:profile_id as a stated, disclosed
#     approximation: the record shape a case gets back is the real,
#     documented one, but a real client sending the actual header this API
#     requires would not reach it through this emulator the way it reaches
#     it live.
#   - The error envelope is approximated, not reproduced. Adapty's real
#     shape puts error_code and status_code as siblings of the errors
#     array -- {"errors": [...], "error_code": "...", "status_code": 401}
#     -- and this format's list error style has no field for a value
#     beside the array it wraps; every value declared for a list-style
#     error lands inside its one entry instead. So every case below gets
#     error_code and status_code nested one level too deep, inside the
#     {source, errors} object rather than beside it. The message array and
#     the source field are both faithful; the position of the two code
#     fields is not, and is asserted below exactly where the emulator
#     actually puts them rather than where Adapty does.
#   - Grant/revoke access level, set transaction, Stripe/Paddle purchase
#     validation, paywalls, virtual currency, and every write route are not
#     modelled. This is the read path for one profile.
#   - No spec_hash recorded, for the same reason census/recipe.yaml gives:
#     no tooling in this session to compute one meaningfully.

recipe: adapty
capability: commerce
version: 0.1.0

upstream:
  api: v2
  provider: adapty
  docs: https://adapty.io/docs/api-adapty
  spec: https://adapty.io/docs/api-specs/adapty-api.yaml

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-adapty-fixture-key-0000000000000
  absent_error: not_authenticated
  malformed_error: invalid_token_header
  rejected_error: authentication_failed

responses:
  resource:
    style: wrapped
    key: data
  error:
    # Adapty's real envelope puts error_code and status_code beside the
    # errors array; this format's list style has no field for that. See
    # the header's fidelity gaps -- every error below lands one level
    # deeper than the real one.
    style: list
    key: errors
    message_field: "errors[]"
    code_field: error_code
    status_field: status_code
    type_field: "-"

resources:
  profile:
    id:
      style: uuid
      field: profile_id
    fields:
      customer_user_id:
        type: string
        null_when_unset: true
      total_revenue_usd:
        type: number
      # {key, value} pairs the calling SDK set -- see the header. The one
      # genuinely customer-typed, schema-less field on this API.
      custom_attributes:
        type: list
      # An array, not a map -- see the header for the comparison against
      # RevenueCat's entitlements object.
      access_levels:
        type: list
      subscriptions:
        type: list

routes:
  - method: GET
    path: /api/v2/server-side-api/profile/
    resource: profile
    operation: get
    # See the header's fidelity gaps: the real identifier travels in a
    # header this format cannot address a route by.
    id_from: query:profile_id

errors:
  # Struck live with no Authorization header at all, and with the
  # documented "Api-Key" scheme sent exactly as Adapty's own reference
  # describes it -- both answer this identical body. See the header.
  not_authenticated:
    status: 401
    code: not_authenticated
    message: Authentication credentials were not provided.
    fields:
      source: null

  # Struck live: "Bearer " with nothing after it. Same error_code as
  # authentication_failed below, a different sentence.
  invalid_token_header:
    status: 401
    code: authentication_failed
    message: Invalid token header. No credentials provided.
    fields:
      source: null

  # Struck live: "Bearer junktoken12345", a well-formed value nobody
  # issued.
  authentication_failed:
    status: 401
    code: authentication_failed
    message: Invalid token.
    fields:
      source: null

  # A path with no route at all. Reproduced in full -- the real page is
  # short enough (179 bytes) that this Recipe does not need to state a
  # partial match the way aha/recipe.yaml has to for its own, much larger,
  # branded 404.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/html
    message: |2+

      <!doctype html>
      <html lang="en">
      <head>
        <title>Not Found</title>
      </head>
      <body>
        <h1>Not Found</h1><p>The requested resource was not found on this server.</p>
      </body>
      </html>

fixtures:
  empty: {}

  # Every value below is copied from the worked example in Adapty's own
  # OpenAPI document, trimmed to the fields this Recipe declares. None is
  # invented.
  subscriber:
    profile:
      # Seeded under the literal key "id" -- the store keys every record by
      # that name regardless of id.field, which only renames the property
      # on the wire when the response is built.
      - id: d8533a10-bcce-4e33-8c9d-88b05ac56559
        customer_user_id: 77B14FB4-FD2A-4D38-AA3A-4C433F79863C
        total_revenue_usd: 9.99
        custom_attributes:
          - key: favourite_sport
            value: yoga
        access_levels:
          - access_level_id: premium
            store: app_store
            store_product_id: unlimited.9999
            purchased_at: "2024-12-24T10:50:23+00:00"
            expires_at: null
            renewal_cancelled_at: "2025-01-05T13:27:47.461425+00:00"
            billing_issue_detected_at: null
            is_in_grace_period: false
            cancellation_reason: null
        subscriptions:
          - store: app_store
            store_product_id: unlimited.9999
            environment: Sandbox
            purchased_at: "2024-12-24T10:50:23+00:00"
            expires_at: null
            renewal_cancelled_at: null
            billing_issue_detected_at: null
            is_in_grace_period: false
            cancellation_reason: null

conformance:
  - name: no credential at all answers not_authenticated
    source: https://api.adapty.io/api/v2/server-side-api/profile/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
    expect:
      status: 401
      body:
        errors[0].errors[0]: Authentication credentials were not provided.
        errors[0].error_code: not_authenticated
        errors[0].source: null

  - name: an empty bearer value gets its own sentence, distinct from a wrong one
    source: https://api.adapty.io/api/v2/server-side-api/profile/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        errors[0].errors[0]: Invalid token header. No credentials provided.
        errors[0].error_code: authentication_failed

  - name: a well-formed but unissued bearer token gets a different sentence again, same error_code as the empty one
    source: https://api.adapty.io/api/v2/server-side-api/profile/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        errors[0].errors[0]: Invalid token.
        errors[0].error_code: authentication_failed

  - name: a method this resource does not support still requires a credential, not a 405 -- DRF checks authentication before it checks the method
    source: https://api.adapty.io/api/v2/server-side-api/profile/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/v2/server-side-api/profile/
    expect:
      status: 401
      body:
        errors[0].error_code: not_authenticated

  - name: a path with no route at all answers a plain 404, reached here with a credential the live request never needed -- see the header
    source: https://api.adapty.io/api/v2/server-side-api/no-such-route-xyz/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/server-side-api/no-such-route-xyz/
      headers:
        Authorization: Bearer cauldron-adapty-fixture-key-0000000000000
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: "The requested resource was not found on this server\\."

  - name: an access level can be cancelled and still permanently active -- renewal_cancelled_at is set, expires_at is null, and there is no field that says "active" directly
    source: https://adapty.io/docs/api-specs/adapty-api.yaml
    fixture: subscriber
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
      query:
        profile_id: d8533a10-bcce-4e33-8c9d-88b05ac56559
      headers:
        Authorization: Bearer cauldron-adapty-fixture-key-0000000000000
    expect:
      status: 200
      body:
        data.access_levels[0].access_level_id: premium
        data.access_levels[0].expires_at: null
        data.access_levels[0].renewal_cancelled_at: "2025-01-05T13:27:47.461425+00:00"
        data.access_levels[0].is_in_grace_period: false

  - name: access_levels and subscriptions are arrays addressed by index, not maps keyed by the identifier -- unlike RevenueCat's entitlements
    source: https://adapty.io/docs/api-specs/adapty-api.yaml
    fixture: subscriber
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
      query:
        profile_id: d8533a10-bcce-4e33-8c9d-88b05ac56559
      headers:
        Authorization: Bearer cauldron-adapty-fixture-key-0000000000000
    expect:
      status: 200
      body:
        data.access_levels[0].store_product_id: unlimited.9999
        data.subscriptions[0].store_product_id: unlimited.9999

  - name: custom_attributes is the one schema-less, customer-typed field on this API -- key and value, nothing else
    source: https://adapty.io/docs/api-specs/adapty-api.yaml
    fixture: subscriber
    request:
      method: GET
      path: /api/v2/server-side-api/profile/
      query:
        profile_id: d8533a10-bcce-4e33-8c9d-88b05ac56559
      headers:
        Authorization: Bearer cauldron-adapty-fixture-key-0000000000000
    expect:
      status: 200
      body:
        data.custom_attributes[0].key: favourite_sport
        data.custom_attributes[0].value: yoga
