# The Guardian Open Platform Recipe for Cauldron
#
# Asking for more changes what the response is made of.
#
#   /search?q=technology
#     {"response":{... "results":[{"id": "...", "webTitle": "...", ...}]}}
#
#   /search?q=technology&show-fields=headline,byline,wordcount
#     {"response":{... "results":[{"id": "...", "webTitle": "...",
#       "fields":{"headline":"...","byline":"...","wordcount":"571"}, ...}]}}
#
# show-fields does not filter the record that was already there -- it
# attaches a whole object the compact response never has at all. Every
# result on an unadorned search has a fixed, small set of keys and no
# "fields" property anywhere near it; ask for headline, byline and wordcount
# and every result grows a "fields" object carrying exactly those three keys
# and nothing else. Code written against the compact shape that later adds
# show-fields for one more value does not gain a key, it gains an object it
# has never seen before, one level in.
#
# And a value the parameter does not recognise is not refused, it is
# dropped: ?show-fields=nosuchfieldxyz answers 200 with no "fields" key at
# all, identically to the request that asked for nothing. A typo in a
# parameter name looks exactly like forgetting the parameter.
#
# **Every result is a string, even the number.** wordcount is served as
# "571" -- quoted -- beside webPublicationDate, isHosted and every other
# field in its ordinary type. A client that reads it as a number and adds
# two results together gets string concatenation, silently, in whichever
# language does that silently.
#
# **And the response is nested one level inside the word "response", status
# included.** Every answer -- search, sections, and every failure this
# Recipe can reach -- is `{"response": {...}}`, so `body.results` is
# undefined and the actual array is at `body.response.results`. Whether the
# call worked is not the HTTP status, or not only: it is
# `response.response.status`, "ok" or "error", one level below where a
# client's first line of error handling usually looks.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - A missing key and a wrong key are one failure here, not two. The real
#     API answers a missing api-key with {"message": "No API key found in
#     request"} and a present-but-wrong one with {"message": "Unauthorized"}
#     -- same 401, different sentence, and both without the "response"
#     envelope every other answer on this host carries. Cauldron's own
#     credential check is a single boolean with no memory of which of those
#     two happened, so this Recipe can serve exactly one of the two
#     sentences for every unauthorised request; it serves the one for a
#     missing key; "Unauthorized" is recorded here but not reachable.
#
#   - A content id cannot be routed at all. The real API mints identifiers
#     like "politics/2026/jul/18/burnham-plan-to-scrap-technology-department
#     -triggers-backlash" -- a section, a date split three ways and a slug,
#     joined by the same slash the URL path uses to separate segments, and
#     an interactive or a live blog inserts another segment before the date.
#     Cauldron's router requires every route to declare a fixed number of
#     path segments and reads a single identifier from exactly one of them;
#     it has no way to bind five or six segments of varying count into one
#     value. So GET /{id} is not modelled: every request shaped like one
#     falls through to the same unrecognised-route handling a genuinely
#     wrong path gets. That handling is set to the real API's wording for
#     "not found", which is accurate for an id that truly does not exist and
#     wrong for a real one, because a real one can never be served here
#     either. This Recipe answers /search and /sections only.
#
#   - show-fields is matched, not parsed. A request naming any of headline,
#     byline or wordcount is answered with all three, because Cauldron
#     matches a query parameter's presence rather than composing a response
#     from the exact set asked for -- the same stated gap Clover's expand
#     and Asana's opt_fields already carry here. ?show-fields=headline alone
#     would get only headline from the real API and gets all three from
#     this one.
#
#   - orderBy defaults to "newest" when q is omitted and "relevance" when it
#     is present, and startIndex reads 0 on a search with no results and 1
#     otherwise. Both were observed and neither is modelled: every case here
#     sends q, so only the "relevance" default is pinned.
#   - "Total" and "pages" are the numbers the live API returned for
#     q=technology on the date verified below, stamped as constants rather
#     than computed from what this Recipe actually seeds. The seeded
#     fixture holds three articles and two sample sections, not 157,828
#     results and not 81 sections.
#   - page=99999 pins the exact page number tested. The real endpoint
#     refuses any page past the last for the query, which moves as the
#     result set does; this Recipe answers the one value tested with the
#     one message tested, not a general rule about how far is too far.
#   - Full-text search is not modelled. Every /search case here fixes
#     q=technology; the fixture is not filtered by it.

recipe: guardian
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: guardian
  docs: https://open-platforms.theguardian.com/documentation/

auth:
  # The literal key "test" is what the Guardian publishes for developer
  # evaluation, and it is not a credential -- it works for anyone, without
  # signing up.
  scheme: query
  param: api-key
  keys:
    - test

responses:
  # Stamped on every successful answer, list or otherwise: the fact that it
  # worked lives one level inside the same object as the data.
  success:
    fields:
      response:
        status: ok
        userTier: developer
  list:
    style: wrapped
    # Dotted, so the collection sits two levels down rather than at the top.
    key: response.results
  # Every failure this Recipe can reach carries the same envelope as a
  # success: {"response": {"status": "error", "message": "..."}}. Neither a
  # code nor a type is ever sent, so both are suppressed here; the literal
  # "status": "error" is stamped as a constant on each content error below,
  # because it is never the HTTP status code and never varies.
  error:
    style: nested
    key: response
    code_field: "-"
    type_field: "-"

resources:
  content:
    id:
      # No prefix, no fixed length, and (see the header) no way to route a
      # fetch by it at all -- but the value still travels on every record,
      # exactly as observed, so it is declared as an ordinary field.
      style: opaque
      field: id
    fields:
      # article, interactive, liveblog and others; not modelled as an enum
      # because only these three were observed.
      type:
        type: string
      sectionId:
        type: string
      sectionName:
        type: string
      webPublicationDate:
        type: datetime
      webTitle:
        type: string
      webUrl:
        type: string
      apiUrl:
        type: string
      isHosted:
        type: boolean
      # Absent together on some sections (The Good Energy Guide, observed
      # directly) rather than null or blank -- there is no thematic pillar
      # for that content, and the keys are simply not there.
      pillarId:
        type: string
      pillarName:
        type: string
      # Only present when show-fields named something this Recipe models.
      # A map because the real endpoint can carry dozens of different keys
      # here depending on what was asked for; this Recipe seeds the three
      # tested.
      fields:
        type: map

  section:
    id:
      style: opaque
      field: id
    fields:
      webTitle:
        type: string
      webUrl:
        type: string
      apiUrl:
        type: string
      # Each entry repeats id, webTitle, webUrl and apiUrl beside a "code",
      # which was "default" on every section observed.
      editions:
        type: list

routes:
  # The expanded route: show-fields naming any of the three tested values
  # answers with the "fields" object attached. Declared first, and scored
  # above the compact fallback, the same way Clover's expand and Asana's
  # opt_fields both work here.
  - method: GET
    path: /search
    resource: content
    operation: list
    matches_query:
      show-fields: headline
    returns:
      - id
      - type
      - sectionId
      - sectionName
      - webPublicationDate
      - webTitle
      - webUrl
      - apiUrl
      - isHosted
      - pillarId
      - pillarName
      - fields
    fields:
      # The live totals for q=technology on the date verified below, stamped
      # rather than computed -- see the header's fidelity gap about what is
      # actually seeded.
      response.total: 157828
      response.startIndex: 1
      response.pageSize: 10
      response.currentPage: 1
      response.pages: 15783
      response.orderBy: relevance

  # An unrecognised section filters the collection down to nothing rather
  # than refusing the request. Declared before the compact fallback so a
  # request naming this exact section is answered from the empty fixture
  # rather than the populated one.
  - method: GET
    path: /search
    resource: content
    operation: list
    matches_query:
      section: nosuchsectionxyz
    fields:
      response.total: 0
      response.startIndex: 0
      response.pageSize: 10
      response.currentPage: 1
      response.pages: 0
      # The default ordering with no q at all, which is "newest" rather than
      # "relevance" -- observed on this exact request.
      response.orderBy: newest

  # page=0 and a page past the end are two different refusals with two
  # different sentences, both 400. Each pins the one value tested.
  - method: GET
    path: /search
    matches_query:
      page: "0"
    error: bad_page

  - method: GET
    path: /search
    matches_query:
      page: "99999"
    error: paging_too_far

  # The compact fallback: everything except "fields", which is what a
  # search that forgot show-fields gets.
  - method: GET
    path: /search
    resource: content
    operation: list
    returns:
      - id
      - type
      - sectionId
      - sectionName
      - webPublicationDate
      - webTitle
      - webUrl
      - apiUrl
      - isHosted
      - pillarId
      - pillarName
    fields:
      response.total: 157828
      response.startIndex: 1
      response.pageSize: 10
      response.currentPage: 1
      response.pages: 15783
      response.orderBy: relevance

  - method: GET
    path: /sections
    resource: section
    operation: list
    returns:
      - id
      - webTitle
      - webUrl
      - apiUrl
      - editions
    fields:
      # The real total is 81; this Recipe seeds three. See the header.
      response.total: 81

errors:
  # The runtime's own name for a path nothing here declares, which is also
  # every path shaped like a content id -- see the header's note on why a
  # single-item fetch cannot be routed at all. The real API answers both a
  # completely wrong path and a well-formed but nonexistent id with this
  # exact body, so lending it to both is faithful rather than a shortcut.
  unknown_route:
    status: 404
    message: "The requested resource could not be found."
    fields:
      # The literal word, not the HTTP status and not this error's own name.
      response.status: error

  bad_page:
    status: 400
    message: "page must be a positive integer"
    fields:
      response.status: error

  paging_too_far:
    status: 400
    message: "Content API does not support paging this far. Please change page or page-size or consider filtering using a date range."
    fields:
      response.status: error

  # Answered without the "response" envelope every other body on this host
  # carries -- a flat {"message": ...} and nothing else, not even the
  # literal "error" status the content failures above all send. See the
  # header for the sentence this Recipe cannot also serve.
  authentication_error:
    status: 401
    style: flat
    message: "No API key found in request"
    headers:
      WWW-Authenticate: Key

fixtures:
  empty: {}

  demo:
    content:
      - id: politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash
        type: article
        sectionId: politics
        sectionName: Politics
        webPublicationDate: "2026-07-18T13:42:43Z"
        webTitle: "UK tech advocates alarmed by Burnham plan to scrap technology department"
        webUrl: "https://www.theguardian.com/politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash"
        apiUrl: "https://content.guardianapis.com/politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash"
        isHosted: false
        pillarId: pillar/news
        pillarName: News
        # Seen only when show-fields asked for it -- the compact route above
        # trims this key away rather than the fixture omitting it.
        fields:
          headline: "UK tech advocates alarmed by Burnham plan to scrap technology department"
          byline: "Kiran Stacey Policy editor"
          # A number, quoted. See the header.
          wordcount: "571"
      # No pillarId or pillarName at all, observed directly: The Good Energy
      # Guide carries no thematic pillar.
      - id: the-good-energy-guide/2026/aug/07/how-businesses-are-cutting-energy-costs-with-solar-power
        type: article
        sectionId: the-good-energy-guide
        sectionName: The Good Energy Guide
        webPublicationDate: "2026-08-07T09:56:15Z"
        webTitle: "'Our operations are powered by solar': meet the companies tackling energy hikes with technology"
        webUrl: "https://www.theguardian.com/the-good-energy-guide/2026/aug/07/how-businesses-are-cutting-energy-costs-with-solar-power"
        apiUrl: "https://content.guardianapis.com/the-good-energy-guide/2026/aug/07/how-businesses-are-cutting-energy-costs-with-solar-power"
        isHosted: false
      # A six-segment id: section, then "ng-interactive", then the date and
      # the slug -- one more segment than the first record above, which is
      # the variation the header's routing gap is about.
      - id: technology/ng-interactive/2026/may/03/ai-facial-recognition-oversight-lagging-far-behind-technology-watchdogs-warn
        type: interactive
        sectionId: technology
        sectionName: Technology
        webPublicationDate: "2026-05-03T16:00:02Z"
        webTitle: "AI facial recognition oversight lagging far behind technology, watchdogs warn"
        webUrl: "https://www.theguardian.com/technology/ng-interactive/2026/may/03/ai-facial-recognition-oversight-lagging-far-behind-technology-watchdogs-warn"
        apiUrl: "https://content.guardianapis.com/technology/ng-interactive/2026/may/03/ai-facial-recognition-oversight-lagging-far-behind-technology-watchdogs-warn"
        isHosted: false
        pillarId: pillar/news
        pillarName: News

    section:
      - id: about
        webTitle: About
        webUrl: "https://www.theguardian.com/about"
        apiUrl: "https://content.guardianapis.com/about"
        editions:
          - id: about
            webTitle: About
            webUrl: "https://www.theguardian.com/about"
            apiUrl: "https://content.guardianapis.com/about"
            code: default
      - id: animals-farmed
        webTitle: Animals farmed
        webUrl: "https://www.theguardian.com/animals-farmed"
        apiUrl: "https://content.guardianapis.com/animals-farmed"
        editions:
          - id: animals-farmed
            webTitle: Animals farmed
            webUrl: "https://www.theguardian.com/animals-farmed"
            apiUrl: "https://content.guardianapis.com/animals-farmed"
            code: default
      - id: artanddesign
        webTitle: Art and design
        webUrl: "https://www.theguardian.com/artanddesign"
        apiUrl: "https://content.guardianapis.com/artanddesign"
        editions:
          - id: artanddesign
            webTitle: Art and design
            webUrl: "https://www.theguardian.com/artanddesign"
            apiUrl: "https://content.guardianapis.com/artanddesign"
            code: default

conformance:
  - name: the response is nested one level inside the word "response", status included
    source: "https://content.guardianapis.com/search?q=technology&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&api-key=test"
    expect:
      status: 200
      body:
        # Not top-level. A client reading body.results finds undefined.
        "response.status": ok
        "response.userTier": developer
        "response.total": 157828
        "response.results[0].id": politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash
        "response.results[0].sectionId": politics
        "response.results[0].webTitle": "UK tech advocates alarmed by Burnham plan to scrap technology department"

  - name: show-fields adds a whole object the compact response never has
    source: "https://content.guardianapis.com/search?q=technology&show-fields=headline,byline,wordcount&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&show-fields=headline,byline,wordcount&api-key=test"
    expect:
      status: 200
      body:
        "response.results[0].fields.headline": "UK tech advocates alarmed by Burnham plan to scrap technology department"
        "response.results[0].fields.byline": "Kiran Stacey Policy editor"
        # A number, quoted -- see the header.
        "response.results[0].fields.wordcount": "571"

  - name: and is silently absent when the request does not ask
    source: "https://content.guardianapis.com/search?q=technology&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&api-key=test"
    expect:
      status: 200
      body:
        "response.results[0].id": politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash
      absent:
        - "response.results[0].fields"

  - name: an unrecognised show-fields value is dropped rather than refused
    source: "https://content.guardianapis.com/search?q=technology&show-fields=nosuchfieldxyz&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&show-fields=nosuchfieldxyz&api-key=test"
    expect:
      # Two hundred. The typo is not reported anywhere in the response.
      status: 200
      body:
        "response.results[0].id": politics/2026/jul/18/burnham-plan-to-scrap-technology-department-triggers-backlash
      absent:
        - "response.results[0].fields"

  - name: a section with no pillar leaves both keys out entirely
    source: "https://content.guardianapis.com/search?q=technology&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&api-key=test"
    expect:
      status: 200
      body:
        "response.results[1].id": the-good-energy-guide/2026/aug/07/how-businesses-are-cutting-energy-costs-with-solar-power
        "response.results[1].sectionId": the-good-energy-guide
      absent:
        - "response.results[1].pillarId"
        - "response.results[1].pillarName"

  - name: sections share the same envelope, nested under results again
    source: "https://content.guardianapis.com/sections?api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/sections?api-key=test"
    expect:
      status: 200
      body:
        "response.status": ok
        "response.total": 81
        "response.results[0].id": about
        "response.results[0].editions[0].code": default
      absent:
        # Sections carries no paging metadata at all, unlike search.
        - "response.pageSize"

  - name: a missing key and a wrong key are one failure here, not two
    source: "https://content.guardianapis.com/search?q=technology"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      # No api-key at all.
      path: "/search?q=technology"
    expect:
      status: 401
      headers:
        WWW-Authenticate: Key
      body:
        # No "response" envelope here, unlike every other answer on this
        # host -- see the header.
        message: "No API key found in request"
      absent:
        - status
        - response

  - name: a path shaped like a real article 404s the same way a wrong one does
    source: "https://content.guardianapis.com/nosuchsection/2026/jan/01/nosuchtitle-xyz-abc?api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/nosuchsection/2026/jan/01/nosuchtitle-xyz-abc?api-key=test"
    expect:
      status: 404
      body:
        "response.status": error
        "response.message": "The requested resource could not be found."

  - name: and so does a path with no relation to the API at all
    source: "https://content.guardianapis.com/nosuchendpoint?api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/nosuchendpoint?api-key=test"
    expect:
      status: 404
      body:
        "response.status": error
        "response.message": "The requested resource could not be found."

  - name: page zero is refused with its own sentence
    source: "https://content.guardianapis.com/search?q=technology&page=0&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&page=0&api-key=test"
    expect:
      status: 400
      body:
        "response.status": error
        "response.message": "page must be a positive integer"

  - name: and a page past the end is refused with a different one
    source: "https://content.guardianapis.com/search?q=technology&page=99999&api-key=test"
    verified: "2026-08-31"
    fixture: demo
    request:
      method: GET
      path: "/search?q=technology&page=99999&api-key=test"
    expect:
      status: 400
      body:
        "response.status": error
        "response.message": "Content API does not support paging this far. Please change page or page-size or consider filtering using a date range."

  - name: an unrecognised section filters everything away without failing
    source: "https://content.guardianapis.com/search?section=nosuchsectionxyz&api-key=test"
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: "/search?section=nosuchsectionxyz&api-key=test"
    expect:
      status: 200
      body:
        "response.status": ok
        "response.total": 0
        "response.orderBy": newest
      absent:
        - "response.results[0]"
