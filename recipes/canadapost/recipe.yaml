# Canada Post Recipe for Cauldron
#
# No developer documentation for this API could be found, and that is a
# finding rather than an excuse. developers.usps.com and developer.ups.com
# both answer, both link a machine-readable description, and both are cited
# by URL elsewhere in this collection. The equivalent Canada Post paths do
# not: www.canadapost-postescanada.ca/information/app/drc/dev/default,
# /cpc/en/business/developers/apis/tracking.page and every other guessed
# developer-portal URL this Recipe tried answered a plain 404 from the
# marketing site, checked live. What is cited below instead is the live
# wire itself -- soa-gw.canadapost.ca, checked exhaustively, with no
# credential this Recipe was ever going to be given one anyway, since no
# sign-up was attempted (see the hard rule this task was given). Every
# quoted body in this file was produced by an actual request; nothing here
# is read from a page.
#
# The task's own premise -- "a versioned vendor content type, similar in
# shape to what the Worldpay Recipe records" -- does not survive contact
# with the wire. Checked live, repeatedly: GET /vis/track/pin/{pin}/summary
# answers Content-Type: text/xml on every request this Recipe sent it,
# including ones asking for Accept: application/json and Accept:
# application/vnd.cpc.track+json by name. The response is not
# content-negotiated at all -- what comes back is XML regardless of what was
# asked for, and Cauldron's format has no field to serve XML with, the same
# wall this collection's own backlog already names for Canada Post
# specifically ("Canada Post, PrestaShop and the older USPS generation are
# all waiting behind the same wall," raw.go's own comment). What Worldpay's
# Recipe in this collection actually demonstrates -- a version riding inside
# the media type -- is real on this host in exactly one dimension: the type
# is application/vnd.cpc.track+xml in the Accept header this Recipe sent and
# text/xml in every Content-Type that came back, so the vendor half of the
# name does not survive the round trip either. Basic authentication is real
# and confirmed: WWW-Authenticate: Basic realm=login, on every 401 this
# Recipe received.
#
# So this Recipe does not serve a 200. It could not have -- see above -- and
# it turns out not to need one to answer the task's own question, because
# every path to a 200 on this host runs through a wall this Recipe can map
# in full without ever getting past it.
#
# Missing and wrong collapse to one sentence, unconditionally. GET
# /vis/track/pin/1234567890123456/summary (sixteen digits, a shape this
# Recipe confirmed below is accepted rather than refused) answered the
# identical body -- 401,
#   <?xml version="1.0" encoding="UTF-8"?>
#   <messages xmlns="http://www.canadapost.ca/ws/messages"><message>
#   <code>E002</code><description>AAA Authentication Failure</description>
#   </message></messages>
# -- with no Authorization header at all and with a syntactically fine but
# wrong "Authorization: Basic <base64 of junkuser:junkpass>". DELETE on the
# identical path, also unauthenticated, answered the same body. Between
# those two verbs the two mistakes -- absent and wrong -- and the two
# credential-checked methods all fold into one sentence, the commoner
# arrangement this format's default already expects.
#
# GET and DELETE are not the only methods this path answers, and the other
# two never reach that sentence at all. POST and PUT on the identical path,
# unauthenticated, both answered 500 -- not 401, not 405 --
#   <messages><message><code>Server</code><description>Incomplete markup or
#   missing document element at offset 0 of
#   /vis/track/pin/1234567890123456/summary</description></message></messages>
# -- confirmed with an empty body on both verbs. This SOA gateway accepts a
# request body on POST and PUT and tries to parse it as XML before anything
# about a credential is ever asked, and an empty POST body fails that parse
# immediately. Four methods, one path, two entirely different failure
# mechanisms: GET and DELETE are refused for who is asking, POST and PUT are
# refused for what they sent, and the credential check never runs for the
# second pair at all. auth.go's own catalogue in this codebase already names
# five orderings this project has found and admits a boolean cannot hold all
# of them; this is a sixth, splitting on whether the method carries a body to
# parse rather than on the path, the verdict, or the route's own shape the
# way Northflank's does -- recorded here in prose, the way that file's own
# instruction asks for a split that does not fit. A route can now declare
# its own after_routing, so the per-method half of this split is no longer
# blocked by one setting governing every method at once -- but that is not
# why it stays in prose. This Recipe never obtained a credential the host
# would accept, so there is nothing for any auth object, Recipe-wide or
# route-scoped, to check: every route below turns its own credential check
# off and answers a fixed body instead, which already reproduces the
# per-method split exactly. What after_routing genuinely cannot reach, at
# any scope, is the pin-shape ordering: internal/runtime/sandbox.go checks a
# resource's id.pattern only after the credential, whichever Auth object
# decided that gate, because a pattern lives inside operation handling and a
# credential does not.
#
# A path this Recipe has no route for at all answers a third shape, and it
# does not care about the credential either. GET /vis/nosuchroute,
# unauthenticated, and the bare root GET /, unauthenticated, both answered
#   <messages><message><code>404</code><description>The requested URL
#   {path} was not found on this server.</description></message></messages>
# -- the same body a request WITH a syntactically fine but wrong Basic
# credential gets for the identical path, confirmed. Routing wins over the
# credential here exactly the way it does on UPS's Recipe elsewhere in this
# collection, and Cauldron's own unmatched-route fallback already produces
# this shape for any path this Recipe declares no route for, once the
# Recipe's own unknown_route entry below says what the body looks like.
#
# The sharpest thing on this host is not in any of those three shapes. It is
# what decides which of them a request even reaches, and it runs before all
# three. The pin itself is shape-checked first, unconditionally, whether or
# not a credential is present and whether the one present is right or wrong:
#
#   length   credential        status   body
#   3        none              400      cvc-simple-type validation error
#   3        wrong Basic       400      the identical validation error
#   10       none              400      the identical validation error
#   11       none              400      the identical validation error
#   12       none              401      AAA Authentication Failure
#   13       none              401      AAA Authentication Failure
#   14       none              400      the identical validation error
#   15       none              400      the identical validation error
#   16       none              401      AAA Authentication Failure
#   17       none              400      the identical validation error
#   18 ("1Z12345E0205271688")  400      the identical validation error
#   16 letters ("ABCDEFGHIJKLMNOP")     401      AAA Authentication Failure
#   12, non-alphanumeric ("!!!!!!!!!!!!")  400   the identical validation error
#
# checked systematically, live, across every length from 10 to 18 and
# several character classes at the three lengths that pass. Only 12, 13 and
# 16 characters -- alphanumeric, nothing else accepted -- ever reach the
# credential gate at all; the 400 for everything else is the XSD complaint
# an XML schema validator produces, word for word:
#   <messages><message><code>Server</code><description>
#   /vis/track/pin/{value}/summary: cvc-simple-type 1: element pin is not a
#   valid instance of type {http://www.canadapost.ca/ws/soap/track}pin.
#   Value is '{value}'</description></message></messages>
# naming the exact SOAP namespace of the schema doing the checking. Those
# three lengths are not arbitrary: Canada Post's domestic parcel PIN is
# twelve digits, its sixteen-digit domestic barcode is the newer format, and
# thirteen characters is the UPU S10 international shape (two letters, nine
# digits, a two-letter country code) -- three real tracking-number formats,
# and the schema accepts any string of the right length regardless of
# whether it is one of them.
#
# That ordering is real and this format's runtime cannot reproduce it as an
# ordering: internal/runtime/sandbox.go checks a resource's id.pattern only
# after a request has already cleared the credential check, whichever way
# auth.after_routing points, because a pattern lives inside operation
# handling and a credential does not. There is no route in this Recipe that
# answers 400 for shape and is gated by nothing -- the shape check that
# demonstrably runs before the credential on the real host cannot be made to
# run before Cauldron's, for a route this format lets vary by method and by
# matches_header but not by what a path *segment* looks like. What Cauldron
# can do instead, and what this Recipe uses, is address the one malformed
# value it actually sent live -- "123" -- as its own literal route rather
# than the wildcard one: a route naming a literal path segment outscores one
# naming {id} for the identical concrete request (internal/runtime/router.go
# scores a literal segment and a bare parameter differently, on purpose, so
# a more specific route always wins), and a literal route with no
# matches_header at all answers unconditionally, which reproduces "checked
# before the credential, for this one value" exactly rather than
# approximating it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 200 is served anywhere in this Recipe -- see above. The wire is
#     XML, this format is JSON, and no credential exists to have reached one
#     even if it were.
#   - The pin-shape table above is exhaustive over length and representative
#     over character class, not exhaustive over every possible value. Only
#     one malformed value ("123") and one well-formed one
#     ("1234567890123456") are wired as routes; the others in the table are
#     evidence in this header and not separately routed, the same
#     restraint Census's Recipe in this collection takes for the paths it
#     could not turn into a route without repeating itself.
#   - Whether a *credentialed* POST or PUT still bypasses the credential
#     check the way the unauthenticated ones do was never tested: every
#     probe against those two verbs in this Recipe was sent with no
#     Authorization header, to keep this Recipe's claims to exactly what was
#     observed.
#   - PATCH, HEAD, OPTIONS and every other HTTP method are unprobed on this
#     path.
#   - Whatever this API's other routes are -- creating a shipment, rating,
#     manifesting -- are unknown. This Recipe found precisely one real path
#     (/vis/track/pin/{pin}/summary) by trying the one URL the task named
#     and does not claim to have discovered a second.
#
# No credential was ever sent that could have been mistaken for a real one.
# The Basic value quoted throughout ("junkuser:junkpass", base64-encoded) is
# a fixture, not a secret, and belongs to no account.

recipe: canadapost
capability: shipping
version: 0.1.0

upstream:
  # No version segment anywhere in the path or in any response this Recipe
  # received -- unlike UPS's v1 or USPS's v3, this host never states one.
  api: unversioned
  # The nearest thing to documentation this Recipe could find working: the
  # public tracking page, not a developer portal. See the header for the
  # developer-facing URLs that were tried and answered 404.
  docs: https://www.canadapost-postescanada.ca/track-reperage/en

auth:
  # Genuinely Basic, and genuinely gated on GET and DELETE only -- see the
  # header for the ordering no auth object, Recipe-wide or route-scoped, can
  # express (shape-before-credential on the pin, which is fixed inside
  # operation handling regardless of scope). Every route below names its own
  # unconditional failure rather than relying on a credential check, the
  # same device Census's and Turso's Recipes in this collection use for
  # their own un-expressible orderings -- scheme: none turns that check off
  # Recipe-wide so each route's own answer is the only one that fires; no
  # credential this Recipe could send was ever accepted, so a route-scoped
  # scheme would have nothing real to check either.
  scheme: none

responses:
  error:
    # A provider whose failures are not JSON at all -- see the header. style
    # text writes the message verbatim, the same mechanism Census's Recipe
    # in this collection uses for its own plain-text failure, with the
    # Content-Type this format would otherwise default to overridden per
    # error below.
    style: text

routes:
  # The real, credential-gated path -- well-formed pin, wrong method
  # excluded (see below). GET and DELETE both answered the identical
  # AAA Authentication Failure body live, unconditionally: this route
  # names no matches_header at all, because no credential this Recipe could
  # construct was ever going to be accepted, and none needs to be to
  # reproduce what was actually observed.
  - method: GET
    path: /vis/track/pin/{id}/summary
    error: authentication_error

  - method: DELETE
    path: /vis/track/pin/{id}/summary
    error: authentication_error

  # The other two methods on the identical path never reach that check at
  # all -- see the header. Both answered a schema-parse failure,
  # unconditionally, with no credential sent.
  - method: POST
    path: /vis/track/pin/{id}/summary
    error: malformed_body

  - method: PUT
    path: /vis/track/pin/{id}/summary
    error: malformed_body

  # A literal path segment, not a wildcard one -- see the header for why
  # this is the mechanism that lets an id-shape failure be unconditional
  # the way the live one is. This route only ever matches the exact value
  # this Recipe sent live and outscores the wildcard GET route above for
  # that one request.
  - method: GET
    path: /vis/track/pin/123/summary
    error: id_malformed

errors:
  authentication_error:
    status: 401
    headers:
      Content-Type: text/xml
      WWW-Authenticate: Basic realm=login
    message: |
      <?xml version="1.0" encoding="UTF-8"?>

      <messages xmlns="http://www.canadapost.ca/ws/messages">
      <message>
      <code>E002</code>
      <description>AAA Authentication Failure</description></message></messages>

  # What POST and PUT answer instead of a credential failure -- see the
  # header. Pinned to the one path this Recipe actually sent this request
  # to; a different pin in the path would change the sentence and this
  # Recipe does not claim to know how.
  malformed_body:
    status: 500
    headers:
      Content-Type: text/xml
    message: |
      <?xml version="1.0" encoding="UTF-8"?>

      <messages xmlns="http://www.canadapost.ca/ws/messages">
      <message>
      <code>Server</code>
      <description>Incomplete markup or missing document element at offset 0 of /vis/track/pin/1234567890123456/summary</description></message></messages>

  # The XSD complaint for a pin of the wrong length or character class --
  # see the header for the full table this was read off. Pinned to the one
  # value ("123") this Recipe's literal route above answers for.
  id_malformed:
    status: 400
    headers:
      Content-Type: text/xml
    message: |
      <?xml version="1.0" encoding="UTF-8"?>

      <messages xmlns="http://www.canadapost.ca/ws/messages">
      <message>
      <code>Server</code>
      <description>/vis/track/pin/123/summary: cvc-simple-type 1: element pin is not a valid instance of type {http://www.canadapost.ca/ws/soap/track}pin. Value is '123'</description></message></messages>

  # What any path this Recipe has no route for answers -- confirmed at both
  # /vis/nosuchroute and the bare root /. {detail} is the request's own
  # path, substituted the same way Rootly's and Fireworks' Recipes in this
  # collection already use it for their own unmatched-route bodies.
  unknown_route:
    status: 404
    headers:
      Content-Type: text/xml
    message: |
      <?xml version="1.0" encoding="UTF-8"?>

      <messages xmlns="http://www.canadapost.ca/ws/messages">
      <message>
      <code>404</code>
      <description>The requested URL {detail} was not found on this server.</description></message></messages>

fixtures:
  empty: {}

conformance:
  - name: no credential is an authentication failure
    source: https://soa-gw.canadapost.ca/vis/track/pin/1234567890123456/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /vis/track/pin/1234567890123456/summary
    expect:
      status: 401
      headers:
        Content-Type: text/xml
        WWW-Authenticate: Basic realm=login
      body_matches: "AAA Authentication Failure"

  - name: a syntactically fine but wrong credential answers the byte-identical body
    source: https://soa-gw.canadapost.ca/vis/track/pin/1234567890123456/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /vis/track/pin/1234567890123456/summary
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 401
      body_matches: "AAA Authentication Failure"

  - name: DELETE on the same path answers the identical failure
    source: https://soa-gw.canadapost.ca/vis/track/pin/1234567890123456/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: DELETE
      path: /vis/track/pin/1234567890123456/summary
    expect:
      status: 401
      body_matches: "AAA Authentication Failure"

  - name: POST on the same path never reaches the credential check at all
    # No Authorization header sent, live, and the answer has nothing to do
    # with one -- see the header for why: this SOA gateway tries to parse a
    # request body on POST before it ever asks who is calling, and an empty
    # POST body fails that parse.
    source: https://soa-gw.canadapost.ca/vis/track/pin/1234567890123456/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /vis/track/pin/1234567890123456/summary
    expect:
      status: 500
      body_matches: "Incomplete markup or missing document element"

  - name: and neither does PUT
    source: https://soa-gw.canadapost.ca/vis/track/pin/1234567890123456/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PUT
      path: /vis/track/pin/1234567890123456/summary
    expect:
      status: 500
      body_matches: "Incomplete markup or missing document element"

  - name: a malformed pin is refused before any credential is looked at, with none sent
    # "123" -- three characters, none of the three lengths (12, 13, 16) this
    # host accepts. See the header's table.
    source: https://soa-gw.canadapost.ca/vis/track/pin/123/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /vis/track/pin/123/summary
    expect:
      status: 400
      headers:
        Content-Type: text/xml
      body_matches: "cvc-simple-type 1: element pin is not a valid instance"

  - name: and the identical shape failure even when a credential is presented and wrong
    # The sharpest single case in this Recipe: a syntactically fine Basic
    # credential is sitting on this exact request and it is never reached.
    # The pin's shape is checked first, unconditionally -- confirmed live,
    # not inferred from the case above.
    source: https://soa-gw.canadapost.ca/vis/track/pin/123/summary
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /vis/track/pin/123/summary
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 400
      body_matches: "cvc-simple-type 1: element pin is not a valid instance"

  - name: a path this Recipe has no route for answers a third shape, credential-blind
    source: https://soa-gw.canadapost.ca/vis/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /vis/nosuchroute
    expect:
      status: 404
      headers:
        Content-Type: text/xml
      body_matches: "The requested URL /vis/nosuchroute was not found on this server"
