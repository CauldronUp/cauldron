# TomTom Recipe for Cauldron
#
# See here/recipe.yaml for the header this group of three Recipes shares:
# HERE, TomTom and what3words all carry their credential in the query string
# rather than a header, and the question the group exists to answer is what
# "unauthenticated" means once that is true. Struck live, with no account and
# no key, against api.tomtom.com:
#
#   GET /search/2/geocode/berlin.json                                     -> 401 {"detailedError":{"code":"Unauthorized","message":"You are missing valid authentication credentials"}}
#   GET /search/2/geocode/berlin.json?key=junkkey12345                    -> 401, byte-identical
#   GET /search/2/geocode/berlin.json?key=0123456789abcdef0123456789abcdef -> 401, byte-identical
#
# **Missing and wrong collapse into one sentence here**, which is the
# opposite of HERE's Recipe in this group and the opposite of what the task
# hoped a query-string credential would reveal by default. A plausible
# 32-character hex string shaped exactly like a real TomTom key answers the
# identical 102-byte body a wholly absent one does -- confirmed by content
# length as well as text, three separate requests, one sentence. TomTom's own
# 401 does not distinguish "you sent nothing" from "you sent something that
# does not work" at all, which this Recipe reproduces the honest way:
# `auth.rejected_error` is left unset, so Cauldron's own credential check --
# which already knows the difference between absent and present-but-wrong --
# answers both with the one message this Recipe declares, because that is
# what the provider itself does.
#
# **A wrong path outranks the credential entirely, and it does not lie about
# its own shape the way the 401 does.** Struck live, no key required for any
# of these:
#
#   GET /search/2/totally-bogus-endpoint                                  -> 404 {"type":"about:blank","title":"Not found","detail":"The requested resource was not found","status":404}
#   GET /search/2/totally-bogus-endpoint?key=junkkey12345                 -> 404, byte-identical
#   PUT /search/2/geocode/berlin.json          (no key)                   -> 404, byte-identical shape
#
# That is genuinely RFC 7807 -- type, title, detail and a repeated numeric
# status, the shape the task guessed HERE would carry and HERE does not (see
# here/recipe.yaml: HERE's failures are a flat {error, error_description}
# pair on every status, 401 and 404 alike). TomTom is the one host in this
# group of three that actually earns the RFC 7807 guess, and only for this
# one failure: its own 401 is nested under "detailedError" instead, a
# different shape entirely, on the same host, from the same gateway, one
# status code apart. And the header claiming it is JSON is wrong on its own
# terms: every 404 this Recipe struck answered `content-type: text/plain`
# over a body that parses cleanly as JSON. A client trusting the header
# before calling a text-mode parser on this response gets exactly the
# wrong branch.
#
# **Which wrong method reaches the credential check and which does not is
# not uniform, and that is the finding this Recipe was written to pin.**
# Four methods struck against the same real path, no key sent for any of
# them:
#
#   POST   /search/2/geocode/berlin.json  -> 401 (the credential shape above)
#   PUT    /search/2/geocode/berlin.json  -> 404 (the routing-miss shape above)
#   DELETE /search/2/geocode/berlin.json  -> 404, byte-identical to PUT
#   OPTIONS /search/2/geocode/berlin.json -> 502 Bad Gateway, Envoy's own
#     "upstream connect error or disconnect/reset before headers... protocol
#     error" -- an infrastructure fault this Recipe read as exactly that
#     rather than a stable answer worth pinning, and did not repeat.
#
# POST reaches the same credential gate GET does; PUT and DELETE never do,
# landing on the identical routing-miss shape an unknown path gets, as though
# the gateway's own route table simply has no PUT or DELETE registered
# anywhere under this prefix while POST is a generically recognised verb.
# Nothing about this is specific to search: the Routing API, on the same
# host under a different prefix, answers the identical three-way split --
# see below. This is the same shape of trap HERE's own two products fall
# into for the opposite reason (there, one product's gateway accepts a verb
# the sibling product's does not; here, one verb is accepted everywhere on
# one host and two are accepted nowhere on it), and it means "send the wrong
# method and check for a 401 versus a 404" is not a question with one answer
# per provider -- it can depend on which wrong method was chosen, on a single
# host, for a single credential scheme.
#
# There is no real 405 anywhere on this host that was reachable without a
# key. This Recipe does not declare one: Cauldron's own router adds an Allow
# header and a 405 automatically the moment two routes share a path with
# different methods, which would misreport TomTom's real answer (404) for
# PUT and DELETE the moment a POST route was declared beside the GET one --
# so this Recipe declares GET only, leaves POST's 401 to the credential check
# that already runs before routing for every method, and states PUT's and
# DELETE's true 404 here rather than through a conformance case the emulator
# cannot pass honestly. See the fidelity gaps below.
#
# **The Routing API answers the credential question identically to Search,
# on the same host, which is the comparison this task asked this group of
# Recipes to make against Mezmo's two hosts and against HERE's two
# products.** Struck live:
#
#   GET /routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json           -> 401, byte-identical to Search's
#   GET /routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json?key=junk   -> 401, byte-identical
#   PUT /routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json           -> 404, byte-identical to Search's
#   POST /routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json          -> 401, byte-identical to Search's own POST answer
#   GET /routing/1/bogus-endpoint                                                    -> 404, byte-identical
#
# Where HERE's two products differ by one verb (see here/recipe.yaml) and
# Mezmo's two hosts run unrelated schemes end to end and resolve routing
# against auth in opposite orders, TomTom's two products agree on all of it:
# same message, same content-length, same which-verb-reaches-which-gate
# split. One credential scheme, one gateway, two product prefixes that
# cannot be told apart from their failures alone. The one conformance case
# below for the Routing API needs no route declared at all -- Cauldron's own
# credential check runs before routing is even attempted, for every path, so
# an unauthenticated request answers correctly whether or not this Recipe
# describes the path it was sent to.
#
# The one worked example this Recipe could find is a real one, quoted rather
# than guessed, from docs.tomtom.com's own Geocode reference page -- 2501
# Soquel Dr, Santa Cruz, CA. Its own two coordinates disagree with each
# other by one digit: `summary.geoBias.lon` reads -121.97483 and the result's
# own `position.lon` reads -121.97482, in the same published example, for
# what is offered as the same point. This Recipe does not resolve which one
# is right -- see rootly/recipe.yaml's own status-versus-status
# disagreement in FiveTran's docs for the same shape of question -- it just
# does not silently pick one and call it observed. summary itself (query,
# queryType, numResults, totalResults, fuzzyLevel, geoBias) is real and not
# modelled: every one of those is computed per request the way
# OpenRouteService's own bbox and metadata are (see
# openrouteservice/recipe.yaml), and list.fields exists for constants a
# provider repeats unchanged, not values that would be different on the very
# next call. lon, not lng -- see here/recipe.yaml, whose own documented pair
# spells the same thing the other way.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no key was ever requested, guessed or
#     used. The 401 and 404 cases below that need no credential to reach are
#     struck live and carry a verified date; the one 404 case that needs a
#     credential this live host never required carries none, for the reason
#     stated above; the one 200 case is TomTom's own documented example, not
#     observed, and carries none either.
#   - PUT's and DELETE's true 404 on a path this Recipe does declare GET for
#     is stated in the header and not reproduced as a conformance case: doing
#     so would need Cauldron's router not to add its own 405 the moment any
#     second method existed at this path, which is not a per-route
#     declaration this format has a hook for. See above.
#   - OPTIONS's 502 was read as an infrastructure fault of the moment this
#     Recipe happened to strike it, not a stable answer, and is not declared.
#   - summary (and the Routing API's own equivalent trip metadata) is not
#     modelled at all. See above.
#   - The Routing API's route geometry -- legs, points, sections, any
#     lat/lng this Recipe did not read directly out of TomTom's own
#     documented example -- is not modelled. No route this project could
#     reach without a key was ever computed, and inventing turn-by-turn
#     coordinates for a route nobody asked TomTom to calculate is exactly
#     the fabrication this task was told not to commit.
#   - Of the documented result fields on a Search geocode hit, this Recipe
#     declares the ones the one worked example actually shows: type, id,
#     score, matchConfidence.score, dist, and address's streetNumber,
#     streetName, municipality, countrySubdivision, postalCode, countryCode,
#     country and freeformAddress. Points of interest, category ids, opening
#     hours and every other result type's own extension fields are absent.
#   - No fetchable OpenAPI or Swagger document was found at a stable URL for
#     either product. upstream.spec is not recorded for that reason.
#
# The key below is a fixture and belongs to no account.

recipe: tomtom
capability: infrastructure
version: 0.1.0

upstream:
  api: "2"
  docs: https://docs.tomtom.com/geocoding-api/documentation/geocode

auth:
  # In the query string -- see the header and here/recipe.yaml. Missing and
  # wrong collapse into one sentence on this host, so rejected_error and
  # absent_error are both left unset: Cauldron's own check already knows the
  # difference and this Recipe deliberately does not use it, because TomTom
  # itself does not.
  scheme: query
  param: key
  keys:
    - cauldron_tomtom_fixture_key_0000000000000000

responses:
  list:
    # No key here: geocode_result's own collection: results below already
    # names it, and this format reads that instead.
    style: wrapped
  resource:
    style: wrapped
  error:
    # {"detailedError": {"code": "...", "message": "..."}} -- nested, and
    # only for the credential failure. The routing-miss shape below overrides
    # this per-entry, because it is not this shape at all -- see the header.
    style: nested
    key: detailedError

resources:
  geocode_result:
    collection: results
    id:
      # "US/PAD/p0/45619296" -- four slash-separated segments, the last one
      # numeric, documented nowhere as a format. Opaque is the honest choice,
      # the same one Rootly's and HERE's Recipes in this collection make for
      # an id with no declared shape.
      style: opaque
    fields:
      type:
        type: string
      score:
        type: number
      matchConfidence_score:
        type: number
        in: matchConfidence
        as: score
      dist:
        type: number
        null_when_unset: true
      address_street_number:
        type: string
        in: address
        as: streetNumber
        null_when_unset: true
      address_street_name:
        type: string
        in: address
        as: streetName
      address_municipality:
        type: string
        in: address
        as: municipality
      address_country_subdivision:
        type: string
        in: address
        as: countrySubdivision
        null_when_unset: true
      address_postal_code:
        type: string
        in: address
        as: postalCode
        null_when_unset: true
      address_country_code:
        type: string
        in: address
        as: countryCode
      address_country:
        type: string
        in: address
        as: country
      address_freeform:
        type: string
        in: address
        as: freeformAddress
      # lat/lon, not lat/lng -- see here/recipe.yaml.
      position_lat:
        type: number
        in: position
        as: lat
      position_lon:
        type: number
        in: position
        as: lon

routes:
  # POST is deliberately not declared. See the header: POST reaches the
  # credential check that already runs before routing for every method, and
  # declaring it as a route here would make Cauldron's own router add a real
  # 405 for PUT and DELETE that the live host never sends.
  - method: GET
    path: /search/2/geocode/{query}.json
    resource: geocode_result
    operation: list

errors:
  # {"detailedError": {"code": "Unauthorized", "message": "..."}}. One
  # sentence for every credential failure this host has -- see the header.
  authentication_error:
    status: 401
    message: You are missing valid authentication credentials
    code: Unauthorized

  # Overrides Cauldron's built-in name with TomTom's own genuinely
  # RFC 7807-shaped body. Its Content-Type header is real and is a lie about
  # its own body -- see the header.
  unknown_route:
    status: 404
    style: flat
    message_field: detail
    code_field: "-"
    message: The requested resource was not found
    headers:
      Content-Type: text/plain
    fields:
      type: about:blank
      title: Not found
      # A literal, not a computed status_field: this entry only ever answers
      # 404, so there is no drift risk in stating it directly.
      status: 404

fixtures:
  empty: {}

  # TomTom's own documented worked example -- docs.tomtom.com's Geocode
  # reference page, quoted rather than guessed. Not observed: no request
  # this project could make without a key ever produced it.
  soquel-drive:
    geocode_result:
      - id: "US/PAD/p0/45619296"
        type: Point Address
        score: 15.725
        matchConfidence_score: 1
        dist: 0.8875712594288668
        address_street_number: "2501"
        address_street_name: Soquel Dr
        address_municipality: "Santa Cruz, Live Oak"
        address_country_subdivision: CA
        address_postal_code: "95065"
        address_country_code: US
        address_country: United States Of America
        address_freeform: "2501 Soquel Dr, Santa Cruz, CA 95065"
        position_lat: 36.98844
        position_lon: -121.97482

conformance:
  - name: no credential at all and a well-formed-looking wrong one answer the identical body
    source: https://api.tomtom.com/search/2/geocode/berlin.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /search/2/geocode/berlin.json
    expect:
      status: 401
      headers:
        content-type: application/json
      body:
        detailedError.code: Unauthorized
        detailedError.message: You are missing valid authentication credentials

  - name: a 32-character hex string shaped exactly like a real key answers the same body
    source: https://api.tomtom.com/search/2/geocode/berlin.json?key=0123456789abcdef0123456789abcdef
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /search/2/geocode/berlin.json?key=0123456789abcdef0123456789abcdef
    expect:
      status: 401
      body:
        detailedError.code: Unauthorized
        detailedError.message: You are missing valid authentication credentials

  - name: POST reaches the same credential gate GET does, with no route declared for it
    source: https://api.tomtom.com/search/2/geocode/berlin.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /search/2/geocode/berlin.json
    expect:
      status: 401
      body:
        detailedError.code: Unauthorized
        detailedError.message: You are missing valid authentication credentials

  - name: the Routing API answers the identical credential shape, with no route declared for it either
    source: https://api.tomtom.com/routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /routing/1/calculateRoute/52.50931,13.42936:52.50274,13.43872/json
    expect:
      status: 401
      body:
        detailedError.code: Unauthorized
        detailedError.message: You are missing valid authentication credentials

  - name: an unrouted path outranks the credential, and its Content-Type lies about its own body
    # Struck live with no key: the identical body. Reaching it through
    # Cauldron needs a credential this Recipe accepts, because this runtime's
    # own check is unconditional -- see the header and here/recipe.yaml's
    # identical trade-off.
    source: https://api.tomtom.com/search/2/totally-bogus-endpoint
    fixture: empty
    request:
      method: GET
      path: /search/2/totally-bogus-endpoint?key=cauldron_tomtom_fixture_key_0000000000000000
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body:
        type: about:blank
        title: Not found
        detail: The requested resource was not found
        status: 404

  - name: a real result carries type, score and matchConfidence beside the address
    source: https://docs.tomtom.com/geocoding-api/documentation/geocode
    fixture: soquel-drive
    request:
      method: GET
      path: "/search/2/geocode/2501%20soquel%20dr%20santa%20cruz%20ca%2095065.json?key=cauldron_tomtom_fixture_key_0000000000000000"
    expect:
      status: 200
      body:
        "results[0].type": Point Address
        "results[0].score": 15.725
        "results[0].matchConfidence.score": 1
        "results[0].address.freeformAddress": "2501 Soquel Dr, Santa Cruz, CA 95065"
        "results[0].position.lat": 36.98844
        "results[0].position.lon": -121.97482
      absent:
        - summary
        - "results[0].position.lng"
