# Gumlet Recipe for Cauldron
#
# The video asset listing, read from the OpenAPI document Gumlet publishes at
# docs.gumlet.com/reference/openapi.json, and struck live against
# api.gumlet.com on 2026-09-13 with no header, with a wrong bearer, with a Basic
# header, on a path that does not exist, and with a method the path does not
# take.
#
# **"Invalid API Bearer token" is what you are told for sending none.** Struck
# live, with no `Authorization` header at all:
#
#   {"error":{"code":"invalid_authorization_header","message":"Invalid API
#     Bearer token. Authorization header must be of format 'Bearer
#     YOUR_API_KEY'"}}
#
# A token is called invalid when there was no token. A wrong one gets a
# different code -- `invalid_api_key`, "API key supplied with request is
# invalid" -- so the API distinguishes them and the sentence for the first does
# not.
#
# **And that is the answer to everything.** An unrouted path, a method the route
# does not take, and a Basic header all receive the same 401, because the
# credential is checked before the path is. There is no way to find out whether
# a path exists.
#
# **The published example response is somebody's real workspace.** The 200
# example for this operation carries `total_asset_count: 2159` and a
# `distinct_tags` array of that account's whole tag vocabulary -- `"aasas"`,
# `"asasaasas"`, `"asasas"`, `"asasasasa"`, `"asasass"`, `"asasdfdfdd"`,
# `"asqs"`, `"dsddsd"`, `"rewew"`, `"sdsdsdsd"`, alongside working labels and
# two personal names. Keyboard mash from a live testing session, shipped as the
# worked example in the public reference.
#
# **And `distinct_tags` is on the listing, not the record.** Every tag in the
# workspace arrives with every page of assets, so paging through two thousand
# assets fetches the same tag vocabulary each time.
#
# **The example's status is not one the filter can ask for.** The `status` query
# parameter is enumerated `queued`, `processing`, `ready`, `errored`, `deleted`.
# The asset in the document's own example has `"status": "optimizing"` -- a
# sixth value, which arrives in responses and cannot be filtered on.
#
# **One path parameter, two spellings.** `/video/assets/{asset_id}` is a GET and
# a DELETE; `/video/assets/{asset_ID}/thumbnail`,
# `/video/assets/{asset_ID}/subtitle/upload` and
# `/video/assets/{asset_ID}/audio/upload` are POSTs. The same identifier, cased
# two ways, in one document, so a generated client has two variable names for
# it.
#
# **There is a path in the document that does nothing.**
# `/video/assets/{asset_ID}/audio/upload-1` declares no operations at all: an
# empty path item with a de-duplication suffix in its name, published as part of
# the API.
#
# **A record carries a URL back to itself.** `output.status_url` is
# `https://api.gumlet.com/v1/video/assets/6192269e0822a81d955d1a4b` -- the
# address of the thing you are already holding.
#
# Also pinned: the security scheme is named `API_KEY` and declared
# `{"type": "http", "scheme": "bearer"}`; `info.version` is `1.4` while the
# server URL says `/v1`; the listing's own description begins `[Deprecated]`;
# and `current_offset` is `1` on the first page, which is not what an offset is.

recipe: gumlet
capability: media
version: 0.1.0

upstream:
  api: "1.4"
  docs: https://docs.gumlet.com/reference
  spec: https://docs.gumlet.com/reference/openapi.json
  spec_hash: cea7c4b4118beec673c446d85fc2628063d0dfcaa86b5fecd102fb7dcb417c1c
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y000000000000000000
  # A token called invalid when no token was sent.
  absent_error: invalid_authorization_header
  malformed_error: invalid_authorization_header
  rejected_error: invalid_api_key
  # And checked before the path is, so nothing else is ever reached.

responses:
  list:
    style: wrapped
    key: all_assets
    count_field: total_asset_count
    page_field: current_offset
    fields:
      # Every tag in the workspace, on every page of assets.
      distinct_tags:
        - ""
        - tag-1
        - test
        - hlstest
        - filtertest
  error:
    style: nested
    key: error
    message_field: message
    code_field: code

resources:
  asset:
    id:
      field: asset_id
      style: hex
      length: 24
    fields:
      # A sixth value the status filter cannot ask for.
      status:
        type: string
      progress:
        type: integer
      # Epoch milliseconds.
      created_at:
        type: timestamp_ms
      tag:
        type: string
      source_id:
        type: string
      input:
        type: map
      output:
        type: map

routes:
  - method: GET
    path: /v1/video/assets/list/{workspace_id}
    resource: asset
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: limit
      cursor_param: offset

errors:
  invalid_authorization_header:
    status: 401
    code: invalid_authorization_header
    # Said to a request that carried no token at all.
    message: "Invalid API Bearer token. Authorization header must be of format 'Bearer YOUR_API_KEY'"

  invalid_api_key:
    status: 401
    code: invalid_api_key
    message: API key supplied with request is invalid

fixtures:
  empty:
    asset: []

  workspace:
    asset:
      - asset_id: 6192269e0822a81d955d1a4b
        # The document's own example value, and not in the filter's enum.
        status: optimizing
        progress: 0
        created_at: 1636968094594
        tag: ""
        source_id: 5f462c1561cf8a766464ffc4
        input:
          source_url: https://gumlet.sgp1.digitaloceanspaces.com/video/BigBuckBunny.mp4
          size: 158008374
          duration: 596.473333
          aspect_ratio: "16:9"
          fps: 24
          width: 1280
          height: 720
          transformations:
            resolution: 240p,360p
            format: hls
            mp4_access: false
            audio_only: false
            keep_original: true
            per_title_encoding: true
        output:
          format: hls
          # The address of the record you are already holding.
          status_url: https://api.gumlet.com/v1/video/assets/6192269e0822a81d955d1a4b
          playback_url: https://video.gumlet.io/5f462c1561cf8a766464ffc4/6192269e0822a81d955d1a4b/1.m3u8
          thumbnail_url:
            - https://video.gumlet.io/5f462c1561cf8a766464ffc4/6192269e0822a81d955d1a4b/thumbnail-1-0.png
      - asset_id: 71a3c4d5e6f708192a3b4c5d
        # One of the five the filter does know.
        status: ready
        progress: 100
        created_at: 1741968094594
        tag: hlstest
        source_id: 5f462c1561cf8a766464ffc4
        input:
          source_url: https://gumlet.sgp1.digitaloceanspaces.com/video/Sintel.mp4
          size: 42117338
          duration: 120.5
          aspect_ratio: "16:9"
          fps: 30
          width: 1920
          height: 1080
          transformations:
            resolution: 360p,720p
            format: hls
            mp4_access: true
            audio_only: false
            keep_original: false
            per_title_encoding: false
        output:
          format: hls
          status_url: https://api.gumlet.com/v1/video/assets/71a3c4d5e6f708192a3b4c5d
          playback_url: https://video.gumlet.io/5f462c1561cf8a766464ffc4/71a3c4d5e6f708192a3b4c5d/1.m3u8
          thumbnail_url:
            - https://video.gumlet.io/5f462c1561cf8a766464ffc4/71a3c4d5e6f708192a3b4c5d/thumbnail-1-0.png

conformance:
  - name: a token that was never sent is called invalid
    source: https://api.gumlet.com/v1/video/assets/list/abc123
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/abc123
      headers: {}
    expect:
      status: 401
      body:
        # No Authorization header at all, and this is the sentence.
        error.message: "Invalid API Bearer token. Authorization header must be of format 'Bearer YOUR_API_KEY'"
        error.code: invalid_authorization_header

  - name: a wrong token gets the code the missing one deserved
    source: https://api.gumlet.com/v1/video/assets/list/abc123
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/abc123
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # The API does distinguish them; the sentence above does not.
        error.code: invalid_api_key
        error.message: API key supplied with request is invalid

  - name: a Basic header is the same answer as no header
    source: https://api.gumlet.com/v1/video/assets/list/abc123
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/abc123
      headers:
        Authorization: "Basic Zm9vOmJhcg=="
    expect:
      status: 401
      body:
        error.code: invalid_authorization_header

  - name: a path that does not exist is answered by the credential check
    source: https://api.gumlet.com/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        # There is no way to discover whether a path exists.
        error.code: invalid_authorization_header
        error.message: "Invalid API Bearer token. Authorization header must be of format 'Bearer YOUR_API_KEY'"

  - name: a method the route does not take gets it too
    source: https://api.gumlet.com/v1/video/assets/list/abc123
    verified: "2026-09-13"
    fixture: workspace
    request:
      method: PUT
      path: /v1/video/assets/list/abc123
      headers: {}
    expect:
      status: 401
      body:
        error.code: invalid_authorization_header

  - name: a status arrives that the filter cannot ask for
    source: https://docs.gumlet.com/reference/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/5f462c1561cf8a766464ffc4
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # The status parameter enumerates queued, processing, ready, errored
        # and deleted. This is the value in the document's own example.
        'all_assets[0].status': optimizing
        'all_assets[1].status': ready
        'all_assets[0].progress': 0
        'all_assets[1].progress': 100

  - name: every tag in the workspace arrives with every page of assets
    source: https://docs.gumlet.com/reference/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/5f462c1561cf8a766464ffc4
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
      query:
        limit: "1"
        offset: "2"
    expect:
      status: 200
      body:
        # The vocabulary of the whole workspace, on a page of one asset, on
        # the second page of it.
        'distinct_tags[0]': ""
        'distinct_tags[1]': tag-1
        'distinct_tags[4]': filtertest
        # And the count of the whole workspace beside it.
        total_asset_count: 2
        current_offset: 2
        'all_assets[0].asset_id': 71a3c4d5e6f708192a3b4c5d

  - name: a record carries the address of itself
    source: https://docs.gumlet.com/reference/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/5f462c1561cf8a766464ffc4
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        # The thing you are holding, as a URL, on the thing you are holding.
        'all_assets[0].output.status_url': https://api.gumlet.com/v1/video/assets/6192269e0822a81d955d1a4b
        'all_assets[0].asset_id': 6192269e0822a81d955d1a4b
        'all_assets[0].output.playback_url': https://video.gumlet.io/5f462c1561cf8a766464ffc4/6192269e0822a81d955d1a4b/1.m3u8
        'all_assets[0].output.thumbnail_url[0]': https://video.gumlet.io/5f462c1561cf8a766464ffc4/6192269e0822a81d955d1a4b/thumbnail-1-0.png
        'all_assets[0].output.format': hls

  - name: the source and its transformations travel on the asset
    source: https://docs.gumlet.com/reference/openapi.json
    fixture: workspace
    request:
      method: GET
      path: /v1/video/assets/list/5f462c1561cf8a766464ffc4
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        'all_assets[0].created_at': 1636968094594
        'all_assets[0].source_id': 5f462c1561cf8a766464ffc4
        'all_assets[0].tag': ""
        'all_assets[1].tag': hlstest
        'all_assets[0].input.size': 158008374
        'all_assets[0].input.duration': 596.473333
        'all_assets[0].input.aspect_ratio': "16:9"
        'all_assets[0].input.fps': 24
        'all_assets[0].input.width': 1280
        'all_assets[0].input.height': 720
        'all_assets[0].input.source_url': https://gumlet.sgp1.digitaloceanspaces.com/video/BigBuckBunny.mp4
        'all_assets[0].input.transformations.resolution': 240p,360p
        'all_assets[0].input.transformations.per_title_encoding': true
        'all_assets[1].input.transformations.mp4_access': true

  - name: a workspace with no assets still ships the tag vocabulary
    source: https://docs.gumlet.com/reference/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/video/assets/list/5f462c1561cf8a766464ffc4
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y000000000000000000"
    expect:
      status: 200
      body:
        all_assets: []
        total_asset_count: 0
        'distinct_tags[1]': tag-1
