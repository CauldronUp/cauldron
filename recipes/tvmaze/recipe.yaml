# TVmaze Recipe for Cauldron
#
# The failure puts the reason in "name" and leaves "message" empty.
#
#   GET /shows/99999999
#   ->  404  {"name": "Not Found", "message": "", "code": 0, "status": 404}
#
# Four fields, and the one a client would read is blank. "name" carries the
# reason phrase -- and on every successful response "name" is the title of the
# show, so the same key holds "Under the Dome" on a 200 and "Not Found" on a 404.
# "code" is 0, which is neither an HTTP status nor an error code, and "status"
# is the HTTP status restated inside the body.
#
# **And "where does it air" is two mutually exclusive fields.** Every show
# carries network and webChannel, and exactly one of them is an object:
#
#   Under the Dome  network: {..., "name": "CBS"}      webChannel: null
#   Loki            network: null                      webChannel: {..., "Disney+"}
#
# So reading show.network.name throws on half the catalogue, and the check has
# to be written both ways round. Inside them the shapes disagree too: the
# network carries a country object and the web channel carries country: null.
#
# Written against the live API rather than a document: every case below was
# checked against api.tvmaze.com on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. runtime and averageRuntime are two fields and one of them is null. Loki
#      has runtime null and averageRuntime 50; Under the Dome has 60 in both.
#      Nothing says which to prefer.
#   2. schedule.time is the empty string on a show with a broadcast day. Not
#      null, not absent: "", beside days: ["Friday"].
#   3. externals holds three identifiers in three types: tvrage is null on one
#      show and a number on another, thetvdb is a number, and imdb is the
#      string "tt9140554". Parsing them the same way is impossible.
#   4. summary is HTML in a JSON string -- "<p><b>Under the Dome</b> is the
#      story of..." -- with no plain-text companion field.
#   5. updated is epoch seconds, ten digits, where rating is an object holding
#      one number and weight is a bare integer from 0 to 100 with no unit.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The catalogue is served rather than searched. /search/shows?q= answers an
#     array of {score, show} wrappers with a relevance float, and this Recipe
#     answers with the shows its fixture holds.
#   - image and _links are served for the shows in the fixture. The episode,
#     season, cast and crew endpoints are not modelled, and _links.previousepisode
#     points at one of them.
#   - updated moves whenever a record is edited and is served as recorded.
#
# The shows below are public and were recorded on the date in the cases.

recipe: tvmaze
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://www.tvmaze.com/api

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    # The reason phrase, under the key that holds a show's title on a 200.
    message_field: name
    code_field: code
    code_type: number
    status_field: status
    fields:
      # Blank, on every failure.
      message: ""

resources:
  show:
    id:
      style: numeric
      field: id
      type: number
    fields:
      url:
        type: string
      # A title here, and a reason phrase on a failure.
      name:
        type: string
      type:
        type: string
      language:
        type: string
      genres:
        type: list
      status:
        type: string
      # Null on a show whose episodes vary.
      runtime:
        type: integer
      averageRuntime:
        type: integer
      premiered:
        type: string
      ended:
        type: string
      # time is the empty string on a show that has a broadcast day.
      schedule:
        type: map
      rating:
        type: map
      weight:
        type: integer
      # Exactly one of these two is an object.
      network:
        type: map
      webChannel:
        type: map
      dvdCountry:
        type: map
      # Three identifiers, three types.
      externals:
        type: map
      image:
        type: map
      # HTML in a JSON string.
      summary:
        type: string
      # Epoch seconds.
      updated:
        type: integer
      _links:
        type: map

routes:
  - method: GET
    path: /shows/{id}
    resource: show
    operation: get
    not_found: not_found

errors:
  not_found:
    status: 404
    headers:
      Content-Type: application/json; charset=UTF-8
    # Neither an HTTP status nor an error code.
    code: "0"
    message: Not Found

fixtures:
  empty: {}

  catalogue:
    show:
      - id: "1"
        url: https://www.tvmaze.com/shows/1/under-the-dome
        name: Under the Dome
        type: Scripted
        language: English
        genres:
          - Drama
          - Science-Fiction
          - Thriller
        status: Ended
        # Both present, and equal, on this one.
        runtime: 60
        averageRuntime: 60
        premiered: "2013-06-24"
        ended: "2015-09-10"
        schedule:
          time: "22:00"
          days:
            - Thursday
        rating:
          average: 6.6
        weight: 99
        # An object here, and null on the show below.
        network:
          id: 2
          name: CBS
          # An object, where the web channel below has null.
          country:
            name: United States
            code: US
            timezone: America/New_York
          officialSite: https://www.cbs.com/
        webChannel: null
        dvdCountry: null
        externals:
          # A number, a number and a string.
          tvrage: 25988
          thetvdb: 264492
          imdb: tt1553656
        image:
          medium: https://static.tvmaze.com/uploads/images/medium_portrait/610/1525272.jpg
        summary: "<p><b>Under the Dome</b> is the story of a small town that is suddenly and inexplicably sealed off from the rest of the world by an enormous transparent dome. The town's inhabitants must deal with surviving the post-apocalyptic conditions while searching for answers about the dome, where it came from and if and when it will go away.</p>"
        # Ten digits.
        updated: 1769177765
        _links:
          self:
            href: https://api.tvmaze.com/shows/1
          previousepisode:
            href: https://api.tvmaze.com/episodes/185054
            name: The Enemy Within

      # The other way round: no network, a web channel, and a null runtime.
      - id: "41007"
        url: https://www.tvmaze.com/shows/41007/loki
        name: Loki
        type: Scripted
        language: English
        genres:
          - Action
          - Adventure
          - Science-Fiction
        status: Ended
        # Null, with a figure in the field beside it.
        runtime: null
        averageRuntime: 50
        premiered: "2021-06-09"
        ended: "2023-11-09"
        schedule:
          # The empty string, on a show with a broadcast day.
          time: ""
          days:
            - Friday
        rating:
          average: 8.1
        weight: 99
        network: null
        webChannel:
          id: 287
          name: Disney+
          # Null, where the network above has an object.
          country: null
          officialSite: https://www.disneyplus.com/
        dvdCountry: null
        externals:
          # Null, a number and a string, in one object.
          tvrage: null
          thetvdb: 362472
          imdb: tt9140554
        image:
          medium: https://static.tvmaze.com/uploads/images/medium_portrait/478/1195717.jpg
        updated: 1782546389
        _links:
          self:
            href: https://api.tvmaze.com/shows/41007
          previousepisode:
            href: https://api.tvmaze.com/episodes/2648016
            name: Glorious Purpose

conformance:
  - name: the failure puts the reason in name and leaves message empty
    source: https://api.tvmaze.com/shows/99999999
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/99999999
    expect:
      # Four fields, and the one a client would read is blank. name carries
      # the reason phrase, and on a 200 the same key is the show's title.
      status: 404
      header_matches:
        # Upper-case UTF-8, where most of this collection lower-cases it.
        Content-Type: '^application/json; charset=UTF-8$'
      body:
        name: Not Found
        message: ""
        code: 0
        status: 404

  - name: and on a success the same key is the title
    source: https://api.tvmaze.com/shows/1
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/1
    expect:
      status: 200
      body:
        # A number, where several providers here send an identifier as a
        # string.
        id: 1
        name: Under the Dome
        type: Scripted
        status: Ended
        "genres[0]": Drama
        "genres[2]": Thriller
        premiered: "2013-06-24"
        ended: "2015-09-10"
        # Both present, and equal, where the streaming show has a null.
        runtime: 60
        averageRuntime: 60
        "schedule.time": "22:00"
        "externals.tvrage": 25988

  - name: where it airs is two mutually exclusive fields
    source: https://api.tvmaze.com/shows/1
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/1
    expect:
      status: 200
      body:
        # An object and a null, so show.network.name throws on half the
        # catalogue and the check has to be written both ways round.
        "network.name": CBS
        "network.country.code": US
        webChannel: null

  - name: and the other way round on a streaming show
    source: https://api.tvmaze.com/shows/41007
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/41007
    expect:
      status: 200
      body:
        # And inside them the shapes disagree: the network carries a country
        # object, the web channel carries country: null.
        network: null
        "webChannel.name": Disney+
        "webChannel.country": null

  - name: runtime and averageRuntime are two fields and one is null
    source: https://api.tvmaze.com/shows/41007
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/41007
    expect:
      status: 200
      body:
        # Nothing says which to prefer, and the show above has 60 in both.
        runtime: null
        averageRuntime: 50

  - name: the schedule time is the empty string on a show with a day
    source: https://api.tvmaze.com/shows/41007
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/41007
    expect:
      status: 200
      body:
        # Not null, not absent: "", beside a day that is there.
        "schedule.time": ""
        "schedule.days[0]": Friday

  - name: the external identifiers are three types in one object
    source: https://api.tvmaze.com/shows/41007
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/41007
    expect:
      status: 200
      body:
        # Null on this show and a number on the other, a number, and a string.
        "externals.tvrage": null
        "externals.thetvdb": 362472
        "externals.imdb": tt9140554

  - name: the summary is HTML and the update time is seconds
    source: https://api.tvmaze.com/shows/1
    verified: "2026-08-28"
    fixture: catalogue
    request:
      method: GET
      path: /shows/1
    expect:
      status: 200
      body:
        # Ten digits, and a rating object holding one number.
        updated: 1769177765
        "rating.average": 6.6
        weight: 99
      matches:
        # No plain-text companion field, and the markup runs to the end.
        summary: '^<p><b>Under the Dome</b> is the story of a small town that is suddenly and inexplicably sealed off.*go away\.</p>$'
