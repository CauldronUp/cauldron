# Liveblocks Recipe for Cauldron
#
# The room listing, read from the REST API reference at liveblocks.io/docs, and
# struck live on 2026-09-14 with no key, with a wrong secret key, with a public
# key where the secret one belongs, on a path that does not exist, with a
# method the path does not take, on the previous version and on the root.
#
# **Inside /v2, a failure carries four fields and two of them are advice.**
#
#   {"error":"MISSING_SECRET_KEY",
#    "message":"Missing secret key in authentication header",
#    "suggestion":"Please use a secret key, the secret key is available in the
#                  dashboard: https://liveblocks.io/dashboard/apikeys",
#    "docs":"https://liveblocks.io/docs/api-reference/rest-api-endpoints"}
#
# A code, a sentence, what to do about it, and where to read more. The unrouted
# path gets the same treatment: "No such endpoint exists. Please look at the
# documentation for available endpoints. Maybe there was a typo?"
#
# **Outside it, the same key carries an English phrase instead of a code.**
#
#   PUT /v2/rooms   405  {"error":"Method Not Allowed"}
#   GET /v1/rooms   404  {"error":"Not Found"}
#   GET /           404  {"error":"Not Found"}
#
# One field, no message, no suggestion, no docs -- and `error`, which held
# `MISSING_SECRET_KEY` a moment ago, now holds a status code's reason phrase.
# Code switching on `body.error` has to know which half of the API it is
# talking to before it can tell a constant from a sentence.
#
# **Three ways to get the credential wrong, and the statuses cross over.**
# Struck live:
#
#   no Authorization header     401  MISSING_SECRET_KEY
#   Bearer sk_dev_<wrong>       403  INVALID_SECRET_KEY
#   Bearer pk_dev_<public>      401  WRONG_KEY_USED
#
# A key that is wrong is a 403; a key of the wrong kind is a 401, the same
# status as no key at all. And the third case exists because the public key --
# the one meant to ship in browser JavaScript -- is a plausible thing to reach
# for, so the API has a name for that mistake: "Public key instead of the
# secret key".
#
# **Permissions are glob-shaped strings in three fields and two shapes.**
# `defaultAccesses` is an array -- `["*:write"]` -- while `groupsAccesses` and
# `usersAccesses` are maps of id to the same array. So the thing that decides
# who may write is sometimes a list and sometimes a map of lists, and the
# values are `*:write`, a scope language of its own inside a JSON string.
#
# **The cursor and the parameter that takes it have different names.** The
# response carries `nextCursor`; the request takes `startingAfter`. A caller
# has to know the mapping, and nothing in either name says it.
#
# Also pinned: `metadata` values are documented as "value or array", so one
# key's type depends on what was written to it; `type: "room"` rides on every
# record returned from an endpoint called rooms; and `limit` defaults to 20
# with a documented range of 1 to 100.

recipe: liveblocks
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_dev_cauldr0nl1veblocksf1xturesecret
  absent_error: missing_secret_key
  malformed_error: missing_secret_key
  # A wrong key is a 403; no key and the wrong kind of key are 401s.
  rejected_error: invalid_secret_key
  unentitled:
    # The key meant to ship in browser JavaScript, sent where the secret one
    # belongs. The API has a name for this mistake.
    - pk_dev_cauldr0nl1veblocksf1xturepublic
  unentitled_error: wrong_key_used
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    cursor_field: nextCursor
    cursor_null: true
  error:
    style: flat
    code_field: error
    message_field: message

resources:
  room:
    id:
      style: opaque
      field: id
      length: 16
    fields:
      # On every record, from an endpoint called rooms.
      type:
        type: string
      createdAt:
        type: string
      lastConnectionAt:
      organizationId:
        type: string
      # A string or an array, depending on what was written to it.
      metadata:
        type: map
      # An array of scope strings.
      defaultAccesses:
        type: list
      # And the same scopes, as maps of id to array.
      groupsAccesses:
        type: map
      usersAccesses:
        type: map

routes:
  - method: GET
    path: /v2/rooms
    resource: room
    operation: list
    pagination:
      style: cursor
      limit: 20
      max_limit: 100
      limit_param: limit
      # The response calls it nextCursor.
      cursor_param: startingAfter
    filters:
      - param: organizationId
        field: organizationId

errors:
  missing_secret_key:
    status: 401
    code: MISSING_SECRET_KEY
    message: Missing secret key in authentication header
    fields:
      suggestion: "Please use a secret key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys"
      docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

  invalid_secret_key:
    # A 403, where no key at all is a 401.
    status: 403
    code: INVALID_SECRET_KEY
    message: Invalid secret key
    fields:
      suggestion: "Please use a valid secret key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys"
      docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

  unknown_route:
    status: 404
    code: NOT_FOUND
    message: Not Found
    fields:
      suggestion: No such endpoint exists. Please look at the documentation for available endpoints. Maybe there was a typo?
      docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

  wrong_key_used:
    # A 401, the same status as no key at all, for a key that is real.
    status: 401
    code: WRONG_KEY_USED
    message: Public key instead of the secret key
    fields:
      suggestion: "Please use your secret key instead of the public key, the secret key is available in the dashboard: https://liveblocks.io/dashboard/apikeys"
      docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

  # And here the four fields stop. One key, holding a reason phrase.
  method_not_allowed:
    status: 405
    code: Method Not Allowed
    message_field: "-"

fixtures:
  empty:
    room: []

  workspace:
    room:
      - id: cauldron-room-1
        type: room
        createdAt: "2026-04-02T10:15:33.129Z"
        lastConnectionAt: "2026-09-13T22:10:05.004Z"
        organizationId: org_4f3e2d1c0b9a8877
        metadata:
          # A string.
          project: handbook
          # And an array, in the same map.
          tags:
            - internal
            - draft
        # An array of scope strings.
        defaultAccesses:
          - "room:write"
        # The same scopes, keyed by id.
        groupsAccesses:
          engineering:
            - "room:write"
        usersAccesses:
          user_8812:
            - "*:write"
      - id: cauldron-room-2
        type: room
        createdAt: "2026-07-30T16:20:00.000Z"
        # Never connected to.
        lastConnectionAt: null
        organizationId: org_4f3e2d1c0b9a8877
        metadata: {}
        # Nobody by default.
        defaultAccesses: []
        groupsAccesses: {}
        usersAccesses: {}

conformance:
  - name: a missing key is four fields and two of them are advice
    source: https://api.liveblocks.io/v2/rooms
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      headers: {}
    expect:
      status: 401
      body:
        error: MISSING_SECRET_KEY
        message: Missing secret key in authentication header
        docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints
      matches:
        # Where to get one, in the error.
        suggestion: '\APlease use a secret key.*dashboard/apikeys\z'

  - name: a wrong key is a 403 where no key is a 401
    source: https://api.liveblocks.io/v2/rooms
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: "Bearer sk_dev_notarealsecretkey"
    expect:
      # The status crosses over: wrong is 403, absent is 401.
      status: 403
      body:
        error: INVALID_SECRET_KEY
        message: Invalid secret key

  - name: and a public key where the secret one belongs has its own name
    source: https://api.liveblocks.io/v2/rooms
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      headers:
        # The key meant to ship in browser JavaScript.
        Authorization: "Bearer pk_dev_cauldr0nl1veblocksf1xturepublic"
    expect:
      # A 401, where the merely-wrong key above was a 403.
      status: 401
      body:
        error: WRONG_KEY_USED
        message: Public key instead of the secret key

  - name: an unrouted path asks whether there was a typo
    source: https://api.liveblocks.io/v2/cauldron-nope
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        error: NOT_FOUND
        message: Not Found
        suggestion: No such endpoint exists. Please look at the documentation for available endpoints. Maybe there was a typo?
        docs: https://liveblocks.io/docs/api-reference/rest-api-endpoints

  - name: and a wrong method drops to one field holding a reason phrase
    source: https://api.liveblocks.io/v2/rooms
    verified: "2026-09-14"
    fixture: workspace
    request:
      method: PUT
      path: /v2/rooms
      headers: {}
    expect:
      status: 405
      body:
        # The key that held MISSING_SECRET_KEY now holds a status phrase.
        error: Method Not Allowed
      absent:
        - message
        - suggestion
        - docs

  - name: permissions are glob strings in two shapes
    source: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: "Bearer sk_dev_cauldr0nl1veblocksf1xturesecret"
    expect:
      status: 200
      body:
        # An array here.
        'data[0].defaultAccesses[0]': "room:write"
        # And maps of id to array here.
        'data[0].groupsAccesses.engineering[0]': "room:write"
        'data[0].usersAccesses.user_8812[0]': "*:write"
        'data[1].defaultAccesses': []
        'data[1].groupsAccesses': {}
        'data[1].usersAccesses': {}

  - name: one metadata map holds a string and an array
    source: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: "Bearer sk_dev_cauldr0nl1veblocksf1xturesecret"
    expect:
      status: 200
      body:
        # "value or array", in the same object.
        'data[0].metadata.project': handbook
        'data[0].metadata.tags[0]': internal
        'data[1].metadata': {}
        'data[0].type': room
        'data[0].createdAt': "2026-04-02T10:15:33.129Z"
        'data[0].lastConnectionAt': "2026-09-13T22:10:05.004Z"
        'data[1].lastConnectionAt': null
        'data[0].organizationId': org_4f3e2d1c0b9a8877

  - name: the cursor and the parameter that takes it are named differently
    source: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      query:
        limit: "1"
        organizationId: org_4f3e2d1c0b9a8877
      headers:
        Authorization: "Bearer sk_dev_cauldr0nl1veblocksf1xturesecret"
    expect:
      status: 200
      matches:
        # Sent as nextCursor, sent back as startingAfter.
        nextCursor: '\A\S+\z'

  - name: and the last page says so by sending null
    source: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    fixture: workspace
    request:
      method: GET
      path: /v2/rooms
      query:
        limit: "1"
        startingAfter: cauldron-room-2
      headers:
        Authorization: "Bearer sk_dev_cauldr0nl1veblocksf1xturesecret"
    expect:
      status: 200
      body:
        data: []
        nextCursor: null

  - name: an account with no rooms keeps the envelope
    source: https://liveblocks.io/docs/api-reference/rest-api-endpoints
    fixture: empty
    request:
      method: GET
      path: /v2/rooms
      headers:
        Authorization: "Bearer sk_dev_cauldr0nl1veblocksf1xturesecret"
    expect:
      status: 200
      body:
        data: []
        nextCursor: null
