# Metriport Recipe for Cauldron
#
# Written against Metriport's API reference at docs.metriport.com and struck
# live against api.metriport.com on 2026-09-07 with no credential, then with a
# deliberately invalid one, then on a path that does not exist.
#
# **Two words, three situations, one status.** Struck live:
#
#   GET /medical/v1/patient                          (no credential)
#   GET /medical/v1/patient                          x-api-key: notreal
#   GET /medical/v1/cauldron-nope                    x-api-key: notreal
#
#   403 {"message":"Forbidden"}
#
# Byte-identical all three times. A missing credential, a wrong credential and
# an unknown path are one response, and the response is a single word in a
# single field.
#
# That sentence is AWS API Gateway's default for a request its usage-plan check
# rejected -- so this is the gateway answering, and Metriport's own application
# is never reached. Which means the API's whole surface is opaque from outside:
# a caller cannot discover a route, cannot tell a typo from a permissions
# problem, and cannot tell whether their key was rejected or never read.
#
# It sits at one end of a range this collection now has three points on:
# [statsig](../statsig) answers eleven bytes and no content type to the same
# three mistakes; Metriport answers two words with a content type; and
# [healthgorilla](../healthgorilla), the other health API here, answers a
# full FHIR OperationOutcome to one of them and enumerates its 42 resource
# types to another. Two clinical APIs, opposite ends of the same decision.
#
# **403, not 401.** For a request carrying nothing at all -- so the status that
# tells a client to authenticate never arrives, and the one that arrives means
# "you are known and not allowed", which nobody was.
#
# **The credential header is `x-api-key`, lower case.** API Gateway's own
# convention. Header names are case-insensitive so it does not matter on the
# wire, and every code sample carries the lower case.

recipe: metriport
capability: health
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
  # No spec: Metriport publishes a rendered reference site.

auth:
  scheme: header
  header: x-api-key
  keys:
    - cauldr0n-metriport-f1xture-key-000000
  # One response for all three, struck live.
  absent_error: forbidden
  rejected_error: forbidden

responses:
  list:
    style: wrapped
    key: patients
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  patient:
    id:
      field: id
      style: opaque
    fields:
      firstName:
        type: string
      lastName:
        type: string
      dob:
        type: string
      genderAtBirth:
        type: string
      facilityIds:
        type: list
      externalId:
        type: string

routes:
  - method: GET
    path: /medical/v1/patient
    resource: patient
    operation: list
    pagination:
      style: cursor
      limit: 50
      max_limit: 500
      limit_param: count
      cursor_param: fromItem

errors:
  forbidden:
    # AWS API Gateway's default for a request its usage-plan check rejected,
    # so Metriport's own application is never reached and every mistake looks
    # the same from outside.
    status: 403
    message: Forbidden

fixtures:
  empty:
    patient: []

  organization:
    patient:
      - id: 018f2c91-a4b7-7e30-9d65-12c4a9081f3e
        firstName: Ada
        lastName: Lovelace
        dob: "1815-12-10"
        genderAtBirth: F
        facilityIds:
          - 018f2c91-a4b7-7e30-9d65-12c4a9081f40
        externalId: mrn-000141
      - id: 018f2c91-a4b7-7e30-9d65-12c4a9081f3f
        firstName: Grace
        lastName: Hopper
        dob: "1906-12-09"
        genderAtBirth: F
        # Two facilities on one patient: a record can be held by several sites
        # at once, so "which facility is this patient at" is a list and a
        # client showing one has picked an index.
        facilityIds:
          - 018f2c91-a4b7-7e30-9d65-12c4a9081f40
          - 018f2c91-a4b7-7e30-9d65-12c4a9081f41

conformance:
  - name: no credential is two words
    source: https://api.metriport.com/medical/v1/patient
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers: {}
    expect:
      # 403 for a request carrying nothing -- so the status that tells a
      # client to authenticate never arrives, and the one that does means
      # "you are known and not allowed", which nobody was.
      status: 403
      body:
        message: Forbidden

  - name: a wrong key is byte-identical
    source: https://api.metriport.com/medical/v1/patient
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: notreal
    expect:
      status: 403
      body:
        message: Forbidden

  - name: an unknown path is byte-identical again
    source: https://api.metriport.com/medical/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /medical/v1/cauldron-nope
      headers:
        x-api-key: notreal
    expect:
      # Three mistakes, one answer. The gateway is replying and Metriport's
      # own application is never reached, so a caller cannot discover a route,
      # cannot tell a typo from a permissions problem, and cannot tell whether
      # their key was rejected or never read.
      status: 403
      body:
        message: Forbidden

  - name: the failure has one field and no code
    source: https://api.metriport.com/medical/v1/patient
    verified: "2026-09-07"
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers: {}
    expect:
      status: 403
      absent:
        # Nothing to branch on, nothing to quote to support, and nothing that
        # names which of the three mistakes was made.
        - code
        - error
        - requestId

  - name: patients are wrapped under their own plural
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        # The path is singular and the key is plural, the same disagreement
        # nango has.
        'patients[0].firstName': Ada
        'patients[0].lastName': Lovelace

  - name: a patient can be held by several facilities
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        # A record can be held by several sites at once, so "which facility is
        # this patient at" is a list and a client showing one has picked an
        # index.
        'patients[1].facilityIds[0]': 018f2c91-a4b7-7e30-9d65-12c4a9081f40
        'patients[1].facilityIds[1]': 018f2c91-a4b7-7e30-9d65-12c4a9081f41

  - name: an external identifier is present on some records and not others
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        # The customer's own medical record number, optional, and the only
        # handle that means anything in their system -- so a patient without
        # one cannot be matched back and a client keying on it drops rows.
        'patients[0].externalId': mrn-000141
      absent:
        - 'patients[1].externalId'

  - name: identifiers are UUIDv7 so they sort by creation time
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        # The version nibble is 7, so the first 48 bits are a millisecond
        # timestamp: these identifiers leak when a patient record was created
        # and sort chronologically, which is useful and is also a fact about
        # a person in a clinical system.
        'patients[0].id': 018f2c91-a4b7-7e30-9d65-12c4a9081f3e
        'patients[1].id': 018f2c91-a4b7-7e30-9d65-12c4a9081f3f

  - name: dates of birth are whole dates
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        # Unlike FHIR next door, which permits a year alone -- so a record
        # that crosses between the two has to invent or discard a day.
        'patients[0].dob': "1815-12-10"
        'patients[0].genderAtBirth': F

  - name: paging is a count and an item to resume from
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: organization
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
      query:
        # `count` rather than limit and `fromItem` rather than a cursor -- so
        # neither name is the one a client written against any other provider
        # here would reach for, and `count` in particular usually means how
        # many there are rather than how many to send.
        count: "1"
        fromItem: 018f2c91-a4b7-7e30-9d65-12c4a9081f3e
    expect:
      status: 200
      body:
        # Served exclusive -- resuming after the record named. Metriport's own
        # `fromItem` is inclusive, which this format has no way to express;
        # the difference is one record and it is recorded in the README rather
        # than approximated, the same call the Telegram Recipe makes.
        'patients[0].firstName': Grace

  - name: an organization with no patients answers an empty array
    source: https://docs.metriport.com/medical-api/api-reference/patient/list-patients
    fixture: empty
    request:
      method: GET
      path: /medical/v1/patient
      headers:
        x-api-key: cauldr0n-metriport-f1xture-key-000000
    expect:
      status: 200
      body:
        patients: []
