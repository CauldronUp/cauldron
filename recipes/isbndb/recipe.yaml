# ISBNdb Recipe for Cauldron
#
# Third of a group with recipes/openlibrary/recipe.yaml and
# recipes/gutendex/recipe.yaml, and the one member of it this Recipe cannot
# answer the group's own question for. Every ISBNdb route requires a key,
# isbndb.com/apidocs/v2 -- the interactive reference for what a book record
# actually looks like -- sat behind a Cloudflare managed challenge on every
# attempt today, and this Recipe will not solve one (see the batch brief's
# own rule, restated in Step 2: never solve a CAPTCHA). So unlike its two
# siblings, this Recipe carries no book resource, no ISBN field, and no
# claim at all about which identifiers a record holds or whether one edition
# is related to another -- because nothing this Recipe could reach ever
# showed it a record. What it carries instead is the credential and routing
# surface, which turned out to be unusually rich on its own, checked live
# against api2.isbndb.com today with no account and no key ever held.
#
# **Missing and wrong are two different sentences, both 401:**
#
#   no Authorization header at all
#     -> 401 {"message": "Full authentication is required to access this
#             resource.", "errorMessage": "<the same sentence again>"}
#
#   Authorization: junkkey12345           (bare, no scheme word)
#   Authorization: Bearer junkkey12345    (the whole string, "Bearer " and
#                                           all, compared as one credential)
#     -> 401 {"message": "Bad credentials.", "errorMessage": "Bad
#             credentials."}
#
# Same status both times, different sentence, and the sentence is doubled
# under two keys carrying identical text -- "message" and "errorMessage" --
# on every failure this Recipe saw, not just these two. Sending the whole
# string "Bearer junkkey12345" as the header value produced the identical
# "Bad credentials" answer a bare key gets: nothing here strips a scheme
# word or checks for one, so there is no third, malformed shape -- the
# brief's own header for this batch names this exactly, "a bare key with no
# scheme word," and the wire confirms it rather than merely asserting it.
#
# **Routing beats the credential, for an unrouted path and for a wrong
# method both, and this was checked with and without one:**
#
#   GET /nosuchroute                 -> 404 {"message":"Not found", ...}
#   GET /nosuchroute  + junk key     -> 404, identical
#   PUT /book/9780451526342          -> 405, Allow: GET, body below
#   PUT /book/9780451526342 + junk key -> 405, identical
#
# so after_routing: true, and it is not a guess: the 404 and the 405 both
# came back exactly the same whether or not a credential travelled with the
# request.
#
# **And the 405 discloses a path this API does not publicly have.** The
# route this Recipe calls -- and the one every public example of this API
# calls -- is /book/{isbn}, with no /api/ segment anywhere in it. The 405
# body echoes the backend's own internal address for the route it just
# refused to serve by the wrong method:
#
#   {"message": "No route found for \"PUT
#    http://api2.isbndb.com/api/book/9780451526342\": Method Not Allowed
#    (Allow: GET)", "errorMessage": "<the same>"}
#
# -- "/api/book/...", a prefix that appears nowhere in the request this
# Recipe sent and nowhere in any documented path for this API, leaked by
# whatever internal router built that sentence out of the request it
# actually dispatched rather than the one the client actually addressed.
# OPTIONS on the same path answers the identical shape with OPTIONS named
# instead of PUT, confirming the message is built per request rather than
# a fixed string -- this Recipe pins the one instance it saw of each and
# says so rather than generalising the sentence into a template.
#
# **api2.isbndb.com and api.isbndb.com (no "2") answered byte for byte
# identically on every probe made today** -- the same two 401 sentences,
# the same 404, the same 405 with the same leaked /api/ prefix, the same
# headers. Whatever separates ISBNdb's tiers (Basic serves one host,
# Premium and Pro reportedly serve the other, per public discussion this
# Recipe could not verify from isbndb.com's own materials today) is not
# visible from outside a real subscription: an unauthenticated or
# wrongly-authenticated caller cannot tell the hosts apart, because both
# answer before any tier would ever be consulted. This Recipe targets
# api2.isbndb.com, the host the batch brief names first, and states rather
# than models the parity with the other one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No book resource, no fields, no fixture with a title or an author or
#     an ISBN in it anywhere in this file. See the header's opening
#     paragraph for why: no valid key, and the one place that could have
#     supplied a documented shape without one was behind a bot challenge
#     this Recipe would not solve. The /book/{id} route below exists only
#     to sit behind the credential gate this Recipe does have live
#     evidence for -- every conformance case that reaches it stops at 401,
#     and none claims anything about what a 200 from it would contain.
#   - Whether a checksum-invalid ISBN differs from a well-formed one this
#     API's catalogue simply lacks -- the sharpest question this batch's
#     brief asks -- could not be tested at all: both require a request that
#     gets past the credential gate above, and this Recipe held no
#     credential that does.
#   - HEAD on the book path answered 401, the credential-gated shape a real
#     GET gets, rather than the routing-miss shape PUT and OPTIONS get --
#     so whatever server sits in front of this API treats HEAD as an alias
#     of GET for routing purposes. Noted here and not modelled as its own
#     case: it adds no new verdict beyond what the GET cases below already
#     show, since the credential -- not the method -- is what decided the
#     answer.
#   - No upstream.spec. isbndb.com/apidocs/v2 is an interactive Swagger
#     page behind the same Cloudflare challenge as the rest of the docs
#     site, and this Recipe never obtained the JSON it renders from.
#   - The 405 message's method name is not modelled as dynamic. Cauldron's
#     error table is one static string per name, and OPTIONS was confirmed
#     live to get the identical shape with its own method substituted where
#     PUT's case carries "PUT" -- see the header and the OPTIONS case
#     below, which asserts the shape rather than a substitution this format
#     has no field for.

recipe: isbndb
capability: docs
version: 0.1.0

upstream:
  # isbndb.com/apidocs/v2 is the URL of ISBNdb's own interactive reference
  # -- fetched today (a real, dated HTTP response, a Cloudflare challenge
  # rather than the page itself) and the source of the "v2" label, since
  # the docs behind it were never read.
  api: v2
  docs: https://isbndb.com/apidocs/v2

auth:
  scheme: header
  header: Authorization
  # No prefix: the whole header value is the credential, scheme word or
  # not -- see the header. Confirmed rather than assumed: "Bearer
  # junkkey12345" and "junkkey12345" answered identically.
  keys:
    - cauldron-isbndb-fixture-key-00000000000
  absent_error: auth_required
  rejected_error: bad_credentials
  # Routing beats the credential on both an unrouted path and a wrong
  # method -- see the header.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    # No code and no type anywhere in any failure this Recipe saw.

resources:
  # Deliberately empty beyond an identifier. See the header: this Recipe
  # never observed a book record, live or documented, and declares none of
  # its fields rather than guess at ISBNdb's own well-known but unverified
  # shape.
  book:
    id:
      style: opaque
    fields:
      # A placeholder, not a claim: this format requires at least one
      # declared field, and this Recipe has no sourced field to declare --
      # see the header. No fixture ever sets it and no conformance case
      # ever asserts it.
      title:
        type: string
        null_when_unset: true

routes:
  - method: GET
    path: /book/{id}
    resource: book
    operation: get

errors:
  # Never reached directly: both verdicts below name their own entry.
  authentication_error:
    status: 401
    message: Authentication failed.
    fields:
      errorMessage: Authentication failed.

  auth_required:
    status: 401
    message: Full authentication is required to access this resource.
    fields:
      errorMessage: Full authentication is required to access this resource.

  bad_credentials:
    status: 401
    message: Bad credentials.
    fields:
      errorMessage: Bad credentials.

  unknown_route:
    status: 404
    message: Not found
    fields:
      errorMessage: Not found

  # Dynamic on the real host -- method and full backend address both echo
  # the request that was refused. This pins the one PUT instance this
  # Recipe saw; a second case below pins the same shape for OPTIONS,
  # confirming it is built per request rather than a fixed string. See the
  # header for the leaked /api/ prefix.
  method_not_allowed:
    status: 405
    message: 'No route found for "PUT http://api2.isbndb.com/api/book/9780451526342": Method Not Allowed (Allow: GET)'
    fields:
      errorMessage: 'No route found for "PUT http://api2.isbndb.com/api/book/9780451526342": Method Not Allowed (Allow: GET)'

fixtures:
  empty: {}

conformance:
  - name: no Authorization header at all describes the caller's own account as unauthenticated
    source: https://api2.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /book/9780451526342
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        message: Full authentication is required to access this resource.
        errorMessage: Full authentication is required to access this resource.

  - name: and a bare wrong key gets a different sentence at the same status
    source: https://api2.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /book/9780451526342
      headers:
        Authorization: junkkey12345
    expect:
      status: 401
      body:
        message: Bad credentials.
        errorMessage: Bad credentials.

  - name: sending the whole string "Bearer junkkey12345" is still just a wrong credential, not a malformed one
    source: https://api2.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /book/9780451526342
      headers:
        Authorization: "Bearer junkkey12345"
    expect:
      status: 401
      body:
        message: Bad credentials.

  - name: the second host answers the missing-credential case identically
    source: https://api.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /book/9780451526342
    expect:
      status: 401
      body:
        message: Full authentication is required to access this resource.

  - name: a path this API does not have 404s the same with no credential
    source: https://api2.isbndb.com/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute
    expect:
      status: 404
      body:
        message: Not found
        errorMessage: Not found

  - name: and the identical 404, unrouted paths never reach the credential gate at all
    source: https://api2.isbndb.com/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute
      headers:
        Authorization: junkkey12345
    expect:
      status: 404
      body:
        message: Not found

  - name: a wrong method 405s with the real route's internal address leaked into the message
    source: https://api2.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PUT
      path: /book/9780451526342
    expect:
      status: 405
      headers:
        Allow: GET
      body:
        # /api/book/..., a prefix this Recipe never sent and no published
        # path for this API carries -- see the header.
        message: 'No route found for "PUT http://api2.isbndb.com/api/book/9780451526342": Method Not Allowed (Allow: GET)'

  - name: OPTIONS 405s the same way, with its own method named in the same place
    source: https://api2.isbndb.com/book/9780451526342
    verified: "2026-09-03"
    fixture: empty
    request:
      method: OPTIONS
      path: /book/9780451526342
    expect:
      # Cauldron's own error table is one static string per name, so this
      # case cannot assert the real host's "OPTIONS" substitution without
      # claiming a capability the emulator does not have -- see the header.
      # What it can and does assert is the shape: status, the same Allow
      # header, and a 405 rather than the routing-miss 404 an unrouted path
      # gets, all confirmed live and identical to the PUT case above.
      status: 405
      headers:
        Allow: GET
