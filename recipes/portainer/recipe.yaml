# Portainer Recipe for Cauldron
#
# Written against Portainer's own generated Swagger 2.0 document, published in
# its own repository -- github.com/portainer/portainer, api/docs/swagger.yaml,
# 224 paths, version 2.45.0 -- read on 2026-09-06. Portainer is self-hosted and
# there is no public instance, so nothing here is verified live: every claim is
# the provider's own document.
#
# **A 2xx that means some of it did not happen.**
#
# The bulk delete of environments answers 207, described in the document as
# "Partial success. Some environments were deleted successfully, while others
# failed."
#
# 207 is in the 2xx range. `response.ok` is true. `if (status < 300)` passes.
# `raise_for_status()` does not raise. Every idiom for "did that work" says yes,
# and the answer is that some of the environments a caller asked to remove are
# still there -- or, worse for a caller reading it the other way, that some of
# the ones they did not expect to lose are gone.
#
# **And the report of what failed is a list of integers.**
#
#   endpointDeleteBatchPartialResponse:
#     deleted: [ integer ]
#     errors:  [ integer ]
#
# `errors` is an array of environment identifiers. Not errors -- ids. So the
# response says which environments failed and nothing whatever about why: no
# code, no message, no per-item status. A caller that wants a reason has to
# guess or retry one at a time.
#
# **The destructive verb is the deprecated one.**
#
# `DELETE /endpoints` carries, in its own description, "Deprecated: use the
# `POST` endpoint instead." So the supported way to remove many environments is
# a POST, and a reviewer scanning a codebase for destructive calls by HTTP verb
# finds nothing. The safe-looking verb is the one being retired.
#
# **The field names are Go struct names.**
#
# `Id`, `Name`, `URL`, `Type`, `Status`, `TLSConfig`, `PublicURL`, `TagIds`,
# `UserAccessPolicies` -- PascalCase on the wire, because the structs carry no
# JSON tags for them. A client that lowercases the first letter, or that maps
# camelCase by convention, reads undefined from every one. And `URL` is three
# capitals where `Url` would be the camelCase guess.
#
# **Two integers carry the two things you most want to branch on.**
#
#   Status  1 up, 2 down, 3 provisioning, 4 error
#   Type    1 Docker, 2 agent, and on
#
# Both bare integers with the meaning in a description rather than in a name. So
# `endpoint.Status === 1` is "up", and there is no string anywhere to check
# against. An environment in state 4 is in error and an environment in state 2
# is merely unreachable, and both are truthy.
#
# **Paging is `start`, not `offset` or `page`.** `start` and `limit` on the
# environments listing, and the listing itself is a bare array with no total
# anywhere -- so a caller pages by asking for more until it gets fewer.
#
# **Access control is embedded in the record.** `UserAccessPolicies` and
# `TeamAccessPolicies` travel inside each environment, so a listing of
# environments is also a dump of who may reach each one.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Portainer is self-hosted and
#     there is no public instance.
#   - Environments, listed and fetched. 224 paths is a container manager:
#     stacks, containers, images, volumes, networks, registries, teams, the
#     whole Kubernetes proxy surface and the edge agent protocol each want
#     their own evidence.
#   - The 207 is served on a route that arms it, not by actually failing to
#     delete something. This Recipe has no bulk delete; what it reproduces is
#     the shape and the status, which is what a client branches on.
#   - `Status` and `Type` are served as the integers the document declares.
#     Nothing here maps them to names, because the provider does not.

recipe: portainer
capability: infrastructure
version: 0.1.0

upstream:
  api: "2.45.0"
  docs: https://docs.portainer.io/api/access
  spec: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
  spec_hash: e8607e40de1a2aa0a3cc674d4234245a93d0814494257c37ec8afddea8da8662
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-API-KEY
  keys:
    - ptr_cauldron00000000000000000000000000000000
  absent_error: unauthorized

responses:
  list:
    # A bare array with no envelope and no total.
    style: bare
  error:
    style: flat
    message_field: message
    fields:
      details: ""

resources:
  endpoint:
    id:
      # Id, capital I, because the struct has no JSON tag.
      style: numeric
      field: Id
      type: number
    fields:
      Name:
        type: string
        required: true
      # 1 Docker, 2 agent, and on. A bare integer.
      Type:
        type: number
        default: 1
      # 1 up, 2 down, 3 provisioning, 4 error. Also a bare integer, and every
      # one of them is truthy.
      Status:
        type: number
        default: 1
      URL:
        type: string
      PublicURL:
        type: string
      GroupId:
        type: number
        default: 1
      TagIds:
        type: list
      # Who may reach this environment, inside the environment's own record --
      # so a listing is also a dump of access control.
      UserAccessPolicies:
      TeamAccessPolicies:
      LastCheckInDate:
        type: number
        default: 0

routes:
  - method: GET
    path: /api/endpoints
    resource: endpoint
    operation: list
    pagination:
      style: offset
      # start, not offset and not page.
      cursor_param: start
      limit_param: limit
      limit: 100
    filters:
      - field: Name
        param: search

  - method: GET
    path: /api/endpoints/{id}
    resource: endpoint
    operation: get
    not_found: not_found

  # The bulk delete, at the path that replaced DELETE /endpoints -- which is
  # itself still there and marked "Deprecated: use the POST endpoint instead."
  #
  # Served raw, and answering 207, because that is the finding. It is not
  # modelled as an error: Portainer's own schema for this body is
  # {deleted, errors} and nothing else, so routing it through the error table
  # would add a message the provider never sends.
  - method: POST
    path: /api/endpoints/delete
    status: 207
    raw:
      content_type: application/json
      text: |
        {"deleted":[3],"errors":[4]}

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
    fields:
      details: "missing or invalid API key"
  not_found:
    status: 404
    message: "Environment not found"
    fields:
      details: "object not found inside the database"
  forbidden:
    status: 403
    message: "Permission denied"
    fields:
      details: "administrator access required"
  rate_limit:
    status: 429
    message: "Too many requests"
    fields:
      details: "rate limit exceeded"

fixtures:
  empty:
    endpoint: []

  cluster:
    endpoint:
      - Id: 3
        Name: local
        Type: 1
        Status: 1
        URL: unix:///var/run/docker.sock
        PublicURL: ""
        GroupId: 1
        TagIds: []
        UserAccessPolicies:
          "2":
            RoleId: 1
        TeamAccessPolicies: {}
        LastCheckInDate: 1757150000
      - Id: 4
        Name: staging-swarm
        Type: 2
        # Down, not error. Two different integers, both truthy, and only the
        # description says which is which.
        Status: 2
        URL: tcp://swarm.internal:9001
        PublicURL: swarm.example.com
        GroupId: 2
        TagIds: [1, 5]
        UserAccessPolicies: {}
        TeamAccessPolicies:
          "1":
            RoleId: 2
        LastCheckInDate: 1757060000

conformance:
  - name: the field names are Go struct names, capitals and all
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        # Id, not id. URL, not url and not Url. A client that lowercases the
        # first letter by convention reads undefined from every one of these.
        '[0].Id': 3
        '[0].Name': local
        '[0].URL': unix:///var/run/docker.sock
        '[1].PublicURL': swarm.example.com
      absent:
        # The camelCase and snake_case spellings a client would guess.
        - '[0].id'
        - '[0].url'
        - '[0].public_url'

  - name: status and type are bare integers, and every value is truthy
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        # 1 is up and 2 is down, with the meaning in a description rather than
        # in a name. There is no string anywhere to compare against, and both
        # values are truthy -- so `if (endpoint.Status)` is true for a dead
        # environment.
        '[0].Status': 1
        '[1].Status': 2
        # And the type, on the same terms: 1 Docker, 2 agent.
        '[0].Type': 1
        '[1].Type': 2

  - name: access control travels inside each environment
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        # Keyed by user id as a string, because it is a Go map with an integer
        # key and JSON has no integer keys. So a listing of environments is
        # also a dump of who may reach each one, and the identifiers in it are
        # strings on the wire and integers everywhere else.
        '[0].UserAccessPolicies.2.RoleId': 1
        '[1].TeamAccessPolicies.1.RoleId': 2
        '[1].UserAccessPolicies': {}

  - name: a listing is a bare array with no total
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      query:
        # start, not offset and not page.
        start: "0"
        limit: "1"
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        '[0].Name': local
      absent:
        - '[1]'
        - total
        - TotalCount

  - name: the second page continues from start
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      query:
        start: "1"
        limit: "1"
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        '[0].Name': staging-swarm
        '[0].TagIds': [1, 5]
      absent:
        - '[1]'

  - name: a partial delete answers 207, which every ok check passes
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: POST
      path: /api/endpoints/delete
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
      json:
        endpoints:
          - id: 3
          - id: 4
    expect:
      # In the 2xx range. response.ok is true, status < 300 passes,
      # raise_for_status does not raise -- and some of the environments the
      # caller asked to remove are still there.
      status: 207
      # Two arrays of environment identifiers. errors names which ones failed
      # and says nothing about why: no code, no message, no per-item status,
      # so a caller wanting a reason has to retry them one at a time.
      body_matches: '"errors":\[4\]'
      absent_headers:
        # Nothing anywhere flags this as partial except the status itself,
        # which is the one thing a success check does not look at.
        - Warning

  - name: an environment is fetched by its integer id
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints/4
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        Id: 4
        Name: staging-swarm
        GroupId: 2
        # Unix seconds as a number, and zero on an environment that has never
        # checked in -- which is falsy and is not the same as absent.
        LastCheckInDate: 1757060000

  - name: no credential is refused
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"
        details: "missing or invalid API key"

  - name: a missing environment says so in these words
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints/9999
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 404
      body:
        message: "Environment not found"
        # The database's own words, surfaced to the caller.
        details: "object not found inside the database"

  - name: "a forbidden request says so in these words"
    source: "https://docs.portainer.io/api/access"
    arm: forbidden
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 403
      body:
        message: "Permission denied"
        details: "administrator access required"

  - name: "the rate limit says so in these words"
    source: "https://docs.portainer.io/api/access"
    arm: rate_limit
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 429
      body:
        message: "Too many requests"
        details: "rate limit exceeded"

  - name: the search parameter is search, not q or name
    source: https://raw.githubusercontent.com/portainer/portainer/develop/api/docs/swagger.yaml
    fixture: cluster
    request:
      method: GET
      path: /api/endpoints
      query:
        # One of twelve query parameters on this listing, beside groupIds,
        # status, types, platformTypes, outdated, excludeGroupIds and tagIds
        # -- so the same endpoint is a filter language and there is still no
        # total in the response.
        search: staging-swarm
      headers:
        X-API-KEY: ptr_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        '[0].Name': staging-swarm
      absent:
        - '[1]'
