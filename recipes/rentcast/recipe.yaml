          lastSalePrice: 270000
        comparables:
          - id: "5207-Pine-Lake-Dr,-San-Antonio,-TX-78244"
            formattedAddress: "5207 Pine Lake Dr, San Antonio, TX 78244"
            status: Active
            price: 289444
