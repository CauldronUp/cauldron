# RentCast Recipe for Cauldron
#
# This Recipe, attom/recipe.yaml and estated/recipe.yaml were written together
# as a group, on the same day, against one question: a property valuation is
# a model's opinion about a physical building, derived from records of
# varying age. Does the wire ever admit that -- a confidence score, a range,
# a date the underlying record was last touched by a county -- or does it
# hand back a dollar figure as though it were a fact the way a geocoding API
# hands back a city? ipinfo/recipe.yaml, maxmind/recipe.yaml and
# geoapify/recipe.yaml asked the identical question about an IP address a
# year earlier; this group asks it where the number is larger and somebody
# is more likely to act on it.
#
# RentCast's answer is the plainest of the three, and the sharpest thing
# about it is what it does NOT have a name for. GET /v1/avm/value answers
# with a price and, beside it, priceRangeLow and priceRangeHigh -- a genuine
# range, twenty percent wide on the one example this Recipe could read
# ($195,000 to $304,000 around a $250,000 point estimate). There is no field
# called confidence, accuracy or score anywhere on the response. The nearest
# thing to one is buried a level down: each entry in comparables[] carries a
# correlation between 0 and 1, and that number describes how similar ONE
# comparable sale is to the subject property, not how sure RentCast is about
# the price it just quoted. A client reading price alone gets a fact with no
# error bar attached to it at all; a client reading priceRangeLow and
# priceRangeHigh gets the error bar RentCast is actually willing to state;
# and no client, however carefully it reads, gets a number that answers "how
# confident is this estimate," because RentCast never asks itself that
# question in public. See attom/recipe.yaml for a provider whose AVM product
# is known industry-wide to publish a forecast standard deviation and this
# Recipe could not confirm the field exists on the wire at all, and
# estated/recipe.yaml for the one member of this group whose documentation
# states a real statistical confidence field by name -- forecast_standard_
# deviation, a percentage -- on an API that ATTOM itself now runs behind the
# scenes.
#
# Record freshness gets the same answer as confidence: nothing. The property
# endpoint's taxAssessments and propertyTaxes are keyed by YEAR --
# "2020".."2024" in the one example this Recipe could read -- and that year
# is the county's own label for its assessment roll, not a timestamp of when
# RentCast itself last pulled the record. There is no lastUpdated, asOf or
# refreshedAt field anywhere on a property record, checked against the
# complete field list this Recipe's own documentation research surfaced. A
# client cannot tell "this 2024 assessment is what the county published
# eight months ago" from "this 2024 assessment is what RentCast's crawler
# saw yesterday, and the county has not touched the record since 2024
# either" -- both look identical on the wire. Compare estated/recipe.yaml's
# metadata.publishing_date, documented in so many words as "the date on
# which assessor roll data is published or received from the county
# assessor," sitting beside a SEPARATE valuation.date documented as "the
# date the valuation was performed" -- the exact distinction this group set
# out to look for, on the one member of the group that is not, strictly
# speaking, still an independent product.
#
# **Absent and wrong are different sentences, and the field that is supposed
# to tell them apart does not.** Four requests, struck live against
# api.rentcast.io, 2026-09-02, no account, no real key:
#
#   GET /v1/avm/value?address=...  (no X-Api-Key header at all)
#     -> 401 {"status":401,"error":"auth/api-key-invalid","message":"No API
#        key provided in request. An API key must be provided in the
#        'X-Api-Key' header"}
#   GET /v1/avm/value?address=...  X-Api-Key: (empty string)
#     -> 401, byte-identical to the line above
#   GET /v1/avm/value?address=...  X-Api-Key: junk-obviously-fake-key-0000000000
#     -> 401 {"status":401,"error":"auth/api-key-invalid","message":"The
#        provided API key is not valid. Manage API keys on your API
#        dashboard: https://app.rentcast.io/app/api"}
#
# error carries the identical slug, "auth/api-key-invalid", on both. A client
# switching on that field alone cannot tell "you sent nothing" from "you sent
# something wrong" -- the two verdicts collapse to one code, the way most of
# this whole collection's providers behave. What does not collapse is
# message, which is where RentCast actually keeps the distinction, and this
# Recipe reaches auth.absent_error and auth.rejected_error to keep both
# sentences rather than folding them into the one Cauldron's own default
# would have kept. An empty X-Api-Key header answers identically to no
# header at all -- Cauldron's own runtime already treats a present-but-empty
# header value as absent, unprompted, so that byte-identical pairing needed
# nothing declared to reproduce.
#
# **The credential is checked before routing, before the method, before
# everything, for every path this Recipe tried.** A POST to a GET-only route
# answers the same absent/rejected 401 pair above rather than a 405; a GET to
# a path that does not exist answers the same pair rather than a 404. Both
# checked live, both ways (no credential and a junk one), byte-identical to
# the matched-route cases. That is Cauldron's own default ordering --
# credential first, unconditionally -- and nothing about auth.after_routing
# needed declaring here, the same shape FireHydrant's Recipe in this
# collection already names for a completely different provider. Business
# logic -- what a malformed address gets, what an address in a county
# RentCast does not cover gets -- was consequently never reachable live at
# all: every probe this Recipe could run without a credential stopped at the
# gate above, and every case below that needs to see past it uses this
# Recipe's own fixture key rather than a real one, and says so by carrying
# no verified date.
#
# **Two limits, two shapes, and only one of them is an error.** RentCast's
# own documentation states both, in these words: the free tier is "up to 50
# free API requests per month," and exceeding it is NOT refused -- "you will
# be charged the overage fee for each additional request." No status code or
# body is documented for crossing it, because nothing answers when you do; a
# meter turns, not a gate. Separately, and unconditionally regardless of
# tier, "a hard limit of 20 requests per second, per API key" answers
# {"status":429,"error":"auth/rate-limit-exceeded","message":"The rate limit
# of 20 requests per second has been exceeded"} -- documented, never
# triggered by this Recipe on purpose, and armed below rather than served as
# though it had been observed.
#
# **A malformed address has a documented example; an uncovered one does
# not.** RentCast's own response-codes reference gives a worked 400 body --
# {"status":400,"error":"resource/bad-request","message":"The provided
# address '1234 Main St' could not be parsed or geolocated"} -- using its own
# example of an address too vague to parse. The SAME reference lists 404 as
# "no data or records were available that matched your query parameters" and
# publishes no example body for it at all: no error slug, no message text,
# nothing this Recipe could serve without inventing it. So the one
# distinction this whole group of Recipes was sent to look for -- does a
# well-formed address nobody has records for answer differently from a
# malformed one -- is answered by RentCast on exactly one side: yes, a
# parseable-but-uncovered address gets a different HTTP status (404 rather
# than 400) than an unparseable one, per the status table, and no, this
# Recipe cannot show the body that status carries, because RentCast's own
# documentation never shows it either. Stated rather than served.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no key was ever requested, guessed or
#     used. The five 401 cases below that Cauldron's own credential check
#     reaches on its own are struck live and carry a verified date; every
#     200 and the 400 below need this Recipe's own fixture key to reach past
#     that gate, which the live host was never asked to accept, and carry
#     none.
#   - owner -- names, type and a mailingAddress object -- is real, documented
#     with a worked example, and deliberately not modelled. The one example
#     this Recipe could read ties a specific person's name to a specific
#     street address, and unlike the address itself (which this whole group
#     of Recipes is explicitly permitted to cite from a vendor's own
#     documentation) a homeowner's name attached to it is not something this
#     Recipe chooses to carry forward into a fixture file, vendor-published
#     or not.
#   - hoa, features and legalDescription/subdivision/zoning are real,
#     documented fields on the property resource and are not modelled: none
#     of them bears on the confidence/freshness/coverage question this group
#     of Recipes exists to answer, and every field added is a field a future
#     edit of this Recipe has to keep in sync with a provider it cannot poll
#     for free.
#   - listings/sale and listings/rental/long-term, RentCast's separate active-
#     listing endpoints, are real and not modelled: the two AVM routes and
#     the property-record route already carry this Recipe's finding, and a
#     fourth and fifth endpoint would add fixture surface rather than
#     evidence.
#   - No upstream.spec. RentCast publishes no machine-readable OpenAPI or
#     Postman description at any URL this Recipe could find; its reference
#     pages are hand-written prose and worked examples only.
#   - The 404 "no coverage" case is not served, for the reason stated above:
#     RentCast's own documentation describes the status and does not show
#     the body.

recipe: rentcast
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.rentcast.io/reference/introduction

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldron-rentcast-fixture-key-00000000000000
  # Absent falls through to authentication_error, whose wording is already
  # RentCast's own sentence for "nothing was presented." rejected_error
  # carries the second, different sentence -- see the header: the error
  # slug is identical on both and only the message tells them apart.
  rejected_error: api_key_invalid

responses:
  list:
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: error
    code_type: string
    status_field: status

resources:
  # GET /v1/avm/value. Not itself an addressable record -- there is no id
  # anywhere on this response -- so id.field is "-" throughout.
  avm_value:
    id:
      style: opaque
      field: "-"
    fields:
      price:
        type: integer
      # The range RentCast is actually willing to state. See the header:
      # there is no field beside these two called confidence or accuracy.
      priceRangeLow:
        type: integer
      priceRangeHigh:
        type: integer
      # A nested object with its own address, bed/bath/sqft and sale
      # history. Declared as a map rather than broken into named fields the
      # way rootly/recipe.yaml's severity is: the trap this Recipe is
      # pinning is in the parent field's absence of a confidence sibling,
      # not in what any one property attribute inside it is called.
      subjectProperty:
        type: map
      # Each entry carries its own correlation, 0 to 1 -- the nearest thing
      # to a confidence number this API has, and it describes one comparable
      # sale's similarity to the subject, not the estimate's own certainty.
      # See the header.
      comparables:
        type: list

  avm_rent:
    id:
      style: opaque
      field: "-"
    fields:
      rent:
        type: integer
      rentRangeLow:
        type: integer
      rentRangeHigh:
        type: integer
      subjectProperty:
        type: map
      comparables:
        type: list

  # GET /v1/properties. A bare array of these, per the header.
  property:
    id:
      style: opaque
    fields:
      formattedAddress:
        type: string
      addressLine1:
        type: string
      city:
        type: string
      state:
        type: string
      zipCode:
        type: string
      county:
        type: string
      propertyType:
        type: string
      bedrooms:
        type: integer
      bathrooms:
        type: integer
      squareFootage:
        type: integer
      yearBuilt:
        type: integer
      assessorID:
        type: string
      lastSaleDate:
        type: datetime
      lastSalePrice:
        type: integer
      # Keyed by YEAR, a county assessment-roll label, not a timestamp of
      # when RentCast itself last touched the record. See the header: there
      # is no separate field anywhere on this resource that says the latter.
      taxAssessments:
        type: map
      propertyTaxes:
        type: map
      history:
        type: map

routes:
  # No matches_query on this one: MatchesQuery's own comparison treats a
  # comma inside the query value as separating alternatives (Clover's
  # ?expand=lineItems,payments), which an address string full of commas
  # trips over -- "5500 Grand Lake Dr, San Antonio, TX, 78244" would need to
  # equal one comma-split segment of itself, and never does. id_from alone
  # is enough: the address is looked up against the fixture's own id.
  - method: GET
    path: /v1/avm/value
    resource: avm_value
    operation: get
    id_from: query:address

  # RentCast's own documented example of an address too vague to parse. Safe
  # to select by matches_query because it carries no comma to split on.
  - method: GET
    path: /v1/avm/value
    matches_query:
      address: "1234 Main St"
    error: bad_address

  - method: GET
    path: /v1/avm/rent/long-term
    resource: avm_rent
    operation: get
    id_from: query:address

  # Not scoped by an address filter: RentCast's own address query parameter
  # ("5500 Grand Lake Dr, San Antonio, TX, 78244", comma before the zip, the
  # same shape the AVM routes take) and this resource's own formattedAddress
  # field ("5500 Grand Lake Dr, San Antonio, TX 78244", no comma before the
  # zip) are not the same string on RentCast's own wire, so a filter
  # comparing them literally would never match its own documented example.
  # This Recipe's one fixture record is served for any address query rather
  # than pretending to filter on a comparison that would silently never fire.
  - method: GET
    path: /v1/properties
    resource: property
    operation: list
    pagination:
      # limit and offset, from RentCast's own reference read 2026-09-05:
      # limit is "the maximum number of property records to return, between
      # 1 and 500", defaulting to 50, and offset is "the index of the first
      # property record to return, used to paginate through large lists of
      # results", defaulting to 0.
      #
      # The size name was right by luck; the position was being read as a
      # cursor on an API that skips by count, and fifty is five times the
      # page this fake was serving.
      style: offset
      limit: 50
      max_limit: 500
      limit_param: limit
      cursor_param: offset

errors:
  # RentCast's own sentence for "nothing was presented." Reached
  # automatically by Cauldron's credential check; no arm needed.
  authentication_error:
    status: 401
    code: auth/api-key-invalid
    message: "No API key provided in request. An API key must be provided in the 'X-Api-Key' header"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Same slug, different sentence -- see the header. Named by
  # auth.rejected_error, so this is reached automatically too.
  api_key_invalid:
    status: 401
    code: auth/api-key-invalid
    message: "The provided API key is not valid. Manage API keys on your API dashboard: https://app.rentcast.io/app/api"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # RentCast's own documented example: an address too vague to parse or
  # geolocate. Never observed live -- see the header, credential first.
  bad_address:
    status: 400
    code: resource/bad-request
    message: "The provided address '1234 Main St' could not be parsed or geolocated"

  # Documented, never triggered on purpose -- this Recipe does not retry
  # into a rate limit. Armed rather than wired: 20 requests per second is a
  # hard limit unrelated to the monthly free-tier meter, which does not
  # error at all. See the header.
  rate_limit:
    status: 429
    code: auth/rate-limit-exceeded
    message: "The rate limit of 20 requests per second has been exceeded"

fixtures:
  empty: {}

  san-antonio:
    avm_value:
      - id: "5500 Grand Lake Dr, San Antonio, TX, 78244"
        price: 250000
        priceRangeLow: 195000
        priceRangeHigh: 304000
        subjectProperty:
          id: "5500-Grand-Lake-Dr,-San-Antonio,-TX-78244"
          formattedAddress: "5500 Grand Lake Dr, San Antonio, TX 78244"
          addressLine1: "5500 Grand Lake Dr"
          city: San Antonio
          state: TX
          zipCode: "78244"
