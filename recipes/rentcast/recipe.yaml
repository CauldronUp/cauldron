    avm_rent:
      - id: "5500 Grand Lake Dr, San Antonio, TX, 78244"
        rent: 1620
        rentRangeLow: 1550
        rentRangeHigh: 1690
        subjectProperty:
          id: "5500-Grand-Lake-Dr,-San-Antonio,-TX-78244"
          formattedAddress: "5500 Grand Lake Dr, San Antonio, TX 78244"
          bedrooms: 3
          bathrooms: 2
          squareFootage: 1878
          yearBuilt: 1973
        comparables:
          - id: "7306-Kingsland-Dr,-San-Antonio,-TX-78244"
            formattedAddress: "7306 Kingsland Dr, San Antonio, TX 78244"
            status: Inactive
            price: 1627
            distance: 0.4359
            correlation: 0.9873
          - id: "4907-Lakebend-East-Dr,-San-Antonio,-TX-78244"
            formattedAddress: "4907 Lakebend East Dr, San Antonio, TX 78244"
            status: Inactive
