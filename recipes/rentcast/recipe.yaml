    property:
      - id: "5500-Grand-Lake-Dr,-San-Antonio,-TX-78244"
        formattedAddress: "5500 Grand Lake Dr, San Antonio, TX 78244"
        addressLine1: "5500 Grand Lake Dr"
        city: San Antonio
        state: TX
        zipCode: "78244"
        county: Bexar
        propertyType: Single Family
        bedrooms: 3
        bathrooms: 2
        squareFootage: 1878
        yearBuilt: 1973
        assessorID: "05076-103-0500"
        lastSaleDate: "2024-11-18T00:00:00.000Z"
        lastSalePrice: 270000
        taxAssessments:
          "2023": { year: 2023, value: 225790, land: 59380, improvements: 166410 }
          "2024": { year: 2024, value: 216513, land: 59380, improvements: 157133 }
        propertyTaxes:
          "2023": { year: 2023, total: 4201 }
          "2024": { year: 2024, total: 4065 }
        history:
          "2017-10-19": { event: Sale, date: "2017-10-19T00:00:00.000Z", price: 185000 }
          "2024-11-18": { event: Sale, date: "2024-11-18T00:00:00.000Z", price: 270000 }

# Every case below carries source. A verified date means this Recipe called
# api.rentcast.io with exactly the request shown and recorded exactly what
# came back; its absence means the credential in the request is this
# Recipe's own fixture key, which the live host was never asked to accept,
# and the expectation was read from developers.rentcast.io instead.
conformance:
  - name: no credential at all
    source: https://api.rentcast.io/v1/avm/value
    verified: "2026-09-02"
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/value?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
    expect:
      status: 401
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        status: 401
        error: auth/api-key-invalid
        message: "No API key provided in request. An API key must be provided in the 'X-Api-Key' header"

  - name: an empty header answers byte-identically to no header at all
    source: https://api.rentcast.io/v1/avm/value
    verified: "2026-09-02"
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/value?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: ""
    expect:
      status: 401
      body:
        message: "No API key provided in request. An API key must be provided in the 'X-Api-Key' header"

  - name: a wrong credential gets a different sentence behind the same code
    source: https://api.rentcast.io/v1/avm/value
    verified: "2026-09-02"
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/value?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: junk-obviously-fake-key-0000000000
    expect:
      status: 401
      body:
        status: 401
        error: auth/api-key-invalid
        message: "The provided API key is not valid. Manage API keys on your API dashboard: https://app.rentcast.io/app/api"

  - name: a wrong method on a real path is refused for its credential, not its verb
    source: https://api.rentcast.io/v1/avm/value
    verified: "2026-09-02"
    fixture: san-antonio
    request:
      method: POST
      path: /v1/avm/value
    expect:
      status: 401
      body:
        message: "No API key provided in request. An API key must be provided in the 'X-Api-Key' header"

  - name: an unrouted path gets the identical pair, not a distinct 404
    source: https://api.rentcast.io/v1/this-is-not-a-real-endpoint
    verified: "2026-09-02"
    fixture: san-antonio
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
      headers:
        X-Api-Key: junk-obviously-fake-key-0000000000
    expect:
      status: 401
      body:
        message: "The provided API key is not valid. Manage API keys on your API dashboard: https://app.rentcast.io/app/api"

  - name: the estimate is a range, and nothing beside it is called confidence
    # Documented, not observed -- see the header, credential first. Every
    # value here is RentCast's own worked example.
    source: https://developers.rentcast.io/reference/value-estimate
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/value?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: cauldron-rentcast-fixture-key-00000000000000
    expect:
      status: 200
      body:
        price: 250000
        priceRangeLow: 195000
        priceRangeHigh: 304000
        "subjectProperty.formattedAddress": "5500 Grand Lake Dr, San Antonio, TX 78244"
        "comparables[0].correlation": 0.9916
      absent:
        - confidence
        - accuracy
        - score

  - name: the rent estimate carries the identical range shape
    source: https://developers.rentcast.io/reference/rent-estimate-long-term
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/rent/long-term?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: cauldron-rentcast-fixture-key-00000000000000
    expect:
      status: 200
      body:
        rent: 1620
        rentRangeLow: 1550
        rentRangeHigh: 1690
      absent:
        - confidence
        - accuracy

  - name: a tax assessment is keyed by year, and nothing says when RentCast last checked it
    # See the header: this is the sharpest way this Recipe can show the
    # freshness gap -- what IS on the wire, asserted beside what a client
    # might reasonably look for and not find.
    source: https://developers.rentcast.io/reference/property-records
    fixture: san-antonio
    request:
      method: GET
      path: /v1/properties?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: cauldron-rentcast-fixture-key-00000000000000
    expect:
      status: 200
      body:
        "[0].taxAssessments.2024.value": 216513
        "[0].taxAssessments.2024.year": 2024
        "[0].lastSaleDate": "2024-11-18T00:00:00.000Z"
      absent:
        - "[0].lastUpdated"
        - "[0].asOf"
        - "[0].refreshedAt"
        - "[0].owner"

  - name: an address RentCast's own example calls too vague to parse
    source: https://developers.rentcast.io/reference/response-codes
    fixture: san-antonio
    request:
      method: GET
      path: /v1/avm/value?address=1234%20Main%20St
      headers:
        X-Api-Key: cauldron-rentcast-fixture-key-00000000000000
    expect:
      status: 400
      body:
        status: 400
        error: resource/bad-request
        message: "The provided address '1234 Main St' could not be parsed or geolocated"

  - name: the hard per-second limit is a real error, unlike the monthly meter
    # Documented, never triggered on purpose -- see the header. Armed: this
    # Recipe does not retry into a live rate limit to observe it.
    source: https://developers.rentcast.io/reference/rate-limits
    fixture: san-antonio
    arm: rate_limit
    request:
      method: GET
      path: /v1/avm/value?address=5500%20Grand%20Lake%20Dr,%20San%20Antonio,%20TX,%2078244
      headers:
        X-Api-Key: cauldron-rentcast-fixture-key-00000000000000
    expect:
      status: 429
      body:
        status: 429
        error: auth/rate-limit-exceeded
        message: "The rate limit of 20 requests per second has been exceeded"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but offset can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
