# Maxio Advanced Billing Recipe for Cauldron
#
# Written against Maxio's API reference at developers.maxio.com and struck live
# against a Chargify subdomain on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The header says JSON and the body is a sentence.** Struck live, both ways:
#
#   GET /subscriptions.json                       (no credential)
#   401  Content-Type: application/json
#   HTTP Basic: Access denied.
#
# Twenty-six bytes of prose, declared `application/json`. Not a quoted string,
# which would at least parse -- a bare sentence with a colon and a full stop in
# it. Every client that does the correct thing, checking the type before
# parsing, parses it, and throws.
#
# That is worse than [statsig](../statsig)'s refusal, which sends no
# Content-Type at all and is therefore honest about being unparseable, and
# worse than [wrike](../wrike)'s, which is real JSON mislabelled as text: a
# client trusting Wrike's header skips a parse it could have done, and a client
# trusting this one attempts a parse it cannot. Three providers, three
# different ways of getting one header wrong, and this is the only one where
# believing the header is what breaks you.
#
# The sentence is also Rack's, not Maxio's -- `HTTP Basic: Access denied.` is
# what Rack::Auth::Basic writes when a challenge fails. So the middleware is
# answering above the application, and the application's own JSON error
# envelope, which every documented failure uses, is never reached.
#
# **The product is named twice and the hostname is the old one.** Maxio bought
# Chargify; the documentation says Maxio Advanced Billing; the API is at
# `<subdomain>.chargify.com` and every path ends `.json`. So the name a
# developer searches for and the name in the URL have not been the same since
# 2022.
#
# **Paths carry their format as an extension.** `/subscriptions.json`, not
# `/subscriptions` with an Accept header -- Rails' respond_to convention on the
# wire, which means the content type is chosen by the path and a client cannot
# ask for something else without changing the URL.

recipe: maxio
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.maxio.com/http/advanced-billing
  # No spec: Maxio's reference is a rendered documentation site.

auth:
  # The API key as the Basic username, with the literal word "x" as the
  # password -- Maxio's own documented convention, and one that means a
  # credential helper filling in a password field sends the wrong thing.
  scheme: basic
  keys:
    - cauldronmaxiofixturekey000000
  # One response for both, from Rack rather than from Maxio.
  absent_error: basic_access_denied
  rejected_error: basic_access_denied

responses:
  list:
    style: bare
    # Every record in a Maxio collection is wrapped under its own singular
    # name, so a subscriptions listing is an array of {"subscription": {...}}
    # and a client indexing straight into the item finds nothing.
    entry_style: wrapped
  error:
    # Every failure a public probe can reach comes from Rack rather than from
    # Maxio, and Rack writes a sentence. Maxio's own envelope -- an `errors`
    # array, which every documented failure uses -- is behind a working
    # credential and is recorded in the README rather than served, because
    # nothing here could check it.
    style: text
    message_field: "-"

resources:
  subscription:
    id:
      field: id
      style: numeric
    fields:
      state:
        type: string
        default: active
      balance_in_cents:
        type: integer
        default: 0
      current_period_ends_at:
        type: datetime
      created_at:
        type: datetime
      cancel_at_end_of_period:
        type: boolean
        default: false
      customer_id:
        type: integer

routes:
  - method: GET
    path: /subscriptions.json
    resource: subscription
    operation: list
    pagination:
      style: page
      limit: 20
      max_limit: 200
      limit_param: per_page
      cursor_param: page

errors:
  basic_access_denied:
    status: 401
    # Rack::Auth::Basic's own sentence, answering above the application, so
    # Maxio's documented JSON error envelope is never reached on this path.
    # Served as text with the content type the real response declares, which
    # is the whole finding.
    style: text
    message: "HTTP Basic: Access denied."
    headers:
      Content-Type: application/json

fixtures:
  empty:
    subscription: []

  site:
    subscription:
      - id: 39104772
        state: active
        balance_in_cents: 0
        current_period_ends_at: "2026-10-01T00:00:00-04:00"
        created_at: "2026-04-01T13:22:10-04:00"
        cancel_at_end_of_period: false
        customer_id: 55210331
      - id: 39104773
        # Cancelled at the end of the period rather than now, so the state is
        # still active and the subscription is still billing. Two fields have
        # to agree before a client can say whether somebody is a customer.
        state: active
        balance_in_cents: 4900
        current_period_ends_at: "2026-09-18T00:00:00-04:00"
        created_at: "2026-06-18T09:05:44-04:00"
        cancel_at_end_of_period: true
        customer_id: 55210332

conformance:
  - name: a refusal is a sentence declared as JSON
    source: https://subdomain.chargify.com/subscriptions.json
    verified: "2026-09-07"
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers: {}
    expect:
      status: 401
      headers:
        # Struck live. The body below is not JSON, not even a quoted string,
        # and this header says it is -- so a client doing the correct thing
        # parses it and throws.
        Content-Type: application/json
      body_matches: '^HTTP Basic: Access denied\.'

  - name: a wrong credential is the same sentence
    source: https://subdomain.chargify.com/subscriptions.json
    verified: "2026-09-07"
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        # not-a-key as the username and x as the password, which is Maxio's
        # documented shape.
        Authorization: "Basic bm90LWEta2V5Ong="
    expect:
      status: 401
      body_matches: '^HTTP Basic: Access denied\.'

  - name: the sentence is the middleware rather than the product
    source: https://subdomain.chargify.com/subscriptions.json
    verified: "2026-09-07"
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers: {}
    expect:
      status: 401
      body_matches: 'HTTP Basic'

  - name: every record is wrapped under its own singular name
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
    expect:
      status: 200
      body:
        # A bare array whose items are each an object with one key. Indexing
        # straight into the item finds nothing; the id is two levels down.
        '[0].subscription.id': 39104772
        '[0].subscription.state': active

  - name: a cancelling subscription is still active
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
    expect:
      status: 200
      body:
        # state says active and cancel_at_end_of_period says it ends. Two
        # fields have to agree before a client can answer "is this person a
        # customer", and only one of them is called state.
        '[1].subscription.state': active
        '[1].subscription.cancel_at_end_of_period': true

  - name: money is an integer of cents
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
    expect:
      status: 200
      body:
        # 4900, and the field name says so. Which is the right decision, and
        # it is the only currency hint on the record -- there is no currency
        # field beside it.
        '[1].subscription.balance_in_cents': 4900
        '[0].subscription.balance_in_cents': 0

  - name: timestamps carry a fixed offset rather than UTC
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
    expect:
      status: 200
      body:
        # -04:00, the site's own timezone, so two Maxio sites answer different
        # offsets for the same instant and a client comparing strings rather
        # than instants gets the order wrong.
        '[0].subscription.created_at': "2026-04-01T13:22:10-04:00"
        '[0].subscription.current_period_ends_at': "2026-10-01T00:00:00-04:00"

  - name: subscriptions page on page and per_page
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: site
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
      query:
        page: "2"
        per_page: "1"
    expect:
      status: 200
      body:
        '[0].subscription.id': 39104773
        '[0].subscription.customer_id': 55210332

  - name: a site with no subscriptions answers an empty array
    source: https://developers.maxio.com/http/advanced-billing/tag/Subscriptions
    fixture: empty
    request:
      method: GET
      path: /subscriptions.json
      headers:
        Authorization: "Basic Y2F1bGRyb25tYXhpb2ZpeHR1cmVrZXkwMDAwMDA6eA=="
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
