# Exoscale Recipe for Cauldron
#
# Written against Exoscale's own OpenAPI 3.0 document, served by Exoscale at
# openapi-v2.exoscale.com/source.json -- 261 paths, version 2.0.0 -- read on
# 2026-09-06. Every endpoint needs a signed request against a real account, so
# nothing here is verified live: every claim is the provider's own document.
#
# **The word "security" appears zero times in the whole document.**
#
# No `securitySchemes`. No top-level `security`. No per-operation `security`.
# Not one occurrence of the string in a megabyte of JSON describing an API that
# provisions machines, networks and firewall rules.
#
# Exoscale does authenticate -- an `EXO2-HMAC-SHA256` signature over the request
# -- and a request signature is genuinely awkward to express in OpenAPI, which
# has no vocabulary for "sign these headers with this key". So this is a third
# reason for the same absence, and the three are worth holding together:
#
#   Argo CD   declares none, and needs a bearer token. An omission.
#   Cilium    declares none, and needs none: a root-owned unix socket. Correct.
#   Exoscale  declares none, and needs a signature OpenAPI cannot describe.
#
# Three documents identical on this point, meaning three different things. A
# scan for "APIs with no declared authentication" finds all three and can rank
# none of them.
#
# **286 of 303 schemas have a hyphen in their name, and so do their fields.**
#
# `security-group`, `security-group-rule`, `external-sources`, `start-port`,
# `end-port`, `flow-direction`, and the listing key `security-groups`.
#
# `body.security-groups` is a subtraction in JavaScript, not a property access.
# It has to be `body["security-groups"]` everywhere, in every language whose
# generated struct fields cannot contain a hyphen -- so a generated client
# renames all of them, and every generator renames them differently.
#
# **`writeOnly` appears exactly once, and it is on the firewall rules.**
#
# One occurrence in a megabyte, against 169 uses of `readOnly`. It is on
# `security-group.rules`:
#
#   rules:
#     type: array
#     writeOnly: true
#     description: Security Group rules
#
# `writeOnly` means "may be sent, is never returned". So a listing of security
# groups tells you the groups exist and nothing about what they permit. Auditing
# what a firewall actually allows takes a second request per group, and the
# field is there in the schema to be read as though it were not.
#
# This is the exact opposite of the Coolify Recipe in this collection, whose
# document uses `writeOnly` nowhere and declares a password on a response. Both
# are one keyword away from the other's problem.
#
# **A GET returns a machine's password.**
#
#   GET /instance/{id}:password
#   "Reveal the password used during instance creation or the latest password
#    reset."
#
# The password is not in the URL, so the URL itself is safe. The response body
# is not: a GET is the method every cache, proxy and client library treats as
# storable by default, and this one's body is a credential. Whether Exoscale
# sends `Cache-Control: no-store` is not in the document -- the document
# describes the body and says nothing about caching it.
#
# **Thirty-four paths put the verb after a colon.**
#
#   /instance/{id}:password        /instance-pool/{id}:scale
#   /instance/{id}:create-snapshot /private-network/{id}:attach
#   /block-storage/{id}:attach     /instance/{id}:resize-disk
#
# Google's AIP convention. The colon separates the identifier from the action
# inside one path segment, so a client that URL-encodes the whole segment
# encodes the colon too and asks for a resource whose id ends in `%3Ascale`.
# The Cilium Recipe here has colons in the same position meaning the opposite
# thing -- there they separate a namespace from an identifier.
#
# **There is no single base URL.** The server is
# `https://api-{zone}.exoscale.com/v2` with eight zones in the enum and no
# default host -- so the zone is in the hostname, a client must know it before
# it can make any request at all, and resources in different zones are on
# different origins with no cross-zone listing.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Every endpoint needs a
#     signed request against a real account.
#   - Security groups, listed and fetched. 261 paths is a cloud: instances,
#     pools, load balancers, block storage, private networks, DNS, SKS
#     clusters and the whole DBaaS surface each want their own evidence.
#   - The credential is checked as a bearer token, which Exoscale does not use.
#     Reproducing EXO2-HMAC-SHA256 would mean implementing a signature scheme
#     to demonstrate that the document does not describe it, and what the
#     Recipe needs is that a credential is required at all.
#   - `rules` is not served on the listing, which is the finding. It is not
#     served on the fetch either, because `writeOnly` means never returned --
#     so this Recipe has no route that shows a rule, and the rule shape is
#     recorded in the header instead.

recipe: exoscale
capability: infrastructure
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://openapi-v2.exoscale.com/
  spec: https://openapi-v2.exoscale.com/source.json
  spec_hash: 1e9f496d7ab1ce28bc8e4d6178443b2a8f3908c504cd9d2859aef8450fff806a
  spec_seen: "2026-09-06"

auth:
  # Not what Exoscale uses. It signs requests with EXO2-HMAC-SHA256, which the
  # document does not describe because OpenAPI has no vocabulary for it. What
  # is modelled here is that a credential is required at all.
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - EXO0000000000000000cauldron
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    # Hyphenated, like 286 of the 303 schema names in this document.
    key: security-groups
  error:
    style: flat
    message_field: message

resources:
  security-group:
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      # Also hyphenated, and an array of CIDR strings.
      external-sources:
        type: list
      # rules is declared writeOnly upstream, so it is deliberately absent
      # from every response this Recipe serves. Declaring it here with in: "-"
      # says it exists and never comes back.
      rules:
        type: list
        in: "-"

routes:
  - method: GET
    path: /v2/security-group
    resource: security-group
    operation: list
    pagination:
      # None. One query parameter -- visibility -- and nothing that bounds the
      # response.
      style: none

  - method: GET
    path: /v2/security-group/{id}
    resource: security-group
    operation: get
    not_found: not_found

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
  not_found:
    status: 404
    message: "Security Group not found"
  invalid:
    status: 400
    message: "Invalid request: name is required"
  rate_limit:
    status: 429
    message: "Too many requests"

fixtures:
  empty:
    security-group: []

  account:
    security-group:
      - id: 9c1b7f3e-2a4d-4b6c-8e0f-1a2b3c4d5e6f
        name: default
        description: Default Security Group
        external-sources: []
      - id: 3e5a8c2d-7f1b-4e9a-b0c3-4d5e6f7a8b9c
        name: web
        description: Public web servers
        # CIDRs, as strings, in a hyphenated field.
        external-sources:
          - 0.0.0.0/0
          - ::/0

conformance:
  - name: the listing key is hyphenated, like almost every name here
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 200
      body:
        # body.security-groups is a subtraction in JavaScript. It has to be
        # body["security-groups"], and 286 of the 303 schemas in this document
        # are named the same way -- so every generated client renames all of
        # them, and every generator renames them differently.
        'security-groups[0].name': default
        'security-groups[1].name': web

  - name: a listing tells you the groups exist and not what they permit
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 200
      absent:
        # `rules` is the one field in a megabyte of document marked
        # writeOnly -- may be sent, never returned. So auditing what a
        # firewall actually allows cannot be done from this endpoint, and the
        # field is in the schema to be read as though it could.
        - 'security-groups[0].rules'
        - 'security-groups[1].rules'
      body:
        'security-groups[1].description': Public web servers

  - name: the fetch does not return the rules either
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group/3e5a8c2d-7f1b-4e9a-b0c3-4d5e6f7a8b9c
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 200
      body:
        name: web
        # The external sources do come back -- an array of CIDR strings under
        # a hyphenated name -- so a caller learns which networks the group
        # references and not which ports it opens to them.
        'external-sources[0]': 0.0.0.0/0
        'external-sources[1]': ::/0
      absent:
        - rules

  - name: an empty external-sources is an array, not an absence
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group/9c1b7f3e-2a4d-4b6c-8e0f-1a2b3c4d5e6f
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 200
      body:
        name: default
        description: Default Security Group
        # Empty rather than missing, so a client can tell "references no
        # external network" from "the field was not returned" -- which it
        # cannot do for rules.
        external-sources: []

  - name: no credential is refused, though the document declares no scheme
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group
      headers: {}
    expect:
      # The document contains the string "security" zero times: no
      # securitySchemes, no security, nothing per-operation. Exoscale signs
      # requests with EXO2-HMAC-SHA256, which OpenAPI has no vocabulary for.
      # A client generated from this document sends nothing and gets this.
      status: 401
      body:
        message: "Unauthorized"

  - name: a missing group says so in these words
    source: https://openapi-v2.exoscale.com/source.json
    fixture: account
    request:
      method: GET
      path: /v2/security-group/00000000-0000-4000-8000-000000000000
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 404
      body:
        message: "Security Group not found"

  - name: "an invalid request says so in these words"
    source: "https://openapi-v2.exoscale.com/source.json"
    arm: invalid
    fixture: account
    request:
      method: GET
      path: /v2/security-group
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 400
      body:
        message: "Invalid request: name is required"

  - name: "the rate limit says so in these words"
    source: "https://openapi-v2.exoscale.com/"
    arm: rate_limit
    fixture: account
    request:
      method: GET
      path: /v2/security-group
      headers:
        Authorization: Bearer EXO0000000000000000cauldron
    expect:
      status: 429
      body:
        message: "Too many requests"
