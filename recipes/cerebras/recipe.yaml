# Cerebras Recipe for Cauldron
#
# The models listing, read from Cerebras's own API reference, and struck live
# against api.cerebras.ai on 2026-09-13 with no credential, with a deliberately
# invalid one, and on a path that does not exist.
#
# **The two credential failures are the wrong way round.** Struck live:
#
#   (no header)      403 {"detail":"Not authenticated"}
#   Bearer notreal   401 {"message":"Wrong API Key","type":"invalid_request_error",
#                         "param":"api_key","code":"wrong_api_key"}
#
# 401 means "tell me who you are" and 403 means "I know, and you may not".
# Cerebras answers 403 to the caller who has said nothing and 401 to the one
# whose credential it read and rejected. Its own error table agrees with the
# RFC and not with the API: it lists 401 as `AuthenticationError` and 403 as
# `PermissionDeniedError`.
#
# **And they come from two different frameworks.** `{"detail": "..."}` is
# FastAPI's default shape; `{"message","type","param","code"}` is OpenAI's. So
# one layer answers the unauthenticated caller and another answers the
# authenticated-but-wrong one, and a client needs two readers -- `detail` on one
# and `message` on the other -- to print either.
#
# **`param` names something that is not a parameter.** OpenAI's `param` field
# identifies the offending *request parameter*; here it says `api_key`, which
# travels in a header. So the field pointing at what to fix points at a
# parameter the request does not have.
#
# **An unrouted path answers 404 with nothing in it.** Zero bytes, labelled
# `text/plain`. A client calling `.json()` throws; one reading `.text` gets an
# empty string; and the status is the only thing in the response.
#
# **Every model was created at the epoch.** `created` is documented as "the Unix
# timestamp (in seconds) of when the model was created", and the reference's own
# example gives `0` for every model in it. The field exists because OpenAI's
# does, and it says 1 January 1970 for all of them.
#
# **The listing has no envelope beyond a discriminator.** `{"object": "list",
# "data": [...]}` -- no count, no cursor, no has_more, and no parameters on the
# operation to ask for any. The whole catalogue, every time.

recipe: cerebras
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://inference-docs.cerebras.ai/api-reference/models/list-models
  # No spec: Cerebras documents this API as field tables and worked examples,
  # each page also answering Markdown at the same address with `.md` appended.
  # There is no OpenAPI document at any address this Recipe could find.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - csk-cauldr0nf1xturek3yn0treal
  # The caller who said nothing gets the permission failure, and the caller
  # whose key was read gets the authentication failure.
  absent_error: not_authenticated
  rejected_error: wrong_api_key
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    fields:
      # The only thing in the envelope besides the records.
      object: list
  error:
    # OpenAI's shape, which is what the application answers.
    style: flat
    message_field: message
    code_field: code
    code_type: string
    type_field: type

resources:
  model:
    id:
      field: id
      style: opaque
      length: 12
    constants:
      object: model
    fields:
      # Documented as when the model was created, and 0 in the reference's own
      # example for every model in it.
      created:
        type: integer
      owned_by:
        type: string

routes:
  - method: GET
    path: /v1/models
    resource: model
    operation: list
    pagination:
      # None declared and none offered: the operation takes no parameters.
      style: none

errors:
  not_authenticated:
    # 403 for a caller who has not said who they are, which is backwards, and
    # backwards from this API's own error table.
    status: 403
    # FastAPI's default shape: one key, and not the one the other failure uses.
    message_field: detail
    code_field: "-"
    type_field: "-"
    message: Not authenticated

  wrong_api_key:
    status: 401
    code: wrong_api_key
    type: invalid_request_error
    message: Wrong API Key
    fields:
      # OpenAI's field for the offending request parameter, naming a header.
      param: api_key

  unknown_route:
    status: 404
    # Zero bytes, labelled as text.
    empty: true
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    model: []

  catalogue:
    model:
      - id: gpt-oss-120b
        # The epoch, on both of them, as the reference's own example has it.
        created: 0
        owned_by: Cerebras
      - id: qwen-3.8-27b
        created: 0
        owned_by: Cerebras

conformance:
  - name: a caller who says nothing gets the permission failure
    source: https://api.cerebras.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      # 403, where this API's own error table calls 403 PermissionDeniedError
      # and 401 AuthenticationError.
      status: 403
      body:
        # FastAPI's key, which the other failure does not use.
        detail: Not authenticated

  - name: a caller whose key was read gets the authentication failure
    source: https://api.cerebras.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # OpenAI's four keys, from a different layer than the 403 above.
        message: Wrong API Key
        type: invalid_request_error
        code: wrong_api_key
        # The field for the offending request parameter, naming a header.
        param: api_key

  - name: an unrouted path answers nothing at all
    source: https://api.cerebras.ai/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      # Zero bytes. .json() throws and .text is empty.
      no_body: true

  - name: the catalogue is a discriminator and an array
    source: https://inference-docs.cerebras.ai/api-reference/models/list-models
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer csk-cauldr0nf1xturek3yn0treal"
    expect:
      status: 200
      body:
        # No count, no cursor, no has_more, and nothing to ask for one with.
        object: list
        'data[0].id': gpt-oss-120b
        'data[0].object': model

  - name: every model was created at the epoch
    source: https://inference-docs.cerebras.ai/api-reference/models/list-models
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer csk-cauldr0nf1xturek3yn0treal"
    expect:
      status: 200
      body:
        # Documented as when the model was created. The reference's own
        # example says 1 January 1970 for all of them.
        'data[0].created': 0
        'data[1].created': 0
        'data[0].owned_by': Cerebras
        'data[1].owned_by': Cerebras
        'data[1].id': qwen-3.8-27b

  - name: an account with no models still sends the discriminator
    source: https://inference-docs.cerebras.ai/api-reference/models/list-models
    fixture: empty
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: "Bearer csk-cauldr0nf1xturek3yn0treal"
    expect:
      status: 200
      body:
        object: list
        data: []
