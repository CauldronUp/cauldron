# Val Town Recipe for Cauldron
#
# The vals listing, read from the OpenAPI document Val Town serves without a
# credential at api.val.town/openapi.json, and struck live against api.val.town
# on 2026-09-13 with no credential, with a deliberately invalid one, on a path
# that does not exist, and on a val id that does not exist.
#
# **Two required parameters, both with defaults.** `GET /v2/me/vals` declares
# `offset` and `limit` as `required: true`, and gives each a `default` -- 0 and
# 20. A required parameter can never be absent, and a default only applies when
# one is; so the defaults in this document can never take effect, and a
# generated client is obliged to send both on every call.
#
# **The endpoint that fetches a val declares no security at all.** `/v2/me/vals`
# carries `security: [{bearerAuth: []}]`; `/v2/vals/{val_id}` carries
# `security: null`, on a resource whose own `privacy` enum has `private` in it.
# Struck live, an anonymous request for an id that does not exist answers 404
# rather than 401, so the lookup really does run before any credential check.
#
# **And the val it cannot find is called a Project.** Struck live:
#
#   /v2/vals/00000000-0000-0000-0000-000000000000   404 {"error":"Project could not be found"}
#
# The noun in the error is the old one. The document still carries a `Project`
# schema beside `Val`, so the rename reached the types and not the sentences.
#
# **There are two error shapes, from two layers.** Struck live:
#
#   /v2/me/vals         401 {"error":"Unauthorized"}
#   /v1/cauldron-nope   404 {"message":"Route GET:/v1/cauldron-nope not found","error":"Not Found","statusCode":404}
#
# The application answers one key. Fastify underneath it answers three, and
# reuses `error` for a reason phrase where the application uses it for the whole
# sentence. So `body.error` is "Unauthorized" on one failure and "Not Found" on
# the other, with the actual explanation moved to `message`.
#
# **Neither 401 is declared.** The listing operation lists exactly one
# response, 200, while declaring a bearer credential -- so the first thing a
# caller meets is absent from the description. And a missing credential and a
# wrong one answer the same word, so they cannot be told apart.
#
# **`username` is required and nullable.** Every val carries an `author`, every
# author must carry a `username`, and that username is `anyOf: [string, null]`.
# The field naming who wrote it is guaranteed to be present and permitted to
# say nothing. `imageUrl` and `description` are required and nullable too, so
# three of the record's eight required fields guarantee a key rather than a
# value.
#
# **`author.type` is two single-value enums instead of one enum.** The schema is
# `anyOf: [{enum: ["user"]}, {enum: ["org"]}]` where `enum: ["user", "org"]`
# says the same thing -- so a generator emits a union of two string literal
# types for a field with two values.
#
# **And `unlisted` is documented as security by link.** The privacy enum's own
# description: "Unlisted resources do not appear on profile pages or elsewhere,
# but you can link to them."
#
# **The document's version is "1" and it describes two.** `info.version` is the
# string `1`, over paths under both `/v1` and `/v2`, including two different
# shapes of the same val.

recipe: valtown
capability: hosting
version: 0.1.0

upstream:
  api: "1"
  docs: https://docs.val.town/openapi
  spec: https://api.val.town/openapi.json
  spec_hash: df9fd15253a91b7e74cf17b6e0530eb0fd302327bb86984f1c0a5767a57b0efc
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n_valt0wn_f1xture
  # One word for both states, so a missing token and a wrong one are the same
  # answer.
  absent_error: unauthorized
  rejected_error: unauthorized
  # An unrouted path answers Fastify's 404 rather than the credential failure.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    # Whole URLs, in a links object that also carries the current page.
    cursor_field: links.next
    cursor_url: absolute
    prev_field: links.prev
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  val:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      createdAt:
        type: datetime
      # public, unlisted or private -- and the endpoint that serves one
      # declares no credential.
      privacy:
        type: string
      # Required, and its username may be null.
      author:
        type: map
      links:
        type: map
      # Required and nullable, both of them: the key is guaranteed and the
      # value is not.
      imageUrl:
      description:

routes:
  - method: GET
    path: /v2/me/vals
    resource: val
    operation: list
    pagination:
      style: offset
      limit: 20
      max_limit: 100
      # Both declared required, and both given a default that can therefore
      # never apply.
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /v2/vals/{id}
    resource: val
    operation: get
    # security: null in the document, on a resource whose privacy enum
    # includes "private" -- and the live 404 for an unknown id arrives without
    # a credential, so the lookup really does precede the check.
    public: true
    not_found: val_not_found

errors:
  unauthorized:
    status: 401
    # The whole sentence, in a field the layer below uses for a reason phrase.
    message: Unauthorized

  val_not_found:
    status: 404
    # The old noun. The document still carries a Project schema beside Val.
    message: Project could not be found

  unknown_route:
    status: 404
    # Fastify's shape, not the application's: three keys, and `error` demoted
    # to a reason phrase with the explanation moved to `message`.
    message_field: message
    message: "Route GET:/v1/cauldron-nope not found"
    fields:
      error: Not Found
      statusCode: 404

fixtures:
  empty:
    val: []

  account:
    val:
      - id: 8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
        name: hello-world
        createdAt: "2026-02-20T14:45:54.230Z"
        privacy: public
        author:
          type: user
          id: 2c6b9a4a-2b9c-4d3f-9e21-2a6b6a2f0b3d
          username: cauldron
        links:
          self: https://api.val.town/v2/vals/8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
          html: https://www.val.town/x/cauldron/hello-world
        imageUrl: null
        description: The one every account starts with.
      - id: 9d1a6c3e-1f2b-4a5d-9c3e-6a2b1d4f0e7a
        name: nightly-rollup
        createdAt: "2026-05-02T09:00:07.541Z"
        # Linked-to but not listed anywhere, by design.
        privacy: unlisted
        author:
          type: org
          id: 57350688-5a28-49d1-b5a9-086ae0d4c0d2
          # Required by the schema, and permitted to be null by it.
          username: null
        links:
          self: https://api.val.town/v2/vals/9d1a6c3e-1f2b-4a5d-9c3e-6a2b1d4f0e7a
          html: https://www.val.town/x/nightly-rollup
        imageUrl: null
        description: null

conformance:
  - name: a missing token and a wrong one are the same word
    source: https://api.val.town/v2/me/vals
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers: {}
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: a wrong token says nothing more
    source: https://api.val.town/v2/me/vals
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Indistinguishable from the case above, and undeclared by the
        # document, which lists only a 200 for this operation.
        error: Unauthorized

  - name: the framework underneath answers a different shape
    source: https://api.val.town/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 404
      body:
        # `error` is a reason phrase here and the whole sentence on the 401,
        # with the explanation moved into a key the application never sends.
        error: Not Found
        statusCode: 404
        message: "Route GET:/v1/cauldron-nope not found"

  - name: a val that is not there is called a Project
    source: https://api.val.town/v2/vals/00000000-0000-0000-0000-000000000000
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/vals/00000000-0000-0000-0000-000000000000
      headers: {}
    expect:
      # No credential, and the answer is the lookup rather than the refusal:
      # the operation declares security: null.
      status: 404
      body:
        error: Project could not be found

  - name: fetching a val needs no credential at all
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/vals/8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
      headers: {}
    expect:
      status: 200
      body:
        # On a resource whose own privacy enum has "private" in it.
        id: 8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
        name: hello-world
        privacy: public

  - name: the author is required and its username is nullable
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "20"
    expect:
      status: 200
      body:
        'data[0].author.username': cauldron
        # Required by the schema, and null. The field naming who wrote it is
        # guaranteed present and permitted to say nothing.
        'data[1].author.username': null
        'data[1].author.type': org
        'data[0].author.type': user

  - name: three required fields guarantee a key rather than a value
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "20"
    expect:
      status: 200
      body:
        'data[0].imageUrl': null
        'data[1].imageUrl': null
        'data[1].description': null
        'data[0].description': The one every account starts with.

  - name: unlisted is a privacy setting you can link past
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "20"
    expect:
      status: 200
      body:
        'data[0].privacy': public
        # "do not appear on profile pages or elsewhere, but you can link to
        # them", in the enum's own description.
        'data[1].privacy': unlisted
        'data[1].name': nightly-rollup
        'data[0].createdAt': "2026-02-20T14:45:54.230Z"

  - name: every val carries two URLs for itself
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "20"
    expect:
      status: 200
      body:
        'data[0].links.self': https://api.val.town/v2/vals/8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
        'data[0].links.html': https://www.val.town/x/cauldron/hello-world

  - name: the page carries its own links object
    source: https://api.val.town/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "1"
    expect:
      status: 200
      body:
        'data[0].id': 8f14e45f-ceea-467e-adc1-5c1b1a3a7b3b
      matches:
        # A whole URL, in a links object that sits beside the records and is
        # spelled the same way each record's own links object is.
        'links.next': '^https?://'

  - name: an account with no vals still sends the envelope
    source: https://api.val.town/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v2/me/vals
      headers:
        Authorization: "Bearer cauldr0n_valt0wn_f1xture"
      query:
        offset: "0"
        limit: "20"
    expect:
      status: 200
      body:
        data: []
