# Tinify Recipe for Cauldron
#
# The compression endpoint, read from Tinify's published HTTP reference at
# tinify.com/developers/reference, and struck live against api.tinify.com on
# 2026-09-13 with no credential, with a wrong one, with a malformed body, and
# on a path that does not exist.
#
# **One endpoint, two documented responses, and they share no keys.** The
# reference prints `POST /shrink` twice on the same page. Uploading a file:
#
#   HTTP/1.1 201 Created
#   {"input": {"size": 207565, "type": "image/jpeg"}}
#
# Pointing at a URL:
#
#   HTTP/1.1 201 Created
#   {"output": {"size": 30734, "type": "image/png"}}
#
# Same method, same path, same status -- and a client reading `body.output.size`
# gets nothing from the first, while one reading `body.input.size` gets nothing
# from the second. Whichever half of the page a reader implements against is the
# half that works.
#
# **The result is not in the body.** The address of the compressed image is the
# `Location` header. A client that parses JSON and ignores headers has the sizes
# and no way to fetch the thing it just paid to make.
#
# **And the bill is a header too.** `Compression-Count` carries the account's
# running monthly usage on every response, so the number the plan is priced on
# is only ever visible to code that reads response headers.
#
# **Image dimensions are headers as well.** The download answers
# `Image-Width: 530` and `Image-Height: 300` beside the bytes, because the body
# is the image and there is nowhere else to put them.
#
# **The body is validated before the credential.** Struck live, with no
# credential at all:
#
#   {"x":1}                          400  request body requires key 'source'; request body has unknown key 'x'
#   {"source":{"url":"..."}}         401  Credentials are invalid.
#
# An anonymous caller can enumerate the request schema one key at a time: the
# validator names the required key and names the unknown one, and only a
# well-formed request gets as far as being refused.
#
# **"Credentials are invalid" is what you are told for sending none.** The 401
# above was answered to a request with no `Authorization` header on it.
#
# **A real path with the wrong method does not exist.** `GET /shrink` and
# `GET /cauldron-nope` answer the identical body:
# `{"error":"Not found","message":"This endpoint does not exist."}` -- so the
# endpoint that exists reports that it does not.
#
# **And the `error` field is a reason phrase, mis-cased.** `"Unauthorized"`,
# `"Bad request"`, `"Not found"`: HTTP's own titles, two of the three in a
# capitalisation the standard does not use, in the field a client would switch
# on.

recipe: tinify
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://tinify.com/developers/reference
  # No spec: Tinify documents this API as a reference page of worked HTTP
  # exchanges. There is no machine-readable description at any address this
  # Recipe could find, and the two response bodies below are that page's own.

auth:
  # Basic, with a constant username: "a Base64 digest of the authentication
  # string api:YOUR_API_KEY".
  scheme: basic
  credential: password
  keys:
    - cauldr0nf1xturek3y000000000000000
  # The same sentence for a credential that was never sent.
  absent_error: credentials_invalid
  rejected_error: credentials_invalid
  after_routing: true

responses:
  error:
    style: flat
    message_field: message
    # HTTP's own reason phrases, in the field a client switches on.
    code_field: error

resources:
  shrink:
    id:
      # Never in either body: the identifier is a path segment of the
      # Location header, and nothing else.
      field: "-"
      style: opaque
      length: 16
    fields:
      # What the reference's URL-source example answers with, and nothing else.
      output:
        type: map
      # What the reference's file-upload example answers with, and nothing
      # else.
      input:
        type: map
      # The image to compress: required on the way in, and on the way out it
      # is not there at all, in either of the two documented bodies.
      source:
        type: map
        required: true
        in: "-"

routes:
  - method: POST
    path: /shrink
    # The JSON form, which the reference answers with "output".
    matches_header:
      Content-Type: application/json
    resource: shrink
    operation: create
    status: 201
    returns:
      - output
    fields:
      # Server-supplied: the caller sends a source and gets back a size.
      output:
        size: 30734
        type: image/png
    headers:
      # The address of the result, which is not in the body.
      Location: https://api.tinify.com/output/cciutldm823k9e9r
      # And the running bill, which is not in the body either.
      Compression-Count: "1"

  - method: POST
    path: /shrink
    # The binary form, which the same page answers with "input".
    resource: shrink
    operation: create
    status: 201
    returns:
      - input
    fields:
      input:
        size: 207565
        type: image/jpeg
    headers:
      Location: https://api.tinify.com/output/2xnsp7jn34e5
      Compression-Count: "1"

errors:
  credentials_invalid:
    status: 401
    code: Unauthorized
    # Said to a request carrying no credential at all.
    message: Credentials are invalid.

  parameter_missing:
    status: 400
    # Not "Bad Request", which is what the standard calls it.
    code: Bad request
    message: "Request is invalid: request body requires key '{detail}'."

  unknown_route:
    status: 404
    code: Not found
    message: This endpoint does not exist.

  method_not_allowed:
    # The path that does exist, reporting that it does not.
    status: 404
    code: Not found
    message: This endpoint does not exist.

fixtures:
  empty:
    shrink: []

  panda:
    shrink:
      - source:
          url: https://tinypng.com/images/panda-happy.png
        output:
          size: 30734
          type: image/png
        input:
          size: 207565
          type: image/jpeg

conformance:
  - name: a credential that was never sent is invalid
    source: https://api.tinify.com/shrink
    verified: "2026-09-13"
    fixture: panda
    request:
      method: POST
      path: /shrink
      headers:
        Content-Type: application/json
      json:
        source:
          url: https://tinypng.com/images/panda-happy.png
    expect:
      status: 401
      body:
        # A well-formed body with no Authorization header at all.
        message: Credentials are invalid.
        # HTTP's reason phrase, in the field a client switches on.
        error: Unauthorized

  - name: a wrong credential is refused in the same words
    source: https://api.tinify.com/shrink
    verified: "2026-09-13"
    fixture: panda
    request:
      method: POST
      path: /shrink
      headers:
        Content-Type: application/json
        Authorization: "Basic YXBpOm5vdGFyZWFsa2V5"
      json:
        source:
          url: https://tinypng.com/images/panda-happy.png
    expect:
      status: 401
      body:
        message: Credentials are invalid.
        error: Unauthorized

  - name: the endpoint that exists reports that it does not
    source: https://api.tinify.com/shrink
    verified: "2026-09-13"
    fixture: panda
    request:
      method: GET
      path: /shrink
      headers: {}
    expect:
      # A real path, a wrong method, and a body that denies the path.
      status: 404
      body:
        message: This endpoint does not exist.
        error: Not found

  - name: an unrouted path is denied in exactly the same words
    source: https://api.tinify.com/cauldron-nope
    verified: "2026-09-13"
    fixture: panda
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # Byte-identical to the failure above, so a typo in the verb and a
        # typo in the path are the same answer.
        message: This endpoint does not exist.
        error: Not found

  - name: a missing key is named back and the title is mis-cased
    source: https://api.tinify.com/shrink
    verified: "2026-09-13"
    fixture: panda
    request:
      method: POST
      path: /shrink
      headers:
        Content-Type: application/json
        Authorization: "Basic YXBpOmNhdWxkcjBuZjF4dHVyZWszeTAwMDAwMDAwMDAwMDAwMA=="
      json: {}
    expect:
      status: 400
      body:
        # The validator names the key it wanted.
        message: "Request is invalid: request body requires key 'source'."
        # "Bad request", where HTTP says "Bad Request".
        error: Bad request

  - name: the JSON form answers with output and no input
    source: https://tinify.com/developers/reference
    fixture: panda
    request:
      method: POST
      path: /shrink
      headers:
        Content-Type: application/json
        Authorization: "Basic YXBpOmNhdWxkcjBuZjF4dHVyZWszeTAwMDAwMDAwMDAwMDAwMA=="
      json:
        source:
          url: https://tinypng.com/images/panda-happy.png
    expect:
      status: 201
      body:
        'output.size': 30734
        'output.type': image/png
      absent:
        # The other half of the same page's answer.
        - input
      headers:
        # The result, and the bill, both outside the body.
        Location: https://api.tinify.com/output/cciutldm823k9e9r
        Compression-Count: "1"

  - name: the binary form answers with input and no output
    source: https://tinify.com/developers/reference
    fixture: panda
    request:
      method: POST
      path: /shrink
      headers:
        Content-Type: image/jpeg
        Authorization: "Basic YXBpOmNhdWxkcjBuZjF4dHVyZWszeTAwMDAwMDAwMDAwMDAwMA=="
      json:
        source:
          url: https://tinypng.com/images/panda-happy.png
    expect:
      status: 201
      body:
        # The same method, the same path, the same status, and the other key.
        'input.size': 207565
        'input.type': image/jpeg
      absent:
        - output
      headers:
        Location: https://api.tinify.com/output/2xnsp7jn34e5
        Compression-Count: "1"
