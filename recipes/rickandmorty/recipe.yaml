# Rick and Morty API Recipe for Cauldron
#
# Asking for a character by a name instead of a number is a 500.
#
#   GET /api/character/abc
#   ->  500 {"error": "Hey! you must provide an id"}
#
# A caller mistake, reported as a server fault. Everything that watches for 5xx
# sees one: the retry wrapper retries, the alert fires, the error budget moves,
# and the dashboard records an outage. The request was never going to work and
# retrying it will not help. The 404 beside it -- for a number that is simply
# not a character -- is the correct status, so the API can produce the right
# answer and does not for the wrong input.
#
# **And "unknown" is the only lowercase value in the enum.** status is "Alive",
# "Dead" or "unknown", so the one value meaning "we have no answer" is also the
# one that breaks a switch written from the other two.
#
# Written against the live API rather than a document: every case below was
# checked against rickandmortyapi.com on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. One object says "no value" two ways at once. On a character whose origin
#      is not known, origin.name is the string "unknown" and origin.url is the
#      empty string -- a word in one field and an absence in its neighbour,
#      inside the same two-key object.
#   2. Related records are URLs and not identifiers. episode is an array of
#      "https://rickandmortyapi.com/api/episode/10" and origin carries a url with
#      no id beside it, so joining anything means parsing an integer back out of
#      a string.
#   3. type is "" when a character has no sub-species and a sentence when it
#      does -- "Human with antennae" -- so the field is prose or nothing, and
#      nothing is spelled as a string.
#   4. Three failures carry three sentences and two statuses. A missing
#      character is "Character not found", a missing path is "There is nothing
#      here.", and a malformed id is "Hey! you must provide an id" -- the first
#      two 404 and the third 500, and only one of the three ends in a full stop.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two characters are served, not 826: one with everything filled in and one
#     with the unknowns, chosen so that both spellings of absence can be seen.
#   - Rick's episode list is 51 URLs and is trimmed to three. The finding is that
#     they are URLs, not how many there are.
#   - Only the character routes are modelled. Location, episode and the multiple-
#     id form answer other documents.

recipe: rickandmorty
capability: infrastructure
version: 0.1.0

upstream:
  api: rickandmorty
  docs: https://rickandmortyapi.com/documentation

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    style: wrapped
    key: results
    count_field: info.count
  resource:
    style: bare
  error:
    style: flat
    message_field: error

resources:
  character:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
      # "Alive", "Dead" or "unknown", and only the last is lowercase.
      status:
        type: string
      species:
        type: string
      # A sentence, or the empty string.
      type:
        type: string
      gender:
        type: string
      # {name, url}, where the url is "" if the name is "unknown".
      origin:
        type: map
      location:
        type: map
      image:
        type: string
      # URLs, not identifiers.
      episode:
        type: list
      # The record's own address, beside its id.
      url:
        type: string
      created:
        type: string

routes:
  - method: GET
    path: /api/character
    resource: character
    operation: list
    pagination:
      style: page
      limit: 20
      limit_param: limit
      cursor_param: page

  - method: GET
    path: /api/character/{id}
    resource: character
    operation: get
    not_found: character_not_found

errors:
  # The right status, for a number that is not a character.
  character_not_found:
    status: 404
    message: Character not found

  # The wrong one, for an id that is not a number. A caller mistake reported as
  # a server fault, so every 5xx alarm in the client fires on a request that was
  # never going to work.
  malformed_id:
    status: 500
    message: Hey! you must provide an id

  # And a third sentence, for a path that is not an endpoint. The only one of
  # the three that ends in a full stop.
  no_such_path:
    status: 404
    message: There is nothing here.

fixtures:
  empty: {}

  characters:
    character:
      # Everything filled in.
      - id: "1"
        name: Rick Sanchez
        # Capitalised.
        status: Alive
        species: Human
        # Empty, where the other character has a sentence.
        type: ""
        gender: Male
        origin:
          name: Earth (C-137)
          url: https://rickandmortyapi.com/api/location/1
        location:
          name: Citadel of Ricks
          url: https://rickandmortyapi.com/api/location/3
        image: https://rickandmortyapi.com/api/character/avatar/1.jpeg
        # Three of the real fifty-one, and every one a URL rather than an id.
        episode:
          - https://rickandmortyapi.com/api/episode/1
          - https://rickandmortyapi.com/api/episode/2
          - https://rickandmortyapi.com/api/episode/3
        url: https://rickandmortyapi.com/api/character/1
        created: "2017-11-04T18:48:46.250Z"

      # And the unknowns.
      - id: "19"
        name: Antenna Rick
        # Lowercase, alone among the enum's values.
        status: unknown
        species: Human
        # A sentence, where the other character has "".
        type: Human with antennae
        gender: Male
        origin:
          # A word saying there is no value...
          name: unknown
          # ...beside an absence saying the same thing differently.
          url: ""
        location:
          name: unknown
          url: ""
        image: https://rickandmortyapi.com/api/character/avatar/19.jpeg
        episode:
          - https://rickandmortyapi.com/api/episode/10
        url: https://rickandmortyapi.com/api/character/19
        created: "2017-11-04T22:28:13.756Z"

conformance:
  - name: an id that is not a number is a 500
    source: https://rickandmortyapi.com/api/character/abc
    verified: "2026-08-30"
    fixture: characters
    arm: malformed_id
    request:
      method: GET
      path: /api/character/1
    expect:
      # A caller mistake, reported as a server fault, so every 5xx alarm fires
      # on a request that was never going to work.
      status: 500
      body:
        error: Hey! you must provide an id

  - name: and a number that is not a character is a 404
    source: https://rickandmortyapi.com/api/character/9999
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/9999
    expect:
      # The correct status, from the same endpoint, so the API can produce it
      # and does not for the other kind of wrong input.
      status: 404
      body:
        error: Character not found

  - name: unknown is the only lowercase value in the enum
    source: https://rickandmortyapi.com/api/character/19
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/19
    expect:
      status: 200
      body:
        name: Antenna Rick
        # The one value meaning "we have no answer" is the one that breaks a
        # switch written from the other two.
        status: unknown

  - name: and the capitalised one on the other character
    source: https://rickandmortyapi.com/api/character/1
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/1
    expect:
      status: 200
      body:
        name: Rick Sanchez
        status: Alive
        species: Human
        gender: Male

  - name: one object says no value two ways at once
    source: https://rickandmortyapi.com/api/character/19
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/19
    expect:
      status: 200
      body:
        # A word in one field...
        "origin.name": unknown
        # ...and an absence in its neighbour, inside the same two-key object.
        "origin.url": ""
        "location.name": unknown
        "location.url": ""

  - name: a sub-species is a sentence or an empty string
    source: https://rickandmortyapi.com/api/character/19
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/19
    expect:
      status: 200
      body:
        # Prose, in a field that is "" on the character beside it.
        type: Human with antennae

  - name: related records are URLs and not identifiers
    source: https://rickandmortyapi.com/api/character/1
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/1
    expect:
      status: 200
      body:
        # An array of addresses, so joining means parsing an integer back out
        # of a string.
        "episode[0]": https://rickandmortyapi.com/api/episode/1
        "episode[2]": https://rickandmortyapi.com/api/episode/3
        # And a url with no id beside it.
        "origin.url": https://rickandmortyapi.com/api/location/1
        "origin.name": Earth (C-137)
        # While the record carries its own address as well as its id.
        id: 1
        url: https://rickandmortyapi.com/api/character/1
        created: "2017-11-04T18:48:46.250Z"
        image: https://rickandmortyapi.com/api/character/avatar/1.jpeg

  - name: the fields the other cases do not read
    source: https://rickandmortyapi.com/api/character/1
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/1
    expect:
      status: 200
      body:
        # Empty here, and a sentence on the character beside it.
        type: ""
        "location.name": Citadel of Ricks
        "location.url": https://rickandmortyapi.com/api/location/3
        "episode[1]": https://rickandmortyapi.com/api/episode/2

  - name: and the other character's
    source: https://rickandmortyapi.com/api/character/19
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character/19
    expect:
      status: 200
      body:
        id: 19
        species: Human
        gender: Male
        url: https://rickandmortyapi.com/api/character/19
        image: https://rickandmortyapi.com/api/character/avatar/19.jpeg
        created: "2017-11-04T22:28:13.756Z"
        "episode[0]": https://rickandmortyapi.com/api/episode/10

  - name: a path that is not an endpoint gets the third sentence
    source: https://rickandmortyapi.com/api/nope
    verified: "2026-08-30"
    fixture: characters
    arm: no_such_path
    request:
      method: GET
      path: /api/character/1
    expect:
      # The only one of the three sentences that ends in a full stop.
      status: 404
      body:
        error: There is nothing here.

  - name: the listing counts under info
    source: https://rickandmortyapi.com/api/character?page=1
    verified: "2026-08-30"
    fixture: characters
    request:
      method: GET
      path: /api/character
    expect:
      status: 200
      body:
        # Two records here against 826 live: the emulator counts what it holds,
        # and the name is what this case pins.
        "info.count": 2
        "results[0].name": Rick Sanchez
        "results[1].name": Antenna Rick
