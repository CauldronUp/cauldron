# RubyGems Recipe for Cauldron
#
# The flag that decides whether publishing needs two-factor authentication is
# the string "true".
#
# A gemspec's metadata is declared as a map of strings to strings, and the API
# hands it back as it was written. So rails answers:
#
#   "metadata": {"rubygems_mfa_required": "true", ...}
#
# Four characters, not a boolean. Which is fine until somebody writes
# `if (metadata.rubygems_mfa_required)` -- true for "true", and also true for
# "false", because both are non-empty strings. The one value in that object a
# security check would read is the one whose type cannot express the answer.
#
# **And a gem nobody has published answers in plain text.** GET
# /api/v1/gems/not-a-real-gem.json is a 404 whose entire body is:
#
#   This rubygem could not be found.
#
# No braces, no key, no JSON at all, from a path ending in .json. A client that
# calls .json() on the response throws, and the exception it throws is a parse
# error rather than anything about the gem -- so the first thing a developer
# sees when they typo a name is a syntax error in their own stack.
#
# Written against the live API rather than a document: RubyGems publishes no
# OpenAPI for this, the read endpoints are public, and every case below was
# checked against rubygems.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Authors are prose and licences are a list. licenses is ["MIT"], a
#      proper array; authors is "Mike Dalessio, Aaron Patterson, Yoko Harada,
#      ..." -- four names in one string on nokogiri, and one name on rails.
#      Splitting on ", " is the only way to get the list back, and it is wrong
#      for any author whose name contains a comma.
#   2. A dependency requirement is a sentence. runtime[i] is
#      {"name": "actioncable", "requirements": "= 8.1.3.1"} -- the operator and
#      the version in one string, so resolving anything means parsing it, and
#      a gem with two constraints puts both in there separated by a comma.
#   3. The gemspec's own URIs are promoted to the top level and left in place,
#      and the two copies do not always agree. changelog_uri, bug_tracker_uri
#      and source_code_uri are identical in both spots on rails; homepage_uri
#      is at the top level and absent from metadata. Neither location is the
#      authoritative one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - There is no authentication here, because the read endpoints need none.
#     Publishing does, and it is a different protocol -- the line drawn at
#     PyPI and crates.io.
#   - Versions, owners, search, reverse dependencies and the yank endpoints
#     are absent.
#   - The .json suffix is part of the path rather than an Accept header, which
#     is served, but the API also answers the same paths without it in other
#     formats. Only JSON is here.
#
# The fixture below is public data about public gems, recorded on the date in
# the cases.

recipe: rubygems
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://guides.rubygems.org/rubygems-org-api/

auth:
  # Public for reads.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # A bare sentence, from a path ending in .json.
    style: text

resources:
  gem:
    id:
      style: opaque
      field: name
    fields:
      version:
        type: string
      version_created_at:
        type: string
      platform:
        type: string
      # A string, however many authors there are.
      authors:
        type: string
      # An array, for the thing there is usually one of.
      licenses:
        type: list
      info:
        type: string
      downloads:
        type: integer
      version_downloads:
        type: integer
      sha:
        type: string
      spec_sha:
        type: string
      project_uri:
        type: string
      gem_uri:
        type: string
      homepage_uri:
        type: string
      changelog_uri:
        type: string
      bug_tracker_uri:
        type: string
      source_code_uri:
        type: string
      documentation_uri:
        type: string
      funding_uri:
        type: string
      wiki_uri:
        type: string
      mailing_list_uri:
        type: string
      yanked:
        type: boolean
      metadata:
        type: map
      dependencies:
        type: map

routes:
  - method: GET
    path: /api/v1/gems/{id}.json
    resource: gem
    operation: get

errors:
  resource_missing:
    status: 404
    message: This rubygem could not be found.

  invalid_request:
    status: 400
    message: Bad request.

fixtures:
  empty: {}

  registry:
    gem:
      - id: rails
        version: 8.1.3.1
        version_created_at: "2026-07-29T15:02:41.060Z"
        platform: ruby
        # One author, and still a string.
        authors: David Heinemeier Hansson
        licenses:
          - MIT
        info: Ruby on Rails is a full-stack web framework optimized for programmer happiness and sustainable productivity.
        downloads: 779773100
        version_downloads: 3824745
        sha: ccd11a36bfc171bf9c66d585d14c0ece91c0c9dde840aae60c0118d6f5c9c52a
        spec_sha: 5b60af49df6edf722925a85d144f1118abda22485a820da2c516e97cab8347b8
        project_uri: https://rubygems.org/gems/rails
        gem_uri: https://rubygems.org/gems/rails-8.1.3.1.gem
        homepage_uri: https://rubyonrails.org
        changelog_uri: https://github.com/rails/rails/releases/tag/v8.1.3.1
        bug_tracker_uri: https://github.com/rails/rails/issues
        source_code_uri: https://github.com/rails/rails/tree/v8.1.3.1
        funding_uri: null
        wiki_uri: null
        yanked: false
        metadata:
          # A map of strings to strings, so the boolean is four characters.
          rubygems_mfa_required: "true"
          # The same URIs again, except the one that is not here.
          changelog_uri: https://github.com/rails/rails/releases/tag/v8.1.3.1
          bug_tracker_uri: https://github.com/rails/rails/issues
          source_code_uri: https://github.com/rails/rails/tree/v8.1.3.1
        dependencies:
          development: []
          runtime:
            # The operator and the version in one string.
            - name: actioncable
              requirements: "= 8.1.3.1"
            - name: actionmailbox
              requirements: "= 8.1.3.1"

      # Four authors, in one string.
      - id: nokogiri
        version: 1.20.1
        platform: ruby
        authors: "Mike Dalessio, Aaron Patterson, Yoko Harada, Akinori MUSHA"
        licenses:
          - MIT
        yanked: false
        metadata: {}
        dependencies:
          development: []
          runtime: []

conformance:
  - name: the two-factor flag is the string true
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # A gemspec's metadata is a map of strings to strings, so the one
        # value in it a security check would read cannot be a boolean.
        # `if (metadata.rubygems_mfa_required)` is true for "true" and also
        # for "false".
        "metadata.rubygems_mfa_required": "true"

  - name: a gem nobody has published answers in plain text
    source: https://rubygems.org/api/v1/gems/not-a-real-gem-cauldron-fixture.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/not-a-real-gem-cauldron-fixture.json
    expect:
      # No braces, no key, no JSON at all, from a path ending in .json. A
      # client calling .json() on this throws a parse error rather than
      # learning anything about the gem.
      status: 404
      body_matches: "^This rubygem could not be found\\.$"

  - name: authors are prose and licences are a list
    source: https://rubygems.org/api/v1/gems/nokogiri.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/nokogiri.json
    expect:
      status: 200
      body:
        # Four names in one string, beside an array holding one licence.
        # Splitting on ", " is the only way back, and it is wrong for any
        # author whose name contains a comma.
        authors: "Mike Dalessio, Aaron Patterson, Yoko Harada, Akinori MUSHA"
        "licenses[0]": MIT

  - name: and one author is still a string
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # So there is no shape to branch on: the field is a string whether
        # there is one author or four.
        name: rails
        authors: David Heinemeier Hansson
        "licenses[0]": MIT

  - name: a dependency requirement is a sentence
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # The operator and the version in one string, so resolving anything
        # means parsing it. A gem with two constraints puts both in there,
        # separated by a comma.
        "dependencies.runtime[0].name": actioncable
        "dependencies.runtime[0].requirements": "= 8.1.3.1"
        "dependencies.development": []

  - name: the gemspec's URIs are promoted and left in place
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # Three of them identical in both spots.
        changelog_uri: https://github.com/rails/rails/releases/tag/v8.1.3.1
        "metadata.changelog_uri": https://github.com/rails/rails/releases/tag/v8.1.3.1
        source_code_uri: https://github.com/rails/rails/tree/v8.1.3.1
        "metadata.source_code_uri": https://github.com/rails/rails/tree/v8.1.3.1

  - name: and one of them is only in one place
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # homepage_uri is at the top level and not in metadata, so neither
        # location is the authoritative one and a client has to read both.
        homepage_uri: https://rubyonrails.org
      absent:
        - metadata.homepage_uri

  - name: two checksums for two different things
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # sha is the .gem file; spec_sha is the serialised gemspec. Checking
        # a download against the wrong one fails every time.
        sha: ccd11a36bfc171bf9c66d585d14c0ece91c0c9dde840aae60c0118d6f5c9c52a
        spec_sha: 5b60af49df6edf722925a85d144f1118abda22485a820da2c516e97cab8347b8

  - name: platform is the word ruby when there is no platform
    source: https://rubygems.org/api/v1/gems/rails.json
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/gems/rails.json
    expect:
      status: 200
      body:
        # Not null and not absent: a literal string standing in for "this one
        # is not platform-specific", beside version_downloads for this
        # version and downloads for every version there has ever been.
        platform: ruby
        version_downloads: 3824745
        downloads: 779773100
