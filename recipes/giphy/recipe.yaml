conformance:
  # -- Verified: the auth failure, and that a missing key and a wrong one
  #    are the same failure. --

  - name: an unauthenticated trending call answers 401 with an empty array under data
    source: https://api.giphy.com/v1/gifs/trending?limit=1
    verified: "2026-09-01"
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/trending
    expect:
      status: 401
      body:
        # A list route's own key, holding a list route's own empty value --
        # the shape a client already treats as "no trending gifs right now".
        data: []
        "meta.status": 401
        "meta.msg": Unauthorized

  - name: a junk api_key answers exactly the same failure as no key at all
    source: https://api.giphy.com/v1/gifs/trending?limit=1&api_key=THIS_IS_JUNK_0000
    verified: "2026-09-01"
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/trending
      query:
        api_key: THIS_IS_JUNK_0000
    expect:
      status: 401
      body:
        # Byte-for-byte the case above: missing and wrong are not two
        # failures here, they are one failure reached two ways.
        data: []
        "meta.status": 401
        "meta.msg": Unauthorized

  - name: the same failure reaches a single-GIF route too, with the same array
    source: https://api.giphy.com/v1/gifs/xyzxyzxyz
    verified: "2026-09-01"
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/l0MYt5jPR6QX5pnqM
    expect:
      # Cauldron checks the credential before it resolves a route, so this
      # is the one shape every route answers with. See the header comment
      # for what a realistic-length id answers on the real API instead.
      status: 401
      body:
        data: []
        "meta.status": 401

  # -- Documented from developers.giphy.com/docs/api/schema/, not
  #    verified: nothing below this line was ever answered with a 200. --

  - name: meta restates the HTTP status inside a successful body too
    source: https://developers.giphy.com/docs/api/schema/
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/trending
      query:
        api_key: cauldron_giphy_fixture_key
    expect:
      status: 200
      body:
        "meta.status": 200
        "meta.msg": OK
        "data[0].id": l0MYt5jPR6QX5pnqM
        "data[1].id": 3o7abKhOpu0NwenH3O
        "pagination.count": 2
        "pagination.total_count": 2

  - name: image dimensions travel as strings, not numbers
    source: https://developers.giphy.com/docs/api/schema/
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/trending
      query:
        api_key: cauldron_giphy_fixture_key
    expect:
      status: 200
      body:
        # "480", quoted, the same way EPSS quotes a probability and
        # Cloudinary's version prefixes a URL: a client comparing this to
        # a number never matches without parsing it first.
        "data[0].images.original.width": "480"
        "data[0].images.original.height": "270"

  - name: a single GIF comes back as an object, not a one-item list
    source: https://developers.giphy.com/docs/api/schema/
    fixture: trending
    request:
      method: GET
      path: /v1/gifs/l0MYt5jPR6QX5pnqM
      query:
        api_key: cauldron_giphy_fixture_key
    expect:
      status: 200
      body:
        "data.id": l0MYt5jPR6QX5pnqM
        "data.rating": g
        "meta.status": 200

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://developers.giphy.com/docs/api/schema/"
    fixture: trending
    request:
      method: GET
      path: "/v1/gifs/trending"
      query:
        "api_key": "cauldron_giphy_fixture_key"
        "limit": "1"
    expect:
      status: 200
      body:
        "data[0].id": "l0MYt5jPR6QX5pnqM"
      absent:
        - "data[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://developers.giphy.com/docs/api/schema/"
    fixture: trending
    request:
      method: GET
      path: "/v1/gifs/trending"
      query:
        "api_key": "cauldron_giphy_fixture_key"
        "limit": "1"
        "offset": "1"
    expect:
      status: 200
      body:
        "data[0].id": "3o7abKhOpu0NwenH3O"
      absent:
        - "data[1]"

