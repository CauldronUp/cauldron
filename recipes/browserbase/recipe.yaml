# Browserbase Recipe for Cauldron
#
# Written against Browserbase's API reference at docs.browserbase.com and
# struck live against api.browserbase.com on 2026-09-07 with no credential and
# then with a deliberately invalid one.
#
# **The refusal names the exact header you forgot.** Struck live:
#
#   GET /v1/sessions                         (no credential)
#   401 {"statusCode":401,"error":"Unauthorized","message":"Missing x-bb-api-key header"}
#
# `x-bb-api-key` -- the header, spelled out, in the message. Which is the
# single most useful thing a refusal can say to somebody wiring up an
# integration for the first time, and almost nothing in this collection says
# it. [pulumi](../pulumi) refuses a `Bearer` prefix without mentioning that it
# wants `token`; [openphone](../openphone) does name its header and is the only
# other one here that does.
#
# It matters more than usual for this API, because the header is not
# `Authorization`. A developer reaching for the default of every HTTP library
# gets nothing, and the refusal tells them why in five words.
#
# **A wrong key is answered with the word `Unauthorized` twice.** Struck live:
#
#   GET /v1/sessions                         X-BB-API-Key: notreal
#   401 {"statusCode":401,"error":"Unauthorized","message":"Unauthorized"}
#
# So the precision is only on the first failure. Once a key is present and
# wrong, `error` and `message` carry the same word and there is nothing to
# branch on but the string.
#
# **The 404 has the same three fields in a different order.** Struck live:
#
#   GET /v1/cauldron-nope
#   404 {"message":"Route GET:/v1/cauldron-nope not found","error":"Not Found","statusCode":404}
#
# `{statusCode, error, message}` on the 401 and `{message, error, statusCode}`
# on the 404 -- Fastify's default not-found handler building the object in the
# opposite order from the application's own. The keys are the same, the shape
# is the same, and only a byte comparison notices. [zuora](../zuora) has the
# same instability between its two credential failures, and
# [infisical](../infisical)'s 404 is the same Fastify handler answering from
# below the application.
#
# **The 404 echoes the method and the path**, which is Fastify again, and is
# genuinely useful: a caller sees exactly what the router was given.

recipe: browserbase
capability: hosting
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.browserbase.com/reference/api/list-sessions
  # No spec: Browserbase publishes a rendered reference site.

auth:
  # Not Authorization. A developer reaching for the default of every HTTP
  # library gets nothing, which is why the refusal naming the header matters
  # more here than it usually would.
  scheme: header
  header: X-BB-API-Key
  keys:
    - bb_live_cauldr0nf1xturekey0000000000
  absent_error: missing_header
  rejected_error: unauthorized

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    status_field: statusCode
    fields:
      error: Unauthorized

resources:
  session:
    id:
      field: id
      style: uuid
    fields:
      status:
        type: string
        default: RUNNING
      projectId:
        type: string
      startedAt:
        type: datetime
      # Untyped, so a running session omits it rather than being given a zero
      # date that would read as finished at the epoch.
      endedAt:
      region:
        type: string
        default: us-west-2
      proxyBytes:
        type: integer
        default: 0

routes:
  - method: GET
    path: /v1/sessions
    resource: session
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: limit
      cursor_param: page

errors:
  missing_header:
    status: 401
    # The header, spelled out. The single most useful thing a refusal can say
    # to somebody wiring up an integration for the first time.
    message: "Missing x-bb-api-key header"

  unauthorized:
    status: 401
    # And once a key is present and wrong, the precision is gone: error and
    # message carry the same word.
    message: "Unauthorized"

  unknown_route:
    status: 404
    # Fastify's handler, echoing the method and the path -- and building the
    # object in the opposite key order from the application above it.
    message: "Route GET:/v1/cauldron-nope not found"
    fields:
      error: "Not Found"

fixtures:
  empty:
    session: []

  project:
    session:
      - id: 6b2f9c14-3a87-4e05-9d61-8c7f0a2e3b45
        status: COMPLETED
        projectId: 91c47f5a-6d38-4b02-8e19-72a0d5c3f846
        startedAt: "2026-09-06T11:02:14.000Z"
        endedAt: "2026-09-06T11:04:51.000Z"
        region: us-west-2
        proxyBytes: 1048576
      - id: 7d3e0a25-4b98-4f16-8e72-9d80b1f4c536
        # Still running, so there is no end time at all rather than a null --
        # and proxyBytes is already counting, so a cost computed from
        # finished sessions is lower than the bill.
        status: RUNNING
        projectId: 91c47f5a-6d38-4b02-8e19-72a0d5c3f846
        startedAt: "2026-09-07T20:59:03.000Z"
        region: eu-central-1
        proxyBytes: 262144

conformance:
  - name: the refusal names the header
    source: https://api.browserbase.com/v1/sessions
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers: {}
    expect:
      status: 401
      body:
        # Five words, and they are the five that get somebody unstuck --
        # especially here, where the header is not Authorization.
        message: "Missing x-bb-api-key header"
        error: Unauthorized
        statusCode: 401

  - name: a wrong key says the same word twice
    source: https://api.browserbase.com/v1/sessions
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: notreal
    expect:
      status: 401
      body:
        # The precision was only on the first failure. Once a key is present
        # and wrong, error and message carry the same word and there is
        # nothing to branch on but the string.
        message: Unauthorized
        error: Unauthorized

  - name: an unknown path echoes the method and the path
    source: https://api.browserbase.com/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 404
      body:
        # Fastify's handler. Genuinely useful: a caller sees exactly what the
        # router was given, verb and all.
        message: "Route GET:/v1/cauldron-nope not found"
        error: "Not Found"
        statusCode: 404

  - name: the not-found builds the same fields in the opposite order
    source: https://api.browserbase.com/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 404
      body:
        # {statusCode, error, message} on the 401 and {message, error,
        # statusCode} here -- the framework's handler and the application's
        # own, disagreeing about order. Only a byte comparison notices, which
        # is every recorded fixture and every snapshot test.
        statusCode: 404

  - name: sessions are a bare array
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 200
      body:
        # No envelope on success, where every failure has three fields -- so
        # the shape of a response depends on whether it worked.
        '[0].id': 6b2f9c14-3a87-4e05-9d61-8c7f0a2e3b45
        '[0].status': COMPLETED

  - name: a running session has no end time and is already billing
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 200
      body:
        # proxyBytes is counting on a session with no endedAt, so a cost
        # computed over finished sessions is lower than the bill.
        '[1].status': RUNNING
        '[1].proxyBytes': 262144
      absent:
        - '[1].endedAt'

  - name: two sessions in one project can be in two regions
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 200
      body:
        # The region is per session rather than per project, so latency and
        # egress cost vary within one listing and nothing groups them.
        '[0].region': us-west-2
        '[1].region': eu-central-1
        '[1].projectId': 91c47f5a-6d38-4b02-8e19-72a0d5c3f846

  - name: a finished session carries both ends
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 200
      body:
        '[0].startedAt': "2026-09-06T11:02:14.000Z"
        '[0].endedAt': "2026-09-06T11:04:51.000Z"
        '[0].proxyBytes': 1048576

  - name: sessions page on page and limit
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: project
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
      query:
        page: "2"
        limit: "1"
    expect:
      status: 200
      body:
        # A bare array with no total and no link header, so a client cannot
        # tell a full last page from a full middle one without asking again.
        '[0].id': 7d3e0a25-4b98-4f16-8e72-9d80b1f4c536

  - name: a project with no sessions answers an empty array
    source: https://docs.browserbase.com/reference/api/list-sessions
    fixture: empty
    request:
      method: GET
      path: /v1/sessions
      headers:
        X-BB-API-Key: bb_live_cauldr0nf1xturekey0000000000
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
