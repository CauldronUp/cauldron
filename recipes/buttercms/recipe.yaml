# ButterCMS Recipe for Cauldron
#
# The blog posts listing, read from the OpenAPI document ButterCMS serves at
# buttercms.com/docs/api/openapi/read_api.yaml, and struck live against
# api.buttercms.com on 2026-09-13 with no credential, with a deliberately
# invalid one, and on a path that does not exist.
#
# **Three failures, one key, and the bytes differ.** Struck live:
#
#   (no token)       401 {"detail":"Incorrect authentication credentials."}
#   ?auth_token=x    401 {"detail":"Invalid token."}
#   /cauldron-nope/  404 {"detail": "Not found."}
#
# Read the third one carefully: there is a space after the colon, and there is
# not one on the first two. Checked at the byte level, twice. Two different JSON
# serialisers are answering from the same API, and the only way to see it is to
# look at the bytes rather than at the parsed object.
#
# **And a request with no credential is told its credentials are incorrect.**
# "Incorrect authentication credentials." answers a request that supplied none;
# "Invalid token." answers one that supplied a wrong one. The vaguer sentence
# goes to the case that could have been named exactly, and the precise one goes
# to the case a caller can already guess.
#
# **Four pagination parameters on one operation, mutually exclusive in pairs.**
# `page` and `page_size`, `limit` and `offset`. Each of the four carries the
# same warning in its own description -- "**Mutually exclusive with** the other
# pair" -- which is the only place the rule exists: nothing in the schema
# expresses it, so a generated client offers all four on one call.
#
# **The envelope changes shape depending on which pair you sent.** The document
# declares two response types for this one operation:
#
#   PageBasedPostsResponse    meta: {previous_page, next_page, count}
#   OffsetBasedPostsResponse  meta: {count, next_offset, previous_offset}
#
# So a client has to remember how it asked in order to know how to read the
# reply, and `meta.next_page` is present or absent according to a decision made
# in the request.
#
# **An out-of-range page size is silently corrected.** From `limit`'s own
# description: "Values above 100 are capped at 100; values below 1 or invalid
# fall back to the default of 10 (**the request is not rejected**)." A caller
# who asks for 500 records gets 100, a caller who asks for 0 gets 10, and
# neither is told.
#
# **The token travels in the query string or in a header, and the document
# declares both.** Two security schemes for one credential, so the secret is in
# the URL on whichever of the two a caller picks first -- and the query form is
# the one every example uses.
#
# **Publication state is in two places.** `status` is an enum of draft,
# published and scheduled, and `published` and `scheduled` are nullable
# timestamps beside it. Three fields for one fact, and nothing saying what
# `status: scheduled` means when `scheduled` is null.
#
# **And nothing on a post is required.** Seventeen properties, no `required`
# array -- not `slug`, not `title`, not `url`.

recipe: buttercms
capability: cms
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://buttercms.com/docs/api-reference/blog-posts/list-all-posts
  spec: https://buttercms.com/docs/api/openapi/read_api.yaml
  spec_hash: 356e13cb4c780a278d9aff5069bf6f50a51255424780e3d43e27e56268b34e03
  spec_seen: "2026-09-13"

auth:
  # In the URL, which is the form every example in the documentation uses.
  scheme: query
  param: auth_token
  keys:
    - cauldr0nbutterf1xturet0ken
  # The vaguer sentence for the case that could have been named exactly.
  absent_error: incorrect_credentials
  rejected_error: invalid_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    count_field: meta.count
    # A page *number*, not a token or a URL -- and null rather than absent
    # when there is no next page.
    cursor_field: meta.next_page
    cursor_null: true
    prev_field: meta.previous_page
  error:
    # Django REST Framework's one key.
    style: flat
    message_field: detail
    code_field: "-"

resources:
  post:
    id:
      # The slug is the identifier: every other endpoint on a post takes it.
      field: "-"
      style: opaque
      carried_by: slug
    fields:
      slug:
        type: string
      title:
        type: string
      url:
        type: string
      summary:
        type: string
      body:
        type: string
      seo_title:
        type: string
      meta_description:
        type: string
      # draft, published or scheduled -- beside two nullable timestamps that
      # say the same thing.
      status:
        type: string
      created:
        type: datetime
      updated:
        type: datetime
      author:
        type: map
      categories:
        type: list
      tags:
        type: list
      featured_image_alt:
        type: string
      # Untyped, so absence survives as null rather than as a default.
      published:
      scheduled:
      featured_image:

routes:
  - method: GET
    # With the trailing slash, which is how Django spells it and how every
    # example in the documentation writes it.
    path: /v2/posts/
    resource: post
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 10
      max_limit: 100
      limit_param: page_size
      cursor_param: page

errors:
  incorrect_credentials:
    status: 401
    # Answering a request that supplied no credentials at all.
    message: Incorrect authentication credentials.

  invalid_token:
    status: 401
    message: Invalid token.

  unknown_route:
    status: 404
    # The same key, from a different serialiser: live this body has a space
    # after the colon and the two above do not.
    message: Not found.

fixtures:
  empty:
    post: []

  blog:
    post:
      - slug: this-is-a-blog-post
        title: This is a blog post
        url: https://example.com/blog/this-is-a-blog-post/
        summary: This is a blog post summary.
        body: "<p>This is a blog post body.</p>"
        seo_title: This is a blog post
        meta_description: This is a blog post meta description.
        status: published
        created: "2026-01-15T09:30:00.000000Z"
        updated: "2026-06-02T14:12:05.000000Z"
        published: "2026-01-15T09:32:10.000000Z"
        scheduled: null
        featured_image: https://cdn.buttercms.com/3ccPHhYHTNK2zQ14gCOy
        featured_image_alt: ""
        author:
          slug: a-person
          first_name: A
          last_name: Person
          email: author@example.com
        categories:
          - name: Engineering
            slug: engineering
        tags:
          - name: Release
            slug: release
      - slug: announcing-our-q2-release
        title: "Announcing our Q2 release"
        url: https://example.com/blog/announcing-our-q2-release/
        summary: What shipped this quarter.
        body: "<p>What shipped this quarter.</p>"
        seo_title: Announcing our Q2 release
        meta_description: What shipped this quarter.
        # Scheduled, and the timestamp saying when is on a different field.
        status: scheduled
        created: "2026-04-02T11:05:00.000000Z"
        updated: "2026-04-02T11:20:00.000000Z"
        # Not published yet, so the field that would say when is null.
        published: null
        scheduled: "2026-12-01T09:00:00.000000Z"
        featured_image: null
        featured_image_alt: ""
        author:
          slug: a-person
          first_name: A
          last_name: Person
          email: author@example.com
        categories: []
        tags: []

conformance:
  - name: no credential is told its credentials are incorrect
    source: https://api.buttercms.com/v2/posts/
    verified: "2026-09-13"
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
    expect:
      status: 401
      body:
        # Answering a request that supplied none at all.
        detail: Incorrect authentication credentials.

  - name: a wrong token gets the precise sentence
    source: https://api.buttercms.com/v2/posts/
    verified: "2026-09-13"
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: notarealkey
    expect:
      status: 401
      body:
        # The case a caller could already guess is the one that is named.
        detail: Invalid token.

  - name: an unrouted path is the same key from a different serialiser
    source: https://api.buttercms.com/v2/cauldron-nope/
    verified: "2026-09-13"
    fixture: blog
    request:
      method: GET
      path: /v2/cauldron-nope/
      query:
        auth_token: notarealkey
    expect:
      status: 404
      body:
        # Live, this body has a space after the colon and the two above do
        # not. See the README's modelling limits.
        detail: Not found.

  - name: a post is identified by its slug
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
    expect:
      status: 200
      body:
        # No id anywhere on the record: every other endpoint takes the slug.
        'data[0].slug': this-is-a-blog-post
        'data[0].title': This is a blog post
        'data[0].url': https://example.com/blog/this-is-a-blog-post/

  - name: publication state is in three fields
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
    expect:
      status: 200
      body:
        # An enum, and two nullable timestamps that say the same thing.
        'data[0].status': published
        'data[0].published': "2026-01-15T09:32:10.000000Z"
        'data[0].scheduled': null
        'data[1].status': scheduled
        'data[1].published': null
        'data[1].scheduled': "2026-12-01T09:00:00.000000Z"

  - name: the author and the taxonomy are embedded
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
    expect:
      status: 200
      body:
        # A person's email address, on every post in a listing.
        'data[0].author.email': author@example.com
        'data[0].author.slug': a-person
        'data[0].categories[0].slug': engineering
        'data[0].tags[0].name': Release
        'data[1].categories': []

  - name: the SEO fields duplicate the title and the summary
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
    expect:
      status: 200
      body:
        'data[0].seo_title': This is a blog post
        'data[0].meta_description': This is a blog post meta description.
        'data[0].summary': This is a blog post summary.
        'data[0].body': "<p>This is a blog post body.</p>"
        'data[0].created': "2026-01-15T09:30:00.000000Z"
        'data[0].updated': "2026-06-02T14:12:05.000000Z"
        # An empty string for the alt text and a null for the image itself:
        # two ways of saying there is no picture, on adjacent fields.
        'data[0].featured_image': https://cdn.buttercms.com/3ccPHhYHTNK2zQ14gCOy
        'data[0].featured_image_alt': ""
        'data[1].featured_image': null

  - name: the page-based envelope carries page numbers
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
        page_size: "1"
        page: "1"
    expect:
      status: 200
      body:
        # A total, and null rather than absent for the page before the
        # first one.
        'meta.count': 2
        'meta.previous_page': null
        'data[0].slug': this-is-a-blog-post
      matches:
        # A page number where most APIs put a token. Cauldron renders a
        # cursor as a string and the document types this one as an integer;
        # see the README's modelling limits.
        'meta.next_page': '^\d+$'

  - name: the last page says null rather than leaving the key out
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: blog
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
        page_size: "1"
        page: "2"
    expect:
      status: 200
      body:
        'data[0].slug': announcing-our-q2-release
        'meta.next_page': null
        'meta.count': 2

  - name: a blog with no posts still carries the count
    source: https://buttercms.com/docs/api/openapi/read_api.yaml
    fixture: empty
    request:
      method: GET
      path: /v2/posts/
      query:
        auth_token: cauldr0nbutterf1xturet0ken
    expect:
      status: 200
      body:
        data: []
        'meta.count': 0
