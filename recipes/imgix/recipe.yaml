# imgix Management API Recipe for Cauldron
#
# Written against what api.imgix.com answers, struck live on 2026-09-06 with no
# credential and then with a deliberately invalid one. imgix's Management API
# reference is a JavaScript-rendered page with nothing in its HTML, so the
# attribute names of a source are not modelled here rather than guessed -- see
# the note on the listing below.
#
# **The 401 tells you the server's build, its health and whether it is in
# read-only or tombstone state.** Struck live, with no credential at all:
#
#   {"errors": [{"detail": "A valid API key is required and could not be determined.",
#                "id": "87e18b65a7a846c1aa113cca1a7e986b",
#                "meta": {},
#                "status": "401",
#                "title": "Unauthorized"}],
#    "jsonapi": {"version": "1.0"},
#    "meta": {"authentication": {"authorized": false, "clientId": null,
#                                "mode": "PUBLIC_APIKEY",
#                                "modeTitle": "Public API Key",
#                                "tag": null, "user": null},
#             "server": {"commit": "production",
#                        "status": {"healthy": true, "read_only": false,
#                                   "tombstone": false},
#                        "version": "3.213.15"}}}
#
# Two things at once, pulling in opposite directions.
#
# The disclosure: an anonymous request learns the running version -- 3.213.15,
# to the patch -- and the deployment's own health flags. Anyone can ask.
#
# The usefulness, which is rarer and worth naming: `read_only` and `tombstone`
# ride *every* response, so a client can tell a maintenance window from a bug
# without a status page, and can tell it on the same request that failed. Almost
# nothing else in this collection does that. Boundary is the nearest, and it
# tells you about its pagination rather than about itself.
#
# And `meta.authentication` explains the refusal in structured fields rather
# than in the sentence: `authorized: false`, `mode: "PUBLIC_APIKEY"`,
# `clientId: null`. So the failure says which scheme it tried, which is the
# thing a caller with two kinds of key most needs and almost never gets.
#
# **`status` is a string inside the error and a number outside it.** The entry
# carries `"status": "401"` -- quoted -- while the HTTP status is 401. That is
# JSON:API's specification rather than imgix's choice (the spec says status is a
# string), and it means the two representations of one fact in one exchange have
# different types.
#
# **The error carries its own id, fresh per request.** 32 hex characters, a
# different value on every call, sitting inside `errors[0]` rather than in a
# header. It is not the `x-cloud-trace-context` header beside it, which is a
# different 32 hex characters on the same response -- so a failure carries two
# unrelated correlation ids and neither is labelled as the one to quote.
#
# **A missing credential and a wrong one are the same response.** Struck live
# with no header and with `Bearer not-a-real-key`: identical status, identical
# detail, identical title. Only the per-request id differs. So a client cannot
# tell "I forgot to configure this" from "the key I configured is wrong", which
# are the two failures that need different fixes.
#
# **The media type is application/vnd.api+json.** Not application/json. A client
# checking the header before parsing does not parse, and a framework that
# decodes only application/json hands the handler an empty body -- the same trap
# Unit's JSON:API responses set, and the reason this format has content_type.

recipe: imgix
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.imgix.com/apis/management
  # No spec: imgix publishes no machine-readable description, and its
  # Management API reference is rendered by JavaScript with nothing in the
  # served HTML.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-imgix-fixture-key-000000
  # One error for both, because imgix answers one response to both. Struck
  # live: no header and a wrong key produce byte-identical bodies apart from
  # the per-request id.
  absent_error: unauthorized
  rejected_error: unauthorized

responses:
  # JSON:API's registered media type, struck live on every response including
  # the failures. A client checking for application/json refuses to parse it.
  content_type: application/vnd.api+json
  list:
    style: wrapped
    key: data
    fields:
      # Struck live on the 401 and, per JSON:API, present on every document.
      jsonapi:
        version: "1.0"
      meta:
        authentication:
          authorized: true
          clientId: cauldron-fixture-client
          mode: PUBLIC_APIKEY
          modeTitle: Public API Key
          tag: null
          user: null
        server:
          commit: production
          status:
            healthy: true
            # The two flags that make this envelope worth having: a client can
            # tell a maintenance window from a bug on the response that failed.
            read_only: false
            tombstone: false
          version: 3.213.15
  error:
    style: list
    key: errors
    message_field: detail
    # JSON:API's title, which is the short form beside the sentence.
    type_field: title
    code_field: "-"
    # A string inside the entry, while the HTTP status beside it is a number.
    # The specification asks for this; the consequence is still that one fact
    # has two types in one exchange.
    # Dropped: status_field emits a number and JSON:API asks for a string, so
    # the entry carries its own below rather than one this format would have
    # to widen a type for.
    status_field: ""
    fields:
      jsonapi:
        version: "1.0"
      # The envelope's, beside the array: this describes the response rather
      # than any one failure in it, which is exactly the split the list style
      # already makes.
      meta:
        authentication:
          authorized: false
          clientId: null
          # Which scheme was tried, in a field, rather than in the sentence.
          mode: PUBLIC_APIKEY
          modeTitle: Public API Key
          tag: null
          user: null
        server:
          commit: production
          status:
            healthy: true
            read_only: false
            tombstone: false
          # Struck live from an anonymous request: the running build, to the
          # patch.
          version: "3.213.15"

resources:
  source:
    id:
      field: id
      style: hex
    fields:
      # JSON:API requires a type on every resource object, and it is the only
      # attribute of a source this Recipe claims. The attribute names live in a
      # reference page rendered by JavaScript, and inventing them would be
      # worse than the gap: see the note in the README.
      type:
        type: string
        default: sources

routes:
  - method: GET
    path: /api/v1/sources
    resource: source
    operation: list
    pagination:
      # JSON:API's page[number] and page[size], which the format has no way to
      # send as bracketed names. Recorded rather than approximated.
      style: none

errors:
  unauthorized:
    status: 401
    type: Unauthorized
    message: "A valid API key is required and could not be determined."
    fields:
      # Inside the entry, which is where a named error's fields go: these
      # describe this failure rather than the response carrying it.
      #
      # Fresh 32 hex characters on every real response, and a fixed one here:
      # a fake minting a new value each time would be asserting a format it
      # cannot check. What matters is that it exists and is per-request.
      id: 87e18b65a7a846c1aa113cca1a7e986b
      meta: {}
      # A string, per JSON:API, beside an HTTP status that is a number.
      status: "401"

  unknown_route:
    status: 404
    type: Not Found
    message: "Resource not found."
    fields:
      id: 7552246f287643959cdf4558abb33a0a
      meta: {}
      status: "404"

fixtures:
  empty:
    source: []

  account:
    source:
      - id: 5f4b1c9e2a7d48f0b3e6c1a95d720843
        type: sources
      - id: c81e728d9d4c2f636f067f89cc14862c
        type: sources

conformance:
  - name: an anonymous 401 discloses the running build
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      body:
        # Struck live with no credential at all. The version, to the patch,
        # from a request anyone can make.
        'meta.server.version': "3.213.15"
        'meta.server.commit': production
        'errors[0].detail': "A valid API key is required and could not be determined."

  - name: the same failure says whether the deployment is read-only
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      body:
        # The other half of the same disclosure, and the useful half: a client
        # can tell a maintenance window from a bug on the response that failed,
        # without a status page and without a second request.
        'meta.server.status.healthy': true
        'meta.server.status.read_only': false
        'meta.server.status.tombstone': false

  - name: the refusal explains itself in fields rather than prose
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      body:
        # Which scheme was tried, and that it did not authorise -- structured,
        # beside a sentence that says neither.
        'meta.authentication.authorized': false
        'meta.authentication.mode': PUBLIC_APIKEY
        'meta.authentication.clientId': null

  - name: a wrong key is the same response as no key
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers:
        Authorization: "Bearer not-a-real-key"
    expect:
      # Struck live both ways: identical status, detail and title, differing
      # only in the per-request id. A client cannot tell "not configured" from
      # "configured wrong", which are the two failures needing different fixes.
      status: 401
      body:
        'errors[0].detail': "A valid API key is required and could not be determined."
        'errors[0].title': Unauthorized

  - name: the status inside the error is a string
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      body:
        # Quoted in the entry, a number in the exchange. JSON:API asks for
        # this; a client comparing the two still has to convert one.
        'errors[0].status': "401"
        'jsonapi.version': "1.0"

  - name: an error carries a correlation id of its own
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      matches:
        # 32 hex characters, fresh on every real call, inside the entry rather
        # than in a header -- and the response also carries an unrelated
        # x-cloud-trace-context of the same length, so a failure has two
        # correlation ids and nothing says which to quote.
        'errors[0].id': '^[0-9a-f]{32}$'

  - name: an unknown path answers the same envelope
    source: https://api.imgix.com/api/v1/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nonexistent
      headers:
        Authorization: "Bearer cauldron-imgix-fixture-key-000000"
    expect:
      status: 404
      body:
        'errors[0].detail': "Resource not found."

  - name: every response is vnd.api+json rather than json
    source: https://api.imgix.com/api/v1/sources
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers: {}
    expect:
      status: 401
      headers:
        # Struck live on the failures. A client checking the header before
        # parsing does not parse, and a framework decoding only
        # application/json hands the handler an empty body.
        Content-Type: application/vnd.api+json

  - name: a listing carries the same meta a failure does
    source: https://docs.imgix.com/apis/management
    fixture: account
    request:
      method: GET
      path: /api/v1/sources
      headers:
        Authorization: "Bearer cauldron-imgix-fixture-key-000000"
    expect:
      status: 200
      body:
        # The envelope is the constant here: jsonapi, meta.server and
        # meta.authentication ride success as well as failure, which is what
        # makes the health flags usable rather than a curiosity of the 401.
        'data[0].type': sources
        'meta.server.status.read_only': false
        'meta.authentication.authorized': true

  - name: an account with no sources answers an empty array
    source: https://docs.imgix.com/apis/management
    fixture: empty
    request:
      method: GET
      path: /api/v1/sources
      headers:
        Authorization: "Bearer cauldron-imgix-fixture-key-000000"
    expect:
      status: 200
      body:
        data: []
        'jsonapi.version': "1.0"
