# Affinity Recipe for Cauldron
#
# Written against Affinity's API reference at api-docs.affinity.co and struck
# live against api.affinity.co on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **Three sentences, all plain text, all declared `text/html`.** Struck live:
#
#   GET /persons                            (no credential)
#   401  Content-Type: text/html
#   Unauthorized API Key.
#
#   GET /persons                            Basic :notreal
#   401  Content-Type: text/html
#   Invalid or missing API key
#
#   GET /cauldron-nope                      Basic :notreal
#   404  Content-Type: text/html
#   Unknown API endpoint
#
# No JSON anywhere. No object, no field, no envelope -- three bare sentences,
# under a header claiming markup that is not there.
#
# This collection now has four providers getting one header wrong, and this is
# the fourth distinct way: [statsig](../statsig) sends no `Content-Type` at
# all, [wrike](../wrike) sends `text/plain` over real JSON, [maxio](../maxio)
# sends `application/json` over a sentence, and Affinity sends `text/html` over
# plain text. Only Maxio's is actively dangerous -- a client trusting the
# header parses and throws -- but Affinity's is the one that will silently be
# rendered into a page by anything that trusts a content type.
#
# **The three sentences are punctuated differently.** "Unauthorized API Key."
# has a full stop; "Invalid or missing API key" and "Unknown API endpoint" do
# not. Two capitalise "Key" and one does not. So the three failures a caller
# can reach were written at three different times by three different people,
# and the only way to tell them apart is to match on prose that is not
# consistent with itself.
#
# **"Invalid or missing" is the answer to sending a key.** The second request
# carried Basic credentials. It is the fifth provider in this collection to
# describe the wrong failure -- and unusually, it names both cases, so it is
# also the *least* wrong of the five.
#
# **The credential is the Basic password with an empty username.** `:key`, not
# `key:`. So a credential helper filling in the username sends the key where
# Affinity does not look, and the refusal above does not mention which half.

recipe: affinity
capability: crm
version: 0.1.0

upstream:
  api: v1
  docs: https://api-docs.affinity.co/
  # No spec: Affinity publishes a rendered reference site.

auth:
  scheme: basic
  # The key is the password with an empty username -- `:key` rather than
  # `key:` -- so a helper filling in the username sends it where Affinity does
  # not look, and no refusal mentions which half.
  credential: password
  keys:
    - cauldr0nAff1n1tyF1xtureKey000000
  absent_error: unauthorized_api_key
  rejected_error: invalid_or_missing

responses:
  list:
    style: wrapped
    key: persons
    cursor_field: next_page_token
    cursor_null: true
  error:
    # Not JSON at all: three bare sentences under a header claiming markup.
    style: text
    message_field: "-"

resources:
  person:
    id:
      field: id
      style: numeric
    fields:
      first_name:
        type: string
      last_name:
        type: string
      primary_email:
        type: string
      emails:
        type: list
      type:
        type: integer
        default: 0

routes:
  - method: GET
    path: /persons
    resource: person
    operation: list
    pagination:
      style: cursor
      limit: 500
      limit_param: page_size
      cursor_param: page_token

errors:
  unauthorized_api_key:
    status: 401
    # With a full stop, and with Key capitalised.
    message: "Unauthorized API Key."
    headers:
      Content-Type: text/html

  invalid_or_missing:
    status: 401
    # Without a full stop, and with key in lower case. Same status, same
    # media type, a different hand.
    message: "Invalid or missing API key"
    headers:
      Content-Type: text/html

  unknown_route:
    status: 404
    message: "Unknown API endpoint"
    headers:
      Content-Type: text/html

fixtures:
  empty:
    person: []

  workspace:
    person:
      - id: 38101642
        first_name: Ada
        last_name: Lovelace
        primary_email: ada@example.invalid
        emails:
          - ada@example.invalid
          - a.lovelace@example.invalid
        type: 0
      - id: 38101643
        first_name: Grace
        last_name: Hopper
        # No address at all: a person can exist in the CRM with none, so
        # primary_email is null and emails is empty, and a client keying on
        # either drops the record.
        primary_email: null
        emails: []
        # An internal person rather than an external one, distinguished by an
        # integer with no name anywhere on the record.
        type: 1

conformance:
  - name: the refusal is plain text declared as HTML
    source: https://api.affinity.co/persons
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers: {}
    expect:
      status: 401
      headers:
        # No markup in the body. The fourth distinct way of getting this
        # header wrong in the collection, and the one most likely to be
        # rendered into a page by something that trusts it.
        Content-Type: text/html
      body_matches: '^Unauthorized API Key\.'

  - name: a wrong credential is a differently punctuated sentence
    source: https://api.affinity.co/persons
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        # An empty username and a wrong password, which is the shape Affinity
        # takes.
        Authorization: "Basic Om5vdHJlYWw="
    expect:
      status: 401
      # No full stop, and `key` in lower case where the other has `Key.` --
      # two failures written at two different times, and prose is the only
      # thing separating them.
      body_matches: '^Invalid or missing API key$'

  - name: an unknown path is a third sentence
    source: https://api.affinity.co/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /cauldron-nope
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '^Unknown API endpoint$'

  - name: there is no JSON anywhere on the failure path
    source: https://api.affinity.co/persons
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers: {}
    expect:
      status: 401
      # No object, no field, no envelope. response.json() throws on every
      # failure this API produces, and the header does not warn.
      body_matches: '^[A-Z]'

  - name: persons are wrapped under their own plural
    source: https://api-docs.affinity.co/
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 200
      body:
        'persons[0].first_name': Ada
        'persons[0].id': 38101642

  - name: a person can have no address at all
    source: https://api-docs.affinity.co/
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 200
      body:
        # null and empty on the same record, so a client keying on either
        # drops the person -- and a CRM's whole job is not dropping people.
        'persons[1].primary_email': null
        'persons[1].emails': []
        'persons[1].last_name': Hopper

  - name: the primary address is also in the list
    source: https://api-docs.affinity.co/
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 200
      body:
        # So counting addresses by summing `emails` and adding
        # `primary_email` counts one twice, and the list gives no clue which
        # entry is the primary one.
        'persons[0].primary_email': ada@example.invalid
        'persons[0].emails[0]': ada@example.invalid
        'persons[0].emails[1]': a.lovelace@example.invalid

  - name: a person's kind is an unlabelled integer
    source: https://api-docs.affinity.co/
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 200
      body:
        # 0 and 1, in a field called `type`, with no enumeration on the
        # record and no name anywhere -- so what a person *is* has to be
        # looked up in prose.
        'persons[0].type': 0
        'persons[1].type': 1

  - name: the cursor is null rather than absent on the last page
    source: https://api-docs.affinity.co/
    fixture: workspace
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
      query:
        page_size: "500"
        page_token: "38101642"
    expect:
      status: 200
      body:
        # Present and null, so testing for the key finds it and the value has
        # to be tested instead.
        next_page_token: null

  - name: a workspace with no persons answers an empty array
    source: https://api-docs.affinity.co/
    fixture: empty
    request:
      method: GET
      path: /persons
      headers:
        Authorization: "Basic OmNhdWxkcjBuQWZmMW4xdHlGMXh0dXJlS2V5MDAwMDAw"
    expect:
      status: 200
      body:
        persons: []
