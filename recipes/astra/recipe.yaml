# DataStax Astra Recipe for Cauldron
#
# The database listing from Astra's DevOps API, read from DataStax's own Java
# SDK (astra-sdk-devops), and struck live against api.astra.datastax.com on
# 2026-09-13 with no header, with a malformed token, on a path that does not
# exist, and with a method the path does not take.
#
# **A format string that was never formatted.** Struck live, sending
# `Authorization: Bearer AstraCS:notarealtoken`:
#
#   {"errors":[{"ID":340016,"message":"Resource, token, was malformed. Error:
#     auth-manager returned 400 for call %s/v2/admin/tokens?%s"}]}
#
# Two `%s` verbs, unexpanded, in a message delivered to a caller. The arguments
# that would have filled them are gone, the internal service that failed is
# named, and its own HTTP status is quoted -- so what arrives is a log line from
# inside the platform with the interesting parts missing.
#
# **And the key is `ID`, in capitals, beside a lowercase `message`.**
# `{"ID": 340002, "message": "no bearer token in request"}` -- a Go struct field
# exported without a tag, so the initialism's casing became the wire name, in an
# object whose other key is lower case.
#
# **An unrouted path is Go's own four words.** `GET /v2/cauldron-nope` answers
# `404 page not found` as `text/plain`, and so does `PUT /v2/databases` -- the
# net/http default mux, on a JSON API, giving one answer for a path that is not
# there and a method that is not allowed.
#
# **The record says what it is and what it was observed to be.** `status` and
# `observedStatus` are both `DatabaseStatusType`, on the same object, and
# nothing on the record says which one to believe.
#
# **That type has nineteen members and one of them is `UNKNOWN`.** ACTIVE,
# ERROR, DECOMMISSIONING, DEGRADED, HIBERNATED, HIBERNATING, INITIALIZING,
# MAINTENANCE, PARKED, PARKING, PENDING, PREPARED, PREPARING, RESIZING,
# RESUMING, TERMINATED, TERMINATING, UNKNOWN, UNPARKING. Four transitions are
# spelled as an -ing/-ed pair and four are not: there is a `RESUMING` and no
# `RESUMED`, a `RESIZING` and no `RESIZED`. And `PARKED` and `HIBERNATED` are
# two names for a stopped database, in one enum.
#
# **Three fields for one concept.** A database carries `keyspace`, `keyspaces`
# and `additionalKeyspaces` -- a singular, a set, and a second set for the ones
# that are extra. A client asking which keyspaces a database has picks one of
# three answers.
#
# **And five addresses, two of them web pages.** `studioUrl`, `grafanaUrl`,
# `cqlshUrl`, `graphqlUrl` and `dataEndpointUrl` sit on the database record, so
# a JSON listing carries links to a Grafana dashboard and a browser IDE beside
# the endpoint a program would call.

recipe: astra
capability: database
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.datastax.com/en/astra-db-serverless/api-reference/devops-api.html
  # No spec: DataStax publishes this API as a reference page and a generated
  # Java SDK. No OpenAPI document is served at any address this Recipe could
  # reach -- api.astra.datastax.com/openapi.json answers 403 from CloudFront --
  # so the record shape below is the SDK's own domain classes.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000
  absent_error: no_bearer_token
  rejected_error: token_malformed
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    # A Go struct field exported without a tag: the initialism kept its case.
    code_field: ID
    code_type: number

resources:
  database:
    id:
      field: id
      style: uuid
    fields:
      orgId:
        type: string
      ownerId:
        type: string
      # The state it is in...
      status:
        type: string
      # ...and the state it was seen in.
      observedStatus:
        type: string
      creationTime:
        type: string
      terminationTime:
      lastUsageTime:
        type: string
      info:
        type: map
      storage:
        type: map
      availableActions:
        type: list
      # Five addresses on one record, two of them for a browser.
      studioUrl:
        type: string
      grafanaUrl:
        type: string
      cqlshUrl:
        type: string
      graphqlUrl:
        type: string
      dataEndpointUrl:
        type: string

routes:
  - method: GET
    path: /v2/databases
    resource: database
    operation: list
    pagination:
      style: cursor
      limit: 25
      limit_param: limit
      cursor_param: starting_after

errors:
  no_bearer_token:
    status: 401
    code: "340002"
    message: no bearer token in request

  token_malformed:
    status: 401
    code: "340016"
    # Two unexpanded verbs, an internal service named, and its status quoted.
    message: "Resource, token, was malformed. Error: auth-manager returned 400 for call %s/v2/admin/tokens?%s"

  unknown_route:
    status: 404
    # Not JSON at all: net/http's default, in four words.
    style: text
    message: 404 page not found
    headers:
      Content-Type: text/plain; charset=utf-8

  method_not_allowed:
    # The same four words, for a path that does exist.
    status: 404
    style: text
    message: 404 page not found
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    database: []

  estate:
    database:
      - id: 2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04
        orgId: 9c1d7e3a-5b2f-4a8c-b6d0-3e7f1a9c5d28
        ownerId: 4a6b8c0d-2e1f-43a5-9b7c-8d0e2f4a6b08
        # ACTIVE, and observed to be ACTIVE, said twice.
        status: ACTIVE
        observedStatus: ACTIVE
        creationTime: "2026-02-04T11:20:31Z"
        terminationTime: null
        lastUsageTime: "2026-09-12T18:03:07Z"
        info:
          name: orders
          # One keyspace, named three ways.
          keyspace: orders_main
          keyspaces:
            - orders_main
            - orders_archive
          additionalKeyspaces:
            - orders_archive
          cloudProvider: AWS
          region: us-east-1
          tier: serverless
          capacityUnits: 1
          dbType: vector
          engineType: ""
        storage:
          nodeCount: 3
          replicationFactor: 3
          totalStorage: 5
          usedStorage: 1
        availableActions:
          - park
          - resize
          - terminate
        # Two of these are web pages.
        studioUrl: https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com
        grafanaUrl: https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.dashboard.astra.datastax.com
        cqlshUrl: https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/cqlsh
        graphqlUrl: https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/api/graphql
        dataEndpointUrl: https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/api/rest
      - id: 7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26
        orgId: 9c1d7e3a-5b2f-4a8c-b6d0-3e7f1a9c5d28
        ownerId: 4a6b8c0d-2e1f-43a5-9b7c-8d0e2f4a6b08
        # Parked, and observed to be hibernating: two words for stopped, one
        # record, and they disagree.
        status: PARKED
        observedStatus: HIBERNATING
        creationTime: "2026-06-19T09:00:00Z"
        terminationTime: null
        lastUsageTime: "2026-07-01T04:44:12Z"
        info:
          name: analytics
          keyspace: analytics
          keyspaces:
            - analytics
          additionalKeyspaces: []
          cloudProvider: GCP
          region: us-central1
          tier: serverless
          capacityUnits: 1
          dbType: ""
          engineType: ""
        storage:
          nodeCount: 1
          replicationFactor: 1
          totalStorage: 5
          usedStorage: 0
        availableActions:
          - unpark
          - terminate
        studioUrl: https://7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26-us-central1.apps.astra.datastax.com
        grafanaUrl: https://7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26-us-central1.dashboard.astra.datastax.com
        cqlshUrl: https://7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26-us-central1.apps.astra.datastax.com/cqlsh
        graphqlUrl: https://7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26-us-central1.apps.astra.datastax.com/api/graphql
        dataEndpointUrl: https://7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26-us-central1.apps.astra.datastax.com/api/rest

conformance:
  - name: the message is a format string that was never formatted
    source: https://api.astra.datastax.com/v2/databases
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:notarealtoken"
    expect:
      status: 401
      body:
        # Two %s verbs, an internal service named, and its status quoted.
        'errors[0].message': "Resource, token, was malformed. Error: auth-manager returned 400 for call %s/v2/admin/tokens?%s"
        'errors[0].ID': 340016

  - name: the identifier key is in capitals beside a lowercase message
    source: https://api.astra.datastax.com/v2/databases
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers: {}
    expect:
      status: 401
      body:
        # A Go field exported with no tag, so the initialism's case is the
        # wire name.
        'errors[0].ID': 340002
        'errors[0].message': no bearer token in request

  - name: an unrouted path is four words of plain text
    source: https://api.astra.datastax.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: estate
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '\A404 page not found\s*\z'

  - name: a wrong method on a real path is the same four words
    source: https://api.astra.datastax.com/v2/databases
    verified: "2026-09-13"
    fixture: estate
    request:
      method: PUT
      path: /v2/databases
      headers: {}
    expect:
      status: 404
      body_matches: '\A404 page not found\s*\z'

  - name: a database says what it is and what it was observed to be
    source: https://github.com/datastax/astra-sdk-java
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Two fields of one type, agreeing here...
        '[0].status': ACTIVE
        '[0].observedStatus': ACTIVE
        # ...and disagreeing there, in two words for the same stopped state.
        '[1].status': PARKED
        '[1].observedStatus': HIBERNATING

  - name: one keyspace is named in three fields
    source: https://github.com/datastax/astra-sdk-java
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # A singular, a set, and a second set for the extra ones.
        '[0].info.keyspace': orders_main
        '[0].info.keyspaces[1]': orders_archive
        '[0].info.additionalKeyspaces[0]': orders_archive
        '[1].info.keyspaces[0]': analytics
        '[1].info.additionalKeyspaces': []
        '[0].info.name': orders
        '[0].info.cloudProvider': AWS
        '[0].info.region': us-east-1

  - name: five addresses on a record and two of them are web pages
    source: https://github.com/datastax/astra-sdk-java
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # A browser IDE and a Grafana dashboard, in a JSON listing, beside the
        # endpoints a program would call.
        '[0].studioUrl': https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com
        '[0].grafanaUrl': https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.dashboard.astra.datastax.com
        '[0].cqlshUrl': https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/cqlsh
        '[0].graphqlUrl': https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/api/graphql
        '[0].dataEndpointUrl': https://2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04-us-east-1.apps.astra.datastax.com/api/rest

  - name: the record carries its owners its storage and what may be done to it
    source: https://github.com/datastax/astra-sdk-java
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        '[0].orgId': 9c1d7e3a-5b2f-4a8c-b6d0-3e7f1a9c5d28
        '[0].ownerId': 4a6b8c0d-2e1f-43a5-9b7c-8d0e2f4a6b08
        '[0].storage.nodeCount': 3
        '[0].storage.replicationFactor': 3
        '[0].storage.totalStorage': 5
        '[0].storage.usedStorage': 1
        # park here, unpark there: the verbs a caller may use, on the record.
        '[0].availableActions[0]': park
        '[1].availableActions[0]': unpark
        '[0].creationTime': "2026-02-04T11:20:31Z"
        '[0].lastUsageTime': "2026-09-12T18:03:07Z"
        '[0].terminationTime': null

  - name: a paged listing answers a bare array with nothing counting it
    source: https://github.com/datastax/astra-sdk-java
    fixture: estate
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
      query:
        limit: "1"
        starting_after: 2f8b1c0a-4d6e-4b3f-9a7c-1e5d8f2a6b04
    expect:
      status: 200
      body:
        # No envelope at all, so the cursor is the last id you saw and the end
        # is an array with nothing in it.
        '[0].id': 7d3e9f1b-8c2a-4e6d-b0f4-5a9c3e7d1b26
        '[0].info.name': analytics

  - name: an organisation with no databases answers a bare empty array
    source: https://github.com/datastax/astra-sdk-java
    fixture: empty
    request:
      method: GET
      path: /v2/databases
      headers:
        Authorization: "Bearer AstraCS:cauldr0nf1xturek3y0000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
