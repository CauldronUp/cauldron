# Basin Recipe for Cauldron
#
# The forms listing, read from the Swagger document Basin serves without a
# credential at usebasin.com/api_docs/v1/swagger.yaml, and struck live against
# usebasin.com on 2026-09-13 with no credential and with a deliberately invalid
# one.
#
# **The two credential states answer two different shapes at two different
# statuses.** Struck live:
#
#   (no key)      400 {"error":"No API key was provided or no user session exists."}
#   wrong key     401 {"error":"invalid_token","error_description":"The access token is invalid","state":"unauthorized"}
#
# One is a sentence in `error`. The other is OAuth 2.0's `error` /
# `error_description` pair, where `error` holds a *code*. So `body.error` is
# prose on the first and a machine-readable token on the second, and a client
# that prints it shows a sentence or the word `invalid_token` depending on which
# failure it met.
#
# **The missing-key message conflates two kinds of caller.** "No API key was
# provided **or no user session exists**" -- a browser session and an API key,
# in one sentence, to a caller who has no browser. And it is a 400, so the
# status for a missing credential is the status for a malformed request.
#
# **`state` is not what `state` means.** OAuth 2.0 defines `state` as a value
# the *client* supplies and the server echoes back, for CSRF protection. Here
# the server invents one and puts the word `unauthorized` in it -- a third field
# saying what the status code and the error code have both already said.
#
# **The listing declares no response body.** `GET /api/v1/forms` has exactly one
# response, `200`, and its whole declaration is `description: Success`. No
# content, no schema, no example. Twenty-one responses elsewhere in the document
# do declare a body; this is not one of them, so a generated client for the most
# obvious endpoint in the API returns nothing typed at all.
#
# **The same collection is declared at two paths.** `/api/v1/forms` and
# `/api/v1/forms/` are separate entries in the document, as are
# `/api/v1/form_webhooks` and `/api/v1/form_webhooks/`. One resource, two paths,
# differing by a trailing slash.
#
# **A form carries a third party's secret.** `turnstile_secret` is a property of
# the form record, beside `turnstile_site_key` -- and a site key is public by
# design while a secret key is the half that must never leave the server. Both
# are on the object a GET returns.
#
# **Three CAPTCHA vendors, three booleans.** `force_recaptcha`,
# `force_hcaptcha` and `force_turnstile`, with nothing saying what happens if
# more than one is true.
#
# **Two list encodings on one record.** `notification_emails`,
# `notification_cc_emails` and `notification_bcc_emails` are comma-separated
# strings; `allowed_domains`, `blocked_domains` and `content_blacklist` are
# arrays. Both are lists, and which encoding you get depends on the field.
#
# **And the record uses both vocabularies at once.** `whitelist_source_domains`
# and `content_blacklist` sit beside `allowed_domains` and `blocked_domains` --
# the old words and the new ones, on the same object, for overlapping jobs.
#
# **`notification_emails` has a three-way protocol encoded in one string.** From
# its own description: "Omit this field to leave the current recipients
# unchanged, send an empty string to remove all recipients, or send a list to
# replace them." Absent, empty and populated are three different commands, in a
# field a form encoder cannot leave out.

recipe: basin
capability: forms
version: 0.1.0

upstream:
  api: v1
  docs: https://usebasin.com/docs/api
  spec: https://usebasin.com/api_docs/v1/swagger.yaml
  spec_hash: 2eb764950d4aee5efb9904b06a825cea984f647873862bddb4980f343218a072
  spec_seen: "2026-09-13"

auth:
  # `Authorization: Token <key>` -- a scheme name of its own, with a legacy
  # query-parameter form beside it.
  scheme: header
  header: Authorization
  prefix: "Token "
  keys:
    - cauldr0nbas1nf1xturek3y
  # Two states, two shapes, two statuses.
  absent_error: no_api_key
  rejected_error: invalid_token
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"
    code_type: string

resources:
  form:
    id:
      field: id
      style: numeric
      type: number
    fields:
      # Nullable, on a record whose name is not.
      uuid:
      name:
        type: string
      timezone:
        type: string
      project_id:
        type: integer
      project_name:
        type: string
      # A comma-separated string, where the domain lists below are arrays.
      notification_emails:
        type: string
      use_ajax:
        type: boolean
      autoreply:
        type: boolean
      # Three vendors, three booleans, and nothing saying what two of them
      # true means.
      force_recaptcha:
        type: boolean
      force_hcaptcha:
        type: boolean
      force_turnstile:
        type: boolean
      # A site key is public and a secret key is not, and both are here.
      turnstile_site_key:
      turnstile_secret:
      # The old vocabulary...
      whitelist_source_domains:
      content_blacklist:
        type: list
      # ...and the new one, on the same record.
      allowed_domains:
        type: list
      blocked_domains:
        type: list
      retention_days:
        type: integer
      duplicate_filter:
        type: boolean
      inbox_count:
        type: integer
      spam_count:
        type: integer
      trash_count:
        type: integer
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    # Declared twice in the document, here and again with a trailing slash.
    path: /api/v1/forms
    resource: form
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 25
      # The only two parameters the operation takes.
      cursor_param: page
      limit_param: "-"

errors:
  no_api_key:
    # 400 for a missing credential, and a sentence about browser sessions.
    status: 400
    message: No API key was provided or no user session exists.

  invalid_token:
    status: 401
    # OAuth 2.0's shape, where `error` is a code rather than prose.
    message_field: error_description
    code_field: error
    code: invalid_token
    message: The access token is invalid
    fields:
      # OAuth's client-supplied CSRF value, invented by the server and used
      # to repeat the status.
      state: unauthorized

fixtures:
  empty:
    form: []

  account:
    form:
      - id: 8127
        uuid: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        name: Contact us
        timezone: Europe/London
        project_id: 412
        project_name: Marketing site
        # A list, as a string.
        notification_emails: "team@example.com,ops@example.com"
        use_ajax: true
        autoreply: false
        force_recaptcha: false
        force_hcaptcha: false
        force_turnstile: true
        turnstile_site_key: 0x0000000000000000000000
        # The half that is meant to stay on a server, on a GET response.
        turnstile_secret: 0x0000000000000000000000000000000000000000
        whitelist_source_domains: "example.com,www.example.com"
        content_blacklist:
          - casino
        allowed_domains:
          - example.com
        blocked_domains: []
        retention_days: 90
        duplicate_filter: true
        inbox_count: 412
        spam_count: 37
        trash_count: 3
        created_at: "2026-01-15T09:30:00.000Z"
        updated_at: "2026-06-02T14:12:05.000Z"
      - id: 8128
        # Nullable, and null, where the name beside it cannot be.
        uuid: null
        name: Newsletter
        timezone: Europe/London
        project_id: 412
        project_name: Marketing site
        notification_emails: ""
        use_ajax: false
        autoreply: true
        force_recaptcha: false
        force_hcaptcha: false
        force_turnstile: false
        turnstile_site_key: null
        turnstile_secret: null
        whitelist_source_domains: null
        content_blacklist: []
        allowed_domains: []
        blocked_domains: []
        retention_days: 30
        duplicate_filter: false
        inbox_count: 0
        spam_count: 0
        trash_count: 0
        created_at: "2026-04-02T11:05:00.000Z"
        updated_at: "2026-04-02T11:20:00.000Z"

conformance:
  - name: a missing key is a bad request about a browser session
    source: https://usebasin.com/api/v1/forms
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers: {}
    expect:
      # 400, not 401, and a sentence naming something a programmatic caller
      # does not have.
      status: 400
      body:
        error: No API key was provided or no user session exists.

  - name: a wrong key is OAuth in the same field
    source: https://usebasin.com/api/v1/forms
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token notarealkey"
    expect:
      status: 401
      body:
        # `error` holds a code here and a sentence in the case above.
        error: invalid_token
        error_description: The access token is invalid
        # OAuth's client-supplied value, invented by the server, repeating
        # what the status and the code have both said.
        state: unauthorized

  - name: a form carries both halves of a CAPTCHA credential
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        # A site key is public by design. A secret key is the half that must
        # never leave the server, and it is on the object a GET returns.
        '[0].turnstile_site_key': 0x0000000000000000000000
        '[0].turnstile_secret': 0x0000000000000000000000000000000000000000
        '[0].force_turnstile': true

  - name: three CAPTCHA vendors as three booleans
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        # And nothing on the record says what two of them true would mean.
        '[0].force_recaptcha': false
        '[0].force_hcaptcha': false
        '[1].force_turnstile': false
        '[1].turnstile_secret': null

  - name: two list encodings on one record
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        # A comma-separated string...
        '[0].notification_emails': "team@example.com,ops@example.com"
        '[0].whitelist_source_domains': "example.com,www.example.com"
        # ...and arrays, for the same kind of thing.
        '[0].allowed_domains[0]': example.com
        '[0].content_blacklist[0]': casino
        '[0].blocked_domains': []

  - name: the empty string is a command rather than a value
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        # "Omit this field to leave the current recipients unchanged, send an
        # empty string to remove all recipients, or send a list to replace
        # them" -- three commands in one string field.
        '[1].notification_emails': ""
        '[1].whitelist_source_domains': null
        '[1].content_blacklist': []

  - name: the identifier that is nullable is not the one in the path
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        # An integer id that addresses the form, and a uuid beside it that
        # the schema permits to be absent.
        '[0].id': 8127
        '[0].uuid': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        '[1].id': 8128
        '[1].uuid': null
        '[0].name': Contact us
        '[1].name': Newsletter

  - name: a form counts its own submissions three ways
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body:
        '[0].inbox_count': 412
        '[0].spam_count': 37
        '[0].trash_count': 3
        '[0].retention_days': 90
        '[0].duplicate_filter': true
        '[0].project_id': 412
        '[0].project_name': Marketing site
        '[0].timezone': Europe/London
        '[0].use_ajax': true
        '[0].autoreply': false
        '[0].created_at': "2026-01-15T09:30:00.000Z"
        '[0].updated_at': "2026-06-02T14:12:05.000Z"
        '[1].retention_days': 30

  - name: the only paging parameter is a page number
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: account
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
      query:
        # `page` and `query` are the whole parameter list: there is no way to
        # ask for a different page size.
        page: "2"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'

  - name: an account with no forms answers an empty array
    source: https://usebasin.com/api_docs/v1/swagger.yaml
    fixture: empty
    request:
      method: GET
      path: /api/v1/forms
      headers:
        Authorization: "Token cauldr0nbas1nf1xturek3y"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
