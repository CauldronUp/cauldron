# Easyship Recipe for Cauldron
#
# The cheapest rate is cheapest because somebody else pays the rest of it.
#
# A cross-border shipment is either DDU or DDP. Under DDP the seller pays the
# import duty and tax, and the rate says so: it carries an import_duty_charge,
# an import_tax_charge and a handling fee on top of the shipping. Under DDU
# the customer pays them, to the courier, on the doorstep -- so the rate is
# lower, it sorts first, and the money has not gone away.
#
# Sorting by total_charge and taking the first is the obvious thing to do and
# it picks the parcel your customer gets a bill for. Some of them pay it, some
# refuse delivery, and the refused ones come back at your expense with a
# support ticket attached. Nothing in the response is wrong and nothing
# errors; the field that explains it is one word in a rate nobody reads.
#
# Six things worth modelling exactly:
#
#   1. Two rates for one parcel, differing by who pays customs. The DDU one
#      is cheaper by exactly the duty and tax it does not include.
#   2. The charges are separate fields and total_charge is their sum. A
#      seller comparing shipping_charge across couriers compares the part
#      that is most similar between them.
#   3. Delivery is a range in days, not a date. min_delivery_time and
#      max_delivery_time, so "when will it arrive" has no answer here and a
#      client that promises the minimum promises the best case.
#   4. Every rate carries a courier id and a courier name, and the name is
#      what a customer sees. Two couriers can be the same company through
#      different accounts, so the name is not unique and the id is not
#      meaningful to anybody.
#   5. Paging is nested under meta.pagination with a next object inside it,
#      so the cursor is three levels down and there is no cursor field at the
#      top of the body at all.
#   6. Money is a number with a currency beside it, and the currency is the
#      store's rather than the customer's -- so a rate quoted in one currency
#      is charged to a card in another and the figure shown is not the figure
#      billed.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No rate is calculated. Which couriers can carry a parcel, what they
#     charge and what a country's duty comes to is the entire product, and
#     the rates below are fixtures.
#   - The duty and tax figures here are a plausible pair rather than a real
#     calculation for the HS code and destination in the fixture.
#   - Labels, tracking, pickups and the shipment lifecycle are absent. Only
#     rating is modelled, which is where the DDU decision is made.
#
# The token below is a fixture, not a secret. It belongs to no account.

recipe: easyship
capability: shipping
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.easyship.com/reference/rates

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - prod_cauldron_easyship_token0

responses:
  list:
    style: wrapped
    key: rates
    count_field: meta.pagination.count
    page_field: meta.pagination.page
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"

# A rate is computed rather than stored and no route creates one, and the
# defaults below still do something: Cauldron applies them when it seeds a
# fixture, not only when a route creates a record. So a fixture that leaves
# import_duty_charge out gets the zero, which is what Easyship sends and is
# the whole point of declaring it.
#
# An earlier version of this file said the opposite -- that a default only
# fires on a create -- and removed five of them on that reasoning. That was
# wrong, and wrong in the way this project cares about: a claim about the
# tool, written into a Recipe, that nobody checked. The fixtures happened to
# set every one of those fields, so removing the declarations changed no
# bytes and no case failed, which is exactly why it survived review.
resources:
  rate:
    id:
      style: uuid
      field: courier_id
    fields:
      # What a customer sees, and not unique: two accounts with the same
      # company are two couriers with one name.
      courier_name:
        type: string
        required: true
      # DDU or DDP. One word, and it decides who gets the customs bill.
      incoterms:
        type: string
        default: DDU
      # The shipping alone. The part that is most similar between couriers,
      # and the one a comparison usually lands on.
      shipment_charge:
        type: number
      shipment_charge_total:
        type: number
      # Zero on a DDU rate, because the customer pays it rather than the
      # seller. Not absent -- zero, which reads as "no duty" rather than as
      # "not yours".
      import_duty_charge:
        type: number
        default: 0
      import_tax_charge:
        type: number
        default: 0
      # What Easyship charges for handling the prepayment, and it only exists
      # on a DDP rate.
      ddp_handling_fee:
        type: number
        default: 0
      # The sum, and what a sort lands on.
      total_charge:
        type: number
      # The store's currency, not the customer's.
      currency:
        type: string
        default: GBP
      # Days, not dates. A range, so there is no answer to "when will it
      # arrive".
      min_delivery_time:
        type: integer
      max_delivery_time:
        type: integer
      value_for_customs:
        type: number
      # Prose from the courier, and sometimes the only place a restriction
      # appears.
      courier_remarks:
        type: string
        null_when_unset: true

routes:
  - method: POST
    path: /2023-01/rates
    resource: rate
    operation: list
    pagination:
      style: page
      limit: 20
      limit_param: per_page
      cursor_param: page
      first_page: 1

  - method: GET
    path: /2023-01/rates/{id}
    resource: rate
    operation: get

errors:
  authentication_error:
    status: 401
    message: Unauthorized. Please check your access token.

  parameter_missing:
    status: 422
    message: The destination_address is required to rate a shipment.

  resource_missing:
    status: 404
    message: The requested resource was not found.

  rate_limit:
    status: 429
    message: Rate limit exceeded.

fixtures:
  empty: {}

  one-parcel:
    rate:
      # The cheap one. The customer pays the duty and the tax on the
      # doorstep, so neither is in this total, and it sorts first.
      - id: 1a2b3c4d-5e6f-4a80-9b12-c3d4e5f6a7b8
        courier_name: Cauldron Express Economy
        incoterms: DDU
        shipment_charge: 18.40
        shipment_charge_total: 18.40
        # The three customs charges are left out here on purpose, so the
        # zeros in the case below come from the declared defaults rather than
        # from this fixture. That is what makes those declarations checked:
        # remove one and the case fails.
        #
        # Zero because it is not the seller's, which reads the same as zero
        # because there is none.
        total_charge: 18.40
        currency: GBP
        min_delivery_time: 6
        max_delivery_time: 11
        value_for_customs: 120.00
        courier_remarks: Duties and taxes payable by the recipient on delivery.
      # The same parcel, the same courier, prepaid. Dearer by the duty, the
      # tax and the fee for handling them, and nobody is surprised at the
      # door.
      - id: 2b3c4d5e-6f70-4a81-8b23-c4d5e6f7a8b9
        courier_name: Cauldron Express Economy
        incoterms: DDP
        shipment_charge: 18.40
        shipment_charge_total: 18.40
        import_duty_charge: 9.60
        import_tax_charge: 24.00
        ddp_handling_fee: 3.50
        total_charge: 55.50
        currency: GBP
        min_delivery_time: 6
        max_delivery_time: 11
        value_for_customs: 120.00
      # A different courier, faster and dearer on shipping alone, and DDP.
      - id: 3c4d5e6f-7081-4a92-8b34-c5d6e7f8a9ba
        courier_name: Cauldron Air Priority
        incoterms: DDP
        shipment_charge: 41.00
        shipment_charge_total: 41.00
        import_duty_charge: 9.60
        import_tax_charge: 24.00
        ddp_handling_fee: 3.50
        total_charge: 78.10
        currency: GBP
        min_delivery_time: 2
        max_delivery_time: 4
        value_for_customs: 120.00

conformance:
  - name: the cheapest rate is the one the customer pays for
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
      json:
        destination_address:
          country_alpha2: US
    expect:
      status: 200
      body:
        # First, cheapest, and DDU. Sorting on total_charge and taking [0]
        # picks the parcel your customer gets a customs bill for -- some pay
        # it, some refuse delivery, and the refused ones come back at your
        # expense.
        rates[0].total_charge: 18.40
        rates[0].incoterms: DDU
        # The same courier, the same parcel, prepaid, and three times the
        # price. The difference is not a better service.
        rates[1].total_charge: 55.50
        rates[1].incoterms: DDP
        rates[1].courier_name: Cauldron Express Economy

  - name: a DDU rate reports no duty rather than somebody else's duty
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: GET
      path: /2023-01/rates/1a2b3c4d-5e6f-4a80-9b12-c3d4e5f6a7b8
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
    expect:
      status: 200
      body:
        # Zero, not absent and not null. The duty exists, it is thirty-three
        # pounds sixty on the DDP rate for the same parcel, and this says
        # zero -- which reads as "no duty" rather than as "not yours".
        import_duty_charge: 0
        import_tax_charge: 0
        ddp_handling_fee: 0
        total_charge: 18.40
        # The only place the arrangement is spelled out in words, and it is
        # prose in a field most clients never show.
        courier_remarks: Duties and taxes payable by the recipient on delivery.

  - name: and the prepaid rate carries all three charges
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: GET
      path: /2023-01/rates/2b3c4d5e-6f70-4a81-8b23-c4d5e6f7a8b9
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
    expect:
      status: 200
      body:
        # 18.40 plus 9.60 plus 24.00 plus 3.50 is 55.50. The shipping is
        # identical to the DDU rate above; everything else is the customs
        # bill, moved.
        shipment_charge: 18.40
        import_duty_charge: 9.60
        import_tax_charge: 24.00
        ddp_handling_fee: 3.50
        total_charge: 55.50

  - name: comparing shipping alone compares the part that barely differs
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
      json:
        destination_address:
          country_alpha2: US
    expect:
      status: 200
      body:
        # Two of the three rates have the same shipment_charge, because two
        # of them are the same courier. A comparison built on this field sees
        # a tie where the totals differ by thirty-seven pounds.
        rates[0].shipment_charge: 18.40
        rates[1].shipment_charge: 18.40
        rates[2].shipment_charge: 41.00

  - name: delivery is a range in days and not a date
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: GET
      path: /2023-01/rates/3c4d5e6f-7081-4a92-8b34-c5d6e7f8a9ba
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
    expect:
      status: 200
      body:
        # Two to four days, from an unstated starting point, in business days
        # the API does not name. A checkout that promises the minimum
        # promises the best case, and the worst case is twice as long.
        min_delivery_time: 2
        max_delivery_time: 4
      absent:
        # There is no date anywhere on a rate.
        - estimated_delivery_date
        - delivery_date

  - name: two rates can share a courier name
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
      json:
        destination_address:
          country_alpha2: US
    expect:
      status: 200
      body:
        # The same name on two rates with different ids and different totals.
        # A customer choosing by name is choosing between two things that
        # look identical, and code keying on the name collapses them.
        rates[0].courier_name: Cauldron Express Economy
        rates[1].courier_name: Cauldron Express Economy
        rates[0].courier_id: 1a2b3c4d-5e6f-4a80-9b12-c3d4e5f6a7b8
        rates[1].courier_id: 2b3c4d5e-6f70-4a81-8b23-c4d5e6f7a8b9

  - name: the currency is the store's and not the customer's
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: GET
      path: /2023-01/rates/1a2b3c4d-5e6f-4a80-9b12-c3d4e5f6a7b8
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
    expect:
      status: 200
      body:
        # Pounds, on a parcel going to the United States. The figure shown at
        # a checkout is not the figure a card is billed, and nothing on the
        # rate says what it will become.
        currency: GBP
        value_for_customs: 120

  - name: paging hides its cursor three levels down
    source: https://developers.easyship.com/reference/rates
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates?per_page=2&page=2
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
      json:
        destination_address:
          country_alpha2: US
    expect:
      status: 200
      body:
        # The third rate, because pages are one-based. And the paging state
        # is under meta.pagination rather than beside the rates, so a client
        # reading response.page finds nothing.
        rates[0].courier_name: Cauldron Air Priority
        meta.pagination.page: 2
        meta.pagination.count: 3
      absent:
        - page
        - count

  - name: a missing destination is refused rather than guessed at
    source: https://developers.easyship.com/reference/rates
    arm: parameter_missing
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates
      headers:
        Authorization: Bearer prod_cauldron_easyship_token0
      json:
        origin_address:
          country_alpha2: GB
    expect:
      status: 422
      body:
        # Under error, as a sentence, with no code beside it -- so there is
        # nothing to branch on and the only machine-readable part is the
        # status.
        error: The destination_address is required to rate a shipment.
      absent:
        - message
        - code

  - name: a bad token is refused
    source: https://developers.easyship.com/reference/authentication
    fixture: one-parcel
    request:
      method: POST
      path: /2023-01/rates
      headers:
        Authorization: Bearer not_the_token
      json:
        destination_address:
          country_alpha2: US
    expect:
      status: 401
      body:
        error: Unauthorized. Please check your access token.

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads"
    source: "https://developers.easyship.com/reference/rates"
    fixture: one-parcel
    request:
      method: POST
      path: "/2023-01/rates"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer prod_cauldron_easyship_token0"
    expect:
      status: 200
      body:
        "rates[0].courier_id": "2b3c4d5e-6f70-4a81-8b23-c4d5e6f7a8b9"
      absent:
        - "rates[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and page are the two names this listing reads on 2023-01 rates"
    source: "https://developers.easyship.com/reference/rates"
    fixture: one-parcel
    request:
      method: POST
      path: "/2023-01/rates"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer prod_cauldron_easyship_token0"
    expect:
      status: 200
      body:
        "rates[0].courier_id": "2b3c4d5e-6f70-4a81-8b23-c4d5e6f7a8b9"
      absent:
        - "rates[1]"

  # The names. This Recipe declares 1 field(s) on a rate that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a rate carries the field names this Recipe declares"
    source: "https://developers.easyship.com/reference/rates"
    fixture: one-parcel
    request:
      method: POST
      path: "/2023-01/rates"
      headers:
        "Authorization": "Bearer prod_cauldron_easyship_token0"
    expect:
      status: 200
      body:
        "rates[0].shipment_charge_total": 18.4


