# monday.com Recipe for Cauldron
#
# The value you want is a string containing JSON, inside a list you have to
# search.
#
# An item has no fields for its data. It has column_values, which is an array
# of objects, each with an id, a text, a type and a value -- and monday's own
# description of that value's type is "A JSON formatted string". So reading
# one number off an item means finding the right element by id, taking its
# value, and parsing JSON a second time out of a response you already parsed.
#
# The temptation is to read text instead, which is the display form and is
# right there. monday's own note on it: not all columns support textual
# value. So the easy field is null for some column types and lossy for the
# rest, and which ones is a property of the board rather than of the API.
#
# Five more the Recipe pins:
#
#   1. The columns belong to the board, so no two boards have the same shape.
#      A column id is not a name from a fixed vocabulary; it is whatever that
#      board's column is called, and code written against one board reads
#      undefined against the next.
#   2. There are forty-one kinds of column value behind one interface.
#      FormulaValue, BatteryValue, BoardRelationValue, CheckboxValue and
#      thirty-seven more, all arriving in the same array, so the list is
#      heterogeneous by design and a loop over it has forty-one shapes to
#      cope with.
#   3. The rate limit is a running balance, not a rate. complexity comes back
#      as before, after, query and reset_in_x_seconds, so what you have left
#      depends on what you have already asked and the answer tells you how
#      long until it refills.
#   4. Items are paged and the page is not the board. items_page holds a
#      cursor and the items, so a board's items are two levels below the
#      board and the count beside them is a different field again.
#   5. An id is a string that looks like a number. "9821740065" arrives
#      quoted, and a client that parses it to compare loses the last digits
#      once ids get long enough, which they have.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No GraphQL is parsed. A query naming boards gets the boards fixture
#     whatever fields it asked for.
#   - Nothing is paged or filtered. The cursor is a constant and the page is
#     always the whole list.
#   - The forty-one value types are described above and two are served. What
#     is here is the shape of the array and the JSON-in-a-string, not a
#     catalogue of every column monday has.
#   - Mutations, webhooks, files, the apps framework and the older
#     non-versioned API are not modelled.
#
# Keys below are fixtures, not secrets.

recipe: monday
capability: issues
version: 0.1.0

upstream:
  api: "2026-01"
  docs: https://developer.monday.com/api-reference/docs
  # Found by cauldron discover rather than recorded by hand. This
  # document declares the one route this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://monday.com/openapi.json
  spec_hash: f3f4604b82e48cb7b8d1c62f1e1d46f86fdb1de6de056908041ac9589994bf56
  spec_seen: "2026-09-05"

auth:
  scheme: header
  header: Authorization
  keys:
    - eyJhbGciOiJIUzI1NiJ9.cauldron.monday
required_headers:
  # The version is a header. Without it monday answers with an older one,
  # which is a different API that looks like this one.
  API-Version:
    error: missing_version

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  # One item, two levels below the board it belongs to.
  item:
    collection: data.boards[0].items_page.items
    id:
      style: digits
      length: 10
    fields:
      name:
        type: string
      created_at:
        type: datetime
      group_title:
        type: string
        in: group
        as: title

      # The status column. Its id is this board's, not a name from any
      # vocabulary.
      status_id:
        type: string
        in: column_values[0]
        as: id
      status_type:
        type: string
        in: column_values[0]
        as: type
      # The display form, which is the readable one and the lossy one.
      status_text:
        type: string
        in: column_values[0]
        as: text
      # And the real one: a string with JSON in it.
      status_value:
        type: string
        in: column_values[0]
        as: value

      # A formula column, which is one of the forty-one and one of the ones
      # with no textual value at all.
      formula_id:
        type: string
        in: column_values[1]
        as: id
      formula_type:
        type: string
        in: column_values[1]
        as: type
      formula_text:
        type: string
        in: column_values[1]
        as: text
        null_when_unset: true
      formula_value:
        type: string
        in: column_values[1]
        as: value
        null_when_unset: true

routes:
  - method: POST
    path: /v2
    resource: item
    operation: list
    selects: boards
    fields:
      # The board is above the page, and the count is not the page size.
      data.boards[0].id: "7845213906"
      data.boards[0].name: "Delivery"
      data.boards[0].items_count: 314
      data.boards[0].items_page.cursor: "MSw5ODIxNzQwMDY1LDE2"

      # A balance rather than a rate: what is left, what it cost, and how
      # long until it refills. It rides with the query it is the cost of,
      # the way ShipHero's does, rather than being a route of its own -- a
      # second selecting route on the same path is matched by any query
      # naming either field, and which of the two answers is then arbitrary.
      data.complexity.before: 10000000
      data.complexity.query: 3040
      data.complexity.after: 9996960
      data.complexity.reset_in_x_seconds: 47

errors:
  # This file declared no auth failure at all, so a real refusal fell back
  # to the runtime's own generic placeholder. Confirmed live 2026-09-05
  # against api.monday.com, no account and no key -- a missing credential
  # and a wrong one both answer this identical body.
  authentication_error:
    status: 401
    message: "Not authenticated"
    fields:
      extensions:
        code: NOT_AUTHENTICATED

  missing_version:
    status: 400
    message: "API-Version header is required"

  # The budget is spent. Not a rate limit that clears on the next second: a
  # balance that refills on a timer the answer told you about.
  complexity_exceeded:
    status: 429
    message: "Complexity budget exhausted, query cost 3040, budget left 120. Reset in 47 seconds."

  # A column that does not exist on this board. It exists on the board the
  # code was written against.
  unknown_column:
    status: 200
    message: "Column not found: status_1"

  unauthenticated:
    status: 401
    message: "Not Authenticated"

fixtures:
  empty: {}

  one-board:
    item:
      # A status column whose value is a JSON string. The text beside it says
      # "Working on it"; the value says which index that is, and the index is
      # what a mutation wants.
      - id: "9821740065"
        name: "Ship the delivery page"
        created_at: "2026-08-14T09:12:04Z"
        group_title: "This week"
        status_id: status
        status_type: status
        status_text: "Working on it"
        status_value: '{"index":0,"post_id":null,"changed_at":"2026-08-15T11:40:22.883Z"}'
        formula_id: formula_mkq1
        formula_type: formula
        formula_value: '{"value":"12.5"}'

      # The same two columns on the same board, so the ids match. The status
      # text is a different word and the index behind it is a different
      # number, and neither is derivable from the other.
      - id: "9821740066"
        name: "Fix the postcode lookup"
        created_at: "2026-08-15T11:40:22Z"
        group_title: "This week"
        status_id: status
        status_type: status
        status_text: Done
        status_value: '{"index":1,"post_id":null,"changed_at":"2026-08-18T10:31:07.442Z"}'
        formula_id: formula_mkq1
        formula_type: formula
        formula_value: '{"value":"3"}'

# Every case below is derived from the GraphQL schema monday publishes at
# api.monday.com/v2/get_schema, which needs no key and was read on
# 2026-08-19. The responses themselves have not been observed, so the cases
# carry no verified date.
conformance:
  - name: an unauthenticated request is refused the same way, credential or not
    source: https://api.monday.com/v2
    verified: "2026-09-05"
    request:
      method: POST
      path: /v2
      json:
        query: "{ me { id } }"
    expect:
      status: 401
      body:
        errors[0].message: "Not authenticated"
        errors[0].extensions.code: NOT_AUTHENTICATED

  - name: the value is a string with JSON inside it
    # monday's own description of the type: a JSON formatted string. So the
    # response is parsed, and then the field is parsed again.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { items_page { items { column_values { id text value } } } } }"
    expect:
      status: 200
      body:
        data.boards[0].items_page.items[0].column_values[0].value: '{"index":0,"post_id":null,"changed_at":"2026-08-15T11:40:22.883Z"}'
        data.boards[0].items_page.items[1].column_values[0].value: '{"index":1,"post_id":null,"changed_at":"2026-08-18T10:31:07.442Z"}'

  - name: the readable field is the lossy one
    # text is the display form. monday's own note: not all columns support
    # textual value. It says "Working on it" where the value says index 0,
    # and the index is what a mutation wants.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { items_page { items { column_values { text } } } } }"
    expect:
      status: 200
      body:
        data.boards[0].items_page.items[0].column_values[0].text: "Working on it"
        data.boards[0].items_page.items[1].column_values[0].text: Done

  - name: and some columns have no text at all
    # A formula column is one of the forty-one kinds and one of the ones
    # that cannot be rendered as text, so the field everybody reads is null.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { items_page { items { column_values { type text value } } } } }"
    expect:
      status: 200
      body:
        data.boards[0].items_page.items[0].column_values[1].type: formula
        data.boards[0].items_page.items[1].column_values[1].text: null
        data.boards[0].items_page.items[1].column_values[1].value: '{"value":"3"}'

  - name: the columns are a list to search, not fields to read
    # Reading item.status finds nothing. What is there is an array whose
    # elements carry the column id, and the id belongs to this board.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { items_page { items { name column_values { id } } } } }"
    expect:
      status: 200
      body:
        data.boards[0].items_page.items[0].column_values[0].id: status
        data.boards[0].items_page.items[0].column_values[1].id: formula_mkq1
      absent:
        - data.boards[0].items_page.items[0].status
        - data.boards[0].items_page.items[0].formula

  - name: the items are two levels below the board
    # items_page holds the cursor and the items, and the board's own count
    # is a different field beside it that is not the page size.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { id name items_count items_page { cursor items { id } } } }"
    expect:
      status: 200
      body:
        data.boards[0].name: Delivery
        data.boards[0].items_count: 314
        data.boards[0].items_page.cursor: "MSw5ODIxNzQwMDY1LDE2"
        data.boards[0].items_page.items[0].id: "9821740065"
      absent:
        - data.boards[0].items

  - name: an id is a string that looks like a number
    # Quoted on the wire, and long enough that parsing it to compare loses
    # the end of it.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        query: "query { boards { items_page { items { id } } } }"
    expect:
      status: 200
      body:
        data.boards[0].items_page.items[0].id: "9821740065"
        data.boards[0].items_page.items[1].id: "9821740066"

  - name: the rate limit is a balance and it says when it refills
    # before, query, after and reset_in_x_seconds, so what is left depends
    # on what has already been asked.
    source: https://api.monday.com/v2/get_schema
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
        API-Version: "2026-01"
      json:
        # Asked alongside the data it is the cost of, which is how the
        # field is used and the only shape this case can honestly assert.
        # Cauldron routes on the words in a query rather than reading the
        # selection set, so a route answers with everything it declares and
        # a complexity-only query would still be handed the board. Asserting
        # the board's absence here would be asserting a pruning step that
        # does not exist.
        query: "query { complexity { before query after reset_in_x_seconds } boards { items_page { items { id } } } }"
    expect:
      status: 200
      body:
        data.complexity.before: 10000000
        data.complexity.query: 3040
        data.complexity.after: 9996960
        data.complexity.reset_in_x_seconds: 47
        data.boards[0].items_page.items[0].id: "9821740065"

  - name: the version header is not optional
    # Without it monday answers with an older version, which is a different
    # API that looks like this one.
    source: https://developer.monday.com/api-reference/docs/api-versioning
    fixture: one-board
    request:
      method: POST
      path: /v2
      headers:
        Authorization: eyJhbGciOiJIUzI1NiJ9.cauldron.monday
      json:
        query: "query { boards { id } }"
    expect:
      status: 400
      body:
        errors[0].message: "API-Version header is required"
