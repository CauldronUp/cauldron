# Bible API Recipe for Cauldron
#
# The same verse comes back with different whitespace depending on the
# translation, and the whitespace is not the same kind.
#
#   ?translation=web  ->  "\nFor God so loved the world, ...life.\n\n"
#   ?translation=kjv  ->  "          For God so loved the world, ...life.\n"
#
# A leading newline and two trailing ones in the World English Bible; ten
# leading spaces and one trailing newline in the King James. One query parameter
# apart, on the same path, for the same verse. A client that renders the text
# raw gets a blank line for one translation and an indent for the other, and a
# client that compares two translations compares their padding as well as their
# words.
#
# **And the text is sent twice, both copies untrimmed.** The top-level `text`
# and `verses[0].text` are byte-identical, padding included, so a document that
# already carried the passage carries it again -- and neither copy is the one
# that has been cleaned up.
#
# Written against the live API rather than a document: every case below was
# checked against bible-api.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The two endpoints share no keys at all. A reference answers
#      {reference, verses, text, translation_id, translation_name,
#      translation_note}; /data/web/random answers {translation, random_verse}.
#      Not one field name in common, on one API.
#   2. The same concept has two names. A verse from a reference carries
#      book_name; the same verse from the random endpoint carries book. And the
#      string "Public Domain" arrives as translation_note on one and as license
#      on the other -- the same value, called a note in one place and a licence
#      in the other.
#   3. There are two 404s and one of them is nginx. An unknown book answers
#      {"error": "not found"} as JSON; a chapter number past the end of the book
#      answers nginx's own HTML page. Which one arrives depends on which half of
#      the reference was wrong.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two translations of one verse are served, and seventeen exist.
#   - The random endpoint is served with a recorded verse, because an emulator
#     answering the same verse every time is not random and saying so is more
#     honest than pretending.
#   - The nginx page is served as the error body Cauldron declares, so it
#     carries Cauldron's error content type rather than text/html. The bytes are
#     the real ones; the header is not.

recipe: bibleapi
capability: docs
version: 0.1.0

upstream:
  api: bibleapi
  docs: https://bible-api.com/

auth:
  # Public, no key.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # A bare {"error": "..."} when the application answers at all.
    style: flat
    message_field: error

resources:
  passage:
    id:
      style: opaque
      # The reference is the identifier and comes back under its own name.
      field: "-"
      carried_by: reference
    fields:
      reference:
        type: string
      verses:
        type: list
      # The same string as verses[0].text, padding and all.
      text:
        type: string
      translation_id:
        type: string
      translation_name:
        type: string
      # "Public Domain" -- the same value the other endpoint calls license.
      translation_note:
        type: string

  # The same path and the same verse, one query parameter apart. A separate
  # resource because the values differ, not just the fields on offer.
  kjv_passage:
    id:
      style: opaque
      field: "-"
      carried_by: reference
    fields:
      reference:
        type: string
      verses:
        type: list
      text:
        type: string
      translation_id:
        type: string
      translation_name:
        type: string
      translation_note:
        type: string

  random_verse:
    id:
      style: opaque
      field: "-"
      carried_by: translation
    fields:
      # Nested here and flattened into translation_* on the other endpoint.
      translation:
        type: map
      # book, not book_name, for the same thing.
      random_verse:
        type: map

routes:
  # The King James route first, because it declares the parameter that picks it
  # and a route matching a query beats one that declares nothing.
  - method: GET
    path: /{id}
    resource: kjv_passage
    operation: get
    matches_query:
      translation: kjv

  - method: GET
    path: /{id}
    resource: passage
    operation: get
    # An unknown book, which the application answers itself.
    not_found: unknown_book

  - method: GET
    path: /data/{id}/random
    resource: random_verse
    operation: get

  # A chapter past the end of a book, which never reaches the application.
  - method: GET
    path: /john 999:1
    error: never_reached_the_application

errors:
  unknown_book:
    status: 404
    # Two words, lowercase, and nothing else in the document.
    message: not found

  never_reached_the_application:
    status: 404
    message: "<html>\n<head><title>404 Not Found</title></head>\n<body>\n<center><h1>404 Not Found</h1></center>\n<hr><center>nginx</center>\n</body>\n</html>\n"

fixtures:
  empty: {}

  scripture:
    passage:
      - id: john 3:16
        reference: John 3:16
        verses:
          - book_id: JHN
            # book_name here; the random endpoint calls it book.
            book_name: John
            chapter: 3
            verse: 16
            # A leading newline and two trailing ones.
            text: "\nFor God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.\n\n"
        # The same string again, padding included.
        text: "\nFor God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.\n\n"
        translation_id: web
        translation_name: World English Bible
        translation_note: Public Domain

    kjv_passage:
      - id: john 3:16
        reference: John 3:16
        verses:
          - book_id: JHN
            book_name: John
            chapter: 3
            verse: 16
            # Ten spaces, and one trailing newline rather than two.
            text: "          For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.\n"
        text: "          For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.\n"
        translation_id: kjv
        translation_name: King James Version
        translation_note: Public Domain

    random_verse:
      - id: web
        translation:
          identifier: web
          name: World English Bible
          language: English
          language_code: eng
          # The same string the other endpoint calls translation_note.
          license: Public Domain
        random_verse:
          book_id: MRK
          # book, not book_name.
          book: Mark
          chapter: 5
          verse: 9
          # Newlines inside the verse, and typographic quotation marks.
          text: "He asked him,\n“What is your name?”\nHe said to him, “My name is Legion, for we are many.”\n"

conformance:
  - name: the World English Bible pads with a newline
    source: https://bible-api.com/john%203:16
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 3:16
    expect:
      status: 200
      body:
        reference: John 3:16
        # book_name here. The random endpoint calls the same thing book.
        "verses[0].book_name": John
        "verses[0].book_id": JHN
        "verses[0].chapter": 3
        "verses[0].verse": 16
        # One leading newline, two trailing.
        "verses[0].text": "\nFor God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.\n\n"
        translation_id: web

  - name: and the King James pads the same verse with ten spaces
    source: https://bible-api.com/john%203:16?translation=kjv
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 3:16?translation=kjv
    expect:
      status: 200
      body:
        # Same path, same verse, one query parameter apart -- and the padding
        # is a different kind of whitespace, not a different amount of it.
        "verses[0].text": "          For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.\n"
        translation_id: kjv

  - name: the text is sent twice, both copies untrimmed
    source: https://bible-api.com/john%203:16
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 3:16
    expect:
      status: 200
      body:
        # Byte-identical to verses[0].text above, padding included.
        text: "\nFor God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.\n\n"

  - name: the licence arrives as a note here
    source: https://bible-api.com/john%203:16
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 3:16
    expect:
      status: 200
      body:
        translation_name: World English Bible
        # Called a note on this endpoint and a licence on the other.
        translation_note: Public Domain
      absent:
        # Flattened here, nested there. Not one field name in common.
        - translation
        - random_verse
        - license

  - name: and as a licence on an endpoint with no keys in common
    source: https://bible-api.com/data/web/random
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /data/web/random
    expect:
      status: 200
      body:
        "translation.license": Public Domain
        "translation.identifier": web
      absent:
        # The other endpoint's six top-level keys, none of them here.
        - reference
        - verses
        - text
        - translation_id
        - translation_name
        - translation_note

  - name: the same verse field has two names
    source: https://bible-api.com/data/web/random
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /data/web/random
    expect:
      status: 200
      body:
        # book here; book_name on a reference.
        "random_verse.book": Mark
        "random_verse.book_id": MRK
      absent:
        - "random_verse.book_name"

  - name: newlines inside a verse, and typographic quotation marks
    source: https://bible-api.com/data/web/random
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /data/web/random
    expect:
      status: 200
      body:
        # U+201C and U+201D, not ASCII quotes, in a public-domain text.
        "random_verse.text": "He asked him,\n“What is your name?”\nHe said to him, “My name is Legion, for we are many.”\n"

  - name: an unknown book is the application's own 404
    source: https://bible-api.com/zzz%201:1
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /zzz 1:1
    expect:
      status: 404
      body:
        # Two words, lowercase, and nothing else in the document.
        error: not found

  - name: and a chapter past the end of the book is nginx's
    source: https://bible-api.com/john%20999:1
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 999:1
    expect:
      # The request never reaches the application, so the same API answers a
      # second 404 in a second content type. Which one arrives depends on which
      # half of the reference was wrong.
      status: 404
      body_matches: '<head><title>404 Not Found</title></head>'

  - name: and nginx signs it
    source: https://bible-api.com/john%20999:1
    verified: "2026-08-30"
    fixture: scripture
    request:
      method: GET
      path: /john 999:1
    expect:
      # No version here, unlike the same page on other hosts: the rule is off.
      status: 404
      body_matches: '<hr><center>nginx</center>'
