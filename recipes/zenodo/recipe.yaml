# Zenodo Recipe for Cauldron
#
# The same identifier appears four times, in four forms.
#
#   "id":       22173677                              <- a number
#   "recid":    "22173677"                            <- the same, as a string
#   "doi":      "10.5281/zenodo.22173677"             <- the same, prefixed
#   "doi_url":  "https://doi.org/10.5281/zenodo.22173677"
#
# One record, one identity, four fields. id and recid are the same digits and do
# not compare without a cast; doi is those digits with a prefix; doi_url is doi
# with another prefix. A fifth, conceptrecid, is "22173676" -- one less, as a
# string -- and conceptdoi is that one prefixed, so eight of the record's twenty
# top-level keys are the same two numbers written out differently.
#
# **And the record says it is finished three times, in three vocabularies.**
# "status": "published", "state": "done", "submitted": true. Three fields, three
# spellings of one fact, and nothing saying which is authoritative.
#
# Written against the live API rather than a document: every case below was
# checked against zenodo.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. modified and updated are byte-identical. Both are
#      "2026-08-30T12:02:17.093096+00:00", to the microsecond, in the same
#      record. Two names, one value, and no rule for choosing.
#   2. The array is called hits and lives inside an object called hits. The
#      listing is {"hits": {"hits": [...], "total": 7205905}}, so reaching the
#      records is response.hits.hits and the word means both the envelope and
#      its contents.
#   3. Two failures put their keys in different orders and use different
#      words. A record that does not exist answers {"status": 404, "message":
#      "The persistent identifier does not exist."}; a path that does not exist
#      answers {"message": "The requested URL was not found on the server. If
#      you entered the URL manually please check your spelling and try again.",
#      "status": 404} -- the web framework's own sentence, status last, and a
#      trailing newline after the closing brace.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Key order is not reproduced. The two failures differ in it on the wire and
#     that is recorded above rather than served, because order carries no
#     meaning in JSON and Go writes its own.
#   - One record is served, of 7,205,905, and its metadata, files, stats, owners
#     and links are left out: the Recipe keeps the identity fields, which is
#     what it is about.

recipe: zenodo
capability: docs
version: 0.1.0

upstream:
  api: zenodo
  docs: https://developers.zenodo.org/

auth:
  # Public for reading. Depositing needs a token.
  scheme: none

responses:
  list:
    style: wrapped
    # An array called hits, inside an object called hits.
    key: hits.hits
    count_field: hits.total
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: status
    code_type: number

resources:
  record:
    id:
      style: numeric
      # A number here, and the same digits as a string two fields away.
      field: id
      type: number
    fields:
      # The same digits, quoted.
      recid:
        type: string
      # One less, quoted.
      conceptrecid:
        type: string
      # The same digits, prefixed.
      doi:
        type: string
      # The one less, prefixed.
      conceptdoi:
        type: string
      # The doi, prefixed again.
      doi_url:
        type: string
      title:
        type: string
      created:
        type: string
      # Byte-identical to updated.
      modified:
        type: string
      updated:
        type: string
      revision:
        type: integer
      # Three spellings of one fact.
      status:
        type: string
      state:
        type: string
      submitted:
        type: boolean

routes:
  - method: GET
    path: /api/records
    resource: record
    operation: list

    pagination:
      # size and page, struck live on 2026-09-05 and both visible in
      # Zenodo's own next link: ?size=2&page=2 answers with links.next
      # "https://zenodo.org/api/records?page=3&size=2&sort=newest". A bare
      # request answers twenty-five.
      #
      # Neither is limit and neither is cursor. The runtime was reading both
      # of those against a collection of 7,266,591 records.
      style: page
      limit: 25
      limit_param: size
      cursor_param: page
      first_page: 1
  - method: GET
    path: /api/records/{id}
    resource: record
    operation: get
    not_found: pid_does_not_exist

  # A path that does not exist, answered in the framework's own words.
  - method: GET
    path: /api/nosuchthing
    error: url_not_found

errors:
  pid_does_not_exist:
    status: 404
    code: "404"
    # The API's own sentence, about a persistent identifier.
    message: The persistent identifier does not exist.

  url_not_found:
    status: 404
    code: "404"
    # The web framework's, about a URL somebody may have typed.
    message: "The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again."

fixtures:
  empty: {}

  deposits:
    record:
      - id: "22173677"
        # The same digits, as a string.
        recid: "22173677"
        # One less, as a string.
        conceptrecid: "22173676"
        # The same digits, prefixed.
        doi: 10.5281/zenodo.22173677
        # The one less, prefixed.
        conceptdoi: 10.5281/zenodo.22173676
        # The doi, prefixed again.
        doi_url: https://doi.org/10.5281/zenodo.22173677
        title: A deposit
        created: "2026-08-30T12:02:16.795762+00:00"
        # Byte-identical, to the microsecond.
        modified: "2026-08-30T12:02:17.093096+00:00"
        updated: "2026-08-30T12:02:17.093096+00:00"
        revision: 4
        # Three vocabularies for one fact.
        status: published
        state: done
        submitted: true

conformance:
  - name: the same identifier appears four times in four forms
    source: https://zenodo.org/api/records?size=1&sort=mostrecent
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records
    expect:
      status: 200
      body:
        # A number...
        "hits.hits[0].id": 22173677
        # ...the same digits as a string, so they do not compare without a
        # cast...
        "hits.hits[0].recid": "22173677"
        # ...the same digits prefixed...
        "hits.hits[0].doi": 10.5281/zenodo.22173677
        # ...and that prefixed again.
        "hits.hits[0].doi_url": https://doi.org/10.5281/zenodo.22173677

  - name: and a fifth form, one less
    source: https://zenodo.org/api/records?size=1&sort=mostrecent
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records
    expect:
      status: 200
      body:
        # The concept record: one below the record, as a string, and prefixed
        # again beside it.
        "hits.hits[0].conceptrecid": "22173676"
        "hits.hits[0].conceptdoi": 10.5281/zenodo.22173676

  - name: the record says it is finished three times
    source: https://zenodo.org/api/records?size=1&sort=mostrecent
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records
    expect:
      status: 200
      body:
        # Three fields, three spellings, and nothing saying which is
        # authoritative.
        "hits.hits[0].status": published
        "hits.hits[0].state": done
        "hits.hits[0].submitted": true
        "hits.hits[0].revision": 4

  - name: modified and updated are byte-identical
    source: https://zenodo.org/api/records?size=1&sort=mostrecent
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records
    expect:
      status: 200
      body:
        # To the microsecond, in the same record, under two names.
        "hits.hits[0].modified": "2026-08-30T12:02:17.093096+00:00"
        "hits.hits[0].updated": "2026-08-30T12:02:17.093096+00:00"
        # Created three tenths of a second earlier.
        "hits.hits[0].created": "2026-08-30T12:02:16.795762+00:00"

  - name: the array is called hits and lives inside an object called hits
    source: https://zenodo.org/api/records?size=1&sort=mostrecent
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records
    expect:
      status: 200
      body:
        # response.hits.hits, and the word means both the envelope and its
        # contents.
        "hits.hits[0].title": A deposit
        "hits.total": 1

  - name: a record that does not exist is about a persistent identifier
    source: https://zenodo.org/api/records/999999999999
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/records/999999999999
    expect:
      status: 404
      body:
        # The API's own sentence, and the status repeated in the body.
        message: The persistent identifier does not exist.
        status: 404

  - name: and a path that does not exist is about a URL somebody typed
    source: https://zenodo.org/api/nosuchthing
    verified: "2026-08-30"
    fixture: deposits
    request:
      method: GET
      path: /api/nosuchthing
    expect:
      # The web framework's sentence, on the same host, for the same status.
      status: 404
      body:
        message: "The requested URL was not found on the server. If you entered the URL manually please check your spelling and try again."
        status: 404
