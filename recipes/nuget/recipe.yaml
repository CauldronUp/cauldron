# NuGet Recipe for Cauldron
#
# The same package at two base URLs, and one of them is missing seventy-seven
# of its versions.
#
# NuGet's service index advertises the registration resource four times, under
# four versions of its type, pointing at three different base URLs:
#
#   RegistrationsBaseUrl            -> registration5-semver1/
#   RegistrationsBaseUrl/3.0.0-rc   -> registration5-semver1/
#   RegistrationsBaseUrl/3.4.0      -> registration5-gz-semver1/
#   RegistrationsBaseUrl/3.6.0      -> registration5-gz-semver2/
#
# A client picks one by asking for a version of the *resource type*, not of the
# data. Resolve the unversioned name -- the obvious thing to do -- and you get
# semver1. For Microsoft.Extensions.Logging that is 98 versions. The semver2
# base URL has 175.
#
# The seventy-seven that are missing are the SemVer 2.0.0 ones, and they are
# not obscure: 10.0.0-preview.1.25080.5 through 11.0.0-preview.7.26381.103 --
# every preview of the current major and the one before it. SemVer 1 cannot
# express a dotted prerelease identifier, so packages using one are omitted
# from the semver1 endpoints entirely. No error, no flag, no field anywhere
# saying that anything was left out. A tool that lists available versions is
# simply, quietly, two majors out of date.
#
# **And whether you must make another request is decided by how many versions
# the package has.** A registration small enough is returned whole: every page
# carries its versions inline and every page link is a fragment into the
# document already in hand. A large one is returned as pages with no items and
# real URLs to fetch, one request each.
#
#   newtonsoft.json                84 versions   inlined on both base URLs
#   microsoft.extensions.logging   98 / 175      inlined on semver1, split on semver2
#   serilog                        600 versions  split on both
#
# So Microsoft.Extensions.Logging is on both sides of the line at once: the
# same package, on the same day, comes back whole from one base URL and in
# pieces from the other, because crossing the threshold is what flips the
# shape. Nothing in the document announces which you got. The only way to know
# is to look for items and find it missing.
#
# The page link follows the same rule and so means two different things:
#
#   inlined   index.json#page/1.0.0-rc1-final/7.0.0
#   split     .../microsoft.extensions.logging/page/9.0.1/11.0.0-preview.7....json
#
# One is a fragment pointing back into the document you are already holding;
# following it downloads the index again. The other is a document you have to
# fetch.
#
# Written against the live API rather than a document: every case below was
# checked against api.nuget.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Asking for a package that does not exist tells you a blob does not
#      exist. The 404 body is Azure Blob Storage's XML error --
#      <Error><Code>BlobNotFound</Code><Message>The specified blob does not
#      exist. RequestId:... Time:...</Message></Error> -- with Content-Type
#      application/xml, from a JSON API. The storage layer is answering, and it
#      names itself while doing it.
#   2. @type is an array on the index and a string on everything under it. The
#      index is ["catalog:CatalogRoot", "PackageRegistration",
#      "catalog:Permalink"]; a page is "catalog:CatalogPage"; a leaf is
#      "Package". Code that reads @type has to handle both shapes or check
#      which object it is holding first.
#   3. A leaf carries three URLs to three different things: @id is the version
#      document, registration is the index it belongs to, and packageContent is
#      the .nupkg itself, on a fourth host prefix (v3-flatcontainer).
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The gz base URLs send Content-Encoding: gzip whether or not the request
#     asks for it, and this Recipe serves the JSON uncompressed. The compression
#     is signposted in the path, which is why it is a gap rather than the
#     headline: a client reading registration5-gz-semver2 has been told.
#   - The fixture holds a handful of the 175 versions. The page counts asserted
#     below -- 64, 34, 64, 64, 47 -- are the real ones from the live indexes,
#     and they are what carries the 98-against-175 claim.
#   - The catalog, search, autocomplete, flat container and publish endpoints
#     are absent.
#
# The fixture below is public data about a public package, recorded on the date
# in the cases.

recipe: nuget
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://learn.microsoft.com/en-us/nuget/api/registration-base-url-resource

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # Azure's XML, from a JSON API.
    style: text

resources:
  registration_v1:
    id:
      style: opaque
      field: "-"
    fields:
      "@id":
        type: string
      "@type":
        type: list
      count:
        type: integer
      # Pages with their versions inlined.
      items:
        type: list
      commitId:
        type: string

  registration_v2:
    id:
      style: opaque
      field: "-"
    fields:
      "@id":
        type: string
      "@type":
        type: list
      count:
        type: integer
      # Pages with nothing in them.
      items:
        type: list
      commitId:
        type: string

  registration_page:
    id:
      style: opaque
      field: "-"
    fields:
      package:
        type: string
        in: "-"
      lower:
        type: string
      upper:
        type: string
      count:
        type: integer
      items:
        type: list
      parent:
        type: string
      "@id":
        type: string
      "@type":
        type: string

routes:
  - method: GET
    path: /v3/registration5-semver1/{id}/index.json
    resource: registration_v1
    operation: get

  - method: GET
    path: /v3/registration5-gz-semver2/{id}/index.json
    resource: registration_v2
    operation: get

  - method: GET
    path: /v3/registration5-gz-semver2/{package}/page/{lower}/{id}.json
    resource: registration_page
    operation: get
    scope: [package]

errors:
  resource_missing:
    status: 404
    headers:
      Content-Type: application/xml
    message: |-
      <?xml version="1.0" encoding="utf-8"?><Error><Code>BlobNotFound</Code><Message>The specified blob does not exist.
      RequestId:07e60ff6-601e-0004-2a80-3530f0000000
      Time:2026-08-26T17:31:03.7211535Z</Message></Error>

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  gallery:
    registration_v1:
      - id: microsoft.extensions.logging
        "@id": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
        "@type":
          - catalog:CatalogRoot
          - PackageRegistration
          - catalog:Permalink
        commitId: 8bd0e0f5-5e26-4e4e-a5d0-1f0b4d3c9f11
        # Two pages, 64 + 34 = 98 versions, every one of them inlined.
        count: 2
        items:
          - "@id": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json#page/1.0.0-rc1-final/7.0.0
            "@type": catalog:CatalogPage
            count: 64
            lower: 1.0.0-rc1-final
            upper: 7.0.0
            items:
              - "@id": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/1.0.0-rc1-final.json
                "@type": Package
                registration: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
                packageContent: https://api.nuget.org/v3-flatcontainer/microsoft.extensions.logging/1.0.0-rc1-final/microsoft.extensions.logging.1.0.0-rc1-final.nupkg
                catalogEntry:
                  id: Microsoft.Extensions.Logging
                  version: 1.0.0-rc1-final
                  listed: true
          - "@id": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json#page/8.0.0/10.0.11
            "@type": catalog:CatalogPage
            count: 34
            lower: 8.0.0
            upper: 10.0.11
            items:
              - "@id": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/10.0.11.json
                "@type": Package
                catalogEntry:
                  id: Microsoft.Extensions.Logging
                  version: 10.0.11
                  listed: true

    registration_v2:
      - id: microsoft.extensions.logging
        "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
        "@type":
          - catalog:CatalogRoot
          - PackageRegistration
          - catalog:Permalink
        commitId: 8bd0e0f5-5e26-4e4e-a5d0-1f0b4d3c9f11
        # Three pages, 64 + 64 + 47 = 175 versions, and not one of them here.
        count: 3
        items:
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/page/1.0.0-rc1-final/3.1.23.json
            "@type": catalog:CatalogPage
            count: 64
            lower: 1.0.0-rc1-final
            upper: 3.1.23
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/page/3.1.24/9.0.0.json
            "@type": catalog:CatalogPage
            count: 64
            lower: 3.1.24
            upper: 9.0.0
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/page/9.0.1/11.0.0-preview.7.26381.103.json
            "@type": catalog:CatalogPage
            count: 47
            lower: 9.0.1
            upper: 11.0.0-preview.7.26381.103

      # Eighty-four versions: small enough that the semver2 index returns it
      # whole, with fragment links, exactly as semver1 does.
      - id: newtonsoft.json
        "@id": https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/index.json
        "@type":
          - catalog:CatalogRoot
          - PackageRegistration
          - catalog:Permalink
        commitId: 4c9a1f22-77bd-4a1e-9a3e-2f4b8c1d0e55
        count: 2
        items:
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/index.json#page/3.5.8/12.0.1-beta2
            "@type": catalog:CatalogPage
            count: 64
            lower: 3.5.8
            upper: 12.0.1-beta2
            items:
              - "@id": https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/3.5.8.json
                "@type": Package
                catalogEntry:
                  id: Newtonsoft.Json
                  version: 3.5.8
                  listed: true
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/index.json#page/12.0.1/13.0.5-beta1
            "@type": catalog:CatalogPage
            count: 20
            lower: 12.0.1
            upper: 13.0.5-beta1

    registration_page:
      - id: 11.0.0-preview.7.26381.103
        package: microsoft.extensions.logging
        "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/page/9.0.1/11.0.0-preview.7.26381.103.json
        "@type": catalog:CatalogPage
        parent: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
        count: 47
        lower: 9.0.1
        upper: 11.0.0-preview.7.26381.103
        items:
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/9.0.1.json
            "@type": Package
            catalogEntry:
              id: Microsoft.Extensions.Logging
              version: 9.0.1
              listed: true
          # A dotted prerelease identifier: SemVer 2.0.0, and invisible from
          # the semver1 base URL.
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/10.0.0-preview.1.25080.5.json
            "@type": Package
            catalogEntry:
              id: Microsoft.Extensions.Logging
              version: 10.0.0-preview.1.25080.5
              listed: true
          - "@id": https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/11.0.0-preview.7.26381.103.json
            "@type": Package
            catalogEntry:
              id: Microsoft.Extensions.Logging
              version: 11.0.0-preview.7.26381.103
              listed: true

conformance:
  - name: the same package has 98 versions at one base URL and 175 at another
    source: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        # Two pages of 64 and 34. A client that resolved the unversioned
        # RegistrationsBaseUrl -- the obvious thing to do -- is looking at
        # this one.
        count: 2
        "items[0].count": 64
        "items[1].count": 34
        "items[1].upper": 10.0.11

  - name: and the other base URL has three pages and a newer ceiling
    source: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        # 64 + 64 + 47 = 175, against 98. The seventy-seven that are missing
        # are the SemVer 2.0.0 versions, and the upper bound here is two
        # majors ahead of the other index.
        count: 3
        "items[0].count": 64
        "items[1].count": 64
        "items[2].count": 47
        "items[2].upper": 11.0.0-preview.7.26381.103

  - name: one index inlines its versions and the other does not
    source: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        # items.items is 64 entries here. On the semver2 index the same field
        # of the same document type is not there at all.
        "items[0].items[0].catalogEntry.version": 1.0.0-rc1-final
        "items[0].items[0].catalogEntry.id": Microsoft.Extensions.Logging

  - name: the second index returns pages with nothing in them
    source: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        "items[0].lower": 1.0.0-rc1-final
        "items[0].count": 64
      absent:
        # Sixty-four versions, according to the count beside it, and a second
        # request each to see any of them.
        - "items[0].items"
        - "items[1].items"
        - "items[2].items"

  - name: an inlined page links to itself with a fragment
    source: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/microsoft.extensions.logging/index.json
    expect:
      status: 200
      matches:
        # Both pages, and both are fragments pointing back into the document
        # already in hand -- so following either downloads the index again.
        "items[0].@id": 'index\.json#page/1\.0\.0-rc1-final/7\.0\.0$'
        "items[1].@id": 'index\.json#page/8\.0\.0/10\.0\.11$'

  - name: and a split page links to a document you have to fetch
    source: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/microsoft.extensions.logging/index.json
    expect:
      status: 200
      matches:
        # Same key, same position, a different kind of thing -- and the
        # difference is the size of the registration rather than the base URL.
        "items[2].@id": '/page/9\.0\.1/11\.0\.0-preview\.7\.26381\.103\.json$'

  - name: a smaller package comes back whole from the same base URL
    source: https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/newtonsoft.json/index.json
    expect:
      status: 200
      body:
        # Eighty-four versions is under the threshold, so this one is inlined
        # and its links are fragments -- on the very base URL that returned
        # Microsoft.Extensions.Logging in pieces. The shape is a property of
        # the package, not of the endpoint.
        count: 2
        "items[0].items[0].catalogEntry.version": 3.5.8
      matches:
        "items[0].@id": 'index\.json#page/3\.5\.8/12\.0\.1-beta2$'

  - name: a page belongs to the package that published it
    source: https://api.nuget.org/v3/registration5-gz-semver2/newtonsoft.json/page/9.0.1/11.0.0-preview.7.26381.103.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/newtonsoft.json/page/9.0.1/11.0.0-preview.7.26381.103.json
    expect:
      # The same page path under a different package is a 404: the bounds in
      # the URL mean nothing without the package in front of them.
      status: 404
      headers:
        Content-Type: application/xml
      body_matches: '<Error><Code>BlobNotFound</Code>'

  - name: fetching a page is where the SemVer 2 versions appear
    source: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/page/9.0.1/11.0.0-preview.7.26381.103.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-gz-semver2/microsoft.extensions.logging/page/9.0.1/11.0.0-preview.7.26381.103.json
    expect:
      status: 200
      body:
        # A dotted prerelease identifier is what SemVer 1 cannot express, and
        # is why the whole version is absent from the other base URL.
        "items[1].catalogEntry.version": 10.0.0-preview.1.25080.5
        "items[2].catalogEntry.version": 11.0.0-preview.7.26381.103
        count: 47
        parent: https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json

  - name: the type is an array on the index and a string beneath it
    source: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        # Three of them at the top, one string on a page, one string on a
        # leaf. Code reading @type has to know which object it is holding.
        "@type[0]": catalog:CatalogRoot
        "@type[1]": PackageRegistration
        "@type[2]": catalog:Permalink
        "items[0].@type": catalog:CatalogPage
        "items[0].items[0].@type": Package

  - name: a leaf carries three URLs to three different things
    source: https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/microsoft.extensions.logging/index.json
    expect:
      status: 200
      body:
        # The version document, the index it belongs to, and the .nupkg on a
        # fourth host prefix.
        "items[0].items[0].registration": https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json
      matches:
        "items[0].items[0].@id": '/1\.0\.0-rc1-final\.json$'
        "items[0].items[0].packageContent": '^https://api\.nuget\.org/v3-flatcontainer/.*\.nupkg$'

  - name: a package that does not exist reports that a blob does not exist
    source: https://api.nuget.org/v3/registration5-semver1/not.a.real.package.cauldron/index.json
    verified: "2026-08-26"
    fixture: gallery
    request:
      method: GET
      path: /v3/registration5-semver1/not.a.real.package.cauldron/index.json
    expect:
      # Azure Blob Storage's XML error, with Content-Type application/xml,
      # from a JSON API -- the storage layer answering, and naming itself
      # while it does. The seventh distinct not-found shape in this
      # collection.
      status: 404
      headers:
        Content-Type: application/xml
      body_matches: '<Error><Code>BlobNotFound</Code>'

  # The names. This Recipe declares 1 field(s) on a registration_v1 that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a registration_v1 carries the field names this Recipe declares"
    source: "https://api.nuget.org/v3/registration5-semver1/microsoft.extensions.logging/index.json"
    fixture: gallery
    request:
      method: GET
      path: "/v3/registration5-semver1/microsoft.extensions.logging/index.json"
    expect:
      status: 200
      body:
        "commitId": "8bd0e0f5-5e26-4e4e-a5d0-1f0b4d3c9f11"

  # The names. This Recipe declares 1 field(s) on a registration_v2 that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a registration_v2 carries the field names this Recipe declares"
    source: "https://api.nuget.org/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json"
    fixture: gallery
    request:
      method: GET
      path: "/v3/registration5-gz-semver2/microsoft.extensions.logging/index.json"
    expect:
      status: 200
      body:
        "commitId": "8bd0e0f5-5e26-4e4e-a5d0-1f0b4d3c9f11"

