# Logto Recipe for Cauldron
#
# Logto Cloud has no reachable anonymous entry point, and that absence is
# itself the finding this Recipe has to lead with. Ory Network, elsewhere in
# this collection, ships a fixed default project slug -- "playground" -- in
# its own OpenAPI servers block, and that project answers real (if
# challenge-gated) traffic. SuperTokens, also in this collection, runs a
# standing public test Core at try.supertokens.com. Logto's own published
# reference names the identical shape of host -- `https://[tenant_id].
# logto.app/`, one endpoint per project, confirmed live: `logto.app` on its
# own does not resolve at all, only a tenant subdomain of it does. No
# default tenant is named anywhere in the spec, and no publicly documented
# demo tenant could be found on Logto's own docs or marketing site. Creating
# one was not attempted -- this Recipe's standing instruction is not to sign
# up for anything, and a tenant is an account. `cloud.logto.io`, Logto's own
# console host, was reached and confirmed alive (GET /api/status answers
# 204; unmapped paths under /api answer a bare empty 404), which rules out
# "the whole product is down" as the explanation. It is a narrower fact:
# `cloud.logto.io` is the console that manages tenants, not a tenant itself,
# and every actual identity surface -- the OIDC session layer this
# collection's question is about, and the Management API below -- lives
# behind a tenant id this Recipe was never given one of.
#
# So this Recipe is built entirely from what Logto publishes and ships as
# source, not from anything struck live, and every case below says so with
# no verified date. Two kinds of evidence, used for different halves:
#
#   1. openapi.logto.io serves a genuinely large, genuinely public
#      description -- 240 paths, fetched from the URL upstream.spec below --
#      titled "Logto API references", version "Cloud" (the same literal word
#      Ory Network's own spec uses for its version, in this same
#      collection). It documents the Management API in real depth and
#      security: oauth2, client_credentials, minted from `POST /oidc/token`
#      -- and documents no error response shape for a single one of its 240
#      operations. Every path lists what a success returns and nothing about
#      what a refusal looks like, so the spec answers "does Logto ship a
#      public description" with yes and "does it describe how it says no"
#      with nothing at all.
#   2. Logto is MIT-licensed and its own source fills the gap the spec
#      leaves. packages/core/src/errors/RequestError and
#      packages/core/src/middleware/koa-auth read as a single, precise
#      contract: a RequestError's toBody() returns exactly {code, data,
#      details, message}, Koa serialises that as JSON automatically because
#      koa-error-handler.ts assigns it straight to ctx.body, and koa-auth's
#      own three failure branches are read below rather than guessed.
#
# What "no credential" says, and it is not one answer. Missing and wrong
# are different sentences here, on three separate branches, not two --
# where Ory Kratos's session_inactive collapses both into one id and
# SuperTokens' Core does not check the caller's own credential on this
# route at all (see supertokens/recipe.yaml):
#
#   no Authorization header at all       -> auth.authorization_header_missing
#   Authorization present, not "Bearer " -> auth.authorization_token_type_not_supported
#   Authorization: Bearer <bad JWT>      -> auth.unauthorized
#
# read straight out of extractBearerTokenFromHeaders and the catch clause in
# verifyBearerTokenFromRequest. The second of the three is worth pausing on:
# it is the one case in this trio that populates RequestErrorBody's `data`
# field, with {supportedTypes: ["Bearer"]} -- passed as the RequestError
# constructor's second argument, which toBody() picks up automatically. The
# other two never pass one, so `data` is not merely empty on those, it is
# absent from the body entirely -- JSON.stringify drops an undefined
# property rather than sending it as null, and a client checking for the
# literal key "data" gets a different true/false answer across three
# failures whose HTTP status never changes at all.
#
# The host, and the thread this shares with Ory Network's Recipe by name.
# Both are single-host-per-tenant SaaS -- Ory Network's servers block names
# `{project_slug}.projects.oryapis.com`, Logto's names `[tenant_id].
# logto.app` -- and both keep public and admin traffic on that one host
# rather than splitting hostnames the way Mezmo's Recipe in this collection
# does. Where they diverge is which credential the admin half demands. Ory
# Network mints two distinct token families for it -- a Personal Access
# Token or a workspace key, neither one an ordinary session credential.
# Logto mints exactly one kind of thing for everything: an OAuth2 access
# token from the tenant's own `/oidc/token`, the same endpoint an
# authorization_code or password grant for an ordinary end user would use.
# What makes a Logto Management API token "admin" is not its shape or its
# minting endpoint -- both are the standard OIDC ones any client uses -- it
# is the `resource` claim it was requested against
# (`https://[tenant-id].logto.app/api`) and the scope it carries. Three
# providers in this collection, three different answers to "how is the
# admin half told apart from everyone else's credential": Ory Network by
# token family, Census (also in this collection) by HTTP method on an
# otherwise single scheme, Logto by a claim inside an otherwise perfectly
# ordinary token.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No route models a 200. Every Management API object in the spec (a
#     user record alone requires fifteen fields) has no worked example
#     anywhere in Logto's own description, and inventing one to populate a
#     fixture would be exactly the fabrication this Recipe's standing
#     instructions rule out. The three routes below are error-only, the
#     shape mezmo/recipe.yaml's ingest route already uses for the same
#     reason on a different provider.
#   - Routing order -- whether an unmatched path is refused before or after
#     the credential is checked, the same question census/recipe.yaml and
#     mezmo/recipe.yaml both answer for their own providers -- is not
#     answered here at all. Answering it needs a live request, and none
#     was reachable.
#   - auth.forbidden (403, insufficient scope) is documented below from the
#     same source file as the other three, but is not one of the three
#     branches "no credential" can reach on its own -- it requires a
#     credential that verifies and lacks a scope, which nothing here can
#     produce without a real token.
#   - The end-user OIDC session layer itself -- Logto's actual answer to
#     this collection's question, the equivalent of Kratos's whoami or
#     SuperTokens' getSessionInfo -- is not in the 240-path spec at all. It
#     is the standard OIDC UserInfo endpoint plus a handful of undocumented
#     `/api/experience/*` routes for Logto's own embedded sign-in UI, and
#     neither is modelled, because neither is described anywhere public in
#     enough detail to build from without a reachable tenant.
#
# Every case below is read from the source above, not observed. No account
# was created and no tenant was ever reached.

recipe: logto
capability: auth
version: 0.1.0

upstream:
  api: Cloud
  docs: https://openapi.logto.io/
  spec: https://openapi.logto.io/source.json
  spec_hash: af51a8eb967f3f7fae7dd770fa1ec6441dc6a171753160f6148b6453b07c3711
  spec_seen: "2026-09-01"

auth:
  # Logto's three credential failures are the three verdicts, exactly, and
  # this is the first Recipe here where all three are named at once:
  #
  #   no Authorization header       absent     auth.authorization_header_missing
  #   a scheme that is not Bearer   malformed  auth.authorization_token_type_not_supported
  #   a Bearer value that does not
  #   verify                        rejected   auth.unauthorized
  #
  # Read from Logto's own server source rather than from a call -- see the
  # header -- and the mapping is the source's own: extractBearerTokenFromHeaders
  # throws the first for a header that is not there and the second for one
  # whose scheme it does not know, and jwtVerify's catch clause throws the
  # third for everything that gets past both.
  #
  # Two of these were reached by arming them when this Recipe was written,
  # which is the device kratos/recipe.yaml and ory/recipe.yaml still use for
  # their own single-route session checks. Nothing about the credential is
  # armed here now. The one case that still arms is auth.forbidden, and it
  # should: a token that verifies and lacks the scope is not a credential
  # verdict at all -- the credential was accepted.
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-logto-fixture-management-token-000000
  absent_error: authorization_header_missing
  malformed_error: authorization_token_type_not_supported
  rejected_error: unauthorized

responses:
  error:
    style: flat
    message_field: message
    code_field: code

routes:
  - method: GET
    path: /api/users
    error: authorization_header_missing

errors:
  # What extractBearerTokenFromHeaders throws when the Authorization header
  # is not present at all. No data, no details -- RequestError's second
  # constructor argument was never passed, so toBody() serialises neither.
  authorization_header_missing:
    status: 401
    code: auth.authorization_header_missing
    message: "Authorization header is missing."

  # The malformed verdict: a scheme Logto does not recognise. The one branch
  # of the three that populates `data` -- see the header for why that makes
  # it the odd one out.
  authorization_token_type_not_supported:
    status: 401
    code: auth.authorization_token_type_not_supported
    message: "Authorization type is not supported."
    fields:
      data:
        supportedTypes:
          - Bearer

  # The rejected verdict, and the catch-all: a syntactically fine Bearer
  # value that does not verify -- expired, wrong tenant, wrong signature --
  # falls through jwtVerify's catch clause to this generic code rather than
  # naming what was wrong with it.
  unauthorized:
    status: 401
    code: auth.unauthorized
    message: "Unauthorized. Please check credentials and its scope."

  # Documented in the header, not routed -- see the fidelity gaps for why
  # nothing here can arm a credential that verifies and merely lacks scope.
  forbidden:
    status: 403
    code: auth.forbidden
    message: "Forbidden. Please check your user roles and permissions."

fixtures:
  empty: {}

conformance:
  - name: no Authorization header at all names the header, not the token
    source: https://raw.githubusercontent.com/logto-io/logto/master/packages/core/src/middleware/koa-auth/utils.ts
    fixture: empty
    request:
      method: GET
      path: /api/users
    expect:
      status: 401
      body:
        code: auth.authorization_header_missing
        message: "Authorization header is missing."
      absent:
        - data
        - details

  - name: a Basic credential is a token type problem, not a missing-header one, and it is the only branch that carries data
    source: https://raw.githubusercontent.com/logto-io/logto/master/packages/core/src/middleware/koa-auth/utils.ts
    fixture: empty
    request:
      method: GET
      path: /api/users
      headers:
        Authorization: "Basic dXNlcjpwYXNz"
    expect:
      status: 401
      body:
        code: auth.authorization_token_type_not_supported
        message: "Authorization type is not supported."
        data.supportedTypes[0]: Bearer

  - name: a Bearer value that does not verify is a third, generic answer
    source: https://raw.githubusercontent.com/logto-io/logto/master/packages/core/src/middleware/koa-auth/index.ts
    fixture: empty
    request:
      method: GET
      path: /api/users
      headers:
        Authorization: Bearer junk-token-not-a-real-jwt
    expect:
      status: 401
      body:
        code: auth.unauthorized
        message: "Unauthorized. Please check credentials and its scope."
      absent:
        - data.supportedTypes

  - name: three failures, one HTTP status, and only one of them says data
    # Not a live probe -- a restatement of the three cases above, side by
    # side, because the point is comparative and no single request shows it.
    source: https://raw.githubusercontent.com/logto-io/logto/master/packages/core/src/errors/RequestError/index.ts
    fixture: empty
    request:
      method: GET
      path: /api/users
      headers:
        Authorization: "Digest realm=nowhere"
    expect:
      status: 401
      body:
        code: auth.authorization_token_type_not_supported
        data.supportedTypes[0]: Bearer

  - name: a credential that verifies but lacks scope is a fourth, separate answer
    source: https://raw.githubusercontent.com/logto-io/logto/master/packages/core/src/middleware/koa-auth/index.ts
    arm: forbidden
    fixture: empty
    request:
      method: GET
      path: /api/users
      headers:
        Authorization: Bearer cauldron-logto-scoped-but-insufficient-fixture
    expect:
      status: 403
      body:
        code: auth.forbidden
        message: "Forbidden. Please check your user roles and permissions."
