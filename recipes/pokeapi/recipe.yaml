# PokéAPI Recipe for Cauldron
#
# The description is still formatted for a Game Boy.
#
#   "flavor_text": "A strange seed was\nplanted on its\nback at birth.\fThe
#                   plant sprouts\nand grows with\nthis POKéMON."
#
# Three things in one string. The newlines are hard wraps at the original 1996
# screen's column width, so re-flowing the text in a modern layout gives ragged
# lines that break mid-phrase. The \f is a form feed, U+000C, the page break from
# the handheld's text box -- a control character from a 1996 cartridge, in a JSON
# string, today. And POKéMON is spelled with a lowercase é between two capitals,
# because the font in those games had no capital É.
#
# None of it is escaped, flagged or duplicated in a cleaned-up field. A client
# that prints flavor_text prints the wraps; one that splits on \n does not split
# at the form feed; one that upper-cases the string gets POKÉMON, which is not
# what the source said.
#
# **And there are twenty-eight English descriptions, not one.** flavor_text_entries
# is a flat array of a hundred and two, one per game version per language, each
# carrying language and version as references. So "the English description" is a
# filter that returns twenty-eight answers, in no stated order, and picking the
# first is picking Red from 1996.
#
# Written against the live API rather than a document: every case below was
# checked against pokeapi.co on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. A miss is the bare plain text "Not Found" with a 404, from an API whose
#      every success is JSON. A client calling .json() on it throws rather than
#      reading a status.
#   2. A listing gives you name and url and nothing else. There is no id field,
#      so the identifier exists only as a path segment inside the URL, and
#      anything more than the name costs one request per row.
#   3. previous is present and null on the first page, where next is a full URL
#      with the offset already in it.
#   4. Lookups are case-insensitive: /pokemon/BULBASAUR answers the same record
#      as /pokemon/bulbasaur and /pokemon/1. Three spellings, one resource, and
#      the response says nothing about which was asked for.
#   5. types is [{slot, type: {name, url}}] -- a wrapper object per entry with
#      an ordinal, so the type name is two levels down and the array index is
#      not the slot.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - flavor_text_entries holds two of its hundred and two, chosen to show the
#     shape: one English and one Japanese. The count is stated above and is not
#     in the fixture.
#   - sprites is served with its ten top-level keys, four of them null, and
#     without the other and versions subtrees, which are several hundred more
#     URLs each.
#   - The list is served with four of 1351, and count reports four. The real
#     count is the point of the field and cannot be held beside a fixture of
#     four rows.
#   - A listing row is modelled as its own resource, because it is its own
#     shape: name and url, and no identifier. The detail record does send id,
#     so the two are not the same thing served twice.
#   - previous is served as a constant null. The format describes the cursor
#     going forward and has no companion for the one going back, so the field
#     is right on the first page and wrong on every other: live, page two
#     carries previous as a whole URL. The cases assert it only where it is
#     true, and the last-page case asserts next alone.
#   - Only pokemon and pokemon-species are modelled. The API has more than fifty
#     resource types and they cross-reference each other by URL.
#
# The species below are public and were recorded on the date in the cases.

recipe: pokeapi
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://pokeapi.co/docs/v2

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  list:
    style: wrapped
    count_field: count
    cursor_field: next
    # A whole URL with the offset already in it, not an opaque token.
    cursor_url: absolute
    # Present and null on the first page.
    cursor_null: true
  error:
    # "Not Found", and nothing else, from an API whose successes are JSON.
    style: text

resources:
  pokemon:
    id:
      style: numeric
      field: id
      type: number
    fields:
      name:
        type: string
      height:
        type: integer
      weight:
        type: integer
      base_experience:
        type: integer
      # [{slot, type: {name, url}}] -- an ordinal and a reference, so the name
      # is two levels down.
      types:
        type: list
      stats:
        type: list
      # Ten keys, four of them null.
      sprites:
        type: map

  # A listing row is a different shape from the record it points at: a name
  # and a URL, and no identifier at all. The identity is inside the URL, as a
  # path segment, and there is nothing else to address the row by.
  pokemonref:
    collection: results
    id:
      style: numeric
      field: "-"
      carried_by: url
    fields:
      name:
        type: string
      url:
        type: string

  species:
    id:
      style: numeric
      field: id
      type: number
    fields:
      name:
        type: string
      # A hundred and two entries, one per game version per language.
      flavor_text_entries:
        type: list
      names:
        type: list
      color:
        type: map

routes:
  - method: GET
    path: /api/v2/pokemon
    resource: pokemonref
    operation: list
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 20
    fields:
      # Present, and null, where next is a whole URL. This format has a cursor
      # field and no companion for the one pointing backwards, so it is a
      # constant here: right on the first page, which is the one the cases ask
      # for, and stated rather than computed.
      previous: null

  - method: GET
    path: /api/v2/pokemon/{id}
    resource: pokemon
    operation: get
    not_found: not_found

  - method: GET
    path: /api/v2/pokemon-species/{id}
    resource: species
    operation: get
    not_found: not_found

errors:
  not_found:
    status: 404
    headers:
      Content-Type: text/plain; charset=utf-8
    message: Not Found

fixtures:
  empty: {}

  kanto:
    pokemon:
      - id: "1"
        name: bulbasaur
        height: 7
        weight: 69
        base_experience: 64
        types:
          # The slot is the ordinal and the array index is not it.
          - slot: 1
            type:
              name: grass
              url: https://pokeapi.co/api/v2/type/12/
          - slot: 2
            type:
              name: poison
              url: https://pokeapi.co/api/v2/type/4/
        stats:
          - base_stat: 45
            effort: 0
            stat:
              name: hp
              url: https://pokeapi.co/api/v2/stat/1/
        sprites:
          back_default: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/1.png
          # Four of the ten are null, present.
          back_female: null
          back_shiny: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/shiny/1.png
          back_shiny_female: null
          front_default: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png
          front_female: null
          front_shiny: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/1.png
          front_shiny_female: null

    pokemonref:
      - id: "1"
        name: bulbasaur
        url: https://pokeapi.co/api/v2/pokemon/1/
      - id: "2"
        name: ivysaur
        url: https://pokeapi.co/api/v2/pokemon/2/
      - id: "3"
        name: venusaur
        url: https://pokeapi.co/api/v2/pokemon/3/
      # A fourth, so the cursor has somewhere to point.
      - id: "4"
        name: charmander
        url: https://pokeapi.co/api/v2/pokemon/4/

    species:
      - id: "1"
        name: bulbasaur
        flavor_text_entries:
          # Two of a hundred and two. Hard wraps at the 1996 screen's width, a
          # form feed where the text box paged, and a lowercase e-acute between
          # two capitals because that font had no capital E-acute.
          - flavor_text: "A strange seed was\nplanted on its\nback at birth.\fThe plant sprouts\nand grows with\nthis POKéMON."
            language:
              name: en
              url: https://pokeapi.co/api/v2/language/9/
            version:
              name: red
              url: https://pokeapi.co/api/v2/version/1/
          - flavor_text: "うまれたときから　せなかに\nふしぎな　タネが　うえてあって\nからだと　ともに　そだつという。"
            language:
              name: ja-hrkt
              url: https://pokeapi.co/api/v2/language/1/
            # A different game entirely: the sixteen Japanese entries and the
            # twenty-eight English ones are not the same set of versions.
            version:
              name: x
              url: https://pokeapi.co/api/v2/version/23/
        names:
          - language:
              name: ja-hrkt
              url: https://pokeapi.co/api/v2/language/1/
            name: フシギダネ
        color:
          name: green
          url: https://pokeapi.co/api/v2/pokemon-color/5/

conformance:
  - name: the description is still formatted for a Game Boy
    source: https://pokeapi.co/api/v2/pokemon-species/1
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon-species/1
    expect:
      status: 200
      body:
        # Hard wraps, a form feed at the page break, and a lowercase e-acute
        # between two capitals. None of it escaped, flagged or cleaned up.
        "flavor_text_entries[0].flavor_text": "A strange seed was\nplanted on its\nback at birth.\fThe plant sprouts\nand grows with\nthis POKéMON."
        "flavor_text_entries[0].version.name": red

  - name: the entries are one per game version per language
    source: https://pokeapi.co/api/v2/pokemon-species/1
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon-species/1
    expect:
      status: 200
      body:
        # A hundred and two live, twenty-eight of them English. "The English
        # description" is a filter that returns twenty-eight answers, and
        # picking the first is picking Red from 1996.
        "flavor_text_entries[0].language.name": en
        "flavor_text_entries[1].language.name": ja-hrkt
        "flavor_text_entries[1].version.name": x

  - name: a miss is bare plain text from an API whose successes are JSON
    source: https://pokeapi.co/api/v2/pokemon/notarealpokemon
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon/notarealpokemon
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '^Not Found$'

  - name: a listing gives you a name and a URL and no identifier
    source: https://pokeapi.co/api/v2/pokemon?limit=3
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon?limit=3
    expect:
      status: 200
      body:
        # The identifier exists only as a path segment inside the URL, so
        # anything more than the name costs one request per row.
        "results[0].name": bulbasaur
        "results[0].url": https://pokeapi.co/api/v2/pokemon/1/
        "results[2].name": venusaur
      absent:
        - results[0].id
        - results[0].types

  - name: previous is present and null on the first page
    source: https://pokeapi.co/api/v2/pokemon?limit=3
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon?limit=3
    expect:
      status: 200
      body:
        # 1351 live. next is a full URL with the offset already in it.
        count: 4
        # Present, and null, where next is a URL.
        previous: null
      matches:
        # A whole URL with the offset already in it, not an opaque token,
        # so a client concatenating a base to it builds an address that does
        # not exist.
        next: '/api/v2/pokemon\?limit=3&offset=3$'

  - name: the lookup is case-insensitive and says nothing about it
    source: https://pokeapi.co/api/v2/pokemon/BULBASAUR
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon/1
    expect:
      status: 200
      body:
        # /pokemon/1, /pokemon/bulbasaur and /pokemon/BULBASAUR are one record,
        # and the response says nothing about which was asked for.
        id: 1
        name: bulbasaur
        height: 7
        weight: 69

  - name: a type is an ordinal and a reference, two levels down
    source: https://pokeapi.co/api/v2/pokemon/1
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon/1
    expect:
      status: 200
      body:
        # The array index is not the slot, and the name is inside a wrapper.
        "types[0].slot": 1
        "types[0].type.name": grass
        "types[1].slot": 2
        "types[1].type.name": poison
        "stats[0].stat.name": hp
        "stats[0].base_stat": 45

  - name: four of the ten sprite keys are present and null
    source: https://pokeapi.co/api/v2/pokemon/1
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon/1
    expect:
      status: 200
      body:
        # Present and null rather than absent, so "front_female" in sprites is
        # true for every Pokemon and tells you nothing.
        "sprites.front_default": https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png
        "sprites.front_female": null
        "sprites.back_female": null
        "sprites.back_shiny_female": null

  - name: and next is null rather than absent on the last page
    source: https://pokeapi.co/api/v2/pokemon?limit=3&offset=1348
    verified: "2026-08-28"
    fixture: kanto
    request:
      method: GET
      path: /api/v2/pokemon?limit=3&offset=3
    expect:
      status: 200
      body:
        # Both pointers are always present and each is null at its own end of
        # the list, so "next" in body is true on every page and says nothing
        # about whether there is one. Live, this page carries next: null and a
        # previous URL; the Recipe's previous is the constant described in the
        # gaps above, so the case asserts the pointer this route computes.
        next: null

  # The names. This Recipe declares 1 field(s) on a pokemon that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a pokemon carries the field names this Recipe declares"
    source: "https://pokeapi.co/api/v2/pokemon/BULBASAUR"
    fixture: kanto
    request:
      method: GET
      path: "/api/v2/pokemon/1"
    expect:
      status: 200
      body:
        "base_experience": 64

  # The names. This Recipe declares 2 field(s) on a species that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a species carries the field names this Recipe declares"
    source: "https://pokeapi.co/api/v2/pokemon-species/1"
    fixture: kanto
    request:
      method: GET
      path: "/api/v2/pokemon-species/1"
    expect:
      status: 200
      body:
        "color.name": "green"
        "names[0].language.name": "ja-hrkt"


