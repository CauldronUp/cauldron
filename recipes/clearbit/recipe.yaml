    # lookup answers 404, and this Recipe cannot trigger that live without a
    # paid key, so it is demonstrated here by asking for an address this
    # Recipe's own fixture does not hold.
    source: https://web.archive.org/web/20230603101445/https://dashboard.clearbit.com/docs
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=nobody@example.com
