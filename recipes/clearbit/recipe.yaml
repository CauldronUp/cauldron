# Clearbit Recipe for Cauldron
#
# Clearbit was acquired by HubSpot in December 2023. What that changed, as of
# this Recipe's probe date, is the documentation, not the wire. Fetching
# https://dashboard.clearbit.com/docs today 302s to https://app.clearbit.com/
# auth/login -- the reference a developer used to be able to read for free
# now requires a HubSpot-owned account -- but person.clearbit.com and
# company.clearbit.com themselves answer every request this Recipe sent them,
# with the same X-Api-Version: 2019-12-19 the archived documentation names.
# The honest finding is not "retired": it is "still live, still answering,
# and no longer explaining itself for free." Every case below that reads from
# documentation cites a Wayback Machine snapshot of dashboard.clearbit.com/
# docs taken 2023-06-03 (https://web.archive.org/web/20230603101445/https://
# dashboard.clearbit.com/docs), because that snapshot is the only copy of
# Clearbit's own field-level documentation this Recipe could still read.
#
# **The historical third state survives, and Clearbit's own documentation
# contradicts itself about its shape.** Both the Person API and the Company
# API describe an asynchronous path in identical language: "If we can find
# the person we'll return a 200 status containing the record's attributes.
# Sometimes we'll need to asynchronously lookup the person, in which case
# we'll return an empty 202 status." -- stated twice, once per API, always
# "empty." The same document's own general Errors section lists "queued" as
# an error TYPE beside params_invalid, unknown_record, unknown_route and
# rate_limit -- "Lookup queued. Try this request again in a few minutes." --
# implying the 202 carries a body shaped like every other failure,
# {"error":{"type":"queued","message":"..."}}}. One page, two claims about
# the same status code, and this Recipe cannot call a real 202 into existence
# to settle it without a paid key and a name Clearbit has not already cached
# -- both forbidden here. It serves the more specific, twice-repeated claim
# (empty body) and states the contradiction rather than picking a shape and
# hiding the doubt. Separately, Clearbit publishes a streaming variant
# (person-stream.clearbit.com) whose own description says plainly "requests
# made to the streaming API will never return a HTTP 202 status response";
# it exists specifically to convert the third state into a longer wait
# instead, and is not modelled, because it is a different host this Recipe
# never called.
#
# **Absent and malformed collapse into one message; only a well-formed wrong
# credential gets the other one -- and Clearbit accepts two schemes as
# equally well-formed.** Five shapes were struck live against
# person.clearbit.com/v2/people/find, person.clearbit.com/v2/combined/find
# and company.clearbit.com/v2/companies/find on 2026-09-02: no Authorization
# header at all; "Authorization: junktoken12345" (no scheme keyword);
# "Authorization: Bogus junktoken12345" (a nonsense scheme); "Authorization:
# Bearer " (the Bearer keyword with nothing after it); and "Authorization:
# Basic not_valid_base64!!!" (a Basic value that will not decode). All five
# answered the same 142-byte body, byte for byte:
# {"error":{"type":"auth_required","message":"Authentication is required for
# this action. Sign up at https://clearbit.com"}}, carrying
# X-RateLimit-Limit/Remaining/Reset and X-Api-Version headers. Only a
# credential that parses -- "Authorization: Basic sk_junk12345:" (valid
# base64, wrong key) or, separately, "Authorization: Bearer junktoken12345"
# -- answered a different, shorter body: {"error":{"type":"invalid_api_key",
# "message":"Invalid API key provided"}}, 73 bytes, with none of those
# headers at all. Clearbit's own documentation only ever shows the Basic
# form (curl ... -u {key}:), so the finding that a syntactically valid
# Bearer token is treated identically to a syntactically valid Basic one is
# this Recipe's own, from the live probe rather than the docs.
#
# That parity used to be this Recipe's one unrepresentable gap: Cauldron's
# basic-scheme check parses the Authorization header with Go's
# r.BasicAuth(), which requires the literal "Basic " prefix, so a
# well-formed "Bearer junktoken12345" had nowhere to be checked and fell
# through to auth_required regardless of what it named. auth.also now
# declares the Bearer form as an alternative carrier for the identical key
# -- not a second credential, the same one Clearbit itself treats as
# interchangeable with Basic -- and a Bearer credential this Recipe holds
# now authenticates: see the accepted case below.
#
# A WRONG Bearer credential is a narrower fix than that, and stays
# unfixed on purpose rather than silently. auth.also only substitutes an
# alternative's verdict for the primary's when the primary held nothing at
# all -- getting the primary wrong is a different mistake from using
# another channel. Basic and Bearer both read the one Authorization header
# here, so a Bearer value is never absent to the Basic check -- it is
# present and not Basic-shaped, which is malformed.
#
# That used to mean a wrong Bearer surfaced the wrong sentence, and wiring
# this Recipe is what found it: an alternative's verdict only replaced the
# primary's when the primary held nothing. The rule is now about what each
# carrier knows, so the check that could read the value decides, and a wrong
# Bearer gets Clearbit's own invalid_api_key.
#
# **Routing order splits on whether any credential was presented at all --
# not on the path, and not on whether the credential was any good.** GET
# /v2/nosuchroute with no Authorization header answered 404
# {"error":{"type":"unknown_route","message":"Sorry, that route can not be
# found. Please refer to our docs https://clearbit.com/docs"}}, with the
# same X-RateLimit-* headers the auth_required body carries and an
# x-cascade: pass response header -- a Rack-cascade signal that the
# application behind the edge never saw an authentication check run at all.
# The identical path with "Authorization: Bearer junktoken12345" answered
# 401 invalid_api_key instead: same path, same non-route, opposite verdict,
# decided purely by whether an Authorization header existed. Both halves
# were struck against person.clearbit.com and company.clearbit.com and
# agreed. This is exactly the arrangement auth.go documents for Sendcloud --
# "splits on whether any credential was presented at all ... not on whether
# the credential was any good" -- reached independently here by an unrelated
# provider. Cauldron's auth.after_routing is a Recipe-wide boolean and
# cannot express a split that depends on the credential's own presence
# rather than on the path or the method, so this Recipe leaves it at its
# default (checked first, unconditionally) because that is what every
# credentialed request -- right or wrong -- actually receives, and states
# the uncredentialed-unrouted-path shape here rather than forcing a case
# that would need a boolean this format does not have. One consequence: the
# conformance case demonstrating the unrouted 404 has to carry this Recipe's
# own valid fixture key to reach Cauldron's router-miss handler at all,
# which is a request this Recipe never made against the live API -- see
# rootly/recipe.yaml for the same technique reached by the same constraint.
#
# **Three different numbers claim to be the rate limit, and none of them is
# what an unauthenticated call actually saw.** The archived documentation's
# worked example for a plain 200 shows X-RateLimit-Limit: 5000. Its worked
# example for a 429 shows X-RateLimit-Limit: 500 and a message naming "600
# requests per minute." What every unauthenticated 401 this Recipe struck
# actually carried was X-RateLimit-Limit: 100, counting down one per call
# from whatever Remaining was a moment before -- consistent across
# person.clearbit.com and company.clearbit.com, across every credential
# shape probed, all on 2026-09-02. The likeliest reading is that an
# unauthenticated call is not metered against any key's own bucket and lands
# in a smaller, separate one -- but that is a guess, and this Recipe serves
# the number it watched happen rather than either documented figure.
#
# **Neither API says how many credits, if any, a call consumed.** No
# response header and no body field anywhere in the archived documentation
# or the live headers carries a usage or credit count; the only quota signal
# documented anywhere is a flat 402 ("Over plan quota on this endpoint"),
# with no worked example this Recipe could read rather than invent. Compare
# hunterio/recipe.yaml and apolloio/recipe.yaml, written alongside this one:
# Hunter is the same story (no field, only "no credit is charged" prose);
# Apollo is the one member of this trio whose documentation actually states
# a number.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of roughly fifty documented person attributes and sixty documented
#     company attributes, this Recipe declares about fifteen of each.
#     Gravatar, GitHub, Google Plus, Crunchbase, site.emailAddresses/
#     phoneNumbers, parent/ultimateParent and every metrics.* field beyond
#     employees are entirely absent.
#   - The Combined API (GET /v2/combined/find, {"person":{...},
#     "company":{...}} as two singular objects at the top level) is not
#     modelled as a success route at all. Cauldron's beside mechanism
#     attaches a second resource's records to a list response as an array
#     under its own key; it does not support two singular objects on a get.
#     This Recipe's auth, routing and not-found findings were all struck
#     against real combined/find requests and are stated as such in each
#     case's source, but no 200 route exists for it -- inventing one would
#     mean picking a shape this format cannot actually enforce as two
#     objects rather than serve as a fabricated single resource.
#   - 402 (over plan quota) and 422 (Company API: invalid domain) are
#     declared as armable faults and carry no verified date: reaching either
#     live needs a paid key or a domain shaped to fail validation behind
#     one, both outside what this Recipe's probes could do without an
#     account.
#   - Flagging (POST .../flag) and every write are absent. Every route here
#     is a GET.
#
# Every case below not carrying a verified date was read from the archived
# snapshot named above, not observed against a live account -- this Recipe
# was written with no credential and created no account. Keys below are
# fixtures, not secrets.

recipe: clearbit
capability: crm
version: 0.1.0

upstream:
  api: "2019-12-19"
  docs: https://dashboard.clearbit.com/docs

auth:
  # Documented only as HTTP Basic with the secret key as the username and an
  # empty password (curl ... -u {key}:). See the header for the live finding
  # that a well-formed Bearer credential is accepted identically -- the same
  # key, a second carrier, declared below rather than left unservable.
  scheme: basic
  keys:
    - sk_cauldron00000000000000000000
  also:
    - scheme: bearer
      prefix: "Bearer "
  # Absent and malformed both land on auth_required, which is also the
  # generic fallback -- so neither field needs setting; declaring the same
  # name twice would say nothing setting only rejected_error does not.
  rejected_error: invalid_api_key

responses:
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    type_field: type
    code_field: "-"

resources:
  person:
    id:
      style: uuid
    fields:
      # name.fullName / givenName / familyName nest one level under "name",
      # the same dotted-in mechanism Rootly's severity uses one level
      # deeper.
      full_name:
        type: string
        in: name
        as: fullName
      given_name:
        type: string
        in: name
        as: givenName
      family_name:
        type: string
        in: name
        as: familyName
      email:
        type: string
      location:
        type: string
        null_when_unset: true
      time_zone:
        type: string
        null_when_unset: true
        as: timeZone
      utc_offset:
        type: integer
        null_when_unset: true
        as: utcOffset
      bio:
        type: string
        null_when_unset: true
      site:
        type: string
        null_when_unset: true
      avatar:
        type: string
        null_when_unset: true
      employment_domain:
        type: string
        null_when_unset: true
        in: employment
        as: domain
      employment_name:
        type: string
        null_when_unset: true
        in: employment
        as: name
      employment_title:
        type: string
        null_when_unset: true
        in: employment
        as: title
      # leadership/ceo/executive -- Clearbit's own standardised vocabulary,
      # documented as "See all possible values" rather than enumerated here.
      employment_role:
        type: string
        null_when_unset: true
        in: employment
        as: role
      employment_seniority:
        type: string
        null_when_unset: true
        in: employment
        as: seniority
      twitter_handle:
        type: string
        null_when_unset: true
        in: twitter
        as: handle
      # True when the email domain is a free provider (Gmail, etc). Useful
      # for telling a personal address from a work one -- the same question
      # Hunter's Domain Search answers with a "type": "personal"/"generic"
      # field on each email instead of a boolean on the record.
      email_provider:
        type: boolean
        default: false
        as: emailProvider
      fuzzy:
        type: boolean
        default: false
      indexed_at:
        type: datetime
        null_when_unset: true
        as: indexedAt

  company:
    id:
      style: uuid
    fields:
      name:
        type: string
      legal_name:
        type: string
        null_when_unset: true
        as: legalName
      domain:
        type: string
      description:
        type: string
        null_when_unset: true
      founded_year:
        type: integer
        null_when_unset: true
        as: foundedYear
      location:
        type: string
        null_when_unset: true
      category_sector:
        type: string
        null_when_unset: true
        in: category
        as: sector
      category_industry:
        type: string
        null_when_unset: true
        in: category
        as: industry
      tags:
        type: list
      logo:
        type: string
        null_when_unset: true
      # private/public -- Clearbit's own two-word vocabulary for how the
      # company is held.
      type:
        type: string
        null_when_unset: true
      metrics_employees:
        type: integer
        null_when_unset: true
        in: metrics
        as: employees
      metrics_employees_range:
        type: string
        null_when_unset: true
        in: metrics
        as: employeesRange
      metrics_estimated_annual_revenue:
        type: string
        null_when_unset: true
        in: metrics
        as: estimatedAnnualRevenue
      tech:
        type: list
      email_provider:
        type: boolean
        default: false
        as: emailProvider

routes:
  - method: GET
    path: /v2/people/find
    resource: person
    operation: get
    id_from: query:email
    lookup_by: email
    not_found: unknown_record
    headers:
      Content-Type: application/json

  - method: GET
    path: /v2/companies/find
    resource: company
    operation: get
    id_from: query:domain
    lookup_by: domain
    not_found: unknown_record
    headers:
      Content-Type: application/json

errors:
  # The generic message: what an absent header, an unrecognised scheme, an
  # empty Bearer value and an undecodable Basic value all answered,
  # byte-identical, live -- see the header. This is also what a route this
  # Recipe declares answers a malformed credential with, since
  # malformed_error is left unset on purpose.
  authentication_error:
    status: 401
    type: auth_required
    message: Authentication is required for this action. Sign up at https://clearbit.com
    headers:
      X-RateLimit-Limit: "100"
      X-Api-Version: "2019-12-19"

  # A credential that parses and is not one this Recipe holds. Named by
  # auth.rejected_error, so the check reaches it on its own -- no fields
  # carried over from the generic message, because the live response
  # carried none of its rate-limit headers either.
  invalid_api_key:
    status: 401
    type: invalid_api_key
    message: Invalid API key provided

  # Rails' router rescue for a path this app has no route for at all,
  # reached live only when no Authorization header was sent -- see the
  # header for why the case below has to carry a valid credential to reach
  # this same body through Cauldron.
  unknown_route:
    status: 404
    type: unknown_route
    message: Sorry, that route can not be found. Please refer to our docs https://clearbit.com/docs
    headers:
      X-RateLimit-Limit: "100"
      X-Api-Version: "2019-12-19"

  # Clearbit's own error-type table names this "unknown_record": "Record was
  # not found." Both the Person and Company API description pages say a
  # lookup with nothing to find answers 404, in this envelope -- not a 200
  # with null fields the way Hunter's Domain Search does; see
  # hunterio/recipe.yaml for that contrast. No worked JSON example gives it a
  # resource-specific sentence, so this Recipe serves the generic one the
  # type table itself uses rather than inventing "this person could not be
  # found."
  unknown_record:
    status: 404
    type: unknown_record
    message: Record was not found.

  # Documented, never triggered: reaching this needs a key over its plan
  # quota, which this Recipe cannot create. HTTP Status codes table names
  # only the phrase quoted here, with no worked JSON example anywhere in the
  # archived documentation.
  over_quota:
    status: 402
    type: quota_exceeded
    message: Over plan quota on this endpoint.

  # Documented, never triggered: the Company API's own worked description of
  # its response codes.
  domain_invalid:
    status: 422
    type: invalid_domain
    message: The domain is not valid.

  # Documented, never triggered. The 429 worked example in the archived
  # documentation, quoted rather than reconstructed from the "600 requests
  # per minute" prose elsewhere on the same page -- see the header for why
  # neither of those two documented numbers is what this Recipe's live
  # probes actually saw on a 401.
  rate_limit:
    status: 429
    type: rate_limit
    message: Rate limit exceeded. Limit is 600 requests per minute. Rate limit will be reset in 50 seconds.
    headers:
      X-RateLimit-Limit: "500"
      X-RateLimit-Remaining: "0"
      Retry-After: "50"

fixtures:
  empty: {}

  # alex@clearbit.com and clearbit.com are Clearbit's own published example
  # person and company, used throughout its documentation (including the
  # co-founder's own record) -- not a real lookup this Recipe performed.
  # Every field value below is copied from the worked JSON example in the
  # archived documentation cited in the header, not invented.
  worked-examples:
    person:
      - id: d54c54ad-40be-4305-8a34-0ab44710b90d
        full_name: Alex MacCaw
        given_name: Alex
        family_name: MacCaw
        email: alex@clearbit.com
        location: "San Francisco, CA, US"
        time_zone: America/Los_Angeles
        utc_offset: -7
        bio: "O'Reilly author, software engineer & traveller. Founder of https://clearbit.com"
        site: http://alexmaccaw.com
        avatar: https://d1ts43dypk8bqh.cloudfront.net/v1/avatars/d54c54ad-40be-4305-8a34-0ab44710b90d
        employment_domain: clearbit.com
        employment_name: Clearbit
        employment_title: "Co-founder, CEO"
        employment_role: leadership
        employment_seniority: executive
        twitter_handle: maccaw
        email_provider: false
        fuzzy: false
        indexed_at: "2016-11-07T00:00:00.000Z"

    company:
      - id: a114c279-67aa-4faa-beaf-64246a856450
        name: Clearbit
        legal_name: APIHub Inc
        domain: clearbit.com
        description: The Clearbit Data Activation Platform helps B2B teams understand customers, identify prospects, & personalize interactions with real-time intelligence.
        founded_year: 2015
        location: "90 Sheridan, San Francisco, CA 94103, USA"
        category_sector: Information Technology
        category_industry: Internet Software & Services
        tags:
          - Information Technology & Services
          - Technology
          - SAAS
          - B2B
        logo: https://logo.clearbit.com/clearbit.com
        type: private
        metrics_employees: 190
        metrics_employees_range: "51-250"
        metrics_estimated_annual_revenue: $10M-$50M
        tech:
          - contentful
          - aws_route_53
          - google_apps
          - segment
          - stripe
          - mongodb
          - salesforce
        email_provider: false

# Every case below carries source. A verified date means this Recipe called
# person.clearbit.com or company.clearbit.com with exactly the request shown
# and recorded exactly what came back; its absence means the case was read
# from the archived documentation snapshot named in the header and never
# called.
conformance:
  - name: no credential at all gets the generic message
    source: https://person.clearbit.com/v2/people/find
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
    expect:
      status: 401
      headers:
        X-RateLimit-Limit: "100"
      body:
        "error.type": auth_required
        "error.message": Authentication is required for this action. Sign up at https://clearbit.com
      absent:
        - "error.code"
        - message

  - name: an Authorization header with no recognised scheme gets the same message
    # "Authorization: junktoken12345" -- no "Basic " or "Bearer " keyword at
    # all -- answered the byte-identical body an absent header does. Struck
    # live alongside a nonsense scheme word and an empty "Bearer " value,
    # both of which answered the same.
    source: https://person.clearbit.com/v2/people/find
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        "error.type": auth_required

  - name: a Basic credential that will not decode gets the same message too
    source: https://person.clearbit.com/v2/people/find
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
      headers:
        Authorization: "Basic not_valid_base64!!!"
    expect:
      status: 401
      body:
        "error.type": auth_required

  - name: a Basic credential that decodes and is simply wrong gets the other one
    source: https://company.clearbit.com/v2/companies/find
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/companies/find?domain=example.com
      headers:
        Authorization: "Basic c2tfanVuazEyMzQ1Og=="
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        "error.type": invalid_api_key
        "error.message": Invalid API key provided
      absent:
        - "error.code"
        - X-RateLimit-Limit

  - name: a wrong Bearer credential is refused as wrong, not as unreadable
    # Verified live: "Authorization: Bearer junktoken12345" against this same
    # path answered the identical invalid_api_key body a wrong Basic
    # credential gets.
    #
    # This case was written asserting the opposite, and it was right to at the
    # time: an alternative's verdict only replaced the primary's when the
    # primary held nothing, and Basic and Bearer read the same Authorization
    # header here -- so a Bearer value was present and un-Basic-shaped, which
    # is malformed, and malformed was not promoted. Wiring this Recipe is what
    # exposed that, and the rule changed: the carrier that could read the
    # value decides, because malformed describes the Basic check's confusion
    # rather than the caller's mistake.
    #
    # So this now asserts Clearbit rather than asserting Cauldron.
    source: https://person.clearbit.com/v2/people/find
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
      headers:
        Authorization: Bearer junktoken12345
    verified: "2026-09-02"
    expect:
      status: 401
      body:
        "error.type": invalid_api_key

  - name: the fixture key also authenticates as a Bearer credential, not only as Basic
    # Not struck live with a real key -- no account was ever created, see
    # the header -- so this is Cauldron's own fixture through the
    # alternative carrier, the same discipline every other 200 case here
    # follows. This is the case auth.also exists to make pass: before it,
    # a well-formed Bearer credential had nowhere to be checked at all and
    # fell through to auth_required regardless of the key it named.
    source: https://web.archive.org/web/20230603101445/https://dashboard.clearbit.com/docs
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
      headers:
        Authorization: Bearer sk_cauldron00000000000000000000
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        id: d54c54ad-40be-4305-8a34-0ab44710b90d
        "name.fullName": Alex MacCaw

  - name: an unrouted path with a wrong credential still answers invalid_api_key
    # The credential's own verdict, not the path, decides this -- see the
    # header. Struck live with the same well-formed Basic value used above,
    # against a path Clearbit has no route for at all.
    source: https://person.clearbit.com/v2/nosuchroute
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/nosuchroute
      headers:
        Authorization: "Basic c2tfanVuazEyMzQ1Og=="
    expect:
      status: 401
      body:
        "error.type": invalid_api_key

  - name: an unrouted path with a credential this Recipe holds falls through to the router's own 404
    # Live, this shape was only ever reached with NO Authorization header at
    # all, because Clearbit's gateway only checks a credential when one is
    # presented -- see the header. Cauldron's own check is unconditional, so
    # reaching this body needs a valid key, which is a request this Recipe
    # never made against the live API. The body and headers asserted here
    # are the literal ones the uncredentialed live request received.
    source: https://person.clearbit.com/v2/nosuchroute
    fixture: worked-examples
    request:
      method: GET
      path: /v2/nosuchroute
      headers:
        Authorization: "Basic c2tfY2F1bGRyb24wMDAwMDAwMDAwMDAwMDAwMDAwMDo="
    expect:
      status: 404
      headers:
        X-RateLimit-Limit: "100"
      body:
        "error.type": unknown_route
      absent:
        - "error.code"

  - name: a person is a bare object with name nested one level down
    source: https://web.archive.org/web/20230603101445/https://dashboard.clearbit.com/docs
    fixture: worked-examples
    request:
      method: GET
      path: /v2/people/find?email=alex@clearbit.com
      headers:
