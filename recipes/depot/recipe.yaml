# Depot Recipe for Cauldron
#
# The project listing, read from Depot's own published CLI
# (depot/cli's pkg/cmd/projects/output.go), and struck live against
# api.depot.dev on 2026-09-13 with no credential, with a wrong token, on a
# method the path does not take, with no content type, on a path that does not
# exist, and at the root.
#
# **Four failure envelopes on one host, and `code` means two different things.**
# Struck live:
#
#   POST .../ListProjects, no header   401  {"code":"unauthenticated","message":"Missing authorization header"}
#   POST .../Nope                      404  {"message":"Route POST:/depot.core.v1.ProjectService/Nope not found","error":"Not Found","statusCode":404}
#   POST .../ListProjects, no type     415  {"statusCode":415,"code":"FST_ERR_CTP_INVALID_MEDIA_TYPE","error":"Unsupported Media Type","message":"Unsupported Media Type"}
#   GET  .../ListProjects              405  (no body at all)
#
# On the first, `code` is a gRPC status name. On the third, `code` is a Fastify
# internal error constant. Two vocabularies, one key, one hostname -- and the
# key a client switches on is the one that changes meaning.
#
# **The 415 says the same thing twice and the 404 says it three ways.**
# `"error":"Unsupported Media Type","message":"Unsupported Media Type"` is the
# reason phrase in both fields; the routing failure carries `message`, `error`
# and `statusCode` where the RPC failure carries none of them.
#
# **And a wrong method is a status line and nothing else.** `GET` on a real RPC
# path answers 405 with an empty body, so the one failure with no shape at all
# is the one a browser produces by accident.
#
# **The root is open and says `{"ok":true}`.** No credential, 200, two
# characters of information.
#
# **The vendor's CLI renames every field before printing it.** `output.go`
# reads `project.GetProjectId()`, `GetOrganizationId()`, `GetRegionId()`,
# `GetCreatedAt()` and `GetCachePolicy()` off the protobuf message, and then
# writes them out under `project_id`, `organization_id`, `region_id`,
# `created_at` and `cache_policy`. A script reading `depot projects get --output
# json` and one calling the API see different keys for the same fields.
#
# **A cache budget is bytes and a retention is days, on one object.**
# `cache_policy` is `{keep_bytes, keep_days}`, and the CLI divides the first by
# `1024 * 1024 * 1024` to print gigabytes -- so the units are in neither the
# field names nor the response.
#
# Also pinned: the CLI's own timestamp is RFC 3339 with nanoseconds, formatted
# from a protobuf `Timestamp` and marked `omitempty`, so a project with no
# creation time prints no key at all; and `newProjectOutput` returns the error
# "API returned no project" when the message is nil, which is the CLI saying
# what it expects rather than what the contract promises.

recipe: depot
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://depot.dev/docs/api/overview
  # No spec: Depot serves a Connect RPC surface described by protobuf
  # definitions on a schema registry rather than by an OpenAPI document at any
  # address this Recipe could reach. The record shape below is the CLI's own
  # field accessors.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - depot_cauldr0nf1xturet0k3n000000000000
  absent_error: missing_authorization_header
  rejected_error: invalid_token
  malformed_error: invalid_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: projects
  error:
    style: flat
    message_field: message
    # A gRPC status name here, and a Fastify constant on the 415.
    code_field: code

resources:
  project:
    id:
      field: projectId
      style: opaque
      length: 12
    fields:
      organizationId:
        type: string
      name:
        type: string
      regionId:
        type: string
      createdAt:
        type: string
      # Bytes and days, with the units in neither name nor response.
      cachePolicy:
        type: map

  health:
    id:
      field: "-"
      style: opaque
      length: 8
    fields:
      ok:
        type: boolean

routes:
  - method: POST
    path: /depot.core.v1.ProjectService/ListProjects
    resource: project
    operation: list
    pagination:
      style: none

  - method: GET
    # Open, and two characters of information.
    path: /
    resource: health
    operation: list
    public: true
    list:
      style: bare
      collapse_single: true
    pagination:
      style: none

errors:
  missing_authorization_header:
    status: 401
    # A gRPC status name, in the field the 415 fills with a Fastify constant.
    code: unauthenticated
    message: Missing authorization header

  invalid_token:
    status: 401
    code: unauthenticated
    message: Invalid token

  unknown_route:
    status: 404
    # Three fields, where the RPC failure above has two and neither of them
    # is this one.
    code_field: "-"
    message: "Route POST:{detail} not found"
    fields:
      error: Not Found
      statusCode: 404

  method_not_allowed:
    # A status line and nothing else.
    status: 405
    empty: true

fixtures:
  empty:
    project: []
    health:
      - ok: true

  org:
    health:
      - ok: true
    project:
      - projectId: 4f3e2d1c0b9a
        organizationId: org_8a7b6c5d4e3f
        name: monolith
        regionId: us-east-1
        createdAt: "2026-02-11T08:44:12.418293Z"
        cachePolicy:
          # Bytes...
          keepBytes: 53687091200
          # ...and days, on one object, with the units in neither name.
          keepDays: 14
      - projectId: 99ab77665544
        organizationId: org_8a7b6c5d4e3f
        name: docs
        regionId: eu-central-1
        # RFC 3339 with nanoseconds, from a protobuf Timestamp.
        createdAt: "2026-07-30T16:20:00.000000001Z"
        cachePolicy:
          keepBytes: 10737418240
          keepDays: 7

conformance:
  - name: the code is a gRPC status name on the RPC failure
    source: https://api.depot.dev/depot.core.v1.ProjectService/ListProjects
    verified: "2026-09-13"
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
      json: {}
    expect:
      status: 401
      body:
        # Two fields, and neither of them is error or statusCode.
        code: unauthenticated
        message: Missing authorization header
      absent:
        - error
        - statusCode

  - name: a wrong token is the same two fields
    source: https://api.depot.dev/depot.core.v1.ProjectService/ListProjects
    verified: "2026-09-13"
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
        Authorization: "Bearer notarealtoken"
      json: {}
    expect:
      status: 401
      body:
        code: unauthenticated
        message: Invalid token

  - name: an unrouted path is three fields and none of them is code
    source: https://api.depot.dev/depot.core.v1.ProjectService/Nope
    verified: "2026-09-13"
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/Nope
      headers:
        Content-Type: application/json
      json: {}
    expect:
      status: 404
      body:
        # The framework's own string, with the verb glued to the address.
        message: "Route POST:/depot.core.v1.ProjectService/Nope not found"
        error: Not Found
        statusCode: 404
      absent:
        # The key the RPC failure switches on.
        - code

  - name: a wrong method is a status line and nothing else
    source: https://api.depot.dev/depot.core.v1.ProjectService/ListProjects
    verified: "2026-09-13"
    fixture: org
    request:
      method: GET
      path: /depot.core.v1.ProjectService/ListProjects
      headers: {}
    expect:
      # The one failure with no shape at all.
      status: 405
      no_body: true

  - name: the root is open and says two characters
    source: https://api.depot.dev/
    verified: "2026-09-13"
    fixture: org
    request:
      method: GET
      path: /
      headers: {}
    expect:
      status: 200
      body:
        ok: true

  - name: the fields the CLI renames before printing them
    source: https://github.com/depot/cli
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
        Authorization: "Bearer depot_cauldr0nf1xturet0k3n000000000000"
      json: {}
    expect:
      status: 200
      body:
        # output.go reads these and writes them out as project_id,
        # organization_id, region_id and created_at.
        'projects[0].projectId': 4f3e2d1c0b9a
        'projects[0].organizationId': org_8a7b6c5d4e3f
        'projects[0].regionId': us-east-1
        'projects[0].name': monolith

  - name: a cache budget is bytes and a retention is days
    source: https://github.com/depot/cli
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
        Authorization: "Bearer depot_cauldr0nf1xturet0k3n000000000000"
      json: {}
    expect:
      status: 200
      body:
        # The CLI divides the first by 1024*1024*1024 to print gigabytes; the
        # units are in neither the field names nor the response.
        'projects[0].cachePolicy.keepBytes': 53687091200
        'projects[0].cachePolicy.keepDays': 14
        'projects[1].cachePolicy.keepBytes': 10737418240
        'projects[1].cachePolicy.keepDays': 7

  - name: a timestamp carries nanoseconds
    source: https://github.com/depot/cli
    fixture: org
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
        Authorization: "Bearer depot_cauldr0nf1xturet0k3n000000000000"
      json: {}
    expect:
      status: 200
      body:
        # RFC 3339 with nanoseconds, formatted from a protobuf Timestamp and
        # marked omitempty, so a project with none prints no key at all.
        'projects[0].createdAt': "2026-02-11T08:44:12.418293Z"
        'projects[1].createdAt': "2026-07-30T16:20:00.000000001Z"
        'projects[1].projectId': 99ab77665544
        'projects[1].regionId': eu-central-1

  - name: an organisation with no projects still sends the envelope
    source: https://github.com/depot/cli
    fixture: empty
    request:
      method: POST
      path: /depot.core.v1.ProjectService/ListProjects
      headers:
        Content-Type: application/json
        Authorization: "Bearer depot_cauldr0nf1xturet0k3n000000000000"
      json: {}
    expect:
      status: 200
      body:
        projects: []
