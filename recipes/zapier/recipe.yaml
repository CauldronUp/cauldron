# Zapier Recipe for Cauldron
#
# There is no REST API for "list my Zaps and run one," and this Recipe does
# not invent one. What Zapier actually exposes to a caller with no account is
# three unrelated surfaces on three hostnames, and every route below was
# struck against exactly one of them, live, on the date given, with no
# account, no key and no Zap ever created:
#
#   api.zapier.com/v1/*    -- the Developer Platform REST API, for people
#                              building a Zapier integration (an "app"), not
#                              for running one. Gated by a client_id, not an
#                              API key.
#   hooks.zapier.com/hooks/catch/*  -- the "Webhooks by Zapier" Catch Hook
#                              trigger, the one genuinely public mechanism
#                              this task's premise ("start a run through the
#                              API") maps onto for an ordinary user.
#   actions.zapier.com, nla.zapier.com  -- the old Natural Language
#                              Actions / AI Actions REST surface, and it no
#                              longer exists as REST. Every path on both
#                              hosts, checked live, answers 301 to
#                              mcp.zapier.com, which answers 307 to a login
#                              page. There is no fourth surface behind it to
#                              model; see below.
#
# The Catch Hook is where this Recipe's answer to "does starting a run tell
# you it finished" actually lives, and the answer is sharper than a gap --
# it is that the response cannot even confirm a run started. Struck live
# with an id and a token this project invented out of nothing
# (000000/abcdef, never issued by any account):
#
#   POST https://hooks.zapier.com/hooks/catch/000000/abcdef/
#     -> 200 {"attempt":"<uuid>","id":"<uuid>","request_id":"<uuid>",
#             "status":"success"}
#   GET  https://hooks.zapier.com/hooks/catch/000000/abcdef/
#     -> the identical shape, a fresh set of ids, 200 "success" again
#
# Both calls answer exactly the same way a real, subscribed hook would.
# Nothing about the request was validated against any account at all --
# there is no account behind 000000/abcdef -- and nothing in the response
# says so. "status": "success" here does not mean a Zap ran, or that one
# exists, or that anything downstream will ever see this request; Zapier's
# own words for what it is are just an acknowledgement that this specific
# HTTP call reached the queue (community.zapier.com and Zapier's own Catch
# Hook documentation both frame it this way). That is a plainer version of
# the gap Temporal Cloud's AsyncOperation and Windmill's bare-UUID create
# response have elsewhere in this batch: those two at least confirm
# something now exists to poll. This confirms nothing exists at all, and
# says "success" anyway. There is no id in that response a caller could
# later ask "did this run?" about, either -- see the next paragraph.
#
# There is no polling endpoint. Not "one this Recipe could not reach" --
# checked against Zapier's own documentation index and the Developer
# Platform's real routes, and nothing answers "what happened to hook
# delivery <request_id>". The request_id this call hands back exists to
# appear in Zapier's own dashboard, for a human to read, not in a second API
# call. A caller who wants to know whether a Zap actually fired is expected
# to have that Zap notify them back -- a second webhook, an email step, a
# Slack message -- which is a design choice, not an omission this Recipe
# failed to find.
#
# The Developer Platform API answers a different question -- who is allowed
# to see this app catalogue at all -- and answers it with a shape this batch
# has not found anywhere else in the sibling Recipes: `client_id`, a query
# parameter, checked for two failure modes with two distinct sentences.
# Struck live, repeatedly, against GET, POST, PATCH and OPTIONS on
# /v1/apps, and against the identical path with a client_id that is present
# and simply made up:
#
#   (no client_id at all)          -> 401 {"errors":["Missing `client_id`"]}
#   client_id=junk123notreal       -> 401 {"errors":["Invalid `client_id`"]}
#
# byte-identical across all four methods, and an Authorization header --
# Bearer or otherwise -- changes nothing: this endpoint does not consult it
# at all, and sending one alongside no client_id still answers "Missing
# `client_id`". Every one of those four methods also carries
# `Allow: GET, HEAD, OPTIONS` on its 401, including PATCH, which is not in
# that list -- Zapier computes the real allowed-method set and attaches it
# to the credential failure, the same thing this batch's own windmill and
# n8n Recipes independently found their hosts doing on their own gated
# routes.
#
# Routing beats this gate, though, for a path Zapier never registered at
# all. GET /v1/apps/123 and GET /v1/this-is-not-real-endpoint-xyz both
# answer a bare 404 with a zero-byte body and no client_id involved --
# checked with no client_id and, separately, with a client_id attached, and
# neither changed the answer. A caller cannot tell "this app id does not
# exist" from "this path was never a route" from the outside, because both
# are the identical empty 404 -- but a caller CAN tell "wrong client_id"
# from "wrong path", because those are two different statuses (401 vs 404)
# reached through two different checks, in a fixed order: the path is
# recognised first, every time, and only a recognised path ever reaches the
# client_id gate. That order is what census/recipe.yaml, turso/recipe.yaml
# and temporal/recipe.yaml in this collection already needed scheme: none
# to reproduce, for the same structural reason, and this Recipe uses it too.
#
# What clearing that gate actually returns is not modelled. This project
# holds no client_id any real Zapier account issued, platform.zapier.com's
# REST API reference gives no worked example for GET /v1/apps to copy
# rather than invent, and no upstream.spec is recorded for the same reason:
# the only machine-readable description this project could find for
# api.zapier.com -- zapier-platform's exported-schema.json on GitHub -- is
# the CLI app-definition schema (what a developer's own app.js exports), not
# a description of this REST API's routes or response shapes. Pointing
# upstream.spec at a document that does not describe the routes below would
# be a citation for the wrong claim, the same reason pipedream/recipe.yaml
# in this collection carries none either.
#
# The NLA/Actions retirement is dated rather than assumed. Checked live:
#
#   GET https://actions.zapier.com/api/v2/ai-actions/  -> 301 Location: https://mcp.zapier.com/
#   GET https://nla.zapier.com/api/v1/exposed/          -> 301 Location: https://mcp.zapier.com/
#   GET https://mcp.zapier.com/                          -> 307 Location: /mcp
#   GET https://mcp.zapier.com/mcp                        -> 307 Location: /login?redirectTo=%2Fmcp
#
# Both retired hostnames, and every path this project tried on either of
# them, redirect to the identical successor, which itself redirects a bare
# GET to a login page -- MCP is a protocol reached through a browser
# session, not a REST endpoint this task's method applies to, and this
# Recipe stops at the redirect rather than guessing what is behind the
# login.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing about a real app, a real Zap, or a real integration is
#     modelled anywhere in this Recipe. Every 200 below is either the Catch
#     Hook's own acknowledgement shape (observed, live) or a redirect
#     (observed, live); there is no case in this Recipe asserting the
#     content of a successful Developer Platform response, because none was
#     ever reachable or documented with a worked example -- see the header
#     above.
#   - The three real ids inside a Catch Hook response -- attempt, id,
#     request_id -- are minted fresh by Zapier on every call and are not the
#     same value twice. This Recipe's raw response uses one fixed,
#     obviously-synthetic value for all three, which is not a claim about
#     what any specific real call would return, only about the shape: three
#     identical-looking opaque strings and the word "success", regardless of
#     whether anything downstream exists.
#   - Zapier's own webhooks (a different feature: outbound event delivery
#     Zapier sends to a URL a Zap owner registers, REST Hooks-style) is a
#     different surface again and is not modelled; this Recipe is about
#     inbound triggering only, the mechanism the task named.
#   - client_id's rate limit, if any, was never triggered; no 429 is
#     declared. Rate limiting was observed on hooks.zapier.com instead (see
#     the Catch Hook route below) and is unrelated to this gate.

recipe: zapier
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  provider: zapier
  docs: https://platform.zapier.com/reference/rest-api
  # No spec: recorded. See the header -- the only machine-readable
  # description this project could find for api.zapier.com describes a
  # different thing (the CLI app schema), not this REST API's own routes.

auth:
  # client_id genuinely gates this API, but as a query parameter with no
  # prefix and two distinct failure sentences -- absent vs present-and-wrong
  # -- which Cauldron's Recipe-wide credential check cannot express without
  # also 401-ing every unregistered path, which the live host does not do.
  # Expressed as scheme: none plus matches_query below instead, the same
  # trade this batch's other two Recipes make with matches_header. See the
  # header.
  scheme: none

responses:
  error:
    # {"errors": ["..."]} -- a bare string inside the array, not a nested
    # object with its own message field. string_list carries exactly that
    # shape, the same one datadog/recipe.yaml in this collection needs.
    style: string_list
    key: errors

routes:
  # /v1/apps: the client_id gate, struck on every method this project tried.
  # Allow is attached to every one of these -- see the header -- and its
  # value never changes regardless of which method was actually sent.
  - method: GET
    path: /v1/apps
    matches_query:
      client_id: junk123notreal
    error: invalid_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  - method: GET
    path: /v1/apps
    error: missing_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  - method: POST
    path: /v1/apps
    matches_query:
      client_id: junk123notreal
    error: invalid_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  - method: POST
    path: /v1/apps
    error: missing_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  - method: PATCH
    path: /v1/apps
    error: missing_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  - method: OPTIONS
    path: /v1/apps
    error: missing_client_id
    headers:
      Allow: "GET, HEAD, OPTIONS"

  # The Catch Hook trigger. Any two path segments answer identically -- see
  # the header -- so no matches_* condition gates this at all; the id and
  # token below are the exact, invented values this Recipe struck live.
  - method: POST
    path: /hooks/catch/000000/abcdef/
    status: 200
    headers:
      x-rate-limit-limit: "20000"
      x-zapier-hook-status: success
    raw:
      content_type: application/json
      text: '{"attempt":"00000000-0000-4000-8000-000000000000","id":"00000000-0000-4000-8000-000000000000","request_id":"00000000-0000-4000-8000-000000000000","status":"success"}'

  - method: GET
    path: /hooks/catch/000000/abcdef/
    status: 200
    headers:
      x-rate-limit-limit: "20000"
      x-zapier-hook-status: success
    raw:
      content_type: application/json
      text: '{"attempt":"00000000-0000-4000-8000-000000000000","id":"00000000-0000-4000-8000-000000000000","request_id":"00000000-0000-4000-8000-000000000000","status":"success"}'

  # The retired NLA/Actions REST surface. See the header for the second hop.
  - method: GET
    path: /api/v2/ai-actions/
    status: 301
    headers:
      Location: https://mcp.zapier.com/
    raw:
      empty: true

  # Its successor, reached with no session: a login redirect, not JSON.
  - method: GET
    path: /mcp
    status: 307
    headers:
      Location: /login?redirectTo=%2Fmcp
    raw:
      empty: true

errors:
  missing_client_id:
    status: 401
    message: "Missing `client_id`"

  invalid_client_id:
    status: 401
    message: "Invalid `client_id`"

fixtures:
  empty: {}

# Every case below carries source. A verified date means this Recipe called
# the host shown with exactly the request given and recorded exactly what
# came back. Nothing in this Recipe is documentation-only: every route here
# needed no account to strike, and every one was.
conformance:
  - name: no client_id at all is refused with one sentence
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/apps
    expect:
      status: 401
      headers:
        Allow: "GET, HEAD, OPTIONS"
      body:
        errors: ["Missing `client_id`"]

  - name: a present-but-wrong client_id is refused with a different one
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/apps?client_id=junk123notreal
    expect:
      status: 401
      body:
        errors: ["Invalid `client_id`"]

  - name: an Authorization header does not substitute for client_id
    # Struck live with Authorization: Bearer set and client_id withheld --
    # the answer is identical to sending nothing at all, because this
    # endpoint never reads that header.
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/apps
      headers:
        Authorization: Bearer junk123notreal
    expect:
      status: 401
      body:
        errors: ["Missing `client_id`"]

  - name: the gate applies identically to a write attempt
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/apps?client_id=junk123notreal
    expect:
      status: 401
      body:
        errors: ["Invalid `client_id`"]

  - name: and to a method that was never going to be allowed anyway
    # PATCH is not in the Allow list this same response carries -- checked
    # directly -- and it still reaches the client_id gate rather than a 405.
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/apps
    expect:
      status: 401
      headers:
        Allow: "GET, HEAD, OPTIONS"
      body:
        errors: ["Missing `client_id`"]

  - name: even a CORS preflight method reaches the same gate
    source: https://api.zapier.com/v1/apps
    verified: "2026-09-01"
    fixture: empty
    request:
      method: OPTIONS
      path: /v1/apps
    expect:
      status: 401
      body:
        errors: ["Missing `client_id`"]

  - name: a path this host never registered is a bare 404, no gate involved
    source: https://api.zapier.com/v1/apps/123
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/apps/123
    expect:
      status: 404

  - name: and a client_id attached does not change that
    source: https://api.zapier.com/v1/this-is-not-real-endpoint-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-real-endpoint-xyz?client_id=junk123notreal
    expect:
      status: 404

  - name: a made-up hook id and token still answer success
    source: https://hooks.zapier.com/hooks/catch/000000/abcdef/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /hooks/catch/000000/abcdef/
      json:
        a: 1
    expect:
      status: 200
      headers:
        Content-Type: application/json
        x-rate-limit-limit: "20000"
      body:
        status: success
      matches:
        id: "^[0-9a-f-]{36}$"
        request_id: "^[0-9a-f-]{36}$"
        attempt: "^[0-9a-f-]{36}$"

  - name: a GET against the same hook answers the identical shape
    source: https://hooks.zapier.com/hooks/catch/000000/abcdef/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /hooks/catch/000000/abcdef/
    expect:
      status: 200
      body:
        status: success

  - name: the old Actions REST surface now redirects to MCP
    source: https://actions.zapier.com/api/v2/ai-actions/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/ai-actions/
    expect:
      status: 301
      headers:
        Location: https://mcp.zapier.com/

  - name: and MCP itself requires a browser session, not a bearer call
    source: https://mcp.zapier.com/mcp
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /mcp
    expect:
      status: 307
      headers:
        Location: /login?redirectTo=%2Fmcp
