# Census Recipe for Cauldron
#
# Census is Fivetran now. developers.getcensus.com/api-reference/* answers
# every path with a 301 to fivetran.com/docs/activations/rest-api/*, branded
# "Activations" -- Census was acquired and folded into the same company that
# already has a Recipe in this collection under its own name. The wire this
# Recipe describes is unaffected: app.getcensus.com is still the live host,
# still answers its own requests, and every case below was struck against it
# directly rather than through anything at fivetran.com. Only the published
# documentation moved.
#
# That kinship shows up twice in what the API actually does, not just in who
# owns it. A sync here carries paused as a field separate from status, the
# same split Fivetran's own connector makes elsewhere in this collection: a
# sync that is not paused and has failed still reads "failing" regardless of
# whether it is scheduled to run again, and a paused one keeps whatever
# status its last run left it in. Reading either field alone says nothing
# about whether data is currently moving.
#
# The mechanism this Recipe exists to record is where auth is checked, and
# on this host the answer depends on the HTTP method, in a way none of the
# other three sync platforms in this collection do:
#
#   GET  /api/v1/syncs                          -> 401
#   GET  /api/v1/syncs/{id}                     -> 401
#   GET  /api/v1/this-is-not-a-real-resource    -> 401
#   PUT  /api/v1/syncs                          -> 404
#   DELETE /api/v1/syncs                        -> 404
#
# every one of those struck live with no credential of any kind, on the date
# below. A GET is auth-gated even when the resource named does not exist --
# the second case above answers the identical 401 the first one does, so a
# typo in a GET path is indistinguishable from a real one until a credential
# is presented. A method nothing is registered for never reaches that gate
# at all: PUT and DELETE against the very same /api/v1/syncs path answer a
# routing miss instead, in a completely different shape -- JSON rather than
# plain text, with no WWW-Authenticate header, because nothing here ever
# asked who was calling.
#
# That is a third answer to the question this collection keeps finding two
# of. Airbyte, this Recipe's sibling written the same day, checks the
# credential before it checks anything else, for every method and every
# path without exception. Temporal Cloud checks routing before it checks the
# credential, also without exception. Census does both, split exactly along
# the one axis that happens not to be either of those: which HTTP method was
# used. GET always reaches the same gate; nothing else ever does.
#
# Missing and wrong are the same sentence here too, joining Airbyte and
# Temporal elsewhere in this collection: no Authorization header, a garbage
# bearer token, and a Basic-scheme credential were all struck against
# GET /api/v1/syncs and all three answered the identical 27-byte body,
# byte for byte: "HTTP Token: Access denied." -- plain text, not JSON, with
# Content-Type: text/plain; charset=utf-8 and no field anywhere to branch on.
# Fivetran's own docs for this same API document the Authorization header as
# "Bearer YOUR_WORKSPACE_ACCESS_TOKEN"; the live host's WWW-Authenticate
# challenge names a different scheme entirely -- Token realm="Application",
# the wording Rails' own http_token authenticator sends by default -- so even
# the two ends of this one provider's own materials do not agree what the
# scheme is called.
#
# The sync's own state machine is the other half of what this Recipe was
# asked to carry, and here it has to be reported rather than modelled.
# Triggering a sync -- POST /api/v1/syncs/{sync_id}/trigger, per Fivetran's
# published reference -- answers 200 with {"status":"success","data":
# {"sync_run_id": 1234567890}}: an id pointing at the run and nothing else,
# not the sync, not a state, not even a hint that anything has started yet.
# That is the same shape of gap Temporal's AsyncOperation has elsewhere in
# this collection, reached independently by a completely different API, and
# it is one field plainer here: Temporal's create at least hands back a
# state of STATE_PENDING beside the operation id. This one hands back only
# the id.
#
# What that id resolves to is where the answer to "is a partial failure
# reported as a success" actually lives, and it could not be turned into a
# route below -- see the fidelity gaps. Fivetran's own "Current Sync Run
# Overview" page shows a worked example of the object a sync run is:
#
#   {"id": 94, "sync_id": 52, "records_processed": 14, "records_updated": 13,
#    "records_failed": 1, "status": "completed", ...}
#
# quoted here rather than turned into a fixture, because status is
# "completed" on that same object, sitting beside a records_failed of 1 --
# one row out of fourteen refused, and the field that is supposed to say how
# the run went says the same word it would say if that row had gone through
# too. A client reading status alone cannot tell a clean run from one that
# lost a fourteenth of its data, the same finding Hightouch's Recipe makes
# elsewhere in this collection about a sync run that delivered nothing at
# all and still reported success. Worth noting rather than resolving:
# Fivetran's separate "Sync Tracking" page for the same API uses the word
# "succeeded" for what looks like the identical terminal state, on a
# different example. Two pages of one company's documentation disagree
# about the name of the status a healthy run ends in, and this Recipe is not
# the place to decide which of them is right.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every case needing a valid credential is read from Fivetran's
#     published Activations reference, not observed, and carries no verified
#     date. Only the cases that need no credential at all -- the four 401s
#     and the two routing misses -- were actually called, and only those
#     carry one.
#   - The sync run object quoted above is not a resource this Recipe
#     declares and the trigger route is not scoped to one that carries it.
#     Every URL this Recipe tried for "list a sync's runs" -- the natural
#     next step after trigger -- answered 404 from Fivetran's own docs site,
#     not from the API, so the endpoint's existence is well evidenced by a
#     search result mentioning a per_page parameter for it and its literal
#     path is not. Declaring a route on a guessed path would be a claim
#     about the wire nobody checked; the object is recorded in this header
#     instead, which is the honest half of the same finding.
#   - A GET to any *other* undeclared path under /api/v1/ than the one case
#     below would, in this emulator, fall through to Cauldron's own generic
#     unknown-route handler and answer a plain 404 -- not the 401 the live
#     host actually sends for that case, which this Recipe cannot reproduce
#     for every possible path without declaring one. Only the single
#     malformed-path case below is faithful; it is not a stand-in for every
#     path this Recipe did not try.
#   - Sync carries more fields than are declared: mappings, source_attributes,
#     destination_attributes, alert_attributes, mode and match_rate_details
#     are all in Fivetran's published schema and none of them are typed
#     here, because the reference shows them only as nested objects with no
#     worked example a fixture could be built from honestly.
#   - EU workspaces use a separate base URL per Fivetran's own docs; this
#     Recipe was only ever struck against the default one.
#   - No rate-limit header was ever seen on any response this Recipe struck,
#     401 or 404, so none is declared. That is an absence in what was
#     observed, not a claim that this host never sends one.

recipe: census
capability: database
version: 0.1.0

upstream:
  api: v1
  provider: census
  docs: https://fivetran.com/docs/activations/rest-api

auth:
  # none at the Recipe level on purpose: the live host's own order -- GET is
  # gated, PUT and DELETE never reach a gate at all -- cannot be produced by
  # Cauldron's default auth-before-routing check, which would 401 every
  # method alike. Each GET route below carries its own matches_header and a
  # header-less duplicate to stand in for that gate instead, the same shape
  # Temporal's Recipe elsewhere in this collection uses for a different
  # reason (there, to leave one path genuinely public; here, to let the
  # method decide whether auth is consulted at all).
  scheme: none

responses:
  list:
    style: wrapped
  resource:
    style: wrapped
    key: data
  success:
    # Stamped on every successful body, list or single object alike --
    # {"status":"success", ...} -- per every example Fivetran's Activations
    # reference shows for this API.
    fields:
      status: success
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"

resources:
  sync:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      label:
        type: string
      # append, insert, mirror, update, upsert -- how records already sent
      # are reconciled against ones sent again. Not modelled beyond typing
      # it as a string: which value means what is a destination-write
      # concern this Recipe does not otherwise carry.
      operation:
        type: string
      # A choice somebody made. Separate from status below the same way
      # Fivetran's own connector.paused is separate from its sync_state
      # elsewhere in this collection: a sync that is not paused and has
      # failed still reads "failing", and a paused one keeps whatever
      # status its last run left it holding.
      paused:
        type: boolean
        default: false
      # ready, "up to date", failing. The connector's own health, not any
      # one run's outcome -- see the header for the run-level status this
      # field is not.
      status:
        type: string
        default: ready
      created_at:
        type: datetime
      updated_at:
        type: datetime
        null_when_unset: true

  # Exists only to carry the trigger route's response. See the header: the
  # fuller sync run object -- records_processed, records_updated,
  # records_failed, status -- is real, documented, and not declared here,
  # because no case could confirm the path that would serve it.
  sync_run:
    collection: data
    id:
      style: numeric
      type: number
      field: sync_run_id
    fields:
      sync_id:
        type: string

routes:
  - method: GET
    path: /api/v1/syncs
    resource: sync
    operation: list
    matches_header:
      Authorization: Bearer cauldron-census-fixture-key-0000000000000000
    pagination:
      style: page
      limit: 25
      limit_param: per_page
      cursor_param: page
    list:
      style: wrapped
      count_field: pagination.total_records
      page_field: pagination.page
      limit_field: pagination.per_page
      pages_field: pagination.last_page

  - method: GET
    path: /api/v1/syncs
    error: authentication_error

  - method: GET
    path: /api/v1/syncs/{id}
    resource: sync
    operation: get
    matches_header:
      Authorization: Bearer cauldron-census-fixture-key-0000000000000000

  - method: GET
    path: /api/v1/syncs/{id}
    error: authentication_error

  # Declared and armed with the same fallback error as the two routes above,
  # to make the point directly rather than only in prose: a resource name
  # this Recipe never declares is refused exactly the way a real one is,
  # because nothing about routing was ever consulted before the credential.
  - method: GET
    path: /api/v1/this-is-not-a-real-resource
    error: authentication_error

  - method: POST
    path: /api/v1/syncs/{sync_id}/trigger
    resource: sync_run
    operation: create
    status: 200
    scope:
      - sync_id
    returns:
      - id
    matches_header:
      Authorization: Bearer cauldron-census-fixture-key-0000000000000000

  - method: POST
    path: /api/v1/syncs/{sync_id}/trigger
    error: authentication_error

  # A method nothing is registered for. See the header: this never reaches
  # the auth gate the routes above are guarded by, on the live host or here,
  # and answers a completely different shape as a result.
  - method: PUT
    path: /api/v1/syncs
    error: route_not_found

  - method: DELETE
    path: /api/v1/syncs
    error: route_not_found

errors:
  # The live edge's own words, struck four separate ways -- no header, a
  # garbage bearer token, a Basic credential, and a second path entirely --
  # and identical every time.
  authentication_error:
    status: 401
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"
      www-authenticate: 'Token realm="Application"'
    message: "HTTP Token: Access denied."

  # What a method with no route answers, regardless of credential -- nothing
  # about auth was ever reached to refuse. Named apart from Cauldron's own
  # built-in unknown_route deliberately, so this shape stays scoped to the
  # two methods this Recipe actually struck rather than silently becoming
  # every unmatched request's answer -- see the header's third fidelity gap.
  route_not_found:
    status: 404
    style: flat
    message_field: error
    code_field: "-"
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      status: 404
    message: "Not Found"

fixtures:
  empty: {}

  small-workspace:
    sync:
      - id: 501
        label: customers-to-salesforce
        operation: upsert
        paused: false
        status: up to date
        created_at: "2026-06-01T09:00:00Z"
        updated_at: "2026-08-30T06:00:00Z"

      # Paused, and status still reads up to date -- the same trap Fivetran's
      # own connector.sync_frequency has elsewhere in this collection: a
      # client reading status alone believes this sync is currently running.
      - id: 502
        label: leads-to-marketo
        operation: insert
        paused: true
        status: up to date
        created_at: "2026-05-14T11:00:00Z"
        updated_at: "2026-08-01T02:00:00Z"

      # Not paused, and genuinely broken.
      - id: 503
        label: accounts-to-hubspot
        operation: mirror
        paused: false
        status: failing
        created_at: "2026-07-20T15:00:00Z"
        updated_at: "2026-08-29T14:00:00Z"

conformance:
  - name: no credential at all is 401, in plain text
    source: https://app.getcensus.com/api/v1/syncs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/syncs
    expect:
      status: 401
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "HTTP Token: Access denied\\."

  - name: a garbage bearer token answers the identical body
    source: https://app.getcensus.com/api/v1/syncs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/syncs
      headers:
        Authorization: Bearer junk-token-not-real
    expect:
      status: 401
      body_matches: "HTTP Token: Access denied\\."

  - name: a resource name this Recipe never declares is refused the same way a real one is
    source: https://app.getcensus.com/api/v1/this-is-not-a-real-resource
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/this-is-not-a-real-resource
    expect:
      status: 401
      body_matches: "HTTP Token: Access denied\\."

  - name: a method nothing is registered for never reaches the auth gate at all
    source: https://app.getcensus.com/api/v1/syncs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/v1/syncs
    expect:
      status: 404
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        status: 404
        error: "Not Found"

  - name: a second method confirms it is the method, not a one-off
    source: https://app.getcensus.com/api/v1/syncs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /api/v1/syncs
    expect:
      status: 404
      body:
        status: 404
        error: "Not Found"

  - name: paused and status are different questions
    source: https://fivetran.com/docs/activations/rest-api/api-reference/workspace-apis/syncs/get-syncs
    fixture: small-workspace
    request:
      method: GET
      path: /api/v1/syncs
      headers:
        Authorization: Bearer cauldron-census-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        status: success
        data[1].paused: true
        data[1].status: up to date
        data[2].paused: false
        data[2].status: failing

  - name: the envelope carries a page object with its own field names
    source: https://fivetran.com/docs/activations/rest-api/api-reference/workspace-apis/syncs/get-syncs
    fixture: small-workspace
    request:
      method: GET
      path: /api/v1/syncs?per_page=2&page=1
      headers:
        Authorization: Bearer cauldron-census-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        pagination.per_page: 2
        pagination.page: 1
      absent:
        - next_cursor
        - has_more

  - name: triggering a sync answers an id pointing at the run, not the run itself
    # Not a state, not a status, not the sync -- see the header for what
    # this id actually resolves to and why that could not become a case.
    source: https://fivetran.com/docs/activations/rest-api/api-reference/workspace-apis/syncs/trigger-sync
    fixture: small-workspace
    request:
      method: POST
      path: /api/v1/syncs/501/trigger
      headers:
        Authorization: Bearer cauldron-census-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        status: success
      matches:
        data.sync_run_id: "^[0-9]+$"
      absent:
        - data.status
        - data.label
        - data.paused
