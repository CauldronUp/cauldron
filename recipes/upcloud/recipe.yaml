# UpCloud Recipe for Cauldron
#
# The account endpoint, read from UpCloud's own API documentation, and struck
# live against api.upcloud.com on 2026-09-13 with no credential, with a
# deliberately invalid one, and on a path that does not exist.
#
# **Two media types and two formatters for one status.** Struck live:
#
#   (no header)     401 application/problem+json
#                   {   "error" : {      "error_code" : "AUTHENTICATION_REQUIRED",
#                        "error_message" : "The use of this API requires authentication.
#                        Create your account at https://www.upcloud.com/."   }}
#
#   Basic (wrong)   401 application/json
#                   {"error":{"error_code":"AUTHENTICATION_FAILED","error_message":
#                    "authentication failed using the given username and password"}}
#
# The same status, from the same endpoint, in two different media types -- and
# the first is pretty-printed with spaces on both sides of its colons while the
# second is compact. Two serialisers, and the label changes with them.
#
# **And neither is a problem document.** RFC 9457 defines `application/problem+json`
# as an object with `type`, `title`, `status` and `detail` at the top level.
# This one has none of those: it nests `error_code` and `error_message` under
# `error`. So a client that sees the media type and reaches for `body.title`
# finds nothing, and the media type is the only part of the response that
# follows the standard it names.
#
# **The unauthenticated message is marketing.** "The use of this API requires
# authentication. Create your account at https://www.upcloud.com/." -- a sign-up
# link, in an error body, to a caller who may well have an account and have
# forgotten a header.
#
# **A path that does not exist answers the credential failure.** `/1.3/cauldron-nope`
# with no credential answers `AUTHENTICATION_REQUIRED`, in problem+json, exactly
# as a real path does. So the credential is checked before the route is
# resolved, and a mistyped path is indistinguishable from a missing header.
#
# **Money is a float with four decimal places and no currency.** `"credits":
# 9972.2324` -- and nothing anywhere in the response says what a credit is worth
# or in what currency. The documentation's own explanation is that credits "are
# used to pay for cloud resources" and "can be purchased from the UpCloud
# website".
#
# **Fifteen limits, and one of them names its unit.** `resource_limits` holds
# counts and sizes side by side -- `cores: 200`, `memory: 1048576`,
# `storage_hdd: 10240`, `public_ipv4: 100` -- with no unit on any of them except
# `ntp_excess_gib`, which is about network time traffic and is the one place a
# unit appears in a key. A client reading `memory` has to know from somewhere
# else whether it is counting megabytes or gigabytes.

recipe: upcloud
capability: infrastructure
version: 0.1.0

upstream:
  api: "1.3"
  docs: https://developers.upcloud.com/1.3/3-accounts/
  # No spec: UpCloud documents this API as prose with worked request and
  # response transcripts. There is no OpenAPI document at any address this
  # Recipe could find.

auth:
  # Basic, with the account's own username and password.
  scheme: basic
  # The secret is the password half: the username is the account's own name,
  # which the record below also carries.
  credential: password
  keys:
    - cauldr0nupcl0ud
  absent_error: authentication_required
  rejected_error: authentication_failed
  # A path that does not exist answers the credential failure, so the header
  # is read before the route is resolved.
  after_routing: false

responses:
  resource:
    style: wrapped
    key: account
  error:
    # Nested under `error`, which is not what the media type on one of them
    # says the shape should be.
    style: nested
    key: error
    message_field: error_message
    code_field: error_code
    code_type: string
    type_field: "-"

resources:
  account:
    id:
      # The username is the identifier: there is no other id on the record.
      field: "-"
      style: opaque
      carried_by: username
    fields:
      username:
        type: string
      # A float with four decimal places, and no currency anywhere.
      credits:
        type: number
      # Fifteen numbers, one of which names its unit in its key.
      resource_limits:
        type: map

routes:
  - method: GET
    path: /1.3/account
    resource: account
    operation: get
    # No identifier in the request: the endpoint answers about whoever the
    # credential belongs to.
    id_from: auth

errors:
  authentication_required:
    status: 401
    code: AUTHENTICATION_REQUIRED
    # A sign-up link, in an error body.
    message: "The use of this API requires authentication. Create your account at https://www.upcloud.com/."
    headers:
      # RFC 9457's media type, on a body that is not a problem document.
      Content-Type: application/problem+json

  authentication_failed:
    status: 401
    code: AUTHENTICATION_FAILED
    # Lower case, where the message above is a sentence -- and a different
    # media type on the same status.
    message: authentication failed using the given username and password
    headers:
      Content-Type: application/json

fixtures:
  empty:
    account: []

  customer:
    account:
      - username: cauldron
        # Four decimal places, no currency.
        credits: 9972.2324
        resource_limits:
          # Counts and sizes together, with no unit on any of them...
          cores: 200
          detached_floating_ips: 10
          load_balancers: 50
          managed_databases: 100
          managed_kubernetes: 100
          managed_object_storages: 100
          memory: 1048576
          network_gateways: 100
          network_peerings: 100
          networks: 100
          # ...except this one, which is about network time traffic.
          ntp_excess_gib: 20000
          public_ipv4: 100
          public_ipv6: 100
          routers: 100
          storage_hdd: 10240

conformance:
  - name: no credential gets a problem document that is not one
    source: https://api.upcloud.com/1.3/account
    verified: "2026-09-13"
    fixture: customer
    request:
      method: GET
      path: /1.3/account
      headers: {}
    expect:
      status: 401
      headers:
        # RFC 9457's media type, on a body with none of its members.
        Content-Type: application/problem+json
      body:
        # Nested, where the standard the media type names puts these at the
        # top level under different names.
        'error.error_code': AUTHENTICATION_REQUIRED
        'error.error_message': "The use of this API requires authentication. Create your account at https://www.upcloud.com/."

  - name: a wrong credential is the same status in a different media type
    source: https://api.upcloud.com/1.3/account
    verified: "2026-09-13"
    fixture: customer
    request:
      method: GET
      path: /1.3/account
      headers:
        # base64("not:real")
        Authorization: "Basic bm90OnJlYWw="
    expect:
      status: 401
      headers:
        # application/json here, application/problem+json above, for one
        # status on one endpoint.
        Content-Type: application/json
      body:
        'error.error_code': AUTHENTICATION_FAILED
        # Lower case, where the other message is a sentence.
        'error.error_message': authentication failed using the given username and password

  - name: an unrouted path answers the credential failure
    source: https://api.upcloud.com/1.3/cauldron-nope
    verified: "2026-09-13"
    fixture: customer
    request:
      method: GET
      path: /1.3/cauldron-nope
      headers: {}
    expect:
      # Not 404. The header is read before the route is resolved, so a
      # mistyped path is indistinguishable from a missing credential.
      status: 401
      body:
        'error.error_code': AUTHENTICATION_REQUIRED

  - name: money is a float with four decimal places
    source: https://developers.upcloud.com/1.3/3-accounts/
    fixture: customer
    request:
      method: GET
      path: /1.3/account
      headers:
        # base64("cauldron:cauldr0nupcl0ud")
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG51cGNsMHVk"
    expect:
      status: 200
      body:
        # And nothing in the response says what a credit is worth.
        'account.credits': 9972.2324
        'account.username': cauldron

  - name: fifteen limits and one unit
    source: https://developers.upcloud.com/1.3/3-accounts/
    fixture: customer
    request:
      method: GET
      path: /1.3/account
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG51cGNsMHVk"
    expect:
      status: 200
      body:
        # Counts and sizes side by side, with the unit named in exactly one
        # key -- the one about network time traffic.
        'account.resource_limits.cores': 200
        'account.resource_limits.memory': 1048576
        'account.resource_limits.storage_hdd': 10240
        'account.resource_limits.ntp_excess_gib': 20000
        'account.resource_limits.public_ipv4': 100

  - name: the limits count things that are not resources of one kind
    source: https://developers.upcloud.com/1.3/3-accounts/
    fixture: customer
    request:
      method: GET
      path: /1.3/account
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG51cGNsMHVk"
    expect:
      status: 200
      body:
        'account.resource_limits.managed_databases': 100
        'account.resource_limits.managed_kubernetes': 100
        'account.resource_limits.managed_object_storages': 100
        'account.resource_limits.load_balancers': 50
        'account.resource_limits.detached_floating_ips': 10
        'account.resource_limits.network_gateways': 100
        'account.resource_limits.network_peerings': 100
        'account.resource_limits.networks': 100
        'account.resource_limits.routers': 100
        'account.resource_limits.public_ipv6': 100
