# PropelAuth Recipe for Cauldron
#
# Last of three Recipes (with frontegg/recipe.yaml and kinde/recipe.yaml)
# written together to answer one question: every customer gets their own
# hostname -- <name>.propelauthtest.com for a test environment -- and what
# happens when a caller reaches one that is wrong, or does not exist at all.
# make/recipe.yaml found a provider where a real token on the wrong zone is
# indistinguishable from a token nobody ever issued. PropelAuth repeats that
# failure and widens it: here, not even the *hostname* carries a signal a
# caller can read, and the backend API's own credential check answers the
# question "did you send anything under this header name" and nothing else.
#
# *.propelauthtest.com is a genuine wildcard, checked with plain nslookup:
#
#   zzz-cauldron-nonexistent-probe-12345.propelauthtest.com
#     -> CNAME ext3.propelauth.com -> two real addresses
#   1581439057.propelauthtest.com (the exact id PropelAuth's own frontend
#     quickstart guide uses as its worked authUrl example)
#     -> the identical CNAME, the identical two addresses
#
# and propelauthtest.com itself, the bare apex with no subdomain at all, has
# no address record whatsoever -- confirmed with nslookup -type=A, "No
# address (A) records available." Only the wildcard answers; the domain
# itself is not a place anything lives.
#
# What answers behind that CNAME does not distinguish the two hosts above
# either, on the one surface a real caller would ever reach for a session:
# GET / redirects 307 to /login, which redirects 307 to /en/login, which
# renders 404 -- a genuine, transport-level 404, not a client-side illusion,
# confirmed by fetching /en/login directly and reading a real HTTP/1.1 404
# with a Next.js static-export page whose own __NEXT_DATA__ carries
# "statusCode":404. Struck against the fabricated hostname and against
# PropelAuth's own quickstart id, the response is byte-identical up to a
# build-specific nonce: same three hops, same page, same generic "This page
# could not be found." Nothing in it says "no such business" the way
# Frontegg's 404 names the host or Kinde's says "Domain Not Found" -- it
# reads exactly like a broken frontend route, which is indistinguishable
# from what a caller who mistyped a tenant id would actually be looking at.
# Whether 1581439057 was ever a live test environment or was always an
# illustrative placeholder in PropelAuth's own docs is not something this
# project could determine without an account; either way, the wire cannot
# tell the two hosts apart, which is the finding this Recipe exists to
# record.
#
# The backend API -- api reached at the same per-environment hostname,
# documented in PropelAuth's own words as "The base URL for the backend API
# is your environment's Auth URL" -- answers a sharper version of the same
# thing, and it does distinguish two states, just not the two a caller would
# want distinguished. Checked live, three times each, alternating, against
# both hosts above and against a path this Recipe declares no route for at
# all:
#
#   no Authorization header at all
#     -> 401, zero-byte body, every time, every path, both hosts
#   Authorization: Bearer <anything -- garbage, or a well-formed key naming
#     nothing real>
#     -> 404, zero-byte body, every time, every path, both hosts
#
# stable across three consecutive requests, stable across a real-shaped
# resource path (/api/backend/v1/user/{id}) and a path invented for this
# probe, and stable across the fabricated hostname and PropelAuth's own
# quickstart one. The status code is the only signal on the wire, and it
# answers one question -- was the Authorization header carrying anything at
# all -- not the two questions a caller actually has, which are "is my key
# valid" and "does this business exist." A caller who sends a real key to
# the wrong environment gets the identical 404 a caller gets for a
# resource id that was never real to begin with: the same ambiguity Make's
# header names for a token on the wrong zone, one layer earlier here,
# because even the *presence* check runs before anything about the
# environment or the key's own validity is consulted.
#
# PropelAuth's own docs are explicit that this is not the only credential
# shape the header carries: "User API Keys" -- the ones an end user of the
# integrating product creates for themselves, through the API Key APIs --
# "cannot be used in the Authentication header for this API." A key that is
# real, active, and simply the wrong *kind* is refused too, in words the
# published reference states plainly and this project could not strike
# live, because minting either kind of key needs an account this Recipe was
# never given. That is the machine-to-machine-versus-end-user split this
# group of Recipes was asked to look for: PropelAuth draws it not as two
# endpoints with two failure vocabularies, the way Frontegg and Kinde both
# do, but as two categories of the same credential, checked at the one gate
# above, and the published words are the only source for what the second
# category's own refusal looks like.
#
# PropelAuth's own official Postman collection --
# docs.propelauth.com/files/PropelAuth.postman_collection.json, fetched
# directly and confirmed live -- is not an OpenAPI description and is not
# recorded as upstream.spec for that reason; see the fidelity gaps. It does
# carry real, vendor-authored worked examples for the two GET routes this
# Recipe models, and one of them settles the backlog question this Recipe
# was assigned to check: a user's own record carries org_id_to_org_info, and
# PropelAuth's own example user -- test@propelauth.com -- has it as {}, an
# empty object, on a 200 response with nothing else about the record marked
# invalid or incomplete. A user in no organisation at all is not an edge
# case PropelAuth's own example needed to reach for; it is the example.
# Org membership is a fact read separately, at GET /api/backend/v1/org/{id}
# or GET /api/backend/v1/user/org/{id}, and role_in_org itself appears only
# on that second, org-scoped listing's own entries in the same collection's
# published examples -- never on the plain user fetch. Both routes are
# recorded from those examples here; the membership-listing route itself is
# not modelled, for the reasons stated below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account, application or API key of either kind was ever created.
#     The two 200 cases below are the real worked examples PropelAuth's own
#     Postman collection publishes, not observed against a live environment,
#     and carry no verified date.
#   - Cauldron's required_headers mechanism, the same one make/recipe.yaml,
#     turso/recipe.yaml and census/recipe.yaml all use for "nothing was sent
#     at all," produces its own generic sentence when a Recipe's error
#     declares no message -- an explicitly empty message string is
#     indistinguishable from an unset one and falls back the same way. It
#     cannot serve PropelAuth's true zero-byte body. The credential-present
#     404 is reproduced exactly, byte for byte, using a raw empty response
#     instead of the errors mechanism; the credential-absent 401's
#     conformance case below asserts status only, not body, because nothing
#     this Recipe could put in that field would be the sentence PropelAuth
#     actually sends -- and PropelAuth sends none.
#   - The frontend login flow (the three-hop redirect and the Next.js 404
#     it ends in) is an HTML response from PropelAuth's own web app, not a
#     JSON API shape, and is recorded above as observed evidence rather than
#     served by a route -- the same choice kinde/recipe.yaml makes for its
#     own frontend 404 page.
#   - GET /api/backend/v1/user/org/{org_id} -- the org-membership listing
#     that carries role_in_org -- is real, documented, has a published
#     worked example, and is not modelled as its own route. Reproducing it
#     faithfully needs the same user record to answer with a different field
#     set depending on which route reached it, which this format's returns:
#     mechanism can do; the header states the finding in full instead of
#     spending a second resource definition on one supplementary case this
#     Recipe's main question does not turn on.
#   - "User API Keys cannot be used in the Authentication header for this
#     API" is PropelAuth's own published sentence and no case below serves
#     it: reproducing it needs a real key of the wrong kind, which nothing
#     unauthenticated could mint.
#   - Every other backend route -- create, update, delete, SAML
#     configuration, end-user API key management, MFA step-up -- is out of
#     scope. This Recipe exists to show the hostname and credential-presence
#     mechanism on two GET routes, not to be a complete client.
#   - No rate-limit header was seen on any response this Recipe struck, so
#     none is declared.
#
# Every case below not carrying a verified date was read from PropelAuth's
# own official Postman collection at docs.propelauth.com/files/PropelAuth
# .postman_collection.json, fetched directly, not observed against a real
# environment. Keys below are fixtures, not secrets.

recipe: propelauth
capability: auth
version: 0.1.0

upstream:
  api: backend/v1
  provider: propelauth
  docs: https://docs.propelauth.com/reference/api/getting-started
  # No OpenAPI/swagger document was found at any stable URL for this API --
  # only the Postman collection cited throughout this header, which is a
  # different format entirely. See the header for what it settled anyway.

auth:
  # Genuinely a bearer API key, but PropelAuth's own gate answers on whether
  # Authorization carried anything at all, not on whether what it carried
  # checks out -- see the header. scheme: none plus required_headers is the
  # same device make/recipe.yaml, turso/recipe.yaml and census/recipe.yaml
  # all use for a check this binary a real bearer scheme cannot reproduce.
  scheme: none

required_headers:
  Authorization:
    error: no_credential

resources:
  user:
    id:
      style: uuid
      field: user_id
    fields:
      email:
        type: string
      email_confirmed:
        type: boolean
      has_password:
        type: boolean
      username:
        type: string
        null_when_unset: true
      first_name:
        type: string
        null_when_unset: true
      last_name:
        type: string
        null_when_unset: true
      picture_url:
        type: string
        null_when_unset: true
      locked:
        type: boolean
        default: false
      enabled:
        type: boolean
        default: true
      mfa_enabled:
        type: boolean
        default: false
      can_create_orgs:
        type: boolean
        default: false
      created_at:
        type: timestamp
      last_active_at:
        type: timestamp
      # {} for a user who belongs to nowhere -- see the header. Not a
      # special case in PropelAuth's own published example; it is the
      # example.
      org_id_to_org_info:
        type: map
      update_password_required:
        type: boolean
        default: false

  organization:
    id:
      style: uuid
      field: org_id
    fields:
      name:
        type: string
      url_safe_org_slug:
        type: string
      can_setup_saml:
        type: boolean
        default: false
      is_saml_configured:
        type: boolean
        default: false
      is_saml_in_test_mode:
        type: boolean
        default: false
      domain:
        type: string
        null_when_unset: true
      domain_autojoin:
        type: boolean
        default: false
      domain_restrict:
        type: boolean
        default: false
      max_users:
        type: integer
        null_when_unset: true
      custom_role_mapping_name:
        type: string
        null_when_unset: true

routes:
  - method: GET
    path: /api/backend/v1/user/{id}
    resource: user
    operation: get
    matches_header:
      Authorization: "Bearer cauldron-propelauth-fixture-api-key-00000000000000000000000000000000"

  # Any Authorization header at all, offered and not the fixture key above.
  # See the header: this is the shape a real, valid key aimed at the wrong
  # environment would also get, because presence is the only thing checked
  # at this layer.
  - method: GET
    path: /api/backend/v1/user/{id}
    status: 404
    raw:
      content_type: "text/plain; charset=utf-8"
      empty: true

  - method: GET
    path: /api/backend/v1/org/{id}
    resource: organization
    operation: get
    matches_header:
      Authorization: "Bearer cauldron-propelauth-fixture-api-key-00000000000000000000000000000000"

  - method: GET
    path: /api/backend/v1/org/{id}
    status: 404
    raw:
      content_type: "text/plain; charset=utf-8"
      empty: true

  # A path this Recipe declares no other route for. Struck live: with any
  # Authorization header, this answers the identical empty 404 a real path's
  # fallback does, and with none at all it never reaches routing -- see the
  # header.
  - method: GET
    path: /api/backend/v1/this-route-does-not-exist
    status: 404
    raw:
      content_type: "text/plain; charset=utf-8"
      empty: true

errors:
  # required_headers' own answer for a request carrying no Authorization
  # anywhere at all. PropelAuth's real body here is zero bytes; Cauldron's
  # errors mechanism cannot express that -- see the header's fidelity gaps --
  # so no message is declared, and the conformance case below does not
  # assert one.
  no_credential:
    status: 401
    style: text

fixtures:
  empty: {}

  # test@propelauth.com and Acme Inc, PropelAuth's own worked examples from
  # its official Postman collection, quoted rather than invented.
  small-environment:
    user:
      - id: a04d69d7-9347-48a3-aa01-8e7ce9aeee04
        email: test@propelauth.com
        email_confirmed: false
        has_password: true
        username: ant
        first_name: Anthony
        last_name: Edwards
        picture_url: https://img.propelauth.com/2a27d237-db8c-4f82-84fb-5824dfaedc87.png
        locked: false
        enabled: true
        mfa_enabled: false
        can_create_orgs: false
        created_at: 1712770147
        last_active_at: 1712770147
        # Empty -- this user belongs to no organisation. See the header.
        org_id_to_org_info: {}
        update_password_required: true

    organization:
      - id: 582e7c11-6b72-40d8-886d-461e6491fa71
        name: Acme Inc
        url_safe_org_slug: 51c08c1b-8526-40cd-8679-ddb15cea2984
        can_setup_saml: false
        is_saml_configured: false
        is_saml_in_test_mode: false
        domain: acme.com
        domain_autojoin: true
        domain_restrict: true
        max_users: 100
        custom_role_mapping_name: Business Plan

conformance:
  - name: no credential at all is 401 -- Cauldron cannot serve the true empty body, so this asserts status only
    source: https://1581439057.propelauthtest.com/api/backend/v1/user/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/backend/v1/user/00000000-0000-0000-0000-000000000000
    expect:
      status: 401

  - name: any Authorization header at all, however wrong, is 404 instead -- an empty body, byte for byte
    source: https://1581439057.propelauthtest.com/api/backend/v1/user/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/backend/v1/user/00000000-0000-0000-0000-000000000000
      headers:
        Authorization: Bearer junk-not-a-real-key
    expect:
      status: 404
      body_matches: "^$"

  - name: a path this Recipe has no other route for answers the identical empty 404, once a credential was offered
    source: https://1581439057.propelauthtest.com/api/backend/v1/this-route-does-not-exist
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/backend/v1/this-route-does-not-exist
      headers:
        Authorization: Bearer junk-not-a-real-key
    expect:
      status: 404
      body_matches: "^$"

  - name: and the same unrouted path with no credential never reaches routing at all
    source: https://1581439057.propelauthtest.com/api/backend/v1/this-route-does-not-exist
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/backend/v1/this-route-does-not-exist
    expect:
      status: 401

  - name: a wholly fabricated hostname, never resolved by this project before, answers exactly the same way
    # The first request this project ever made to this hostname, at this
    # path, still answered the identical presence-only split as
    # PropelAuth's own quickstart example above -- confirming the split is
    # not something particular to one host this project happened to probe
    # repeatedly.
    source: https://zzz-cauldron-nonexistent-probe-12345.propelauthtest.com/api/backend/v1/user/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/backend/v1/user/00000000-0000-0000-0000-000000000000
    expect:
      status: 401

  - name: a user who belongs to no organisation is a complete, ordinary record
    source: https://docs.propelauth.com/files/PropelAuth.postman_collection.json
    fixture: small-environment
    request:
      method: GET
      path: /api/backend/v1/user/a04d69d7-9347-48a3-aa01-8e7ce9aeee04
      headers:
        Authorization: "Bearer cauldron-propelauth-fixture-api-key-00000000000000000000000000000000"
    expect:
      status: 200
      body:
        email: test@propelauth.com
        org_id_to_org_info: {}
        update_password_required: true
      absent:
        - role_in_org

  - name: an organisation is fetched separately from any user's membership in it
    source: https://docs.propelauth.com/files/PropelAuth.postman_collection.json
    fixture: small-environment
    request:
      method: GET
      path: /api/backend/v1/org/582e7c11-6b72-40d8-886d-461e6491fa71
      headers:
        Authorization: "Bearer cauldron-propelauth-fixture-api-key-00000000000000000000000000000000"
    expect:
      status: 200
      body:
        name: Acme Inc
        domain: acme.com
        max_users: 100
      absent:
        - users
        - user_id
