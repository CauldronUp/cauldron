# Heroku Platform API Recipe for Cauldron
#
# A successful list is a 206.
#
# Heroku pages with the Range header rather than with query parameters, and
# when there is more to fetch it answers 206 Partial Content with a Next-Range
# header telling you where to resume. A 200 on a list means you got
# everything.
#
# So the two obvious ways to write a client are both wrong in opposite
# directions. `if (response.status === 200)` treats every page but the last as
# a failure. `if (response.ok)` accepts them and never reads Next-Range, so it
# processes the first two hundred apps and reports that as all of them --
# quietly, correctly as far as it can tell, and for as long as the account has
# fewer than two hundred of anything.
#
# And a paginator that appends ?page=2 gets page one, forever, with a 206 on
# every request to say so.
#
# Four more the Recipe pins:
#
#   1. The Accept header is not optional and not a content negotiation. It
#      carries the API version, and without it the answer is 406 with a
#      message quoting the exact header you needed. Every client library
#      sends it and every hand-rolled curl forgets it once.
#   2. Errors are keyed by id, not by code. {"id": "not_found", "message":
#      ...}, so code switching on error.code finds undefined on every failure
#      Heroku has.
#   3. url is on an error only when there is one to give. It appears beside
#      rate_limit and does not appear beside not_found, so a client that
#      renders it unconditionally renders undefined for most failures.
#   4. A formation with quantity zero is a process type that exists and is
#      not running. Scaling to nought does not remove it, so a client
#      counting formations counts things that consume nothing, and one
#      checking whether a type exists gets the wrong answer about whether it
#      is up.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Every list here answers 206, and Heroku answers 200 on a final page.
#     The transition is not modelled. Answering 200 throughout would be the
#     more comfortable lie: a client would never meet the status this Recipe
#     exists to make it handle, and would meet it in production instead.
#   - Range is not honoured. The header is read by nothing here, so the page
#     you get is the fixture, and Next-Range is a constant rather than a
#     cursor that moves.
#   - The required Accept header is checked for presence and not for its
#     version. Heroku rejects `version=2` as firmly as it rejects nothing at
#     all, and this format can say a header is required rather than what it
#     must contain.
#   - Nothing is built, released, scaled or billed. Builds, slugs, config
#     vars, add-ons, domains, collaborators, pipelines and the dyno size
#     catalogue are not modelled.
#
# Probed live, unauthenticated, on 2026-09-05, against api.heroku.com (with
# the required Accept header sent throughout, since that check is checked
# first and would otherwise mask everything else):
#
#   1. GET /apps with no Authorization header at all answers 401
#      {"id":"unauthorized","message":"There were no credentials in your
#      `Authorization` header. Try `Authorization: Bearer <OAuth access
#      token>`..."}. An invented Bearer token answers the identical id
#      under a different sentence: {"id":"unauthorized","message":"Invalid
#      credentials provided."} -- exactly what this file had declared
#      under the name unauthorized, which nothing wired to authentication
#      at all: no case armed it and no auth field named it, so every
#      credential failure fell through to a hardcoded generic default
#      instead. Renamed to authentication_error below, which fixes that;
#      auth.absent_error carries the split against the no-credential
#      sentence.
#   2. GET /not-a-real-endpoint and PATCH /apps (a method this Recipe does
#      not declare for it), both with no credential, answer the identical
#      404 {"id":"not_found","message":"The requested API endpoint was not
#      found. Are you using the right HTTP verb...and did you specify your
#      intended version with the `Accept` header?"} -- a different sentence
#      from the per-app not_found this file already declares and arms, and
#      reached without the credential mattering, which auth.after_routing
#      below declares.
#
# Keys below are fixtures, not secrets.

recipe: heroku
capability: hosting
version: 0.1.0

upstream:
  api: "3"
  docs: https://devcenter.heroku.com/articles/platform-api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Struck live: no credential at all names the missing header explicitly
  # and suggests both schemes Heroku accepts, a different sentence from a
  # present-but-wrong token. See the header.
  absent_error: missing_credentials
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true
  keys:
    - HRKU-cauldron00000000000000000000000000

# Not content negotiation: this is where the API version lives, and leaving
# it off is a 406 rather than a default.
required_headers:
  Accept:
    error: not_acceptable

responses:
  list:
    style: bare
  # Flat, and the machine-readable part is called id. Anything switching on
  # error.code finds undefined on every failure this API has.
  error:
    style: flat
    code_field: id
    message_field: message
    type_field: "-"

resources:
  app:
    collection: apps
    id:
      style: uuid
    fields:
      name:
        type: string
      web_url:
        type: string
      # When a release last went out. Not the same as updated_at, which moves
      # for config changes that never shipped anything.
      released_at:
        type: datetime
      created_at:
        type: datetime
      updated_at:
        type: datetime
      maintenance:
        type: boolean
        default: false
      region:
        type: string
        in: region
        as: name
      stack:
        type: string
        in: stack
        as: name
      owner_email:
        type: string
        in: owner
        as: email

  release:
    collection: releases
    id:
      style: uuid
    fields:
      # A number that counts up per app, and the thing humans mean by "which
      # release". Not the identifier, which is a uuid.
      version:
        type: integer
      # pending, succeeded or failed. A pending release exists while the
      # build runs, so a listing taken mid-deploy contains one that has
      # shipped nothing.
      status:
        type: string
        default: succeeded
      # Whether this is what is running now. A failed release is still in
      # the listing and is not current.
      current:
        type: boolean
        default: false
      description:
        type: string
      created_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

  dyno:
    collection: dynos
    id:
      style: uuid
    fields:
      name:
        type: string
      type:
        type: string
        default: web
      # starting, up, crashed, down or idle. Two of those are ordinary and
      # three are not, and "not up" covers a dyno that is booting normally.
      state:
        type: string
        default: up
      size:
        type: string
        default: Standard-1X
      command:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

  formation:
    collection: formations
    id:
      style: uuid
    fields:
      type:
        type: string
      # Zero is a process type that exists and is not running. Scaling to
      # nought does not remove it.
      quantity:
        type: integer
        default: 1
      size:
        type: string
        default: Standard-1X
      command:
        type: string
      updated_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

routes:
  # 206, with somewhere to resume from. A 200 here would mean there is
  # nothing more, and a client that only handles 200 never gets this far.
  - method: GET
    path: /apps
    resource: app
    operation: list
    # Paging is deliberately not declared on any of Heroku's listings, and
    # the reason is a real gap in this format rather than a gap in the
    # reading. Heroku pages by HTTP **headers**: the caller sends Range:
    # id <start>..; max=200; order=desc, and a partial answer comes back
    # as 206 with Next-Range carrying the position to send next. There is
    # no query parameter of any kind.
    #
    # pagination.in accepts query and body. A third value would need more
    # than a name, because Heroku's Range value is compound -- the
    # position and the page size travel inside one header, in one string
    # -- so limit_param and cursor_param have nothing separate to point
    # at, and the reply side needs a header this format has no key for
    # either.
    #
    # Declaring style: none would be the comfortable lie: it would stop
    # this route being counted as unstated and would tell every reader
    # that Heroku serves whole collections, which it does not. The header
    # above records what the fake actually does -- "Range is not honoured
    # ... Next-Range is a constant rather than a cursor that moves" -- and
    # this note records why nothing is declared here instead.
    status: 206
    headers:
      Accept-Ranges: "id, name"
      Content-Range: "id 0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41..3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906; max=200"
      Next-Range: "id 3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906..; max=200"

  - method: GET
    path: /apps/{id}
    resource: app
    operation: get

  # Known and narrower than Heroku: every route below takes the app's name,
  # and Heroku takes either the name or the app's UUID wherever one of these
  # says {app_name}. The scope matches one field, so asking for an app's
  # releases by its id answers with an empty list here and with the releases
  # against Heroku -- no error either way, which is the quiet kind of
  # difference.
  #
  # It is the tolerable direction. Code written against this uses the name,
  # and the name works against Heroku too; code written against Heroku with
  # an id breaks here, loudly and locally, which is where a difference should
  # break. The case below pins the behaviour so the narrowing is a decision
  # rather than a surprise.
  - method: GET
    path: /apps/{app_name}/releases
    resource: release
    operation: list
    # Paging is deliberately not declared on any of Heroku's listings, and
    # the reason is a real gap in this format rather than a gap in the
    # reading. Heroku pages by HTTP **headers**: the caller sends Range:
    # id <start>..; max=200; order=desc, and a partial answer comes back
    # as 206 with Next-Range carrying the position to send next. There is
    # no query parameter of any kind.
    #
    # pagination.in accepts query and body. A third value would need more
    # than a name, because Heroku's Range value is compound -- the
    # position and the page size travel inside one header, in one string
    # -- so limit_param and cursor_param have nothing separate to point
    # at, and the reply side needs a header this format has no key for
    # either.
    #
    # Declaring style: none would be the comfortable lie: it would stop
    # this route being counted as unstated and would tell every reader
    # that Heroku serves whole collections, which it does not. The header
    # above records what the fake actually does -- "Range is not honoured
    # ... Next-Range is a constant rather than a cursor that moves" -- and
    # this note records why nothing is declared here instead.
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "version"
      Next-Range: "version 4..; order=desc,max=200"

  - method: GET
    path: /apps/{app_name}/dynos
    resource: dyno
    operation: list
    # Paging is deliberately not declared on any of Heroku's listings, and
    # the reason is a real gap in this format rather than a gap in the
    # reading. Heroku pages by HTTP **headers**: the caller sends Range:
    # id <start>..; max=200; order=desc, and a partial answer comes back
    # as 206 with Next-Range carrying the position to send next. There is
    # no query parameter of any kind.
    #
    # pagination.in accepts query and body. A third value would need more
    # than a name, because Heroku's Range value is compound -- the
    # position and the page size travel inside one header, in one string
    # -- so limit_param and cursor_param have nothing separate to point
    # at, and the reply side needs a header this format has no key for
    # either.
    #
    # Declaring style: none would be the comfortable lie: it would stop
    # this route being counted as unstated and would tell every reader
    # that Heroku serves whole collections, which it does not. The header
    # above records what the fake actually does -- "Range is not honoured
    # ... Next-Range is a constant rather than a cursor that moves" -- and
    # this note records why nothing is declared here instead.
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "id, name"

  - method: GET
    path: /apps/{app_name}/formation
    resource: formation
    operation: list
    # Paging is deliberately not declared on any of Heroku's listings, and
    # the reason is a real gap in this format rather than a gap in the
    # reading. Heroku pages by HTTP **headers**: the caller sends Range:
    # id <start>..; max=200; order=desc, and a partial answer comes back
    # as 206 with Next-Range carrying the position to send next. There is
    # no query parameter of any kind.
    #
    # pagination.in accepts query and body. A third value would need more
    # than a name, because Heroku's Range value is compound -- the
    # position and the page size travel inside one header, in one string
    # -- so limit_param and cursor_param have nothing separate to point
    # at, and the reply side needs a header this format has no key for
    # either.
    #
    # Declaring style: none would be the comfortable lie: it would stop
    # this route being counted as unstated and would tell every reader
    # that Heroku serves whole collections, which it does not. The header
    # above records what the fake actually does -- "Range is not honoured
    # ... Next-Range is a constant rather than a cursor that moves" -- and
    # this note records why nothing is declared here instead.
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "id, type"

errors:
  # The header is the version. Without it there is no default, and the
  # message names exactly what was missing, which is more than most APIs do
  # and still catches everybody once.
  not_acceptable:
    status: 406
    code: not_acceptable
    message: "request failed, set `Accept: application/vnd.heroku+json; version=3` header and try again"

  # A token bucket rather than a window: 4500 tokens, refilled at about
  # seventy-five a minute, so "wait a minute" buys you seventy-five requests
  # rather than a fresh allowance.
  rate_limit:
    status: 429
    code: rate_limit
    message: "Your account reached the API rate limit\nPlease wait a few minutes before making new requests"
    headers:
      RateLimit-Remaining: "0"
    # Present here and absent on most others, so a client rendering it
    # unconditionally renders undefined for the majority of failures.
    fields:
      url: https://devcenter.heroku.com/articles/platform-api-reference#rate-limits

  not_found:
    status: 404
    code: not_found
    message: "Couldn't find that app."

  # Struck live with an invented Bearer token. Renamed from unauthorized,
  # which nothing had wired to authentication: no case armed it and no
  # auth field named it, so it had never actually been reachable.
  authentication_error:
    status: 401
    code: unauthorized
    message: "Invalid credentials provided."

  # Struck live with no credential at all: the identical id, a different
  # sentence naming both schemes Heroku accepts.
  missing_credentials:
    status: 401
    code: unauthorized
    message: "There were no credentials in your `Authorization` header. Try `Authorization: Bearer <OAuth access token>` or `Authorization: Basic <base64-encoded email + \":\" + password>`."

  # Struck live with no credential at all: the router answers before
  # authentication is ever consulted, which auth.after_routing declares.
  # A different sentence from the per-app not_found above.
  unknown_route:
    status: 404
    code: not_found
    message: "The requested API endpoint was not found. Are you using the right HTTP verb (i.e. `GET` vs. `POST`), and did you specify your intended version with the `Accept` header?"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical body an unrouted path gets.
  method_not_allowed:
    status: 404
    code: not_found
    message: "The requested API endpoint was not found. Are you using the right HTTP verb (i.e. `GET` vs. `POST`), and did you specify your intended version with the `Accept` header?"

  forbidden:
    status: 403
    code: forbidden
    message: "You do not have access to the app cauldron-api."

