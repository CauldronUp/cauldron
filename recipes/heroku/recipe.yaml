      # Starting. Not up, and not a problem, and code that treats anything
      # other than up as an outage pages somebody every deploy.
      - id: 8a6d1f39-4b2c-40e7-95af-c1e83b7d02f6
        name: web.2
        type: web
        state: starting
        size: Standard-1X
        command: "npm start"
        created_at: "2026-08-19T09:03:02Z"
