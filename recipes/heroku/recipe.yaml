        app_id: 0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41
        app_name: cauldron-api

      # Failed, and still in the listing with a version number of its own.
      # A client taking the highest version as what is running takes this
      # one, which shipped nothing.
      - id: 2e8f5a13-c60b-4d97-8a24-f3b1d7e69c05
        version: 42
        status: failed
        current: false
        description: "Deploy 4b7e2f1"
        created_at: "2026-08-19T07:41:12Z"
        app_id: 0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41
        app_name: cauldron-api

      # Pending: the build is running and this release has shipped nothing
      # either. Neither a success nor a failure.
      - id: 9d4c2b78-1a05-4e63-bf8e-72a6c1d4093b
        version: 43
        status: pending
        current: false
        description: "Deploy 1c9d0ba"
        created_at: "2026-08-19T09:02:31Z"
