# Every case below is derived from Heroku's published Platform API reference.
# None has been run against a real account. The verify report says so.
conformance:
  - name: a successful list is a 206
    # Not 200. There is more to fetch, and the status says so, and the two
    # obvious ways to write a client are wrong in opposite directions:
    # comparing to 200 rejects every page but the last, and testing ok
    # accepts them and never looks for the rest.
    source: https://devcenter.heroku.com/articles/platform-api-reference#ranges
    fixture: one-account
    request:
      method: GET
      path: /apps
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      body:
        "[0].name": cauldron-api
        "[1].name": cauldron-worker

  - name: and where to resume is a header, not a field
    # Next-Range is in the response headers. Nothing in the body says there
    # is more, so a client that only parses JSON has everything it needs to
    # be wrong.
    source: https://devcenter.heroku.com/articles/platform-api-reference#ranges
    fixture: one-account
    request:
      method: GET
      path: /apps
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      headers:
        Next-Range: "id 3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906..; max=200"
        Accept-Ranges: "id, name"
      absent:
        - next
        - "[0].next_range"

  - name: leaving off the Accept header is a 406 that quotes it back
    # The version lives in that header and there is no default. The message
    # names exactly what was missing, which is more than most APIs manage,
    # and it still catches everybody once.
    source: https://devcenter.heroku.com/articles/platform-api-reference#clients
    fixture: one-account
    request:
      method: GET
      path: /apps
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
    expect:
      status: 406
      body:
        id: not_acceptable
        message: "request failed, set `Accept: application/vnd.heroku+json; version=3` header and try again"

  - name: the machine-readable part of an error is called id
    # Not code. Anything switching on error.code finds undefined on every
    # failure this API has.
    source: https://devcenter.heroku.com/articles/platform-api-reference#errors
    fixture: one-account
    arm: not_found
    request:
      method: GET
      path: /apps
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 404
      body:
        id: not_found
        message: "Couldn't find that app."
      absent:
        - code
        - error
        - url

  - name: and url is there only when there is one to give
    # Beside rate_limit and not beside not_found, so rendering it
    # unconditionally renders undefined for most failures.
    source: https://devcenter.heroku.com/articles/platform-api-reference#rate-limits
    fixture: one-account
    arm: rate_limit
    request:
      method: GET
      path: /apps
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 429
      headers:
        RateLimit-Remaining: "0"
      body:
        id: rate_limit
        url: https://devcenter.heroku.com/articles/platform-api-reference#rate-limits

  - name: a failed release is still in the listing with a version of its own
    # And it is the highest version, so taking the largest number as what is
    # running takes the one that shipped nothing.
    source: https://devcenter.heroku.com/articles/platform-api-reference#release
    fixture: one-account
    request:
      method: GET
      path: /apps/cauldron-api/releases
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      body:
        "[0].version": 41
        "[0].current": true
        "[1].version": 42
        "[1].status": failed
        "[1].current": false

  - name: and a pending one has shipped nothing either
    # Neither a success nor a failure. A listing taken mid-deploy contains
    # it, with the highest version number of the three.
    source: https://devcenter.heroku.com/articles/platform-api-reference#release
    fixture: one-account
    request:
      method: GET
      path: /apps/cauldron-api/releases
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      body:
        "[2].version": 43
        "[2].status": pending
        "[2].current": false
      absent:
        - "[3]"

  - name: a formation scaled to nothing still exists
    # quantity 0 is a process type that is configured and is not running, so
    # a client asking whether the scheduler is set up gets yes and one
    # asking whether it is running gets the same yes.
    source: https://devcenter.heroku.com/articles/platform-api-reference#formation
    fixture: one-account
    request:
      method: GET
      path: /apps/cauldron-api/formation
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      body:
        "[0].type": web
        "[0].quantity": 2
        "[1].type": scheduler
        "[1].quantity": 0

  - name: a starting dyno is not up and is not a problem
    # Code that treats anything other than up as an outage pages somebody
    # every deploy.
    source: https://devcenter.heroku.com/articles/platform-api-reference#dyno
    fixture: one-account
    request:
      method: GET
      path: /apps/cauldron-api/dynos
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 206
      body:
        "[0].state": up
        "[1].state": starting
        "[2].state": crashed
        "[2].type": worker

  - name: updated_at moves without anything having been released
    # A config change that shipped nothing still touches it, so reading it
    # as "when did we last deploy" is wrong in the direction that looks
    # right: it is later than released_at rather than earlier.
    source: https://devcenter.heroku.com/articles/platform-api-reference#app
    fixture: one-account
    request:
      method: GET
      path: /apps/0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 200
      body:
        released_at: "2026-08-18T14:22:07Z"
        updated_at: "2026-08-19T07:41:12Z"
        name: cauldron-api

  - name: an app in maintenance is a normal app with a flag on it
    # Still listed, still billed, and serving a holding page. Nothing in its
    # status says so, because it does not have one.
    source: https://devcenter.heroku.com/articles/platform-api-reference#app
    fixture: one-account
    request:
      method: GET
      path: /apps/3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906
      headers:
        Authorization: Bearer HRKU-cauldron00000000000000000000000000
        Accept: application/vnd.heroku+json; version=3
    expect:
      status: 200
      body:
        maintenance: true
        name: cauldron-worker
        region.name: eu
        stack.name: heroku-24
      absent:
        - status
        - state
