# Heroku Platform API Recipe for Cauldron
#
# A successful list is a 206.
#
# Heroku pages with the Range header rather than with query parameters, and
# when there is more to fetch it answers 206 Partial Content with a Next-Range
# header telling you where to resume. A 200 on a list means you got
# everything.
#
# So the two obvious ways to write a client are both wrong in opposite
# directions. `if (response.status === 200)` treats every page but the last as
# a failure. `if (response.ok)` accepts them and never reads Next-Range, so it
# processes the first two hundred apps and reports that as all of them --
# quietly, correctly as far as it can tell, and for as long as the account has
# fewer than two hundred of anything.
#
# And a paginator that appends ?page=2 gets page one, forever, with a 206 on
# every request to say so.
#
# Four more the Recipe pins:
#
#   1. The Accept header is not optional and not a content negotiation. It
#      carries the API version, and without it the answer is 406 with a
#      message quoting the exact header you needed. Every client library
#      sends it and every hand-rolled curl forgets it once.
#   2. Errors are keyed by id, not by code. {"id": "not_found", "message":
#      ...}, so code switching on error.code finds undefined on every failure
#      Heroku has.
#   3. url is on an error only when there is one to give. It appears beside
#      rate_limit and does not appear beside not_found, so a client that
#      renders it unconditionally renders undefined for most failures.
#   4. A formation with quantity zero is a process type that exists and is
#      not running. Scaling to nought does not remove it, so a client
#      counting formations counts things that consume nothing, and one
#      checking whether a type exists gets the wrong answer about whether it
#      is up.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Every list here answers 206, and Heroku answers 200 on a final page.
#     The transition is not modelled. Answering 200 throughout would be the
#     more comfortable lie: a client would never meet the status this Recipe
#     exists to make it handle, and would meet it in production instead.
#   - Range is not honoured. The header is read by nothing here, so the page
#     you get is the fixture, and Next-Range is a constant rather than a
#     cursor that moves.
#   - The required Accept header is checked for presence and not for its
#     version. Heroku rejects `version=2` as firmly as it rejects nothing at
#     all, and this format can say a header is required rather than what it
#     must contain.
#   - Nothing is built, released, scaled or billed. Builds, slugs, config
#     vars, add-ons, domains, collaborators, pipelines and the dyno size
#     catalogue are not modelled.
#
# Keys below are fixtures, not secrets.

recipe: heroku
capability: hosting
version: 0.1.0

upstream:
  api: "3"
  docs: https://devcenter.heroku.com/articles/platform-api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - HRKU-cauldron00000000000000000000000000

# Not content negotiation: this is where the API version lives, and leaving
# it off is a 406 rather than a default.
required_headers:
  Accept:
    error: not_acceptable

responses:
  list:
    style: bare
  # Flat, and the machine-readable part is called id. Anything switching on
  # error.code finds undefined on every failure this API has.
  error:
    style: flat
    code_field: id
    message_field: message
    type_field: "-"

resources:
  app:
    collection: apps
    id:
      style: uuid
    fields:
      name:
        type: string
      web_url:
        type: string
      # When a release last went out. Not the same as updated_at, which moves
      # for config changes that never shipped anything.
      released_at:
        type: datetime
      created_at:
        type: datetime
      updated_at:
        type: datetime
      maintenance:
        type: boolean
        default: false
      region:
        type: string
        in: region
        as: name
      stack:
        type: string
        in: stack
        as: name
      owner_email:
        type: string
        in: owner
        as: email

  release:
    collection: releases
    id:
      style: uuid
    fields:
      # A number that counts up per app, and the thing humans mean by "which
      # release". Not the identifier, which is a uuid.
      version:
        type: integer
      # pending, succeeded or failed. A pending release exists while the
      # build runs, so a listing taken mid-deploy contains one that has
      # shipped nothing.
      status:
        type: string
        default: succeeded
      # Whether this is what is running now. A failed release is still in
      # the listing and is not current.
      current:
        type: boolean
        default: false
      description:
        type: string
      created_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

  dyno:
    collection: dynos
    id:
      style: uuid
    fields:
      name:
        type: string
      type:
        type: string
        default: web
      # starting, up, crashed, down or idle. Two of those are ordinary and
      # three are not, and "not up" covers a dyno that is booting normally.
      state:
        type: string
        default: up
      size:
        type: string
        default: Standard-1X
      command:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

  formation:
    collection: formations
    id:
      style: uuid
    fields:
      type:
        type: string
      # Zero is a process type that exists and is not running. Scaling to
      # nought does not remove it.
      quantity:
        type: integer
        default: 1
      size:
        type: string
        default: Standard-1X
      command:
        type: string
      updated_at:
        type: datetime
      app_id:
        type: string
        in: app
        as: id
      app_name:
        type: string
        in: app
        as: name

routes:
  # 206, with somewhere to resume from. A 200 here would mean there is
  # nothing more, and a client that only handles 200 never gets this far.
  - method: GET
    path: /apps
    resource: app
    operation: list
    status: 206
    headers:
      Accept-Ranges: "id, name"
      Content-Range: "id 0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41..3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906; max=200"
      Next-Range: "id 3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906..; max=200"

  - method: GET
    path: /apps/{id}
    resource: app
    operation: get

  - method: GET
    path: /apps/{app_name}/releases
    resource: release
    operation: list
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "version"
      Next-Range: "version 4..; order=desc,max=200"

  - method: GET
    path: /apps/{app_name}/dynos
    resource: dyno
    operation: list
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "id, name"

  - method: GET
    path: /apps/{app_name}/formation
    resource: formation
    operation: list
    scope: [app_name]
    status: 206
    headers:
      Accept-Ranges: "id, type"

errors:
  # The header is the version. Without it there is no default, and the
  # message names exactly what was missing, which is more than most APIs do
  # and still catches everybody once.
  not_acceptable:
    status: 406
    code: not_acceptable
    message: "request failed, set `Accept: application/vnd.heroku+json; version=3` header and try again"

  # A token bucket rather than a window: 4500 tokens, refilled at about
  # seventy-five a minute, so "wait a minute" buys you seventy-five requests
  # rather than a fresh allowance.
  rate_limit:
    status: 429
    code: rate_limit
    message: "Your account reached the API rate limit\nPlease wait a few minutes before making new requests"
    headers:
      RateLimit-Remaining: "0"
    # Present here and absent on most others, so a client rendering it
    # unconditionally renders undefined for the majority of failures.
    fields:
      url: https://devcenter.heroku.com/articles/platform-api-reference#rate-limits

  not_found:
    status: 404
    code: not_found
    message: "Couldn't find that app."

  unauthorized:
    status: 401
    code: unauthorized
    message: "Invalid credentials provided."

  forbidden:
    status: 403
    code: forbidden
    message: "You do not have access to the app cauldron-api."

fixtures:
  empty: {}

  one-account:
    app:
      - id: 0fd0a1e5-2c2f-4a1d-9c86-6b2e7f9c3a41
        name: cauldron-api
        web_url: https://cauldron-api-8f21.herokuapp.com/
        released_at: "2026-08-18T14:22:07Z"
        created_at: "2025-04-02T09:15:44Z"
        # Later than released_at: a config change that shipped nothing still
        # moves this, so treating it as "when did we last deploy" is wrong
        # in the direction that looks fine.
        updated_at: "2026-08-19T07:41:12Z"
        maintenance: false
        region: eu
        stack: heroku-24
        owner_email: ada@example.com

      # In maintenance. Still listed, still billed, and serving a holding
      # page rather than the application.
      - id: 3a71f2c9-8d54-4e0b-9f1a-2c7d5e8b4906
        name: cauldron-worker
        web_url: https://cauldron-worker-31b7.herokuapp.com/
        released_at: "2026-07-30T11:03:55Z"
        created_at: "2025-09-11T16:40:02Z"
        updated_at: "2026-08-01T08:12:39Z"
