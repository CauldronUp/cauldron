# Novita Recipe for Cauldron
#
# The models listing, struck live against api.novita.ai on 2026-09-13 with no
# credential, with a deliberately invalid one, with a malformed one, and on a
# path that does not exist. The record shape below is the live response, which
# anyone can fetch.
#
# **A wrong credential is not refused. It is ignored.** Struck live, all three
# answer 200 and the whole catalogue:
#
#   (no header)                  200  117 models
#   Authorization: Bearer notreal  200  117 models
#   Authorization: notabearer      200  117 models
#
# The endpoint never reads the header at all, so a client that has misconfigured
# its key gets a perfectly successful response here and a failure on its first
# real call -- and the place it would have found out is the one endpoint people
# use to check their setup.
#
# **The price list is public.** 117 models with per-token pricing, input and
# output, cached and uncached, to a caller who has presented nothing.
#
# **Every price is given twice, in two units, and one of them is a string.**
#
#   "price_per_m": 1500,
#   "price_per_m_decimal": "0.15"
#
# An integer beside a decimal string that is the same money in different units.
# 1500 is 0.15 at a scale of ten thousand, and nothing anywhere on the record
# says that: no currency, no exponent, no unit field. A client that reads the
# integer and formats it as cents is out by a factor of a hundred.
#
# **And it is given twice again.** `input_token_price_per_m` at the top level
# and `pricing.prompt.price_per_m` inside are the same number, as are
# `output_token_price_per_m` and `pricing.completion.price_per_m`. Four fields,
# two numbers, and nothing saying which pair a client should believe if they
# ever disagree.
#
# **`origin_price_per_m` sits beside `price_per_m`** -- a list price and a
# charged price -- so the record carries a discount structure with no discount
# in it and no field naming the difference.
#
# **Three OpenAI-compatibility fields carry nothing.** `permission` is null,
# and `root` and `parent` are the empty string, where OpenAI sets `root` to the
# model's own id. So the compatibility is in the key names rather than in the
# values, and a client written against OpenAI's shape reads `""` where it
# expects an identifier.
#
# **The envelope is not OpenAI's either.** `{"data": [...]}` with no `"object":
# "list"` beside it, on a path spelled `/v3/openai/models`.
#
# **A model is named three times.** `id` and `title` are the same string --
# `zai-org/glm-5.3-flash` -- and `display_name` is a third spelling of it,
# `GLM 5.3 Flash`. One of the three is the one to send back in a request and
# nothing on the record says which.
#
# **And `status` is an unnamed integer.** `1`, with no enum, no sibling string,
# and nothing in the response to compare it against.
#
# **An unrouted path is not JSON.** `404 page not found` in plain text -- Go's
# own `http.NotFound` string, the same one Pirsch answers, from an API whose
# successes are JSON.

recipe: novita
capability: ai
version: 0.1.0

upstream:
  api: v3
  docs: https://novita.ai/docs
  # No spec: Novita documents this API as prose. There is no OpenAPI document
  # at any address this Recipe could find, and the record shape below is the
  # live response, which needs no credential to fetch.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_cauldr0nn0v1taf1xturek3y
  # Nothing to declare for a rejected credential: this endpoint does not read
  # the header, so there is no state in which it refuses one.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    # The only failure this Recipe routes to is plain text, so nothing here
    # ever renders a JSON envelope.
    style: text

resources:
  model:
    id:
      # A namespaced path, which is also the title field verbatim.
      field: id
      style: opaque
      length: 20
    constants:
      object: model
      owned_by: novita
    fields:
      created:
        type: integer
      # The same string as the id.
      title:
        type: string
      # And a third spelling of the same thing.
      display_name:
        type: string
      description:
        type: string
      model_type:
        type: string
      context_size:
        type: integer
      max_output_tokens:
        type: integer
      # An integer with no enum and nothing to compare it against.
      status:
        type: integer
      is_tiered_billing:
        type: boolean
      # The same money as pricing.prompt.price_per_m, one level up.
      input_token_price_per_m:
        type: integer
      output_token_price_per_m:
        type: integer
      # An integer and a decimal string for the same money, in different
      # units, with no currency named anywhere.
      pricing:
        type: map
      tags:
        type: list
      features:
        type: list
      endpoints:
        type: list
      input_modalities:
        type: list
      output_modalities:
        type: list
      # OpenAI compatibility, carrying nothing: null and two empty strings.
      permission:
      root:
        type: string
      parent:
        type: string

routes:
  - method: GET
    path: /v3/openai/models
    resource: model
    operation: list
    # Struck live with no credential, a wrong one and a malformed one, all
    # answering the whole catalogue.
    public: true
    pagination:
      # None offered: the whole catalogue, every time.
      style: none

errors:
  unknown_route:
    status: 404
    # Go's http.NotFound string, in plain text, from an API whose successes
    # are JSON.
    style: text
    message: 404 page not found
    headers:
      Content-Type: text/plain; charset=utf-8

fixtures:
  empty:
    model: []

  catalogue:
    model:
      - id: zai-org/glm-5.3-flash
        created: 1787754787
        # Identical to the id.
        title: zai-org/glm-5.3-flash
        display_name: GLM 5.3 Flash
        description: A native multimodal model suited for efficient coding and long-horizon agent tasks.
        model_type: chat
        context_size: 1048576
        max_output_tokens: 131072
        status: 1
        is_tiered_billing: false
        input_token_price_per_m: 1500
        output_token_price_per_m: 5000
        pricing:
          prompt:
            # A list price and a charged price, equal.
            origin_price_per_m: 1500
            price_per_m: 1500
            # And the same money again, as a string, at a different scale.
            origin_price_per_m_decimal: "0.15"
            price_per_m_decimal: "0.15"
          completion:
            origin_price_per_m: 5000
            price_per_m: 5000
            origin_price_per_m_decimal: "0.5"
            price_per_m_decimal: "0.5"
          input_cache_read:
            origin_price_per_m: 300
            price_per_m: 300
            origin_price_per_m_decimal: "0.03"
            price_per_m_decimal: "0.03"
        tags: []
        features:
          - function-calling
          - structured-outputs
          - reasoning
          - serverless
        endpoints:
          - chat/completions
          - anthropic
          - responses
        input_modalities:
          - text
          - image
          - video
        output_modalities:
          - text
        permission: null
        root: ""
        parent: ""

conformance:
  - name: no credential at all is served the whole catalogue
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        'data[0].id': zai-org/glm-5.3-flash
        'data[0].object': model
        'data[0].owned_by': novita

  - name: a wrong credential is ignored rather than refused
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers:
        # The header is never read, so the endpoint people use to check their
        # setup cannot tell them their key is wrong.
        Authorization: "Bearer notarealtoken"
    expect:
      status: 200
      body:
        'data[0].id': zai-org/glm-5.3-flash

  - name: an unrouted path is not JSON
    source: https://api.novita.ai/v3/openai/cauldron-nope
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '\A404 page not found\s*\z'

  - name: the price is an integer and a string in different units
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # 1500 and "0.15" are the same money at a scale of ten thousand, and
        # no currency, exponent or unit field says so.
        'data[0].pricing.prompt.price_per_m': 1500
        'data[0].pricing.prompt.price_per_m_decimal': "0.15"
        'data[0].pricing.completion.price_per_m': 5000
        'data[0].pricing.completion.price_per_m_decimal': "0.5"

  - name: the same price is on the record twice over
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # Four fields, two numbers, and nothing saying which pair wins if they
        # ever disagree.
        'data[0].input_token_price_per_m': 1500
        'data[0].output_token_price_per_m': 5000
        # A list price beside a charged price, equal, with no field naming the
        # difference.
        'data[0].pricing.prompt.origin_price_per_m': 1500
        'data[0].pricing.input_cache_read.price_per_m': 300
        'data[0].is_tiered_billing': false

  - name: three compatibility fields carry nothing
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # OpenAI sets root to the model's own id. This is the empty string.
        'data[0].root': ""
        'data[0].parent': ""
        'data[0].permission': null

  - name: a model is named three times
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        # id and title are the same string and display_name is a third
        # spelling; nothing says which one goes back in a request.
        'data[0].title': zai-org/glm-5.3-flash
        'data[0].display_name': GLM 5.3 Flash
        # And an integer status with no enum anywhere.
        'data[0].status': 1
        'data[0].model_type': chat
        'data[0].created': 1787754787

  - name: the capabilities are three separate lists
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        'data[0].features[0]': function-calling
        'data[0].endpoints[0]': chat/completions
        # A second protocol's name, in a list of paths on this one.
        'data[0].endpoints[1]': anthropic
        'data[0].input_modalities[2]': video
        'data[0].output_modalities[0]': text
        'data[0].context_size': 1048576
        'data[0].max_output_tokens': 131072
        'data[0].tags': []
        'data[0].description': A native multimodal model suited for efficient coding and long-horizon agent tasks.

  - name: an empty catalogue still sends the envelope
    source: https://api.novita.ai/v3/openai/models
    verified: "2026-09-13"
    fixture: empty
    request:
      method: GET
      path: /v3/openai/models
      headers: {}
    expect:
      status: 200
      body:
        data: []
