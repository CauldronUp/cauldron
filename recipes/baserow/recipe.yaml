# Baserow Recipe for Cauldron
#
# A user-defined column has a user-defined name. Airtable's Recipe in this
# collection answers the question this group exists to ask by sending that
# name as the JSON key on every record -- rename the column and every
# integration reading record.fields.Name breaks the same afternoon. Baserow
# answers it differently by default and lets a caller choose: a row's
# columns arrive keyed by field_<id> -- an internal, immutable identifier
# assigned when the field was created -- unless the request adds
# ?user_field_names=true, in which case the same row answers keyed by the
# column's current display name instead. Both shapes are struck live below,
# against the same two rows, so the contrast is not asserted, it is shown:
# field_1 survives a rename and field_1's value does not change when the
# column is renamed to something else; the user_field_names response would.
# An integration written against the default is safe from a rename in a way
# an Airtable integration structurally cannot be. One written against
# ?user_field_names=true has opted back into Airtable's fragility, in
# writing, in its own request.
#
# The credential scheme carries a second finding, and it was checked rather
# than assumed. Baserow's own docs describe two: "Authorization: Token
# <key>" for a database token minted for API access, and a JWT obtained by
# logging in, sent as "Authorization: JWT <token>" -- the credential the web
# app itself uses. Both prefixes are live on the same header, today, checked
# below with three different values: no header at all, a database token
# that does not exist, and a JWT that does not decode. All three answer 401
# and all three answer a DIFFERENT sentence:
#
#   (nothing sent)                -> {"detail":"Authentication credentials
#                                      were not provided."}
#   Token junkjunkjunk            -> {"detail":"The provided token does not
#                                      exist.","error":"ERROR_TOKEN_DOES_NOT_EXIST"}
#   JWT junkjunkjunk               -> {"detail":"Access token is expired or
#                                      invalid.","error":"ERROR_INVALID_ACCESS_TOKEN"}
#
# The absent case carries no "error" key at all -- only the two wrong-value
# cases do, and they carry two different codes. A header with neither prefix
# -- a bare word, or "Bearer junk" -- was also struck live and collapses to
# the absent sentence, because neither scheme keyword was found and the
# check never gets past recognising which one was attempted. So this host
# genuinely answers three ways depending on the SHAPE of what was sent, the
# same three-tier split Turso's Recipe in this collection found for its own
# JWTs, and a real instance of the "two prefixes on one header" case this
# group was asked to verify rather than trust -- both are checked below,
# live, with the two live values quoted above.
#
# Routing and auth disagree about order in a way that itself depends on
# what "the route" means. A path Django's own URL patterns do not match at
# all -- /api/this-is-not-a-real-endpoint/ -- answers 404 before the
# credential is ever read, checked live with no header and again with a
# wrong one, byte-identical both times:
#
#   {"error": "URL_NOT_FOUND", "detail": "URL /api/this-is-not-a-real-endpoint/ not found."}
#
# But a path that DOES match a pattern -- /api/database/rows/table/999999999/,
# a syntactically fine, numerically real, table id that belongs to no base
# -- answers the ordinary 401 for a missing credential, not a 404, checked
# live the same two ways. And a method nothing registers on a real path --
# PUT, DELETE, OPTIONS on the rows endpoint, whose own Allow header reads
# "GET, POST, HEAD, OPTIONS" -- ALSO answers 401 rather than a 405, checked
# live with no credential. So the real order on this host is: does a URL
# PATTERN match at all (checked first, unconditionally) -- then the
# credential (checked next, before the method is ever consulted) -- then,
# only for a request that clears both, whether the specific id exists and
# whether the method is one this route actually takes. That is Rootly's own
# shape from elsewhere in this collection -- "credential first for every
# path it has, router first for every path it does not" -- reached
# independently by a Django app rather than a Rails one.
#
# Cauldron's auth check is one gate for the whole Recipe, checked entirely
# before routing or entirely after it, and Baserow's own order is a genuine
# third thing neither setting expresses: URL pattern first, then the
# credential, then everything else. Reproducing the "pattern matches but
# nothing about the specific id or method has been checked yet" moment
# would need the credential state to travel past a route match without
# actually gating the route, which nothing in this format does. So
# auth.scheme is none here and every route below carries its own
# matches_header pair -- the credential is checked once per declared route
# rather than once for the Recipe, which reproduces the id-numeric and
# wrong-method findings faithfully (the fixture credential and the two
# known-wrong ones are matched explicitly; anything else falls to the same
# catch-all the live host gives an absent one) and leaves the PUT/DELETE/
# OPTIONS-answer-401-not-405 finding stated here rather than encoded: a
# route declaring only "error: authentication_error" for PUT would also
# claim that a VALID credential gets refused there, which was never checked
# and is not this Recipe's place to guess.
#
# Pagination answers page and size, not Airtable's cursor-shaped offset --
# a genuine page number and a genuine page length, both echoed back
# unchanged. count is "the total amount of results," the provider's own
# words for the whole matching set, not the page in front of you. next and
# previous are both complete URLs to the neighbouring page, not opaque
# tokens -- next is modelled as this format's cursor field with cursor_url:
# absolute; previous has no second such field in this vocabulary to hold it
# and is left out, the same shape of gap FireHydrant's Recipe states for its
# own numbered prev/next pointers.
#
# One thing the provider's own OpenAPI description gets wrong about itself,
# found rather than assumed: DELETE /api/database/rows/table/{id}/{row_id}/
# lists only 400, 404 and 204 as possible responses -- no 401 anywhere in
# the published schema for that one operation, unlike every other row
# route. Checked live: an unauthenticated DELETE answers 401 exactly like
# the rest. The description is incomplete for this one method; the wire is
# not.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The PUT/DELETE/OPTIONS-vs-405 finding above is recorded in this header
#     with two live requests and not encoded as a route, for the reason
#     given there.
#   - order, the row's own fractional position field ("indicates the
#     position of the row, lowest first and highest last"), is real,
#     documented and not modelled: it is a computed decimal string with no
#     confirmed real value this project could cite, and every case here
#     that needs a position uses id instead.
#   - Filtering, sorting, search, field selection (include/exclude) and the
#     link-row lookup-join parameter are all real, documented query
#     parameters on the list route and none of them are modelled -- this
#     Recipe is about the field-naming and credential findings, not a full
#     port of the query language.
#   - Fields, views, tables, databases and workspaces -- the schema layer
#     that decides what field_<id> actually points to -- are not modelled.
#     A caller of this Recipe is assumed to already know a table's shape,
#     the same assumption Airtable's Recipe makes about a base.
#   - The `previous` pagination field is real, a full URL to the prior page,
#     and not modelled -- see above.
#
# Every case below not carrying a verified date was read from Baserow's own
# published OpenAPI description (api.baserow.io/api/schema.json, "Baserow
# API spec", info.version 2.3.3), not observed against a live table -- no
# account was ever created and no database token was ever issued to this
# project. The token below is a fixture and belongs to no workspace.

recipe: baserow
capability: database
version: 0.1.0

upstream:
  api: "2.3.3"
  docs: https://baserow.io/docs/apis%2Frest-api
  spec: https://api.baserow.io/api/schema.json
  spec_hash: 30bed4bc5f061711902d3a303ef388dbe4452456c8c8cae46a6e7b1c7331ecd7
  spec_seen: "2026-09-01"

auth:
  # Genuinely three-tiered on one header, and the tiers are not the three
  # Verdicts this struct names -- see the header for why every route below
  # carries its own matches_header pair instead of one Recipe-wide scheme.
  scheme: none

responses:
  list:
    style: wrapped
    count_field: count
    cursor_field: next
    cursor_url: absolute
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: error

resources:
  row:
    collection: results
    id:
      style: numeric
      type: number
    fields:
      # The partition lives in the path; Baserow never repeats it on a row.
      table_id:
        type: integer
        in: "-"
      # field_<id> by default. A rename in the Baserow UI changes what the
      # column is called and never touches this key.
      field_1:
        type: string
        required: true
      field_2:
        type: string
        default: Todo

  # The same conceptual rows, addressed the other way: ?user_field_names=true
  # asks Baserow to answer keyed by the column's own current name instead of
  # its immutable field_<id>. Two resources rather than one field-naming
  # option, because this format names a field's wire key once per resource,
  # and Baserow genuinely serves two different keys for the identical data
  # depending on a query parameter -- see the header.
  row_named:
    collection: results
    id:
      style: numeric
      type: number
    fields:
      table_id:
        type: integer
        in: "-"
      Name:
        type: string
        required: true
      Status:
        type: string
        default: Todo

routes:
  # List rows, both naming shapes, both live-verified credential failures,
  # and the generic catch-all -- five routes on one path, the same device
  # Turso's and Census's Recipes in this collection use for the same reason.
  # Order of declaration does not decide priority; a route naming more of
  # matches_header/matches_query always outranks one naming less.
  - method: GET
    path: /api/database/rows/table/{table_id}/
    resource: row_named
    operation: list
    scope: [table_id]
    matches_header:
      Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    matches_query:
      user_field_names: "true"
    pagination:
      style: page
      limit_param: size
      cursor_param: page

  - method: GET
    path: /api/database/rows/table/{table_id}/
    resource: row
    operation: list
    scope: [table_id]
    matches_header:
      Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    pagination:
      style: page
      limit_param: size
      cursor_param: page

  # The exact database-token value this Recipe sent live and got refused.
  - method: GET
    path: /api/database/rows/table/{table_id}/
    matches_header:
      Authorization: Token junkjunkjunk
    error: token_does_not_exist

  # The exact JWT-scheme value this Recipe sent live and got refused --
  # a third sentence, not the one above.
  - method: GET
    path: /api/database/rows/table/{table_id}/
    matches_header:
      Authorization: JWT junkjunkjunk
    error: invalid_access_token

  # Nothing sent, or a header matching neither known prefix -- the fallback
  # every live-tested case that is not one of the three above actually hits.
  - method: GET
    path: /api/database/rows/table/{table_id}/
    error: authentication_error

  - method: GET
    path: /api/database/rows/table/{table_id}/{id}/
    resource: row
    operation: get
    scope: [table_id]
    matches_header:
      Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000

  - method: GET
    path: /api/database/rows/table/{table_id}/{id}/
    error: authentication_error

  # Never 201, and echoes the full row back -- see the header. The request
  # body carries the same field_<id>/name duality the list route does; this
  # Recipe models only the default (field_<id>) shape for create, since the
  # naming question is already answered exhaustively by the list route.
  - method: POST
    path: /api/database/rows/table/{table_id}/
    resource: row
    operation: create
    scope: [table_id]
    status: 200
    matches_header:
      Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000

  - method: POST
    path: /api/database/rows/table/{table_id}/
    error: authentication_error

  # 204, no body, per Baserow's own description -- and per that same
  # description, the one row route with no 401 documented anywhere for it.
  # Checked live: it answers exactly like every other route. See the header.
  - method: DELETE
    path: /api/database/rows/table/{table_id}/{id}/
    resource: row
    operation: delete
    scope: [table_id]
    matches_header:
      Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000

  - method: DELETE
    path: /api/database/rows/table/{table_id}/{id}/
    error: authentication_error

errors:
  # No "error" key at all -- the one case among the three where the field is
  # genuinely absent rather than holding a different code. Live, both for a
  # request with no header and for one whose header matches neither known
  # prefix.
  authentication_error:
    status: 401
    message: Authentication credentials were not provided.
    code_field: "-"
    headers:
      www-authenticate: 'JWT realm="api"'

  # A database token, correctly prefixed, and not one Baserow holds. Live.
  token_does_not_exist:
    status: 401
    message: The provided token does not exist.
    code: ERROR_TOKEN_DOES_NOT_EXIST
    headers:
      www-authenticate: 'JWT realm="api"'

  # A JWT, correctly prefixed, that does not decode. Live -- a different
  # sentence and a different code from the one above, for the other scheme
  # this same header accepts.
  invalid_access_token:
    status: 401
    message: Access token is expired or invalid.
    code: ERROR_INVALID_ACCESS_TOKEN
    headers:
      www-authenticate: 'JWT realm="api"'

  # {detail} carries the exact request path, which is what Baserow's own
  # router echoes back. Live, for a path no URL pattern on this host
  # matches at all -- see the header for how this differs from an id that
  # merely does not exist.
  unknown_route:
    status: 404
    message: "URL {detail} not found."
    code: URL_NOT_FOUND

fixtures:
  empty: {}

  small-table:
    row:
      - id: 1
        table_id: 1
        field_1: Ship the conformance suite
        field_2: Done
      - id: 2
        table_id: 1
        field_1: Write the Baserow Recipe
        field_2: In progress

    row_named:
      - id: 1
        table_id: 1
        Name: Ship the conformance suite
        Status: Done
      - id: 2
        table_id: 1
        Name: Write the Baserow Recipe
        Status: In progress

conformance:
  - name: no credential is the generic sentence, with no error field at all
    source: https://api.baserow.io/api/database/rows/table/1/
    verified: "2026-09-01"
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
    expect:
      status: 401
      body:
        detail: Authentication credentials were not provided.
      absent:
        - error

  - name: a wrong database token names itself, with a code the absent case never carries
    source: https://api.baserow.io/api/database/rows/table/1/
    verified: "2026-09-01"
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      headers:
        Authorization: Token junkjunkjunk
    expect:
      status: 401
      body:
        detail: The provided token does not exist.
        error: ERROR_TOKEN_DOES_NOT_EXIST

  - name: a wrong JWT session token is a third, unrelated sentence
    source: https://api.baserow.io/api/database/rows/table/1/
    verified: "2026-09-01"
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      headers:
        Authorization: JWT junkjunkjunk
    expect:
      status: 401
      body:
        detail: Access token is expired or invalid.
        error: ERROR_INVALID_ACCESS_TOKEN

  - name: a header matching neither known prefix collapses back to the generic one
    source: https://api.baserow.io/api/database/rows/table/1/
    verified: "2026-09-01"
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      headers:
        Authorization: junkjunkjunk
    expect:
      status: 401
      body:
        detail: Authentication credentials were not provided.

  - name: a table id that is syntactically fine and belongs to nobody still hits the credential gate, not a lookup
    source: https://api.baserow.io/api/database/rows/table/999999999/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/database/rows/table/999999999/
    expect:
      status: 401
      body:
        detail: Authentication credentials were not provided.

  - name: and the same wrong-token sentence answers there too, not a different one
    source: https://api.baserow.io/api/database/rows/table/999999999/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/database/rows/table/999999999/
      headers:
        Authorization: Token junkjunkjunk
    expect:
      status: 401
      body:
        detail: The provided token does not exist.
        error: ERROR_TOKEN_DOES_NOT_EXIST

  - name: a path no pattern matches is refused before the credential is even read
    source: https://api.baserow.io/api/this-is-not-a-real-endpoint/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/this-is-not-a-real-endpoint/
    expect:
      status: 404
      body:
        error: URL_NOT_FOUND
        detail: URL /api/this-is-not-a-real-endpoint/ not found.

  - name: and the identical body answers even with a token attached
    source: https://api.baserow.io/api/this-is-not-a-real-endpoint/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/this-is-not-a-real-endpoint/
      headers:
        Authorization: Token junkjunkjunk
    expect:
      status: 404
      body:
        error: URL_NOT_FOUND
        detail: URL /api/this-is-not-a-real-endpoint/ not found.

  - name: by default a row's columns are keyed by field_<id>, which a rename never touches
    source: https://api.baserow.io/api/schema.json
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    expect:
      status: 200
      body:
        results[0].field_1: Ship the conformance suite
        results[0].field_2: Done
      absent:
        - results[0].Name
        - results[0].Status

  - name: asking for user_field_names answers the identical rows under the columns' own names instead
    source: https://api.baserow.io/api/schema.json
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      query:
        user_field_names: "true"
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    expect:
      status: 200
      body:
        results[0].Name: Ship the conformance suite
        results[0].Status: Done
      absent:
        - results[0].field_1
        - results[0].field_2

  - name: count is the whole matching set and next is a full URL, not a token
    source: https://api.baserow.io/api/schema.json
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/
      query:
        size: "1"
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    expect:
      status: 200
      body:
        count: 2
      matches:
        next: "^https?://"

  - name: a single row answers bare, the same shape a list entry does
    source: https://api.baserow.io/api/schema.json
    fixture: small-table
    request:
      method: GET
      path: /api/database/rows/table/1/1/
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    expect:
      status: 200
      body:
        field_1: Ship the conformance suite
        field_2: Done

  - name: a create answers 200, not 201, and echoes the row it made
    source: https://api.baserow.io/api/schema.json
    fixture: empty
    request:
      method: POST
      path: /api/database/rows/table/1/
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
      json:
        field_1: Added through the API
    expect:
      status: 200
      body:
        field_1: Added through the API
        field_2: Todo
      matches:
        id: "^[0-9]+$"

  - name: a delete is guarded too, live, though the published description never says so
    # DELETE is the one row route whose OpenAPI responses list 400, 404 and
    # 204 and never 401 -- see the header. Checked live anyway.
    source: https://api.baserow.io/api/database/rows/table/1/1/
    verified: "2026-09-01"
    fixture: small-table
    request:
      method: DELETE
      path: /api/database/rows/table/1/1/
    expect:
      status: 401
      body:
        detail: Authentication credentials were not provided.

  - name: a successful delete answers no body at all
    source: https://api.baserow.io/api/schema.json
    fixture: small-table
    request:
      method: DELETE
      path: /api/database/rows/table/1/1/
      headers:
        Authorization: Token cauldron-baserow-fixture-token-00000000000000000000000000000000
    expect:
      status: 204
      no_body: true

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if size was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "size is read, because a page of one out of two is not the whole collection"
    source: "https://api.baserow.io/api/schema.json"
    fixture: small-table
    request:
      method: GET
      path: "/api/database/rows/table/1/"
      query:
        "size": "1"
      headers:
        "Authorization": "Token cauldron-baserow-fixture-token-00000000000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].id": 1
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://api.baserow.io/api/schema.json"
    fixture: small-table
    request:
      method: GET
      path: "/api/database/rows/table/1/"
      query:
        "size": "1"
        "page": "2"
      headers:
        "Authorization": "Token cauldron-baserow-fixture-token-00000000000000000000000000000000"
    expect:
      status: 200
      body:
        "results[0].id": 2
      absent:
        - "results[1]"

