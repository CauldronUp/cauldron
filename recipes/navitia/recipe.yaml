# Navitia Recipe for Cauldron
#
# Second of a group with recipes/mbta/recipe.yaml, recipes/tfl/recipe.yaml
# and recipes/transitland/recipe.yaml. The first two never ask for a
# credential; Transitland asks and checks it before anything else runs, for
# every path, every time. Navitia is the third shape: it checks routing
# first for a path it plainly does not have, and then checks the credential
# for every path whose shape it recognises -- including one naming a
# coverage region that does not exist, which turns out to be the answer to
# this batch's fourth question.
#
# Every case below was struck live against api.navitia.io on 2026-09-03, with
# no account and no key. The key really is the HTTP Basic username with an
# empty password, per this batch's brief, and confirmed live: a non-empty
# password changes nothing about the refusal.
#
# **Three requests, three different sentences, and they line up onto this
# format's three verdicts with nothing left over.**
#
#   no Authorization header at all
#     -> 401 {"message":"no token. You can get one at http://www.navitia.io
#             or contact your support if you're using the opensource version
#             of Navitia https://github.com/hove-io/navitia"}
#   Authorization: Bearer junktoken12345          (not Basic at all)
#     -> 401 {"message":"Unauthorized, invalid token","status":401}
#   Authorization: Basic base64(junktoken12345:)  (Basic, wrong username)
#     -> 401 {"message":"Token absent in the database You can get one at
#             http://www.navitia.io or contact your support if you're using
#             the opensource version of Navitia https://github.com/hove-io/
#             navitia"}
#
# Absent, malformed and rejected, in that order, and each is a genuinely
# different sentence -- not a shared generic wording split three ways for
# effect. The middle one is also the shortest and the only one carrying its
# own "status" field inside the body, which nothing else on this host does;
# it reads like a different piece of code answering it, most likely
# Cauldron's own kind of finding: two programs behind one gateway, agreeing
# on the status line and nothing else. Cauldron's credential check reaches
# Malformed here for exactly the reason the engine defines it: Go's own
# http.Request.BasicAuth() refuses to parse a header that is not literally
# "Basic <base64>", so a Bearer-scheme value is present and unparseable
# rather than absent -- and the live host's own third sentence is what
# happens when that exact case is sent to it. All three were re-sent with a
# stray non-empty password to confirm it changes nothing: still "Token
# absent in the database," which is this batch's brief confirmed on the
# wire rather than assumed from it.
#
# **Routing beats the credential for a path with no shape at all, and loses
# to it for a path whose shape merely names something imaginary.** Checked
# live, all four combinations:
#
#   GET /v1/nosuchendpoint                (no such route at all)
#     -> 404 "The requested URL was not found on the server..." -- no
#        credential examined, confirmed by sending none.
#   PATCH or PUT or DELETE /v1/coverage    (a route Navitia has, wrong verb)
#     -> the identical 404 above -- byte for byte, no Allow header, and no
#        credential examined either, confirmed with and without one.
#   GET /v1/coverage                       (right verb, right shape)
#     -> 401, the absent-credential sentence.
#   GET /v1/coverage/totally-made-up-region/lines  (right verb, right shape,
#                                                    a region nobody issued)
#     -> 401, the identical absent-credential sentence -- not a 404, and not
#        a different message. The route pattern matches on shape alone; the
#        segment naming the region is never inspected before the credential
#        is.
#
# That is auth.after_routing exactly: a request is refused for its path
# before it is ever refused for its credential, but only once past that
# gate does "does this path's *shape* match anything" stop mattering and
# "is this a route Werkzeug actually finds" (a real verb on a real pattern)
# start being everything. A region that does not exist is indistinguishable,
# at 401, from `fr-idf` or `sandbox` -- both real, both documented at
# doc.navitia.io -- because nothing about *which* region was named is ever
# reached without a credential that gets past this gate first.
#
# **What a known region you hold no access to answers could not be
# established, and that gap is stated rather than guessed at.** doc.navitia.io
# publishes a fake example token, `3b036afe-0110-4202-b9ed-99718476c2e0`,
# explicitly scoped to `sandbox` coverage only and offered for public use in
# worked examples -- no signup involved, the provider's own words, so sending
# it once is using the documentation rather than acquiring a credential. Sent
# live against GET /v1/coverage: refused with the *rejected* sentence, "Token
# absent in the database" -- the token has been revoked or rotated since that
# page was written, which is itself informative (this Recipe cannot lean on
# a five-year-old published demo credential and get a live answer from it)
# but answers a different question from the one asked. What a token that
# authenticates but lacks a specific coverage's entitlement returns -- 403,
# a scoped 401, something else -- is not stated anywhere this Recipe could
# read and could not be produced without a real, currently-valid key. No
# auth.unentitled is declared here for that reason: the mechanism exists for
# a documented-or-observed refusal, and this one is neither.
#
# **Two routes answer with no credential examined at all, and both are real,
# small, and served verbatim.** GET / and GET /v1 are the HATEOAS root and
# version index respectively, confirmed live, 200, no Authorization header
# anywhere in the request:
#
#   GET /  -> {"versions":[{"value":"v1","description":"Current version of
#              navitia API","status":"current","links":[{"href":"https://api.
#              navitia.io/v1/","templated":false,"rel":"api","type":"api"}]}]}
#   GET /v1 -> a links array naming coverage, coord, journeys and places
#
# both under 600 bytes, both declared below with public: true and served
# byte for byte.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful coverage, region, line or journey response anywhere in
#     this file. Every route that needs a credential answers only the
#     refusal this Recipe actually reached -- see the header above for why
#     even the one public, no-signup demo token doc.navitia.io publishes
#     could not get past the gate.
#   - A wrong method on /v1/coverage is not modelled as a case, though it was
#     probed live and is described above: the real host answers the same 404
#     an unrouted path gets, with no Allow header. Cauldron would instead
#     synthesise a real 405 naming the one method this Recipe declares, once
#     the route exists -- the identical mechanism Hardcover's Recipe in this
#     collection states for the same reason. No case below claims the
#     synthesised shape matches the wire, because it does not.
#   - No upstream.spec. No OpenAPI or Swagger description was found at any
#     of the plausible paths tried (api.navitia.io/v1/swagger,
#     .../v1/openapi.json, doc.navitia.io/swagger.json); Navitia's own
#     reference is hand-written HTML at doc.navitia.io, the same gap
#     OpenSky's Recipe in this collection states for the same reason.

recipe: navitia
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://doc.navitia.io/

auth:
  scheme: basic
  credential: username
  keys:
    - cauldron-navitia-fixture-key-00000000-0000-0000-0000-000000000000
  absent_error: no_token
  malformed_error: unauthorized_invalid_token
  rejected_error: token_absent_in_database
  # A path with no matching shape 404s before the credential is examined; a
  # path whose shape matches -- including one naming a region that does not
  # exist -- reaches the credential gate first. See the header.
  after_routing: true

responses:
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

routes:
  # Genuinely public -- no credential examined either way, confirmed live.
  # Both bodies are small and served verbatim rather than modelled as
  # resources, the same choice this collection makes for a fixed HATEOAS
  # index (compare FireHydrant's /v1/noauth/ping).
  - method: GET
    path: /
    public: true
    raw:
      content_type: application/json
      text: '{"versions":[{"value":"v1","description":"Current version of navitia API","status":"current","links":[{"href":"https:\/\/api.navitia.io\/v1\/","templated":false,"rel":"api","type":"api"}]}]}'

  - method: GET
    path: /v1
    public: true
    raw:
      content_type: application/json
      text: '{"links":[{"href":"https:\/\/api.navitia.io\/v1\/coverage\/","templated":false,"rel":"coverage","type":"coverage","title":"Coverage of navitia"},{"href":"https:\/\/api.navitia.io\/v1\/coord\/0.0;0.0\/","templated":true,"rel":"coord","type":"coord","title":"Inverted geocoding for a given coordinate"},{"href":"https:\/\/api.navitia.io\/v1\/journeys","templated":false,"rel":"journeys","type":"journeys","title":"Compute journeys"},{"href":"https:\/\/api.navitia.io\/v1\/places","templated":false,"rel":"places","type":"places","title":"Autocomplete api"}]}'

  # Two routes this Recipe holds no credential to ever see succeed -- see the
  # header. Declared with a resource rather than an unconditional error so
  # the file does not claim a valid key gets refused too; no fixture, no
  # case reaches a 200, because none exists to cite honestly.
  - method: GET
    path: /v1/coverage
    resource: region
    operation: list

  - method: GET
    path: /v1/coverage/{region_key}/lines
    resource: region
    operation: list

errors:
  # The live host's own words for a path with no matching shape at all.
  # Overrides this runtime's own generic wording so the case below can
  # assert exactly what api.navitia.io answered rather than an
  # approximation of it.
  unknown_route:
    status: 404
    message: >-
      The requested URL was not found on the server. If you entered the URL
      manually please check your spelling and try again.


  no_token:
    status: 401
    headers:
      WWW-Authenticate: 'Basic realm="Token Required"'
    message: >-
      no token. You can get one at http://www.navitia.io or contact your
      support if you're using the opensource version of Navitia
      https://github.com/hove-io/navitia

  # The shortest of the three, and the only one carrying its own "status"
  # field -- see the header. What a Bearer-scheme (or any non-Basic) value
  # gets: present, and not the shape Basic auth can even parse.
  unauthorized_invalid_token:
    status: 401
    headers:
      WWW-Authenticate: 'Basic realm="Token Required"'
    fields:
      status: 401
    message: Unauthorized, invalid token

  # A Basic credential whose username is not one this Recipe holds. Not the
  # same sentence as no credential at all -- "Token absent in the database,"
  # not "no token" -- confirmed live and with a non-empty password, which
  # changes nothing.
  token_absent_in_database:
    status: 401
    headers:
      WWW-Authenticate: 'Basic realm="Token Required"'
    message: >-
      Token absent in the database You can get one at http://www.navitia.io
      or contact your support if you're using the opensource version of
      Navitia https://github.com/hove-io/navitia

resources:
  # Field names and descriptions read from doc.navitia.io's own coverage
  # reference (https://doc.navitia.io/#coverage) on 2026-09-03 -- no worked
  # JSON example exists there to build a fixture from, so every field below
  # is declared and none is ever filled in. See the header's fidelity gaps.
  region:
    id:
      # "Identifier of the coverage" -- e.g. "sandbox" or "fr-idf" per
      # doc.navitia.io's own worked examples elsewhere on the same page.
      style: opaque
      field: id
    fields:
      # "Name of the coverage."
      name:
        type: string
        null_when_unset: true
      # Operating state of the region -- the reference names the field and
      # not an enum, so it is typed as the free string the page itself
      # leaves it as.
      status:
        type: string
        null_when_unset: true
      # "Beginning of the production period. We only have data on this
      # production period."
      start_production_date:
        type: datetime
        null_when_unset: true
      # "End of the production period. We only have data on this production
      # period."
      end_production_date:
        type: datetime
        null_when_unset: true

fixtures:
  empty: {}

conformance:
  - name: no credential at all names one document
    source: https://api.navitia.io/v1/coverage
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/coverage
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Basic realm="Token Required"'
      body:
        message: >-
          no token. You can get one at http://www.navitia.io or contact your
          support if you're using the opensource version of Navitia
          https://github.com/hove-io/navitia

  - name: a header present and not even Basic-shaped is refused the shortest way
    source: https://api.navitia.io/v1/coverage
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/coverage
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        message: Unauthorized, invalid token
        status: 401

  - name: a Basic credential nobody issued names a different document
    source: https://api.navitia.io/v1/coverage
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/coverage
      headers:
        Authorization: Basic anVua3Rva2VuMTIzNDU6
    expect:
      status: 401
      body:
        message: >-
          Token absent in the database You can get one at
          http://www.navitia.io or contact your support if you're using the
          opensource version of Navitia https://github.com/hove-io/navitia

  - name: a path with no matching shape 404s before the credential is looked at
    source: https://api.navitia.io/v1/nosuchendpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchendpoint
    expect:
      status: 404
      body:
        message: >-
          The requested URL was not found on the server. If you entered the
          URL manually please check your spelling and try again.

  - name: a region nobody issued is refused for its credential, not its shape
    # The fourth verdict this batch's brief asks for: an unknown coverage
    # region answers the identical 401 a real one does, because the region
    # segment is never inspected before the credential gate -- see the
    # header for what a *known* region with no entitlement could not
    # establish.
    source: https://api.navitia.io/v1/coverage/totally-made-up-region-cauldron/lines
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/coverage/totally-made-up-region-cauldron/lines
    expect:
      status: 401
      body:
        message: >-
          no token. You can get one at http://www.navitia.io or contact your
          support if you're using the opensource version of Navitia
          https://github.com/hove-io/navitia

  - name: the root index answers with no credential examined at all
    source: https://api.navitia.io/
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        "versions[0].value": v1
        "versions[0].status": current
        "versions[0].links[0].rel": api

  - name: and so does the version index one level in
    source: https://api.navitia.io/v1
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1
    expect:
      status: 200
      body:
        "links[0].rel": coverage
        "links[2].rel": journeys
        "links[3].rel": places
