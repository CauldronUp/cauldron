# Every case below carries source. A verified date means this Recipe called
# gateway.remote.com with exactly the request shown and recorded exactly
# what came back; its absence means the case was read from Remote's own
# published OpenAPI description and never called -- no Customer API token
# was ever minted.
conformance:
  - name: no credential at all answers the documented Forbidden shape
    source: https://gateway.remote.com/v1/employments
    verified: "2026-09-01"
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments
    expect:
      status: 403
      body:
        message: Forbidden
      absent:
        - error
        - code

  - name: a well-formed but wrong bearer token gets the identical body
    # Same request, same response, byte for byte -- see the header. Absent
    # and rejected are two different verdicts by Cauldron's own reckoning
    # and one sentence by Remote's, which is why neither absent_error nor
    # rejected_error is named above.
    source: https://gateway.remote.com/v1/employments
    verified: "2026-09-01"
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 403
      body:
        message: Forbidden

  - name: an id-shaped path still reaches the credential gate before the id is examined
    source: https://gateway.remote.com/v1/employments/not-a-real-id-123
    verified: "2026-09-01"
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments/not-a-real-id-123
    expect:
      status: 403
      body:
        message: Forbidden

  - name: an unrouted path is a bare JSON string, not an object, with no credential examined
    # after_routing carries this: no Authorization header was sent, and the
    # 404 arrived anyway. See the header for the exact bytes and for why
    # this is declared identically to the wrong-method case below.
    source: https://gateway.remote.com/v1/nonexistent-route-xyz
    verified: "2026-09-01"
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/nonexistent-route-xyz
    expect:
      status: 404
      body_matches: "^\"Not Found\""

  - name: a wrong method on a real path is the same 404, never a real 405
    # PATCH is not a method /v1/countries takes. No credential sent. See the
    # header: this collection has other providers with no 405 anywhere
    # (turso/recipe.yaml); this is Remote's own version of that finding,
    # confirmed live rather than inferred.
    source: https://gateway.remote.com/v1/countries
    verified: "2026-09-01"
    fixture: sandbox-company
    request:
      method: PATCH
      path: /v1/countries
    expect:
      status: 404
      body_matches: "^\"Not Found\""

  - name: a listing carries both fields the batch was asked about, on the same record
    # type and employment_model, Remote's own worked example, quoted
    # verbatim in the header. Neither is derivable from the other.
    source: https://developer.remote.com/reference/get_v1_employments
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments
      headers:
        Authorization: Bearer ra_test_cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "data.employments[0].type": employee
        "data.employments[0].employment_model": eor
        "data.employments[0].full_name": Jane Smith
        "data.total_count": 1
        "data.current_page": 1

  - name: the pagination envelope nests the array beside the page counters, not beside them at the top level
    source: https://developer.remote.com/reference/get_v1_employments
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments
      headers:
        Authorization: Bearer ra_test_cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "data.total_pages": 1
      absent:
        - employments
        - total_count
        - pagination

  - name: the show endpoint answers the fuller record, wrapped one level deeper than the list
    source: https://developer.remote.com/reference/get_v1_employments_employment_id
    fixture: sandbox-company
    request:
      method: GET
      path: /v1/employments/20a72f86-employment-id-9e4942a902ff
      headers:
        Authorization: Bearer ra_test_cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "data.employment.type": employee
        "data.employment.employment_model": eor
        "data.employment.manager": John Doe
        "data.employment.onboarding_tasks.contract_details.status": completed
      absent:
