# Remote.com Recipe for Cauldron
#
# Remote is the one provider in this batch's group with a genuinely public
# API and documentation, and it answers this batch's question about itself
# in its own schema, in two fields on the same record rather than one.
#
# Every employment -- the record for one person a company engages through
# Remote -- carries both `type` and `employment_model`, and neither is
# derivable from the other. Quoted verbatim from the OpenAPI description
# embedded in developer.remote.com's own List Employments reference page:
#
#   "type": {
#     "description": "The type of employment.",
#     "enum": ["employee", "contractor", "direct_employee",
#               "global_payroll_employee"],
#     "type": "string"
#   },
#   "employment_model": {
#     "description": "The employment model. `eor` (Employer of Record),
#       `peo` (Professional Employer Organization), or `global_payroll`.",
#     "enum": ["eor", "peo", "global_payroll"],
#     "nullable": true,
#     "type": "string"
#   }
#
# Both are in MinimalEmployment's own `required` list. `type` answers who
# the person is to the company -- an employee, a contractor, or someone the
# company already employs directly and only uses Remote for global payroll
# or HRIS record-keeping (`direct_employee`, `global_payroll_employee`).
# `employment_model` answers which of Remote's own products is engaged --
# eor, peo, or global_payroll -- and a query parameter on this very listing
# names the same three values for filtering. An integration reconciling
# headcount against a payroll run reads both: `type` says whether Remote is
# the legal employer of record for this person at all, and
# `employment_model` says which of Remote's mechanisms makes that true. A
# client that reads only one has half the answer -- `type: employee` alone
# does not say eor from peo, and `employment_model: eor` alone does not
# distinguish an employee from a contractor engaged under the same country
# operation.
#
# The bulk/detail Employment schema (documenter.remote.com's Bulk List
# Employments and Show Employment pages, same schema, same worked example)
# adds a third, narrower signal for one of the four `type` values:
#
#   "contractor_settings": {
#     "description": "Contractor-specific settings. Only present for
#       contractor employments.",
#     "nullable": true,
#     "properties": {"requires_work_confirmation": {"type": "boolean"}},
#     "type": "object"
#   },
#   "contractor_type": {
#     "description": "Type of contractor product. Only present for
#       contractor employments. 'standard' for Contractor Standard, 'cor'
#       for Contractor of Record, 'plus' for Contractor Plus.",
#     "enum": ["standard", "cor", "plus"],
#     "nullable": true
#   }
#
# Neither field is declared on the resources below and neither is fixtured.
# See the fidelity gaps: this is the schema's own words, not a value this
# Recipe invented, and no worked JSON response anywhere in Remote's
# documentation shows a populated `contractor_settings` or `contractor_type`
# -- every reference to a contractor employment in Remote's own materials is
# a request body (creating one) or prose describing the response, never a
# rendered one. Declaring the field is describing the schema; putting a
# value in a fixture would be asserting a response nobody has shown.
#
# Remote's own two documentation surfaces disagree about what a customer's
# already-existing, non-EOR employee is called. The OpenAPI `type` enum
# above has no `hris` value at all -- only `direct_employee`. Remote's own
# "Creating Employees with Remote API" guide, four sections later, creates
# exactly this kind of employee with `"type": "hris"` in the POST body, and
# a separate section title calls it "4C. HRIS Employee (`type: "hris"`)"
# outright. One page's schema and another page's worked walkthrough name
# the same product with two different literal values, on the same
# documentation site, current as of the dates recorded on each page. This
# Recipe does not referee which is authoritative; it declares the schema's
# `direct_employee`, because that is the value the OpenAPI `type` enum on
# the resources actually returned by GET carries, and records the
# contradiction here rather than picking a side silently.
#
# Two more things were checked directly against gateway.remote.com, with no
# account, no OAuth client and no Customer API token ever created --
# production and the sandbox host answer identically on every case below:
#
# **Every credential failure inside the Bearer scheme collapses to one
# sentence, and it is the sentence Remote's own schema already names.** No
# Authorization header, "Authorization: Bearer " with nothing after it,
# "Authorization: junktoken12345" with no scheme word at all, and
# "Authorization: Bearer junktoken12345" -- four different ways to fail --
# all answered the identical body, byte for byte:
#
#   HTTP/1.1 403 Forbidden
#   {"message":"Forbidden"}
#
# which is not a guess at the shape: it is ForbiddenResponse's own
# documented `example` on the same OpenAPI page this Recipe reads
# MinimalEmployment from, word for word --
#
#   "ForbiddenResponse": {"example": {"message": "Forbidden"},
#     "properties": {"message": {"pattern": "Forbidden", "type": "string"}}}
#
# -- even though that schema's own description says the code is for
# insufficient OAuth2 scope on an otherwise-valid token, not for a missing
# or garbage one. Absent, empty-after-prefix, unprefixed and well-formed-
# but-wrong are four different verdicts by Cauldron's own reckoning and one
# sentence by Remote's, so every one of them is left to fall through to
# authentication_error below rather than naming absent_error, malformed_error
# or rejected_error separately -- naming none of them is the honest claim
# here, not an oversight.
#
# **A different HTTP auth scheme entirely is not folded into that sentence.**
# "Authorization: Basic amFuazpqdW5r" -- valid base64, garbage credentials --
# answered 401 Unauthorized, {"message":"Unauthorized"}, not the 403 every
# Bearer-shaped failure above got. Cauldron's own credential check classifies
# any header lacking the declared "Bearer " prefix as Malformed, which does
# not distinguish "somebody typed the token with no scheme word" from
# "somebody sent an entirely different, well-formed HTTP auth scheme" -- and
# live, Remote does distinguish them, onto two different status codes and
# two different bodies. malformed_error can only name one errors entry, and
# the unprefixed-bare-token case is both the likelier caller mistake and the
# one that keeps every other Bearer-failure case consistent, so that is the
# one left to the default. The Basic-scheme 401 is recorded here, verified
# live, and not asserted by any case below: asserting it would mean
# declaring malformed_error away from the sentence every other malformed
# Bearer request actually gets.
#
# **Routing and method are both resolved before the credential is examined,
# and there is no real 405 anywhere.** GET /v1/employments and
# GET /v1/countries -- both real, both requiring a body -- answered 403 with
# no credential at all, matching the ForbiddenResponse case above. A path
# this host does not route, /v1/nonexistent-route-xyz, answered 404 with a
# bare JSON string body, "Not Found" -- not an object, no message field to
# read -- with no credential of any kind sent. PATCH /v1/countries and
# DELETE /v1/employments, methods neither route takes, answered the
# identical 404 "Not Found", also with no credential sent. So a caller
# cannot tell a typo'd path from a wrong method from a route that
# genuinely does not exist: all three are one shape, and none of them is a
# 405. auth.after_routing carries this, the same declaration Fireworks'
# Recipe in this collection uses for the same reason, and both of
# unknown_route and method_not_allowed below are declared identically on
# purpose, to make the "no real 405" finding a positive claim rather than an
# omission.
#
# A path naming a record that does not exist, GET /v1/employments/{junk-id}
# with no credential, still answered the same 403 Forbidden -- so an
# id-shaped path segment is resolved as far as "this route exists" before
# the credential is ever examined, and whether the id itself is real is not
# reachable without one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Every 200 response below is read from Remote's own worked examples --
#     the List and Show pages' MinimalEmployment/Employment examples, and
#     the Create page's EmploymentCreationResponse schema example -- and
#     none carries a verified date, because no Customer API token was ever
#     minted to call them. Only the failure cases (403, 401 read but not
#     asserted, 404 twice) were struck live.
#   - POST /v1/employments (create) is deliberately not routed, and it is
#     the sharpest thing this Recipe found that it could not model. Its own
#     response schema, EmploymentCreationResponse, has a worked example
#     quite unlike either resource below -- id 663e0b79-c893-45ff-a1b2-
#     f6dcabc098b5, wrapped the same "data.employment" way, but only nine
#     fields deep and, tellingly, with no employment_model at all: the field
#     this Recipe exists to highlight is not even echoed back on the write
#     that sets it. The walkthrough guide's own worked create example (a
#     different request, a different response: id 41381c22-0a0f-4190-ba95-
#     39aa055968f2, full_name, job_title, active_contract_id) is different
#     again, and neither response is a subset of the other or of
#     MinimalEmployment or Employment below. Reproducing either faithfully
#     would mean either fabricating the matching request for the schema's
#     response (no request is shown beside it) or pinning constants on the
#     route that stand in for values Remote's real API visibly computes
#     from the request body -- job_title and full_name are not sent in the
#     walkthrough's request at all, so Cauldron's create mechanism, which
#     stores what a request actually contains, cannot derive them. Both
#     paths assert something this Recipe did not observe, so create is
#     described here instead of routed. It is a third, still different
#     projection of "an employment" and it is the one fact about it worth
#     keeping.
#   - contractor_settings and contractor_type are declared in this header
#     and nowhere else -- see above.
#   - Only List and Show are routed. Create (see above), Update (two PATCH
#     operations per the documentation index), the bulk cursor-paginated
#     listing, the contractor-subscription and contractor-invoice
#     endpoints, benefits, countries, and every OAuth/partner-authorization
#     flow are entirely unmodelled. This Recipe is scoped to the question
#     the batch asked.
#   - Pagination on the list route mirrors the documented shape
#     (current_page, total_count, total_pages, all nested under one `data`
#     key beside the array) but was never exercised past a single page: the
#     fixture holds one record.
#   - The root path (GET / with no version prefix) answered a 404 with an
#     HTML body rather than the JSON "Not Found" every /v1/ path answers --
#     a CloudFront default error page rather than anything Remote's own
#     application produced -- and is not modelled, because it is a fact
#     about the edge in front of the API rather than about the API.
#
# Keys below are fixtures, not secrets, and belong to no account. No
# upstream.spec is recorded: Remote's own OpenAPI description is embedded
# per-reference-page (a different fragment on the List, Show and Create
# pages) rather than served as one fetchable document at a stable URL, the
# same gap firehydrant/recipe.yaml and fireworks/recipe.yaml state for the
# same reason.

recipe: remotecom
capability: hr
version: 0.1.0

upstream:
  api: v1
  provider: remotecom
  docs: https://developer.remote.com/reference/welcome-to-remote-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - ra_test_cauldron0000000000000000000000
  # Every Bearer-shaped failure -- absent, empty after the prefix, no scheme
  # word at all, or well-formed and simply wrong -- answers the identical
  # ForbiddenResponse body live. Naming none of absent_error, malformed_error
  # or rejected_error is the claim that Remote does not tell them apart, not
  # an unfinished Recipe. See the header for the one live exception (a
  # different HTTP auth scheme, "Basic", answering 401 instead) that this
  # single-valued mechanism cannot also carry.
  #
  # Routing and method both resolve before this check runs, and neither
  # unrouted path nor wrong method ever reaches it -- see the header and
  # errors.unknown_route / errors.method_not_allowed below.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: data.total_count
    page_field: data.current_page
    pages_field: data.total_pages
  resource:
    style: wrapped
    key: data.employment
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  # GET /v1/employments. The lightweight projection -- MinimalEmployment in
  # Remote's own schema -- and the one that carries both fields this Recipe
  # exists to record. Field names, order and every value below are Remote's
  # own worked example on the List Employments reference page, quoted
  # verbatim.
  employment_summary:
    collection: data.employments
    id:
      style: opaque
    fields:
      country:
        type: map
      department:
        type: string
        null_when_unset: true
      department_id:
        type: string
        null_when_unset: true
      employment_lifecycle_stage:
        type: string
      # eor, peo or global_payroll -- which of Remote's own products
      # engages this person. See the header: this is one of the two fields
      # the whole batch's question turns on, and it is not derivable from
      # `type` below.
      employment_model:
        type: string
      external_id:
        type: string
        null_when_unset: true
      full_name:
        type: string
      job_title:
        type: string
      login_email:
        type: string
      partner_external_id:
        type: string
        null_when_unset: true
      personal_email:
        type: string
      short_id:
        type: string
      status:
        type: string
      # employee, contractor, direct_employee or global_payroll_employee.
      # See the header: the other of the two fields, and the one that says
      # whether this is Remote's own hire on the company's behalf
      # (employee, under whichever employment_model) or someone the company
      # already employs and merely records or pays through Remote
      # (direct_employee, global_payroll_employee) or engages without an
      # employment relationship at all (contractor).
      type:
        type: string
      work_address_details:
        type: map
      work_email:
        type: string
        null_when_unset: true

  # GET /v1/employments/{id}. The full record -- Employment in Remote's own
  # schema, the same shape Bulk List Employments answers with a cursor
  # instead of an id. Every value below is Remote's own worked example on
  # the Show Employment reference page, quoted verbatim; the same example
  # (word for word) is embedded again on the Bulk List page.
  employment:
    id:
      style: opaque
    fields:
      full_name:
        type: string
      manager_email:
        type: string
        null_when_unset: true
      manager:
        type: string
        null_when_unset: true
      manager_employment_id:
        type: string
        null_when_unset: true
      provisional_start_date:
        type: string
        null_when_unset: true
      job_title:
        type: string
      type:
        type: string
      status:
        type: string
      user_status:
        type: string
      employment_lifecycle_stage:
        type: string
      employment_model:
        type: string
      company_id:
        type: string
      bill_to_legal_entity_id:
        type: string
        null_when_unset: true
      engaged_by_legal_entity_id:
        type: string
        null_when_unset: true
      work_email:
        type: string
        null_when_unset: true
      login_email:
        type: string
      personal_email:
        type: string
      country:
        type: map
      address_details:
        type: map
      work_address_details:
        type: map
      billing_address_details:
        type: map
      basic_information:
        type: map
      administrative_details:
        type: map
      contract_details:
        type: map
      emergency_contact_details:
        type: map
      bank_account_details:
        type: list
      pricing_plan_details:
        type: map
      onboarding_tasks:
        type: map
      files:
        type: list
      eligible_for_onboarding_cancellation:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime
        null_when_unset: true

routes:
  - method: GET
    path: /v1/employments
    resource: employment_summary
    operation: list
    # Remote's own documented query parameters, from the same reference page
    # the fields above come from -- page defaults to 1, page_size defaults to
    # 20 and caps at 100. Not exercised past one page; the fixture holds one
    # record.
    pagination:
      style: page
      limit: 20
      max_limit: 100
      limit_param: page_size
      cursor_param: page
      first_page: 1

  - method: GET
    path: /v1/employments/{id}
    resource: employment
    operation: get

errors:
  # ForbiddenResponse, quoted verbatim in the header. What every Bearer-scheme
  # credential failure answers live, regardless of which of Cauldron's three
  # verdicts produced it -- see auth above. Shape comes from the Recipe-wide
  # responses.error envelope declared above (flat, message field only).
  authentication_error:
    status: 403
    message: "Forbidden"

  # A bare JSON string, not an object -- struck live with no credential sent
  # at all, on a path this host does not route. Declared identically to
  # method_not_allowed below on purpose: see the header's "no real 405"
  # finding.
  unknown_route:
    status: 404
    style: string
    message: "Not Found"

  # The identical body a genuinely unrouted path gets -- struck live, also
  # with no credential sent, against a real path and a method it does not
  # take. Remote never answers a real 405 for this; see the header.
  method_not_allowed:
    status: 404
    style: string
    message: "Not Found"

fixtures:
  empty: {}

  sandbox-company:
    employment_summary:
      - id: add736b8-employment-id-a76ccae2abe8
        country:
          alpha_2_code: PT
          code: PRT
          contractor_products_available: ["standard", "plus", "cor"]
          country_subdivisions:
            - code: PT-06
              name: Coimbra
