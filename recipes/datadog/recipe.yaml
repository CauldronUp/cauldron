# Datadog Recipe for Cauldron
#
# Datadog bills by host, by custom metric and by ingested log. A test suite
# that submits metrics creates custom metrics, and custom metrics are charged
# whether a human ever looks at them. A monitor created by a test can page
# somebody. There is no sandbox organisation, so the usual approach is to point
# tests at production with a naming convention and hope nobody deletes the
# wrong monitor.
#
# Two things worth modelling exactly:
#
#   1. Failures are an array of bare strings, not an array of objects. A
#      client looping over the entries and reading .message from each finds
#      undefined on every one, which throws rather than reporting anything.
#      Almost every other provider sends objects, so this is the mistake that
#      gets made by analogy.
#   2. Credentials are two headers and neither is Authorization. An API key
#      alone is enough to write, but reading needs an application key too, so
#      a token that submits metrics happily can still fail every query.
#
# Keys below are fixtures, not secrets.

recipe: datadog
capability: observability
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.datadoghq.com/api/latest

auth:
  scheme: header
  header: DD-API-KEY
  keys:
    - cauldron-api-key

# Writing needs only the API key. Reading needs the application key as well,
# which is why a suite that submits fine can still fail every query.
required_headers:
  DD-APPLICATION-KEY: authentication_error

responses:
  list:
    style: wrapped
    fields:
      status: ok
  error:
    style: string_list
    key: errors

resources:
  monitor:
    collection: monitors
    id:
      # A JSON number, and minted as one. Datadog's monitor ids are integers
      # everywhere -- in a monitor, in the deleted_monitor_id a delete answers
      # with, in the example its own description carries -- and this sent them
      # as strings, so a client comparing monitor.id to a number never
      # matched.
      #
      # digits with a number type: the style mints eight figures, which a
      # double holds exactly, and the type says what goes on the wire. The
      # rule against pairing them is about length -- an identifier longer
      # than a double can hold must stay a string -- and eight is well
      # inside that.
      style: digits
      length: 8
      type: number
    fields:
      name:
        type: string
        required: true
      type:
        type: string
        default: metric alert
      query:
        type: string
        required: true
      message:
        type: string
      # Datadog's real states. A monitor in "No Data" is not alerting and not
      # healthy either, and code that treats anything other than Alert as
      # fine reports a broken check as passing.
      overall_state:
        type: string
        default: OK
      priority:
        type: integer
        default: 3
      # There is no muted field. Datadog expresses muting as options.silenced,
      # a map of scope to the time the silence ends, so "is this monitor
      # muted" is a question about whether that map has an entry -- and a
      # monitor can be silenced for one host and live for the rest, which a
      # boolean cannot say at all.
      #
      # The distinction people lose is still the important one: a silenced
      # monitor evaluates and reports its state exactly as before. It only
      # stops notifying.
      # An integer rather than a timestamp, because a timestamp is stamped
      # onto every record that does not set one and a new monitor is not
      # silenced. Datadog sends Unix seconds here, and a monitor with no
      # silence has no entry at all.
      silenced_until:
        type: integer
        in: options.silenced
        as: "*"
      created:
        type: datetime
      modified:
        type: datetime

  dashboard:
    collection: dashboards
    id:
      style: opaque
      length: 11
    fields:
      title:
        type: string
        required: true
      description:
        type: string
      layout_type:
        type: string
        default: ordered
      is_read_only:
        type: boolean
        default: false
      author_handle:
        type: string
      created_at:
        type: datetime

  event:
    collection: events
    id:
      style: digits
      length: 16
    fields:
      title:
        type: string
        required: true
      text:
        type: string
      priority:
        type: string
        default: normal
      alert_type:
        type: string
        default: info
      source_type_name:
        type: string
      date_happened:
        type: timestamp

routes:
  - method: GET
    path: /api/v1/monitor
    resource: monitor
    operation: list
    pagination:
      # Checked against Datadog's own OpenAPI description. Three endpoints in
      # this API page three different ways, which is the argument against
      # reading one and assuming the rest.
      #
      # Monitors: page_size for the size, page for the position. The spec
      # does not say which number the first page is here, but the events
      # endpoint in the same API states that nought is, so that is what is
      # declared -- inference from the vendor's own words rather than from a
      # convention, and named as inference.
      #
      # Stated gap: Datadog returns every monitor unpaginated when page is
      # absent, and only applies page_size once page is given. Cauldron pages
      # always, so a caller who omits both gets a page here and everything
      # there.
      style: page
      limit: 100
      limit_param: page_size
      cursor_param: page
      first_page: 0

  - method: POST
    path: /api/v1/monitor
    resource: monitor
    operation: create

  - method: GET
    path: /api/v1/monitor/{id}
    resource: monitor
    operation: get

  - method: PUT
    path: /api/v1/monitor/{id}
    resource: monitor
    operation: update

  # 200 with {"deleted_monitor_id": 12345}, which is neither a 204 nor the
  # monitor. The key is Datadog's own: code reading response.id after a
  # delete finds nothing, and code reading deleted_monitor_id found nothing
  # here until the key could be said.
  - method: DELETE
    path: /api/v1/monitor/{id}
    resource: monitor
    operation: delete
    status: 200
    deleted_body: id
    deleted_key: deleted_monitor_id

  - method: GET
    path: /api/v1/dashboard
    resource: dashboard
    operation: list
    pagination:
      # Dashboards: count for the size and start for the position, and start
      # really is an offset -- "the specific offset to use as the beginning
      # of the returned response". The same word means a POSIX timestamp on
      # the events endpoint below, which is the trap in reading one
      # provider's parameters as one vocabulary.
      style: offset
      limit: 100
      limit_param: count
      cursor_param: start

  - method: GET
    path: /api/v1/dashboard/{id}
    resource: dashboard
    operation: get

  - method: GET
    path: /api/v1/events
    resource: event
    operation: list
    pagination:
      # Events: page counts from nought, stated in the description, and there
      # is no page-size parameter at all -- the size is fixed at a thousand.
      # start here is a POSIX timestamp bounding the time range, not a
      # position, so declaring it as the cursor would page by reading a clock.
      #
      # limit_param is "-": Datadog accepts no name for the page size on this
      # endpoint, and honouring an invented one would let code that sends it
      # work locally and be ignored in production.
      style: page
      limit: 1000
      limit_param: "-"
      cursor_param: page
      first_page: 0

  # Datadog wraps a created event under "event" and puts a status beside it,
  # and wraps nothing around a created monitor. Code reading created.title
  # needs created.event.title here, which is one level out from every other
  # create in this Recipe -- and that is the point: the wrapping is per
  # endpoint, not per API.
  - method: POST
    path: /api/v1/events
    resource: event
    operation: create
    envelope:
      style: wrapped
      key: event
    fields:
      status: ok

webhooks:
  events:
    - monitor.triggered
    - monitor.recovered
    - monitor.no_data
    - monitor.warning
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    message: Rate limit of 1000 requests per hour exceeded
    headers:
      Retry-After: "60"
      X-RateLimit-Remaining: "0"

  authentication_error:
    status: 403
    message: Forbidden. The API key or application key is missing or invalid.

  resource_missing:
    status: 404
    message: "Monitor not found: {detail}"

  parameter_missing:
    status: 400
    message: "Invalid argument: {detail} is required"

  # Datadog refuses to delete a monitor that a composite or SLO depends on,
  # which is the failure a cleanup step hits at the end of a test run.
  monitor_in_use:
    status: 400
    message: Monitor cannot be deleted because it is referenced in a composite monitor

  # The billing wall. Nothing about the request is wrong.
  quota_exceeded:
    status: 403
    message: The organization has reached its custom metric limit

fixtures:
  empty: {}

  small-org:
    monitor:
      - id: "10000001"
        name: Checkout p99 latency
        type: metric alert
        query: "avg(last_5m):p99:trace.http.request{service:checkout} > 2"
        overall_state: Alert
        priority: 1
      - id: "10000002"
        name: Queue depth
        type: metric alert
        query: "avg(last_10m):sum:queue.depth{*} > 1000"
        # Not alerting, not healthy. Code that treats anything other than
        # Alert as fine reports a broken check as passing.
        overall_state: "No Data"
        priority: 2
      - id: "10000003"
        name: Nightly batch duration
        type: metric alert
        query: "avg(last_1h):avg:batch.duration{*} > 3600"
        overall_state: OK
        # Silenced across every scope until a fixed time. It still evaluates
        # and still reports state; it only stops notifying.
        silenced_until: 1767312000
    dashboard:
      - id: abc-def-ghi
        title: Checkout health
        layout_type: ordered
        author_handle: ada@example.com
      # A second one, so that a page size of one is distinguishable from the
      # default. With a single record, count=1 and count=100 return the same
      # thing and the parameter's name is not being checked by anything.
      - id: jkl-mno-pqr
        title: Queue throughput
        layout_type: free
        author_handle: grace@example.com
      # And a third, so that count and start are distinguishable from each
      # other. With two, an offset of one returns one record whether or not
      # the page size was read at all, and the mutation that renames count
      # survives.
      - id: stu-vwx-yz0
        title: Error budget
        layout_type: ordered
        author_handle: ada@example.com
    event:
      - id: "9000000000000001"
        title: Deployed checkout 2026.1.0
        text: Rolled out to all regions
        alert_type: info
        source_type_name: deploy

# Conformance cases, read from Datadog's API reference rather than observed
# against a live organisation. The verify report says so.
conformance:
  - name: failures are an array of bare strings, not objects
    source: https://docs.datadoghq.com/api/latest/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor/99999999
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      status: 404
      matches:
        # A string, not an object. Looping over the entries and reading
        # .message from each finds undefined on every one.
        errors[0]: 'Monitor not found'
      absent:
        - errors[0].message
        - error
        - message

  - name: reading without the application key is refused
    source: https://docs.datadoghq.com/account_management/api-app-keys/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor
      headers:
        DD-API-KEY: cauldron-api-key
    expect:
      # An API key alone can write but not read, so a suite that submits
      # metrics happily still fails every query.
      status: 403
      matches:
        errors[0]: 'application key'

  - name: a monitor with no data is not a healthy monitor
    source: https://docs.datadoghq.com/monitors/manage/status/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor/10000002
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      status: 200
      body:
        # Neither alerting nor OK. Treating anything other than Alert as fine
        # reports a broken check as passing.
        overall_state: "No Data"
        name: Queue depth

  - name: deleting a monitor answers its own key, and a number
    # 200 with {"deleted_monitor_id": 10000001}. Not a 204, not an id, and
    # not a string: Datadog's identifiers are integers, and code comparing
    # monitor.id to a number never matched while this sent text.
    source: https://docs.datadoghq.com/api/latest/monitors/
    fixture: small-org
    request:
      method: DELETE
      path: /api/v1/monitor/10000001
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      status: 200
      body:
        deleted_monitor_id: 10000001
      absent:
        - id
        - deleted

  - name: a created event is wrapped and a created monitor is not
    # Datadog wraps a created event under "event" and puts a status beside
    # it, and wraps nothing around a created monitor. Code reading
    # created.title after posting an event reads undefined: the title is one
    # level in, and the create it was written against was a monitor's.
    source: https://docs.datadoghq.com/api/latest/events/
    fixture: small-org
    request:
      method: POST
      path: /api/v1/events
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
      json:
        title: Deploy finished
        text: shipped 41 commits
    expect:
      status: 200
      body:
        status: ok
        event.title: Deploy finished
        event.text: shipped 41 commits
      absent:
        - title
        - text

  - name: a muted monitor still reports its state
    source: https://docs.datadoghq.com/monitors/notify/downtimes/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor/10000003
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      status: 200
      body:
        # Silencing stops notifications, not evaluation: the state is still
        # OK and still current.
        options.silenced.*: 1767312000
        overall_state: OK
      # There is no muted field to read. This asserted one and passed,
      # because the Recipe declared it, so code branching on monitor.muted
      # worked here and read undefined against Datadog.
      absent:
        - muted

  - name: a collection is wrapped and flagged ok
    source: https://docs.datadoghq.com/api/latest/monitors/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      status: 200
      body:
        status: ok
        monitors[0].name: Checkout p99 latency
        monitors[0].overall_state: Alert
      absent:
        - data

  - name: a bad api key is a 403, not a 401
    source: https://docs.datadoghq.com/api/latest/authentication/
    request:
      method: GET
      path: /api/v1/monitor
      headers:
        DD-API-KEY: wrong-key
        DD-APPLICATION-KEY: cauldron-app-key
    expect:
      # Datadog answers 403 where most providers answer 401, so code checking
      # for 401 to rotate a credential never fires.
      status: 403
      matches:
        errors[0]: 'Forbidden'

  - name: a created monitor starts in OK, not alerting
    source: https://docs.datadoghq.com/api/latest/monitors/
    fixture: empty
    request:
      method: POST
      path: /api/v1/monitor
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
      json:
        name: Disk usage
        query: "avg(last_5m):avg:system.disk.in_use{*} > 0.9"
    expect:
      status: 200
      body:
        name: Disk usage
        overall_state: OK
        type: metric alert
      # Not silenced, and Datadog says so by leaving the map empty rather
      # than by sending a false.
      absent:
        - muted
        - options.silenced
      matches:
        id: '^[1-9][0-9]{7}$'

  - name: monitors page by page_size, counting from nought
    # Not "limit", which Datadog does not accept anywhere. Three endpoints in
    # this API page three different ways, so reading one and assuming the
    # rest is exactly the mistake to avoid.
    source: https://raw.githubusercontent.com/DataDog/datadog-api-client-go/master/.generator/schemas/v1/openapi.yaml
    fixture: small-org
    request:
      method: GET
      path: /api/v1/monitor
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
      query:
        page_size: "1"
        page: "1"
    expect:
      status: 200
      body:
        # The second monitor, because nought is the first page here.
        monitors[0].name: Queue depth
      absent:
        - monitors[1]

  - name: dashboards page by count and start, and start is an offset
    # The same word means a POSIX timestamp on the events endpoint, which is
    # the trap in reading one provider's parameters as one vocabulary. Here
    # it is "the specific offset to use as the beginning of the returned
    # response", so it counts records rather than pages.
    source: https://raw.githubusercontent.com/DataDog/datadog-api-client-go/master/.generator/schemas/v1/openapi.yaml
    fixture: small-org
    request:
      method: GET
      path: /api/v1/dashboard
      headers:
        DD-API-KEY: cauldron-api-key
        DD-APPLICATION-KEY: cauldron-app-key
      query:
        count: "1"
        start: "1"
    expect:
      status: 200
      body:
        # start counts records, so an offset of one skips the first
        # dashboard and count caps the page at one.
        dashboards[0].title: Queue throughput
      absent:
        # Two remain after the offset, and count caps the page at one, so the
        # third must not be here. Without that the page size is unchecked.
        - dashboards[1]
