# Creem Recipe for Cauldron
#
# The product listing, read from the OpenAPI document Creem publishes at
# docs.creem.io/api-reference/openapi.json, and struck live against
# api.creem.io on 2026-09-13 with no key, with a wrong key, on a path that does
# not exist, and with a method a real path does not take.
#
# **A 404 whose body says 500.** Struck live:
#
#   GET /v1/cauldron-nope   404  {"statusCode":500,"timestamp":"2026-09-13T21:58:34.410Z","path":"/v1/cauldron-nope"}
#   PUT /v1/products        404  {"statusCode":500,"timestamp":"2026-09-13T21:58:34.607Z","path":"/v1/products"}
#
# The status line says the thing was not found and the body says the server
# broke. A client that trusts the body reports an outage; a client that trusts
# the header reports a typo; both are reading the same response.
#
# **And that body is a different shape from the other failures.** A missing key
# answers:
#
#   {"trace_id":"d3f88409-...","status":401,"error":"Unauthorized","message":["API Key is missing"],"timestamp":1789336714203}
#
# So on one API the status lives under `status` or under `statusCode`; the
# timestamp is epoch milliseconds as a number or an ISO string; and a failure
# carries a trace id and a sentence, or a path and neither. Two error contracts,
# and which one arrives depends on how far the request got.
#
# **The sentence is an array and the category is not.** `message` is
# `["API Key is missing"]` -- one string, in a list -- while `error` beside it is
# the bare string `"Unauthorized"`. Two prose fields on one object, one of them
# plural for no reason a caller can see.
#
# **A refused request carries an entity tag.** `etag: W/"92-JJAKp4OszPkasCCGzKi3bcBVyVI"`
# on the 401, so the refusal is cacheable and revalidatable, with
# `access-control-allow-credentials: true` and `vary: Origin` beside it.
#
# **The environment enum has three values and two of them mean the same thing.**
# `EnvironmentMode` is `["test", "prod", "sandbox"]`. And the reference's own
# webhook samples ship `"mode": "local"` on live-shaped records -- a fourth
# value the schema does not allow, printed in the published documentation.
#
# **A product says how often it bills, twice, in two languages.**
# `billing_period` is an English phrase from `["every-month",
# "every-three-months", "every-six-months", "every-year", "every-day", "once",
# "custom"]`, and `recurring_interval: "month"` with `recurring_interval_count:
# 3` sits on the same record. The pair can express every fourth month; the
# phrase cannot, and `once` is not a period, and `custom` says nothing at all.
#
# **The image is singular and plural at once.** `image_url` is a string and
# `image_urls` is an array, both on the record, and the array's example is the
# string's example wrapped in brackets.
#
# **The collection answers at two addresses and only one is documented.**
# `/v1/products/search` is the operation the reference describes; `/v1/products`
# answers the same listing live and appears nowhere in the document, which is
# why drift reports it undeclared.
#
# **And the price is a bare number.** `price: 400` with `currency: "USD"` --
# minor units, with nothing on the record saying so, next to a `tax_mode` that
# decides whether that number already contains the tax.

recipe: creem
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.creem.io
  spec: https://docs.creem.io/api-reference/openapi.json
  spec_hash: 6168cac8057121b9b5648c09b8fe1265671f3d7bacbcdc24f8e0c5dbdfb3391a
  spec_seen: "2026-09-13"

auth:
  scheme: header
  header: x-api-key
  keys:
    - creem_cauldr0nf1xturek3y000000
  absent_error: api_key_missing
  rejected_error: invalid_api_key
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    count_field: pagination.total_records
    pages_field: pagination.total_pages
    page_field: pagination.current_page
    cursor_field: pagination.next_page
    cursor_null: true
    prev_field: pagination.prev_page
    # Every number in that envelope is a number: next_page is 2, not "2".
    cursor_number: true
  error:
    style: flat
    # One string, in a list, beside a category that is a bare string.
    message_field: "message[]"
    code_field: "-"
    code_type: number
    type_field: error

resources:
  product:
    id:
      field: id
      style: prefixed
      prefix: prod_
      length: 22
    fields:
      object:
        type: string
      # test, prod, sandbox -- and "local" in the published samples.
      mode:
        type: string
      name:
        type: string
      description:
        type: string
      # Singular, a string.
      image_url:
      # And plural, an array, on the same record.
      image_urls:
        type: list
      features:
        type: list
      # Minor units, with nothing saying so.
      price:
        type: number
      currency:
        type: string
      billing_type:
        type: string
      # The billing cycle as an English phrase...
      billing_period:
        type: string
      # ...and again as a unit and a count.
      recurring_interval:
      recurring_interval_count:
      status:
        type: string
      # Which decides whether price already contains the tax.
      tax_mode:
        type: string
      tax_category:
        type: string
      product_url:
        type: string
      default_success_url:
      custom_fields:
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /v1/products/search
    resource: product
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 50
      limit_param: page_size
      cursor_param: page_number

  - method: GET
    path: /v1/products
    resource: product
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 50
      limit_param: page_size
      cursor_param: page_number

errors:
  api_key_missing:
    status: 401
    type: Unauthorized
    message: API Key is missing
    fields:
      trace_id: d3f88409-657c-443f-9767-137935aeb536
      # The status, in the field the other failure shape calls statusCode.
      status: 401
      # Epoch milliseconds, as a number.
      timestamp: 1789336714203
    headers:
      # An entity tag, on a refusal.
      ETag: W/"92-JJAKp4OszPkasCCGzKi3bcBVyVI"
      Vary: Origin
      Access-Control-Allow-Credentials: "true"

  invalid_api_key:
    status: 401
    type: Unauthorized
    message: Invalid API Key
    fields:
      trace_id: d3f88409-657c-443f-9767-137935aeb536
      status: 401
      timestamp: 1789336714203
    headers:
      ETag: W/"92-JJAKp4OszPkasCCGzKi3bcBVyVI"
      Vary: Origin
      Access-Control-Allow-Credentials: "true"

  unknown_route:
    # Not Found on the wire.
    status: 404
    # And Internal Server Error in the body.
    code: "500"
    code_field: statusCode
    # A second error contract: no trace id, no sentence, no category.
    message_field: "-"
    type_field: "-"
    fields:
      # An ISO string, where the other shape sends epoch milliseconds.
      timestamp: "2026-09-13T21:58:34.410Z"
      path: "{detail}"

  method_not_allowed:
    status: 404
    code: "500"
    code_field: statusCode
    message_field: "-"
    type_field: "-"
    fields:
      timestamp: "2026-09-13T21:58:34.607Z"
      path: /v1/products

fixtures:
  empty:
    product: []

  catalogue:
    product:
      - id: prod_3kpf0ZdpcfsSCQ3kDiwg9m
        object: product
        mode: prod
        name: Team plan
        description: Seats, billed monthly.
        image_url: https://example.com/image.jpg
        # The same address again, in brackets.
        image_urls:
          - https://example.com/image.jpg
        features: []
        # Eleven euros, or eleven hundred of them: the record does not say.
        price: 1100
        currency: EUR
        billing_type: recurring
        # Every month, in English...
        billing_period: every-month
        # ...and every month again, in numbers.
        recurring_interval: month
        recurring_interval_count: 1
        status: active
        tax_mode: exclusive
        tax_category: saas
        product_url: https://creem.io/product/prod_3kpf0ZdpcfsSCQ3kDiwg9m
        default_success_url: ""
        custom_fields: null
        created_at: "2026-02-19T11:18:07.570Z"
        updated_at: "2026-02-19T11:18:07.570Z"
      - id: prod_5jnudVkLGZWF4AqMFBs5t5
        object: product
        # A value the enum does not list, printed in the published samples.
        mode: local
        name: Lifetime licence
        description: ""
        image_url: null
        image_urls: []
        features: []
        price: 24900
        currency: USD
        billing_type: onetime
        # Not a period.
        billing_period: once
        recurring_interval: null
        recurring_interval_count: null
        status: archived
        tax_mode: inclusive
        tax_category: digital-goods-service
        product_url: https://creem.io/product/prod_5jnudVkLGZWF4AqMFBs5t5
        default_success_url: null
        custom_fields: null
        created_at: "2026-01-26T11:18:24.071Z"
        updated_at: "2026-01-26T11:22:16.388Z"

conformance:
  - name: a path that is not there is a 404 whose body says 500
    source: https://api.creem.io/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      # Not Found on the wire...
      status: 404
      body:
        # ...and Internal Server Error in the body.
        statusCode: 500
        path: /v1/cauldron-nope
      absent:
        # No trace id, no sentence, no category: a second error contract.
        - trace_id
        - message
        - error

  - name: a method a real path does not take is the same 404 saying 500
    source: https://api.creem.io/v1/products
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: PUT
      path: /v1/products
      headers: {}
    expect:
      status: 404
      body:
        statusCode: 500
        path: /v1/products

  - name: the sentence is an array and the category beside it is not
    source: https://api.creem.io/v1/products
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/products
      headers: {}
    expect:
      status: 401
      body:
        # One string, in a list.
        message:
          - API Key is missing
        # A bare string, next to it.
        error: Unauthorized
        # And the status, in the field the other shape calls statusCode.
        status: 401
      matches:
        # Epoch milliseconds, where the 404 sends an ISO string.
        timestamp: '\A17\d{11}\z'
        trace_id: '\A[0-9a-f-]{36}\z'

  - name: a refused request carries an entity tag
    source: https://api.creem.io/v1/products
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/products
      headers:
        x-api-key: notarealkey
    expect:
      status: 401
      body:
        message:
          - Invalid API Key
      headers:
        # Cacheable and revalidatable, for a refusal.
        ETag: W/"92-JJAKp4OszPkasCCGzKi3bcBVyVI"
        Access-Control-Allow-Credentials: "true"

  - name: a product says how often it bills twice in two languages
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        # An English phrase from a closed list...
        'items[0].billing_period': every-month
        # ...and the same fact as a unit and a count, which can say things
        # the phrase cannot.
        'items[0].recurring_interval': month
        'items[0].recurring_interval_count': 1
        # And a "billing period" that is not a period.
        'items[1].billing_period': once
        'items[1].recurring_interval': null
        'items[1].recurring_interval_count': null
        'items[0].billing_type': recurring
        'items[1].billing_type': onetime

  - name: the image is singular and plural on the same record
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        'items[0].image_url': https://example.com/image.jpg
        # The same address, in brackets.
        'items[0].image_urls[0]': https://example.com/image.jpg
        'items[1].image_url': null
        'items[1].image_urls': []
        'items[0].features': []
        'items[0].custom_fields': null

  - name: the published samples carry an environment the enum does not list
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        # EnvironmentMode is ["test", "prod", "sandbox"].
        'items[0].mode': prod
        # And the reference's own webhook payloads print this.
        'items[1].mode': local
        'items[0].object': product
        'items[0].status': active
        'items[1].status': archived

  - name: the price is a bare number and the tax mode decides what it means
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        # Minor units, with nothing on the record saying so...
        'items[0].price': 1100
        'items[0].currency': EUR
        # ...and a sibling field that decides whether the tax is already in it.
        'items[0].tax_mode': exclusive
        'items[1].tax_mode': inclusive
        'items[1].price': 24900
        'items[1].currency': USD
        'items[0].tax_category': saas
        'items[1].tax_category': digital-goods-service

  - name: two absent values on one record and a product that is its own URL
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        # The empty string here...
        'items[0].default_success_url': ""
        # ...and null there, for the same absence.
        'items[1].default_success_url': null
        'items[1].description': ""
        'items[0].name': Team plan
        'items[0].description': Seats, billed monthly.
        'items[0].product_url': https://creem.io/product/prod_3kpf0ZdpcfsSCQ3kDiwg9m
        'items[0].created_at': "2026-02-19T11:18:07.570Z"
        'items[0].updated_at': "2026-02-19T11:18:07.570Z"

  - name: the envelope counts the pages and names the one before
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
      query:
        page_size: "1"
        page_number: "2"
    expect:
      status: 200
      body:
        'pagination.total_records': 2
        'pagination.total_pages': 2
        'pagination.current_page': 2
        'pagination.next_page': null
        'pagination.prev_page': 1
        'items[0].id': prod_5jnudVkLGZWF4AqMFBs5t5

  - name: the second address for the same listing answers it too
    source: https://api.creem.io/v1/products
    fixture: catalogue
    request:
      method: GET
      path: /v1/products
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
      query:
        page_size: "1"
        page_number: "1"
    expect:
      status: 200
      body:
        # /v1/products and /v1/products/search are the same collection under
        # two addresses, and only the second is in the document.
        'items[0].id': prod_3kpf0ZdpcfsSCQ3kDiwg9m
        'pagination.current_page': 1

  - name: an empty catalogue still counts itself
    source: https://docs.creem.io/api-reference/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/products/search
      headers:
        x-api-key: creem_cauldr0nf1xturek3y000000
    expect:
      status: 200
      body:
        items: []
        'pagination.total_records': 0
        'pagination.next_page': null
        'pagination.prev_page': null
