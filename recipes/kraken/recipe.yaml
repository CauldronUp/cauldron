# Kraken Recipe for Cauldron
#
# Every success carries an empty error array, and an empty array is true.
#
#   {"error": [], "result": {"XXBTZUSD": { ... }}}
#
# So the obvious guard is backwards:
#
#   if (res.error) throw new Error(res.error)   // throws on every success
#
# [] is truthy in JavaScript, in Ruby and in PHP. The only reading that works is
# res.error.length, and nothing in the response says so. A client written the
# obvious way fails on the happy path and only on the happy path, which is the
# hardest direction to notice in review and the easiest to notice in production.
#
# **And a failure answers 200 with no result key at all.**
#
#   ?pair=NOSUCHPAIR  ->  200  {"error": ["EQuery:Unknown asset pair"]}
#   /public/NoSuchMethod ->  404  {"error": ["EGeneral:Unknown method"]}
#
# One failure is 200 and the other is 404, in the same shape. On the 200 there
# is no "result" key -- not null, not empty, absent -- so a client reading
# res.result.XXBTZUSD gets a TypeError rather than a message it could show
# anyone. The strings are a machine code and a sentence joined by a colon, so
# reading either means splitting on a character that also appears in neither
# half's grammar.
#
# **And you ask for XBTUSD and are answered about XXBTZUSD.**
#
# Kraken's own legacy naming puts an X before crypto assets and a Z before
# fiat, so the pair you named is not the key you must read. There is no field
# anywhere in the response holding the name you sent, and no field holding the
# name you got either -- it is only the key, so recovering it means
# Object.keys(res.result)[0].
#
# Written against the live API rather than a document: every case below was
# checked against api.kraken.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Nine fields, single letters, and three different shapes. a and b are
#      three-entry tuples; c, v, p, t, l and h are two-entry tuples; and o is a
#      bare string, not an array at all. Nothing in the response says which is
#      which, and a client that loops over the object indexing [0] gets the
#      first character of a price on the last one.
#   2. Every number is a string except the one that is not. Eight fields hold
#      strings with trailing zeros preserved -- "78311.50000" -- and t holds
#      [37875, 82161], two bare integers. So a client parsing every value with
#      parseFloat works, and one checking typeof breaks on exactly one field.
#   3. The trailing zeros are the point of the strings. "78311.50000" is five
#      decimal places on a figure that needs one, and a JSON number could not
#      carry them; the precision is the asset's, not the price's.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One pair is served, of the several hundred Kraken lists, and the prices
#     move every second. They are recorded as they stood at the moment in the
#     verified field and will not match now; the Recipe describes the shape,
#     and the shape is what does not move.
#   - The result map holds one pair because one was asked for. Asking for none
#     returns every pair Kraken trades, which is not something a fixture can
#     usefully hold.

recipe: kraken
capability: brokerage
version: 0.1.0

upstream:
  api: v0
  provider: kraken
  docs: https://docs.kraken.com/api/docs/rest-api/get-ticker-information

auth:
  # Public market data, no key. The private endpoints need one and are not
  # described here.
  scheme: none

responses:
  list:
    # A map keyed by the pair, under "result".
    style: map
    key: result
  error:
    # An array of strings, under a key every success also carries.
    style: string_list
    key: error

resources:
  ticker:
    id:
      style: opaque
    fields:
      # Three entries: price, whole lot volume, lot volume.
      a:
        type: list
      b:
        type: list
      # Two entries, from here down.
      c:
        type: list
      v:
        type: list
      p:
        type: list
      # The only integers in the object.
      t:
        type: list
      l:
        type: list
      h:
        type: list
      # And a bare string, where its eight neighbours are arrays.
      o:
        type: string

routes:
  # Asked about XBTUSD, answered about XXBTZUSD.
  - method: GET
    path: /0/public/Ticker
    resource: ticker
    operation: list
    fields:
      # The empty array every success carries, which is true.
      error: []

  # An asset pair that does not exist: two hundred, and no result at all.
  - method: GET
    path: /0/public/Ticker-unknown-pair
    error: unknown_asset_pair

  # A method that does not exist: the same shape at a different status.
  - method: GET
    path: /0/public/NoSuchMethod
    error: unknown_method

errors:
  unknown_asset_pair:
    # Two hundred, for a request that failed.
    status: 200
    # A machine code and a sentence, joined by a colon, in one string.
    message: "EQuery:Unknown asset pair"

  unknown_method:
    # And four hundred and four for this one, in the same shape.
    status: 404
    message: "EGeneral:Unknown method"

fixtures:
  empty: {}

  bitcoin:
    ticker:
      # The key is Kraken's own name for the pair, not the one that was asked
      # for. X before the crypto asset, Z before the fiat.
      - id: XXBTZUSD
        # Three entries: price, whole lot volume, lot volume.
        a:
          - "78311.50000"
          - "8"
          - "8.000"
        b:
          - "78311.40000"
          - "1"
          - "1.000"
        # Two entries, from here down.
        c:
          - "78311.50000"
          - "0.00414665"
        v:
          - "868.38021632"
          - "2254.07112896"
        p:
          - "77955.94921"
          - "78156.98964"
        # The only integers in the object.
        t:
          - 37875
          - 82161
        l:
          - "77255.30000"
          - "77000.00000"
        h:
          - "78787.10000"
          - "79371.50000"
        # A bare string, where its eight neighbours are arrays.
        o: "77681.60000"

conformance:
  - name: every success carries an empty error array
    source: "https://api.kraken.com/0/public/Ticker?pair=XBTUSD"
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/Ticker
      query:
        pair: XBTUSD
    expect:
      status: 200
      body:
        # Empty, and true. The obvious guard -- if (res.error) throw -- fires
        # on every success and never on a failure.
        error: []
        # Asked about XBTUSD, answered about XXBTZUSD.
        "result.XXBTZUSD.o": "77681.60000"
      absent:
        # And nothing holds the name that was sent.
        - result.XBTUSD

  - name: a failure answers two hundred with no result key at all
    source: "https://api.kraken.com/0/public/Ticker?pair=NOSUCHPAIR"
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/Ticker-unknown-pair
    expect:
      # Two hundred, for a request that failed.
      status: 200
      body:
        # A machine code and a sentence, joined by a colon.
        "error[0]": "EQuery:Unknown asset pair"
      absent:
        # Not null, not empty: absent. res.result.XXBTZUSD is a TypeError.
        - result

  - name: and a method that does not exist is the same shape at 404
    source: https://api.kraken.com/0/public/NoSuchMethod
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/NoSuchMethod
    expect:
      # The status the other failure should have had.
      status: 404
      body:
        # A different namespace before the colon, same shape after it.
        "error[0]": "EGeneral:Unknown method"
      absent:
        - result

  - name: nine fields, single letters, and three different shapes
    source: "https://api.kraken.com/0/public/Ticker?pair=XBTUSD"
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/Ticker
      query:
        pair: XBTUSD
    expect:
      status: 200
      body:
        # Three entries...
        "result.XXBTZUSD.a[0]": "78311.50000"
        "result.XXBTZUSD.a[1]": "8"
        "result.XXBTZUSD.a[2]": "8.000"
        "result.XXBTZUSD.b[0]": "78311.40000"
        "result.XXBTZUSD.b[1]": "1"
        "result.XXBTZUSD.b[2]": "1.000"
        # ...two entries...
        "result.XXBTZUSD.c[0]": "78311.50000"
        "result.XXBTZUSD.c[1]": "0.00414665"
        # ...and none at all, because o is a string.
        "result.XXBTZUSD.o": "77681.60000"
      absent:
        # The third entry the two above it have.
        - "result.XXBTZUSD.c[2]"

  - name: every number is a string except the one that is not
    source: "https://api.kraken.com/0/public/Ticker?pair=XBTUSD"
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/Ticker
      query:
        pair: XBTUSD
    expect:
      status: 200
      body:
        # Two bare integers, in the one field that holds them...
        "result.XXBTZUSD.t[0]": 37875
        "result.XXBTZUSD.t[1]": 82161
        # ...beside seven fields of strings.
        "result.XXBTZUSD.v[0]": "868.38021632"
        "result.XXBTZUSD.v[1]": "2254.07112896"
        "result.XXBTZUSD.p[0]": "77955.94921"
        "result.XXBTZUSD.p[1]": "78156.98964"

  - name: the trailing zeros are the point of the strings
    source: "https://api.kraken.com/0/public/Ticker?pair=XBTUSD"
    verified: "2026-08-31"
    fixture: bitcoin
    request:
      method: GET
      path: /0/public/Ticker
      query:
        pair: XBTUSD
    expect:
      status: 200
      body:
        # Five decimal places on a figure that needs one, which a JSON number
        # could not carry.
        "result.XXBTZUSD.l[0]": "77255.30000"
        "result.XXBTZUSD.l[1]": "77000.00000"
        "result.XXBTZUSD.h[0]": "78787.10000"
        "result.XXBTZUSD.h[1]": "79371.50000"
        # And a whole-lot volume written as "8" beside a lot volume of "8.000",
        # which are the same number in two spellings, in one array.
        "result.XXBTZUSD.a[1]": "8"
        "result.XXBTZUSD.a[2]": "8.000"
