# Documenso Recipe for Cauldron
#
# Documenso is open source and can be self-hosted, so unlike most of this
# collection there genuinely is a way to run a real one locally. It is a
# Next.js application with Postgres, a mail server and a signing certificate,
# which is a lot of environment to stand up so that a test can assert the
# shape of a JSON response.
#
# The cloud service has no sandbox, and the thing that makes a test dangerous
# there is the same as everywhere signatures live: sending a document for
# signature emails real people, and a signed document is a legal artefact that
# cannot be unsent.
#
# Four things worth modelling exactly:
#
#   1. A document has a status and each recipient has a separate one, and they
#      answer different questions. A document is PENDING while anybody has not
#      signed; a recipient is SIGNED, VIEWED, SENT or OPENED. Reading the
#      document status to find out whether one person signed gives the answer
#      for everybody at once.
#   2. Sending is not signing. A document moves to PENDING when it goes out,
#      which reads as in-progress and means "waiting for humans", and it can
#      sit there indefinitely.
#   3. A recipient's token is what identifies them in the signing URL, and it
#      is not their id. Building a signing link from the id produces a URL
#      that resolves to nothing.
#   4. Recipients have a signing order only when the document says so. Without
#      it every recipient is emailed at once, so a workflow that assumes
#      sequential signing sends the second signer their link before the first
#      has done anything.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron sends no mail and produces no PDF. This Recipe covers the API
#     surface and the state it exposes.
#   - Nothing signs anything. A signed recipient is a state a fixture puts
#     there, which is the point: the waiting for humans is what a test wants
#     removed.
#   - Documenso is versioned and self-hosted instances lag. The Recipe targets
#     the v1 API and says so, and an instance behind that will differ.
#
# Tokens below are fixtures, not secrets.

recipe: documenso
capability: signing
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.documenso.com/developers/public-api

auth:
  # The key alone, with no scheme, like LaunchDarkly and AssemblyAI. Three
  # providers in this collection now, which is enough that reaching for
  # "Bearer" is a habit worth breaking.
  scheme: header
  header: Authorization
  keys:
    - api_cauldron000000000000000000000000

responses:
  list:
    style: wrapped
    # Documenso's list envelope is {documents, totalPages} and nothing else.
    # totalPages counts pages, not records, and it was declared as the count
    # field -- so three documents at ten per page reported three rather than
    # one. It was removed rather than left wrong, and pages_field is what
    # puts it back with the quantity it claims.
    pages_field: totalPages
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  document:
    collection: documents
    id:
      # A JSON number. Documenso declares the document's id and the
      # documentId a create answers with as numbers, and this sent both as
      # strings, so a client comparing document.id to a number never matched.
      style: numeric
      type: number
    fields:
      title:
        type: string
        required: true
      # DRAFT, PENDING, COMPLETED. PENDING means it went out and is waiting
      # for humans, which can be forever, and it is not an error state.
      status:
        type: string
        default: DRAFT
      userId:
        type: integer
      # Set only once every recipient has signed. A document with one
      # outstanding signer has none, so its absence is the real "not done".
      completedAt:
        type: string
      createdAt:
        type: string
      # Recipients arrive embedded in the document, and only when you fetch
      # one. The listing does not carry them -- see the returns on that route
      # -- so code that lists documents and reads doc.recipients gets
      # undefined for every document and concludes nobody has signed.
      recipients:
        type: list
      # The caller's own reference, echoed on the upload ticket a create
      # answers with. Documenso keeps it on the document too.
      externalId:
        type: string

routes:
  - method: GET
    path: /api/v1/documents
    resource: document
    operation: list
    # The listing answers with less than the document does. Documenso's list
    # item carries the document's own fields and nothing nested: no
    # recipients, so code that lists and then reads doc.recipients gets
    # undefined for every one of them and concludes nobody has signed. The
    # single-document fetch is where they appear.
    returns:
      - id
      - title
      - status
      - userId
      - completedAt
      - createdAt
    pagination:
      # Checked against Documenso's own OpenAPI description: page and
      # perPage in the query, counting from one, with perPage defaulting to
      # ten. Neither was read while this said limit.
      style: page
      limit: 10
      limit_param: perPage
      cursor_param: page

  - method: GET
    path: /api/v1/documents/{id}
    resource: document
    operation: get

  # Creating a document does not answer with a document. Documenso answers
  # with an upload ticket -- documentId, externalId, recipients and an
  # uploadUrl -- and creating is two steps, the second being a PUT of the PDF
  # to that URL. A client that posts and then reads created.title or
  # created.status gets undefined for both, and a client that stops after the
  # post has uploaded nothing at all.
  #
  # The identifier is documentId here and id on every other route, which is
  # why this route was missing until id_as existed. returns names the three
  # fields of the record that come back; uploadUrl is a constant, because
  # what matters is that it is there and has to be used, not that it differs
  # per document.
  - method: POST
    path: /api/v1/documents
    resource: document
    operation: create
    emits: DOCUMENT_CREATED
    status: 200
    id_as: documentId
    returns:
      - id
      - externalId
      - recipients
    fields:
      uploadUrl: https://documenso.test/upload/cauldron-presigned


webhooks:
  events:
    - DOCUMENT_CREATED
    - DOCUMENT_SENT
    - DOCUMENT_OPENED
    - DOCUMENT_SIGNED
    - DOCUMENT_COMPLETED
  # Two fields and a timestamp. Documenso names the event event and puts the
  # document under payload, and its event names are shouted -- DOCUMENT_CREATED
  # rather than document.created -- so a handler comparing against the lower
  # case form matches nothing.
  payload:
    event: "{event}"
    createdAt: "{created_iso}"
    webhookEndpoint: https://cauldron.invalid/webhooks/documenso
    payload:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: X-Documenso-Secret
    secret: cauldron-webhook-secret

errors:
  # Documenso's description declares no 429 on any operation, and check says
  # so. Kept deliberately: errors are what cauldron fault arms, and a client
  # that has never been made to handle a 429 is one that will not. The
  # wording is a placeholder rather than something observed.
  rate_limit:
    status: 429
    message: Too many requests

  authentication_error:
    status: 401
    message: Unauthorized

  resource_missing:
    status: 404
    message: "Document not found: {detail}"

  parameter_missing:
    status: 400
    message: "{detail} is required"

  # A document already sent cannot have its fields or recipients changed. The
  # window closes the moment it goes out, and a workflow that prepares in two
  # steps has to finish before sending.
  document_sent:
    status: 400
    message: Document already sent and cannot be modified.

  # A document with no signer cannot be sent. A CC-only document looks
  # complete from a recipient count and cannot go anywhere.
  no_signers:
    status: 400
    message: Document must have at least one recipient with the SIGNER role.

  # The self-hosted case. An instance without a signing certificate accepts
  # documents and cannot complete one, and the failure arrives at signing
  # rather than at upload.
  no_certificate:
    status: 500
    message: No signing certificate is configured on this instance.

fixtures:
  empty: {}

  small-team:
    document:
      # Sent and waiting. PENDING reads as in-progress and means waiting for
      # humans, which can be forever.
      - id: "101"
        title: Supply agreement
        status: PENDING
        userId: 1
        createdAt: "2026-01-14T10:00:00.000Z"
        recipients:
          # Signed. The document is still PENDING because of the next one, so
          # reading the document's status to find out about this person gives
          # the wrong answer.
          - id: 201
            documentId: 101
            email: ada@example.com
            name: Ada Lovelace
            # The token, not the id. A signing link built from the id
            # resolves to nothing.
            token: tokcauldron0000000000001
            signingStatus: SIGNED
            readStatus: OPENED
            role: SIGNER
            signingOrder: 1
            signedAt: "2026-01-14T11:00:00.000Z"
          # Has not signed and has not even opened it. The document is
          # PENDING entirely because of this recipient.
          - id: 202
            documentId: 101
            email: grace@example.com
            name: Grace Hopper
            token: tokcauldron0000000000002
            signingStatus: NOT_SIGNED
            readStatus: NOT_OPENED
            role: SIGNER
            signingOrder: 2
          # Copied in and never expected to sign. Counting recipients to
          # decide whether a document can complete counts somebody who was
          # never going to.
          - id: 203
            documentId: 101
            email: legal@example.com
            token: tokcauldron0000000000003
            signingStatus: NOT_SIGNED
            readStatus: NOT_OPENED
            role: CC
            signingOrder: 3
      # Everybody signed. completedAt is set, and its absence above is the
      # real "not done".
      - id: "102"
        title: Non-disclosure agreement
        status: COMPLETED
        userId: 1
        completedAt: "2026-01-12T16:30:00.000Z"
        createdAt: "2026-01-11T09:00:00.000Z"
      # Never sent. No recipient has been emailed and nothing is waiting.
      - id: "103"
        title: Draft terms
        status: DRAFT
        userId: 1
        createdAt: "2026-01-15T08:00:00.000Z"


# Conformance cases, read from the Documenso public API documentation rather
# than observed against a live instance. The verify report says so.
conformance:
  - name: a document status is not a recipient status
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Waiting for humans, and it can sit here indefinitely. It says
        # nothing about whether any particular person has signed.
        status: PENDING
        title: Supply agreement
      # Not complete, and the absence is the real evidence rather than the
      # status word.
      absent:
        - completedAt

  - name: one recipient has signed and the document has not
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Ada signed and the document is still PENDING because Grace has not.
        # Reading the document status to find out about Ada gives the answer
        # for everybody at once.
        recipients[0].signingStatus: SIGNED
        recipients[1].signingStatus: NOT_SIGNED
        recipients[1].readStatus: NOT_OPENED

  - name: a CC recipient never blocks completion
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Copied in, never going to sign, and counted by anything that counts
        # recipients to decide whether a document can complete.
        recipients[2].role: CC
        recipients[2].signingStatus: NOT_SIGNED

  - name: the signing token is not the recipient id
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Two different identifiers. A signing link built from the id
        # resolves to nothing.
        recipients[0].id: 201
        recipients[0].token: tokcauldron0000000000001

  - name: a completed document says when
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/102
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        status: COMPLETED
        completedAt: "2026-01-12T16:30:00.000Z"

  - name: a draft has been sent to nobody
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/103
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Nothing has been emailed and nothing is waiting. The only state of
        # the three where a document can still be changed.
        status: DRAFT
        title: Draft terms
      absent:
        - completedAt

  - name: a signing order is present whether or not it means anything
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        # Every recipient has one, and the document does not enable ordered
        # signing, so all three were emailed at once. The field looks
        # meaningful and is not.
        recipients[0].signingOrder: 1
        recipients[1].signingOrder: 2
        recipients[2].signingOrder: 3

  # Ordered signing is configured on meta when the document is created, and
  # the document never echoes it back. There is no field to read to find out
  # whether it is on -- only the recipients' own numbers, which are always
  # there and mean nothing on their own. The Recipe used to declare a
  # document-level signingOrder, and a documentDataId that appears nowhere in
  # Documenso's description at all.
  - name: creating a document hands back an upload ticket, not a document
    # Two steps, and the response says so by what it does not carry. There is
    # no title and no status here, because nothing has been uploaded yet --
    # a client that posts and reads created.status gets undefined, and one
    # that stops after the post has uploaded nothing at all.
    #
    # The identifier is documentId on this route and id on every other one,
    # so code that stores created.id to fetch the document later stores
    # nothing.
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: POST
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
      json:
        title: Supply agreement
        externalId: ext-42
    expect:
      status: 200
      body:
        externalId: ext-42
        uploadUrl: https://documenso.test/upload/cauldron-presigned
      matches:
        documentId: '^[0-9]+$'
      absent:
        - id
        - title
        - status

  - name: the document that owns them has no signing order at all
    source: https://docs.documenso.com/developers/public-api
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents/101
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        status: PENDING
      # Without this the recipients' order numbers mean nothing and everybody
      # was emailed at the same time.
      absent:
        - signingOrder

  - name: the key goes in Authorization with no scheme
    source: https://docs.documenso.com/developers/public-api/authentication
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: Bearer api_cauldron000000000000000000000000
    expect:
      status: 401
      body:
        message: Unauthorized
      absent:
        - error
        - errors
        - code

  - name: the listing hands back documents without their recipients
    # Documenso's list item carries the document's own fields and nothing
    # nested. Code that lists documents and reads doc.recipients gets
    # undefined for every one of them, and concludes nobody has signed --
    # which is a wrong answer with no error attached to it. The recipients
    # are there when you fetch a single document, and only then.
    #
    # This case used to assert totalPages: 3 against
    # /api/v1/documents/101/recipients, which is a route Documenso serves
    # for POST only, and 3 is the number of records rather than the number
    # of pages.
    source: https://app.documenso.com/api/v1/openapi.json
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        documents[0].title: Supply agreement
        documents[0].status: PENDING
      absent:
        - documents[0].recipients

  - name: documents page by perPage and page, counting from one
    # Not "limit", which Documenso does not accept. Read from the wrong name
    # nothing was there, so the first response held every document and
    # reported no second page.
    source: https://app.documenso.com/api/v1/openapi.json
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
      query:
        perPage: "1"
        page: "2"
    expect:
      status: 200
      body:
        # The second document, because Documenso counts pages from one.
        documents[0].title: Non-disclosure agreement
      absent:
        - documents[1]

  - name: totalPages counts pages, not documents
    # Three documents at ten per page is one page. This reported three, which
    # is the number of records under a name that says pages -- worse than an
    # invented field, because the name is real and the number is plausible. A
    # client looping while page <= totalPages asked for pages two and three,
    # received nothing, and read that as two empty pages rather than as a
    # mistake.
    source: https://app.documenso.com/api/v1/openapi.json
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
    expect:
      status: 200
      body:
        totalPages: 1
        documents[0].title: Supply agreement

  - name: a smaller page size makes more pages of the same documents
    # The same three documents, one per page, is three pages. Nothing about
    # the set changed -- which is what makes a record count masquerading as a
    # page count so hard to see: at a page size of one the two agree.
    source: https://app.documenso.com/api/v1/openapi.json
    fixture: small-team
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
      query:
        perPage: "2"
    expect:
      status: 200
      body:
        totalPages: 2
      absent:
        - documents[2]

  - name: the event is shouted and the document is under payload
    source: https://docs.documenso.com/developers/webhooks
    fixture: small-team
    request:
      method: POST
      path: /api/v1/documents
      headers:
        Authorization: api_cauldron000000000000000000000000
      json:
        title: Kettle warranty
    expect:
      status: 200
      webhook:
        event: DOCUMENT_CREATED
        body:
          # Upper case, with an underscore. Comparing this against
          # "document.created" never matches.
          event: DOCUMENT_CREATED
          payload.title: Kettle warranty
        absent:
          - type
          - data.object
