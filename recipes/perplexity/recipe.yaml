# Perplexity Recipe for Cauldron
#
# Two kinds of evidence, kept apart. Observed: struck live against
# api.perplexity.ai on 2026-08-31, with no API key at all -- every case
# below carrying a `verified:` date was read off the wire that day, bytes
# and status line included. Documented: everything else -- the chat
# completion's citations and search results, the model catalogue's own
# vendor namespacing, the usage cost breakdown -- is read from the OpenAPI
# 3.1 description at docs.perplexity.ai/openapi.json and carries no
# `verified:` date, because reaching those routes with a result needs an
# account, and a completion with search grounding costs money. Nothing here
# was called with a real key, and nothing ever will be.
#
# The chat endpoint is not versioned, and the models endpoint is. Every
# other Recipe in this collection -- OpenAI, Mistral, xAI -- puts its whole
# OpenAI-compatible surface under /v1. Perplexity's does not: the completion
# route lives at POST /chat/completions, no version segment anywhere, while
# GET /v1/models sits right beside it with one. Both were confirmed live:
# POST /v1/chat/completions -- the path every other Recipe here would guess
# -- answers the same empty 404 an entirely made-up path gets, and the bare
# /chat/completions answers the account failure a real route answers with.
# A client that assumes one provider versions its own routes uniformly
# guesses wrong here, silently, because the failure for the wrong guess and
# the failure for a typo are the same shape.
#
# And the model catalogue that IS versioned answers for the wrong endpoint.
# The description says so itself: "List the models available for the Agent
# API. Returns model identifiers that can be used with the POST /v1/agent
# endpoint." Not /chat/completions -- a different, non-OpenAI-shaped route
# this Recipe does not model. Every other Recipe in this collection treats
# GET /v1/models as the answer to "what can I pass as model here", because
# that is what it is for OpenAI, Groq, Mistral and xAI alike. Pointed at
# Perplexity, the same assumption reads the wrong catalogue: the ids it
# lists -- anthropic/claude-opus-5, openai/gpt-5.6-sol, xai/grok-4.6 -- are
# not sonar models and were never going to answer a chat completion. The
# description's own security list makes an unrelated claim about the same
# route -- GET /v1/models is declared with no security requirement, an
# open endpoint -- and that is not what was observed: struck live with no
# Authorization header, it answered the identical 401 every other route
# on this host answers unauthenticated. The description and the wire
# disagree about whether this one route needs a key, and the wire is what a
# client meets first.
#
# Missing a key and sending the wrong one share every field except the
# sentence, which is its own answer, distinct from both siblings in this
# collection. Mistral answers the identical body for both. xAI answers a
# different status and a different code for each. Perplexity answers the
# same status, the same type, the same numeral in code, both times --
#
#   No credentials: {"error":{"message":"Invalid API key provided. Ensure
#                    your API key is correct and active.","type":
#                    "invalid_api_key","code":401}}
#   Wrong key:       {"error":{"message":"Invalid API key provided. You can
#                    find your API key at https://www.perplexity.ai/
#                    settings/api.","type":"invalid_api_key","code":401}}
#
# -- and only the prose tells them apart. A client that branches on status,
# type or code cannot distinguish an absent credential from a wrong one on
# this host; only something that logs or displays the message can. Worth
# naming too: code here is 401, unquoted, a bare JSON number -- the HTTP
# status restated inside the body, doing no discriminating work at all,
# because both failures share it. xAI's own Recipe in this collection has a
# code doing that exact job for one of its three failures; Perplexity does
# it for the only two failures this Recipe can reach at all. And type here
# is doing the job a code usually does elsewhere -- invalid_api_key is the
# specific name of the failure, not a broad category the way OpenAI's
# invalid_request_error is a category covering many failures with a code
# for which one.
#
# A path nothing maps to answers in zero bytes, not JSON, and not even
# text with something to read. Content-Length: 0, Content-Type: text/plain;
# charset=utf-8 -- no message, no code, nothing a client could regex out of
# it even if it thought to try. xAI's own unknown-route failure is at least
# a sentence in plain text; this one is nothing at all.
#
# Two more, from the description:
#
#   1. A chat completion answers with citations and search results, and
#      OpenAI's own schema has no property for either. citations is an
#      array of source URLs and search_results is an array of {title, url,
#      snippet, date, source} objects the answer was grounded in -- both
#      siblings of choices at the top level, both silently dropped by any
#      client typed against OpenAI's ChatCompletion and reading only the
#      fields that schema declares.
#   2. Usage carries a cost object, in dollars, that OpenAI's Usage schema
#      has never defined a place for. UsageInfo declares input_tokens_cost,
#      output_tokens_cost and total_cost as plain numbers -- not the ticks
#      xAI's own Recipe in this collection prices a request in, dollars
#      themselves, sitting inside the same response that made the request.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No model runs. A completion answers with whatever the resource's own
#     defaults say, always the same shape, because a create route cannot
#     branch on what was asked -- OpenAI's own Recipe in this collection
#     says so about its own create route too. The description has no GET
#     for a stored completion either, so the create route's own default is
#     the only chat completion shape this Recipe can ever answer with, the
#     same conclusion Mistral's, xAI's and Groq's own Recipes in this
#     collection reach about their own hosts.
#   - The runtime checks credentials before it checks the route, for every
#     Recipe, unconditionally. Perplexity does the opposite for a path
#     nothing matches, observed with no key present at all, and this Recipe
#     cannot reproduce that ordering -- the same gap Mistral's, xAI's and
#     Groq's Recipes all state about their own hosts. The unknown-route
#     cases below are reached with the fixture key so the emulator's own
#     table is reached at all; the shape they assert is the one the real
#     host sent with no credential whatsoever.
#   - The zero-byte body cannot be reproduced exactly either. This runtime's
#     own error writer only ever overrides its built-in fallback sentence
#     when the Recipe's message is non-empty; an empty message here is
#     read as "nothing to override" rather than "override to nothing," so
#     unknown_route always answers with at least the fallback text
#     ("Unrecognised request URL.") behind the right status and the right
#     Content-Type. The two cases exercising this failure assert the status
#     and the Content-Type and say nothing about body content, because
#     asserting the fallback sentence would claim Perplexity sends a
#     sentence it does not, and asserting emptiness is exactly what this
#     runtime cannot do here.
#   - The reverse gap does not apply here the way it does for Groq: a GET
#     against the POST-only chat route was observed answering the ordinary
#     credential failure, not a distinct method error, so nothing had to be
#     overridden to match it -- the runtime's own check-credentials-first
#     default already produces the right shape by accident. There is no
#     method_not_allowed on this host either, just the same 401 an
#     unauthenticated POST would get.
#   - The completion's own id has no documented shape -- the description
#     types it as a bare string with no pattern and no example -- so this
#     Recipe mints one as an opaque token rather than claiming a prefix
#     nobody has shown.
#   - The Agent-API model catalogue is modelled faithfully to its own
#     description, including the ids that make the point above, but nothing
#     here claims those ids are valid against POST /chat/completions,
#     because the description says plainly that they are not.
#   - Streaming is not modelled.
#   - /v1/sonar (the description's own name for this same chat endpoint),
#     /search, /v1/embeddings, /v1/contextualizedembeddings, /v1/agent and
#     its sub-routes, /v1/async/sonar and the analytics routes are not
#     modelled, to match the surface the other Recipes in this collection
#     cover. Chat completions and the Agent-API model listing only.
#
# The key below is a fixture and belongs to no account.

recipe: perplexity
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.perplexity.ai/api-reference
  spec: https://docs.perplexity.ai/openapi.json
  spec_hash: f477012546c7137a9ba1624ac64185f12397a865cbcac4de1437a7c0942503a4
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - pplx-cauldron000000000000000000000000000000000000

responses:
  # {object, data}, nothing else -- ListModelsResponse in the description has
  # no paging fields, and the only list route this Recipe has is this one.
  list:
    style: wrapped
    key: data
    fields:
      object: list
  resource:
    style: bare
  # Nested under "error" the way OpenAI's own failures are. code_type:
  # number keeps 401 a bare JSON integer rather than the quoted string
  # xAI's own Recipe in this collection needs for its own all-digits code.
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: number
    type_field: type

resources:
  # Backs the Agent API's own model selection, per the description, not the
  # chat endpoint this Recipe otherwise models. Kept anyway because it is a
  # real, versioned, OpenAI-shaped route on this host, and the mismatch
  # between what it lists and what a client would assume it lists is itself
  # the finding.
  model:
    id:
      style: opaque
    constants:
      object: model
    fields:
      owned_by:
        type: string
      # 0 in every entry the description's own example shows, never a real
      # epoch -- an integer rather than a genuine timestamp, so this Recipe
      # does not claim it is one.
      created:
        type: integer
        default: 0

  # A create route cannot branch on what was asked, and the description has
  # no GET for a stored completion either -- the same conclusion Mistral's,
  # xAI's and Groq's own Recipes in this collection reach about their own
  # hosts -- so the one shape below is the only chat completion this Recipe
  # can ever answer with.
  completion:
    id:
      style: opaque
    constants:
      object: chat.completion
    fields:
      created:
        type: timestamp
      model:
        type: string
      index:
        type: integer
        in: choices[0]
        as: index
        default: 0
      finish_reason:
        type: string
        in: choices[0]
        as: finish_reason
        default: stop
      role:
        type: string
        in: choices[0].message
        as: role
        default: assistant
      content:
        type: string
        in: choices[0].message
        as: content
        default: The Eiffel Tower's official height including antennas is 330 metres, per the sources below.
      # Source URLs, a sibling of choices at the top level -- a field
      # OpenAI's own ChatCompletion schema has no property for at all.
      citations:
        type: list
        default:
          - https://en.wikipedia.org/wiki/Eiffel_Tower
          - https://www.toureiffel.paris/en/the-monument/key-figures
      # The search results the answer was grounded in, also a top-level
      # sibling of choices, and also absent from OpenAI's schema.
      search_results:
        type: list
        default:
          - title: Eiffel Tower - Wikipedia
            url: https://en.wikipedia.org/wiki/Eiffel_Tower
            date: null
            last_updated: null
            snippet: The Eiffel Tower is 330 metres tall, about the same height as an 81-storey building.
            source: web
      prompt_tokens:
        type: integer
        in: usage
        as: prompt_tokens
        default: 22
      completion_tokens:
        type: integer
        in: usage
        as: completion_tokens
        default: 41
      total_tokens:
        type: integer
        in: usage
        as: total_tokens
        default: 63
      # A dollar figure inside the response that made it, the way xAI's own
      # Recipe in this collection prices a request in ticks. OpenAI's Usage
      # has never had a field for what a request cost.
      total_cost:
        type: number
        in: usage.cost
        as: total_cost
        default: 0.00213

routes:
  - method: GET
    path: /v1/models
    resource: model
    operation: list

    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
  - method: POST
    path: /chat/completions
    resource: completion
    operation: create
    # None of the request comes back. What is served is an answer and a
    # bill, the same claim Mistral's own Recipe in this collection makes
    # about its own completions route.
    returns:
      - id
      - object
      - created
      - model
      - index
      - finish_reason
      - role
      - content
      - citations
      - search_results
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - total_cost

errors:
  # Observed on api.perplexity.ai on 2026-08-31, sent with no Authorization
  # header at all.
  authentication_error:
    status: 401
    code: "401"
    type: invalid_api_key
    message: Invalid API key provided. Ensure your API key is correct and active.

  # Observed the same day, sent with a syntactically plausible bearer token
  # that is not a real key. Same status, same type, same code as the entry
  # above -- only the sentence differs. Reached with `arm`, because the
  # emulator's own credentials check cannot tell an absent header from a
  # wrong one, the same limitation xAI's own Recipe in this collection
  # states about its host.
  invalid_credentials:
    status: 401
    code: "401"
    type: invalid_api_key
    message: Invalid API key provided. You can find your API key at https://www.perplexity.ai/settings/api.

  # Observed the same day, against a path nothing maps to, with no
  # Authorization header sent. Zero bytes -- not a sentence, not a code,
  # nothing -- behind a Content-Type that is not JSON. The status and the
  # Content-Type are asserted below; the body is not, and that omission is
  # deliberate -- see the fidelity gap in the header about why.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"

fixtures:
  empty: {}

  catalogue:
    model:
      # Real ids from the description's own worked example -- vendor-
      # namespaced with a slash, which nothing else in this collection
      # does, and none of them a Sonar model this Recipe's own chat route
      # would ever accept.
      - id: anthropic/claude-opus-5
        owned_by: anthropic
        created: 0

      - id: openai/gpt-5.6-sol
        owned_by: openai
        created: 0

      - id: perplexity/sonar
        owned_by: perplexity
        created: 0

# Cases carrying `verified: "2026-08-31"` were checked that day against
# api.perplexity.ai with no API key. The rest are derived from
# docs.perplexity.ai/openapi.json and carry no date, because reaching them
# with a result needs an account this Recipe will never hold.
conformance:
  - name: a missing credential is a 401 that tells you to check your key
    source: https://api.perplexity.ai/v1/models
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /v1/models
    expect:
      status: 401
      body:
        "error.type": invalid_api_key
        "error.code": 401
        "error.message": Invalid API key provided. Ensure your API key is correct and active.
      absent:
        - error.param
        - detail

  - name: and a key that merely looks real answers the same status, type and code with a different sentence
    # Same 401, same invalid_api_key, same bare 401 in code -- reached with
    # `arm` because the emulator's own check cannot naturally tell missing
    # from wrong, the same limitation xAI's own Recipe states. What changes
    # is only the message, which is the one place a client could ever tell
    # these two failures apart on this host.
    source: https://api.perplexity.ai/v1/models
    verified: "2026-08-31"
    fixture: empty
    arm: invalid_credentials
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer pplx-notarealkey0000000000000000000000000000
    expect:
      status: 401
      body:
        "error.type": invalid_api_key
        "error.code": 401
        "error.message": Invalid API key provided. You can find your API key at https://www.perplexity.ai/settings/api.

  - name: a GET on a POST-only route fails on the credential, not the verb
    # Observed against the chat endpoint with the wrong HTTP method and no
    # credential at all: the identical account failure a POST with no
    # credential gets, not a 405. There is no method-not-allowed to
    # override here the way Groq's own Recipe in this collection needs one.
    source: https://api.perplexity.ai/chat/completions
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /chat/completions
    expect:
      status: 401
      body:
        "error.message": Invalid API key provided. Ensure your API key is correct and active.

  - name: an empty POST body changes nothing while the credential is still missing
    source: https://api.perplexity.ai/chat/completions
    verified: "2026-08-31"
    fixture: empty
    request:
      method: POST
      path: /chat/completions
    expect:
      status: 401
      body:
        "error.message": Invalid API key provided. Ensure your API key is correct and active.

  - name: the versioned path for chat completions finds nothing, because the real one carries no version at all
    # Observed with no Authorization header sent whatsoever: POST
    # /v1/chat/completions -- the path every sibling Recipe in this
    # collection would lead a client to guess -- answers the same empty 404
    # a wholly invented path gets. Sent here with the fixture key so the
    # emulator's own route table is reached; see the fidelity gap above
    # about check order.
    source: https://api.perplexity.ai/v1/chat/completions
    verified: "2026-08-31"
    fixture: empty
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer pplx-cauldron000000000000000000000000000000000000
    expect:
      status: 404
      headers:
        Content-Type: "text/plain; charset=utf-8"

  - name: a path nothing maps to answers in zero bytes, not JSON
    source: https://api.perplexity.ai/nonexistent-path-xyz
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /nonexistent-path-xyz
      headers:
        Authorization: Bearer pplx-cauldron000000000000000000000000000000000000
    expect:
      status: 404
      headers:
        Content-Type: "text/plain; charset=utf-8"

  - name: the versioned model catalogue is namespaced by vendor and answers for a different endpoint entirely
    # anthropic/claude-opus-5, not a Sonar model -- because this listing
    # describes the Agent API's own models, per the description's own
    # words, and not the chat endpoint this Recipe otherwise covers.
    source: https://docs.perplexity.ai/openapi.json
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer pplx-cauldron000000000000000000000000000000000000
    expect:
      status: 200
      body:
        object: list
        "data[0].id": anthropic/claude-opus-5
        "data[0].owned_by": anthropic
        "data[0].created": 0
        "data[2].id": perplexity/sonar
      absent:
        - has_more
        - next_page_token

  - name: a chat completion answers with citations and search results OpenAI's schema has no property for
    source: https://docs.perplexity.ai/openapi.json
    fixture: empty
    request:
      method: POST
      path: /chat/completions
      headers:
        Authorization: Bearer pplx-cauldron000000000000000000000000000000000000
      json:
        model: sonar
        messages:
          - role: user
            content: How tall is the Eiffel Tower?
    expect:
      status: 200
      body:
        object: chat.completion
        "choices[0].finish_reason": stop
        "choices[0].message.role": assistant
        "citations[0]": https://en.wikipedia.org/wiki/Eiffel_Tower
        "search_results[0].title": Eiffel Tower - Wikipedia
        "search_results[0].url": https://en.wikipedia.org/wiki/Eiffel_Tower
        "search_results[0].source": web
      absent:
        - messages

  - name: usage carries a dollar cost OpenAI's schema has never defined a place for
    source: https://docs.perplexity.ai/openapi.json
    fixture: empty
    request:
      method: POST
      path: /chat/completions
      headers:
        Authorization: Bearer pplx-cauldron000000000000000000000000000000000000
      json:
        model: sonar
        messages:
          - role: user
            content: How tall is the Eiffel Tower?
    expect:
      status: 200
      body:
        "usage.prompt_tokens": 22
        "usage.total_tokens": 63
        "usage.cost.total_cost": 0.00213

  # The names. This Recipe declares 4 field(s) on a completion that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a completion carries the field names this Recipe declares"
    source: "https://docs.perplexity.ai/openapi.json"
    fixture: empty
    request:
      method: POST
      path: "/chat/completions"
      json:
        model: sonar
        messages:
        - role: user
          content: How tall is the Eiffel Tower?
      headers:
        "Authorization": "Bearer pplx-cauldron000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        "usage.completion_tokens": 41
        "choices[0].message.content": "The Eiffel Tower's official height including antennas is 330 metres, per the sources below."
        "choices[0].index": 0
        "model": "sonar"

