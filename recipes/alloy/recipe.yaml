# Alloy Recipe for Cauldron
#
# Persona keeps needs_review as a value the same status field can hold.
# Onfido keeps consider as a value result can hold. Alloy puts the pending
# human look on an entirely different field from the one the decision lands
# on: status carries waiting_review (among running, data_request,
# pending_step_up, pending_action, completed, error), and complete_outcome
# is a second field that is "populated only when status is completed" --
# Alloy's own documented wording. So a client that reads status alone can
# already tell "somebody has to look" from "this is finished" without ever
# touching the outcome field, which is more than Persona's or Onfido's single
# overloaded field gives up front. What Alloy does not give up, on either
# field, is a version or a revision marker: the outcome, once populated, is
# common values Approved and Denied per Alloy's own reference, and nothing
# this Recipe could find documents whether or how one changes after being
# returned, or names a field that would say so if it did.
#
# **The unauthenticated failure is not one sentence but a live-verified
# three-way split, and two of the three are not even the same HTTP status.**
# Struck against sandbox.alloy.co with no account:
#
#   no Authorization header at all             400  minor_code 4001
#                                                    "Header Validation
#                                                    Failure" --
#                                                    "\"authorization\" is
#                                                    required"
#   Authorization: Bearer junktoken12345       400  minor_code 4001, same
#                                                    type and top-level
#                                                    message, different
#                                                    details: "... fails to
#                                                    match the required
#                                                    pattern: /Bearer\s
#                                                    [a-zA-Z0-9]{40}|Basic\s
#                                                    [a-zA-Z0-9=].*|Bearer\s
#                                                    [A-Za-z0-9-_]+\.[A-Za-z0-9
#                                                    -_]+\.[A-Za-z0-9-_]*/"
#   Authorization: Basic <base64 junkuser:junkpass>
#                                               401  minor_code 4011
#                                                    "Unauthorized" -- "Your
#                                                    supplied credentials are
#                                                    invalid."
#
# Absent and shape-wrong share one status code and one outer message and
# still are not the same response: only the malformed one's nested details
# names the actual regex and echoes the actual header value back. A caller
# who forgets Authorization and one who sends a non-Basic, non-JWT-shaped
# value both learn it from a 400, and only a value that shape-matches
# Basic-or-Bearer-JWT and is simply wrong gets the 401. That regex is also
# the reason "Authorization: Basic not-a-real-value!!!" -- garbage that
# still starts with an alphanumeric character -- was answered 401 rather
# than 400 when struck live: the pattern only demands the value look roughly
# right, not that it decode, so this Recipe's own credential check (which
# demands real base64, because that is what Go's standard library basic-
# auth parser demands) draws the absent/malformed line in a stricter place
# than Alloy's own regex does. Not modelled as a conformance case for that
# reason -- see the fidelity gaps.
#
# **The credential gate is unconditional: checked before the method, before
# the path is resolved, on every request struck.** PUT and DELETE on
# /v1/evaluations with no Authorization got the identical 400 a GET did.
# GET /v1/totally-bogus-nowhere with no Authorization got the identical 400
# a real path did; with the same wrong Basic credential, the identical 401.
# No case anywhere -- real path or invented, GET or PUT or DELETE -- ever
# saw a 404 or a 405. That is Cauldron's default ordering (auth.after_routing
# is not declared below, so the credential is checked first for every
# request), and it needed no override to match what was struck.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful evaluation is modelled. POST /evaluations' own OpenAPI
#     description gives summary.outcome, summary.outcome_reasons and the
#     rest as typed properties with no worked "example:" value for any of
#     them, and this batch's brief forbids creating a real evaluation to
#     observe one. Inventing plausible-looking evaluation_token, entity_
#     token or outcome_reasons values would be exactly the fabricated field
#     this project exists to refuse, so no route is declared for creating or
#     reading an evaluation at all -- see Together's Recipe elsewhere in
#     this repository for the same call made for the same reason on a
#     different provider's success shape.
#   - The malformed-value sentence quotes the caller's own header back
#     ("... with value \"Bearer junktoken12345\" fails to match ...") and
#     this runtime's credential check passes no such value through to a
#     Recipe's error message. errors.header_validation_absent and errors.
#     header_validation_malformed below are therefore the literal sentences
#     for the two specific requests every conformance case reaching them
#     actually sends, not a reproduction of the echo for an arbitrary one --
#     the same gap and the same fix ayrshare/recipe.yaml in this repository
#     already states.
#   - "Authorization: Basic not-a-real-value!!!" is recorded in this header
#     as struck live (401) and not modelled as a case: see above, Alloy's
#     own shape regex and this runtime's base64-decoding check draw the
#     absent/malformed line in different places, and a case here would
#     assert a body this Recipe's own mechanism cannot produce for that
#     input.
#   - Only one half of the Basic pair is checked. Alloy's username is the
#     workflow token and the password the workflow secret (or, on newer
#     accounts, token/secret); this Recipe's credential check, like every
#     other Basic-scheme Recipe in this repository, compares one side
#     against a fixed list, so a request holding the right token and any
#     password would authenticate here and would not against the real API.
#   - No OAuth 2.0 path. Alloy's authentication guide documents Basic and
#     OAuth 2.0 as alternatives; only Basic, the one actually struck, is
#     modelled.
#   - No upstream.spec. No single fetchable machine-readable description was
#     found; the reference is a set of individual pages.
#
# Tokens below are fixtures, not secrets, and every person here is invented.

recipe: alloy
capability: identity
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.alloy.com/reference/overview

auth:
  scheme: basic
  keys:
    - cauldron-alloy-fixture-token
  # No Authorization header at all -- struck live as 400, not 401. Alloy's
  # own minor_code 4001 covers this and the malformed case below alike; see
  # errors for how this Recipe still tells them apart the way the live body
  # does, through details rather than through the outer envelope.
  absent_error: header_validation_absent
  # Present, and not shaped like Basic-or-Bearer-JWT at all -- struck live
  # with "Authorization: Bearer junktoken12345", still 400, same minor_code,
  # a different details object. This runtime's own malformed verdict for a
  # Basic scheme is "the header is there and does not parse as Basic," which
  # is exactly this case: no "Basic " prefix at all.
  malformed_error: header_validation_malformed
  # Present, decodes as Basic, and is not a credential this Recipe holds --
  # struck live as 401, a completely different status and envelope from the
  # two above.
  rejected_error: unauthorized

resources:
  # GET /evaluations/{evaluation_token}. Alloy's own OpenAPI description
  # gives this the same response schema as the 201 from creating one --
  # status_code, evaluation_token, entity_token, application_token,
  # application_version_id, timestamp, and a summary object holding result,
  # score, tags, outcome, outcome_reasons, services, custom_fields and
  # models -- with no worked "example:" value for any of them. Per this
  # batch's rule against inventing a field value, only outcome is declared,
  # because "Approved" and "Denied" are the two values Alloy's own
  # statuses-and-outcomes reference actually names. Everything else in the
  # schema -- score, tags, outcome_reasons, services, custom_fields, models,
  # and the sibling supplied/formatted/matching/diligence/related_data/
  # raw_responses/warnings/error objects -- is left undeclared rather than
  # filled with a plausible-looking guess.
  evaluation:
    id:
      style: opaque
      field: evaluation_token
    fields:
      entity_token:
        type: string
      application_token:
        type: string
      # Populated only when status is completed, per Alloy's own
      # documentation -- the same completed-only rule Sumsub's reviewResult
      # and Veriff's decision fields carry elsewhere in this batch.
      outcome:
        type: string
        in: summary

routes:
  - method: GET
    path: /evaluations/{id}
    resource: evaluation
    operation: get

responses:
  error:
    # {status_code, error: {minor_code, type, message, details, error_token},
    # timestamp, evaluation_token, entity_token, application_token,
    # application_version_id}. Alloy's own published error-reference shape,
    # matched live for both the 400 and 401 cases below.
    style: nested
    key: error
    message_field: message
    code_field: minor_code
    code_type: number
    type_field: type
    # Not status_field: that nests inside the "error" object for this style,
    # and Alloy's own status_code sits beside it. Declared per error below
    # instead, in each one's own fields, since a Recipe-wide constant here
    # could not vary between a 400 and a 401.
    fields:
      evaluation_token: null
      entity_token: null
      application_token: null
      application_version_id: null

errors:
  header_validation_absent:
    status: 400
    code: "4001"
    type: "Header Validation Failure"
    message: "Verify that your OAuth bearer token is well formed and that your application version is a positive integer if passed."
    fields:
      status_code: 400
      error:
        details:
          message: '"authorization" is required'
          path: authorization
          type: any.required

  # See the header: the exact value quoted in details.message and
  # details.context.value below is "Bearer junktoken12345" specifically,
  # because that is the one request every case reaching this error sends.
  header_validation_malformed:
    status: 400
    code: "4001"
    type: "Header Validation Failure"
    message: "Verify that your OAuth bearer token is well formed and that your application version is a positive integer if passed."
    fields:
      status_code: 400
      error:
        details:
          message: '"authorization" with value "Bearer junktoken12345" fails to match the required pattern: /Bearer\s[a-zA-Z0-9]{40}|Basic\s[a-zA-Z0-9=].*|Bearer\s[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]*/'
          path: authorization
          type: string.regex.base

  unauthorized:
    status: 401
    code: "4011"
    type: Unauthorized
    message: "Your supplied credentials are invalid."
    fields:
      status_code: 401

fixtures:
  empty: {}

  small-workflow:
    evaluation:
      # entity_token and application_token are synthetic identifiers, the
      # same way every id fixture in this batch's other two Recipes is;
      # outcome: Approved is the one value in Alloy's own schema this
      # Recipe could confirm rather than guess.
      - id: eval_cauldron0000000001
        entity_token: ent_cauldron0000000001
        application_token: app_cauldron0000000001
        outcome: Approved

# The credential cases below were struck live against sandbox.alloy.co with
# no account and no key ever created, and carry today's date. The one
# evaluation case is read from Alloy's own OpenAPI description, which gives
# no worked example for a 200 body -- see the header and resources.
# evaluation -- and carries no verified date.
conformance:
  - name: no Authorization header is a 400, not a 401
    source: https://sandbox.alloy.co/v1/evaluations
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/evaluations
    expect:
      status: 400
      body:
        status_code: 400
        error.minor_code: 4001
        error.type: "Header Validation Failure"
        error.details.type: any.required
        evaluation_token: null
        entity_token: null
      matches:
        error.message: "well formed"
        error.details.message: 'authorization" is required'

  - name: a header that cannot be Basic or a JWT-shaped Bearer is the same status, a different details object
    source: https://sandbox.alloy.co/v1/evaluations
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/evaluations
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 400
      body:
        error.minor_code: 4001
        error.details.type: string.regex.base
      matches:
        error.details.message: "fails to match the required pattern"

  - name: a value that shape-matches Basic and is simply wrong is a 401, a different status entirely
    source: https://sandbox.alloy.co/v1/evaluations
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/evaluations
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 401
      body:
        status_code: 401
        error.minor_code: 4011
        error.type: Unauthorized
      matches:
        error.message: "supplied credentials are invalid"

  - name: PUT with no Authorization gets the same absent sentence a GET does
    source: https://sandbox.alloy.co/v1/evaluations
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PUT
      path: /v1/evaluations
    expect:
      status: 400
      body:
        error.minor_code: 4001
        error.details.type: any.required

  - name: DELETE with no Authorization gets it too -- the gate does not wait to learn the method
    source: https://sandbox.alloy.co/v1/evaluations
    verified: "2026-09-02"
    fixture: empty
    request:
      method: DELETE
      path: /v1/evaluations
    expect:
      status: 400
      body:
        error.minor_code: 4001

  - name: a path this Recipe declares nothing for gets the identical absent sentence, not a 404
    source: https://sandbox.alloy.co/v1/totally-bogus-nowhere
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-nowhere
    expect:
      status: 400
      body:
        error.minor_code: 4001
        error.details.type: any.required

  - name: and with the same wrong Basic credential, the identical 401 rather than a 404
    source: https://sandbox.alloy.co/v1/totally-bogus-nowhere
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-nowhere
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 401
      body:
        error.minor_code: 4011
      matches:
        error.message: "supplied credentials are invalid"

  - name: an outcome is populated only once there is one to report
    source: https://developer.alloy.com/public/reference/get_evaluations-evaluation-token.md
    fixture: small-workflow
    request:
      method: GET
      path: /evaluations/eval_cauldron0000000001
      headers:
        # cauldron-alloy-fixture-token, empty password -- the same
        # token-as-username, empty-password shape Greenhouse's Harvest key
        # uses elsewhere in this repository.
        Authorization: Basic Y2F1bGRyb24tYWxsb3ktZml4dHVyZS10b2tlbjo=
    expect:
      status: 200
      body:
        summary.outcome: Approved
