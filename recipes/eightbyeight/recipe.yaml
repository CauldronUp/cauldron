# 8x8 Recipe for Cauldron
#
# Written against 8x8's API reference at developer.8x8.com and struck live
# against api.8x8.com on 2026-09-07 with no credential, with a deliberately
# invalid one, and at the host root.
#
# **The request id is the same on two different requests.** Struck live,
# seconds apart:
#
#   GET /vms/v1/subaccounts                          (no credential)
#   404 {"message":"no Route matched with those values",
#        "request_id":"658c4f55152fc611583ee84dfaa8800e"}
#
#   GET /vms/v1/subaccounts                          Authorization: Bearer notreal
#   404 {"message":"no Route matched with those values",
#        "request_id":"658c4f55152fc611583ee84dfaa8800e"}
#
#   GET /
#   404 {"message":"no Route matched with those values",
#        "request_id":"8011fa5566f3b055456e3d4e8ab27d45"}
#
# The first two carry an identical `request_id`. The third, a different path,
# carries a different one. So the value is derived from the request rather than
# minted per call -- two calls to the same URL are one id, and the field that
# exists to identify *this* request identifies the route.
#
# That is a real problem for the thing a request id is for. A caller reporting
# "this failed at 14:02" hands over a value that also belongs to every other
# caller who made the same request, so support cannot find the call.
#
# It is also the only correlation id in this collection that is reproducible,
# which is a curious property: two clients on different continents get the same
# 32 hex characters for the same URL.
#
# **Everything is Kong.** `no Route matched with those values` is Kong's own
# sentence, and it is the answer to a credentialed request, an uncredentialed
# one and the host root alike. So 8x8's own application is never reached from
# outside and the gateway is the entire observable API.
#
# This is the **third** Kong sighting in this collection.
# [productboard](../productboard) answers it on an unknown path while serving
# its own 401 on real ones; [browserbase](../browserbase) is Fastify rather
# than Kong but leaks its framework the same way; here the gateway answers
# everything. Three products, one piece of infrastructure, and in each case the
# sentence a developer sees was written by somebody who has never heard of the
# company they are integrating with.
#
# **A 404 for a credential problem.** Because the route is only mounted for
# authenticated consumers, an anonymous request is not refused -- it is
# unrouted. So the status says the endpoint does not exist, and it does, and
# what does not exist is the caller's permission to see it.

recipe: eightbyeight
capability: voice
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.8x8.com/analytics/reference
  # No spec: 8x8 publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-8x8-f1xture-token-00000000
  # One answer to both, and it is a routing failure rather than a refusal.
  absent_error: no_route_matched
  rejected_error: no_route_matched

responses:
  list:
    style: wrapped
    key: content
    count_field: totalElements
    page_field: number
    limit_field: size
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  subaccount:
    id:
      field: subAccountId
      style: opaque
    fields:
      subAccountName:
        type: string
      status:
        type: string
        default: ACTIVE
      countryCode:
        type: string
      createdTime:
        type: datetime

routes:
  - method: GET
    path: /vms/v1/subaccounts
    resource: subaccount
    operation: list
    pagination:
      style: page
      limit: 20
      limit_param: size
      cursor_param: page

errors:
  no_route_matched:
    # 404 rather than 401 or 403: the route is only mounted for authenticated
    # consumers, so an anonymous request is not refused, it is unrouted. The
    # status says the endpoint does not exist -- it does, and what does not
    # exist is the caller's permission to see it.
    status: 404
    message: "no Route matched with those values"
    fields:
      # Derived from the request rather than minted per call: two calls to the
      # same URL carry the same value, and the field that exists to identify
      # this request identifies the route.
      request_id: 658c4f55152fc611583ee84dfaa8800e

fixtures:
  empty:
    subaccount: []

  customer:
    subaccount:
      - subAccountId: cauldron_demo_01
        subAccountName: Cauldron Demo
        status: ACTIVE
        countryCode: GB
        createdTime: "2026-04-11T08:30:00.000Z"
      - subAccountId: cauldron_demo_02
        subAccountName: Cauldron Sandbox
        # Suspended and still listed, with no date saying when -- so a client
        # cannot tell a subaccount suspended this morning from one suspended
        # last year.
        status: SUSPENDED
        countryCode: US
        createdTime: "2026-06-02T14:15:00.000Z"

conformance:
  - name: two different requests carry the same request id
    source: https://api.8x8.com/vms/v1/subaccounts
    verified: "2026-09-07"
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers: {}
    expect:
      status: 404
      body:
        # Struck live twice, seconds apart, with and without a credential:
        # the same 32 hex characters. The value is derived from the request,
        # so a caller reporting a failure hands over a value that also belongs
        # to everybody else who made the same call.
        request_id: 658c4f55152fc611583ee84dfaa8800e

  - name: the gateway answers rather than the product
    source: https://api.8x8.com/vms/v1/subaccounts
    verified: "2026-09-07"
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers: {}
    expect:
      status: 404
      body:
        # Kong's own sentence. The third Kong sighting in this collection, and
        # the first where the gateway is the entire observable API.
        message: "no Route matched with those values"

  - name: a credential failure is reported as a missing route
    source: https://api.8x8.com/vms/v1/subaccounts
    verified: "2026-09-07"
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Not 401, not 403. The route is mounted per authenticated consumer, so
      # an anonymous request is unrouted rather than refused.
      status: 404
      body:
        message: "no Route matched with those values"

  - name: the host root answers the same sentence
    source: https://api.8x8.com/
    verified: "2026-09-07"
    fixture: customer
    request:
      method: GET
      path: /
      headers: {}
    expect:
      # So there is no index, no version document and no health check that a
      # caller can reach -- the gateway answers everything the same way.
      status: 404
      body:
        message: "no Route matched with those values"

  - name: subaccounts arrive under a Spring page envelope
    source: https://developer.8x8.com/analytics/reference
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer cauldr0n-8x8-f1xture-token-00000000"
    expect:
      status: 200
      body:
        # content, totalElements, number and size: Spring Data's Page, on the
        # wire. A client written against it is reading a Java framework's
        # serialisation rather than a designed envelope.
        'content[0].subAccountId': cauldron_demo_01
        totalElements: 2

  - name: a suspended subaccount has no date saying when
    source: https://developer.8x8.com/analytics/reference
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer cauldr0n-8x8-f1xture-token-00000000"
    expect:
      status: 200
      body:
        # A status and a creation time, and nothing that says when the status
        # last changed -- so a subaccount suspended this morning and one
        # suspended last year are the same record.
        'content[1].status': SUSPENDED
        'content[1].createdTime': "2026-06-02T14:15:00.000Z"

  - name: the identifier is a name somebody typed
    source: https://developer.8x8.com/analytics/reference
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer cauldr0n-8x8-f1xture-token-00000000"
    expect:
      status: 200
      body:
        # Lower case with underscores, chosen at creation, and it is the
        # handle every other endpoint takes -- so renaming a subaccount is
        # not possible and a typo is permanent.
        'content[0].subAccountId': cauldron_demo_01
        'content[0].subAccountName': Cauldron Demo
        # And the country is on the subaccount rather than on the account, so
        # one customer's subaccounts can sit under different regulators.
        'content[0].countryCode': GB
        'content[1].countryCode': US

  - name: the page envelope reports its own position
    source: https://developer.8x8.com/analytics/reference
    fixture: customer
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer cauldr0n-8x8-f1xture-token-00000000"
      query:
        page: "2"
        size: "1"
    expect:
      status: 200
      body:
        # `number` is the page and `size` is the page size, both echoed --
        # and `number` is Spring's name for it, which is not what any client
        # would guess.
        'content[0].subAccountId': cauldron_demo_02
        number: 2
        size: 1

  - name: a customer with no subaccounts answers an empty array
    source: https://developer.8x8.com/analytics/reference
    fixture: empty
    request:
      method: GET
      path: /vms/v1/subaccounts
      headers:
        Authorization: "Bearer cauldr0n-8x8-f1xture-token-00000000"
    expect:
      status: 200
      body:
        content: []
        totalElements: 0
