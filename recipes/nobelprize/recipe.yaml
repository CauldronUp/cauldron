# Nobel Prize Recipe for Cauldron
#
# A laureate who does not exist is an array of length one.
#
#   GET /2.1/laureate/745     ->  200  [ { "id": "745", ... } ]
#   GET /2.1/laureate/999999  ->  200  [ { "meta": { ... } } ]
#
# Both are arrays. Both have one element. The second element has no id, no name
# and no prizes -- it is the licence notice and nothing else. So a client that
# asks "did I get anything?" by reading .length is told yes, and only finds out
# by reaching for a field and getting undefined.
#
# There is no 404 on this path at all, and the two responses are the same JSON
# type, the same length, and the same status.
#
# **And the language maps have a key in them that is not a language.**
#
#   "city":    {"en": "Montclair, NJ", "no": "Montclair, NJ", "se": "Montclair, NJ"}
#   "cityNow": {"en": "...", "no": "...", "se": "...", "sameAs": [ ... ],
#               "latitude": "40.825930", "longitude": "-74.209030"}
#
# The coordinates are strings, and each keeps a trailing zero -- 40.825930
# rather than 40.82593 -- a precision a JSON number cannot carry.
#   "nameNow": {"en": "Stanford University"}
#   "knownName": {"en": "A. Michael Spence", "se": "A. Michael Spence"}
#
# Four objects in one record, and no two agree on what a language map is. One
# has three languages; one has three languages and three keys that are not
# languages at all -- an array of linked-data URLs, and a latitude and longitude
# kept as strings; one has a single language; and the laureate's own name has
# two, so knownName.no is undefined where city.no is not.
#
# A client doing Object.keys(place.cityNow) to find the translations gets
# sameAs, latitude and longitude among them, and hands an array of URLs and two
# coordinates to whatever renders a city name.
#
# Written against the live API rather than a document: every case below was
# checked against api.nobelprize.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The record links to a different version of the API that served it.
#      Fetched from /2.1/, the laureate's own links[0].href is
#      https://api.nobelprize.org/2/laureate/745 -- version 2, no point one. A
#      client following the link it was given leaves the version it asked for.
#   2. Two endpoints, two envelopes. /2.1/laureate/745 answers with a bare
#      array; /2.1/laureates answers with {"laureates": [...], "meta": {...}}.
#      Singular is unwrapped and plural is wrapped, and the wrapper is named
#      after the plural.
#   3. A share of a prize is a fraction in a string: "portion": "1/3". So is
#      the ordering, "sortOrder": "2", and the year, "awardYear": "2001" --
#      while the money beside them, prizeAmount and prizeAmountAdjusted, is an
#      integer with no currency named anywhere in the record.
#
# And every laureate carries its own copy of the licence: meta with terms,
# license and disclaimer is repeated inside each record rather than sent once.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One laureate is served, of 1,018, with one of his prizes and one of its
#     affiliations.
#   - The Norwegian and Swedish text is served for the city and the category's
#     Swedish name, which are ASCII. The category's Norwegian name carries a
#     letter this file does not: it is described here and not pinned.
#   - The birth place's sameAs array is served as one entry. Upstream it
#     carries several, and the finding is that it is there at all.

recipe: nobelprize
capability: docs
version: 0.1.0

upstream:
  api: v2.1
  provider: nobelprize
  docs: https://app.swaggerhub.com/apis/NobelMediaAB/NobelMasterData/2.1
  supersedes:
    # The version this record's own links point at, which is not the version
    # that served the record.
    - version: v2
      host: api.nobelprize.org/2
      note: the version the 2.1 records link to, which a client following its links leaves for

auth:
  # Public, no key.
  scheme: none

responses:
  # A bare array, on the singular path.
  resource:
    style: bare
  error:
    # The only failure is an HTML page, so there is no JSON error shape
    # to declare. text is what it sends.
    style: text

resources:
  laureate:
    id:
      style: opaque
      field: id
    fields:
      # Two languages, where the city below has three.
      knownName:
        type: map
      fullName:
        type: map
      gender:
        type: string
      fileName:
        type: string
      # A date and the year of that date, the year as a string.
      birth:
        type: map
      wikipedia:
        type: map
      wikidata:
        type: map
      # A link to a different version of this API.
      links:
        type: list
      nobelPrizes:
        type: list
      # The licence, repeated inside every record.
      meta:
        type: map

routes:
  - method: GET
    path: /2.1/laureate/745
    resource: laureate
    operation: get
    id_from: auth

  # A laureate who does not exist: the same type, the same length, no record.
  - method: GET
    path: /2.1/laureate/999999
    resource: laureate
    operation: list
    pagination:
      # A laureate looked up by number, which answers the one asked for.
      # Nothing to page.
      #
      # So this does not page, and the runtime was reading "limit" and
      # offering a cursor for a second page that cannot exist.
      style: none
    list:
      style: bare
    fields: {}

  # A path that does not exist: HTML, and the only real failure here.
  - method: GET
    path: /2.1/nosuchthing
    error: page_not_found
    headers:
      Content-Type: text/html;charset=UTF-8

errors:
  page_not_found:
    status: 404
    message: "<html><head><title>Page Not Found</title></head><body><h1>Page Not Found</h1></body></html>"

fixtures:
  empty: {}

  # The licence, and nothing else, in an array of length one.
  nobody:
    laureate:
      - id: "-"
        meta:
          terms: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/"
          license: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/#licence"
          disclaimer: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/#disclaimer"

  spence:
    laureate:
      # A numeric identifier kept as a string.
      - id: "745"
        # Two languages here...
        knownName:
          en: A. Michael Spence
          se: A. Michael Spence
        fullName:
          en: A. Michael Spence
          se: A. Michael Spence
        gender: male
        fileName: spence
        birth:
          # A date, and the year of that date, as a string.
          date: "1943-11-07"
          year: "1943"
          place:
            # ...and three languages here.
            city:
              en: "Montclair, NJ"
              no: "Montclair, NJ"
              se: "Montclair, NJ"
            country:
              en: USA
              no: USA
              se: USA
            cityNow:
              en: "Montclair, NJ"
              no: "Montclair, NJ"
              se: "Montclair, NJ"
              # And three keys that are not languages, in a map of languages.
              sameAs:
                - "https://www.wikidata.org/wiki/Q678437"
              latitude: "40.825930"
              longitude: "-74.209030"
        wikipedia:
          slug: Michael_Spence
          # A key named for a language, holding a URL.
          english: "https://en.wikipedia.org/wiki/Michael_Spence"
        wikidata:
          id: Q157245
          url: "https://www.wikidata.org/wiki/Q157245"
        links:
          # Version 2, on a record served by 2.1.
          - rel: laureate
            href: "https://api.nobelprize.org/2/laureate/745"
            action: GET
            types: application/json
        nobelPrizes:
          - awardYear: "2001"
            category:
              en: Economic Sciences
              se: Ekonomi
            # A share, as a fraction, in a string.
            portion: "1/3"
            sortOrder: "2"
            dateAwarded: "2001-10-10"
            # Two integers, and no currency named anywhere in the record.
            prizeAmount: 10000000
            prizeAmountAdjusted: 15547541
            affiliations:
              - name:
                  en: Stanford University
                  no: Stanford University
                  se: Stanford University
                # One language, where its sibling above has three.
                nameNow:
                  en: Stanford University
        # The licence, repeated inside the record rather than sent once.
        meta:
          terms: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/"
          license: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/#licence"

conformance:
  - name: a laureate who does not exist is an array of length one
    source: https://api.nobelprize.org/2.1/laureate/999999
    verified: "2026-08-30"
    fixture: nobody
    request:
      method: GET
      path: /2.1/laureate/999999
    expect:
      # Two hundred, an array, one element -- and no laureate in it.
      status: 200
      body:
        "[0].meta.terms": "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/"
      absent:
        # A client reading .length is told yes and finds this undefined.
        - "[0].knownName"
        - "[0].nobelPrizes"

  - name: the language maps have a key in them that is not a language
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # Three languages...
        birth.place.city.en: "Montclair, NJ"
        birth.place.city.no: "Montclair, NJ"
        birth.place.city.se: "Montclair, NJ"
        # ...three more, and an array of URLs sitting among them, so a client
        # iterating the keys as languages hands linked data to a renderer.
        "birth.place.cityNow.sameAs[0]": "https://www.wikidata.org/wiki/Q678437"
        # A latitude and a longitude, as strings, under the same keys a client
        # is iterating for language codes.
        birth.place.cityNow.latitude: "40.825930"
        birth.place.cityNow.longitude: "-74.209030"
        birth.place.cityNow.no: "Montclair, NJ"

  - name: and no two language maps in the record agree on how many
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # Two, on the laureate's own name...
        knownName.en: A. Michael Spence
        knownName.se: A. Michael Spence
        # ...three, on an affiliation's name...
        "nobelPrizes[0].affiliations[0].name.en": Stanford University
        "nobelPrizes[0].affiliations[0].name.no": Stanford University
        "nobelPrizes[0].affiliations[0].name.se": Stanford University
        # ...and one, on its sibling four lines down.
        "nobelPrizes[0].affiliations[0].nameNow.en": Stanford University
      absent:
        # knownName.no is undefined where city.no is not.
        - knownName.no
        - "nobelPrizes[0].affiliations[0].nameNow.se"

  - name: the record links to a different version of the API that served it
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      # Two point one.
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # Two. A client following the link it was given leaves the version it
        # asked for.
        "links[0].href": "https://api.nobelprize.org/2/laureate/745"
        "links[0].rel": laureate
        "links[0].action": GET
        "links[0].types": application/json

  - name: a share of a prize is a fraction in a string
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # A fraction, as text.
        "nobelPrizes[0].portion": "1/3"
        # So is the ordering, and so is the year.
        "nobelPrizes[0].sortOrder": "2"
        "nobelPrizes[0].awardYear": "2001"
        # While the money is an integer, twice, with no currency anywhere.
        "nobelPrizes[0].prizeAmount": 10000000
        "nobelPrizes[0].prizeAmountAdjusted": 15547541
        "nobelPrizes[0].dateAwarded": "2001-10-10"
        "nobelPrizes[0].category.en": Economic Sciences
        "nobelPrizes[0].category.se": Ekonomi

  - name: a date and the year of that date, the year as a string
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # The same fact twice, and the derived one is text.
        birth.date: "1943-11-07"
        birth.year: "1943"
        # An identifier that is all digits and is not a number.
        id: "745"
        gender: male
        fileName: spence
        # A key named for a language, holding a URL, beside a slug.
        wikipedia.slug: Michael_Spence
        wikipedia.english: "https://en.wikipedia.org/wiki/Michael_Spence"
        wikidata.id: Q157245

  - name: every laureate carries its own copy of the licence
    source: https://api.nobelprize.org/2.1/laureate/745
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/laureate/745
    expect:
      status: 200
      body:
        # Repeated inside the record rather than sent once for the response.
        meta.terms: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/"
        meta.license: "https://www.nobelprize.org/about/terms-of-use-for-api-nobelprize-org-and-data-nobelprize-org/#licence"

  - name: a path that does not exist is the only real failure
    source: https://api.nobelprize.org/2.1/nosuchthing
    verified: "2026-08-30"
    fixture: spence
    request:
      method: GET
      path: /2.1/nosuchthing
    expect:
      # The one 404 on the host, and it is HTML.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '<title>Page Not Found</title>'
