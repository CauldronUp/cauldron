# Google Gemini Recipe for Cauldron
#
# Written against the discovery document Google publishes for the Gemini API
# at generativelanguage.googleapis.com/$discovery/rest?version=v1beta -- 217
# schemas -- and quoted from the field descriptions in it.
#
# A blocked prompt is a 200 with the candidates taken away.
#
# Of promptFeedback.blockReason:
#
#   "If set, the prompt was blocked and no candidates are returned. Rephrase
#   the prompt."
#
# So the response still arrives, still with a 200, still with a modelVersion
# and usage metadata -- and the candidates array, the only part anybody reads,
# is not there. Code written the obvious way does
# candidates[0].content.parts[0].text and throws on the first index, and the
# sentence explaining why is in a sibling object called promptFeedback that
# most integrations have never opened.
#
# The OpenAI Recipe here records a relative of this, and the difference is
# worth stating. There a refusal arrives as an ordinary message with
# content: null and the reason in message.refusal, so the read succeeds and
# yields nothing. Here the element is gone, so the read throws. One provider
# hands you a null and the other an exception, for the same event, and neither
# says anything in the status code.
#
# Three more, each from the same document:
#
#   1. An empty finish reason means it has not finished. Of finishReason:
#      "The reason why the model stopped generating tokens. If empty, the
#      model has not stopped generating tokens." One schema serves the
#      streaming call and the ordinary one, so an absent field means work in
#      progress on one endpoint and nothing at all on the other.
#   2. The total counts thinking you never see. totalTokenCount is "Total
#      token count for the generation request (prompt + thoughts + response
#      candidates)", with thoughtsTokenCount beside it as "Number of tokens
#      of thoughts for thinking models". OpenAI's reasoning tokens are the
#      same bargain and are stated as shared rather than claimed here; what
#      is Gemini's own is that the arithmetic is spelled out in the field's
#      own description and is still easy to miss.
#   3. Being cached does not make a prompt smaller. Of promptTokenCount:
#      "When `cached_content` is set, this is still the total effective prompt
#      size" -- so the number a cost model reads does not fall when caching
#      works, and cachedContentTokenCount beside it is the only sign that any
#      of it was cheap.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No model runs, so which outcome a request gets is chosen by a marker
#     word in the prompt rather than by anything a model decided. A prompt
#     mentioning "blocked" gets the blocked shape and one mentioning
#     "thinking" gets the thinking shape. The shapes are the document's; the
#     trigger is this file's, and it exists because an emulator cannot decide
#     what a safety filter would have said.
#   - Each answer is a route constant rather than a stored record, for the
#     same reason: there is nothing to store, and a create that echoed the
#     request would hand back the prompt as though it were the reply.
#   - Streaming is not modelled. streamGenerateContent returns a sequence of
#     partial GenerateContentResponse objects, and an emulator answering one
#     whole body would teach the wrong parse.
#   - Tuning, files, caching, embeddings, batches and the rest of the 217
#     schemas are absent. Generating content, and listing models.
#
# Probed live, unauthenticated, on 2026-09-05, against
# generativelanguage.googleapis.com:
#
#   1. POST .../generateContent with no credential at all answers 403
#      {"error":{"code":403,"message":"Method doesn't allow unregistered
#      callers (callers without established identity). Please use API Key
#      or other form of API consumer identity to call this API.",
#      "status":"PERMISSION_DENIED"}}.
#   2. The same route with an invented key -- tried both as the declared
#      x-goog-api-key header and as the documented ?key= query parameter,
#      identical either way -- answers a completely different failure: 400,
#      not 401, {"error":{"code":400,"message":"API key not valid. Please
#      pass a valid API key.","status":"INVALID_ARGUMENT","details":[...]}}.
#      This file had declared 401 UNAUTHENTICATED for this before the
#      probe; the message was already right and the status line and the
#      status field were both wrong. auth.absent_error below carries the
#      split between an absent key and a wrong one.
#   3. GET .../not-a-real-endpoint and GET on .../generateContent (a real
#      path, wrong method -- the route takes only POST), both with no
#      credential, answer the identical 404 with zero bytes and
#      Content-Type: text/html rather than the JSON envelope every other
#      failure here uses -- reached without the credential mattering,
#      which auth.after_routing below declares.
#
# The key and the ids below are fixtures and belong to no project.

recipe: gemini
capability: ai
version: 0.1.0

upstream:
  api: v1beta
  docs: https://ai.google.dev/api/rest

auth:
  # A bare header of Google's own naming. The same key also travels as a
  # query parameter, which this Recipe does not model.
  scheme: header
  header: x-goog-api-key
  # Struck live: no credential at all names a missing identity and answers
  # 403, a different status and shape from a present-but-invalid key's 400.
  # See the header.
  absent_error: no_api_key
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true
  keys:
    - AIza-cauldron-gemini-fixture-key

responses:
  list:
    style: wrapped
    key: models
  resource:
    style: bare
  error:
    # Google's shape, the same one the Drive Recipe records.
    style: nested
    key: error
    message_field: message
    code_field: status
    status_field: code
    type_field: "-"

resources:
  generation:
    id:
      style: opaque
      field: responseId

  model:
    id:
      style: opaque
      # Gemini calls it name, and its value is a path rather than a word.
      field: name
    fields:
      displayName:
        type: string
      description:
        type: string
      inputTokenLimit:
        type: integer
      outputTokenLimit:
        type: integer

routes:
  # Every generateContent route answers with a route constant rather than an
  # echo of the request: no model runs here, so the canned reply is declared
  # beside the route that serves it, and returns trims the record to the
  # identifier Gemini does send.
  - method: POST
    path: /v1beta/models/{model}:generateContent
    resource: generation
    operation: create
    returns:
      - id
    fields:
      modelVersion: gemini-2.5-flash
      candidates:
        - index: 0
          finishReason: STOP
          content:
            role: model
            parts:
              - text: Water boils at 100 degrees Celsius at sea level.
          safetyRatings:
            - category: HARM_CATEGORY_DANGEROUS_CONTENT
              probability: NEGLIGIBLE
              blocked: false
      promptFeedback:
        safetyRatings:
          - category: HARM_CATEGORY_DANGEROUS_CONTENT
            probability: NEGLIGIBLE
            blocked: false
      usageMetadata:
        promptTokenCount: 12
        candidatesTokenCount: 14
        thoughtsTokenCount: 0
        cachedContentTokenCount: 0
        totalTokenCount: 26

  # A prompt the safety filters refused, chosen by a marker word in the body.
  - method: POST
    path: /v1beta/models/{model}:generateContent
    resource: generation
    operation: create
    selects_body: blocked
    returns:
      - id
    fields:
      modelVersion: gemini-2.5-flash
      promptFeedback:
        blockReason: SAFETY
        safetyRatings:
          - category: HARM_CATEGORY_DANGEROUS_CONTENT
            probability: HIGH
            blocked: true
      usageMetadata:
        promptTokenCount: 9
        totalTokenCount: 9

  # A thinking model that spent most of its budget on thoughts.
  - method: POST
    path: /v1beta/models/{model}:generateContent
    resource: generation
    operation: create
    selects_body: thinking
    returns:
      - id
    fields:
      modelVersion: gemini-2.5-flash
      candidates:
        - index: 0
          finishReason: STOP
          content:
            role: model
            parts:
              - text: The answer is forty-two.
      promptFeedback:
        safetyRatings:
          - category: HARM_CATEGORY_DANGEROUS_CONTENT
            probability: NEGLIGIBLE
            blocked: false
      usageMetadata:
        promptTokenCount: 92
        candidatesTokenCount: 12
        thoughtsTokenCount: 900
        cachedContentTokenCount: 64
        totalTokenCount: 1004

  - method: GET
    path: /v1beta/models
    resource: model
    operation: list
    pagination:
      # pageSize and pageToken, from Google's own models.list reference read
      # 2026-09-05: "50 models will be returned per page" by default and
      # "this method returns at most 1000 models per page", with pageToken
      # "received from a previous models.list call" and the note that "if
      # this field is omitted, there are no more pages".
      #
      # Google's camel-cased spelling again -- the same pair as Google
      # Calendar's maxResults and pageToken, differently named on a
      # different Google API, which is why guessing from the vendor does not
      # work either. Fifty by default rather than ten, and the end of the
      # walk is a **missing field** rather than a null one.
      style: cursor
      limit: 50
      max_limit: 1000
      limit_param: pageSize
      cursor_param: pageToken

errors:
  # Struck live with an invented key, tried both as the declared header and
  # as the documented query parameter. 400, not 401 -- this file's guess
  # before the probe -- and the status field says INVALID_ARGUMENT, not
  # UNAUTHENTICATED. The message was already right.
  authentication_error:
    status: 400
    message: API key not valid. Please pass a valid API key.
    code: INVALID_ARGUMENT
    fields:
      details:
        - "@type": type.googleapis.com/google.rpc.ErrorInfo
          reason: API_KEY_INVALID
          domain: googleapis.com
          metadata:
            service: generativelanguage.googleapis.com
        - "@type": type.googleapis.com/google.rpc.LocalizedMessage
          locale: en-US
          message: API key not valid. Please pass a valid API key.

  # Struck live with no credential at all: a different status and a
  # different sentence from a present-but-wrong key.
  no_api_key:
    status: 403
    message: "Method doesn't allow unregistered callers (callers without established identity). Please use API Key or other form of API consumer identity to call this API."
    code: PERMISSION_DENIED

  # Struck live with no credential at all: the router answers before
  # authentication is ever consulted, which auth.after_routing declares.
  # Zero bytes, Content-Type text/html -- not the JSON envelope every other
  # failure here uses.
  unknown_route:
    status: 404
    empty: true
    headers:
      Content-Type: "text/html"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical empty, HTML-typed 404 an unrouted path
  # gets.
  method_not_allowed:
    status: 404
    empty: true
    headers:
      Content-Type: "text/html"

  resource_missing:
    status: 404
    message: Model not found.
    code: NOT_FOUND

  invalid_request:
    status: 400
    message: Invalid request.
    code: INVALID_ARGUMENT

fixtures:
  empty: {}

  project:
    model:
      - id: models/gemini-2.5-flash
        displayName: Gemini 2.5 Flash
        description: Fast and versatile.
        inputTokenLimit: 1048576
        outputTokenLimit: 65536

# The resource cases below are read from Google's own discovery document
# rather than a real project -- no key for one was ever created. The
# refusal cases carrying a verified date were struck live, unauthenticated,
# against generativelanguage.googleapis.com; see the header.
conformance:
  - name: a blocked prompt answers 200 with the candidates taken away
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: POST
      path: /v1beta/models/gemini-2.5-flash:generateContent
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
      json:
        contents:
          - role: user
            parts:
              - text: a request that gets blocked
    expect:
      status: 200
      body:
        # "If set, the prompt was blocked and no candidates are returned."
        # The response is otherwise complete: a model version, usage, an id.
        "promptFeedback.blockReason": SAFETY
        "promptFeedback.safetyRatings[0].category": HARM_CATEGORY_DANGEROUS_CONTENT
        "promptFeedback.safetyRatings[0].blocked": true
        modelVersion: gemini-2.5-flash
      matches:
        # Gemini calls the identifier responseId, so a client reading .id
        # finds nothing at all.
        responseId: '^.+$'
      absent:
        # And the only part anybody reads is not there at all, so
        # candidates[0] throws rather than yielding null.
        - candidates[0]
        - id

  - name: an ordinary answer has candidates and no block reason
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: POST
      path: /v1beta/models/gemini-2.5-flash:generateContent
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
      json:
        contents:
          - role: user
            parts:
              - text: at what temperature does a kettle boil
    expect:
      status: 200
      body:
        # The other end of the distinction. promptFeedback is present and
        # carries ratings without a blockReason, which is what makes testing
        # for the object's existence useless.
        "candidates[0].content.parts[0].text": Water boils at 100 degrees Celsius at sea level.
        "candidates[0].finishReason": STOP
        "candidates[0].safetyRatings[0].blocked": false
      absent:
        - promptFeedback.blockReason

  - name: a thinking model bills for thoughts that are not in the answer
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: POST
      path: /v1beta/models/gemini-2.5-flash:generateContent
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
      json:
        contents:
          - role: user
            parts:
              - text: a thinking problem that needs working through
    expect:
      status: 200
      body:
        # "Total token count for the generation request (prompt + thoughts +
        # response candidates)". Nine hundred of the thousand are thoughts,
        # and the visible answer is one sentence.
        "usageMetadata.totalTokenCount": 1004
        "usageMetadata.thoughtsTokenCount": 900
        "usageMetadata.candidatesTokenCount": 12
        "candidates[0].content.parts[0].text": The answer is forty-two.

  - name: and an ordinary call reports no thoughts at all
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: POST
      path: /v1beta/models/gemini-2.5-flash:generateContent
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
      json:
        contents:
          - role: user
            parts:
              - text: at what temperature does a kettle boil
    expect:
      status: 200
      body:
        # Present and nought rather than absent, which is why its absence is
        # never what tells you.
        "usageMetadata.thoughtsTokenCount": 0
        "usageMetadata.totalTokenCount": 26

  - name: a cached prompt still counts its whole size
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: POST
      path: /v1beta/models/gemini-2.5-flash:generateContent
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
      json:
        contents:
          - role: user
            parts:
              - text: a thinking problem that needs working through
    expect:
      status: 200
      body:
        # "When `cached_content` is set, this is still the total effective
        # prompt size" -- so promptTokenCount does not fall when caching
        # works, and the field beside it is the only sign that any of it was
        # cheap.
        "usageMetadata.promptTokenCount": 92
        "usageMetadata.cachedContentTokenCount": 64

  - name: the models listing names each model by a path rather than a word
    source: https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta
    fixture: project
    request:
      method: GET
      path: /v1beta/models
      headers:
        x-goog-api-key: AIza-cauldron-gemini-fixture-key
    expect:
      status: 200
      body:
        # The identifier is "models/gemini-2.5-flash", so a client that stores
        # it and interpolates it into a URL produces
        # /v1beta/models/models/gemini-2.5-flash.
        "models[0].name": models/gemini-2.5-flash
        "models[0].inputTokenLimit": 1048576
      absent:
        - models[0].id
        - models[1]

  - name: a key the project does not know is refused
    # Struck live: 400, not 401, and INVALID_ARGUMENT, not UNAUTHENTICATED
    # -- this file's guess before the probe.
    source: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    verified: "2026-09-05"
    fixture: project
    request:
      method: GET
      path: /v1beta/models
      headers:
        x-goog-api-key: AIzaNotThisProjectsKey000000000000000
    expect:
      status: 400
      body:
        "error.status": INVALID_ARGUMENT
        "error.code": 400
        "error.message": API key not valid. Please pass a valid API key.

  - name: no credential at all names a missing identity, not a bad key
    # Struck live. A different status and a different sentence from a
    # present-but-wrong key.
    source: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    verified: "2026-09-05"
    fixture: empty
    request:
      method: POST
      path: "/v1beta/models/gemini-1.5-flash:generateContent"
      json:
        contents:
          - parts:
              - text: hi
    expect:
      status: 403
      body:
        "error.status": PERMISSION_DENIED
        "error.code": 403
      matches:
        "error.message": "unregistered callers"

  - name: a path this API does not route needs no credential either
    # Struck live with no credential at all. The router answers before
    # authentication is ever consulted, which auth.after_routing declares.
    source: https://generativelanguage.googleapis.com/v1beta/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /v1beta/not-a-real-endpoint
    expect:
      status: 404
      no_body: true

  - name: a wrong method on a real path is the identical empty HTML 404
    # GET on generateContent, which this Recipe declares only POST for.
    # Struck live with no credential at all.
    source: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: "/v1beta/models/gemini-1.5-flash:generateContent"
    expect:
      status: 404
      headers:
        Content-Type: "text/html"
      no_body: true
