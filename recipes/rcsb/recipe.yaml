# RCSB Protein Data Bank Recipe for Cauldron
#
# Two of its fields are the letters Y and N, and "N" is true.
#
#   "has_released_experimental_data": "N"
#   "pdb_format_compatible": "Y"
#
# Both are single-character strings where a boolean belongs, and in JavaScript
# the string "N" is truthy. So
#
#   if (entry.rcsb_accession_info.has_released_experimental_data) { ... }
#
# runs the branch for "yes" on an entry that said no, and the same code is
# correct for "Y" -- which is why it survives review. Python's `if "N"` agrees.
# There is no value either field can hold that is falsy.
#
# **And the identifier you get back is not the one you sent.** Ask for 4hhb and
# the record answers "rcsb_id": "4HHB". Ask for a nonsense one and the failure
# says so in capitals too:
#
#   GET /core/entry/4hhb     ->  200  {"rcsb_id": "4HHB", ...}
#   GET /core/entry/notanid  ->  404  {"message": "No data found for entryId: NOTANID"}
#
# A client keying a cache or a map on what it requested misses every hit, and a
# client matching the failure's text against its own input never matches either.
#
# Written against the live API rather than a document: every case below was
# checked against data.rcsb.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Two 404s, two shapes, one host. The application's failure is
#      {"status", "message", "link"}; a path the application never sees gets
#      Spring Boot's default instead -- {"timestamp", "status", "error",
#      "path"} -- which has no message at all. A client reading .message gets
#      the sentence on one and undefined on the other, at the same status, on
#      the same content type.
#   2. The experimental method is sent twice, in two spellings and two cases:
#      exptl[0].method is "X-RAY DIFFRACTION" and
#      rcsb_entry_info.experimental_method is "X-ray". One record, one fact,
#      neither string equal to the other.
#   3. The crystallographic keys keep their CIF capitals among snake_case
#      siblings: cell.Z_PDB sits beside cell.angle_alpha, and symmetry carries
#      Int_Tables_number and space_group_name_H_M. Any client that lower-cases
#      or camel-cases its keys destroys three of them.
#
# And a 1984 deposition brings its punched-card formatting with it: refine[0]
# .details is a block of capitals with newlines wrapped at sixty columns, inside
# a JSON string.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One entry is served, of the Protein Data Bank, and only the parts of it
#     the cases name. The record upstream carries thirty top-level keys.
#   - The Spring failure's timestamp is the moment it was generated. The one
#     recorded here is the moment it was checked, and it does not move; the
#     shape is the finding rather than the figure.
#   - resolution_combined is [1.74], a lone number inside an array, and it is
#     served that way. The array is the provider's, not a modelling choice.

recipe: rcsb
capability: docs
version: 0.1.0

upstream:
  api: v1
  provider: rcsb
  docs: https://data.rcsb.org/redoc/index.html

auth:
  # Public, no key.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"
    # The HTTP status again, inside the body, as a number.
    status_field: status

resources:
  entry:
    id:
      style: opaque
      field: rcsb_id
    fields:
      entry:
        type: map
      struct:
        type: map
      cell:
        type: map
      symmetry:
        type: map
      exptl:
        type: list
      refine:
        type: list
      audit_author:
        type: list
      rcsb_accession_info:
        type: map
      pdbx_database_status:
        type: map
      rcsb_entry_info:
        type: map

routes:
  # Asked in lower case, answered in upper.
  - method: GET
    path: /rest/v1/core/entry/4hhb
    resource: entry
    operation: get
    id_from: auth

  # An entry that does not exist: the application's own failure.
  - method: GET
    path: /rest/v1/core/entry/9ZZZ
    error: no_data

  # And one asked in lower case, refused in upper.
  - method: GET
    path: /rest/v1/core/entry/notanid
    error: no_data_upper_cased

  # A path the application never sees: the framework's failure instead.
  - method: GET
    path: /rest/v1/nosuchthing
    error: spring_not_found

errors:
  no_data:
    status: 404
    message: "No data found for entryId: 9ZZZ"
    fields:
      # A link to the documentation, in the failure.
      link: "https://data.rcsb.org/redoc/index.html"

  no_data_upper_cased:
    status: 404
    # NOTANID, for a request that said notanid.
    message: "No data found for entryId: NOTANID"
    fields:
      link: "https://data.rcsb.org/redoc/index.html"

  spring_not_found:
    status: 404
    # Spring Boot's default body, which carries no message at all.
    message_field: "-"
    fields:
      timestamp: "2026-08-30T14:49:50.774+00:00"
      error: Not Found
      path: /rest/v1/nosuchthing

fixtures:
  empty: {}

  haemoglobin:
    entry:
      # Upper case, for a request that said 4hhb.
      - id: "4HHB"
        entry:
          id: "4HHB"
        struct:
          # Shouted, as deposited in 1984.
          title: THE CRYSTAL STRUCTURE OF HUMAN DEOXYHAEMOGLOBIN AT 1.74 ANGSTROMS RESOLUTION
        cell:
          # CIF capitals, beside snake_case siblings.
          Z_PDB: 4
          angle_alpha: 90.0
          angle_beta: 99.34
          length_a: 63.15
        symmetry:
          Int_Tables_number: 4
          space_group_name_H_M: "P 1 21 1"
        exptl:
          # One spelling of the method...
          - method: X-RAY DIFFRACTION
        refine:
          - ls_d_res_high: 1.74
            # Punched-card formatting, preserved inside a JSON string.
            details: "THE COORDINATES GIVEN HERE ARE IN THE ORTHOGONAL ANGSTROM\nSYSTEM STANDARD FOR HEMOGLOBINS."
        audit_author:
          - name: "Fermi, G."
            pdbx_ordinal: 1
          - name: "Perutz, M.F."
            pdbx_ordinal: 2
        rcsb_accession_info:
          # A boolean written as a letter, and this letter is truthy.
          has_released_experimental_data: "N"
          deposit_date: "1984-03-07T00:00:00.000+00:00"
          initial_release_date: "1984-07-17T00:00:00.000+00:00"
          # A version split across two integers.
          major_revision: 4
          minor_revision: 3
          status_code: REL
        pdbx_database_status:
          # The other letter, and it is truthy too.
          pdb_format_compatible: "Y"
          process_site: BNL
          status_code: REL
        rcsb_entry_info:
          # ...and the other spelling of the same method, in another case.
          experimental_method: X-ray
          # A lone number inside an array.
          resolution_combined:
            - 1.74
          deposited_atom_count: 4779
          deposited_model_count: 1
          polymer_entity_count: 2
          structure_determination_methodology: experimental

conformance:
  - name: two of its fields are the letters Y and N and N is true
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # Not false. The string "N", which every language here treats as true.
        rcsb_accession_info.has_released_experimental_data: "N"
        # And its opposite, spelled the same way.
        pdbx_database_status.pdb_format_compatible: "Y"
        # Beside a status that is a word.
        rcsb_accession_info.status_code: REL
        pdbx_database_status.status_code: REL

  - name: the identifier you get back is not the one you sent
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      # Lower case.
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # Upper case, in both places it appears.
        rcsb_id: "4HHB"
        entry.id: "4HHB"

  - name: and the failure capitalises it too
    source: https://data.rcsb.org/rest/v1/core/entry/notanid
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/notanid
    expect:
      status: 404
      body:
        # NOTANID, for a request that said notanid, so a client matching the
        # message against its own input never matches.
        message: "No data found for entryId: NOTANID"
        status: 404
        link: "https://data.rcsb.org/redoc/index.html"

  - name: an entry that does not exist gets the application's failure
    source: https://data.rcsb.org/rest/v1/core/entry/9ZZZ
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/9ZZZ
    expect:
      status: 404
      body:
        message: "No data found for entryId: 9ZZZ"
        status: 404
        # A documentation link, inside a failure.
        link: "https://data.rcsb.org/redoc/index.html"
      absent:
        # The framework's keys are not here.
        - timestamp
        - error
        - path

  - name: and a path the application never sees gets the framework's
    source: https://data.rcsb.org/rest/v1/nosuchthing
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/nosuchthing
    expect:
      status: 404
      body:
        # Spring Boot's default body, at the same status and content type as
        # the one above, sharing exactly one key with it.
        error: Not Found
        path: /rest/v1/nosuchthing
        status: 404
        timestamp: "2026-08-30T14:49:50.774+00:00"
      absent:
        # No message at all, so a client reading .message finds undefined.
        - message
        - link

  - name: the experimental method is sent twice in two spellings
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # One record, one fact, neither string equal to the other.
        "exptl[0].method": X-RAY DIFFRACTION
        rcsb_entry_info.experimental_method: X-ray
        # And a lone number inside an array.
        "rcsb_entry_info.resolution_combined[0]": 1.74
        rcsb_entry_info.deposited_atom_count: 4779
        rcsb_entry_info.deposited_model_count: 1
        rcsb_entry_info.polymer_entity_count: 2
        rcsb_entry_info.structure_determination_methodology: experimental

  - name: the crystallographic keys keep their CIF capitals
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # Capitals, beside snake_case siblings, in one object.
        cell.Z_PDB: 4
        cell.angle_alpha: 90.0
        cell.angle_beta: 99.34
        cell.length_a: 63.15
        symmetry.Int_Tables_number: 4
        symmetry.space_group_name_H_M: "P 1 21 1"

  - name: a 1984 deposition brings its punched-card formatting with it
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # Capitals and newlines, wrapped at sixty columns, inside JSON.
        "refine[0].details": "THE COORDINATES GIVEN HERE ARE IN THE ORTHOGONAL ANGSTROM\nSYSTEM STANDARD FOR HEMOGLOBINS."
        # A title shouted the same way.
        struct.title: THE CRYSTAL STRUCTURE OF HUMAN DEOXYHAEMOGLOBIN AT 1.74 ANGSTROMS RESOLUTION
        # And an author list in surname-comma-initial.
        "audit_author[0].name": "Fermi, G."
        "audit_author[1].name": "Perutz, M.F."
        "audit_author[1].pdbx_ordinal": 2

  - name: a version split across two integers beside dates with no time
    source: https://data.rcsb.org/rest/v1/core/entry/4hhb
    verified: "2026-08-30"
    fixture: haemoglobin
    request:
      method: GET
      path: /rest/v1/core/entry/4hhb
    expect:
      status: 200
      body:
        # Four point three, as two fields.
        rcsb_accession_info.major_revision: 4
        rcsb_accession_info.minor_revision: 3
        # And dates that carry a time of exactly nothing, with an offset.
        rcsb_accession_info.deposit_date: "1984-03-07T00:00:00.000+00:00"
        rcsb_accession_info.initial_release_date: "1984-07-17T00:00:00.000+00:00"
        pdbx_database_status.process_site: BNL
