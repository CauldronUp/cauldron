# 1Password Connect Recipe for Cauldron
#
# The last Recipe in a group asking whether a secret manager's refusal for
# something that does not exist can be told apart from one the caller may
# not see. 1Password answers it plainly, in its own published words, and
# the more interesting finding here is a different one: its own official
# Go client disagrees with itself about whether a listing hands back
# secrets at all.
#
# **Which surface this models, stated plainly because the brief asks for
# it by name.** 1Password publishes two APIs that could answer this
# group's question and this Recipe models neither of them by talking to a
# live host -- it could not, for two different reasons, and the reasons
# are themselves worth recording:
#
#   - Connect is self-hosted. A customer runs the server themselves --
#     there is no shared connect.example.com any Recipe here could dial,
#     the identical situation recipes/vault/recipe.yaml is in, for the
#     identical reason (a KV store nobody stands up for the public to
#     probe). This Recipe is Connect, and it is written the same way
#     Vault's was: from the provider's own generated-and-hand-maintained
#     client rather than from a live transcript. No case below carries a
#     verified date, and none ever will without a Connect server this
#     Recipe would have to stand up itself.
#   - Service Accounts is my.1password.com, and IS a shared host -- but
#     creating a service account needs a 1Password account, which Step 2's
#     own instructions rule out ("Do not sign up"). Its wire shape is not
#     modelled here at all.
#
# So: Connect, not Service Accounts, and documented rather than observed,
# for two unrelated reasons that happen to produce the same outcome. Its
# own API is "the documented one" in a specific sense worth being precise
# about: connect-api-reference itself is prose with worked JSON examples,
# not a fetchable OpenAPI document (see the fidelity gaps below), but
# github.com/1Password/connect-sdk-go is real, hand-written, MIT-licensed
# Go source that every one of this Recipe's routes, statuses and field
# names is read from directly -- client.go for the paths and status codes,
# onepassword/{items,vaults,files,errors}.go for the wire shapes. Compare
# recipes/vault/recipe.yaml's own header, which reads hashicorp/
# vault-client-go's *generated* client for the same purpose; this one is
# hand-written throughout, and it is more informative for exactly that
# reason -- a generated client cannot disagree with itself, and this one
# does (see below).
#
# **A listing and a single read are not the same shape, on record in
# 1Password's own words, and the vendor's own Go client contradicts itself
# about which one a caller is holding.** connect-api-reference states the
# list endpoint "Returns an array of Item objects that don't include
# sections and fields" where the single-item endpoint "Returns an Item
# object" in full -- so GET /v1/vaults/{v}/items hands back titles,
# categories, tags and timestamps and nothing a caller could call a
# secret, while GET /v1/vaults/{v}/items/{i} hands back the same item with
# its sections and fields (the actual field values -- usernames,
# passwords, concealed notes) attached. One token authorises both calls;
# nothing in Connect's access-token model scopes "list names" apart from
# "read values" the way this group's question asks after -- stated as an
# absence rather than served as a permission this Recipe never observed,
# the same reading recipes/vault/recipe.yaml gives Vault's own missing
# metadata-only credential.
#
# What makes this worth recording rather than merely noting is that
# connect-sdk-go's own client.go gets it wrong on one of its two code
# paths. GetItems() decodes the listing straight into []onepassword.Item
# and returns it as though every item were complete. GetItemsByTitle(),
# forty lines below it in the same file, decodes the identical listing
# into a variable it names itemSummaries and then calls GetItem() again,
# once per result, specifically to fetch "the real one" -- its own words
# are gone from the comments but the re-fetch loop says the same thing a
# comment would. Two functions, one official client, one real distinction
# between a name and a secret, and only one of the two functions accounts
# for it. Code written against GetItems() reads item.fields on a
# response that was never going to carry any and finds nil, silently, on
# every item in every vault, in the SDK 1Password itself publishes.
#
# **Absent and rejected are one sentence, and 1Password says so instead of
# leaving a Recipe to infer it.** connect-api-reference's own worked
# example for a 401 is {"status": 401, "message": "Invalid or missing
# token"} -- the vendor's own wording names both verdicts inside one
# sentence, so absent_error and rejected_error below name the identical
# errors entry on purpose, which is the collapse Step 2a asks a Recipe to
# state plainly rather than force apart. Not-found is a different status
# and a different sentence: {"status": 404, "message": "Item not found"}.
# So the two questions this group exists to ask have two different
# answers on the one provider in it that publishes worked text for both:
# missing-versus-wrong collapses to one message, and does-not-exist is
# genuinely a different one -- distinguishable by status code alone, which
# is the coarsest way to be distinguishable and still counts.
#
# **The identifier 1Password calls a UUID is not one, and its own worked
# examples say so before any Go regex does.** "The UUID of the item," in
# connect-api-reference's own words, next to a worked value of
# "2fcbqwe9ndg175zg2dzwftvkpa" -- twenty-six lowercase letters and digits,
# no hyphens, not RFC 4122 shaped in any way. connect-sdk-go's own
# isValidUUID doesn't call New4122 or anything like it either: it is
# `regexp.MustCompile("^[a-z0-9]{26}$")`, a hand-written pattern that
# matches what the wire actually sends and not what the field is named
# after. Every id.style below is opaque rather than uuid for this exact
# reason: this format's uuid style would be describing a shape 1Password's
# own client already knows is fiction. Section ids break the pattern
# again, back the other way -- "95cdbc3b-7742-47ec-9056-44d6af82d562" in
# the same worked example, a real RFC 4122 UUID sitting one level down
# from an item id that only looks like the word.
#
# **A response header the reference page never mentions is read by the
# reference client on every file call, and its own absence is treated as
# a fact about the server rather than an error.** connect/version.go:
# 1Password-Connect-Version arrives on Connect's responses from 1.3.0
# onward, and GetFile/GetFiles/GetFileContent all call
# expectMinimumConnectVersion before trusting the response. What happens
# when the header is missing is in the client's own comment: "The last
# version without the version header was v1.2.0" -- so a missing header is
# read as a fact about the server's age, not a transport failure, and the
# call is allowed to proceed as though talking to Connect 1.2.0. What
# happens when the header is present and unparseable is quieter still --
# parseServerVersion's error is swallowed by expectMinimumConnectVersion's
# own "return nil // Return gracefully if server version cannot be
# determined reliably," so a malformed version string waves the call
# through with no gate applied at all, which is the opposite failure mode
# from refusing: a caller who put something odd in front of Connect
# (a proxy stripping or rewriting the header) gets file downloads that
# silently stop being version-gated rather than a call that fails loudly.
# Not modelled as a route -- see the fidelity gaps -- because nothing here
# is a claim about what Connect the SERVER sends when its own header is
# absent or malformed; it is a claim about what the CLIENT does in either
# case, and Cauldron emulates the former.
#
# **Two statuses that are not the ones a REST convention would predict.**
# client.go's own parseResponse calls: creating an item expects
# http.StatusOK, not 201 -- POST answers 200 the same way GET does, on the
# provider's own hand-written assertion of what it sends back. Deleting
# one expects http.StatusNoContent with a nil result, so a client calling
# .json() on a successful delete throws, the same shape
# recipes/vault/recipe.yaml's KV v1 write answers with for an unrelated
# reason.
#
# **Versioning exists as a field and not as a route.** Item.Version is a
# plain incrementing int, "version,omitempty" in the client's own struct
# tag, and nothing in connect-sdk-go reads it back to guard a write the
# way commercetools' version_field does elsewhere in this collection --
# no version-conflict error, no requirement to echo it, and no endpoint
# anywhere in client.go that takes a version number as a parameter. So
# this Recipe declares the field and declares no version_field, no
# version_conflict and no route that fetches an old one: a number that
# moves and cannot be asked for by name, stated as such rather than
# fitted to a mechanism 1Password's own client gives no evidence of using.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Every case below carries source and no verified date. See the
#     header's opening section for why, and contrast
#     recipes/doppler/recipe.yaml and recipes/bitwarden/recipe.yaml in
#     this same group, both hosts real enough to strike live.
#   - No upstream.spec. connect-api-reference is prose with embedded JSON
#     examples on a Mintlify-style docs site, not a fetchable OpenAPI
#     document at a stable URL the way together/recipe.yaml's is --
#     the same shape of gap recipes/bitwarden/recipe.yaml states for
#     api.bitwarden.com's own claimed-but-unlocatable spec, arrived at
#     independently.
#   - Routing-versus-credential order (auth.after_routing) is not
#     declared, and could not be tested at all -- there is no live Connect
#     server this Recipe could send an unrouted path or a wrong method to
#     and watch which one wins. Left at this format's default rather than
#     guessed from either provider's neighbouring behaviour.
#   - Only vaults and items are modelled -- get, list, create, update,
#     delete for items; get and list for vaults. Files are declared as a
#     nested field on an item's own record (matching the worked example
#     verbatim) but have no routes of their own: GetFiles, GetFile and the
#     raw content_path download are all real, documented, and left out,
#     because the version-header story above is a claim about client
#     behaviour rather than server response shape and this Recipe has
#     nothing else to say about file bytes it never held.
#   - No worked example exists for a vault that does not exist, a
#     malformed (present but not 26-characters) token, or an item create/
#     update/delete response body beyond the status code client.go
#     itself asserts -- none of those are guessed at.
#   - Minted ids are mixed case, not lowercase-only. id.style opaque draws
#     from Cauldron's own general alphabet (0-9, a-z, A-Z), and this
#     format has no lowercase-only variant to declare instead, so a newly
#     created item's id is 26 characters the way a real one is and not
#     drawn from the same narrower alphabet isValidUUID actually checks.
#     Stated rather than served as though it were exact.
#   - Concealed field values from connect-api-reference's own worked
#     example (a password, a recovery key, a password history array) are
#     deliberately not reproduced below, even though they are 1Password's
#     own long-published documentation fixture and not a real secret by
#     any account. Only the one non-secret field (username: wendy) and
#     the field-level shape (id, type, purpose, label, value,
#     passwordDetails) are kept; recipes/vault/recipe.yaml's own fixture
#     password is named "not-a-real-password" for the identical instinct.
#
# The token, vault id, item id and section id below are 1Password's own
# published documentation fixtures and belong to no real Connect
# deployment.

recipe: 1password
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.1password.com/docs/connect/connect-api-reference/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN
  # "Invalid or missing token" -- 1Password's own sentence for both
  # verdicts at once. See the header.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized

responses:
  resource:
    style: bare
  error:
    # {"status": 401, "message": "..."} -- flat, two fields, the vendor's
    # own worked examples for both a 401 and a 404.
    style: flat
    code_field: "-"
    status_field: status
    message_field: message

resources:
  vault:
    id:
      # Not id.style uuid -- see the header.
      style: opaque
      length: 26
    fields:
      name:
        type: string
      attribute_version:
        type: integer
        as: attributeVersion
      content_version:
        type: integer
        as: contentVersion
      items:
        type: integer
      type:
        type: string
      created_at:
        type: datetime
        as: createdAt
      updated_at:
        type: datetime
        as: updatedAt

  # The list shape -- connect-api-reference's own words, "don't include
  # sections and fields." Everything else on an Item, per client.go's
  # single shared struct, is assumed present on both; only the two named
  # fields are the declared difference.
  item_summary:
    collection: items
    id:
      style: opaque
      length: 26
    fields:
      title:
        type: string
      tags:
        type: list
      category:
        type: string
      vault_id:
        type: string
        in: vault
        as: id
      created_at:
        type: datetime
        as: createdAt
      updated_at:
        type: datetime
        as: updatedAt

  # The single-read shape. sections, fields and files are declared as
  # opaque lists rather than decomposed field by field -- a field's own
  # shape varies by type (a CONCEALED field carries passwordDetails, a
  # STRING one does not), which is the same reasoning
  # recipes/route.go gives WooCommerce's meta_data for staying a list
  # rather than a typed object.
  item:
    collection: items
    id:
      style: opaque
      length: 26
    fields:
      title:
        type: string
      tags:
        type: list
      category:
        type: string
      vault_id:
        type: string
        in: vault
        as: id
      sections:
        type: list
      fields:
        type: list
      # content_path inside each entry breaks camelCase on purpose -- see
      # files.go's own struct tag. Declared here as part of the opaque
      # list rather than its own resource, because no route below fetches
      # a file on its own -- see the fidelity gaps.
      files:
        type: list
      created_at:
        type: datetime
        as: createdAt
      updated_at:
        type: datetime
        as: updatedAt

routes:
  - method: GET
    path: /v1/vaults
    resource: vault
    operation: list
    list:
      # A bare array -- client.go decodes straight into []onepassword.Vault
      # with no wrapper of any kind.
      style: bare
    # No page-size or cursor parameter appears anywhere in client.go --
    # a Connect deployment's own vault count is small enough that nothing
    # here paginates. "-" says so rather than inventing a limit.
    pagination:
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v1/vaults/{id}
    resource: vault
    operation: get

  - method: GET
    path: /v1/vaults/{vault_id}/items
    resource: item_summary
    operation: list
    scope: [vault_id]
    list:
      style: bare
    pagination:
      limit_param: "-"
      cursor_param: "-"

  - method: GET
    path: /v1/vaults/{vault_id}/items/{id}
    resource: item
    operation: get
    scope: [vault_id]

  - method: POST
    path: /v1/vaults/{vault_id}/items
    resource: item
    operation: create
    scope: [vault_id]
    # client.go's own parseResponse asserts http.StatusOK for a create --
    # not 201. See the header.
    status: 200

  - method: PUT
    path: /v1/vaults/{vault_id}/items/{id}
    resource: item
    operation: update
    scope: [vault_id]
    status: 200

  - method: DELETE
    path: /v1/vaults/{vault_id}/items/{id}
    resource: item
    operation: delete
    scope: [vault_id]
    # client.go's own parseResponse asserts http.StatusNoContent with a
    # nil result -- no body at all, not even an empty object.
    status: 204
    empty_body: true

errors:
  unauthorized:
    status: 401
    message: "Invalid or missing token"

  resource_missing:
    status: 404
    message: "Item not found"

fixtures:
  empty: {}

  store:
    vault:
      - id: ftz4pm2xxwmwrsd7rjqn7grzfz
        name: Demo
        attribute_version: 1
        content_version: 72
        items: 7
        type: USER_CREATED
        created_at: "2021-04-10T17:34:26Z"
        updated_at: "2021-04-13T14:33:50Z"

    item_summary:
      - id: 2fcbqwe9ndg175zg2dzwftvkpa
        title: Secrets Automation Item
        tags:
          - connect
        category: LOGIN
        vault_id: ftz4pm2xxwmwrsd7rjqn7grzfz
        created_at: "2021-04-10T17:20:05.98944527Z"
        updated_at: "2021-04-13T17:20:05.989445411Z"

    item:
      - id: 2fcbqwe9ndg175zg2dzwftvkpa
        title: Secrets Automation Item
        tags:
          - connect
        category: LOGIN
        vault_id: ftz4pm2xxwmwrsd7rjqn7grzfz
        # Only the one non-secret field from 1Password's own worked
        # example -- see the header's fidelity gap for what is
        # deliberately left out.
        sections:
          - id: 95cdbc3b-7742-47ec-9056-44d6af82d562
            label: Security Questions
        fields:
          - id: username
            type: STRING
            purpose: USERNAME
            label: username
            value: wendy
        files:
          - id: 6r65pjq33banznomn7q22sj44e
            name: testfile.txt
            size: 35
            content_path: v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items/2fcbqwe9ndg175zg2dzwftvkpa/files/6r65pjq33banznomn7q22sj44e/content
        created_at: "2021-04-10T17:20:05.98944527Z"
        updated_at: "2021-04-13T17:20:05.989445411Z"

conformance:
  - name: a vault lists as a bare array, not an envelope
    source: https://raw.githubusercontent.com/1Password/connect-sdk-go/main/connect/client.go
    fixture: store
    request:
      method: GET
      path: /v1/vaults
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 200
      body:
        "[0].id": ftz4pm2xxwmwrsd7rjqn7grzfz
        "[0].name": Demo

  - name: a single vault answers the full record, including counts the listing never claimed
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: store
    request:
      method: GET
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 200
      body:
        id: ftz4pm2xxwmwrsd7rjqn7grzfz
        contentVersion: 72
        items: 7

  - name: listing a vault's items omits sections and fields entirely
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: store
    request:
      method: GET
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 200
      body:
        "[0].id": 2fcbqwe9ndg175zg2dzwftvkpa
        "[0].title": Secrets Automation Item
      absent:
        - "[0].sections"
        - "[0].fields"

  - name: and reading that same item by id answers the fields the listing never carried
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: store
    request:
      method: GET
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items/2fcbqwe9ndg175zg2dzwftvkpa
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 200
      body:
        id: 2fcbqwe9ndg175zg2dzwftvkpa
        "sections[0].label": Security Questions
        "fields[0].value": wendy

  - name: a missing or wrong token answers one sentence naming both
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: empty
    request:
      method: GET
      path: /v1/vaults
    expect:
      status: 401
      body:
        status: 401
        message: "Invalid or missing token"

  - name: and a syntactically fine bearer token nobody issued answers the identical sentence
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: empty
    request:
      method: GET
      path: /v1/vaults
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.junktokenjunktokenjunktoken.junk"
    expect:
      status: 401
      body:
        message: "Invalid or missing token"

  - name: an item that does not exist is a different status and a different sentence
    source: https://www.1password.dev/connect/connect-api-reference/
    fixture: store
    request:
      method: GET
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items/nosuchitem00000000000000x
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 404
      body:
        status: 404
        message: "Item not found"

  - name: creating an item answers 200, not 201
    source: https://raw.githubusercontent.com/1Password/connect-sdk-go/main/connect/client.go
    fixture: store
    request:
      method: POST
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
      json:
        title: New Item
        category: LOGIN
    expect:
      status: 200
      body:
        title: New Item
        # Minted rather than echoed -- the request sent no id and no
        # vault, and both come back stamped: an opaque 26-character id
        # this Recipe generated, and the vault the path itself named.
        "vault.id": ftz4pm2xxwmwrsd7rjqn7grzfz
      matches:
        # Mixed case, not lowercase-only -- see the header's fidelity gap.
        # Cauldron's opaque id style has no lowercase-only variant, so a
        # minted id here is 26 characters the way a real one is and not
        # byte-for-byte the same alphabet.
        id: "^[A-Za-z0-9]{26}$"

  - name: deleting an item answers 204 with no body at all
    source: https://raw.githubusercontent.com/1Password/connect-sdk-go/main/connect/client.go
    fixture: store
    request:
      method: DELETE
      path: /v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items/2fcbqwe9ndg175zg2dzwftvkpa
      headers:
        Authorization: "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 204
      no_body: true

  # The names. This Recipe declares 5 field(s) on a item that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an item carries the field names this Recipe declares"
    source: "https://www.1password.dev/connect/connect-api-reference/"
    fixture: store
    request:
      method: GET
      path: "/v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items/2fcbqwe9ndg175zg2dzwftvkpa"
      headers:
        "Authorization": "Bearer eyJhbGciOiJFUzI1NiIsImtpZCI6ImNhdWxkcm9uLWZpeHR1cmUifQ.CAULDRON-FIXTURE-NOT-A-REAL-CONNECT-TOKEN"
    expect:
      status: 200
      body:
        "category": "LOGIN"
        "createdAt": "2021-04-10T17:20:05.98944527Z"
        "tags[0]": "connect"
        "updatedAt": "2021-04-13T17:20:05.989445411Z"

  # The names. This Recipe declares 4 field(s) on a item_summary that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an item_summary carries the field names this Recipe declares"
    source: "https://www.1password.dev/connect/connect-api-reference/"
    fixture: store
    request:
      method: GET
      path: "/v1/vaults/ftz4pm2xxwmwrsd7rjqn7grzfz/items"
      headers:
