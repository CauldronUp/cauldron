# Clerk Recipe for Cauldron
#
# Authentication is the worst thing to test against a live service. Clerk's
# development instance is real infrastructure with real rate limits, real
# emails, and a user list that fills with test accounts nobody cleans up. It
# also cannot be driven from CI without shipping a secret key into the runner.
#
# Two things this Recipe insists on:
#
#   1. Timestamps are Unix milliseconds. Code that divides by a thousand when
#      it should not, or fails to when it should, lands in 1970 or in the year
#      55000, and a seconds-only fake makes both mistakes look correct.
#   2. Failures are an array with a trace id beside it, not inside it. The
#      trace id belongs to the response; the errors belong to the fields that
#      caused them, which is how a signup form maps a failure back to an input.
#
# Keys below are fixtures, not secrets.

recipe: clerk
capability: auth
version: 0.1.0

upstream:
  api: "2024-10-01"
  docs: https://clerk.com/docs/reference/backend-api
  spec: https://clerk.com/openapi.json
  spec_hash: c463e20ba9492dcec8a7a88d752b179025e2200bb94bc8b0806d24711ad360a7
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_test_cauldron

responses:
  list:
    # A bare array, which is what Clerk's user and session listings send.
    # This said wrapped with a total_count beside it, and two conformance
    # cases asserted that shape -- one of them named for it -- so code
    # written here read response.data.map(...) and would have received an
    # array from the real API, where .data is undefined.
    #
    # The organisation listing really is {data, total_count}, and it now says
    # so on the route itself.
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    code_field: code
    # Beside the array, not inside it. The trace id identifies the request.
    fields:
      clerk_trace_id: cauldron00000000000000000000000

resources:
  user:
    collection: data
    constants:
      object: user
    id:
      prefix: user_
      length: 27
    fields:
      first_name:
        type: string
      last_name:
        type: string
      username:
        type: string
      primary_email_address_id:
        type: string
      banned:
        type: boolean
        default: false
      locked:
        type: boolean
        default: false
      two_factor_enabled:
        type: boolean
        default: false
      created_at:
        type: timestamp_ms
      updated_at:
        type: timestamp_ms
      last_sign_in_at:
        type: timestamp_ms

  organization:
    collection: data
    constants:
      object: organization
    id:
      prefix: org_
      length: 27
    fields:
      name:
        type: string
        required: true
      slug:
        type: string
      members_count:
        type: integer
        default: 1
      max_allowed_memberships:
        type: integer
        default: 5
      created_at:
        type: timestamp_ms
      updated_at:
        type: timestamp_ms

  session:
    collection: data
    constants:
      object: session
    id:
      prefix: sess_
      length: 27
    fields:
      user_id:
        type: string
        required: true
      status:
        type: string
        default: active
      last_active_at:
        type: timestamp_ms
      expire_at:
        type: timestamp_ms
      abandon_at:
        type: timestamp_ms
      created_at:
        type: timestamp_ms

routes:
  - method: GET
    path: /v1/users
    resource: user
    operation: list
    pagination:
      # Checked against Clerk's own OpenAPI description: limit and offset in
      # the query, both defaulting to ten and nought. offset counts records,
      # and it was not read at all while no style was declared, so every
      # request answered with the first page.
      style: offset
      limit: 10
      limit_param: limit
      cursor_param: offset

  - method: POST
    path: /v1/users
    resource: user
    operation: create

  - method: GET
    path: /v1/users/{id}
    resource: user
    operation: get

  - method: PATCH
    path: /v1/users/{id}
    resource: user
    operation: update

  - method: DELETE
    path: /v1/users/{id}
    resource: user
    operation: delete
    # Clerk answers 200 with a receipt rather than 204 with nothing. Its own
    # description declares a shared DeletedObject response on this path, and
    # this Recipe was defaulting to the empty 204 that most providers send.
    deleted_body: receipt

  - method: GET
    path: /v1/organizations
    resource: organization
    operation: list
    # The one listing here that is wrapped. Clerk's users and sessions answer
    # with bare arrays and its organisations with {data, total_count}, so a
    # Recipe-wide envelope had to be wrong about one of the three. It was
    # wrong about this one until a route could carry its own shape.
    list:
      style: wrapped
      key: data
      count_field: total_count
    pagination:
      # Checked against Clerk's own OpenAPI description: limit and offset in
      # the query, both defaulting to ten and nought. offset counts records,
      # and it was not read at all while no style was declared, so every
      # request answered with the first page.
      style: offset
      limit: 10
      limit_param: limit
      cursor_param: offset

  - method: POST
    path: /v1/organizations
    resource: organization
    operation: create

  - method: GET
    path: /v1/organizations/{id}
    resource: organization
    operation: get

  - method: GET
    path: /v1/sessions
    resource: session
    operation: list
    pagination:
      # Checked against Clerk's own OpenAPI description: limit and offset in
      # the query, both defaulting to ten and nought. offset counts records,
      # and it was not read at all while no style was declared, so every
      # request answered with the first page.
      style: offset
      limit: 10
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /v1/sessions/{id}
    resource: session
    operation: get

webhooks:
  # Clerk delivers these through Svix, signed with a versioned scheme.
  events:
    - user.created
    - user.updated
    - user.deleted
    - session.created
    - session.ended
    - session.revoked
    - organization.created
    - organizationMembership.created
  # The record is at data. Not data.object -- one word shorter than the
  # default envelope, which is the worst possible distance: a handler written
  # against the default reads data.object and gets undefined rather than an
  # error, on a Recipe whose whole subject is who is signed in.
  #
  # object: "event" is beside it and says what the envelope is, which is
  # Stripe's word for the same idea in a different place.
  payload:
    object: event
    type: "{event}"
    # Svix delivers these and Clerk stamps milliseconds.
    timestamp: "{created_ms}"
    instance_id: ins_cauldron00000000000001
    data:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: svix-signature
    secret: whsec_cauldron

errors:
  rate_limit:
    status: 429
    code: rate_limit_exceeded
    message: Rate limit exceeded
    headers:
      Retry-After: "5"

  authentication_error:
    status: 401
    code: authentication_invalid
    message: The provided secret key is invalid

  resource_missing:
    status: 404
    code: resource_not_found
    message: "Resource not found: {detail}"

  parameter_missing:
    status: 422
    code: form_param_missing
    message: "{detail} must be included"

  # The failures a signup flow has to handle and a live instance makes
  # awkward to reproduce on demand.
  identifier_exists:
    status: 422
    code: form_identifier_exists
    message: That email address is taken. Please try another.

  password_pwned:
    status: 422
    code: form_password_pwned
    message: Password has been found in an online data breach. For account safety, please use a different password.

  session_expired:
    status: 401
    code: session_expired
    message: Session has expired

fixtures:
  empty: {}

  small-instance:
    user:
      - id: user_000000000000000000000001
        first_name: Ada
        last_name: Lovelace
        username: ada
        two_factor_enabled: true
      - id: user_000000000000000000000002
        first_name: Grace
        last_name: Hopper
        username: grace
      - id: user_000000000000000000000003
        first_name: Banned
        last_name: Account
        username: banned
        banned: true
    organization:
      - id: org_000000000000000000000001
        name: Analytical Engines
        slug: analytical-engines
        members_count: 2
    session:
      - id: sess_00000000000000000000001
        user_id: user_000000000000000000000001
        status: active

# Conformance cases, read from Clerk's Backend API reference rather than
# observed against a live instance. The verify report says so.
conformance:
  - name: timestamps are Unix milliseconds, not seconds
    source: https://clerk.com/docs/reference/backend-api/tag/Users
    fixture: empty
    request:
      method: POST
      path: /v1/users
      headers:
        Authorization: Bearer sk_test_cauldron
      json:
        first_name: Alan
        last_name: Turing
    expect:
      status: 200
      body:
        object: user
        first_name: Alan
        banned: false
      matches:
        # Thirteen digits, not ten. Code that divides by a thousand when it
        # should not lands in 1970; code that fails to lands in year 55000.
        created_at: '^[0-9]{13}$'
        id: '^user_[A-Za-z0-9]{27}$'

  - name: a user listing is a bare array, with no envelope to unwrap
    source: https://clerk.com/docs/reference/backend-api/tag/Users
    fixture: small-instance
    request:
      method: GET
      path: /v1/users
      query:
        limit: "2"
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        '[0]':
          username: ada
          object: user
      absent:
        - '[2]'
        # No envelope and no count. Clerk sends the array itself, so .data is
        # undefined and there is nothing to read a total from -- the count
        # lives at /v1/users/count, which is a separate request.
        - data
        - total_count
        - results

  - name: failures are an array with the trace id beside it
    source: https://clerk.com/docs/reference/backend-api/errors
    fixture: small-instance
    request:
      method: GET
      path: /v1/users/user_doesnotexist
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 404
      body:
        errors[0].code: resource_not_found
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        errors[0].message: '.'
        clerk_trace_id: '^cauldron[0-9]+$'
      # The trace id identifies the request, so it does not belong inside a
      # single failure.
      absent:
        - errors[0].clerk_trace_id
        - error
        - message

  - name: a bad secret key is refused with the same array shape
    source: https://clerk.com/docs/reference/backend-api/authentication
    request:
      method: GET
      path: /v1/users
    expect:
      status: 401
      body:
        errors[0].code: authentication_invalid

  - name: every object says what it is
    source: https://clerk.com/docs/reference/backend-api/tag/Organizations
    fixture: small-instance
    request:
      method: GET
      path: /v1/organizations/org_000000000000000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        object: organization
        name: Analytical Engines
        members_count: 2

  - name: a banned user is still returned, flagged rather than hidden
    source: https://clerk.com/docs/reference/backend-api/tag/Users
    fixture: small-instance
    request:
      method: GET
      path: /v1/users/user_000000000000000000000003
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        object: user
        banned: true
        locked: false

  - name: sessions carry the status a guard has to check
    source: https://clerk.com/docs/reference/backend-api/tag/Sessions
    fixture: small-instance
    request:
      method: GET
      path: /v1/sessions
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        '[0]':
          object: session
          status: active
          user_id: user_000000000000000000000001
      matches:
        '[0].created_at': '^[0-9]{13}$'

  - name: deleting a user answers with a receipt, not nothing
    source: https://clerk.com/docs/reference/backend-api/tag/Users#operation/DeleteUser
    fixture: small-instance
    request:
      method: DELETE
      path: /v1/users/user_000000000000000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      # 200 with a DeletedObject, not the 204 with nothing that most providers
      # send. Clerk's own description declares it, and this Recipe was on the
      # empty default until that was checked.
      status: 200
      body:
        id: user_000000000000000000000001
        deleted: true
      absent:
        - first_name
        - username

  - name: users page by limit and offset, and offset counts records
    # limit happened to be the name the runtime already guessed, so the page
    # size looked like it worked. offset was never read while no style was
    # declared, so every request answered with the first page and a loop that
    # asks for the next offset never moved.
    source: https://raw.githubusercontent.com/clerk/openapi-specs/main/bapi/2024-10-01.yml
    fixture: small-instance
    request:
      method: GET
      path: /v1/users
      headers:
        Authorization: Bearer sk_test_cauldron
      query:
        limit: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # The second user, because offset counts records rather than pages.
        '[0]':
          first_name: Grace
      absent:
        - '[1]'

  - name: the organisation listing is wrapped where the user listing is not
    # Three listings in one API and they do not share a shape. Users and
    # sessions answer with bare arrays; organisations answer with data and a
    # total beside it. A client that learns one shape here and applies it to
    # the others reads .data off an array, or .map off an object.
    source: https://raw.githubusercontent.com/clerk/openapi-specs/main/bapi/2024-10-01.yml
    fixture: small-instance
    request:
      method: GET
      path: /v1/organizations
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        data[0].name: Analytical Engines
        total_count: 1
      absent:
        # Not a bare array, unlike the two listings beside it.
        - '[0]'

  - name: the record is at data, one word short of where the default puts it
    source: https://clerk.com/docs/webhooks/overview
    fixture: small-instance
    request:
      method: POST
      path: /v1/users
      headers:
        Authorization: Bearer sk_test_cauldron
      json:
        email_address:
          - grace@example.com
    expect:
      status: 200
      webhook:
        event: user.created
        body:
          # The envelope's own discriminator...
          object: event
          # ...and the record's, which is a different word at a path a
          # handler written against the default envelope would read as the
          # record itself. data.object is not missing here. It is the string
          # "user", so data.object.id is undefined rather than absent, and
          # nothing about that failure points at the envelope.
          data.object: user
          type: user.created
        matches:
          data.id: '^user_'
          timestamp: '^[0-9]{13}$'
        absent:
          - data.object.id

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads"
    source: "https://clerk.com/docs/reference/backend-api/tag/Users"
    fixture: small-instance
    request:
      method: GET
      path: "/v1/users"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "user_000000000000000000000002"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads on v1 users"
    source: "https://clerk.com/docs/reference/backend-api/tag/Users"
    fixture: small-instance
    request:
      method: GET
      path: "/v1/users"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "user_000000000000000000000002"
      absent:
        - "[1]"
