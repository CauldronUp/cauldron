# MaxMind Recipe for Cauldron
#
# See ipinfo/recipe.yaml for the header this group of three Recipes shares:
# an IP geolocation is a guess with a confidence, and the question is
# whether the wire ever admits that. MaxMind is the one provider in the
# group whose own documentation answers "yes" in exact, numbered terms --
# and the one provider in the group this Recipe could never once observe
# succeeding, because every route on both of its hosts is paywalled from
# the first byte. No account was created and no license key was ever
# requested, guessed or used. What follows is either struck live against a
# credential this Recipe does not hold, or read from
# dev.maxmind.com/geoip/docs/web-services -- fetched directly and read as
# text, not summarised -- and the two are never confused below.
#
# **Two hosts, one gateway, one vocabulary of failure -- confirmed the same
# way HERE's Recipe confirms it for geocode.search.hereapi.com and
# router.hereapi.com.** geoip.maxmind.com (GeoIP2 Precision, the geolocation
# product this Recipe routes) and minfraud.maxmind.com (fraud-risk scoring,
# a different resource shape this Recipe does not route at all) answer the
# identical AUTHORIZATION_INVALID sentences, byte for byte except for the
# www-authenticate realm:
#
#   GET  geoip.maxmind.com/geoip/v2.1/city/8.8.8.8      (no cred) -> 401 {"code":"AUTHORIZATION_INVALID","error":"An account ID and license key are required to use this service."}
#   POST minfraud.maxmind.com/minfraud/v2.0/insights    (no cred) -> 401, byte-identical error body, www-authenticate: Basic realm="minfraud" (geoip's says realm="geoip2")
#
# Both products are Cloudflare-fronted, both answer a wrong method with a
# real 405 and an Allow header naming the methods that path actually has,
# and both answer an unrouted path with generic Cloudflare HTML rather than
# either product's own JSON envelope -- see below. minfraud accepts a
# request body and answers a fraud score rather than a location, which is a
# different enough resource that modelling it as routes here would blur
# what this Recipe is about; its auth and routing mechanics are recorded
# above as evidence because they are identical to the product this Recipe
# does route, the same reasoning HERE's Recipe gives for router.hereapi.com.
#
# **Absent and malformed collapse to one sentence; wrong is a second and
# different one -- the split this whole group of Recipes keeps checking
# for, and MaxMind lands on the boring side of it once you separate the
# three verdicts precisely.** Three requests, same path, same date:
#
#   (no Authorization header at all)                    -> 401 "An account ID and license key are required to use this service."
#   Authorization: Basic ###not-base64###                -> 401, byte-identical to the line above
#   Authorization: Basic <valid base64, wrong account>    -> 401 "Your account ID or license key could not be authenticated."
#
# A header that cannot even be parsed as Basic gets exactly the sentence an
# absent header gets -- not a third, sharper one -- so this Recipe leaves
# auth.malformed_error unset and lets it fall through to the same default
# authentication_error absent gets, which is the honest way to say the
# distinction was checked for and not found. auth.rejected_error names the
# one sentence that is genuinely different: a credential the right shape and
# wrong for any account. Compare Duo's Recipe elsewhere in this collection,
# whose two Basic-auth sentences (40101 "not Basic-shaped", 40102 "wrong
# key") really do differ, and which documents leaving the coarser one
# unclaimed for a different reason -- Duo's was never struck live at all.
# MaxMind's was struck live, twice, and answered the same as absent both
# times.
#
# **The credential gate stands in front of the one boundary this Recipe was
# asked to probe, and that is itself the finding.** MaxMind's own error
# catalogue documents IP_ADDRESS_RESERVED (400, "You have supplied an IP
# address which belongs to a reserved or private range") and
# IP_ADDRESS_INVALID (400) as separate, later checks -- but every private,
# reserved, loopback and malformed address this Recipe could reach without a
# real account answered the identical 401 a syntactically perfect public
# address gets, checked four ways on one date:
#
#   GET /geoip/v2.1/city/10.0.0.1        (no cred) -> 401 AUTHORIZATION_INVALID (same as 8.8.8.8)
#   GET /geoip/v2.1/city/not-an-ip       (no cred) -> 401, byte-identical
#   GET /geoip/v2.1/city/10.0.0.1        (wrong cred) -> 401 "could not be authenticated", byte-identical to a wrong cred against a real address
#   GET /geoip/v2.1/insights/2001:4860:4860::8888 (no cred) -> 401, byte-identical
#
# So this Recipe cannot show what a private address costs a real caller --
# only that the credential check runs in front of it unconditionally,
# for every id value tried, valid, invalid, private or IPv6 alike. That is
# Rootly's own split, named in this project's auth.go and demonstrated on a
# different provider in rootly/recipe.yaml: credential first for every path
# that names a route the provider has, router first for every path that
# does not. /geoip/v2.1/city/{anything} is a route this host has, whatever
# {anything} is, so the credential fires first; /geoip/v2.1/bogus-endpoint
# is not a route at all, and the next finding is what happens there instead.
# auth.after_routing: true is declared for exactly that second half, not the
# first -- see below.
#
# **A route this host does not have, and a method a route it does have does
# not accept, both outrank the credential completely -- the opposite
# ordering from an id inside a route that does exist, above.** Four more,
# struck both with and without a credential, byte-identical either way:
#
#   GET  /geoip/v2.1/bogus-endpoint-xyz                 -> 404, generic Cloudflare/nginx HTML, "The resource could not be found.", Content-Type: text/html
#   POST /geoip/v2.1/city/8.8.8.8                       -> 405 "Method Not Allowed", Content-Type: text/plain; charset=utf-8, Allow: GET, HEAD, OPTIONS
#   GET  minfraud.maxmind.com/minfraud/v2.0/insights     -> 405 "Method Not Allowed", Allow: OPTIONS, POST
#
# Neither 404 nor 405 carries MaxMind's own JSON error envelope at all --
# application/vnd.maxmind.com-error+json only ever appears once a route has
# matched and the credential check has run, which is the tell that these two
# failures never reach MaxMind's own request-handling code and answer from
# whatever sits in front of it instead. auth.after_routing: true reproduces
# this exactly: a path this Recipe has no route for 404s and a method a
# routed path does not accept 405s, both with no credential sent at all,
# which is the request this Recipe actually sent and got answered that way.
# It composes correctly with the credential-first behaviour on an id inside
# an existing route (above) because after_routing only defers the check
# until a request has *matched a route* -- and /geoip/v2.1/city/{id} matches
# for every id value, valid or not, so the deferred check still fires for a
# malformed one. Cauldron's own routing does the same thing for the same
# reason without any extra declaration.
#
# **The accuracy and confidence fields this whole group of Recipes exists to
# ask about are not just present here -- they are the most specific
# vocabulary any provider in this collection has for the question.** Every
# figure below is quoted from dev.maxmind.com/geoip/docs/web-services/
# responses, fetched and read directly on the date in the fidelity gaps
# below, not observed:
#
#   location.accuracy_radius   integer, km. "We have a 67% confidence that
#                               the location of the end-user falls within
#                               the area defined by the accuracy radius."
#   city.confidence             0-100 integer, "our confidence that the
#                               city is correct"
#   country.confidence          0-100 integer, same wording for the country
#   postal.confidence           0-100 integer, same wording for the postal
#                               code
#   anonymizer.confidence       1-99 integer, "our percent confidence that
#                               the network is currently part of an actively
#                               used VPN service" -- GeoIP Insights only
#   anonymizer.is_anonymous_vpn, .is_hosting_provider, .is_public_proxy,
#   .is_residential_proxy, .is_tor_exit_node, .provider_name -- named
#                               booleans and a named provider, not a single
#                               undifferentiated "is this suspicious" flag
#
# That is the sharpest possible answer to this group's question on paper --
# a real confidence number for the city, the country, the postal code and
# the VPN flag separately, each with its own documented scale -- and it
# comes from a provider this Recipe never once saw succeed. See
# ipinfo/recipe.yaml for the same question answered the other way:
# documented tiers with named fields (radius, is_anonymous, confidence) and
# no worked example anywhere for any of them; MaxMind is the reverse -- a
# full worked example, quoted below, for a field set this Recipe still could
# not verify against a live request of its own.
#
# **The one worked example this Recipe could find is MaxMind's own
# GeoIP Insights body example**, quoted from the same page, not guessed:
# continent North America, country United States with 75% confidence, a
# city named Los Angeles at 25% confidence, an accuracy radius of 20km, a
# VPN confidence of 99% naming the provider "nordvpn", and a residential
# sub-object at 82% confidence naming a different provider, "quickshift",
# for the same address -- MaxMind's own schema draws its VPN-confidence and
# residential-proxy-confidence as two separate numbers about the same IP,
# which is a finer split than this Recipe's fields below represent; see the
# gaps.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists and no request through either host ever got past
#     the credential check. Every 401, 404 and 405 case below is struck
#     live and carries a verified date. The one 200 case is MaxMind's own
#     documented worked example and carries none.
#   - IP_ADDRESS_RESERVED and IP_ADDRESS_INVALID (both 400, per the error
#     catalogue on the same documentation page) are declared and reached by
#     arming ip_address_reserved for one case, because this Recipe cannot
#     reach either one through the credential gate it never got past. Not
#     struck live -- see the finding above about why.
#   - The full GeoIP Insights schema nests eleven top-level objects
#     (anonymizer, city, continent, country, location, maxmind, postal,
#     registered_country, represented_country, subdivisions, traits). This
#     Recipe declares a representative selection covering the
#     accuracy/confidence question the whole group exists to ask, and
#     leaves out registered_country, represented_country, subdivisions,
#     the residential sub-object, and most of traits (isp, domain,
#     connection_type, mobile_country_code, mobile_network_code, user_type,
#     user_count, static_ip_score, ip_risk_snapshot).
#   - GeoIP City Plus and GeoIP Country are two narrower siblings of the one
#     route this Recipe models (Insights); their own worked examples,
#     quoted on the same documentation page, are strict subsets of the
#     fields declared below with confidence and anonymizer entirely absent.
#     Both were struck live for their 401/404/405 shapes -- see above -- and
#     neither is routed separately, because their 200 body would be a
#     smaller version of the one case this Recipe already has.
#   - minfraud.maxmind.com is not routed. See above for why its evidence is
#     recorded rather than mounted.
#   - No IPv6 request ever got past the credential gate either. traits'
#     documented note that "for IPv6, the [user_count] is for the /64
#     network" rather than the individual address is quoted from the same
#     page and not verified.

recipe: maxmind
capability: infrastructure
version: 0.1.0

upstream:
  api: v2.1
  docs: https://dev.maxmind.com/geoip/docs/web-services?lang=en

auth:
  # HTTP Basic, account id in the username -- see the header. The password
  # half (the license key) is not independently checked by this Recipe;
  # Twilio's Recipe elsewhere in this collection makes the identical choice
  # for the identical reason, an account identifier in the username half of
  # Basic.
  scheme: basic
  keys:
    - "100000001"
  # A well-formed pair naming an account this Recipe does not hold gets
  # MaxMind's second sentence. malformed_error is deliberately unset: struck
  # live, a header that will not even parse as Basic answers the same
  # sentence absent gets -- see the header.
  rejected_error: authorization_rejected
  # Routing and method both outrank the credential for a path or a method
  # this host does not have at all; the credential outranks everything for
  # an id inside a route that does exist, valid or not. See the header for
  # why after_routing alone reproduces both at once.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    # {"code": "...", "error": "..."} on every failure this Recipe's own
    # JSON envelope produced. code_field has to be named explicitly for the
    # flat style -- unlike the nested style elsewhere in this collection, it
    # does not default to "code" on its own. message_field has to be
    # overridden too, because the sentence lives under "error", not
    # "message".
    style: flat
    code_field: code
    message_field: error
    type_field: "-"

resources:
  # GeoIP Insights -- the richest of MaxMind's three GeoIP2 Precision
  # products and the one whose schema answers this group's question most
  # specifically. See the header for the representative selection this
  # Recipe declares and everything it leaves out.
  geoip_record:
    id:
      # Not a provider-minted identifier: the address itself, documented at
      # traits.ip_address on every one of MaxMind's worked examples.
      style: opaque
      field: traits.ip_address
    fields:
      continent_code:
        type: string
        in: continent
        as: code
      country_iso_code:
        type: string
        in: country
        as: iso_code
      # 0-100. "Our confidence that the country is correct" -- MaxMind's own
      # words, quoted in the header.
      country_confidence:
        type: integer
        in: country
        as: confidence
      city_geoname_id:
        type: integer
        in: city
        as: geoname_id
      city_name_en:
        type: string
        in: city.names
        as: en
      # 0-100, the same wording as country_confidence but about the city.
      city_confidence:
        type: integer
        in: city
        as: confidence
      location_latitude:
        type: number
        in: location
        as: latitude
      location_longitude:
        type: number
        in: location
        as: longitude
      # Kilometres. "We have a 67% confidence that the location of the
      # end-user falls within the area defined by the accuracy radius" --
      # see the header. The one field this whole group of Recipes was
      # written to find, and this is the provider that names it.
      location_accuracy_radius:
        type: integer
        in: location
        as: accuracy_radius
      location_time_zone:
        type: string
        in: location
        as: time_zone
      postal_code:
        type: string
        in: postal
        as: code
      postal_confidence:
        type: integer
        in: postal
        as: confidence
      traits_network:
        type: string
        in: traits
        as: network
      traits_is_anycast:
        type: boolean
        in: traits
        as: is_anycast
      traits_autonomous_system_number:
        type: integer
        in: traits
        as: autonomous_system_number
      traits_autonomous_system_organization:
        type: string
        in: traits
        as: autonomous_system_organization
      # 1-99. "Our percent confidence that the network is currently part of
      # an actively used VPN service" -- GeoIP Insights only, quoted in the
      # header. The VPN flag this group of Recipes was asked to look for,
      # and it carries its own confidence rather than a bare boolean.
      anonymizer_confidence:
        type: integer
        in: anonymizer
        as: confidence
      anonymizer_is_anonymous_vpn:
        type: boolean
        in: anonymizer
        as: is_anonymous_vpn
      anonymizer_is_hosting_provider:
        type: boolean
        in: anonymizer
        as: is_hosting_provider
      anonymizer_provider_name:
        type: string
        in: anonymizer
        as: provider_name
      maxmind_queries_remaining:
        type: integer
        in: maxmind
        as: queries_remaining

routes:
  - method: GET
    path: /geoip/v2.1/insights/{id}
    resource: geoip_record
    operation: get

errors:
  # Absent and malformed both land here -- see the header for why
  # malformed_error is left unset rather than pointed at a sentence that
  # does not exist.
  authentication_error:
    status: 401
    code: AUTHORIZATION_INVALID
    message: "An account ID and license key are required to use this service."
    headers:
      Content-Type: "application/vnd.maxmind.com-error+json; charset=UTF-8; version=2.1"

  # The one sentence that is genuinely different -- a well-formed pair this
  # Recipe does not hold. Named by auth.rejected_error.
  authorization_rejected:
    status: 401
    code: AUTHORIZATION_INVALID
    message: "Your account ID or license key could not be authenticated."
    headers:
      Content-Type: "application/vnd.maxmind.com-error+json; charset=UTF-8; version=2.1"

  # Documented, not observed -- see the header for why this Recipe could
  # never reach it live. Reached here by arming it.
  ip_address_reserved:
    status: 400
    code: IP_ADDRESS_RESERVED
    message: "You have supplied an IP address which belongs to a reserved or private range."

  # Generic Cloudflare/gateway HTML, not MaxMind's own JSON envelope -- see
  # the header for why: this failure never reaches MaxMind's own
  # request-handling code at all.
  unknown_route:
    status: 404
    style: text
    message: "<html><body><h1>404 Not Found</h1>\nThe resource could not be found.\n</body></html>"
    headers:
      Content-Type: text/html

  # Also generic-gateway rather than MaxMind's own envelope -- see the
  # header. The live Allow header names more methods (GET, HEAD, OPTIONS)
  # than this Recipe declares routes for; Cauldron computes its own from
  # what is actually routed here, so no case below asserts its exact value.
  method_not_allowed:
    status: 405
    style: text
    message: "Method Not Allowed"
    headers:
      Content-Type: "text/plain; charset=utf-8"

fixtures:
  empty: {}

  # MaxMind's own GeoIP Insights worked example, quoted rather than
  # guessed -- see the header. 1.2.3.4 is MaxMind's own documentation
  # address, not an address this Recipe chose.
  documented:
    geoip_record:
      - id: "1.2.3.4"
        continent_code: NA
        country_iso_code: US
        country_confidence: 75
        city_geoname_id: 54321
        city_name_en: Los Angeles
        city_confidence: 25
        location_latitude: 37.6293
        location_longitude: -122.1163
        location_accuracy_radius: 20
        location_time_zone: America/Los_Angeles
        postal_code: "90001"
        postal_confidence: 10
        traits_network: "1.2.3.0/24"
        traits_is_anycast: true
        traits_autonomous_system_number: 1239
        traits_autonomous_system_organization: Linkem IR WiMax Network
        anonymizer_confidence: 99
        anonymizer_is_anonymous_vpn: true
        anonymizer_is_hosting_provider: true
        anonymizer_provider_name: nordvpn
        maxmind_queries_remaining: 54321

conformance:
  - name: no credential at all names both a missing account id and a missing license key in one sentence
    source: https://geoip.maxmind.com/geoip/v2.1/insights/8.8.8.8
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/insights/8.8.8.8
    expect:
      status: 401
      headers:
        Content-Type: "application/vnd.maxmind.com-error+json; charset=UTF-8; version=2.1"
      body:
        code: AUTHORIZATION_INVALID
        error: "An account ID and license key are required to use this service."

  - name: a header that will not even parse as Basic gets the identical sentence
    # Live: "Authorization: Basic ###not-base64###", not valid base64 at
    # all. Byte-identical to no header, which is why malformed_error is
    # unset -- see the header.
    source: https://geoip.maxmind.com/geoip/v2.1/insights/8.8.8.8
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/insights/8.8.8.8
      headers:
        Authorization: "Basic ###not-base64###"
    expect:
      status: 401
      body:
        code: AUTHORIZATION_INVALID
        error: "An account ID and license key are required to use this service."

  - name: a well-formed pair naming an account this Recipe does not hold gets a different sentence
    # Live: "Authorization: Basic <base64 of 123456:junklicensekey12345>".
    source: https://geoip.maxmind.com/geoip/v2.1/insights/8.8.8.8
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/insights/8.8.8.8
      headers:
        Authorization: "Basic MTIzNDU2Omp1bmtsaWNlbnNla2V5MTIzNDU="
    expect:
      status: 401
      body:
        code: AUTHORIZATION_INVALID
        error: "Your account ID or license key could not be authenticated."

  - name: the credential gate stands in front of a private address too, with no credential at all
    source: https://geoip.maxmind.com/geoip/v2.1/city/10.0.0.1
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/insights/10.0.0.1
    expect:
      status: 401
      body:
        code: AUTHORIZATION_INVALID
        error: "An account ID and license key are required to use this service."

  - name: and in front of a malformed identifier, which never gets to become IP_ADDRESS_INVALID
    source: https://geoip.maxmind.com/geoip/v2.1/city/not-an-ip
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/insights/not-an-ip
    expect:
      status: 401
      body:
        code: AUTHORIZATION_INVALID

  - name: a path this host has no route for outranks the credential, with no credential sent at all
    source: https://geoip.maxmind.com/geoip/v2.1/bogus-endpoint-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/bogus-endpoint-xyz
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: 'The resource could not be found\.'

  - name: and the same path with a well-formed wrong credential answers identically
    source: https://geoip.maxmind.com/geoip/v2.1/bogus-endpoint-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /geoip/v2.1/bogus-endpoint-xyz
      headers:
        Authorization: "Basic MTIzNDU2Omp1bmtsaWNlbnNla2V5MTIzNDU="
    expect:
      status: 404
      body_matches: 'The resource could not be found\.'

  - name: a method a real route does not accept outranks the credential too
    source: https://geoip.maxmind.com/geoip/v2.1/city/8.8.8.8
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /geoip/v2.1/insights/8.8.8.8
    expect:
      status: 405
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: '^Method Not Allowed$'

  - name: private and reserved ranges are documented as their own 400, never reached live -- see the header
    source: https://dev.maxmind.com/geoip/docs/web-services/responses
    arm: ip_address_reserved
    fixture: documented
    request:
      method: GET
      path: /geoip/v2.1/insights/10.0.0.1
      headers:
        Authorization: "Basic MTAwMDAwMDAxOmNhdWxkcm9uX21heG1pbmRfZml4dHVyZV9saWNlbnNlX2tleV8wMDAwMDAwMA=="
    expect:
      status: 400
      body:
        code: IP_ADDRESS_RESERVED
        error: "You have supplied an IP address which belongs to a reserved or private range."

  - name: the one worked example names a confidence for the country, the city and the VPN flag separately
    source: https://dev.maxmind.com/geoip/docs/web-services/responses
    fixture: documented
    request:
      method: GET
      path: /geoip/v2.1/insights/1.2.3.4
      headers:
        Authorization: "Basic MTAwMDAwMDAxOmNhdWxkcm9uX21heG1pbmRfZml4dHVyZV9saWNlbnNlX2tleV8wMDAwMDAwMA=="
    expect:
      status: 200
      body:
        continent.code: NA
        country.iso_code: US
        country.confidence: 75
        city.geoname_id: 54321
        city.names.en: Los Angeles
        city.confidence: 25
        location.accuracy_radius: 20
        location.latitude: 37.6293
        location.longitude: -122.1163
        location.time_zone: America/Los_Angeles
        postal.code: "90001"
        postal.confidence: 10
        traits.network: "1.2.3.0/24"
        traits.is_anycast: true
        traits.autonomous_system_number: 1239
        anonymizer.confidence: 99
        anonymizer.is_anonymous_vpn: true
        anonymizer.is_hosting_provider: true
        anonymizer.provider_name: nordvpn
        maxmind.queries_remaining: 54321

  # The names. This Recipe declares 1 field(s) on a geoip_record that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a geoip_record carries the field names this Recipe declares"
    source: "https://dev.maxmind.com/geoip/docs/web-services/responses"
    fixture: documented
    request:
      method: GET
      path: "/geoip/v2.1/insights/1.2.3.4"
      headers:
        "Authorization": "Basic MTAwMDAwMDAxOmNhdWxkcm9uX21heG1pbmRfZml4dHVyZV9saWNlbnNlX2tleV8wMDAwMDAwMA=="
    expect:
      status: 200
      body:
        "traits.autonomous_system_organization": "Linkem IR WiMax Network"

