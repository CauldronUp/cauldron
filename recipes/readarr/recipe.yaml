# Readarr Recipe for Cauldron
#
# Written against Readarr's own generated OpenAPI document, published in its own
# repository -- github.com/Readarr/Readarr, src/Readarr.Api.V1/openapi.json, 161 paths,
# info.version 1.0.0, OpenAPI 3.0.1 -- read on 2026-09-06. Readarr is self-hosted
# and there is no public instance, so nothing here is verified live.
#
# This Recipe is one of five siblings: sonarr, radarr, prowlarr, lidarr and
# readarr. They are forks of one codebase, they are commonly installed on the
# same machine, and they share a credential header, a path prefix and an API
# shape. **The set is the finding.**
#
# **The same integer means five different things.**
#
# `eventType` is a filter taking integers and a response field holding a string.
# None of the five documents pins explicit values, so the integers a caller
# sends are the members' declaration positions:
#
#   pos | sonarr                | radarr                | prowlarr       | lidarr                | readarr
#   ----|-----------------------|-----------------------|----------------|-----------------------|----------------------
#    0  | unknown               | unknown               | unknown        | unknown               | unknown
#    1  | grabbed               | grabbed               | releaseGrabbed | grabbed               | grabbed
#    2  | seriesFolderImported  | downloadFolderImported| indexerQuery   | artistFolderImported  | bookFileImported
#    3  | downloadFolderImported| downloadFailed        | indexerRss     | trackFileImported     | downloadFailed
#    4  | downloadFailed        | movieFileDeleted      | indexerAuth    | downloadFailed        | bookFileDeleted
#    5  | episodeFileDeleted    | movieFolderImported   | indexerInfo    | trackFileDeleted      | bookFileRenamed
#    6  | episodeFileRenamed    | movieFileRenamed      | -              | trackFileRenamed      | bookImportIncomplete
#    7  | downloadIgnored       | downloadIgnored       | -              | albumImportIncomplete | downloadImported
#    8  | -                     | -                     | -              | downloadImported      | bookFileRetagged
#    9  | -                     | -                     | -              | trackFileRetagged     | downloadIgnored
#   10  | -                     | -                     | -              | downloadIgnored       | -
#
# **Only position nought agrees across all five.**
#
# `?eventType=3` asks for a successful import on Sonarr and Lidarr, a failed
# download on Radarr and Readarr, and an RSS poll on Prowlarr. There is no
# integer that means "download failed" across the family: it is 4, 3, absent,
# 4 and 3.
#
# A monitoring job pointed at the wrong one of five counts the wrong thing, and
# nothing anywhere returns an error.
#
# **Readarr is the only one of the five with no plural scope filter.**
#
# Sonarr filters history by `seriesIds`, Radarr by `movieIds`, Prowlarr by
# `indexerIds`, Lidarr by `artistIds` -- four plural array parameters. Readarr
# takes `bookId`, singular, and offers nothing for the author at all.
#
# So the one fork that cannot filter by its top-level entity is the one whose
# top-level entity a client is most likely to have: you know the author, and
# the API only lets you ask about a book.
#
# **Nothing in a response tells the five apart except appName.** Same
# `X-Api-Key`, same paged envelope, same generated shape.
#
# The path prefix is NOT shared, and that is one more thing that looks it:
# Sonarr and Radarr serve `/api/v3`, and Prowlarr, Lidarr and Readarr serve
# `/api/v1`. The number bears no relation to `info.version`, which is "3.0.0"
# for the two on v3 and "1.0.0" for the three on v1 -- so a client that derives
# one from the other is right for the wrong reason on two forks and wrong on
# three. The only discriminator is `appName` on
# `/api/v1/system/status`, and `instanceName` beside it is settable and
# therefore not one.
#
# The five documents also disagree about which OpenAPI patch they were generated
# against -- 3.0.1, 3.0.4, 3.0.4, 3.0.4, 3.0.1 -- and about `info.version`:
# "3.0.0" for sonarr and radarr, "1.0.0" for the other three.
#
# **The credential is documented as a query parameter as well as a header**, on
# all five: `apikey`, "Apikey passed as query parameter", beside `X-Api-Key`.
# Recorded and not served, because serving it would make a credential in a URL
# the easy path in local development.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Readarr is self-hosted and
#     there is no public instance.
#   - History and system status. 161 paths is a media manager: authors, books, book files, editions, queue, indexers, download clients, import lists and the calendar
#     each want their own evidence.
#   - The eventType filter is served over the string, not the integers.
#     Encoding the integer mapping would mean asserting the enum's declaration
#     positions are its wire values, which none of the five documents states.
#   - The credential is checked in the header.

recipe: readarr
capability: media
version: 0.1.0

upstream:
  api: "v1"
  docs: https://readarr.com/docs/api/
  spec: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
  spec_hash: ed8f6425f1085cbfeca2b79ab03b0fc0029228c1457b4b579800fbcd7eca5a19
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldronreadarrapikey00000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: records
    count_field: totalRecords
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message

resources:
  history:
    id:
      style: numeric
      type: number
    fields:
      # The scope fields. Sonarr has two, Radarr one, Prowlarr one,
      # Lidarr three and Readarr two -- and none of the five accepts
      # another's spelling, because ASP.NET Core model binding drops a
      # query key with no matching property rather than refusing it.
      authorId:
        type: number
      bookId:
        type: number
      sourceTitle:
        type: string
      # A string here and an integer in the filter of the same name.
      eventType:
        type: string
        default: grabbed
      downloadId:
        type: string
      date:
        type: datetime
      qualityCutoffNotMet:
        type: boolean
        default: false

  status:
    id:
      style: opaque
      field: appName
    fields:
      # The only field in the whole API that says which of the five you have
      # reached.
      appName:
        type: string
      instanceName:
        type: string
      version:
        type: string
      branch:
        type: string
      appData:
        type: string
      startupPath:
        type: string
      osName:
        type: string
      isDocker:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/v1/history
    resource: history
    operation: list
    pagination:
      style: page
      limit_param: pageSize
      cursor_param: page
      limit: 10
      first_page: 1
    filters:
      # Singular, and the only one. The other four forks all offer a plural
      # array filter for their top-level entity; this one does not.
      - field: bookId
        param: bookId
      - field: eventType
        param: eventType

  - method: GET
    path: /api/v1/system/status
    resource: status
    operation: list
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
  not_found:
    status: 404
    message: "NotFound"
  rate_limit:
    status: 429
    message: "Too Many Requests"

fixtures:
  empty:
    history: []
    status: []

  library:
    status:
      - appName: Readarr
        instanceName: Readarr
        version: 0.4.18.2805
        branch: develop
        appData: /config
        startupPath: /app/readarr/bin
        osName: ubuntu
        isDocker: true
    history:
      - id: 9001
        authorId: 21
        bookId: 774
        sourceTitle: "Some Author - A Book"
        # Position 1, and the only name four of the five share.
        eventType: grabbed
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-05T18:22:41Z"
        qualityCutoffNotMet: false
      - id: 9002
        authorId: 21
        bookId: 774
        sourceTitle: "Some Author - A Book"
        # Position 3 here and on Radarr. On Sonarr and Lidarr position 3 is
        # an import -- a failure and a success at the same integer.
        eventType: downloadFailed
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-06T18:22:41Z"
        qualityCutoffNotMet: false
      - id: 9003
        authorId: 21
        bookId: 774
        sourceTitle: "Some Author - A Book"
        # Position 4 here. On Sonarr and Lidarr position 4 is downloadFailed,
        # so the integer that deletes a file here reports a failure there.
        eventType: bookFileDeleted
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-07T18:22:41Z"
        qualityCutoffNotMet: false

conformance:
  - name: only appName says which of the five this is
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/system/status
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        # Not the path, not the credential, not the envelope. This field, on
        # five products that install side by side.
        appName: Readarr
        version: 0.4.18.2805
        branch: develop

  - name: the event names at each position are this fork's own
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        'records[0].eventType': grabbed
        'records[1].eventType': downloadFailed
        'records[2].eventType': bookFileDeleted

  - name: the eventType filter matches a name, and the wire carries an integer
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      query:
        # This Recipe filters on the string. Upstream the parameter takes an
        # array of integers, and the integer for this name differs across the
        # five forks -- which is why the mapping is written down rather than
        # encoded.
        eventType: downloadFailed
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        'records[0].eventType': downloadFailed
      absent:
        - 'records[1]'

  - name: the record carries this fork's own scope fields
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        'records[0].authorId': 21
        'records[0].bookId': 774

  - name: the paged envelope names its own page and size back
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      query:
        page: "1"
        pageSize: "2"
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        # page, pageSize, totalRecords, records -- the same envelope all five
        # forks answer with, which is part of why they are hard to tell apart.
        page: 1
        pageSize: 2
        totalRecords: 3
      absent:
        - 'records[2]'

  - name: a record carries the title the indexer used
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        'records[0].sourceTitle': "Some Author - A Book"
        'records[0].downloadId': "A1B2C3D4E5F6"
        'records[0].date': "2026-09-05T18:22:41Z"
        'records[0].qualityCutoffNotMet': false

  - name: the instance names itself separately from the product
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/system/status
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        # Settable, and defaulting to the product name -- so it looks like a
        # second discriminator and is not one.
        instanceName: Readarr
        appData: /config
        startupPath: /app/readarr/bin
        osName: ubuntu
        isDocker: true

  - name: no credential is refused
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"

  - name: "a missing record says so in these words"
    source: "https://readarr.com/docs/api/"
    arm: not_found
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 404
      body:
        message: "NotFound"

  - name: "the rate limit says so in these words"
    source: "https://readarr.com/docs/api/"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 429
      body:
        message: "Too Many Requests"

  - name: the scope filter is this fork's own spelling
    source: https://raw.githubusercontent.com/Readarr/Readarr/develop/src/Readarr.Api.V1/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v1/history
      query:
        # bookId, singular -- the only one of the five with no plural filter,
        # and nothing at all for the author.
        bookId: "774"
      headers:
        X-Api-Key: cauldronreadarrapikey00000000000
    expect:
      status: 200
      body:
        'records[0].bookId': 774
