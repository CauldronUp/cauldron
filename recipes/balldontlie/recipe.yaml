# balldontlie Recipe for Cauldron
#
# balldontlie was, for years, the NBA API a tutorial could point at with no
# signup at all -- that reputation is what makes the current wire behaviour
# worth recording rather than assuming. Every path this Recipe tried,
# credentialed or not, answered the same way:
#
#   GET /v1/teams              (no header at all)       -> 401 Unauthorized
#   GET /v1/teams              Authorization: junk...    -> 401, byte-identical
#   GET /v1/nosuchresource     (no header, unrouted)      -> 401, byte-identical
#   PATCH /v1/teams            (no header, wrong method)  -> 401, byte-identical
#
# all four verified live on 2026-09-02, all four thirteen bytes of
# text/plain reading exactly "Unauthorized" -- no braces, no quotes, and the
# same ETag on every one of them (W/"c-dAuDFQrdjS3hezqxDTNgW7AOlYk"),
# which is the header's own proof the bytes really are identical rather than
# only looking that way. The once-open API now refuses everything: a
# missing credential, a present-and-wrong one, a path that does not exist,
# and a method nothing declares all reach the identical check before
# anything else about the request is examined, which is Airbyte's Recipe in
# this collection restated on a completely different provider -- credential
# first, always, no distinction between absent and wrong because nothing
# here has ever been asked to make one. docs.balldontlie.io states the
# replacement in as many words: "An API key is required. You can obtain an
# API key by creating a free account on our website," with
# "Authorization: YOUR_API_KEY" as the exact header shape -- no Bearer, no
# scheme prefix, which is also why the raw junk value above was refused
# identically to a properly-absent header rather than differently: nothing
# about this API's check depends on a prefix that was never declared.
#
# No credential this Recipe holds is real, and none was ever requested --
# every route below that needs one to succeed is cited from
# docs.balldontlie.io's own worked examples and carries no verified date.
# Only the refusal itself, which needed no credential to observe, is
# live-verified.
#
# **The one worked Game example the documentation shows carries two separate
# status representations that disagree in kind, not just in wording.**
# status reads "Final" -- prose, and per the same page's own Attributes
# section, prose that is literally the scheduled tip-off time
# ({start_time}, "something like '7:00 pm ET'") before the game exists in
# any other sense. status_state reads "final" -- lowercase, fixed, and
# nine words wide across the whole documented enum:
#
#   scheduled | in_progress | final | postponed | canceled | delayed |
#   suspended | abandoned | unknown
#
# which is the richest vocabulary of the three providers this group of
# Recipes covers, and the only one of the three whose documentation names
# postponed and abandoned as separate, coexisting words rather than leaving
# either to be inferred. A caller with no interest in whether the human
# sentence changed can watch status_state instead and get a fixed
# nine-value answer every time, including to the two questions -- postponed,
# abandoned -- this collection's other two sports Recipes could not confirm
# a live or even a documented example for.
#
# **postponed is also its own boolean, sitting beside a status_state that
# can already say the same thing.** The one worked example carries
# "postponed": false on a FINISHED game, which proves the field exists and
# nothing about how it behaves when status_state genuinely reads
# "postponed" -- whether both flip together, or one changes before the
# other, is not shown anywhere in what this Recipe could read, and is not
# modelled as a result. See the fidelity gaps.
#
# **The documentation's own prose about "time" does not match its own
# worked example.** The Attributes section says time reads
# '{time_in_period}' like "3:44" during play, or a single space when the
# game has not started or has finished. The one complete Game object the
# same documentation publishes is a finished game, and its time reads
# "Final" -- a word, not a blank string. TheSportsDB's Recipe in this
# collection records its own provider's marketing page describing a feature
# the free tier does not actually gate; football-data.org's records a
# response header spelled one way in a table and another way on the wire.
# This is the same shape of gap a third time, on a third provider: a page's
# descriptive sentence and its own worked example do not agree, and only
# the worked example is a thing this Recipe can cite rather than assume.
#
# **No score field is confirmed null before tip-off, because no
# not-yet-started worked example exists to confirm it with.** The one Game
# object published shows home_team_score: 115 and visitor_team_score: 105
# on a completed game; the documentation states scores exist as fields on
# the resource and shows no SCHEDULED or in_progress example at all. Unlike
# football-data.org, whose documented enum this Recipe's sibling Recipe
# could at least pair with a status vocabulary naming every pending and
# terminal state explicitly, and unlike TheSportsDB, whose live traffic
# this Recipe's other sibling could actually strike to watch null become a
# number -- this provider's free tier could not be reached without a
# credential this Recipe was never going to request, so the null-vs-zero
# question the whole group of three exists to answer is, for this one
# provider, genuinely unanswered rather than merely unmodelled.
#
# **No per-record freshness timestamp is documented on Game at all.**
# TheSportsDB's livescore.php carries "updated"; football-data.org's Match
# and Competition both carry lastUpdated. Neither an updated_at nor a
# lastUpdated nor any equivalent field appears anywhere in balldontlie's own
# published Game documentation -- datetime is the game's own tip-off
# timestamp, not a record of when the row last changed, and a caller
# watching status_state move from in_progress toward final has no
# documented way to know how stale a particular read is beyond the moment
# the response itself arrived. The Box Scores endpoint's own page states
# plainly that it is "LIVE" and "updated in real time," which is a claim
# about the endpoint's cadence and not a field on any record it returns.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No scheduled, in_progress, postponed, canceled, delayed, suspended,
#     abandoned or unknown game is modelled -- only final, because it is the
#     only status_state any published worked example shows. All nine
#     documented values are named above and in the field comment below; only
#     one is backed by a fixture.
#   - Whether home_team_score / visitor_team_score are null, zero, or absent
#     before a game starts is not confirmed -- see above. This Recipe
#     declares them nullable rather than guessing which of the three the
#     provider actually sends.
#   - Quarter-by-quarter scoring (home_q1..q4, the overtime periods),
#     timeouts remaining and in-bonus flags all appear in the one worked
#     example and are not declared here: granular live-boxscore detail this
#     Recipe's group of three does not otherwise carry for any provider.
#   - No pagination mechanics are modelled. The documentation shows a
#     {"next_cursor": 25, "per_page": 25} meta object beside one games
#     response and this Recipe does not assert its shape, because no second
#     page was ever fetched to confirm what next_cursor does when one
#     genuinely exists.
#   - No 429 body is modelled. The documentation's own error-code table
#     states "429 | Too Many Requests -- You're rate limited." and nothing
#     more; the free tier's rate limit is documented as 5 requests/minute
#     and was never approached, let alone triggered, since no request this
#     Recipe made ever carried a real credential.
#   - Every sport, and every endpoint beyond Teams and Games -- Players,
#     Game Player Stats, Active Players, Injuries, and the entirely separate
#     v2 betting-odds surface at /v2/odds -- is out of scope.
#
# Every case below carries source. A verified date means this Recipe called
# api.balldontlie.io with exactly the request shown, on 2026-09-02, and
# recorded exactly what came back.

recipe: balldontlie
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  provider: balldontlie
  docs: https://docs.balldontlie.io/

auth:
  scheme: header
  header: Authorization
  keys:
    - cauldron00000000000000000000000000
  # No absent_error, malformed_error or rejected_error: every verdict this
  # Recipe struck answered the identical body -- see the header. Declaring
  # none of the three is the honest default, the same shape Airbyte's
  # Recipe in this collection uses for the same reason.

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    # Plain text, not JSON -- "Unauthorized" and nothing else, verified live
    # on every path and method this Recipe tried.
    style: text

resources:
  team:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      conference:
        type: string
      division:
        type: string
      city:
        type: string
      name:
        type: string
      full_name:
        type: string
      abbreviation:
        type: string

  game:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      date:
        type: string
      season:
        type: integer
      # Prose, and per the header literally the scheduled tip-off time
      # before the game exists in any other sense -- "Final" is what a
      # finished game reads, not a fixed word from a small vocabulary.
      status:
        type: string
      # scheduled | in_progress | final | postponed | canceled | delayed |
      # suspended | abandoned | unknown -- the fixed nine-word vocabulary
      # status itself does not have. See the header for why this is the
      # richest status field this group of three Recipes found anywhere.
      status_state:
        type: string
      # 0 (not started) through 4 (fourth quarter / complete).
      period:
        type: integer
      # "3:44" mid-quarter per the documentation; "Final" on the one worked
      # example this Recipe could read, not the empty string the same
      # documentation's own prose describes for a finished game -- see the
      # header.
      time:
        type: string
      postseason:
        type: boolean
      # A boolean sitting beside a status_state that can already say
      # "postponed" -- see the header for what is not confirmed about how
      # the two interact.
      postponed:
        type: boolean
      # Not confirmed null, zero, or absent before a game starts -- see the
      # header. Declared nullable rather than guessed.
      home_team_score:
        type: integer
        null_when_unset: true
      visitor_team_score:
        type: integer
        null_when_unset: true
      datetime:
        type: datetime
      home_team_id:
        type: integer
        in: home_team
        as: id
      home_team_name:
        type: string
        in: home_team
        as: name
      home_team_full_name:
        type: string
        in: home_team
        as: full_name
      home_team_abbreviation:
        type: string
        in: home_team
        as: abbreviation
      home_team_conference:
        type: string
        in: home_team
        as: conference
      home_team_division:
        type: string
        in: home_team
        as: division
      visitor_team_id:
        type: integer
        in: visitor_team
        as: id
      visitor_team_name:
        type: string
        in: visitor_team
        as: name
      visitor_team_full_name:
        type: string
        in: visitor_team
        as: full_name
      visitor_team_abbreviation:
        type: string
        in: visitor_team
        as: abbreviation
      visitor_team_conference:
        type: string
        in: visitor_team
        as: conference
      visitor_team_division:
        type: string
        in: visitor_team
        as: division

routes:
  - method: GET
    path: /v1/teams
    resource: team
    operation: list

  - method: GET
    path: /v1/games
    resource: game
    operation: list

errors:
  # Plain text, thirteen bytes, no braces -- verified live on every path and
  # method this Recipe tried. See the header.
  authentication_error:
    status: 401
    style: text
    headers:
      Content-Type: "text/plain; charset=utf-8"
    message: Unauthorized

fixtures:
  empty: {}

  # docs.balldontlie.io's own "Get All Teams" worked example, in full.
  # Cited, not observed -- no credential this Recipe holds is real.
  teams-catalogue:
    team:
      - id: 1
        conference: East
        division: Southeast
        city: Atlanta
        name: Hawks
        full_name: Atlanta Hawks
        abbreviation: ATL

  # docs.balldontlie.io's own "Get All Games" worked example, in full --
  # the only complete Game object either page publishes. Cited, not
  # observed.
  one-finished-game:
    game:
      - id: 15907925
        date: "2025-01-05"
        season: 2024
        status: Final
        status_state: final
        period: 4
        time: Final
        postseason: false
        postponed: false
        home_team_score: 115
        visitor_team_score: 105
        datetime: "2025-01-05T23:00:00.000Z"
        home_team_id: 6
        home_team_name: Cavaliers
        home_team_full_name: Cleveland Cavaliers
        home_team_abbreviation: CLE
        home_team_conference: East
        home_team_division: Central
        visitor_team_id: 4
        visitor_team_name: Hornets
        visitor_team_full_name: Charlotte Hornets
        visitor_team_abbreviation: CHA
        visitor_team_conference: East
        visitor_team_division: Southeast

conformance:
  - name: no credential at all answers thirteen bytes of plain text
    source: https://api.balldontlie.io/v1/teams
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/teams
    expect:
      status: 401
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "^Unauthorized$"

  - name: a present, wrong credential with no scheme prefix answers the identical body
    source: https://api.balldontlie.io/v1/teams
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/teams
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: an unrouted path is refused before routing gets a turn
    # No credential sent at all -- the identical body proves the check runs
    # first, for every path, the same ordering Airbyte's Recipe in this
    # collection already names and the reverse of football-data.org's
    # Recipe alongside this one.
    source: https://api.balldontlie.io/v1/nosuchresource
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchresource
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: and so does a method nothing declares
    source: https://api.balldontlie.io/v1/teams
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /v1/teams
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: a team is a flat record under data, not nested further
    source: https://docs.balldontlie.io/
    fixture: teams-catalogue
    request:
      method: GET
      path: /v1/teams
      headers:
        Authorization: cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        "data[0].id": 1
        "data[0].full_name": Atlanta Hawks
        "data[0].abbreviation": ATL

  - name: a finished game carries two disagreeing status fields and a real score
    # Final (prose) beside final (the fixed nine-word vocabulary), and
    # 115/105 rather than null now that the game is over -- see the header
    # for why the not-yet-started shape of any of this is not confirmed.
    source: https://docs.balldontlie.io/
    fixture: one-finished-game
    request:
      method: GET
      path: /v1/games
      headers:
        Authorization: cauldron00000000000000000000000000
    expect:
      status: 200
      body:
        "data[0].status": Final
        "data[0].status_state": final
        "data[0].period": 4
        "data[0].postponed": false
        "data[0].home_team_score": 115
        "data[0].visitor_team_score": 105
        "data[0].home_team.full_name": Cleveland Cavaliers
        "data[0].visitor_team.full_name": Charlotte Hornets
