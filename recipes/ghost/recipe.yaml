# Ghost Recipe for Cauldron
#
# Ghost has no sandbox, because like WordPress it is software rather than a
# service. A test environment is a second install, either self-hosted or a
# second paid Ghost(Pro) site, and keeping it in step with the live one's
# theme and integrations is manual. Teams point tests at a staging site that
# drifts or at production with a content key.
#
# The part that makes a test dangerous here is email. Publishing a post with
# an email recipient filter does not just publish it, it sends it, to real
# members, immediately and irreversibly. A test that creates a post with
# status published and email_segment set mails a newsletter.
#
# Four things worth modelling exactly:
#
#   1. Every collection is wrapped in a key named after the resource, and the
#      key is plural even when there is one item. Reading a single post means
#      posts[0], and code that reads the object directly finds an array-shaped
#      object it did not expect.
#   2. status has four values and "sent" is not one an integration usually
#      expects. published, draft, scheduled, sent. A scheduled post has a
#      published_at in the future and is not on the site; a sent post is an
#      email that was never on the site at all.
#   3. The Admin API wants a JWT built from the key, not the key itself. The
#      Authorization header is "Ghost <jwt>", and sending the raw key looks
#      exactly like sending a token and fails as though the key were wrong.
#   4. Content sent to the Admin API is Lexical, a JSON string, not HTML.
#      Posting HTML silently produces an empty post unless the source
#      parameter says otherwise, so the call succeeds and the post is blank.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron does not build or verify JWTs. The Recipe checks the shape of
#     the Authorization header, which catches a raw key being sent where a
#     token belongs, and accepts a well-formed token that is not really
#     signed.
#   - Ghost does not send email from here, which is the point, but it also
#     means the email_segment field is carried rather than acted on.
#   - Lexical is carried as the string it is. Cauldron does not render it, and
#     the html field on a fixture is whatever the fixture says.
#
# Probed live, unauthenticated, on 2026-09-05, against demo.ghost.io -- a
# real, public Ghost install, not a private test account:
#
#   1. GET .../admin/posts/ with no Authorization header at all answers 403
#      {"errors":[{"message":"Authorization failed","context":"Unable to
#      determine the authenticated user or integration. Check that cookies
#      are being passed through if using session authentication.",
#      "type":"NoPermissionError",...}]}. This file had declared 401
#      UnauthorizedError for this before the probe -- the message was
#      already right, the status and the type were not.
#   2. The same route with "Ghost " followed by a string carrying no dots at
#      all -- present, prefixed correctly, wrong shape -- answers 400
#      {"errors":[{"message":"Invalid token","type":"BadRequestError",
#      "code":"INVALID_JWT",...}]}. auth.absent_error below carries the
#      split between this and point 1.
#   3. Two shapes narrower than this Recipe's own pattern distinguishes,
#      neither modelled, because Cauldron judges a credential against one
#      pattern and Ghost answers three different ways depending on exactly
#      how it fails: a raw key with no "Ghost " prefix at all answers 401
#      {"message":"Authorization header format is \"Authorization: Ghost
#      [token]\"","type":"UnauthorizedError","code":"INVALID_AUTH_HEADER"},
#      and a syntactically valid three-segment JWT with no kid claim
#      answers 400 {"message":"Admin API kid missing.",
#      "type":"BadRequestError","code":"MISSING_ADMIN_API_KID"} -- a third
#      and a fourth sentence this file does not have a slot for.
#   4. GET .../admin/not-a-real-endpoint/ and PATCH .../admin/posts/ (a
#      method this Recipe does not declare for it), both with no
#      credential, answer the identical 404 {"errors":[{"message":
#      "Resource not found","type":"NotFoundError",...}]} -- shorter than
#      resource_missing's own "Resource not found: {detail}", and reached
#      without the credential mattering, which auth.after_routing below
#      declares.
#
# Keys below are fixtures, not secrets.

recipe: ghost
capability: cms
version: 0.1.0

upstream:
  api: v5.0
  docs: https://ghost.org/docs/admin-api/

auth:
  scheme: header
  header: Authorization
  # "Ghost <jwt>", not the admin key. The key is an id and a secret separated
  # by a colon, and it is used to sign a token rather than sent as one, so a
  # raw key here is refused by shape rather than by comparison.
  pattern: '^Ghost [A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  # Struck live: no credential at all is a 403 naming no authenticated user,
  # a different status and type from a present-but-malformed one's 400. See
  # the header.
  absent_error: no_authentication
  # Struck live with no credential at all: an unrouted path and a wrong
  # method both answer before authentication is ever consulted. See the
  # header.
  after_routing: true

responses:
  list:
    style: wrapped
  resource:
    # Wrapped, and in the plural key, even for one item. Reading a single post
    # means posts[0].
    style: wrapped
    array: true
  error:
    style: list
    key: errors
    message_field: message
    type_field: type
    code_field: "-"

resources:
  post:
    collection: posts
    id:
      style: opaque
      length: 24
    fields:
      title:
        type: string
        required: true
      slug:
        type: string
      # Lexical, a JSON string, not HTML. Posting HTML without saying so
      # produces an empty post: the call succeeds and the body is blank.
      lexical:
        type: string
      # Rendered output, and read-only. Sending it does nothing.
      html:
        type: string
      # published, draft, scheduled, sent. Four values, and two of them look
      # like states an integration never handles.
      status:
        type: string
        default: draft
      # In the future on a scheduled post, which is not on the site yet and
      # says nothing else about that.
      published_at:
        type: string
      # Set when the post was emailed. A post can be sent without ever being
      # on the site, and this is the only field that says so.
      email_segment:
        type: string
      # Members-only content. The post is listed publicly and its body is
      # withheld, so a scraper sees a title and an empty body rather than a
      # 403.
      visibility:
        type: string
        default: public
      featured:
        type: boolean
        default: false
      created_at:
        type: string
      updated_at:
        type: string

  member:
    collection: members
    id:
      style: opaque
      length: 24
    fields:
      email:
        type: string
        required: true
      name:
        type: string
      # free, comped, paid. A comped member pays nothing and has paid access,
      # so counting paid members by status undercounts the audience.
      status:
        type: string
        default: free
      # Whether they receive email at all. A member who unsubscribed is still
      # a member, still counted, and must not be mailed.
      newsletters:
        type: list
      email_count:
        type: integer
        default: 0
      # Ghost tracks this and it is the number a churn report wants, not the
      # member count.
      email_opened_count:
        type: integer
        default: 0
      created_at:
        type: string

  tier:
    collection: tiers
    id:
      style: opaque
      length: 24
    fields:
      name:
        type: string
        required: true
      # Amounts are in the smallest currency unit, like Stripe, because Ghost
      # bills through Stripe.
      monthly_price:
        type: integer
      currency:
        type: string
        default: usd
      # A tier that is not active still has members on it. Archiving a tier
      # does not move anybody off it.
      active:
        type: boolean
        default: true
      visibility:
        type: string
        default: public

routes:
  - method: GET
    path: /ghost/api/admin/posts
    resource: post
    operation: list
    pagination:
      # limit and page.
      style: page
      limit_param: limit
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 15

  - method: GET
    path: /ghost/api/admin/posts/{id}
    resource: post
    operation: get

  - method: POST
    path: /ghost/api/admin/posts
    resource: post
    operation: create
    status: 201

  - method: GET
    path: /ghost/api/admin/members
    resource: member
    operation: list
    pagination:
      # limit and page.
      style: page
      limit_param: limit
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 15

  - method: GET
    path: /ghost/api/admin/members/{id}
    resource: member
    operation: get

  - method: GET
    path: /ghost/api/admin/tiers
    resource: tier
    operation: list
    pagination:
      # limit and page.
      style: page
      limit_param: limit
      cursor_param: page
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 15

webhooks:
  events:
    - post.published
    - post.scheduled
    - post.unpublished
    - member.added
    - member.deleted
    - member.edited
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    type: TooManyRequestsError
    message: Too many requests

  # Struck live: a header carrying "Ghost " and a value with no dots at all
  # -- present, correctly prefixed, wrong shape. Two narrower shapes this
  # Recipe has no slot for (a raw key with no prefix; a well-formed JWT
  # missing its kid claim) are recorded in the header rather than guessed
  # into this one.
  authentication_error:
    status: 400
    type: BadRequestError
    message: "Invalid token"
    code_field: code
    code: INVALID_JWT

  # Struck live with no credential at all: a different status and type from
  # a present-but-malformed one.
  no_authentication:
    status: 403
    type: NoPermissionError
    message: "Authorization failed"

  # Struck live with no credential at all: the router answers before
  # authentication is ever consulted, which auth.after_routing declares.
  # Shorter than resource_missing's own message -- no ": {detail}" suffix.
  unknown_route:
    status: 404
    type: NotFoundError
    message: "Resource not found"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical body an unrouted path gets, not a
  # distinct 405.
  method_not_allowed:
    status: 404
    type: NotFoundError
    message: "Resource not found"

  resource_missing:
    status: 404
    type: NotFoundError
    message: "Resource not found: {detail}"

  parameter_missing:
    status: 422
    type: ValidationError
    message: "Validation failed: {detail} is required"

  # The failure a raw admin key produces. It reads as a bad key and the key is
  # fine: it needed to be signed into a token first.
  invalid_token:
    status: 401
    type: UnauthorizedError
    message: "Invalid token: the Authorization header should carry a JWT signed with the admin key"

  # Publishing a post whose slug is taken. Ghost appends a suffix in the
  # editor and refuses over the API, so an importer that worked by hand fails
  # in bulk.
  slug_taken:
    status: 422
    type: ValidationError
    message: "Validation error, cannot save post. Post slug already exists."

  # A post scheduled in the past is refused rather than published, which is
  # what a queued job hits when it runs late.
  schedule_in_past:
    status: 422
    type: ValidationError
    message: "Error, cannot schedule a post in the past."

fixtures:
  empty: {}

  small-site:
    tier:
      - id: tiercauldron00000000001
        name: Supporter
        # Smallest currency unit, like Stripe, because Ghost bills through
        # Stripe.
        monthly_price: 500
        currency: usd
        active: true
      - id: tiercauldron00000000002
        name: Retired tier
        monthly_price: 300
        currency: usd
        # Archived, and members are still on it. Archiving does not move
        # anybody off.
        active: false
        visibility: none

    member:
      - id: membcauldron00000000001
        email: ada@example.com
        name: Ada Lovelace
        status: paid
        newsletters:
          - id: newsletter-default
            name: Weekly
        email_count: 12
        email_opened_count: 9
      - id: membcauldron00000000002
        email: grace@example.com
        name: Grace Hopper
        # Comped: pays nothing and has paid access. Counting paid members by
        # status undercounts the audience.
        status: comped
        newsletters:
          - id: newsletter-default
            name: Weekly
      - id: membcauldron00000000003
        email: quiet@example.com
        status: free
        # Unsubscribed. Still a member, still counted, and must not be
        # mailed. An empty list rather than a missing field.
        newsletters: []

    post:
      - id: postcauldron00000000001
        title: Seasoning cast iron
        slug: seasoning-cast-iron
        lexical: '{"root":{"children":[{"type":"paragraph","children":[{"type":"text","text":"Heat, oil, repeat."}]}]}}'
        html: "<p>Heat, oil, repeat.</p>"
        status: published
        published_at: "2026-01-14T11:22:31.000Z"
        created_at: "2026-01-14T11:00:00.000Z"
      - id: postcauldron00000000002
        title: Announcing the winter range
        slug: winter-range
        status: scheduled
        # In the future, and not on the site. Nothing about the word
        # "scheduled" says unpublished to code checking for "draft".
        published_at: "2026-03-01T09:00:00.000Z"
      - id: postcauldron00000000003
        title: This week in the workshop
        slug: this-week
        # Sent as an email and never on the site. A post can exist entirely
        # as a newsletter, and this is the only field that says so.
        status: sent
        email_segment: all
        published_at: "2026-01-10T09:00:00.000Z"
      - id: postcauldron00000000004
        title: Members only notes
        slug: members-only
        html: ""
        status: published
        # Listed publicly with its body withheld. A scraper sees a title and
        # an empty body rather than a 403.
        visibility: members
        published_at: "2026-01-11T09:00:00.000Z"

# Conformance cases. The resource shapes are read from Ghost's Admin API
# reference rather than observed against a real member-facing site --
# publishing with an email filter sends real mail, so no site for one was
# ever created. The refusal cases at the end are struck live, unauthenticated,
# against demo.ghost.io, a real public Ghost install, and carry a verified
# date; see the header.
conformance:
  - name: a single post arrives in a plural array
    source: https://ghost.org/docs/admin-api/#posts
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts/postcauldron00000000001
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        # posts[0], not posts, and not the object itself. Code that reads the
        # response as the post finds an object with one array in it.
        posts[0].title: Seasoning cast iron
        posts[0].status: published
      absent:
        - title
        - post

  - name: a scheduled post is dated in the future and is not live
    source: https://ghost.org/docs/admin-api/#posts
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts/postcauldron00000000002
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        # Nothing about the word "scheduled" says unpublished to code checking
        # for "draft", and the date is the only other evidence.
        posts[0].status: scheduled
        posts[0].published_at: "2026-03-01T09:00:00.000Z"

  - name: a sent post was never on the site
    source: https://ghost.org/docs/admin-api/#email-only-posts
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts/postcauldron00000000003
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        # A post that exists entirely as an email. Publishing one is
        # irreversible: the mail is already gone.
        posts[0].status: sent
        posts[0].email_segment: all

  - name: content is Lexical rather than HTML
    source: https://ghost.org/docs/admin-api/#source-html
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts/postcauldron00000000001
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      matches:
        # A JSON string. Posting HTML without the source parameter produces an
        # empty post: the call succeeds and the body is blank.
        posts[0].lexical: '^\{"root":'

  - name: a members-only post is listed with an empty body
    source: https://ghost.org/docs/admin-api/#posts
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts/postcauldron00000000004
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        # Published, listed, and withheld. A scraper sees the title and an
        # empty body rather than a 403, so a content check that looks for a
        # status code finds nothing wrong.
        posts[0].visibility: members
        posts[0].html: ""
        posts[0].status: published

  - name: a comped member pays nothing and has paid access
    source: https://ghost.org/docs/admin-api/#members
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/members
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        members[0].status: paid
        # Counting paid members by status undercounts the audience by however
        # many were comped.
        members[1].status: comped
        members[2].status: free

  - name: an unsubscribed member has an empty newsletter list
    source: https://ghost.org/docs/admin-api/#members
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/members/membcauldron00000000003
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        # Still a member, still counted, and must not be mailed. An empty
        # list rather than a missing field, so a truthiness check on the
        # field passes and the length check is the one that matters.
        members[0].newsletters: []
        members[0].status: free

  - name: an archived tier still has members on it
    source: https://ghost.org/docs/admin-api/#tiers
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/tiers
      headers:
        Authorization: Ghost eyJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NjcyMjU2MDB9.cauldronSignature
    expect:
      status: 200
      body:
        tiers[0].active: true
        # Archived. Nobody was moved off it, and a price list that filters on
        # active loses the tier those members are actually paying for.
        tiers[1].active: false
        # Smallest currency unit, because Ghost bills through Stripe.
        tiers[1].monthly_price: 300

  - name: the raw admin key is not a token
    # Struck live: 400 BadRequestError INVALID_JWT, not the 401
    # UnauthorizedError this file declared before the probe. A colon-joined
    # id and secret has no dots, the same shape struck live directly.
    source: https://demo.ghost.io/ghost/api/admin/posts/
    verified: "2026-09-05"
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts
      headers:
        # The key itself, which is an id and a secret. It has to be signed
        # into a JWT first, and sending it raw fails as though the key were
        # wrong rather than as though it were the wrong kind of thing.
        Authorization: Ghost 65f1a2b3c4d5e6f7a8b9c0d1:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    expect:
      status: 400
      body:
        errors[0].type: BadRequestError
        errors[0].code: INVALID_JWT
        errors[0].message: "Invalid token"
      absent:
        - error
        - message
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        errors[0].message: '.'

  - name: no credential at all is a 403 naming no authenticated user
    # Struck live. A different status and type from a present-but-malformed
    # token's 400.
    source: https://demo.ghost.io/ghost/api/admin/posts/
    verified: "2026-09-05"
    fixture: small-site
    request:
      method: GET
      path: /ghost/api/admin/posts
    expect:
      status: 403
      body:
        errors[0].type: NoPermissionError
        errors[0].message: "Authorization failed"

  - name: a path this API does not route needs no credential either
    # Struck live with no credential at all. The router answers before
    # authentication is ever consulted, which auth.after_routing declares.
    # Shorter than resource_missing's own message -- no ": {detail}" suffix.
    source: https://demo.ghost.io/ghost/api/admin/not-a-real-endpoint/
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /ghost/api/admin/not-a-real-endpoint
    expect:
      status: 404
      body:
        errors[0].type: NotFoundError
        errors[0].message: "Resource not found"

  - name: a wrong method on a real path is the identical 404, not a 405
    # PATCH on /ghost/api/admin/posts, a method this Recipe does not declare
    # for it. Struck live with no credential at all.
    source: https://demo.ghost.io/ghost/api/admin/posts/
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PATCH
      path: /ghost/api/admin/posts
    expect:
      status: 404
      body:
        errors[0].type: NotFoundError
        errors[0].message: "Resource not found"
