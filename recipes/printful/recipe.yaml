# Printful Recipe for Cauldron
#
# One order carries two sets of money and neither is labelled as yours.
#
# costs is what Printful charges you to make and ship the thing. retail_costs
# is what you charged your customer. They sit side by side on the same order,
# with the same field names inside them -- subtotal, shipping, tax, total --
# and nothing in either name says which is which.
#
# So a revenue report reading total gets the wrong number and cannot tell,
# because both are real totals for the same order. Reading costs.total as
# revenue reports your supplier's invoice as income; reading retail_costs.total
# as cost of goods reports your own price as what you paid. The margin is the
# difference between two fields that look interchangeable.
#
# And they are not always in the same currency. Printful bills you in the
# store's currency and retail_costs is in whatever the customer paid, so an
# order can carry two totals in two currencies with a currency field on each
# that most code never reads.
#
# Six things worth modelling exactly:
#
#   1. Two sets of money on one order, wholesale and retail, with identical
#      field names inside them.
#   2. And two currencies, one per set, on the same record.
#   3. A draft order is not an order anybody will make. status is draft until
#      it is confirmed, and a client that creates one and walks away has a
#      customer waiting for a parcel nobody is printing.
#   4. There are two identifiers: Printful's id and the external_id you gave
#      it, and the endpoints take either -- prefixed with @ for yours. So the
#      same path segment means two different things depending on a character.
#   5. Shipping on a draft is an estimate. It is recalculated at
#      confirmation, so the number a customer was quoted can change between
#      the basket and the invoice.
#   6. Everything is wrapped in {code, result, paging}, and code repeats the
#      HTTP status inside the body.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Confirming an order is not modelled, so a draft stays a draft. The
#     shipping recalculation described above is a fixture difference rather
#     than something that happens.
#   - This is the v1 API. Printful has a v2 with a different envelope and
#     different object names, and a client written for one does not read the
#     other.
#   - The catalogue, mockup generation, files and warehousing are absent.
#     Only orders are modelled.
#
# Checked live against api.printful.com, unauthenticated, 2026-09-05. Three
# things this file had wrong or missing:
#
#   - Absent and Rejected are different sentences. No Authorization header
#     at all answers {"code":401,"result":"Unauthorized","error":
#     {"reason":"Unauthorized","message":"Unauthorized"}}. A syntactically
#     fine but fictitious bearer answers {"code":401,"result":"The access
#     token provided is invalid.","error":{"reason":"Unauthorized",
#     "message":"The access token provided is invalid."}} -- this file had
#     modelled one message, "Invalid or missing API key.", for both.
#   - result duplicates the message as a bare string on every failure, which
#     collides in spirit with the same key naming the wrapped payload on
#     success -- one name, an object on a good day and a string on a bad
#     one.
#   - Routing runs ahead of the credential, and even routing failures are
#     not one shape. An unrouted path answers 404 {"error":{"reason":
#     "NotFound","message":"Page not found."}}; a wrong method on a route
#     that exists answers a genuine 404 too, not a 405, with a different
#     sentence again: {"error":{"reason":"NotFound","message":"Not
#     found"}}. Neither needs a credential. Modelled with after_routing and
#     a method_not_allowed status of 404 rather than stated as a gap, since
#     both figures Cauldron's own mechanism can already carry.
#
# The token below is a fixture, not a secret. It belongs to no store.

recipe: printful
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.printful.com/docs/
  spec: https://developers.printful.com/docs/openapi.json
  spec_hash: aba3a81e9b1da3ac811fb443e4e7a69c7e3b4ae2c2560487b8fbea380d52cdaf
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_printful_token_0000
  # Verified live, 2026-09-05: a wrong bearer answers a different sentence
  # from a missing one, and routing is checked before either. See the file
  # header.
  rejected_error: invalid_access_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: result
    count_field: paging.total
    limit_field: paging.limit
    page_field: paging.offset
  resource:
    style: wrapped
    key: result
  error:
    style: flat
    message_field: error.message
    code_field: code
    type_field: "-"

resources:
  order:
    id:
      style: numeric
      type: number
    fields:
      # Yours. The endpoints take it too, prefixed with an at sign, so the
      # same path segment means two different things depending on a
      # character.
      external_id:
        type: string
        null_when_unset: true
      # draft, pending, failed, canceled, inprocess, onhold, partial,
      # fulfilled. A draft is not an order anybody will make.
      status:
        type: string
        default: draft
      shipping:
        type: string
      # What Printful charges you. Not revenue.
      costs:
        type: map
      # What your customer paid. Not cost of goods.
      retail_costs:
        type: map
      recipient:
        type: map
      items:
        type: list
      created:
        type: timestamp
      updated:
        type: timestamp

routes:
  - method: GET
    path: /orders
    resource: order
    operation: list
    pagination:
      style: offset
      limit: 20
      limit_param: limit
      cursor_param: offset
      # Offset paging starts at nought. Without this the first page
      # reports an offset of one, which is a page number wearing an
      # offset's name.
      first_page: 0

  - method: GET
    path: /orders/{id}
    resource: order
    operation: get

  - method: POST
    path: /orders
    resource: order
    operation: create

errors:
  # Verified live, 2026-09-05: no Authorization header at all.
  authentication_error:
    status: 401
    code: 401
    message: Unauthorized
    fields:
      result: Unauthorized
      error:
        reason: Unauthorized

  # Verified live, 2026-09-05: a syntactically fine but fictitious bearer.
  invalid_access_token:
    status: 401
    code: 401
    message: "The access token provided is invalid."
    fields:
      result: "The access token provided is invalid."
      error:
        reason: Unauthorized

  # Verified live, 2026-09-05, against an unrouted path.
  unknown_route:
    status: 404
    code: 404
    message: "Page not found."
    fields:
      result: "Page not found."
      error:
        reason: NotFound

  # Verified live, 2026-09-05, against a real path with an unsupported
  # method -- a real 404, not a 405, and a different sentence from the one
  # above.
  method_not_allowed:
    status: 404
    code: 404
    message: "Not found"
    fields:
      result: "Not found"
      error:
        reason: NotFound

  resource_missing:
    status: 404
    code: 404
    message: Order not found.

  parameter_missing:
    status: 400
    code: 400
    message: Missing required parameter recipient.

  rate_limit:
    status: 429
    code: 429
    message: Too many requests.
    headers:
      X-RateLimit-Limit: "120"
      X-RateLimit-Remaining: "0"

fixtures:
  empty: {}

  one-store:
    order:
      # Fulfilled, and carrying both sets of money. The margin is 34.05 and
      # neither field says so.
      - id: "88000001"
        external_id: shopify-5010101010
        status: fulfilled
        shipping: STANDARD
        # What Printful charged the store. In the store's currency.
        costs:
          currency: USD
          subtotal: "12.95"
          shipping: "4.99"
          tax: "0.00"
          total: "17.94"
        # What the customer paid. In the customer's currency, which is not
        # the same one.
        retail_costs:
          currency: EUR
          subtotal: "45.00"
          shipping: "6.99"
          tax: "0.00"
          total: "51.99"
        recipient:
          name: A Recipient
          country_code: DE
        items:
          - id: 1
            name: Cauldron tee
            quantity: 1
            price: "45.00"
            retail_price: "45.00"
        created: 1770000000
        updated: 1770003600
      # A draft. Nobody is printing this, and it looks like an order in every
      # other respect -- it has a recipient, items, and a total.
      - id: "88000002"
        external_id: shopify-5020202020
        status: draft
        shipping: STANDARD
        costs:
          currency: USD
          subtotal: "12.95"
          # An estimate. Recalculated when the order is confirmed.
          shipping: "4.99"
          tax: "0.00"
          total: "17.94"
        retail_costs:
          currency: EUR
          subtotal: "45.00"
          shipping: "6.99"
          tax: "0.00"
          total: "51.99"
        recipient:
          name: Another Recipient
          country_code: FR
        items:
          - id: 2
            name: Cauldron tee
            quantity: 1
            price: "45.00"
            retail_price: "45.00"
        created: 1770007200
        updated: 1770007200

conformance:
  - name: no Authorization header at all is a bare Unauthorized
    source: https://api.printful.com/orders
    verified: "2026-09-05"
    request:
      method: GET
      path: /orders
    expect:
      status: 401
      body:
        code: 401
        result: Unauthorized
        error.reason: Unauthorized
        error.message: Unauthorized

  - name: and a fictitious bearer names the token as the problem
    source: https://api.printful.com/orders
    verified: "2026-09-05"
    request:
      method: GET
      path: /orders
      headers:
        Authorization: Bearer cauldron_fake_probe_only_0000
    expect:
      status: 401
      body:
        code: 401
        result: "The access token provided is invalid."
        error.reason: Unauthorized
        error.message: "The access token provided is invalid."

  - name: an unrouted path is Page not found, needing no credential
    source: https://api.printful.com/nonexistent
    verified: "2026-09-05"
    request:
      method: GET
      path: /nonexistent
    expect:
      status: 404
      body:
        error.reason: NotFound
        error.message: "Page not found."

  - name: and a wrong method on a real path is Not found instead
    source: https://api.printful.com/orders
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /orders
    expect:
      status: 404
      body:
        error.reason: NotFound
        error.message: "Not found"

  - name: one order carries two sets of money
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders/88000001
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # What Printful charged the store, and what the customer paid, with
        # the same field names inside both. Reading result.costs.total as
        # revenue reports the supplier's invoice as income; reading
        # result.retail_costs.total as cost of goods reports your own price
        # as what you paid. Both are real totals for this order.
        result.costs.total: "17.94"
        result.retail_costs.total: "51.99"
        result.costs.subtotal: "12.95"
        result.retail_costs.subtotal: "45.00"

  - name: and the two are in different currencies
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders/88000001
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # Printful bills the store in dollars and the customer paid euros, on
        # one record. Subtracting one total from the other to get a margin
        # gives a number in no currency at all, and nothing errors.
        result.costs.currency: USD
        result.retail_costs.currency: EUR

  - name: money is a string throughout
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders/88000001
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # Quoted on both sides and on the line items, so every arithmetic a
        # margin needs is on text that has to be parsed first.
        result.costs.shipping: "4.99"
        result.retail_costs.shipping: "6.99"
        result.items[0].price: "45.00"
        result.items[0].retail_price: "45.00"

  - name: a draft order is not an order anybody will make
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders/88000002
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # It has a recipient, items, both totals and a shipping method. The
        # only thing that says nobody is printing it is this word, and a
        # client that creates an order and walks away has a customer waiting
        # for a parcel.
        result.status: draft
        result.recipient.country_code: FR
        result.items[0].quantity: 1

  - name: an order carries your identifier beside Printful's
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders/88000001
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # Printful's is a number and yours is whatever you sent. The
        # endpoints take either, with an at sign in front of yours, so the
        # same path segment means two different things depending on one
        # character -- and an external_id that happens to be numeric is
        # ambiguous without it.
        result.id: 88000001
        result.external_id: shopify-5010101010

  - name: the envelope repeats the status inside the body
    source: https://developers.printful.com/docs/
    fixture: one-store
    request:
      method: GET
      path: /orders/88000001
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # Under result, with the record one level down from where a client
        # looks first.
        result.status: fulfilled
      absent:
        # The shapes a client reaches for before finding the wrapper.
        - status
        - costs
        - id

  - name: a listing pages under its own key
    source: https://developers.printful.com/docs/
    fixture: one-store
    request:
      method: GET
      path: /orders
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        result[0].id: 88000001
        # Beside the result rather than inside it, and offset rather than
        # page -- so a client counting pages has to divide.
        paging.total: 2
        paging.limit: 20
        paging.offset: 0

  - name: and a draft is in it beside the fulfilled one
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: GET
      path: /orders
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # Both, and only one of them is being made. A report summing
        # retail_costs across this listing counts money nobody has been
        # charged for a parcel nobody is printing.
        result[0].status: fulfilled
        result[1].status: draft
        result[1].retail_costs.total: "51.99"

  - name: a created order is a draft
    source: https://developers.printful.com/docs/#tag/Orders-API
    fixture: one-store
    request:
      method: POST
      path: /orders
      headers:
        Authorization: Bearer cauldron_printful_token_0000
      json:
        external_id: shopify-5030303030
        shipping: STANDARD
    expect:
      status: 200
      body:
        # The headline, and it needs a create to be on the wire at all:
        # asserting it on a seeded record proved nothing, because the fixture
        # sets the field. Printful accepts the order, answers 200, and starts
        # nothing -- confirming is a separate call, and a client that posts
        # and walks away has a customer waiting for a parcel.
        result.status: draft
        result.external_id: shopify-5030303030

  - name: paging is an offset and not a page number
    source: https://developers.printful.com/docs/
    fixture: one-store
    request:
      method: GET
      path: /orders?limit=1&offset=1
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 200
      body:
        # The second order, addressed by how many to skip rather than by
        # which page. A client sending page=1 gets the first record again and
        # its loop never advances.
        result[0].id: 88000002
        paging.offset: 1
        paging.limit: 1
        paging.total: 2
      absent:
        - result[1]

  - name: a failure carries its message a level down
    source: https://developers.printful.com/docs/
    fixture: one-store
    request:
      method: GET
      path: /orders/99999999
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 404
      body:
        # error.message rather than message, with the code repeated beside
        # it as a number.
        error.message: Order not found.
        code: 404
      absent:
        - message
        - result

  - name: the rate limit counts per minute
    source: https://developers.printful.com/docs/
    arm: rate_limit
    fixture: one-store
    request:
      method: GET
      path: /orders
      headers:
        Authorization: Bearer cauldron_printful_token_0000
    expect:
      status: 429
      headers:
        X-RateLimit-Limit: "120"
        X-RateLimit-Remaining: "0"
      body:
        code: 429
