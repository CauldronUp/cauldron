# Lemon Squeezy Recipe for Cauldron
#
# Most of what makes Lemon Squeezy awkward, FastSpring already says. It is the
# merchant of record, so the tax is theirs and the order total is not what
# arrives; every amount comes twice, as an integer and as a preformatted
# string; a cancelled subscription keeps running until its period ends; and
# test and live records share one API and differ by a boolean. The FastSpring
# Recipe in this repository models all four, and repeating them here adds a
# name rather than a shape.
#
# They are still true of Lemon Squeezy and the cases below still assert them,
# because a Recipe that left out true things to avoid overlapping another one
# would be the wrong kind of tidy. But they are not why this Recipe exists.
#
# Four things that do differ:
#
#   1. A licence key is a credential your customer holds, and it is the only
#      thing in this API that somebody outside your company presents. It
#      carries an activation limit and a running count of machines, and the
#      count is what runs out -- not the subscription, which stays active
#      while every seat is taken and nobody new can install anything.
#   2. Every record is scoped to a store, and the store id is a field rather
#      than a path segment. One account can hold several stores, so an
#      identifier is only unique within one, and a report that reads the
#      whole account without grouping mixes two shops' revenue together.
#   3. The totals come twice in two currencies, not just twice in two
#      formats. A euro sale carries total in euro cents and total_usd in
#      dollar cents on the same record, and nothing in either name says which
#      set your accounts are in. FastSpring says the currency may be theirs
#      rather than yours; this carries both at once.
#   4. A partial refund is not refunded. status says partial_refund while the
#      refunded boolean stays false, both correctly, so a report keyed on the
#      boolean counts the order at its full total after a fifth of it has
#      gone back.
#
# And the envelope is JSON:API, so the record is at data.attributes and the
# identifier is at data.id -- outside the attributes, and a string even though
# it is digits. Reading data.total finds nothing.
#
# Struck live 2026-09-05 against api.lemonsqueezy.com, no account and no
# key. /v1/orders specifically is behind a Cloudflare bot challenge --
# "Attention Required!", checked and reproduced three times -- and no other
# path this Recipe models is: /v1/subscriptions, /v1/customers, /v1/products,
# /v1/variants, /v1/stores, /v1/discounts, /v1/license-keys and /v1/webhooks
# all answered a real 401 on the first try. Checked against
# /v1/subscriptions instead: the authentication failure's detail matched
# exactly, "Unauthenticated.", and its title did not -- the real word is
# Unauthorized, which this file had spelled as a second Unauthenticated. A
# top-level {"jsonapi":{"version":"1.0"}} sits beside every error this
# Recipe could reach and was not modelled at all; both are fixed below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The licence activation endpoint is not modelled, and it is the most
#     interesting thing about licence keys: it is public, and the credential
#     is the licence key itself, presented by the customer's own machine
#     rather than by your server. So one API has two kinds of caller with two
#     kinds of credential. Cauldron authenticates a Recipe rather than a
#     route, so a route that takes a different credential -- or none -- cannot
#     be described, and only the store-key half is here.
#   - Tax is a number on the record rather than something computed. Lemon
#     Squeezy works out the rate from the customer's country and whether they
#     gave a valid VAT number, which is the part that decides the figure.
#   - The relationships JSON:API sends alongside attributes are absent, so
#     data.relationships and included are not here.
#   - Products, variants, discounts and the checkout flow are not modelled.
#
# The key below is a fixture, not a secret. It belongs to no store.

recipe: lemonsqueezy
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.lemonsqueezy.com/api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5

responses:
  list:
    # Both resources name data as their collection, which is what the runtime
    # reads, so a key here would be inert -- and a declaration nothing
    # honours is the failure this project is about.
    style: wrapped
  resource:
    # JSON:API. The record is one level further down than the wrapper
    # suggests, and the identifier is not inside it.
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    message_field: detail
    code_field: "-"
    # Confirmed live 2026-09-05: every failure this Recipe could reach
    # carries this alongside the errors array, and nothing here modelled it.
    fields:
      jsonapi:
        version: "1.0"
    type_field: "-"

resources:
  order:
    collection: data
    id:
      # Digits, and a string, because JSON:API identifiers always are. Code
      # comparing this to a numeric id from anywhere else fails on type.
      style: numeric
      type: string
    fields:
      # A constant, so every record says what kind of thing it is in the
      # place JSON:API puts it.
      identifier:
        type: string
        in: attributes
      # One account can hold several stores, so an identifier is only unique
      # within one and a report that does not group by this mixes two shops.
      store_id:
        type: integer
        in: attributes
      order_number:
        type: integer
        in: attributes
      user_email:
        type: string
        in: attributes
      currency:
        type: string
        in: attributes
      # Before tax. Integer cents.
      subtotal:
        type: integer
        in: attributes
      # What Lemon Squeezy collected and will remit. Not yours.
      tax:
        type: integer
        in: attributes
      # What the customer paid. Includes the tax above.
      total:
        type: integer
        in: attributes
      # The same figures again in dollars, on the same record, with nothing
      # in the names to say which set your accounts are in.
      subtotal_usd:
        type: integer
        in: attributes
      tax_usd:
        type: integer
        in: attributes
      total_usd:
        type: integer
        in: attributes
      # Easier to reach and impossible to sum.
      total_formatted:
        type: string
        in: attributes
      tax_formatted:
        type: string
        in: attributes
      # paid, refunded, partial_refund, pending, failed.
      status:
        type: string
        default: paid
        in: attributes
      refunded:
        type: boolean
        default: false
        in: attributes
      refunded_amount:
        type: integer
        in: attributes
      # A test order looks exactly like a real one, and this is the only
      # difference.
      test_mode:
        type: boolean
        default: false
        in: attributes
      created_at:
        type: datetime
        in: attributes

  subscription:
    collection: data
    id:
      style: numeric
      type: string
    fields:
      store_id:
        type: integer
        in: attributes
      order_id:
        type: integer
        in: attributes
      product_name:
        type: string
        in: attributes
      user_email:
        type: string
        in: attributes
      # on_trial, active, paused, past_due, unpaid, cancelled, expired.
      status:
        type: string
        default: active
        in: attributes
      status_formatted:
        type: string
        in: attributes
      # True the moment somebody cancels. status stays active until the
      # period ends, so these two disagree on purpose.
      cancelled:
        type: boolean
        default: false
        in: attributes
      # When access actually stops. The date that matters, and it is not
      # when cancelled went true.
      ends_at:
        type: datetime
        null_when_unset: true
        in: attributes
      renews_at:
        type: datetime
        null_when_unset: true
        in: attributes
      test_mode:
        type: boolean
        default: false
        in: attributes
      created_at:
        type: datetime
        in: attributes

  license_key:
    collection: data
    id:
      style: numeric
      type: string
    fields:
      store_id:
        type: integer
        in: attributes
      order_id:
        type: integer
        in: attributes
      # The credential your customer holds. The only thing in this API
      # presented by somebody outside your company.
      key:
        type: string
        in: attributes
      # Shown in a customer portal, and not usable as a key.
      key_short:
        type: string
        in: attributes
      # inactive, active, expired, disabled. A key is inactive until the
      # first activation, which is not the same as disabled.
      status:
        type: string
        default: inactive
        in: attributes
      # How many machines may hold it. Null means unlimited, which is a
      # different state from zero and reads the same to code that treats a
      # missing value as none.
      activation_limit:
        type: integer
        null_when_unset: true
        in: attributes
      # How many hold it now. This is what runs out -- not the subscription,
      # which stays active while every seat is taken and nobody new can
      # install anything.
      instances_count:
        type: integer
        default: 0
        in: attributes
      disabled:
        type: boolean
        default: false
        in: attributes
      expires_at:
        type: datetime
        null_when_unset: true
        in: attributes
      created_at:
        type: datetime
        in: attributes

routes:
  - method: GET
    path: /v1/orders
    resource: order
    operation: list
    pagination:
      # Bracketed, JSON:API style. A client sending page and per_page is
      # answered with the first page of everything.
      style: page
      limit: 10
      limit_param: page[size]
      cursor_param: page[number]
      first_page: 1
    fields:
      # JSON:API says what kind of thing the document holds, beside the data
      # rather than inside each record.
      jsonapi.version: "1.0"

  - method: GET
    path: /v1/orders/{id}
    resource: order
    operation: get
    fields:
      data.type: orders
      jsonapi.version: "1.0"

  - method: GET
    path: /v1/subscriptions
    resource: subscription
    operation: list
    pagination:
      style: page
      limit: 10
      limit_param: page[size]
      cursor_param: page[number]
      first_page: 1
    fields:
      jsonapi.version: "1.0"

  - method: GET
    path: /v1/subscriptions/{id}
    resource: subscription
    operation: get
    fields:
      data.type: subscriptions
      jsonapi.version: "1.0"

  - method: GET
    path: /v1/license-keys
    resource: license_key
    operation: list
    pagination:
      style: page
      limit: 10
      limit_param: page[size]
      cursor_param: page[number]
      first_page: 1
    fields:
      jsonapi.version: "1.0"

  - method: GET
    path: /v1/license-keys/{id}
    resource: license_key
    operation: get
    fields:
      data.type: license-keys
      jsonapi.version: "1.0"

errors:
  # Confirmed live 2026-09-05 against api.lemonsqueezy.com, no account and no
  # key, on /v1/subscriptions (see the header for why not /v1/orders).
  # detail matched exactly; title did not -- the real word is Unauthorized,
  # not a second spelling of Unauthenticated.
  authentication_error:
    status: 401
    message: Unauthenticated.
    fields:
      status: "401"
      title: Unauthorized

  resource_missing:
    status: 404
    message: No query results for model.
    fields:
      status: "404"
      title: Not Found

  parameter_missing:
    status: 422
    message: The given data was invalid.
    fields:
      status: "422"
      title: Unprocessable Entity

  rate_limit:
    status: 429
    message: Too Many Attempts.
    fields:
      status: "429"
      title: Too Many Requests

fixtures:
  empty: {}

  small-store:
    order:
      # A euro sale to a German customer. Nineteen percent VAT, collected and
      # remitted by Lemon Squeezy, and the figure that reaches the store is
      # none of the three below.
      - id: "800001"
        identifier: 4d0e1f2a-3b4c-5d6e-7f80-91a2b3c4d5e6
        order_number: 1041
        user_email: kunde@example.de
        currency: EUR
        subtotal: 2000
        tax: 380
        total: 2380
        # The same sale in dollars, on the same record.
        subtotal_usd: 2160
        tax_usd: 410
        total_usd: 2570
        total_formatted: "€23.80"
        tax_formatted: "€3.80"
        status: paid
        refunded: false
        refunded_amount: 0
        test_mode: false
        created_at: "2026-02-01T09:15:00.000000Z"
      # Partially refunded, so status is not refunded and the money is not
      # what total says either.
      - id: "800002"
        identifier: 5e1f2a3b-4c5d-6e7f-8091-a2b3c4d5e6f7
        order_number: 1042
        user_email: buyer@example.com
        currency: USD
        subtotal: 4900
        tax: 0
        total: 4900
        subtotal_usd: 4900
        tax_usd: 0
        total_usd: 4900
        total_formatted: "$49.00"
        tax_formatted: "$0.00"
        status: partial_refund
        refunded: false
        refunded_amount: 1000
        # A test order, and identical to a real one in every other respect:
        # an order number, a total, a status, a receipt. Asserting the
        # default on the live order above proved nothing, because the field
        # is emitted either way -- this is the record that makes the claim.
        test_mode: true
        created_at: "2026-02-02T11:00:00.000000Z"
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '800003'
        identifier: 5e1f2a3b-4c5d-6e7f-8091-a2b3c4d5e6f7
        order_number: 1042
        user_email: buyer@example.com
        currency: USD
        subtotal: 4900
        tax: 0
        total: 4900
        subtotal_usd: 4900
        tax_usd: 0
        total_usd: 4900
        total_formatted: $49.00
        tax_formatted: $0.00
        status: partial_refund
        refunded: false
        refunded_amount: 1000
        test_mode: true
        created_at: '2026-02-02T11:00:00.000000Z'
    license_key:
      # Every seat taken. The subscription paying for this is active, the
      # customer is up to date, and nobody new can install anything -- and
      # the only field that says so is a count.
      - id: "950001"
        store_id: 42
        order_id: 800001
        key: 38b1460a-5104-4067-a91d-77b872934d51
        key_short: 38B1-4067
        status: active
        activation_limit: 3
        instances_count: 3
        disabled: false
        created_at: "2026-02-01T09:15:00.000000Z"
      # Unlimited activations, which is null rather than a large number and
      # reads as "none" to code that treats a missing value as zero.
      - id: "950002"
        store_id: 42
        order_id: 800002
        key: 4c2f7b91-6d30-4a12-b8e5-91c3d7a04f68
        key_short: 4C2F-4A12
        status: inactive
        activation_limit: null
        instances_count: 0
        disabled: false
        created_at: "2026-02-02T11:00:00.000000Z"
    subscription:
      # Cancelled, and still active until March. Both fields are true at
      # once and they are meant to be.
      - id: "900001"
        order_id: 800001
        product_name: Cauldron Pro
        user_email: kunde@example.de
        status: active
        status_formatted: Active
        cancelled: true
        ends_at: "2026-03-01T09:15:00.000000Z"
        renews_at: null
        test_mode: false
        created_at: "2026-01-01T09:15:00.000000Z"
      - id: "900002"
        order_id: 800002
        product_name: Cauldron Pro
        user_email: buyer2@example.com
        status: active
        status_formatted: Active
        cancelled: false
        renews_at: "2026-03-02T11:00:00.000000Z"
        test_mode: false
        created_at: "2026-02-02T11:00:00.000000Z"

conformance:
  - name: an unauthenticated request names the wrong word for the right sentence
    # This declared title as a second spelling of Unauthenticated; the real
    # word is Unauthorized. Confirmed live 2026-09-05, no account and no key,
    # against /v1/subscriptions -- /v1/orders is behind a Cloudflare
    # challenge on this host, see the header.
    source: https://api.lemonsqueezy.com/v1/subscriptions
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/subscriptions
    expect:
      status: 401
      body:
        jsonapi.version: "1.0"
        errors[0].detail: Unauthenticated.
        errors[0].status: "401"
        errors[0].title: Unauthorized

  - name: the record is at data.attributes and the id is not in it
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # A string, and outside the attributes. Code comparing this to a
        # numeric id from anywhere else fails on type before it fails on
        # value.
        data.id: "800001"
        data.type: orders
        # Beside the data rather than inside it, on a single record as well
        # as on a listing.
        jsonapi.version: "1.0"
        # One level further down than the wrapper suggests.
        data.attributes.order_number: 1041
      absent:
        # The two shapes a client reaches for first, neither of which JSON:API
        # sends.
        - data.total
        - total

  - name: an order carries several totals and none of them is yours
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # Before tax.
        data.attributes.subtotal: 2000
        # Collected by Lemon Squeezy and remitted by Lemon Squeezy. Counting
        # this as revenue overstates it by the German VAT rate.
        data.attributes.tax: 380
        # What the customer paid, tax included.
        data.attributes.total: 2380
        data.attributes.currency: EUR

  - name: and carries them again in dollars
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # The same sale, on the same record, in another currency. Nothing in
        # either name says which set a report should use, and summing a
        # mixture of the two is wrong by the exchange rate.
        data.attributes.total_usd: 2570
        data.attributes.tax_usd: 410
        data.attributes.subtotal_usd: 2160

  - name: money is integer cents beside a string that cannot be summed
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # 2380 cents and "€23.80". The formatted one is easier to reach and
        # parsing it back out needs the currency's decimal places, which the
        # string does not carry either.
        data.attributes.total: 2380
        data.attributes.total_formatted: "€23.80"
        data.attributes.tax_formatted: "€3.80"

  - name: a partial refund is not refunded
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800002
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # status says partial_refund and refunded says false, which are both
        # true. A report keyed on the boolean counts this order at its full
        # total and the customer has had a fifth of it back.
        data.attributes.status: partial_refund
        data.attributes.refunded: false
        data.attributes.refunded_amount: 1000
        data.attributes.total: 4900

  - name: a cancelled subscription is still active
    source: https://docs.lemonsqueezy.com/api/subscriptions
    fixture: small-store
    request:
      method: GET
      path: /v1/subscriptions/900001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # Both at once, on purpose. cancelled goes true the moment somebody
        # asks; status stays active until the period ends. Code reading
        # either one alone is wrong half the time -- gating access on
        # cancelled cuts a paying customer off early, and counting active
        # subscribers counts somebody who has already left.
        data.attributes.cancelled: true
        data.attributes.status: active
        # And the document says what kind of record it holds, which is
        # subscriptions here and orders on the endpoint above.
        data.type: subscriptions
        # The date that actually matters, and it is not when cancelled went
        # true.
        data.attributes.ends_at: "2026-03-01T09:15:00.000000Z"
      absent:
        # And it will not renew, so the field a client checks for the next
        # billing date is null rather than a date.
        - data.attributes.renews_at.day

  - name: a live subscription renews and does not end
    source: https://docs.lemonsqueezy.com/api/subscriptions
    fixture: small-store
    request:
      method: GET
      path: /v1/subscriptions/900002
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        data.attributes.cancelled: false
        data.attributes.renews_at: "2026-03-02T11:00:00.000000Z"
        # Null rather than absent, which are different on the wire.
        data.attributes.ends_at: null

  - name: every object says whether it is real
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        data.attributes.test_mode: false

  - name: and a test order is identical apart from the flag
    source: https://docs.lemonsqueezy.com/api/orders
    fixture: small-store
    request:
      method: GET
      path: /v1/orders/800002
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # An order number, a total, a status, a receipt -- all present, all
        # the same shape as the live order above. This flag is the only
        # difference, and a revenue report that does not filter on it counts
        # play money.
        data.attributes.test_mode: true
        data.attributes.order_number: 1042
        data.attributes.total: 4900
        data.attributes.status: partial_refund

  - name: a licence key runs out of seats while the subscription is fine
    source: https://docs.lemonsqueezy.com/api/license-keys
    fixture: small-store
    request:
      method: GET
      path: /v1/license-keys/950001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        data.type: license-keys
        # Three of three. The key is active, the subscription paying for it
        # is active, the customer is up to date -- and nobody new can install
        # anything. The only field that says so is a count, and neither the
        # status nor the subscription changes when it fills.
        data.attributes.activation_limit: 3
        data.attributes.instances_count: 3
        data.attributes.status: active
        data.attributes.disabled: false
        # The credential itself, in the attributes with everything else. The
        # short form beside it is for showing a customer and is not a key.
        data.attributes.key: 38b1460a-5104-4067-a91d-77b872934d51
        data.attributes.key_short: 38B1-4067

  - name: an unlimited licence has no limit rather than a large one
    source: https://docs.lemonsqueezy.com/api/license-keys
    fixture: small-store
    request:
      method: GET
      path: /v1/license-keys/950002
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
        # Null, not a big number and not absent. Code that treats a missing
        # limit as zero refuses every activation on an unlimited licence, and
        # code that compares instances_count against it compares against
        # nothing.
        data.attributes.activation_limit: null
        data.attributes.instances_count: 0
        # And inactive, which is not disabled: nobody has used it yet.
        data.attributes.status: inactive
        data.attributes.disabled: false

  - name: every record is scoped to a store
    source: https://docs.lemonsqueezy.com/api/stores
    fixture: small-store
    request:
      method: GET
      path: /v1/license-keys/950001
      headers:
        Authorization: Bearer eyJ0cGNhdWxkcm9ubGVtb25zcXVlZXp5
    expect:
      status: 200
      body:
