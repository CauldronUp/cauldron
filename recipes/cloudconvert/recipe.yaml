# CloudConvert Recipe for Cauldron
#
# The jobs listing, struck live against api.cloudconvert.com on 2026-09-13 with
# no credential, with a deliberately invalid one, and on a path that does not
# exist. Record shapes come from CloudConvert's own Node client, which is open.
#
# **Two failures, two formatters.** Struck live:
#
#   /v2/jobs           401 {"message":"Unauthenticated.","code":"UNAUTHENTICATED"}
#   /v2/cauldron-nope  404 {
#                              "message": "The route v2/cauldron-nope could not be found.",
#                              "code": "NOT_FOUND"
#                          }
#
# The 401 is compact and the 404 is pretty-printed with four spaces of indent.
# Same API, same two keys, two encoders -- visible only in the bytes, which is
# where a recorded-response test looks and nothing else does.
#
# **The 404 names the route without its leading slash.** `v2/cauldron-nope`, not
# `/v2/cauldron-nope`: the path as the router stored it rather than as the
# caller sent it. A client matching the message against the URL it requested
# will not find it.
#
# **`Unauthenticated.`** -- with the full stop -- is the framework's default
# sentence, and it answers a missing credential and a wrong one alike, so the
# two cannot be told apart.
#
# **A task changes shape depending on where you read it.** From the client's own
# types:
#
#   interface JobTask extends Omit<Task, 'job_id' | 'status'> { name; status }
#
# A task fetched on its own has `job_id` and a `TaskStatus`. The same task
# inside a job has neither -- it has a `name` and a `JobTaskStatus`, which is
# `TaskStatus` plus `queued`. So one object has two shapes and one of its
# statuses has an extra value, decided by which endpoint returned it.
#
# **The job's status is typed as a task's.** `Job.status` is `TaskStatus`, and
# the same file separately defines `JobStatus = 'processing' | 'finished' |
# 'error'` -- a type that the `Job` interface never uses. So the client
# publishes a type for a job's status and types the job's status as something
# else.
#
# **Every task carries a `message` and a `code` even when nothing went wrong.**
# Both are `string | null` on the record, so a successful task's error fields
# are present and null, and a client testing for their presence finds them.
#
# **And two fields are optional *and* nullable.** `retry_of_task_id?: string |
# null` and `retries?: string[] | null` -- absent, null, or a value, which is
# three states where two would do.

recipe: cloudconvert
capability: media
version: 0.1.0

upstream:
  api: v2
  docs: https://cloudconvert.com/api/v2
  # No spec: CloudConvert's API reference is a single-page application that
  # answers the same 210KB of HTML at every path, so there is no document to
  # fetch. The record shape below is read from cloudconvert-node, which is the
  # artefact a description would have produced.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.cl0udc0nvert.f1xture
  # One sentence for both states.
  absent_error: unauthenticated
  rejected_error: unauthenticated
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  job:
    id:
      field: id
      style: uuid
    fields:
      # A caller's own label, nullable.
      tag:
      # Typed as a task's status by the client, which separately defines a
      # JobStatus it does not use here.
      status:
        type: string
      created_at:
        type: datetime
      # Null until the job starts, and null again if it never does.
      started_at:
      ended_at:
      # Each one a task with job_id and status removed and name and a
      # different status added.
      tasks:
        type: list

routes:
  - method: GET
    path: /v2/jobs
    resource: job
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: "per_page"
      cursor_param: "page"

errors:
  unauthenticated:
    status: 401
    code: UNAUTHENTICATED
    # The framework's default sentence, with its full stop.
    message: Unauthenticated.

  unknown_route:
    status: 404
    code: NOT_FOUND
    # The path as the router stored it: no leading slash.
    message: The route v2/cauldron-nope could not be found.

fixtures:
  empty:
    job: []

  account:
    job:
      - id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        tag: nightly-import
        status: finished
        created_at: "2026-06-02T14:12:05+00:00"
        started_at: "2026-06-02T14:12:06+00:00"
        ended_at: "2026-06-02T14:12:41+00:00"
        tasks:
          - id: b8f9b663-0a3b-cf45-587a-be880946e881
            # Present here and absent on a task fetched on its own.
            name: import-my-file
            operation: import/url
            status: finished
            # The error fields, on a task that did not fail.
            message: null
            code: null
            credits: 0
            created_at: "2026-06-02T14:12:05+00:00"
            started_at: "2026-06-02T14:12:06+00:00"
            ended_at: "2026-06-02T14:12:09+00:00"
            depends_on_tasks: {}
            engine: url
            engine_version: "1.0"
            payload:
              url: https://example.com/input.pdf
          - id: cf2e9a71-4d3b-4a8e-9f1c-2b7d5e6a3c90
            name: convert-my-file
            operation: convert
            # The extra value a task only has inside a job.
            status: queued
            message: null
            code: null
            credits: null
            created_at: "2026-06-02T14:12:05+00:00"
            started_at: null
            ended_at: null
            depends_on_tasks:
              import-my-file: finished
            engine: office
            engine_version: "2024"
            payload:
              output_format: docx
      - id: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        # Nullable, and null.
        tag: null
        status: error
        created_at: "2026-06-03T09:00:00+00:00"
        started_at: "2026-06-03T09:00:01+00:00"
        ended_at: "2026-06-03T09:00:04+00:00"
        tasks:
          - id: d2a9c1b0-4e55-4d3f-8b2a-7f6d3e5c9b21
            name: import-my-file
            operation: import/url
            status: error
            # And here they carry something.
            message: The file could not be downloaded.
            code: IMPORT_FAILED
            credits: 0
            created_at: "2026-06-03T09:00:00+00:00"
            started_at: "2026-06-03T09:00:01+00:00"
            ended_at: "2026-06-03T09:00:04+00:00"
            depends_on_tasks: {}
            engine: url
            engine_version: "1.0"
            payload:
              url: https://example.com/missing.pdf

conformance:
  - name: a missing credential is the framework's default sentence
    source: https://api.cloudconvert.com/v2/jobs
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers: {}
    expect:
      status: 401
      body:
        # With the full stop.
        message: Unauthenticated.
        code: UNAUTHENTICATED

  - name: a wrong credential is the same sentence
    source: https://api.cloudconvert.com/v2/jobs
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Indistinguishable from the case above.
        message: Unauthenticated.
        code: UNAUTHENTICATED

  - name: the unrouted path is named without its leading slash
    source: https://api.cloudconvert.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 404
      body:
        # The path as the router stored it, not as the caller sent it.
        message: The route v2/cauldron-nope could not be found.
        code: NOT_FOUND

  - name: a task inside a job has a name and no job id
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        # Omit<Task, 'job_id' | 'status'> plus a name and a different status.
        'data[0].tasks[0].name': import-my-file
        'data[0].tasks[0].id': b8f9b663-0a3b-cf45-587a-be880946e881
        'data[0].tasks[0].operation': import/url

  - name: a task inside a job can be queued and one on its own cannot
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        # JobTaskStatus is TaskStatus plus this one extra value.
        'data[0].tasks[1].status': queued
        'data[0].tasks[0].status': finished

  - name: the error fields are on a task that did not fail
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/TasksResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        # Present and null on a success, populated on a failure: a client
        # testing for their presence finds them either way.
        'data[0].tasks[0].message': null
        'data[0].tasks[0].code': null
        'data[1].tasks[0].message': The file could not be downloaded.
        'data[1].tasks[0].code': IMPORT_FAILED

  - name: a job's tag is the caller's and may be absent
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        'data[0].tag': nightly-import
        'data[1].tag': null
        'data[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        'data[0].status': finished
        'data[1].status': error

  - name: a job that never started says so twice
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        # A queued task has no start and no end, and the job that holds it
        # has both.
        'data[0].tasks[1].started_at': null
        'data[0].tasks[1].ended_at': null
        'data[0].started_at': "2026-06-02T14:12:06+00:00"
        'data[0].ended_at': "2026-06-02T14:12:41+00:00"
        'data[0].created_at': "2026-06-02T14:12:05+00:00"
        # And the dependency map keys a task by the name it only has inside
        # a job.
        'data[0].tasks[1].depends_on_tasks.import-my-file': finished
        'data[0].tasks[0].depends_on_tasks': {}
        'data[0].tasks[1].engine': office
        'data[0].tasks[1].engine_version': "2024"
        'data[0].tasks[1].credits': null
        'data[0].tasks[0].credits': 0
        'data[0].tasks[1].payload.output_format': docx

  - name: the listing pages by number
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: account
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        'data[0].id': 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        'data[0].tag': null

  - name: an account with no jobs still sends the envelope
    source: https://github.com/cloudconvert/cloudconvert-node/blob/master/lib/JobsResource.ts
    fixture: empty
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0n.cl0udc0nvert.f1xture"
    expect:
      status: 200
      body:
        data: []
