# Appwrite Recipe for Cauldron
#
# The health surface, struck live against cloud.appwrite.io on 2026-09-13 with
# no credential, with a project header naming a project that does not exist,
# with an API key beside it, and on a path that does not exist.
#
# **Every failure carries the API's version number.** Struck live:
#
#   /v1/account      401 {"message":"User (role: guests) missing scopes ([\"account\"])",
#                         "code":401,"type":"general_unauthorized_scope","version":"2.0.0"}
#   wrong project    404 {"message":"Project with the requested ID could not be found. Please
#                         check the value of the X-Appwrite-Project header to ensure the correct
#                         project ID is being used.","code":404,"type":"project_not_found",
#                         "version":"2.0.0"}
#   /v1/cauldron-nope 404 <!DOCTYPE html>... (the Appwrite console)
#
# `version` is on every JSON failure, and nowhere on a success except the one
# endpoint whose entire body it is. `GET /v1/health/version` answers
# `{"version":"2.0.0"}` -- so the only public endpoint on this API returns
# exactly the field every failure already carries.
#
# **The message contains an escaped JSON array.** `missing scopes ([\"account\"])`
# -- a JSON array, serialised into the human sentence, with its quotes escaped
# for the second encoding. The machine-readable part of the failure is embedded
# as text inside the human-readable part, so a client that wants the scope has
# to parse a sentence.
#
# **And the anonymous caller is a user with a plural role.** `User (role:
# guests)` -- one caller, described as a user, with the role `guests`.
#
# **A project that does not exist is a 404, with or without a key.** Sending
# `X-Appwrite-Project: cauldron-nope` answers `project_not_found` whether an
# `X-Appwrite-Key` accompanies it or not. The project is resolved before the
# credential is read, so a mistyped project id and a missing resource are the
# same answer, and the key is never examined.
#
# **The 404's message is instructions.** "Please check the value of the
# X-Appwrite-Project header to ensure the correct project ID is being used." --
# a sentence addressed to a person, in the field a client reads.
#
# **`code` is the HTTP status and `type` is the code.** `"code":401` duplicates
# the status line, and the string a client would actually branch on --
# `general_unauthorized_scope`, `project_not_found` -- is under `type`. So the
# field named for a code carries a number that is already in the response, and
# the one named for a category carries the code.
#
# **And an unrouted path answers the console.** A full `<!DOCTYPE html>` page
# with a viewport meta tag and a link to Appwrite's own favicon, served from the
# API host where a JSON client expected an error.
#
# **One health endpoint is public and its siblings are not.** `/v1/health/version`
# answers 200 to a caller with nothing; `/v1/health` and `/v1/health/time` answer
# 401 `missing scopes (["health.read"])` to the same caller.

recipe: appwrite
capability: database
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://appwrite.io/docs/references/cloud/server-nodejs/health
  # No spec at a fetchable address: Appwrite generates its OpenAPI per platform
  # at build time and serves the reference as a documentation site. The version
  # above is what the API reports about itself, in every failure and at
  # /v1/health/version.

auth:
  # The project is a header of its own, and it is resolved before anything
  # examines the key.
  scheme: header
  header: X-Appwrite-Key
  keys:
    - cauldr0n-appwr1te-f1xture-k3y
  absent_error: unauthorized_scope
  rejected_error: unauthorized_scope
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    # The HTTP status again, in the field named for a code...
    code_field: code
    code_type: number
    # ...while the string a client branches on is the category.
    type_field: type
    fields:
      # On every failure, and on no success but the one below.
      version: "2.0.0"

resources:
  health:
    id:
      # The endpoint has no identifier. Its one field is the whole body.
      field: "-"
      style: opaque
      carried_by: version
    fields:
      version:
        type: string

routes:
  - method: GET
    # The one endpoint that answers a caller with no credential at all, and
    # the only place `version` appears on a success.
    path: /v1/health/version
    resource: health
    operation: get
    id_from: auth
    public: true

  - method: GET
    # The neighbours of that endpoint, which answer the scope failure to the
    # same caller it answers 200 to.
    path: /v1/health
    public: true
    error: unauthorized_scope

  - method: GET
    path: /v1/health/time
    public: true
    error: unauthorized_scope

  - method: GET
    # A project header naming a project that does not exist -- answered the
    # same way with a key and without one, because the project is resolved
    # before the credential is read.
    path: /v1/projects/{project}
    public: true
    error: project_not_found

errors:
  unauthorized_scope:
    status: 401
    code: "401"
    type: general_unauthorized_scope
    # A JSON array, escaped into a sentence.
    message: "User (role: guests) missing scopes ([\"health.read\"])"

  project_not_found:
    # 404 for a project header naming a project that does not exist, whether
    # or not a key comes with it.
    status: 404
    code: "404"
    type: project_not_found
    # Instructions, in the field a client reads.
    message: "Project with the requested ID could not be found. Please check the value of the X-Appwrite-Project header to ensure the correct project ID is being used."

  unknown_route:
    status: 404
    # The Appwrite console, from the API host.
    style: text
    message: "<!DOCTYPE html><html lang=\"en\"><head> <meta charset=\"UTF-8\">"
    headers:
      Content-Type: text/html; charset=UTF-8

fixtures:
  empty:
    health: []

  instance:
    health:
      - version: "2.0.0"

conformance:
  - name: the only public endpoint returns the field every failure carries
    source: https://cloud.appwrite.io/v1/health/version
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /v1/health/version
      headers: {}
    expect:
      status: 200
      body:
        # The whole body, and the same string that is on every error.
        version: "2.0.0"

  - name: a caller with nothing is a user with a plural role
    source: https://cloud.appwrite.io/v1/health
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /v1/health
      headers: {}
    expect:
      status: 401
      body:
        # A JSON array escaped into the sentence, so reading the scope means
        # parsing prose.
        message: "User (role: guests) missing scopes ([\"health.read\"])"
        # The status again, in the field named for a code.
        code: 401
        # And the string a client would branch on, under type.
        type: general_unauthorized_scope
        version: "2.0.0"

  - name: a sibling of the public endpoint is not public
    source: https://cloud.appwrite.io/v1/health/time
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /v1/health/time
      headers: {}
    expect:
      # 401, from the neighbour of an endpoint that answers 200 to the same
      # caller.
      status: 401
      body:
        type: general_unauthorized_scope
        code: 401

  - name: a project that does not exist is a 404
    source: https://cloud.appwrite.io/v1/account
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /v1/projects/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # Instructions, in the field a client reads, and the same answer
        # whether or not a key accompanies the header.
        message: "Project with the requested ID could not be found. Please check the value of the X-Appwrite-Project header to ensure the correct project ID is being used."
        type: project_not_found
        code: 404
        version: "2.0.0"

  - name: an unrouted path answers the console
    source: https://cloud.appwrite.io/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # HTML, from the API host, where a JSON client expected an error.
        Content-Type: text/html; charset=UTF-8
      body_matches: '\A<!DOCTYPE html>'
