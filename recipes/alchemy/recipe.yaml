# Alchemy Recipe for Cauldron
#
# Alchemy is Ethereum JSON-RPC over HTTP, and the credential is a path
# segment: POST https://eth-mainnet.g.alchemy.com/v2/{apiKey}, the key
# sitting in the URL rather than a header or a query parameter. Every other
# scheme Cauldron declares -- bearer, basic, header, query -- assumes the
# credential travels somewhere a request can carry it independently of the
# route. Here it *is* the route, the same trade Inngest's Recipe in this
# collection makes for its own path-carried event key, and this Recipe
# follows it: auth.scheme is none, and what a real key, a wrong one and no
# key at all get is reproduced as literal routes instead.
#
# **A block is the one resource in this whole group that genuinely carries
# both a timestamp and a sequence number, unforced.** eth_getBlockByNumber's
# result is an object with number ("0x68b3") and timestamp ("0x5835c54d")
# sitting beside each other, hex Unix seconds and hex block height, on every
# block Ethereum has ever produced -- a node provider does not get to choose
# whether to attach either one, because both are consensus fields. Compare
# eth_blockNumber, a call at least as common: its result is a bare hex
# string, "0x2377", not even wrapped in an object -- the sequence number
# itself, alone, with nothing saying when. One provider, one call away from
# each other, "both" and "only a sequence."
#
# **An invalid key in the path and an absent one answer identically, live:**
#
#   POST /v2/thisisnotarealkeyatall0000000000  -> 401
#     {"jsonrpc":"2.0","id":1,"error":{"code":-32600,
#      "message":"Must be authenticated!"}}
#   POST /v2/                                  -> 401, byte-identical
#   POST /v2                                   -> 401, byte-identical
#
# A path segment that cannot be a real key and a request with no segment
# there at all get the same status, the same code and the same sentence.
# Nothing about the response says which mistake was made, the same collapse
# Airbyte's Recipe in this collection records for its own bearer header.
#
# **And routing never gets a turn before that check does, for any request
# this Recipe could construct without a working key:**
#
#   GET  /v2/thisisnotarealkeyatall0000000000  -> 401, plain text,
#                                                  "Must be authenticated!"
#   GET  /v2/                                  -> 401, byte-identical
#   GET  /nosuchroute                          -> 401, byte-identical
#   POST /nosuchroute (real JSON-RPC body)     -> 401, byte-identical
#
# A path this host has no route for at all is refused exactly like a path
# that only differs by a bad key, for every method and body this Recipe
# tried. There is no 404 anywhere on this host for anything probed here --
# credential absence is checked first, unconditionally, the same ordering
# Airbyte's Recipe already names and the opposite of Fireworks', whose
# gateway resolves the route and the method before it ever asks who is
# calling.
#
# **The Content-Type on that plain-text answer is lying, and only on GET.**
# POST to the key-shaped path with a bad key gets a real, valid JSON-RPC
# envelope, Content-Type: application/json, and it is well-formed JSON. GET
# to the identical path gets Content-Type: application/json and twenty-two
# bytes of bare text -- Must be authenticated! -- no braces, no quotes, not
# parseable as anything. The header says the same thing on both; only one of
# them is telling the truth. Compare Together's Recipe in this collection,
# whose provider labels its equivalent failure text/plain honestly -- this
# is the dishonest version of the same split.
#
# **The shared "demo" key Alchemy's own docs use for every worked example is
# exhausted, right now, on every network this Recipe tried:**
#
#   POST eth-mainnet.g.alchemy.com/v2/demo    -> 429, zero bytes
#   POST polygon-mainnet.g.alchemy.com/v2/demo -> 429, zero bytes
#   POST eth-sepolia.g.alchemy.com/v2/demo    -> 429, zero bytes
#
# not retried past the first 429 on each, per this project's own rule about
# rate limits -- the three results are the finding. Alchemy's own
# documentation says a 429 carries a Retry-After header and, on the
# WebSocket transport, a JSON-RPC error body naming a specific compute-unit
# message; none of that arrived here. Zero bytes, no Retry-After, no
# Content-Type at all. The gap between what the docs describe and what a
# world-shared example key actually returns today is itself worth having --
# and it means a well-formed key used against a network it may or may not
# be entitled to could not be distinguished here from one that is simply
# out of budget: both, on this evidence, are 429. Alchemy's own error
# reference lists no separate code for "this key cannot reach this network"
# at all, which is consistent with what was observed rather than a gap in
# what was checked.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful call was ever made. The shared demo key is throttled on
#     every network tried, and this Recipe holds no other. block and
#     eth_blockNumber's shape are taken verbatim from Alchemy's own
#     published reference examples -- the "0x68b3" block and its
#     "0x2377" -- cited and not observed, so those two cases carry source
#     and no verified date. Every failure case does carry one: nothing
#     about refusing a caller needed a working key.
#   - Cauldron's route matching has no way to read a POST body's JSON-RPC
#     "method" field the way it reads a header or a query parameter for
#     other providers -- selects_body exists for exactly this and is used
#     here for the first time in this collection outside GraphQL, matching
#     eth_blockNumber and eth_getBlockByNumber apart by the whole word in
#     the raw body. Every other JSON-RPC method Alchemy answers -- and
#     there are dozens -- gets whatever the templated fallback route below
#     answers, which is the credential-failure shape, because no third
#     method was verified.
#   - Only mainnet's numbers are recorded, for one block. Ethereum produces
#     a new one every twelve seconds; the shape is what does not move.
#   - No signing, no sendRawTransaction, nothing that could broadcast
#     anything. Every route here is a read.
#   - No upstream.spec. Alchemy's reference is one interactive page per
#     RPC method with no single fetchable document behind it, the same gap
#     Fireworks' Recipe in this collection states for the same reason.
#
# Every case below carries source. A verified date means this Recipe called
# the named host with exactly the request shown, on 2026-09-02, and recorded
# exactly what came back.

recipe: alchemy
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://www.alchemy.com/docs/reference/eth-getblockbynumber

auth:
  # The credential is the path itself -- see the header. Every case below
  # is a literal route rather than a declared scheme.
  scheme: none

responses:
  error:
    # {"jsonrpc":"2.0","id":1,"error":{"code":-32600,"message":"..."}} --
    # jsonrpc and id sit outside the nested object, on every JSON failure
    # this Recipe reached.
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: "-"

routes:
  # The fixture key, asked what block Ethereum is on. Cited from Alchemy's
  # own reference, not observed -- see the header.
  - method: POST
    path: /v2/cauldron-alchemy-fixture-key-000000000000
    selects_body: eth_blockNumber
    raw:
      content_type: application/json
      text: '{"jsonrpc":"2.0","id":1,"result":"0x2377"}'

  # The same fixture key, asked for the block itself. number and timestamp
  # sit beside each other -- see the header. Cited, not observed.
  - method: POST
    path: /v2/cauldron-alchemy-fixture-key-000000000000
    selects_body: eth_getBlockByNumber
    raw:
      content_type: application/json
      text: '{"jsonrpc":"2.0","id":1,"result":{"number":"0x68b3","hash":"0xd5f1812548be429cbdc6376b29611fc49e06f1359758c4ceaaa3b393e2239f9c","parentHash":"0x1f68ac259155e2f38211ddad0f0a15394d55417b185a93923e2abe71bb7a4d6d","timestamp":"0x5835c54d","miner":"0xb42b6c4a95406c78ff892d270ad20b22642e102d","gasLimit":"0x47e7c4","gasUsed":"0x37993","transactions":["0xa0807e117a8dd124ab949f460f08c36c72b710188f01609595223b325e58e0fc","0xeae6d797af50cb62a596ec3939114d63967c374fa57de9bc0f4e2b576ed6639d"]}}'

  # The world-shared example key from Alchemy's own quickstart docs,
  # throttled on every network tried -- see the header. Not retried.
  - method: POST
    path: /v2/demo
    error: demo_exhausted

  # A key that cannot be real. Live, JSON-RPC shaped: this host still
  # answers a syntactically valid envelope even while refusing the request.
  - method: POST
    path: /v2/{key}
    error: must_be_authenticated

  # No key segment at all -- the empty case -- gets the byte-identical
  # answer above. Live.
  - method: POST
    path: /v2/
    error: must_be_authenticated

  # A path with no route at all, POSTed a genuine JSON-RPC body. Still 401,
  # but this time the plain-text shape below, not the JSON-RPC one above --
  # see the header: only the /v2/* path shape earns the courtesy envelope.
  - method: POST
    path: /nosuchroute
    status: 401
    raw:
      content_type: application/json
      text: "Must be authenticated!"

  # GET to the key-shaped path, valid key or not untested -- see the
  # header. The Content-Type lies here in a way the POST failure above does
  # not: labelled application/json, and not JSON.
  - method: GET
    path: /v2/{key}
    status: 401
    raw:
      content_type: application/json
      text: "Must be authenticated!"

  # GET to a route this host does not have, live, and the identical bytes.
  - method: GET
    path: /nosuchroute
    status: 401
    raw:
      content_type: application/json
      text: "Must be authenticated!"

errors:
  must_be_authenticated:
    status: 401
    code: "-32600"
    message: Must be authenticated!
    # jsonrpc and id are Alchemy's envelope, not this failure's -- see the
    # header for why they sit outside the nested error object.
    fields:
      jsonrpc: "2.0"
      id: 1

  # Zero bytes, no Retry-After -- see the header for what the documentation
  # says instead.
  demo_exhausted:
    status: 429
    empty: true

fixtures:
  empty: {}

conformance:
  - name: eth_blockNumber answers a bare hex string and nothing else
    source: https://www.alchemy.com/docs/reference/eth-blocknumber
    fixture: empty
    request:
      method: POST
      path: /v2/cauldron-alchemy-fixture-key-000000000000
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_blockNumber
    expect:
      status: 200
      body:
        result: "0x2377"
      absent:
        - timestamp
        - time

  - name: eth_getBlockByNumber is the one call in this group with both a sequence and a timestamp
    source: https://www.alchemy.com/docs/reference/eth-getblockbynumber
    fixture: empty
    request:
      method: POST
      path: /v2/cauldron-alchemy-fixture-key-000000000000
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_getBlockByNumber
        params:
          - "0x68b3"
          - false
    expect:
      status: 200
      body:
        result.number: "0x68b3"
        result.timestamp: "0x5835c54d"
        result.hash: "0xd5f1812548be429cbdc6376b29611fc49e06f1359758c4ceaaa3b393e2239f9c"

  - name: a key that cannot be real answers a well-formed JSON-RPC refusal
    source: https://eth-mainnet.g.alchemy.com/v2/thisisnotarealkeyatall0000000000
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /v2/thisisnotarealkeyatall0000000000
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_blockNumber
        params: []
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        jsonrpc: "2.0"
        id: 1
        error.code: -32600
        error.message: Must be authenticated!

  - name: no key segment at all gets the identical refusal
    source: https://eth-mainnet.g.alchemy.com/v2/
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /v2/
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_blockNumber
        params: []
    expect:
      status: 401
      body:
        error.code: -32600
        error.message: Must be authenticated!

  - name: a path with no route at all is refused before routing gets a turn
    source: https://eth-mainnet.g.alchemy.com/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /nosuchroute
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_blockNumber
        params: []
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body_matches: "^Must be authenticated!$"

  - name: GET carries the same refusal under a Content-Type that is lying
    source: https://eth-mainnet.g.alchemy.com/v2/thisisnotarealkeyatall0000000000
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v2/thisisnotarealkeyatall0000000000
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body_matches: "^Must be authenticated!$"

  - name: and so does GET to a route that does not exist at all
    source: https://eth-mainnet.g.alchemy.com/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute
    expect:
      status: 401
      body_matches: "^Must be authenticated!$"

  - name: the shared demo key is out of budget, on this evidence indistinguishable from a network it cannot reach
    source: https://eth-mainnet.g.alchemy.com/v2/demo
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /v2/demo
      json:
        jsonrpc: "2.0"
        id: 1
        method: eth_blockNumber
        params: []
    expect:
      status: 429
