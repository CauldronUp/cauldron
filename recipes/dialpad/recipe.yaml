# Dialpad Recipe for Cauldron
#
# Written against Dialpad's API reference at developers.dialpad.com and struck
# live against dialpad.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The error envelope is Google's, on an API that is not Google's.** Struck
# live:
#
#   GET /api/v2/users                       (no credential)
#   401 {"error": {"code": 401,
#                  "errors": [{"domain": "global",
#                              "message": "A valid API key must be provided.",
#                              "reason": "required"}],
#                  "message": "A valid API key must be provided."}}
#
# That is the Google JSON-C error format, field for field: a nested `error`
# object, a numeric `code`, an `errors` array whose entries carry `domain`,
# `message` and `reason`, and the message repeated at both levels. Google
# deprecated it years ago in favour of `google.rpc.Status`, and
# [firebaseauth](../firebaseauth) in this collection still serves the newer
# shape from the same company.
#
# So a client written against Firebase's errors does not parse Dialpad's, and a
# client written against Dialpad's parses a decade-old Google convention it
# will not meet anywhere else.
#
# **`domain` is "global" and `reason` is "required".** Those are Google's own
# vocabularies, not Dialpad's, and neither says anything about Dialpad. The
# message is the only Dialpad-specific string in the document, and it appears
# twice.
#
# **An unknown path is `text/plain`, and it is App Engine's.** Struck live:
#
#   GET /api/v2/cauldron-nope
#   404  Content-Type: text/plain
#   Requested URL /api/v2/cauldron-nope not found
#
# App Engine's default handler, echoing the path back. Between that and the
# JSON-C envelope, both halves of this API's failure behaviour are Google
# infrastructure showing through rather than anything Dialpad wrote.
#
# **A missing credential and a wrong one are the same response**, so the two
# failures with different fixes are one body -- and the `reason` field, the
# closest thing here to a machine-readable cause, says "required" for a
# credential that was supplied.

recipe: dialpad
capability: voice
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.dialpad.com/reference
  # No spec: Dialpad publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldrondialpadfixturekey00000000
  # One response for both, struck live.
  absent_error: api_key_required
  rejected_error: api_key_required

responses:
  list:
    style: wrapped
    key: items
    cursor_field: cursor
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: number
    type_field: "-"

resources:
  user:
    id:
      # A 19-digit integer sent as a string, which is what Datastore
      # identifiers look like on the wire.
      field: id
      style: digits
    fields:
      display_name:
        type: string
      emails:
        type: list
      phone_numbers:
        type: list
      state:
        type: string
        default: active
      is_admin:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/v2/users
    resource: user
    operation: list
    pagination:
      style: cursor
      limit: 25
      max_limit: 1000
      limit_param: limit
      cursor_param: cursor

errors:
  api_key_required:
    status: 401
    code: "401"
    message: "A valid API key must be provided."
    fields:
      # Google's JSON-C array, with Google's own vocabularies in it: domain
      # "global" and reason "required", neither of which says anything about
      # Dialpad. The message is repeated here from the level above.
      error.errors:
        - domain: global
          message: "A valid API key must be provided."
          reason: required

  unknown_route:
    status: 404
    # App Engine's default handler, echoing the path back as plain text.
    style: text
    message: "Requested URL /api/v2/cauldron-nope not found"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    user: []

  company:
    user:
      - id: "4919652233314304"
        display_name: Ada Lovelace
        emails:
          - ada@example.invalid
        phone_numbers:
          - "+15550100"
        state: active
        is_admin: true
      - id: "5738291047583232"
        display_name: Grace Hopper
        emails:
          - grace@example.invalid
        # No number assigned yet: an empty array rather than an absent key, so
        # a client reading phone_numbers[0] gets undefined rather than
        # throwing on the property.
        phone_numbers: []
        state: suspended
        is_admin: false

conformance:
  - name: the failure is Google's JSON-C envelope
    source: https://dialpad.com/api/v2/users
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers: {}
    expect:
      status: 401
      body:
        # A nested error object with a numeric code and the message at the top
        # level -- the format Google deprecated in favour of google.rpc.Status
        # and which firebaseauth in this collection has already moved past.
        'error.code': 401
        'error.message': "A valid API key must be provided."

  - name: the entry carries Google's vocabularies rather than Dialpad's
    source: https://dialpad.com/api/v2/users
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers: {}
    expect:
      status: 401
      body:
        # domain "global" and reason "required" are Google's enumerations.
        # Neither says anything about Dialpad, and the only Dialpad-specific
        # string in the document is the message -- which appears twice.
        'error.errors[0].domain': global
        'error.errors[0].reason': required
        'error.errors[0].message': "A valid API key must be provided."

  - name: reason says required for a credential that was supplied
    source: https://dialpad.com/api/v2/users
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer not-a-real-key"
    expect:
      status: 401
      body:
        # Byte-identical to the case above. A key was sent; the machine-
        # readable cause says one is required.
        'error.errors[0].reason': required
        'error.message': "A valid API key must be provided."

  - name: an unknown path is App Engine echoing the path
    source: https://dialpad.com/api/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /api/v2/cauldron-nope
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^Requested URL /api/v2/cauldron-nope not found'

  - name: users are wrapped in items with string identifiers
    source: https://developers.dialpad.com/reference/userslist
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
    expect:
      status: 200
      body:
        # Nineteen-digit Datastore ids sent as strings, because they do not
        # survive a double -- the same trade etcd and Waypoint make, here
        # without a word about it anywhere.
        'items[0].id': "4919652233314304"
        'items[0].display_name': Ada Lovelace

  - name: contact details are arrays even when there is one
    source: https://developers.dialpad.com/reference/userslist
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
    expect:
      status: 200
      body:
        # One email and one number, both in arrays, so there is no primary and
        # a client showing "the" address is choosing an index.
        'items[0].emails[0]': ada@example.invalid
        'items[0].phone_numbers[0]': "+15550100"

  - name: a user with no number sends an empty array
    source: https://developers.dialpad.com/reference/userslist
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
    expect:
      status: 200
      body:
        # Empty rather than absent, so phone_numbers[0] is undefined and
        # phone_numbers.length is 0 -- both defined, neither throwing.
        'items[1].phone_numbers': []
        'items[1].state': suspended
        'items[1].is_admin': false

  - name: users page on a cursor
    source: https://developers.dialpad.com/reference/userslist
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        'items[0].id': "4919652233314304"
      matches:
        cursor: '.'

  - name: the last page carries no cursor
    source: https://developers.dialpad.com/reference/userslist
    fixture: company
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
      query:
        limit: "1"
        cursor: "4919652233314304"
    expect:
      status: 200
      body:
        'items[0].id': "5738291047583232"
      absent:
        - cursor

  - name: a company with no users answers an empty array
    source: https://developers.dialpad.com/reference/userslist
    fixture: empty
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: "Bearer cauldrondialpadfixturekey00000000"
    expect:
      status: 200
      body:
        items: []
