# UniProt Recipe for Cauldron
#
# The same acronym is capitalised two ways, in two top-level keys of one object.
#
#   "uniProtkbId":            "AATM_RABIT"
#   "uniProtKBCrossReferences": [...]
#
# uniProtkb and uniProtKB, four fields apart. Anything generating types from the
# response gets two spellings of one name, and anything looking one up by
# guessing the other finds nothing.
#
# **And the failure echoes your URL back with the scheme downgraded.** A request
# to https://rest.uniprot.org/uniprotkb/NOSUCHACC answers
#
#   {"url": "http://rest.uniprot.org/uniprotkb/NOSUCHACC",
#    "messages": ["The 'accession' value has invalid format. ..."]}
#
# The request was over TLS and the URL in the reply is not. A client that logs
# error.url, or retries it, drops to plain HTTP without being told.
#
# Written against the live API rather than a document: every case below was
# checked against rest.uniprot.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A number and its label share one string. "proteinExistence": "1:
#      Evidence at protein level" packs the machine-readable level and the human
#      sentence into one field with a colon between them, so getting the number
#      means splitting on ": " and parsing the front.
#   2. An accession that is not an accession is a 400, and a path that does not
#      exist is nginx. The first answers JSON with a messages array; the second
#      answers text/html carrying nginx's own page and the version it runs,
#      1.25.3. Two failures, two content types, one host.
#   3. annotationScore is 5.0 on a scale of whole numbers. A float where every
#      value is an integer between one and five, so a client rendering it shows
#      "5.0" and one comparing it to 5 needs to know which language it is in.
#
# And entryType is a sentence with a parenthetical that names the database
# twice: "UniProtKB reviewed (Swiss-Prot)".
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One entry is served, and its sequence, features, references, comments and
#     cross-references are left out: the record runs to 23 kilobytes and the
#     Recipe keeps the fields the cases are about.
#   - lastAnnotationUpdateDate moves. It is the date recorded.
#   - The trailing zero on annotationScore is not served. The live API writes
#     5.0 and Cauldron's encoder writes 5, because JSON has one number type and
#     Go drops a zero fraction. The value is the same number; the digits are
#     not, and the point of the finding is the digits -- so it is recorded here
#     and the case below asserts the value rather than its spelling.

recipe: uniprot
capability: docs
version: 0.1.0

upstream:
  api: uniprot
  docs: https://www.uniprot.org/help/api

auth:
  # Public, no key.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # An array of sentences, beside the URL that produced them.
    style: string_list
    key: messages

resources:
  entry:
    id:
      style: opaque
      field: primaryAccession
    fields:
      # A sentence with a parenthetical, naming the database twice.
      entryType:
        type: string
      secondaryAccessions:
        type: list
      # uniProtkb, lowercase kb.
      uniProtkbId:
        type: string
      # uniProtKB, uppercase KB, four fields later.
      uniProtKBCrossReferences:
        type: list
      entryAudit:
        type: map
      organism:
        type: map
      # A number and its label in one string.
      proteinExistence:
        type: string
      # A float on a scale of whole numbers.
      annotationScore:
        type: number

routes:
  - method: GET
    path: /uniprotkb/{id}
    resource: entry
    operation: get

  # An accession that is not an accession: a 400, with the URL echoed back.
  - method: GET
    path: /uniprotkb/NOSUCHACC
    error: invalid_accession

  # A path that does not exist: nginx, in HTML.
  - method: GET
    path: /nosuchpath
    error: nginx_not_found
    headers:
      Content-Type: text/html

errors:
  invalid_accession:
    # Not a 404.
    status: 400
    message: "The 'accession' value has invalid format. It should be a valid UniProtKB accession"
    fields:
      # The request was over TLS. This is not.
      url: http://rest.uniprot.org/uniprotkb/NOSUCHACC

  nginx_not_found:
    status: 404
    style: text
    message: "<html>\r\n<head><title>404 Not Found</title></head>\r\n<body>\r\n<center><h1>404 Not Found</h1></center>\r\n<hr><center>nginx/1.25.3</center>\r\n</body>\r\n</html>\r\n"

fixtures:
  empty: {}

  entries:
    entry:
      - id: P12345
        primaryAccession: P12345
        # The database, named twice, in a field called type.
        entryType: UniProtKB reviewed (Swiss-Prot)
        secondaryAccessions:
          - G1SKL2
        # Lowercase kb...
        uniProtkbId: AATM_RABIT
        # ...and uppercase KB, four fields later.
        uniProtKBCrossReferences: []
        entryAudit:
          firstPublicDate: "1989-10-01"
          lastAnnotationUpdateDate: "2026-06-10"
          lastSequenceUpdateDate: "2013-09-18"
          entryVersion: 149
          sequenceVersion: 2
        organism:
          scientificName: Oryctolagus cuniculus
          commonName: Rabbit
          taxonId: 9986
        # A number, a colon, and a sentence.
        proteinExistence: "1: Evidence at protein level"
        # A float, on a scale of whole numbers.
        annotationScore: 5.0

conformance:
  - name: the same acronym is capitalised two ways
    source: https://rest.uniprot.org/uniprotkb/P12345
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/P12345
    expect:
      status: 200
      body:
        # Lowercase kb...
        uniProtkbId: AATM_RABIT
        primaryAccession: P12345
      body_matches: '"uniProtKBCrossReferences"'

  - name: a number and its label share one string
    source: https://rest.uniprot.org/uniprotkb/P12345
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/P12345
    expect:
      status: 200
      body:
        # Getting the level means splitting on ": " and parsing the front.
        proteinExistence: "1: Evidence at protein level"
        # And the type is a sentence naming the database twice.
        entryType: UniProtKB reviewed (Swiss-Prot)

  - name: the score is a float on a scale of whole numbers
    source: https://rest.uniprot.org/uniprotkb/P12345
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/P12345
    expect:
      status: 200
      body:
        # Every value is an integer between one and five, and this is 5.0.
        annotationScore: 5.0

  - name: the entry carries two versions and three dates
    source: https://rest.uniprot.org/uniprotkb/P12345
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/P12345
    expect:
      status: 200
      body:
        # Published in 1989, sequence last touched in 2013, annotation in 2026,
        # and two version counters that do not move together.
        "entryAudit.firstPublicDate": "1989-10-01"
        "entryAudit.lastSequenceUpdateDate": "2013-09-18"
        "entryAudit.lastAnnotationUpdateDate": "2026-06-10"
        "entryAudit.entryVersion": 149
        "entryAudit.sequenceVersion": 2

  - name: the accession has a spare
    source: https://rest.uniprot.org/uniprotkb/P12345
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/P12345
    expect:
      status: 200
      body:
        # One primary, singular, and a list of secondaries beside it.
        primaryAccession: P12345
        "secondaryAccessions[0]": G1SKL2
        "organism.scientificName": Oryctolagus cuniculus
        "organism.commonName": Rabbit
        "organism.taxonId": 9986

  - name: an accession that is not one echoes the URL back over plain HTTP
    source: https://rest.uniprot.org/uniprotkb/NOSUCHACC
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /uniprotkb/NOSUCHACC
    expect:
      # A 400 rather than a 404, and the URL in the reply has lost its TLS.
      status: 400
      body:
        url: http://rest.uniprot.org/uniprotkb/NOSUCHACC
        # An array of sentences, under a plural key, beside the URL.
        "messages[0]": "The 'accession' value has invalid format. It should be a valid UniProtKB accession"

  - name: and a path that does not exist is nginx, with its version
    source: https://rest.uniprot.org/nosuchpath
    verified: "2026-08-30"
    fixture: entries
    request:
      method: GET
      path: /nosuchpath
    expect:
      # A second failure, a second content type, one host.
      status: 404
      headers:
        Content-Type: text/html
      # Anchored at the first byte, because an envelope carrying the page
      # inside a field would contain the same line.
      body_matches: '^<html>\r\n<head><title>404 Not Found</title></head>[\s\S]*<hr><center>nginx/1\.25\.3</center>'
