# Audiobookshelf Recipe for Cauldron
#
# Written against Audiobookshelf's own OpenAPI 3.0 document, published in its own
# repository -- github.com/advplyr/audiobookshelf, docs/openapi.json, 31 paths --
# read on 2026-09-06. Audiobookshelf is self-hosted and there is no public
# instance, so nothing here is verified live: every claim is the provider's own
# document.
#
# **A listing returns the server's filesystem layout.**
#
# `libraryItemBase` -- the shape a library listing answers with -- declares:
#
#   path         the absolute path on the server
#   relPath      the path relative to the library folder
#   ino          the inode number, as a string
#   mtimeMs      modified time
#   ctimeMs      inode-change time
#   birthtimeMs  creation time
#   isFile
#
# That is `stat(2)`, on every record, in an API about audiobooks. A client
# rendering a library shows absolute server paths; a log of a response body
# contains the directory structure of the machine; and `ino` is the filesystem
# inode -- exposed as a string, because an inode number does not survive
# JavaScript's 53-bit floats.
#
# Three filesystem timestamps beside two application ones (`addedAt`,
# `updatedAt`), so a record carries five different notions of when, and only two
# of them are about the library.
#
# **Paging is zero-indexed, and inert until you ask for a limit.**
#
# The document's own words:
#
#   page   "The page number (zero indexed) to return. If no limit is specified,
#           then page will have no effect."
#   limit  "The number of items to return." default: 0
#
# So `page=1` is the *second* page, and a client that starts counting at one --
# which is what almost every other provider in this collection wants -- silently
# skips the first page and never sees an error.
#
# And `limit` defaults to 0, meaning unlimited. A client that sends only `page`
# gets the whole library every time, and the parameter it did send does nothing.
# Both failures are quiet: the response is a valid page of valid records.
#
# **Booleans are integers.** `desc` is `type: integer, default: 0`. `minified` is
# `type: integer, minimum: 0`. So `desc=true` is not what the document asks for,
# and a client that sends a JSON boolean through a query-string serialiser sends
# the string "true" to a parameter declared as a number.
#
# **And one of those integers changes the response schema.** `minified` switches
# the answer from `libraryItemBase` to `libraryItemMinified` -- one endpoint,
# two record shapes, selected by a query parameter that looks like a display
# preference.
#
# **Every record carries the identifier it used to have.** `id` is a uuid, "the
# ID of library items after 2.3.0". Beside it, `oldLibraryItemId` is nullable and
# holds "the ID of library items on server version 2.2.23 and before", in the
# shape `li_` followed by eighteen characters.
#
# So a record from before the upgrade carries two identifiers and a record
# created after carries one and a null. A client that migrated data keyed by the
# old identifier needs the second field; one that did not finds null and cannot
# tell "no old id" from "this field is not populated".
#
# **The constraints are in `format`, where nothing enforces them.**
#
#   oldLibraryItemId  format: "li_[a-z0-9]{18}"
#   ino               format: "[0-9]*"
#
# Those are regular expressions in OpenAPI's `format` field. `format` is an open
# string and tooling ignores values it does not recognise, so neither constraint
# reaches a validator -- where `pattern`, which exists for exactly this, would
# have been checked.
#
# **Adjacent measurements, different number types.** `durationSec` is a float
# (33854.905) and `size` is an integer (268824228), side by side on the same
# record.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Audiobookshelf is
#     self-hosted and there is no public instance.
#   - Library items, listed. 31 paths is a media server: authors, series,
#     collections, playlists, sessions, podcasts, the email surface and the
#     whole player API each want their own evidence.
#   - `minified` is declared and not served. Serving two schemas from one route
#     would mean deciding what the minified shape drops, and the document's
#     `libraryItemMinified` declares no properties of its own.
#   - The filesystem fields are served, because they are the finding. The paths
#     in the fixture are plainly synthetic.

recipe: audiobookshelf
capability: media
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://api.audiobookshelf.org/
  spec: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
  spec_hash: f421e07b6c6b0649965b49e7b5b729276bcedb85ce0f7f201bd12f61307f8a83
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.audiobookshelf.jwt
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: results
    count_field: total
    limit_field: limit
    page_field: page
  error:
    style: text

resources:
  item:
    id:
      style: uuid
    fields:
      # "The ID of library items on server version 2.2.23 and before", nullable,
      # and shaped li_ plus eighteen characters -- a constraint expressed in
      # `format`, where no validator reads it.
      oldLibraryItemId:
        type: string
      libraryId:
        type: string
        in: "-"
      folderId:
        type: string
      # The filesystem, on an audiobook record.
      path:
        type: string
      relPath:
        type: string
      # The inode, as a string, because an inode does not survive a 53-bit
      # float.
      ino:
        type: string
      isFile:
        type: boolean
        default: true
      # Three filesystem timestamps beside two application ones.
      mtimeMs:
        type: number
      ctimeMs:
        type: number
      birthtimeMs:
        type: number
      addedAt:
        type: number
      updatedAt:
        type: number
      isMissing:
        type: boolean
        default: false
      isInvalid:
        type: boolean
        default: false
      mediaType:
        type: string
        default: book

routes:
  - method: GET
    path: /api/libraries/{libraryId}/items
    resource: item
    operation: list
    scope: [libraryId]
    pagination:
      style: page
      limit_param: limit
      cursor_param: page
      # Zero-indexed, which almost nothing else in this collection is.
      first_page: 0
      limit: 10

errors:
  unauthorized:
    status: 401
    style: text
    message: "Unauthorized"
  not_found:
    status: 404
    style: text
    message: "Library not found"
  rate_limit:
    status: 429
    style: text
    message: "Too many requests"

fixtures:
  empty:
    item: []

  library:
    item:
      - id: e4bb1afb-4a4f-4dd6-8be0-e615d233185b
        # Null: this one was created after 2.3.0, so it never had the old
        # identifier -- which reads the same as a field nobody populated.
        oldLibraryItemId: null
        libraryId: lib_c1u6t4p45c35rf0nzd
        folderId: fol_bev1zuxhb0j0s1wehr
        # The absolute path on the server, in a listing.
        path: /audiobooks/Terry Pratchett/Mort
        relPath: Terry Pratchett/Mort
        # A filesystem inode, as a string.
        ino: "649644248522215260"
        isFile: false
        mtimeMs: 1650621074299
        ctimeMs: 1650621074299
        birthtimeMs: 0
        addedAt: 1633522963509
        updatedAt: 1633522963509
        isMissing: false
        isInvalid: false
        mediaType: book
      - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        # A record that predates 2.3.0 and carries both identifiers.
        oldLibraryItemId: li_o78uaoeuh78h6aoeif
        libraryId: lib_c1u6t4p45c35rf0nzd
        folderId: fol_bev1zuxhb0j0s1wehr
        path: /audiobooks/Ursula K. Le Guin/A Wizard of Earthsea
        relPath: Ursula K. Le Guin/A Wizard of Earthsea
        ino: "649644248522215261"
        isFile: false
        mtimeMs: 1650621074400
        ctimeMs: 1650621074400
        # Zero, because not every filesystem records a birth time -- and zero
        # is a real POSIX instant rather than an absence.
        birthtimeMs: 0
        addedAt: 1633522963600
        updatedAt: 1650621074400
        # Present on disk and unreadable, which is a third state beside there
        # and gone.
        isMissing: false
        isInvalid: true
        mediaType: book

conformance:
  - name: a listing returns the server's filesystem layout
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # stat(2), on every record, in an API about audiobooks. A client
        # rendering a library shows absolute server paths, and a logged
        # response body contains the machine's directory structure.
        'results[0].path': "/audiobooks/Terry Pratchett/Mort"
        'results[0].relPath': "Terry Pratchett/Mort"
        # The inode, as a string, because it does not survive a 53-bit float.
        'results[0].ino': "649644248522215260"
        'results[0].isFile': false

  - name: five notions of when, three of them the filesystem's
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # mtimeMs, ctimeMs and birthtimeMs are the file's; addedAt and
        # updatedAt are the library's. Only the last two are about the
        # collection, and all five are milliseconds since the epoch.
        'results[0].mtimeMs': 1650621074299
        'results[0].ctimeMs': 1650621074299
        'results[0].addedAt': 1633522963509
        'results[0].updatedAt': 1633522963509
        # And zero is a real POSIX instant, not an absence: not every
        # filesystem records a birth time.
        'results[1].birthtimeMs': 0

  - name: paging is zero-indexed
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      query:
        # "The page number (zero indexed) to return." So this is the FIRST
        # page, and a client that starts at 1 -- which is what almost every
        # other provider here wants -- silently skips it.
        page: "0"
        limit: "1"
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        page: 0
        limit: 1
        total: 2
        'results[0].id': e4bb1afb-4a4f-4dd6-8be0-e615d233185b
      absent:
        - 'results[1]'

  - name: page one is the second page
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      query:
        page: "1"
        limit: "1"
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # The record a one-indexed client would have missed entirely.
        'results[0].id': 7c9e6679-7425-40de-944b-e07fc1f90ae7
        page: 1
      absent:
        - 'results[1]'

  - name: every record carries the identifier it used to have
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # `id` is a uuid, "after 2.3.0". `oldLibraryItemId` is the pre-2.3.0
        # form, li_ plus eighteen characters -- a constraint expressed in
        # `format` rather than `pattern`, so no validator reads it.
        'results[1].oldLibraryItemId': li_o78uaoeuh78h6aoeif
        # And null on a record created after the upgrade, which reads the same
        # as a field nobody populated.
        'results[0].oldLibraryItemId': null

  - name: missing and invalid are separate states
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # Present on disk and unreadable is a third state beside there and
        # gone, and it takes two booleans to express -- so a client checking
        # only isMissing shows a broken item as fine.
        'results[1].isMissing': false
        'results[1].isInvalid': true
        'results[0].isInvalid': false
        'results[0].mediaType': book

  - name: the folder is a separate identifier from the library
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 200
      body:
        # A library has folders and a folder has items, so a record carries
        # both -- and only the library id appears in the path, so the folder
        # cannot be used to fetch anything.
        'results[0].folderId': fol_bev1zuxhb0j0s1wehr
      absent:
        # The library id is the scope, taken from the path, and not echoed
        # back into the record.
        - 'results[0].libraryId'

  - name: no credential is refused with prose, not JSON
    source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/docs/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers: {}
    expect:
      status: 401
      body_matches: 'Unauthorized'

  - name: "a missing library says so in these words"
    source: "https://api.audiobookshelf.org/"
    arm: not_found
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 404
      body_matches: 'Library not found'

  - name: "the rate limit says so in these words"
    source: "https://api.audiobookshelf.org/"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/libraries/lib_c1u6t4p45c35rf0nzd/items
      headers:
        Authorization: Bearer cauldron.audiobookshelf.jwt
    expect:
      status: 429
      body_matches: 'Too many requests'
