# Productboard Recipe for Cauldron
#
# Written against Productboard's developer documentation at
# developer.productboard.com and struck live against api.productboard.com on
# 2026-09-06. Every live request used a deliberately invalid credential.
#
# **The API is two months past its own sunset date and still answering.**
#
# Every response carries, struck live:
#
#   Deprecation: @1775692799
#   Sunset: Wed, 08 Jul 2026 23:59:59 GMT
#
# @1775692799 is 2026-04-08T23:59:59Z. The sunset is exactly three months
# later, 2026-07-08. Today is 2026-09-06. So the surface announced its own
# deprecation in April, declared it would stop in July, and is serving requests
# in September with both headers still attached.
#
# The two dates are also in **two different formats on the same response**.
# `Sunset` is an HTTP-date, which RFC 8594 requires. `Deprecation` is
# `@1775692799` -- a Unix timestamp with an at-sign, which is the syntax an
# early draft used and which RFC 9745 replaced with an HTTP-date. So one
# lifecycle is described by two headers a client has to parse two ways, and the
# one it is most likely to get wrong is the one that fires first.
#
# A client checking Sunset and refusing to call a sunset API stopped working in
# July, against an API that works. One that ignores both learns nothing. Neither
# is right, because the headers are.
#
# **The 401 reads your token and tells you what is wrong with its payload.**
#
# Three refusals, struck live, all 401:
#
#   no Authorization header       {"message":"Unauthorized"}
#   Bearer not-a-real-key         {"message":"Bad token; invalid JSON"}
#   Bearer eyJ...well-formed...   {"message":"No mandatory 'iss' in claims"}
#
# The second says it base64-decoded the credential and tried to parse the result
# as JSON. The third says it parsed it, looked inside, and found no issuer
# claim. Both come back to a request with no account behind it.
#
# So the failure path is a JWT-shaping oracle: anyone can iterate on the
# structure of a token and be told, claim by claim, what the server wants next.
# That is genuinely helpful to somebody debugging their own integration and it
# is the same help to somebody who is not, and the signature check -- the part
# that cannot be guessed at -- happens after all of it.
#
# Every one of those carries `WWW-Authenticate: Bearer error="invalid_token"`,
# which is RFC 6750 done properly, on the same responses.
#
# **The 404 is the gateway, not the product.**
#
#   GET /cauldron-nonexistent
#   404 {"message":"no Route matched with those values"}
#
# That sentence is Kong's. So `message` -- the only field in every failure here
# -- has two producers: Productboard writes it for a credential and Kong writes
# it for a path, in the same key, with no way to tell which answered. A client
# logging `message` records two different systems under one name.

recipe: productboard
capability: support
version: 0.1.0

upstream:
  api: "1"
  docs: https://developer.productboard.com/
  # No spec: Productboard's reference is a rendered documentation site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Three dot-separated segments. What is not shaped like one gets a message
  # about JSON; what is gets a message about claims.
  shape: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  keys:
    - eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJjYXVsZHJvbiJ9.cauldronfixturesignature
  absent_error: unauthorized
  shape_error: bad_token
  rejected_error: missing_issuer

responses:
  list:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  feature:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      description:
        type: string
      type:
        type: string
        default: feature
      status:

routes:
  - method: GET
    path: /features
    resource: feature
    operation: list
    headers:
      # Productboard's version selector, and it is a header rather than a path
      # segment or a media type. Struck live, the credential is checked first,
      # so omitting it is not what a caller finds out about.
      X-Version: "1"
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
    headers:
      # RFC 6750, correctly, on every refusal.
      WWW-Authenticate: 'Bearer error="invalid_token"'
      # Both lifecycle headers ride every response, including this one.
      # 2026-04-08T23:59:59Z, in the at-sign syntax an early draft used and
      # RFC 9745 replaced.
      Deprecation: "@1775692799"
      # An HTTP-date, as RFC 8594 requires, three months after the line above
      # and two months before this Recipe was written.
      Sunset: "Wed, 08 Jul 2026 23:59:59 GMT"

  bad_token:
    status: 401
    # It base64-decoded the credential and tried to parse the result.
    message: "Bad token; invalid JSON"
    headers:
      WWW-Authenticate: 'Bearer error="invalid_token"'
      Deprecation: "@1775692799"
      Sunset: "Wed, 08 Jul 2026 23:59:59 GMT"

  missing_issuer:
    status: 401
    # It parsed the payload of an unverified token and reported on its claims.
    message: "No mandatory 'iss' in claims"
    headers:
      WWW-Authenticate: 'Bearer error="invalid_token"'
      Deprecation: "@1775692799"
      Sunset: "Wed, 08 Jul 2026 23:59:59 GMT"

  unknown_route:
    status: 404
    # Kong's sentence, in Productboard's field.
    message: "no Route matched with those values"

fixtures:
  empty:
    feature: []

  workspace:
    feature:
      - id: 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de
        name: Bulk import
        description: Upload a spreadsheet of feedback
        type: feature
        status:
          id: 9c1e4b70-2d85-4f36-a018-7b5c3e9d2401
          name: Candidate
      - id: a72d0e15-8c39-4b64-92f7-1e5a6d38c0b9
        name: Saved views
        description: null
        type: feature
        status:
          id: 4b8f2a91-6e07-4c53-8d1a-9f3b0c72e5d6
          name: In progress

conformance:
  - name: no credential is one word
    source: https://api.productboard.com/features
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /features
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"
      headers:
        WWW-Authenticate: 'Bearer error="invalid_token"'

  - name: a credential that is not a token is reported as bad JSON
    source: https://api.productboard.com/features
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /features
      headers:
        Authorization: "Bearer not-a-real-key"
    expect:
      status: 401
      body:
        # Struck live. It base64-decoded what was sent and tried to parse the
        # result, and says so, to a request with no account behind it.
        message: "Bad token; invalid JSON"

  - name: a well-formed token is answered with a note about its claims
    source: https://api.productboard.com/features
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /features
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJhIjoiYiJ9.notarealsignature"
    expect:
      status: 401
      body:
        # The payload of an unverified token, read and reported on. Anyone can
        # iterate on token structure and be told what the server wants next,
        # claim by claim, before the signature is looked at.
        message: "No mandatory 'iss' in claims"

  - name: every refusal carries a sunset date that has passed
    source: https://api.productboard.com/features
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /features
      headers: {}
    expect:
      status: 401
      headers:
        # 2026-07-08, two months before this was written, on an API that
        # answered the request carrying it.
        Sunset: "Wed, 08 Jul 2026 23:59:59 GMT"

  - name: the two lifecycle headers are in two different formats
    source: https://api.productboard.com/features
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /features
      headers: {}
    expect:
      status: 401
      headers:
        # A Unix timestamp with an at-sign, the syntax an early draft used and
        # RFC 9745 replaced with an HTTP-date. 2026-04-08T23:59:59Z.
        Deprecation: "@1775692799"
        # An HTTP-date, as RFC 8594 requires, exactly three months later. One
        # lifecycle, two headers, two parsers.
        Sunset: "Wed, 08 Jul 2026 23:59:59 GMT"

  - name: an unknown path is answered by the gateway
    source: https://api.productboard.com/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /cauldron-nonexistent
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
        X-Version: "1"
    expect:
      status: 404
      body:
        # Kong's sentence in Productboard's field, so `message` has two
        # producers and nothing in the body says which answered.
        message: "no Route matched with those values"

  - name: features arrive under data with nested statuses
    source: https://developer.productboard.com/reference/getfeatures
    fixture: workspace
    request:
      method: GET
      path: /features
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
        X-Version: "1"
    expect:
      status: 200
      body:
        'data[0].name': Bulk import
        # A status is an object with its own identifier rather than a string,
        # so a client comparing status to "Candidate" compares an object to a
        # word.
        'data[0].status.name': Candidate
        # And the type is a constant on every record: "feature" on a listing
        # of features, at /features, from getFeatures. Three places already
        # said so.
        'data[0].type': feature

  - name: a feature with no description sends null
    source: https://developer.productboard.com/reference/getfeatures
    fixture: workspace
    request:
      method: GET
      path: /features
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
        X-Version: "1"
    expect:
      status: 200
      body:
        'data[1].description': null
        'data[1].status.name': In progress

  - name: an empty workspace answers an empty array
    source: https://developer.productboard.com/reference/getfeatures
    fixture: empty
    request:
      method: GET
      path: /features
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
        X-Version: "1"
    expect:
      status: 200
      body:
        data: []
