# Fauna Recipe for Cauldron
#
# db.fauna.com does not exist. Checked live, 2026-09-01, against two
# independent resolvers (the sandbox's own and 8.8.8.8): NXDOMAIN, both.
# So is docs.fauna.com, api.fauna.com, dashboard.fauna.com and
# status.fauna.com. The bare apex, fauna.com, still has an A record --
# 3.33.139.32 -- but a connection to it on 443 times out rather than
# refusing or answering, which reads as a load balancer with nothing behind
# it any more rather than a live edge. This is not a probe that happened to
# fail; it is the finding. Fauna, Inc. announced in March 2025 that the
# hosted database service would end -- "the sunset time will be May 30 at
# noon Pacific time" -- and that after that date "all Fauna accounts and
# their associated data will be permanently deleted" (InfoWorld, quoting
# Fauna's own announcement). Sixteen months later, the DNS records for the
# service itself are gone along with the accounts. There is no live host
# for this Recipe to have struck, and nothing below claims otherwise: every
# case in this file is source-only, and none carries a verified date.
#
# That leaves the two questions this task named -- how does auth fail, does
# routing beat it -- genuinely unanswerable. Nobody's documentation records
# how a live edge orders a check it never had to write down for a reader;
# that is exactly the category of fact this whole project exists to strike
# live rather than assume, and for Fauna it cannot be struck at all. Xata's
# Recipe in this collection is in the identical position for the identical
# reason -- its data-plane host answers a Cloudflare 530 instead of
# nothing, a different failure signature for the same underlying fact, and
# neither Recipe pretends to know what it cannot check.
#
# What survives is source code, not prose: fauna/fauna-js and fauna/fauna-go,
# Fauna's own drivers, still on GitHub, MIT-licensed, unmodified since the
# shutdown. They are a better source than the docs site ever was for the
# one question this format can still answer honestly -- what shape does the
# wire actually take -- because a driver has to get the shape right or it
# does not parse its own vendor's responses. fauna-go's error.go maps HTTP
# status to error code in one switch statement:
#
#   400 + code "invalid_query"       -> query failed a validation check
#   400 + code "invalid_request"     -> body was not valid JSON, or did not
#                                        conform to the API specification
#   401 + code "unauthorized"        -> credentials missing or invalid
#   403 + code "forbidden"           -> credentials valid, access refused
#   409 + code "contended_transaction"
#   429 + code "limit_exceeded"
#   440 + code "time_out"            -- Fauna's own non-standard status
#   500 + code "internal_error"
#
# and fauna-js's wire-protocol.ts types the success shape as precisely:
# QuerySuccess = { data, static_type?, txn_ts?, schema_version?, summary?,
# query_tags?, stats? } -- data holds whatever the query evaluated to,
# unwrapped by any resource envelope, because there is no resource for it
# to be an instance of.
#
# That absence is the reason this Recipe is unlike every other one in this
# group, and the task named it directly: Fauna is a query API, not a
# resource API. Every other Recipe in this collection maps a noun -- a
# database, a cluster, a workspace -- onto a path, and a verb onto a
# method. Fauna maps nothing onto a path. There is exactly one route,
# POST /query/1, and what it does is entirely a function of the FQL text in
# the request body: Product.create({...}) creates a document,
# Product.all() lists them, Product.delete() deletes one, and a client
# library that wants to "GET a resource" sends a POST containing the FQL
# expression that reads it. The REST verbs this format's vocabulary is
# built from -- create, get, list, update, delete as things that happen to
# a path -- describe what the query text asks for, not what the transport
# does, and Cauldron's own routing has nothing to dispatch on except the
# body it is normally allowed to ignore. This Recipe uses selects_body,
# the mechanism ShopifyGraphQL's Recipe in this collection already needed
# for the identical shape of problem (one path, one method, the operation
# named inside the payload) -- but ShopifyGraphQL at least has a named root
# field to match on. FQL has no reserved operation keyword at all; this
# Recipe matches on words its own fixture queries happen to contain, which
# is a narrower, more fragile stand-in than selects was ever designed to
# be, because nothing about the real grammar guarantees a word chosen for
# one query never appears in another for an unrelated reason. That is the
# resource model failing to fit, spelled out rather than smoothed over.
#
# The question the task centred this whole group on -- what does a create
# actually return -- has an answer here sharper than either Turso's or
# SingleStore's, and it comes from fauna/fauna-js's own doc.ts and a worked
# example on Fauna's collection.create() reference page:
#
#   Customer.create({ email: "john.doe@example.com" })
#   -> { id: "12345", coll: Customer, ts: Time("2099-02-19T14:53:53.940Z"),
#        email: "john.doe@example.com" }
#
# (shown there in "decorated" format; doc.ts confirms the plain-JSON "simple"
# format for the same Document renders coll as a bare string and ts as an
# ISO-8601 string, which is what this Recipe's fixture uses). The field
# submitted is the field that comes back. There is no truncation the way
# Turso's create/v1/organizations/{org}/databases withholds block_reads and
# group, and no substitution the way SingleStore's create hands back a
# password instead of a record. Document is one shape in Fauna's own type
# system -- id, coll, ts, plus whatever fields the document holds -- used
# for a document just created and a document just read alike, because FQL's
# create expression evaluates to the document it made the same way any
# other expression evaluates to its result. Where Turso and SingleStore
# each have a create endpoint that answers with less than a get endpoint
# would, Fauna has no create endpoint at all: it has one endpoint, and
# Customer.create(...) is a sentence that happens to make one.
#
# A second, sharper instance of the same mismatch is why this Recipe
# declares no route at all for reading a document by id, even though
# Fauna's own HTTP API user-guide page shows one, plainly: Books.byId(...)
# answering a Document -- id "368117669817221154", coll "Books", ts
# "2023-06-21T04:53:37.160Z", name "Then and Now", author "W. Somerset
# Maugham" -- the identical shape the create example above takes, which is
# itself further evidence for the finding this Recipe centres on: one
# Document type, however it was reached. But Cauldron's own route format
# requires a get to be addressed by an {id} path segment, a query
# parameter, or a named body field (id_from), and none of those exist here
# -- the id is not a discrete value anywhere in the request, it is a
# substring of an FQL expression buried in the one field the body has. The
# vocabulary this project uses to say "fetch one thing by id" cannot name
# where Fauna's id actually lives, so this Recipe states the example in
# prose rather than force it into a route shape that would misrepresent
# the mechanism to make the tooling happy.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing below carries a verified date. See above.
#   - Reading a document by id is not routed, for the reason given directly
#     above: this format's id_from vocabulary has nowhere to point.
#   - No FQL is parsed, the same trade ShopifyGraphQL's Recipe makes for
#     GraphQL in this collection. selects_body picks a route by whether the
#     request body mentions a fixed word, not by understanding the query,
#     so a real client sending a materially different query that happens to
#     contain the same word gets this Recipe's canned answer for a
#     completely different question.
#   - summary, txn_ts, schema_version and stats are real, typed fields on
#     every response (QueryInfo, per fauna-js) and are not modelled with
#     values on the success routes. A generic worked example exists in
#     Fauna's own HTTP API user-guide page with a literal txn_ts and a
#     literal stats block, but it is not tied to either worked example this
#     Recipe actually uses, and grafting one page's numbers onto another
#     page's document would be exactly the kind of invented row count this
#     task said not to produce. summary is the one exception: the
#     malformed-query error below carries the literal summary text Fauna's
#     own query/post reference page shows for a validation failure of this
#     same kind (a function that does not exist on the operand's type), a
#     real fit rather than a borrowed number.
#   - The exact FQL text of the malformed-query case is this Recipe's own
#     construction, not a copy of the vendor's example query -- see that
#     case's comment. What is cited is the response, not the request.
#   - forbidden (403), contended_transaction (409), limit_exceeded (429),
#     time_out (440) and internal_error (500) are all real, named in
#     fauna-go's own switch statement, and none is modelled: none is one of
#     the three questions this task asked about, and this Recipe declares
#     what it was asked to establish rather than the whole error surface a
#     driver defines names for.
#   - Whether a missing credential and a present-but-wrong one answer
#     different text could not be settled. fauna-js's AuthenticationError
#     and fauna-go's ErrAuthentication both wrap the identical error shape
#     regardless of which produced it, and no worked example distinguishing
#     the two was found. This Recipe answers both the same way, which is a
#     stated assumption, not a checked fact.
#
# The secret below is a fixture and belongs to no database.

recipe: fauna
capability: database
version: 0.1.0

upstream:
  api: v10
  docs: https://docs.fauna.com/fauna/current/reference/http/reference/query/post

auth:
  # Genuinely bearer (fauna-js: Authorization: Bearer <secret>), expressed as
  # scheme none plus fixed routes below, because this single endpoint
  # answers a different failure depending on what the body asks for as much
  # as on the credential -- the same trade Census's Recipe in this
  # collection makes, for a related reason: one path, several shapes, and
  # Cauldron's own built-in check can only ever pick one.
  scheme: none

responses:
  resource:
    style: wrapped
    key: data
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: "-"
  success:
    # summary rides on every response FQL sends, success or failure alike
    # (QueryInfo, per fauna-js). "" is what Fauna's own docs describe as the
    # typical value on success -- no warnings, no logs -- and is the
    # nearest honest stand-in this Recipe has for a field it cannot invent
    # a more specific value for.
    fields:
      summary: ""

resources:
  # Customer.create's own worked example. See the header for the exact
  # citation and why this shape -- id, coll, ts, plus the field actually
  # submitted -- is this Recipe's central finding rather than an aside.
  customer:
    id:
      style: opaque
      field: id
    fields:
      coll:
        type: string
        default: Customer
      ts:
        type: datetime
      email:
        type: string

routes:
  # Selected only when the request body mentions "create" -- see the header
  # for why this is the nearest thing this format has to routing an FQL
  # query, and why it is narrower than it looks.
  - method: POST
    path: /query/1
    matches_header:
      Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
    selects_body: create
    resource: customer
    operation: create
    status: 200

  # Selected when the body mentions "len" -- this Recipe's own construction
  # of the same failure category Fauna's own docs show: a function that
  # does not exist on the operand's type. See the header and the case
  # below for why the request text is not a quotation even though the
  # response is.
  - method: POST
    path: /query/1
    matches_header:
      Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
    selects_body: len
    error: invalid_query

  # A credentialed request that names none of the words above -- an empty
  # body among them, since {} mentions nothing. invalid_request is what
  # fauna-go's own switch statement names for exactly this: a body that is
  # not valid JSON, or does not conform to the API specification.
  - method: POST
    path: /query/1
    matches_header:
      Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
    error: invalid_request

  # No credential at all, or the wrong one -- matches_header excludes every
  # route above regardless of what the body says, the same shape Turso's
  # Recipe in this collection uses for its own multi-way credential check.
  - method: POST
    path: /query/1
    error: unauthorized

errors:
  # {"error":{"code":"invalid_query","message":"invalid query: the query
  # failed 1 validation check"},"summary":"error: the function `len`
  # doesn't exist on string..."} -- read from Fauna's own query/post
  # reference page. The summary fits the request this Recipe actually
  # sends (see the case below); the request text itself does not claim to
  # be the vendor's own example.
  invalid_query:
    status: 400
    code: invalid_query
    message: "invalid query: the query failed 1 validation check"
    fields:
      summary: "error: the function `len` doesn't exist on string"

  # {"error":{"code":"invalid_request","message":"invalid request: request
  # body isn't valid JSON"}} -- read from the same page. Fauna-go's own
  # switch statement confirms invalid_request as the default outcome for a
  # 400 when the body does not conform to the API specification at all,
  # which an empty {} -- present JSON, absent "query" field -- is a
  # narrower case of; the message below is the malformed-JSON wording the
  # docs page shows, applied here for the nearest documented failure this
  # Recipe could cite rather than invent.
  invalid_request:
    status: 400
    code: invalid_request
    message: "invalid request: request body isn't valid JSON"

  # {"error":{"code":"unauthorized","message":"invalid token: unable to
  # authenticate request"}} -- read from Fauna's own HTTP API error
  # reference. Used for both a missing credential and a present, wrong one
  # -- see the header for why that collapse is an assumption this Recipe
  # states rather than a fact it checked.
  unauthorized:
    status: 401
    code: unauthorized
    message: "invalid token: unable to authenticate request"

fixtures:
  empty: {}

  small-database:
    customer:
      - id: "12345"
        coll: Customer
        ts: "2099-02-19T14:53:53.940Z"
        email: john.doe@example.com

conformance:
  - name: creating a document answers the document it made, not less
    # Customer.create({ email: "john.doe@example.com" }) -> { id, coll, ts,
    # email }, Fauna's own worked example on the collection.create()
    # reference page (shown there in decorated format; rendered here in
    # the plain "simple" format doc.ts confirms the HTTP API actually
    # sends). See the header for why this is the sharpest form of this
    # group's central question.
    source: https://docs.fauna.com/fauna/current/reference/fql-api/collection/instance-create/
    fixture: small-database
    request:
      method: POST
      path: /query/1
      headers:
        Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
      # Cauldron cannot parse FQL (see the header), so it has no way to read
      # the submitted field out of the query text the way a real Fauna
      # would. email is repeated here as an ordinary JSON key purely so
      # Cauldron's own generic create mechanism -- built for a JSON-bodied
      # create, the shape every other Recipe in this collection has -- can
      # find it and echo it, the same way it would for any other provider.
      # A real client sends only "query"; this duplication is a concession
      # to the tooling, stated here rather than left to look like a claim
      # about Fauna's actual wire request.
      json:
        query: 'Customer.create({ email: "john.doe@example.com" })'
        email: john.doe@example.com
    expect:
      status: 200
      body:
        data.coll: Customer
        data.email: john.doe@example.com
        summary: ""
      matches:
        # The vendor's own page shows "12345" for this example. Fauna mints
        # a document's id; this fixture query does not choose it, so this
        # case asserts that one is present rather than that literal value --
        # see the route's own comment for why.
        data.id: ".+"

  - name: a query that fails validation answers 400 with a code, not a parse error
    # The vendor's own example is about calling a function that does not
    # exist on a string; this Recipe's own request text exercises the same
    # category (len is not an FQL string method) rather than quoting
    # theirs -- see the header. The response is the citation, not the
    # request.
    source: https://docs.fauna.com/fauna/current/reference/http/reference/query/post
    fixture: empty
    request:
      method: POST
      path: /query/1
      headers:
        Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
      json:
        query: '"hello".len()'
    expect:
      status: 400
      body:
        error.code: invalid_query
        error.message: "invalid query: the query failed 1 validation check"
        summary: "error: the function `len` doesn't exist on string"

  - name: an empty body is invalid_request, not a routing failure
    source: https://docs.fauna.com/fauna/current/reference/http/reference/query/post
    fixture: empty
    request:
      method: POST
      path: /query/1
      headers:
        Authorization: "Bearer cauldron-fauna-fixture-secret-0000000000000000"
      json: {}
    expect:
      status: 400
      body:
        error.code: invalid_request
        error.message: "invalid request: request body isn't valid JSON"

  - name: no credential at all is unauthorized, whatever the body asks for
    source: https://docs.fauna.com/fauna/current/reference/http/reference/errors/
    fixture: empty
    request:
      method: POST
      path: /query/1
      json:
        query: "Customer.all()"
    expect:
      status: 401
      body:
        error.code: unauthorized
        error.message: "invalid token: unable to authenticate request"

  # The names. This Recipe declares 1 field(s) on a customer that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a customer carries the field names this Recipe declares"
    source: "https://docs.fauna.com/fauna/current/reference/fql-api/collection/instance-create/"
    fixture: small-database
    request:
      method: POST
      path: "/query/1"
      json:
        query: 'Customer.create({ email: "john.doe@example.com" })'
        email: john.doe@example.com
      headers:
        "Authorization": "Bearer cauldron-fauna-fixture-secret-0000000000000000"
    expect:
      status: 200
      body:
        "data.ts": "2026-01-01T00:00:00Z"

