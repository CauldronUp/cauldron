# Textline Recipe for Cauldron
#
# Textline is not carrier-shaped, and the bulk-send question this Recipe's
# five SMS siblings each answer -- what does a send return, is one message
# in it addressable afterwards, what is the delivery-status vocabulary --
# does not apply to it the way it applies to them. Textline has no bulk
# send at all in the sense Bandwidth, Sinch, Plivo, Infobip and Zenvia's
# batch/message-batches share: one API call, an array or a CSV of
# recipients, one response describing the group. Its closest analogue,
# Announcements (POST /api/announcements.json, selecting recipients by tag,
# saved search or an uploaded CSV), answers {"authorized": true} and a
# COUNT folded into a sentence -- "X survey queued for delivery" is the
# literal shape the sibling Send Survey endpoint uses, and Announcements'
# own success body carries no count, no id and nothing to ask about
# afterwards at all. There is no batch resource here to compare against
# Bandwidth's shared id or Infobip's per-recipient array, because sending
# to many people and sending to one are not variations on the same
# primitive the way they are for every carrier API in this comparison --
# they are a marketing broadcast and a conversation reply, two different
# products under one account.
#
# The unit that does exist, and the one every "message" question in this
# comparison actually maps onto, is the Post: one line of a Conversation,
# with its own uuid, nested inside the conversation the way a reply is
# nested inside an email thread rather than sent as a standalone record.
# Sending a message is not POST /messages -- there is no such route in
# Textline's published API at all. It is POST /api/conversation/{uuid}.json,
# "Message a Conversation," and the uuid in that path belongs to the
# CONVERSATION, not to anything the caller is creating. What comes back --
# Textline's own blueprint calls it New_Post_Payload -- is three objects at
# once: {conversation: Conversation, post: Post, group: Group}. A send does
# not answer with a message and a place to look it up later; it answers
# with the whole thread state the message just changed.
#
# THE FINDING THIS RECIPE EXISTS TO MAKE: there is no delivery-status
# vocabulary anywhere in this API. Not SENT, not DELIVERED, not FAILED --
# nothing. Textline's own Post data structure (the full documented shape of
# the thing a send creates) has exactly these fields: attachments, body,
# conversation_uuid, created_at, creator, is_whisper, marked_as_resolved,
# transferred_to, assigned_to, uuid, first_post, message_type. message_type
# says which of SMS, webchat or null the post travelled over -- not what
# happened to it. marked_as_resolved and the sibling Conversation's own
# resolved field are the only status-shaped words on either object, and
# both mean something else entirely: whether a human closed the thread, not
# whether a carrier delivered the text. The same two fields recur,
# unchanged, on the separate reporting endpoint
# (GET /api/reporting/conversation/{uuid}/posts.json) that exists
# specifically to let an integration pull historical message data in bulk --
# and it still carries nothing about delivery. A team-inbox product answers
# "did this arrive" with a closed ticket, not a carrier receipt, because
# the account holder is standing in a browser watching the conversation
# happen and does not need the API to tell them separately.
#
# What Textline calls a message never being independently addressable is
# the second half of the same shape. A Post has its own uuid (Textline's
# own documentation: "The unique identifier for the post"), but there is no
# GET /api/post/{uuid}.json anywhere in the published API -- confirmed by
# reading the complete route listing in Textline's own blueprint
# (https://textline.docs.apiary.io/api-description-document, fetched in
# full, not sampled). A post is reachable exactly two ways: refetch the
# whole parent conversation (GET /api/conversation/{uuid}.json, which pages
# its posts with before_uuid/after_uuid cursors keyed on the very uuids a
# caller would already need to have on hand), or the two-step reporting
# flow the docs describe in their own words -- "you'll need to make a call
# to the conversations reporting API with the correct parameters and then
# make a call to the posts reporting API for each conversation in that
# period" -- which answers with a conversation's entire post history, not
# one post. The smallest thing you can ask about after a send here is not
# a message and not a batch. It is the conversation the message became
# part of.
#
# Missing and wrong credentials do NOT collapse here, which sets Textline
# apart from every SMS-carrier sibling in this comparison except Kaleyra.
# Checked live, 2026-09-01, against application.textline.com:
#
#   no X-TGP-ACCESS-TOKEN header at all
#     -> 401 {"message":"API Key or Access Token required"}
#   a well-formed junk one
#     -> 401 {"message":"Invalid access token"}
#
# Two different sentences for two different verdicts, which is exactly what
# auth.absent_error and auth.rejected_error exist to express. Textline also
# accepts the same token as a GET or POST parameter, access_token, per its own
# documentation, and the query form is served alongside the header one. This
# used to say "this format's auth scheme is one mechanism per Recipe" -- true
# when it was written, and what auth.also was added for. The POST body form is
# still not served: alternatives carry a header or a query parameter, and a
# credential in a request body is neither.
#
# ROUTING RESOLVES BEFORE THE CREDENTIAL DOES, and does so with a shape
# that quietly contradicts the docs' own stated error-handling contract.
# Checked live, with no credential sent at all:
#
#   GET /api/this-route-does-not-exist.json  -> 404, text/html
#   PATCH /api/conversations.json (a real path, wrong method) -> the
#     byte-identical 404, text/html
#
# Both a route this Recipe never registered and a method a real route does
# not support answer Rails' own generic 404 page -- Content-Type text/html,
# no Allow header, no distinction between the two failures -- rather than
# any JSON at all. Textline's own Error Handling section promises "a json
# encoded body with the list of errors" for an invalid request, and that
# promise is true of a 400 from a route that exists; it is not true of what
# happens when the route does not, which the docs never separately address.
# auth.after_routing: true carries the ordering; the two conformance cases
# below send exactly what the live requests sent.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The New_Post_Payload envelope is not reproduced. The real response
#     nests three sibling objects -- conversation, post, group -- at the
#     top level, and this format's envelope wraps one resource under one
#     key; there is no mechanism here for three named siblings on one
#     create response. This Recipe wraps the Post's own fields under
#     "post" and does not attempt "conversation" or "group" at all, which
#     is a real simplification stated here rather than smoothed over. See
#     the header's Kaleyra sibling for a "data" array with the identical
#     kind of gap for a different reason.
#   - creator, attachments, transferred_to and assigned_to are documented
#     Post fields and are not modelled. Each is itself a nested User or
#     Attachment object, and the one worked example combining any of them
#     with the rest of a Post (the Data Structures section's abstract
#     field-by-field listing) never shows a full record with all of them
#     populated at once.
#   - "Message a Phone Number" (POST /api/conversations.json with a scalar
#     phone_number) and "Message a Group Conversation" (the same literal
#     path, with an array) are real, documented, and not modelled. Both
#     exist specifically so a caller does not need a conversation uuid in
#     hand before sending; only "Message a Conversation," which does need
#     one, is declared below, to keep one Recipe from re-litigating three
#     routes that share one finding.
#   - GET /api/conversation/{uuid}.json (Retrieve a Conversation) is not
#     modelled, for the same envelope reason as New_Post_Payload above: its
#     own response nests conversation and posts as siblings.
#   - The general validation-error shape --
#     {"errors": {"name": ["Must be present"]}} -- is Textline's own
#     documented example, quoted verbatim in its Error Handling section,
#     and is declared but not exercised by a conformance case: reaching it
#     for real needs a valid access token this Recipe does not have, and no
#     unauthenticated route was found that validates a body before
#     checking the credential.
#   - No rate_limit case is verified. Textline's own docs state the number
#     plainly -- "200 requests per minute... Requests beyond this number
#     will receive a response with a 429 status code" -- but show no body
#     for it, so none is asserted here beyond the status.
#   - Obtaining an access token (POST /auth/sign_in.json, which itself
#     requires an agent's email, password AND a multi-factor code) is not
#     modelled. Every other Recipe in this collection treats how a
#     credential was minted as out of scope; this one is no different, and
#     Textline's own MFA requirement puts it further out of reach of a
#     credential-free probe than any of the others.
#
# The token below is a fixture and belongs to no account.

recipe: textline
capability: support
version: 0.1.0

upstream:
  api: v1
  docs: https://help.textline.com/en/articles/6660329-api-documentation
  # No spec recorded, though a description exists. Textline publishes an
  # API Blueprint, not OpenAPI -- the whole document was fetched and read
  # from https://textline.docs.apiary.io/api-description-document -- and the drift machinery
  # reads OpenAPI. A URL here would name something it cannot compare, which
  # is worse than naming nothing: drift would report the Recipe unreadable
  # every morning for a description that is perfectly readable by a human
  # and simply is not the format this tool speaks.

auth:
  # A raw header value, and the same token as a query parameter, which
  # Textline's own documentation gives as the equivalent.
  scheme: header
  header: X-TGP-ACCESS-TOKEN
  keys:
    - cauldron00000textlineaccesstoken0000
  also:
    - scheme: query
      param: access_token
  # Absent and wrong are two different sentences here -- see the header --
  # and routing resolves before either is checked.
  absent_error: token_required
  rejected_error: invalid_token
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  # The Post: Textline's own smallest addressable unit, and the one every
  # "message" question in the sibling SMS comparison maps onto. See the
  # header for why it is reachable only nested inside a conversation and
  # never fetched on its own.
  post:
    collection: posts
    id:
      style: uuid
    fields:
      conversation_uuid:
        type: string
      body:
        type: string
      created_at:
        type: timestamp
      is_whisper:
        type: boolean
        default: false
      marked_as_resolved:
        type: boolean
        default: false
      first_post:
        type: boolean
        default: true
      # SMS, webchat, or null -- which channel the post travelled over.
      # Not what happened to it; see the header. No delivery-status field
      # exists anywhere on this object.
      message_type:
        type: string
        default: SMS

routes:
  - method: POST
    path: /api/conversation/{conversation_uuid}.json
    resource: post
    operation: create
    scope:
      - conversation_uuid
    # See the header: the real response also carries sibling "conversation"
    # and "group" objects this envelope cannot reproduce.
    envelope:
      style: wrapped
      key: post
    returns:
      - id
      - conversation_uuid
      - body
      - is_whisper
      - marked_as_resolved
      - first_post
      - message_type

errors:
  # Live, 2026-09-01, no X-TGP-ACCESS-TOKEN header at all.
  token_required:
    status: 401
    message: "API Key or Access Token required"

  # Live, 2026-09-01, a well-formed but wrong token. A different sentence
  # from the one above -- see the header.
  invalid_token:
    status: 401
    message: "Invalid access token"

  # Rails' own generic 404 page -- text/html, not the JSON the docs'
  # own Error Handling section promises for an invalid request. What
  # routing itself answers, for an unregistered path and for a wrong
  # method on a real one alike; see the header.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: "The page you were looking for doesn't exist (404)"

  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: "The page you were looking for doesn't exist (404)"

  # Textline's own documented shape for an invalid request body, quoted
  # verbatim from its Error Handling section. Not exercised by any case
  # below; see the fidelity gaps.
  validation_error:
    status: 400
    style: flat
    message_field: errors
    fields:
      errors:
        name:
          - "Must be present"

  # The status is documented ("Requests beyond this number will receive a
  # response with a 429 status code"); no body was ever shown for it.
  rate_limit:
    status: 429

fixtures:
  empty: {}

# Two cases are struck live against application.textline.com, 2026-09-01,
# with no account of any kind. The send case is read from Textline's own
# published blueprint, and carries no verified date, because reaching a
# genuine 200 needs a real access token -- which itself needs an agent's
# email, password and a multi-factor code -- that this Recipe does not have.
conformance:
  - name: no credential is one sentence, and a wrong one is another
    source: https://application.textline.com/api/conversation/84a2c56f-6b79-4764-811d-90880e2757b4.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/conversation/84a2c56f-6b79-4764-811d-90880e2757b4.json
      json:
        comment:
          body: "hello world"
    expect:
      status: 401
      body:
        message: "API Key or Access Token required"

  - name: a well-formed junk token gets a different sentence, not the same one
    source: https://application.textline.com/api/conversation/84a2c56f-6b79-4764-811d-90880e2757b4.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/conversation/84a2c56f-6b79-4764-811d-90880e2757b4.json
      headers:
        X-TGP-ACCESS-TOKEN: junktoken0000000000000000000000
      json:
        comment:
          body: "hello world"
    expect:
      status: 401
      body:
        message: "Invalid access token"

  - name: an unregistered path is a plain-HTML 404, not the JSON the docs promise, with no credential examined
    source: https://application.textline.com/api/this-route-does-not-exist.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/this-route-does-not-exist.json
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "doesn't exist \\(404\\)"

  - name: and so is a wrong method on a route that does exist, with no credential examined either
    source: https://application.textline.com/api/conversations.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/conversations.json
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "doesn't exist \\(404\\)"

  - name: sending into a conversation answers a post, wrapped, with no delivery status anywhere on it
    source: https://textline.docs.apiary.io/api-description-document
    fixture: empty
    request:
      method: POST
      path: /api/conversation/84a2c56f-6b79-4764-811d-90880e2757b4.json
      headers:
        X-TGP-ACCESS-TOKEN: cauldron00000textlineaccesstoken0000
      json:
        comment:
          body: "hello world"
    expect:
      status: 200
      body:
        post.conversation_uuid: 84a2c56f-6b79-4764-811d-90880e2757b4
        post.is_whisper: false
        post.marked_as_resolved: false
        post.message_type: SMS
      # No status, delivered or failed anywhere -- the whole finding this
      # Recipe exists to make, stated as an assertion. Nor is there a
      # top-level "conversation" or "group" object; see the header.
      absent:
        - post.status
        - post.delivered
        - conversation
        - group

  # The names. This Recipe declares 3 field(s) on a post that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a post carries the field names this Recipe declares"
    source: "https://textline.docs.apiary.io/api-description-document"
    fixture: empty
    request:
      method: POST
      path: "/api/conversation/{conversation_uuid}.json"
      json:
        comment:
          body: hello world
      headers:
        "X-TGP-ACCESS-TOKEN": "cauldron00000textlineaccesstoken0000"
    expect:
      status: 200
      body:
        "post.first_post": true

