# Clever Cloud Recipe for Cauldron
#
# The organisations listing, read from the OpenAPI document Clever Cloud serves
# without a credential at api.clever-cloud.com/v2/openapi.json, and struck live
# on 2026-09-13 with no credential, with a deliberately invalid one, and on a
# path that does not exist.
#
# **`id` is the error code.** Struck live:
#
#   (no header)      401 {"id":2001,"message":"Not connected","type":"error"}
#   Bearer notreal   403 {"id":1504,"message":"This token's scope is invalid.","type":"error"}
#   /cauldron-nope   404 <!DOCTYPE html>... "Page not found"
#
# Every resource in this API has an `id` too, and theirs is a string. So
# `body.id` is the identifier of a thing on success and a numeric error code on
# failure, in the same field, with nothing but the status line to tell them
# apart.
#
# **`type` is always "error".** A discriminator whose only observed value
# repeats what the status code already said, on an envelope with no other
# category field in it.
#
# **A token that does not exist is reported as a scope problem.** The
# wrong-credential answer is 403 "This token's scope is invalid" -- not that the
# token is unknown, but that its permissions are wrong. A caller reading that
# goes looking at the scopes on a credential that was never valid at all.
#
# **And the message carries a typographic apostrophe.** U+2019, not U+0027, in
# a machine-readable error string -- so a client matching on the text has to get
# the right one of two characters that look identical in most fonts.
#
# **An unrouted path answers HTML.** A full `<!DOCTYPE html>` page titled "Page
# not found", from an API whose three other answers are JSON. That is a fourth
# shape, and the only one a `.json()` call throws on.
#
# **217 paths and no security block.** The published document declares no
# `security`, no `securitySchemes`, and nothing anywhere saying how to
# authenticate -- the same silence Kestra's 194-path document keeps.
#
# **And no operation declares a failure.** `/organisations` lists exactly one
# response, 200, on an API that answers 401 to every anonymous request.
#
# **`VAT` is the only upper-case field name on the record**, sitting beside
# `vatState`, which is camelCase. Two spellings of the same word, adjacent.
#
# **An organisation carries a postal address and a phone number.** `address`,
# `city`, `zipcode`, `country`, `billingEmail`, `customerFullName` and
# `emergencyNumber` are all on the object a listing returns.
#
# **Nothing on it is required.** Eighteen properties, no `required` array, `id`
# included.

recipe: clevercloud
capability: hosting
version: 0.1.0

upstream:
  api: v2
  docs: https://www.clever-cloud.com/developers/api/v2/
  spec: https://api.clever-cloud.com/v2/openapi.json
  spec_hash: 05b25ed90b752d48dc5e3f8ddb9165b02ba1edb80353772b65122115a36cdd67
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-cl3ver-f1xture-t0ken
  absent_error: not_connected
  # A token that does not exist, reported as a token whose scope is wrong.
  rejected_error: invalid_scope
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    # The same field name every record uses for its identifier.
    code_field: id
    code_type: number
    type_field: type

resources:
  organisation:
    id:
      # A string, where the error envelope's id is a number.
      field: id
      style: prefixed
      prefix: orga_
      length: 22
    fields:
      name:
        type: string
      description:
        type: string
      # A postal address, on the record a listing returns.
      address:
        type: string
      city:
        type: string
      zipcode:
        type: string
      country:
        type: string
      company:
        type: string
      billingEmail:
        type: string
      customerFullName:
        type: string
      emergencyNumber:
        type: string
      # The only upper-case field name on the record...
      VAT:
        type: string
      # ...beside the camelCase spelling of the same word.
      vatState:
        type: string
      avatar:
        type: string
      canPay:
        type: boolean
      canSEPA:
        type: boolean
      isTrusted:
        type: boolean
      cleverEnterprise:
        type: boolean
      contextFlags:
        type: list

routes:
  - method: GET
    path: /v2/organisations
    resource: organisation
    operation: list
    pagination:
      # None declared and none offered: the operation takes no parameters.
      style: none

errors:
  not_connected:
    status: 401
    code: "2001"
    message: Not connected
    type: error

  invalid_scope:
    # 403 for a credential that does not exist, blaming its permissions.
    status: 403
    code: "1504"
    # A typographic apostrophe, U+2019, in a machine-readable string.
    message: "This token’s scope is invalid."
    type: error

  unknown_route:
    status: 404
    # HTML, from an API whose other three answers are JSON.
    style: text
    message: "<!DOCTYPE html><html><head><title>Page not found</title></head><body><h1>Not found</h1></body></html>"
    headers:
      Content-Type: text/html

fixtures:
  empty:
    organisation: []

  account:
    organisation:
      - id: orga_9c36e8c75a7347c09716
        name: Cauldron
        description: The one every account starts with.
        address: 1 Example Street
        city: Nantes
        zipcode: "44000"
        country: FR
        company: Cauldron Ltd
        billingEmail: billing@example.com
        customerFullName: A Person
        emergencyNumber: "+33100000000"
        VAT: FR00000000000
        vatState: VALID
        avatar: https://example.com/avatar.png
        canPay: true
        canSEPA: true
        isTrusted: true
        cleverEnterprise: false
        contextFlags: []
      - id: orga_b8f9b6630a3bcf45587a
        name: Cauldron Labs
        description: ""
        address: 1 Example Street
        city: Nantes
        zipcode: "44000"
        country: FR
        company: Cauldron Ltd
        billingEmail: billing@example.com
        customerFullName: A Person
        emergencyNumber: ""
        VAT: ""
        # One of five values, none of which is "unknown".
        vatState: NOT_NEEDED
        avatar: ""
        canPay: false
        canSEPA: false
        isTrusted: false
        cleverEnterprise: false
        contextFlags:
          - DENY_ORGA_CREATION

conformance:
  - name: a missing credential puts an error code in the id field
    source: https://api.clever-cloud.com/v2/organisations
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers: {}
    expect:
      status: 401
      body:
        # A number, in the field every record uses for a string identifier.
        id: 2001
        message: Not connected
        # A category whose only value repeats the status line.
        type: error

  - name: a token that does not exist is reported as a scope problem
    source: https://api.clever-cloud.com/v2/organisations
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 403
      body:
        id: 1504
        # With a typographic apostrophe in it, so text matching has to pick
        # the right one of two characters that look the same.
        message: "This token’s scope is invalid."

  - name: an unrouted path answers HTML
    source: https://api.clever-cloud.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # The fourth shape, and the only one a .json() call throws on.
        Content-Type: text/html
      body_matches: '\A<!DOCTYPE html>'

  - name: the record identifier is a string
    source: https://api.clever-cloud.com/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer cauldr0n-cl3ver-f1xture-t0ken"
    expect:
      status: 200
      body:
        # Where the failures above put a number in the same field name.
        '[0].id': orga_9c36e8c75a7347c09716
        '[0].name': Cauldron

  - name: VAT and vatState are spelled two ways
    source: https://api.clever-cloud.com/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer cauldr0n-cl3ver-f1xture-t0ken"
    expect:
      status: 200
      body:
        # The only upper-case field name on the record, beside the camelCase
        # spelling of the same word.
        '[0].VAT': FR00000000000
        '[0].vatState': VALID
        '[1].vatState': NOT_NEEDED
        '[1].VAT': ""

  - name: an organisation carries a postal address and a phone number
    source: https://api.clever-cloud.com/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer cauldr0n-cl3ver-f1xture-t0ken"
    expect:
      status: 200
      body:
        '[0].address': 1 Example Street
        '[0].city': Nantes
        '[0].zipcode': "44000"
        '[0].country': FR
        '[0].billingEmail': billing@example.com
        '[0].customerFullName': A Person
        '[0].emergencyNumber': "+33100000000"
        '[0].company': Cauldron Ltd

  - name: four booleans describe what an organisation may do
    source: https://api.clever-cloud.com/v2/openapi.json
    fixture: account
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer cauldr0n-cl3ver-f1xture-t0ken"
    expect:
      status: 200
      body:
        '[0].canPay': true
        '[0].canSEPA': true
        '[0].isTrusted': true
        '[0].cleverEnterprise': false
        '[1].canPay': false
        # And a fifth thing it may not, as a string in a list.
        '[1].contextFlags[0]': DENY_ORGA_CREATION
        '[0].contextFlags': []
        '[0].description': The one every account starts with.
        '[1].description': ""
        '[0].avatar': https://example.com/avatar.png

  - name: an account with no organisations answers an empty array
    source: https://api.clever-cloud.com/v2/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v2/organisations
      headers:
        Authorization: "Bearer cauldr0n-cl3ver-f1xture-t0ken"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
