# Increase Recipe for Cauldron
#
# Increase has a sandbox, and it is a good one. The reason to emulate it
# anyway is that the behaviour worth testing takes days to happen.
#
# An ACH transfer settles in one or two business days. A return arrives up to
# sixty days after that, and an administrative return can arrive later still.
# No sandbox reproduces that on a useful timescale, so the code that handles
# it is written from the documentation and runs for the first time in
# production, against real money, months after it shipped.
#
# This Recipe takes the same position as Mercury, Bill.com, Gusto and Deel:
# reading is modelled and moving money is not. There is no endpoint here that
# creates a transfer, and the header says so rather than leaving somebody to
# find out.
#
# Five things worth modelling exactly:
#
#   1. A return is a new object, not a change to the transfer. The transfer
#      that was returned still says it was submitted and still carries the
#      amount that left. Nothing about it is marked wrong. The return sits
#      beside it with its own identifier and its own date, and code that
#      reconciles by reading transfers alone never sees the money come back.
#   2. The return arrives days later, and the date proves it. The transfer in
#      this fixture settled on the fourth and was returned on the eleventh, a
#      week after everything downstream had treated it as final.
#   3. The return reason is the only thing that says whether retrying is
#      legal. insufficient_funds may be retried; no_account may not, and
#      authorization_revoked must never be, because doing so is a regulatory
#      problem rather than a failed request. All three arrive identically.
#   4. Amounts are integer minor units and the sign carries the direction. A
#      credit is positive and a debit is negative, on the same field, so
#      summing without reading the sign gives a number that is neither the
#      money in nor the money out.
#   5. pending_submission, pending_approval, submitted, returned. Submitted
#      means Increase handed it to the network, which is the strongest
#      statement available and is not the same as arrived.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing is transferred. Which state a transfer holds is what a fixture
#     puts there, and there is no create endpoint at all.
#   - Increase's idempotency key behaviour, which is genuinely load-bearing
#     for a payments API, is not modelled: the header is accepted and
#     ignored.
#   - Approvals, OAuth, entity onboarding, cards and the simulation endpoints
#     the real sandbox provides are not modelled.
#   - The event and event subscription model is real and is not here; the
#     webhook events below are Cauldron's shape rather than Increase's
#     envelope.
#
# Tokens below are fixtures, not secrets, and every figure is invented.

recipe: increase
capability: banking
version: 0.1.0

upstream:
  api: v1
  docs: https://increase.com/documentation/api
  # Found by cauldron discover rather than recorded by hand: this
  # document declares all four routes this Recipe models,
  # which is evidence it belongs to this provider rather than proof.
  # It is what the paging parameters below were read from.
  spec: https://increase.com/openapi.json
  spec_hash: 77e71113c06d3c1b6dae2788d485722686293a0c5f97797ff7672ed017af9550
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_increase_api_key
  # Confirmed live 2026-09-05 against api.increase.com, no account and no
  # key -- see the errors table below. No credential and a well-formed
  # wrong one share a type and a title and differ only in a nested reason
  # and a detail sentence. Checked on a real route, on a path this file
  # does not declare, and on a wrong method: identical every time, which
  # means the credential is checked before routing, not after.
  absent_error: invalid_api_key_no_header
  rejected_error: invalid_api_key_no_credential

responses:
  list:
    style: wrapped
    # An opaque cursor, and there is no total anywhere. A progress bar cannot
    # be built from this API at all, which is a decision rather than an
    # oversight.
    cursor_field: next_cursor
  resource:
    style: bare
  error:
    style: flat
    message_field: title
    code_field: type
    type_field: "-"
    status_field: status

resources:
  ach_transfer:
    collection: data
    id:
      style: prefixed
      prefix: ach_transfer_
      length: 24
    fields:
      account_id:
        type: string
      # Integer minor units, and the sign is the direction. A credit is
      # positive and a debit is negative on this same field.
      amount:
        type: integer
      currency:
        type: string
        default: USD
      # pending_approval, pending_submission, submitted, returned, canceled.
      # submitted means handed to the network, which is not arrived.
      status:
        type: string
        default: pending_submission
      # The return, and it is here rather than anywhere else.
      #
      # This Recipe had /ach_transfer_returns as a collection of its own, and
      # Increase has no such path: its description declares ninety-one and
      # none of them is that. What it does declare is a return object on the
      # transfer itself, carrying exactly created_at, return_reason_code,
      # transaction_id and transfer_id.
      #
      # Two comments here said the opposite -- that the transfer carries no
      # pointer to its return, and that anything reading transfers alone
      # never sees it. Reading the transfer is the only way to see it. A
      # client written against the old shape called an endpoint that answers
      # 404 and looked for a link that was always there.
      #
      # Absent on a transfer that has not been returned, which is what makes
      # status: returned worth checking first.
      # return.return_reason_code, which repeats the parent and is what
      # Increase sends. Declared explicitly because the validator refuses the
      # shape otherwise, and it is right to: the usual cause of a name like
      # this is somebody flattening a nested object by prefixing it.
      return_reason_code:
        type: string
        in: return
        as: return_reason_code
      returned_at:
        type: string
        in: return
        as: created_at
      return_transaction_id:
        type: string
        in: return
        as: transaction_id
      return_transfer_id:
        type: string
        in: return
        as: transfer_id
      # The name the receiving bank shows, truncated to what the network
      # allows rather than to what was sent.
      statement_descriptor:
        type: string
      routing_number:
        type: string
      # The whole number. This said "last four only, which is what the API
      # returns", and Increase returns account_number in full -- it is the
      # customer's own account and Increase is the bank. Code written against
      # a masked field here would read account_number_last4 and find nothing,
      # and code written against the real API and tested here would mask
      # something that was never masked.
      account_number:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      # Under submission, where Increase puts it. Set when Increase handed the
      # transfer to the network -- not when it arrived, and there is no field
      # for that because nobody tells Increase either. A transfer that has
      # not been submitted has no submission object at all, so its absence is
      # the signal rather than a null date.
      submitted_at:
        type: string
        in: submission
        as: submitted_at

  account:
    collection: data
    id:
      style: prefixed
      prefix: account_
      length: 24
    fields:
      name:
        type: string
      # Minor units again. Available is what can be spent and current
      # includes what has not settled, so the two differ for days at a time
      # and the smaller one is the honest one.
      available_balance:
        type: integer
        in: balances
        as: available_balance
      current_balance:
        type: integer
        in: balances
        as: current_balance
      currency:
        type: string
        default: USD
      status:
        type: string
        default: open

routes:
  - method: GET
    path: /accounts
    resource: account
    operation: list

    pagination:
      # Increase's own description declares cursor -- "Return the page of
      # entries after this one" -- and limit, whose description is worth
      # quoting because it collapses two numbers into one: "The default (and
      # maximum) is 100 objects." So a caller cannot ask for more and never
      # needs to ask for the most.
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: cursor
  - method: GET
    path: /accounts/{id}
    resource: account
    operation: get

  - method: GET
    path: /ach_transfers
    resource: ach_transfer
    operation: list

    pagination:
      # Increase's own description declares cursor -- "Return the page of
      # entries after this one" -- and limit, whose description is worth
      # quoting because it collapses two numbers into one: "The default (and
      # maximum) is 100 objects." So a caller cannot ask for more and never
      # needs to ask for the most.
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: cursor
  - method: GET
    path: /ach_transfers/{id}
    resource: ach_transfer
    operation: get

webhooks:
  events:
    - ach_transfer.created
    - ach_transfer.updated
  signing:
    scheme: hmac-sha256
    header: Increase-Webhook-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: rate_limited_error
    message: "This API request has been rate limited."

  # Confirmed live 2026-09-05 -- see the header. This file declared code
  # "authentication_error" and message "Your API key is invalid."; the real
  # type is invalid_api_key_error and the real title is "Invalid API key.",
  # neither of which is what was declared.
  invalid_api_key_no_header:
    status: 401
    code: invalid_api_key_error
    message: "Invalid API key."
    fields:
      detail: "Invalid API key: No Authorization header provided."
      reason: no_header

  invalid_api_key_no_credential:
    status: 401
    code: invalid_api_key_error
    message: "Invalid API key."
    fields:
      detail: "Invalid API key: Invalid token."
      reason: no_credential

  resource_missing:
    status: 404
    code: object_not_found_error
    message: "There is no object with that ID."

  parameter_missing:
    status: 400
    message: "One or more parameters were invalid."
    code: invalid_parameters_error

  # A key minted for the sandbox cannot touch production and the failure says
  # so in a way that is easy to read past at three in the morning.
  environment_mismatch:
    status: 403
    code: environment_mismatch_error
    message: "This API key is for a different environment."

  # The one that matters. An account without the funds cannot send, and the
  # failure is a refusal rather than a transfer that fails later.
  insufficient_funds:
    status: 400
    code: insufficient_funds_error
    message: "The account does not have sufficient available funds."

fixtures:
  empty: {}

  small-business:
    account:
      - id: account_cauldron000000001
        name: Operating
        # Available is lower than current, and stays that way for days,
        # because something has not settled. The smaller one is the honest
        # one and the larger one is the one that gets read.
        available_balance: 412_50
        current_balance: 512_50
        currency: USD
        status: open

    ach_transfer:
      # Handed to the network on the fourth. This is the strongest statement
      # the API makes and it is not "arrived".
      - id: ach_transfer_cauldron00000001
        account_id: account_cauldron000000001
        amount: -25000
        currency: USD
        status: submitted
        statement_descriptor: INVOICE 1042
        routing_number: "021000021"
        account_number: "000123456789"
        company_name: Cauldron Supplies
        created_at: "2026-06-03T14:02:11Z"
        submitted_at: "2026-06-04T09:00:00Z"
        # Nearly a month later, on a transfer whose status is still
        # submitted. A reason that must never be retried, and nothing in the
        # object's shape distinguishes it from one that may be.
        return_reason_code: authorization_revoked
        returned_at: "2026-07-02T08:41:19Z"
        return_transaction_id: transaction_cauldron0000002
        return_transfer_id: ach_transfer_cauldron00000001
      # Returned, and it still says returned rather than saying why or when.
      # The reason and the date are on the return object, not here.
      - id: ach_transfer_cauldron00000002
        account_id: account_cauldron000000001
        amount: -18000
        currency: USD
        status: returned
        statement_descriptor: INVOICE 1043
        routing_number: "011401533"
        account_number: "000987654321"
        company_name: Cauldron Supplies
        created_at: "2026-06-03T14:05:44Z"
        submitted_at: "2026-06-04T09:00:00Z"
        # A week after it was submitted. Everything downstream had treated it
        # as final for seven days, and the only record of that is here.
        return_reason_code: insufficient_funds
        returned_at: "2026-06-11T11:20:03Z"
        return_transaction_id: transaction_cauldron0000001
        return_transfer_id: ach_transfer_cauldron00000002
      # Money coming in, so the amount is positive on the same field. Summing
      # without reading the sign gives a number that is neither the money in
      # nor the money out.
      - id: ach_transfer_cauldron00000003
        account_id: account_cauldron000000001
        amount: 90000
        currency: USD
        status: submitted
        statement_descriptor: CUSTOMER 88
        routing_number: "121000248"
        account_number: "000111122223"
        company_name: Cauldron Supplies
        created_at: "2026-06-05T10:15:00Z"
        submitted_at: "2026-06-05T16:00:00Z"

# Conformance cases, read from the Increase API reference rather than observed
# against a live account. The verify report says so, and observing the
# behaviour these describe would mean waiting sixty days.
conformance:
  - name: no credential at all names the missing header
    source: https://api.increase.com/accounts
    verified: "2026-09-05"
    request:
      method: GET
      path: /accounts
    expect:
      status: 401
      body:
        status: 401
        type: invalid_api_key_error
        title: "Invalid API key."
        detail: "Invalid API key: No Authorization header provided."
        reason: no_header

  - name: a token nobody issued gets a different reason and detail
    source: https://api.increase.com/accounts
    verified: "2026-09-05"
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: Bearer sk_junk_12345
    expect:
      status: 401
      body:
        status: 401
        type: invalid_api_key_error
        title: "Invalid API key."
        detail: "Invalid API key: Invalid token."
        reason: no_credential

  - name: the credential is checked before a path is known to exist
    # A path this file does not declare at all still answers the
    # missing-header failure above rather than a 404, confirmed live
    # 2026-09-05 -- the credential check runs first, unconditionally.
    source: https://api.increase.com/nope-not-a-route
    verified: "2026-09-05"
    request:
      method: GET
      path: /nope-not-a-route
    expect:
      status: 401
      body:
        type: invalid_api_key_error
        reason: no_header

  - name: a returned transfer still says it was submitted
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_cauldron00000002
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        # The status changed and the rest of the transfer did not. The amount
        # that left is still here and the submission time is still here.
        #
        # This comment used to say there was no pointer to the return. There
        # is: it is the return object, one level down, and the absent list
        # below is now about the shape it is not -- flattened onto the
        # transfer under prefixed names, which is what somebody writes when
        # they have only seen the field list.
        status: returned
        amount: -18000
        # The whole account number, not four digits of it. Increase is the
        # bank and the account is the customer's own, so nothing is masked --
        # and a Recipe that masks it teaches code to expect a shape the API
        # does not send.
        account_number: "000987654321"
        # Under submission. This asserted a flat submitted_at and passed,
        # because the Recipe emitted one.
        submission.submitted_at: "2026-06-04T09:00:00Z"
      absent:
        - return_reason_code
        - returned_at
        - return_id

  - name: the return is on the transfer, with its own date
    # This case used to fetch /ach_transfer_returns/{id}, an endpoint Increase
    # does not have: its description declares ninety-one paths and none of
    # them is that. The return is an object on the transfer.
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_cauldron00000002
      headers:
        Authorization: Bearer cauldron_increase_api_key
      query:
        api_version: "1"
    expect:
      status: 200
      body:
        # Seven days after the transfer was handed to the network. The status
        # says returned and says nothing about when or why; both of those are
        # one level down.
        status: returned
        return:
          created_at: "2026-06-11T11:20:03Z"
          return_reason_code: insufficient_funds

  - name: a return can arrive against a transfer that still reads as submitted
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_cauldron00000001
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        # Nearly a month after submission, and the status still says
        # submitted. Reading status alone says the money left and stayed
        # gone, and the object carrying the contradiction is right beside it.
        status: submitted
        return:
          created_at: "2026-07-02T08:41:19Z"
          return_reason_code: authorization_revoked

  - name: a transfer that was not returned carries no return at all
    # Absence, not an empty object and not a null. A check for the key is the
    # only reliable test, and this is the case that keeps one honest.
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_cauldron00000003
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        status: submitted
      absent:
        - return

  - name: the reason decides whether retrying is legal
    # Two returns, identical in shape, and one of them must never be retried.
    # insufficient_funds may be; authorization_revoked may not, and doing so
    # is a regulatory problem rather than a failed request. Only the reason
    # code separates them, and it is a string among dozens.
    #
    # This case used to read them from a listing of returns, which Increase
    # does not have. Reading them means reading two transfers.
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        data[0].return.return_reason_code: authorization_revoked
        data[1].return.return_reason_code: insufficient_funds
      absent:
        # And the third has none, in the same listing, so a loop over these
        # has to test for the key rather than read it.
        - data[2].return

  - name: the sign carries the direction on one field
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        # Two out and one in, on the same field. Summing these without
        # reading the sign gives 47000, which is neither the money that left
        # nor the money that arrived.
        data[0].amount: -25000
        data[1].amount: -18000
        data[2].amount: 90000

  - name: amounts are minor units with no decimal anywhere
    source: https://increase.com/documentation/api#ach-transfers
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_cauldron00000003
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        # Nine hundred dollars, written as ninety thousand. An integer, so
        # nothing in the value hints at the scale, and dividing by a hundred
        # is a decision the reader has to know to make.
        amount: 90000
        currency: USD

  - name: available is not current, and stays that way for days
    source: https://increase.com/documentation/api#accounts
    fixture: small-business
    request:
      method: GET
      path: /accounts/account_cauldron000000001
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      body:
        # A hundred dollars apart because something has not settled. The
        # larger number is the one that gets read and the smaller one is the
        # one that can be spent.
        balances.available_balance: 41250
        balances.current_balance: 51250

  - name: a listing pages by cursor and offers no total
    source: https://increase.com/documentation/api#pagination
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers
      query:
        limit: "2"
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 200
      matches:
        next_cursor: '.'
      # There is no count anywhere in this API, so a progress bar cannot be
      # built from it at all. That is a decision rather than an oversight,
      # and code that expects one has nowhere to look.
      absent:
        - total_count
        - total
        - has_more

  - name: a failure carries a type and repeats the status
    source: https://increase.com/documentation/api#errors
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers/ach_transfer_doesnotexist00
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      status: 404
      body:
        # The status appears twice, once in the response and once in the
        # body, and the machine-readable half is called type rather than
        # code.
        status: 404
        type: object_not_found_error
      matches:
        title: 'no object with that ID'

  - name: insufficient funds is a refusal rather than a later failure
    source: https://increase.com/documentation/api#errors
    arm: insufficient_funds
    fixture: small-business
    request:
      method: GET
      path: /ach_transfers
      headers:
        Authorization: Bearer cauldron_increase_api_key
    expect:
      # Refused outright, which is the opposite of an ACH return: this one
      # never reaches the network and there is nothing to reconcile.
      status: 400
      body:
        type: insufficient_funds_error
      matches:
        title: 'sufficient available funds'


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=ach_transfer_cauldron00000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads"
    source: "https://increase.com/documentation/api#ach-transfers"
    fixture: small-business
    request:
      method: GET
      path: "/ach_transfers"
      query:
        "limit": "1"
        "cursor": "ach_transfer_cauldron00000001"
      headers:
        "Authorization": "Bearer cauldron_increase_api_key"
    expect:
      status: 200
      body:
        "data[0].id": "ach_transfer_cauldron00000002"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=ach_transfer_cauldron00000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads on ach_transfers"
    source: "https://increase.com/documentation/api#ach-transfers"
    fixture: small-business
    request:
      method: GET
      path: "/ach_transfers"
      query:
        "limit": "1"
        "cursor": "ach_transfer_cauldron00000001"
      headers:
        "Authorization": "Bearer cauldron_increase_api_key"
    expect:
      status: 200
      body:
        "data[0].id": "ach_transfer_cauldron00000002"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the account listing answers with what the fixture holds"
    source: "https://increase.com/documentation/api#ach-transfers"
    fixture: small-business
    request:
      method: GET
      path: "/accounts"
      headers:
        "Authorization": "Bearer cauldron_increase_api_key"
    expect:
      status: 200
      body:
        "data[0].id": "account_cauldron000000001"
      absent:
        - "data[1]"

