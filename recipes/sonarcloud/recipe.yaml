# SonarCloud Recipe for Cauldron
#
# The quality gate has three outcomes and one of them means nobody set a gate.
#
# Of api/qualitygates/project_status, in Sonar's own words:
#
#   "The different statuses returned are: OK, WARN, ERROR, NONE. The NONE
#    status is returned when there is no quality gate associated with the
#    analysis."
#
# So a CI step written as `if (status !== "OK") fail()` fails the build for a
# project that has no gate, and a step written as `if (status === "ERROR")
# fail()` passes everything on a project whose gate was never attached. NONE is
# not a pass and not a failure; it is the absence of the question.
#
# And every number inside the gate is a string. From the response example the
# API publishes for itself:
#
#   {"status": "ERROR", "metricKey": "new_coverage", "comparator": "LT",
#    "errorThreshold": "85", "actualValue": "82.50562381034781"}
#
# The threshold, the measured value and the direction of the comparison are all
# data, all text. Evaluating a condition means parsing two strings and reading
# an operator out of a third field -- and comparing them as strings works by
# luck on "14" against "0" and fails on "9" against "10".
#
# Written against the description SonarCloud serves of itself at
# api/webservices/list, and the response examples at
# api/webservices/response_example. Thirty-three web services, 156 actions, and
# every quotation here comes from one of them.
#
# Four more the Recipe pins:
#
#   1. There is no verb but GET and POST. Of the 156 actions, 87 are POST and
#      69 are GET, and the description has no way to express another: each
#      action carries a boolean called "post". Deleting a comment is
#      POST api/issues/delete_comment. The path is the verb and the method
#      only says whether anything changes.
#   2. The analysis and the gate are different objects with different statuses.
#      api/ce/task reports the Compute Engine task -- PENDING, IN_PROGRESS,
#      SUCCESS, FAILED, CANCELED -- and a task that FAILED produced no gate
#      result at all. "Is the build green" needs both, in order.
#   3. A failed task hands back a Java stack trace inside a JSON string.
#      errorStacktrace carries "java.lang.IllegalStateException: ...\n\tat
#      org.sonar.server.computation..." beside a boolean called
#      hasErrorStacktrace, so the error channel is a serialised exception and
#      the flag telling you whether to read it is separate.
#   4. An issue carries two names for its status and two for its effort. The
#      example sends issueStatus: "CONFIRMED" and status: "CONFIRMED" side by
#      side, and effort: "15min" and debt: "15min" -- old names kept beside new
#      ones, agreeing today, on one object.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - project_status is deprecated and this file cannot say so on the wire.
#     Its entry in api/webservices/list carries "deprecatedSince": "16
#     September, 2025", and nothing in the endpoint's own response mentions it.
#     The only way to learn that the endpoint you are calling is deprecated is
#     to call a different endpoint that describes it -- which is a fact about
#     the API rather than a shape a response can carry.
#   - "Either 'analysisId', 'projectId' or 'projectKey' must be provided": one
#     lookup with three identifier parameters. This Recipe serves projectKey
#     and records the other two, for the same reason ConfigCat's
#     settingKeyOrId is recorded rather than served.
#   - Paging, issue search, measures, branches, pull requests, hotspots and
#     the thirty other web services are absent.
#
# The token and projects below are fixtures and belong to no organisation.

recipe: sonarcloud
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://sonarcloud.io/web_api

auth:
  # A user token goes in the username half of Basic auth with no password at
  # all, which is the shape that catches people: putting it in the password
  # half is the obvious guess and it is refused.
  scheme: basic
  credential: username
  keys:
    - squ_cauldronfixturetokennotarealone000000000

responses:
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: msg
    code_field: "-"
    type_field: "-"

resources:
  project_status:
    id:
      style: opaque
      field: "-"
    fields:
      status:
        type: string
      ignoredConditions:
        type: boolean
      conditions:
        type: list
      caycStatus:
        type: string

  task:
    id:
      style: opaque
    fields:
      type:
        type: string
      componentKey:
        type: string
      componentName:
        type: string
      analysisId:
        type: string
      status:
        type: string
      submittedAt:
        type: string
      executedAt:
        type: string
      executionTimeMs:
        type: integer
      errorMessage:
        type: string
      hasErrorStacktrace:
        type: boolean
      errorStacktrace:
        type: string
      logs:
        type: boolean

  issue:
    id:
      style: opaque
      field: key
    fields:
      rule:
        type: string
      severity:
        type: string
      component:
        type: string
      project:
        type: string
      line:
        type: integer
      textRange:
        type: map
      # Two names for one thing, agreeing today.
      issueStatus:
        type: string
      status:
        type: string
      message:
        type: string
      # And two more, as durations in text.
      effort:
        type: string
      debt:
        type: string
      assignee:
        type: string
      author:
        type: string
      tags:
        type: list
      transitions:
        type: list
      actions:
        type: list
      comments:
        type: list

  comment:
    id:
      style: opaque
      field: key
    fields:
      login:
        type: string
      markdown:
        type: string

routes:
  - method: GET
    path: /api/qualitygates/project_status
    resource: project_status
    operation: get
    id_from: query:projectKey
    envelope:
      style: wrapped
      key: projectStatus

  - method: GET
    path: /api/ce/task
    resource: task
    operation: get
    id_from: query:id
    envelope:
      style: wrapped
      key: task

  - method: POST
    path: /api/issues/add_comment
    resource: issue
    operation: update
    id_from: query:issue
    envelope:
      style: wrapped
      key: issue

  # A delete, over POST, because there is no other verb in this API.
  - method: POST
    path: /api/issues/delete_comment
    resource: comment
    operation: delete
    id_from: query:comment
    # The API's own description of this action records that it has no response
    # example, and it answers with nothing.
    status: 204

errors:
  authentication_error:
    status: 401
    message: Authentication is required

  resource_missing:
    status: 404
    message: Component key not found

  invalid_request:
    status: 400
    message: Either 'analysisId', 'projectId' or 'projectKey' must be provided

fixtures:
  empty: {}

  organisation:
    project_status:
      # A gate that failed, with a condition inside it that passed.
      - id: cauldron-web
        status: ERROR
        ignoredConditions: false
        caycStatus: compliant
        conditions:
          - status: ERROR
            metricKey: new_coverage
            comparator: LT
            periodIndex: 1
            errorThreshold: "85"
            actualValue: "82.50562381034781"
          - status: ERROR
            metricKey: new_blocker_violations
            comparator: GT
            periodIndex: 1
            errorThreshold: "0"
            actualValue: "14"
          - status: OK
            metricKey: new_sqale_debt_ratio
            comparator: GT
            periodIndex: 1
            errorThreshold: "5"
            actualValue: "0.6"

      # A project nobody attached a gate to. Not passing, not failing.
      - id: cauldron-scratch
        status: NONE
        ignoredConditions: false
        conditions: []

    task:
      - id: AVAn5RKqYwETbXvgas-I
        type: REPORT
        componentKey: cauldron-web
        componentName: Cauldron Web
        analysisId: "123456"
        status: FAILED
        submittedAt: "2026-05-02T11:32:15+0200"
        executedAt: "2026-05-02T11:32:22+0200"
        executionTimeMs: 5286
        errorMessage: Fail to extract report AVaXuGAi_te3Ldc_YItm from database
        hasErrorStacktrace: true
        errorStacktrace: "java.lang.IllegalStateException: Fail to extract report AVaXuGAi_te3Ldc_YItm from database\n\tat org.sonar.server.computation.task.projectanalysis.step.ExtractReportStep.execute(ExtractReportStep.java:50)"
        logs: false

    issue:
      - id: AVibidgv1LF0E-ru2DVv
        rule: squid:S2301
        severity: MAJOR
        component: cauldron-web:src/main/java/Checkout.java
        project: cauldron-web
        line: 78
        textRange:
          startLine: 78
          endLine: 78
          startOffset: 14
          endOffset: 39
        issueStatus: CONFIRMED
        status: CONFIRMED
        message: Provide multiple methods instead of using "modal" to determine which action to take.
        effort: 15min
        debt: 15min
        assignee: ada
        author: ada@cauldron.test
        tags:
          - design
        transitions:
          - unconfirm
          - resolve
          - falsepositive
          - wontfix
        actions:
          - comment
          - assign
        comments: []

    comment:
      - id: AVmDRx8Zm-z8OYZYRSxo
        login: ada
        markdown: Please fix this

conformance:
  - name: a project with no gate answers NONE
    source: https://sonarcloud.io/api/webservices/list
    fixture: organisation
    request:
      method: GET
      path: /api/qualitygates/project_status?projectKey=cauldron-scratch
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      status: 200
      body:
        # "The NONE status is returned when there is no quality gate
        # associated with the analysis." Not a pass and not a failure: a CI
        # step branching either way gets it wrong.
        "projectStatus.status": NONE
      absent:
        - projectStatus.conditions[0]

  - name: every number in a gate condition is a string
    source: https://sonarcloud.io/api/webservices/response_example?controller=api/qualitygates&action=project_status
    fixture: organisation
    request:
      method: GET
      path: /api/qualitygates/project_status?projectKey=cauldron-web
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      status: 200
      body:
        # The threshold and the measurement are text, and the direction of the
        # comparison is a third field. Comparing these as strings is right on
        # "14" against "0" and wrong on "9" against "10".
        "projectStatus.status": ERROR
        "projectStatus.conditions[0].errorThreshold": "85"
        "projectStatus.conditions[0].actualValue": "82.50562381034781"
        "projectStatus.conditions[0].comparator": LT

  - name: a failing gate can contain a passing condition
    source: https://sonarcloud.io/api/webservices/response_example?controller=api/qualitygates&action=project_status
    fixture: organisation
    request:
      method: GET
      path: /api/qualitygates/project_status?projectKey=cauldron-web
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      status: 200
      body:
        # So reporting "the gate failed because of X" means finding which of
        # the conditions is the one that failed, and there may be several.
        "projectStatus.conditions[1].status": ERROR
        "projectStatus.conditions[1].metricKey": new_blocker_violations
        "projectStatus.conditions[2].status": OK

  - name: the analysis and the gate are different objects
    source: https://sonarcloud.io/api/webservices/response_example?controller=api/ce&action=task
    fixture: organisation
    request:
      method: GET
      path: /api/ce/task?id=AVAn5RKqYwETbXvgas-I
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      status: 200
      body:
        # The Compute Engine task failed. There is no gate result for a task
        # that never finished, so "is the build green" needs this first and
        # the gate second.
        "task.status": FAILED
        "task.type": REPORT
        "task.componentKey": cauldron-web
        "task.analysisId": "123456"

  - name: a failed task answers with a Java stack trace in a string
    source: https://sonarcloud.io/api/webservices/response_example?controller=api/ce&action=task
    fixture: organisation
    request:
      method: GET
      path: /api/ce/task?id=AVAn5RKqYwETbXvgas-I
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      status: 200
      body:
        # The error channel is a serialised exception, and whether it is worth
        # reading is a separate boolean.
        "task.hasErrorStacktrace": true
        "task.errorMessage": Fail to extract report AVaXuGAi_te3Ldc_YItm from database
      matches:
        "task.errorStacktrace": '^java\.lang\.IllegalStateException:.*\n\tat org\.sonar\.'

  - name: an issue carries two names for its status and two for its effort
    source: https://sonarcloud.io/api/webservices/response_example?controller=api/issues&action=add_comment
    fixture: organisation
    request:
      method: POST
      path: /api/issues/add_comment?issue=AVibidgv1LF0E-ru2DVv
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
      json:
        text: Please fix this
    expect:
      status: 200
      body:
        # Old names kept beside new ones, agreeing today, on one object -- so
        # code reading either is right until one of them moves.
        "issue.issueStatus": CONFIRMED
        "issue.status": CONFIRMED
        "issue.effort": 15min
        "issue.debt": 15min

  - name: a delete is a POST because there is no other verb
    source: https://sonarcloud.io/api/webservices/list
    fixture: organisation
    request:
      method: POST
      path: /api/issues/delete_comment?comment=AVmDRx8Zm-z8OYZYRSxo
      headers:
        Authorization: "Basic c3F1X2NhdWxkcm9uZml4dHVyZXRva2Vubm90YXJlYWxvbmUwMDAwMDAwMDA6"
    expect:
      # 87 of the API's 156 actions are POST and 69 are GET, and the
      # description has no way to express another: each action carries a
      # boolean called "post". The path is the verb.
      status: 204
      no_body: true

  - name: the token goes in the username half and the password is empty
    source: https://sonarcloud.io/web_api
    fixture: organisation
    request:
      method: GET
      path: /api/qualitygates/project_status?projectKey=cauldron-web
      headers:
        # The same token, in the password half instead: squ_...:  becomes
        # :squ_..., and it is refused.
        Authorization: "Basic OnNxdV9jYXVsZHJvbmZpeHR1cmV0b2tlbm5vdGFyZWFsb25lMDAwMDAwMDAw"
    expect:
      status: 401
      body:
        "errors[0].msg": Authentication is required
