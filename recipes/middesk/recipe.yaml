# Middesk Recipe for Cauldron
#
# Written against Middesk's published OpenAPI document at docs.middesk.com and
# struck live against api.middesk.com on 2026-09-09 with no credential, with a
# deliberately invalid one, with a credential carrying no scheme prefix, and on
# a path that does not exist.
#
# **The document declares one response, and it is the success.** `GET
# /v1/businesses` lists exactly `200`. No 401, no 403, no 404, no 429, nothing.
# The live API answers 401 to every request that arrives without a credential,
# so the one response every new integration meets first is the one the
# specification does not mention.
#
# A generated client from this document has no failure type at all: every
# method returns a business list, and the 401 arrives as a parse error or as a
# list-shaped object with no `data` in it, depending on the generator.
#
# It is the far end of a spectrum this collection now covers completely.
# [attentive](../attentive) declares five failure statuses and gives none of
# them a body. [close](../close) declares three and types every one as "Any
# type". Middesk declares none. All three answer a real, specific JSON body on
# the wire, so in every case the document is not silent because the API is.
#
# **And the security scheme is defined and never applied** -- the same
# malpractice [close](../close) has, found on a different provider on the same
# day. `components.securitySchemes` defines `bearer_auth`; top-level `security`
# is null; no operation declares one. What every operation declares instead is
# a header parameter literally named `Authorization`, `required: true`, typed
# string. Two providers, two documents, one mistake: the machinery OpenAPI has
# for describing authentication sits populated and unreferenced beside a
# hand-rolled string.
#
# **`data` is not required and `object` is.** The envelope's required list is
# `["object", "has_more"]`. So a conforming listing must say that it is a list
# and whether there is more of it, and need not contain any records at all. The
# wrapper is guaranteed; the contents are optional.
#
# **The failure is an array of one.**
#
#   401 {"errors":[{"message":"Unauthorized"}]}
#
# An array shape is a promise that several things can go wrong at once and a
# client should loop. Here the array has one entry, that entry has one field,
# and the field is the reason phrase. There is no code to branch on, no field
# name to blame, and no identifier to quote -- and the same body answers a
# missing credential, a wrong one, and a credential sent with no scheme in
# front of it.
#
# **An unknown path declares HTML and sends nothing.** `404` with
# `Content-Type: text/html; charset=UTF-8` and a body of zero bytes, so the
# header names a media type for a document that is not there.
#
# **And the front door is a 204.** `GET /` answers `204 No Content` to a
# request with no credential at all, so the cheapest health check anybody
# writes -- fetch the root, check the status is 2xx -- reports this API as
# healthy and authenticated when it is neither.

recipe: middesk
capability: identity
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.middesk.com/
  spec: https://docs.middesk.com/openapi.json
  spec_hash: 87c7ee7127af305d20b17a34a602cac75f5cb087e2bc6d1b04886cf7864b2dda
  spec_seen: "2026-09-09"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - mk_test_cauldr0nm1ddeskf1xture
  # One body for all three, and it is an array holding one sentence.
  absent_error: unauthorized
  rejected_error: unauthorized
  malformed_error: unauthorized
  # An unknown path answers the empty HTML 404 rather than the credential
  # failure, so the router runs first.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    count_field: total_count
    has_more_field: has_more
    fields:
      # Required by the document, which declares it a string and never says
      # which string -- no enum, no example. See the README.
      object: list
  error:
    # An array shape for a failure that is only ever one thing.
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  business:
    id:
      field: id
      style: uuid
    fields:
      object:
        type: string
        default: business
      name:
        type: string
      # open, pending, in_audit, in_review, approved, rejected -- six values,
      # of which the first two both read as "not started yet".
      status:
        type: string
      # Two fields for the caller's own identifier, one of them promising
      # uniqueness in its name and neither required.
      external_id:
      unique_external_id:
      tags:
        type: list
      # Declared with no type at all, so the document names the field and says
      # nothing about what it holds.
      website:
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /v1/businesses
    resource: business
    operation: list
    pagination:
      style: page
      limit: 25
      limit_param: per_page
      cursor_param: page

errors:
  unauthorized:
    status: 401
    # The reason phrase, in the only field of the only entry of an array.
    message: Unauthorized

  unknown_route:
    status: 404
    # A media type named for a body of zero bytes.
    empty: true
    headers:
      Content-Type: text/html; charset=UTF-8

fixtures:
  empty:
    business: []

  account:
    business:
      - id: 7c41e8b2-5d90-4a63-9f18-2e6b47c05a13
        object: business
        name: Northwind Traders LLC
        status: approved
        external_id: crm-4471
        unique_external_id: crm-4471
        tags:
          - onboarded
        website: https://northwind.example.invalid
        created_at: "2026-04-11T08:30:00.000Z"
        updated_at: "2026-08-22T13:45:10.000Z"
      - id: b9d2f605-1c74-4e88-a30f-5f81ac9d2764
        object: business
        name: Contoso Supply Co
        # Under review, which is one of two values that read as "not
        # finished" and the one that means a human is looking.
        status: in_review
        # Both caller-supplied identifiers absent, which the schema permits
        # for either.
        tags: []
        created_at: "2026-09-02T09:41:00.000Z"
        updated_at: "2026-09-02T09:41:00.000Z"

conformance:
  - name: a missing credential is an array holding one sentence
    source: https://api.middesk.com/v1/businesses
    verified: "2026-09-09"
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers: {}
    expect:
      status: 401
      body:
        # No code to branch on, no field named, no identifier to quote.
        'errors[0].message': Unauthorized

  - name: a wrong credential is the same array
    source: https://api.middesk.com/v1/businesses
    verified: "2026-09-09"
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        'errors[0].message': Unauthorized

  - name: a credential with no scheme is the same array again
    source: https://api.middesk.com/v1/businesses
    verified: "2026-09-09"
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        # No Bearer prefix, which is a third distinct mistake and gets the
        # same one-entry array.
        Authorization: "notreal"
    expect:
      status: 401
      body:
        'errors[0].message': Unauthorized

  - name: an unknown path declares HTML and sends nothing
    source: https://api.middesk.com/v1/cauldron-nope
    verified: "2026-09-09"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 404
      headers:
        # A media type for a document that is not there.
        Content-Type: text/html; charset=UTF-8
      no_body: true

  - name: businesses are wrapped in a Stripe-shaped envelope
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        # `object` and `has_more` are the two required keys and `data` is not
        # one of them, so the wrapper is guaranteed and the contents are not.
        object: list
        'data[0].name': Northwind Traders LLC
        'data[0].id': 7c41e8b2-5d90-4a63-9f18-2e6b47c05a13

  - name: every record carries its own type discriminator
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        # Required on the record as well as on the envelope, and the document
        # declares it a plain string with no enum and no example -- so it
        # never says which string.
        'data[0].object': business
        'data[1].object': business

  - name: the status is one of six and two of them mean not started
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        # open, pending, in_audit, in_review, approved, rejected. A client
        # deciding whether to let a business transact has to know which of
        # the four non-terminal values it can proceed on.
        'data[0].status': approved
        'data[1].status': in_review

  - name: there are two fields for the callers own identifier
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        # One of them promises uniqueness in its name; neither is required,
        # and both are nullable.
        'data[0].external_id': crm-4471
        'data[0].unique_external_id': crm-4471
      absent:
        - 'data[1].external_id'
        - 'data[1].unique_external_id'

  - name: a business never edited has two identical timestamps
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        'data[1].created_at': "2026-09-02T09:41:00.000Z"
        'data[1].updated_at': "2026-09-02T09:41:00.000Z"
        'data[0].updated_at': "2026-08-22T13:45:10.000Z"
        'data[0].website': https://northwind.example.invalid
        'data[0].tags[0]': onboarded
        'data[1].tags': []

  - name: businesses page and report a total
    source: https://docs.middesk.com/openapi.json
    fixture: account
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        'data[0].id': b9d2f605-1c74-4e88-a30f-5f81ac9d2764
        total_count: 2

  - name: an account with no businesses answers an empty array
    source: https://docs.middesk.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/businesses
      headers:
        Authorization: "Bearer mk_test_cauldr0nm1ddeskf1xture"
    expect:
      status: 200
      body:
        data: []
        object: list
        has_more: false
