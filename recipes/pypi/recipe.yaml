# PyPI Recipe for Cauldron
#
# Three download counters, on every package, that always say minus one.
#
#   "downloads": {"last_day": -1, "last_month": -1, "last_week": -1}
#
# That is the live response for requests, and for every other project on PyPI.
# Warehouse stopped serving download statistics through this API and kept the
# field, so the shape is intact, the keys are all present, the types are right,
# and the numbers are a sentinel. Code that reads info.downloads.last_month
# renders "-1 downloads" and nothing anywhere errored.
#
# Every file gets a fourth one. Each entry in urls carries its own downloads,
# also minus one, so a package with two files reports five counters and five
# sentinels.
#
# Written against the live API rather than a document: PyPI publishes no
# OpenAPI for this, and the endpoint is public, so every case below was checked
# against pypi.org on the date in its verified field. The fixture is the real
# requests project as it stood that day.
#
# Four more the Recipe pins:
#
#   1. The biggest field in the response disappears one path segment along.
#      /pypi/{project}/json carries releases -- every version, with every file
#      under it, 163 of them for requests. /pypi/{project}/{version}/json does
#      not carry it at all. Same resource, same server, and the key a client
#      walks to enumerate versions is simply absent from the more specific
#      endpoint.
#   2. A version can exist with nothing to install. Three of requests'
#      releases -- 0.0.1, 0.12.01 and 2.15.0 -- map to empty arrays, so
#      Object.keys(releases).length counts versions that have no files and
#      cannot be downloaded.
#   3. One key in the file entry is hyphenated and the rest are not.
#      comment_text, md5_digest, python_version, upload_time_iso_8601,
#      packagetype, has_sig -- and core-metadata. A destructuring assignment
#      that works for its neighbours is a syntax error for that one.
#   4. The same hash arrives twice, and the same instant arrives twice. A file
#      carries md5_digest at the top level and digests.md5 with the same value
#      inside; and upload_time "2026-05-14T19:25:26" beside
#      upload_time_iso_8601 "2026-05-14T19:25:26.443000Z" -- one without a
#      timezone and rounded to the second, one with, for a single event.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - There is no authentication here, because there is none on the real
#     endpoint: the JSON API is public and unauthenticated, so this Recipe
#     declares no scheme and no case can describe a refusal. That is fidelity
#     rather than an omission, and it is the reason there is no 401 below.
#   - Project names are normalised: PEP 503 says /pypi/Flask-SQLAlchemy/json
#     and /pypi/flask_sqlalchemy/json name one project. This Recipe serves the
#     normalised spelling only, because one path segment matching many
#     spellings is a lookup rule rather than a shape.
#   - The Simple API (PEP 691), upload, and the deprecated XML-RPC interface
#     are absent.
#   - The classifiers, description and project_urls fields are carried as they
#     arrive rather than modelled: they are free-form and the interesting
#     things here are not in them.
#
# The fixture below is public data about a public package, recorded on the
# date in the cases.

recipe: pypi
capability: infrastructure
version: 0.1.0

upstream:
  api: json
  docs: https://docs.pypi.org/api/json/

auth:
  # Public, and this says so rather than inventing a credential.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  project:
    id:
      style: opaque
      field: "-"
    fields:
      info:
        type: map
      last_serial:
        type: integer
      # Every version, with every file. Present here and nowhere else.
      releases:
        type: map
      urls:
        type: list
      vulnerabilities:
        type: list
      ownership:
        type: map

  release:
    id:
      style: opaque
      field: "-"
    fields:
      project:
        type: string
        in: "-"
      # Declared so that a mutation adding it to a record is visible: the
      # version endpoint does not send this, and the case below says so.
      releases:
        type: map
      info:
        type: map
      last_serial:
        type: integer
      urls:
        type: list
      vulnerabilities:
        type: list
      ownership:
        type: map

routes:
  - method: GET
    path: /pypi/{id}/json
    resource: project
    operation: get

  - method: GET
    path: /pypi/{project}/{id}/json
    resource: release
    operation: get
    scope: [project]

errors:
  resource_missing:
    status: 404
    message: Not Found

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  index:
    project:
      - id: requests
        last_serial: 37059094
        info:
          name: requests
          version: 2.34.2
          summary: Python HTTP for Humans.
          requires_python: ">=3.10"
          # The headline, exactly as PyPI sends it.
          downloads:
            last_day: -1
            last_month: -1
            last_week: -1
          # Two fields for one thing, and only the older one is filled in.
          license: Apache-2.0
          license_expression: null
          yanked: false
          yanked_reason: null
          # Identical strings under two names.
          package_url: https://pypi.org/project/requests/
          project_url: https://pypi.org/project/requests/
          release_url: https://pypi.org/project/requests/2.34.2/
          bugtrack_url: null
          docs_url: null
          home_page: null
          platform: null
          requires_dist:
            - charset_normalizer<4,>=2
            - idna<4,>=2.5
            - urllib3<3,>=1.26
            - certifi>=2023.5.7
          provides_extra:
            - security
            - socks
            - use-chardet-on-py3
          dynamic:
            - License-File
        releases:
          # A version with nothing under it. Three of requests' releases are
          # like this.
          "2.15.0": []
          "2.34.2":
            - filename: requests-2.34.2-py3-none-any.whl
              packagetype: bdist_wheel
        urls:
          - filename: requests-2.34.2-py3-none-any.whl
            packagetype: bdist_wheel
            python_version: py3
            size: 73075
            # A fourth counter, and the same sentinel.
            downloads: -1
            # A field for GPG signatures PyPI no longer accepts.
            has_sig: false
            comment_text: null
            md5_digest: cc4287951c320ff794e5e183c7a91f85
            digests:
              blake2b_256: a0f4c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a
              # The same hash again, one level in.
              md5: cc4287951c320ff794e5e183c7a91f85
              sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
            # The one hyphenated key in the object.
            core-metadata:
              sha256: 8c384ba3e979480faae2859d3c5e6c1276dd2c3616e322e124d52c8cfc556f27
            upload_time: "2026-05-14T19:25:26"
            upload_time_iso_8601: "2026-05-14T19:25:26.443000Z"
            yanked: false
            yanked_reason: null
          - filename: requests-2.34.2.tar.gz
            packagetype: sdist
            python_version: source
            size: 142856
            downloads: -1
            has_sig: false
            comment_text: null
            md5_digest: 611e438d0803e962500225f9807a475e
            upload_time: "2026-05-14T19:25:27"
            upload_time_iso_8601: "2026-05-14T19:25:27.735762Z"
            yanked: false
            yanked_reason: null
        vulnerabilities: []
        ownership:
          organization: null
          roles:
            - role: Owner
              user: Lukasa

    release:
      - id: 2.32.3
        project: requests
        last_serial: 37059094
        info:
          name: requests
          version: 2.32.3
          summary: Python HTTP for Humans.
          downloads:
            last_day: -1
            last_month: -1
            last_week: -1
          # The project URL, on the endpoint for one version -- so the field
          # named after the package points at the project and the field named
          # after the release points at the release.
          package_url: https://pypi.org/project/requests/
          release_url: https://pypi.org/project/requests/2.32.3/
        urls:
          - filename: requests-2.32.3-py3-none-any.whl
            packagetype: bdist_wheel
            downloads: -1
            has_sig: false
        vulnerabilities: []
        ownership:
          organization: null
          roles:
            - role: Owner
              user: Lukasa

      # A version of a different project, so that the project segment is
      # something the cases can see rather than something the file asserts
      # about itself. urllib3 1.26.20 answers 200 on pypi.org; requests
      # 1.26.20 answers 404, and both were checked.
      - id: 1.26.20
        project: urllib3
        last_serial: 26178962
        info:
          name: urllib3
          version: 1.26.20
          summary: HTTP library with thread-safe connection pooling, file post, and more.
          downloads:
            last_day: -1
            last_month: -1
            last_week: -1
        urls: []
        vulnerabilities: []
        ownership:
          organization: null
          roles: []

conformance:
  - name: three download counters that always say minus one
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # Warehouse stopped serving download statistics through this API and
        # kept the field. Every project on PyPI answers this way.
        "info.downloads.last_day": -1
        "info.downloads.last_week": -1
        "info.downloads.last_month": -1

  - name: and every file carries a fourth one
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # Two files, two more sentinels, so this package reports five
        # counters and none of them counts.
        "urls[0].downloads": -1
        "urls[1].downloads": -1

  - name: the releases map is on the project endpoint
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # Every version, with its files under it -- 163 of them for requests
        # on the day this was checked.
        "releases.2\\.34\\.2[0].filename": requests-2.34.2-py3-none-any.whl

  - name: and gone one path segment along
    source: https://pypi.org/pypi/requests/2.32.3/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/2.32.3/json
    expect:
      status: 200
      body:
        "info.version": 2.32.3
      absent:
        # The biggest field in the response, absent from the more specific
        # endpoint. A client that walks releases to enumerate versions finds
        # nothing here and no error saying why.
        - releases

  - name: a version can exist with nothing to install
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # 2.15.0 is a real release of requests with an empty file list, and
        # two more of its versions are the same. Counting the keys of
        # releases counts versions nobody can install.
        "releases.2\\.15\\.0": []

  - name: one key in a file entry is hyphenated and the rest are not
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # Beside comment_text, md5_digest, python_version, packagetype and
        # upload_time_iso_8601. Destructuring works for every sibling and not
        # for this one.
        "urls[0].core-metadata.sha256": 8c384ba3e979480faae2859d3c5e6c1276dd2c3616e322e124d52c8cfc556f27
        "urls[0].python_version": py3

  - name: the same hash arrives twice
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # md5_digest at the top of the entry, and md5 again inside digests
        # beside the two hashes that only live there.
        "urls[0].md5_digest": cc4287951c320ff794e5e183c7a91f85
        "urls[0].digests.md5": cc4287951c320ff794e5e183c7a91f85
        "urls[0].digests.sha256": 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0

  - name: and the same instant arrives twice, at two precisions
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # One rounded to the second with no timezone, one with milliseconds
        # and a Z. Sorting files by the first can tie where the second does
        # not.
        "urls[0].upload_time": "2026-05-14T19:25:26"
        "urls[0].upload_time_iso_8601": "2026-05-14T19:25:26.443000Z"

  - name: a file still reports whether it was signed
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # PyPI stopped accepting GPG signatures in 2023 and the field stayed.
        # It is false on everything uploaded since, which is a different
        # thing from meaning the file is unsigned.
        "urls[0].has_sig": false
        "urls[1].has_sig": false

  - name: two licence fields and only the older one is filled in
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/json
    expect:
      status: 200
      body:
        # PEP 639 added license_expression beside license. Reading the new
        # one alone finds nothing for a package that has not migrated.
        "info.license": Apache-2.0
        "info.license_expression": null

  - name: package_url does not point at what you asked for
    source: https://pypi.org/pypi/requests/2.32.3/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/2.32.3/json
    expect:
      status: 200
      body:
        # On the endpoint for one version, package_url is still the project
        # page. The field named after the package points at the project and
        # the field named after the release points at the release.
        "info.package_url": https://pypi.org/project/requests/
        "info.release_url": https://pypi.org/project/requests/2.32.3/

  - name: a project nobody has published is a 404
    source: https://pypi.org/pypi/requests/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/not-a-real-project-cauldron-fixture/json
    expect:
      status: 404
      body:
        # The whole body, checked live: one key, two words, and no code, no
        # type and no detail anywhere.
        message: Not Found

  - name: a version is only visible under the project that published it
    source: https://pypi.org/pypi/requests/1.26.20/json
    verified: "2026-08-25"
    fixture: index
    request:
      method: GET
      path: /pypi/requests/1.26.20/json
    expect:
      # 1.26.20 is a real release of urllib3 and answers 200 under that name.
      # Asked for under requests it is a 404, because a version number means
      # nothing without the project it belongs to.
      status: 404
      body:
        message: Not Found

  # The names. This Recipe declares 3 field(s) on a project that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a project carries the field names this Recipe declares"
    source: "https://pypi.org/pypi/requests/json"
    fixture: index
    request:
      method: GET
      path: "/pypi/requests/json"
    expect:
      status: 200
      body:
        "last_serial": 37059094

  # The names. This Recipe declares 3 field(s) on a release that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a release carries the field names this Recipe declares"
    source: "https://pypi.org/pypi/requests/2.32.3/json"
    fixture: index
    request:
      method: GET
      path: "/pypi/requests/2.32.3/json"
    expect:
      status: 200
      body:
        "last_serial": 37059094

  # The names. This Recipe declares 2 field(s) on a project that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a project carries the field names this Recipe declares, and 1 more of them"
    source: "https://pypi.org/pypi/requests/json"
    fixture: index
    request:
      method: GET
      path: "/pypi/requests/json"
    expect:
      status: 200
      body:
        "ownership.roles[0].role": "Owner"

  # The names. This Recipe declares 2 field(s) on a release that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a release carries the field names this Recipe declares, and 1 more of them"
    source: "https://pypi.org/pypi/requests/2.32.3/json"
    fixture: index
    request:
      method: GET
      path: "/pypi/requests/2.32.3/json"
    expect:
      status: 200
      body:
        "ownership.roles[0].role": "Owner"

  # The names. This Recipe declares 3 field(s) on a release that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a release carries the field names this Recipe declares, and 1 more of them (3)"
    source: "https://pypi.org/pypi/requests/2.32.3/json"
    fixture: index
    request:
      method: GET
      path: "/pypi/requests/2.32.3/json"
    expect:
      status: 200
      body:
        "urls[0].downloads": -1



