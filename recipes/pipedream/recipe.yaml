# Pipedream Recipe for Cauldron
#
# A wrong credential and an absent one are not the same failure here, and the
# gap between them is not in the credential -- it is in when the check runs.
#
# Checked live against api.pipedream.com on the date below, with no account
# and no key ever created:
#
#   GET /v1/users/me            no header       -> 404 {"error":"record not found"}
#   GET /v1/users/me            junk Bearer     -> 401 {"error":"Unauthorized"}
#   GET /v1/workflows           no header       -> 404 {"error":"route not found"}
#   GET /v1/workflows           junk Bearer     -> 401 {"error":"Unauthorized"}
#   GET /v1/workflows/abc123    no header       -> 404 {"error":"record not found"}
#   POST /v1/users/me           no header       -> 404 {"error":"route not found"}
#   POST /v1/users/me           junk Bearer     -> 401 {"error":"Unauthorized"}
#   GET /v1/<made-up path>      no header       -> 404 {"error":"route not found"}
#   GET /v1/<made-up path>      junk Bearer     -> 401 {"error":"Unauthorized"}
#
# Read the columns rather than the rows. Every request carrying an
# Authorization header, right or wrong path, right or wrong method, real
# route or invented one, gets exactly one answer if the header does not
# check out: 401, {"error":"Unauthorized"}. The credential is checked before
# the router looks at the path at all. Every request carrying no header at
# all gets whatever the router would have said anyway: "record not found"
# for a route that exists and needed a caller it does not have, "route not
# found" for one that was never there. Two failure families, told apart not
# by what is wrong but by whether anything was presented to be wrong.
#
# **GET /v1/workflows -- the plain listing -- is not a route.** Every one of
# the nine calls above is real; "route not found" for the bare listing is
# not a fixture gap, it is what asking for it gets you. Pipedream's own
# documentation index (pipedream.com/docs/llms.txt) lists six workflow
# endpoints -- invoke, create, update, get-a-workflows-details,
# get-workflows-emits, get-workflows-errors -- and none of them is "list my
# workflows." A client written to page through GET /v1/workflows the way it
# would page through GET /v1/sources is not rate limited and is not
# forbidden. It does not exist to be reached.
#
# **The one route this Recipe does model never echoes the id that reached
# it.** GET /v1/workflows/{workflow_id} answers with the workflow's triggers
# and its steps and nothing else -- no id field, no data wrapper, nothing
# naming which workflow this was. The identifier that addressed the record
# is not a property of the record, the same shape Marqeta's balance
# endpoint already puts a name to in this collection's own format
# (resource.id.field: "-"): the id has to travel in the path because
# nothing in the body will ever carry it back.
#
# **The two real routes disagree about the envelope, too.** GET
# /v1/users/me wraps its answer under "data"; GET /v1/workflows/{id} does
# not wrap at all. Both are the classic REST API, both are read with the
# same Bearer header, and a client that learned the wrapper from one and
# assumed it for the other reads workflow.data as undefined.
#
# **The published spec does not reach any of this.** Pipedream serves a
# genuine OpenAPI 3.0.4 document at pipedream.com/docs/pipedream_openapi_swagger.json
# -- 47 paths, checked directly rather than assumed -- and every one of them
# is /v1/connect/*, /v1/apps*, /v1/app_categories* or /v1/oauth/token. Users,
# workflows, sources, webhooks, subscriptions and workspaces -- the surface
# this Recipe describes, and the one every integration written before
# Pipedream Connect existed is still calling -- has no machine-readable
# description anywhere. This Recipe carries no upstream.spec for that
# reason: pointing one at a document that does not mention the routes below
# would be a citation for the wrong claim.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Half of the missing-credential family is now served and half still is
#     not. The credential check reports which way a request failed, so
#     auth.absent_error carries the 404 "record not found" that a real route
#     answers to a caller who presented nothing -- the sharp half, the one
#     where the record supposedly missing is the caller's own account.
#
#     What is still not reproducible is that the absent-credential answer
#     depends on the path: a route Pipedream has says "record not found" and
#     one it does not have says "route not found", because an absent
#     credential falls through to the router and a present-but-wrong one
#     never reaches it. One verdict names one error for every path, so this
#     Recipe names the one its own two routes give. A request with no header
#     to a path Pipedream never had answers "record not found" here and
#     "route not found" there, and that remains the gap.
#
#     Before the verdict existed neither half could be served: the check
#     returned one bool and the single call site raised one failure, so this
#     Recipe kept only the presented-and-wrong case (the one a real
#     integration hits -- an expired or mistyped key, per Pipedream's own
#     auth docs: "requests made with the original token will yield a 401
#     Unauthorized error") and described the rest in prose.
#   - Only two of Pipedream's classic REST resources are modelled: the
#     current user and a single workflow's details. Sources, webhooks,
#     subscriptions, components and workspaces are real, documented routes
#     and are not represented -- this Recipe exists to show the
#     auth-before-routing mechanism and the two envelope shapes around it,
#     not to be a complete client.
#   - The user record's shape is read from Pipedream's own documentation,
#     not observed, because reaching it needs an account this project never
#     created. The docs' own example JSON is missing two commas -- invalid
#     as published -- and this Recipe corrects the syntax while keeping
#     every field and every value.
#   - A paid user's record documented on the same page carries
#     billing_period_start_ts, billing_period_end_ts and
#     billing_period_credits and carries no orgs at all -- a second shape
#     for the same resource, gated on account state this project has no way
#     to reach. Stated here rather than modelled as a second fixture, since
#     nothing about which shape a given credential gets is something this
#     Recipe could check.

recipe: pipedream
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  provider: pipedream
  docs: https://pipedream.com/docs/rest-api/overview

auth:
  scheme: bearer
  prefix: "Bearer "
  keys:
    - pd_cauldron_fixture_token_not_a_real_one_000000
  # Sending nothing gets a worse diagnosis than sending rubbish. Both are
  # live-verified; see the header for the half that is still not reachable.
  absent_error: record_not_found

responses:
  error:
    style: flat
    message_field: error

resources:
  user:
    id:
      style: prefixed
      prefix: "u_"
    fields:
      username:
        type: string
      email:
        type: string
      daily_compute_time_quota:
        type: integer
      daily_compute_time_used:
        type: integer
      daily_invocations_quota:
        type: integer
      daily_invocations_used:
        type: integer
      # A list of org objects, each with its own o_-prefixed id. Free-form
      # rather than a second resource: nothing here is ever addressed on its
      # own path.
      orgs:
        type: list

  workflow:
    id:
      style: prefixed
      prefix: "p_"
      # Never sent. The workflow_id that addressed this record is not a
      # property of it -- see the header. Cauldron still keys the record
      # internally, because it has to be found somehow; the wire just never
      # carries it.
      field: "-"
    fields:
      triggers:
        type: list
      steps:
        type: list

routes:
  - method: GET
    path: /v1/users/me
    resource: user
    operation: get
    # No path parameter names this record -- it answers about whoever the
    # credential belongs to.
    id_from: auth
    envelope:
      style: wrapped
      key: data

  - method: GET
    path: /v1/workflows/{id}
    resource: workflow
    operation: get
    # Recipe-wide responses.resource is bare by default, which is what this
    # route actually sends -- stated for a reader rather than needed by the
    # runtime.

errors:
  # Raised for any request whose Authorization header is present and does not
  # check out -- whatever the path, whatever the method, real route or
  # invented one. The credential is examined before the router is consulted,
  # so the path never enters into it.
  authentication_error:
    status: 401
    message: Unauthorized

  # Raised by auth.absent_error, for a request carrying no Authorization
  # header at all. Pipedream reports the caller's own account as a record
  # that does not exist, which is the finding this Recipe is named for.
  record_not_found:
    status: 404
    message: record not found

  # The runtime's own unmatched-route answer, renamed to the words Pipedream
  # actually sends. Reached here only with the fixture credential attached,
  # because auth.scheme checks first -- see the header for why an
  # unauthenticated version of this same 404 could not also be served.
  unknown_route:
    status: 404
    message: route not found

fixtures:
  empty: {}

  account:
    user:
      # The free-user example from Pipedream's own docs, corrected for the
      # two commas missing in the published JSON.
      - id: u_abc123
        username: dylburger
        email: dylan@pipedream.com
        daily_compute_time_quota: 95400000
        daily_compute_time_used: 8420300
        daily_invocations_quota: 27344
        daily_invocations_used: 24903
        orgs:
          - name: MyWorkspace
            id: o_abc123
            orgname: myworkspace
            email: workspace@pipedream.com
            daily_credits_quota: 100
            daily_credits_used: 0
          - name: MyTeam
            id: o_edf456
            orgname: myteam
            email: team@pipedream.com
            daily_credits_quota: 100
            daily_credits_used: 0
            daily_compute_time_quota: 1800000
            daily_compute_time_used: 0
            daily_invocations_quota: 100
            daily_invocations_used: 0

  workflow_fixture:
    workflow:
      # Pipedream's own documented example for GET /v1/workflows/{id}. The
      # id below (p_abc123) is what the path is addressed by; it appears
      # nowhere in the body Pipedream actually sends back -- see the header.
      - id: p_abc123
        triggers:
          - id: hi_ABpHKz
            key: eabcdefghiklmnop
            endpoint_url: http://eabcdefghiklmnop.m.d.pipedream.net
            custom_response: false
        steps:
          - id: c_abc123
            namespace: code
            disabled: false
            lang: nodejs20.x
            appConnections: []
            component: true
            savedComponent:
              id: sc_abc123
              codeHash: long-hash-here
              configurableProps:
                - name: channelId
                  type: string
                - name: message
                  type: string
                - name: slack
                  type: app
                  app: slack
              version: ""
            component_key: null
            component_owner_id: o_abc123
            configured_props_json: "{}"

conformance:
  - name: the current user answers about whoever the credential belongs to
    source: https://pipedream.com/docs/rest-api/api-reference/users/get-current-user-info.md
    fixture: account
    request:
      method: GET
      path: /v1/users/me
      headers:
        Authorization: Bearer pd_cauldron_fixture_token_not_a_real_one_000000
    expect:
      status: 200
      body:
        "data.id": u_abc123
        "data.username": dylburger
        "data.daily_invocations_quota": 27344
        "data.orgs[0].id": o_abc123
        "data.orgs[1].id": o_edf456

  - name: a wrong credential against that same route is 401 whatever it wraps
    source: https://api.pipedream.com/v1/users/me
    verified: "2026-09-01"
    fixture: account
    request:
      method: GET
      path: /v1/users/me
      headers:
        Authorization: Bearer junk_token_not_real_00000
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: and sending nothing at all is told the record does not exist
    # The other half of the pair, and the sharper one: no Authorization
    # header, and Pipedream answers about the caller's own account as though
    # it were a record that is not there. Observed live on the date below,
    # against the same path as the case above -- the two differ only in
    # whether a header was sent.
    source: https://api.pipedream.com/v1/users/me
    verified: "2026-09-01"
    fixture: account
    request:
      method: GET
      path: /v1/users/me
    expect:
      status: 404
      body:
        error: record not found

  - name: a workflow's details carry no id anywhere in the body
    source: https://pipedream.com/docs/rest-api/api-reference/workflows/get-a-workflows-details.md
    fixture: workflow_fixture
    request:
      method: GET
      path: /v1/workflows/p_abc123
      headers:
        Authorization: Bearer pd_cauldron_fixture_token_not_a_real_one_000000
    expect:
      status: 200
      body:
        "triggers[0].id": hi_ABpHKz
        "triggers[0].endpoint_url": http://eabcdefghiklmnop.m.d.pipedream.net
        "steps[0].id": c_abc123
        "steps[0].savedComponent.id": sc_abc123
      absent:
        - id
        - data

  - name: and a wrong credential against it is the identical 401
    source: https://api.pipedream.com/v1/workflows/abc123
    verified: "2026-09-01"
    fixture: workflow_fixture
    request:
      method: GET
      path: /v1/workflows/p_abc123
      headers:
        Authorization: Bearer junk_token_not_real_00000
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: a route that was never there answers the same way once the credential clears
    source: https://api.pipedream.com/v1/nonexistent-malformed-path-xyz
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-pipedream-route
      headers:
        Authorization: Bearer pd_cauldron_fixture_token_not_a_real_one_000000
    expect:
      # The exact wording of the real 404, checked live -- see the header.
      # Not dated: the call actually made against the real API sent no
      # credential at all, since this project holds none that would pass.
      status: 404
      body:
        error: route not found

  - name: a wrong credential against a made-up path is still checked before routing
    source: https://api.pipedream.com/v1/nonexistent-malformed-path-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/this-is-not-a-real-pipedream-route
      headers:
        Authorization: Bearer junk_token_not_real_00000
    expect:
      status: 401
      body:
        error: Unauthorized

  # The names. This Recipe declares 4 field(s) on a user that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an user carries the field names this Recipe declares"
    source: "https://pipedream.com/docs/rest-api/api-reference/users/get-current-user-info.md"
    fixture: account
    request:
      method: GET
      path: "/v1/users/me"
      headers:
        "Authorization": "Bearer pd_cauldron_fixture_token_not_a_real_one_000000"
    expect:
      status: 200
      body:
        "data.daily_compute_time_quota": 95400000
        "data.daily_compute_time_used": 8420300
        "data.daily_invocations_used": 24903
        "data.email": "dylan@pipedream.com"

