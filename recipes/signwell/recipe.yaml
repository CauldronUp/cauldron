# SignWell Recipe for Cauldron
#
# The credentials endpoint, read from the OpenAPI document SignWell embeds in
# each documentation page, and struck live against www.signwell.com on
# 2026-09-13 with no credential, with a deliberately invalid one, and on a path
# that does not exist.
#
# **The message a client reads first is the one that cannot tell the two
# failures apart.** Struck live:
#
#   (no key)      401 {"message":"Missing or invalid authorization key",
#                      "meta":{"error":"missing_authorization_key_error",
#                              "message":"Missing authorization key",
#                              "messages":["Missing authorization key"]}}
#   wrong key     401 {"message":"Missing or invalid authorization key",
#                      "meta":{"error":"api_key_unauthorized_error",
#                              "message":"Not valid authorization token",
#                              "messages":["Not valid authorization token"]}}
#
# `body.message` is byte-identical on both -- "Missing **or** invalid" -- and
# the sentence that says which it is sits two levels down in `meta.message`. So
# the top-level field, the one a client reaches for, is the one that was written
# to cover both cases.
#
# **And the real message is in the body three times.** `meta.error` carries it
# as a code, `meta.message` as a string, and `meta.messages` as an array holding
# that same string and nothing else. Three shapes, one sentence, one level
# below a fourth copy that disagrees with all of them.
#
# **Both codes end in `_error`, in a field called `error`.**
# `missing_authorization_key_error` and `api_key_unauthorized_error`, under
# `meta.error`.
#
# **An unrouted path answers the marketing site.** `www.signwell.com` is the
# API host and the website, so `/api/v1/cauldron-nope` answers a full
# `<!DOCTYPE html>` page titled "SignWell" -- a Turbo-powered web app, complete
# with viewport meta tags, where a JSON client expected an error.
#
# **`account` and `workspace` are the same object.** In the reference's own
# example they carry the same `id`, the same `name`, the same `plan_tier` and
# the same four booleans. The response contains it twice under two names, and
# nothing says which one a caller should read or when they might differ.
#
# **Four identifiers, and the record's own is none of the obvious ones.** The
# top-level `id` is neither the user nor the account: `user.id`, `account.id`
# and `workspace.id` are three more, two of which are equal. A caller asking
# "who am I" gets four answers.
#
# **And a person has a name and a first name and no last name.** `user.name` is
# "Jerry Smith" and `user.first_name` is "Jerry", with nothing carrying
# "Smith" -- so splitting the full name is the only way to get the other half.

recipe: signwell
capability: signing
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.signwell.com/reference/getme
  # No spec at an address of its own: SignWell embeds a complete OpenAPI
  # document per endpoint inside that endpoint's documentation page, which
  # also answers Markdown when `.md` is appended. There is nothing single to
  # fingerprint.

auth:
  # A header of its own rather than Authorization.
  scheme: header
  header: X-Api-Key
  keys:
    - cauldr0n-s1gnwell-f1xture
  # Two different failures, distinguishable only below the top level.
  absent_error: missing_authorization_key
  rejected_error: api_key_unauthorized
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    # The field that says "or" on both failures.
    message_field: message
    code_field: "-"

resources:
  membership:
    id:
      # Not the user's id and not the account's: a fourth one.
      field: id
      style: uuid
    fields:
      role:
        type: string
      archived:
        type: boolean
      user:
        type: map
      # The same object as workspace below, under a second name.
      account:
        type: map
      workspace:
        type: map

routes:
  - method: GET
    path: /api/v1/me
    resource: membership
    operation: get
    # No identifier in the request: the endpoint answers about whoever the
    # key belongs to.
    id_from: auth

errors:
  missing_authorization_key:
    status: 401
    # Covers both states, and is the field a client reads.
    message: Missing or invalid authorization key
    fields:
      meta:
        error: missing_authorization_key_error
        # The sentence that actually says which failure this is.
        message: Missing authorization key
        # And the same sentence again, as an array of one.
        messages:
          - Missing authorization key

  api_key_unauthorized:
    status: 401
    # Byte-identical to the one above.
    message: Missing or invalid authorization key
    fields:
      meta:
        error: api_key_unauthorized_error
        message: Not valid authorization token
        messages:
          - Not valid authorization token

  unknown_route:
    status: 404
    # The website, on the API host.
    style: text
    message: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <title>SignWell</title>"
    headers:
      Content-Type: text/html; charset=utf-8

fixtures:
  empty:
    membership: []

  account:
    membership:
      - id: 82eb592c-d97c-40e2-9dd2-762b67ff1015
        role: owner
        archived: false
        user:
          id: db952036-d4b8-46a5-82e0-c69683f3b5d4
          # A full name and a first name, with nothing holding the surname.
          name: Jerry Smith
          first_name: Jerry
          email: jerry@example.com
          has_google_registration: false
        account:
          id: e7897268-ca8d-413f-99cd-8c82b7ccdc60
          name: Runolfsdottir-Wunsch
          plan_tier: free
          active_templates: 0
          can_create_template: true
          can_create_tracking_document: true
          can_create_completion_document: true
          active_users:
            - id: db952036-d4b8-46a5-82e0-c69683f3b5d4
              name: Jerry Smith
              email: jerry@example.com
              has_google_registration: false
        # The same object again, field for field.
        workspace:
          id: e7897268-ca8d-413f-99cd-8c82b7ccdc60
          name: Runolfsdottir-Wunsch
          plan_tier: free
          active_templates: 0
          can_create_template: true
          can_create_tracking_document: true
          can_create_completion_document: true
          active_users:
            - id: db952036-d4b8-46a5-82e0-c69683f3b5d4
              name: Jerry Smith
              email: jerry@example.com
              has_google_registration: false

conformance:
  - name: the top-level message covers both failures at once
    source: https://www.signwell.com/api/v1/documents/
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers: {}
    expect:
      status: 401
      body:
        # "or", on the field a client reads first.
        message: Missing or invalid authorization key
        # And the one that says which, two levels down.
        'meta.message': Missing authorization key
        'meta.error': missing_authorization_key_error

  - name: a wrong key is the same top-level message
    source: https://www.signwell.com/api/v1/documents/
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: notarealkey
    expect:
      status: 401
      body:
        # Byte-identical to the case above.
        message: Missing or invalid authorization key
        'meta.error': api_key_unauthorized_error
        'meta.message': Not valid authorization token

  - name: the real message is in the body three times
    source: https://www.signwell.com/api/v1/documents/
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: notarealkey
    expect:
      status: 401
      body:
        # As a code, as a string, and as an array of one holding the string.
        'meta.error': api_key_unauthorized_error
        'meta.message': Not valid authorization token
        'meta.messages[0]': Not valid authorization token

  - name: an unrouted path answers the marketing site
    source: https://www.signwell.com/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        X-Api-Key: notarealkey
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: '\A<!DOCTYPE html>'

  - name: account and workspace are the same object
    source: https://developers.signwell.com/reference/getme
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: cauldr0n-s1gnwell-f1xture
    expect:
      status: 200
      body:
        # Same id, same name, same tier, under two keys.
        'account.id': e7897268-ca8d-413f-99cd-8c82b7ccdc60
        'workspace.id': e7897268-ca8d-413f-99cd-8c82b7ccdc60
        'account.name': Runolfsdottir-Wunsch
        'workspace.name': Runolfsdottir-Wunsch
        'account.plan_tier': free
        'workspace.plan_tier': free

  - name: who am I has four answers
    source: https://developers.signwell.com/reference/getme
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: cauldr0n-s1gnwell-f1xture
    expect:
      status: 200
      body:
        # The record's own id is neither the user's nor the account's.
        id: 82eb592c-d97c-40e2-9dd2-762b67ff1015
        'user.id': db952036-d4b8-46a5-82e0-c69683f3b5d4
        'account.id': e7897268-ca8d-413f-99cd-8c82b7ccdc60
        role: owner
        archived: false

  - name: a person has a name and a first name and no last name
    source: https://developers.signwell.com/reference/getme
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: cauldr0n-s1gnwell-f1xture
    expect:
      status: 200
      body:
        # Splitting the full name is the only way to get the other half.
        'user.name': Jerry Smith
        'user.first_name': Jerry
        'user.email': jerry@example.com
        'user.has_google_registration': false

  - name: the account says what it may create
    source: https://developers.signwell.com/reference/getme
    fixture: account
    request:
      method: GET
      path: /api/v1/me
      headers:
        X-Api-Key: cauldr0n-s1gnwell-f1xture
    expect:
      status: 200
      body:
        # Three booleans for three kinds of document, and the same person
        # listed again inside.
        'account.can_create_template': true
        'account.can_create_tracking_document': true
        'account.can_create_completion_document': true
        'account.active_templates': 0
        'account.active_users[0].id': db952036-d4b8-46a5-82e0-c69683f3b5d4
        'account.active_users[0].name': Jerry Smith
