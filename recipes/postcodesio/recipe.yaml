# Postcodes.io Recipe for Cauldron
#
# Four of the fields are named after organisations that no longer exist.
#
#   "nhs_ha": "London",                 <- Health Authorities, abolished 2002
#   "primary_care_trust": "Westminster" <- PCTs, abolished 2013
#   "nuts": "Westminster",              <- EU regions, UK left them 2020
#   "ccg": "NHS West and North London", <- CCGs, abolished 2022
#   "icb": "NHS West and North London Integrated Care Board"
#
# The last two are the sharpest: ccg is the body that was abolished in 2022 and
# icb is the body that replaced it, and they are both on the wire, next to each
# other, holding almost the same string. Nothing marks one as historical. A
# client picking whichever it found first gets an organisation that has not
# existed for years, and the value looks entirely current.
#
# **And in Wales the two abolished English bodies hold the name of a Welsh one.**
# CF10 3NP answers "Cardiff and Vale University Health Board" for both nhs_ha and
# primary_care_trust -- two fields named after two different defunct English
# structures, filled with the name of a body that is neither -- while icb, which
# is an English structure, says "Wales".
#
# Written against the live API rather than a document: every case below was
# checked against api.postcodes.io on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. The unversioned field is an alias, and only one postcode in the fixture
#      can prove which. In Westminster lsoa, lsoa11 and lsoa21 all answer
#      "Westminster 018C", so the question does not arise. In Cardiff they
#      disagree -- lsoa is "Cardiff 032H", lsoa11 is "Cardiff 032F" and lsoa21
#      is "Cardiff 032H" -- and the answer is that lsoa follows the 2021 census.
#      Nothing in the response says so, and any postcode whose boundaries did
#      not move looks like all three agreeing forever.
#   2. The versioned pair that does differ differs in vocabulary, not vintage.
#      ruc11 is "(England/Wales) Urban major conurbation" and ruc21 is "Urban:
#      Nearer to a major town or city" -- one carries a parenthetical country
#      prefix and the other does not, and the classifications are not the same
#      set of words.
#   3. A null field's code is a row of nines. admin_county is null and
#      codes.admin_county is "E99999999"; ced is null and codes.ced is the same
#      string. So the absence is spelled two ways in one response, and one of
#      them looks like a real code.
#   4. ccg_id is a different shape every time. Every other entry in the codes
#      block is a letter and eight digits; ccg_id is "W2U3Z" on the Westminster
#      postcode -- five alphanumerics beginning with W, on an English record --
#      and "7A4" on the Cardiff one, which is three. Three shapes, two records.
#   6. A code can say "no such thing" about a field that has a value. Cardiff's
#      icb is "Wales" and codes.icb is "W99999999", which is the same nines
#      sentinel that marks the null admin_county beside it.
#   5. date_of_introduction is "198001": six characters, year then month, no
#      separator, as a string. It is not ISO 8601 and it is not a number.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two postcodes are served, not 1.7 million: one in Westminster and one in
#     Cardiff, chosen so that the fields naming abolished bodies can be seen
#     holding different kinds of wrong value.
#   - Each is trimmed from 46 fields to the 28 the cases read, and codes from 29
#     entries to 8.
#   - Only the single-postcode lookup is modelled. Bulk lookup, reverse
#     geocoding, autocomplete, validation and the outcode endpoints answer other
#     documents.

recipe: postcodesio
capability: infrastructure
version: 0.1.0

upstream:
  api: postcodesio
  docs: https://postcodes.io/docs
  spec: https://api.postcodes.io/openapi.json
  spec_hash: 802867e0d40da9a630a61091bf207b4a45b898b2753b13ffd553a72084d14476
  spec_seen: "2026-08-31"

auth:
  # Public, and no key at all.
  scheme: none

responses:
  success:
    fields:
      # The HTTP status, restated in the body of a successful response.
      status: 200
  resource:
    style: wrapped
    key: result
  error:
    style: flat
    message_field: error
    status_field: status

resources:
  postcode:
    id:
      style: opaque
      # A postcode is its own identifier, and the body echoes it with the space
      # the path did not have.
      field: "-"
      carried_by: postcode
    fields:
      postcode:
        type: string
      # An integer scale nothing in the response explains.
      quality:
        type: integer
      # OSGB36 grid references, as integers.
      eastings:
        type: integer
      northings:
        type: integer
      country:
        type: string
      # Health Authorities were abolished in 2002.
      nhs_ha:
        type: string
      # WGS84, as floats, beside the grid references above.
      longitude:
        type: number
      latitude:
        type: number
      # Primary Care Trusts were abolished in 2013.
      primary_care_trust:
        type: string
      region:
        type: string
      # The unversioned name, which is an alias for one of the two below.
      lsoa:
        type: string
      msoa:
        type: string
      lsoa11:
        type: string
      msoa11:
        type: string
      lsoa21:
        type: string
      msoa21:
        type: string
      incode:
        type: string
      outcode:
        type: string
      parliamentary_constituency:
        type: string
      parliamentary_constituency_2024:
        type: string
      senedd_constituency:
        type: string
      # A number, where every other constituency is a name.
      senedd_constituency_no:
        type: integer
      admin_district:
        type: string
      admin_county:
        type: string
      # Six characters, year then month, no separator.
      date_of_introduction:
        type: string
      # Clinical Commissioning Groups were abolished in 2022.
      ccg:
        type: string
      # And this is what replaced them, on the same record.
      icb:
        type: string
      # The EU's regions, which the UK left in 2020.
      nuts:
        type: string
      # Two classifications with different vocabularies.
      ruc11:
        type: string
      ruc21:
        type: string
      codes:
        type: map

routes:
  - method: GET
    path: /postcodes/{id}
    resource: postcode
    operation: get
    not_found: postcode_not_found

errors:
  # A postcode that is well formed and does not exist.
  postcode_not_found:
    status: 404
    message: Postcode not found

  # And one that is not a postcode at all. Same status, different sentence, so
  # the API does draw the distinction its status code cannot.
  invalid_postcode:
    status: 404
    message: Invalid postcode

fixtures:
  empty: {}

  uk:
    postcode:
      # Westminster: England, and every abolished body filled in.
      - id: SW1A1AA
        # The path has no space and the body does.
        postcode: SW1A 1AA
        quality: 1
        eastings: 529090
        northings: 179645
        country: England
        # Abolished 2002.
        nhs_ha: London
        longitude: -0.141563
        latitude: 51.50101
        # Abolished 2013.
        primary_care_trust: Westminster
        region: London
        # The same string, three times, under three names.
        lsoa: Westminster 018C
        msoa: Westminster 018
        lsoa11: Westminster 018C
        msoa11: Westminster 018
        lsoa21: Westminster 018C
        msoa21: Westminster 018
        incode: 1AA
        outcode: SW1A
        parliamentary_constituency: Cities of London and Westminster
        parliamentary_constituency_2024: Cities of London and Westminster
        senedd_constituency: null
        senedd_constituency_no: null
        admin_district: Westminster
        # Null, and its code below is a row of nines.
        admin_county: null
        date_of_introduction: "198001"
        # Abolished 2022, next to what replaced it.
        ccg: NHS West and North London
        icb: NHS West and North London Integrated Care Board
        # The UK left NUTS in 2020.
        nuts: Westminster
        # Two vocabularies, ten years apart.
        ruc11: (England/Wales) Urban major conurbation
        ruc21: "Urban: Nearer to a major town or city"
        codes:
          admin_district: E09000033
          # The absence, spelled as a code.
          admin_county: E99999999
          ced: E99999999
          parliamentary_constituency: E14001172
          parliamentary_constituency_2024: E14001172
          ccg: E38000256
          # Five alphanumerics beginning with W, among E-plus-eight-digits, on
          # an English postcode.
          ccg_id: W2U3Z
          icb: E54000071

      # Cardiff: Wales, and the English fields filled with Welsh answers.
      - id: CF103NP
        postcode: CF10 3NP
        quality: 1
        eastings: 318356
        northings: 176955
        country: Wales
        # Both of the defunct English bodies, holding the name of a Welsh one.
        nhs_ha: Cardiff and Vale University Health Board
        longitude: -3.177225
        latitude: 51.485631
        primary_care_trust: Cardiff and Vale University Health Board
        region: null
        # Here the three disagree, and that is what says which one the
        # unversioned name follows: lsoa matches lsoa21, not lsoa11.
        lsoa: Cardiff 032H
        msoa: Cardiff 032
        lsoa11: Cardiff 032F
        msoa11: Cardiff 032
        lsoa21: Cardiff 032H
        msoa21: Cardiff 032
        incode: 3NP
        outcode: CF10
        parliamentary_constituency: Cardiff South and Penarth
        parliamentary_constituency_2024: Cardiff South and Penarth
        # Named here, where England has none.
        senedd_constituency: Caerdydd Penarth
        # And numbered, where every other constituency is named.
        senedd_constituency_no: 14
        admin_district: Cardiff
        admin_county: null
        date_of_introduction: "199906"
        ccg: Cardiff and Vale University
        # The English structure, answering with the name of a country.
        icb: Wales
        nuts: Cardiff
        # A different prefix on the same scheme.
        ruc11: (England/Wales) Urban city and town
        ruc21: "Urban: Nearer to a major town or city"
        codes:
          admin_district: W06000015
          admin_county: W99999999
          ced: W99999999
          parliamentary_constituency: W07000091
          parliamentary_constituency_2024: W07000091
          ccg: W11000029
          # Three characters here, five on the Westminster record, and neither
          # is the E-plus-eight-digits shape every other entry uses.
          ccg_id: 7A4
          # The nines sentinel, on a field whose value is not null but "Wales".
          icb: W99999999

conformance:
  - name: four fields are named after organisations that no longer exist
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # Abolished 2002, 2013, 2020 and 2022 respectively.
        "result.nhs_ha": London
        "result.primary_care_trust": Westminster
        "result.nuts": Westminster
        "result.ccg": NHS West and North London
        # And the body that replaced the last one, on the same record, holding
        # almost the same string with nothing marking either as historical.
        "result.icb": NHS West and North London Integrated Care Board

  - name: in Wales the defunct English fields hold a Welsh body's name
    source: https://api.postcodes.io/postcodes/CF103NP
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF103NP
    expect:
      status: 200
      body:
        "result.country": Wales
        # Two fields named after two different defunct English structures,
        # filled with the name of a body that is neither.
        "result.nhs_ha": Cardiff and Vale University Health Board
        "result.primary_care_trust": Cardiff and Vale University Health Board
        # And the English structure answering with the name of a country.
        "result.icb": Wales

  - name: three fields agree in Westminster and say nothing
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # All three the same, so this postcode cannot say which census the
        # unversioned name follows.
        "result.lsoa": Westminster 018C
        "result.lsoa11": Westminster 018C
        "result.lsoa21": Westminster 018C
        "result.parliamentary_constituency": Cities of London and Westminster
        "result.parliamentary_constituency_2024": Cities of London and Westminster

  - name: and disagree in Cardiff, which is what says lsoa means lsoa21
    source: https://api.postcodes.io/postcodes/CF103NP
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF103NP
    expect:
      status: 200
      body:
        # The boundaries moved between censuses here, and the unversioned name
        # follows the later one. Nothing in the response says so.
        "result.lsoa": Cardiff 032H
        "result.lsoa11": Cardiff 032F
        "result.lsoa21": Cardiff 032H
        # The msoa trio did not move, so it still says nothing.
        "result.msoa": Cardiff 032
        "result.msoa11": Cardiff 032

  - name: the versioned pair that differs differs in vocabulary
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # A parenthetical country prefix on one and not the other, and two sets
        # of words that do not describe the same categories.
        "result.ruc11": (England/Wales) Urban major conurbation
        "result.ruc21": "Urban: Nearer to a major town or city"

  - name: a null field's code is a row of nines
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # The absence spelled two ways in one response, and one of them looks
        # like a real code.
        "result.admin_county": null
        "result.codes.admin_county": E99999999
        "result.codes.ced": E99999999

  - name: one code is a different shape and a different country
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # E plus eight digits, on every entry but one.
        "result.codes.admin_district": E09000033
        "result.codes.ccg": E38000256
        "result.codes.icb": E54000071
        # Five alphanumerics beginning with W, on a Westminster postcode.
        "result.codes.ccg_id": W2U3Z

  - name: the same code is three characters on the other record
    source: https://api.postcodes.io/postcodes/CF103NP
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF103NP
    expect:
      status: 200
      body:
        # Three shapes across two records: a letter and eight digits, five
        # alphanumerics, and three.
        "result.codes.ccg_id": 7A4
        "result.codes.ccg": W11000029
        # And a code that says "no such thing" about a field holding "Wales".
        "result.icb": Wales
        "result.codes.icb": W99999999

  - name: the introduction date is a year and a month with nothing between them
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # Not ISO 8601, not a number, and six characters long.
        "result.date_of_introduction": "198001"
        # And the postcode comes back with a space the path did not have.
        "result.postcode": SW1A 1AA

  - name: a constituency is numbered in Wales and named everywhere else
    source: https://api.postcodes.io/postcodes/CF103NP
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF103NP
    expect:
      status: 200
      body:
        "result.senedd_constituency": Caerdydd Penarth
        # A number, where every other constituency on the record is a name.
        "result.senedd_constituency_no": 14
        "result.date_of_introduction": "199906"
        "result.nuts": Cardiff

  - name: the successful body restates the status it already had
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # 200 in the status line and 200 in the body, and the record itself one
        # level down under result.
        status: 200
        "result.outcode": SW1A

  - name: two coordinate systems, and a scale nothing explains
    source: https://api.postcodes.io/postcodes/SW1A1AA
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      status: 200
      body:
        # An OSGB36 grid reference as two integers, and the same point again as
        # WGS84 degrees, on one record, with nothing naming either datum.
        "result.eastings": 529090
        "result.northings": 179645
        "result.longitude": -0.141563
        "result.latitude": 51.50101
        # And an integer whose scale the response never states.
        "result.quality": 1

  - name: the Welsh record's own codes and classification
    source: https://api.postcodes.io/postcodes/CF103NP
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF103NP
    expect:
      status: 200
      body:
        # W where the other record has E, on the same field.
        "result.codes.admin_district": W06000015
        "result.codes.admin_county": W99999999
        # The same parenthetical prefix and a different category inside it.
        "result.ruc11": (England/Wales) Urban city and town
        "result.ruc21": "Urban: Nearer to a major town or city"
        "result.eastings": 318356
        "result.latitude": 51.485631

  - name: a string that is not a postcode gets the other sentence
    source: https://api.postcodes.io/postcodes/!!!
    verified: "2026-08-29"
    fixture: uk
    arm: invalid_postcode
    request:
      method: GET
      path: /postcodes/SW1A1AA
    expect:
      # The same status as a postcode that is well formed and absent, and a
      # different sentence -- so the API draws a distinction its status code
      # does not.
      status: 404
      body:
        status: 404
        error: Invalid postcode

  - name: a postcode that does not exist
    source: https://api.postcodes.io/postcodes/CF999NZ
    verified: "2026-08-29"
    fixture: uk
    request:
      method: GET
      path: /postcodes/CF999NZ
    expect:
      status: 404
      body:
        status: 404
        # Well formed and not there, which is a different sentence from the one
        # a malformed postcode gets on the same status.
        error: Postcode not found
