# what3words Recipe for Cauldron
#
# See here/recipe.yaml for the header this group of three Recipes shares:
# HERE, TomTom and what3words all carry their credential in the query string
# rather than a header, and the question the group exists to answer is what
# "unauthenticated" means once that is true. what3words gives the most
# layered answer of the three, and it is a genuinely different mechanism from
# either sibling Recipe's, not a restatement of one. Struck live, with no
# account and no key, against api.what3words.com:
#
#   GET /v3/convert-to-coordinates                              -> 401 {"error":{"code":"MissingKey","message":"Authentication failed; missing required API key parameter or header"}}
#   GET /v3/convert-to-coordinates?key=junkkey12345              -> 401 {"error":{"code":"InvalidKey","message":"Authentication failed; invalid API key"}}
#
# **Missing and wrong are two different sentences, the same shape of finding
# as HERE's Recipe in this group** -- but the two responses above do not just
# carry different prose, they come from two different tiers of
# infrastructure, provably, from the headers alone. MissingKey's response
# carries no CORS headers at all and a bare `Content-Type: application/json`;
# InvalidKey's carries `Access-Control-Allow-Origin: *`,
# `Access-Control-Allow-Headers: Content-Type, X-Api-Key`, and
# `Content-Type: application/json;charset=utf-8` -- a charset the first
# response never has. CloudFront answers "no key anywhere on this request"
# by itself, at the edge, before anything belonging to the actual API is ever
# reached; only a request that carries some key, right or wrong, is
# forwarded to the origin that adds those CORS headers and checks it. This is
# not two sentences from one auth check the way HERE's are -- it is one
# request that two different systems can answer, and which one answers is
# decided by whether a key parameter or header exists on the request at all,
# not by whether it works.
#
# **What that split means for routing and method is the finding this Recipe
# was written to pin, and it needed five separate probes to map.** All five
# struck live, no account, no key configured to be valid:
#
#   POST /v3/convert-to-coordinates?words=filled.count.soap                (no key)      -> 401 MissingKey
#   GET  /v3/totally-bogus-endpoint                                        (no key)      -> 401 MissingKey
#   POST /v3/convert-to-coordinates?words=filled.count.soap&key=junkkey12345             -> 405 {"error":{"code":"MethodNotAllowed","message":"The what3words API (v3) supports GET methods only"}}
#   GET  /v3/totally-bogus-endpoint?key=junkkey12345                                     -> 404 {"error":{"code":"NotFound","message":"Error 404. Please check your URL"}}
#   POST /v3/totally-bogus-endpoint?key=junkkey12345                                      -> 404, byte-identical to the GET above -- routing beats method
#
# The edge tier -- "is any key present at all" -- runs unconditionally before
# anything else, on every path and every method: an absent key is 401
# MissingKey whether the path is real, the method is GET, both, or neither.
# But once a key of any value passes that gate, a second, different order
# takes over at the origin, and it is routing, then method, then validity:
# an unrecognised path is 404 before a wrong method on that same path would
# even be considered, and a wrong method on a real path is 405 before the
# key's own validity is ever checked. InvalidKey -- the sentence that names
# the key itself -- is the *last* thing this API decides, not the first,
# once a key merely exists. That is a third answer to the ordering question
# Census's Recipe in this collection already gives a second one to: Census's
# gate depends on which HTTP method was used; this one depends on which of
# three separate, ordered checks a request first fails, and the credential's
# own validity is the last of the three rather than the first.
#
# **The words parameter is validated nowhere this Recipe could reach.** A
# syntactically invalid input (`notthree`, no dots) and a syntactically valid
# one that is almost certainly not a real square (`not.a.real`) both answered
# the identical InvalidKey body against a wrong key -- because the key check
# that precedes them both never let either request past it. what3words' own
# published reference answers the question this Recipe could not observe
# directly: both a malformed 3-word-address string and a syntactically
# valid-but-nonexistent one produce the *same* code, `400 BadWords`,
# "Invalid or non-existent 3 word address" -- read from
# developer.what3words.com/public-api/docs, not observed. The task that
# started this group of Recipes hoped a provider here would tell a bad
# syntax apart from a good syntax naming nothing real. what3words' own
# documentation says plainly that it does not: one error, one sentence,
# for two different mistakes, by the provider's own design rather than by a
# gap this project could not probe past. That is worth having exactly
# because it is not the distinction the task expected to find.
#
# **A second credential transport exists and was confirmed live, alongside
# the query parameter the whole group of Recipes is about.** what3words' own
# reference documents `X-Api-Key` as an alternative to `key=`, and a request
# carrying a junk value in that header instead of the query parameter reaches
# the same origin tier a query-string key does -- InvalidKey, with the same
# CORS headers -- rather than falling back to the edge's MissingKey. The
# query parameter is still the one this Recipe wires (`auth.scheme: query`
# reproduces the exposure that motivates this whole group; see the header of
# here/recipe.yaml), and the header transport is reproduced for one case only
# with `arm`, the device Mezmo's and Mapbox's Recipes in this collection use
# for a real, live-checked shape their own wired scheme cannot reach on its
# own.
#
# The one worked example this Recipe could find is what3words' own flagship
# one, quoted rather than guessed, from developer.what3words.com/public-api/
# docs: `///filled.count.soap` resolves to 51.520847, -0.195521, in
# Bayswater, London, with a `square` bounding box and a `map` short link.
# The identifiers here are not ids in any sense the rest of this collection
# uses -- three dictionary words joined by dots, addressing a fixed
# 3-metre-by-3-metre square rather than a record a database minted -- and
# `id: {style: opaque, field: words}` is the closest this format's vocabulary
# comes to naming that.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no key was ever requested, guessed or
#     used. The MissingKey and InvalidKey cases below that Cauldron's own
#     credential check reaches naturally are struck live and carry a
#     verified date; the 404 and 405 cases need a credential this live host
#     never required to reach through this emulator (see here/recipe.yaml
#     and tomtom/recipe.yaml for the identical trade-off) and carry none; the
#     two 200 cases are what3words' own documented example, not observed,
#     and carry none either.
#   - BadWords (400, both for malformed syntax and for a syntactically valid
#     address naming no real square) is documented above and not wired as a
#     route: no request that could reach it was ever made, because the
#     credential check that precedes it in what3words' own real pipeline
#     never let one through. Declaring a route that only this Recipe's own
#     fixture key could reach would be modelling a shape read from
#     documentation as though it were struck live.
#   - The X-Api-Key header transport is reproduced for one conformance case
#     only, by arming it -- see above. Every other case in this Recipe uses
#     the query parameter.
#   - autosuggest, the third what3words v3 endpoint, is not modelled at all:
#     the task named convert-to-coordinates and convert-to-3wa specifically,
#     and a third endpoint's own fuzzy-matching behaviour was out of scope
#     for what this Recipe was asked to pin.
#   - language, locale and clip-to-polygon/bounding-box parameters are
#     documented and not modelled: the one worked example this Recipe has
#     shows locale as null and says nothing about what a non-English
#     language response looks like.
#   - No fetchable OpenAPI or Swagger document was found at a stable URL for
#     this API. upstream.spec is not recorded for that reason.
#
# The key below is a fixture and belongs to no account.

recipe: what3words
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://developer.what3words.com/public-api/docs

auth:
  # In the query string -- see the header and here/recipe.yaml. what3words
  # also accepts the same credential as an X-Api-Key header, live-confirmed
  # and reproduced for one case only by arming it; see the header.
  scheme: query
  param: key
  keys:
    - cauldron_w3w_fixture_key_00000000000000000
  # A key that is present and wrong gets what3words' own InvalidKey sentence.
  # Absent falls through to the default authentication_error, whose wording
  # is already MissingKey -- the same device HERE's and FireHydrant's
  # Recipes in this collection use for the identical shape of finding.
  rejected_error: invalid_key

responses:
  resource:
    style: bare
  error:
    # {"error": {"code": "...", "message": "..."}} on every failure this
    # Recipe struck, 401, 404 and 405 alike -- one shape for all three,
    # unlike TomTom's Recipe in this group, where the routing-miss shape is
    # not the credential shape at all. Nested's own defaults (key "error",
    # message_field "message", code_field "code") already match this
    # exactly; only type_field needs suppressing, because nested's own
    # default writes a category nobody asked for and what3words never sends
    # a "type" property inside "error" at all.
    style: nested
    type_field: "-"

resources:
  address:
    id:
      # Three dictionary words joined by dots, addressing a fixed square --
      # not an id in the sense this format usually means one. See the
      # header.
      style: opaque
      field: words
    fields:
      country:
        type: string
      square_southwest_lat:
        type: number
        in: square.southwest
        as: lat
      square_southwest_lng:
        type: number
        in: square.southwest
        as: lng
      square_northeast_lat:
        type: number
        in: square.northeast
        as: lat
      square_northeast_lng:
        type: number
        in: square.northeast
        as: lng
      nearestPlace:
        type: string
      coordinates_lat:
        type: number
        in: coordinates
        as: lat
      coordinates_lng:
        type: number
        in: coordinates
        as: lng
      language:
        type: string
        default: en
      locale:
        type: string
        null_when_unset: true
      map:
        type: string

routes:
  - method: GET
    path: /v3/convert-to-coordinates
    resource: address
    operation: get
    id_from: "query:words"

  - method: GET
    path: /v3/convert-to-3wa
    resource: address
    operation: get
    # Not a real identifier lookup: coordinates address a square by
    # proximity, which this format has no matcher for, and the one fixture
    # record below is the only entry the address resource carries, the same
    # "there is only one record here" reasoning Turso's /v1/auth/validate
    # route in this collection uses id_from: auth for. See the header.
    id_from: auth

errors:
  # The edge tier's own answer -- no CORS headers, no charset. See the
  # header for why this is a different system answering, not just a
  # different sentence from the same one.
  authentication_error:
    status: 401
    code: MissingKey
    message: Authentication failed; missing required API key parameter or header
    headers:
      Content-Type: application/json

  # The origin's own answer -- CORS headers present, charset present. See
  # the header.
  invalid_key:
    status: 401
    code: InvalidKey
    message: Authentication failed; invalid API key
    headers:
      Content-Type: "application/json;charset=utf-8"
      Access-Control-Allow-Origin: "*"
      Access-Control-Allow-Headers: "Content-Type, X-Api-Key"
      Access-Control-Allow-Methods: GET

  # Overrides Cauldron's own built-in name with what3words' own wording.
  # Reached ahead of a key's own validity on the live host -- see the
  # header.
  unknown_route:
    status: 404
    code: NotFound
    message: "Error 404. Please check your URL"
    headers:
      Content-Type: "application/json;charset=utf-8"
      Access-Control-Allow-Origin: "*"

  method_not_allowed:
    status: 405
    code: MethodNotAllowed
    message: "The what3words API (v3) supports GET methods only"
    headers:
      Content-Type: "application/json;charset=utf-8"
      Access-Control-Allow-Origin: "*"

fixtures:
  empty: {}

  # what3words' own flagship worked example -- developer.what3words.com's
  # public API docs, quoted rather than guessed. Not observed: no request
  # this project could make without a key ever produced it.
  bayswater:
    address:
      - id: filled.count.soap
        country: GB
        square_southwest_lat: 51.520833
        square_southwest_lng: -0.195543
        square_northeast_lat: 51.52086
        square_northeast_lng: -0.195499
        nearestPlace: "Bayswater, London"
        coordinates_lat: 51.520847
        coordinates_lng: -0.195521
        language: en
        locale: null
        map: "https://w3w.co/filled.count.soap"

conformance:
  - name: no credential anywhere on the request is the edge's own answer
    source: https://api.what3words.com/v3/convert-to-coordinates
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v3/convert-to-coordinates
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error.code: MissingKey
        error.message: Authentication failed; missing required API key parameter or header
      absent:
        - error.type
        - Access-Control-Allow-Origin

  - name: the same edge answer covers every method and every path when no key exists at all
    source: https://api.what3words.com/v3/totally-bogus-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v3/totally-bogus-endpoint
    expect:
      status: 401
      body:
        error.code: MissingKey

  - name: a key that is present and wrong is a different system's answer, with CORS headers this time
    source: https://api.what3words.com/v3/convert-to-coordinates?words=filled.count.soap&key=junkkey12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v3/convert-to-coordinates?words=filled.count.soap&key=junkkey12345
    expect:
      status: 401
      headers:
        Content-Type: "application/json;charset=utf-8"
        Access-Control-Allow-Origin: "*"
      body:
        error.code: InvalidKey
        error.message: Authentication failed; invalid API key

  - name: neither a malformed nor a well-formed-but-wrong address changes the answer, because the key check runs first either way
    source: https://api.what3words.com/v3/convert-to-coordinates?words=notthree&key=junkkey12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v3/convert-to-coordinates?words=notthree&key=junkkey12345
    expect:
      status: 401
      body:
        error.code: InvalidKey

  - name: the X-Api-Key header reaches the same origin tier the query parameter does -- armed, because this Recipe wires the query parameter only
    source: https://api.what3words.com/v3/convert-to-coordinates?words=filled.count.soap
    verified: "2026-09-01"
    arm: invalid_key
    fixture: empty
    request:
      method: GET
      path: /v3/convert-to-coordinates?words=filled.count.soap
      headers:
        X-Api-Key: junkkey12345
    expect:
      status: 401
      body:
        error.code: InvalidKey

  - name: an unrouted path outranks a key's own validity
    # Struck live with a present-but-wrong key: this exact body. Reaching it
    # through Cauldron needs a credential this Recipe accepts, because this
    # runtime's own check is unconditional -- see the header and
    # here/recipe.yaml's identical trade-off.
    source: https://api.what3words.com/v3/totally-bogus-endpoint?key=junkkey12345
    fixture: empty
    request:
      method: GET
      path: /v3/totally-bogus-endpoint?key=cauldron_w3w_fixture_key_00000000000000000
    expect:
      status: 404
      body:
        error.code: NotFound
        error.message: "Error 404. Please check your URL"

  - name: routing outranks method too -- an unrouted path with the wrong method still answers 404, not 405
    source: https://api.what3words.com/v3/totally-bogus-endpoint?key=junkkey12345
    fixture: empty
    request:
      method: POST
      path: /v3/totally-bogus-endpoint?key=cauldron_w3w_fixture_key_00000000000000000
    expect:
      status: 404
      body:
        error.code: NotFound

  - name: a wrong method on a real path outranks a key's own validity too
    source: https://api.what3words.com/v3/convert-to-coordinates?words=filled.count.soap&key=junkkey12345
    fixture: empty
    request:
      method: POST
      path: /v3/convert-to-coordinates?words=filled.count.soap&key=cauldron_w3w_fixture_key_00000000000000000
    expect:
      status: 405
      body:
        error.code: MethodNotAllowed
        error.message: "The what3words API (v3) supports GET methods only"

  - name: three words resolve to a square, its centre, and a short link
    source: https://developer.what3words.com/public-api/docs
    fixture: bayswater
    request:
      method: GET
      path: /v3/convert-to-coordinates?words=filled.count.soap&key=cauldron_w3w_fixture_key_00000000000000000
    expect:
      status: 200
      body:
        country: GB
        nearestPlace: "Bayswater, London"
        words: filled.count.soap
        coordinates.lat: 51.520847
        coordinates.lng: -0.195521
        square.southwest.lat: 51.520833
        square.northeast.lat: 51.52086
        map: "https://w3w.co/filled.count.soap"
      absent:
        - id
        - data

  - name: the reverse direction answers the identical shape from coordinates
    source: https://developer.what3words.com/public-api/docs
    fixture: bayswater
    request:
      method: GET
      path: /v3/convert-to-3wa?coordinates=51.520847,-0.195521&key=cauldron_w3w_fixture_key_00000000000000000
    expect:
      status: 200
      body:
        words: filled.count.soap
        country: GB
