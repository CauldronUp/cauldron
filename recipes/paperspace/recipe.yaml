# Paperspace Recipe for Cauldron
#
# The machine listing, read from the OpenAPI document Paperspace serves without
# a credential at api.paperspace.com/v1/openapi.json, and struck live on
# 2026-09-13 with no header, with a wrong bearer, on a path that does not
# exist, and with a method the path does not take.
#
# **An API key is told it is not logged in.** Struck live:
#
#   {"message":"You must be logged in to access this method.","code":"UNAUTHORIZED"}
#
# "Logged in", to a caller holding a bearer token and no session; and "this
# method", for an HTTP endpoint. The same sentence answers a missing credential
# and a wrong one, so nothing tells them apart.
#
# **A wrong method is the same answer as a wrong path.** `PUT /v1/machines` and
# `GET /v1/cauldron-nope` both answer `{"message":"Not found","code":"NOT_FOUND"}`,
# so the route that exists reports that it does not.
#
# **Thirty-one required fields, and twelve of them are nullable.** A machine
# `required`s `dtDeleted`, `reservation`, `restorePointSnapshotId`,
# `autoShutdownTimeout`, `privateIp`, `publicIp`, `networkId` and five more --
# every one declared `nullable: true`. The key is guaranteed and the value is
# not, thirty-one times over, and a generated client's non-optional field is
# null.
#
# **`dtDeleted` is one of them.** Every machine record carries the time it was
# deleted, required, on a listing of machines that exist.
#
# **A frequency whose only value is an event.** `restorePointFrequency` is
# `enum: ["shutdown"]`, nullable -- so the field has two states, `null` and the
# word "shutdown", and neither of them is a frequency. Beside it
# `autoSnapshotFrequency` is `["hourly", "daily", "weekly", "monthly"]`, which
# is what the other field's name promised.
#
# **"No public address" is expressible twice.** `publicIp` is
# `string, nullable` and `publicIpType` is `["static", "dynamic", "none"]`, so a
# machine with no public address has a null in one field and the string "none"
# in the other, and nothing says what it means for them to disagree.
#
# **Two readiness states, spelled as one word each.** `state` is `["off",
# "starting", "stopping", "restarting", "serviceready", "ready", "upgrading",
# "provisioning"]`. Six are ordinary participles; `serviceready` is two words
# run together, and it is not `ready`.
#
# **Three timestamps carry a type prefix and twenty-eight fields do not.**
# `dtCreated`, `dtModified`, `dtDeleted` -- Hungarian notation, on three fields
# of a record whose other names are plain.
#
# **The bill is two bare numbers.** `usageRate` and `storageRate` are
# `type: number` with no currency field and no unit field anywhere on the record
# or in the envelope.
#
# **And no status but 200 is named anywhere.** The listing declares a 200 and a
# `default`, and `default` is a shared response called "error" with a `message`,
# a `code` and an untyped `details`. So the 401 every anonymous caller meets and
# the 404 every typo meets are the catch-all, and drift reports all three of
# this Recipe's failures as unbacked.
#
# Also pinned: `cpus` is `type: number` and `ram` is `type: integer`, so one is
# divisible and the other is not; the listing declares exactly two responses, a
# 200 and a `default`, so the 401 every anonymous caller meets is the catch-all;
# and the envelope is `{hasMore, nextPage, items}` with `additionalProperties:
# false` and `nextPage` not required, so the field that says where to go next is
# the optional one.

recipe: paperspace
capability: infrastructure
version: 0.1.0

upstream:
  api: "1"
  docs: https://docs.digitalocean.com/reference/paperspace/
  spec: https://api.paperspace.com/v1/openapi.json
  spec_hash: 24b5641713100eac4c3d5cff1fecf60312c82d208c264b1c330254c5184444df
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y00000000000000
  # One sentence for both, so nothing distinguishes them.
  absent_error: unauthorized
  rejected_error: unauthorized
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    has_more_field: hasMore
    # Required: hasMore and items. Not required: the one that says where next.
    cursor_field: nextPage
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  machine:
    id:
      field: id
      style: opaque
      length: 12
    fields:
      name:
        type: string
      # serviceready is two words run together, and it is not ready.
      state:
        type: string
      os:
        type: string
      machineType:
        type: string
      agentType:
        type: string
      # Divisible...
      cpus:
        type: number
      # ...and not.
      ram:
        type: integer
      storageTotal:
        type: integer
      storageUsed:
        type: integer
      accelerators:
      region:
        type: string
      privateIp:
      networkId:
      publicIp:
      # Where "none" is a string, beside a field where it is null.
      publicIpType:
        type: string
      autoShutdownEnabled:
        type: boolean
      autoShutdownTimeout:
      autoShutdownForce:
      autoSnapshotEnabled:
        type: boolean
      autoSnapshotFrequency:
      autoSnapshotSaveCount:
      updatesPending:
        type: boolean
      restorePointEnabled:
        type: boolean
      # An enum of one, and the one is not a frequency.
      restorePointFrequency:
      restorePointSnapshotId:
      # Two numbers, and no currency anywhere.
      usageRate:
        type: number
      storageRate:
        type: number
      dtCreated:
        type: string
      dtModified:
        type: string
      # Required, on a listing of machines that exist.
      dtDeleted:
      reservation:

routes:
  - method: GET
    path: /v1/machines
    resource: machine
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: after

errors:
  unauthorized:
    status: 401
    code: UNAUTHORIZED
    # A session word, to a caller with a token, about a "method".
    message: You must be logged in to access this method.

  unknown_route:
    status: 404
    code: NOT_FOUND
    message: Not found

  method_not_allowed:
    # The path that does exist, reporting that it does not.
    status: 404
    code: NOT_FOUND
    message: Not found

fixtures:
  empty:
    machine: []

  fleet:
    machine:
      - id: psxkkvz9a3
        name: trainer
        # Ready, but not the other kind of ready.
        state: serviceready
        os: Ubuntu 22.04
        machineType: A4000
        agentType: LinuxHeadless
        cpus: 8
        ram: 47244640256
        storageTotal: 53687091200
        storageUsed: 12884901888
        accelerators:
          - name: A4000
            memInBytes: 17179869184
        region: East Coast (NY2)
        privateIp: 10.16.4.201
        networkId: nvj2xnkj
        publicIp: 74.82.28.191
        publicIpType: static
        autoShutdownEnabled: true
        autoShutdownTimeout: 1
        autoShutdownForce: false
        autoSnapshotEnabled: false
        autoSnapshotFrequency: null
        autoSnapshotSaveCount: null
        updatesPending: false
        restorePointEnabled: true
        # The enum of one.
        restorePointFrequency: shutdown
        restorePointSnapshotId: sskkvz9a3
        # Two rates, and nothing saying in what.
        usageRate: 0.76
        storageRate: 0.07
        dtCreated: "2026-04-02T17:12:00.000Z"
        dtModified: "2026-09-11T08:31:45.000Z"
        # Required, and null, on a machine that is running.
        dtDeleted: null
        reservation: null
      - id: ps7fq2hm10
        name: cpu-worker
        state: "off"
        os: Ubuntu 22.04
        machineType: C5
        agentType: LinuxHeadless
        # A fraction of a processor, on a field typed number.
        cpus: 0.5
        ram: 4294967296
        storageTotal: 53687091200
        storageUsed: 4294967296
        accelerators: null
        region: West Coast (CA1)
        privateIp: null
        networkId: null
        # No public address, said twice and differently.
        publicIp: null
        publicIpType: none
        autoShutdownEnabled: false
        autoShutdownTimeout: null
        autoShutdownForce: null
        autoSnapshotEnabled: true
        autoSnapshotFrequency: weekly
        autoSnapshotSaveCount: 4
        updatesPending: true
        restorePointEnabled: false
        restorePointFrequency: null
        restorePointSnapshotId: null
        usageRate: 0.045
        storageRate: 0.07
        dtCreated: "2026-07-19T11:02:30.000Z"
        dtModified: "2026-08-02T09:00:00.000Z"
        dtDeleted: null
        reservation: null

conformance:
  - name: an API key is told it is not logged in
    source: https://api.paperspace.com/v1/machines
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers: {}
    expect:
      status: 401
      body:
        # A session word, to a caller with a token, about a "method".
        message: You must be logged in to access this method.
        code: UNAUTHORIZED

  - name: a wrong key is told the same thing
    source: https://api.paperspace.com/v1/machines
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # Nothing distinguishes a missing credential from a wrong one.
        message: You must be logged in to access this method.
        code: UNAUTHORIZED

  - name: an unrouted path is two words
    source: https://api.paperspace.com/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        message: Not found
        code: NOT_FOUND

  - name: the route that exists reports that it does not
    source: https://api.paperspace.com/v1/machines
    verified: "2026-09-13"
    fixture: fleet
    request:
      method: PUT
      path: /v1/machines
      headers: {}
    expect:
      status: 404
      body:
        # Byte-identical to the unrouted path above.
        message: Not found
        code: NOT_FOUND

  - name: a frequency whose only value is an event
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # enum: ["shutdown"], nullable: two states, neither a frequency.
        'items[0].restorePointFrequency': shutdown
        'items[1].restorePointFrequency': null
        # And the field beside it, which is what that name promised.
        'items[1].autoSnapshotFrequency': weekly
        'items[0].autoSnapshotFrequency': null
        'items[0].restorePointEnabled': true
        'items[0].restorePointSnapshotId': sskkvz9a3
        'items[1].restorePointSnapshotId': null

  - name: no public address is said twice and differently
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # A null in one field and the string "none" in the other.
        'items[1].publicIp': null
        'items[1].publicIpType': none
        'items[0].publicIp': 74.82.28.191
        'items[0].publicIpType': static
        'items[1].privateIp': null
        'items[1].networkId': null
        'items[0].privateIp': 10.16.4.201
        'items[0].networkId': nvj2xnkj

  - name: a required field holds the time the machine was deleted
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # Required and null, on a listing of machines that exist.
        'items[0].dtDeleted': null
        'items[1].dtDeleted': null
        'items[0].reservation': null
        # Hungarian notation, on three of thirty-one fields.
        'items[0].dtCreated': "2026-04-02T17:12:00.000Z"
        'items[0].dtModified': "2026-09-11T08:31:45.000Z"

  - name: one readiness that is not the other readiness
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # serviceready, two words run together, beside ready in the same enum.
        'items[0].state': serviceready
        'items[1].state': "off"
        'items[0].name': trainer
        'items[0].os': Ubuntu 22.04
        'items[0].machineType': A4000
        'items[0].agentType': LinuxHeadless
        'items[0].region': East Coast (NY2)

  - name: a processor is divisible and the memory is not
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # cpus is type: number, ram is type: integer.
        'items[1].cpus': 0.5
        'items[0].cpus': 8
        'items[0].ram': 47244640256
        'items[0].storageTotal': 53687091200
        'items[0].storageUsed': 12884901888
        'items[0].accelerators[0].name': A4000
        'items[1].accelerators': null

  - name: the bill is two bare numbers
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        # No currency field and no unit field, anywhere on the record.
        'items[0].usageRate': 0.76
        'items[0].storageRate': 0.07
        'items[1].usageRate': 0.045
        'items[0].autoShutdownEnabled': true
        'items[0].autoShutdownTimeout': 1
        'items[0].autoShutdownForce': false
        'items[1].autoShutdownTimeout': null
        'items[1].autoShutdownForce': null
        'items[1].autoSnapshotEnabled': true
        'items[1].autoSnapshotSaveCount': 4
        'items[0].autoSnapshotSaveCount': null
        'items[1].updatesPending': true

  - name: the field that says where to go next is the optional one
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        # hasMore and items are required; nextPage is not.
        hasMore: true
        'items[0].id': psxkkvz9a3
      matches:
        nextPage: '\A\S+\z'

  - name: and on the last page it simply is not there
    source: https://api.paperspace.com/v1/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
      query:
        limit: "1"
        after: psxkkvz9a3
    expect:
      status: 200
      body:
        hasMore: false
        'items[0].id': ps7fq2hm10
      absent:
        # additionalProperties is false, so the optional key is the one that
        # comes and goes.
        - nextPage

  - name: an account with no machines still says whether there are more
    source: https://api.paperspace.com/v1/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/machines
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000"
    expect:
      status: 200
      body:
        items: []
        hasMore: false
