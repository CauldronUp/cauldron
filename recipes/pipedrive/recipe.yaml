# Pipedrive Recipe for Cauldron
#
# Pipedrive has a sandbox and it is a separate company account you apply for,
# with its own users, its own pipeline configuration and its own data. Keeping
# it in step with production is manual work nobody does, so it drifts and then
# stops being evidence of anything. Most integrations end up pointed at the
# real CRM, where a test that creates a deal puts it in somebody's forecast.
#
# Two things worth modelling exactly:
#
#   1. Every response carries a success boolean, and the HTTP status is not
#      the whole story. A client that branches on the status alone can miss a
#      failure, and one that reads data without checking success reads null.
#   2. A deal's status and its stage are different things. A deal can sit in
#      the final stage and still be open, and code that treats reaching the
#      last stage as winning reports revenue that has not closed.
#
# Checked live against api.pipedrive.com, unauthenticated, 2026-09-05: no
# Authorization header, a fictitious bearer token, an unrouted path, and a
# wrong method all answer the identical 401 body,
# {"success":false,"error":"unauthorized access","errorCode":401,
# "error_info":"Please check developers.pipedrive.com"} -- the credential is
# checked first, and the success:false envelope reaches even here, exactly
# as claim 1 above says. Two things this file had assumed rather than
# observed turned out wrong: the sentence was written as "You need to be
# authorized to make this request." rather than "unauthorized access", and
# error_info -- the field this Recipe had been reading as a machine code --
# is not one. It is a constant human sentence pointing at the docs site,
# identical on this failure regardless of which of the four ways above
# produced it, so a client switching on it has nothing situational to
# switch on.
#
# Tokens below are fixtures, not secrets.

recipe: pipedrive
capability: crm
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.pipedrive.com/docs/api/v1

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_pipedrive_token

responses:
  success:
    fields:
      success: true
  list:
    style: wrapped
    cursor_field: additional_data.pagination.next_start
    has_more_field: additional_data.pagination.more_items_in_collection
    fields:
      additional_data:
        pagination:
          start: 0
          limit: 100
  resource:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: error
    code_field: error_info
    fields:
      # The same envelope with the payload emptied out. A client reading data
      # without checking success reads null.
      success: false
      data: null
      additional_data: null

resources:
  deal:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      title:
        type: string
        required: true
      value:
        type: number
        default: 0
      currency:
        type: string
        default: GBP
      # Status and stage are independent. A deal in the last stage can still
      # be open, and treating the last stage as won reports revenue that has
      # not closed.
      status:
        type: string
        default: open
      stage_id:
        type: integer
        default: 1
      pipeline_id:
        type: integer
        default: 1
      person_id:
        type: integer
      org_id:
        type: integer
      probability:
        type: integer
      # Set only when the deal actually closes. Absent while it is open.
      close_time:
        type: datetime
        stamped: false
      add_time:
        type: datetime

  person:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      # Pipedrive keeps contact details as arrays of labelled values, and the
      # primary one is flagged rather than first. Cauldron models the primary
      # address only, which the Recipe states rather than implies.
      email:
        type: string
      phone:
        type: string
      org_id:
        type: integer
      # A person marked inactive is still returned by a plain listing.
      active_flag:
        type: boolean
        default: true
      add_time:
        type: datetime

  organization:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      address:
        type: string
      people_count:
        type: integer
        default: 0
      open_deals_count:
        type: integer
        default: 0
      active_flag:
        type: boolean
        default: true
      add_time:
        type: datetime

routes:
  - method: GET
    path: /v1/deals
    resource: deal
    operation: list
    pagination:
      # start and limit, read from Pipedrive's own v1 description. Not cursor
      # and limit, which is what v2 uses -- the two versions page differently
      # and this Recipe models v1 paths.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: start

  - method: POST
    path: /v1/deals
    resource: deal
    operation: create
    emits: added.deal
    status: 201

  - method: GET
    path: /v1/deals/{id}
    resource: deal
    operation: get

  - method: PUT
    path: /v1/deals/{id}
    resource: deal
    operation: update
    emits: updated.deal

  - method: DELETE
    path: /v1/deals/{id}
    resource: deal
    operation: delete
    emits: deleted.deal

  - method: GET
    path: /v1/persons
    resource: person
    operation: list
    pagination:
      # start and limit, read from Pipedrive's own v1 description. Not cursor
      # and limit, which is what v2 uses -- the two versions page differently
      # and this Recipe models v1 paths.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: start

  - method: GET
    path: /v1/persons/{id}
    resource: person
    operation: get

  - method: GET
    path: /v1/organizations
    resource: organization
    operation: list
    pagination:
      # start and limit, read from Pipedrive's own v1 description. Not cursor
      # and limit, which is what v2 uses -- the two versions page differently
      # and this Recipe models v1 paths.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: start

webhooks:
  events:
    - added.deal
    - updated.deal
    - deleted.deal
    - added.person
    - updated.person
    - added.organization
  # Pipedrive puts the action before the object -- added.deal, not
  # deal.added -- and splits it across meta.action and meta.object, so the
  # two halves arrive separately whichever way round the name reads.
  #
  # previous is null here always. That is right for an add and wrong for an
  # update, where Pipedrive sends the record as it was before the write. A
  # payload template has no access to a before state -- only emits_when
  # compares one -- so this is a stated limit rather than a modelled
  # behaviour. Declaring nothing would be worse: Pipedrive always sends the
  # key, and its absence would say it does not.
  payload:
    meta:
      action: "{action}"
      object: "{resource}"
      id: "{record_id}"
      company_id: 1
      user_id: 1
      host: cauldron.pipedrive.com
      timestamp: "{created}"
      v: 1
    current:
      "{object}": true
    previous: null
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: rate_limit
    message: Rate limit has been exceeded
    headers:
      Retry-After: "2"
      X-RateLimit-Remaining: "0"

  # Verified live, 2026-09-05, against a real deals route: no Authorization
  # header, a fictitious bearer token, an unrouted path, and a wrong method
  # all answer this exact body. error_info is not a machine code here -- it
  # is a constant sentence pointing at the docs site, the same words on
  # every one of the four -- so it is served as literal text rather than
  # implying it varies with the failure.
  authentication_error:
    status: 401
    code: "Please check developers.pipedrive.com"
    message: unauthorized access
    fields:
      errorCode: 401

  resource_missing:
    status: 404
    code: not_found
    message: "The requested item could not be found: {detail}"

  parameter_missing:
    status: 400
    code: bad_request
    message: "Bad request: {detail} is required"

  # Pipedrive refuses to move a deal to a stage in a different pipeline, which
  # is the failure a sync hits the first time somebody reconfigures a pipeline
  # behind its back.
  stage_pipeline_mismatch:
    status: 400
    code: invalid_stage
    message: The stage does not belong to the pipeline of this deal.

  # The plan wall. A company over its deal limit refuses writes while reads
  # keep working.
  quota_exceeded:
    status: 403
    code: quota_exceeded
    message: The company has reached its plan limit.

fixtures:
  empty: {}

  small-company:
    organization:
      - id: "1"
        name: Analytical Engines
        address: 12 Difference Street
        people_count: 2
        open_deals_count: 1
    person:
      - id: "1"
        name: Ada Lovelace
        email: ada@example.com
        org_id: 1
      - id: "2"
        name: Grace Hopper
        email: grace@example.com
        org_id: 1
        # Still returned by a plain listing. Counting every person as
        # contactable includes this one.
        active_flag: false
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '3'
        name: Grace Hopper
        email: grace2@example.com
        org_id: 1
        active_flag: false
    deal:
      - id: "1"
        title: Annual licence
        value: 12000
        currency: GBP
        status: open
        # Final stage and still open. Treating the last stage as won reports
        # revenue that has not closed.
        stage_id: 4
        person_id: 1
        org_id: 1
        probability: 90
      - id: "2"
        title: Pilot project
        value: 3000
        status: won
        stage_id: 4
        person_id: 1
        close_time: "2026-01-15T09:00:00Z"
      - id: "3"
        title: Lost to a competitor
        value: 8000
        status: lost
        stage_id: 2
        close_time: "2026-01-10T16:30:00Z"

# Conformance cases. The auth failure below was checked live against
# api.pipedrive.com, unauthenticated, on 2026-09-05 -- see the file header.
# Everything else, which needs a company account to reach, is read from
# Pipedrive's API reference rather than observed.
conformance:
  - name: unauthorized access, checked live, is not the sentence this file assumed
    source: https://api.pipedrive.com/v1/deals
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/deals
    expect:
      status: 401
      body:
        success: false
        error: unauthorized access
        error_info: "Please check developers.pipedrive.com"
        errorCode: 401

  - name: every response carries a success flag
    source: https://developers.pipedrive.com/docs/api/v1
    fixture: small-company
    request:
      method: GET
      path: /v1/deals/1
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        success: true
        data.id: 1
        data:
          title: Annual licence
          status: open
      absent:
        - title

  - name: a failure keeps the envelope and empties the payload
    source: https://developers.pipedrive.com/docs/api/v1
    fixture: small-company
    request:
      method: GET
      path: /v1/deals/9999
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 404
      body:
        # A client reading data without checking success reads null rather
        # than an object, and one branching on the HTTP status alone can miss
        # the failure entirely.
        success: false
        data: null
        additional_data: null
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        error_info: '.'
        error: 'could not be found'

  - name: the final stage is not the same as won
    source: https://developers.pipedrive.com/docs/api/v1/Deals
    fixture: small-company
    request:
      method: GET
      path: /v1/deals
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        # Both are in stage 4. Only one is won, and code that reads the stage
        # to decide reports revenue that has not closed.
        data[0].stage_id: 4
        data[0].status: open
        data[1].stage_id: 4
        data[1].status: won

  - name: an open deal has no close time
    source: https://developers.pipedrive.com/docs/api/v1/Deals
    fixture: small-company
    request:
      method: GET
      path: /v1/deals/1
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        data:
          status: open
      # Set only when the deal closes. Stamping it would claim a close that
      # never happened.
      absent:
        - data.close_time

  - name: paging lives under additional_data
    source: https://developers.pipedrive.com/docs/api/v1
    fixture: small-company
    request:
      method: GET
      path: /v1/deals
      query:
        limit: "2"
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        additional_data:
          pagination:
            start: 0
            limit: 100
            more_items_in_collection: true
      matches:
        additional_data.pagination.next_start: '^[0-9]+$'
      absent:
        - data[2]
        - pagination

  - name: the position is start, not offset or page
    # Read from Pipedrive's own v1 description, which declares start and limit
    # on its listings. A runtime falling back to "offset" reads nothing, and
    # the whole collection comes back looking like a successful request for
    # page two.
    #
    # Worth pinning separately from limit, which the case above already sends:
    # a page size is a request parameter and so is a position, and the
    # validator's rule about unpinned names reaches response fields only.
    #
    # v2 pages by cursor rather than start, on paths under /api/v2. This
    # Recipe models v1, so it pages the v1 way, and the two are not
    # interchangeable.
    source: https://developers.pipedrive.com/docs/api/v1
    fixture: small-company
    request:
      method: GET
      path: /v1/deals
      query:
        start: "1"
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        # The second deal, because one was skipped. Reading data[0].title
        # without start gives "Annual licence".
        data[0].title: Pilot project

  - name: an inactive person is still listed
    source: https://developers.pipedrive.com/docs/api/v1/Persons
    fixture: small-company
    request:
      method: GET
      path: /v1/persons
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        data[0].active_flag: true
        # Counting every person as contactable includes this one.
        data[1].active_flag: false
        data[1].name: Grace Hopper

  - name: a bad token is refused with the same envelope
    source: https://developers.pipedrive.com/docs/api/v1
    request:
      method: GET
      path: /v1/deals
    expect:
      status: 401
      body:
        success: false
        data: null
      matches:
        error: 'authorized'

  - name: the action and the object arrive as separate halves of the name
    source: https://pipedrive.readme.io/docs/guide-for-webhooks
    fixture: small-company
    request:
      method: POST
      path: /v1/deals
      headers:
        Authorization: Bearer cauldron_pipedrive_token
      json:
        title: Kettle replacement
    expect:
      status: 201
      webhook:
        event: added.deal
        body:
          # added.deal, taken apart. The action is the first half here and
          # the last half at Asana, which is why the action is defined as
          # what is left when the object is removed.
          meta.action: added
          meta.object: deal
          current.title: Kettle replacement
        absent:
          - data.object

  - name: and offset is a word Pipedrive does not read
    # The other half of the name above, which asserted only that start works.
    # A case showing the right word is honoured does not show the wrong ones
    # are ignored, and "not offset or page" is the half a client gets wrong:
    # every neighbouring API spells it one of those two ways.
    #
    # Declaring cursor_param makes the other spellings inert, so this is what
    # says so. Without it the runtime would read offset from everybody and
    # this request would answer the second deal.
    source: https://developers.pipedrive.com/docs/api/v1
    fixture: small-company
    request:
      method: GET
      path: /v1/deals
      query:
        offset: "1"
      headers:
        Authorization: Bearer cauldron_pipedrive_token
    expect:
      status: 200
      body:
        # The first deal, unmoved. Sending offset skips nothing.
        data[0].title: Annual licence

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the organization listing answers with what the fixture holds"
    source: "https://developers.pipedrive.com/docs/api/v1"
    fixture: small-company
    request:
      method: GET
      path: "/v1/organizations"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].id": 1
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and start=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and start are the two names this listing reads"
    source: "https://developers.pipedrive.com/docs/api/v1/Deals"
    fixture: small-company
    request:
      method: GET
      path: "/v1/deals"
      query:
        "limit": "1"
        "start": "1"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].id": 2
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and start=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and start are the two names this listing reads on v1 persons"
    source: "https://developers.pipedrive.com/docs/api/v1/Persons"
    fixture: small-company
    request:
      method: GET
      path: "/v1/persons"
      query:
        "limit": "1"
        "start": "1"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].id": 2
      absent:
        - "data[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but start can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "start moves past the only record, and the page comes back empty"
    source: "https://developers.pipedrive.com/docs/api/v1"
    fixture: small-company
    request:
      method: GET
      path: "/v1/organizations"
      query:
        "limit": "1"
        "start": "1"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The names. This Recipe declares 8 field(s) on a deal that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "a deal carries the field names this Recipe declares"
    source: "https://developers.pipedrive.com/docs/api/v1/Deals"
    fixture: small-company
    request:
      method: GET
      path: "/v1/deals"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].add_time": "2026-01-01T00:00:00Z"
        "data[0].currency": "GBP"
        "data[0].org_id": 1
        "data[0].person_id": 1
        "data[0].pipeline_id": 1
        "data[0].probability": 90
        "data[0].value": 12000

  # The names. This Recipe declares 4 field(s) on a organization that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an organization carries the field names this Recipe declares"
    source: "https://developers.pipedrive.com/docs/api/v1"
    fixture: small-company
    request:
      method: GET
      path: "/v1/organizations"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].add_time": "2026-01-01T00:00:00Z"
        "data[0].address": "12 Difference Street"
        "data[0].open_deals_count": 1
        "data[0].people_count": 2

  # The names. This Recipe declares 4 field(s) on a person that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a person carries the field names this Recipe declares"
    source: "https://developers.pipedrive.com/docs/api/v1/Persons"
    fixture: small-company
    request:
      method: GET
      path: "/v1/persons"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].add_time": "2026-01-01T00:00:00Z"
        "data[0].email": "ada@example.com"
        "data[0].org_id": 1

  # The names. This Recipe declares 1 field(s) on a deal that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a deal carries the field names this Recipe declares, and 1 more of them"
    source: "https://developers.pipedrive.com/docs/api/v1"
    fixture: small-company
    request:
      method: GET
      path: "/v1/deals"
      query:
        "start": "1"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].close_time": "2026-01-15T09:00:00Z"

  # The names. This Recipe declares 2 field(s) on an organization that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "an organization carries the field names this Recipe declares, and 2 more of them"
    source: "https://developers.pipedrive.com/docs/api/v1"
    fixture: small-company
    request:
      method: GET
      path: "/v1/organizations"
      headers:
        "Authorization": "Bearer cauldron_pipedrive_token"
    expect:
      status: 200
      body:
        "data[0].active_flag": true
        "data[0].name": "Analytical Engines"






