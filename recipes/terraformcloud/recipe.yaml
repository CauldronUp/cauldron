# HCP Terraform Recipe for Cauldron
#
# Written against HashiCorp's API reference at developer.hashicorp.com and
# struck live against app.terraform.io on 2026-09-07 with no credential and
# then with a deliberately invalid one.
#
# **Every failure is two fields and neither is a sentence.** Struck live:
#
#   GET /api/v2/organizations              (no credential)
#   401 {"errors":[{"status":"401","title":"unauthorized"}]}
#
#   GET /api/v2/organizations              Authorization: Bearer not-a-real-token
#   401 {"errors":[{"status":"401","title":"unauthorized"}]}
#
#   GET /api/v2/cauldron-nope              Authorization: Bearer not-a-real-token
#   404 {"errors":[{"status":"404","title":"not found"}]}
#
# `status` restates the HTTP status as a string. `title` is the status phrase,
# lower-cased. There is no `detail`, no `code`, no `id`, no `source`. So the
# whole body of a failure is the status line, twice, in a JSON:API envelope --
# and a client that reads the body learns nothing the status did not already
# say.
#
# JSON:API defines `title` as a summary "that SHOULD NOT change from occurrence
# to occurrence of the problem" and `detail` as the specific explanation of
# *this* occurrence. Only the invariant half is here, which is the half that
# could have been a constant in the client.
#
# **A missing credential and a wrong one are byte-identical.** So the two
# failures needing different fixes are one response, and there is no field
# anywhere that could have separated them even in principle.
#
# **The 404 has the same shape**, which is the good half: one parser reads
# every failure this API produces, on every route, and the media type is
# `application/vnd.api+json` throughout. Uniformity is worth something, and
# HCP Terraform buys it by never saying anything.
#
# **The name changed and the hostname did not.** HashiCorp renamed Terraform
# Cloud to HCP Terraform in 2024. The API is at `app.terraform.io`, the paths
# say `/api/v2`, and the documentation says HCP Terraform -- so the product a
# developer searches for and the host they connect to have different names,
# the same trade [maxio](../maxio) makes with chargify.com.

recipe: terraformcloud
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.hashicorp.com/terraform/cloud-docs/api-docs
  # No spec: HashiCorp publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.atlasv1.f1xtureteam0000000000000000000
  # One response for both, struck live.
  absent_error: unauthorized
  rejected_error: unauthorized

responses:
  # JSON:API's registered media type, on every response including the failures.
  content_type: application/vnd.api+json
  list:
    style: wrapped
    key: data
    fields:
      # JSON:API's own paging block, which HCP Terraform puts under meta
      # rather than in links.
      meta:
        pagination:
          current-page: 1
          page-size: 20
          total-pages: 1
  error:
    style: list
    key: errors
    message_field: title
    code_field: "-"
    type_field: "-"

resources:
  organization:
    id:
      # The organization name is the identifier: JSON:API's id, and the thing
      # a person types. Renaming one changes every URL that names it.
      field: id
      style: opaque
    fields:
      # Beside id at the top of the record, not under attributes: JSON:API
      # keeps the discriminator out of the payload it discriminates.
      type:
        type: string
        default: organizations
      # Everything else is one level down, which is what makes org.name
      # undefined for a client that reads the record the obvious way.
      name:
        type: string
        in: attributes
      email:
        type: string
        in: attributes
      created-at:
        type: datetime
        in: attributes
      cost-estimation-enabled:
        type: boolean
        default: false
        in: attributes

routes:
  - method: GET
    path: /api/v2/organizations
    resource: organization
    operation: list
    pagination:
      style: page
      limit: 20
      limit_param: "page[size]"
      cursor_param: "page[number]"

errors:
  unauthorized:
    status: 401
    # The status phrase, lower-cased, in the field JSON:API reserves for a
    # summary that does not change between occurrences. It does not.
    message: "unauthorized"
    fields:
      status: "401"

  unknown_route:
    status: 404
    message: "not found"
    fields:
      status: "404"

fixtures:
  empty:
    organization: []

  account:
    organization:
      - id: cauldron-demo
        type: organizations
        name: cauldron-demo
        email: ops@example.invalid
        created-at: "2026-02-09T11:20:31.442Z"
        cost-estimation-enabled: true
      - id: cauldron-sandbox
        type: organizations
        name: cauldron-sandbox
        email: ops@example.invalid
        created-at: "2026-07-14T16:02:09.118Z"
        cost-estimation-enabled: false

conformance:
  - name: a failure is the status line twice and nothing else
    source: https://app.terraform.io/api/v2/organizations
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers: {}
    expect:
      status: 401
      body:
        # status restates the HTTP status as a string; title is the status
        # phrase, lower-cased. A client reading the body learns nothing the
        # status did not already say.
        'errors[0].status': "401"
        'errors[0].title': unauthorized
      absent:
        # No detail, no code, no id, no source -- so there is no field that
        # could carry what actually went wrong.
        - 'errors[0].detail'
        - 'errors[0].code'
        - 'errors[0].id'

  - name: a wrong token is byte-identical to no token
    source: https://app.terraform.io/api/v2/organizations
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer not-a-real-token"
    expect:
      status: 401
      body:
        'errors[0].title': unauthorized
        'errors[0].status': "401"

  - name: an unknown path is the same shape a status lower
    source: https://app.terraform.io/api/v2/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v2/cauldron-nope
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
    expect:
      # The good half: one parser reads every failure this API produces. HCP
      # Terraform buys that uniformity by never saying anything.
      status: 404
      body:
        'errors[0].title': "not found"
        'errors[0].status': "404"

  - name: every response declares the JSON:API media type
    source: https://app.terraform.io/api/v2/organizations
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers: {}
    expect:
      status: 401
      headers:
        # Not application/json. A client checking the header before parsing
        # does not parse, and a framework decoding only application/json hands
        # the handler an empty body.
        Content-Type: application/vnd.api+json

  - name: a record puts its fields under attributes
    source: https://developer.hashicorp.com/terraform/cloud-docs/api-docs/organizations
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
    expect:
      status: 200
      body:
        # JSON:API's shape: id and type at the top, everything else one level
        # down. So a client reading org.name finds undefined and has to reach
        # through attributes for it.
        'data[0].id': cauldron-demo
        'data[0].attributes.name': cauldron-demo
        'data[0].attributes.email': ops@example.invalid

  - name: the identifier is the name somebody typed
    source: https://developer.hashicorp.com/terraform/cloud-docs/api-docs/organizations
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
    expect:
      status: 200
      body:
        # id and attributes.name are the same string, so renaming an
        # organization changes every URL that names it and every stored
        # reference to it.
        'data[1].id': cauldron-sandbox
        'data[1].attributes.name': cauldron-sandbox
        # And `type` sits beside id rather than inside attributes: JSON:API
        # keeps the discriminator out of the payload it discriminates, so a
        # client switching on the record's kind reads it one level up from
        # everything else it needs.
        'data[1].type': organizations

  - name: field names are hyphenated rather than snake or camel
    source: https://developer.hashicorp.com/terraform/cloud-docs/api-docs/organizations
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
    expect:
      status: 200
      body:
        # JSON:API recommends hyphens and almost nothing follows it, so a
        # generated struct tag here is org["cost-estimation-enabled"] and not
        # a property access in any language.
        'data[0].attributes.cost-estimation-enabled': true
        'data[1].attributes.cost-estimation-enabled': false
        'data[0].attributes.created-at': "2026-02-09T11:20:31.442Z"

  - name: paging lives under meta rather than links
    source: https://developer.hashicorp.com/terraform/cloud-docs/api-docs
    fixture: account
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
      query:
        "page[size]": "20"
        "page[number]": "1"
    expect:
      status: 200
      body:
        # JSON:API defines links.next for this. HCP Terraform sends a
        # meta.pagination object with hyphenated keys instead, so a client
        # written against the specification finds no cursor and reads every
        # page as the last one.
        'meta.pagination.current-page': 1
        'meta.pagination.page-size': 20

  - name: an account with no organizations answers an empty array
    source: https://developer.hashicorp.com/terraform/cloud-docs/api-docs/organizations
    fixture: empty
    request:
      method: GET
      path: /api/v2/organizations
      headers:
        Authorization: "Bearer cauldron.atlasv1.f1xtureteam0000000000000000000"
    expect:
      status: 200
      body:
        data: []
