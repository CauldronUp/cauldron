# CometChat Recipe for Cauldron
#
# CometChat answers the group's question about explicit-versus-implicit
# creation the opposite way TalkJS does, and its own OpenAPI description
# (chat-apis.json, fetched directly from cometchat.com) states it structurally
# rather than in prose: there is no route anywhere on this API that creates a
# conversation. POST /groups exists; POST /conversations does not -- the only
# methods /conversations has at all are GET (list, get) and DELETE, and the
# get-by-id and delete operations on it both carry the identical sentence in
# their own description field: "This API is deprecated please use Get
# User/Group ConversationAPI" (that run-together capitalisation is the
# spec's own text, not a transcription slip). What replaced them is PUT
# .../conversation and DELETE .../conversation nested under a group or a user
# -- summarised in the spec as "Update Group Conversation" and "Reset Group
# Conversation", never "Create". A conversation on this API is not a resource
# with a create verb; it is a computed view of a group or a user pair, and
# CometChat's own deprecation note is the evidence, not an inference from
# silence.
#
# What creates the view is a group's own record carrying it from the moment
# the group exists, before any message. POST /groups' own worked example in
# the spec -- a brand-new group, nothing sent to it yet -- answers
# conversationId: "group_project-group" beside the guid, unconditionally:
#
#   {"data": {"guid": "project-group", "name": "Project Group", "type":
#    "public", "scope": "admin", "membersCount": 1, "conversationId":
#    "group_project-group", "hasJoined": true, "createdAt": 1638440784,
#    "owner": "superhero4", ...}}
#
# conversationId is not something a second call adds once a message lands; it
# is derived deterministically from the guid ("group_" plus the guid, checked
# against three separate worked examples in the spec and consistent across
# all of them) and is on the record from its first response. That is the
# opposite answer from TalkJS's own: TalkJS states plainly that a created
# conversation stays invisible until a message exists; CometChat's own
# example shows a group's conversation identifier readable at creation, with
# no message anywhere in the example that produced it.
#
# What the spec does not show, on any of its worked examples, is what
# GET .../conversation answers for a group that has never had a message.
# Every example the spec gives for that route -- and for GET /groups/{guid}
# and GET /groups, both of which nest a conversationId the same way -- has a
# lastMessage already populated, never an empty or null one. This Recipe's
# own fixture group has never been messaged, and what it answers for
# .../conversation is stated in the fidelity gaps below rather than modelled
# from a worked example that does not exist: the honest position is that
# CometChat's own documentation never shows the empty case at all, for
# either lastMessage or unreadMessageCount.
#
# The other half of this task's question -- missing vs wrong credential, and
# routing vs auth order -- has a real answer on this host and a structural
# limit on how much of it a Recipe can express. Every one of these was struck
# live, with no account, against a fabricated app id and three different
# credential shapes:
#
#   GET /v3/users   no apikey, no Authorization, nothing        -> 401
#   GET /v3/users   apikey: junkkey12345                        -> 401
#   GET /v3/users   Authorization: Bearer junktoken12345        -> 401
#
# byte-identical every time:
#   {"error":{"message":"The appId faketestapp12345 does not exists in us
#    region.","devMessage":"Indicates an invalid appId, or does not exist in
#    a region.","source":"chat-api","code":"AUTH_ERR_INVALID_APPID"}}
#
# CometChat addresses a tenant by subdomain -- {appId}.api-{region}
# .cometchat.io -- which resolves before any credential is examined, exactly
# the shape make/recipe.yaml and frontegg/recipe.yaml in this collection
# already found for their own per-tenant hosts. Cauldron has no mechanism for
# one path answering differently by hostname -- frontegg/recipe.yaml states
# this limitation in these words, for the identical reason -- so this finding
# lives here, in prose, live-verified, and not as a route: this Recipe treats
# the single host it serves as an already-resolved app, the only host any
# Cauldron Recipe can be, and the apikey scheme it declares is what the
# spec's own securitySchemes name for the routes that succeed.
#
# What that leaves genuinely unanswerable from outside an account -- and
# CometChat's own spec never gives a 4xx example anywhere in chat-apis.json,
# not one, across every path it declares -- is whether a present, well-formed
# apikey that is simply wrong reads differently from an absent one on a real
# app. This Recipe does not claim it does or does not; auth.absent_error and
# auth.rejected_error are both left unset, which is the honest default this
# format defines for exactly this situation.
#
# What routing does before any of that is answerable, and is not about the
# tenant at all: struck live against the same fabricated subdomain, a path
# this API does not register and a method a real path does not accept both
# answered the identical envelope, regardless of the app id's own validity --
# confirmed because the method-miss case used the same invalid app id the
# credential cases above did, and still answered routing's sentence rather
# than the tenant one:
#
#   GET  /v3/nosuchresource   -> 404 {"error":{"message":"The API endpoint
#     is invalid. Please verify the API call.","devMessage":"...",
#     "source":"chat-api","code":"ERR_API_NOT_FOUND"}}
#   PATCH /v3/users           -> 404, the identical body
#
# Routing is checked before the tenant lookup, which is itself checked before
# any credential could be -- three layers, struck live in that order, and
# only the outer two are host-independent enough for a Recipe to serve.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - A freshly created group's conversationId is not computed by this
#     Recipe's create route. The real value is "group_" plus whatever guid
#     the caller sent, and Cauldron's field mapping has no per-request string
#     derivation to reproduce that for an arbitrary guid -- hard-coding one
#     value would be right only for this Recipe's own fixture guid and wrong
#     for every other one a real caller might create through it. The field
#     stays in the create route's own returns list, because it is part of
#     the shape; its value is pinned instead on the fixture-seeded get case,
#     where it does not have to be derived.
#   - Whether a valid apikey against a real app reads differently from an
#     absent or malformed one is not modelled -- see above. Every success
#     route below is fixture-gated on the one apikey this Recipe holds, cited
#     from chat-apis.json's own worked examples, and carries no verified
#     date.
#   - GET .../conversation for a group with no message is not modelled with
#     any specific shape. No worked example in chat-apis.json shows an empty
#     one, for a group's conversation or a user's, and this Recipe does not
#     invent lastMessage: null or an omitted unreadMessageCount where the
#     spec shows neither.
#   - Members, banned users, scoped permissions, the messages endpoints
#     (direct and threaded), reactions, moderation, notifications, roles and
#     stats are all real chat-apis.json paths and none are routed. This
#     Recipe is scoped to what the group's question turns on: whether a
#     conversation is created explicitly, and what an unused one looks like.
#   - DELETE /groups/{guid} is documented -- {"data":{"success":true,
#     "message":"Group with guid ... has been deleted successfully."}} -- and
#     is not routed. That shape is a {success, message} pair, not the record
#     Cauldron's own deleted_body vocabulary (receipt, record, flagged, id,
#     empty) has a name for, and reaching for the closest one would be
#     claiming a shape chat-apis.json does not show.
#   - meta.pagination.total, in the one worked list example the spec gives,
#     reads 0 beside a count of 5 and a two-element data array -- three
#     numbers that disagree with each other and with the array they describe.
#     Not reproduced: this Recipe's own list fixture asserts figures that are
#     internally consistent, because the one number the spec's own example
#     gives cannot be checked against anything else in that same example.
#   - No 4xx response is documented anywhere in chat-apis.json for any path.
#     Every failure this Recipe answers with a specific body was struck live;
#     nothing here quotes a 4xx from the spec, because the spec has none.

recipe: cometchat
capability: chat
version: 0.1.0

upstream:
  api: v3
  docs: https://www.cometchat.com/docs
  spec: https://www.cometchat.com/docs/chat-apis.json
  spec_hash: 678d9a4be75046cc6986403b151270d91cee3bb359444b337e6b4c9d93ac7b2e
  spec_seen: "2026-09-01"
  provider: CometChat

auth:
  # The spec's own securitySchemes.apiKey: {type: apiKey, in: header,
  # name: apikey}. Genuinely what every route in chat-apis.json requires --
  # the tenant-resolution layer that actually gated every live probe this
  # task could strike is not this check and cannot be expressed as a route
  # at all. See the header.
  scheme: header
  header: apikey

responses:
  resource:
    style: wrapped
    key: data
  list:
    style: wrapped
    count_field: meta.pagination.count
    page_field: meta.pagination.current_page
    pages_field: meta.pagination.total_pages
    limit_field: meta.pagination.per_page
  error:
    # {"error": {message, devMessage, source, code}} -- struck live on every
    # failure this Recipe reached. devMessage and source are not modelled as
    # separate fields (see fields below): both were identical in wording to
    # message or to each other across every live case this task struck, and
    # declaring two more fields to hold text this format already carries
    # once would be noise rather than a finding.
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: "-"

resources:
  group:
    collection: data
    id:
      # Caller-chosen at create time -- POST /groups' own request schema
      # requires guid as a string property, not a path parameter and not
      # server-minted. A different contract from TalkJS's PUT-with-a-path-id
      # and from Whereby's POST-that-mints-meetingId: here the caller names
      # the identifier inside the body of a POST.
      style: opaque
      field: guid
    fields:
      name:
        type: string
        required: true
      type:
        # public, password or private, per the spec's enum. A genuinely free
        # string here rather than a fixed set Cauldron's field types can
        # check.
        type: string
        default: public
      description:
        type: string
        null_when_unset: true
      icon:
        type: string
        null_when_unset: true
      # Whichever of admin/moderator/participant the caller's own apikey
      # request resolves to -- not settable by the create request itself.
      scope:
        type: string
        default: admin
      membersCount:
        type: integer
        default: 1
      joinedAt:
        type: timestamp
      # "group_" plus the guid, present from the group's first response --
      # see the header. Not derived by this Recipe from the guid field
      # dynamically; the fixture below states each value directly, because
      # the point being pinned is that the field exists at creation, not
      # that Cauldron computes the prefix.
      conversationId:
        type: string
      hasJoined:
        type: boolean
        default: true
      createdAt:
        type: timestamp
      owner:
        type: string
      tags:
        type: list
        default: []

routes:
  - method: POST
    path: /groups
    resource: group
    operation: create
    returns: [id, name, type, description, icon, scope, membersCount, joinedAt, conversationId, hasJoined, createdAt, owner, tags]

  - method: GET
    path: /groups/{id}
    resource: group
    operation: get

  - method: GET
    path: /groups
    resource: group
    operation: list

errors:
  # Struck live, byte-identical across three credential shapes and a
  # fabricated app id -- see the header. Never reachable from a route this
  # Recipe can declare, because Cauldron has no per-hostname routing; kept
  # here as the documented finding rather than served.
  #
  # Not named by auth.absent_error, auth.malformed_error or
  # auth.rejected_error: the check this failure actually belongs to is the
  # tenant lookup, which happens before any of the three verdicts this
  # format's auth block can name are ever reached. Naming it there would
  # claim it answers a credential verdict on the one host Cauldron can serve,
  # which it does not.
  invalid_app_id:
    status: 401
    message: "The appId faketestapp12345 does not exists in us region."
    code: AUTH_ERR_INVALID_APPID
    fields:
      error:
        devMessage: "Indicates an invalid appId, or does not exist in a region."
        source: chat-api

  # A path this API does not register, or a method a real path does not
  # accept -- struck live both ways, with the identical body. Routing is
  # checked before the tenant lookup above, confirmed because this answered
  # the same way under the same invalid app id that gets invalid_app_id on a
  # recognised path.
  unknown_route:
    status: 404
    message: "The API endpoint is invalid. Please verify the API call."
    code: ERR_API_NOT_FOUND
    fields:
      error:
        devMessage: "The endpoint of the API is invalid. Please have the API call checked."
        source: chat-api

  # A route this Recipe declares, for a method it does not. Answered as the
  # same routing sentence above, since chat-apis.json never distinguishes a
  # method miss from a path miss in what this task could observe.
  method_not_allowed:
    status: 404
    message: "The API endpoint is invalid. Please verify the API call."
    code: ERR_API_NOT_FOUND
    fields:
      error:
        devMessage: "The endpoint of the API is invalid. Please have the API call checked."
        source: chat-api

  # Never observed and never documented -- chat-apis.json gives no 4xx
  # example anywhere. This is Cauldron's own generic fallback for a request
  # this Recipe's one held apikey does not match, on the one host Cauldron
  # can serve; no specific wire shape is claimed for it.
  authentication_error:
    status: 401

fixtures:
  empty: {}

  workspace:
    group:
      # project-group is the spec's own worked example guid, from POST
      # /groups' response example -- see the header. conversationId is
      # exactly what that example answers: "group_" plus the guid, present
      # with no message ever sent. This group has never been messaged, which
      # is the case the header states chat-apis.json never shows a worked
      # example for.
      - id: project-group
        guid: project-group
        name: Project Group
        type: public
        description: project related discussions between members
        icon: http://placehold.it/120x120&text=image1
        scope: admin
        membersCount: 1
        joinedAt: 1767225600
        conversationId: group_project-group
        hasJoined: true
        createdAt: 1767225600
        owner: superhero4
        tags: [friends, project]

      - id: project-group-2
        guid: project-group-2
        name: Project Group 2
        type: public
        description: project related discussions between members
        icon: http://placehold.it/120x120&text=image1
        scope: admin
        membersCount: 1
        joinedAt: 1767225700
        conversationId: group_project-group-2
        hasJoined: true
        createdAt: 1767225700
        owner: superhero4
        tags: [friends, project]

conformance:
  - name: a fabricated app id fails identically across three credential shapes, and no credential was ever examined
    # Struck live against /v3/users, a path this Recipe does not route (see
    # the header: the members/users surface is out of scope). Armed against
    # a route this Recipe does declare, /groups, because Cauldron has no
    # per-hostname check of its own to reach this failure automatically --
    # see the header for why the finding is recorded rather than served by
    # routing.
    source: https://faketestapp12345.api-us.cometchat.io/v3/users
    verified: "2026-09-01"
    arm: invalid_app_id
    fixture: empty
    request:
      method: GET
      path: /groups
    expect:
      status: 401
      body:
        error.message: "The appId faketestapp12345 does not exists in us region."
        error.code: AUTH_ERR_INVALID_APPID
        error.source: chat-api

  - name: a present apikey header changes nothing about that same failure
    source: https://faketestapp12345.api-us.cometchat.io/v3/users
    verified: "2026-09-01"
    arm: invalid_app_id
    fixture: empty
    request:
      method: GET
      path: /users
      headers:
        apikey: junkkey12345
    expect:
      status: 401
      body:
        error.code: AUTH_ERR_INVALID_APPID

  - name: neither does a bearer-shaped Authorization header instead of the real scheme
    source: https://faketestapp12345.api-us.cometchat.io/v3/users
    verified: "2026-09-01"
    arm: invalid_app_id
    fixture: empty
    request:
      method: GET
      path: /users
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.code: AUTH_ERR_INVALID_APPID

  - name: an unregistered path answers a different envelope than the tenant failure, and is checked before it
    source: https://faketestapp12345.api-us.cometchat.io/v3/nosuchresource
    verified: "2026-09-01"
    arm: unknown_route
    fixture: empty
    request:
      method: GET
      path: /nosuchresource
    expect:
      status: 404
      body:
        error.code: ERR_API_NOT_FOUND
        error.message: "The API endpoint is invalid. Please verify the API call."

  - name: a method a real path does not accept answers the identical routing sentence, under the same invalid app id
    source: https://faketestapp12345.api-us.cometchat.io/v3/users
    verified: "2026-09-01"
    arm: method_not_allowed
    fixture: empty
    request:
      method: PATCH
      path: /users
    expect:
      status: 404
      body:
        error.code: ERR_API_NOT_FOUND

  - name: a fresh group answers the record the caller asked for, with no message anywhere in it
    # conversationId is deliberately not asserted here -- see the header's
    # fidelity gap: chat-apis.json derives it from the guid ("group_" plus
    # whatever the caller named), and Cauldron has no per-request string
    # derivation to reproduce that for an arbitrary guid without hard-coding
    # a value that would be wrong for every other one. The field is still
    # named in this route's own returns list, because it belongs to the
    # shape; the case that pins its actual value is the one below, against
    # the fixture-seeded group this Recipe already gave one.
    source: https://www.cometchat.com/docs/chat-apis.json
    fixture: empty
    request:
      method: POST
      path: /groups
      headers:
        apikey: cauldron-fixture-cometchat-key-0000000000000000
      json:
        guid: project-group
        name: Project Group
        type: public
    expect:
      status: 200
      body:
        data.guid: project-group
        data.name: Project Group
        data.type: public
        data.hasJoined: true
      absent:
        - data.lastMessage

  - name: getting that group back answers the identical conversation id, still with no message behind it
    source: https://www.cometchat.com/docs/chat-apis.json
    fixture: workspace
    request:
      method: GET
      path: /groups/project-group
      headers:
        apikey: cauldron-fixture-cometchat-key-0000000000000000
    expect:
      status: 200
      body:
        data.guid: project-group
        data.conversationId: group_project-group
        data.membersCount: 1

  - name: a list wraps its array under data, beside a pagination object with its own field names
    source: https://www.cometchat.com/docs/chat-apis.json
    fixture: workspace
    request:
      method: GET
      path: /groups
      headers:
        apikey: cauldron-fixture-cometchat-key-0000000000000000
    expect:
      status: 200
      body:
        "data[0].guid": project-group
        "data[1].guid": project-group-2
        meta.pagination.count: 2
        meta.pagination.current_page: 1
      absent:
        - groups
        - items
