# Astronomer Recipe for Cauldron
#
# The organisation listing from the Astro Platform API, read from the OpenAPI
# document Astronomer serves without a credential at
# api.astronomer.io/spec/platform/v1beta1, and struck live on 2026-09-13 with no
# header, with a wrong bearer, on a path that does not exist, and with a method
# the path does not take.
#
# **Every failure is declared as JSON and arrives as plain text.** The document
# gives `ListOrganizations` a 400, a 401, a 403 and a 500, each pointing at an
# `Error` schema that `required`s `message`, `requestId` and `statusCode`. Struck
# live:
#
#   (no header)     403 text/plain  RBAC: access denied
#   Bearer notreal  401 text/plain  Jwt is not in the form of Header.Payload.Signature with two dots and 3 sections
#
# Eleven bytes, and a sentence, with none of the three required fields and no
# JSON anywhere. A client built from the document parses both and throws.
#
# **The 401 is a lesson in JWT structure.** "two dots and 3 sections" -- the same
# kind of number spelled twice in one sentence, two ways -- said to a caller who
# sent a string that was never meant to be a JWT.
#
# **And a request carrying nothing is Forbidden.** `RBAC: access denied`, to a
# caller with no identity to deny, with the same answer for an unrouted path and
# a wrong method, because the check runs before the router.
#
# **The Error schema permits a status of 600.** `statusCode` is
# `{minimum: 400, maximum: 600}`, and there is no 600.
#
# **Two query parameters filter by product and their vocabularies do not
# overlap.** `product` is "Filters the Organization list by product" and
# `astronomerProduct` is "filter by astronomer product, should be one of ASTRO
# or OBSERVE" -- lower case, no full stop, beside a page of proper sentences.
# Neither is deprecated. And the `product` *field* on the record is
# `["HOSTED", "HYBRID"]`, so the word means one thing in the query and another
# in the response.
#
# **The support plan has twenty-one values.** `INACTIVE`, `INTERNAL`, `POV`,
# `TRIAL`, `BASIC`, `BASIC_PAYGO`, `TEAM_PAYGO`, `STANDARD`, `PREMIUM`,
# `BUSINESS_CRITICAL`, `BUSINESS`, `TEAM`, `ENTERPRISE`, `DEVELOPER`,
# `DEVELOPER_PAYGO`, `TEAM_V2`, `BUSINESS_V2`, `ENTERPRISE_V2`, `TRIAL_V2`,
# `ENTERPRISE_BUSINESS_CRITICAL`, `IBM_ENTERPRISE`. Five of them are `_V2`
# reissues sitting beside the originals, one names a partner, and two --
# `INACTIVE` and `INTERNAL` -- are not plans at all.
#
# **An internal abbreviation decides who can read your data.**
# `allowEnhancedSupportAccess` is "Whether the organization allows CRE to have
# view access to..." -- CRE, undefined anywhere in the document, in the field
# that grants it.
#
# **And every write is a POST to the thing itself.** `/organizations/{id}`,
# `/clusters/{id}` and `/deployments/{id}` each take `get`, `post` and sometimes
# `delete`, and no path in the document has a `put` or a `patch`, so updating is
# posting to the resource.
#
# Also pinned: the security scheme is named `JWT` and declared
# `{type: http, scheme: bearer}`; `productPlans` is a plural array on the record
# beside a singular `productPlan` query filter; and the envelope requires
# `limit`, `offset`, `organizations` and `totalCount`, so a page always says how
# large the whole set is.

recipe: astronomer
capability: infrastructure
version: 0.1.0

upstream:
  api: v1beta1
  docs: https://www.astronomer.io/docs/api/platform-api-reference
  spec: https://api.astronomer.io/spec/platform/v1beta1
  spec_hash: 1c7d0c73a9f511b6d6fff5c4f8c8161ae7b505599d23b019991cab617835ee45
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature
  # Forbidden, to a caller with no identity to deny.
  absent_error: rbac_access_denied
  rejected_error: jwt_malformed
  malformed_error: jwt_malformed
  # Checked before the path is.

responses:
  list:
    style: wrapped
    key: organizations
    count_field: totalCount
    limit_field: limit
    page_field: offset
  error:
    # Declared as JSON in the document, and not JSON on the wire.
    style: text

resources:
  organization:
    id:
      field: id
      style: opaque
      length: 22
    fields:
      name:
        type: string
      # HOSTED or HYBRID, where the query parameter of almost the same name
      # takes ASTRO or OBSERVE.
      product:
        type: string
      # Twenty-one values, five of them _V2 reissues.
      supportPlan:
        type: string
      # Plural, beside a singular query filter of the same name.
      productPlans:
        type: list
      status:
        type: string
      paymentMethod:
        type: string
      billingEmail:
      # "Whether the organization allows CRE to have view access to..."
      allowEnhancedSupportAccess:
        type: boolean
      isScimEnabled:
        type: boolean
      shouldEnforceDedicatedClusters:
        type: boolean
      managedDomains:
        type: list
      trialExpiresAt:
      createdAt:
        type: string
      updatedAt:
        type: string
      createdBy:
        type: map
      updatedBy:
        type: map

routes:
  - method: GET
    path: /platform/v1beta1/organizations
    resource: organization
    operation: list
    pagination:
      style: offset
      first_page: 0
      limit: 20
      limit_param: limit
      cursor_param: offset

errors:
  rbac_access_denied:
    # Forbidden, for having presented nothing at all.
    status: 403
    message: "RBAC: access denied"
    headers:
      Content-Type: text/plain

  jwt_malformed:
    status: 401
    # A number spelled two ways in one sentence, to a caller who sent no JWT.
    message: Jwt is not in the form of Header.Payload.Signature with two dots and 3 sections
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    organization: []

  tenancy:
    organization:
      - id: clm4c8b3n000008l3f5g2h9k1
        name: Cauldron Example
        product: HOSTED
        # One of the twenty-one.
        supportPlan: ENTERPRISE_V2
        productPlans:
          - ASTRO
        status: ACTIVE
        paymentMethod: AWS_MARKETPLACE
        billingEmail: billing@example.com
        # Granting view access to something the document never expands.
        allowEnhancedSupportAccess: true
        isScimEnabled: true
        shouldEnforceDedicatedClusters: false
        managedDomains:
          - example.com
        trialExpiresAt: null
        createdAt: "2026-01-09T12:00:00Z"
        updatedAt: "2026-08-21T16:32:04Z"
        createdBy:
          id: clm4c8b3n000108l3abcdefgh
          subjectType: USER
        updatedBy:
          id: clm4c8b3n000108l3abcdefgh
          subjectType: USER
      - id: clm9z1x2y000009l4a1b2c3d4
        name: Cauldron Trial
        product: HYBRID
        # And another, which is also not a plan.
        supportPlan: TRIAL_V2
        productPlans: []
        status: SUSPENDED
        paymentMethod: CREDIT_CARD
        billingEmail: null
        allowEnhancedSupportAccess: false
        isScimEnabled: false
        shouldEnforceDedicatedClusters: true
        managedDomains: []
        trialExpiresAt: "2026-10-01T00:00:00Z"
        createdAt: "2026-07-14T09:15:00Z"
        updatedAt: "2026-07-14T09:15:00Z"
        createdBy:
          id: clm9z1x2y000109l4zyxwvuts
          subjectType: SERVICE_KEY
        updatedBy:
          id: clm9z1x2y000109l4zyxwvuts
          subjectType: SERVICE_KEY

conformance:
  - name: a failure declared as JSON arrives as plain text
    source: https://api.astronomer.io/platform/v1beta1/organizations
    verified: "2026-09-13"
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers: {}
    expect:
      # Forbidden, to a caller with no identity to deny.
      status: 403
      headers:
        # The document points every failure at an Error schema requiring
        # message, requestId and statusCode. None of them are here.
        Content-Type: text/plain
      body_matches: '\ARBAC: access denied\s*\z'

  - name: the other one is a lesson in JWT structure
    source: https://api.astronomer.io/platform/v1beta1/organizations
    verified: "2026-09-13"
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      headers:
        Content-Type: text/plain
      # "two dots and 3 sections": the same kind of number, twice, two ways.
      body_matches: '\AJwt is not in the form of Header\.Payload\.Signature with two dots and 3 sections\s*\z'

  - name: an unrouted path is answered by the same three words
    source: https://api.astronomer.io/platform/v1beta1/cauldron-nope
    verified: "2026-09-13"
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/cauldron-nope
      headers: {}
    expect:
      status: 403
      body_matches: '\ARBAC: access denied\s*\z'

  - name: and so is a method the route does not take
    source: https://api.astronomer.io/platform/v1beta1/organizations
    verified: "2026-09-13"
    fixture: tenancy
    request:
      method: PUT
      path: /platform/v1beta1/organizations
      headers: {}
    expect:
      status: 403
      body_matches: '\ARBAC: access denied\s*\z'

  - name: the word product means one thing in the query and another here
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
    expect:
      status: 200
      body:
        # HOSTED or HYBRID on the record; ASTRO or OBSERVE in the
        # astronomerProduct filter beside the product filter.
        'organizations[0].product': HOSTED
        'organizations[1].product': HYBRID
        # And the plural array, beside the singular query filter.
        'organizations[0].productPlans[0]': ASTRO
        'organizations[1].productPlans': []

  - name: the support plan is one of twenty-one
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
    expect:
      status: 200
      body:
        # Five of the values are _V2 reissues beside the originals.
        'organizations[0].supportPlan': ENTERPRISE_V2
        'organizations[1].supportPlan': TRIAL_V2
        'organizations[0].status': ACTIVE
        'organizations[1].status': SUSPENDED
        'organizations[0].paymentMethod': AWS_MARKETPLACE
        'organizations[1].paymentMethod': CREDIT_CARD

  - name: an undefined abbreviation decides who can read your data
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
    expect:
      status: 200
      body:
        # "Whether the organization allows CRE to have view access to..."
        'organizations[0].allowEnhancedSupportAccess': true
        'organizations[1].allowEnhancedSupportAccess': false
        'organizations[0].isScimEnabled': true
        'organizations[1].shouldEnforceDedicatedClusters': true
        'organizations[0].managedDomains[0]': example.com
        'organizations[1].managedDomains': []

  - name: the record names who made it and what kind of thing that was
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
    expect:
      status: 200
      body:
        'organizations[0].createdBy.id': clm4c8b3n000108l3abcdefgh
        'organizations[0].createdBy.subjectType': USER
        'organizations[1].createdBy.subjectType': SERVICE_KEY
        'organizations[0].updatedBy.subjectType': USER
        'organizations[0].name': Cauldron Example
        'organizations[0].createdAt': "2026-01-09T12:00:00Z"
        'organizations[0].updatedAt': "2026-08-21T16:32:04Z"
        'organizations[0].billingEmail': billing@example.com
        'organizations[1].billingEmail': null
        'organizations[0].trialExpiresAt': null
        'organizations[1].trialExpiresAt': "2026-10-01T00:00:00Z"

  - name: a page always says how large the whole set is
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: tenancy
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
      query:
        limit: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # limit, offset, organizations and totalCount are all required.
        limit: 1
        offset: 1
        totalCount: 2
        'organizations[0].id': clm9z1x2y000009l4a1b2c3d4

  - name: an account with no organisations still counts them
    source: https://api.astronomer.io/spec/platform/v1beta1
    fixture: empty
    request:
      method: GET
      path: /platform/v1beta1/organizations
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjYXVsZHIwbiJ9.cauldr0nf1xtures1gnature"
    expect:
      status: 200
      body:
        organizations: []
        totalCount: 0
        offset: 0
