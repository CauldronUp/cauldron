# Mailchimp Recipe for Cauldron
#
# Mailchimp has no sandbox. An account is an account, an audience is a real
# audience, and a test that adds a subscriber can trigger a real welcome
# automation to a real address. The free tier also counts test contacts against
# the plan limit, so a CI suite that adds a member per run eventually starts
# failing for billing reasons rather than code reasons.
#
# Two things worth modelling exactly:
#
#   1. Failures follow RFC 7807: type, title, status and detail, with no code
#      field anywhere. Code written for a provider-specific error shape has
#      nothing to read, and the human-readable part is "detail", not "message".
#   2. A member is addressed by the MD5 of their lower-cased email, not by an
#      opaque id. Integrations that store the id Mailchimp returned work fine
#      until someone changes their email address.
#
# Authentication here is the OAuth bearer form, and Mailchimp also accepts HTTP
# Basic with the API key as the password -- any string as the username, which
# is why the password is the half that gets compared. Both are served: one
# secret, two carriers, which is what auth.also describes. This used to say
# "which Cauldron does not model", and it was true until that field existed.
#
# Tokens below are fixtures, not secrets.

recipe: mailchimp
capability: marketing
version: 0.1.0

upstream:
  api: "3.0"
  docs: https://mailchimp.com/developer/marketing/api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-oauth-token
  # The same key as a Basic password. Mailchimp ignores the username -- its
  # own documentation says any string will do -- so the password is the half
  # to compare, and "-" clears the bearer prefix that means nothing to a
  # Basic credential.
  also:
    - scheme: basic
      credential: password
      prefix: "-"

responses:
  list:
    style: wrapped
    count_field: total_items
  # RFC 7807. No code, and the prose lives in "detail".
  error:
    style: flat
    type_field: type
    code_field: title
    message_field: detail
    status_field: status
    fields:
      instance: cauldron00000000-0000-4000-8000-000000000000

resources:
  member:
    collection: members
    id:
      # The MD5 of the lower-cased email address. Stored as an opaque hex
      # string here, because what matters is that it is derived from the
      # email rather than minted independently.
      style: hex
      length: 32
    fields:
      list_id:
        type: string
      email_address:
        type: string
        required: true
      # Mailchimp's own vocabulary. "pending" means double opt-in has been
      # sent but not confirmed, and a member in that state receives nothing.
      status:
        type: string
        default: subscribed
      email_type:
        type: string
        default: html
      unique_email_id:
        type: string
      web_id:
        type: integer
      timestamp_signup:
        type: datetime
      last_changed:
        type: datetime

  audience:
    collection: lists
    id:
      style: hex
      length: 10
    fields:
      name:
        type: string
        required: true
      permission_reminder:
        type: string
      double_optin:
        type: boolean
        default: false
      member_count:
        type: integer
        default: 0
      date_created:
        type: datetime

  campaign:
    collection: campaigns
    id:
      style: hex
      length: 10
    fields:
      type:
        type: string
        default: regular
      status:
        type: string
        default: save
      emails_sent:
        type: integer
        default: 0
      subject_line:
        type: string
      create_time:
        type: datetime

routes:
  - method: GET
    path: /3.0/lists
    resource: audience
    operation: list
    pagination:
      # Mailchimp calls the size count, not limit. A client sending limit gets
      # the default ten however many it asked for.
      style: offset
      limit_param: count
      cursor_param: offset
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 10

  - method: POST
    path: /3.0/lists
    resource: audience
    operation: create

  - method: GET
    path: /3.0/lists/{id}
    resource: audience
    operation: get

  - method: GET
    path: /3.0/lists/{list_id}/members
    resource: member
    operation: list
    scope: [list_id]
    pagination:
      # Mailchimp calls the size count, not limit. A client sending limit gets
      # the default ten however many it asked for.
      style: offset
      limit_param: count
      cursor_param: offset
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 10

  - method: POST
    path: /3.0/lists/{list_id}/members
    resource: member
    operation: create
    scope: [list_id]

  - method: GET
    path: /3.0/lists/{list_id}/members/{id}
    resource: member
    operation: get
    scope: [list_id]

  - method: PATCH
    path: /3.0/lists/{list_id}/members/{id}
    resource: member
    operation: update
    scope: [list_id]

  - method: DELETE
    path: /3.0/lists/{list_id}/members/{id}
    resource: member
    operation: delete
    scope: [list_id]

  - method: GET
    path: /3.0/campaigns
    resource: campaign
    operation: list
    pagination:
      # Mailchimp calls the size count, not limit. A client sending limit gets
      # the default ten however many it asked for.
      style: offset
      limit_param: count
      cursor_param: offset
      # No style is declared: this route paged by neither offset nor page
      # number until somebody checks what this provider actually calls its
      # parameters. The word that was here was never read by anything, so it
      # was never verified, and a claim nobody checked is worse than silence.
      limit: 10

webhooks:
  events:
    - subscribe
    - unsubscribe
    - profile
    - cleaned
    - upemail
    - campaign
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: Too Many Requests
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: You have exceeded the limit of 10 simultaneous connections.
    headers:
      Retry-After: "1"

  authentication_error:
    status: 401
    code: API Key Invalid
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: Your API key may be invalid, or you have attempted to access the wrong datacenter.

  resource_missing:
    status: 404
    code: Resource Not Found
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: "The requested resource could not be found: {detail}"

  parameter_missing:
    status: 400
    code: Invalid Resource
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: "The resource submitted could not be validated: {detail} is required"

  # The one every list import meets, and the one whose wording matters because
  # support teams paste it verbatim.
  member_exists:
    status: 400
    code: Member Exists
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: The contact is already a list member.

  # Mailchimp permanently refuses a previously unsubscribed address, which
  # surprises anyone re-importing an old list.
  forgotten_email:
    status: 400
    code: Forgotten Email Not Subscribed
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: The contact must re-subscribe to be added to this audience.

  # A compliance state that cannot be undone through the API at all.
  compliance_related:
    status: 400
    code: Member In Compliance State
    type: https://mailchimp.com/developer/marketing/docs/errors/
    message: The contact is in a compliance state due to unsubscribe, bounce, or compliance review.

fixtures:
  empty: {}

  small-account:
    audience:
      - id: a1b2c3d4e5
        name: Product announcements
        permission_reminder: You signed up on our website.
        double_optin: true
        member_count: 2
    member:
      - id: "0000000000000000000000000000ada1"
        list_id: a1b2c3d4e5
        email_address: ada@example.com
        status: subscribed
        email_type: html
      - id: "0000000000000000000000000000bcc2"
        list_id: a1b2c3d4e5
        email_address: grace@example.com
        # Double opt-in sent but not confirmed. A member in this state
        # receives nothing, and code that counts them as reachable overstates
        # every audience metric it computes.
        status: pending
    campaign:
      - id: c1a2b3c4d5
        type: regular
        status: sent
        emails_sent: 2
        subject_line: What shipped in January

# Conformance cases, read from Mailchimp's Marketing API reference rather than
# observed against a live account. The verify report says so.
conformance:
  - name: failures follow RFC 7807, with detail rather than message
    source: https://mailchimp.com/developer/marketing/docs/errors/
    fixture: small-account
    request:
      method: GET
      path: /3.0/lists/a1b2c3d4e5/members/ffffffffffffffffffffffffffffffff
      headers:
        Authorization: Bearer cauldron-oauth-token
    expect:
      status: 404
      body:
        title: Resource Not Found
        status: 404
        type: https://mailchimp.com/developer/marketing/docs/errors/
      matches:
        detail: 'could not be found'
      # No code field anywhere, and the prose is not in "message".
      absent:
        - code
        - message
        - error
        - errors

  - name: a collection is wrapped with a total separate from the page
    source: https://mailchimp.com/developer/marketing/api/list-members/list-members-info/
    fixture: small-account
    request:
      method: GET
      path: /3.0/lists/a1b2c3d4e5/members
      query:
        # count, not limit. Mailchimp ignores limit, and so this case was
        # asking for one member, receiving both, and passing.
        count: "1"
      headers:
        Authorization: Bearer cauldron-oauth-token
    expect:
      status: 200
      body:
        total_items: 2
        members[0].email_address: ada@example.com
        members[0].status: subscribed
      absent:
        - members[1]
        - data

  - name: a pending member is not a subscribed one
    source: https://mailchimp.com/developer/marketing/docs/marketing-api-basics/
    fixture: small-account
    request:
      method: GET
      path: /3.0/lists/a1b2c3d4e5/members/0000000000000000000000000000bcc2
      headers:
        Authorization: Bearer cauldron-oauth-token
    expect:
      status: 200
      body:
        # Double opt-in sent, never confirmed. This member receives nothing,
        # and counting them as reachable overstates every audience metric.
        status: pending
        email_address: grace@example.com

  - name: a member is addressed by a hex hash, not an opaque id
    source: https://mailchimp.com/developer/marketing/api/list-members/
    fixture: empty
    request:
      method: POST
      path: /3.0/lists/a1b2c3d4e5/members
      headers:
        Authorization: Bearer cauldron-oauth-token
      json:
        email_address: alan@example.com
    expect:
      status: 200
      body:
        email_address: alan@example.com
        status: subscribed
        email_type: html
        list_id: a1b2c3d4e5
      matches:
        id: '^[0-9a-f]{32}$'

  - name: another audience's members are not visible
    source: https://mailchimp.com/developer/marketing/api/list-members/list-members-info/
    fixture: small-account
    request:
      method: GET
      path: /3.0/lists/ffffffffff/members
      headers:
        Authorization: Bearer cauldron-oauth-token
    expect:
      status: 200
      body:
        total_items: 0
      absent:
        - members[0]

  - name: a bad token names the datacenter as a possible cause
    source: https://mailchimp.com/developer/marketing/guides/quick-start/
    request:
      method: GET
      path: /3.0/lists
    expect:
      status: 401
      body:
        title: API Key Invalid
        status: 401
      matches:
        # The wrong-datacenter mistake is common enough that Mailchimp names
        # it in the message, and support teams look for exactly this wording.
        detail: 'wrong datacenter'

  - name: audiences and campaigns use the same envelope as members
    source: https://mailchimp.com/developer/marketing/api/lists/
    fixture: small-account
    request:
      method: GET
      path: /3.0/lists
      headers:
        Authorization: Bearer cauldron-oauth-token
    expect:
      status: 200
      body:
        total_items: 1
        lists[0].name: Product announcements
        lists[0].double_optin: true

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the campaign listing answers with what the fixture holds"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/campaigns"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "campaigns[0].id": "c1a2b3c4d5"
      absent:
        - "campaigns[1]"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if count was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "count is read, because a page of one out of two is not the whole collection"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists/a1b2c3d4e5/members"
      query:
        "count": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "members[0].id": "0000000000000000000000000000ada1"
      absent:
        - "members[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists/a1b2c3d4e5/members"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "members[0].id": "0000000000000000000000000000bcc2"
      absent:
        - "members[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not count was read -- but offset can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "offset moves past the only record, and the page comes back empty"
    source: "https://mailchimp.com/developer/marketing/api/lists/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      absent:
        - "lists[0]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether count was read or not -- but offset can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/campaigns"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      absent:
        - "campaigns[0]"

  # The names. This Recipe declares 3 field(s) on a audience that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an audience carries the field names this Recipe declares"
    source: "https://mailchimp.com/developer/marketing/api/lists/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "lists[0].date_created": "2026-01-01T00:00:00Z"
        "lists[0].member_count": 2
        "lists[0].permission_reminder": "You signed up on our website."

  # The names. This Recipe declares 3 field(s) on a campaign that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a campaign carries the field names this Recipe declares"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/campaigns"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "campaigns[0].create_time": "2026-01-01T00:00:00Z"
        "campaigns[0].emails_sent": 2
        "campaigns[0].subject_line": "What shipped in January"

  # The names. This Recipe declares 4 field(s) on a member that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a member carries the field names this Recipe declares"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists/a1b2c3d4e5/members"
      query:
        "count": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "members[0].last_changed": "2026-01-01T00:00:00Z"
        "members[0].timestamp_signup": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 2 field(s) on a campaign that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a campaign carries the field names this Recipe declares, and 2 more of them"
    source: "https://mailchimp.com/developer/marketing/api/list-members/list-members-info/"
    fixture: small-account
    request:
      method: GET
      path: "/3.0/campaigns"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 200
      body:
        "campaigns[0].status": "sent"
        "campaigns[0].type": "regular"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://mailchimp.com/developer/marketing/api"
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: "/3.0/lists/a1b2c3d4e5/members"
      query:
        "count": "1"
      headers:
        "Authorization": "Bearer cauldron-oauth-token"
    expect:
      status: 429
      body:
        "detail": "You have exceeded the limit of 10 simultaneous connections."
        "instance": "cauldron00000000-0000-4000-8000-000000000000"
        "status": 429
        "title": "Too Many Requests"
        "type": "https://mailchimp.com/developer/marketing/docs/errors/"







