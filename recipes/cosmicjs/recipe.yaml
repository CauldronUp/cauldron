# Cosmic Recipe for Cauldron
#
# The Objects listing, read from the OpenAPI document Cosmic serves without a
# credential at api.cosmicjs.com/v3/openapi.json, and struck live on 2026-09-13
# on a bucket that does not exist and on the collection root.
#
# **"Route not found" arrives with a 200.** Struck live:
#
#   GET /v3/buckets   200 {"message":"Route not found",
#                          "documentation":"https://api.cosmicjs.com/v3/openapi.json",
#                          "hints":["/v3/agents/* and /v3/users/* are served by
#                                    https://dapi.cosmicjs.com", ...]}
#
# The body is the document's own `Error` schema -- which that schema describes,
# in its own words, as "the error shape returned by every **non-2xx**
# response". Here it is, on a 2xx. A client that branches on `response.ok`
# treats this as a success and then reads `body.objects`, which is not there.
#
# **It is a helpful failure, which is the other half of the problem.** The body
# carries a link to the API's own description and two hints naming *other hosts*
# -- `dapi.cosmicjs.com` for agents and users, `workers.cosmicjs.com` for media
# uploads. So one API is three hosts, and the only place that is written down is
# a body a client will never look at, because the status said everything worked.
#
# **A bucket that does not exist is a 404 with the slug in it.** Struck live,
# {"status":404,"message":"bucket with slug: 'cauldron-nope' not found"} -- the
# caller own input, quoted back inside the sentence, with no credential
# required to ask. That path is not in the description; see the README.
#
# **The credential is optional depending on a setting you cannot see.** From the
# security scheme's own description:
#
#   The Bucket read key, passed as a query parameter. ... Buckets with no read
#   key configured accept reads without one.
#
# So a declared `security` may or may not apply, decided by a dashboard setting
# on the resource rather than by anything in the request -- and the key travels
# in the query string, so where it does apply it is in every URL.
#
# **A timestamp has three types.** `publish_at` is `["string", "number",
# "null"]`, described as a UNIX millisecond timestamp, and sits beside
# `published_at`, which is a date-time string. Two publication timestamps, two
# encodings, and one of them can arrive as either.
#
# **`thumbnail` is one thing on write and another on read.** Its description:
# "Media `name` of the Object thumbnail. Returned as a URL on read." The field a
# client writes and the field it reads back are different kinds of value under
# one name.
#
# **`content` is deprecated in v3 and still on the record**, marked
# `deprecated: true`, with its description pointing at the replacement.
#
# **And nothing on an Object is required.** Twenty properties, no `required`
# array -- not `id`, not `slug`, not `type`.

recipe: cosmicjs
capability: cms
version: 0.1.0

upstream:
  api: "3.0.0"
  docs: https://www.cosmicjs.com/docs
  spec: https://api.cosmicjs.com/v3/openapi.json
  spec_hash: 25fc671b7794b40042b1706eeb5aa0b81f39a07fd4f2ef933ff8a42e71e4b279
  spec_seen: "2026-09-13"

auth:
  # In the query string, and optional on buckets that have no read key set.
  scheme: query
  param: read_key
  keys:
    - cauldr0nc0sm1cf1xturereadkey
  absent_error: unauthorized
  rejected_error: unauthorized
  after_routing: true

responses:
  list:
    style: wrapped
    key: objects
    count_field: total
    limit_field: limit
  error:
    style: flat
    message_field: message
    # The HTTP status, repeated in the body, by the schema's own description.
    status_field: status
    code_field: "-"

resources:
  object:
    id:
      field: id
      style: hex
      length: 24
    fields:
      type:
        type: string
      title:
        type: string
      slug:
        type: string
      status:
        type: string
      bucket:
        type: string
      metadata:
        type: map
      created_at:
        type: datetime
      created_by:
        type: string
      modified_at:
        type: datetime
      modified_by:
        type: string
      # Deprecated in v3 and still on the record.
      content:
      # A date-time string...
      published_at:
      # ...beside a UNIX millisecond timestamp that may be a string, a number
      # or null.
      publish_at:
      unpublish_at:
      # A media name on write and a URL on read, under one name.
      thumbnail:
      locale:
      assigned_to:
      assigned_by:
      assigned_at:

  # The body the collection root answers -- with a 200.
  index:
    id:
      field: "-"
      style: opaque
      carried_by: documentation
    constants:
      message: Route not found
      documentation: https://api.cosmicjs.com/v3/openapi.json
    fields:
      documentation:
        type: string
      # Two other hosts, named in a body a 200 tells a client not to read.
      hints:
        type: list

routes:
  - method: GET
    path: /v3/buckets/{bucket}/objects
    resource: object
    operation: list
    pagination:
      style: offset
      limit: 10
      limit_param: limit
      cursor_param: skip

  - method: GET
    # The collection root, which answers 200 and the error envelope.
    path: /v3/buckets
    resource: index
    operation: get
    id_from: auth
    public: true

errors:
  unauthorized:
    status: 401
    message: The read key provided is not valid for this bucket.

  unknown_route:
    status: 404
    message: Route not found

fixtures:
  empty:
    object: []
    index:
      - documentation: https://api.cosmicjs.com/v3/openapi.json
        hints:
          - "/v3/agents/* and /v3/users/* are served by https://dapi.cosmicjs.com"
          - "POST /v3/buckets/{slug}/media is served by https://workers.cosmicjs.com"

  bucket:
    index:
      - documentation: https://api.cosmicjs.com/v3/openapi.json
        hints:
          - "/v3/agents/* and /v3/users/* are served by https://dapi.cosmicjs.com"
          - "POST /v3/buckets/{slug}/media is served by https://workers.cosmicjs.com"
    object:
      - id: 65f1a2b3c4d5e6f708192a3b
        type: posts
        title: Hello world
        slug: hello-world
        status: published
        bucket: 65f1a2b3c4d5e6f708192a00
        metadata:
          author: A Person
        created_at: "2026-01-15T09:30:00.000Z"
        created_by: 65f1a2b3c4d5e6f708192a01
        modified_at: "2026-06-02T14:12:05.000Z"
        modified_by: 65f1a2b3c4d5e6f708192a01
        # Deprecated, and here.
        content: "<p>Hello world.</p>"
        published_at: "2026-01-15T09:32:10.000Z"
        # The same idea as published_at, in milliseconds, as a number.
        publish_at: 1768469530000
        unpublish_at: null
        # A URL, because this is a read.
        thumbnail: https://imgix.cosmicjs.com/65f1a2b3c4d5e6f708192a3b-hero.png
        locale: null
        assigned_to: null
        assigned_by: null
        assigned_at: null
      - id: 65f1a2b3c4d5e6f708192a3c
        type: posts
        title: Second post
        slug: second-post
        status: draft
        bucket: 65f1a2b3c4d5e6f708192a00
        metadata: {}
        created_at: "2026-04-02T11:05:00.000Z"
        created_by: 65f1a2b3c4d5e6f708192a01
        modified_at: "2026-04-02T11:20:00.000Z"
        modified_by: 65f1a2b3c4d5e6f708192a01
        content: null
        published_at: null
        # A string this time, for the same field.
        publish_at: "1796083200000"
        unpublish_at: null
        thumbnail: null
        locale: en
        assigned_to: 65f1a2b3c4d5e6f708192a02
        assigned_by: 65f1a2b3c4d5e6f708192a01
        assigned_at: "2026-04-02T11:22:00.000Z"

conformance:
  - name: route not found arrives with a 200
    source: https://api.cosmicjs.com/v3/buckets
    verified: "2026-09-13"
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets
      headers: {}
    expect:
      # The document's Error schema describes itself as the shape of every
      # non-2xx response. This is a 2xx.
      status: 200
      body:
        message: Route not found
        documentation: https://api.cosmicjs.com/v3/openapi.json

  - name: the body names two other hosts a client will never read
    source: https://api.cosmicjs.com/v3/buckets
    verified: "2026-09-13"
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets
      headers: {}
    expect:
      status: 200
      body:
        # One API, three hosts, written down only where the status line says
        # there is nothing to look at.
        'hints[0]': "/v3/agents/* and /v3/users/* are served by https://dapi.cosmicjs.com"
        'hints[1]': "POST /v3/buckets/{slug}/media is served by https://workers.cosmicjs.com"

  - name: an unrouted path repeats the status in the body
    source: https://api.cosmicjs.com/v3/buckets
    verified: "2026-09-13"
    fixture: bucket
    request:
      method: GET
      path: /v3/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # The same two keys the 200 above carries, and the status repeated
        # inside the body by the schema's own description.
        status: 404
        message: Route not found

  - name: a bucket with a read key set refuses a caller without one
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
    expect:
      # Declared by the document. Whether it happens depends on a dashboard
      # setting the caller cannot see.
      status: 401
      body:
        status: 401
        message: The read key provided is not valid for this bucket.

  - name: an object carries two publication timestamps in two encodings
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
    expect:
      status: 200
      body:
        # A date-time string, and a UNIX millisecond timestamp that the schema
        # permits as a number or as a string -- here one of each.
        'objects[0].published_at': "2026-01-15T09:32:10.000Z"
        'objects[0].publish_at': 1768469530000
        'objects[1].publish_at': "1796083200000"
        'objects[1].published_at': null

  - name: the deprecated field is still on the record
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
    expect:
      status: 200
      body:
        # Marked deprecated in v3, with its description naming the
        # replacement, and returned anyway.
        'objects[0].content': "<p>Hello world.</p>"
        'objects[1].content': null
        'objects[0].metadata.author': A Person

  - name: thumbnail comes back as a URL
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
    expect:
      status: 200
      body:
        # "Media name of the Object thumbnail. Returned as a URL on read."
        'objects[0].thumbnail': https://imgix.cosmicjs.com/65f1a2b3c4d5e6f708192a3b-hero.png
        'objects[1].thumbnail': null
        'objects[0].id': 65f1a2b3c4d5e6f708192a3b
        'objects[0].slug': hello-world
        'objects[0].type': posts
        'objects[0].status': published
        'objects[1].status': draft

  - name: four fields name a person by id
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
    expect:
      status: 200
      body:
        'objects[0].created_by': 65f1a2b3c4d5e6f708192a01
        'objects[0].modified_by': 65f1a2b3c4d5e6f708192a01
        'objects[1].assigned_to': 65f1a2b3c4d5e6f708192a02
        'objects[1].assigned_by': 65f1a2b3c4d5e6f708192a01
        'objects[1].assigned_at': "2026-04-02T11:22:00.000Z"
        'objects[1].locale': en
        'objects[0].locale': null
        'objects[0].bucket': 65f1a2b3c4d5e6f708192a00
        'objects[0].created_at': "2026-01-15T09:30:00.000Z"
        'objects[0].modified_at': "2026-06-02T14:12:05.000Z"
        'objects[0].unpublish_at': null

  - name: the envelope counts everything the query matched
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
        limit: "1"
    expect:
      status: 200
      body:
        # "Total number of Objects matching the query, ignoring limit and
        # skip", beside an echo of the limit that was applied.
        total: 2
        limit: 1
        'objects[0].id': 65f1a2b3c4d5e6f708192a3b
        'objects[0].title': Hello world

  - name: skipping past the first object gives the second
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: bucket
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
        limit: "1"
        skip: "1"
    expect:
      status: 200
      body:
        'objects[0].id': 65f1a2b3c4d5e6f708192a3c
        'objects[0].title': Second post
        total: 2

  - name: a bucket with no objects still carries the total
    source: https://api.cosmicjs.com/v3/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v3/buckets/cauldron/objects
      query:
        read_key: cauldr0nc0sm1cf1xturereadkey
    expect:
      status: 200
      body:
        objects: []
        total: 0
