# Canvas LMS Recipe for Cauldron
#
# Canvas is Rails, and the header this Recipe was actually sent to find --
# what a caller sees when it may read a course but not its roster -- has two
# different answers depending on which of Canvas's own routes you ask.
#
# **The bluntest finding did not come from a course at all.** Canvas runs
# canvas.instructure.com as a genuinely free hosted tier, and this Recipe
# checked what it answers unauthenticated per the brief for this group.
# Every path on that host -- /, /login/canvas, /api/v1/courses, a path that
# has never existed -- answers the identical 503, with or without a bearer
# token attached:
#
#   HTTP/1.1 503 Service Unavailable
#   Retry-After: 300
#   <title>Free-for-Teacher Platform Restoration</title>
#   Free-for-Teacher Update
#   The Free for Teacher program is now discontinued. Stay tuned for updates
#   on an enhanced Canvas product for former Free for Teacher users launching
#   this fall.
#
# Checked live on 2026-09-03, host-wide, credential or not: this is a static
# CloudFront apology page, not Canvas the application. The free hosted tier
# this brief expected to probe is gone as of this week, not merely rate
# limiting or under maintenance -- "now discontinued," in Instructure's own
# words. Every other case below was struck against a live, currently-hosted
# institutional Canvas instance instead (canvas.harvard.edu, a real
# production deployment of the same open-source application every other
# Canvas host runs), which is the substitution this brief's Moodle
# instructions ask for explicitly and which this Recipe applies here too
# because the vendor's own reference host stopped answering mid-week. Two
# more institutional hosts (gwu.instructure.com, canvas.uw.edu) were checked
# alongside it to confirm the auth and routing shapes below are the
# software's behaviour and not one school's configuration -- they agree,
# except where stated.
#
# **Absent, malformed and rejected are not three sentences here -- they are
# two.** Checked live against canvas.harvard.edu, on 2026-09-03:
#
#   no Authorization header at all         -> 401
#     {"status":"unauthenticated","errors":[{"message":"user authorization
#      required"}]}
#   Authorization: junktoken12345 (no scheme)     -> byte-identical
#   Authorization: Bearer  (nothing after the prefix)   -> byte-identical
#   Authorization: Basic dXNlcjpwYXNz              -> byte-identical
#   Authorization: Bearer junktoken12345    -> 401, a DIFFERENT body:
#     {"errors":[{"message":"Invalid access token."}]}
#
# Every shape of "you sent nothing I can use" -- nothing at all, no scheme, an
# empty Bearer value, a scheme this endpoint does not accept -- collapses to
# the identical generic sentence, which happens to already be the format's
# fallback wording. Only a syntactically real Bearer token that is simply
# wrong earns the second sentence, so this Recipe leaves absent_error and
# malformed_error unset and names rejected_error alone -- the same shape
# FireHydrant's Recipe in this collection is built around, arrived at
# independently. Every one of the five requests above also carried
# `WWW-Authenticate: Bearer realm="canvas-lms"`, on both bodies alike.
#
# One byte-level detail this Recipe could not carry through: the generic,
# absent/malformed body shown above also carries a top-level "status":
# "unauthenticated" sibling to the errors array, live-checked, and the
# rejected-token body does not have that key at all -- the sample at the top
# of this header is exact. This format's list-style error envelope applies a
# named error's own extra fields *inside* each array entry rather than
# beside the array, so a field that belongs at the envelope's top level for
# one specific failure and no other cannot be added without also adding it
# to every other error this Recipe declares, which would be a claim about
# invalid_access_token and resource_missing that live testing does not
# support. Stated rather than served: the message-level distinction, which
# is the finding, is modelled exactly; this smaller sibling-key difference
# is not.
#
# **A single-course GET is an existence oracle, and no credential is needed
# to run it.** Swept live against canvas.harvard.edu with no Authorization
# header at all, on 2026-09-03:
#
#   GET /api/v1/courses/1            -> 401  (the generic sentence above)
#   GET /api/v1/courses/2            -> 401  (same)
#   GET /api/v1/courses/3            -> 404  {"errors":[{"message":
#                                        "The specified resource does not
#                                        exist."}]}
#   GET /api/v1/courses/10           -> 404  (same)
#   GET /api/v1/courses/100          -> 404  (same)
#   GET /api/v1/courses/99999999     -> 404  (same)
#   GET /api/v1/courses/999999999999 -> 404  (same)
#
# An id this instance has allocated answers "you are not authenticated"; an
# id it has never allocated answers "this does not exist" -- with NO
# credential sent either way, and the two answers are distinguishable without
# ever proving who is asking. That is backwards from every other route this
# Recipe checked: GET /api/v1/courses (the list), GET /api/v1/users/{id} and
# GET /api/v1/courses/{id}/enrollments all answer the identical 401 whether
# the id could exist or not, live-checked at ids 1 and 999999999999 for the
# last two. Only the single-course GET leaks existence ahead of identity, and
# it does so for every id this Recipe tried, not just the extremes.
#
# The two 404 bodies are one and the same on purpose, not a coincidence this
# Recipe is reading too much into: Canvas's own published Courses API
# reference documents workflow_state and says, in these words, "When
# fetching a singular course that has a 'deleted' workflow state value, an
# error will be returned with a message of 'The specified resource does not
# exist.'" -- the identical sentence a genuinely-unallocated id gets. A
# caller cannot tell "this course id was never used" from "this course was
# deleted" either, by design, confirmed by the vendor's own words rather than
# inferred from the coincidence of two live 404s matching.
#
# This ordering is not Cauldron's `auth.after_routing`, because that flag
# governs whether a *path or method* matches before the credential is
# checked -- it has nothing to say about whether a specific *id*, once the
# path shape matches, turns out to be one this Recipe's fixtures hold.
# Cauldron's own credential check runs unconditionally before a route's
# fixture lookup, for every route, the same constraint Rootly's Recipe in
# this collection names for its own malformed-id case. What is servable here
# is the "id exists" half, through the ordinary fixture-backed route below --
# and the "id never allocated" half, pinned as its own literal, credential-
# exempt route for one specific id this Recipe actually called, rather than
# approximated by declaring a Recipe-wide ordering that would also swing the
# list and enrollments routes the wrong way.
#
# One more wrinkle on the same question, stated and not served: the
# identical sweep against canvas.uw.edu answers 403 Forbidden for its own
# low, presumably-allocated ids, not 401 -- with no WWW-Authenticate header
# at all -- while agreeing with Harvard's 404 for ids past its own allocated
# range. Two institutions running the same open-source application answer
# "this exists and you may not see it" with two different HTTP statuses.
# This Recipe models Harvard's 401 shape, because it is the one every other
# gated route on every host agrees with; UW's 403 is recorded here as a real,
# live, dated divergence this format has no second scheme to hold at once.
#
# **Routing beats the credential when the path or method is the mistake, not
# the id.** Checked live, with no Authorization header sent at all:
#
#   GET    /api/v1/this-is-not-a-real-endpoint  -> 404, HTML, "Page Not Found"
#   PATCH  /api/v1/courses                      -> 404, byte-identical
#   DELETE /api/v1/courses                      -> 404, byte-identical
#   OPTIONS /api/v1/courses                     -> 404, byte-identical
#
# Confirmed byte-for-byte identical (cmp on the saved bodies, 26058 bytes
# each): a path this Rails app has no route for at all, and a method no
# route accepts on a path that does exist, answer the exact same rendered
# "Page Not Found" page, Content-Type text/html -- not the JSON envelope
# every auth failure above carries. There is no 405 anywhere on this host
# for any method this Recipe tried; PUT, PATCH, DELETE and OPTIONS on
# /api/v1/courses (GET-only) all 404 rather than naming what would have
# worked. auth.after_routing is true here: the router's own miss answers
# before Canvas's authentication filter is ever reached, the same ordering
# Fireworks' Recipe in this collection names and verifies the same way.
#
# **One route really is public, and it says so honestly.** GET
# /api/lti/security/jwks -- the JSON Web Key Set LTI tools verify Canvas's
# signed launches against -- answered 200 with no Authorization header and
# 200 with "Authorization: Bearer junktoken12345" attached, byte-identical
# both times, checked live on 2026-09-03. public: true is the honest
# declaration: this route does not examine the credential at all, verified
# rather than assumed the way FireHydrant's own public route was. The three
# keys returned each carry a kid encoding an ISO timestamp and a UUID --
# "2026-07-01T00:00:02Z_...", "2026-08-01T00:00:01Z_...",
# "2026-09-01T00:00:04Z_..." -- one per calendar month, consistent with a
# monthly signing-key rotation with a two-month overlap window for anything
# signed by a key that has since rolled off. The fixture below carries
# shortened, synthetic key material; the shape (three keys, RS256, sig, a
# dated kid) is what was actually observed.
#
# **This is the redaction question the group exists to ask, and Canvas's own
# reference documents the mechanism precisely: silent omission, not a
# refusal.** The Enrollments API's own Grade object description says, for
# current_grade, final_grade, current_score, final_score and their four
# "unposted_" counterparts: "Only included if user has permissions to view
# this grade" / "this score" -- typically teachers, TAs and admins. The
# Enrollment object itself repeats the pattern for sis_course_id,
# course_integration_id, section_integration_id, sis_account_id,
# sis_section_id, sis_user_id and sis_import_id: each "only included if the
# user has permission to view SIS information" (or to manage it, for the
# import id). None of this is a 403. A caller without grade-viewing rights
# gets 200 and a Grade object with those keys simply not present -- nothing
# in the response says a field was withheld rather than never set, which is
# exactly the ambiguity this group's question is about: a caller who cannot
# tell a genuinely blank grade from a redacted one has no way to report the
# right thing to anyone.
#
# The enrollments *listing* draws its access line differently and more
# bluntly, per the same reference: "Currently, only a root level admin user
# can return other users' enrollments. A user can, however, return his/her
# own enrollments." That is a refusal-shaped restriction by its own wording
# -- but the reference does not say what shape the refusal takes for a
# non-admin who tries anyway: a 401, a 403, or 200 with the list silently
# narrowed to nothing. This Recipe could not observe it either, because
# every credential it holds is a fixture Cauldron accepts locally, never a
# real token with real, partial permissions -- the live host answers every
# enrollments request the same generic 401 this Recipe never authenticated
# past. The central question of this group is answered precisely for
# field-level redaction (silent omission, cited above) and left genuinely
# open for whole-collection access: this Recipe states that gap rather than
# guessing which way it falls.
#
# **The enrolment state vocabulary is seven words, not two, and "deleted" is
# one of them.** GET /api/v1/(users|courses|sections)/.../enrollments
# documents state[] as: "active, invited, creation_pending, deleted,
# rejected, completed, inactive" (plus synthetic, query-only combinations
# available only when listing one user's own enrolments). Omitting state[]
# entirely returns only active and invited -- so a dropped student is not
# gone from this API's vocabulary, "deleted" is a real, queryable value a
# caller can ask for by name, and a roster read with no filter silently
# excludes every one of the other five states, deleted included, without
# saying so. A caller reading the default listing and finding a name absent
# cannot tell "never enrolled," "dropped, and the record still exists as
# deleted," and "suspended pending re-activation as inactive" apart, because
# all three simply are not there unless asked for by name. Separately,
# "inactive" is its own state, distinct from deleted: "When inactive, a user
# will still appear in the course roster to admins, but be unable to
# participate" -- a course can distinguish a visible-but-suspended student
# from a genuinely deleted one, when a caller thinks to ask.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists and no token was ever requested or guessed. Every
#     200 below carries source and no verified date, and is Instructure's
#     own worked example from its published Courses and Enrollments API
#     reference (id 370663, "InstructureCon 2012", "INSTCON12"; enrollment
#     id 1, course_id 1, grades current_score 35 / final_score 6.67) rather
#     than an invented value.
#   - Users, sections, assignments, submissions and every write operation
#     are out of scope. This Recipe is about the read side of one course and
#     its roster, which is the question the group was written to ask.
#   - The Link-header pagination rel values (current, next, prev, first,
#     last) are Canvas's own published wording -- "these will only be
#     included if they are relevant... rel="last" may also be excluded if
#     the total count is too expensive to compute" -- and are documented
#     rather than observed: no authenticated 200 could be reached to watch
#     one render.
#   - UW's 403-not-401 divergence on an existing-but-gated course id is
#     recorded in the header above and not modelled as a route; this format
#     has one credential-check outcome per Recipe and Harvard's shape is the
#     one every other gated route here agrees with.
#   - "API Token Scopes" is a real, documented Canvas feature (a developer
#     key can mint a token restricted to specific endpoints) and is the
#     shape of Canvas's own answer to the unentitled verdict this brief's
#     mechanisms added -- not modelled, because no scoped token exists to
#     call live and the reference gives no worked example of the refusal's
#     wire shape.
#   - No upstream.spec. Canvas's reference is generated per-page from the
#     application source rather than published as one fetchable OpenAPI
#     document at a stable URL.
#
# Every case below not carrying a verified date was read from Canvas's own
# published API reference (canvas.instructure.com/doc/api/*, generated
# "directly from the Canvas LMS source code"), not observed against a real
# institution -- this Recipe was written with no credential and created no
# account. The key below is a fixture and belongs to no institution.

recipe: canvas
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://canvas.instructure.com/doc/api/courses.html

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-canvas-fixture-token-0000000000000000
  # absent_error and malformed_error are both left unset on purpose: every
  # shape of "nothing usable was sent" -- no header, no scheme, an empty
  # Bearer value, a Basic credential -- answers Canvas's own generic
  # sentence, which is already this runtime's fallback wording. Only
  # rejected_error needs naming. See the header.
  rejected_error: invalid_access_token
  after_routing: true

responses:
  list:
    style: bare
    link_header: true
    prev_link: true
  resource:
    style: bare
  error:
    # {"errors":[{"message":"..."}]} -- an array, because a request may fail
    # more than one way, and no code or type anywhere in it.
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  course:
    id:
      style: numeric
      type: number
    fields:
      sis_course_id:
        type: string
        null_when_unset: true
      uuid:
        type: string
      name:
        type: string
      course_code:
        type: string
      # unpublished, available, completed, deleted -- the same four words
      # GET /api/v1/courses?state[] accepts as a filter. See the header for
      # what fetching a deleted one by id actually answers.
      workflow_state:
        type: string
        default: available
      account_id:
        type: integer
      root_account_id:
        type: integer
      enrollment_term_id:
        type: integer
      created_at:
        type: datetime
      start_at:
        type: datetime
        null_when_unset: true
      end_at:
        type: datetime
        null_when_unset: true
      # "optional: the total number of active and invited students in the
      # course" -- present only when the caller asks for it with
      # include[]=total_students.
      total_students:
        type: integer
        null_when_unset: true

  enrollment:
    id:
      style: numeric
      type: number
    fields:
      course_id:
        type: integer
      course_section_id:
        type: integer
      # active, invited, creation_pending, deleted, rejected, completed,
      # inactive -- see the header. A dropped student is "deleted", a real,
      # queryable value, not a row this API stops returning by name.
      enrollment_state:
        type: string
        default: active
      # StudentEnrollment, TeacherEnrollment, TaEnrollment,
      # DesignerEnrollment, ObserverEnrollment.
      type:
        type: string
        default: StudentEnrollment
      user_id:
        type: integer
      role:
        type: string
        default: StudentEnrollment
      created_at:
        type: datetime
      updated_at:
        type: datetime
      # Nested per Canvas's own Grade object. Every field here is withheld
      # by silent omission rather than a refusal when the caller lacks
      # grade-viewing permission -- see the header. This Recipe's fixture
      # only demonstrates the visible case; the withheld case cannot be
      # told apart from "no grade yet" with one static fixture, which is
      # the finding, not a gap in the fixture.
      current_score:
        type: number
        in: grades
        null_when_unset: true
      current_grade:
        type: string
        in: grades
        null_when_unset: true
      final_score:
        type: number
        in: grades
        null_when_unset: true
      final_grade:
        type: string
        in: grades
        null_when_unset: true

  # The public JWK set. See the header for the finding this route exists to
  # carry: the credential is not examined at all, verified rather than
  # assumed.
  jwk:
    collection: keys
    id:
      style: opaque
      field: kid
    fields:
      kty:
        type: string
        default: RSA
      e:
        type: string
        default: AQAB
      "n":
        type: string
      alg:
        type: string
        default: RS256
      use:
        type: string
        default: sig

routes:
  - method: GET
    path: /api/v1/courses
    resource: course
    operation: list
    pagination:
      style: page
      limit: 10
      limit_param: per_page
      cursor_param: page
      first_page: 1

  - method: GET
    path: /api/v1/courses/{id}
    resource: course
    operation: get
    not_found: resource_missing

  - method: GET
    path: /api/v1/courses/{course_id}/enrollments
    resource: enrollment
    operation: list
    scope: [course_id]
    pagination:
      style: page
      limit: 10
      limit_param: per_page
      cursor_param: page
      first_page: 1

  # One specific id this Recipe actually called live and never allocated on
  # canvas.harvard.edu -- see the header for the existence-oracle finding
  # this route exists to pin. public: true because the live host answered
  # this exact 404 with no credential sent at all; the record's non-existence
  # was resolved before any authentication filter ran, which is the half of
  # the ordering this format's auth.after_routing cannot express on its own
  # -- see the header.
  - method: GET
    path: /api/v1/courses/999999999999
    public: true
    error: resource_missing

  # The public key set. Both a request with no credential and one carrying a
  # wrong bearer token answered this byte-identically, live -- see the
  # header.
  - method: GET
    path: /api/lti/security/jwks
    resource: jwk
    operation: list
    pagination:
      # A JWKS document is the whole key set by definition -- RFC 7517 makes
      # it "an array of JWK values" and a verifier that receives half of it
      # cannot validate tokens signed by the other half. There is no size
      # and no position, on this route or on any JWKS anywhere.
      #
      # Canvas does page, and pages a lot of things: its own pagination page
      # says results are "paginated to 10 items by default" with per_page
      # for the size and Link headers for the position, whose URLs "should
      # be treated as opaque". None of that applies here, which is the point
      # -- a Recipe copying a provider's paging onto every listing would
      # have put it on this one too.
      style: none
    public: true
    list:
      style: wrapped
      key: keys

errors:
  # The generic fallback wording, which is also Canvas's own sentence for
  # every shape of "nothing usable was presented" -- see the header. Not
  # named by auth.absent_error or auth.malformed_error on purpose: leaving
  # both unset routes every verdict but rejected here, which is the honest
  # description of a host that only draws one line.
  authentication_error:
    status: 401
    message: user authorization required
    headers:
      WWW-Authenticate: 'Bearer realm="canvas-lms"'

  # What a syntactically real, present, wrong bearer token gets. Named by
  # auth.rejected_error, so the check reaches it on its own -- see the
  # header.
  invalid_access_token:
    status: 401
    message: Invalid access token.
    headers:
      WWW-Authenticate: 'Bearer realm="canvas-lms"'

  # What an id this instance has never allocated answers, with no credential
  # examined at all -- see the header. The identical sentence Canvas's own
  # reference documents for fetching a course whose workflow_state is
  # "deleted" by id.
  resource_missing:
    status: 404
    message: The specified resource does not exist.

  # A path this Rails app has no route for, and a method no route accepts on
  # a path that does exist, answer this exact rendered page -- see the
  # header. style: text because the real body is HTML, not the JSON envelope
  # every auth failure above carries; the full rendered page is several
  # kilobytes of the application's own theme assets and is not reproduced
  # here, the same call Together's Recipe in this collection makes for its
  # own unrouted-path HTML.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: Page Not Found

  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: Page Not Found

fixtures:
  empty: {}

  # Instructure's own worked example from the published Courses and
  # Enrollments API reference, cited in the header, not observed.
  sandbox:
    course:
      - id: 370663
        uuid: WvAHhY5FINzq5IyRIJybGeiXyFkG3SqHUPb7jZY5
        name: InstructureCon 2012
        course_code: INSTCON12
        workflow_state: available
        account_id: 81259
        root_account_id: 81259
        enrollment_term_id: 34
        created_at: "2012-05-01T00:00:00-06:00"
        start_at: "2012-06-01T00:00:00-06:00"
        end_at: "2012-09-01T00:00:00-06:00"
        total_students: 32

    enrollment:
      - id: 1
        course_id: 370663
        course_section_id: 1
        enrollment_state: active
        type: StudentEnrollment
        user_id: 1
        role: StudentEnrollment
        created_at: "2012-04-18T23:08:51Z"
        updated_at: "2012-04-18T23:08:51Z"
        current_score: 35
        final_score: 6.67

    jwk:
      # id is pinned as well as kid: the store keys every record by "id"
      # regardless of which field a Recipe renders it under on the wire, so
      # a pinned id.field has to be pinned twice -- the same shape Turso's
      # Recipe in this collection already relies on for its own Name-keyed
      # database record.
      - id: "2026-09-01T00:00:04Z_00000000-0000-4000-8000-000000000001"
        kid: "2026-09-01T00:00:04Z_00000000-0000-4000-8000-000000000001"
        n: cauldron-fixture-modulus-not-a-real-key-0000000000000000

# Every case below carries source. A verified date means this Recipe called
# the named host with exactly the request shown, on 2026-09-03, and recorded
# exactly what came back; its absence means the case was read from Canvas's
# own published API reference and never called.
conformance:
  - name: no credential and no scheme answer the identical sentence
    source: https://canvas.harvard.edu/api/v1/courses
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/v1/courses
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer realm="canvas-lms"'
      body:
        "errors[0].message": user authorization required

  - name: a header present with no Bearer scheme at all answers the same
    source: https://canvas.harvard.edu/api/v1/courses
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/v1/courses
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        "errors[0].message": user authorization required

  - name: a Basic credential is refused the same generic way
    source: https://canvas.harvard.edu/api/v1/courses
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/v1/courses
      headers:
        Authorization: "Basic dXNlcjpwYXNz"
    expect:
      status: 401
      body:
        "errors[0].message": user authorization required

  - name: a real, present, wrong bearer token earns a different sentence
    source: https://canvas.harvard.edu/api/v1/courses
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/v1/courses
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        "errors[0].message": Invalid access token.
      absent:
        - status

  - name: an id this instance has allocated answers unauthenticated, not missing
    # Live: canvas.harvard.edu course id 1, no Authorization header sent.
    # See the header for the existence-oracle finding this case is half of.
    source: https://canvas.harvard.edu/api/v1/courses/1
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /api/v1/courses/1
    expect:
      status: 401
      body:
        "errors[0].message": user authorization required

  - name: an id this instance has never allocated answers missing, with no credential examined at all
    # Live, no credential: the other half of the existence oracle. public:
    # true on this route because the live host answered this exact body
