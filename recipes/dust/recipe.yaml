# Dust Recipe for Cauldron
#
# Written against Dust's API reference at docs.dust.tt and struck live against
# dust.tt on 2026-09-07 with no credential and then with a deliberately invalid
# one.
#
# **Two typed failures, and one of the types ends in `_error`.** Struck live:
#
#   GET /api/v1/w/{workspace}/assistant/conversations         (no credential)
#   401 {"error":{"type":"not_authenticated",
#                 "message":"The request does not have valid authentication credentials."}}
#
#   GET /api/v1/w/{workspace}/assistant/conversations         Authorization: Bearer notreal
#   401 {"error":{"type":"malformed_authorization_header_error",
#                 "message":"Malformed Authorization header"}}
#
# Two distinct types for two distinct failures, which is more than most
# providers in this collection manage. And the second is
# `malformed_authorization_header_error` -- a type name, inside a field called
# `type`, inside an object called `error`, ending in the word `error`. The
# suffix is redundant twice over.
#
# `not_authenticated` next to it has no suffix, so the two names in one
# vocabulary are built to two different rules.
#
# **The first message is gRPC's.** "The request does not have valid
# authentication credentials." is the standard text for `UNAUTHENTICATED` in
# Google's status code definitions, which is where a great many services
# copied it from. It is accurate here, which is worth noting after five
# providers in this collection that describe the wrong failure.
#
# **The second is accurate too, and narrower.** "Malformed Authorization
# header" -- not "invalid key". A caller who sent a token with the wrong
# prefix, or no prefix, or a stray newline knows to look at the header rather
# than at the key inside it.
#
# **An unknown path is `text/plain`.** `404 Not Found`, four words, from
# Next.js' own handler -- so the JSON above belongs to routes that exist and a
# client cannot parse the failure it meets while getting a URL wrong.
#
# **The workspace is in the path.** `/api/v1/w/{wId}/...` -- a single letter
# for the segment, so a URL carries the tenant and a client that forgets it
# gets the 404 above rather than a message about workspaces.

recipe: dust
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
  # No spec: Dust publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk-cauldr0nf1xture000000000000000000000000
  # Two types, two sentences, both accurate -- which is rarer here than it
  # should be.
  absent_error: not_authenticated
  rejected_error: malformed_authorization_header

responses:
  list:
    style: wrapped
    key: conversations
  error:
    style: nested
    key: error
    message_field: message
    code_field: "-"
    type_field: type

resources:
  conversation:
    id:
      field: sId
      style: opaque
    fields:
      created:
        type: timestamp_ms
      title:
        type: string
      visibility:
        type: string
        default: unlisted
      owner:
      # The path segment, and not emitted: the workspace is in the URL rather
      # than on the record.
      workspace:
        type: string
        in: "-"

routes:
  - method: GET
    path: /api/v1/w/{workspace}/assistant/conversations
    resource: conversation
    operation: list
    scope: [workspace]
    pagination:
      style: none

errors:
  not_authenticated:
    status: 401
    type: not_authenticated
    # gRPC's standard text for UNAUTHENTICATED, which a great many services
    # copied. Accurate here, which is worth noting after five providers in
    # this collection that describe the wrong failure.
    message: "The request does not have valid authentication credentials."

  malformed_authorization_header:
    status: 401
    # A type name, in a field called type, in an object called error, ending
    # in the word error. The suffix is redundant twice over -- and its
    # sibling above has no suffix, so one vocabulary is built to two rules.
    type: malformed_authorization_header_error
    # Narrower than "invalid key", and better: a caller who sent the wrong
    # prefix, no prefix, or a stray newline knows to look at the header
    # rather than at the key inside it.
    message: "Malformed Authorization header"

  unknown_route:
    status: 404
    # Next.js' own handler -- so the JSON above belongs to routes that exist.
    style: text
    message: "404 Not Found"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    conversation: []

  workspace:
    conversation:
      - sId: 8f3c2b9147ad
        workspace: cauldron
        created: 1788712061204
        title: Draft the migration plan
        visibility: unlisted
        owner:
          sId: w9d1e4b7
          name: Cauldron
      - sId: b71e94d205fc
        workspace: cauldron
        created: 1788798461000
        # No title yet: a conversation is created before its first message is
        # summarised, so `title` is null on anything recent and a list view
        # has to fall back to something.
        title: null
        visibility: workspace
        owner:
          sId: w9d1e4b7
          name: Cauldron

conformance:
  - name: no credential is answered with gRPC's own sentence
    source: https://dust.tt/api/v1/w/abc/assistant/conversations
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers: {}
    expect:
      status: 401
      body:
        'error.type': not_authenticated
        # The standard text for UNAUTHENTICATED in Google's status
        # definitions, and accurate about this request.
        'error.message': "The request does not have valid authentication credentials."

  - name: a wrong credential has its own type
    source: https://dust.tt/api/v1/w/abc/assistant/conversations
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # Two distinct types for two distinct failures, which is more than
        # most providers in this collection manage.
        'error.type': malformed_authorization_header_error
        'error.message': "Malformed Authorization header"

  - name: one of the two type names ends in the word error
    source: https://dust.tt/api/v1/w/abc/assistant/conversations
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      matches:
        # Inside a field called type, inside an object called error. Redundant
        # twice over -- and `not_authenticated` beside it has no suffix, so
        # one vocabulary is built to two rules.
        'error.type': '_error$'

  - name: the wrong-credential message is about the header
    source: https://dust.tt/api/v1/w/abc/assistant/conversations
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # Not "invalid key". A caller who sent the wrong prefix, no prefix or
        # a stray newline is pointed at the header rather than at the key.
        'error.message': "Malformed Authorization header"

  - name: an unknown path is four words of plain text
    source: https://dust.tt/api/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^404 Not Found$'

  - name: conversations are wrapped under their own plural
    source: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        # sId rather than id -- a "string id", named for its type, which is
        # what a codebase that also has numeric ids ends up with.
        'conversations[0].sId': 8f3c2b9147ad
        'conversations[0].title': Draft the migration plan

  - name: a new conversation has no title
    source: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        # A conversation exists before its first message is summarised, so
        # title is null on anything recent and a list view has to fall back
        # to something -- usually the first message, which is a second fetch.
        'conversations[1].title': null
        'conversations[1].visibility': workspace

  - name: visibility is a word with no enumeration on the record
    source: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        # unlisted and workspace, in one listing -- and "unlisted" is the more
        # private of the two, which is the opposite of what the word suggests
        # to anyone who has used a video site.
        'conversations[0].visibility': unlisted
        'conversations[1].visibility': workspace

  - name: the creation time is milliseconds as a number
    source: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
    fixture: workspace
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        # Thirteen digits in a field called `created` rather than
        # `created_at`, so neither the name nor the value says which unit.
        'conversations[0].created': 1788712061204
        'conversations[0].owner.name': Cauldron

  - name: a workspace with no conversations answers an empty array
    source: https://docs.dust.tt/reference/get_api-v1-w-wid-assistant-conversations
    fixture: empty
    request:
      method: GET
      path: /api/v1/w/cauldron/assistant/conversations
      headers:
        Authorization: "Bearer sk-cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        conversations: []
