# Shortcut Recipe for Cauldron
#
# Shortcut has no sandbox. A token reaches a real workspace, and a test that
# creates a story puts it on a real board where it shows up in somebody's
# iteration and their burndown. Stories cannot be hard deleted from the API in
# a way that leaves no trace, so a suite that creates them distorts the numbers
# a team is using to plan.
#
# Two things worth modelling exactly:
#
#   1. Whether a story is done is not a field you can read directly. The
#      workflow state belongs to a workflow that a workspace admin defines, so
#      "Ready for Review" and "Done" are ids rather than names. Shortcut
#      derives completed and started from the state's type, and those are the
#      only stable things to branch on.
#   2. An archived story is still returned by a plain story search. Archiving
#      is not deleting, and a count that does not filter includes work
#      somebody deliberately set aside.
#
# Tokens below are fixtures, not secrets.
#
# Struck live against api.app.shortcut.com on 2026-09-05, unauthenticated,
# because that half needs no workspace and this Recipe's header claimed no
# case had ever been checked. It was wrong on the shape, not just unverified:
#
#   no Shortcut-Token at all      -> 401 {"message":"Sorry, the organization
#                                     context for this request is missing...",
#                                     "tag":"organization2_missing"}
#   Shortcut-Token: <garbage>     -> 401 {"message":"Unauthorized",
#                                     "tag":"unauthorized"}
#   Authorization: Bearer <any>   -> same as no token at all: Shortcut reads
#                                     only its own header, so sending the
#                                     wrong one IS sending none.
#
# Both verdicts answer identically for a nonexistent path and for a
# disallowed method, which says the credential is checked before the request
# is routed at all.
#
# This Recipe's own conformance case for the wrong-header mistake had never
# been run and had the message wrong: it claimed the plain "Unauthorized"
# body that a garbage-but-present token gets, when what Shortcut actually
# sends for a missing header entirely is the organisation-context sentence
# above, with a "tag" field this Recipe did not model at all. Fixed below,
# with the two verdicts kept apart the way auth.absent_error and
# auth.rejected_error exist to keep them.
#
# Everything past this -- a real story, a real workflow state, a real
# webhook delivery -- still needs the workspace the top of this file says
# cannot be reached without leaving a mark on somebody's board, so those
# cases stay documentation-only.

recipe: shortcut
capability: issues
version: 0.1.0

upstream:
  api: v3
  docs: https://developer.shortcut.com/api/rest/v3

auth:
  # Shortcut's own header. Not Authorization.
  scheme: header
  header: Shortcut-Token
  keys:
    - cauldron-shortcut-token
  # Verified live 2026-09-05: absent and rejected are two different
  # sentences, not one.
  absent_error: missing_token
  rejected_error: invalid_token

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  story:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      # feature, bug, chore. A burndown that counts every story the same
      # reports chores as delivered features.
      story_type:
        type: string
        default: feature
      # An id, not a name. The names belong to a workflow an admin defines
      # and can rename at any time.
      workflow_state_id:
        type: integer
      # Derived by Shortcut from the workflow state's type. These are the
      # only stable things to branch on.
      completed:
        type: boolean
        default: false
      started:
        type: boolean
        default: false
      # Archiving is not deleting, and an archived story is still returned.
      archived:
        type: boolean
        default: false
      estimate:
        type: integer
      epic_id:
        type: integer
      iteration_id:
        type: integer
      # Set only when it actually finished.
      completed_at:
        type: datetime
        stamped: false
      started_at:
        type: datetime
        stamped: false
      created_at:
        type: datetime

  epic:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      # to do, in progress, done. Derived the same way, from the epic
      # workflow rather than the story workflow, so the two vocabularies do
      # not match.
      state:
        type: string
        default: to do
      completed:
        type: boolean
        default: false
      archived:
        type: boolean
        default: false
      deadline:
        type: datetime
        stamped: false
      created_at:
        type: datetime

  iteration:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
        required: true
      # unstarted, started, done. An iteration that has not started yet
      # still has stories assigned to it.
      status:
        type: string
        default: unstarted
      start_date:
        type: string
      end_date:
        type: string
      created_at:
        type: datetime

routes:
  - method: GET
    path: /api/v3/stories/{id}
    resource: story
    operation: get

  - method: PUT
    path: /api/v3/stories/{id}
    resource: story
    operation: update
    emits: story-update

  - method: POST
    path: /api/v3/stories
    resource: story
    operation: create
    emits: story-create
    status: 201

  - method: GET
    path: /api/v3/epics/{epic_id}/stories
    resource: story
    operation: list
    scope: [epic_id]
    pagination:
      # Checked against Shortcut's own description: this endpoint takes no
      # page size, no offset and no cursor, and answers with a bare array of
      # everything. Shortcut does page, but only on its search endpoints --
      # /api/v3/search and friends take page_size and next -- so a page size
      # declared here was one this route does not accept.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

  - method: GET
    path: /api/v3/epics
    resource: epic
    operation: list
    pagination:
      # Checked against Shortcut's own description: this endpoint takes no
      # page size, no offset and no cursor, and answers with a bare array of
      # everything. Shortcut does page, but only on its search endpoints --
      # /api/v3/search and friends take page_size and next -- so a page size
      # declared here was one this route does not accept.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

  - method: GET
    path: /api/v3/epics/{id}
    resource: epic
    operation: get

  - method: GET
    path: /api/v3/iterations
    resource: iteration
    operation: list
    pagination:
      # Checked against Shortcut's own description: this endpoint takes no
      # page size, no offset and no cursor, and answers with a bare array of
      # everything. Shortcut does page, but only on its search endpoints --
      # /api/v3/search and friends take page_size and next -- so a page size
      # declared here was one this route does not accept.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

webhooks:
  events:
    - story-create
    - story-update
    - story-delete
    - epic-create
    - epic-update
  # Shortcut batches what changed into an actions array and names the event
  # nowhere else -- there is no type and no event at the top, so a handler
  # has to read actions[0].action to know what happened, and cope with there
  # being more than one.
  #
  # references is where Shortcut puts the things the actions mention but did
  # not change. It is present and empty here rather than absent, because an
  # application looking a name up in it should find an empty list rather than
  # undefined.
  payload:
    id: "{id}"
    changed_at: "{created_iso}"
    primary_id: "{record_id}"
    member_id: 5d2b0e2f-0000-4000-8000-000000000001
    version: v1
    actions:
      - id: "{record_id}"
        entity_type: "{resource}"
        action: "{action}"
    references: []
  signing:
    scheme: hmac-sha256
    header: Payload-Signature
    secret: cauldron-webhook-secret
    # Hex over the body, bare.
    encoding: hex
    over: "{body}"
    value: "{digest}"

errors:
  rate_limit:
    status: 429
    message: Too many requests
    headers:
      Retry-After: "1"

  # Verified live 2026-09-05: no Shortcut-Token at all, and (because the
  # header is the only thing Shortcut reads) sending Authorization instead
  # gets this too.
  missing_token:
    status: 401
    message: "Sorry, the organization context for this request is missing. If you have any questions please contact us at support@shortcut.com"
    fields:
      tag: organization2_missing

  # Verified live 2026-09-05: a Shortcut-Token that is present and not one
  # Shortcut recognises.
  invalid_token:
    status: 401
    message: Unauthorized
    fields:
      tag: unauthorized

  resource_missing:
    status: 404
    message: "Resource not found: {detail}"

  parameter_missing:
    status: 400
    message: "{detail} is required"

  # Shortcut refuses a workflow state that does not belong to the story's
  # workflow, which is what breaks an import when somebody reconfigures a
  # board behind its back.
  invalid_workflow_state:
    status: 422
    message: The workflow state does not belong to this story's workflow

  # A token scoped to one workspace cannot see another's stories, and the
  # failure looks like a missing story until you check which workspace the
  # token belongs to.
  forbidden:
    status: 403
    message: You do not have access to this workspace

fixtures:
  empty: {}

  small-workspace:
    iteration:
      - id: "10"
        name: Sprint 42
        status: started
        start_date: "2026-01-12"
        end_date: "2026-01-26"
      - id: "11"
        name: Sprint 43
        # Not started, and stories are already assigned to it.
        status: unstarted
        start_date: "2026-01-26"
    epic:
      - id: "100"
        name: Conformance suite
        state: in progress
        completed: false
    story:
      - id: "1001"
        epic_id: 100
        iteration_id: 10
        name: Write the checker
        story_type: feature
        workflow_state_id: 500000011
        # Derived from the workflow state's type. The state's name could be
        # anything an admin chose.
        completed: true
        started: true
        completed_at: "2026-01-14T16:00:00Z"
        started_at: "2026-01-12T09:00:00Z"
        estimate: 3
      - id: "1002"
        epic_id: 100
        iteration_id: 10
        name: Fix the paging cursor
        # A bug, not a feature. A burndown that counts every story the same
        # reports this as delivered scope.
        story_type: bug
        workflow_state_id: 500000010
        started: true
        started_at: "2026-01-15T10:00:00Z"
        estimate: 1
      - id: "1003"
        epic_id: 100
        name: Deferred idea
        story_type: chore
        workflow_state_id: 500000008
        # Archived, and still returned by a plain search. A count that does
        # not filter includes work somebody deliberately set aside.
        archived: true

# Conformance cases, read from Shortcut's REST API reference rather than
# observed against a live workspace. The verify report says so.
conformance:
  - name: done is derived, not a named state
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/stories/1001
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        # Unquoted. Shortcut ids are JSON numbers.
        id: 1001
        # The workflow state is an id, and its name belongs to a workflow an
        # admin can rename at any time. completed and started are the only
        # stable things to branch on.
        workflow_state_id: 500000011
        completed: true
        started: true
        completed_at: "2026-01-14T16:00:00Z"

  - name: a started story has no completion time
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/stories/1002
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        started: true
        completed: false
        started_at: "2026-01-15T10:00:00Z"
      absent:
        - completed_at

  - name: an archived story is still returned
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/epics/100/stories
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        # Archiving is not deleting. A count that does not filter includes
        # work somebody deliberately set aside.
        '[2]':
          archived: true
          name: Deferred idea
        '[0]':
          archived: false

  - name: story type distinguishes a bug from a feature
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/epics/100/stories
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        '[0]':
          story_type: feature
        # A burndown counting every story the same reports this as delivered
        # scope rather than repair work.
        '[1]':
          story_type: bug
        '[2]':
          story_type: chore

  - name: an unstarted iteration already has stories in it
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/iterations
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        '[0]':
          status: started
        '[1]':
          status: unstarted
          name: Sprint 43

  - name: a collection is a bare array
    source: https://developer.shortcut.com/api/rest/v3
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/epics
      headers:
        Shortcut-Token: cauldron-shortcut-token
    expect:
      status: 200
      body:
        '[0]':
          name: Conformance suite
          state: in progress
      absent:
        - data
        - results

  - name: the token header is Shortcut-Token, not Authorization -- and sending the wrong one is sending none
    source: https://api.app.shortcut.com/api/v3/epics
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/epics
      headers:
        Authorization: Bearer cauldron-shortcut-token
    expect:
      status: 401
      body:
        # Not the plain "Unauthorized" this case used to claim. Shortcut
        # reads only its own header, so an Authorization header is not a
        # wrong credential -- it is no credential, and gets the
        # organisation-context sentence and a "tag" this Recipe did not
        # model until this was checked live.
        message: "Sorry, the organization context for this request is missing. If you have any questions please contact us at support@shortcut.com"
        tag: organization2_missing
      absent:
        - error
        - errors

  - name: a Shortcut-Token that is present and wrong gets a different sentence than one that is missing
    source: https://api.app.shortcut.com/api/v3/epics
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /api/v3/epics
      headers:
        Shortcut-Token: cauldron-invalid-token
    expect:
      status: 401
      body:
        message: Unauthorized
        tag: unauthorized

  - name: the credential is checked before the request is routed at all
    source: https://api.app.shortcut.com/api/v3/does-not-exist
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/v3/does-not-exist
    expect:
      # A path that does not exist, with no credential sent, answers with
      # the same missing-credential body a real route gives -- not a 404.
      # Nothing about routing is consulted before auth is.
      status: 401
      body:
        tag: organization2_missing

  - name: what happened is inside an array and named nowhere else
    source: https://developer.shortcut.com/api/webhook/v1
    fixture: small-workspace
    request:
      method: POST
      path: /api/v3/stories
      headers:
        Shortcut-Token: cauldron-shortcut-token
      json:
        name: Fix the kettle
    expect:
      status: 201
      webhook:
        event: story-create
        signature: '^[0-9a-f]{64}$'
        signature_header: Payload-Signature
        body:
          # story-create, taken apart. The hyphen is the separator here,
          # which is a third one after the dot and the underscore.
          actions[0].entity_type: story
          actions[0].action: create
        absent:
          # Nothing at the top says what this was.
          - type
          - event
          - action
          - data.object
