# Smartlead Recipe for Cauldron
#
# The campaigns listing, read from Smartlead's own documentation -- which
# answers Markdown at every address with `.md` appended -- and struck live
# against server.smartlead.ai on 2026-09-11 with no credential, with an empty
# one, with a deliberately invalid one, and on a path that does not exist.
#
# **One page describes the response two ways and contradicts itself twice.**
# The reference for this endpoint carries, in order:
#
#   a Key Features bullet:  "Returns direct array of campaign objects (not wrapped)"
#   a Response section:     success (boolean), campaigns (array of campaign objects)
#   a PHP sample:           count($data['campaigns'])
#   a response example:     [ { "id": 2710262, ... } ]     <- a bare array
#   a Note under it:        "returns a direct array of campaigns, not wrapped
#                            in a success object"
#
# Four statements about the same body, two of them wrong, and the example is
# labelled "Actual from API". The sample code that ships beside it counts a key
# the response does not have.
#
# **Every failure is a different shape depending on which page you read.**
#
#   the error-handling guide:  {"error": {"code": ..., "message": ..., "details": {...}}}
#   this page's 401 example:   {"message": "Invalid API Key"}
#   this page's 404 example:   {"error": "Resource not found"}
#   this page's 422 example:   {"error": "Invalid parameters provided"}
#
# So `error` is an object on one page and a string on another, and the guide
# calls its version "a consistent JSON structure". Its own Python sample reads
# `error_body.get('error', {}).get('message', 'Unknown')`, which against the
# live API prints "Unknown" for every failure there is.
#
# **Live, there is one shape and two sentences.** Struck live:
#
#   (no api_key)          401 {"message":"API key is required."}
#   ?api_key=             401 {"message":"API key is required."}
#   ?api_key=notreal      401 {"message":"Invalid API Key"}
#   /cauldron-nope        401 {"message":"API key is required."}
#
# `API key is required.` has a trailing full stop and a lower-case k. `Invalid
# API Key` has neither and title-cases both words. One field, one status, one
# endpoint, two house styles.
#
# **And an unrouted path is a credential failure.** Authentication runs before
# routing, so a mistyped path answers 401 -- with the sentence about whichever
# credential state the caller is in. The documented 404 (`{"error":"Resource
# not found"}`) is not reachable by getting the path wrong, and a client
# retrying its credentials on a 401 will retry forever against a typo.
#
# **The status enum disagrees with itself between pages.** The campaigns
# concept page lists DRAFT, ACTIVE, PAUSED, STOPPED, ARCHIVED and COMPLETED.
# This endpoint's reference lists ACTIVE, PAUSED, STOPPED, ARCHIVED and
# DRAFTED. Six against five, `DRAFT` against `DRAFTED`, and `COMPLETED` in one
# place only -- on a field whose whole job is to be compared against a literal.
#
# **The page's own Response Codes section omits two statuses it gives examples
# for.** It lists 200, 401 and 500; the examples above it include a 404 and a
# 422.
#
# **The credential is a query parameter.** `?api_key=...` is the only form the
# documentation offers, so the secret is in every URL, every access log and
# every `Referer`.
#
# **And one object in the record is camelCase.** Every field on a campaign is
# snake_case -- `user_id`, `track_settings`, `min_time_btwn_emails` -- except
# inside `scheduler_cron_value`, which holds `startHour` and `endHour` beside
# `tz` and `days`.

recipe: smartlead
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://api.smartlead.ai/llms.txt
  # No spec: Smartlead documents this API as prose and field tables, with no
  # OpenAPI document at any address this Recipe could find. The documentation
  # does answer Markdown at every page with `.md` appended, and publishes a
  # single-file llms-full.txt, which is what the record shape below was read
  # from.

auth:
  # In the URL, and nowhere else. The documentation offers no header form.
  scheme: query
  param: api_key
  keys:
    - cauldr0nsmartleadf1xturek3y
  # Two different sentences for the two states, in two different house styles.
  absent_error: api_key_required
  rejected_error: invalid_api_key
  # An unrouted path answers the credential failure, so the key is read before
  # the path is resolved.
  after_routing: false

responses:
  list:
    # A bare array, which the page says three times and denies twice.
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  campaign:
    id:
      field: id
      style: numeric
      type: number
    fields:
      user_id:
        type: integer
      name:
        type: string
      # ACTIVE, PAUSED, STOPPED, ARCHIVED, DRAFTED here; DRAFT and COMPLETED
      # on the concept page.
      status:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime
      # An empty array means track everything, and the entries are the
      # negatives: DONT_EMAIL_OPEN, DONT_LINK_CLICK.
      track_settings:
        type: list
      # The one camelCase island on a snake_case record.
      scheduler_cron_value:
        type: map
      min_time_btwn_emails:
        type: integer
      max_leads_per_day:
        type: integer
      stop_lead_settings:
        type: string
      enable_ai_esp_matching:
        type: boolean
      send_as_plain_text:
        type: boolean
      follow_up_percentage:
        type: integer
      unsubscribe_text:
        type: string
      tags:
        type: list
      # Untyped, so absence survives as null rather than as a default.
      schedule_start_time:
      parent_campaign_id:
      client_id:

routes:
  - method: GET
    # With the trailing slash, which is how the documentation spells it in
    # every sample.
    path: /api/v1/campaigns/
    resource: campaign
    operation: list
    pagination:
      # None offered and none documented: the endpoint returns every campaign
      # the key can see, newest first.
      style: none

errors:
  api_key_required:
    status: 401
    # A trailing full stop and a lower-case k.
    message: API key is required.

  invalid_api_key:
    status: 401
    # No full stop, and both words capitalised.
    message: Invalid API Key

fixtures:
  empty:
    campaign: []

  workspace:
    campaign:
      - id: 2710262
        user_id: 196026
        name: Cold Outreach Q1 2024
        status: ACTIVE
        created_at: "2025-11-25T10:43:46.826Z"
        updated_at: "2025-11-25T14:02:21.776Z"
        # Both trackers off, expressed as two negatives in a list.
        track_settings:
          - DONT_EMAIL_OPEN
          - DONT_LINK_CLICK
        scheduler_cron_value:
          tz: America/New_York
          days:
            - 1
            - 2
            - 3
            - 4
            - 5
          # camelCase, inside a snake_case record.
          endHour: "19:00"
          startHour: "09:00"
        min_time_btwn_emails: 24
        max_leads_per_day: 100
        stop_lead_settings: REPLY_TO_AN_EMAIL
        schedule_start_time: null
        enable_ai_esp_matching: true
        send_as_plain_text: false
        follow_up_percentage: 20
        unsubscribe_text: ""
        parent_campaign_id: null
        client_id: null
        tags:
          - tag_id: 1
            tag_name: Q1
            tag_color: "#FF5733"
      - id: 2710261
        user_id: 196026
        name: Warm Intros
        # DRAFTED here; the concept page calls this state DRAFT.
        status: DRAFTED
        created_at: "2025-11-20T08:15:02.100Z"
        updated_at: "2025-11-20T08:15:02.100Z"
        # Empty means track everything, which is the opposite of what an empty
        # list of settings usually means.
        track_settings: []
        scheduler_cron_value:
          tz: Europe/London
          days:
            - 1
            - 3
            - 5
          endHour: "17:00"
          startHour: "10:00"
        min_time_btwn_emails: 30
        max_leads_per_day: 40
        stop_lead_settings: NEVER
        schedule_start_time: null
        enable_ai_esp_matching: false
        send_as_plain_text: true
        follow_up_percentage: 100
        unsubscribe_text: ""
        parent_campaign_id: null
        client_id: null
        tags: []

conformance:
  - name: no key and a wrong key are two different sentences
    source: https://server.smartlead.ai/api/v1/campaigns/
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
    expect:
      status: 401
      body:
        # Trailing full stop, lower-case k.
        message: API key is required.

  - name: a wrong key changes the sentence and the house style
    source: https://server.smartlead.ai/api/v1/campaigns/
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: notarealkey
    expect:
      status: 401
      body:
        # No full stop, both words capitalised.
        message: Invalid API Key

  - name: an unrouted path is a credential failure
    source: https://server.smartlead.ai/api/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
    expect:
      # Not 404. The credential is read before the path is resolved, so a
      # mistyped path looks like a missing key and a client retrying its
      # credentials retries forever.
      status: 401
      body:
        message: API key is required.

  - name: an unrouted path with a wrong key blames the key
    source: https://server.smartlead.ai/api/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: workspace
    request:
      method: GET
      path: /api/v1/cauldron-nope
      query:
        api_key: notarealkey
    expect:
      status: 401
      body:
        message: Invalid API Key

  - name: campaigns are a bare array and not the documented envelope
    source: https://api.smartlead.ai/llms-full.txt
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body:
        # The page's Response section names success and campaigns. Neither is
        # here, which the same page's Note says twice.
        '[0].id': 2710262
        '[0].user_id': 196026
        '[0].name': Cold Outreach Q1 2024
        '[0].status': ACTIVE

  - name: one object on the record is camelCase
    source: https://api.smartlead.ai/llms-full.txt
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body:
        # snake_case everywhere else on the record, camelCase in here.
        '[0].scheduler_cron_value.startHour': "09:00"
        '[0].scheduler_cron_value.endHour': "19:00"
        '[0].scheduler_cron_value.tz': America/New_York
        '[0].min_time_btwn_emails': 24
        '[0].max_leads_per_day': 100

  - name: an empty tracking list means track everything
    source: https://api.smartlead.ai/llms-full.txt
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body:
        # The entries are the negatives, so two of them is nothing tracked and
        # none of them is everything tracked.
        '[0].track_settings[0]': DONT_EMAIL_OPEN
        '[0].track_settings[1]': DONT_LINK_CLICK
        '[1].track_settings': []

  - name: the status the concept page calls DRAFT is DRAFTED here
    source: https://api.smartlead.ai/llms-full.txt
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body:
        '[1].status': DRAFTED
        '[1].name': Warm Intros
        '[1].stop_lead_settings': NEVER
        '[1].enable_ai_esp_matching': false
        '[1].send_as_plain_text': true
        '[1].follow_up_percentage': 100

  - name: the absences are null and the empty string is a value
    source: https://api.smartlead.ai/llms-full.txt
    fixture: workspace
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body:
        '[0].schedule_start_time': null
        '[0].parent_campaign_id': null
        '[0].client_id': null
        # Not null: a campaign with no unsubscribe line sends two quotes.
        '[0].unsubscribe_text': ""
        '[0].tags[0].tag_name': Q1
        '[0].tags[0].tag_color': "#FF5733"
        '[0].created_at': "2025-11-25T10:43:46.826Z"
        '[0].updated_at': "2025-11-25T14:02:21.776Z"

  - name: a workspace with no campaigns answers an empty array
    source: https://api.smartlead.ai/llms-full.txt
    fixture: empty
    request:
      method: GET
      path: /api/v1/campaigns/
      query:
        api_key: cauldr0nsmartleadf1xturek3y
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
