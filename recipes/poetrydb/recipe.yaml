# PoetryDB Recipe for Cauldron
#
# status is the number 404 and the string "405", and both arrive as HTTP 200.
#
#   {"status": 404,   "reason": "Not found"}
#   {"status": "405", "reason": "poemcount output field not available. ..."}
#
# The same key, in the same API, holding a JSON number on one failure and a JSON
# string on the other. Code writing `if (body.status === 404)` catches the first
# and misses the second; code writing `if (body.status === "405")` does the
# reverse; and `body.status >= 400` is true for one and false for the other,
# because "405" is not a number.
#
# **And neither of them is an HTTP failure.** Both come back 200, with
# content-type application/json, so response.ok is true and every retry, error
# boundary and status check in the client sees a success. The only thing that
# says otherwise is a field whose type changes between the two ways of saying
# it.
#
# Written against the live API rather than a document: every case below was
# checked against poetrydb.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. linecount is the string "14". A count, quoted, on the same document whose
#      other numeric field -- the status above -- is sometimes a real number. So
#      the API has a number that is a string and a string that is a number, and
#      they are in the same response family.
#   2. poemcount is a valid input field and an invalid output field. Asking for
#      an unknown input field answers "Only author, title, lines, linecount, and
#      poemcount or random allowed"; asking for poemcount as an output field
#      answers "Only author, title, lines, and linecount allowed". The same word
#      is in one list and not the other, and both refusals are 405.
#   3. A path problem is reported as 405. Method Not Allowed is the status for
#      an input field that does not exist, on a GET that is the only method the
#      endpoint has.
#   4. /author and /author/{name} answer different shapes. The list of authors
#      is an object, {"authors": [...]}, and a named author's poems are a bare
#      array. Two adjacent paths, one segment apart, and a client cannot use one
#      parser for both.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two poems are served, not the collection: Shelley's Ozymandias, published
#     in 1818, and a four-line Dickinson, who died in 1886. Both are long out of
#     copyright, and the second exists so that an author is a partition rather
#     than the whole shelf.
#   - The author list is trimmed from 129 names to six. The finding is the
#     envelope, not the roll.
#   - Output-field projection is combinatorial in the real API -- any comma-
#     separated subset of four fields, in any order. The two projections here
#     are declared as their own routes, because they are the two that were
#     checked; the general mechanism is not modelled.
#   - Only title, author, random and the two refusals are modelled. The :abs
#     exact-match suffix, poemcount and the combined author,title form answer
#     other documents.

recipe: poetrydb
capability: infrastructure
version: 0.1.0

upstream:
  api: poetrydb
  docs: https://poetrydb.org/index.html

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    # A bare array, for everything except the roll of authors.
    style: bare
  error:
    style: flat
    message_field: reason
    # The status in the body is not the status of the response, so it is not
    # derived from it: each failure states its own, and they disagree about the
    # type.
    status_field: "-"

resources:
  poem:
    id:
      style: opaque
      # A poem is addressed by its title and has no identifier of its own, so
      # the title is the identifier: /title/Ozymandias is how you fetch it.
      field: "-"
      carried_by: title
    fields:
      title:
        type: string
      author:
        type: string
      lines:
        type: list
      # A count, quoted.
      linecount:
        type: string

  roll:
    id:
      style: opaque
      field: "-"
    fields:
      authors:
        type: list

routes:
  - method: GET
    path: /title/{id}
    resource: poem
    operation: get
    envelope:
      array: true
    not_found: not_found_in_body

  # The same poem, two of its four fields.
  - method: GET
    path: /title/{title}/title,linecount
    resource: poem
    operation: list
    scope: [title]
    returns: [title, linecount]

  - method: GET
    path: /author/{author}
    resource: poem
    operation: list
    scope: [author]
    not_found: not_found_in_body

  # An object, one segment away from the bare arrays.
  - method: GET
    path: /author
    resource: roll
    operation: get
    id_from: auth

  # A word that is a valid input field and an invalid output field.
  - method: GET
    path: /author/{author}/poemcount
    error: output_field_not_available

  # And a path segment that is not a field at all.
  - method: GET
    path: /nonsense/{value}
    error: input_field_not_available

errors:
  # A 404, in the body, as a number, with HTTP 200.
  not_found_in_body:
    status: 200
    message: Not found
    fields:
      # A JSON number.
      status: 404

  # A 405, in the body, as a string, with HTTP 200 -- and the list it names is
  # one word shorter than the list the other refusal names.
  output_field_not_available:
    status: 200
    message: poemcount output field not available. Only author, title, lines, and linecount allowed.
    fields:
      # A JSON string, for the same key the failure above sends as a number.
      status: "405"

  # The same 405, for a path segment rather than an output field, and its list
  # of allowed words includes the one the other list leaves out.
  input_field_not_available:
    status: 200
    message: nonsense input field not available. Only author, title, lines, linecount, and poemcount or random allowed.
    fields:
      status: "405"

fixtures:
  empty: {}

  shelley:
    poem:
      # Published 1818, and out of copyright everywhere.
      - id: Ozymandias
        title: Ozymandias
        author: Percy Bysshe Shelley
        lines:
          - I met a traveller from an antique land
          - "Who said: Two vast and trunkless legs of stone"
          - Stand in the desert...Near them, on the sand,
          - Half sunk, a shattered visage lies, whose frown,
          - And wrinkled lip, and sneer of cold command,
          - Tell that its sculptor well those passions read
          - Which yet survive, stamped on these lifeless things,
          - "The hand that mocked them, and the heart that fed:"
          - "And on the pedestal these words appear:"
          - "'My name is Ozymandias, king of kings:"
          - Look on my works, ye Mighty, and despair!'
          - Nothing beside remains. Round the decay
          - Of that colossal wreck, boundless and bare
          - The lone and level sands stretch far away.
        # Fourteen lines, and the count that says so is a string.
        linecount: "14"

      # A second poet, so an author is a partition rather than the whole shelf.
      # Dickinson died in 1886.
      - id: The words the happy say
        title: The words the happy say
        author: Emily Dickinson
        lines:
          - The words the happy say
          - Are paltry melody
          - But those the silent feel
          - Are beautiful --
        linecount: "4"

    roll:
      - id: authors
        # Six of the real 129.
        authors:
          - Adam Lindsay Gordon
          - Alan Seeger
          - Alexander Pope
          - Algernon Charles Swinburne
          - Ambrose Bierce
          - Amy Levy

conformance:
  - name: a poem that does not exist is 404 in the body and 200 on the wire
    source: https://poetrydb.org/title/ZZZNoSuchPoem
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /title/ZZZNoSuchPoem
    expect:
      # response.ok is true.
      status: 200
      headers:
        Content-Type: application/json
      body:
        # And the body says 404, as a number.
        status: 404
        reason: Not found

  - name: the other refusal sends the same key as a string
    source: https://poetrydb.org/author/Emily%20Dickinson/poemcount
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /author/Emily%20Dickinson/poemcount
    expect:
      status: 200
      body:
        # "405", quoted, where the failure above sends 404 unquoted. Same API,
        # same key, two JSON types.
        status: "405"
        reason: poemcount output field not available. Only author, title, lines, and linecount allowed.

  - name: a path segment that is not a field is also 405, and lists one more word
    source: https://poetrydb.org/nonsense/x
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /nonsense/x
    expect:
      status: 200
      body:
        status: "405"
        # poemcount is in this list and absent from the one above it.
        reason: nonsense input field not available. Only author, title, lines, linecount, and poemcount or random allowed.

  - name: a poem comes back as an array of one
    source: https://poetrydb.org/title/Ozymandias
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /title/Ozymandias
    expect:
      status: 200
      body:
        # A single poem, in an array, with no envelope around it.
        "[0].title": Ozymandias
        "[0].author": Percy Bysshe Shelley
        "[0].lines[0]": I met a traveller from an antique land
        "[0].lines[13]": The lone and level sands stretch far away.

  - name: linecount is a string
    source: https://poetrydb.org/title/Ozymandias
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /title/Ozymandias
    expect:
      status: 200
      body:
        # Fourteen, quoted, on the same API whose status field is sometimes a
        # real number.
        "[0].linecount": "14"

  - name: asking for two fields answers two fields
    source: https://poetrydb.org/title/Ozymandias/title,linecount
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /title/Ozymandias/title,linecount
    expect:
      status: 200
      body:
        "[0].title": Ozymandias
        "[0].linecount": "14"
      absent:
        # The poem itself is gone, and so is its author.
        - "[0].lines"
        - "[0].author"

  - name: the roll of authors is an object where the poems are arrays
    source: https://poetrydb.org/author
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /author
    expect:
      status: 200
      body:
        # One segment away from /author/{name}, which is a bare array, and this
        # is wrapped -- so one parser does not read both.
        "authors[0]": Adam Lindsay Gordon
        "authors[5]": Amy Levy

  - name: a named author's poems are a bare array
    source: https://poetrydb.org/author/Percy%20Bysshe%20Shelley
    verified: "2026-08-29"
    fixture: shelley
    request:
      method: GET
      path: /author/Percy%20Bysshe%20Shelley
    expect:
      status: 200
      body:
        "[0].author": Percy Bysshe Shelley
        "[0].title": Ozymandias
      absent:
        # No envelope at all, where the roll one segment up has one.
        - authors
        # And Dickinson is on the shelf and not in this answer, so the author
        # segment is partitioning rather than decorating.
        - "[1]"
