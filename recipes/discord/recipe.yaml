# Discord Recipe for Cauldron
#
# Testing a bot means a real server, a real bot token, and messages that real
# people can see. There is no sandbox at all: the usual workaround is a private
# guild that slowly fills with test output, and the interesting cases (being
# rate limited, losing a permission, a channel disappearing mid-run) cannot be
# produced on demand.
#
# Two things this Recipe insists on:
#
#   1. Identifiers are snowflakes: long numeric strings that exceed what a
#      JavaScript number can hold, which is why they travel as strings. An
#      emulator minting 1, 2, 3 lets a rounding bug through unnoticed, and the
#      bug only shows up against real ids.
#   2. Collections are bare arrays. A client unmarshalling into a slice must
#      not receive an object.
#
# Probed live, unauthenticated, on 2026-09-05, against discord.com/api/v10:
#
#   1. GET /api/v10/users/@me and GET /api/v10/guilds/{id}/channels, with no
#      Authorization header and with an invented "Bot ..." token, both answer
#      the identical 401: {"message": "401: Unauthorized", "code": 0} --
#      exactly what this file already declared, unmodified by this probe.
#   2. GET /api/v10/not-a-real-endpoint, and a nonsense segment nested under
#      a real-looking guild id (/api/v10/guilds/{id}/totally-made-up), both
#      answer 404 with no credential presented at all and the identical body
#      whether or not a token is sent: {"message": "404: Not Found",
#      "code": 0}. Discord's router resolves the path before it ever
#      consults the credential -- auth.after_routing below carries that.
#   3. PUT on /api/v10/guilds/{id}/channels -- a real path this Recipe
#      declares only GET and POST for -- answers a genuine 405 the same way,
#      credentialed or not: {"message": "405: Method Not Allowed",
#      "code": 0}, no Allow header. (A PATCH sent to /users/@me looked like
#      the same test at first and answered 401 instead of 405 -- it is not:
#      Modify Current User is a real PATCH endpoint on that path, just one
#      this Recipe does not model, so that request was authenticated-but-
#      unauthorized rather than a method mismatch. Struck against a route
#      this Recipe actually declares, method mismatch is unambiguous.)
#
# Known fidelity gap: Cauldron always attaches a computed Allow header to a
# declared 405 (internal/runtime/handler.go), and Discord's live 405 carries
# none. Modelled as faithfully as the format allows, not exactly.
#
# Tokens below are fixtures, not secrets.

recipe: discord
capability: chat
version: 0.1.0

upstream:
  api: v10
  docs: https://discord.com/developers/docs/reference
  # Published in the provider's own organisation on GitHub, and it
  # declares all three listings this Recipe models. It is where the
  # paging parameter names below were read from.
  spec: https://raw.githubusercontent.com/discord/discord-api-spec/main/specs/openapi.json
  spec_hash: c5d4bdb72f864d7fe8948454ab2850b1ac960075262071ba9f50082e53eb8537
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  # Discord's own prefix. A bot token is not a bearer token, and sending the
  # wrong prefix is a 401 that reads like a bad token.
  prefix: "Bot "
  # Struck live with no credential at all: an unmatched path and a wrong
  # method both answer before Discord's application ever looks at
  # authentication, and only a matched route with the right method falls
  # through to the 401. See the header.
  after_routing: true
  keys:
    - cauldron.bot.token

responses:
  list:
    style: bare
  error:
    style: flat
    code_field: code
    message_field: message

resources:
  channel:
    id:
      style: digits
      length: 19
    fields:
      guild_id:
        type: string
      name:
        type: string
        required: true
      # Discord's channel types are integers, and code branches on the number.
      type:
        type: integer
        default: 0
      position:
        type: integer
        default: 0
      topic:
        type: string
      nsfw:
        type: boolean
        default: false
      rate_limit_per_user:
        type: integer
        default: 0

  message:
    id:
      style: digits
      length: 19
    fields:
      channel_id:
        type: string
        required: true
      content:
        type: string
        required: true
      # A message from a bot is flagged, and handlers must ignore their own
      # output or they loop forever.
      tts:
        type: boolean
        default: false
      pinned:
        type: boolean
        default: false
      type:
        type: integer
        default: 0
      timestamp:
        type: datetime

  guild_member:
    id:
      style: digits
      length: 19
    fields:
      guild_id:
        type: string
      nick:
        type: string
      roles:
        type: string
      deaf:
        type: boolean
        default: false
      mute:
        type: boolean
        default: false
      joined_at:
        type: datetime

routes:
  - method: GET
    path: /api/v10/guilds/{guild_id}/channels
    resource: channel
    operation: list
    pagination:
      # Discord's own description declares no query parameters on this route
      # at all: a guild's channels come back in one response, however many
      # there are.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page.
      style: none
    scope: [guild_id]

  - method: POST
    path: /api/v10/guilds/{guild_id}/channels
    resource: channel
    operation: create
    emits: CHANNEL_CREATE
    scope: [guild_id]
    status: 201

  - method: GET
    path: /api/v10/channels/{id}
    resource: channel
    operation: get

  - method: PATCH
    path: /api/v10/channels/{id}
    resource: channel
    operation: update

  - method: DELETE
    path: /api/v10/channels/{id}
    resource: channel
    operation: delete
    emits: CHANNEL_DELETE

  - method: GET
    path: /api/v10/channels/{channel_id}/messages
    resource: message
    operation: list
    scope: [channel_id]
    pagination:
      # Discord's own description names limit -- one to a hundred -- and
      # after, which is a snowflake rather than a token: "get entries after
      # this ID". before and around are the other two directions, and
      # neither is the word the runtime supplies.
      style: cursor
      limit: 50
      max_limit: 100
      limit_param: limit
      cursor_param: after

  - method: POST
    path: /api/v10/channels/{channel_id}/messages
    resource: message
    operation: create
    emits: MESSAGE_CREATE
    scope: [channel_id]

  - method: GET
    path: /api/v10/guilds/{guild_id}/members
    resource: guild_member
    operation: list
    scope: [guild_id]
    pagination:
      # Discord's own description names limit -- one to a hundred -- and
      # after, which is a snowflake rather than a token: "get entries after
      # this ID". before and around are the other two directions, and
      # neither is the word the runtime supplies.
      style: cursor
      limit: 50
      max_limit: 100
      limit_param: limit
      cursor_param: after

webhooks:
  # Gateway events, delivered over a socket in the real thing. Cauldron sends
  # them as HTTP so a handler can be exercised without a gateway connection.
  events:
    - MESSAGE_CREATE
    - MESSAGE_UPDATE
    - MESSAGE_DELETE
    - GUILD_MEMBER_ADD
    - GUILD_MEMBER_REMOVE
    - CHANNEL_CREATE
    - CHANNEL_DELETE
  # A gateway frame, which is what a handler actually parses. The transport
  # is the stated deviation above -- Cauldron sends these over HTTP so a
  # handler can be exercised without a socket -- and the frame is not, so
  # sending anything else would deviate twice and only admit to once.
  #
  # The event name is t. Not type, not event: a single letter, beside op and
  # s and d, because the gateway is optimised for a socket rather than for
  # being read.
  payload:
    op: 0
    t: "{event}"
    s: 1
    d:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: X-Signature-Ed25519
    # The header names the algorithm and it is not this one. Discord signs
    # with Ed25519 -- a public-key signature an application verifies with
    # Discord's public key, not a shared-secret HMAC -- so the scheme above
    # is wrong rather than merely unshaped, and no format can fix it.
    #
    # Left declared because the header name is right and a handler reading it
    # is exercised. What it reads will not verify.
    secret: cauldron-public-key

errors:
  # Discord's rate limit is the one everybody meets, and the one that is
  # hardest to rehearse: it arrives per route and per bot at once.
  rate_limit:
    status: 429
    code: "0"
    message: You are being rate limited.
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"
      X-RateLimit-Scope: user

  # Struck live with no credential and with an invented Bot token; both
  # answer this identical body.
  authentication_error:
    status: 401
    code: "0"
    message: "401: Unauthorized"

  # Struck live with no credential at all: the router answers this before
  # authentication is ever consulted, which auth.after_routing declares.
  unknown_route:
    status: 404
    code: "0"
    message: "404: Not Found"

  # Struck live against a route this Recipe declares (PUT on
  # guilds/{id}/channels, which takes only GET and POST): the same body,
  # credentialed or not. No Allow header lives on the real response --
  # see the header for why this Recipe still sends one.
  method_not_allowed:
    status: 405
    code: "0"
    message: "405: Method Not Allowed"

  resource_missing:
    status: 404
    code: "10003"
    message: Unknown Channel

  parameter_missing:
    status: 400
    code: "50035"
    message: "Invalid Form Body: {detail} is required"

  # The permission failures a bot hits the moment it is added to a server it
  # was not configured for.
  missing_access:
    status: 403
    code: "50001"
    message: Missing Access

  missing_permissions:
    status: 403
    code: "50013"
    message: Missing Permissions

  cannot_send_empty_message:
    status: 400
    code: "50006"
    message: Cannot send an empty message

fixtures:
  empty: {}

  small-guild:
    channel:
      - id: "1900000000000000001"
        guild_id: "1800000000000000001"
        name: general
        type: 0
        position: 0
        topic: Anything and everything
      - id: "1900000000000000002"
        guild_id: "1800000000000000001"
        name: deploys
        type: 0
        position: 1
        rate_limit_per_user: 5
      - id: "1900000000000000003"
        guild_id: "1800000000000000002"
        name: should-not-appear
        type: 0
    message:
      - id: "1910000000000000001"
        channel_id: "1900000000000000002"
        content: Deployed 4f21c9 to production.
        type: 0
      - id: "1910000000000000002"
        channel_id: "1900000000000000002"
        content: Rolled back.
        pinned: true
        type: 0
    guild_member:
      - id: "1700000000000000001"
        guild_id: "1800000000000000001"
        nick: ada
        roles: "1600000000000000001"

# Conformance cases. The resource shapes are read from Discord's developer
# reference rather than observed against a live guild -- no bot token for one
# was ever created or used. The refusal cases at the end are struck live,
# unauthenticated, and carry a verified date; see the header.
conformance:
  - name: a channel list is a bare array
    source: https://discord.com/developers/docs/resources/guild
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/1800000000000000001/channels
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          name: general
          type: 0
        '[1]':
          name: deploys
          rate_limit_per_user: 5
      # A client unmarshalling into a slice must not receive an object.
      absent:
        - data
        - results
        - '[2]'

  - name: identifiers are long numeric strings, not small integers
    source: https://discord.com/developers/docs/reference
    fixture: small-guild
    request:
      method: POST
      path: /api/v10/channels/1900000000000000002/messages
      headers:
        Authorization: Bot cauldron.bot.token
      json:
        content: Build finished
    expect:
      status: 200
      body:
        content: Build finished
        channel_id: "1900000000000000002"
        type: 0
      matches:
        # Nineteen digits, no leading zero. A snowflake exceeds what a
        # JavaScript number holds, which is why it travels as a string, and an
        # emulator minting 1, 2, 3 lets a rounding bug through unnoticed.
        id: '^[1-9][0-9]{18}$'

  - name: a bot token uses the Bot prefix, not Bearer
    source: https://discord.com/developers/docs/reference
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/1800000000000000001/channels
      headers:
        Authorization: Bearer cauldron.bot.token
    expect:
      # Sending the wrong prefix is a 401 that reads like a bad token, which is
      # exactly why it is worth reproducing.
      status: 401
      matches:
        message: 'Unauthorized'

  - name: another guild's channels are not visible
    source: https://discord.com/developers/docs/resources/guild
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/1800000000000000002/channels
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          name: should-not-appear
      absent:
        - '[1]'

  - name: an unknown channel is a flat error with Discord's own code
    source: https://discord.com/developers/docs/topics/opcodes-and-status-codes
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/channels/1999999999999999999
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 404
      body:
        code: 10003
        message: Unknown Channel
      # Nothing nested. Code reading error.message finds nothing.
      absent:
        - error
        - errors

  - name: messages in a channel are scoped to it
    source: https://discord.com/developers/docs/resources/channel
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/channels/1900000000000000002/messages
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          content: Deployed 4f21c9 to production.
        '[1]':
          pinned: true
      absent:
        - '[2]'

  - name: creating a channel answers 201
    source: https://discord.com/developers/docs/resources/guild
    fixture: empty
    request:
      method: POST
      path: /api/v10/guilds/1800000000000000001/channels
      headers:
        Authorization: Bot cauldron.bot.token
      json:
        name: incidents
    expect:
      status: 201
      body:
        name: incidents
        guild_id: "1800000000000000001"
        type: 0
        nsfw: false
      matches:
        id: '^[1-9][0-9]{18}$'

  - name: a gateway frame names the event t and puts the payload at d
    source: https://discord.com/developers/docs/topics/gateway-events
    fixture: small-guild
    request:
      method: POST
      path: /api/v10/guilds/100000000000000001/channels
      headers:
        Authorization: Bot cauldron.bot.token
      json:
        name: incident-response
    expect:
      status: 201
      webhook:
        event: CHANNEL_CREATE
        body:
          # Dispatch. A handler checks this before looking at t at all.
          op: 0
          t: CHANNEL_CREATE
          d.name: incident-response
        absent:
          # None of the words a handler would try first.
          - type
          - event
          - data
          - data.object

  - name: no credential at all is a flat 401 with no envelope
    # Struck live against /api/v10/users/@me; the identical body answers
    # every route this Recipe declares, credential absent.
    source: https://discord.com/api/v10/users/@me
    verified: "2026-09-05"
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/1800000000000000002/channels
    expect:
      status: 401
      body:
        code: 0
        message: "401: Unauthorized"

  - name: an invented Bot token gets the identical refusal
    # Struck live against /api/v10/users/@me; the identical body answers
    # every route this Recipe declares, credential invented.
    source: https://discord.com/api/v10/users/@me
    verified: "2026-09-05"
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/1800000000000000002/channels
      headers:
        Authorization: "Bot fake.token.here"
    expect:
      status: 401
      body:
        code: 0
        message: "401: Unauthorized"

  - name: a path this API does not route needs no credential either
    # Struck live both with and without a token; the router answers this
    # before authentication is ever consulted, which auth.after_routing
    # declares.
    source: https://discord.com/api/v10/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/v10/not-a-real-endpoint
    expect:
      status: 404
      body:
        code: 0
        message: "404: Not Found"

  - name: a wrong method on a declared route is a genuine 405
    # PUT on guilds/{id}/channels, which this Recipe declares only GET and
    # POST for. Struck live with no credential, and identically with one.
    source: https://discord.com/api/v10/guilds/100000000000000001/channels
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PUT
      path: /api/v10/guilds/100000000000000001/channels
    expect:
      status: 405
      body:
        code: 0
        message: "405: Method Not Allowed"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the guild_member listing answers with what the fixture holds"
    source: "https://discord.com/developers/docs/resources/guild"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/guilds/1800000000000000001/members"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].id": "1700000000000000001"
      absent:
        - "[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read, and a page of one is not the whole collection"
    source: "https://discord.com/developers/docs/resources/channel"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/channels/1900000000000000002/messages"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].id": "1910000000000000001"
      absent:
        - "[1]"

  # And the position. after=1910000000000000001 answers a different
  # record, which the size alone cannot produce.
  - name: "after moves the page on, and what comes back is not page one"
    source: "https://discord.com/developers/docs/resources/channel"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/channels/1900000000000000002/messages"
      query:
        "limit": "1"
        "after": "1910000000000000001"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].id": "1910000000000000002"
      absent:
        - "[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but after can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "after moves the page on for api v10 guilds members"
    source: "https://discord.com/developers/docs/resources/guild"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/guilds/1800000000000000001/members"
      query:
        "limit": "1"
        "after": "1700000000000000001"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      absent:
        - "[0]"

  # The names. This Recipe declares 3 field(s) on a channel that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a channel carries the field names this Recipe declares"
    source: "https://discord.com/developers/docs/resources/guild"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/guilds/1800000000000000001/channels"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].position": 0
        "[0].rate_limit_per_user": 0
        "[0].topic": "Anything and everything"

  # The names. This Recipe declares 5 field(s) on a guild_member that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a guild_member carries the field names this Recipe declares"
    source: "https://discord.com/developers/docs/resources/guild"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/guilds/1800000000000000001/members"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].deaf": false
        "[0].joined_at": "2026-01-01T00:00:00Z"
        "[0].mute": false
        "[0].nick": "ada"
        "[0].roles": "1600000000000000001"

  # The names. This Recipe declares 3 field(s) on a message that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a message carries the field names this Recipe declares"
    source: "https://discord.com/developers/docs/resources/channel"
    fixture: small-guild
    request:
      method: GET
      path: "/api/v10/channels/1900000000000000002/messages"
      headers:
        "Authorization": "Bot cauldron.bot.token"
    expect:
      status: 200
      body:
        "[0].pinned": false
        "[0].timestamp": "2026-01-01T00:00:00Z"
        "[0].tts": false




