# Discord Recipe for Cauldron
#
# Testing a bot means a real server, a real bot token, and messages that real
# people can see. There is no sandbox at all: the usual workaround is a private
# guild that slowly fills with test output, and the interesting cases (being
# rate limited, losing a permission, a channel disappearing mid-run) cannot be
# produced on demand.
#
# Two things this Recipe insists on:
#
#   1. Identifiers are snowflakes: long numeric strings that exceed what a
#      JavaScript number can hold, which is why they travel as strings. An
#      emulator minting 1, 2, 3 lets a rounding bug through unnoticed, and the
#      bug only shows up against real ids.
#   2. Collections are bare arrays. A client unmarshalling into a slice must
#      not receive an object.
#
# Tokens below are fixtures, not secrets.

recipe: discord
version: 0.1.0

upstream:
  api: v10
  docs: https://discord.com/developers/docs/reference

auth:
  scheme: bearer
  header: Authorization
  # Discord's own prefix. A bot token is not a bearer token, and sending the
  # wrong prefix is a 401 that reads like a bad token.
  prefix: "Bot "
  keys:
    - cauldron.bot.token

responses:
  list:
    style: bare
  error:
    style: flat
    code_field: code
    message_field: message

resources:
  channel:
    id:
      style: digits
      length: 19
    fields:
      guild_id:
        type: string
      name:
        type: string
        required: true
      # Discord's channel types are integers, and code branches on the number.
      type:
        type: integer
        default: 0
      position:
        type: integer
        default: 0
      topic:
        type: string
      nsfw:
        type: boolean
        default: false
      rate_limit_per_user:
        type: integer
        default: 0

  message:
    id:
      style: digits
      length: 19
    fields:
      channel_id:
        type: string
        required: true
      content:
        type: string
        required: true
      # A message from a bot is flagged, and handlers must ignore their own
      # output or they loop forever.
      tts:
        type: boolean
        default: false
      pinned:
        type: boolean
        default: false
      type:
        type: integer
        default: 0
      timestamp:
        type: datetime

  guild_member:
    id:
      style: digits
      length: 19
    fields:
      guild_id:
        type: string
      nick:
        type: string
      roles:
        type: string
      deaf:
        type: boolean
        default: false
      mute:
        type: boolean
        default: false
      joined_at:
        type: datetime

routes:
  - method: GET
    path: /api/v10/guilds/{guild_id}/channels
    resource: channel
    operation: list
    scope: [guild_id]

  - method: POST
    path: /api/v10/guilds/{guild_id}/channels
    resource: channel
    operation: create
    scope: [guild_id]
    status: 201

  - method: GET
    path: /api/v10/channels/{id}
    resource: channel
    operation: get

  - method: PATCH
    path: /api/v10/channels/{id}
    resource: channel
    operation: update

  - method: DELETE
    path: /api/v10/channels/{id}
    resource: channel
    operation: delete

  - method: GET
    path: /api/v10/channels/{channel_id}/messages
    resource: message
    operation: list
    scope: [channel_id]
    pagination:
      style: cursor
      limit: 50

  - method: POST
    path: /api/v10/channels/{channel_id}/messages
    resource: message
    operation: create
    scope: [channel_id]

  - method: GET
    path: /api/v10/guilds/{guild_id}/members
    resource: guild_member
    operation: list
    scope: [guild_id]
    pagination:
      style: cursor
      limit: 100

webhooks:
  # Gateway events, delivered over a socket in the real thing. Cauldron sends
  # them as HTTP so a handler can be exercised without a gateway connection.
  events:
    - MESSAGE_CREATE
    - MESSAGE_UPDATE
    - MESSAGE_DELETE
    - GUILD_MEMBER_ADD
    - GUILD_MEMBER_REMOVE
    - CHANNEL_CREATE
    - CHANNEL_DELETE
  signing:
    scheme: hmac-sha256
    header: X-Signature-Ed25519
    secret: cauldron-public-key

errors:
  # Discord's rate limit is the one everybody meets, and the one that is
  # hardest to rehearse: it arrives per route and per bot at once.
  rate_limit:
    status: 429
    code: "0"
    message: You are being rate limited.
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"
      X-RateLimit-Scope: user

  authentication_error:
    status: 401
    code: "0"
    message: "401: Unauthorized"

  resource_missing:
    status: 404
    code: "10003"
    message: Unknown Channel

  parameter_missing:
    status: 400
    code: "50035"
    message: "Invalid Form Body: {detail} is required"

  # The permission failures a bot hits the moment it is added to a server it
  # was not configured for.
  missing_access:
    status: 403
    code: "50001"
    message: Missing Access

  missing_permissions:
    status: 403
    code: "50013"
    message: Missing Permissions

  cannot_send_empty_message:
    status: 400
    code: "50006"
    message: Cannot send an empty message

fixtures:
  empty: {}

  small-guild:
    channel:
      - id: "900000000000000001"
        guild_id: "800000000000000001"
        name: general
        type: 0
        position: 0
        topic: Anything and everything
      - id: "900000000000000002"
        guild_id: "800000000000000001"
        name: deploys
        type: 0
        position: 1
        rate_limit_per_user: 5
      - id: "900000000000000003"
        guild_id: "800000000000000002"
        name: should-not-appear
        type: 0
    message:
      - id: "910000000000000001"
        channel_id: "900000000000000002"
        content: Deployed 4f21c9 to production.
        type: 0
      - id: "910000000000000002"
        channel_id: "900000000000000002"
        content: Rolled back.
        pinned: true
        type: 0
    guild_member:
      - id: "700000000000000001"
        guild_id: "800000000000000001"
        nick: ada
        roles: "600000000000000001"

# Conformance cases, read from Discord's developer reference rather than
# observed against a live guild. The verify report says so.
conformance:
  - name: a channel list is a bare array
    source: https://discord.com/developers/docs/resources/guild
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/800000000000000001/channels
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          name: general
          type: 0
        '[1]':
          name: deploys
          rate_limit_per_user: 5
      # A client unmarshalling into a slice must not receive an object.
      absent:
        - data
        - results
        - '[2]'

  - name: identifiers are long numeric strings, not small integers
    source: https://discord.com/developers/docs/reference
    fixture: small-guild
    request:
      method: POST
      path: /api/v10/channels/900000000000000002/messages
      headers:
        Authorization: Bot cauldron.bot.token
      json:
        content: Build finished
    expect:
      status: 200
      body:
        content: Build finished
        channel_id: "900000000000000002"
        type: 0
      matches:
        # Nineteen digits, no leading zero. A snowflake exceeds what a
        # JavaScript number holds, which is why it travels as a string, and an
        # emulator minting 1, 2, 3 lets a rounding bug through unnoticed.
        id: '^[1-9][0-9]{18}$'

  - name: a bot token uses the Bot prefix, not Bearer
    source: https://discord.com/developers/docs/reference
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/800000000000000001/channels
      headers:
        Authorization: Bearer cauldron.bot.token
    expect:
      # Sending the wrong prefix is a 401 that reads like a bad token, which is
      # exactly why it is worth reproducing.
      status: 401
      matches:
        message: 'Unauthorized'

  - name: another guild's channels are not visible
    source: https://discord.com/developers/docs/resources/guild
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/guilds/800000000000000002/channels
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          name: should-not-appear
      absent:
        - '[1]'

  - name: an unknown channel is a flat error with Discord's own code
    source: https://discord.com/developers/docs/topics/opcodes-and-status-codes
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/channels/999999999999999999
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 404
      body:
        code: 10003
        message: Unknown Channel
      # Nothing nested. Code reading error.message finds nothing.
      absent:
        - error
        - errors

  - name: messages in a channel are scoped to it
    source: https://discord.com/developers/docs/resources/channel
    fixture: small-guild
    request:
      method: GET
      path: /api/v10/channels/900000000000000002/messages
      headers:
        Authorization: Bot cauldron.bot.token
    expect:
      status: 200
      body:
        '[0]':
          content: Deployed 4f21c9 to production.
        '[1]':
          pinned: true
      absent:
        - '[2]'

  - name: creating a channel answers 201
    source: https://discord.com/developers/docs/resources/guild
    fixture: empty
    request:
      method: POST
      path: /api/v10/guilds/800000000000000001/channels
      headers:
        Authorization: Bot cauldron.bot.token
      json:
        name: incidents
    expect:
      status: 201
      body:
        name: incidents
        guild_id: "800000000000000001"
        type: 0
        nsfw: false
      matches:
        id: '^[1-9][0-9]{18}$'
