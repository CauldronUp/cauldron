# Zulip Recipe for Cauldron
#
# Written against Zulip's own OpenAPI document, published in its own repository
# -- github.com/zulip/zulip, zerver/openapi/zulip.yaml, 119 paths -- read on
# 2026-09-06, and struck live against chat.zulip.org the same day. The public
# endpoint needed no account; the refusal was recorded by asking for messages
# without one.
#
# **The path says v1 and the real version is an integer in the body.**
#
# Every Zulip endpoint lives under /api/v1 and has for the life of the product.
# The version that actually decides what a client may do is
# `zulip_feature_level`, a monotonically increasing integer answered by
# /server_settings. Struck live on 2026-09-06: chat.zulip.org answered
#
#   "zulip_version": "12.0-919-gb1bd7d7d3e",
#   "zulip_feature_level": 509
#
# The documentation's own words: "a value of N means the server supports all
# API features introduced before feature level N". So a client cannot know what
# the server does from the URL it is calling, and cannot know it from
# zulip_version either -- that string is a Git reference on any server tracking
# main. It has to call /server_settings first and branch on an integer.
#
# For self-hosted Zulip this is the whole ballgame: two servers on the same
# /api/v1 can be hundreds of feature levels apart.
#
# **A success tells you which of your parameters it ignored, and almost nobody
# reads it.**
#
# Since Zulip 7.0 (feature level 167) a successful response may carry
# `ignored_parameters_unsupported`, an array naming the parameters the endpoint
# did not understand. That is the same hazard the Gitea Recipe in this
# collection records from the other side -- Gitea silently ignores `per_page`
# and then echoes it back in the Link header -- except Zulip says so out loud,
# in the success body, and a client has to look.
#
# It is not universal. Struck live: /server_settings answered
# `?notaparam=1&another=2` with `{"result":"success","msg":""}` and no ignored
# array at all. So the field's absence does not mean everything was understood;
# it means either that or that this endpoint does not report.
#
# **Every response carries result and msg, successes included.**
#
# Struck live, a success:  {"result":"success","msg":"", ...}
# Struck live, a failure:  {"result":"error",
#                           "msg":"Not logged in: API authentication or user session required",
#                           "code":"UNAUTHORIZED"}
#
# `msg` is on both. It is the empty string on success, so truthiness happens to
# work and `"msg" in body` does not discriminate at all. `code` is on the
# failure only, which makes its presence the reliable test -- and it is the one
# a client is least likely to reach for, because `result` reads like the
# obvious discriminator and is a string that has to be compared rather than a
# status that can be branched on.
#
# **The credential is HTTP Basic, and the 401 says so.** Struck live: the
# refusal carries `WWW-Authenticate: Basic realm="zulip"`. The username is the
# user's email address and the password is the API key -- so the credential is
# two values joined by a colon and base64'd, not a token, and a client library
# built around bearer tokens has nowhere to put the email.
#
# **realm_url and realm_uri are both sent, with the same value.** Struck live:
# both answered "https://chat.zulip.org". The spec says realm_uri was
# deprecated in Zulip 9.0 (feature level 257) because "the term URI is
# deprecated in web standards", and realm_url replaced it. Nothing in the
# response marks which is which, so a client written against a server old
# enough to send only realm_uri keeps working until the day it does not.
#
# **is_incompatible is the server's opinion of your client.** A boolean in
# /server_settings meaning "the client that sent this request is deemed
# incompatible with this server", decided from the request. A field about the
# caller, in a response about the server.
#
# **Paging is bidirectional around an anchor, and the anchor is a string.**
# GET /messages takes `anchor`, `num_before` and `num_after`: a position and
# how far to read in each direction. There is no page number and no cursor to
# follow. The anchor's declared type is `string`, and its values are message
# ids -- which are integers -- plus the words `newest`, `oldest` and
# `first_unread`. So the field is a string that is usually a number, and
# arithmetic on it is a type error exactly when it is not.
#
# `narrow` is a JSON-encoded array in a query parameter, which is its own
# escaping problem and is not modelled here.
#
# Known modelling limits, stated rather than discovered later:
#
#   - /server_settings and a messages listing. 119 paths is a chat platform:
#     streams, topics, subscriptions, users, drafts, scheduled messages,
#     reactions, the events queue and the real-time protocol each want their
#     own evidence.
#   - The messages listing here is paged by num_before and num_after around an
#     anchor, and the anchor is served as an integer id. The special words are
#     recorded and not served, because serving "newest" would mean deciding
#     what newest is in a fixture whose order is the fixture's.
#   - `ignored_parameters_unsupported` is served on the messages listing, which
#     is one of the endpoints that reports. It is not served on
#     /server_settings, because that is what the live server did.
#   - The credential is checked for presence and the Basic pair is not
#     decomposed. Zulip's email-as-username is recorded rather than validated.

recipe: zulip
capability: chat
version: 0.1.0

upstream:
  api: "v1"
  docs: https://zulip.com/api/rest
  spec: https://raw.githubusercontent.com/zulip/zulip/main/zerver/openapi/zulip.yaml
  spec_hash: e97f0e56ff3267e5fa3e993d22c55c9fb2589b19bbb8afbb3c663f5fbab07f72
  spec_seen: "2026-09-06"

auth:
  # Not a bearer token. The username is the user's email address and the
  # password is the API key, joined by a colon and base64'd.
  scheme: basic
  # The secret is the password half. Zulip is unusual in that the username
  # half varies too -- it is the user's own email address, not a constant the
  # way Mailgun's "api" is -- so both halves are wrong-able and only one of
  # them is checked here. Stated rather than discovered: a request with the
  # right key and somebody else's email is accepted by this Recipe and
  # refused by Zulip.
  credential: password
  keys:
    - cauldronZulipApiKey0000000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: messages
    # result and msg on every response, successes included.
    fields:
      result: success
      msg: ""
  success:
    fields:
      result: success
      msg: ""
  error:
    style: flat
    message_field: msg
    code_field: code
    fields:
      # Not "error". The string a client has to compare, where every other
      # provider here would have used the status.
      result: error

resources:
  message:
    id:
      style: numeric
      type: number
    fields:
      sender_email:
        type: string
      sender_full_name:
        type: string
      # Zulip's word for a channel. The API still says stream in most places
      # and the product says channel, which is a rename in progress.
      display_recipient:
        type: string
      subject:
        type: string
      content:
        type: string
      # Unix seconds as an integer.
      timestamp:
        type: number
      type:
        type: string
        default: stream

  setting:
    id:
      style: opaque
      field: realm_name
    fields:
      # The integer that actually decides what a client may do.
      zulip_feature_level:
        type: number
      # A release number on a release, and a Git reference on anything
      # tracking main -- so it cannot be compared.
      zulip_version:
        type: string
      realm_name:
        type: string
      # The current spelling.
      realm_url:
        type: string
      # And the deprecated one, carrying the same value. Deprecated in Zulip
      # 9.0, feature level 257, and still sent.
      realm_uri:
        type: string
      # The server's opinion of the caller's client, in a response about the
      # server.
      is_incompatible:
        type: boolean
        default: false
      email_auth_enabled:
        type: boolean
        default: true

routes:
  - method: GET
    path: /api/v1/server_settings
    resource: setting
    operation: list
    # Struck live with no credential: this is the endpoint a client calls
    # before it can authenticate, because it is where the feature level and
    # the authentication methods come from.
    public: true
    # One realm per server, and no identifier anywhere in the path -- the
    # hostname is the organisation. So a listing of one, collapsed.
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    # The envelope, on the route because collapsing a listing of one drops the
    # list's own fields with the list.
    fields:
      result: success
      msg: ""
    pagination:
      style: none

  - method: GET
    path: /api/v1/messages
    resource: message
    operation: list
    pagination:
      # Not modelled, and this is deliberate. Zulip's paging is an anchor plus
      # num_before and num_after: a position, and how far to read outwards in
      # each direction. It is neither offset paging nor cursor paging, and the
      # format has neither shape. Declaring it offset makes the emulator read
      # the anchor -- a message id like 1904489 -- as an offset, which answers
      # an empty page for every real anchor a caller could hold. That is worse
      # than not paging: it teaches a client its correct request is empty.
      #
      # So this route answers the whole fixture, with found_newest and
      # found_oldest both true, which is what Zulip answers when the window
      # covers everything.
      style: none
    list:
      key: messages
      fields:
        # Since feature level 167, a success may name the parameters it did
        # not understand. Empty here because the conformance requests send
        # nothing unsupported; the point is that the key exists at all.
        ignored_parameters_unsupported: []
        # Whether the server promises there is nothing newer than what came
        # back. A client stopping on a short page is not told anything; this
        # is what it should be reading.
        found_newest: true
        found_oldest: true

errors:
  unauthorized:
    status: 401
    code: UNAUTHORIZED
    message: "Not logged in: API authentication or user session required"
    headers:
      # Struck live, and the realm names the product.
      WWW-Authenticate: Basic realm="zulip"
  bad_request:
    status: 400
    code: BAD_REQUEST
    message: "Invalid narrow operator: unknown user"
  rate_limit:
    status: 429
    code: RATE_LIMIT_HIT
    message: "API usage exceeded rate limit"

fixtures:
  empty:
    message: []
    setting: []

  community:
    setting:
      - realm_name: Zulip Community
        # Struck live on 2026-09-06.
        zulip_feature_level: 509
        zulip_version: 12.0-919-gb1bd7d7d3e
        realm_url: https://chat.zulip.org
        # The same value under the deprecated name, which is what the live
        # server sends.
        realm_uri: https://chat.zulip.org
        is_incompatible: false
        email_auth_enabled: true
    message:
      - id: 1904488
        sender_email: cordelia@zulip.com
        sender_full_name: Cordelia Lear
        display_recipient: general
        subject: the anchor is a string
        content: "<p>num_before and num_after read outwards from it.</p>"
        timestamp: 1757150000
        type: stream
      - id: 1904489
        sender_email: hamlet@zulip.com
        sender_full_name: King Hamlet
        display_recipient: general
        subject: the anchor is a string
        content: "<p>And there is no page number anywhere.</p>"
        timestamp: 1757150600
        type: stream

conformance:
  - name: the version that matters is an integer in the body, not in the path
    source: https://chat.zulip.org/api/v1/server_settings
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/server_settings
    expect:
      status: 200
      body:
        # Struck live. The path has said v1 for the life of the product; this
        # is the number that says what the server can do.
        zulip_feature_level: 509
        zulip_version: 12.0-919-gb1bd7d7d3e

  - name: server settings need no credential, because they precede having one
    source: https://chat.zulip.org/api/v1/server_settings
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/server_settings
      headers: {}
    expect:
      status: 200
      body:
        result: success
        # Present on a success, and empty. So truthiness happens to work and
        # testing for the key does not discriminate at all.
        msg: ""
        email_auth_enabled: true

  - name: the canonical URL is sent twice, under two names, one deprecated
    source: https://chat.zulip.org/api/v1/server_settings
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/server_settings
    expect:
      status: 200
      body:
        realm_url: https://chat.zulip.org
        # Deprecated in Zulip 9.0, feature level 257, still sent, and nothing
        # in the response marks it.
        realm_uri: https://chat.zulip.org

  - name: the server states an opinion about the caller's client
    source: https://chat.zulip.org/api/v1/server_settings
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/server_settings
    expect:
      status: 200
      body:
        # A field about the request, in a response about the server.
        is_incompatible: false
        realm_name: Zulip Community

  - name: no credential is a 401 that says how to authenticate
    source: https://chat.zulip.org/api/v1/messages
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      headers: {}
    expect:
      status: 401
      headers:
        # Struck live. Basic, not Bearer: the username is an email address
        # and the password is the API key.
        WWW-Authenticate: Basic realm="zulip"
      body:
        # Struck live, all three fields.
        result: error
        msg: "Not logged in: API authentication or user session required"
        code: UNAUTHORIZED

  - name: a failure adds code, and that is the field that discriminates
    source: https://chat.zulip.org/api/v1/messages
    verified: "2026-09-06"
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      headers: {}
    expect:
      status: 401
      body:
        code: UNAUTHORIZED
      # result is a string to compare and msg is on successes too, so the
      # presence of code is the only cheap test for "did this fail".
      absent:
        - messages

  - name: a listing names the parameters it did not understand
    source: https://raw.githubusercontent.com/zulip/zulip/main/zerver/openapi/zulip.yaml
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      query:
        # Sent because a caller would send them, and not read: see the
        # pagination note on the route. Zulip narrows the window with these;
        # this Recipe answers the whole fixture and says found_newest and
        # found_oldest, which is what Zulip answers when the window covers
        # everything.
        anchor: "1904489"
        num_before: "2"
        num_after: "0"
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb25adWxpcEFwaUtleTAwMDAwMDAwMDAwMDA=
    expect:
      status: 200
      body:
        # New in Zulip 7.0, feature level 167. Empty because this request sent
        # nothing unsupported -- the point is that the key is there to be
        # read, which is what Gitea's silent per_page never gives a client.
        ignored_parameters_unsupported: []
        result: success

  - name: the listing says whether it reached the end, in both directions
    source: https://raw.githubusercontent.com/zulip/zulip/main/zerver/openapi/zulip.yaml
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      query:
        # Sent because a caller would send them, and not read: see the
        # pagination note on the route. Zulip narrows the window with these;
        # this Recipe answers the whole fixture and says found_newest and
        # found_oldest, which is what Zulip answers when the window covers
        # everything.
        anchor: "1904489"
        num_before: "2"
        num_after: "0"
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb25adWxpcEFwaUtleTAwMDAwMDAwMDAwMDA=
    expect:
      status: 200
      body:
        # What a client should stop on. A short page says nothing on its own,
        # because a narrow can filter a page down to fewer than asked for.
        found_newest: true
        found_oldest: true
        'messages[0].id': 1904488

  - name: a message carries the sender inline, not a reference
    source: https://raw.githubusercontent.com/zulip/zulip/main/zerver/openapi/zulip.yaml
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      query:
        # Sent because a caller would send them, and not read: see the
        # pagination note on the route. Zulip narrows the window with these;
        # this Recipe answers the whole fixture and says found_newest and
        # found_oldest, which is what Zulip answers when the window covers
        # everything.
        anchor: "1904489"
        num_before: "2"
        num_after: "0"
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb25adWxpcEFwaUtleTAwMDAwMDAwMDAwMDA=
    expect:
      status: 200
      body:
        'messages[0].sender_email': cordelia@zulip.com
        'messages[0].sender_full_name': Cordelia Lear
        # The channel, under a name that says neither channel nor stream. On a
        # direct message this same key holds an array of users instead, so its
        # type depends on the message.
        'messages[0].display_recipient': general
        # The topic, under the email word for it.
        'messages[0].subject': the anchor is a string
        'messages[0].content': "<p>num_before and num_after read outwards from it.</p>"
        'messages[0].timestamp': 1757150000
        'messages[0].type': stream

  - name: "the rate limit says so in these words"
    source: "https://zulip.com/api/rest-error-handling"
    arm: rate_limit
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb25adWxpcEFwaUtleTAwMDAwMDAwMDAwMDA=
    expect:
      status: 429
      body:
        result: error
        code: RATE_LIMIT_HIT
        msg: "API usage exceeded rate limit"

  - name: "a bad request keeps the same three fields and changes only the code"
    source: "https://zulip.com/api/rest-error-handling"
    arm: bad_request
    fixture: community
    request:
      method: GET
      path: /api/v1/messages
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb25adWxpcEFwaUtleTAwMDAwMDAwMDAwMDA=
    expect:
      status: 400
      body:
        # The same envelope as the 401 and the 429. What moves between them is
        # code, which is the field a client can switch on -- msg is prose and
        # result is "error" for every failure Zulip has.
        result: error
        code: BAD_REQUEST
        msg: "Invalid narrow operator: unknown user"
