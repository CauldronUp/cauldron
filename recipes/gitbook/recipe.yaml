# GitBook Recipe for Cauldron
#
# GitBook is the mirror image of Coda's auth story, and one place that
# mirror cannot be reproduced.
#
# 1. A missing credential and a wrong one are two different failures, with
#    two different statuses.
#
#    Checked against api.gitbook.com/v1/user with no Authorization header:
#
#      HTTP/1.1 403 Forbidden
#      {"error":{"code":403,"message":"This operation requires authentication. Token must be passed in Authorization header"}}
#
#    Checked again with a bearer token that has never been issued:
#
#      HTTP/1.1 401 Unauthorized
#      {"error":{"code":401,"message":"Invalid authentication token"}}
#
#    Opposite of Coda, which was checked the same two ways and answered the
#    identical 401 either way. GitBook tells a caller which of the two
#    things went wrong; Coda does not.
#
# 2. A route that does not exist answers 404 whether or not a credential was
#    ever presented. Checked against /v1/spaces -- which is not itself an
#    endpoint; the real one is /v1/spaces/{spaceId} -- with no
#    Authorization header and again with a wrong one:
#
#      HTTP/1.1 404 Not Found
#      {"error":{"code":404,"message":"API operation not found"}}
#
#    Byte for byte identical both times. Read together with the pair above,
#    the ordering GitBook uses is: does this route exist at all, checked
#    first and regardless of any credential; then, only for a route that
#    does exist, was a credential sent, and was it the right one.
#
# 3. This Recipe cannot reproduce that ordering, and says so rather than
#    picking one behaviour and presenting it as the whole story. Cauldron
#    checks a Recipe's credential before it ever asks its own router
#    whether a path exists -- one fixed order, for every Recipe -- which is
#    backwards from what point 2 just established GitBook does. Concretely:
#
#      - An unauthenticated or wrongly authenticated request to a route this
#        file does not declare answers authentication_error here, where the
#        real API answers 404 unconditionally. Not modelled as a
#        conformance case, because no request shaped that way could pass
#        one.
#      - A single boolean decides authorised() in this engine, so a request
#        with no credential and one with a wrong credential are always the
#        same failure here. GitBook's missing-credential 403 is therefore
#        not reachable at all: authentication_error below can only ever
#        speak for the wrong-credential 401, which is the one case this
#        Recipe verified and the one its conformance suite asserts.
#
#    Stated here rather than discovered later: point 1 above is real and
#    was checked twice, and this Recipe still only serves half of it.
#
# 4. Content is versioned, and nothing in a page says which version answered.
#    /spaces/{spaceId}/content/page/{id} returns a page from the space's
#    live revision; /spaces/{spaceId}/revisions/{revisionId}/page/{id}
#    returns the same page id pinned to a named historical revision. Both
#    operations answer the identical schema, RevisionPage, and neither that
#    schema nor its documentation gives the returned object a field naming
#    which revision produced it. A page fetched one way and cached by its
#    id alone is indistinguishable from the same id fetched the other way,
#    until the content itself is compared field by field -- which is what
#    the two page fixtures below are for: the same page id, a different
#    title and path in each, because the space was edited between the
#    historical revision and the live one.
#
#    Read from the description (https://api.gitbook.com/openapi.json, 259
#    paths) rather than called: both page routes need a real space and a
#    real revision id, and no space was created for this Recipe. Documented
#    rather than verified throughout this section.
#
# 5. Every object that is not a page says what it is: {"object": "user"},
#    {"object": "space"}. Pages do not -- a RevisionPage's discriminator is
#    "type" (document, group, link or computed), and it has no "object" at
#    all, so the convention in point 5 is not universal the way Notion's is.
#
# No rate-limit header was present on any response captured for this
# Recipe, and the description does not attach one to a 429 either.
#
# Known fidelity gap beyond the auth ordering in point 3: page ids,
# space ids and revision ids are documented only as
# EntityId (`^[a-zA-Z0-9_-]+$`), with no fixed length and no prefix. The
# lengths below are this Recipe's own choice, not a shape GitBook has
# published.
#
# Tokens below are fixtures, not secrets.

recipe: gitbook
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://gitbook.com/docs/developers/gitbook-api
  spec: https://api.gitbook.com/openapi.json
  spec_hash: 7cc2c4ce4da6de3927371da71fb5702661d81bcc92afaebeee6cffdc1024cc2e
  spec_seen: "2026-09-01"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-gitbook-token

responses:
  resource:
    style: bare
  list:
    style: wrapped
    key: pages
  error:
    style: nested
    key: error
    code_field: code
    code_type: number
    message_field: message

resources:
  user:
    id:
      style: opaque
      length: 20
    fields:
      displayName:
        type: string
        required: true
      email:
        type: string
    constants:
      object: user

  space:
    id:
      style: opaque
      length: 20
    fields:
      title:
        type: string
        required: true
      visibility:
        type: string
        default: public
      editMode:
        type: string
        default: live
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
    constants:
      object: space

  # The live, current page in a space. Answered by
  # /spaces/{spaceId}/content/page/{id} and, as a flat list, by
  # /spaces/{spaceId}/content/pages. Neither route's response carries a
  # field naming which revision this came from -- "current" is a fact about
  # which URL was called, not about anything in the body.
  page:
    id:
      style: opaque
      length: 20
    fields:
      spaceId:
        type: string
        in: "-"
      title:
        type: string
        required: true
      type:
        type: string
        default: document
      path:
        type: string
      description:
        type: string
      hidden:
        type: boolean
        default: false
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

  # The same page id, pinned to a named historical revision, answered by
  # /spaces/{spaceId}/revisions/{revisionId}/page/{id}. Same schema as page
  # above, same lack of a field saying so -- the two are declared apart here
  # only so this Recipe can seed one id with two different bodies, which is
  # the trap point 4 above describes.
  revision_page:
    id:
      style: opaque
      length: 20
    fields:
      spaceId:
        type: string
        in: "-"
      revisionId:
        type: string
        in: "-"
      title:
        type: string
        required: true
      type:
        type: string
        default: document
      path:
        type: string
      description:
        type: string
      hidden:
        type: boolean
        default: false
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: GET
    path: /user
    resource: user
    operation: get
    id_from: auth

  - method: GET
    path: /spaces/{id}
    resource: space
    operation: get

  # No pagination at all: GitBook's own description answers the complete
  # page tree in one array, however large the space is.
  - method: GET
    path: /spaces/{spaceId}/content/pages
    resource: page
    operation: list
    pagination:
      # The description declares computed and metadata on this route and no
      # paging parameter of any kind, which says more than silence would:
      # the query string was written down and paging is not in it.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
    scope:
      - spaceId

  - method: GET
    path: /spaces/{spaceId}/content/page/{id}
    resource: page
    operation: get
    scope:
      - spaceId

  - method: GET
    path: /spaces/{spaceId}/revisions/{revisionId}/page/{id}
    resource: revision_page
    operation: get
    scope:
      - spaceId
      - revisionId

errors:
  # The wrong-credential half of point 1 above. The missing-credential half
  # -- 403, "This operation requires authentication..." -- was checked just
  # as directly and is not reachable through this engine's single
  # authorised() check; see point 3.
  authentication_error:
    status: 401
    code: 401
    message: Invalid authentication token

  # Checked directly, both without any credential and with a wrong one, and
  # identical both times. Only reachable here with a valid credential and an
  # undeclared path, which was not itself the combination checked -- see
  # point 3.
  unknown_route:
    status: 404
    code: 404
    message: API operation not found

  # The shape -- nested, numeric code, message -- is GitBook's documented
  # Error schema. The wording is this Recipe's own invention, not a string
  # observed from a real "space not found": no space existed to ask about
  # one, and generic REST text was chosen rather than presenting a guess as
  # the provider's own words.
  resource_missing:
    status: 404
    code: 404
    message: Resource not found

fixtures:
  empty: {}

  small-library:
    user:
      - id: u-ada000000000000000
        displayName: Ada Lovelace
        email: ada@cauldron.example

    space:
      - id: sp-cauldron00000000
        title: Cauldron Handbook
        visibility: public
        editMode: live
        createdAt: "2026-01-05T00:00:00Z"
        updatedAt: "2026-08-20T00:00:00Z"

    # The live page: the space was edited since the historical revision
    # below was taken, so the same page id now has a different title and a
    # different path.
    page:
      - id: pg-quickstart000000
        spaceId: sp-cauldron00000000
        title: Quickstart
        type: document
        path: quickstart
        description: Get started in five minutes.
        hidden: false
        createdAt: "2026-01-05T00:00:00Z"
        updatedAt: "2026-08-20T00:00:00Z"

    # The identical page id, pinned to a revision from before the rename.
    # Nothing in either body says which of the two a client is holding.
    revision_page:
      - id: pg-quickstart000000
        spaceId: sp-cauldron00000000
        revisionId: rv-2026060100000000
        title: Getting Started
        type: document
        path: getting-started
        description: ""
        hidden: false
        createdAt: "2026-01-05T00:00:00Z"
        updatedAt: "2026-06-01T00:00:00Z"

conformance:
  - name: a wrong credential is answered nested, with a numeric code
    source: https://api.gitbook.com/v1/user
    verified: "2026-09-01"
    request:
      method: GET
      path: /user
      headers:
        Authorization: Bearer junk-not-real-token-1234567890
    expect:
      status: 401
      body:
        # Unquoted: a JSON number, not the string "401". code is declared an
        # integer and checked directly against a live wrong-token call.
        error.code: 401
        error.message: Invalid authentication token
      absent:
        # Nested, not flat: nothing at the top level.
        - code
        - message

  - name: an undeclared route answers 404, checked with no credential at all
    # This exact request -- no Authorization header, this exact path -- was
    # made against api.gitbook.com and answered the identical 404 below.
    # The same path with a wrong bearer token answered the same thing again,
    # byte for byte. Not marked verified: this engine can only reach
    # unknown_route once a credential has already passed its own check (see
    # point 3 in the header), so the request this case actually sends
    # carries this Recipe's own valid fixture key -- a combination never
    # sent to the real API, even though the wording and status below were
    # both read off it directly.
    source: https://api.gitbook.com/v1/spaces
    request:
      method: GET
      path: /spaces
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 404
      body:
        error.code: 404
        error.message: API operation not found

  - name: every object names itself, except a page
    source: https://api.gitbook.com/openapi.json
    fixture: small-library
    request:
      method: GET
      path: /user
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 200
      body:
        object: user
        displayName: Ada Lovelace
      matches:
        id: '^[a-zA-Z0-9_-]+$'

  - name: a space also names itself
    source: https://api.gitbook.com/openapi.json
    fixture: small-library
    request:
      method: GET
      path: /spaces/sp-cauldron00000000
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 200
      body:
        object: space
        title: Cauldron Handbook
        editMode: live

  - name: the live page is the one the current endpoint answers
    source: https://api.gitbook.com/openapi.json
    fixture: small-library
    request:
      method: GET
      path: /spaces/sp-cauldron00000000/content/page/pg-quickstart000000
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 200
      body:
        title: Quickstart
        path: quickstart
      absent:
        # Not in the schema at all: nothing here says this came from the
        # live revision rather than a historical one.
        - revisionId
        - revision
        - object

  - name: the same page id from a historical revision answers differently
    # The request differs only in which URL was called -- same space, same
    # page id -- and the response is a different title and a different
    # path, because the space was edited between this revision and the live
    # one. Nothing in this body says "historical" either.
    source: https://api.gitbook.com/openapi.json
    fixture: small-library
    request:
      method: GET
      path: /spaces/sp-cauldron00000000/revisions/rv-2026060100000000/page/pg-quickstart000000
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 200
      body:
        title: Getting Started
        path: getting-started
      absent:
        - revisionId
        - revision
        - object

  - name: the page tree answers as one flat array with no pagination at all
    source: https://api.gitbook.com/openapi.json
    fixture: small-library
    request:
      method: GET
      path: /spaces/sp-cauldron00000000/content/pages
      headers:
        Authorization: Bearer cauldron-gitbook-token
    expect:
      status: 200
      body:
        pages[0].title: Quickstart
      absent:
        - items
        - data
        - results
        - nextPageToken
        - cursor
        - total
