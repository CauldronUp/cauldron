# Chatwoot Recipe for Cauldron
#
# Written against Chatwoot's own generated OpenAPI 3.1 document, published in
# its own repository -- github.com/chatwoot/chatwoot, swagger/swagger.json, 92
# paths, version 1.1.0 -- read on 2026-09-06. The two refusals below were
# struck live against app.chatwoot.com the same day, with no account: being
# refused needs no sign-up, which is the point of recording it.
#
# **Two listings, two envelope depths, one API version.**
#
# Contacts answer with the payload at the top:
#
#   {"meta": {...}, "payload": [ ... ]}
#
# Conversations answer with the same two keys one level further down:
#
#   {"data": {"meta": {...}, "payload": [ ... ]}}
#
# Adjacent paths under the same /api/v1/accounts/{account_id} prefix, the same
# document, the same version. `body.payload` reads a list of contacts and
# undefined for conversations, and a helper written to unwrap one of them
# returns undefined rather than throwing.
#
# **And `meta` means two different things.**
#
# On contacts it is pagination: {"count": 42, "current_page": 1}. On
# conversations it is a set of assignment tallies -- mine_count,
# unassigned_count, assigned_count, all_count -- and carries no pagination at
# all. There is no total and no page number in a conversations listing, so a
# client cannot tell how many pages there are; `page` is the only parameter,
# and the only way to learn you have reached the end is to receive a short
# page.
#
# Reading meta.count off a conversations listing is undefined, which arithmetic
# turns into NaN and a progress bar turns into nothing at all.
#
# **current_page is documented as a string or an integer.**
#
# The spec's own type for it is ["string", "integer"]. Not a description of two
# versions -- one field, either type, per response. `meta.current_page + 1` is
# 2 when it arrives as a number and "11" when it arrives as a string, and the
# second is a page request for page eleven.
#
# **Refusals come in two shapes, and neither is the documented one.** Struck
# live on 2026-09-06:
#
#   GET /api/v1/accounts/1/contacts               (no credential)
#   HTTP 401  {"errors":["You need to sign in or sign up before continuing."]}
#
#   GET /api/v1/accounts/1/contacts               (api_access_token: bogus)
#   HTTP 401  {"error":"Invalid Access Token"}
#
# Plural `errors` holding an array of strings when nothing was sent; singular
# `error` holding one string when something was sent and rejected. Same status,
# same endpoint, same second. A client with one error reader gets undefined for
# one of the two, and reports the reason as "undefined" exactly when the
# credential is wrong -- the case it most needs to name.
#
# The spec documents a third shape for failures, bad_request_error:
# {"description": "...", "errors": [ ... ]} where the entries are objects
# rather than strings. Neither 401 uses it.
#
# Neither 401 carries a WWW-Authenticate header.
#
# **One header name, three kinds of credential.**
#
# The spec declares userApiKey, agentBotApiKey and platformAppApiKey. All three
# are `in: header`, and all three are named `api_access_token`. Nothing in the
# request says which kind was sent: the server decides what you may reach by
# looking up the token. So an integration holding the wrong kind is refused per
# endpoint rather than at the door, and the refusal reads as a permission
# problem rather than as the wrong credential.
#
# **message_type is an integer with no name on the wire.**
#
# The enum is 0, 1, 2, 3 -- incoming, outgoing, activity, template -- and the
# response carries the digit. A client filtering out activity messages does it
# by a literal 2 whose meaning lives in the documentation.
#
# **Times are Unix numbers, and a conversation has two of them meaning the
# same thing.** `created_at` and `timestamp` on a conversation carry identical
# descriptions in the spec -- "The time at which conversation was created" --
# so which one is safe to sort by cannot be read off the document.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Contacts and conversations on one account, listed. 92 paths is a help
#     desk: messages, inboxes, agents, teams, labels, canned responses,
#     automation rules and the public per-inbox API each want their own
#     evidence.
#   - The three credential kinds are not told apart. Modelling that would mean
#     inventing which endpoints each may reach, and the spec's per-operation
#     security only names one of them at a time.
#   - The conversations listing is served without pagination metadata because
#     that is what the provider does. It is paged here so the page parameter
#     is real, and the absence of a total is the finding rather than a gap.
#   - meta.current_page is served as an integer. Serving it as sometimes-a-
#     string would make the emulator nondeterministic, which is worse than
#     stating that the provider's type is both.

recipe: chatwoot
capability: support
version: 0.1.0

upstream:
  api: "1.1.0"
  docs: https://developers.chatwoot.com/api-reference/introduction
  spec: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
  spec_hash: b6ebd1e7a3ba50d7c72ad918ffcb9a39891bdf95d4e21c53ee80ef432faec67c
  spec_seen: "2026-09-06"

auth:
  scheme: header
  # Not Authorization, and not a prefix. The same header name carries a user
  # token, an agent-bot token and a platform-app token.
  header: api_access_token
  keys:
    - cauldronChatwootUserToken
  # Nothing sent at all.
  absent_error: not_signed_in
  # Something sent and rejected, which is a different envelope entirely.
  rejected_error: invalid_access_token

responses:
  # Contacts. The conversations route overrides this with its own, one level
  # deeper, because the provider does.
  list:
    style: wrapped
    key: payload
    count_field: meta.count
    page_field: meta.current_page
  error:
    style: flat
    message_field: description

resources:
  contact:
    id:
      style: numeric
      type: number
    fields:
      account_id:
        type: number
        in: "-"
      name:
        type: string
        required: true
      email:
        type: string
      phone_number:
        type: string
      # Present on a contact and absent from a conversation, which is the
      # difference the two listings are worth telling apart by.
      identifier:
        type: string
      blocked:
        type: boolean
        default: false

  conversation:
    id:
      style: numeric
      type: number
    fields:
      account_id:
        type: number
        in: "-"
      # A second identifier, and the one the public per-inbox API addresses a
      # conversation by. The account API's paths take the number.
      uuid:
        type: string
      inbox_id:
        type: number
      status:
        type: string
        default: open
      # Unix seconds as a number, not an RFC 3339 string.
      created_at:
        type: number
      # Documented with the same sentence as created_at, so the spec does not
      # say which of the two is safe to sort by.
      timestamp:
        type: number
      unread_count:
        type: number
        default: 0
      can_reply:
        type: boolean
        default: true
      priority:
        type: string

routes:
  - method: GET
    path: /api/v1/accounts/{account_id}/contacts
    resource: contact
    operation: list
    scope: [account_id]
    pagination:
      style: page
      # The only paging parameter contacts take. There is no page-size
      # parameter in the spec at all.
      limit_param: "-"
      cursor_param: page
      limit: 15
      first_page: 1

  - method: GET
    path: /api/v1/accounts/{account_id}/contacts/{id}
    resource: contact
    operation: get
    scope: [account_id]
    not_found: resource_not_found

  - method: GET
    path: /api/v1/accounts/{account_id}/conversations
    resource: conversation
    operation: list
    scope: [account_id]
    # The same two keys as contacts, one level deeper, on the same API
    # version. This is the whole finding, so it is declared per route rather
    # than smoothed into one Recipe-wide shape.
    list:
      style: wrapped
      key: data.payload
      # No total and no page number, because the provider sends neither.
      count_field: "-"
      page_field: "-"
      # And no count and no page number, because the provider sends neither.
      # What it sends under data.meta instead is a set of assignment tallies,
      # declared as route fields below.
    fields:
      data:
        meta:
          # Not pagination. How many conversations are assigned to you, to
          # nobody, to anybody, and in total -- which is a count of the
          # account rather than of this page, and the only number here that a
          # client could mistake for a total.
          mine_count: 1
          unassigned_count: 1
          assigned_count: 2
          all_count: 3
    pagination:
      style: page
      limit_param: "-"
      cursor_param: page
      limit: 15
      first_page: 1

errors:
  # No credential at all. An array of sentences under a plural key.
  not_signed_in:
    status: 401
    style: string_list
    key: errors
    message: "You need to sign in or sign up before continuing."
  # A credential that was sent and rejected. One string under a singular key,
  # from the same endpoint, with the same status.
  invalid_access_token:
    status: 401
    style: flat
    message_field: error
    message: "Invalid Access Token"
  resource_not_found:
    status: 404
    message: "Resource could not be found"
  rate_limit:
    status: 429
    message: "Rate limit exceeded"

fixtures:
  empty:
    contact: []
    conversation: []

  small-account:
    contact:
      - id: 7
        account_id: 1
        name: Ada Lovelace
        email: ada@example.com
        phone_number: "+15550001111"
        identifier: crm-4412
        blocked: false
      - id: 8
        account_id: 1
        name: Grace Hopper
        email: grace@example.com
        phone_number: "+15550002222"
        identifier: crm-4413
        blocked: false
    conversation:
      - id: 31
        account_id: 1
        uuid: 6f4d2c1a-9b3e-4f5a-8c7d-1e2f3a4b5c6d
        inbox_id: 2
        status: open
        created_at: 1757116800
        timestamp: 1757203200
        unread_count: 3
        can_reply: true
        priority: urgent
      - id: 32
        account_id: 1
        uuid: 7a5e3d2b-0c4f-5a6b-9d8e-2f3a4b5c6d7e
        inbox_id: 2
        status: resolved
        created_at: 1757030400
        timestamp: 1757116800
        unread_count: 0
        can_reply: true
        priority: null
      - id: 33
        account_id: 1
        uuid: 8b6f4e3c-1d5a-6b7c-0e9f-3a4b5c6d7e8f
        inbox_id: 3
        status: pending
        created_at: 1756944000
        timestamp: 1757030400
        unread_count: 1
        can_reply: false
        priority: low

conformance:
  - name: contacts put the payload at the top level
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        'payload[0].id': 7
        'payload[0].name': Ada Lovelace
        'payload[0].email': ada@example.com
        'payload[1].id': 8
        meta:
          # Pagination, on this endpoint and not on the other one.
          count: 2
          current_page: 1
      absent:
        # No data wrapper here, which is the half of the pair a client gets
        # right by accident.
        - data

  - name: conversations put the same two keys one level deeper
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/conversations
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # Same API version, adjacent path, one level further down.
        'data.payload[0].id': 31
        'data.payload[1].id': 32
      absent:
        # The spelling that works on contacts, and the reason a shared
        # unwrapper returns undefined rather than throwing.
        - payload

  - name: a conversations listing carries no total and no page number
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/conversations
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # What is under meta instead: tallies of the account, not of the page.
        # A client reading all_count as a total is reading a number that
        # ignores every filter it just sent.
        'data.meta.all_count': 3
        'data.meta.unassigned_count': 1
      absent:
        # No count. No current_page. There is nothing in a conversations
        # listing that says how many pages there are.
        - data.meta.count
        - data.meta.current_page

  - name: a conversation carries two identifiers and two timestamps
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/conversations
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        'data.payload[0].uuid': 6f4d2c1a-9b3e-4f5a-8c7d-1e2f3a4b5c6d
        # Unix seconds as numbers. Both are described in the spec as the time
        # the conversation was created, and they differ.
        'data.payload[0].created_at': 1757116800
        'data.payload[0].timestamp': 1757203200

  - name: no credential is an array of sentences under a plural key
    source: https://app.chatwoot.com/api/v1/accounts/1/contacts
    verified: "2026-09-06"
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      headers: {}
    expect:
      # Struck live with no account. No WWW-Authenticate.
      status: 401
      body:
        errors:
          - "You need to sign in or sign up before continuing."
      absent_headers:
        - WWW-Authenticate

  - name: a rejected credential is one string under a singular key
    source: https://app.chatwoot.com/api/v1/accounts/1/contacts
    verified: "2026-09-06"
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      headers:
        # Struck live with exactly this shape of value: something present and
        # not valid.
        api_access_token: not-a-real-token
    expect:
      status: 401
      body:
        # Singular, a string, and a different key from the other 401 on the
        # same endpoint one second earlier.
        error: "Invalid Access Token"
      absent:
        - errors

  - name: a contact is fetched by the numeric id
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts/8
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        id: 8
        name: Grace Hopper
        identifier: crm-4413
        blocked: false

  - name: a missing contact is a 404 in the documented shape
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts/99999
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 404
      body:
        description: "Resource could not be found"

  - name: the page parameter is the only one a listing takes
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      query:
        page: "1"
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # And the page number comes back under meta, where the spec types it
        # as a string or an integer.
        'meta.current_page': 1
        'meta.count': 2

  - name: "the rate limit says so in these words"
    source: "https://developers.chatwoot.com/api-reference/introduction"
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 429
      body:
        description: "Rate limit exceeded"

  - name: a conversation status is one of three words, and blocked is a contact field
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/conversations
      query:
        # The conversations listing takes page too, and answers nothing that
        # says which page you got or how many there are.
        page: "1"
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # open, resolved, pending. Not "closed", which is the word every
        # other help desk here uses for the same state -- Zendesk, Front and
        # Help Scout all say closed, and Chatwoot says resolved.
        'data.payload[0].status': open
        'data.payload[1].status': resolved
        'data.payload[2].status': pending
        # And the fields that only exist on one side of the pair.
        'data.payload[0].inbox_id': 2
        'data.payload[0].unread_count': 3
        'data.payload[2].can_reply': false
        'data.payload[0].priority': urgent
      absent:
        # priority is nullable, and the record that has none carries null
        # rather than omitting the key.
        - 'data.payload[3]'

  - name: a second page of contacts continues rather than restarting
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts
      query:
        # The only paging parameter the spec gives a contacts listing. There
        # is no page-size parameter to go with it.
        page: "2"
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # Past the end of two records at fifteen a page, and the count still
        # says how many there are.
        'meta.count': 2
        'meta.current_page': 2
      absent:
        - 'payload[0]'

  - name: a contact carries a phone number and an external identifier
    source: https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/swagger.json
    fixture: small-account
    request:
      method: GET
      path: /api/v1/accounts/1/contacts/7
      headers:
        api_access_token: cauldronChatwootUserToken
    expect:
      status: 200
      body:
        # identifier is the caller's own key for this person, and it is not
        # the id -- so a sync keyed on id cannot be resumed from the other
        # system's records.
        identifier: crm-4412
        phone_number: "+15550001111"
        email: ada@example.com
