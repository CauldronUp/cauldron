# Algolia Recipe for Cauldron
#
# Algolia bills by operation and by record. Every test run that indexes a
# fixture set costs something, and a CI suite that reindexes on each build is a
# line item. The free tier runs out, and when it does the build fails for
# billing reasons rather than code reasons. Teams either share one index
# between developers, so tests interfere, or mock the client entirely and never
# find out that their result handling reads the wrong field.
#
# Two things worth modelling exactly:
#
#   1. Credentials are two headers, and they are not Authorization. Sending a
#      bearer token gets nowhere, and forgetting the application id is a
#      distinct failure from a bad key.
#   2. The identifier is objectID, supplied by the caller rather than minted by
#      Algolia, and hits carry it alongside the record's own fields. Code that
#      reads hit.id finds nothing.
#
# Known fidelity gap, stated rather than hidden: Cauldron does not implement
# search. A query returns the records in the index rather than the ones
# matching the term, so relevance, ranking and highlighting are not modelled.
# What is modelled is the response shape and the failure modes.
#
# Keys below are fixtures, not secrets.

recipe: algolia
capability: search
version: 0.1.0

upstream:
  api: "1"
  docs: https://www.algolia.com/doc/rest-api/search

auth:
  scheme: header
  header: X-Algolia-API-Key
  keys:
    - cauldron-admin-key

# The application id travels in its own header. This file used to claim
# omitting it was a different failure with its own message; struck live, it
# is not -- a request with a correct-looking key and no Application-Id
# header gets the identical "Invalid Application-ID or API key" a bad key
# gets, so this points at the same entry rather than a distinct one.
required_headers:
  X-Algolia-Application-Id: authentication_error

responses:
  list:
    style: wrapped
    count_field: nbHits
    # Algolia reports the page it served and the size it used, and paging
    # code that trusts the response rather than its own counter reads them.
    # They were constants -- 0 and 20 -- so a client that asked for page 3
    # was told it was looking at page 0, by the field whose entire purpose is
    # to say where you are.
    page_field: page
    limit_field: hitsPerPage
    fields:
      processingTimeMS: 1
      exhaustiveNbHits: true
  error:
    style: flat
    message_field: message
    status_field: status

resources:
  record:
    collection: hits
    id:
      # Supplied by the caller in the real API. Cauldron mints one when the
      # caller does not, which is what Algolia does too.
      style: opaque
      field: objectID
      length: 16
    fields:
      index:
        type: string
      name:
        type: string
        required: true
      description:
        type: string
      category:
        type: string
      price:
        type: number
      in_stock:
        type: boolean
        default: true

  index_settings:
    collection: items
    id:
      style: opaque
      length: 16
    fields:
      name:
        type: string
        required: true
      entries:
        type: integer
        default: 0
      dataSize:
        type: integer
        default: 0
      numberOfPendingTasks:
        type: integer
        default: 0

routes:
  # Search is a POST with the query in the body, which is why an API key can
  # sit in a header rather than a URL a browser would cache.
  - method: POST
    path: /1/indexes/{index}/query
    resource: record
    operation: list
    scope: [index]
    pagination:
      # Checked against Algolia's own OpenAPI description. Search pages by
      # page number and hitsPerPage, both in the request body, and the
      # response reports nbPages rather than handing back a cursor.
      style: page
      limit: 20
      limit_param: hitsPerPage
      cursor_param: page
      # Counted from nought, so page 1 is the second page. Read as one-based,
      # a client asking for page 1 is handed page 0 again: the same records
      # twice, no error, and a loop that never reaches the end.
      first_page: 0
      in: body

  # Browse, which is a POST. There is no GET listing at /1/indexes/{index} --
  # Algolia serves only DELETE and POST there -- and this route used to claim
  # one. No conformance case ever used it, which is why a route that would
  # 404 against the real API sat here unnoticed.
  - method: POST
    path: /1/indexes/{index}/browse
    resource: record
    operation: list
    scope: [index]
    # Browse is the only endpoint here that carries a cursor. Search reports
    # nbPages and has none, so a Recipe-wide cursor_field would put a field on
    # every search response that Algolia never sends -- which is why this
    # used to be a stated gap rather than a declaration.
    list:
      cursor_field: cursor
    pagination:
      # Browse is the one endpoint here with a real cursor, and it is called
      # cursor. It is also the only way to walk a whole index: search stops
      # at a thousand hits however you page it.
      style: cursor
      limit: 20
      limit_param: hitsPerPage
      cursor_param: cursor
      in: body

  - method: POST
    path: /1/indexes/{index}
    resource: record
    operation: create
    scope: [index]
    status: 201

  - method: GET
    path: /1/indexes/{index}/{id}
    resource: record
    operation: get
    scope: [index]

  - method: PUT
    path: /1/indexes/{index}/{id}
    resource: record
    operation: update
    scope: [index]

  - method: DELETE
    path: /1/indexes/{index}/{id}
    resource: record
    operation: delete
    scope: [index]

  - method: GET
    path: /1/indexes
    resource: index_settings
    operation: list
    pagination:
      # The index listing takes the same two names in the query string
      # rather than a body, because it is a GET.
      style: page
      limit: 100
      limit_param: hitsPerPage
      cursor_param: page
      first_page: 0

webhooks:
  events: []
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: "429"
    message: Too many requests
    headers:
      Retry-After: "1"

  # Verified live against latency-dsn.algolia.net: the casing here was
  # "Application-Id", and the live host sends "Application-ID". Also
  # verified: this exact message and status are what a missing
  # X-Algolia-Application-Id header gets too, with the key present and
  # correct-looking -- Algolia does not send a distinct message for that
  # case, which the application_id_missing entry below had assumed without
  # a live check. See the case that used to point at it.
  authentication_error:
    status: 403
    code: "403"
    message: Invalid Application-ID or API key

  resource_missing:
    status: 404
    code: "404"
    message: "ObjectID does not exist: {detail}"

  parameter_missing:
    status: 400
    code: "400"
    message: "Invalid body: {detail} is required"

  # The one that ends a CI run: the plan's record or operation quota is spent.
  # Nothing about the request is wrong, and retrying does not help.
  quota_exceeded:
    status: 403
    code: "403"
    message: The record quota for your plan has been reached.

  # An index that has never been written to does not exist, which surprises
  # anyone whose test suite searches before it indexes.
  index_missing:
    status: 404
    code: "404"
    message: Index does not exist

fixtures:
  empty: {}

  small-catalogue:
    record:
      - id: prod-0001
        index: products
        name: Cast iron cauldron
        description: Twelve litres, seasoned
        category: cookware
        price: 89.5
        in_stock: true
      - id: prod-0002
        index: products
        name: Pewter goblet
        category: tableware
        price: 24
        in_stock: false
      # A second index, so scoping is exercised by the fixture rather than
      # only by a hand-written test.
      - id: post-0001
        index: articles
        name: Seasoning cast iron
        category: guides
    index_settings:
      - id: products
        name: products
        entries: 2
      - id: articles
        name: articles
        entries: 1
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: articlesa
        name: articles
        entries: 1

# Conformance cases, read from Algolia's REST API reference rather than
# observed against a live application. The verify report says so.
conformance:
  - name: a request without the application id header is refused
    # Corrected against a live check: this had claimed a distinct message,
    # "Missing Application-Id header", for exactly this request. Struck live
    # against latency-dsn.algolia.net with a correct-looking key and no
    # Application-Id header, Algolia sends the identical generic message a
    # bad key gets -- it does not say which credential was the problem.
    source: https://www.algolia.com/doc/rest-api/search
    verified: "2026-09-05"
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/query
      headers:
        X-Algolia-API-Key: cauldron-admin-key
      json:
        query: cauldron
    expect:
      status: 403
      body:
        status: 403
        message: Invalid Application-ID or API key

  - name: a search answers with hits and a count, not data
    source: https://www.algolia.com/doc/rest-api/search
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/query
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        query: cauldron
    expect:
      status: 200
      body:
        nbHits: 2
        page: 0
        hitsPerPage: 20
        exhaustiveNbHits: true
        hits[0].name: Cast iron cauldron
      absent:
        - data
        - results

  - name: the identifier is objectID, not id
    source: https://www.algolia.com/doc/guides/sending-and-managing-data/prepare-your-data/
    fixture: small-catalogue
    request:
      method: GET
      path: /1/indexes/products/prod-0001
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
    expect:
      status: 200
      body:
        objectID: prod-0001
        name: Cast iron cauldron
        price: 89.5
      # Code reading hit.id finds nothing.
      absent:
        - id

  - name: another index is not searched
    source: https://www.algolia.com/doc/rest-api/search
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/articles/query
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        query: seasoning
    expect:
      status: 200
      body:
        nbHits: 1
        hits[0].name: Seasoning cast iron
      absent:
        - hits[1]

  - name: a bad key is a 403, not a 401
    # Corrected against a live check: the casing here was "Application-Id",
    # and latency-dsn.algolia.net sends "Application-ID".
    source: https://www.algolia.com/doc/guides/security/api-keys/
    verified: "2026-09-05"
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/query
      headers:
        X-Algolia-API-Key: wrong-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        query: cauldron
    expect:
      # Algolia answers 403 where most providers answer 401, so code checking
      # for 401 to refresh a credential never fires.
      status: 403
      body:
        status: 403
      matches:
        message: 'Invalid Application-ID or API key'

  - name: an unknown objectID reports the id it could not find
    source: https://www.algolia.com/doc/rest-api/search
    fixture: small-catalogue
    request:
      method: GET
      path: /1/indexes/products/prod-9999
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
    expect:
      status: 404
      body:
        status: 404
      matches:
        message: 'ObjectID does not exist'
      absent:
        - error
        - errors

  - name: indexing a record answers 201 and mints an objectID
    source: https://www.algolia.com/doc/rest-api/search
    fixture: empty
    request:
      method: POST
      path: /1/indexes/products
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        name: Copper ladle
        category: cookware
    expect:
      status: 201
      body:
        name: Copper ladle
        in_stock: true
        index: products
      matches:
        objectID: '^[A-Za-z0-9]{16}$'

  - name: search pages from nought, in the body
    # Both facts matter and both were wrong. The parameters are hitsPerPage
    # and page and they travel in the request body, so read from the query
    # string neither was there. And Algolia counts pages from nought, so a
    # client asking for page 1 read as one-based is handed page 0 again: the
    # same records twice, no error, and a loop that never reaches the end.
    source: https://raw.githubusercontent.com/algolia/api-clients-automation/main/specs/bundled/search.yml
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/query
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        query: ""
        hitsPerPage: 1
        page: 1
    expect:
      status: 200
      body:
        # The second record, because page 1 is the second page here.
        hits[0].objectID: prod-0002
        # And the response says where it is, rather than saying nought
        # whatever was asked for.
        page: 1
        hitsPerPage: 1
        nbHits: 2
      absent:
        - hits[1]

  - name: browse is a POST, and there is no GET listing to reach for
    # Algolia serves only DELETE and POST at /1/indexes/{index}. This Recipe
    # used to answer a GET there with a listing, which no case exercised and
    # which would 404 against the real API.
    source: https://raw.githubusercontent.com/algolia/api-clients-automation/main/specs/bundled/search.yml
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/browse
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        hitsPerPage: 1
    expect:
      status: 200
      body:
        hits[0].objectID: prod-0001
      absent:
        - hits[1]

  - name: browse carries a cursor and search does not
    # Two listings in one API with different envelopes. Browse is how you
    # walk a whole index and it hands back a cursor to resume from; search
    # reports nbPages and has no cursor at all, so a client that learns one
    # shape here and applies it to the other waits for a cursor that never
    # comes.
    source: https://raw.githubusercontent.com/algolia/api-clients-automation/main/specs/bundled/search.yml
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/browse
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        hitsPerPage: 1
    expect:
      status: 200
      body:
        hits[0].objectID: prod-0001
      matches:
        cursor: '.'
      absent:
        - hits[1]

  - name: a search reports pages, not a cursor
    # The other half of the same claim, and the half a Recipe-wide envelope
    # could not express: declaring a cursor for browse used to mean putting
    # one on every search response, which Algolia never sends.
    source: https://raw.githubusercontent.com/algolia/api-clients-automation/main/specs/bundled/search.yml
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/query
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        query: ""
        hitsPerPage: 1
    expect:
      status: 200
      body:
        page: 0
        nbHits: 2
      absent:
        - cursor

  - name: the browse cursor goes back in the body for the next page
    source: https://raw.githubusercontent.com/algolia/api-clients-automation/main/specs/bundled/search.yml
    fixture: small-catalogue
    request:
      method: POST
      path: /1/indexes/products/browse
      headers:
        X-Algolia-API-Key: cauldron-admin-key
        X-Algolia-Application-Id: CAULDRON01
      json:
        hitsPerPage: 1
        cursor: prod-0001
    expect:
      status: 200
      body:
        # The second record, not the first one over again.
        hits[0].objectID: prod-0002
      absent:
        - hits[1]

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the index_settings listing answers with what the fixture holds"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: GET
      path: "/1/indexes"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "items[0].id": "products"
        "items[1].id": "articles"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # hitsPerPage=1 and page=1, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "hitsPerPage and page are the two names this listing reads"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: GET
      path: "/1/indexes"
      query:
        "hitsPerPage": "1"
        "page": "1"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "items[0].id": "articles"
      absent:
        - "items[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # hitsPerPage=1 and page=1, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "hitsPerPage and page are the two names this listing reads on 1 indexes"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: GET
      path: "/1/indexes"
      query:
        "hitsPerPage": "1"
        "page": "1"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "items[0].id": "articles"
      absent:
        - "items[1]"

  # The names. This Recipe declares 3 field(s) on a index_settings that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 3 name(s) that came back at the paths they came
  # back under.
  - name: "an index_settings carries the field names this Recipe declares"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: GET
      path: "/1/indexes"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "items[0].dataSize": 0
        "items[0].entries": 2
        "items[0].numberOfPendingTasks": 0

  # The names. This Recipe declares 2 field(s) on a record that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a record carries the field names this Recipe declares"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: POST
      path: "/1/indexes/products/query"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "hits[0].category": "cookware"
        "hits[0].description": "Twelve litres, seasoned"

  # The names. This Recipe declares 1 field(s) on an index_settings that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "an index_settings carries the field names this Recipe declares, and 1 more of them"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: small-catalogue
    request:
      method: GET
      path: "/1/indexes"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 200
      body:
        "items[0].name": "products"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://www.algolia.com/doc/rest-api/search"
    arm: rate_limit
    fixture: small-catalogue
    request:
      method: POST
      path: "/1/indexes/products/query"
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 429
      body:
        "message": "Too many requests"
        "status": 429

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for parameter missing and nothing
  # asserted any of them, so the wording could have been changed to
  # anything and every case would have stayed green. This makes the
  # refusal happen -- leaving name out of a create -- and asserts what
  # came back, envelope and all.
  - name: "a create with a required field left out is refused in these words"
    source: "https://www.algolia.com/doc/rest-api/search"
    fixture: empty
    request:
      method: POST
      path: "/1/indexes/products"
      json:
        category: cookware
      headers:
        "X-Algolia-API-Key": "cauldron-admin-key"
        "X-Algolia-Application-Id": "CAULDRON01"
    expect:
      status: 400
      body:
        "message": "Invalid body: name is required"
        "status": 400





