# Box Recipe for Cauldron
#
# Box has a developer sandbox, and it is a separate enterprise with its own
# users, its own quota and its own OAuth app. Getting one is an approval
# process, the token expires after an hour, and a JWT app needs a keypair that
# nobody wants in a test runner. Most integrations end up tested against a real
# corporate account, where a stray delete is a real document gone.
#
# Two things worth modelling exactly:
#
#   1. Every object declares a type, and the type is how you tell a file from a
#      folder in a listing. They share an identifier space in appearance but
#      not in fact: file 12345 and folder 12345 are different things, and code
#      that ignores the type will happily fetch the wrong one.
#   2. The error carries both an HTTP status and a code, and a request id
#      beside them. Support asks for the request id, so an integration that
#      logs only the message has nothing useful to hand over.
#
# Tokens below are fixtures, not secrets.

recipe: box
capability: files
version: 0.1.0

upstream:
  api: "2.0"
  docs: https://developer.box.com/reference
  spec: https://raw.githubusercontent.com/box/box-openapi/main/openapi.json
  spec_hash: 89cd3dc1a0f2f74ee39b34f66d7538cecc8b62eae80f6b78047e9630251de7f7
  spec_seen: "2026-08-30"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_box_token
  # Verified live: no JSON body at all either way -- the failure lives
  # entirely in a WWW-Authenticate header, and it names the two verdicts
  # differently. See the errors and cases below.
  absent_error: token_not_found
  rejected_error: token_invalid

responses:
  list:
    style: wrapped
    count_field: total_count
    # limit echoes the size the request used rather than stating a fixed one.
    # It was the constant 100, so a client asking for ten was handed ten
    # entries and told the page was a hundred -- by the field whose only job
    # is to say how big the page was.
    limit_field: limit
    # And offset echoes where the page started, for the same reason. It was
    # the constant 0, so a client asking for offset=50 was told it was
    # looking at the beginning.
    page_field: offset
  error:
    style: flat
    code_field: code
    message_field: message
    status_field: status
    fields:
      # Box labels the error object itself, the same way it labels every
      # other object it sends.
      type: error
      help_url: https://developer.box.com/guides/api-calls/permissions-and-errors/common-errors/
      request_id: cauldron00000001

resources:
  file:
    collection: entries
    constants:
      type: file
    id:
      style: digits
      length: 12
    fields:
      # Box sends the containing folder as a nested object, not a flat id.
      # This was declared as a flat parent_id and shipped that way, and the
      # conformance cases passed because they asserted the shape the emulator
      # produced. Box's own OpenAPI description is what disagreed.
      parent_id:
        type: string
        in: parent
        as: id
      name:
        type: string
        required: true
      # Box uses etag for optimistic concurrency, and an update without it can
      # silently overwrite somebody else's change.
      etag:
        type: string
        default: "0"
      size:
        type: integer
        default: 0
      sha1:
        type: string
      description:
        type: string
      item_status:
        type: string
        default: active
      created_at:
        type: datetime
      modified_at:
        type: datetime

  folder:
    collection: entries
    constants:
      type: folder
    id:
      style: digits
      length: 12
    fields:
      # Box sends the containing folder as a nested object, not a flat id.
      # This was declared as a flat parent_id and shipped that way, and the
      # conformance cases passed because they asserted the shape the emulator
      # produced. Box's own OpenAPI description is what disagreed.
      parent_id:
        type: string
        in: parent
        as: id
      name:
        type: string
        required: true
      etag:
        type: string
        default: "0"
      size:
        type: integer
        default: 0
      item_status:
        type: string
        default: active
      created_at:
        type: datetime
      modified_at:
        type: datetime

  collaboration:
    collection: entries
    constants:
      type: collaboration
    id:
      style: digits
      length: 12
    fields:
      # Both of these are nested objects on the wire, and both were declared
      # flat. Box's own description is what disagreed; no conformance case
      # could, because every one of them asserted what the emulator produced.
      item_id:
        type: string
        in: item
        as: id
      accessible_by_login:
        type: string
        in: accessible_by
        as: login
      # The role decides whether somebody can delete the thing. Getting it
      # wrong is not visible until they do.
      role:
        type: string
        default: viewer
      status:
        type: string
        default: accepted
      created_at:
        type: datetime

routes:
  - method: GET
    path: /2.0/folders/{parent_id}/items
    resource: file
    operation: list
    scope: [parent_id]
    pagination:
      style: offset
      limit: 100
      # Counted from nought, which offsets are. Without this the echo would
      # report offset 1 on the first page, because a page number starts at
      # one and an offset does not.
      first_page: 0
      # Box's own description declares limit and offset.
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /2.0/files/{id}
    resource: file
    operation: get

  - method: PUT
    path: /2.0/files/{id}
    resource: file
    operation: update

  - method: DELETE
    path: /2.0/files/{id}
    resource: file
    operation: delete
    emits: FILE.DELETED

  - method: GET
    path: /2.0/folders/{id}
    resource: folder
    operation: get

  - method: POST
    path: /2.0/folders
    resource: folder
    operation: create
    emits: FOLDER.CREATED
    status: 201

  - method: GET
    path: /2.0/collaborations
    resource: collaboration
    operation: list
    pagination:
      style: offset
      limit: 100
      # Counted from nought, which offsets are. Without this the echo would
      # report offset 1 on the first page, because a page number starts at
      # one and an offset does not.
      first_page: 0
      # Box's own description declares limit and offset.
      limit_param: limit
      cursor_param: offset

webhooks:
  events:
    - FILE.UPLOADED
    - FILE.DOWNLOADED
    - FILE.TRASHED
    - FILE.DELETED
    - FOLDER.CREATED
    - COLLABORATION.CREATED
    - COLLABORATION.ACCEPTED
  # The top-level type is the literal webhook_event on every delivery and the
  # discriminator is trigger. The record is at source, and it carries a type
  # of its own -- so a payload holds two fields called type meaning different
  # things, and the one that says what happened is called neither.
  payload:
    type: webhook_event
    id: "{id}"
    created_at: "{created_iso}"
    trigger: "{event}"
    webhook:
      id: "1000000000001"
      type: webhook
    created_by:
      type: user
      id: "2000000000001"
      name: Cauldron
    source:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: BOX-SIGNATURE-PRIMARY
    secret: cauldron-webhook-key

errors:
  rate_limit:
    status: 429
    code: rate_limit_exceeded
    message: Request rate limit exceeded, please try again later
    headers:
      Retry-After: "3"

  # Not wired to anything before now -- see the header. Kept as the generic
  # fallback; the two verified entries below are what api.box.com actually
  # sends for the two verdicts this file can tell apart.
  authentication_error:
    status: 401
    code: unauthorized
    message: Unauthorized

  # Verified live against api.box.com with no Authorization header at all:
  # no body at all, Content-Length 0, and the failure lives entirely in this
  # WWW-Authenticate header.
  token_not_found:
    status: 401
    empty: true
    headers:
      WWW-Authenticate: 'Bearer realm="Service", error="invalid_request", error_description="The access token was not found."'

  # Verified live: a present, wrong Bearer token gets the identical empty
  # body and a different WWW-Authenticate header -- error and
  # error_description both change, naming the credential as the problem
  # rather than its absence.
  token_invalid:
    status: 401
    empty: true
    headers:
      WWW-Authenticate: 'Bearer realm="Service", error="invalid_token", error_description="The access token provided is invalid."'

  resource_missing:
    status: 404
    code: not_found
    message: "Not Found: {detail}"

  parameter_missing:
    status: 400
    code: bad_request
    message: "Bad Request: {detail} is required"

  # The failure a corporate account produces and a fresh sandbox never will:
  # the user can see the folder but not write to it.
  access_denied_insufficient_permissions:
    status: 403
    code: access_denied_insufficient_permissions
    message: Access denied, insufficient permission

  # Optimistic concurrency. An update without a matching etag is refused
  # rather than silently overwriting somebody else's change.
  precondition_failed:
    status: 412
    code: precondition_failed
    message: The resource has been modified. Please retrieve it again and retry.

  # Box refuses a name that already exists in the same folder, which is what
  # breaks a retried upload halfway through a batch.
  item_name_in_use:
    status: 409
    code: item_name_in_use
    message: Item with the same name already exists

  storage_limit_exceeded:
    status: 403
    code: storage_limit_exceeded
    message: The account storage limit has been reached

fixtures:
  empty: {}

  small-account:
    folder:
      - id: "100000000001"
        parent_id: "0"
        name: Contracts
        etag: "1"
      - id: "100000000002"
        parent_id: "100000000001"
        name: Signed
    file:
      - id: "200000000001"
        parent_id: "100000000001"
        name: supplier-agreement.pdf
        size: 184320
        sha1: da39a3ee5e6b4b0d3255bfef95601890afd80709
        etag: "3"
      - id: "200000000002"
        parent_id: "100000000001"
        name: nda-template.docx
        size: 24576
        etag: "0"
      - id: "200000000003"
        parent_id: "999999999999"
        name: should-not-appear.txt
        size: 12
    collaboration:
      - id: "300000000001"
        item_id: "100000000001"
        accessible_by_login: ada@example.com
        role: editor
        status: accepted
      - id: "300000000002"
        item_id: "100000000001"
        accessible_by_login: grace@example.com
        # A pending collaboration grants nothing yet. Code that counts it as
        # access shows the wrong sharing state.
        role: viewer
        status: pending
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '300000000003'
        item_id: '100000000001'
        accessible_by_login: grace@example.com
        role: viewer
        status: pending

# Conformance cases, read from Box's API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: and a present, wrong token names the credential instead of its absence
    source: https://api.box.com/2.0/collaborations
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /2.0/collaborations
      headers:
        Authorization: Bearer not-a-real-token
    expect:
      status: 401
      no_body: true
      headers:
        WWW-Authenticate: 'Bearer realm="Service", error="invalid_token", error_description="The access token provided is invalid."'

  - name: a collaboration nests the item and the person it grants
    source: https://developer.box.com/reference/resources/collaboration/
    fixture: small-account
    request:
      method: GET
      path: /2.0/collaborations
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        # Two more that were declared flat and are not. Reading
        # accessible_by_login off a real collaboration finds nothing, and the
        # login is one level down beside a type discriminator.
        entries[0].item.id: "100000000001"
        entries[0].accessible_by.login: ada@example.com
      absent:
        - entries[0].item_id
        - entries[0].accessible_by_login

  - name: the containing folder is an object, not an identifier
    source: https://developer.box.com/reference/resources/file/
    fixture: small-account
    request:
      method: GET
      path: /2.0/files/200000000001
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        # Box sends the parent as a nested object. This Recipe declared a flat
        # parent_id for a year and every case passed, because they all
        # asserted the shape the emulator produced. Box's own OpenAPI
        # description is what disagreed, which is the whole argument for
        # checking a Recipe against one.
        parent.id: "100000000001"
      absent:
        - parent_id

  - name: every object declares its type
    source: https://developer.box.com/reference/resources/file/
    fixture: small-account
    request:
      method: GET
      path: /2.0/files/200000000001
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        type: file
        name: supplier-agreement.pdf
        size: 184320
        etag: "3"

  - name: a folder is a different type in the same identifier space
    source: https://developer.box.com/reference/resources/folder/
    fixture: small-account
    request:
      method: GET
      path: /2.0/folders/100000000001
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        # Code that ignores the type will happily fetch a folder where it
        # expected a file and read a size that means something else.
        type: folder
        name: Contracts

  - name: a listing is wrapped in entries with a total count
    source: https://developer.box.com/reference/get-folders-id-items/
    fixture: small-account
    request:
      method: GET
      path: /2.0/folders/100000000001/items
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        total_count: 2
        offset: 0
        limit: 100
        entries[0].name: supplier-agreement.pdf
        entries[0].type: file
      absent:
        - data
        - entries[2]

  - name: another folder's items are not visible
    source: https://developer.box.com/reference/get-folders-id-items/
    fixture: small-account
    request:
      method: GET
      path: /2.0/folders/999999999999/items
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        total_count: 1
        entries[0].name: should-not-appear.txt
      absent:
        - entries[1]

  - name: the error carries a status, a code and a request id
    source: https://developer.box.com/reference/resources/client-error/
    fixture: small-account
    request:
      method: GET
      path: /2.0/files/999999999999
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 404
      body:
        type: error
        status: 404
        code: not_found
      matches:
        # Support asks for this. An integration that logs only the message
        # has nothing useful to hand over.
        request_id: '^cauldron[0-9]+$'
        message: 'Not Found'
      absent:
        - error
        - errors

  - name: a bad token is refused with the same flat shape
    # Corrected against a live check: this had asserted a flat JSON body
    # with type/status/code. api.box.com sends no body at all for this
    # request -- no Authorization header sent -- and puts the failure
    # entirely in a WWW-Authenticate header instead.
    source: https://developer.box.com/guides/authentication/
    verified: "2026-09-05"
    request:
      method: GET
      path: /2.0/collaborations
    expect:
      status: 401
      no_body: true
      headers:
        WWW-Authenticate: 'Bearer realm="Service", error="invalid_request", error_description="The access token was not found."'

  - name: a pending collaboration grants nothing yet
    source: https://developer.box.com/reference/resources/collaboration/
    fixture: small-account
    request:
      method: GET
      path: /2.0/collaborations
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        entries[0].role: editor
        entries[0].status: accepted
        # Counting this as access shows the wrong sharing state.
        entries[1].status: pending
        entries[1].type: collaboration

  - name: two fields called type, and neither says what happened
    source: https://developer.box.com/guides/webhooks/handle/payload/
    fixture: small-account
    request:
      method: POST
      path: /2.0/folders
      headers:
        Authorization: Bearer cauldron_box_token
      json:
        name: Invoices
        parent:
          id: "100000000001"
    expect:
      status: 201
      webhook:
        event: FOLDER.CREATED
        signature_header: BOX-SIGNATURE-PRIMARY
        body:
          # Says this is a webhook. Constant.
          type: webhook_event
          # Says what happened. Not called type or event.
          trigger: FOLDER.CREATED
          # The folder's own, at the record.
          source.type: folder
          source.name: Invoices
        absent:
          - data
          - data.object

  - name: the limit in the answer is the one that was asked for
    source: https://developer.box.com/guides/api-calls/pagination/offset-based/
    fixture: small-account
    request:
      method: GET
      path: /2.0/folders/100000000001/items
      query:
        limit: "1"
        offset: "1"
      headers:
        Authorization: Bearer cauldron_box_token
    expect:
      status: 200
      body:
        # Both echoed, not fixed. These were the constants 100 and 0, so one
        # entry came back from halfway down a collection under a limit
        # saying a hundred and an offset saying the beginning.
        limit: 1
        offset: 1
      absent:
        - entries[1]

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads on 2.0 collaborations"
    source: "https://developer.box.com/reference/resources/collaboration/"
    fixture: small-account
    request:
      method: GET
      path: "/2.0/collaborations"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron_box_token"
    expect:
      status: 200
      body:
        "entries[0].id": "300000000002"
      absent:
        - "entries[1]"

  # The names. This Recipe declares 1 field(s) on a collaboration that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a collaboration carries the field names this Recipe declares"
    source: "https://developer.box.com/reference/resources/collaboration/"
    fixture: small-account
    request:
      method: GET
      path: "/2.0/collaborations"
      headers:
        "Authorization": "Bearer cauldron_box_token"
    expect:
      status: 200
      body:
        "entries[0].created_at": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 5 field(s) on a file that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a file carries the field names this Recipe declares"
    source: "https://developer.box.com/reference/get-folders-id-items/"
    fixture: small-account
    request:
      method: GET
      path: "/2.0/folders/100000000001/items"
      headers:
        "Authorization": "Bearer cauldron_box_token"
    expect:
      status: 200
      body:
        "entries[0].created_at": "2026-01-01T00:00:00Z"
        "entries[0].item_status": "active"
        "entries[0].modified_at": "2026-01-01T00:00:00Z"
        "entries[0].sha1": "da39a3ee5e6b4b0d3255bfef95601890afd80709"

  # The names. This Recipe declares 3 field(s) on a folder that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a folder carries the field names this Recipe declares"
    source: "https://developer.box.com/reference/resources/folder/"
    fixture: small-account
    request:
      method: GET
      path: "/2.0/folders/100000000001"
      headers:
        "Authorization": "Bearer cauldron_box_token"
    expect:
      status: 200
      body:
        "created_at": "2026-01-01T00:00:00Z"
        "item_status": "active"
        "modified_at": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 3 field(s) on a folder that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a folder carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.box.com/guides/webhooks/handle/payload/"
    fixture: small-account
    request:
      method: POST
      path: "/2.0/folders"
      json:
        name: Invoices
        parent:
          id: '100000000001'
      headers:
        "Authorization": "Bearer cauldron_box_token"
    expect:
      status: 201
      body:
        "id": "677918506041"


