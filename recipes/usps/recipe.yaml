# USPS Recipe for Cauldron
#
# apis.usps.com/tracking/v3 is live, checked directly on 2026-09-02 with no
# credential of any kind, and it is not the newest thing USPS ships. Its own
# published OpenAPI description -- fetched from
# developers.usps.com/sites/default/files/apidoc_specs/tracking_22.yaml,
# version 3.2.8, the file the site's own ReDoc viewer at
# developers.usps.com/trackingv3 renders -- opens with a retirement notice
# for itself: "The Product Tracking and Reporting (PTR) Tracking 3.0 -
# Legacy ... API will be retired July 31, 2027 ... all users should migrate
# to the modernized Tracking v3r2 (PTR 3.2)." So "the newer one at
# apis.usps.com" the task names is itself already the second-newest
# generation, mid-migration to a third this Recipe never probed. What this
# Recipe models is what answers at apis.usps.com/tracking/v3 today, which is
# demonstrably not gone.
#
# Neither is the oldest one. The Web Tools XML API -- the SOAP-era
# predecessor everything newer replaced -- still answers too. Checked live:
# GET https://secure.shippingapis.com/ShippingAPI.dll?API=TrackV2&XML=...
# with a junk USERID answers 200 (not an HTTP error; like UPS's own retired
# XML API elsewhere in this collection, the old USPS API never uses the
# status line to say no) <Error><Number>80040B1A</Number><Description>
# Authorization failure.  Perhaps username and/or password is incorrect.
# </Description>.... Three generations of one tracking API, and this Recipe
# is the only one of the three that was ever going to fit this format: the
# other two answer XML, unconditionally, to every Accept header this Recipe
# tried.
#
# Absent and wrong are not the same failure here, and the line is not where
# it was in Together AI's Recipe elsewhere in this collection -- it is drawn
# by whether the credential's *shape* could be a JWT at all, not by whether
# a prefix is present. Four requests, checked live against
# GET /tracking/v3/tracking/9400111899223197428490:
#
#   no Authorization header at all
#   Authorization: Bearer junktoken12345            (no dots -- not JWT-shaped)
#   Authorization: junktoken12345                    (no "Bearer " either)
#
# all three answered the byte-identical body:
#   {"apiVersion":"/tracking/v3","error":{"code":"401","message":
#   "Missing or malformed access token.","errors":[{"title":"invalid_token",
#   "detail":"The access token presented with the request is missing or
#   malformed (not a JWT).","source":"Access Token"}]}}
#
# while a fourth -- Authorization: Bearer eyJhbGc...(a genuine three-segment,
# base64, header.payload.signature shape, with a real header and payload and
# a fake signature) -- answered a different one:
#   {"apiVersion":"/tracking/v3","error":{"code":"401","message":
#   "The access token presented with the request is invalid.","errors":
#   [{"title":"invalid_token_signature","detail":"The access token signature
#   is not valid.","source":"Access Token"}]}}
#
# Turso's Recipe elsewhere in this collection finds the identical shape of
# split on a completely different provider -- "token contains an invalid
# number of segments" for anything that cannot be split into three, "could
# not parse jwt id" for something that can -- and USPS is the second
# JWT-issuing API in this collection whose check runs the same way: a coarse
# gate on whether the thing you sent could possibly be a JWT, and only past
# that gate does whether it is *your* JWT get asked. Cauldron's own built-in
# credential verdicts cannot express this directly -- Absent, Malformed and
# Rejected are drawn by prefix and by a fixed key list, and a Keys-based
# check would put "junktoken12345" and a genuine fake JWT on the identical
# branch (Rejected), which is exactly the distinction this API does not
# collapse. auth.scheme is none below for the same reason Turso's and
# Census's are: each route names the exact credential shape it answers, so
# the routes reproduce the split Cauldron's own verdict engine cannot.
#
# The credential wall is total, and it does not move for the path, the
# method, or the tracking number. Checked live, every one of these with no
# credential at all:
#
#   GET  /tracking/v3/tracking/9400111899223197428490      -> 401, the body above
#   GET  /tracking/v3/tracking/123                          -> 401, the same body
#   GET  /tracking/v3/tracking/%21%40%23%24                 -> 401, the same body
#   GET  /tracking/v3/nosuchroute                            -> 401, the same body
#   POST /tracking/v3/tracking/9400111899223197428490       -> 401, the same body
#
# A malformed tracking number, a path this Recipe has no route for, and the
# wrong method on a real one are all refused for the identical reason a
# well-formed request with no credential is: nothing about the path, the
# method or the tracking number's shape is ever examined before the
# credential is. That is auth-before-everything, Cauldron's own default, and
# needs no after_routing flag below -- unlike UPS's Recipe elsewhere in this
# collection, which needs the opposite.
#
# It is not total everywhere on this host, and the edge is worth having
# pinned. GET https://apis.usps.com/nosuchapi/v1/foo -- a path under a
# top-level segment this gateway has no API registered for at all, rather
# than an unrouted path *inside* /tracking/v3/ -- answers 404 with zero
# bytes, no apiVersion, no error object, nothing about a credential at all.
# The distinction is not this Recipe's routing table; it is API Gateway's
# own stage routing, one layer beneath the Lambda authoriser that answers
# every case above. A path inside a registered API's prefix reaches the
# authoriser and is refused for its credential; a path outside every
# registered API's prefix never reaches anything this API owns, and answers
# the plain 404 Cauldron's own unmatched-route fallback already produces
# without a route declared for it.
#
# What the credential wall hides is the one distinction the task exists to
# find: what a syntactically valid but never-issued number says, next to a
# malformed one. USPS's own schema says less than UPS's does about there
# being a distinction at all -- trackingNumber is documented as
# {"type": "string"}, no pattern, no minLength, nothing narrower than "text"
# -- so unlike UPS (7-34 characters, documented) or Canada Post (12, 13 or 16
# alphanumeric characters, live-verified elsewhere in this collection), USPS
# never commits itself to a shape a tracking number has to have at all. The
# route documents 404 "Resource Not Found" for a number nobody has issued
# and 400 "Bad Request" for something else -- most plausibly
# destinationZIPCode (pattern: ^\d{5}$, documented) or mailingDate, since
# trackingNumber itself carries no pattern to fail. Both share the same
# ErrorMessage schema the 401 above uses and neither has a worked example
# anywhere in the description, and every live probe this Recipe ran needed
# no shape at all to be refused for its credential first. So this Recipe
# states the two status codes and does not put words into either body:
# no resource_missing, no invalid_request entry below, the same restraint
# UPS's Recipe in this collection takes for the identical reason.
#
# The success shape it can show is thinner than it looks, and its own
# document says so. GET /tracking/{trackingNumber} defaults to
# expand=SUMMARY -- "When ommitted, the tracking summary information is
# returned" -- and TrackingSummary carries no status field of any kind: no
# status, no statusCategory, no code, nothing to switch on except
# eventSummaries, an array of whole prose sentences. status, statusCategory
# and statusSummary all exist, and all three sit on TrackingDetails, reached
# only by asking explicitly for expand=DETAIL. A caller who never sets that
# parameter -- which is every caller who does not already know to ask -- has
# no field to check "is this delivered" against and has to parse a sentence
# instead, the identical trap eventSummaries' own item description confirms:
# "the detailed tracking information from a point in-transit," typed as a
# bare string.
#
# The document's own worked example -- components.examples.TrackingSummary,
# quoted here whole because no other case in this Recipe carries a fuller
# citation -- disagrees with its own schema next to it:
#
#   <TrackSummary> <trackingNumber>9261290485210xxxxxxxxxxxxxx</trackingNumber>
#   <deliveryNotificationDate>2022-06-22</deliveryNotificationDate>
#   <expectedDeliveryDate>2022-06-22</expectedDeliveryDate>
#   <expectedDeliveryTime>string</expectedDeliveryTime>
#   <guaranteedDeliveryDate>2022-06-22</guaranteedDeliveryDate>
#   <EventSummaries> <event>Your item was delivered at the front door or
#   porch at 12:01 pm on June 17, 2022 in FAIRFAX, VA 22032.</event> ...
#   </EventSummaries> </TrackSummary>
#
# deliveryNotificationDate appears in the example and nowhere in
# TrackingSummary's own declared properties -- trackingNumber,
# expectedDeliveryDate, expectedDeliveryTime, guaranteedDeliveryDate,
# eventSummaries, accessControl, and nothing else. And expectedDeliveryTime
# holds the literal word "string" -- not an example time, the placeholder a
# schema-driven example generator leaves when nothing more specific was
# supplied. This Recipe follows the declared schema, not the field the
# example adds outside it, and quotes "string" for what it is: USPS's own
# published document, not a redacted value, and not a mistake made by
# whoever ran this Recipe's probes today.
#
# The auth failure's own envelope disagrees with its own schema too, in the
# opposite direction. ErrorMessage.error.errors[].source is declared as an
# object -- {parameter, example} -- and the live body above sends
# "source": "Access Token", a bare string. A client reading source.parameter
# off a live USPS 401 reads undefined off a property that is not an object
# at all.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - expand=DETAIL and everything it adds -- status, statusCategory,
#     statusSummary, trackingEvents (structured, with GMTTimestamp and
#     GMTOffset as sibling fields, the identical split DHL's Recipe in this
#     collection already documents on a different carrier) -- is real,
#     documented, and not modelled. This Recipe serves the SUMMARY default
#     only, because that is the shape most callers actually receive.
#   - POST /tracking/{trackingNumber}/notifications (email tracking alerts)
#     and the proof-of-delivery routes are real and out of scope. Tracking
#     lookup only.
#   - accessControl -- FREE vs IP_AGREEMENT, whether this lookup was billed
#     -- is declared on TrackingSummary and not modelled: no worked example
#     gives it a value.
#   - destinationZIPCode and mailingDate, the two query parameters this
#     Recipe's probes never sent, are not modelled or enforced.
#   - No rate-limit response was ever seen or is documented for this route.
#   - The old Web Tools API and the newer Tracking v3r2 (PTR 3.2) are both
#     real, both out of scope, and both discussed only in this header -- see
#     above for why.
#
# The tokens below are fixtures and belong to no account.

recipe: usps
capability: shipping
version: 0.1.0

upstream:
  api: v3
  docs: https://developers.usps.com/trackingv3
  spec: https://developers.usps.com/sites/default/files/apidoc_specs/tracking_22.yaml
  provider: usps
  supersedes:
    - version: Web Tools (TrackV2)
      host: secure.shippingapis.com
      note: >-
        Still live, checked 2026-09-02: a junk USERID answers 200 (never an
        HTTP failure) with an XML <Error> body, "Authorization failure.
        Perhaps username and/or password is incorrect." Not modelled: XML,
        not JSON, and this Recipe already has one live host to describe.

auth:
  # Cauldron's own Absent/Malformed/Rejected verdicts cannot separate a
  # non-JWT-shaped credential (grouped with absent) from a JWT-shaped one
  # with a bad signature (its own, different sentence) -- see the header.
  # Every route below names the exact credential shape it answers instead,
  # the same device Turso's Recipe in this collection uses for the
  # identical problem on a different provider.
  scheme: none

responses:
  resource:
    # The 200 body is the TrackingSummary object itself, with no wrapper --
    # neither USPS's JSON nor its XML content type for this route ever
    # nests it under a named key.
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    # "401" is quoted on the wire, checked live -- all digits, and still a
    # string, echoing the HTTP status as text rather than as the number.
    code_type: string
    # apiVersion sits outside the error object, on every failure this
    # Recipe observed.
    fields:
      apiVersion: /tracking/v3

resources:
  tracking:
    id:
      # USPS declares no pattern for this at all -- see the header. Opaque
      # is the honest shape for a field the provider itself never narrows.
      style: opaque
      field: trackingNumber
    fields:
      expectedDeliveryDate:
        type: string
        null_when_unset: true
      # "string" is not a placeholder this Recipe invented -- see the
      # header. It is the literal value in USPS's own published example.
      expectedDeliveryTime:
        type: string
        null_when_unset: true
      guaranteedDeliveryDate:
        type: string
        null_when_unset: true
      # An array of whole sentences, not objects -- see the header. There is
      # no status field anywhere on this shape; this is the only place
      # anything about delivery state is said, and it is prose.
      eventSummaries:
        type: list

routes:
  - method: GET
    path: /tracking/v3/tracking/{id}
    resource: tracking
    operation: get
    matches_header:
      Authorization: Bearer cauldron.usps.fixture.token.eyJzdWIiOiJjYXVsZHJvbiJ9.accepted00000000000000000000

  # The exact value this Recipe sent live: a well-formed three-segment JWT
  # shape (real header, real payload, fake signature) that is not this
  # fixture's token. A route naming matches_header outranks the one that
  # names none, the same rule Turso's and Census's Recipes in this
  # collection already rely on.
  - method: GET
    path: /tracking/v3/tracking/{id}
    matches_header:
      Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiIsImlhdCI6MTIzNDU2Nzg5MH0.fakefakefakefakefakefakefakefakefakefakefakefake
    error: invalid_token_signature

  # No credential at all, or anything that cannot be split into three
  # dot-separated segments, falls to this -- verified live for both.
  - method: GET
    path: /tracking/v3/tracking/{id}
    error: missing_or_malformed_token

  # A wrong method on a real path never reaches a different check -- see the
  # header. Checked live with no credential; the identical body.
  - method: POST
    path: /tracking/v3/tracking/{id}
    error: missing_or_malformed_token

  # A path this Recipe has no route for, still inside the /tracking/v3
  # prefix the real gateway's authoriser guards. Checked live with no
  # credential: the identical body a real path with no credential gets, not
  # a routing-specific 404 -- see the header for the API Gateway edge this
  # is not.
  - method: GET
    path: /tracking/v3/nosuchroute
    error: missing_or_malformed_token

errors:
  # The live, JWT-shaped-but-wrong-signature sentence. Named by the route
  # above rather than by auth.rejected_error, because scheme is none.
  invalid_token_signature:
    status: 401
    code: "401"
    message: The access token presented with the request is invalid.
    fields:
      "error.errors[0].title": invalid_token_signature
      "error.errors[0].detail": The access token signature is not valid.
      # A bare string on the wire, not the {parameter, example} object the
      # schema declares for this property -- see the header.
      "error.errors[0].source": Access Token

  # No credential, or a value that cannot be a JWT at all. Live, and the
  # broader of the two sentences -- see the header.
  missing_or_malformed_token:
    status: 401
    code: "401"
    message: Missing or malformed access token.
    fields:
      "error.errors[0].title": invalid_token
      "error.errors[0].detail": The access token presented with the request is missing or malformed (not a JWT).
      "error.errors[0].source": Access Token

  # A path outside every API this gateway has registered at all -- checked
  # live at /nosuchapi/v1/foo -- never reaches the authoriser above, and
  # answers zero bytes. This is what Cauldron's own fallback already
  # produces for any path this Recipe declares no route for; declared here
  # so the case below can assert it rather than trust the default silently.
  unknown_route:
    status: 404
    empty: true

fixtures:
  empty: {}

  package:
    tracking:
      # Every field is USPS's own published example -- see the header for
      # the schema field deliveryNotificationDate the example carries and
      # this Recipe does not declare, and for why expectedDeliveryTime
      # really does read "string". No account exists to call this route
      # with a real credential, so no case built from this fixture carries
      # a verified date.
      - id: 9261290485210xxxxxxxxxxxxxx
        expectedDeliveryDate: "2022-06-22"
        expectedDeliveryTime: string
        guaranteedDeliveryDate: "2022-06-22"
        eventSummaries:
          - Your item was delivered at the front door or porch at 12:01 pm on June 17, 2022 in FAIRFAX, VA 22032.
          - Out for Delivery, 06/17/2022, 6:10 am, FAIRFAX, VA 22032
          - Arrived at Post Office, 06/16/2022, 2:15 pm, FAIRFAX, VA 22031
          - Accepted at USPS Destination Facility, June 16, 2022, 1:00 pm, FAIRFAX, VA 22031
          - Departed Shipping Partner Facility, USPS Awaiting Item, June 16, 2022, 2:18 am, CHANTILLY, VA 20151

conformance:
  - name: no credential is missing or malformed, the broader sentence
    source: https://apis.usps.com/tracking/v3/tracking/9400111899223197428490
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/tracking/9400111899223197428490
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        apiVersion: /tracking/v3
        error.code: "401"
        error.message: Missing or malformed access token.
        "error.errors[0].title": invalid_token
        "error.errors[0].source": Access Token

  - name: a credential with no dots in it answers the identical sentence
    source: https://apis.usps.com/tracking/v3/tracking/9400111899223197428490
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/tracking/9400111899223197428490
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.message: Missing or malformed access token.
        "error.errors[0].title": invalid_token

  - name: and so does one with no Bearer prefix at all
    source: https://apis.usps.com/tracking/v3/tracking/9400111899223197428490
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/tracking/9400111899223197428490
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        error.message: Missing or malformed access token.

  - name: a JWT-shaped credential fails a different, later check
    # The pair to Turso's Recipe elsewhere in this collection, which finds
    # the identical two-stage shape on a completely different provider.
    source: https://apis.usps.com/tracking/v3/tracking/9400111899223197428490
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/tracking/9400111899223197428490
      headers:
        Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiIsImlhdCI6MTIzNDU2Nzg5MH0.fakefakefakefakefakefakefakefakefakefakefakefake
    expect:
      status: 401
      body:
        error.code: "401"
        error.message: The access token presented with the request is invalid.
        "error.errors[0].title": invalid_token_signature
        "error.errors[0].detail": The access token signature is not valid.

  - name: a malformed tracking number is refused for its credential first, not its shape
    # USPS declares no pattern for trackingNumber at all -- see the header
    # for why this is a different finding from UPS's identical-looking
    # probe (UPS documents a shape rule it likewise never reaches) and from
    # Canada Post's (which reaches its shape rule before the credential).
    source: https://apis.usps.com/tracking/v3/tracking/123
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/tracking/123
    expect:
      status: 401
      body:
        error.message: Missing or malformed access token.

  - name: an unrouted path inside the API's own prefix still reaches the credential gate
    source: https://apis.usps.com/tracking/v3/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /tracking/v3/nosuchroute
    expect:
      status: 401
      body:
        error.message: Missing or malformed access token.

  - name: a wrong method on a real path reaches the identical gate
    source: https://apis.usps.com/tracking/v3/tracking/9400111899223197428490
    verified: "2026-09-02"
    fixture: empty
    request:
      method: POST
      path: /tracking/v3/tracking/9400111899223197428490
    expect:
      status: 401
      body:
        error.message: Missing or malformed access token.

  - name: a path outside every registered API answers plain, empty, credential-blind
    # A different host boundary from the case above -- see the header. Not
    # /tracking/v3/anything: a top-level segment (/nosuchapi) this gateway
    # has no API mounted under at all.
    source: https://apis.usps.com/nosuchapi/v1/foo
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /nosuchapi/v1/foo
    expect:
      status: 404
      no_body: true

  - name: the default view has no status field, only whole sentences
    source: https://developers.usps.com/sites/default/files/apidoc_specs/tracking_22.yaml
    fixture: package
    request:
      method: GET
      path: /tracking/v3/tracking/9261290485210xxxxxxxxxxxxxx
      headers:
        Authorization: Bearer cauldron.usps.fixture.token.eyJzdWIiOiJjYXVsZHJvbiJ9.accepted00000000000000000000
    expect:
      status: 200
      body:
        trackingNumber: 9261290485210xxxxxxxxxxxxxx
        expectedDeliveryDate: "2022-06-22"
        # USPS's own published placeholder, not this Recipe's -- see the
        # header.
        expectedDeliveryTime: string
        "eventSummaries[0]": Your item was delivered at the front door or porch at 12:01 pm on June 17, 2022 in FAIRFAX, VA 22032.
      absent:
        - status
        - statusCategory
        - statusSummary
        - trackingEvents
