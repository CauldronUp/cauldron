# Overseerr Recipe for Cauldron
#
# Written against Overseerr's own OpenAPI 3.0.2 document, published in its own
# repository -- github.com/sct/overseerr, overseerr-api.yml, 134 paths, version
# 1.0.0 -- read on 2026-09-06. Overseerr is self-hosted and there is no public
# instance, so nothing here is verified live: every claim is the provider's own
# document.
#
# **Two fields called status, both integers, overlapping and meaning different
# things.**
#
# A request carries one, and the media it points at carries another:
#
#   MediaRequest.status   1 = PENDING APPROVAL, 2 = APPROVED, 3 = DECLINED
#   MediaInfo.status      1 = UNKNOWN, 2 = PENDING, 3 = PROCESSING,
#                         4 = PARTIALLY_AVAILABLE, 5 = AVAILABLE, 6 = DELETED
#
# The second is nested inside the first: `request.media.status`. So a request
# with `status: 2` -- approved -- routinely contains `media.status: 2`, which is
# pending. Same name, same type, same small integers, one inside the other, and
# a client that reads the wrong one gets a plausible answer.
#
# `status: 3` is DECLINED on the request and PROCESSING on the media. One of
# those is a refusal and the other is work in progress.
#
# **And both examples are a value neither documents.**
#
# `MediaRequest.status` is declared `example: 0`, and its description lists 1, 2
# and 3. `MediaInfo.status` is declared `example: 0`, and its description lists
# 1 through 6. Zero is in neither set.
#
# So the examples in the published document -- the values a mock server, a
# documentation page or a generated fixture will use -- put every record in a
# state that does not exist. And zero is falsy, so code branching on
# `if (request.status)` treats the example as "no status" rather than as
# "impossible".
#
# **The filter is a string vocabulary that matches neither integer set.**
#
# `GET /request` takes `filter`, an enum of: all, approved, available, pending,
# processing, unavailable, failed, deleted, completed.
#
# Nine words. `approved` is a request status; `pending` is both a request status
# and a media status, meaning different things; `available`, `processing` and
# `deleted` are media statuses; and `failed`, `completed` and `unavailable`
# appear in neither list. So a caller filters in one vocabulary, reads back two
# others, and three of the words they can filter by name nothing the records can
# hold.
#
# **The same word is the array and the count of it.**
#
#   {"pageInfo": {"page": 1, "pages": 10, "results": 100},
#    "results": [ ... ]}
#
# `body.results` is the records. `body.pageInfo.results` is how many there are
# altogether. One word, two meanings, four characters apart in the same
# response.
#
# **Paging is take and skip.** TypeORM's names, straight through to the wire --
# not limit and offset, not page and per_page. Both are declared nullable, so
# the document says null is a legal value for how many records you want.
#
# **A session cookie is a documented API credential.** `connect.sid`,
# `in: cookie`, listed beside `X-Api-Key`. That is the second in this collection
# after Immich, and the same consequence: a browser sends it automatically, and
# the document mentions no CSRF token anywhere across 134 paths.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Overseerr is self-hosted and
#     there is no public instance.
#   - Requests, listed and fetched. 134 paths is a request manager: media,
#     users, settings, discovery, the Plex and Radarr and Sonarr integrations
#     and the whole search surface each want their own evidence.
#   - The cookie scheme is recorded and not served. Accepting an ambient
#     credential in local development teaches exactly the habit the finding
#     warns about.
#   - `example: 0` is recorded and not served. Serving a state the provider
#     documents as impossible would be inventing behaviour; what the fixtures
#     hold are values from the documented sets.

recipe: overseerr
capability: media
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://api-docs.overseerr.dev/
  spec: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
  spec_hash: 47d1328673a91fb462dd32147b7af5ebcf80d587afef2e9d9c4d88cd1dad7d8b
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: results
    # The same word again, one level down, meaning the total.
    count_field: pageInfo.results
    page_field: pageInfo.page
    pages_field: pageInfo.pages
  error:
    style: flat
    message_field: message

resources:
  request:
    id:
      style: numeric
      type: number
    fields:
      # 1 PENDING APPROVAL, 2 APPROVED, 3 DECLINED -- and the document's own
      # example for this field is 0.
      status:
        type: number
        default: 1
      # 4K is a separate request, not a property of one: the same film
      # requested in 4K is a different record with its own status.
      is4k:
        type: boolean
        default: false
      requestedBy:
        type: number
        default: 1
      modifiedBy:
        type: number
      serverId:
        type: number
        default: 0
      profileId:
        type: number
        default: 0
      rootFolder:
        type: string
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # The nested record, carrying a second field called status with a
      # different meaning.
      media:

routes:
  - method: GET
    path: /api/v1/request
    resource: request
    operation: list
    pagination:
      style: offset
      # TypeORM's names, straight through to the wire. Both declared nullable.
      limit_param: take
      cursor_param: skip
      limit: 20
    filters:
      - field: requestedBy
        param: requestedBy

  - method: GET
    path: /api/v1/request/{id}
    resource: request
    operation: get
    not_found: not_found

errors:
  unauthorized:
    status: 401
    message: "You do not have permission to access this endpoint."
  not_found:
    status: 404
    message: "Request not found"
  rate_limit:
    status: 429
    message: "Too many requests"

fixtures:
  empty:
    request: []

  queue:
    request:
      - id: 123
        # APPROVED.
        status: 2
        is4k: false
        requestedBy: 1
        modifiedBy: 1
        serverId: 0
        profileId: 6
        rootFolder: /media/movies
        createdAt: "2026-09-01T10:00:27.000Z"
        updatedAt: "2026-09-01T10:04:12.000Z"
        media:
          id: 88
          tmdbId: 27205
          tvdbId: null
          # PENDING. The same integer as the request's APPROVED, one level
          # down, under the same field name.
          status: 2
          createdAt: "2026-09-01T10:00:27.000Z"
          updatedAt: "2026-09-01T10:00:27.000Z"
      - id: 124
        # DECLINED.
        status: 3
        # The 4K request for the same film -- a separate record, not a flag on
        # the one above.
        is4k: true
        requestedBy: 4
        modifiedBy: 1
        serverId: 0
        profileId: 7
        rootFolder: /media/movies-4k
        createdAt: "2026-09-02T18:30:00.000Z"
        updatedAt: "2026-09-02T19:01:44.000Z"
        media:
          id: 88
          tmdbId: 27205
          tvdbId: null
          # AVAILABLE. So a declined request points at media that is already
          # there, which is usually why it was declined.
          status: 5
          createdAt: "2026-09-01T10:00:27.000Z"
          updatedAt: "2026-09-02T12:11:03.000Z"

conformance:
  - name: two fields called status mean different things one level apart
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        # 2 on the request is APPROVED. 2 on the media inside it is PENDING.
        # Same name, same type, one inside the other, and a client reading the
        # wrong one gets a plausible answer rather than an error.
        'results[0].status': 2
        'results[0].media.status': 2
        # And 3 is DECLINED on the request where it is PROCESSING on the
        # media -- a refusal and work in progress at the same integer.
        'results[1].status': 3
        'results[1].media.status': 5

  - name: the same word is the array and the count of it
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        # body.results is the records; body.pageInfo.results is how many there
        # are. One word, two meanings, four characters apart.
        'pageInfo.results': 2
        'pageInfo.page': 1
        'pageInfo.pages': 1
        'results[0].id': 123

  - name: paging is take and skip
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      query:
        # TypeORM's names, straight through to the wire -- not limit and
        # offset, not page and per_page. Both declared nullable, so the
        # document says null is a legal page size.
        take: "1"
        skip: "1"
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        'results[0].id': 124
      absent:
        - 'results[1]'

  - name: a 4K request is a separate record, not a flag
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        # The same film -- tmdbId 27205 -- requested twice, once in 4K, with
        # two ids, two statuses and two root folders. A client that keys
        # requests by tmdbId collapses them and loses one.
        'results[0].is4k': false
        'results[1].is4k': true
        'results[0].media.tmdbId': 27205
        'results[1].media.tmdbId': 27205
        'results[1].rootFolder': /media/movies-4k

  - name: the media identifier is not the request identifier
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request/123
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        # Three identifiers in one response: the request's own, Overseerr's
        # internal media id, and TMDB's. Only the first addresses this
        # endpoint.
        id: 123
        'media.id': 88
        'media.tmdbId': 27205
        # And a nullable one that is null on a film, because tvdb indexes
        # television -- so the field's absence is a genre rather than a gap.
        'media.tvdbId': null

  - name: a request records who asked and who last touched it
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request/124
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        # Two user ids, and they differ on a request somebody else declined --
        # which is the only way to tell an approval from a self-approval.
        requestedBy: 4
        modifiedBy: 1
        profileId: 7
        # Zero, and it is a real server -- Overseerr numbers its Radarr and
        # Sonarr instances from nought, so the falsy value here is the first
        # configured server rather than none.
        serverId: 0
        createdAt: "2026-09-02T18:30:00.000Z"
        updatedAt: "2026-09-02T19:01:44.000Z"

  - name: the requestedBy filter takes a user id
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      query:
        requestedBy: "4"
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 200
      body:
        'results[0].id': 124
      absent:
        - 'results[1]'

  - name: no credential is refused
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      headers: {}
    expect:
      status: 401
      body:
        message: "You do not have permission to access this endpoint."

  - name: a missing request says so in these words
    source: https://raw.githubusercontent.com/sct/overseerr/develop/overseerr-api.yml
    fixture: queue
    request:
      method: GET
      path: /api/v1/request/9999
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 404
      body:
        message: "Request not found"

  - name: "the rate limit says so in these words"
    source: "https://api-docs.overseerr.dev/"
    arm: rate_limit
    fixture: queue
    request:
      method: GET
      path: /api/v1/request
      headers:
        X-Api-Key: MTcyODM5MjAwMDAwMHxjYXVsZHJvbg==
    expect:
      status: 429
      body:
        message: "Too many requests"
