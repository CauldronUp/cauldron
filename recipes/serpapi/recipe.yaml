# SerpApi Recipe for Cauldron
#
# SerpApi does not run its own search engine. It scrapes somebody else's --
# Google by default, and a couple dozen others by name -- so its response
# carries two clocks and two sources where every other Recipe in this group
# has one: SerpApi's own metadata about the scrape it just ran, and the
# engine's own claims embedded inside the page it scraped. search_metadata
# is the first clock, and it is a real one, checked directly against a live
# response today:
#
#   "search_metadata": {
#     "id": "6a9993526c4c0c10b4dd91d4",
#     "status": "Success",
#     "created_at": "2026-09-03 15:33:38 UTC",
#     "processed_at": "2026-09-03 15:33:38 UTC",
#     "google_url": "https://www.google.com/search?q=coffee&...",
#     "total_time_taken": 1.36
#   }
#
# total_time_taken is the rare thing this whole collection was asked to look
# for: a provider that reports how long its own scrape took, in seconds, on
# every response. created_at and processed_at are the crawl clock the brief
# asked each Recipe to place -- and they are a crawl timestamp, not a
# publication one, which is the opposite of Exa's and the same axis Tavily
# has nothing on at all. The second clock, search_information.
# time_taken_displayed, is Google's own claim about its own query time,
# copied out of the scraped page rather than measured by SerpApi -- two
# numbers, in the same response, measuring two different things, and nothing
# in the field names says so.
#
# No account was created and no key was requested, guessed, or used. Every
# case citing a verified date below was sent to serpapi.com directly, with no
# key, an empty one, a wrong one, a POST or DELETE where GET is the only
# documented method, or a path this project invented; SerpApi's own site
# advertises a free trial and this project did not sign up for one.
#
# **A missing key and a wrong one collapse to the same sentence, checked on
# a query built specifically so nothing could have cached it.** No api_key
# parameter at all, and one holding a value nobody issued, both answer:
#
#   401  {"error":"Invalid API key. Your API key should be here:
#         https://serpapi.com/manage-api-key"}
#
# An empty api_key (present, nothing after the equals sign) answers the
# identical body. All three verdicts this project could produce -- absent,
# empty, wrong -- are one sentence, which is the ordinary case in this
# collection and the reason auth.absent_error and auth.rejected_error stay
# undeclared below: naming the same error for both would be a real claim,
# and it is the right one here.
#
# **Routing and method both resolve before the credential does.** POST or
# DELETE where GET is the only method /search has answers 404 with zero
# bytes, credential or none; a path this project invented answers a
# different 404 -- an HTML page -- the same way either side of a credential.
# after_routing is declared, and the two 404s are not the same shape, which
# is its own finding: a wrong method gets nothing at all, and a wrong path
# gets a page. See the fidelity gaps below for why only the first is
# reproduced.
#
# **What actually happened once, and is not modelled, because it cannot be
# reproduced on purpose.** A plain, no-key GET for q=coffee -- picked for
# being about as generic a query as exists, and not drawn from any of
# SerpApi's own documented examples -- answered 200 with a complete,
# genuine Google result set, not a 401. Repeating the identical request
# minutes later answered the same search_metadata.id and the same
# created_at down to the second, with an Age header climbing between calls
# and cf-cache-status turning from MISS to HIT. A single capitalisation
# change (q=Coffee) or one added parameter (device=mobile) broke the hit and
# produced a fresh 200 with a new id, still with no key sent. A query built
# to be one nobody else could plausibly have searched -- a random token
# appended to a nonsense string -- got the ordinary 401 above, every time.
# The read on this, checked and not guessed at: SerpApi fronts its search
# endpoint with a CDN cache (Cache-Control: public, max-age=3600, plainly
# set on purpose, because SerpApi's own documentation says cached searches
# are free and do not count against a plan) and the cache key does not
# include api_key. A request that happens to match a URL some authenticated
# caller already paid to search is served the stored copy to anyone,
# unauthenticated included, complete with that earlier caller's
# search_metadata.created_at -- which makes the crawl clock this Recipe
# exists to praise capable of lying about itself the moment the CDN is
# holding a shared copy of somebody else's search. This is exactly the kind
# of split this collection's brief asked each Recipe to establish -- a live
# fetch versus a cached index entry -- and SerpApi's own product surface
# supplies both halves without either being declared in the response body:
# nothing in the JSON says "this came from the shared cache," only the HTTP
# layer around it does, and only for as long as the cache entry survives.
# It is not modelled as a route or a conformance case, because it depends on
# what some other caller already searched and cannot be made to happen on
# purpose or reversed on purpose; auth.absent_error above is declared from
# the query built specifically to avoid it, which is the deterministic half
# of this provider's behaviour.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The unrouted-path 404 is not served. It is a full Rails HTML error
#     page on the live host -- Content-Type text/html, a real document body
#     -- and reproducing it would mean pinning several kilobytes of
#     framework markup as though it were SerpApi's API, the same call
#     Together's Recipe in this collection makes about its own host's
#     Next.js 404. Only the status is asserted below.
#   - No credits or cost field appears anywhere in the response body this
#     project observed, checked directly on the live no-key 200 above and
#     confirmed absent by name. SerpApi tracks usage on a separate,
#     documented Account API (GET /account.json, which needs a key this
#     project never held) rather than in the search response itself, and
#     that endpoint's own documentation states plainly that calling it "is
#     free of charge, and using it will not be counted toward your monthly
#     quota" -- the same free-and-uncounted framing the search endpoint's
#     own cached-search documentation uses. Cost is tracked account-side, on
#     a schedule the search response never mentions.
#   - Only organic_results is modelled, with title, link and position. A
#     single query can answer with knowledge_graph, local_results,
#     inline_videos, immersive_products, related_questions and more --
#     checked directly, all present on one real response -- the same
#     "sometimes present, and not a property this format can declare of one
#     field" axis Brave's and Serper's Recipes in this collection already
#     name for the identical reason. None of the extra clusters are
#     modelled here.
#   - search_metadata.id, created_at and processed_at are fixed constants
#     below, not freshly generated per call the way the real id is. This
#     format has no mechanism for minting a fresh top-level token outside a
#     resource's own identifier, which Exa's and Tavily's Recipes in this
#     collection both state for their own per-request ids under the same
#     limit.
#   - engine, google_domain, device, location, hl, gl, num and every other
#     documented search parameter besides q are unmodelled; the one route
#     below answers the same fixture whatever else was asked.
#   - No rate-limit header was found on any failure this project checked.

recipe: serpapi
capability: search
version: 0.1.0

upstream:
  api: unversioned
  docs: https://serpapi.com/search-api

auth:
  scheme: query
  param: api_key
  keys:
    - cauldron-serpapi-fixture-key-00000000000
  # See the header: absent, empty and wrong all collapse to one sentence, so
  # this stays undeclared and every verdict falls through to the generic
  # message.
  #
  # Routing and method both resolve before this is ever reached -- verified
  # both ways, with no credential sent at all.
  after_routing: true

responses:
  list:
    style: wrapped
    key: organic_results
  # {"error": "..."} -- one flat field, no code, no type, no envelope key.
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"
  resource:
    style: bare

resources:
  result:
    id:
      # Checked against a live response: organic_results carries no id at
      # all, only a 1-based position, which is what every client actually
      # addresses a result by.
      style: numeric
      field: position
      type: number
    fields:
      title:
        type: string
        required: true
      link:
        type: string
        required: true

routes:
  - method: GET
    path: /search
    resource: result
    operation: list
    pagination:
      # start, and no size that SerpApi documents. From its own search-api
      # page read 2026-09-05: start "defines the result offset. It skips the
      # given number of results. It's used for pagination. (e.g., 0
      # (default) is the first page of results, 10 is the 2nd page of
      # results, 20 is the 3rd page of results, etc.)"
      #
      # That worked example is the interesting part: SerpApi's own
      # illustration of paging steps by **ten**, which is the page size the
      # underlying engine uses rather than one this API lets a caller set.
      # The page has no parameter for the size at all, so "-" says so rather
      # than letting the runtime keep reading "limit".
      #
      # Ten is therefore declared as the size on the strength of SerpApi's
      # own example rather than a stated default -- the one number in this
      # declaration that is inferred, and it is inferred from the provider's
      # arithmetic rather than from the engine's habit.
      style: offset
      limit: 10
      limit_param: "-"
      cursor_param: start
    matches_query:
      q: cauldron search recipe
    fields:
      # Field names checked live -- see the header. Values are this
      # Recipe's own fixture constants, not the live id or timestamp: those
      # belonged to a different query and reusing them here would claim a
      # call that never happened. See the header's stated gap on why these
      # cannot be freshly generated per request.
      search_metadata.id: cau1dr0n0000000000000000
      search_metadata.status: Success
      search_metadata.created_at: "2026-01-05 12:00:00 UTC"
      search_metadata.processed_at: "2026-01-05 12:00:01 UTC"
      search_metadata.total_time_taken: 0.42
      search_parameters.engine: google
      search_parameters.q: cauldron search recipe

errors:
  # The one sentence every credential failure this project could produce
  # answers with, checked on a query built to be uncacheable -- see the
  # header.
  authentication_error:
    status: 401
    message: "Invalid API key. Your API key should be here: https://serpapi.com/manage-api-key"

  # Checked live: a wrong method answers zero bytes, no Allow header, and
  # 404 rather than a real 405. The one route below is conditioned on
  # matches_query, which this runtime's own router treats as saying nothing
  # about which methods the bare path supports (see internal/runtime/
  # router.go's allowedMethods) -- so a mismatched method reaches this same
  # fallback name an unrouted path does, which happens to match: SerpApi's
  # own wrong-method answer really is a routing-shaped refusal, empty rather
  # than worded. See the header for the unrouted-path case, which is 404
  # for the same underlying reason and asserts status alone because its own
  # real body is an HTML page this Recipe does not reproduce.
  unknown_route:
    status: 404
    empty: true

fixtures:
  empty: {}

  results:
    result:
      - id: "1"
        title: "Cauldron: fixtures for API integrations"
        link: https://cauldronup.example/

conformance:
  - name: no key at all, on a query nothing could have cached, is the generic sentence
    # The deterministic half of this provider's auth behaviour -- see the
    # header for the CDN-cache half this project found and deliberately did
    # not try to reproduce as a route.
    source: https://serpapi.com/search?q=cauldronrecipexyz1788450145&engine=google
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search?q=cauldron+search+recipe
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error: "Invalid API key. Your API key should be here: https://serpapi.com/manage-api-key"

  - name: an empty api_key answers the identical sentence
    source: https://serpapi.com/search?q=coffee&engine=google&api_key=
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search?q=cauldron+search+recipe&api_key=
    expect:
      status: 401
      body:
        error: "Invalid API key. Your API key should be here: https://serpapi.com/manage-api-key"

  - name: a key that is merely wrong answers the same sentence again
    source: https://serpapi.com/search?q=coffee&engine=google&api_key=junkkey1234567890
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search?q=cauldron+search+recipe&api_key=junkkey1234567890
    expect:
      status: 401
      body:
        error: "Invalid API key. Your API key should be here: https://serpapi.com/manage-api-key"

  - name: no rate-limit header survives an auth failure
    source: https://serpapi.com/search?q=coffee&engine=google&api_key=junkkey1234567890
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search?q=cauldron+search+recipe&api_key=junkkey1234567890
    expect:
      status: 401
      absent_headers:
        - Retry-After
        - X-RateLimit-Limit
        - X-RateLimit-Remaining

  - name: a wrong method answers zero bytes before any credential is examined
    # POST where GET is the only method /search has, no credential sent at
    # all -- this is what proves the ordering. Checked live: the real body
    # is genuinely empty, which is why no_body is asserted rather than a
    # JSON shape.
    source: https://serpapi.com/search?q=coffee&engine=google
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search?q=cauldron+search+recipe
    expect:
      status: 404
      no_body: true

  - name: and so does a DELETE, still with no credential sent
    source: https://serpapi.com/search?q=coffee&engine=google
    verified: "2026-09-03"
    fixture: results
    request:
      method: DELETE
      path: /search?q=cauldron+search+recipe
    expect:
      status: 404
      no_body: true

  - name: a path this project invented is a 404 the router reaches on its own
    # Checked live, with and without a credential, both answering the
    # identical HTML page -- not reproduced here; see the header. Only the
    # status is asserted, which is the part that was actually checked.
    source: https://serpapi.com/nosuchroute?q=coffee
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /nosuchroute?q=cauldron+search+recipe
    expect:
      status: 404

  - name: search_metadata carries a crawl clock, and its own scrape time, and no cost
    # search_metadata field names and the presence of total_time_taken were
    # checked live, on a different query -- see the header for why the
    # values here are this Recipe's own fixture constants rather than that
    # call's actual id and timestamps. The absence of any credits or cost
    # field was also checked directly on that same live body.
    source: https://serpapi.com/search?q=coffee&engine=google
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search?q=cauldron+search+recipe&api_key=cauldron-serpapi-fixture-key-00000000000
    expect:
      status: 200
      body:
        "search_metadata.status": Success
        "search_metadata.total_time_taken": 0.42
        "search_parameters.q": cauldron search recipe
        "organic_results[0].title": "Cauldron: fixtures for API integrations"
        "organic_results[0].position": 1
      absent:
        - credits
        - cost
        - search_metadata.credits
        - search_metadata.cost
        - usage

  # The position. This route names no page size at all -- limit_param is
  # "-" -- so there is no way to show one, and the pair this generator
  # usually writes is a single case. start=1 answers something the first
  # request did not, which a name nobody read could not produce.
  - name: "start moves the page on for search"
    source: "https://serpapi.com/search?q=coffee&engine=google"
    fixture: results
    request:
      method: GET
      path: "/search"
      query:
        "q": "cauldron search recipe"
        "api_key": "cauldron-serpapi-fixture-key-00000000000"
        "start": "1"
    expect:
      status: 200
      absent:
        - "organic_results[0]"

