          currency: GBP
          value: 80.00
        shippingTotal:
          currency: GBP
          value: 0.00
        discountTotal:
          currency: GBP
          value: 0.00
        # The whole difference between this order and a cancelled one, and it
        # is not in the state.
        refundedTotal:
          currency: GBP
          value: 2.50
        lineItems:
          - id: 585d4975dee9f31a60284a17
            productId: 565c8f3da7c8a3cf71d5fd0b
