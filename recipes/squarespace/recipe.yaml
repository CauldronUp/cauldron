conformance:
  - name: a refund of two pounds fifty puts the order in the same state a full one does
    source: https://developers.squarespace.com/commerce-apis/orders-overview
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders/6a1f77b3ac435e1a051f3c3d
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 200
      body:
        # "a partial refund of any amount sets the order to REFUNDED". The
        # state says the same word for two and a half pounds as it would for
        # four hundred and eighty.
        paymentState: REFUNDED
        # And the arithmetic that tells them apart, which the documentation
        # spells out and the response does not do: "compare the order's
        # refundedTotal with grandTotal".
        "refundedTotal.value": 2.50
        "grandTotal.value": 480.00
        orderNumber: "4"

  - name: and the fully collected order beside it carries a nought rather than nothing
    source: https://developers.squarespace.com/commerce-apis/orders-overview
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders/585d498fdee9f31a60284a37
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 200
      body:
        # The other end of the comparison: a PAID order still sends
        # refundedTotal, so its presence says nothing and only its value
        # does.
        paymentState: PAID
        "refundedTotal.value": 0.00
        "grandTotal.value": 480.00

  - name: the money field sends its currency as a string
    source: https://developers.squarespace.com/commerce-apis/orders
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders/585d498fdee9f31a60284a37
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 200
      body:
        # MonetaryAmount.currency is declared as an object with six
        # properties and every example, including the one attached to that
        # declaration, sends this.
        "grandTotal.currency": GBP
      absent:
        # Not the six properties the schema promises.
        - grandTotal.currency.currencyCode
        - grandTotal.currency.defaultFractionDigits
        - grandTotal.currency.symbol

  - name: the default listing leaves out the payment plan and keeps the test order
    source: https://developers.squarespace.com/commerce-apis/orders-overview
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 200
      body:
        # Three of the four. The default set is the one that existed before
        # Payment Plans did, so the order collecting instalments is absent --
        # and the order nobody was ever charged for is present, because
        # nothing filters on testmode.
        "result[0].orderNumber": "3"
        "result[1].orderNumber": "4"
        "result[2].orderNumber": "6"
        "result[2].testmode": true
        "pagination.hasNextPage": false
      absent:
        - result[3]

  - name: and the payment plan is there when it is asked for by name
    source: https://developers.squarespace.com/commerce-apis/orders-overview
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders?paymentStates=PARTIALLY_PAID
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 200
      body:
        # "To include Payment Plan orders that are mid-collection, pass
        # PARTIALLY_PAID explicitly". A deposit's worth of real money that
        # the default view does not mention.
        "result[0].orderNumber": "5"
        "result[0].paymentState": PARTIALLY_PAID
      absent:
        - result[1]

  - name: an id that could exist and does not is a 404
    source: https://developers.squarespace.com/commerce-apis/orders
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders/000000000000000000000000
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      status: 404
      body:
        message: The requested Order was not found.

  - name: an id that could not exist at all is a 400
    source: https://developers.squarespace.com/commerce-apis/orders
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders/not-an-object-id
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
    expect:
      # "Bad request. The id is not in the expected format." The same
      # question, refused a different way, and the branch an application takes
      # for a typo is not the branch it takes for a deleted order.
      status: 400
      body:
        message: The id is not in the expected format.
        type: INVALID_REQUEST_ERROR

  - name: a request that does not say what is making it is refused
    source: https://developers.squarespace.com/commerce-apis/orders
    fixture: site
    request:
      method: GET
      path: /1.0/commerce/orders
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
    expect:
      # Required on every operation in the schema, with
      # YOUR_CUSTOM_APP_DESCRIPTION as the placeholder. Basecamp does the
      # same, so this is a shared shape rather than a finding.
      status: 400
      body:
        message: The User-Agent header is required.
        subtype: MISSING_ARGUMENT

  - name: fulfilling an order answers nothing at all
    source: https://developers.squarespace.com/commerce-apis/orders
    fixture: site
    request:
      method: POST
      path: /1.0/commerce/orders/585d498fdee9f31a60284a37/fulfillments
      headers:
        Authorization: Bearer cauldron-squarespace-fixture-key
        User-Agent: cauldron-conformance
      json:
        fulfillmentStatus: FULFILLED
        shouldSendNotification: false
    expect:
      # "204 No content. The order was successfully fulfilled." The caller
      # who wants the order back has to go and get it.
      status: 204
      no_body: true
      webhook:
        event: order.update
        signature_header: Squarespace-Signature
        signature: '^[0-9a-f]{64}$'
        body:
          # The id, and nothing about the order. Reading the total off the
          # delivery is not possible against Squarespace and is not possible
