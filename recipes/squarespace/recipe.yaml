            trackingNumber: "103932814692659"
        testmode: false
      # A Payment Plan mid-collection: the deposit is captured, the
      # instalments are not, and the default listing does not contain it.
      - id: 71b0e4c9d3f28a5610cc4d2e
        orderNumber: "5"
        createdOn: "2026-07-20T12:00:00.000Z"
        modifiedOn: "2026-08-20T12:00:00.000Z"
        customerEmail: dwight@example.com
        customerId: 585d498fdee9f31a60284a40
        paymentState: PARTIALLY_PAID
        fulfillmentStatus: PENDING
