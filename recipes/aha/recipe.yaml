# Aha! Recipe for Cauldron
#
# Checked live against secure.aha.io/api/v1 with no account and no
# credential of any kind. Aha! is multi-tenant by subdomain
# (<account>.aha.io) for the product itself, but the API also answers on
# the bare secure.aha.io host, which is what every probe below hit.
#
# Absent, malformed and rejected collapse into one answer, and that answer
# is not JSON. No Authorization header, "Authorization: Bearer
# junktoken12345", and "Authorization: Bearer " with nothing after it all
# answered byte-identical: 401, Content-Type text/html, and zero bytes --
# checked against three different paths (/ideas/1, /features/1,
# /custom_field_definitions) and all nine combinations came back the same.
# The header announces a body it does not send, which is worth pinning on
# its own: a client calling .json() on this throws, and a client checking
# Content-Type first to decide how to parse the failure is told "html" and
# handed nothing to parse at all.
#
# Routing genuinely runs before authentication for a path this host does
# not recognise, and genuinely does not for one it does -- the same split
# Rootly's Recipe in this collection already names: "credential first for
# every path it has, router first for every path it does not." A path with
# no route at all, /ideas/1/no-such-subpath, answers 404 with a branded
# "Aha! | Record not found (404)" HTML page, with or without a credential,
# byte-identical either way (2605 bytes, checked live both ways against
# three separate unrouted paths). A path Aha! *does* route -- including
# DELETE /ideas/1, a real member route this Recipe does not otherwise use --
# still answers the empty 401, not a 404 and not a 405: checked live with no
# credential at all. There is no 405 anywhere on this host either, joining
# Turso and Clio elsewhere in this collection -- every unrouted verb+path
# combination this Recipe tried (PATCH and DELETE on the bare, id-less
# /products collection, which Aha!'s router simply does not register) fell
# to the identical 404 an unknown path gets, not a 405 naming what would
# have worked.
#
# Cauldron's own default -- check the credential first, unconditionally,
# before routing is ever consulted -- reproduces the matched-route rows
# exactly, verified live below. It cannot reproduce the unrouted-path row
# without a credential: an absent credential 401s here before any path is
# examined, so the conformance case demonstrating the 404 shape has to
# carry a valid credential to reach Cauldron's own router-miss handling at
# all, which is a request Aha! itself never needed a credential for. Stated
# rather than forced, the same way Rootly's own Recipe states it.
#
# Custom fields are a flat array, inline on the record, and they answer the
# vocabulary question differently from Clio's answer in this same group.
# GET /ideas/{id} and GET /features/{id} both carry a "custom_fields" array
# straight on the body -- {id, key, name, type, value} per entry -- with no
# separate join and no wrapper object. Where Clio's CustomFieldValue nests a
# *complete copy* of the field's own definition inside every value entry
# (custom_field: {id, name, field_type, ...}, see clio/recipe.yaml), Aha!'s
# entry only ever repeats the id, key, name and type flatly -- there is
# nothing to look up because there is nothing missing, but there is also no
# nested sub-object the way Clio's is. A third shape again from RevenueCat's
# and Adapty's entitlement maps (see revenuecat/recipe.yaml and
# adapty/recipe.yaml): three providers, three ways to carry a value whose
# field was named by whoever bought the product.
#
# There is a schema endpoint -- GET /custom_field_definitions, real,
# documented, and it answers {id, key, name, type,
# custom_fieldable_type} -- and its own "type" is a different vocabulary
# from the one the inline value carries. The worked example in Aha!'s own
# OpenAPI document: a definition's type is
# "CustomFieldDefinitions::SelectConstant", a namespaced Ruby class name;
# the very same account's inline custom_fields entries carry type as a
# plain lowercase word -- "date", "array", "string", "equation_sheet",
# "scorecard", "attachment" (all four of the latter three are in the worked
# feature example below). Code that reads a definition's type and a value's
# type expecting the same string finds two unrelated vocabularies describing
# what is, underneath, the same field. Nothing in either page of Aha!'s
# documentation says so; it is only visible by reading both worked examples
# side by side.
#
# custom_fieldable_type is also the reason two fields that share a name do
# not share an id. The worked examples below have Feature's own
# "expected_completion_date" at id 621325984 and Requirement's
# "expected_completion_date" -- same key, same human name, same declared
# type -- at id 848810602. A schema is not one account-wide table; it is
# one table per record type the field was defined against, which
# custom_field_definitions.custom_fieldable_type is the only field naming.
#
# Ideas, features and requirements are three separate records and only one
# of them is where the answer lives. An Idea keeps its own id, its own vote
# count, and a "feature" reference that appears once it has been promoted
# (PUT /ideas/{id}/promote, documented -- "we strongly suggest...", not
# modelled here, see the fidelity gaps) -- the idea is never replaced by
# the feature, it points at it. A Requirement is never free-standing: every
# worked example carries its own "feature" back-reference, the identical
# {id, name, reference_num, ...} shape the idea's forward reference uses,
# and a Feature's own body carries its requirements nested inline as an
# array, not as a separate fetch. Feature is the record both of the others
# point at and neither Idea nor Requirement is ever nested inside the other
# -- it is where the roadmap and the release actually live, and it is the
# one of the three with no field pointing anywhere further.
#
# Aha!'s own ids are long digit strings sent as JSON strings -- "444379319",
# not 444379319 -- which this format already has a style for (digits,
# Discord's own shape for the same reason: too large to parse safely and
# never meant to be arithmetic).
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists. Every 401 and 404 case below carries a verified
#     date; every 200 case is read from the example embedded in Aha!'s own
#     published OpenAPI document at the URL below and carries none. Every
#     id, key and value quoted in a 200 case is copied from that document
#     verbatim -- none is invented.
#   - This format has no field type for a nested object reference (only
#     string, integer, boolean, timestamp/datetime, list and map). Idea's
#     "feature" back-reference and Requirement's "feature" back-reference
#     are both declared as `map`, this format's free-form type, so the
#     nested object goes out on the wire correctly even though `map` was
#     built for caller-supplied metadata rather than a resource relation.
#     Stated rather than silently relied on.
#   - Of dozens of documented Feature fields (release, epic, initiative,
#     goals, key_results, score_facts, tags, feature_links, workflow_status,
#     and more) only a handful are declared: enough to carry the
#     requirements back-reference and the custom_fields vocabulary finding,
#     not the whole record.
#   - promote, and every create/update/delete route on any resource, is not
#     modelled. This is the read path.
#   - The compact projection GET /ideas (a list) answers with -- {id, name,
#     product_id, votes}, four fields, quite unlike the dozens GET
#     /ideas/{id} answers with -- is documented in Aha!'s own example and
#     not modelled as a route here, to keep this Recipe to the single-record
#     depth the custom-fields and durability questions actually needed.
#   - No spec_hash is recorded, for the reason census/recipe.yaml gives for
#     the same omission: this session has no tooling to compute one against
#     a 3+ MB document and have the figure mean anything to the next reader.

recipe: aha
capability: issues
version: 0.1.0

upstream:
  api: v1
  provider: aha
  docs: https://www.aha.io/api
  spec: https://www.aha.io/openapi.json

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-aha-fixture-key-00000000000000

responses:
  resource:
    style: wrapped
  list:
    style: wrapped
  error:
    # Never reached: every failure below is empty (see authentication_error)
    # or text (see unknown_route). No case exercises a JSON-shaped error on
    # this host, so nothing here was ever observed to justify one.
    style: flat

resources:
  idea:
    collection: ideas
    id:
      style: digits
    fields:
      name:
        type: string
      reference_num:
        type: string
      score:
        type: integer
      votes:
        type: integer
      product_id:
        type: string
      # Null in the worked example: an idea whose status has never changed.
      status_changed_at:
        type: datetime
        null_when_unset: true
      # A nested resource reference -- see the header's fidelity gaps for
      # why this is `map` rather than a dedicated relation type.
      feature:
        type: map
      custom_fields:
        type: list

  feature:
    collection: features
    id:
      style: digits
    fields:
      name:
        type: string
      reference_num:
        type: string
      product_id:
        type: string
      # Requirements nest inline, each carrying its own back-reference to
      # this feature -- see the header. Not a separate resource: nothing in
      # this Recipe fetches a requirement on its own.
      requirements:
        type: list
      custom_fields:
        type: list

  custom_field_definition:
    collection: custom_field_definitions
    id:
      style: digits
    fields:
      key:
        type: string
      name:
        type: string
      # A namespaced Ruby class name, e.g. "CustomFieldDefinitions::
      # SelectConstant" -- a different vocabulary from the lowercase "type"
      # an inline custom_fields value entry carries. See the header.
      type:
        type: string
      internal_name:
        type: string
        null_when_unset: true
      custom_fieldable_type:
        type: string

routes:
  - method: GET
    path: /ideas/{id}
    resource: idea
    operation: get

  - method: GET
    path: /features/{id}
    resource: feature
    operation: get

  - method: GET
    path: /custom_field_definitions
    resource: custom_field_definition
    operation: list

errors:
  # Struck live nine ways -- three credential shapes (absent, garbage
  # bearer, empty bearer) against three paths -- and every one answered
  # this exact body: 401, text/html, zero bytes. Aha! does not tell any of
  # the three verdicts apart, so no per-verdict field is set above and this
  # one entry covers all of them by falling back to the generic name.
  authentication_error:
    status: 401
    empty: true
    headers:
      Content-Type: text/html

  # A path this Recipe does not route. The real page is a full branded HTML
  # document, 2605 bytes; only its distinguishing title is reproduced here
  # rather than the whole page, and the conformance case below asserts on
  # that title with body_matches rather than claiming byte-for-byte
  # fidelity it does not have.
  unknown_route:
    status: 404
    style: text
    message: "Aha! | Record not found (404)"
    headers:
      Content-Type: "text/html; charset=utf-8"

fixtures:
  empty: {}

  # Every value below is copied from the worked example in Aha!'s own
  # OpenAPI document, trimmed to the fields this Recipe declares. None is
  # invented.
  promoted:
    idea:
      - id: "444379319"
        name: Idea 2
        reference_num: PRJ1-I-2
        score: 0
        votes: 2
        product_id: "131414752"
        status_changed_at: null
        feature:
          id: "1007868956"
          name: Feature 1
          reference_num: PRJ1-1
          created_at: "2019-01-01T00:00:00.000Z"
          product_id: "131414752"
          url: https://company.aha.io/features/PRJ1-1
          resource: https://company.aha.io/api/v1/features/PRJ1-1
        custom_fields: []

    feature:
      - id: "1007868956"
        name: Feature 1
        reference_num: PRJ1-1
        product_id: "131414752"
        requirements:
          - id: "483368544"
            name: Body of requirement 1
            reference_num: PRJ1-1-1
            feature:
              id: "1007868956"
              name: Feature 1
              reference_num: PRJ1-1
              created_at: "2019-01-01T00:00:00.000Z"
              product_id: "131414752"
              url: https://company.aha.io/features/PRJ1-1
              resource: https://company.aha.io/api/v1/features/PRJ1-1
            custom_fields:
              - id: 848810602
                key: expected_completion_date
                name: Expected completion date
                type: date
                value: "2019-01-01"
              - id: 731808726
                key: requested_by
                name: Requested By
                type: string
                value: TK
        custom_fields:
          - id: 621325984
            key: expected_completion_date
            name: Expected completion date
            type: date
            value: "2019-01-01"
          - id: 876543219
            key: reviewers
            name: Reviewers
            type: array
            value:
              - "689956296"
            full_value:
              - id: "689956296"
                name: Henry Humpty
                email: no-reply@aha.io

    custom_field_definition:
      - id: "581360680"
        key: priority
        name: Priority
        type: "CustomFieldDefinitions::SelectConstant"
        internal_name: null
        custom_fieldable_type: Feature

conformance:
  - name: no credential at all answers 401 with an empty body under a text/html header, on the idea route
    source: https://secure.aha.io/api/v1/ideas/1
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /ideas/1
    expect:
      status: 401
      headers:
        Content-Type: text/html
      no_body: true

  - name: a garbage bearer token answers the identical empty body -- absent and rejected are the same failure here
    source: https://secure.aha.io/api/v1/features/1
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /features/1
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      headers:
        Content-Type: text/html
      no_body: true

  - name: an empty bearer value answers the same empty body too, on the schema endpoint
    source: https://secure.aha.io/api/v1/custom_field_definitions
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /custom_field_definitions
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      headers:
        Content-Type: text/html
      no_body: true

  - name: a route this host genuinely has -- DELETE on a real idea -- still requires a credential, not a 405
    source: https://secure.aha.io/api/v1/ideas/1
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /ideas/1
    expect:
      status: 401
      no_body: true

  - name: a path this Recipe never routes answers a branded 404 page -- reached here with a credential the live request never needed, see the header
    source: https://secure.aha.io/api/v1/ideas/1/no-such-subpath
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /ideas/1/no-such-subpath
      headers:
        Authorization: Bearer cauldron-aha-fixture-key-00000000000000
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "Record not found \\(404\\)"

  - name: an idea carries a feature reference once promoted, and its own custom_fields stays empty in this example
    source: https://www.aha.io/openapi.json
    fixture: promoted
    request:
      method: GET
      path: /ideas/444379319
      headers:
        Authorization: Bearer cauldron-aha-fixture-key-00000000000000
    expect:
      status: 200
      body:
        idea.id: "444379319"
        idea.feature.id: "1007868956"
        idea.feature.reference_num: PRJ1-1
        idea.custom_fields: []

  - name: a feature carries its requirements inline, each one referencing the feature back
    source: https://www.aha.io/openapi.json
    fixture: promoted
    request:
      method: GET
      path: /features/1007868956
      headers:
        Authorization: Bearer cauldron-aha-fixture-key-00000000000000
    expect:
      status: 200
      body:
        feature.id: "1007868956"
        feature.requirements[0].id: "483368544"
        feature.requirements[0].feature.id: "1007868956"

  - name: the same field name on two record types is two different ids -- Feature's expected_completion_date is not Requirement's
    source: https://www.aha.io/openapi.json
    fixture: promoted
    request:
      method: GET
      path: /features/1007868956
      headers:
        Authorization: Bearer cauldron-aha-fixture-key-00000000000000
    expect:
      status: 200
      body:
        feature.custom_fields[0].id: 621325984
        feature.custom_fields[0].key: expected_completion_date
        feature.requirements[0].custom_fields[0].id: 848810602
        feature.requirements[0].custom_fields[0].key: expected_completion_date

  - name: the schema endpoint's own type vocabulary is not the value's -- a namespaced class name, not a lowercase word
    source: https://www.aha.io/openapi.json
    fixture: promoted
    request:
      method: GET
      path: /custom_field_definitions
      headers:
        Authorization: Bearer cauldron-aha-fixture-key-00000000000000
    expect:
      status: 200
      body:
        custom_field_definitions[0].type: "CustomFieldDefinitions::SelectConstant"
        custom_field_definitions[0].custom_fieldable_type: Feature
