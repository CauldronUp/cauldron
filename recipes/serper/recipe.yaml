# Serper Recipe for Cauldron
#
# Serper answers one endpoint with as many as a dozen top-level keys, and
# which ones show up is a property of the query, not the route. A captured
# real response for "Apple Inc." (cited below, not this project's own call)
# carries searchParameters, knowledgeGraph, organic, images, peopleAlsoAsk,
# relatedSearches and credits, all in one body; a captured response for
# "Lion" with type=images carries searchParameters, images and credits and
# nothing else. Same endpoint, same shape of envelope, a different subset of
# keys every time -- which is exactly the case this collection did not have
# one of yet, and see the vocabulary note below for what the format can and
# cannot say about it.
#
# No account was created and no key was requested, guessed, or used. Every
# case citing a verified date below was sent to google.serper.dev directly,
# with no key, a junk one, a GET where the documented method is POST, or a
# path this project invented; Serper's own site advertises a free tier and
# this project did not sign up for one.
#
# **Two different sentences, one status code.** No X-API-KEY at all:
#
#   403  {"message":"Unauthorized. Sign up for a free account.","statusCode":403}
#
# A key that is present and simply wrong, checked directly:
#
#   403  {"message":"Unauthorized.","statusCode":403}
#
# Both 403. A client written to branch on status alone cannot tell "you sent
# nothing" from "you sent something wrong" -- the sentence is the only
# difference, and Serper's own statusCode field inside the body only ever
# repeats the status line, so it cannot help either.
#
# **The gate does not care what you sent it, only whether you sent a key.**
# Checked directly four ways -- POST with a body, GET with no body, GET with
# the query string carrying q instead of a JSON body, and a path this
# project made up (/searchXYZ, /totally/bogus/path) -- and every one of them
# answers the identical pair above, keyed only on whether X-API-KEY was
# present and non-empty. Method, path and body are not inspected until after
# the key is. And an explicitly empty header (X-API-KEY: with nothing after
# the colon) answers byte for byte the same as the header never being sent at
# all, checked directly both ways.
#
# **THE GATE NOW FITS auth.scheme, WHICH IT NEVER ACTUALLY NEEDED TO WAIT
# FOR ROUTE-SCOPED CREDENTIALS TO FIT.** An earlier version of this comment
# said a single scheme produces one failure, citing ScrapingBee's Recipe for
# the same claim -- and that was wrong about this codebase, not just stale:
# auth.absent_error and auth.rejected_error name the two different
# sentences a single scheme's two different verdicts raise, and both fields
# predate route-scoped credentials by a wide margin. Declared below as
# scheme: header, header: X-API-KEY, with absent_error and rejected_error
# naming missing_api_key and invalid_api_key respectively, this Recipe's
# gate is the ordinary Recipe-wide auth block every other Recipe here uses,
# not a routing trick standing in for one. Go's own header lookup answers ""
# for a header that was never sent and one sent empty alike, which is what
# makes "an explicitly empty header answers byte for byte the same as no
# header" true here for free, by the same construction postscript/
# recipe.yaml's Authorization check relies on, rather than something a
# matches_header route had to be written to reproduce.
#
# This closes a second, real gap along with the cosmetic one: Cauldron
# checks the credential before it resolves a route by default, so a
# genuinely unrouted path -- not just /searchXYZ, which the old routes-only
# version had to declare a fake route for to reach the same gate, but any
# path this project could invent -- now hits the identical 403 the real
# host answers, because nothing here has to be routed to reach it. The old
# version's own comment on that route said plainly that it was reproduced
# "not because Cauldron models a general 'any path reaches the same gate'
# rule" -- now it does, because that is what the Recipe-wide credential
# check ahead of routing already means.
#
# **The vocabulary question this Recipe exists to raise.** Nothing in this
# format's field types, list styles or id styles can say "this top-level key
# is present only for some queries" as a property of the response shape
# itself -- only routes compose into different answers, the same limit
# Brave's Recipe in this collection names for the same reason. What is
# reachable is matching on the request instead: selects_body reads a marker
# word anywhere in the JSON body Serper is sent, the same mechanism Gemini's
# Recipe uses to choose between a blocked and an ordinary reply. Two routes
# below share the path and the method and differ only in whether the request
# carries that marker, so one answers organic and credits alone and the
# other answers those two plus knowledgeGraph, answerBox, peopleAlsoAsk and
# relatedSearches together. That models two points on an axis with far more
# than two positions on it -- the captured "Lion" response above carries
# images and neither knowledgeGraph nor answerBox nor organic at all, a third
# shape this Recipe does not attempt -- and nothing here claims the two
# routes below are the only two shapes Serper sends.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron does not implement search, the same gap Algolia's Recipe
#     states for the same reason. Both routes answer with the same two
#     fixture organic results whatever the query text says; what changes is
#     only whether knowledgeGraph and its companions ride beside them, chosen
#     by a marker word rather than by anything a ranking engine decided.
#   - Only the plain web endpoint is modelled. Serper documents -- and a
#     maintained tool wrapper's own configuration confirms at least
#     /search and /scholar as distinct paths on the same host -- separate
#     endpoints mirroring Google's other tabs. This project did not
#     independently confirm the exact paths for more than those two, and
#     none beyond /search are modelled here.
#   - An organic result here carries only title, link, snippet and position.
#     A captured real response (cited below) shows a sitelinks array on some
#     entries and a date on others, present on some organic results and not
#     others within the very same response -- a second, deeper axis of
#     "sometimes present" this Recipe does not attempt, on top of the
#     top-level one it does.
#   - knowledgeGraph here carries title, type, website, description and
#     attributes. The same captured response shows imageUrl,
#     descriptionSource and descriptionLink beside them, unmodelled.
#   - gl, hl, num, page, autocorrect and every other optional request
#     parameter are unmodelled; both routes answer the same fixture whatever
#     else was asked, and searchParameters echoes only the query text and a
#     result count rather than the whole request.
#   - Running out of credits is documented in prose by third parties as a
#     distinct "billing error", and no source this project could read states
#     an exact status or body for it, so it is not modelled at all rather
#     than guessed at.

recipe: serper
capability: search
version: 0.1.0

upstream:
  api: unversioned
  docs: https://serper.dev

auth:
  # See the header comment: the real gate is an ordinary single scheme,
  # X-API-KEY, checked before routing (Cauldron's default, unchanged here).
  # Its two verdicts get their own sentence apiece below rather than the
  # generic authentication_error, which is what makes the routes below able
  # to stay plain resource routes instead of a credential-matching device.
  scheme: header
  header: X-API-KEY
  keys:
    - cauldron-serper-fixture-0000000000000000
  absent_error: missing_api_key
  rejected_error: invalid_api_key

responses:
  list:
    style: wrapped
    key: organic
    fields:
      # Present on every captured response this project could find, missing
      # or wrong key included.
      credits: 1
  error:
    style: flat
    message_field: message
    # Echoes the HTTP status inside the body, the same convention Twilio uses
    # this field for elsewhere in this collection -- and here it never
    # disagrees with the status line, so it cannot be used to tell the two
    # failures apart either.
    status_field: statusCode
  resource:
    style: bare

resources:
  result:
    id:
      style: numeric
      field: position
      type: number
    fields:
      title:
        type: string
        required: true
      link:
        type: string
        required: true
      snippet:
        type: string

routes:
  # A query with nothing in it this Recipe reads as a trigger for the plain
  # shape. Organic and credits only. Credential checking happens ahead of
  # routing -- see the auth block above -- so this route names nothing about
  # X-API-KEY at all; a request that reaches here has already been judged.
  - method: POST
    path: /search
    resource: result
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05. Serper publishes its reference behind a sign-
    # in: serper.dev serves example response bodies with no request schema
    # at all, docs.serper.dev does not resolve, and google.serper.dev
    # answers 403 to an unauthenticated request for a description. The
    # playground page that would show the request shape is a cookie banner
    # to anything that is not a browser.
    #
    # Serper is widely used with num and page in the request body, and
    # "widely used" is not a source. Nothing is declared, and both routes
    # keep the engine's guess with this note beside them.
    list:
      fields:
        searchParameters.q: cauldron search recipe
        searchParameters.num: 10

  # The same path, and a query carrying the one marker this Recipe answers
  # with a knowledge panel and its usual companions. Real Serper decides
  # this from the query's own content and this project cannot -- see the
  # header comment -- so a literal marker stands in for that judgement.
  - method: POST
    path: /search
    resource: result
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05. Serper publishes its reference behind a sign-
    # in: serper.dev serves example response bodies with no request schema
    # at all, docs.serper.dev does not resolve, and google.serper.dev
    # answers 403 to an unauthenticated request for a description. The
    # playground page that would show the request shape is a cookie banner
    # to anything that is not a browser.
    #
    # Serper is widely used with num and page in the request body, and
    # "widely used" is not a source. Nothing is declared, and both routes
    # keep the engine's guess with this note beside them.
    selects_body: cauldronknowledgegraph
    list:
      fields:
        searchParameters.q: cauldronknowledgegraph headquarters
        searchParameters.num: 10
        knowledgeGraph:
          title: Cauldron
          type: Open source project
          website: https://example.com/cauldron
          description: An emulator that models what a provider actually sends.
          attributes:
            Founded: "2026"
            License: MIT
        answerBox:
          snippet: Cauldron models what a provider actually sends, not what its docs promise.
        peopleAlsoAsk:
          - question: What is Cauldron?
            snippet: An emulator that models real wire behaviour.
            title: Cauldron overview
            link: https://example.com/cauldron/about
        relatedSearches:
          - query: cauldron recipe format
          - query: cauldron conformance testing

errors:
  missing_api_key:
    status: 403
    message: "Unauthorized. Sign up for a free account."
    headers:
      # Checked directly: Google Cloud's own framing, not a plain
      # application/json the way Brave's Recipe in this collection sends.
      Content-Type: application/json; charset=utf-8

  invalid_api_key:
    status: 403
    message: "Unauthorized."
    headers:
      Content-Type: application/json; charset=utf-8

fixtures:
  empty: {}

  results:
    result:
      - id: "1"
        title: "Cauldron: fixtures for API integrations"
        link: https://cauldronup.example/
        snippet: An emulator that models what a provider actually sends.
      - id: "2"
        title: Cauldron on GitHub
        link: https://github.com/example/cauldron
        snippet: Source and documentation.

conformance:
  - name: no key at all is refused with an invitation to sign up
    source: https://google.serper.dev/search
    verified: "2026-09-01"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Content-Type: application/json
      json:
        q: cauldron search recipe
    expect:
      status: 403
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        message: "Unauthorized. Sign up for a free account."
        statusCode: 403

  - name: an empty key header answers byte for byte the same as no header
    source: https://google.serper.dev/search
    verified: "2026-09-01"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        X-API-KEY: ""
      json:
        q: cauldron search recipe
    expect:
      status: 403
      body:
        message: "Unauthorized. Sign up for a free account."

  - name: a key that is merely wrong is a shorter, different sentence
    source: https://google.serper.dev/search
    verified: "2026-09-01"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        X-API-KEY: junkkey1234567890
      json:
        q: cauldron search recipe
    expect:
      status: 403
      body:
        message: Unauthorized.
        statusCode: 403

  - name: GET where POST is documented reaches the identical gate
    source: https://google.serper.dev/search
    verified: "2026-09-01"
    fixture: results
    request:
      method: GET
      path: /search
    expect:
      status: 403
      body:
        message: "Unauthorized. Sign up for a free account."

  - name: and a wrong key on that same GET answers the wrong-key shape
    source: https://google.serper.dev/search
    verified: "2026-09-01"
    fixture: results
    request:
      method: GET
      path: /search
      headers:
        X-API-KEY: junkkey1234567890
    expect:
      status: 403
      body:
        message: Unauthorized.

  - name: a path this project invented hits the same gate as the real one
    # No route named /searchXYZ exists below -- the credential check runs
    # ahead of routing (the auth block's default, see the header), so this
    # is not a path Cauldron had to be told about to answer this way. Any
    # invented path reaches the identical gate now, matching what was
    # actually checked live: /searchXYZ here and /totally/bogus/path in the
    # header comment, both unmodelled as routes, both answering this.
    source: https://google.serper.dev/searchXYZ
    verified: "2026-09-01"
    fixture: results
    request:
      method: POST
      path: /searchXYZ
      json:
        q: cauldron search recipe
    expect:
      status: 403
      body:
        message: "Unauthorized. Sign up for a free account."

  - name: and the same invented path answers the wrong-key shape too
    source: https://google.serper.dev/searchXYZ
    verified: "2026-09-01"
    fixture: results
    request:
      method: POST
      path: /searchXYZ
      headers:
        X-API-KEY: junkkey1234567890
      json:
        q: cauldron search recipe
    expect:
      status: 403
      body:
        message: Unauthorized.

  - name: organic results carry a position and credits is always spent
    source: https://github.com/varun2430/aws_rag/blob/main/docs/google_serper.md
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        X-API-KEY: cauldron-serper-fixture-0000000000000000
      json:
        q: cauldron search recipe
    expect:
      status: 200
      body:
        "organic[0].title": "Cauldron: fixtures for API integrations"
        "organic[0].position": 1
        "searchParameters.q": cauldron search recipe
        credits: 1
      absent:
        # A plain query with no marker for any of them.
        - knowledgeGraph
        - answerBox
        - peopleAlsoAsk
        - relatedSearches

  - name: a query that reads as an entity carries a knowledge panel beside organic
    source: https://github.com/varun2430/aws_rag/blob/main/docs/google_serper.md
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        X-API-KEY: cauldron-serper-fixture-0000000000000000
      json:
        q: cauldronknowledgegraph headquarters
    expect:
      status: 200
      body:
        "knowledgeGraph.title": Cauldron
        "knowledgeGraph.type": Open source project
        "answerBox.snippet": Cauldron models what a provider actually sends, not what its docs promise.
        "peopleAlsoAsk[0].question": What is Cauldron?
        "relatedSearches[0].query": cauldron recipe format
        "organic[0].title": "Cauldron: fixtures for API integrations"
        credits: 1

  # The names. This Recipe declares 1 field(s) on a result that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a result carries the field names this Recipe declares"
    source: "https://github.com/varun2430/aws_rag/blob/main/docs/google_serper.md"
    fixture: results
    request:
      method: POST
      path: "/search"
      headers:
        "X-API-KEY": "cauldron-serper-fixture-0000000000000000"
    expect:
      status: 200
      body:
        "organic[0].link": "https://cauldronup.example/"

