# Casdoor Recipe for Cauldron
#
# Written against Casdoor's own generated Swagger 2.0 document, published in its
# own repository -- github.com/casdoor/casdoor, swagger/swagger.json, 234 paths,
# version 1.503.0 -- read on 2026-09-06. Casdoor is self-hosted and there is no
# public instance, so nothing here is verified live: every claim is the
# provider's own document.
#
# **The user schema declares a password, a salt and a TOTP secret, and the
# document uses `writeOnly` nowhere.**
#
# `object.User` has 181 properties. Among them:
#
#   password              accessSecret          totpSecret
#   passwordSalt          accessToken           originalToken
#   passwordType          accessKey             originalRefreshToken
#
# `GET /api/get-user` declares `object.User` as its 200 response schema, and
# `writeOnly` -- OpenAPI's way of saying "may be sent, is never returned" --
# appears zero times in 350 kilobytes of JSON.
#
# So as published, the document says a user fetch returns that user's password,
# their password salt, their TOTP secret and three tokens. On an identity
# provider. A generated client's `User` type carries all nine; a logged response
# body carries them; a cache holds them.
#
# **This is a claim about the document, not about the running server.** Casdoor
# may well strip these in the handler -- most do -- and there is no public
# instance to check against, so this Recipe does not claim it either way. What
# is checkable is what the document says, and the document says they are
# returned. The Coolify Recipe in this collection records the same shape on a
# platform API; Exoscale records the opposite, one correct `writeOnly` hiding
# firewall rules.
#
# **Deletion is a POST to a path whose name says delete.**
#
#   POST /api/delete-user
#   POST /api/delete-application
#   POST /api/delete-cert
#
# Twenty-eight `delete-*` paths, every one of them POST. The verb lives in the
# path and the method disagrees with it, so a reviewer grepping a codebase for
# `DELETE` finds nothing, a proxy rule that treats DELETE specially never fires,
# and an audit that classifies requests by method files every deletion as a
# write.
#
# The `get-*` paths are GET and the `add-`, `update-` and `delete-` paths are
# POST -- so the method is redundant with the path name on 104 endpoints and
# contradicts it on 28.
#
# **The response envelope has three numbered payload slots.**
#
#   controllers.Response:
#     status  string
#     msg     string
#     data    "support string, struct or []struct"
#     data2   "support string, struct or []struct"
#     data3   "support string, struct or []struct"
#
# `data`, `data2` and `data3`, each with the same description and no type. Which
# one holds what depends on the endpoint, and the document does not say for any
# of them. A generated client gets three untyped fields named by position.
#
# **And `status` is a string in the body.** Not the HTTP status -- a separate
# word, `"ok"` or `"error"`, carried at 200. So a failure is a success as far as
# the transport is concerned, and the discriminator is a string that has to be
# compared.
#
# **The document ships two definitions the generator produced by accident:**
#
#   "232967.<nil>.string"
#   "233025.string.string"
#
# Schema names containing a line number, a Go nil and a type name. `<nil>` is not
# a legal identifier fragment anywhere, and a generator that turns schema names
# into types has to invent something for both.
#
# **One Casdoor serves many issuers.** Beside `/.well-known/openid-configuration`
# there is `/.well-known/{application}/openid-configuration`, and the same for
# JWKS and WebFinger -- so the OIDC discovery document depends on which
# application is asking, and a client that fetches the unqualified one gets a
# different issuer from the one it was configured for.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Casdoor is self-hosted and
#     there is no public instance.
#   - Users, listed and fetched. 234 paths is an identity provider:
#     applications, organisations, providers, tokens, certs, enforcers, groups,
#     roles, permissions, the OIDC surface and the Casbin adapter each want
#     their own evidence.
#   - The secret-shaped fields are served with obvious placeholders, never
#     plausible values. What is reproduced is that the keys are on a response,
#     which is the finding; a realistic-looking hash would make the fixture
#     worth redacting.
#   - Nine of the 181 user fields are modelled, so this Recipe badly understates
#     how much a user record carries.

recipe: casdoor
capability: auth
version: 0.1.0

upstream:
  api: "1.503.0"
  docs: https://casdoor.org/docs/basic/public-api
  spec: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
  spec_hash: fd534487c1bc51904bf9a40c326ce832d67cc7e476c7af1abb7f574aa75371fe
  spec_seen: "2026-09-06"

auth:
  scheme: header
  # An apiKey in the Authorization header. Casdoor accepts `Bearer <token>` and
  # `Basic <clientId:clientSecret>` here, and the document declares neither
  # prefix -- only the header name.
  header: Authorization
  keys:
    - Bearer cauldron-casdoor-token
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: data
    # The count travels in the second slot, because the first holds the
    # records. Which slot means what is per endpoint and undocumented.
    count_field: data2
  error:
    style: flat
    message_field: msg
    fields:
      # A string in the body, not the HTTP status.
      status: error

resources:
  user:
    id:
      style: opaque
      field: name
    fields:
      # Casdoor scopes every record by organisation, and `owner` is that
      # organisation's name -- so the identifier of a user is really the pair
      # (owner, name), and only one half is in the path.
      owner:
        type: string
      displayName:
        type: string
      email:
        type: string
      isAdmin:
        type: boolean
        default: false
      isForbidden:
        type: boolean
        default: false
      # Declared on the response schema, in a document that uses writeOnly
      # nowhere. The values here are placeholders.
      password:
        type: string
      passwordSalt:
        type: string
      totpSecret:
        type: string
      accessSecret:
        type: string
      createdTime:
        type: string

routes:
  - method: GET
    path: /api/get-users
    resource: user
    operation: list
    pagination:
      style: none
    filters:
      # The organisation, which is half the identifier of every record and
      # arrives as a query parameter rather than a path segment.
      - field: owner
        param: owner

  - method: GET
    path: /api/get-user
    resource: user
    operation: get
    # The identifier is a query parameter, because the path is the method name.
    id_from: query:name
    not_found: not_found

  # Deletion, as a POST, at a path whose name says delete.
  - method: POST
    path: /api/delete-user
    resource: user
    operation: delete
    id_from: body:name
    not_found: not_found
    # 200 with a body, not 204 with none: the same envelope every other
    # endpoint answers with, carrying the word "ok" as data.
    status: 200
    deleted_body: receipt
    fields:
      status: ok
      msg: ""
      data: ok

errors:
  unauthorized:
    status: 401
    message: "please login first"
    fields:
      status: error
  not_found:
    status: 200
    message: "the user does not exist"
    fields:
      # A failure at HTTP 200, discriminated by a string in the body -- so
      # every "did that work" check on the transport says yes.
      status: error
  invalid:
    status: 200
    message: "parameter organization is missing"
    fields:
      status: error
  rate_limit:
    status: 429
    message: "too many requests"
    fields:
      status: error

fixtures:
  empty:
    user: []

  directory:
    user:
      - name: admin
        owner: built-in
        displayName: Admin
        email: admin@example.com
        isAdmin: true
        isForbidden: false
        # Obvious placeholders, never plausible values. The finding is that
        # the keys are declared on the response schema at all.
        password: PLACEHOLDER-NOT-A-SECRET
        passwordSalt: PLACEHOLDER-NOT-A-SECRET
        totpSecret: PLACEHOLDER-NOT-A-SECRET
        accessSecret: PLACEHOLDER-NOT-A-SECRET
        createdTime: "2026-01-04T09:00:00Z"
      - name: cauldron
        owner: built-in
        displayName: Cauldron
        email: cauldron@example.com
        isAdmin: false
        # Forbidden, which is a separate axis from admin -- so a record can be
        # neither, either or both, and nothing collapses them into a role.
        isForbidden: true
        password: PLACEHOLDER-NOT-A-SECRET
        passwordSalt: PLACEHOLDER-NOT-A-SECRET
        totpSecret: ""
        accessSecret: ""
        createdTime: "2026-06-18T14:31:00Z"

conformance:
  - name: the user schema declares the secrets on a response
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-user
      query:
        name: admin
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        # object.User has 181 properties and GET /api/get-user declares it as
        # the 200 schema. writeOnly appears zero times in 350 kilobytes, so
        # nothing in the document distinguishes a secret you send from one you
        # get back -- on an identity provider.
        #
        # The values are placeholders. The finding is the keys.
        password: PLACEHOLDER-NOT-A-SECRET
        passwordSalt: PLACEHOLDER-NOT-A-SECRET
        totpSecret: PLACEHOLDER-NOT-A-SECRET
        accessSecret: PLACEHOLDER-NOT-A-SECRET

  - name: the same keys are present and empty on a user without them
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-user
      query:
        name: cauldron
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        # Empty strings rather than absent, so a client cannot tell "this user
        # has no TOTP" from "the server redacted it".
        totpSecret: ""
        accessSecret: ""
        displayName: Cauldron

  - name: deletion is a POST at a path whose name says delete
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      # Twenty-eight delete-* paths, every one of them POST. A reviewer
      # grepping for DELETE finds nothing; a proxy rule on the method never
      # fires; an audit classifying by method files every deletion as a write.
      method: POST
      path: /api/delete-user
      headers:
        Authorization: Bearer cauldron-casdoor-token
      json:
        name: cauldron
    expect:
      status: 200
      body:
        status: ok

  - name: a failure arrives at 200 with a string saying otherwise
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    arm: not_found
    fixture: directory
    request:
      method: GET
      path: /api/get-user
      query:
        name: admin
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      # HTTP 200. response.ok is true, status < 300 passes,
      # raise_for_status does not raise -- and the user does not exist.
      status: 200
      body:
        status: error
        msg: "the user does not exist"

  - name: a listing puts the records in the first slot
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        # controllers.Response declares data, data2 and data3, each described
        # as "support string, struct or []struct" and none typed. Which slot
        # holds what is per endpoint and the document says for none of them.
        'data[0].name': admin
        'data[1].name': cauldron
        # And the count in the second slot, which is where this endpoint puts
        # it -- a different endpoint puts something else there, and nothing
        # says which.
        data2: 2

  - name: admin and forbidden are separate axes
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        # A record can be neither, either or both, and nothing collapses them
        # into a role -- so "can this person sign in" is two booleans that a
        # client has to combine itself.
        'data[0].isAdmin': true
        'data[0].isForbidden': false
        'data[1].isAdmin': false
        'data[1].isForbidden': true

  - name: a user is identified by a pair and the path carries one half
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-user
      query:
        # `name` alone. Casdoor scopes every record by organisation, so the
        # real identifier is (owner, name) -- and two organisations may each
        # have an `admin`.
        name: admin
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        name: admin
        email: admin@example.com
        isAdmin: true
        createdTime: "2026-01-04T09:00:00Z"

  - name: no credential is refused
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      headers: {}
    expect:
      status: 401
      body:
        status: error
        msg: "please login first"

  - name: "a missing parameter says so at 200 as well"
    source: "https://casdoor.org/docs/basic/public-api"
    arm: invalid
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        status: error
        msg: "parameter organization is missing"

  - name: "the rate limit says so in these words"
    source: "https://casdoor.org/docs/basic/public-api"
    arm: rate_limit
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 429
      body:
        status: error
        msg: "too many requests"

  - name: the organisation is a query parameter, not a path segment
    source: https://raw.githubusercontent.com/casdoor/casdoor/master/swagger/swagger.json
    fixture: directory
    request:
      method: GET
      path: /api/get-users
      query:
        # Every record in Casdoor is scoped by organisation, and the scope
        # travels beside the request rather than in the path -- so two calls
        # that differ only in a query parameter address different directories.
        owner: built-in
      headers:
        Authorization: Bearer cauldron-casdoor-token
    expect:
      status: 200
      body:
        'data[0].owner': built-in
        'data[1].owner': built-in
