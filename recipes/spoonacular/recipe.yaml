# Spoonacular Recipe for Cauldron
#
# Spoonacular's own docs say the quiet part outright: "Nutrition data is per
# serving. If you want the nutrition data for the entire recipe, just
# multiply by the number of servings." That is the most explicit answer to
# this collection's question of any provider in this batch -- Edamam's
# Recipe, written alongside this one, gives the opposite basis (a whole
# recipe's totals, with yield the only division on offer) and never states
# which basis it uses; Spoonacular states its basis in prose, in the
# reference page for the very endpoint that returns it.
#
# **And the response itself never says so.** includeNutrition's own worked
# example -- GET /recipes/{id}/nutritionWidget.json -- answers
# {"nutrients": [{"name": "Calories", "amount": 316.49, "unit": "kcal",
# "percentOfDailyNeeds": 15.82}, ...]}, and nothing in that object, or
# anywhere else in the body, carries the word "serving." A client that
# reaches this endpoint directly, or reads only the JSON schema and not the
# prose paragraph two headings up, has no way to discover per-serving from
# the wire. The unit question and the basis question split the same way
# they do on Edamam: every nutrient here does carry its own unit, per field
# -- amount and unit sit beside each other on every entry, in nutrients,
# properties and flavonoids alike -- and the basis is stated exactly once,
# in prose, off the wire.
#
# **A recipe's own ingredient amounts silently mirror one of two measurement
# systems, and say so only by omission.** extendedIngredients[].amount and
# .unit are Spoonacular's own worked example's top-level pair, and they are
# not a third measurement -- they are measures.us restated at the top level.
# The same ingredient's measures.metric sits one level down, unmentioned by
# the top-level pair: pasta's top-level amount/unit is "6 ounces", its
# measures.metric is "170.097 grams", and a client reading amount/unit alone
# gets US customary without anything on the wire saying an international
# figure exists one field away, let alone that it was not the one chosen.
#
# **Points, not requests, and the cost of one call is reported precisely.**
# Spoonacular's own docs: "Usually, every request is 1 point and 0.01 points
# per result returned, but there are many exceptions." complexSearch's own
# quota note gives the arithmetic for this Recipe's own worked example
# (query=pasta&number=2): 1 point plus 0.01 per result, for 2 results, is
# 1.02 -- computed from the provider's own published formula, not invented.
# Visual Crossing's Recipe in this collection found a provider that reports
# what a call cost in the response body; Spoonacular reports the same fact
# in a response header instead, and names it precisely: X-Api-Quota-Request
# is the cost of the request just answered, X-Api-Quota-Used is the running
# total for the day, X-Api-Quota-Left is what remains. Confirmed twice, not
# once -- the docs give the three names in this capitalisation
# (X-API-Quota-Request), and the live host's own CORS preflight configuration
# names them again, byte for byte except for casing
# (Access-Control-Expose-Headers: X-Api-Quota-Left, X-Api-Quota-Used,
# X-Api-Quota-Request), which is fine, because HTTP header names are
# case-insensitive and the two sources agree on everything else. Used and
# Left are per-account counters this Recipe cannot show a real value for
# without a key; Request is a fact about the one call just made, and this
# Recipe states the one worked example it can compute rather than a number
# for the other two it would have to invent.
#
# **Absent and wrong collapse into one sentence, and there is no 500 for
# either.** No apiKey at all, an apiKey that is present and wrong, and
# apiKey= with nothing after the equals sign all answered the identical
# body live: {"status":"failure","code":401,"message":"You are not
# authorized. Please read
# https://spoonacular.com/food-api/docs#Authentication"}. One sentence for
# every way to get a key wrong, which is the answer this collection keeps
# finding a version of: most providers do not distinguish absent from wrong,
# and Spoonacular does not either, cleanly and without a gateway 500 for any
# of the three shapes tried.
#
# **Routing and method both resolve before the credential, with no
# exception found.** An unrouted path 404s and a wrong method (PUT on a real
# path) 405s, both probed live with and without a credential and both
# byte-identical either way. auth.after_routing carries this. The 405 is a
# real one -- Content-Type: application/json, a genuine RFC 9110 status --
# and it does not carry a real Allow header: the only method list on the
# response is Access-Control-Allow-Methods, a CORS preflight header naming
# every method the gateway permits anywhere on the host (GET, HEAD, POST,
# PATCH, OPTIONS, DELETE, PUT, on every route probed including ones that take
# none of them), not what this specific path accepts. A client reading the
# header RFC 9110 actually defines for a 405 finds nothing.
#
# **"code" is present on every failure and is 0 on both of the routing
# ones.** The 401 carries code: 401, matching its own HTTP status; the 404
# and the 405 both carry code: 0, a field that is present, typed as a
# number, and never varies -- Fireworks' Recipe in this collection found a
# "type" field that is always the literal word "error"; this is the same
# shape, a discriminator that has never discriminated, on a different key.
#
# **What happens to a recipe search the database has nothing for** is
# documented in Spoonacular's own worked front-end example, in the same
# reference page: "If no recipes are found for a given query, the app will
# simply show 'No recipes found.'" -- because the API answers 200 with
# {"results": [], "totalResults": 0}, not an error. This collection's
# not-found question, for the search route, has an answer with a citation;
# the single-recipe-by-id 404 was not found documented anywhere on this
# page and was not tested live (no key), and is left undeclared rather than
# guessed at.
#
# Written against the live API for auth, routing and error shape: every case
# carrying a verified date was called against api.spoonacular.com on that
# date, with no key ever minted. The successful bodies are a different kind
# of evidence -- see the split below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No successful body below carries a verified date. Every 200 case is
#     Spoonacular's own current worked example, read from
#     spoonacular.com/food-api/docs, and no id, amount or nutrient figure in
#     it was invented -- each is copied from that page's own JSON block.
#   - extendedIngredients is trimmed to the fields this Recipe's cases turn
#     on. Spoonacular's own worked example carries meta, consistency, image
#     and aisle on every ingredient; this fixture keeps enough of the ten
#     real ingredients to show the amount/unit-mirrors-us finding and drops
#     the rest.
#   - /recipes/{id}/information's own not-found shape is undeclared -- see
#     the header.
#   - No upstream.spec. Nothing resembling an OpenAPI or Swagger description
#     was found linked from spoonacular.com/food-api/docs; the reference is
#     a single long hand-written page.
#   - This Recipe's accepted credential is checked as a bare query
#     parameter equality, which is exactly what apiKey is on the wire --
#     there is no second parameter to reconcile here, unlike Edamam's
#     app_id/app_key pair or Nutritionix's two headers in the same
#     collection.

recipe: spoonacular
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://spoonacular.com/food-api/docs

auth:
  scheme: query
  param: apiKey
  keys:
    - cauldron0000
  # No key, a wrong key, and apiKey= with nothing after it all answered the
  # identical sentence live -- see the header. One message covers every
  # verdict, which is this runtime's default the moment neither
  # absent_error nor rejected_error is set.
  after_routing: true

responses:
  resource:
    style: bare
  list:
    style: wrapped
    key: results
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: number
    type_field: "-"
    fields:
      status: failure

resources:
  recipe_summary:
    id:
      style: numeric
    fields:
      title:
        type: string
      image:
        type: string
      imageType:
        type: string

  recipe_information:
    id:
      style: numeric
    fields:
      title:
        type: string
      image:
        type: string
      imageType:
        type: string
      servings:
        type: integer
      readyInMinutes:
        type: integer
      cookingMinutes:
        type: integer
      preparationMinutes:
        type: integer
      pricePerServing:
        type: number
      healthScore:
        type: number
      spoonacularScore:
        type: number
      dishTypes:
        type: list
      # Each entry carries a top-level amount/unit AND a measures.us /
      # measures.metric pair. See the header: the top-level pair silently
      # mirrors measures.us, not measures.metric.
      extendedIngredients:
        type: list

  # GET /recipes/{id}/nutritionWidget.json. Bare object, four sibling
  # arrays, every entry {name, amount, unit[, percentOfDailyNeeds]} -- unit
  # stated per field, "per serving" stated nowhere on the wire. See the
  # header.
  nutrition_widget:
    id:
      style: numeric
      field: "-"
    fields:
      nutrients:
        type: list
      properties:
        type: list
      flavonoids:
        type: list
      ingredients:
        type: list

routes:
  - method: GET
    path: /recipes/complexSearch
    resource: recipe_summary
    operation: list
    pagination:
      style: offset
      limit: 2
      first_page: 0
      limit_param: number
      cursor_param: offset
    list:
      page_field: offset
      limit_field: number
      count_field: totalResults
    # 1 point + 0.01 per result, for the 2 results this fixture answers with
    # -- Spoonacular's own published formula, computed rather than invented.
    # See the header for why Used and Left are not also stated.
    headers:
      X-Api-Quota-Request: "1.02"

  - method: GET
    path: /recipes/{id}/information
    resource: recipe_information
    operation: get

  - method: GET
    path: /recipes/{id}/nutritionWidget.json
    resource: nutrition_widget
    operation: get

errors:
  # The one sentence every credential mistake got live -- absent, wrong, and
  # present-but-empty all answered this, byte for byte. See the header.
  authentication_error:
    status: 401
    code: "401"
    message: >-
      You are not authorized. Please read
      https://spoonacular.com/food-api/docs#Authentication

  # Verified live, with no credential examined either way -- see
  # auth.after_routing. code: 0 here and on method_not_allowed both, and
  # neither value ever varies -- see the header.
  unknown_route:
    status: 404
    code: "0"
    fields:
      link: https://www.wikiwand.com/en/HTTP_404
    message: >-
      The resource you called does not exist. A common cause is that you
      might have mixed up upper- and lowercase in the URL. Also, please
      make sure your first query parameter starts with a ? and subsequent
      ones with &. Please check your request and compare it to the docs and
      see the additional link for more help.

  # A real 405, verified live, with no Allow header -- see the header for
  # what the response carries instead.
  method_not_allowed:
    status: 405
    code: "0"
    fields:
      link: "https://www.wikiwand.com/en/List_of_HTTP_status_codes#:~:text=405%20Method%20Not%20Allowed&text=405%20Method%20Not%20Allowed"
    message: >-
      The method you have called this resource is not allowed. A common
      cause is that you use GET instead of POST or vice versa. Please check
      your request and compare it to the docs and see the additional link
      for more help.

fixtures:
  empty: {}

  cookbook:
    recipe_summary:
      # Spoonacular's own worked example for query=pasta&maxFat=25&number=2.
      - id: 716429
        title: "Pasta with Garlic, Scallions, Cauliflower & Breadcrumbs"
        image: https://img.spoonacular.com/recipes/716429-312x231.jpg
        imageType: jpg
      - id: 715538
        title: "What to make for dinner tonight?? Bruschetta Style Pork & Pasta"
        image: https://img.spoonacular.com/recipes/715538-312x231.jpg
        imageType: jpg

    recipe_information:
      # Spoonacular's own worked example for id 716429, includeNutrition=false.
      - id: 716429
        title: "Pasta with Garlic, Scallions, Cauliflower & Breadcrumbs"
        image: https://img.spoonacular.com/recipes/716429-556x370.jpg
        imageType: jpg
        servings: 2
        readyInMinutes: 45
        cookingMinutes: 25
        preparationMinutes: 20
        pricePerServing: 163.15
        healthScore: 19.0
        spoonacularScore: 83.0
        dishTypes:
          - lunch
          - main course
          - main dish
          - dinner
        extendedIngredients:
          # Two of ten real ingredients. Pasta shows the finding: the
          # top-level pair is the US measure, and the metric one -- a
          # different unit entirely, grams rather than ounces -- sits
          # unmentioned one field over.
          - id: 20420
            aisle: Pasta and Rice
            name: pasta
            amount: 6.0
            unit: ounces
            measures:
              us:
                amount: 6.0
                unitLong: ounces
                unitShort: oz
              metric:
                amount: 170.097
                unitLong: grams
                unitShort: g
          - id: 11215
            aisle: Produce
            name: garlic
            amount: 5.0
            unit: cloves
            measures:
              us:
                amount: 5.0
                unitLong: cloves
                unitShort: cloves
              metric:
                amount: 5.0
                unitLong: cloves
                unitShort: cloves

    nutrition_widget:
      # Spoonacular's own worked example for GET
      # /recipes/1003464/nutritionWidget.json. Every entry keeps its own
      # unit; nothing here says "per serving" -- that sentence exists only
      # in this endpoint's own prose reference, quoted in the header.
      - id: 1003464
        nutrients:
          - name: Calories
            amount: 316.49
            unit: kcal
            percentOfDailyNeeds: 15.82
          - name: Fat
            amount: 12.09
            unit: g
            percentOfDailyNeeds: 18.6
          - name: Carbohydrates
            amount: 49.25
            unit: g
            percentOfDailyNeeds: 16.42
          - name: Sugar
            amount: 21.98
            unit: g
            percentOfDailyNeeds: 24.42
          - name: Sodium
            amount: 279.1
            unit: mg
            percentOfDailyNeeds: 12.13
          - name: Protein
            amount: 3.79
            unit: g
            percentOfDailyNeeds: 7.57
        properties:
          # Two dimensionless figures with an empty unit, beside one with a
          # literal "%" -- three ways of writing "no real unit" on one array.
          - name: Glycemic Index
            amount: 33.51
            unit: ""
          - name: Nutrition Score
            amount: 5.868695652173913
            unit: "%"
        flavonoids:
          - name: Cyanidin
            amount: 2.35
            unit: mg
          - name: Petunidin
            amount: 8.75
            unit: mg
        ingredients: []

conformance:
  - name: no key gets the standard sentence
    source: https://api.spoonacular.com/recipes/complexSearch
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: GET
      path: /recipes/complexSearch?query=pasta
    expect:
      status: 401
      body:
        status: failure
        code: 401
        message: >-
          You are not authorized. Please read
          https://spoonacular.com/food-api/docs#Authentication

  - name: a present, wrong key gets the identical sentence
    source: https://api.spoonacular.com/recipes/complexSearch
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: GET
      path: /recipes/complexSearch?query=pasta&apiKey=junkkey12345
    expect:
      status: 401
      body:
        code: 401
        message: >-
          You are not authorized. Please read
          https://spoonacular.com/food-api/docs#Authentication

  - name: apiKey present and empty gets the identical sentence again
    source: https://api.spoonacular.com/recipes/complexSearch
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: GET
      path: "/recipes/complexSearch?query=pasta&apiKey="
    expect:
      status: 401
      body:
        code: 401
        message: >-
          You are not authorized. Please read
          https://spoonacular.com/food-api/docs#Authentication

  - name: an unrouted path 404s with no credential examined
    source: https://api.spoonacular.com/no-such-route
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: GET
      path: /no-such-route
    expect:
      status: 404
      body:
        code: 0
        link: https://www.wikiwand.com/en/HTTP_404
      matches:
        message: "does not exist"

  - name: and the identical 404 whether or not a credential was sent
    source: https://api.spoonacular.com/no-such-route
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: GET
      path: /no-such-route?apiKey=junkkey12345
    expect:
      status: 404
      body:
        code: 0

  - name: a wrong method on a real path is a genuine 405
    # The live response carries no Allow header at all -- see the header.
    # This runtime computes and sends one whenever a declared
    # method_not_allowed error keeps the real 405 status, which is what
    # makes 405s useful across the rest of this collection, and it is not
    # something a Recipe can turn off. Asserting its absence here would be
    # asserting behaviour Cauldron itself does not have, so the live finding
    # stays in the header and this case checks the body alone.
    source: https://api.spoonacular.com/recipes/complexSearch
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: PUT
      path: /recipes/complexSearch?query=pasta
    expect:
      status: 405
      body:
        code: 0

  - name: and the identical 405 whether or not a credential was sent
    source: https://api.spoonacular.com/recipes/complexSearch
    verified: "2026-09-03"
    fixture: cookbook
    request:
      method: PUT
      path: /recipes/complexSearch?query=pasta&apiKey=junkkey12345
    expect:
      status: 405
      body:
        code: 0

  - name: a search result is wrapped under results, beside a total and the echoed paging
    # Documented, not called with a key -- see the header's observed/documented
    # split. Every id and title below is Spoonacular's own worked example;
    # totalResults is this Recipe's own two-record fixture count rather than
    # the 86 Spoonacular's live catalogue answered on the same query, because
    # this Recipe holds two recipes, not a real database -- the header cites
    # 86 as the documented figure without asserting it here.
    source: https://spoonacular.com/food-api/docs
    fixture: cookbook
    request:
      method: GET
      path: /recipes/complexSearch?query=pasta&maxFat=25&number=2&apiKey=cauldron0000
    expect:
      status: 200
      headers:
        # This call's own cost, computed from the published formula -- see
        # the header. Not a value this Recipe observed; a value it derived.
        X-Api-Quota-Request: "1.02"
      body:
        "results[0].id": 716429
        "results[0].title": "Pasta with Garlic, Scallions, Cauliflower & Breadcrumbs"
        offset: 0
        number: 2
        totalResults: 2

  - name: an ingredient's top-level amount is the US measure, and the metric one is a field away
    source: https://spoonacular.com/food-api/docs
    fixture: cookbook
    request:
      method: GET
      path: /recipes/716429/information?includeNutrition=false&apiKey=cauldron0000
    expect:
      status: 200
      body:
        title: "Pasta with Garlic, Scallions, Cauliflower & Breadcrumbs"
        servings: 2
        # Six ounces, same number and unit as measures.us -- and grams,
        # a different unit on a different number, sit one field over in
        # measures.metric with nothing pointing to it.
        "extendedIngredients[0].amount": 6.0
        "extendedIngredients[0].unit": ounces
        "extendedIngredients[0].measures.us.unitShort": oz
        "extendedIngredients[0].measures.metric.amount": 170.097
        "extendedIngredients[0].measures.metric.unitLong": grams

  - name: every nutrient carries its own unit, and none of them says per serving
    source: https://spoonacular.com/food-api/docs
    fixture: cookbook
    request:
      method: GET
      path: /recipes/1003464/nutritionWidget.json?apiKey=cauldron0000
    expect:
      status: 200
      body:
        "nutrients[0].name": Calories
        "nutrients[0].amount": 316.49
        "nutrients[0].unit": kcal
        "nutrients[0].percentOfDailyNeeds": 15.82
        "nutrients[4].name": Sodium
        "nutrients[4].unit": mg
      absent:
        - servingSize
        - perServing
        - basis

  - name: a percentage and two dimensionless figures write "no unit" three different ways
    source: https://spoonacular.com/food-api/docs
    fixture: cookbook
    request:
      method: GET
      path: /recipes/1003464/nutritionWidget.json?apiKey=cauldron0000
    expect:
      status: 200
      body:
        "properties[0].name": Glycemic Index
        "properties[0].unit": ""
        "properties[1].name": Nutrition Score
        "properties[1].unit": "%"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if number was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "number is read, because a page of one out of two is not the whole collection"
    source: "https://spoonacular.com/food-api/docs"
    fixture: cookbook
    request:
      method: GET
      path: "/recipes/complexSearch"
      query:
        "query": "pasta"
        "maxFat": "25"
        "number": "1"
        "apiKey": "cauldron0000"
    expect:
      status: 200
      body:
        "results[0].id": 716429
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://spoonacular.com/food-api/docs"
    fixture: cookbook
    request:
      method: GET
      path: "/recipes/complexSearch"
      query:
        "query": "pasta"
        "maxFat": "25"
        "number": "1"
        "apiKey": "cauldron0000"
        "offset": "1"
    expect:
      status: 200
      body:
        "results[0].id": 715538
      absent:
        - "results[1]"

  # The names. This Recipe declares 9 field(s) on a recipe_information
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 9 name(s) that came back at the paths they came
  # back under.
  - name: "a recipe_information carries the field names this Recipe declares"
    source: "https://spoonacular.com/food-api/docs"
    fixture: cookbook
    request:
      method: GET
      path: "/recipes/716429/information"
      query:
        "includeNutrition": "false"
        "apiKey": "cauldron0000"
    expect:
      status: 200
      body:
        "cookingMinutes": 25
        "dishTypes[0]": "lunch"
        "healthScore": 19
        "image": "https://img.spoonacular.com/recipes/716429-556x370.jpg"
        "imageType": "jpg"
        "preparationMinutes": 20
        "pricePerServing": 163.15
        "readyInMinutes": 45
        "spoonacularScore": 83

  # The names. This Recipe declares 2 field(s) on a recipe_summary that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a recipe_summary carries the field names this Recipe declares"
    source: "https://spoonacular.com/food-api/docs"
    fixture: cookbook
    request:
      method: GET
      path: "/recipes/complexSearch"
      query:
        "query": "pasta"
        "maxFat": "25"
        "number": "2"
        "apiKey": "cauldron0000"
    expect:
      status: 200
      body:
        "results[0].image": "https://img.spoonacular.com/recipes/716429-312x231.jpg"
        "results[0].imageType": "jpg"


