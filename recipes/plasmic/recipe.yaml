# Plasmic Recipe for Cauldron
#
# The loader code bundle, read from the types in Plasmic's own
# @plasmicapp/loader-fetcher, and struck live on 2026-09-14 with no credential,
# with a wrong project token, on a path that does not exist, with a method the
# path does not take, on the studio API and on the root.
#
# **The status line says 499 and the body says what really happened.** Struck
# live on codegen.plasmic.app:
#
#   no credential      HTTP/1.1 499 Unknown   Upstream responded with 401
#   wrong token        HTTP/1.1 499 Unknown   Upstream responded with 404
#
# 499 is nginx's non-standard code for a client that closed the connection. It
# is not in the IANA registry, its reason phrase here is the literal word
# "Unknown", and the real status arrives as English prose in a `text/plain`
# body. So a client switching on `response.status` sees a number that means
# nothing, and the number that means something is in a sentence.
#
# **And a wrong credential is reported as the upstream not finding something.**
# The only difference between sending no token and sending a wrong one is 401
# against 404, inside that sentence, under the same 499.
#
# **Four requests, four error formats.** On the same deployment:
#
#   499  text/plain        Upstream responded with 401
#   404  application/json  {"error":{"name":"NotFoundError","statusCode":404,"message":"Not Found"}}
#   405  text/plain        Error: 119                  (Google-Edge-Cache: bad request.)
#   403  application/json  {"error":{"name":"ForbiddenError","statusCode":403,"message":"Must be a normal user"}}
#
# The 405's entire body is a CDN's internal error number. The 403's message is
# "Must be a normal user", which is the sentence an API gives a caller about
# what kind of account they need to be.
#
# **The JSON errors carry a JavaScript class name and repeat the status.**
# `error.name` is `NotFoundError` or `ForbiddenError` -- the constructor name --
# and `error.statusCode` is the status again, inside the body it was already on
# the status line of.
#
# **The success is JavaScript source code, as data.** The loader bundle's
# `modules` is `{browser: [...], server: [...]}`, and each entry is a
# `CodeModule` -- `{fileName, code, imports, type: "code"}` -- so the API hands
# back a string of executable code per file, split by where it is meant to run.
#
# **A subtype declares a field's type as `never`.** `ComponentMeta.plumeType` is
# `string | undefined`; `PageMeta extends ComponentMeta` and redeclares it as
# `plumeType: never`, which is TypeScript's bottom type: a page can never carry
# one, said in a way no wire format can express.
#
# **A field lists what is not there.** `filteredIds` is `Record<string,
# string[]>`, documented as "the list of component IDs that are *not* included
# in the bundle" -- an absence, enumerated, per project.
#
# Also pinned: two booleans are named for defaults -- `deferChunksByDefault` and
# `disableRootLoadingBoundaryByDefault` -- on a per-request response;
# `ProjectMeta.indirect` is a bare boolean with no explanation, under a comment
# reading "Keep in sync with platform/wab ProjectMeta", which is a request to a
# human in a shared type; and the client pins the wire format with `const
# VERSION = "10"` in its own source rather than in any path or header this API
# exposes.

recipe: plasmic
capability: cms
version: 0.1.0

upstream:
  api: "10"
  docs: https://docs.plasmic.app/learn/loader-api/

auth:
  scheme: header
  # The value is the project id and the token, joined by a colon.
  header: x-plasmic-api-project-tokens
  keys:
    - cauldr0nproj:cauldr0nt0ken0000000000000000000
  absent_error: upstream_401
  malformed_error: upstream_401
  rejected_error: upstream_404
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    # A JavaScript constructor name.
    type_field: name
    # The status, again, inside the body.
    status_field: statusCode
    code_field: "-"

resources:
  bundle:
    id:
      # The bundle has no identifier of its own; bundleKey is nullable.
      style: opaque
      field: "-"
      carried_by: bundleKey
    fields:
      # Executable code, as data, split by where it runs.
      modules:
        type: map
      components:
        type: list
      globalGroups:
        type: list
      projects:
        type: list
      activeSplits:
        type: list
      bundleKey:
      deferChunksByDefault:
        type: boolean
      disableRootLoadingBoundaryByDefault:
        type: boolean
      # What is *not* in the bundle.
      filteredIds:
        type: map

routes:
  - method: GET
    path: /api/v1/loader/code/published
    resource: bundle
    operation: list
    list:
      style: bare
      collapse_single: true
    pagination:
      style: none

errors:
  upstream_401:
    # nginx's code for a client that hung up, on a response.
    status: 499
    style: text
    # The real status, in prose, in the body.
    message: "Upstream responded with 401"
    headers:
      Content-Type: text/plain;charset=UTF-8
      X-XSS-Protection: "0"
      X-Frame-Options: SAMEORIGIN

  # A wrong token, reported as the upstream not finding something.
  upstream_404:
    status: 499
    style: text
    message: "Upstream responded with 404"
    headers:
      Content-Type: text/plain;charset=UTF-8
      X-XSS-Protection: "0"
      X-Frame-Options: SAMEORIGIN

  unknown_route:
    status: 404
    type: NotFoundError
    message: Not Found
    headers:
      X-Frame-Options: DENY
      X-Content-Type-Options: nosniff

  # The whole body is a CDN's internal error number.
  method_not_allowed:
    status: 405
    style: text
    message: "Error: 119"
    headers:
      Content-Type: text/plain
      Google-Edge-Cache: bad request.

fixtures:
  empty:
    bundle:
      - modules:
          browser: []
          server: []
        components: []
        globalGroups: []
        projects: []
        activeSplits: []
        bundleKey: null
        deferChunksByDefault: false
        disableRootLoadingBoundaryByDefault: false
        filteredIds: {}

  site:
    bundle:
      - modules:
          browser:
            - fileName: PlasmicHomepage.js
              # A string of executable JavaScript, returned as data.
              code: "export function PlasmicHomepage(props) { return null; }"
              imports:
                - react
              type: code
            - fileName: plasmic.css
              source: ".root { display: flex; }"
              type: asset
          server:
            - fileName: PlasmicHomepage.js
              code: "export function PlasmicHomepage(props) { return null; }"
              imports:
                - react
              type: code
        components:
          - id: cmp_7Kq2mX9pLz
            usedComponents: []
            projectId: cauldr0nproj
            name: Homepage
            displayName: Homepage
            cssFile: plasmic.css
            path: /
            isPage: true
            entry: PlasmicHomepage.js
            isCode: false
            isGlobalContextProvider: false
            pageMetadata:
              path: /
              title: Home
              description: null
              openGraphImageUrl: null
              canonical: null
        globalGroups: []
        projects:
          - id: cauldr0nproj
            teamId: team_4f3e2d1c
            # A bare boolean, with no explanation anywhere.
            indirect: false
            name: Marketing site
            version: "1.4.2"
            remoteFonts: []
            hasStyleTokenOverrides: false
            styleTokensProviderFileName: PlasmicStyleTokensProvider.js
            globalContextsProviderFileName: PlasmicGlobalContextsProvider.js
        activeSplits: []
        bundleKey: null
        # Two booleans named for defaults, on a per-request response.
        deferChunksByDefault: false
        disableRootLoadingBoundaryByDefault: false
        # The components that are *not* in this bundle.
        filteredIds:
          cauldr0nproj:
            - cmp_4Nb6Vc8Xz2

conformance:
  - name: the status line says 499 and the body says 401
    source: https://codegen.plasmic.app/api/v1/loader/code/published?projectId=abc&platform=react
    verified: "2026-09-14"
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers: {}
    expect:
      # Not in the IANA registry, and the reason phrase is "Unknown".
      status: 499
      headers:
        Content-Type: text/plain;charset=UTF-8
      body_matches: '\AUpstream responded with 401\s*\z'

  - name: and a wrong token is reported as the upstream not finding something
    source: https://codegen.plasmic.app/api/v1/loader/code/published?projectId=abc&platform=react
    verified: "2026-09-14"
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:notarealtoken"
    expect:
      status: 499
      # One digit apart from the sentence above, under the same status.
      body_matches: '\AUpstream responded with 404\s*\z'

  - name: an unrouted path is json with a class name and the status twice
    source: https://codegen.plasmic.app/api/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: site
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # The constructor name, and the status inside the body.
        'error.name': NotFoundError
        'error.statusCode': 404
        'error.message': Not Found

  - name: and a wrong method is a cdn's internal error number
    source: https://codegen.plasmic.app/api/v1/loader/code/published
    verified: "2026-09-14"
    fixture: site
    request:
      method: PUT
      path: /api/v1/loader/code/published
      headers: {}
    expect:
      status: 405
      headers:
        Content-Type: text/plain
        Google-Edge-Cache: bad request.
      # The whole body.
      body_matches: '\AError: 119\s*\z'

  - name: the success is javascript source code
    source: https://github.com/plasmicapp/plasmic
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:cauldr0nt0ken0000000000000000000"
    expect:
      status: 200
      body:
        # A string of executable code, per file, split by where it runs.
        'modules.browser[0].fileName': PlasmicHomepage.js
        'modules.browser[0].type': code
        'modules.browser[0].imports[0]': react
        'modules.browser[1].type': asset
        'modules.server[0].fileName': PlasmicHomepage.js

  - name: a field enumerates what is not in the bundle
    source: https://github.com/plasmicapp/plasmic
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:cauldr0nt0ken0000000000000000000"
    expect:
      status: 200
      body:
        # "the list of component IDs that are not included in the bundle".
        'filteredIds.cauldr0nproj[0]': cmp_4Nb6Vc8Xz2
        # Two booleans named for defaults, on one response.
        deferChunksByDefault: false
        disableRootLoadingBoundaryByDefault: false
        bundleKey: null
        activeSplits: []
        globalGroups: []

  - name: a page carries metadata a component may not
    source: https://github.com/plasmicapp/plasmic
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:cauldr0nt0ken0000000000000000000"
    expect:
      status: 200
      body:
        # PageMeta redeclares plumeType as never, so this record has none.
        'components[0].isPage': true
        'components[0].pageMetadata.path': /
        'components[0].pageMetadata.title': Home
        'components[0].pageMetadata.description': null
        'components[0].cssFile': plasmic.css
        'components[0].isCode': false
        'components[0].isGlobalContextProvider': false
        'components[0].usedComponents': []
        'components[0].displayName': Homepage
      absent:
        - components[0].plumeType

  - name: a project record carries an unexplained boolean
    source: https://github.com/plasmicapp/plasmic
    fixture: site
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:cauldr0nt0ken0000000000000000000"
    expect:
      status: 200
      body:
        # "indirect", under a comment asking a human to keep two types in sync.
        'projects[0].indirect': false
        'projects[0].id': cauldr0nproj
        'projects[0].version': "1.4.2"
        'projects[0].name': Marketing site
        'projects[0].remoteFonts': []
        'projects[0].hasStyleTokenOverrides': false

  - name: a project with nothing published is the same shape emptied
    source: https://github.com/plasmicapp/plasmic
    fixture: empty
    request:
      method: GET
      path: /api/v1/loader/code/published
      query:
        projectId: cauldr0nproj
        platform: react
      headers:
        x-plasmic-api-project-tokens: "cauldr0nproj:cauldr0nt0ken0000000000000000000"
    expect:
      status: 200
      body:
        components: []
        projects: []
        filteredIds: {}
        'modules.browser': []
        'modules.server': []
