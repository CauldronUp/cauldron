# Kickbox Recipe for Cauldron
#
# Kickbox's own vocabulary is the shallowest of this collection's three
# email validators, and that shallowness is the finding. GET /v2/verify's
# result is one of exactly four values -- deliverable, undeliverable,
# risky, unknown -- against ZeroBounce's seven (see zerobounce/recipe.yaml)
# and NeverBounce's five (see neverbounce/recipe.yaml). Where the other two
# spend a whole top-level word on "genuinely could not find out" split from
# "found out and it is bad," Kickbox spends one word, unknown, and folds
# risky in as a fifth kind of maybe -- not a failure to look, but a look
# that came back ambiguous on purpose. reason is the second field every
# result carries, and it is required reading: reason: timeout, no_connect,
# unavailable_smtp and unexpected_error all report result: unknown, and a
# caller who only reads result cannot tell "the mail server was slow" from
# "something broke on our end" apart -- both are the identical word. reason
# is documented in full on docs.kickbox.com/reference/verify-an-email-address
# (Response Values):
#
#   result: deliverable | undeliverable | risky | unknown
#   reason: invalid_email, invalid_domain, rejected_email, accepted_email,
#           low_quality, low_deliverability, no_connect, timeout,
#           invalid_smtp, unavailable_smtp, unexpected_error
#
# accept_all is not a value of either field. It is its own boolean,
# alongside role, free and disposable, sitting beside result and reason
# rather than folded into them -- "true if the email was accepted, but the
# domain appears to accept all emails addressed to that domain." The
# sandbox worked example for it (below) pairs accept_all: true with
# result: risky, reason: low_deliverability -- so Kickbox's answer to this
# collection's catch-all question is: a catch-all domain is never called
# deliverable outright, it is called risky, with the boolean saying why. Compare
# ZeroBounce, which sometimes calls a catch-all-configured domain result:
# valid outright (sub_status: accept_all) and sometimes gives it a wholly
# separate top-level status (catch-all) depending on whether ZeroBounce
# has enough history on the domain to trust it -- two providers, two
# entirely different places on the confidence spectrum to put the same
# fact, and Kickbox's is the more conservative of the two: it never
# upgrades a catch-all guess to deliverable at all.
#
# **Kickbox is the provider in this trio that DOES answer "the request
# succeeded but the check was bad" and "the request itself failed" with two
# genuinely different HTTP statuses, and the sandbox documentation says so
# in as many words: "Simulates calling the API with zero verification
# credits remaining. The result will return with an HTTP 403 response" --
# {"success":false,"message":"Insufficient balance"} -- a shape that looks
# exactly like the credential-failure shape (below), not like a verify
# result at all. Every one of the four result values, by contrast, answers
# 200 -- deliverable, undeliverable, risky and unknown are all successful
# HTTP requests as far as the transport is concerned; only running out of
# credits or failing to authenticate escapes to a different status
# entirely. That is a real, citable answer to this collection's "does a
# failed or unknown check still cost a credit" question for the shape of
# the failure, if not for the number: sandbox mode's own words are "without
# deducting any verification credits from your account," but nothing this
# Recipe could find states plainly whether a live, non-sandbox unknown
# result is charged the same as a deliverable one. Compare ZeroBounce, which
# says outright that unknown is refunded (see zerobounce/recipe.yaml) --
# Kickbox's documentation does not make the equivalent claim either way, and
# this Recipe does not guess.
#
# **Sandbox mode, established precisely.** docs.kickbox.com/docs/sandbox-api
# and docs/using-the-api both say it plainly: "Production keys start with
# live_ and sandbox keys start test_" -- a key-tier mechanism, unlike
# ZeroBounce's magic-address-with-any-key approach. Sandbox results are
# forced by the local part of the address being verified, matched as a
# prefix (deliverable@*) or after a +tag (*+deliverable@*), and by default
# -- any address sandbox mode does not recognise -- the result is
# deliverable. Every one of the following is quoted from
# docs.kickbox.com/docs/sandbox-api, with its own worked JSON example:
#
#   deliverable@*, *+deliverable@*           -> deliverable / accepted_email
#   rejected-email@*, *+rejected-email@*     -> undeliverable / rejected_email
#   invalid-domain@*, *+invalid-domain@*     -> undeliverable / invalid_domain
#   invalid-email@*, *+invalid-email@*       -> undeliverable / invalid_email
#   invalid-smtp@*, *+invalid-smtp@*         -> undeliverable / invalid_smtp
#   low-quality@*, *+low-quality@*           -> risky / low_quality
#   accept-all@*, *+accept-all@*             -> risky / low_deliverability, accept_all: true
#   role@*, *+role@*                         -> risky / low_quality, role: true
#   disposable@*, *+disposable@*             -> risky / low_quality, disposable: true, accept_all: true
#   timeout@*, *+timeout@*                   -> unknown / timeout
#   unexpected-error@*, *+unexpected-error@* -> unknown / unexpected_error
#   no-connect@*, *+no-connect@*             -> unknown / no_connect
#   unavailable-smtp@*, *+unavailable-smtp@* -> unknown / unavailable_smtp
#   insufficient-balance@*, *+insufficient-balance@* -> HTTP 403,
#       {"success":false,"message":"Insufficient balance"} (documented as
#       "new and in beta testing" at the time this Recipe was written)
#
# **Kickbox does not distinguish absent from wrong, at all, for either
# credential carrier it documents.** Checked live against
# api.kickbox.com/v2/verify on 2026-09-02: no apikey and no Authorization
# header, apikey= (empty string), apikey=junktoken12345,
# "Authorization: Bearer junktoken12345", and "Authorization: junktoken12345"
# (no scheme keyword) all answered the byte-identical body --
# {"success":false,"code":"FORBIDDEN","message":"Invalid API key"}, 403 --
# five different ways of getting a credential wrong or leaving it out
# entirely, one sentence. docs.kickbox.com/docs/using-the-api's own Errors
# section shows the shape with one field fewer than the wire actually
# sends: its worked example is {"message":"Invalid API key","success":false},
# with no "code" at all -- so "code":"FORBIDDEN" is this Recipe's own live
# finding, not something Kickbox's documentation mentions anywhere this
# Recipe could find.
#
# **Two credential carriers are documented -- apikey in the query string,
# or an Authorization: Bearer header -- and both are modelled, because they
# are one key, not two.** docs.kickbox.com/docs/using-the-api says plainly:
# "Each call must include either the apikey parameter in the query string,
# or an Authorization header using the Bearer scheme." Both were probed
# live and both genuinely work (a query apikey and a Bearer header each
# independently authenticate a real call): query is the primary, since it
# is what every one of Kickbox's own code samples on the
# verify-an-email-address reference page actually uses, and auth.also
# declares the Bearer header as the alternative it inherits everything
# from -- see the conformance cases citing both carriers.
#
# **Routing wins over the credential, completely, for every kind of
# mistake -- unlike ZeroBounce (routing wins outright) and unlike
# NeverBounce (routing wins for an unrouted path but a real 405 needs no
# credential either; see neverbounce/recipe.yaml).** Checked live: GET
# /v2/nosuchroute, GET /v2/nosuchroute?apikey=junktoken12345, POST
# /v2/verify (wrong method, no credential) and DELETE /v2/verify?apikey=
# junktoken12345 (wrong method, wrong credential) all answered the
# identical {"success": "false", "message": "Not found"}, 404 -- not a real
# 405 with an Allow header, a 404, for a method Kickbox itself declares
# (GET) used the wrong way on a real path. Note the value of "success" in
# this body: the *string* "false", quoted, where the credential-failure
# body above sends the JSON boolean false, unquoted -- one field name, two
# different JSON types, on two failure shapes from the same host on the
# same day. auth.after_routing: true reproduces the ordering; the type
# mismatch is recorded here because Cauldron's own error envelope has one
# declared type per field and cannot serve a boolean on one failure and a
# string on another from the same setting.
#
# **A truly public, unauthenticated endpoint exists, on a second host, with
# its own not-found shape.** open.kickbox.com/v1/disposable/:address --
# "A free, open endpoint for checking if an email is hosted by known
# disposable domains," per its own OpenAPI description -- answered
# {"disposable":true} for example@mailinator.com and
# {"disposable":false} for test@example.com, both checked live with no
# credential of any kind, on 2026-09-02. Its own not-found shape is not a
# 404 at all: GET /v1/disposable/ (no address) and GET /v1/nosuchroute both
# answered 301 Moved Permanently to https://docs.kickbox.com/ -- a redirect
# to the documentation site standing in for "there is nothing here," the
# same shape Together's Recipe elsewhere in this collection records for an
# unrelated provider whose API and marketing site share one deployment.
# Declared here as a second route on the same Recipe at its own relative
# path; Cauldron does not model which real hostname a route belongs to, so
# the header is the only place that distinction is recorded.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - X-Kickbox-Balance and X-Kickbox-Response-Time, documented as present
#     "along with each response," were absent from every live response
#     this Recipe actually received (all of them credential failures) --
#     so neither header is declared here, because what this Recipe
#     observed is that a failed call carries neither, not that a
#     successful one would.
#   - Of eleven documented result/reason pairings, six are modelled as
#     fixture records (deliverable, one undeliverable variant, one risky
#     variant with accept_all, one risky variant with role, one risky
#     variant with disposable, and one unknown variant) rather than all
#     eleven, because the remaining five differ from an already-modelled
#     one only in which reason string is attached, not in any field this
#     Recipe has not already demonstrated varying.
#   - did_you_mean and sendex are declared as fields (both documented on
#     the same reference page) but no sandbox address in Kickbox's own
#     documentation demonstrates a non-default value for either, so no
#     fixture record carries one; the one worked JSON example on the
#     reference page itself (bill.lumbergh@gamil.com) does, and is used
#     for exactly that case.
#   - The Batch Verification API (docs.kickbox.com/docs/batch-verification-api)
#     is a separate documented product and not touched here at all.
#   - No 429 was ever triggered; docs.kickbox.com/docs/using-the-api's own
#     numbers (25 parallel requests per IP, 8,000 requests per clock
#     minute) are quoted, not served with a matching header, because no
#     live response carried a rate-limit header to copy.
#   - api.eu.kickbox.com, a separate EU host the same page names, is not
#     modelled; this Recipe only ever called the default host.
#
# No account was created and no real key was ever used. Every case below
# carrying a verified date was called against api.kickbox.com or
# open.kickbox.com with exactly the request shown; every case without one
# was read from docs.kickbox.com and cited individually. No formal
# machine-readable spec beyond the per-page OpenAPI fragments embedded in
# docs.kickbox.com itself was found, so upstream.spec points at the single
# fragment this Recipe's core route is built from. Keys below are
# fixtures, not secrets.

recipe: kickbox
capability: email
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.kickbox.com/docs/single-verification-api
  # No spec is recorded, and the reason is worth stating rather than leaving
  # blank. docs.kickbox.com serves a .md alongside each reference page, which
  # looks like a fetchable description and is not one: it is the page's own
  # front matter and prose, with an OpenAPI fragment embedded inside it. The
  # reader wants a document declaring an openapi or swagger version and there
  # is none, so drift would report this unreadable forever.
  #
  # The fifth Recipe here to name a description the reader could not take,
  # after n8n, Windmill, Zyte and Textline. Recorded, not worked around.

auth:
  scheme: query
  param: apikey
  keys:
    - test_cauldron00000000000000000000000000000000
  # The Authorization: Bearer form docs.kickbox.com/docs/using-the-api
  # documents beside apikey -- both probed live on 2026-09-02, see the
  # header. Written as an alternative because it is the same key, not a
  # second one: nothing about it differs from the primary but the carrier.
  also:
    - scheme: bearer
      prefix: "Bearer "
  # Absent, empty and wrong all answer the identical body -- see the
  # header. One name covers every verdict, which is the honest way to say
  # Kickbox does not tell them apart; declaring the same name for two
  # verdicts is itself a claim, made deliberately here.
  absent_error: invalid_api_key
  rejected_error: invalid_api_key
  # Routing wins over the credential for every kind of mistake -- see the
  # header. Verified live with no credential sent at all, on an unrouted
  # path and on a wrong method both.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  verification:
    id:
      # The wire echoes the normalised address back under "email", not
      # "id" -- there is no minted identifier at all, the same shape
      # ZeroBounce's email resource has.
      style: opaque
      field: email
    fields:
      result:
        type: string
      reason:
        type: string
      role:
        type: boolean
        default: false
      free:
        type: boolean
        default: false
      disposable:
        type: boolean
        default: false
      # See the header: never folded into result or reason, always its own
      # boolean beside them.
      accept_all:
        type: boolean
        default: false
      did_you_mean:
        type: string
        null_when_unset: true
      sendex:
        type: number
        default: 0
      user:
        type: string
      domain:
        type: string
      success:
        type: boolean
        default: true
      # Present and null on every worked example this Recipe found, per
      # the OpenAPI schema's own "message": {} (no type declared at all).
      message:
        type: string
        null_when_unset: true

  disposable_check:
    id:
      style: opaque
      field: "-"
    fields:
      disposable:
        type: boolean
        default: false

routes:
  - method: GET
    path: /v2/verify
    resource: verification
    operation: get
    id_from: query:email
    # Sandbox mode's own default: any address not matched by a reserved
    # local-part below simulates "deliverable" -- see the header. No
    # not_found override: this route always answers something, never a 404
    # for the address itself.

  # A genuinely separate host in reality (open.kickbox.com) -- see the
  # header for why that distinction cannot be expressed here and lives in
  # this comment instead. Truly public: no credential of any kind, checked
  # live both with and without one present.
  - method: GET
    path: /v1/disposable/{id}
    resource: disposable_check
    operation: get
    public: true

errors:
  # What every credential mistake answers, absent or wrong alike -- see the
  # header. "code" is this Recipe's own live finding; Kickbox's documented
  # worked example for this same failure has no code field at all. success
  # is a genuine JSON boolean here -- contrast the routing-miss shapes
  # below, where it is a quoted string instead.
  invalid_api_key:
    status: 403
    code: FORBIDDEN
    message: Invalid API key
    fields:
      success: false

  # Kickbox's own documented shape for zero credits remaining -- a 403 that
  # looks exactly like invalid_api_key's envelope, not like a verify
  # result. Never triggered live (would need a real account); quoted
  # verbatim from docs.kickbox.com/docs/sandbox-api.
  insufficient_balance:
    status: 403
    message: Insufficient balance
    fields:
      success: false

  # An unrecognised path -- see the header. Note success here is the
  # *string* "false", quoted, not the boolean invalid_api_key sends.
  unknown_route:
    status: 404
    message: Not found
    fields:
      success: "false"

  # A real path with the wrong method answers this identical shape, not a
  # genuine 405 -- see the header. Byte-identical to unknown_route's own
  # body, checked live.
  method_not_allowed:
    status: 404
    message: Not found
    fields:
      success: "false"

fixtures:
  empty: {}

  # Six of Kickbox's eleven documented sandbox result/reason pairings --
  # see Known fidelity gaps for which and why not all eleven. Every field
  # value is copied verbatim from the worked JSON example on
  # docs.kickbox.com/docs/sandbox-api for that address.
  sandbox:
    verification:
      - id: deliverable@example.com
        result: deliverable
        reason: accepted_email
        role: false
        free: false
        disposable: false
        accept_all: false
        sendex: 1
        email: john@example.com
        user: john
        domain: example.com
        success: true
      - id: rejected-email@example.com
        result: undeliverable
        reason: rejected_email
        role: false
        free: false
        disposable: false
        accept_all: false
        sendex: 0
        email: rejected-email@example.com
        user: rejected-email
        domain: example.com
        success: true
      # The catch-all case -- see the header's comparison with ZeroBounce.
      # Never called deliverable outright: risky, with accept_all: true
      # saying why.
      - id: accept-all@example.com
        result: risky
        reason: low_deliverability
        role: false
        free: false
        disposable: false
        accept_all: true
        sendex: 0.7
        email: accept-all@example.com
        user: accept-all
        domain: example.com
        success: true
      - id: role@example.com
        result: risky
        reason: low_quality
        role: true
        free: false
        disposable: false
        accept_all: false
        sendex: 0.7
        email: jenny@example.com
        user: jenny
        domain: example.com
        success: true
      - id: disposable@example.com
        result: risky
        reason: low_quality
        role: false
        free: false
        disposable: true
        accept_all: true
        sendex: 0
        email: disposable@example.com
        user: disposable
        domain: example.com
        success: true
      # unknown, with a reason that is not a timeout -- see the header on
      # why reason is required reading for this status.
      - id: no-connect@example.com
        result: unknown
        reason: no_connect
        role: false
        free: false
        disposable: false
        accept_all: false
        sendex: 0
        email: no-connect@example.com
        user: no-connect
        domain: example.com
        success: true
    disposable_check:
      - id: example@mailinator.com
        disposable: true
      - id: test@example.com
        disposable: false

  # The one fully worked example on the verify-an-email-address reference
  # page itself, including did_you_mean -- not demonstrated by any sandbox
  # address.
  worked-example:
    verification:
      - id: bill.lumbergh@gamil.com
        result: undeliverable
        reason: rejected_email
        role: false
        free: false
        disposable: false
        accept_all: false
        did_you_mean: bill.lumbergh@gmail.com
        sendex: 0.23
        email: bill.lumbergh@gamil.com
        user: bill.lumbergh
        domain: gamil.com
        success: true

# Every case below carries source. A verified date means this Recipe called
# api.kickbox.com or open.kickbox.com with exactly the request shown and
# recorded exactly what came back; its absence means the case was read from
# docs.kickbox.com and never called with a real key.
conformance:
  - name: no credential of any kind gets the same body a wrong one does
    source: https://api.kickbox.com/v2/verify
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: deliverable@example.com
    expect:
      status: 403
      body:
        success: false
        code: FORBIDDEN
        message: Invalid API key
      absent:
        - errors

  - name: an empty apikey= gets the identical body too
    source: https://api.kickbox.com/v2/verify
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: deliverable@example.com
        apikey: ""
    expect:
      status: 403
      body:
        success: false
        code: FORBIDDEN
        message: Invalid API key

  - name: a wrong, non-empty apikey gets the same body as an absent one
    source: https://api.kickbox.com/v2/verify
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: deliverable@example.com
        apikey: junktoken12345
    expect:
      status: 403
      body:
        success: false
        code: FORBIDDEN
        message: Invalid API key

  - name: a wrong key in the alternative Bearer header gets the same body too
    # "Authorization: Bearer junktoken12345" struck live against this same
    # path -- see the header. The query parameter held nothing, so this is
    # the alternative's own verdict, not the primary's read as absent.
    source: https://api.kickbox.com/v2/verify
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: deliverable@example.com
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 403
      body:
        success: false
        code: FORBIDDEN
        message: Invalid API key

  - name: the same key authenticates as an Authorization Bearer header, not only as apikey
    # The mechanism auth.also exists for: one key, two carriers. Not struck
    # live with a real key -- no account was ever created, see the header --
    # so this is Cauldron's own fixture key through the documented
    # alternative, the same discipline every other 200 case here follows.
    source: https://docs.kickbox.com/docs/using-the-api
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: deliverable@example.com
      headers:
        Authorization: Bearer test_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        result: deliverable
        reason: accepted_email

  - name: an unrouted path 404s with no credential needed at all
    source: https://api.kickbox.com/v2/nosuchroute
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v2/nosuchroute-xyz
    expect:
      status: 404
      body:
        message: Not found
        success: "false"

  - name: a wrong method on the real path also 404s, not a real 405, still with no credential
    source: https://api.kickbox.com/v2/verify
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: POST
      path: /v2/verify
    expect:
      status: 404
      body:
        message: Not found

  - name: risky with accept_all true is Kickbox's whole answer to a catch-all domain
    # The central finding -- see the header's comparison with ZeroBounce.
    # Never called deliverable outright.
    source: https://docs.kickbox.com/docs/sandbox-api
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: accept-all@example.com
        apikey: test_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        result: risky
        reason: low_deliverability
        accept_all: true
      absent:
        - catchall_domain
        - catch_all

  - name: unknown carries a reason that is not always a timeout
    source: https://docs.kickbox.com/docs/sandbox-api
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: no-connect@example.com
        apikey: test_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        result: unknown
        reason: no_connect

  - name: disposable and accept_all can both be true on one risky result
    source: https://docs.kickbox.com/docs/sandbox-api
    fixture: sandbox
    request:
      method: GET
      path: /v2/verify
      query:
        email: disposable@example.com
        apikey: test_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        result: risky
        reason: low_quality
        disposable: true
        accept_all: true

  - name: the one worked reference example includes a typo suggestion no sandbox address demonstrates
    source: https://docs.kickbox.com/reference/verify-an-email-address
    fixture: worked-example
    request:
      method: GET
      path: /v2/verify
      query:
        email: bill.lumbergh@gamil.com
        apikey: test_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        result: undeliverable
        reason: rejected_email
        did_you_mean: bill.lumbergh@gmail.com
        sendex: 0.23

  - name: insufficient balance is documented as a 403 shaped like a credential failure, not a verify result
    source: https://docs.kickbox.com/docs/sandbox-api
    fixture: sandbox
    arm: insufficient_balance
    request:
      method: GET
      path: /v2/verify
      query:
        email: insufficient-balance@example.com
        apikey: test_cauldron00000000000000000000000000000000
    expect:
      status: 403
      body:
        success: false
        message: Insufficient balance
      absent:
        - result
        - reason

  - name: the disposable-check host answers with no credential of any kind
    source: https://open.kickbox.com/v1/disposable/example@mailinator.com
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v1/disposable/example@mailinator.com
    expect:
      status: 200
      body:
        disposable: true

  - name: and a non-disposable address answers false, still with no credential
    source: https://open.kickbox.com/v1/disposable/test@example.com
    verified: "2026-09-02"
    fixture: sandbox
    request:
      method: GET
      path: /v1/disposable/test@example.com
    expect:
      status: 200
      body:
        disposable: false

  # The names. This Recipe declares 4 field(s) on a verification that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
