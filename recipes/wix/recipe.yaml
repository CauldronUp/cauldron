            cursor: 5e402679-69e4-4329-9cc1-25d607cdfaca
      headers:
        "Authorization": "IST.cauldron-wix-fixture-key"
        "wix-site-id": "3c76e2ab-1f04-4a8d-9b25-e7f0c81d3a56"
    expect:
      status: 200
      body:
        "orders[0].id": "8b3c1d97-2e64-4f05-a1b8-9c07de35f412"
      absent:
        - "orders[1]"

