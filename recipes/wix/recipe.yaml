  # The page size. Asking for one and receiving the first without the
  # second can only happen if search.cursorPaging.limit was read -- with
  # the name ignored the whole collection comes back, and this fixture
  # holds 4 records. No record had to be invented for that.
  - name: "search.cursorPaging.limit is read, because a page of one is not the whole collection"
    source: "https://dev.wix.com/docs/rest/business-solutions/e-commerce/orders/orders/search-orders"
    fixture: site
    request:
      method: POST
      path: "/ecom/v1/orders/search"
      json:
        search:
          cursorPaging:
            limit: 1
      headers:
        "Authorization": "IST.cauldron-wix-fixture-key"
        "wix-site-id": "3c76e2ab-1f04-4a8d-9b25-e7f0c81d3a56"
    expect:
      status: 200
      body:
        "orders[0].id": "5e402679-69e4-4329-9cc1-25d607cdfaca"
      absent:
        - "orders[1]"

  # And the position. Asking for one page-worth from
  # search.cursorPaging.cursor=5e402679-69e4-4329-9cc1-25d607cdfaca
  # answers the *second* record, which can only happen if the name was
  # read. Between them these two cases pin both halves; either name
  # renamed to what the runtime falls back on fails one of them.
  - name: "search.cursorPaging.cursor moves the page on, and the second record is what comes back"
    source: "https://dev.wix.com/docs/rest/business-solutions/e-commerce/orders/orders/search-orders"
    fixture: site
    request:
