# Wix eCommerce Orders Recipe for Cauldron
#
# Written against the API definition Wix ships inside its own reference pages
# -- a megabyte of OpenAPI embedded in dev.wix.com/docs/rest/business-solutions
# /e-commerce/orders/order-object, with 632 component schemas, per-method
# triggered events, per-method error tables and the field descriptions this
# Recipe's claims are quoted from -- together with the About Errors and API
# Keys articles for the envelope and the credential.
#
# Wix was named in this collection's own backlog as part of a category gap
# rather than a provider gap: the small-business storefront that lives inside
# somebody else's website. Printify, Shopware, Ecwid and Squarespace have
# shipped from that list; this is the fifth and the largest.
#
# The shipping address is not where it ships to.
#
# Wix says it in the field's own description:
#
#   shippingDestination -- "Shipping destination address and contact details.
#   For pickup orders, this contains the pickup location address, not the
#   recipient's address."
#
# So on a pickup order, the field with the word shipping in it twice --
# shippingInfo.logistics.shippingDestination -- holds a shop. The customer is
# in recipientInfo, a field whose name says nothing about shipping, and whose
# description is the other half of the same sentence: "This field represents
# who will ultimately receive the order. It may differ from
# shippingInfo.logistics.shippingDestination when: the chosen shipping option
# is a pickup point or store pickup, where shippingDestination contains the
# pickup location."
#
# Every integration that prints labels reaches for the shipping field, because
# that is what it is called. On the orders a shop sells most of, the two agree
# and nothing goes wrong. On a click-and-collect order the parcel is posted to
# the depot the customer was going to walk to, addressed to the depot, and the
# only sign is a delivery that succeeded to the wrong place.
#
# Six more, each from the same document:
#
#   1. Importing an order is not creating one. POST /ecom/v1/orders triggers
#      wix.ecom.v1.order_created; POST /ecom/v1/orders/import triggers
#      wix.ecom.v1.order_imported and nothing else. The Recipe's own words:
#      "Imported orders trigger the dedicated OrderImported and
#      ImportedOrderDeleted domain events." A shop migrating ten years of
#      history from another platform produces ten years of orders and not one
#      order_created, so every handler subscribed to the obvious event stays
#      silent through the entire migration -- and stays silent in exactly the
#      way a working system does.
#   2. An order with nothing to ship is born fulfilled. Of FULFILLED: "All of
#      the order items are fulfilled or the order was manually marked as
#      fulfilled. Orders without shipping info are fulfilled automatically."
#      So a download, a gift card or a booking is FULFILLED the moment it
#      exists, and code reading that status as "we have sent it" is reading a
#      fact about the catalogue rather than about the warehouse.
#   3. Cancelling announces itself twice. Wix's method table gives the cancel
#      endpoint two triggered events, Order Updated and Order Canceled, so a
#      subscriber to both is woken twice for one act -- and a handler that is
#      not idempotent does whatever it does twice.
#   4. archived hides an order from the people, not from the program:
#      "Archived orders are hidden from the main orders view in the dashboard,
#      but remain retrievable through the API." That is the inverse of the
#      shape Ecwid and Squarespace have, where the listing hides something the
#      dashboard shows, and it fails the other way round -- a merchant who
#      archives an order to get it out of the way has not removed it from
#      anything a report counts.
#   5. taxSummary carries a removal date that has been and gone: "Deprecated.
#      Use `taxInfo` instead. This field will be removed on September 30,
#      2024." The document saying so was updated in 2026 and still ships the
#      field, so the notice is now evidence of nothing except that somebody
#      wrote it.
#   6. Two enumerations in this one document are called PaymentStatus and do
#      not share a vocabulary. The order's is NOT_PAID, PAID, PARTIALLY_PAID,
#      PARTIALLY_REFUNDED, FULLY_REFUNDED, PENDING, PENDING_MERCHANT, CANCELED,
#      DECLINED. The other is APPROVED, PENDING, PENDING_MERCHANT, CANCELED,
#      DECLINED, REFUNDED, PARTIALLY_REFUNDED, AUTHORIZED, VOIDED. Four values
#      overlap, PAID and APPROVED are the same idea under different names, and
#      a generated client keeps one type for both.
#
# Three shapes here are recorded against other providers and are stated as
# shared rather than offered as findings:
#
#   - The listing is a POST with its paging in the body, which is Attio's and
#     is now common enough here to be a convention rather than a surprise.
#   - metadata.count is "Number of items returned in current page" and not the
#     number matching -- Shopware's, and the same trap: on a fixture that fits
#     one page the two agree.
#   - Money travels as a decimal string beside a preformatted display string,
#     {"amount": "85.00", "formattedAmount": "$85.00"}, which is FastSpring's.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Wix requires wix-site-id or wix-account-id "but not both". The required
#     half is served; the exclusion is a refusal keyed on two headers
#     appearing together, which this format cannot say, and declaring it
#     against particular values would serve one pair of strings while claiming
#     a rule.
#   - Search Orders takes a filter object in Wix's own query language and a
#     sort array of at most four entries. What is served is the paging and the
#     envelope; the filter language is not modelled, and a request carrying
#     one gets the whole collection rather than a refusal.
#   - The order object has forty top-level fields and this Recipe declares the
#     ones its claims need. Line items, activities, additional fees, extended
#     fields, balance summaries and platform fees are present in the fixture
#     only where a claim rests on them.
#   - The dedicated cancel endpoint is not modelled and its refusals are the
#     reason. Cancel Order lists ORDER_IS_PENDING -- "Order can't be canceled
#     because its status is `PENDING`" -- beside ORDER_IS_REJECTED and
#     ORDER_HAS_AUTHORIZED_TRANSACTION, all three at HTTP 428 Precondition
#     Required, which is a status most error handling has no branch for. All
#     three refuse on the record's own state rather than on anything in the
#     request, and a route here either always fails or never does. Cancelling
#     through the update route is served, including both of its events.
#   - Catalogs, checkouts, carts, fulfillments and the rest of the eCommerce
#     platform are absent. Orders only.
#   - Wix's error body carries two sentences about one failure -- message and
#     details.applicationError.description -- and its own example shows them
#     disagreeing in detail ("Payment failed" beside "Payment declined due to
#     insufficient funds"). Only the first is served: this format has one
#     message per failure, and duplicating it under the second name would
#     claim the two always agree, which is the opposite of what the example
#     shows.
#   - imported is "Set automatically at import time and cannot be changed
#     afterwards", and no route here stamps it: the flag is seeded on the
#     migrated order in the fixture, and what the import route serves is the
#     event, which is the claim that matters.
#   - fulfillmentStatus is readOnly in Wix's schema and derived from whether
#     the order has anything to ship. This Recipe serves it as seeded and
#     declares no default, because a default of NOT_FULFILLED would
#     contradict the claim above for every order with nothing to ship, and a
#     default of FULFILLED would contradict it for every order with something.
#
# The credential shape needed no site, and struck live against
# www.wixapis.com on 2026-09-05 it found Wix does not have one
# credential-failure shape at all -- it has one per operation, and this
# file's single 401 UNAUTHENTICATED matched none of them. SearchOrders
# answers 403, shaped like a permission refusal and naming the operation
# in both the sentence and the code ("read order: permission denied",
# READ_ORDER_FORBIDDEN); GetOrder answers 428 Precondition Required with a
# different sentence and code again (MISSING_IDENTITY_CONTEXT). A write
# (CreateOrder), sent with an empty body and no credential, never
# surfaced a credential complaint at all -- it answered a plain
# body-validation error instead, so create, import and update keep the
# search route's shape rather than a fourth guess. A path nothing
# declares is a 404 with nothing in it, resolved before any of the above.
#
# The key and the ids below are fixtures and belong to no site.

recipe: wix
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://dev.wix.com/docs/rest/business-solutions/e-commerce/orders/orders

auth:
  # The key bare in the header, with no scheme word in front of it. Wix's
  # instruction is to "include the key from the API Key Manager in the
  # Authorization header", and a client that helpfully prefixes Bearer is
  # refused.
  scheme: header
  header: Authorization
  keys:
    - IST.cauldron-wix-fixture-key
  # Verified live 2026-09-05: a path nothing declares is a 404 with no
  # credential sent at all. Routing wins.
  after_routing: true

# Site-level calls carry the site. Account-level calls carry wix-account-id
# instead, and Wix's rule is one or the other and "not both" -- see the gaps
# at the top of this file for the half that is not served.
required_headers:
  wix-site-id: site_id_missing

responses:
  list:
    style: wrapped
    key: orders
    # "Number of items returned in current page", which is not the number of
    # orders matching. Shopware's trap, in Wix's own words.
    count_field: metadata.count
    count_means: page
    cursor_field: metadata.cursors.next
    has_more_field: metadata.hasNext
  resource:
    style: wrapped
    key: order
  error:
    # Flat, because Wix's message sits at the top level and only the code
    # nests: {"message": ..., "details": {"applicationError": {"code": ...}}}.
    # A dotted code_field puts it where Wix puts it.
    style: flat
    message_field: message
    code_field: details.applicationError.code
    type_field: "-"

resources:
  order:
    id:
      style: uuid
    fields:
      # A number, not a string, and displayed to the merchant rather than
      # used to address anything.
      number:
        type: integer
      createdDate:
        type: datetime
      updatedDate:
        type: datetime
      # INITIALIZED, APPROVED, CANCELED, PENDING, REJECTED.
      status:
        type: string
        default: APPROVED
      # NOT_PAID, PAID, PARTIALLY_PAID, PARTIALLY_REFUNDED, FULLY_REFUNDED,
      # PENDING, PENDING_MERCHANT, CANCELED, DECLINED -- and not the other
      # PaymentStatus in the same document.
      paymentStatus:
        type: string
        default: PAID
      # "Orders without shipping info are fulfilled automatically." Wix marks
      # this readOnly and works it out; there is no default here because
      # either value would be a claim about a computation this Recipe does
      # not perform. See the gaps at the top of this file.
      fulfillmentStatus:
        type: string
      buyerInfo:
        type: map
      lineItems:
        type: list
      priceSummary:
        type: map
      currency:
        type: string
        default: GBP
      # Where the parcel goes, which on a pickup order is a shop.
      shippingInfo:
        type: map
      # And who is meant to end up with it.
      recipientInfo:
        type: map
      billingInfo:
        type: map
      # Hidden from the dashboard and not from here.
      archived:
        type: boolean
        default: false
      # Set when somebody clicks the order in the dashboard.
      seenByAHuman:
        type: boolean
        default: false
      # Set at import time and never afterwards.
      imported:
        type: boolean
        default: false
      taxIncludedInPrices:
        type: boolean
        default: true
      buyerLanguage:
        type: string
        default: en
      weightUnit:
        type: string
        default: KG
      # "Deprecated. Use `taxInfo` instead. This field will be removed on
      # September 30, 2024." Still here.
      taxSummary:
        type: map
      taxInfo:
        type: map

routes:
  # A POST that reads. The paging travels in the body with the filter, which
  # is Attio's shape and is stated as shared.
  - method: POST
    path: /ecom/v1/orders/search
    resource: order
    operation: list
    pagination:
      style: cursor
      in: body
      cursor_param: search.cursorPaging.cursor
      limit_param: search.cursorPaging.limit
      limit: 100

  # Verified live 2026-09-05: this operation's own credential failure is
  # 428, MISSING_IDENTITY_CONTEXT -- a third shape again from the search
  # route's 403 -- so it names its own error rather than inheriting.
  - method: GET
    path: /ecom/v1/orders/{id}
    resource: order
    operation: get
    auth:
      scheme: header
      header: Authorization
      keys:
        - IST.cauldron-wix-fixture-key
      absent_error: missing_identity_context
      rejected_error: missing_identity_context

  # The order somebody placed.
  - method: POST
    path: /ecom/v1/orders
    resource: order
    operation: create
    emits: wix.ecom.v1.order_created

  # And the order somebody moved, which is a different event and no other.
  - method: POST
    path: /ecom/v1/orders/import
    resource: order
    operation: create
    emits: wix.ecom.v1.order_imported

  - method: PATCH
    path: /ecom/v1/orders/{id}
    resource: order
    operation: update
    emits: wix.ecom.v1.order_updated
    emits_when:
      # Cancelling announces itself twice: the general update above and the
      # specific one here, both listed against the cancel endpoint.
      - event: wix.ecom.v1.order_canceled
        field: status

webhooks:
  events:
    - wix.ecom.v1.order_created
    - wix.ecom.v1.order_imported
    - wix.ecom.v1.order_updated
    - wix.ecom.v1.order_canceled
  payload:
    id: "{id}"
    eventType: "{event}"
    instanceId: 4c7f5a2e-9d31-4b18-b0a6-51d2c3f88a04
    entityId: "{record_id}"
    slug: "{action}"
    entityFqdn: wix.ecom.v1.order

errors:
  # Verified live against www.wixapis.com 2026-09-05, on SearchOrders: no
  # credential at all and a present, invalid one are byte-identical, and
  # neither is the 401 UNAUTHENTICATED this file had invented -- it is a
  # 403, shaped like a permission refusal rather than an authentication
  # one, naming the operation in both the sentence and the code.
  authentication_error:
    status: 403
    message: "read order: permission denied"
    code: READ_ORDER_FORBIDDEN

  # Verified the same day, on GetOrder: a third answer again -- 428
  # Precondition Required, a different sentence and a different code,
  # for what is also a read with no credential. Wix does not appear to
  # have one credential-failure shape; it has one per operation, and only
  # these two were checked. A write (CreateOrder) sent with an empty body
  # and no credential answered a plain body-validation error instead,
  # never surfacing a credential complaint at all -- so create, import and
  # update keep the single shape above rather than a guess about a fourth.
  missing_identity_context:
    status: 428
    message: "Can't read order: identity context is missing"
    code: MISSING_IDENTITY_CONTEXT

  # Verified live 2026-09-05: a path nothing declares. Zero bytes, no
  # credential needed to reach it -- routing wins over the search route's
  # own auth block.
  unknown_route:
    status: 404
    empty: true

  site_id_missing:
    status: 400
    message: A wix-site-id or wix-account-id header is required.
    code: MISSING_SITE_ID

  resource_missing:
    status: 404
    message: Order not found.
    code: ORDER_NOT_FOUND

  invalid_request:
    status: 400
    message: One or more request parameters is wrong or missing.
    code: INVALID_ARGUMENT

