conformance:
  - name: no credential at all reads as a permission refusal, not an authentication one
    source: https://www.wixapis.com/ecom/v1/orders/search
    verified: "2026-09-05"
    request:
      method: POST
      path: /ecom/v1/orders/search
      json: {}
    expect:
      status: 403
      body:
        message: "read order: permission denied"
        "details.applicationError.code": READ_ORDER_FORBIDDEN

  - name: and a present, invalid credential answers byte-identical
    source: https://www.wixapis.com/ecom/v1/orders/search
    verified: "2026-09-05"
    request:
      method: POST
      path: /ecom/v1/orders/search
      headers:
        Authorization: garbage-invalid-000
      json: {}
    expect:
      status: 403
      body:
        message: "read order: permission denied"
        "details.applicationError.code": READ_ORDER_FORBIDDEN

  - name: a path nothing declares is a 404 with nothing in it
    source: https://www.wixapis.com/ecom/v1/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      path: /ecom/v1/not-a-real-endpoint
    expect:
      status: 404
      no_body: true

  - name: the shipping address on a pickup order is the shop, not the customer
    source: https://dev.wix.com/docs/rest/business-solutions/e-commerce/orders/orders/order-object
    fixture: site
    request:
      method: GET
      path: /ecom/v1/orders/5e402679-69e4-4329-9cc1-25d607cdfaca
      headers:
        Authorization: IST.cauldron-wix-fixture-key
        wix-site-id: 3c76e2ab-1f04-4a8d-9b25-e7f0c81d3a56
    expect:
      status: 200
      body:
        # "For pickup orders, this contains the pickup location address, not
        # the recipient's address." A label printed from the field with
        # shipping in its name goes to an industrial estate.
        "order.shippingInfo.logistics.shippingDestination.address.addressLine": DPD Pickup, Unit 7 Vale Trading Estate
        "order.shippingInfo.logistics.shippingDestination.address.postalCode": BS3 4EA
        # And the person the order is for, under a name that says nothing
        # about shipping at all.
        "order.recipientInfo.address.addressLine": 14 Cotham Brow
        "order.recipientInfo.address.postalCode": BS6 6AS
        "order.recipientInfo.contactDetails.firstName": Ada

  - name: and on an ordinary order the two agree, which is why nobody notices
    source: https://dev.wix.com/docs/rest/business-solutions/e-commerce/orders/orders/order-object
    fixture: site
    request:
      method: GET
      path: /ecom/v1/orders/a04f7b62-8d15-4e93-bc27-30fa9e1d6c85
      headers:
        Authorization: IST.cauldron-wix-fixture-key
