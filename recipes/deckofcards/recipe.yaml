# Deck of Cards API Recipe for Cauldron
#
# A failed draw empties the deck and hands you the cards anyway.
#
#   GET /api/deck/new/draw/?count=999
#   ->  200 {"success": false,
#            "error": "Not enough cards remaining to draw 999 additional",
#            "cards": [ ...all 52... ],
#            "remaining": 0}
#
# Asking a fifty-two card deck for 999 cards does not refuse. It draws all
# fifty-two, sets remaining to 0, says success: false, and returns them. The
# status line says 200.
#
# There is no safe way to read that. A client that checks success and discards
# the body has thrown away fifty-two real cards and left the deck empty. A
# client that ignores success has fifty-two cards it did not ask for the right
# number of. Either way the deck is spent, and the request that spent it is the
# one the API called a failure.
#
# **And the ten is a zero.** Card codes are two characters, so the ten of spades
# is "0S" -- while its value field says the string "10". Anything parsing a code
# by taking its first character reads a nought where a ten should be, and
# anything mapping value to code has to know that one rank is spelled two ways.
#
# Written against the live API rather than a document: every case below was
# checked against deckofcardsapi.com on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A non-numeric count is a Django error page. ?count=abc answers 500 with
#      "<title>Server Error (500)</title>" in HTML, from a JSON API -- so a
#      client that parses every response as JSON throws on the parse, and the
#      one it throws on is the framework's default page rather than anything the
#      API wrote.
#   2. Every image is in the response twice. image and images.png are the same
#      URL, character for character, on every card.
#   3. value is a string for numbers and a word for faces. "10" and "6" and
#      "ACE" and "KING" are one field, so sorting a hand by value sorts "10"
#      before "6" and puts both before "ACE".
#   4. The failure that is a real failure looks nothing like the failure that is
#      not. A deck id that does not exist answers 404 with
#      {"success": false, "error": "Deck ID does not exist."} and no cards --
#      the same success field, the same error field, and a status that means it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - deck_id is minted at random by the real API and is fixed here, so a Recipe
#     can be addressed by it. Nothing else about a deck is stable between calls.
#   - Three cards are served, not fifty-two, and the over-draw case reports
#     drawing those three rather than all of them. What is being shown is the
#     shape of the answer: success false, an error sentence, remaining zero, and
#     the cards present anyway.
#   - /api/deck/new/ is not modelled. It mints an identifier at random, so an
#     emulator answering it would have to invent one, and a Recipe addressed by
#     that identifier could never be asked about it again. The shuffle route,
#     which takes a deck it already knows, is modelled instead.
#   - Only the shuffle and draw routes are modelled. Piles, the back-to-deck
#     endpoint and jokers answer other documents.

recipe: deckofcards
capability: infrastructure
version: 0.1.0

upstream:
  api: deckofcards
  docs: https://deckofcardsapi.com/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    style: wrapped
    key: cards
    fields:
      # A boolean beside the HTTP status, and the two disagree.
      success: true
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    fields:
      success: false

resources:
  deck:
    id:
      style: opaque
      field: deck_id
    fields:
      remaining:
        type: integer
      shuffled:
        type: boolean

  card:
    id:
      style: opaque
      # The ten is "0S": two characters, so the rank becomes a nought.
      field: code
    fields:
      # The deck the card came from, which the path names and the body does
      # not echo.
      deck:
        type: string
        in: "-"
      # The same URL as images.png, character for character.
      image:
        type: string
      images:
        type: map
      # "10" and "6" and "ACE" in one field.
      value:
        type: string
      suit:
        type: string

routes:
  # A deck by its own identifier. /api/deck/new/ mints one at random and is
  # not modelled: an emulator that answered it would have to invent an id, and
  # a Recipe addressed by that id could never be asked about it again.
  - method: GET
    path: /api/deck/{id}/shuffle/
    resource: deck
    operation: get
    not_found: deck_not_found

  - method: GET
    path: /api/deck/{deck}/draw/
    resource: card
    operation: list
    pagination:
      # count, and no position. Struck live on 2026-09-05: a bare draw
      # answers one card with remaining 51, and ?count=2 answers two. So
      # count is the size and the default is one -- a number worth having
      # right, because this endpoint is destructive: what it draws leaves
      # the deck, which is what remaining counts down.
      #
      # There is no position and there cannot be one. A second page of a
      # draw is just another draw, and "-" says the provider takes no name
      # for it.
      style: cursor
      limit: 1
      limit_param: count
      cursor_param: "-"
    scope: [deck]

  # Over the deck's size: not a refusal, and not a 4xx.
  - method: GET
    path: /api/deck/{deck}/draw/
    matches_query:
      count: "999"
    error: not_enough_cards

  # And a count that is not a number at all.
  - method: GET
    path: /api/deck/{deck}/draw/
    matches_query:
      count: abc
    error: server_error

errors:
  # The failure that means it: a 404, no cards, and a sentence.
  deck_not_found:
    status: 404
    message: Deck ID does not exist.

  # The failure that does not: a 200, all the cards, and an emptied deck.
  not_enough_cards:
    status: 200
    message: Not enough cards remaining to draw 999 additional
    fields:
      success: false
      deck_id: cauldronfixture1
      remaining: 0
      cards:
        - code: AS
          image: https://deckofcardsapi.com/static/img/AS.png
          images:
            svg: https://deckofcardsapi.com/static/img/AS.svg
            png: https://deckofcardsapi.com/static/img/AS.png
          value: ACE
          suit: SPADES
        - code: 0S
          image: https://deckofcardsapi.com/static/img/0S.png
          images:
            svg: https://deckofcardsapi.com/static/img/0S.svg
            png: https://deckofcardsapi.com/static/img/0S.png
          value: "10"
          suit: SPADES
        - code: KD
          image: https://deckofcardsapi.com/static/img/KD.png
          images:
            svg: https://deckofcardsapi.com/static/img/KD.svg
            png: https://deckofcardsapi.com/static/img/KD.png
          value: KING
          suit: DIAMONDS

  # A framework's default page, from a JSON API.
  server_error:
    status: 500
    style: text
    headers:
      Content-Type: text/html
    message: |-
      <!doctype html>
      <html lang="en">
      <head>
        <title>Server Error (500)</title>
      </head>
      <body>
        <h1>Server Error (500)</h1><p></p>
      </body>
      </html>

fixtures:
  empty: {}

  table:
    deck:
      - id: cauldronfixture1
        remaining: 3
        shuffled: true

      # A second deck, so that the deck in the path is partitioning rather
      # than decorating.
      - id: cauldronfixture2
        remaining: 1
        shuffled: false

    card:
      # A face, spelled out in value and lettered in code.
      - id: AS
        deck: cauldronfixture1
        image: https://deckofcardsapi.com/static/img/AS.png
        images:
          # The same URL as image above, character for character.
          svg: https://deckofcardsapi.com/static/img/AS.svg
          png: https://deckofcardsapi.com/static/img/AS.png
        value: ACE
        suit: SPADES

      # And the one rank spelled two ways: a nought in the code and a ten in
      # the value.
      - id: 0S
        deck: cauldronfixture1
        image: https://deckofcardsapi.com/static/img/0S.png
        images:
          svg: https://deckofcardsapi.com/static/img/0S.svg
          png: https://deckofcardsapi.com/static/img/0S.png
        value: "10"
        suit: SPADES

      - id: KD
        deck: cauldronfixture1
        image: https://deckofcardsapi.com/static/img/KD.png
        images:
          svg: https://deckofcardsapi.com/static/img/KD.svg
          png: https://deckofcardsapi.com/static/img/KD.png
        value: KING
        suit: DIAMONDS

      # In the other deck, and in no answer about the first one.
      - id: 2C
        deck: cauldronfixture2
        image: https://deckofcardsapi.com/static/img/2C.png
        images:
          svg: https://deckofcardsapi.com/static/img/2C.svg
          png: https://deckofcardsapi.com/static/img/2C.png
        value: "2"
        suit: CLUBS

conformance:
  - name: a failed draw empties the deck and hands you the cards anyway
    source: https://deckofcardsapi.com/api/deck/new/draw/?count=999
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/?count=999
    expect:
      # The status line says the request succeeded.
      status: 200
      body:
        # The body says it did not.
        success: false
        error: Not enough cards remaining to draw 999 additional
        # The deck is spent.
        remaining: 0
        # And the cards are here, so discarding the body on success: false
        # throws away real ones.
        "cards[0].code": AS
        "cards[1].code": 0S

  - name: the ten is a zero
    source: https://deckofcardsapi.com/api/deck/new/draw/?count=999
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/
      query:
        # count, and it has to be sent now. Deck of Cards draws ONE card when
        # nothing asks for more -- struck live, remaining 51 -- and this case
        # was relying on the emulator's own default of ten, which is not a
        # number this API has ever used.
        count: "3"
    expect:
      status: 200
      body:
        # A draw that worked says so, where the over-draw beside it says false
        # and still hands over the cards.
        success: true
        "cards[0].code": AS
        # And the other deck's card is not here, so the deck in the path
        # partitions.
        "cards[2].code": KD
        # Two characters, so the rank becomes a nought...
        "cards[1].code": 0S
        # ...while the value beside it spells the number out.
        "cards[1].value": "10"
        "cards[1].suit": SPADES

  - name: value is a string for numbers and a word for faces
    source: https://deckofcardsapi.com/api/deck/new/draw/?count=999
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/
      query:
        # count, for the same reason as the case above.
        count: "3"
    expect:
      status: 200
      body:
        # Sorting a hand by this field puts "10" before "6" and both before
        # "ACE".
        "cards[0].value": ACE
        "cards[1].value": "10"
        "cards[2].value": KING
        "cards[2].code": KD
      absent:
        # Three cards in this deck and one in the other, which is not among
        # them.
        - cards[3]

  - name: every image is in the response twice
    source: https://deckofcardsapi.com/api/deck/new/draw/?count=999
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/
    expect:
      status: 200
      body:
        # The same URL, character for character, on every card.
        "cards[0].image": https://deckofcardsapi.com/static/img/AS.png
        "cards[0].images.png": https://deckofcardsapi.com/static/img/AS.png
        "cards[0].images.svg": https://deckofcardsapi.com/static/img/AS.svg

  - name: a count that is not a number is a framework's error page
    source: https://deckofcardsapi.com/api/deck/new/draw/?count=abc
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/?count=abc
    expect:
      # HTML, from a JSON API, and the page is Django's default rather than
      # anything this API wrote.
      status: 500
      headers:
        Content-Type: text/html
      body_matches: '<title>Server Error \(500\)</title>'

  - name: the failure that means it looks the same and is not
    source: https://deckofcardsapi.com/api/deck/nosuchdeck/draw/?count=1
    verified: "2026-08-30"
    fixture: table
    arm: deck_not_found
    request:
      method: GET
      path: /api/deck/cauldronfixture1/draw/
    expect:
      # The same success field and the same error field as the 200 above, and a
      # status that agrees with them.
      status: 404
      body:
        success: false
        error: Deck ID does not exist.
      absent:
        # And no cards at all, where the other failure had fifty-two.
        - cards

  - name: a deck says how many are left and whether it was shuffled
    source: https://deckofcardsapi.com/api/deck/y8ndpgj54qix/shuffle/
    verified: "2026-08-30"
    fixture: table
    request:
      method: GET
      path: /api/deck/cauldronfixture1/shuffle/
    expect:
      status: 200
      body:
        deck_id: cauldronfixture1
        # Three here against 52 live: the emulator counts what it holds.
        remaining: 3
        shuffled: true
