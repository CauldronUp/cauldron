# E2B Recipe for Cauldron
#
# Written against E2B's API reference at e2b.dev/docs and struck live against
# api.e2b.dev on 2026-09-07 with no credential and then with a deliberately
# invalid one.
#
# **The best malformed-credential message in this collection.** Struck live:
#
#   GET /sandboxes                           X-API-KEY: notreal
#   401 {"code":401,
#        "message":"API key is malformed: expected the \"e2b_\" prefix, visit
#                   https://docs.e2b.dev/api-key for more information"}
#
# It names the failure (malformed rather than unrecognised), names the expected
# prefix (`e2b_`, in quotes), and links a page about API keys specifically.
# Three useful facts in one sentence, and a caller who pasted a project id, an
# access token or a truncated key knows immediately which of those they did.
#
# Nothing else here manages all three. [nango](../nango) names the format --
# UUID v4 -- but links nothing. [browserbase](../browserbase) names the header
# and not the format. [saltedge](../saltedge) links the exact anchor and does
# not describe the shape. E2B does all of it in one line.
#
# **And the missing case is accurate too.** `authorization header is missing`
# for a request that carried none -- where five providers in this collection
# answer "invalid key" to exactly that request.
#
# So E2B gets right the two things this collection has watched most providers
# get wrong, and it does so in nine words each.
#
# **The routing failure is a request validator.** Struck live:
#
#   GET /cauldron-nope
#   404 {"code":404,"message":"validation error: no matching operation was found"}
#
# "No matching operation" is OpenAPI vocabulary -- an operation is what a
# specification calls a path-and-method pair. So E2B validates every request
# against its own OpenAPI document before routing it, and an unknown path is
# reported as a specification mismatch rather than as a missing resource. The
# document is the router.
#
# **`code` is the HTTP status, in the body, as a number.** One field restating
# the status line, and nothing else -- no error code, no type, no correlation
# id anywhere.

recipe: e2b
capability: hosting
version: 0.1.0

upstream:
  api: v1
  docs: https://e2b.dev/docs/api-reference
  # No spec: E2B's OpenAPI document is in its repository rather than at a
  # stable published URL, and the API validates against it without serving it.

auth:
  scheme: header
  header: X-API-KEY
  # The prefix the refusal names in as many words, which is why the shape gate
  # is here rather than in prose.
  shape: '^e2b_[A-Za-z0-9]+$'
  keys:
    - e2b_cauldr0nf1xturekey000000000000
  absent_error: missing_authorization_header
  shape_error: malformed_api_key
  rejected_error: malformed_api_key

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    status_field: code

resources:
  sandbox:
    id:
      field: sandboxID
      style: opaque
    fields:
      templateID:
        type: string
      clientID:
        type: string
      startedAt:
        type: datetime
      endAt:
        type: datetime
      cpuCount:
        type: integer
        default: 2
      memoryMB:
        type: integer
        default: 512
      metadata:

routes:
  - method: GET
    path: /sandboxes
    resource: sandbox
    operation: list
    pagination:
      style: none

errors:
  missing_authorization_header:
    status: 401
    # Accurate about the case it describes, which five providers in this
    # collection are not.
    message: "authorization header is missing"

  malformed_api_key:
    status: 401
    # Names the failure, names the expected prefix, and links a page about
    # API keys. Three useful facts in one sentence.
    message: "API key is malformed: expected the \"e2b_\" prefix, visit https://docs.e2b.dev/api-key for more information"

  unknown_route:
    status: 404
    # OpenAPI vocabulary: an operation is a path-and-method pair. E2B
    # validates every request against its own document before routing it, so
    # an unknown path is a specification mismatch rather than a missing
    # resource -- the document is the router.
    message: "validation error: no matching operation was found"

fixtures:
  empty:
    sandbox: []

  team:
    sandbox:
      - sandboxID: i4v9c8sk2m1p7x3q
        templateID: base
        clientID: 7f3a9c21
        startedAt: "2026-09-07T20:40:12.000Z"
        endAt: "2026-09-07T21:40:12.000Z"
        cpuCount: 2
        memoryMB: 512
        metadata:
          userId: ada
      - sandboxID: b7n2d5wq8k4j0z6r
        templateID: python-data
        clientID: 7f3a9c21
        startedAt: "2026-09-07T21:02:44.000Z"
        endAt: "2026-09-07T21:07:44.000Z"
        # Four times the memory and twice the CPU, on the same team, in the
        # same listing -- so cost per sandbox varies and nothing in the
        # envelope totals it.
        cpuCount: 4
        memoryMB: 2048
        metadata: {}

conformance:
  - name: a malformed key names the prefix and links the page
    source: https://api.e2b.dev/sandboxes
    verified: "2026-09-07"
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: notreal
    expect:
      status: 401
      body:
        # The failure, the expected prefix and a link, in one sentence. The
        # best malformed-credential message in this collection: Nango names
        # the format and links nothing, Browserbase names the header and not
        # the format, Salt Edge links the anchor and does not describe the
        # shape.
        message: "API key is malformed: expected the \"e2b_\" prefix, visit https://docs.e2b.dev/api-key for more information"

  - name: the missing case is accurate about being missing
    source: https://api.e2b.dev/sandboxes
    verified: "2026-09-07"
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers: {}
    expect:
      status: 401
      body:
        # Where five providers in this collection answer "invalid key" to
        # exactly this request.
        message: "authorization header is missing"

  - name: the status is restated in the body as a number
    source: https://api.e2b.dev/sandboxes
    verified: "2026-09-07"
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers: {}
    expect:
      status: 401
      body:
        # One field restating the status line, and nothing else -- no error
        # code, no type, no correlation id anywhere on the failure path.
        code: 401
      absent:
        - error
        - type
        - requestId

  - name: an unknown path is a specification mismatch
    source: https://api.e2b.dev/cauldron-nope
    verified: "2026-09-07"
    fixture: team
    request:
      method: GET
      path: /cauldron-nope
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 404
      body:
        # "No matching operation" is OpenAPI's word for a path-and-method
        # pair, so the document is the router and an unknown path is reported
        # as a validation failure.
        message: "validation error: no matching operation was found"
        code: 404

  - name: sandboxes are a bare array
    source: https://e2b.dev/docs/api-reference
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body:
        '[0].sandboxID': i4v9c8sk2m1p7x3q
        '[0].templateID': base

  - name: a sandbox knows when it will be killed
    source: https://e2b.dev/docs/api-reference
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body:
        # startedAt and endAt, both absolute -- so a client showing "time
        # remaining" subtracts from a wall clock it does not control, and a
        # sandbox extended after this response was built has a stale endAt.
        '[0].startedAt': "2026-09-07T20:40:12.000Z"
        '[0].endAt': "2026-09-07T21:40:12.000Z"

  - name: two sandboxes on one team can cost different amounts
    source: https://e2b.dev/docs/api-reference
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body:
        # Four times the memory and twice the CPU, in one listing, with
        # nothing in the envelope totalling it -- so a client tracking spend
        # multiplies per record and there is no check on its arithmetic.
        '[1].cpuCount': 4
        '[1].memoryMB': 2048
        '[0].memoryMB': 512

  - name: metadata is an untyped object that can be empty
    source: https://e2b.dev/docs/api-reference
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body:
        # Whatever the caller attached, with no schema -- and an empty object
        # rather than null when they attached nothing, so two sandboxes have
        # the same field with no common shape.
        '[0].metadata.userId': ada
        '[1].metadata': {}

  - name: every sandbox names the client that started it
    source: https://e2b.dev/docs/api-reference
    fixture: team
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body:
        # Eight hex characters, the same on both, and it is not the team or
        # the key -- it identifies the orchestrator node, so it changes when
        # E2B reschedules and a client keying on it keys on infrastructure.
        '[0].clientID': 7f3a9c21
        '[1].clientID': 7f3a9c21

  - name: a team with no sandboxes answers an empty array
    source: https://e2b.dev/docs/api-reference
    fixture: empty
    request:
      method: GET
      path: /sandboxes
      headers:
        X-API-KEY: e2b_cauldr0nf1xturekey000000000000
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
