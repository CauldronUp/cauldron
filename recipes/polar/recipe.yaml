# Polar Recipe for Cauldron
#
# Written against the OpenAPI description Polar publishes in its own
# repository, at polarsource/polar under docs/openapi/, version 2026-10.
# Every quoted sentence, field name and enum below was read out of that
# document.
#
# Polar was on this project's backlog as "Assess -- subscriptions and
# benefits", and the second half is why this Recipe exists. The
# merchant-of-record half is FastSpring's and Lemon Squeezy's and is not
# repeated here.
#
# Paying for a thing and receiving it are two different records, and the
# second one can fail on its own.
#
# A Polar benefit is something a purchase entitles a customer to: a licence
# key, a file to download, access to a private GitHub repository, a role in a
# Discord server, a feature flag. Granting one is not bookkeeping. It means
# calling somebody else's API on the customer's behalf, and that call can fail
# permanently.
#
# So there is a BenefitGrant, and it carries all of this:
#
#   is_granted   "Whether the benefit is granted."
#   granted_at   "The timestamp when the benefit was granted. If `None`, the
#                benefit is not granted."
#   is_revoked   "Whether the benefit is revoked."
#   revoked_at   "The timestamp when the benefit was revoked. If `None`, the
#                benefit is not revoked."
#   error        "The error information if the benefit grant failed with an
#                unrecoverable error."
#
# Two booleans and an error object, which is four states rather than two: the
# benefit was granted; it is on its way; it was revoked; or it failed
# permanently and the customer paid for something they will never receive.
# Nothing about the order says so. The order succeeded.
#
# And the listing does not separate them. is_granted is a filter, off by
# default, so the ordinary view of a customer's entitlements mixes the ones
# they have with the ones that failed -- and counting rows counts both.
#
# Five more, each from the same document:
#
#   1. The credential is a bearer token and there are four kinds of it.
#      pat is a personal access token, oat is an organization access token,
#      customer_session and member_session are tokens issued for one customer
#      or one member, and all four are declared "scheme: bearer". They travel
#      in the same header and look identical in the request, so using the
#      wrong one is a 401 with nothing in the payload to say which.
#   2. The collection ends in a slash and the item does not. /v1/benefits/ is
#      the listing and /v1/benefits/{id} is one of them, in the same API, and
#      the difference is a character.
#   3. There are two paging envelopes. Most listings answer
#      {items, pagination: {total_count, max_page}}; events answer a cursor
#      envelope instead. One API, two shapes, and the resource decides.
#   4. The page count is a page count. max_page is the last page number
#      rather than a record count, so it sits beside total_count and the two
#      are not the same quantity in the same units.
#   5. What is inside a grant's properties depends on which kind of benefit
#      it is. The schema has a separate properties type for each --
#      Discord, GitHub repository, downloadables, licence keys, feature
#      flags, custom -- so one field is a union of six shapes and the
#      discriminator is on the benefit rather than on the grant.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The granting is not modelled, only its record. A grant here does not
#     call Discord and cannot fail on its own; the fixtures carry one of each
#     state and the case for the failed one is the point.
#   - Polar publishes its description as dated documents -- 2026-04 and
#     2026-10 sit side by side in the repository -- and neither says how a
#     caller selects a version, so this Recipe models 2026-10 and claims
#     nothing about the mechanism.
#   - Orders, subscriptions, checkouts, products, the customer portal and the
#     whole merchant-of-record surface are absent. Benefits and their grants
#     only.
#
# Checked live against api.polar.sh, unauthenticated, 2026-09-05. Two
# findings, both real, neither what this file had from documentation:
#
#   - Routing is checked before the credential. An unrouted path answers 404
#     {"detail":"Not Found"} and a wrong method on a real one answers 405
#     {"detail":"Method Not Allowed"}, neither needing a credential at all --
#     the opposite arrangement from most bearer APIs in this collection, and
#     modelled here with after_routing rather than stated as a gap, because
#     Polar's own arrangement is the one this project's boolean already
#     expresses.
#   - Absent and Rejected are two different shapes, not one message twice.
#     No Authorization header at all answers 401
#     {"error":"Unauthorized","detail":"Unauthorized"}. A syntactically fine
#     but fictitious bearer token answers something else entirely: 401
#     {"error":"invalid_token","error_description":"The access token
#     provided is expired, revoked, malformed, or invalid for other
#     reasons."} -- an OAuth2 token-introspection shape with no detail field
#     at all, not the same sentence repeated. This file had modelled one
#     message, "Invalid token.", for both.
#
# The token below is a fixture and belongs to no organisation.

recipe: polar
capability: payments
version: 0.1.0

upstream:
  api: "2026-10"
  docs: https://docs.polar.sh/api-reference
  # Found by cauldron discover rather than recorded by hand. This
  # document declares all three routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://polar.sh/docs/openapi.json
  spec_hash: 4ee93baa765c163f96fd944999da3b7aaf9c6606f29c139ed972c7c4c2872f73
  spec_seen: "2026-09-05"

auth:
  # One of four kinds, and the request cannot tell you which this is.
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - polar_oat_cauldron_fixture_000000
  # Verified live, 2026-09-05: a wrong bearer answers a different shape from
  # a missing one, and routing itself is checked before either -- see the
  # file header.
  rejected_error: invalid_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    count_field: pagination.total_count
    # A page number rather than a record count, beside a record count.
    pages_field: pagination.max_page
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"
    type_field: "-"

resources:
  grant:
    id:
      style: uuid
    fields:
      # Two booleans and two timestamps saying the same two things, and an
      # error that is a third thing entirely.
      is_granted:
        type: boolean
        default: false
      granted_at:
        type: string
        null_when_unset: true
      is_revoked:
        type: boolean
        default: false
      revoked_at:
        type: string
        null_when_unset: true
      # "The error information if the benefit grant failed with an
      # unrecoverable error." message, type and timestamp, all required when
      # it is there at all.
      error:
        type: map
        null_when_unset: true
      customer_id:
        type: string
      benefit_id:
        type: string
      subscription_id:
        type: string
        null_when_unset: true
      order_id:
        type: string
        null_when_unset: true
      # A union of six shapes, chosen by the kind of benefit rather than by
      # anything on the grant.
      properties:
        type: map
      created_at:
        type: string
      modified_at:
        type: string

  benefit:
    id:
      style: uuid
    fields:
      type:
        type: string
      description:
        type: string
      selectable:
        type: boolean
        default: false
      deletable:
        type: boolean
        default: true
      organization_id:
        type: string
      created_at:
        type: string

routes:
  # The listing, and its path ends in a slash.
  - method: GET
    path: /v1/benefit-grants/
    resource: grant
    operation: list
    filters:
      # Off by default, which is the point: the ordinary view of a customer's
      # entitlements mixes the ones they have with the ones that failed.
      - param: is_granted
        field: is_granted
    pagination:
      style: page
      # "Size of a page, defaults to 10. Maximum is 100."
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: page
      first_page: 1
      # Unlike the last two Recipes here that met a documented ceiling, this
      # document says what happens above it: the 422 example is "Input should
      # be less than or equal to 100". A refusal, not a trim, so it can be
      # declared rather than left out.
      over_limit: unprocessable

  # The collection ends in a slash and the item does not, in the same API.
  - method: GET
    path: /v1/benefits/
    resource: benefit
    operation: list
    pagination:
      style: page
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: page
      first_page: 1

  - method: GET
    path: /v1/benefits/{id}
    resource: benefit
    operation: get

errors:
  # Verified live, 2026-09-05: no Authorization header at all. error and
  # detail carry the identical word -- not one field standing in for the
  # other, both hold "Unauthorized".
  authentication_error:
    status: 401
    message: Unauthorized
    fields:
      error: Unauthorized

  # Verified live, 2026-09-05: a syntactically fine but fictitious bearer
  # token. An OAuth2 introspection shape, unrelated to the one above -- no
  # detail field, and the sentence sits in error_description.
  invalid_token:
    status: 401
    code: invalid_token
    message: "The access token provided is expired, revoked, malformed, or invalid for other reasons."
    message_field: error_description
    code_field: error

  # Verified live, 2026-09-05, against an unrouted path.
  unknown_route:
    status: 404
    message: Not Found

  # Verified live, 2026-09-05, against a real path with an unsupported method.
  method_not_allowed:
    status: 405
    message: Method Not Allowed

  resource_missing:
    status: 404
    message: Not Found

  unprocessable:
    status: 422
    message: Validation error.
    fields:
      detail:
        - loc:
            - query
            - limit
          msg: Input should be less than or equal to 100
          type: less_than_equal

fixtures:
  empty: {}

  entitlements:
    grant:
      # Granted. The customer paid and has the thing.
      - id: 8b1f0c74-3a92-4e56-9d08-15c7be420f31
        is_granted: true
        granted_at: "2026-02-20T14:03:11.482Z"
        is_revoked: false
        customer_id: 2d5a9e13-7c40-4b81-a6f2-93de0c8b571a
        benefit_id: c40f7a25-1e68-4d93-b207-5af1c9e83d60
        order_id: 71e3b0d8-46ca-4f27-8b95-0c2fd7a61e34
        properties:
          account_id: "704259831026438145"
          guild_id: "1042598310264381450"
        created_at: "2026-02-20T14:03:09.117Z"
        modified_at: "2026-02-20T14:03:11.482Z"
      # Paid for and never delivered. is_granted is false, granted_at is null,
      # nothing was revoked, and the error says why -- and none of that is
      # visible from the order, which succeeded.
      - id: 4e7c2b91-05fd-4a38-9c16-8b3e0d5a7c24
        is_granted: false
        is_revoked: false
        customer_id: 9f4b1d07-2ea5-4c63-8710-6d92ba0e5f38
        benefit_id: a17e4c02-9b36-4d58-bf01-72ca6e83d915
        order_id: 3c8f6e21-4d07-4b92-a5e3-10bf7d94c268
        error:
          type: GitHubRepositoryError
          message: The user is not a member of the organization and the invitation expired.
          timestamp: "2026-02-21T09:47:02.913Z"
        properties:
          repository_owner: hooli
          repository_name: private-sdk
        created_at: "2026-02-21T09:46:55.204Z"
        modified_at: "2026-02-21T09:47:02.913Z"
      # Granted once and taken back, which is a third state again: both
      # timestamps present and both booleans true.
      - id: 6a0d3f18-8c47-4e25-b93a-2f5c1e70d846
        is_granted: true
        granted_at: "2026-01-14T11:20:33.006Z"
        is_revoked: true
        revoked_at: "2026-02-14T00:00:04.771Z"
        customer_id: 2d5a9e13-7c40-4b81-a6f2-93de0c8b571a
        benefit_id: c40f7a25-1e68-4d93-b207-5af1c9e83d60
        subscription_id: 5b2e9c40-1a73-4f68-8d05-c39e7b1a2046
        properties:
          account_id: "704259831026438145"
          guild_id: "1042598310264381450"
        created_at: "2026-01-14T11:20:31.884Z"
        modified_at: "2026-02-14T00:00:04.771Z"
    benefit:
      - id: c40f7a25-1e68-4d93-b207-5af1c9e83d60
        type: discord
        description: Supporter role
        selectable: false
        deletable: true
        organization_id: e51d8b36-0f24-4a97-9c68-31ab5d70e2f4
        created_at: "2025-11-02T16:41:07.550Z"
      - id: a17e4c02-9b36-4d58-bf01-72ca6e83d915
        type: github_repository
        description: Private SDK access
        selectable: false
        deletable: true
        organization_id: e51d8b36-0f24-4a97-9c68-31ab5d70e2f4
        created_at: "2025-12-08T09:15:44.219Z"

conformance:
  - name: no Authorization header at all repeats the word in two fields
    source: https://api.polar.sh/v1/benefits/
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/benefits/
    expect:
      status: 401
      body:
        error: Unauthorized
        detail: Unauthorized

  - name: and a fictitious bearer token is a different shape entirely
    source: https://api.polar.sh/v1/benefits/
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/benefits/
      headers:
        Authorization: Bearer polar_oat_fakecauldronprobeonly000
    expect:
      status: 401
      body:
        error: invalid_token
        error_description: "The access token provided is expired, revoked, malformed, or invalid for other reasons."
      absent:
        - detail

  - name: an unrouted path 404s with no credential needed at all
    source: https://api.polar.sh/v1/nonexistent
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/nonexistent
    expect:
      status: 404
      body:
        detail: Not Found

  - name: and a wrong method on a real path 405s the same way
    source: https://api.polar.sh/v1/benefits/
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /v1/benefits/
    expect:
      status: 405
      body:
        detail: Method Not Allowed

  - name: a customer can pay for a benefit and never receive it
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?limit=3
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # Not granted, not revoked, and an error that says it never will be.
        # "The error information if the benefit grant failed with an
        # unrecoverable error" -- unrecoverable, so nothing is retrying.
        "items[1].is_granted": false
        "items[1].is_revoked": false
        "items[1].error.type": GitHubRepositoryError
        "items[1].order_id": 3c8f6e21-4d07-4b92-a5e3-10bf7d94c268
      matches:
        "items[1].error.message": invitation expired

  - name: and the ordinary listing counts it with the rest
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # Three grants, one of which delivered nothing. is_granted is a filter
        # and it is off unless asked for, so "how many benefits does this
        # customer have" is not this number.
        "pagination.total_count": 3
        "pagination.max_page": 1

  - name: unless the caller asks for the ones that worked
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?is_granted=true
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # Two, and the failed one is gone. Note what is still here: the
        # revoked grant, which was granted and then taken away, so even this
        # filter is not the question a client meant to ask.
        "pagination.total_count": 2
        "items[0].is_granted": true
        "items[1].is_revoked": true

  - name: two booleans make four states rather than two
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?limit=3
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # Granted and not revoked.
        "items[0].is_granted": true
        "items[0].is_revoked": false
        # Neither, with an error: paid for and never delivered.
        "items[1].is_granted": false
        "items[1].is_revoked": false
        # Both, with both timestamps: granted once and taken back. A client
        # that reads is_granted alone calls this one active.
        "items[2].is_granted": true
        "items[2].is_revoked": true
        "items[2].revoked_at": "2026-02-14T00:00:04.771Z"

  - name: a timestamp is null when the thing did not happen
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?limit=2
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # "If `None`, the benefit is not granted", and the same for revoked.
        # So there are two ways to read every grant and they had better agree.
        "items[1].granted_at": null
        "items[1].revoked_at": null
        "items[0].revoked_at": null

  - name: what is inside properties depends on the kind of benefit
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?limit=2
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # A Discord grant carries an account and a guild; a GitHub one carries
        # an owner and a repository. Six shapes under one field name, and the
        # discriminator is on the benefit rather than here.
        "items[0].properties.guild_id": "1042598310264381450"
        "items[1].properties.repository_name": private-sdk
      absent:
        - "items[0].properties.repository_name"
        - "items[1].properties.guild_id"

  - name: the collection ends in a slash
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefits/
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        "items[0].type": discord
        "pagination.total_count": 2

  - name: and the item does not
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefits/a17e4c02-9b36-4d58-bf01-72ca6e83d915
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      # One character between the two paths, in the same API, and neither
      # spelling works for the other.
      status: 200
      body:
        type: github_repository
        description: Private SDK access

  - name: the collection's spelling does not answer for the item
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefits/a17e4c02-9b36-4d58-bf01-72ca6e83d915/
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      # The item path with a slash on the end is not the item path.
      status: 404

  - name: a request naming no page size gets ten
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      status: 200
      body:
        # "Size of a page, defaults to 10. Maximum is 100." Three grants fit
        # on one page, and max_page says one -- a page number beside a record
        # count, in the same object, in different units.
        "pagination.total_count": 3
        "pagination.max_page": 1
        "items[2].is_revoked": true

  - name: a page above the maximum is refused rather than trimmed
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/?limit=250
      headers:
        Authorization: Bearer polar_oat_cauldron_fixture_000000
    expect:
      # 422, with the reason in a list of validation errors rather than as a
      # sentence -- so the message a client wants to log is three levels down
      # and the top-level detail is an array.
      status: 422
      body:
        "detail[0].type": less_than_equal
        "detail[0].loc[1]": limit
      matches:
        "detail[0].msg": less than or equal to 100

  - name: one of four bearer tokens is the wrong one and none of them says so
    source: https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json
    fixture: entitlements
    request:
      method: GET
      path: /v1/benefit-grants/
      headers:
        Authorization: Bearer polar_pat_belongs_to_a_person_00
    expect:
      # pat, oat, customer_session and member_session are all declared
      # "scheme: bearer" and travel in this header. The refusal cannot tell a
      # wrong token from the wrong kind of token, because the request does not
      # say which kind it was -- and, verified live, it is not even the same
      # shape as an absent credential (see the file header): a well-formed
      # token this Recipe does not hold gets the OAuth2 introspection error,
      # not the plain "Unauthorized" a missing header gets.
      status: 401
      body:
        error: invalid_token
      absent:
        - detail


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and page=2, which is a page number, and asserts the second
  # record came back on its own: one to skip, one to return, and a third
  # behind it to prove the size stopped the page.
  - name: "limit and page are the two names this listing reads"
    source: "https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json"
    fixture: entitlements
    request:
      method: GET
      path: "/v1/benefit-grants/"
      query:
        "limit": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer polar_oat_cauldron_fixture_000000"
    expect:
      status: 200
      body:
        "items[0].id": "4e7c2b91-05fd-4a38-9c16-8b3e0d5a7c24"
      absent:
        - "items[1]"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://github.com/polarsource/polar/blob/main/docs/openapi/2026-10.openapi.json"
    fixture: entitlements
    request:
      method: GET
      path: "/v1/benefits/"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer polar_oat_cauldron_fixture_000000"
    expect:
      status: 200
      body:
