# LambdaTest Recipe for Cauldron
#
# The build listing, read from the automation API reference, and struck live on
# 2026-09-14 with no credential, with a wrong basic credential, on a path that
# does not exist, with a method the path does not take, on a version that does
# not exist, and on the root.
#
# **BrowserStack and LambdaTest refuse with the same sentence from the same
# middleware, and no client can treat the two the same way.** Both answer
# `HTTP Basic: Access denied.` -- Rack's default. They differ in every other
# respect:
#
#                     LambdaTest                     BrowserStack
#   content type      text/plain; charset=utf-8      text/html; charset=utf-8
#   body length       26 bytes                       27 bytes (trailing newline)
#   realm             "Authorization Required"       "Application"
#   header spelling   www-authenticate               WWW-Authenticate
#
# Two competitors, one library, four differences. And LambdaTest's realm is the
# name of the status code, so the prompt a browser shows the user says
# "Authorization Required" where it should say what they are logging in to.
#
# **One media type, two spellings, on one host.** The 401 declares
# `Content-Type: text/plain; charset=utf-8`; the 404 declares `Content-Type:
# text/plain` with no charset. Same server, same type, different headers.
#
# **A path that does not exist, a verb a path does not take, and a version that
# was never released are one answer.** `/automation/api/v1/cauldron-nope`,
# `PUT /automation/api/v1/builds` and `/automation/api/v2/builds` all answer
# Go's default `404 page not found`, before any credential is read.
#
# **And the API's own root is blocked by its CDN.** `GET /` answers `403` with
# Cloudflare's interstitial: "Sorry, you have been blocked", `<title>Attention
# Required! | Cloudflare</title>`, 4,549 bytes, with conditional comments for
# Internet Explorer 6.
#
# **One key in the envelope is PascalCase and everything else is snake_case.**
# `Meta.attributes.org_id` and `Meta.result_set.{count,limit,offset,total}` sit
# above a `data` array whose records are `build_id`, `status_ind`,
# `create_timestamp`. One capital letter, in the one key a client reads first.
#
# **A field is named for a database column convention.** `status_ind` --
# indicator -- carrying "completed", on a public API record.
#
# **Asking for public URLs changes what another parameter may be.**
# `publicurl` is documented "limit cannot exceed 20 when true", so the maximum
# page size depends on the value of a different, unrelated parameter, and a
# caller who sets both in the wrong order finds out at runtime.
#
# **`sort` is a mini-language, and it can sort by a field the record does not
# have.** Its documented example is `asc.user_id,desc.org_id`: direction and
# field joined by a dot, pairs joined by commas -- and `org_id` appears nowhere
# on a build. It is in `Meta.attributes`.
#
# Also pinned: three identifiers on one record, `build_id` and `user_id`
# numbers and `project_id` the string "ML"; `duration` is a bare number with no
# unit anywhere; and the reference for this API is published under a different
# brand -- lambdatest.com/support/api-doc/ serves TestMu AI, whose canonical
# pages are on testmuai.com, while the API host is still api.lambdatest.com.

recipe: lambdatest
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/

auth:
  scheme: basic
  # The username is the account name; the access key is the password.
  credential: password
  keys:
    - cauldr0nLTf1xtureAccessKey00
  absent_error: access_denied
  malformed_error: access_denied
  rejected_error: access_denied
  # The path and the verb are resolved first: both 404 with nothing sent.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    # One capital letter, above an envelope of snake_case.
    count_field: Meta.result_set.total
    limit_field: Meta.result_set.limit
    page_count_field: Meta.result_set.count
    fields:
      Meta.attributes.org_id: 123

resources:
  build:
    id:
      field: build_id
      type: number
      style: numeric
    fields:
      name:
        type: string
      user_id:
        type: integer
      username:
        type: string
      # "ind" for indicator: a database column convention, in public.
      status_ind:
        type: string
      create_timestamp:
        type: string
      end_timestamp:
        type: string
      # A string, where the two ids beside it are numbers.
      project_id:
        type: string
      project_name:
        type: string
      tags:
        type: list
      # A bare number, with no unit anywhere.
      duration:
        type: integer

routes:
  - method: GET
    path: /automation/api/v1/builds
    resource: build
    operation: list
    pagination:
      style: offset
      limit: 10
      limit_param: limit
      cursor_param: offset
    filters:
      - param: status
        field: status_ind
      - param: username
        field: username

errors:
  access_denied:
    status: 401
    style: text
    # Rack's default, without the trailing newline BrowserStack sends.
    message: "HTTP Basic: Access denied."
    headers:
      Content-Type: text/plain; charset=utf-8
      # The name of the status code, as the thing the user is logging in to.
      WWW-Authenticate: Basic realm="Authorization Required"

  unknown_route:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      # No charset here, where the 401 has one.
      Content-Type: text/plain

  # A verb a path does not take, and a version that was never released, get
  # this too.
  method_not_allowed:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    build: []

  builds:
    build:
      - build_id: 1782
        name: shivam-video-test
        user_id: 1212
        username: shivam
        status_ind: completed
        create_timestamp: "2026-09-05T08:24:36.000Z"
        end_timestamp: "2026-09-05T08:27:22.000Z"
        # A letter code, beside two numeric ids.
        project_id: ML
        project_name: magicleap
        tags:
          - tag1
          - tag2
          - tag3
        duration: 719
      - build_id: 1783
        name: nightly-regression
        user_id: 1212
        username: shivam
        status_ind: running
        create_timestamp: "2026-09-13T21:00:04.000Z"
        end_timestamp: null
        project_id: ML
        project_name: magicleap
        tags: []
        duration: 0

conformance:
  - name: the realm is the name of the status code
    source: https://api.lambdatest.com/automation/api/v1/builds
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      headers: {}
    expect:
      status: 401
      headers:
        # A browser's password box says "Authorization Required".
        WWW-Authenticate: Basic realm="Authorization Required"
        Content-Type: text/plain; charset=utf-8
      # Rack's sentence, and BrowserStack sends the same one differently.
      body_matches: '\AHTTP Basic: Access denied\.\z'

  - name: and a wrong access key is the same twenty-six bytes
    source: https://api.lambdatest.com/automation/api/v1/builds
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      headers:
        # nobody:notreal
        Authorization: "Basic bm9ib2R5Om5vdHJlYWw="
    expect:
      status: 401
      body_matches: '\AHTTP Basic: Access denied\.\z'
      headers:
        WWW-Authenticate: Basic realm="Authorization Required"

  - name: an unrouted path drops the charset the 401 carries
    source: https://api.lambdatest.com/automation/api/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # text/plain, and no charset, on the same host as the 401 above.
        Content-Type: text/plain
      body_matches: '\A404 page not found\s*\z'

  - name: and a version that was never released is the same page
    source: https://api.lambdatest.com/automation/api/v2/builds
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automation/api/v2/builds
      headers: {}
    expect:
      status: 404
      body_matches: '\A404 page not found\s*\z'

  - name: so is a method the path does not take
    source: https://api.lambdatest.com/automation/api/v1/builds
    verified: "2026-09-14"
    fixture: builds
    request:
      method: PUT
      path: /automation/api/v1/builds
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '\A404 page not found\s*\z'

  - name: one key in the envelope is capitalised
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      headers:
        # cauldron:cauldr0nLTf1xtureAccessKey00
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        # Meta, above data, above build_id.
        'Meta.result_set.total': 2
        'Meta.attributes.org_id': 123
        'data[0].build_id': 1782
        'data[0].name': shivam-video-test

  - name: a field named for a database column convention
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        # "ind" for indicator.
        'data[0].status_ind': completed
        'data[1].status_ind': running
        'data[0].username': shivam
        'data[0].user_id': 1212
        'data[0].create_timestamp': "2026-09-05T08:24:36.000Z"
        'data[0].end_timestamp': "2026-09-05T08:27:22.000Z"
        # Null while it is still running.
        'data[1].end_timestamp': null

  - name: three identifiers and one of them is a letter code
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        # build_id and user_id are numbers; project_id is "ML".
        'data[0].project_id': ML
        'data[0].project_name': magicleap
        'data[0].tags[0]': tag1
        'data[1].tags': []
        # A bare number, with no unit anywhere.
        'data[0].duration': 719
        'data[1].duration': 0

  - name: the status filter narrows on the indicator field
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      query:
        status: running
        username: shivam
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        'data[0].build_id': 1783
        'Meta.result_set.total': 1

  - name: paging counts the page and the account separately
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: builds
    request:
      method: GET
      path: /automation/api/v1/builds
      query:
        limit: "1"
        offset: "0"
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        # count is this page; total is everything.
        'Meta.result_set.count': 1
        'Meta.result_set.limit': 1
        'Meta.result_set.total': 2

  - name: an account with no builds keeps the whole envelope
    source: https://www.testmuai.com/support/api-doc/selenium-automation-api/build/fetch-all-builds-of-an-account/
    fixture: empty
    request:
      method: GET
      path: /automation/api/v1/builds
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5MVGYxeHR1cmVBY2Nlc3NLZXkwMA=="
    expect:
      status: 200
      body:
        data: []
        'Meta.result_set.total': 0
        'Meta.attributes.org_id': 123
