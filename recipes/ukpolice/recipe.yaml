# UK Police Recipe for Cauldron
#
# "url" means three different things on one API.
#
#   /forces/leicestershire       ->  "url": "http://www.leics.police.uk/"
#   /crime-categories            ->  "url": "all-crime"
#   the telephone engagement     ->  "url": ""
#
# A web address, a slug, and nothing. Same key name, three kinds of value, and
# a client that renders `url` as a link produces a working link, a broken
# relative one, and an empty href, depending on which endpoint it came from.
#
# **And every one of the force's own links is plain HTTP.** "http://www.leics
# .police.uk/", "http://www.facebook.com/leicspolice", "http://www.twitter.com
# /leicspolice", "http://www.youtube.com/leicspolice" -- four addresses, none of
# them https, in a payload delivered over TLS. The one exception is the RSS
# feed, which is https, so the API is not consistently one or the other either.
#
# Written against the live API rather than a document: every case below was
# checked against data.police.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Three content types for three kinds of answer, and only one is JSON. A
#      force that does not exist answers text/plain with the nine bytes "Not
#      Found" -- not a document, not an object, a bare string. A path that does
#      not exist answers text/html with "<h1>Not Found</h1><p>The requested
#      resource was not found on this server.</p>" -- a fragment, with no
#      doctype and no html element around it. A client calling .json() on
#      either throws.
#   2. type and title are the same word. Every engagement method carries
#      "type": "facebook" and "title": "facebook", byte-identical, so a UI
#      showing the title shows a lowercase machine token.
#   3. One engagement method is not a URL at all. "type": "telephone" sits in a
#      list of links with "url": "", while the force's actual number lives in a
#      "telephone" field one level up, as the string "101".
#
# And "stop-and-search" is a hyphenated JSON key, so reading it needs a
# subscript in most languages -- and in JavaScript a dot makes it a subtraction.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The forward slashes are escaped on the wire -- "http:\/\/www.leics
#     .police.uk\/" -- which is one language's encoder default. Cauldron's does
#     not escape them, so the values are the same and the bytes are not.
#   - One force is served, of the forty-odd, and the dates listing is trimmed
#     to one month.

recipe: ukpolice
capability: infrastructure
version: 0.1.0

upstream:
  api: ukpolice
  docs: https://data.police.uk/docs/

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    # A bare array, with nothing around it.
    style: bare
  resource:
    style: bare
  error:
    # Nine bytes, and not a document.
    style: text

resources:
  force:
    id:
      style: opaque
      field: id
    fields:
      name:
        type: string
      # null, here and on every engagement method below.
      description:
        type: string
      # A web address on this endpoint.
      url:
        type: string
      # A phone number, as a string, one level above the engagement method
      # that claims to be one.
      telephone:
        type: string
      engagement_methods:
        type: list

  category:
    id:
      style: opaque
      # A slug on this endpoint, under the same name.
      field: url
    fields:
      name:
        type: string

  month:
    id:
      style: opaque
      field: date
    fields:
      # A hyphenated key, so a dot cannot reach it.
      stop-and-search:
        type: list

routes:
  - method: GET
    path: /api/forces/{id}
    resource: force
    operation: get
    not_found: not_found

  - method: GET
    path: /api/crime-categories
    resource: category
    operation: list

  - method: GET
    path: /api/crimes-street-dates
    resource: month
    operation: list

  # A path with nothing behind it, answered in a third content type.
  - method: GET
    path: /api/nosuchendpoint
    error: no_such_resource
    headers:
      Content-Type: text/html

errors:
  # Nine bytes of plain text.
  not_found:
    status: 404
    message: Not Found
    headers:
      Content-Type: text/plain

  # A fragment, with no doctype and no html element around it.
  no_such_resource:
    status: 404
    message: "<h1>Not Found</h1><p>The requested resource was not found on this server.</p>"

fixtures:
  empty: {}

  policing:
    force:
      - id: leicestershire
        name: Leicestershire Police
        description: null
        # Plain HTTP, in a payload delivered over TLS.
        url: http://www.leics.police.uk/
        # The real number, in its own field.
        telephone: "101"
        engagement_methods:
          # type and title are the same word, every time.
          - type: facebook
            title: facebook
            description: null
            url: http://www.facebook.com/leicspolice
          - type: twitter
            title: twitter
            description: null
            url: http://www.twitter.com/leicspolice
          - type: youtube
            title: youtube
            description: null
            url: http://www.youtube.com/leicspolice
          # The one https address in the object.
          - type: rss
            title: rss
            description: null
            url: https://www.leics.police.uk/news/leicestershire/news/GetNewsRss/
          # Not a URL at all, in a list of them.
          - type: telephone
            title: telephone
            description: null
            url: ""

    category:
      # url is a slug here.
      - id: all-crime
        name: All crime
      - id: anti-social-behaviour
        name: Anti-social behaviour
      - id: bicycle-theft
        name: Bicycle theft

    month:
      - id: "2026-06"
        stop-and-search:
          - avon-and-somerset
          - btp
          - city-of-london
          - cumbria

conformance:
  - name: url is a web address here
    source: https://data.police.uk/api/forces/leicestershire
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/forces/leicestershire
    expect:
      status: 200
      body:
        id: leicestershire
        name: Leicestershire Police
        # An address, and a plain-HTTP one.
        url: http://www.leics.police.uk/

  - name: and a slug there
    source: https://data.police.uk/api/crime-categories?date=2026-01
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/crime-categories
    expect:
      status: 200
      body:
        # Same key name, and not an address: a client rendering it as a link
        # produces a broken relative one.
        "[0].url": all-crime
        "[0].name": All crime
        "[1].url": anti-social-behaviour
        "[2].url": bicycle-theft

  - name: and the empty string in a list of links
    source: https://data.police.uk/api/forces/leicestershire
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/forces/leicestershire
    expect:
      status: 200
      body:
        # An engagement method that is a phone number, in a list of URLs, with
        # no URL -- while the real number is a field one level up.
        "engagement_methods[4].type": telephone
        "engagement_methods[4].url": ""
        telephone: "101"

  - name: every link the force owns is plain HTTP
    source: https://data.police.uk/api/forces/leicestershire
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/forces/leicestershire
    expect:
      status: 200
      body:
        "engagement_methods[0].url": http://www.facebook.com/leicspolice
        "engagement_methods[1].url": http://www.twitter.com/leicspolice
        "engagement_methods[2].url": http://www.youtube.com/leicspolice
        # Except the feed, which is https -- so the API is not consistently
        # one or the other either.
        "engagement_methods[3].url": https://www.leics.police.uk/news/leicestershire/news/GetNewsRss/

  - name: type and title are the same word
    source: https://data.police.uk/api/forces/leicestershire
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/forces/leicestershire
    expect:
      status: 200
      body:
        # Byte-identical, so a UI showing the title shows a machine token.
        "engagement_methods[0].type": facebook
        "engagement_methods[0].title": facebook
        "engagement_methods[3].type": rss
        "engagement_methods[3].title": rss
        # And the description is null on every one of them, and on the force.
        "engagement_methods[0].description": null
        description: null

  - name: a hyphenated key a dot cannot reach
    source: https://data.police.uk/api/crimes-street-dates
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/crimes-street-dates
    expect:
      status: 200
      body:
        "[0].date": "2026-06"
        # In JavaScript a dot makes this a subtraction.
        "[0].stop-and-search[0]": avon-and-somerset
        "[0].stop-and-search[1]": btp

  - name: a force that does not exist is nine bytes of plain text
    source: https://data.police.uk/api/forces/nosuchforce
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/forces/nosuchforce
    expect:
      # Not a document, not an object, a bare string. A client calling .json()
      # on it throws.
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^Not Found$'

  - name: and a path that does not exist is an HTML fragment
    source: https://data.police.uk/api/nosuchendpoint
    verified: "2026-08-30"
    fixture: policing
    request:
      method: GET
      path: /api/nosuchendpoint
    expect:
      # A third content type, and no doctype and no html element around it.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '^<h1>Not Found</h1><p>The requested resource was not found on this server\.</p>$'
