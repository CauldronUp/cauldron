# Twenty Recipe for Cauldron
#
# The OpenAPI document Twenty serves without a credential at
# api.twenty.com/open-api/core, and the REST surface behind it, struck live on
# 2026-09-13 with no header, with a wrong bearer, on a path that does not
# exist, and with a method the path does not take.
#
# **The contract describes one operation, and it is fetching the contract.**
# `paths` has a single entry: `GET /open-api/core`, `operationId
# GetOpenApiSchema`. Every other path -- people, companies, notes, tasks -- is
# generated per workspace and appears only once a token is presented, so an
# anonymous reader of the published document learns how to fetch the document
# and nothing else.
#
# **And the document's only operation contradicts the document's own security.**
# The top level says `security: [{bearerAuth: []}]`, so every operation requires
# a bearer. `GET /open-api/core` answers 200 to a request with no header at all.
#
# **It also has to override the server to reach itself.** The document's server
# is `https://api.twenty.com/rest/`; the one operation declares its own
# `servers: [{url: "https://api.twenty.com"}]`, because the path it lives at is
# not under the base URL the document declares.
#
# Drift makes the same point from the other side: it reports `GET
# /open-api/core` as undeclared, because joining the document's server to the
# document's path gives `/rest/open-api/core`, which is not where the document
# lives.
#
# **A missing token is 403 and a wrong token is 401.** Struck live:
#
#   (no header)     403  {"statusCode":403,"messages":["Missing authentication token"],"error":"FORBIDDEN_EXCEPTION"}
#   Bearer notreal  401  {"statusCode":401,"messages":["Token invalid."],"error":"UNAUTHENTICATED"}
#
# The two statuses are the wrong way round. 401 is for a caller who has not
# authenticated; 403 is for one who has and may not. Twenty answers 403 to the
# request carrying nothing and 401 to the one carrying something.
#
# **And the two error codes come from different worlds.**
# `FORBIDDEN_EXCEPTION` is a class name with a suffix; `UNAUTHENTICATED` is a
# gRPC status name. One API, two vocabularies, in the field a client switches
# on -- with `messages`, a plural array, carrying one string beside them.
#
# **The security scheme's own instructions produce an invalid header.**
# `bearerAuth.description` reads: "Enter the token with the `Bearer: ` prefix,
# e.g. \"Bearer abcde12345\"." A colon after `Bearer` is not what the header
# looks like, and the example beside it does not have one.
#
# **The base URL is labelled "Production Development".** Two environment words
# in one server description, in a document with one server.
#
# **Filtering is a language you build by string concatenation.** From the
# document's own prose: `field[COMPARATOR]:value`, joined with commas, with
# `field.subField` for composite fields and `%` as a wildcard for `like` and
# `ilike`. The comparator goes in square brackets inside the *value* of a query
# parameter, so every filter is assembled by hand and escaped by nobody.
#
# **`components` holds nothing but the security scheme.** No schemas, no
# parameters, no responses -- and the one operation's 200 is an inline,
# hand-written description of what an OpenAPI document looks like.
#
# Also pinned: the credential is checked before the path, so an unrouted path
# and a wrong method both answer "Missing authentication token"; and the
# document's `info.description` carries a paragraph warning "Never put your
# token in a URL", with its reasoning about access logs, browser history and
# `Referer` headers, in the prose field a code generator drops.

recipe: twenty
capability: crm
version: 0.1.0

upstream:
  api: "3.1.1"
  docs: https://twenty.com/developers
  spec: https://api.twenty.com/open-api/core
  spec_hash: 2ca961ed4b20eb33ec70f26dc9bbc26e7c6dd71d11725e06503f85d7008f5a20
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y00000000000000
  # Forbidden, for a request carrying nothing at all.
  absent_error: missing_authentication_token
  # And Unauthorized, for one carrying something.
  rejected_error: token_invalid
  malformed_error: missing_authentication_token
  # Checked before the path is.

responses:
  list:
    style: bare
  error:
    style: flat
    # A plural array holding one string.
    message_field: "messages[]"
    code_field: error
    status_field: statusCode

resources:
  schema:
    id:
      # The document has no identifier of its own.
      field: "-"
      style: opaque
      length: 8
    fields:
      openapi:
        type: string
      info:
        type: map
      # Which the one operation below has to override to reach itself.
      servers:
        type: list
      # Holding nothing but the security scheme.
      components:
        type: map
      # Declared for every operation, and honoured by none of them.
      security:
        type: list
      externalDocs:
        type: map
      # One entry: the operation that serves this document.
      paths:
        type: map

routes:
  - method: GET
    path: /open-api/core
    resource: schema
    operation: list
    # Answered without a credential, on a document that declares one is
    # required for everything.
    public: true
    list:
      style: bare
      collapse_single: true
    pagination:
      style: none

  - method: GET
    # The REST surface the document does not describe. Its paths exist only
    # once a workspace's token is presented, so this Recipe holds no key for
    # it and every credential is refused -- which is the whole finding.
    path: /rest/people
    error: no_workspace_schema
    auth:
      scheme: bearer
      header: Authorization
      prefix: "Bearer "
      keys:
        - nokeythisrecipeholdsforaworkspace
      absent_error: missing_authentication_token
      rejected_error: token_invalid

errors:
  missing_authentication_token:
    # Forbidden, to a caller who presented nothing.
    status: 403
    # A class name with a suffix.
    code: FORBIDDEN_EXCEPTION
    message: Missing authentication token

  token_invalid:
    # Unauthorized, to a caller who did present something.
    status: 401
    # A gRPC status name, beside the class name above.
    code: UNAUTHENTICATED
    message: Token invalid.

  no_workspace_schema:
    status: 403
    code: FORBIDDEN_EXCEPTION
    message: Missing authentication token

fixtures:
  empty:
    schema: []

  published:
    schema:
      - openapi: 3.1.1
        info:
          title: Twenty Api
          # Carrying, among other things, a paragraph that begins "Never put
          # your token in a URL."
          description: Use this page to explore and call the **REST API**.
        servers:
          # Two environment words in one label.
          - url: https://api.twenty.com/rest/
            description: Production Development
        components:
          securitySchemes:
            bearerAuth:
              type: http
              scheme: bearer
              bearerFormat: JWT
              # A colon that does not belong in the header, beside an example
              # that does not have one.
              description: 'Enter the token with the `Bearer: ` prefix, e.g. "Bearer abcde12345".'
        security:
          - bearerAuth: []
        externalDocs:
          description: Find out more about **Twenty**
          url: https://twenty.com
        paths:
          /open-api/core:
            get:
              tags:
                - General
              summary: Get Open Api Schema
              operationId: GetOpenApiSchema
              # The one operation, overriding the server to reach itself.
              servers:
                - url: https://api.twenty.com

conformance:
  - name: a missing token is forbidden and a wrong one is unauthorized
    source: https://api.twenty.com/rest/people
    verified: "2026-09-13"
    fixture: published
    request:
      method: GET
      path: /rest/people
      headers: {}
    expect:
      # The wrong way round: 403 for the request carrying nothing.
      status: 403
      body:
        statusCode: 403
        # A class name with a suffix.
        error: FORBIDDEN_EXCEPTION
        messages:
          - Missing authentication token

  - name: and the one carrying something gets the other status
    source: https://api.twenty.com/rest/people
    verified: "2026-09-13"
    fixture: published
    request:
      method: GET
      path: /rest/people
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        statusCode: 401
        # A gRPC status name, where the other failure used a class name.
        error: UNAUTHENTICATED
        messages:
          - Token invalid.

  - name: an unrouted path is answered by the credential check
    source: https://api.twenty.com/rest/cauldron-nope
    verified: "2026-09-13"
    fixture: published
    request:
      method: GET
      path: /rest/cauldron-nope
      headers: {}
    expect:
      status: 403
      body:
        error: FORBIDDEN_EXCEPTION
        messages:
          - Missing authentication token

  - name: a method the route does not take gets it too
    source: https://api.twenty.com/rest/people
    verified: "2026-09-13"
    fixture: published
    request:
      method: PUT
      path: /rest/people
      headers: {}
    expect:
      status: 403
      body:
        statusCode: 403
        error: FORBIDDEN_EXCEPTION

  - name: the document is served to a caller with no credential at all
    source: https://api.twenty.com/open-api/core
    verified: "2026-09-13"
    fixture: published
    request:
      method: GET
      path: /open-api/core
      headers: {}
    expect:
      status: 200
      body:
        # security is [{bearerAuth: []}] at the top level, and this answered
        # a request with no header on it.
        openapi: 3.1.1
        'info.title': Twenty Api
        'security[0].bearerAuth': []

  - name: the contract describes one operation and it is fetching the contract
    source: https://api.twenty.com/open-api/core
    verified: "2026-09-13"
    fixture: published
    request:
      method: GET
      path: /open-api/core
      headers: {}
    expect:
      status: 200
      body:
        # The only path in the document.
        'paths./open-api/core.get.operationId': GetOpenApiSchema
        'paths./open-api/core.get.summary': Get Open Api Schema
        'paths./open-api/core.get.tags[0]': General

  - name: the one operation overrides the server to reach itself
    source: https://api.twenty.com/open-api/core
    fixture: published
    request:
      method: GET
      path: /open-api/core
      headers: {}
    expect:
      status: 200
      body:
        # The document's base URL...
        'servers[0].url': https://api.twenty.com/rest/
        # ...and the operation's own, because the path is not under it.
        'paths./open-api/core.get.servers[0].url': https://api.twenty.com

  - name: the base URL is labelled Production Development
    source: https://api.twenty.com/open-api/core
    fixture: published
    request:
      method: GET
      path: /open-api/core
      headers: {}
    expect:
      status: 200
      body:
        # Two environment words, in a document with one server.
        'servers[0].description': Production Development

  - name: the security scheme's instructions produce an invalid header
    source: https://api.twenty.com/open-api/core
    fixture: published
    request:
      method: GET
      path: /open-api/core
      headers: {}
    expect:
      status: 200
      body:
        # A colon after Bearer, and an example beside it without one.
        'components.securitySchemes.bearerAuth.description': 'Enter the token with the `Bearer: ` prefix, e.g. "Bearer abcde12345".'
        'components.securitySchemes.bearerAuth.bearerFormat': JWT
        'components.securitySchemes.bearerAuth.scheme': bearer
        'externalDocs.url': https://twenty.com
        'externalDocs.description': Find out more about **Twenty**
        'info.description': Use this page to explore and call the **REST API**.
