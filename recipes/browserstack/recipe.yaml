# BrowserStack Automate Recipe for Cauldron
#
# The build listing, read from the Automate API reference at
# browserstack.com/docs, and struck live on 2026-09-14 with no credential, with
# a wrong basic credential, without the .json suffix, on a path that does not
# exist, with a method the path does not take, and on the root.
#
# **One host, three different 404 bodies, depending on which layer answered.**
# Struck live:
#
#   GET /automate/cauldron-nope.json   404  nginx's default page, 162 bytes
#   PUT /automate/builds.json          404  BrowserStack's marketing 404 page, 259,615 bytes
#   GET /                              404  the same marketing page
#
# A wrong verb on a real API path returns a quarter of a megabyte of HTML
# titled "Page not found | BrowserStack", complete with `<!--[if IE 8]>` and
# `<!--[if IE 9]>` conditional comments -- markup for browsers retired in 2016 --
# while a path that does not exist gets nginx's twelve-line default instead.
#
# **The 401 is Rack's default, and the realm is the word "Application".**
#
#   WWW-Authenticate: Basic realm="Application"
#   Content-Type: text/html; charset=utf-8
#
#   HTTP Basic: Access denied.
#
# Twenty-seven bytes of plain prose, declared `text/html`, from a JSON API. A
# client calling `.json()` on a wrong access key throws rather than reporting
# it, and the realm a browser shows the user is the generic word a framework
# ships with.
#
# **LambdaTest, a competitor, sends the identical sentence differently.**
# `api.lambdatest.com` answers `HTTP Basic: Access denied.` too -- the same Rack
# middleware, the same words -- as `text/plain; charset=utf-8`, without the
# trailing newline BrowserStack sends, under `www-authenticate: Basic
# realm="Authorization Required"`. Two vendors, one library, and a client cannot
# treat the two refusals the same way on content type, byte length or realm.
# See the `lambdatest` Recipe.
#
# **The listing is a bare array of one-key wrappers.** Every entry is
# `{"automation_build": {…}}`, so reading a build's name is
# `body[0].automation_build.name` -- a wrapper repeated once per record, in an
# array that is already typed by the endpoint it came from.
#
# **The identifier is named after how it was made.** `hashed_id`, forty hex
# characters, is "Build ID required for other endpoints" -- a public identifier
# whose name describes the implementation that produced it.
#
# **And a credentialled listing hands back public links.** `public_url` is a
# "Shareable dashboard link" to the build's results, on every record, so
# anything that logs or forwards this listing forwards a URL that needs no
# credential to open.
#
# Also pinned: `limit` defaults to 10 and caps at 100, which is the one place
# either number is written down; `build_tag` is null on the reference's own
# example; `duration` is a bare number documented as milliseconds only in the
# prose beside it; and `/automate/builds` without the `.json` suffix answers the
# same 401, so the extension is not what routes the request.

recipe: browserstack
capability: ci
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://www.browserstack.com/docs/automate/api-reference/selenium/build

auth:
  scheme: basic
  # The username is the account name; the access key is the password.
  credential: password
  keys:
    - cauldr0nBSf1xtureK3y
  absent_error: access_denied
  malformed_error: access_denied
  rejected_error: access_denied
  # The path and the verb are resolved first: both 404 with nothing sent.
  after_routing: true

responses:
  list:
    style: bare
    # Every entry wrapped under the resource's own name.
    entry_style: wrapped

resources:
  automation_build:
    id:
      # Named for the implementation that produced it.
      field: hashed_id
      style: hex
      length: 40
    fields:
      name:
        type: string
      # Documented as milliseconds in the prose and nowhere on the record.
      duration:
        type: integer
      status:
        type: string
      build_tag:
      # A link that needs no credential to open, in a credentialled listing.
      public_url:
        type: string

routes:
  - method: GET
    path: /automate/builds.json
    resource: automation_build
    operation: list
    pagination:
      style: offset
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: offset
    filters:
      - param: status
        field: status

errors:
  access_denied:
    status: 401
    style: text
    # Rack's default, with a trailing newline.
    message: "HTTP Basic: Access denied.\n"
    headers:
      # Prose, declared as HTML.
      Content-Type: text/html; charset=utf-8
      # The realm is the word a framework ships with.
      WWW-Authenticate: Basic realm="Application"

  unknown_route:
    status: 404
    style: text
    # nginx's default page: twelve lines, 162 bytes.
    message: "<html>\n<head><title>404 Not Found</title></head>\n<body bgcolor=\"white\">\n<center><h1>404 Not Found</h1></center>\n<hr><center>nginx</center>\n</body>\n</html>\n"
    headers:
      Content-Type: text/html; charset=utf-8

  # A wrong verb on a real API path gets the website's own 404 page. Live it is
  # 259,615 bytes; this is the first and last of it, with the title and the
  # conditional comments that make it what it is.
  method_not_allowed:
    status: 404
    style: text
    message: "<!DOCTYPE html>\n<!--[if IE 8]><html lang=\"en\" class=\"ie ie8 lte9 lte8\"><![endif]-->\n<!--[if IE 9]><html lang=\"en\" class=\"ie ie9 lte9\"><![endif]-->\n<!--[if !IE]><!--> <html lang=\"en\"> <!--<![endif]-->\n<head><title>Page not found | BrowserStack</title></head>\n<body></body>\n</html>\n"
    headers:
      Content-Type: text/html; charset=utf-8

fixtures:
  empty:
    automation_build: []

  builds:
    automation_build:
      - hashed_id: ca9cccc228cf0e3ff3cb90dd62e2e2bfb4b20bc7
        name: pricing_build
        duration: 15611
        status: running
        # Null on the reference's own example.
        build_tag: null
        public_url: https://automate.browserstack.com/dashboard/v2/public-build/MkdsKzRhanlWQmtpc
      - hashed_id: 7b1d4e0a93f26c5580ab3f9e1d2c4a67f0e8b512
        name: nightly_regression
        duration: 482903
        status: done
        build_tag: nightly
        public_url: https://automate.browserstack.com/dashboard/v2/public-build/Q2hhcmxpZURlbHRh

conformance:
  - name: rack refuses in prose declared as html
    source: https://api.browserstack.com/automate/builds.json
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      headers: {}
    expect:
      status: 401
      headers:
        # Not JSON, from a JSON API.
        Content-Type: text/html; charset=utf-8
        # The generic word a framework ships with.
        WWW-Authenticate: Basic realm="Application"
      body_matches: '\AHTTP Basic: Access denied\.\s*\z'

  - name: and a wrong access key is the same twenty-seven bytes
    source: https://api.browserstack.com/automate/builds.json
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      headers:
        # nobody:notreal
        Authorization: "Basic bm9ib2R5Om5vdHJlYWw="
    expect:
      status: 401
      body_matches: '\AHTTP Basic: Access denied\.\s*\z'
      headers:
        WWW-Authenticate: Basic realm="Application"

  - name: a path that does not exist is nginx's default page
    source: https://api.browserstack.com/automate/cauldron-nope.json
    verified: "2026-09-14"
    fixture: builds
    request:
      method: GET
      path: /automate/cauldron-nope.json
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      # Twelve lines, 162 bytes, with the server software in it.
      body_matches: '[\s\S]*<hr><center>nginx</center>[\s\S]*'

  - name: and a wrong verb is a quarter of a megabyte of marketing page
    source: https://api.browserstack.com/automate/builds.json
    verified: "2026-09-14"
    fixture: builds
    request:
      method: PUT
      path: /automate/builds.json
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      # With conditional comments for browsers retired in 2016.
      body_matches: '[\s\S]*<title>Page not found \| BrowserStack</title>[\s\S]*'

  - name: every entry is wrapped under the resource's own name
    source: https://www.browserstack.com/docs/automate/api-reference/selenium/build
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      headers:
        # cauldron:cauldr0nBSf1xtureK3y
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5CU2YxeHR1cmVLM3k="
    expect:
      status: 200
      body:
        # A bare array, and a wrapper on every element of it.
        '[0].automation_build.name': pricing_build
        '[0].automation_build.hashed_id': ca9cccc228cf0e3ff3cb90dd62e2e2bfb4b20bc7
        '[0].automation_build.status': running
        '[1].automation_build.name': nightly_regression

  - name: a credentialled listing hands back links that need no credential
    source: https://www.browserstack.com/docs/automate/api-reference/selenium/build
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5CU2YxeHR1cmVLM3k="
    expect:
      status: 200
      body:
        # "Shareable dashboard link", on every record.
        '[0].automation_build.public_url': https://automate.browserstack.com/dashboard/v2/public-build/MkdsKzRhanlWQmtpc
        '[1].automation_build.public_url': https://automate.browserstack.com/dashboard/v2/public-build/Q2hhcmxpZURlbHRh
        # Milliseconds, said only in the prose beside the field.
        '[0].automation_build.duration': 15611
        '[1].automation_build.duration': 482903
        '[0].automation_build.build_tag': null
        '[1].automation_build.build_tag': nightly

  - name: the status filter narrows the array in place
    source: https://www.browserstack.com/docs/automate/api-reference/selenium/build
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      query:
        status: done
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5CU2YxeHR1cmVLM3k="
    expect:
      status: 200
      body:
        '[0].automation_build.name': nightly_regression
        '[0].automation_build.status': done

  - name: paging is a limit of ten and an offset with nothing to read back
    source: https://www.browserstack.com/docs/automate/api-reference/selenium/build
    fixture: builds
    request:
      method: GET
      path: /automate/builds.json
      query:
        limit: "1"
        offset: "1"
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5CU2YxeHR1cmVLM3k="
    expect:
      status: 200
      body:
        # No count, no next, no total: a bare array and nothing else.
        '[0].automation_build.name': nightly_regression
      absent:
        - total
        - next

  - name: an account with no builds is a bare empty array
    source: https://www.browserstack.com/docs/automate/api-reference/selenium/build
    fixture: empty
    request:
      method: GET
      path: /automate/builds.json
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyMG5CU2YxeHR1cmVLM3k="
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
