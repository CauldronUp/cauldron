# Mailtrap Recipe for Cauldron
#
# Written against Mailtrap's own documentation -- which is served as Markdown
# with an OpenAPI document embedded in each page -- and struck live against
# mailtrap.io and send.api.mailtrap.io on 2026-09-11 with no credential, with a
# deliberately invalid one, and on a path that does not exist.
#
# **Three failure shapes, two hosts, one vendor.** Struck live:
#
#   mailtrap.io/api/accounts        401 {"error":"Incorrect API token"}
#   mailtrap.io/api/cauldron-nope   404 {"errors":"API endpoint not found. ..."}
#   send.api.mailtrap.io/api/send   401 {"success":false,"errors":["Unauthorized"]}
#
# `error` holding a string. `errors` holding a string. `errors` holding an
# array. The key changes between singular and plural, and the plural key still
# carries one message -- so the name does not track the shape, and a client
# that reads `body.errors[0]` gets the first *character* of the 404's sentence.
#
# The sending host adds a `success` boolean beside the array, which the other
# host never sends. So a caller talking to both -- which is the normal case,
# because one manages the account and the other sends the mail -- needs two
# parsers for one vendor's failures.
#
# **The 404 is addressed to a language model.**
#
#   {"errors":"API endpoint not found. See Mailtrap documentation:
#     https://docs.mailtrap.io/developers or https://docs.mailtrap.io/llms.txt
#     for LLMs."}
#
# Two links: one for a person and one, named as such, for an LLM. It is the
# first error message in this collection to route its reader by species, and
# the `llms.txt` it points at is real -- 40KB of Markdown index, which is how
# the record shape below was read.
#
# **And the documentation is built to be machine-read.** Every page answers
# Markdown when `.md` is appended to its URL, and each endpoint page embeds a
# complete OpenAPI document for that one endpoint as a fenced JSON block. So
# there is no single description to fingerprint and there is a precise
# description of every endpoint, which is an unusual trade and a deliberate
# one.
#
# **Nothing on an account is guaranteed.** The embedded schema has no
# `required` array at all, so `id`, `name` and `access_levels` are each
# optional on every record in a listing that exists to identify accounts.
#
# **`access_levels` is an array of numbers with no names.** Mailtrap's
# permission levels arrive as integers, so a client deciding what a caller may
# do is comparing magic numbers it has to look up elsewhere.

recipe: mailtrap
capability: email
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://docs.mailtrap.io/developers/account-management/accounts.md
  # No spec: Mailtrap embeds one OpenAPI document per endpoint inside the
  # Markdown of that endpoint's page. There is no single document to
  # fingerprint -- which is the cost of the trade described in the header.

auth:
  # The token goes in a header of its own. The embedded document also declares
  # a bearer scheme, and both answer the same sentence.
  scheme: header
  header: Api-Token
  keys:
    - cauldr0nma1ltrapf1xturet0ken
  also:
    - scheme: bearer
      header: Authorization
      prefix: "Bearer "
  # One sentence for both, and it describes the second.
  absent_error: incorrect_api_token
  rejected_error: incorrect_api_token
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  account:
    id:
      field: id
      style: numeric
    fields:
      name:
        type: string
      # Integers, with no names anywhere on the record.
      access_levels:
        type: list

routes:
  - method: GET
    path: /api/accounts
    resource: account
    operation: list
    pagination:
      # None declared and none offered: the embedded document gives this
      # operation no parameters at all.
      style: none

errors:
  incorrect_api_token:
    status: 401
    # Answers a request carrying no token as well as one carrying a wrong
    # token, and describes only the second.
    message: Incorrect API token

  unknown_route:
    status: 404
    # Plural key, singular value -- and two links, one of them explicitly for
    # a language model.
    message_field: errors
    message: "API endpoint not found. See Mailtrap documentation: https://docs.mailtrap.io/developers or https://docs.mailtrap.io/llms.txt for LLMs."

fixtures:
  empty:
    account: []

  organization:
    account:
      - id: 1148295
        name: Cauldron
        access_levels:
          - 1000
      - id: 1148296
        name: Cauldron Sandbox
        # A second level on a second account, and neither number is named
        # anywhere on the record.
        access_levels:
          - 100
          - 1000

conformance:
  - name: a missing token gets the sentence about a wrong one
    source: https://mailtrap.io/api/accounts
    verified: "2026-09-11"
    fixture: organization
    request:
      method: GET
      path: /api/accounts
      headers: {}
    expect:
      status: 401
      body:
        # Singular key, string value.
        error: Incorrect API token

  - name: a wrong token is the same body
    source: https://mailtrap.io/api/accounts
    verified: "2026-09-11"
    fixture: organization
    request:
      method: GET
      path: /api/accounts
      headers:
        Api-Token: notreal
    expect:
      status: 401
      body:
        error: Incorrect API token

  - name: the 404 uses a plural key for a single string
    source: https://mailtrap.io/api/cauldron-nope
    verified: "2026-09-11"
    fixture: organization
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Api-Token: notreal
    expect:
      status: 404
      # `errors` holding one sentence, where the 401 above uses `error` for
      # the same thing -- so a client reading errors[0] gets a character.
      body_matches: '"errors"'

  - name: the 404 routes its reader by species
    source: https://mailtrap.io/api/cauldron-nope
    verified: "2026-09-11"
    fixture: organization
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Api-Token: notreal
    expect:
      status: 404
      body:
        # One link for a person and one, named as such, for a language model
        # -- and the llms.txt it names is real, 40KB of Markdown index, which
        # is where this Recipe's record shape was read from.
        errors: "API endpoint not found. See Mailtrap documentation: https://docs.mailtrap.io/developers or https://docs.mailtrap.io/llms.txt for LLMs."

  - name: accounts are a bare array
    source: https://docs.mailtrap.io/developers/account-management/accounts.md
    fixture: organization
    request:
      method: GET
      path: /api/accounts
      headers:
        Api-Token: cauldr0nma1ltrapf1xturet0ken
    expect:
      status: 200
      body:
        '[0].id': 1148295
        '[0].name': Cauldron

  - name: the permission levels are unnamed numbers
    source: https://docs.mailtrap.io/developers/account-management/accounts.md
    fixture: organization
    request:
      method: GET
      path: /api/accounts
      headers:
        Api-Token: cauldr0nma1ltrapf1xturet0ken
    expect:
      status: 200
      body:
        # A client deciding what a caller may do is comparing magic numbers it
        # has to look up somewhere other than this response.
        '[0].access_levels[0]': 1000
        '[1].access_levels[0]': 100
        '[1].name': Cauldron Sandbox

  - name: the bearer scheme is read as well
    source: https://docs.mailtrap.io/developers/account-management/accounts.md
    fixture: organization
    request:
      method: GET
      path: /api/accounts
      headers:
        # The embedded document declares both HeaderAuth and BearerAuth.
        Authorization: "Bearer cauldr0nma1ltrapf1xturet0ken"
    expect:
      status: 200
      body:
        '[0].name': Cauldron

  - name: an organisation with no accounts answers an empty array
    source: https://docs.mailtrap.io/developers/account-management/accounts.md
    fixture: empty
    request:
      method: GET
      path: /api/accounts
      headers:
        Api-Token: cauldr0nma1ltrapf1xturet0ken
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
