# Prismic Recipe for Cauldron
#
# The repository document -- the thing every Prismic client fetches before it
# can do anything else -- struck live against a repository's CDN host on
# 2026-09-13, and against a repository that does not exist.
#
# **A repository that does not exist answers zero bytes labelled as JSON.**
# Struck live:
#
#   HTTP/1.1 404 Not Found
#   Content-Type: application/json
#   Content-Length: 0
#
# The label promises a parseable body and there is nothing to parse, so
# `.json()` throws on an empty string while the header says otherwise. A client
# that trusts the content type gets a parse error rather than a 404 it can
# report.
#
# **The API describes itself as HTML forms.** The document's `forms` object
# holds three of them, and each is an HTML `<form>` element serialised into
# JSON:
#
#   "everything": {
#     "method": "GET",
#     "enctype": "application/x-www-form-urlencoded",
#     "action": "https://<repo>.cdn.prismic.io/api/v2/documents/search",
#     "fields": { "ref": {...}, "q": {...}, "page": {...}, ... }
#   }
#
# A method, an encoding type, an action and a field list, which is what a
# browser reads out of markup. A client is meant to fetch this document, find
# the form, and build the request from its fields -- hypermedia by way of the
# 1999 web form, in an API whose own documentation calls itself REST.
#
# **The credential is one of the form's fields.** `access_token` sits in the
# same `fields` map as `q`, `page` and `orderings`, typed `String`. So the
# secret is declared as a query parameter, in a machine-readable description
# that is handed to anyone who asks without one.
#
# **And everything else about the repository comes with it.** Every content
# type and its label, every language, the bookmarks, the tags, the A/B
# experiments, the OAuth endpoints, and the master ref -- to a caller who has
# presented nothing. Knowing the subdomain is the whole of the access control
# on this document.
#
# **Integer fields have string defaults.** `page` and `pageSize` are declared
# `"type": "Integer"` with `"default": "1"` and `"default": "20"` -- the type
# says integer and the default is quoted. A client that reads the default and
# uses it without converting sends a string where the same form says a number
# belongs.
#
# **Every query needs a `ref`, and the only way to get one is this document.**
# The master ref is a token that changes on every publish, so a read is always
# two requests: one for the ref and one for the content. A client that caches
# the ref serves stale content, and one that does not doubles its request count.
#
# **The OAuth endpoints are on a different host.** `oauth_initiate` points at
# `<repo>.prismic.io` while the document itself is served from
# `<repo>.cdn.prismic.io`. The CDN hands out the origin's addresses.
#
# **And the API's version is a commit.** `"version": "482083b"` -- seven hex
# characters, a git short hash, in the field a client would compare against a
# release.

recipe: prismic
capability: cms
version: 0.1.0

upstream:
  api: v2
  docs: https://prismic.io/docs/api
  # No spec: Prismic describes this API in prose, and the machine-readable
  # description it does publish is the `forms` object inside the document
  # below -- which is a description of the *next* request rather than of this
  # API.

auth:
  # Declared as a field of the search form rather than as a scheme, and not
  # required to read the document this Recipe serves.
  scheme: query
  param: access_token
  keys:
    - cauldr0npr1sm1cf1xturet0ken
  after_routing: true

responses:
  resource:
    style: bare
  error:
    # The one failure this Recipe routes to has no body at all, so nothing
    # here ever renders a field.
    style: flat
    message_field: "-"
    code_field: "-"

resources:
  repository:
    id:
      # The document has no identifier. The version -- a git short hash -- is
      # the only thing on it that changes with a deploy.
      field: "-"
      style: opaque
      carried_by: version
    fields:
      version:
        type: string
      # A token that changes on every publish, and the reason every read is
      # two requests.
      refs:
        type: list
      # Every content type in the repository, with its label.
      types:
        type: map
      languages:
        type: list
      bookmarks:
        type: map
      tags:
        type: list
      # A/B testing state, in the discovery document.
      experiments:
        type: map
      # Three HTML forms, serialised into JSON.
      forms:
        type: map
      # On a different host from the one serving this document.
      oauth_initiate:
        type: string
      oauth_token:
        type: string
      license:
        type: string

routes:
  - method: GET
    path: /api/v2
    resource: repository
    operation: get
    id_from: auth
    # Struck live with no credential: knowing the subdomain is the whole of
    # the access control on this document.
    public: true

errors:
  unknown_route:
    status: 404
    # Zero bytes, labelled application/json. The header promises something to
    # parse and there is nothing.
    empty: true
    headers:
      Content-Type: application/json

fixtures:
  empty:
    repository: []

  site:
    repository:
      - version: 482083b
        refs:
          - id: master
            # The token every query has to carry, which changes on every
            # publish.
            ref: W3ROxyYAAPeuMvvg
            label: Master
            isMasterRef: true
        types:
          blog: Blog
          page: Page
        languages:
          - id: es-es
            name: Spanish - Spain (Traditional)
        bookmarks: {}
        tags: []
        experiments:
          draft: []
          running: []
        forms:
          everything:
            # An HTML form, in JSON.
            method: GET
            enctype: application/x-www-form-urlencoded
            action: https://example-prismic.cdn.prismic.io/api/v2/documents/search
            fields:
              ref:
                type: String
                multiple: false
              q:
                type: String
                multiple: true
              # An Integer whose default is a string.
              page:
                type: Integer
                multiple: false
                default: "1"
              pageSize:
                type: Integer
                multiple: false
                default: "20"
              orderings:
                type: String
                multiple: false
              # The credential, as a field of the form.
              access_token:
                type: String
                multiple: false
        # A different host from the one serving this document.
        oauth_initiate: https://example-prismic.prismic.io/auth
        oauth_token: https://example-prismic.prismic.io/auth/token
        license: All Rights Reserved

conformance:
  - name: the whole repository is described to anyone who asks
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # Every content type and its label, with no credential presented.
        'types.blog': Blog
        'types.page': Page
        'languages[0].id': es-es
        'languages[0].name': Spanish - Spain (Traditional)

  - name: the API describes itself as an HTML form
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # A method, an encoding type, an action and a field list: what a
        # browser reads out of markup, in a JSON API.
        'forms.everything.method': GET
        'forms.everything.enctype': application/x-www-form-urlencoded
        'forms.everything.action': https://example-prismic.cdn.prismic.io/api/v2/documents/search

  - name: the credential is one of the form's fields
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # In the same map as q and page, typed String, in a document handed
        # to a caller who has not presented one.
        'forms.everything.fields.access_token.type': String
        'forms.everything.fields.q.multiple': true
        'forms.everything.fields.ref.type': String

  - name: an Integer field has a string default
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # The type says Integer and the default is quoted, on both of them.
        'forms.everything.fields.page.type': Integer
        'forms.everything.fields.page.default': "1"
        'forms.everything.fields.pageSize.type': Integer
        'forms.everything.fields.pageSize.default': "20"

  - name: the master ref is the reason every read is two requests
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # A token that changes on every publish, which every query must carry.
        'refs[0].id': master
        'refs[0].ref': W3ROxyYAAPeuMvvg
        'refs[0].isMasterRef': true
        'refs[0].label': Master

  - name: the CDN hands out the origin's addresses
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # A different host from the one serving this document.
        oauth_initiate: https://example-prismic.prismic.io/auth
        oauth_token: https://example-prismic.prismic.io/auth/token
        license: All Rights Reserved

  - name: the version is a commit
    source: https://example-prismic.cdn.prismic.io/api/v2
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /api/v2
      headers: {}
    expect:
      status: 200
      body:
        # Seven hex characters, in the field a client would compare against a
        # release.
        version: 482083b
        # And the A/B testing state, in the discovery document.
        'experiments.draft': []
        'experiments.running': []
        bookmarks: {}
        tags: []

  - name: a repository that is not there answers nothing at all
    source: https://cauldron-nope.cdn.prismic.io/api/v2
    fixture: site
    request:
      method: GET
      path: /api/v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # Promising something to parse, with nothing to parse.
        Content-Type: application/json
      no_body: true
