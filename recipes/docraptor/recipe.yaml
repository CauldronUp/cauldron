# DocRaptor Recipe for Cauldron
#
# The asynchronous document job, read from the API documentation at
# docraptor.com/documentation/api, and struck live on 2026-09-14 with no
# credential, with a wrong basic credential, on a path that does not exist,
# with a method the path does not take, and on a path one underscore away from
# a real one.
#
# **The failures are XML and the successes are JSON.** Struck live:
#
#   Content-Type: application/xml; charset=utf-8
#
#   <?xml version="1.0" encoding="UTF-8"?>
#   <errors>
#     <error>Please provide a valid API key.</error>
#   </errors>
#
# while `GET /status/{id}` answers `{"status":"completed", ...}`. One API, two
# serialisations, split by whether the request worked -- so a client calling
# `.json()` on its own mistake throws, and the XML declaration, the wrapper
# element and the `charset` are all there to carry nine words.
#
# **A missing key and a wrong key are the same sentence.** "Please provide a
# valid API key." to a caller who provided one, and to a caller who provided
# none.
#
# **A mistyped path gets the marketing site.** `GET /cauldron-nope`,
# `PUT /docs` and `GET /doc_status/abc123` -- one underscore from the real
# `/status/abc123` -- all answer `404` with `text/html` and DocRaptor's own
# homepage markup, `<meta name="description" content="Simple Excel and PDF
# document generation webservice.">` included.
#
# **A list of errors is one string with newlines in it.** A failed job answers
#
#   {"status":"failed",
#    "validation_errors":"Name can't be blank\nName is too long (maximum is 200 characters)"}
#
# Two errors, joined by a newline, in a field whose name is plural. A caller who
# wants them separately splits on `\n` and hopes no message contains one.
#
# **And the completion time is an English sentence.** `"message": "Completed at
# Mon Jun 06 18:33:17 +0000 2011"` -- Ruby's default `Time#to_s`, prefixed with
# a word, in a field called message. There is no machine-readable finish time
# anywhere on the record.
#
# **The success and the failure share no fields but one.** A completed job
# carries `download_url`, `message`, `number_of_pages` and `status`; a failed
# one carries `status` and `validation_errors`. The only key on both is
# `status`, so every other field is optional in practice and none is documented
# as such.
#
# Also pinned: the asynchronous create answers `{"status_id":"123454321"}` and
# nothing else, so the only thing a caller gets back from submitting a document
# is a numeric string; `status` moves through `queued`, `working`, `completed`
# and `failed`, with the first two carrying none of the completion fields; a
# job has 600 seconds to finish; and a `download_url` may be good for exactly
# one download depending on the account's retention policy, which nothing on
# the record says.

recipe: docraptor
capability: files
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://docraptor.com/documentation/api

auth:
  scheme: basic
  # The API key is the username; the password is empty.
  credential: username
  keys:
    - cauldr0n-docraptor-fixture-key
  # One sentence for both.
  absent_error: invalid_api_key
  malformed_error: invalid_api_key
  rejected_error: invalid_api_key
  # The path and the verb are resolved first: both answer the website's 404.
  after_routing: true

responses:
  error:
    # Not JSON. A client calling .json() on this throws.
    style: text

resources:
  job:
    id:
      field: status_id
      style: digits
      length: 9
    fields:
      status:
        type: string
      download_url:
      # An English sentence carrying the completion time.
      message:
      number_of_pages:
      # A plural field holding one newline-joined string.
      validation_errors:

routes:
  - method: POST
    path: /docs
    resource: job
    operation: create
    status: 200
    # The whole of what a caller gets back for submitting a document. Named
    # "id" here because the trim runs before the rename; on the wire it is
    # status_id.
    returns:
      - id

  - method: GET
    path: /status/{id}
    resource: job
    operation: get
    not_found: invalid_api_key

errors:
  invalid_api_key:
    status: 401
    style: text
    message: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<errors>\n  <error>Please provide a valid API key.</error>\n</errors>\n"
    headers:
      Content-Type: application/xml; charset=utf-8

  # A mistyped path gets the website. Abridged here; see the README.
  unknown_route:
    status: 404
    style: text
    message: "<!DOCTYPE html>\n<html>\n  <head>\n    <meta content='text/html; charset=utf-8' http-equiv='Content-Type' />\n    <meta content='Simple Excel and PDF document generation webservice.' name='description' />\n  </head>\n  <body></body>\n</html>\n"
    headers:
      Content-Type: text/html

  method_not_allowed:
    status: 404
    style: text
    message: "<!DOCTYPE html>\n<html>\n  <head>\n    <meta content='text/html; charset=utf-8' http-equiv='Content-Type' />\n    <meta content='Simple Excel and PDF document generation webservice.' name='description' />\n  </head>\n  <body></body>\n</html>\n"
    headers:
      Content-Type: text/html

fixtures:
  empty:
    job: []

  jobs:
    job:
      - status_id: "123454321"
        status: completed
        download_url: https://docraptor.com/download/12345asdf
        # Ruby's Time#to_s, with a word in front of it.
        message: Completed at Mon Jun 06 18:33:17 +0000 2011
        number_of_pages: 2
        validation_errors: null
      - status_id: "987656789"
        status: failed
        download_url: null
        message: null
        number_of_pages: null
        # Two errors, joined by a newline, in a plural field.
        validation_errors: "Name can't be blank\nName is too long (maximum is 200 characters)"

conformance:
  - name: the refusal is xml from an api whose successes are json
    source: https://docraptor.com/docs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: POST
      path: /docs
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/xml; charset=utf-8
      # A declaration, a wrapper element and a charset, to carry nine words.
      body_matches: '[\s\S]*<error>Please provide a valid API key\.</error>[\s\S]*'

  - name: and a wrong key is the same sentence
    source: https://docraptor.com/docs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: POST
      path: /docs
      headers:
        # notarealkey with an empty password.
        Authorization: "Basic bm90YXJlYWxrZXk6"
    expect:
      status: 401
      body_matches: '[\s\S]*Please provide a valid API key\.[\s\S]*'

  - name: a path that does not exist is the marketing site
    source: https://docraptor.com/cauldron-nope
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '[\s\S]*Simple Excel and PDF document generation webservice\.[\s\S]*'

  - name: and so is a method the path does not take
    source: https://docraptor.com/docs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: PUT
      path: /docs
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '[\s\S]*<!DOCTYPE html>[\s\S]*'

  - name: submitting a document hands back one numeric string
    source: https://docraptor.com/documentation/api
    fixture: jobs
    request:
      method: POST
      path: /docs
      headers:
        # cauldr0n-docraptor-fixture-key with an empty password.
        Authorization: "Basic Y2F1bGRyMG4tZG9jcmFwdG9yLWZpeHR1cmUta2V5Og=="
      json:
        document_type: pdf
        async: true
    expect:
      status: 200
      matches:
        # The whole of the response: a numeric string, and nothing else.
        status_id: '\A[0-9]+\z'
      absent:
        - status
        - download_url

  - name: the completion time is an english sentence
    source: https://docraptor.com/documentation/api
    fixture: jobs
    request:
      method: GET
      path: /status/123454321
      headers:
        Authorization: "Basic Y2F1bGRyMG4tZG9jcmFwdG9yLWZpeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        status: completed
        # Ruby's Time#to_s, prefixed with a word, in a field called message.
        message: Completed at Mon Jun 06 18:33:17 +0000 2011
        download_url: https://docraptor.com/download/12345asdf
        number_of_pages: 2

  - name: a list of errors is one string with newlines in it
    source: https://docraptor.com/documentation/api
    fixture: jobs
    request:
      method: GET
      path: /status/987656789
      headers:
        Authorization: "Basic Y2F1bGRyMG4tZG9jcmFwdG9yLWZpeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        status: failed
        # Two errors, joined by \n, in a field whose name is plural.
        validation_errors: "Name can't be blank\nName is too long (maximum is 200 characters)"
        # And none of the completion fields.
        download_url: null
        message: null
        number_of_pages: null

  - name: a status id that is not there gets the credential sentence
    source: https://docraptor.com/status/abc123
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: GET
      path: /status/000000000
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/xml; charset=utf-8
      body_matches: '[\s\S]*Please provide a valid API key\.[\s\S]*'
