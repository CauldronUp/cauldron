# Hunter Recipe for Cauldron
#
# The email verifier, read from the OpenAPI document Hunter serves without a
# credential at api.hunter.io/openapi.json, and struck live on 2026-09-13 with
# no credential, with a wrong key in the query string, on a path that does not
# exist, and with a method the path does not take.
#
# **A hundred and twenty of the document's hundred and thirty-three operations
# point at a placeholder that says so.** `generic_resource_response` is
# `{"type": "object", "additionalProperties": true}`, and its description reads:
# "Generic envelope for V2 resource operations whose detailed schema is not yet
# in the contract." Leads, campaigns, companies, api-keys, bulk operations --
# every one of them is typed as "an object", by a named schema that admits it.
# Thirteen operations have a real one.
#
# **Any failure may arrive in either of two shapes, and one is called legacy.**
# `error_response` is a `oneOf` of `standard_error_response` --
# `{errors: [{id, code, details}]}` -- and `legacy_error_response`, which is
# `{error: {}}`: a required key whose schema is the empty object, so its value
# may be anything at all.
#
# **"No user found for the API key supplied" is said for supplying none.**
# Struck live with no credential:
#
#   {"errors":[{"id":"authentication_failed","code":401,"details":"No user found for the API key supplied"}]}
#
# And a wrong key in the query string gets the identical body, so a key that is
# absent and a key that is wrong are the same sentence.
#
# **`id` is the code and `code` is the status.** The field named `id` holds
# `authentication_failed`; the field named `code` holds the integer 401. And the
# prose lives in `details`, plural, holding one sentence.
#
# **The secret is a declared query parameter.** `apiKeyQuery` is a first-class
# security scheme -- `{"type": "apiKey", "in": "query", "name": "api_key"}` --
# beside `apiKeyHeader` and `bearerAuth`. Three schemes for one credential, and
# the one the documentation's examples use puts it in the URL.
#
# **An unrouted path answers a branded HTML page.** `404 Not Found - Hunter`,
# with a stylesheet, on an API whose every other response is JSON.
#
# **A deprecation notice is a required response field.** The verifier's `data`
# object requires `_deprecation_notice` -- a leading underscore, and prose the
# contract insists on, on every verification.
#
# **`status` and `result` are both required strings.** Two verdict fields on one
# record, and nothing says how they differ.
#
# **And `webmail` appears twice in one response.** Once inside `data` and once
# inside `meta`, at two levels, under one name.
#
# Also pinned: nine booleans on the record -- `regexp`, `gibberish`,
# `disposable`, `webmail`, `mx_records`, `smtp_server`, `smtp_check`,
# `accept_all`, `block` -- with no enum anywhere; `meta.params.email` echoes the
# request back inside the response; and every one of those objects is
# `additionalProperties: false`, a closed contract, in a document whose other
# hundred and twenty operations are open.

recipe: hunter
capability: marketing
version: 0.1.0

upstream:
  api: "2.0.0"
  docs: https://hunter.io/api-documentation
  spec: https://api.hunter.io/openapi.json
  spec_hash: e62ce2b9a2813a003d0b53b92895bff959f6561da4854589dc1e3fcb1dcee3a9
  spec_seen: "2026-09-13"

auth:
  # A first-class security scheme that puts the secret in the URL.
  scheme: query
  param: api_key
  keys:
    - cauldr0nf1xturek3y00000000000000000000
  also:
    - scheme: header
      header: X-API-KEY
  # One sentence for a key that is absent and one that is wrong.
  absent_error: authentication_failed
  rejected_error: authentication_failed
  after_routing: true

responses:
  resource:
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    # Plural, holding one sentence.
    message_field: details
    # Which holds a name, while the field called code holds the status.
    code_field: id

resources:
  verification:
    id:
      field: email
      style: opaque
      length: 24
    fields:
      # Two verdict fields, and nothing saying how they differ.
      status:
        type: string
      result:
        type: string
      score:
        type: integer
      regexp:
        type: boolean
      gibberish:
        type: boolean
      disposable:
        type: boolean
      # Which is also a key of meta, in the same response.
      webmail:
        type: boolean
      mx_records:
        type: boolean
      smtp_server:
        type: boolean
      smtp_check:
        type: boolean
      accept_all:
        type: boolean
      block:
        type: boolean
      sources:
        type: list
      # Required, underscored, and prose.
      _deprecation_notice:
        type: string

routes:
  - method: GET
    path: /v2/email-verifier
    resource: verification
    operation: get
    # The address is the thing being asked about, in the query string beside
    # the credential.
    id_from: query:email
    lookup_by: email
    fields:
      # The request, echoed back inside the response...
      meta.params.email: person@example.com
      # ...and webmail a second time, one level up from the other one.
      meta.webmail: false
      meta.domain: example.com
      meta.company_name: Example

errors:
  authentication_failed:
    status: 401
    # A name, in the field called id.
    code: authentication_failed
    message: No user found for the API key supplied

  method_not_allowed:
    # Live, a wrong method is answered by the credential check rather than by
    # the router.
    status: 401
    code: authentication_failed
    message: No user found for the API key supplied

  resource_missing:
    status: 401
    code: authentication_failed
    message: No user found for the API key supplied

fixtures:
  empty:
    verification: []

  checked:
    verification:
      - email: person@example.com
        # Two verdicts.
        status: valid
        result: deliverable
        score: 97
        regexp: true
        gibberish: false
        disposable: false
        # And the same key again, in meta.
        webmail: false
        mx_records: true
        smtp_server: true
        smtp_check: true
        accept_all: false
        block: false
        sources:
          - domain: example.com
            uri: https://example.com/team
            extracted_on: "2026-02-14"
            last_seen_on: "2026-09-01"
            still_on_page: true
        # Required, and prose.
        _deprecation_notice: The score field will be removed in a future version of this endpoint.

conformance:
  - name: no user is found for a key that was never supplied
    source: https://api.hunter.io/v2/leads
    verified: "2026-09-13"
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers: {}
      query:
        email: person@example.com
    expect:
      status: 401
      body:
        # A name in the field called id, and the status in the field called
        # code, with the sentence under a plural details.
        'errors[0].id': authentication_failed
        'errors[0].details': No user found for the API key supplied

  - name: a wrong key in the URL gets the identical sentence
    source: https://api.hunter.io/v2/leads
    verified: "2026-09-13"
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers: {}
      query:
        email: person@example.com
        # A declared security scheme puts the secret here.
        api_key: notarealkey
    expect:
      status: 401
      body:
        'errors[0].id': authentication_failed
        'errors[0].details': No user found for the API key supplied

  - name: a method the route does not take is answered the same way
    source: https://api.hunter.io/v2/leads
    verified: "2026-09-13"
    fixture: checked
    request:
      method: PUT
      path: /v2/email-verifier
      headers: {}
    expect:
      status: 401
      body:
        'errors[0].details': No user found for the API key supplied

  - name: a deprecation notice is a required response field
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: person@example.com
    expect:
      status: 200
      body:
        # A leading underscore, and prose, in required.
        'data._deprecation_notice': The score field will be removed in a future version of this endpoint.
        'data.email': person@example.com

  - name: two verdict fields and nothing saying how they differ
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: person@example.com
    expect:
      status: 200
      body:
        # Both required, both strings.
        'data.status': valid
        'data.result': deliverable
        'data.score': 97

  - name: webmail appears twice in one response at two levels
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: person@example.com
    expect:
      status: 200
      body:
        # Once inside data...
        'data.webmail': false
        # ...and once inside meta.
        'meta.webmail': false
        'meta.domain': example.com
        'meta.company_name': Example
        # And the request, echoed back inside the response.
        'meta.params.email': person@example.com

  - name: nine booleans and no enum anywhere
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: person@example.com
    expect:
      status: 200
      body:
        'data.regexp': true
        'data.gibberish': false
        'data.disposable': false
        'data.mx_records': true
        'data.smtp_server': true
        'data.smtp_check': true
        'data.accept_all': false
        'data.block': false

  - name: a source says when it was seen and whether it still is
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: person@example.com
    expect:
      status: 200
      body:
        'data.sources[0].domain': example.com
        'data.sources[0].uri': https://example.com/team
        'data.sources[0].extracted_on': "2026-02-14"
        'data.sources[0].last_seen_on': "2026-09-01"
        'data.sources[0].still_on_page': true

  - name: an address the verifier has not seen is refused like a bad key
    source: https://api.hunter.io/openapi.json
    fixture: checked
    request:
      method: GET
      path: /v2/email-verifier
      headers:
        X-API-KEY: cauldr0nf1xturek3y00000000000000000000
      query:
        email: nobody@example.invalid
    expect:
      # The document declares a 200 and a 401 on this operation and nothing
      # else, so there is no shape for "no such address" to arrive in.
      status: 401
      body:
        'errors[0].id': authentication_failed
