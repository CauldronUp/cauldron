# Fillout Recipe for Cauldron
#
# The forms listing, read from the OpenAPI document Fillout embeds in its
# documentation page for the endpoint, and struck live against api.fillout.com
# on 2026-09-13 with no credential and with three differently-wrong ones.
#
# **The failures walk a caller through the credential's format.** Struck live,
# all 400:
#
#   (no header)              {"statusCode":400,"error":"Bad Request","message":"API authorization header missing"}
#   Bearer notarealkey       {"statusCode":400,"error":"Bad Request","message":"API key missing underscore"}
#   Bearer abc_def           {"statusCode":400,"error":"Bad Request","message":"Incorrectly formatted API key was passed"}
#
# Three different sentences, each one narrowing what a valid key looks like. The
# second says a key contains an underscore; the third says an underscore is not
# enough. So a caller who has never seen a real key learns its shape by sending
# wrong ones, which is the opposite of what a credential failure is for.
#
# **And none of them is a 401.** Every credential state -- absent, malformed,
# wrong -- is `400 Bad Request`. A client branching on 401 never fires, and a
# retry-on-401 interceptor never runs.
#
# **The document declares no failure at all.** `GET /forms` lists exactly one
# response, `200`, under a `security: [bearerAuth]` it applies to every
# operation. So the three answers above are the entire failure surface and the
# description mentions none of them.
#
# **A form is two fields.** `FormSummary` is `name` and `formId`, both required,
# and nothing else -- no created date, no status, no URL, no submission count.
# A listing whose records cannot be sorted, filtered or dated by anything in
# them.
#
# **`formId` is "the public identifier of the form".** Which says there is
# another one. The listing returns the public id and never the private one, and
# nothing in the document says what the difference is or where the other lives.
#
# **The base URL is a data-residency choice.** Two servers are declared,
# `api.fillout.com` and `eu-api.fillout.com`, with nothing in a key or a
# response saying which one holds a given account -- so the host is
# configuration a caller has to be told separately from the credential.
#
# **The envelope is Fastify's, and this is the third API in this collection to
# send it.** `{statusCode, error, message}` also arrives from Instantly, whose
# key order reverses between layers, and from Val Town, where the application's
# own `error` means something else. Same three keys, three different meanings
# of `error` across the three.

recipe: fillout
capability: forms
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://fillout.com/help/api-reference/get-forms
  # No spec at an address of its own: Fillout embeds a complete OpenAPI
  # document per endpoint inside that endpoint's documentation page, the same
  # arrangement Mailtrap and lemlist use. There is nothing single to
  # fingerprint.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    # With an underscore, because the failures below say a real one has one.
    - fillout_cauldr0nf1xturek3y
  absent_error: header_missing
  # What a key with no underscore in it is told. A key that has one and is
  # still wrong gets a third sentence -- see the README's modelling limits.
  rejected_error: key_missing_underscore
  after_routing: true

responses:
  list:
    style: bare
  error:
    # Fastify's three keys, for the third time in this collection.
    style: flat
    message_field: message
    code_field: error
    code_type: string
    status_field: statusCode

resources:
  form:
    id:
      # "The public identifier of the form", which says there is another one.
      field: formId
      style: opaque
      length: 22
    fields:
      # The only other field on the record.
      name:
        type: string

routes:
  - method: GET
    path: /v1/api/forms
    resource: form
    operation: list
    pagination:
      # None declared and none offered: the operation takes no parameters at
      # all.
      style: none

errors:
  header_missing:
    status: 400
    code: Bad Request
    message: API authorization header missing

  key_missing_underscore:
    # Not 401. And the sentence tells a caller what a real key contains.
    status: 400
    code: Bad Request
    message: API key missing underscore

fixtures:
  empty:
    form: []

  account:
    form:
      - formId: vso9PM1Wt3us
        name: Customer feedback
      - formId: bT4wKq2Zx8Lr
        name: Event registration

conformance:
  - name: a missing header is a bad request rather than unauthorized
    source: https://api.fillout.com/v1/api/forms
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/api/forms
      headers: {}
    expect:
      # 400, on an API where every credential state is 400.
      status: 400
      body:
        statusCode: 400
        error: Bad Request
        message: API authorization header missing

  - name: a wrong key is told what a real key contains
    source: https://api.fillout.com/v1/api/forms
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /v1/api/forms
      headers:
        # No underscore in it, which is the thing the answer complains about.
        Authorization: "Bearer notarealkey"
    expect:
      status: 400
      body:
        # A caller who has never seen a real key learns its shape from this.
        message: API key missing underscore
        statusCode: 400
        error: Bad Request

  - name: a form is a name and an id and nothing else
    source: https://fillout.com/help/api-reference/get-forms
    fixture: account
    request:
      method: GET
      path: /v1/api/forms
      headers:
        Authorization: "Bearer fillout_cauldr0nf1xturek3y"
    expect:
      status: 200
      body:
        # No created date, no status, no URL, no submission count: nothing in
        # the record can sort or filter the listing.
        '[0].formId': vso9PM1Wt3us
        '[0].name': Customer feedback

  - name: the listing is a bare array
    source: https://fillout.com/help/api-reference/get-forms
    fixture: account
    request:
      method: GET
      path: /v1/api/forms
      headers:
        Authorization: "Bearer fillout_cauldr0nf1xturek3y"
    expect:
      status: 200
      body:
        # No envelope, no total, no cursor -- and no parameters on the
        # operation to ask for any.
        '[1].formId': bT4wKq2Zx8Lr
        '[1].name': Event registration

  - name: an account with no forms answers an empty array
    source: https://fillout.com/help/api-reference/get-forms
    fixture: empty
    request:
      method: GET
      path: /v1/api/forms
      headers:
        Authorization: "Bearer fillout_cauldr0nf1xturek3y"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
