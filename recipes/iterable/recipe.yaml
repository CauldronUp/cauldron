# Iterable Recipe for Cauldron
#
# Written against Iterable's API reference at api.iterable.com/api/docs and
# struck live against api.iterable.com on 2026-09-07 with no credential and
# then with a deliberately invalid one.
#
# **The refusal hands back the caller's IP address and one of Iterable's own.**
# Struck live, twice, minutes apart:
#
#   GET /api/lists                        (no credential)
#   401 {"msg":"No API key found on request","code":"Unauthorized",
#        "params":{"ip":"<the caller>,10.10.50.35","endpoint":"/api/lists"}}
#
#   GET /api/lists                        Api-Key: not-a-real-key
#   401 {"msg":"Invalid API key","code":"Unauthorized",
#        "params":{"ip":"<the caller>,10.10.49.6","endpoint":"/api/lists"}}
#
# `ip` is the X-Forwarded-For chain, joined with a comma and sent as one
# string. The first address is the caller's. The second is inside Iterable:
# 10.10.50.35 on one request and 10.10.49.6 on the next, from the same client
# minutes apart, which makes it the load balancer node that happened to take
# the call. So an unauthenticated 401 reports which of Iterable's internal
# hosts answered, and enough of them over enough requests to map the range.
#
# It is also a header the caller controls. X-Forwarded-For is appended to by
# each hop, so the first element is whatever the client sent -- and a client
# that sends one gets it echoed back into a body it can read without a
# credential.
#
# **`params.endpoint` echoes the path.** Useful for a log, and it means the
# 401 confirms which routes exist -- except that it does not, because an
# unknown path is answered by something else entirely.
#
# **An unknown path is HTML.** 404, `text/html`, a full application page. So
# the failure a client meets while getting a URL wrong is the one `.json()`
# throws on, and the JSON 401 above is only reachable on paths that do exist.
#
# **The prose field is `msg`.** Three letters, no vowel in the middle, beside a
# `code` that carries the word "Unauthorized" rather than a code. So the field
# named for a code holds a title, the field named for a message holds the only
# useful sentence, and neither is spelled the way anything else in this
# collection spells it.
#
# **The credential is a header called `Api-Key`.** Not Authorization, not
# X-Api-Key. One capital and one hyphen, and HTTP header names are
# case-insensitive so it does not matter -- but every code sample writes it
# that way and every reader assumes it does.

recipe: iterable
capability: marketing
version: 0.1.0

upstream:
  api: "1"
  docs: https://api.iterable.com/api/docs
  # No spec: the reference at api.iterable.com/api/docs is a rendered Swagger
  # UI page whose served HTML carries no document.

auth:
  scheme: header
  header: Api-Key
  keys:
    - cauldron0iterable0fixture0key000
  # Two sentences under one code, struck live.
  absent_error: no_api_key
  rejected_error: invalid_api_key

responses:
  list:
    style: wrapped
    key: lists
  error:
    style: flat
    # Three letters. The only field carrying a sentence.
    message_field: msg
    # Named code and holding a word.
    code_field: code
    code_type: string

resources:
  list:
    id:
      field: id
      style: numeric
    fields:
      name:
        type: string
      createdAt:
        type: timestamp_ms
      listType:
        type: string
        default: Standard

routes:
  - method: GET
    path: /api/lists
    resource: list
    operation: list
    pagination:
      # None. The lists endpoint answers everything in one body, with no
      # limit, offset or cursor anywhere in the request or the response.
      style: none

errors:
  no_api_key:
    status: 401
    code: "Unauthorized"
    message: "No API key found on request"
    fields:
      # Struck live. The first element is the caller's address and the second
      # is inside Iterable -- a different one on each of two requests minutes
      # apart, so it names the node that answered.
      'params.ip': "203.0.113.10,10.10.50.35"
      'params.endpoint': /api/lists

  invalid_api_key:
    status: 401
    code: "Unauthorized"
    # A different sentence for a key that was sent and is wrong, which is the
    # distinction most providers here do not make.
    message: "Invalid API key"
    fields:
      'params.ip': "203.0.113.10,10.10.49.6"
      'params.endpoint': /api/lists

fixtures:
  empty:
    list: []

  project:
    list:
      - id: 1284461
        name: Weekly digest
        # Milliseconds since the epoch, as a number rather than a date.
        createdAt: 1782489600000
        listType: Standard
      - id: 1284462
        name: Churn risk
        createdAt: 1785168000000
        # A list whose membership is computed rather than stored, in the same
        # array as one that is not, distinguished only by this word.
        listType: Dynamic

conformance:
  - name: no credential hands back two IP addresses
    source: https://api.iterable.com/api/lists
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers: {}
    expect:
      status: 401
      body:
        msg: "No API key found on request"
        code: Unauthorized
        # The forwarded-for chain as one comma-joined string. The second
        # address is inside Iterable.
        'params.ip': "203.0.113.10,10.10.50.35"

  - name: the internal address is not the same one twice
    source: https://api.iterable.com/api/lists
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: not-a-real-key
    expect:
      status: 401
      body:
        # Struck live minutes after the case above, from the same client:
        # 10.10.49.6 rather than 10.10.50.35. The value names the node that
        # answered, so enough refusals map the range -- and no credential is
        # needed for any of them.
        'params.ip': "203.0.113.10,10.10.49.6"
        msg: "Invalid API key"

  - name: the refusal echoes the path it refused
    source: https://api.iterable.com/api/lists
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers: {}
    expect:
      status: 401
      body:
        'params.endpoint': /api/lists

  - name: the field named code carries a word
    source: https://api.iterable.com/api/lists
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: not-a-real-key
    expect:
      status: 401
      body:
        # "Unauthorized" is a title, not a code, and it is the same on both
        # failures -- so the machine-readable field is the one carrying no
        # information and `msg` is where the difference lives.
        code: Unauthorized

  - name: lists are wrapped under their own plural
    source: https://api.iterable.com/api/docs
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: cauldron0iterable0fixture0key000
    expect:
      status: 200
      body:
        'lists[0].id': 1284461
        'lists[0].name': Weekly digest

  - name: a creation time is milliseconds as a number
    source: https://api.iterable.com/api/docs
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: cauldron0iterable0fixture0key000
    expect:
      status: 200
      body:
        # Not a string, not seconds, and no timezone anywhere -- 13 digits
        # that a JSON parser reads as a Number and that a client dividing by
        # 1000 gets wrong in the direction that still looks like a date.
        'lists[0].createdAt': 1782489600000

  - name: a computed list sits beside a stored one
    source: https://api.iterable.com/api/docs
    fixture: project
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: cauldron0iterable0fixture0key000
    expect:
      status: 200
      body:
        # Dynamic membership is recomputed and Standard membership is not, so
        # the same "remove a subscriber" call means two different things
        # depending on a word in the record.
        'lists[1].listType': Dynamic
        'lists[0].listType': Standard

  - name: a project with no lists answers an empty array
    source: https://api.iterable.com/api/docs
    fixture: empty
    request:
      method: GET
      path: /api/lists
      headers:
        Api-Key: cauldron0iterable0fixture0key000
    expect:
      status: 200
      body:
        lists: []
