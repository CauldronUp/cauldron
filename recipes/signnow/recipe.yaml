# SignNow Recipe for Cauldron
#
# Written for the same question pandadoc/recipe.yaml and anvil/recipe.yaml
# in this collection were assigned: does creating a document here leave you
# with something usable, or something you have to poll for? SignNow's answer
# is the opposite of PandaDoc's, and it is worth stating precisely rather
# than by inference, because the evidence for it is unusually direct.
#
# The official .NET SDK's own response models settle it. Both
# CreateDocumentFromTemplateResponse and UploadDocumentResponse are declared
# as `: IdResponse` -- a base class with exactly one property, `id` -- and
# nothing else. Not a status, not a phase, not a "still processing" flag.
# Compare PandaDoc's Recipe in this collection, whose create response is the
# same nine-ish fields a GET answers with, one of which is a status the
# provider tells you to poll; compare Temporal Cloud's, whose create answers
# with a separate AsyncOperation built to be polled; compare Turso's, whose
# create answers with a truncated projection of the record that has no state
# field to withhold in the first place. SignNow's create answers with less
# than any of those three: an id, and the provider's own SDK declares
# nothing to poll it against, because there is nothing on the wire to poll.
#
# That absence is corroborated rather than assumed. SignNowDocument, the
# same SDK's model for GET /document/{id}, carries a `Status` property --
# and it is marked [JsonIgnore] and computed in C#, in the SDK's own code,
# by walking the document's field-invite records and their own statuses
# (Pending, Fulfilled, ...) rather than deserialised off any JSON key at
# all. The provider's wire format has no status field on a document,
# document group, or upload response anywhere this Recipe could find one;
# what the SDK calls DocumentStatus is a client-side summary of a completely
# different resource (invites), not a state the document itself reports.
# There being no field to poll is a stronger absence than a field that says
# nothing (Turso) or a field that has to be asked for twice (PandaDoc,
# Temporal Cloud) -- there is no question here of *when* the created
# document becomes usable, because nothing about how it was created leaves
# it in a state short of usable. Uploading a file and creating a document
# from a template are both a single synchronous call; the routes this Recipe
# was sent to model (Upload Document, Get Document, Get User) are read below
# from the PHP SDK's own contract-test fixtures and the .NET SDK's typed
# models -- both official, neither a live account -- rather than from a
# worked example this task could not obtain, and are named as documentation
# rather than observation for exactly that reason.
#
# What was obtained live, with no account and no key, against
# api.signnow.com, is the credential and routing behaviour -- and it answers
# the two questions this task asked in ways worth stating precisely:
#
#   1. On the resource surface, missing and wrong collapse to one sentence.
#      GET /user with no Authorization header at all, and the same request
#      with Authorization: Bearer junkjunkjunk, both answer the identical
#      27-byte body: {"error":"invalid_token","code":1537}, status 400 --
#      not 401, which is itself worth having pinned, since a client checking
#      response.status === 401 to detect "not authenticated" never matches
#      this provider at all.
#   2. On the token exchange, they do not. POST /oauth2/token with no
#      Authorization header answers {"error":"invalid_client","code":1538}.
#      The identical request with a syntactically wrong Authorization
#      header -- Basic-scheme but garbage base64, or a well-formed
#      Basic-scheme value that simply is not a real client's -- answers
#      {"error":"invalid_client"}, the same word, with the "code" key
#      missing entirely. Checked four ways live: no header, unparseable
#      base64, and two different real-shaped-but-wrong Basic credentials all
#      landed on the same two shapes, split cleanly along "was anything
#      Basic-shaped presented at all." A client reading .code to decide
#      whether a client id was ever configured gets a number on one and
#      undefined on the other, and a client reading only .error cannot tell
#      the two apart at all -- the two collections in this pair
#      (missing-vs-wrong distinguishable, and missing-vs-wrong collapsed)
#      turn out to sit on two different endpoints of the same provider
#      rather than on two different providers, which is not the shape this
#      collection's neighbours led me to expect.
#   3. Routing beats the credential, checked directly against a wrong method
#      on a real path: PATCH /user -- not in the Allow header any response
#      from that path carries, GET, HEAD, POST, PUT -- answers a genuine 405
#      with that Allow header, live, with no credential sent and also with a
#      wrong one, so the method check runs first either way. That is the
#      opposite of PandaDoc's Recipe in this collection, checked against the
#      identical question and landing the other way, and it agrees with
#      SingleStore's Recipe rather than Turso's on the same axis. A
#      genuinely unregistered path (GET
#      /this-is-not-a-real-endpoint) answers 404 the same way, before any
#      credential is examined: {"404":"Unable to find a route to match the
#      URI: this-is-not-a-real-endpoint"} -- a bare object whose only key is
#      the status code as a string, which is neither this project's usual
#      flat shape nor SignNow's own {"error", "code"} pair; the 405 carries
#      the identical convention, {"405":"PATCH method not allowed here."}.
#   4. Content-Type tells the truth everywhere this Recipe struck. Every
#      failure above -- 400, 401, 404, 405 -- answered Content-Type:
#      application/json and a body that parses as JSON. Nothing here
#      announces JSON and sends prose or HTML.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key, client id or client secret
#     was ever requested, guessed or used. The credential-failure and
#     routing cases below were struck live and carry a `verified:` date. The
#     resource shapes (Upload Document, Get Document, Get User, and the
#     shape of a successful token exchange) carry none, because no call this
#     task permits could produce one; they are read from two sources this
#     Recipe treats differently:
#       - Field NAMES are taken from the .NET SDK's typed response models
#         (SignNow.Net/Model/Responses/*.cs, SignNow.Net/Model
#         /SignNowDocument.cs) and from the PHP SDK's own contract-test
#         fixture files (tests/_data/.phiremock/expectations/*.json in
#         signnow/SignNowPHPSDK), both official and both maintained by
#         SignNow's own developer-tools team.
#       - VALUES in the PHP SDK's fixtures are generated by PHP's Faker
#         library for the SDK's own test suite -- "distinctio", "dolor",
#         "sint" and the like are not words SignNow's API sends, they are
#         Faker's stock Latin filler -- and are not reproduced here. Every
#         fixture value below is a plain, clearly-synthetic placeholder this
#         Recipe wrote, not a value read from either source, and the field
#         COUNT on the create/upload responses (id alone) is the one claim
#         taken directly from typed, hand-maintained source rather than from
#         a generated test double.
#   - signnow/OpenAPI-Specification, the repository SignNow's own developer
#     portal and several third-party trackers cite for a machine-readable
#     description, answers 404 on GitHub as of the date below -- it does not
#     exist under that name any more, and no replacement at a discoverable
#     URL was found. That is the whole reason upstream.spec is empty on this
#     Recipe: there is no fetchable description to fingerprint, checked
#     rather than assumed.
#   - The full SignNowDocument shape -- roles, fields, signatures, field
#     invites, routing details, thumbnails, an embedded editor -- is real and
#     mostly not modelled. This Recipe carries the handful of top-level
#     fields shared by the Get Document example and the SDK's own model
#     (id, document_name, page_count, original_filename, owner, owner_name,
#     template, created, updated) and states the rest as absent rather than
#     guess at their shape.
#   - Templates, document groups, bulk invite, embedded signing, folders,
#     webhooks (POST /api/v2/events) and the whole invite/signing workflow
#     past a document's own record are real and not modelled. Documents,
#     the user resource, and the two credential surfaces only.
#   - What a syntactically well-formed and genuinely correct client
#     credential or bearer token answers is not established for either
#     surface; nothing unauthenticated could reach it.
#
# The credentials below are fixtures and belong to no account.

recipe: signnow
capability: signing
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.signnow.com/docs/signnow/welcome
  # No spec recorded -- see the header's gap list. signnow/OpenAPI
  # -Specification, the repository the provider's own materials point at,
  # answers 404 on GitHub as of spec_seen below.

auth:
  # Genuinely bearer on the resource surface (Authorization: Bearer
  # <access_token>, obtained from a separate Basic-authenticated token
  # exchange) but expressed as scheme none plus matches_header below, the
  # same trade Temporal Cloud's and Turso's Recipes in this collection make:
  # a single Cauldron-wide scheme cannot serve one status for a wrong method
  # (405, checked before any credential) and a different one for a wrong
  # credential (400, checked before routing would ever refuse the method) on
  # one Recipe at once -- see the header's third finding.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: code

resources:
  document:
    id:
      # 40 lowercase hexadecimal characters, confirmed three independent
      # ways: the PHP SDK's own route matcher (/^\/document\/[0-9a-z]{40}$/),
      # its create-from-template matcher
      # (/^\/template\/[0-9a-z]{40}\/copy$/), and every id in both SDKs'
      # fixtures and examples. The same style Dropbox Sign's Recipe in this
      # collection uses for a signature_request_id, on an unrelated
      # provider.
      style: hex
      length: 40
    fields:
      document_name:
        type: string
      page_count:
        type: integer
        default: 1
      original_filename:
        type: string
      owner:
        type: string
      owner_name:
        type: string
      # Whether this document is itself a template. The SDK's own name for
      # the field, IsTemplate, wraps the wire's bare boolean "template".
      template:
        type: boolean
        default: false
      created:
        type: timestamp
      updated:
        type: timestamp

  user:
    id:
      style: hex
      length: 40
    fields:
      first_name:
        type: string
      last_name:
        type: string
      primary_email:
        type: string
      document_count:
        type: integer
        default: 0

routes:
  - method: GET
    path: /user
    resource: user
    operation: get
    id_from: auth
    matches_header:
      Authorization: Bearer cauldron-signnow-fixture-token-0000000000000000

  - method: GET
    path: /user
    error: invalid_token

  - method: GET
    path: /document/{id}
    resource: document
    operation: get
    matches_header:
      Authorization: Bearer cauldron-signnow-fixture-token-0000000000000000

  - method: GET
    path: /document/{id}
    error: invalid_token

  # Upload Document. The response is id alone -- see the header. No fields
  # are echoed because the SDK's own typed model, UploadDocumentResponse,
  # declares none.
  - method: POST
    path: /document
    resource: document
    operation: create
    matches_header:
      Authorization: Bearer cauldron-signnow-fixture-token-0000000000000000
    returns: [id]

  - method: POST
    path: /document
    error: invalid_token

  # A wrong method on a real path, checked live both ways: the credential is
  # never reached, and the answer is a genuine 405 with a real Allow header
  # -- the opposite of PandaDoc's Recipe in this collection on the identical
  # question. Declared without matches_header, so it answers this way
  # whatever was or was not presented.
  - method: PATCH
    path: /user
    error: method_not_allowed

  # A path this host has no route for at all, checked live with no
  # credential: routing refuses it before anything asks who is calling.
  - method: GET
    path: /this-is-not-a-real-endpoint
    error: unknown_route

  # The token exchange. A present, Basic-shaped Authorization header --
  # right or wrong -- reaches a different failure than an absent or
  # unparseable one; see the header's second finding. Neither shape needs a
  # fixture credential to demonstrate, since nothing unauthenticated could
  # exchange a real one, so both routes answer with a failure rather than a
  # token.
  - method: POST
    path: /oauth2/token
    error: invalid_client_absent

  - method: GET
    path: /oauth2/token
    error: invalid_request

errors:
  # The resource surface's one sentence for both an absent and a wrong
  # bearer token -- checked live both ways and byte-identical. Status 400,
  # not 401.
  invalid_token:
    status: 400
    # A digit-only string renders as a JSON number by this format's own
    # inference rule, matching the live body exactly: 1537, not "1537".
    code: "1537"
    message: invalid_token

  # A genuine 405, with the Allow header the live host actually sends.
  method_not_allowed:
    status: 405
    style: flat
    code_field: "-"
    message_field: "405"
    message: "PATCH method not allowed here."
    headers:
      allow: "GET, HEAD, POST, PUT"

  # {"404": "..."}: the status code itself as the only key, which is neither
  # this Recipe's own flat envelope (error/code) nor a shape this collection
  # sees often. Checked live, unauthenticated.
  unknown_route:
    status: 404
    style: flat
    code_field: "-"
    message_field: "404"
    message: "Unable to find a route to match the URI: this-is-not-a-real-endpoint"

  # No Authorization header at all on the token exchange. Checked live,
  # confirmed a second way with a non-Basic (Bearer-shaped) header and a
  # third way with Basic-shaped but unparseable base64 -- all three land
  # here, not on the shape below, so the line is "was a well-formed Basic
  # credential presented" rather than "was anything presented."
  invalid_client_absent:
    status: 400
    code: "1538"
    message: invalid_client

  # A well-formed Basic Authorization header -- decodes cleanly, whatever it
  # decodes to -- reaches a second, different failure: the same word, and no
  # code at all. Reached only by arming it, the same device Mezmo's and
  # FireHydrant's Recipes in this collection use for a second sentence
  # Cauldron's own binary credential check cannot produce unassisted.
  invalid_client_malformed:
    status: 400
    message: invalid_client
    code_field: "-"

  # GET on the token exchange is a real, registered route (OPTIONS on it
  # advertises GET, HEAD, POST) and answers neither of the shapes above: it
  # never reaches the client-credential check at all, because nothing about
  # the request supplies the grant_type a GET has nowhere to carry. Checked
  # live, unauthenticated.
  invalid_request:
    status: 400
    message: invalid_request
    code_field: "-"

fixtures:
  empty: {}

  account:
    user:
      - id: 14a2ac5df2c6dd5c8acdaaf73eee5b441028e334
        first_name: Ada
        last_name: Lovelace
        primary_email: ada@example.com
        document_count: 3

    document:
      - id: 8a0d822aae41195009f0a29db2c1b5fc035fa07f
        document_name: Consulting Agreement
        page_count: 4
        original_filename: consulting-agreement.pdf
        owner: ada@example.com
        owner_name: Ada Lovelace
        template: false
        created: 1754899200
        updated: 1754902800

conformance:
  - name: a missing bearer token and a wrong one answer the identical body
    source: https://api.signnow.com/user
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /user
    expect:
      status: 400
      headers:
        content-type: application/json
      body:
        error: invalid_token
        code: 1537

  - name: and the wrong token itself confirms it, not merely its absence
    source: https://api.signnow.com/user
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /user
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 400
      body:
        error: invalid_token
        code: 1537

  - name: a wrong method on a real path is a genuine 405, the credential never reached
    source: https://api.signnow.com/user
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /user
    expect:
      status: 405
      headers:
        allow: "GET, HEAD, POST, PUT"
      body:
        "405": "PATCH method not allowed here."

  - name: and the same 405 answers whether or not a credential was sent
    source: https://api.signnow.com/user
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /user
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 405
      body:
        "405": "PATCH method not allowed here."

  - name: an unregistered path 404s before any credential is examined
    source: https://api.signnow.com/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: application/json
      body:
        "404": "Unable to find a route to match the URI: this-is-not-a-real-endpoint"

  - name: the token exchange with no credential at all names a client, not a token
    # Distinct from invalid_token above on purpose: this is a different
    # check, on a different route, and the wire says so with a different
    # word (invalid_client) as well as a different code.
    source: https://api.signnow.com/oauth2/token
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /oauth2/token
    expect:
      status: 400
      body:
        error: invalid_client
        code: 1538

  - name: a well-formed but wrong Basic credential reaches a second check with no code at all
    # Armed, because Cauldron's binary credential check cannot distinguish
    # "nothing was presented" from "something was, and it was wrong" on its
    # own -- see the header's second finding. This exact request and
    # response were both struck live.
    source: https://api.signnow.com/oauth2/token
    verified: "2026-09-01"
    arm: invalid_client_malformed
    fixture: empty
    request:
      method: POST
      path: /oauth2/token
      headers:
        Authorization: Basic Y2F1bGRyb24tc2lnbm5vdy1maXh0dXJlOmp1bmtzZWNyZXQ=
    expect:
      status: 400
      body:
        error: invalid_client
      absent:
        - code

  - name: a Bearer-shaped credential on the token exchange is still treated as absent
    source: https://api.signnow.com/oauth2/token
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /oauth2/token
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 400
      body:
        error: invalid_client
        code: 1538

  - name: GET on the token exchange never reaches the client-credential check
    source: https://api.signnow.com/oauth2/token
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /oauth2/token
    expect:
      status: 400
      body:
        error: invalid_request
      absent:
        - code

  - name: uploading a document answers an id and nothing the SDK's own model declares beyond it
    source: https://github.com/signnow/SignNow.NET/blob/develop/SignNow.Net/Model/Responses/UploadDocumentResponse.cs
    fixture: empty
    request:
      method: POST
      path: /document
      headers:
        Authorization: Bearer cauldron-signnow-fixture-token-0000000000000000
    expect:
      status: 200
      matches:
        id: "^[0-9a-f]{40}$"
      absent:
        - document_name
        - status
        - page_count

  - name: a document's record carries no status field for a client to poll
    # There is no field here to assert is absent-because-still-processing --
    # see the header. This case pins what IS on the wire instead.
    source: https://github.com/signnow/SignNow.NET/blob/develop/SignNow.Net/Model/SignNowDocument.cs
    fixture: account
    request:
      method: GET
      path: /document/8a0d822aae41195009f0a29db2c1b5fc035fa07f
      headers:
        Authorization: Bearer cauldron-signnow-fixture-token-0000000000000000
    expect:
      status: 200
      body:
        document_name: Consulting Agreement
        owner: ada@example.com
        template: false
      absent:
        - status
        - state
