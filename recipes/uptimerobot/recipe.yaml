# UptimeRobot Recipe for Cauldron
#
# UptimeRobot's v2 API takes one HTTP method for everything that reads or
# writes a monitor, and it is not GET.
#
#   GET https://api.uptimerobot.com/v2/getMonitors
#   200 OK   text/html; charset=utf-8   39 bytes
#
#   GET is not supported. Use POST instead.
#
# **That is a 200, not a 4xx, carrying thirty-nine bytes of plain prose
# instead of JSON.** A client that checks response.ok before looking at
# anything else reads success from a request that returned nothing it asked
# for, and a client that calls .json() on it throws. Checked against
# getMonitors and getAccountDetails, byte-identical both times: the message
# does not name the endpoint it refused, so it is the same sentence whichever
# one a caller reaches for.
#
# **GET is special-cased and nothing else is.** PUT and DELETE against that
# same, real path answer a completely different way -- Express's own
# unhandled-route page, the one node ships with no route configured for a
# method:
#
#   PUT https://api.uptimerobot.com/v2/getMonitors
#   404 Not Found   text/html; charset=utf-8
#
#   <!DOCTYPE html>
#   ...
#   <pre>Cannot PUT /v2/getMonitors</pre>
#   ...
#
# So "the wrong method" is not one failure here, it is two: GET on a real
# endpoint is caught deliberately and answered with a sentence written for a
# human, and every other wrong method falls through to whatever the framework
# does by default when nothing matches. A path nobody has ever heard of
# answers the identical framework page, for any method including GET --
# checked against /v2/completelyMadeUpMethodXYZ and /v2/nonexistentMethod.
# The custom sentence exists only for the specific, real, POST-only routes;
# everything else, wrong method or wrong path, gets the same unhandled-route
# HTML this server would show for any Express app with nothing mounted there.
#
# **The credential is a POST body parameter, and it takes no shape the
# provider will not accept.** api_key travels as a normal
# application/x-www-form-urlencoded field, the way every documented example
# sends it -- and a JSON body with the same key, `{"api_key": "..."}`, is
# accepted exactly as readily and answers byte-identically. Nothing here
# insists on the documented encoding.
#
# **Every credential failure is also a 200.** No api_key at all:
#
#   {"stat":"fail","error":{"type":"missing_parameter","parameter_name":"api_key","message":"api_key parameter is missing."}}
#
# A key-shaped value that is not a real one:
#
#   {"stat":"fail","error":{"type":"invalid_parameter","parameter_name":"api_key","passed_value":"u000000-0000000000000000000000","message":"api_key not found."}}
#
# Both 200. A client that only branches on status code never reaches the
# "fail" sitting in the body, on either one -- and the second echoes the
# rejected key back under passed_value, so whatever was sent is confirmed
# received rather than merely refused.
#
# Written against the live API rather than a document: every case below was
# checked against api.uptimerobot.com on the date in its verified field.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no key was ever requested, guessed or
#     used, so there is no fixture for a monitor, a listing, or a successful
#     getMonitors call anywhere in this Recipe. Everything here is what the
#     API does when it is asked and refuses, which is also the entire reason
#     it was worth a Recipe: the refusal is the interesting part.
#   - The real body orders its keys stat, then error. This project's JSON
#     writer sorts keys alphabetically, so the emulator answers error, then
#     stat. Every case here asserts fields by name rather than by position,
#     so nothing below notices, and nothing below claims otherwise.
#   - Cloudflare sits in front of this API and decorates every response with
#     a dozen headers this Recipe does not model -- Nel, Report-To, CF-RAY,
#     alt-svc, cf-cache-status, a Content-Security-Policy, a
#     Permissions-Policy and more -- none of which bears on how the API
#     itself behaves, and an OPTIONS preflight against a real route answers
#     204 with its own CORS headers, also not modelled here.
#   - Only GET, POST, PUT and DELETE were checked. HEAD and OPTIONS were not
#     probed against the POST-only routes below and are not claimed.
#   - Cauldron's own built-in "wrong method" failure renders {detail} as the
#     path its router sees, which has already had the /v2 mount point
#     stripped off -- so the general-purpose version of this finding can
#     only ever render "Cannot PUT /getMonitors", one segment short of the
#     real "Cannot PUT /v2/getMonitors". The PUT case below is declared as
#     its own literal route instead, with the real bytes, for exactly this
#     reason.

recipe: uptimerobot
capability: observability
version: 0.1.0

upstream:
  api: v2
  provider: uptimerobot
  docs: https://uptimerobot.com/api/

auth:
  # The credential is a body parameter on a 200, not a header on a 401 --
  # nothing this scheme was built to check. Both credential failures below
  # are declared as fixed errors on the routes that were checked instead. See
  # the header comment.
  scheme: none

responses:
  error:
    # {"stat": "fail", "error": {"type": ..., "message": ..., ...}}. stat is
    # a Recipe-wide constant because every failure carries it; the rest of
    # each shape is named on the error itself, because parameter_name and
    # passed_value belong to specific failures rather than to every one.
    style: nested
    key: error
    message_field: message
    code_field: "-"
    type_field: type
    fields:
      stat: fail

routes:
  # The custom refusal exists only on the real, POST-only endpoints, and it
  # does not vary between them.
  - method: GET
    path: /getMonitors
    raw:
      content_type: "text/html; charset=utf-8"
      text: "GET is not supported. Use POST instead."

  - method: GET
    path: /getAccountDetails
    raw:
      content_type: "text/html; charset=utf-8"
      text: "GET is not supported. Use POST instead."

  # A raw body with no api_key mentioned anywhere -- no query string, no
  # form field, no JSON key -- falls to this route.
  - method: POST
    path: /getMonitors
    error: missing_api_key

  # A request that mentions api_key at all, in either encoding, whatever
  # value it carries: there is no key this Recipe holds that could make it
  # real, so this is the only answer a submitted key can get.
  - method: POST
    path: /getMonitors
    selects_body: api_key
    error: invalid_api_key

  # One specific unrecognised path, pinned exactly rather than generalised:
  # Cauldron's own catch-all for an unmatched path cannot state the method
  # inside the message the way this framework's default page does, so the
  # literal bytes for one verified request are declared here instead.
  - method: POST
    path: /nonexistentMethod
    status: 404
    raw:
      content_type: "text/html; charset=utf-8"
      text: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <title>Error</title>
        </head>
        <body>
        <pre>Cannot POST /v2/nonexistentMethod</pre>
        </body>
        </html>

  # A wrong method on a real, known path, pinned exactly for the one method
  # this Recipe checked it with. See the note on method_not_allowed below for
  # why this is declared literally rather than left to that override.
  - method: PUT
    path: /getMonitors
    status: 404
    raw:
      content_type: "text/html; charset=utf-8"
      text: |
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <title>Error</title>
        </head>
        <body>
        <pre>Cannot PUT /v2/getMonitors</pre>
        </body>
        </html>

errors:
  missing_api_key:
    status: 200
    type: missing_parameter
    message: "api_key parameter is missing."
    fields:
      error.parameter_name: api_key

  invalid_api_key:
    status: 200
    type: invalid_parameter
    message: "api_key not found."
    fields:
      error.parameter_name: api_key
      # Echoed back verbatim. Real value, submitted and refused -- not a
      # real credential, which this Recipe never held one of.
      error.passed_value: "u000000-0000000000000000000000"

  # Overrides the runtime's own 405 for a real path asked with a method
  # neither route above declares, for any method this Recipe was not checked
  # against. {detail} carries "METHOD /path" as Cauldron's router sees the
  # path -- with the /v2 mount point already stripped -- so this renders
  # "Cannot PUT /getMonitors" rather than the real "Cannot PUT
  # /v2/getMonitors": the status, Content-Type and template are all faithful,
  # and the path inside the sentence is one segment short. PUT is declared
  # as its own literal route above with the exact bytes for that reason;
  # this override is what a method neither that route nor the two POST
  # routes name would fall to.
  method_not_allowed:
    status: 404
    style: text
    message: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <title>Error</title>
      </head>
      <body>
      <pre>Cannot {detail}</pre>
      </body>
      </html>
    headers:
      Content-Type: "text/html; charset=utf-8"

fixtures:
  empty: {}

conformance:
  - name: GET on a real endpoint is a 200, not an error, and is not JSON
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: GET
      path: /getMonitors
    expect:
      status: 200
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: '^GET is not supported\. Use POST instead\.$'

  - name: the same sentence, byte for byte, on a different endpoint
    source: https://api.uptimerobot.com/v2/getAccountDetails
    verified: "2026-08-31"
    request:
      method: GET
      path: /getAccountDetails
    expect:
      status: 200
      body_matches: '^GET is not supported\. Use POST instead\.$'

  - name: no api_key anywhere in the request is a 200 that fails
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: POST
      path: /getMonitors
    expect:
      status: 200
      body:
        stat: fail
        error.type: missing_parameter
        error.parameter_name: api_key
        error.message: "api_key parameter is missing."

  - name: a JSON body is accepted exactly as readily as form encoding
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: POST
      path: /getMonitors
      json:
        format: json
    expect:
      status: 200
      body:
        stat: fail
        error.type: missing_parameter

  - name: a key-shaped value that is not a real key is refused and echoed back
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: POST
      path: /getMonitors
      form:
        api_key: "u000000-0000000000000000000000"
        format: json
    expect:
      status: 200
      body:
        stat: fail
        error.type: invalid_parameter
        error.parameter_name: api_key
        error.passed_value: "u000000-0000000000000000000000"
        error.message: "api_key not found."

  - name: the same refusal, sent as a JSON body rather than form encoding
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: POST
      path: /getMonitors
      json:
        api_key: "u000000-0000000000000000000000"
        format: json
    expect:
      status: 200
      body:
        stat: fail
        error.type: invalid_parameter
        error.parameter_name: api_key
        error.passed_value: "u000000-0000000000000000000000"

  - name: a path nobody registered answers the framework's own page, not the API's
    source: https://api.uptimerobot.com/v2/nonexistentMethod
    verified: "2026-08-31"
    request:
      method: POST
      path: /nonexistentMethod
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: 'Cannot POST /v2/nonexistentMethod'

  - name: a real path with the wrong method is the same framework page, not a JSON error
    source: https://api.uptimerobot.com/v2/getMonitors
    verified: "2026-08-31"
    request:
      method: PUT
      path: /getMonitors
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: 'Cannot PUT /v2/getMonitors'
