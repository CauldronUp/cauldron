# Courier Recipe for Cauldron
#
# Courier is the notification provider where you do not choose the channel.
#
# You send a message. Courier looks at the recipient's preferences, the
# channels they have credentials for, and the routing rules configured in a
# dashboard, and picks one at delivery time. So the answer to "did the email
# go out" is not knowable from the request, and often not from the response
# either: the send is accepted, a request id comes back, and which channel
# was chosen appears in a separate lookup a moment later.
#
# That is the point of the product and it is also why testing it is awkward.
# A test that asserts an email went out is asserting something Courier did not
# promise, and a test that asserts nothing is not a test.
#
# Four more worth modelling exactly:
#
#   1. A send answers 202 with a requestId, and the requestId is not a
#      message id. One request can become several messages, and the message
#      ids only exist after routing has happened, so a client that stores the
#      requestId expecting to look up a message has stored the wrong handle.
#   2. Routing that finds no channel is not an error. The message reaches
#      status UNDELIVERABLE with a reason, quietly, having answered 202 like
#      every other send.
#   3. A message's status and its channel are separate lookups. The status
#      endpoint says whether it went; the history endpoint says how, and the
#      how is a list because a routing rule can try one channel and fall back
#      to another.
#   4. SIMULATED is a real status. Courier can be told to route without
#      sending, which is the only honest way to test routing, and a client
#      that treats anything not FAILED as delivered counts simulations as
#      deliveries.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No routing is performed. Which channel a message went out on is what a
#     fixture says, which is the honest half of the trap: the point is that
#     the answer comes from a lookup rather than from the send.
#   - Nothing is delivered and no status moves.
#   - Lists, audiences, automations and the preferences API are not modelled.
#
# Keys below are fixtures, not secrets.

recipe: courier
capability: push
version: 0.1.0

upstream:
  api: v1
  docs: https://www.courier.com/docs/reference/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - pk_prod_cauldron000000000000000000000

responses:
  list:
    style: wrapped
    cursor_field: paging.cursor
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: type
    type_field: "-"

resources:
  # What a send answers with, and the whole of it. Not a message id: one
  # request can become several messages, and their ids only exist after
  # routing has happened.
  send_receipt:
    collection: results
    id:
      style: opaque
      length: 26
      field: requestId

  message:
    collection: results
    id:
      style: opaque
      length: 26
    fields:
      # ENQUEUED, SENT, DELIVERED, OPENED, CLICKED, UNDELIVERABLE, UNMAPPED,
      # SIMULATED. Only two of those mean somebody received something, and
      # one of them means nothing was sent on purpose.
      status:
        type: string
        default: ENQUEUED
      # The channel Courier picked, which is not one you asked for. Absent
      # until routing has run, so the answer to "did the email go out" does
      # not exist at send time.
      providers:
        type: list
      recipient:
        type: string
      # Your own reference for the send, which is the only thing tying a
      # message back to the request that produced it.
      # Whether Courier sends this as null or omits it when no reference was
      # supplied is not something the documentation settles, and every
      # message here has one, so the Recipe declares the field and claims
      # nothing about its absence.
      clientKey:
        type: string
      # Why nothing was sent. Present only on UNDELIVERABLE and UNMAPPED,
      # and the two mean different things: nothing could be routed, versus
      # the notification template does not exist.
      reason:
        type: string
      error:
        type: string
      enqueued:
        type: timestamp_ms
      # Absent until they happen, rather than present and null. A message
      # carries the timestamps it has reached and no others, so a client
      # testing for null never finds one and has to test for the key.
      sent:
        type: timestamp_ms
        stamped: false
      delivered:
        type: timestamp_ms
        stamped: false

routes:
  # 202 and a request id. No message, no channel, no delivery.
  - method: POST
    path: /send
    resource: send_receipt
    operation: create
    status: 202
    returns:
      - id

  - method: GET
    path: /messages
    resource: message
    operation: list
    pagination:
      style: cursor
      limit: 25
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /messages/{id}
    resource: message
    operation: get

errors:
  rate_limit:
    status: 429
    code: rate_limit_exceeded
    message: "Too many requests"

  # Verified live against api.courier.com, with no Authorization header at
  # all and with a made-up Bearer token: byte-identical either way, and
  # wrong in two ways this file had before that was checked. The HTTP
  # status is 403, not 401 -- and the body carries its own "status" field
  # reading 401 anyway, so the two disagree with each other on the wire.
  # There is no "type" field at all; "error" and "message" are separate
  # sentences, and neither said "API key".
  authentication_error:
    status: 403
    # No "type" on the wire at all -- unlike this file's own default before
    # this was checked, which otherwise renders the engine's generic
    # "authentication_required" as if Courier had sent it.
    code_field: "-"
    message: "Invalid or missing authentication credentials"
    fields:
      error: "Authentication failed"
      # The contradiction itself: this is what the body says, and it is
      # not the HTTP status line above it.
      status: 401

  resource_missing:
    status: 404
    code: not_found
    message: "Message not found"

  parameter_missing:
    status: 400
    code: invalid_request_error
    message: "The request body is invalid"

  # The notification template named in the send does not exist in this
  # workspace. Not a 404 on the send: the send is accepted and the message
  # lands at UNMAPPED, so the failure is discovered by looking rather than by
  # being told.
  notification_not_found:
    status: 400
    code: invalid_request_error
    message: "Notification not found"

fixtures:
  empty: {}

  small-workspace:
    send_receipt: []

    message:
      # Delivered by email, which is not a channel anybody asked for: Courier
      # picked it from the recipient's preferences and the routing rules.
      - id: 1-6710a2f4-0c8b4d19a3e57f206c8b41d9
        status: DELIVERED
        recipient: usr_104
        clientKey: order-4471
        providers:
          - channel: email
            status: SENT
            provider: sendgrid
        enqueued: 1786893242000
        sent: 1786893244000
        delivered: 1786893251000

      # Routing tried push, failed, and fell back to email. The list is the
      # only place that shows, and a client that reads providers[0] reads the
      # attempt rather than the delivery.
      - id: 1-6710a2f4-9d3c8e15b74a0f26d1e93b7
        status: DELIVERED
        recipient: usr_104
        clientKey: order-4472
        providers:
          - channel: push
            status: ERROR
            provider: firebase-fcm
            error: "No device tokens registered"
          - channel: email
            status: SENT
            provider: sendgrid
        enqueued: 1786896800000
        sent: 1786896803000
        delivered: 1786896809000

      # Nothing could be routed. The send answered 202 like every other, the
      # message exists, and this is where the failure lives.
      - id: 1-6710a2f4-4b2f7a08c95d1e63a087f4c2
        status: UNDELIVERABLE
        recipient: usr_207
        clientKey: order-4473
        providers: []
        reason: NO_CHANNELS
        error: "Recipient has no configured channels"
        enqueued: 1786897000000

      # Routed and deliberately not sent. A client that treats anything not
      # FAILED as delivered counts this as a delivery.
      - id: 1-6710a2f4-7e05c3b19f42a86d0c73b5e1
        status: SIMULATED
        recipient: usr_104
        clientKey: order-4474
        providers:
          - channel: email
            status: SIMULATED
            provider: sendgrid
        enqueued: 1786897400000

# Every case below is derived from Courier's published documentation. None has
# been run against a real workspace. The verify report says so.
conformance:
  - name: the HTTP status and the body's own status field disagree
    # Verified live: this is the finding, not a simplification of it. The
    # wire status is 403; the body says {"status":401} about itself, and a
    # client that reads the body's own field rather than the response line
    # gets a different answer than the one it was actually given.
    source: https://www.courier.com/docs/reference/
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-cauldron-0000000000000000
    expect:
      status: 403
      body:
        error: "Authentication failed"
        message: "Invalid or missing authentication credentials"
        status: 401
      absent:
        - type

  - name: a send answers with a request id and nothing else
    # Not a message id: one request can become several messages, and their
    # ids only exist after routing has happened. A client that stores this
    # expecting to look up a message has stored the wrong handle.
    source: https://www.courier.com/docs/reference/send/message/
    fixture: small-workspace
    request:
      method: POST
      path: /send
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
      json:
        message:
          to:
            user_id: usr_104
          template: order-shipped
    expect:
      status: 202
      matches:
        requestId: '^[A-Za-z0-9]{26}$'
      absent:
        - messageId
        - id
        - status
        - channel

  - name: the channel is not in the request and not in the response
    # Courier picks it from the recipient's preferences and the routing
    # rules, at delivery time. The answer to "did the email go out" does not
    # exist yet.
    source: https://www.courier.com/docs/reference/send/message/
    fixture: small-workspace
    request:
      method: POST
      path: /send
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
      json:
        message:
          to:
            user_id: usr_104
          template: order-shipped
    expect:
      status: 202
      absent:
        - providers
        - to
        - template

  - name: which channel it went out on is a separate lookup
    # Email, chosen rather than asked for, and this is the first place it
    # appears.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-0c8b4d19a3e57f206c8b41d9
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        status: DELIVERED
        providers[0].channel: email
        providers[0].provider: sendgrid

  - name: a fallback leaves both attempts in the list
    # Push failed and email went. A client that reads providers[0] reads the
    # attempt rather than the delivery, and reports a failure that was
    # recovered from.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-9d3c8e15b74a0f26d1e93b7
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        status: DELIVERED
        providers[0].channel: push
        providers[0].status: ERROR
        providers[1].channel: email
        providers[1].status: SENT

  - name: routing that finds no channel is not an error
    # The send answered 202 like every other one. The message exists, its
    # status is UNDELIVERABLE, and this is where the failure lives.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-4b2f7a08c95d1e63a087f4c2
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        status: UNDELIVERABLE
        reason: NO_CHANNELS
        error: "Recipient has no configured channels"
      absent:
        - providers[0]
        - sent
        - delivered

  - name: SIMULATED is a real status
    # Routed and deliberately not sent, which is the only honest way to test
    # routing. A client that treats anything not FAILED as delivered counts
    # this as a delivery.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-7e05c3b19f42a86d0c73b5e1
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        status: SIMULATED
        providers[0].status: SIMULATED
      absent:
        - delivered

  - name: a message carries only the timestamps it has reached
    # Absent rather than null, so a client testing for null never finds one
    # and has to test for the key instead.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-7e05c3b19f42a86d0c73b5e1
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        enqueued: 1786897400000
      absent:
        - sent
        - delivered

  - name: timestamps are milliseconds
    # A client that treats them as seconds lands in 1970, and one that
    # divides by a thousand loses the milliseconds that distinguish two
    # messages sent in the same second.
    source: https://www.courier.com/docs/reference/messages/get-message/
    fixture: small-workspace
    request:
      method: GET
      path: /messages/1-6710a2f4-0c8b4d19a3e57f206c8b41d9
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        enqueued: 1786893242000
        sent: 1786893244000
        delivered: 1786893251000

  - name: the only thing tying a message to a send is your own reference
    # clientKey. Courier's requestId does not appear on the message, so a
    # client that did not supply a reference cannot correlate the two at all.
    source: https://www.courier.com/docs/reference/messages/list-messages/
    fixture: small-workspace
    request:
      method: GET
      path: /messages
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      body:
        results[0].clientKey: order-4471
        results[2].status: UNDELIVERABLE
      absent:
        - results[4]
        - results[0].requestId

  - name: the paging cursor is nested under paging
    source: https://www.courier.com/docs/reference/messages/list-messages/
    fixture: small-workspace
    request:
      method: GET
      path: /messages
      query:
        limit: "2"
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 200
      matches:
        paging.cursor: '.'
      absent:
        - cursor
        - next

  - name: a missing template is rejected at send time, not routed
    # Which is the one failure Courier does tell you about immediately, and
    # it is a 400 rather than a 404 so a client branching on 404 misses it.
    source: https://www.courier.com/docs/reference/
    fixture: small-workspace
    arm: notification_not_found
    request:
      method: GET
      path: /messages
      headers:
        Authorization: Bearer pk_prod_cauldron000000000000000000000
    expect:
      status: 400
      body:
        type: invalid_request_error
        message: "Notification not found"

  - name: an invalid key is refused
    # Corrected against a live check: this had asserted 401 with a "type"
    # field, neither of which api.courier.com sends. The status is 403, and
    # the body carries its own contradicting "status":401 -- see the case
    # above for the full shape.
    source: https://www.courier.com/docs/reference/
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /messages
      headers:
        Authorization: Bearer wrong
    expect:
      status: 403
      body:
        error: "Authentication failed"
        status: 401
      absent:
        - code
        - type
