# Ably Recipe for Cauldron
#
# Ably has no sandbox. An app in the dashboard is a real app, the free tier is
# metered at six million messages a month and two hundred concurrent
# connections, and a test that publishes into a shared development app pushes
# messages at whatever is connected, which is usually somebody's browser.
#
# Struck live anyway, on 2026-09-05, against rest.ably.io with no app at all:
# there is no request an app-less caller can make that Ably answers with
# anything other than a refusal, and that refusal is itself a real, checkable
# claim. Every route this Recipe models answered 401 code 40101 "No
# authentication information provided" for a request carrying no credential,
# which corrected this file: everything below had been modelled as 40100
# "Invalid credentials" for every auth failure, and 40100 turns out to be
# what an unconfirmed doc page says a wrong secret gets for a real app, not
# what was ever observed. A wrong secret for an app id this project invents
# cannot be told apart from no app id at all -- both come back 40101,
# because the invented app id does not exist either way, and it takes a
# real, paid Ably app to see the 40100 case for real. A method Ably does not
# accept on a real path, and a path it has never heard of, both come back
# 404 code 40400 with identical wording -- Ably does not appear to answer
# 405 for anything this Recipe found.
#
# It is the second realtime provider in this collection and it makes the same
# point Pusher does from a different angle: publishing tells you nothing.
# Pusher answers with an empty object. Ably answers with 204 and no body at
# all, so there is not even a shape to inspect. A test against the real service
# can assert that the request was accepted and nothing else, which is exactly
# what a fake can assert.
#
# Four things worth modelling exactly:
#
#   1. Publishing answers 204 with no body. A client calling .json() on the
#      response throws, and there is no message id to correlate anything with
#      afterwards.
#   2. History comes back newest first. The default direction is backwards, so
#      code that iterates the array expecting chronological order replays a
#      conversation in reverse and only notices when somebody reads it.
#   3. A token's capability is a JSON string, not an object. It looks like
#      structured data in the response and is text, so reading
#      token.capability["*"] finds undefined until it is parsed a second time.
#   4. The error carries a five digit code and an HTTP status separately, and
#      they are different numbers. 40400 is not 404, the first three digits
#      are the status and the last two are the reason, and support threads
#      quote the long one.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Cauldron serves no WebSocket and no realtime transport. This Recipe
#     covers the REST surface, which is what a server publishes through.
#   - The history order is what the fixture holds rather than something
#     Cauldron sorts. The claim being made is about the shape of the response,
#     not that the emulator re-orders on request.
#   - Token requests are not signed and issued tokens are not verified. The
#     key is checked; the HMAC in a signed token request is not.
#
# Keys below are fixtures, not secrets.

recipe: ably
capability: push
version: 0.1.0

upstream:
  api: v1
  docs: https://ably.com/docs/api/rest-api

auth:
  # The API key is keyName:keySecret, sent as Basic. The secret half is the
  # half worth checking.
  scheme: basic
  credential: password
  keys:
    - cauldronKeySecret
  # Verified live: an entirely absent Authorization header answers 40101,
  # not the 40100 this file used for every auth failure before that was
  # checked. See the header for what could and could not be confirmed.
  absent_error: no_credential
  # Verified live: routing wins. A path Ably has never heard of and a method
  # it does not accept on a real path both 404 with no credential sent at
  # all, rather than being refused for the missing credential first.
  after_routing: true

responses:
  list:
    style: bare
    # Ably pages by nothing else at all: limit sets the size and the next
    # page is only ever a Link header away.
    link_header: true
  resource:
    style: bare
  # Nested, with a five digit code and the HTTP status beside it as a
  # different number, plus a link to the explanation.
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    status_field: statusCode
    type_field: "-"
    fields:
      error:
        # Ably documents every code at a stable URL, which is genuinely
        # useful and is the thing worth quoting in a bug report.
        href: https://help.ably.io/error/40400

resources:
  message:
    id:
      style: opaque
      length: 22
    fields:
      name:
        type: string
      # The payload. Ably does not parse it: a JSON object published as a
      # string comes back as a string.
      data:
        type: string
      # Milliseconds. Treating it as seconds puts every message in 1970.
      timestamp:
        type: timestamp_ms
      # Who published it, if the publishing key had an identity. Absent
      # otherwise, so a chat that keys on it drops messages from server-side
      # publishers.
      clientId:
        type: string
      connectionId:
        type: string

  channel:
    id:
      style: opaque
      field: channelId
      length: 22
    fields:
      # Present only while the channel is active. A channel nobody is on has
      # no occupancy at all rather than one full of zeroes.
      isActive:
        type: boolean
        in: status
        as: isActive
      # Occupancy sits inside status, not beside it: Ably answers
      # {channelId, isGlobalMaster, region, status: {isActive, occupancy}}.
      # These were one level too shallow, so a client reading
      # channel.status.occupancy.publishers -- which is where Ably puts it --
      # found nothing, and channel.occupancy.publishers worked only here.
      #
      # There is no connections count either. Ably's occupancy carries
      # publishers, subscribers, presenceConnections, presenceMembers and
      # presenceSubscribers, and a plain connections was invented.
      publishers:
        type: integer
        in: status.occupancy
        as: publishers
      subscribers:
        type: integer
        in: status.occupancy
        as: subscribers
      # Presence is separate from connection. A connection that has not
      # entered presence is connected and invisible to a member list.
      presenceConnections:
        type: integer
        in: status.occupancy
        as: presenceConnections

  token:
    id:
      style: opaque
      field: token
      length: 32
    fields:
      # A JSON string, not an object. Reading token.capability["*"] finds
      # undefined until it is parsed a second time. The default matters: a
      # token requested without an explicit capability still comes back with
      # one, and it is still text.
      capability:
        type: string
        default: '{"*":["*"]}'
      # Milliseconds, like everything else here.
      issued:
        type: timestamp_ms
      expires:
        type: timestamp_ms
      # Present only when the token request asked for one, which is how Ably
      # binds identity: a token with a clientId can act only as that client,
      # and one without can claim any identity the capability allows. No
      # default, so a token nobody named a client for does not carry the key.
      #
      # Ably's own OpenAPI declares TokenDetails as capability, expires,
      # issued, keyName and token, with no clientId among them, so check
      # reports this field every time. The description is the thing that is
      # incomplete -- clientId is in Ably's TokenDetails documentation and is
      # the whole of its identity model -- and this note is here so that the
      # obvious way to silence the report is not to delete the field.
      clientId:
        type: string

routes:
  # 204 and no body. Not an id, not a count, not an empty object.
  - method: POST
    path: /channels/{channel}/messages
    resource: message
    operation: create
    status: 204
    empty_body: true

  - method: GET
    path: /channels/{channel}/messages
    resource: message
    operation: list
    pagination:
      # Checked against Ably's own REST API documentation. limit is the page
      # size, and the next page is not a parameter at all: Ably returns RFC
      # 5988 Link headers, one per relative link, and a client follows the one
      # with rel="next". This Recipe's list envelope declares link_header, so
      # that header is sent.
      #
      # The gap this used to state -- "Cauldron does not send Link headers" --
      # was true when it was written and is not now, which is the trouble with
      # a limitation recorded in prose: the engine moved and the sentence
      # stayed. Link was modelled for GitHub, and Ably's envelope was given it
      # at the same time while this comment went on saying otherwise.
      #
      # cursor_param names what goes inside that link. Ably's own continuation
      # is opaque and a client follows the URL as given rather than building
      # one, so the word here is this fake's own rather than a claim about
      # Ably -- and naming it is what stops the runtime supplying the same word
      # silently.
      limit: 100
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /channels/{id}
    resource: channel
    operation: get

  - method: POST
    path: /keys/{keyName}/requestToken
    resource: token
    operation: create

webhooks:
  events:
    - channel.opened
    - channel.closed
    - presence.enter
    - presence.leave
    - message
  signing:
    scheme: hmac-sha256
    header: X-Ably-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: "42910"
    message: Request rate exceeded

  # Not checked live: a real Ably app would be needed to see a wrong secret
  # refused for a key that otherwise exists, and this project has none. The
  # header says so. What was checked is no_credential, below.
  authentication_error:
    status: 401
    code: "40100"
    message: "Invalid credentials"

  # Verified live, GET https://rest.ably.io/channels/chat:general with no
  # Authorization header at all: 401, this code, this message. Every route
  # this Recipe models answered the same code and status when struck with no
  # credential; the message text itself was seen to vary by route family
  # (message and history routes say "unable to handle request; no
  # application id found in request" instead) and this Recipe standardises
  # on the channel wording rather than modelling both.
  no_credential:
    status: 401
    code: "40101"
    message: "No authentication information provided. (See https://help.ably.io/error/40101 for help.)"
    fields:
      # Overridden: the Recipe-wide default below is fixed to 40400's own
      # page for every error, which is wrong for anything else and stayed
      # unnoticed because nothing had checked a different code live before
      # now. This one code is worth getting right since this is the case
      # that is actually verified.
      error:
        href: https://help.ably.io/error/40101

  # Verified live: a path this API has never heard of.
  unknown_route:
    status: 404
    code: "40400"
    message: "Could not find path: {detail}."

  # Verified live: a real path struck with a method it does not accept
  # answers exactly the unknown-route response above, not a 405 -- Ably does
  # not appear to distinguish the two at all. detail here is METHOD+path by
  # this project's own convention; Ably's own wording carries only the path,
  # so the rendered message will not match Ably's byte for byte on this one
  # case, which is why the conformance case below checks the code and status
  # rather than pinning the exact string.
  method_not_allowed:
    status: 404
    code: "40400"
    message: "Could not find path: {detail}."

  resource_missing:
    status: 404
    code: "40400"
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    code: "40000"
    message: "Invalid request: {detail} is required"

  # The key exists and does not permit this channel. Ably encodes capability
  # per key, so a key that works everywhere in development fails on one
  # channel in production.
  capability_denied:
    status: 401
    code: "40160"
    message: "Given credentials do not grant the required access rights"

  # The account is over its connection limit. Existing connections stay up
  # and new ones are refused, so the application looks healthy to whoever is
  # already connected.
  connection_limit:
    status: 429
    code: "42901"
    message: Maximum number of concurrent connections exceeded

  # A token that has expired. The client is expected to renew it before this
  # happens, and an integration without renewal works for exactly one hour.
  token_expired:
    status: 401
    code: "40142"
    message: "Token expired"

fixtures:
  empty: {}

  small-app:
    channel:
      - id: chat:general
        isActive: true
        publishers: 2
        subscribers: 4
        # Two of the four connections have not entered presence. They are
        # connected and invisible to a member list.
        presenceConnections: 2

    message:
      # Newest first. The default direction is backwards, so this is the
      # order a client actually receives, and iterating it as chronological
      # replays the conversation in reverse.
      - id: cauldronMessage000003
        name: message
        data: '{"text":"and finally this one"}'
        timestamp: 1767225800000
        clientId: ada
        connectionId: cauldronConn000001
      - id: cauldronMessage000002
        name: message
        data: '{"text":"then this"}'
        timestamp: 1767225700000
        clientId: grace
        connectionId: cauldronConn000002
      - id: cauldronMessage000001
        name: message
        data: '{"text":"this happened first"}'
        timestamp: 1767225600000
        # No clientId. Published from a server with a key that carries no
        # identity, so a chat keying on it drops this message entirely.
        connectionId: cauldronConn000003

    token:
      - id: cauldronToken00000000000000000001
        # A JSON string, not an object. It looks like structured data and is
        # text, so reading capability["*"] finds undefined.
        capability: '{"chat:*":["publish","subscribe"]}'
        issued: 1767225600000
        expires: 1767229200000
        clientId: ada

# Conformance cases, read from Ably's REST API reference rather than observed
# against a live app. The verify report says so.
conformance:
  - name: publishing answers 204 with no body at all
    source: https://ably.com/docs/api/rest-api#publish
    fixture: small-app
    request:
      method: POST
      path: /channels/chat%3Ageneral/messages
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
      json:
        name: message
        data: '{"text":"hello"}'
    expect:
      # Not an empty object like Pusher: nothing at all. A client calling
      # .json() on this throws, and there is no id to correlate with.
      status: 204
      no_body: true

  - name: history comes back newest first
    source: https://ably.com/docs/api/rest-api#message-history
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral/messages
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
    expect:
      status: 200
      body:
        # The default direction is backwards. Iterating this as chronological
        # replays the conversation in reverse, and nothing about the array
        # says so.
        '[0]':
          timestamp: 1767225800000
        '[2]':
          timestamp: 1767225600000

  - name: a server published message has no clientId
    source: https://ably.com/docs/api/rest-api#message-history
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral/messages
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
    expect:
      status: 200
      body:
        '[0]':
          clientId: ada
      # Published with a key that carries no identity. A chat keying on
      # clientId drops this message entirely rather than showing it as
      # anonymous.
      absent:
        - '[2].clientId'

  - name: a timestamp is milliseconds
    source: https://ably.com/docs/api/rest-api#message-history
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral/messages
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
    expect:
      status: 200
      body:
        # Thirteen digits. Treating it as seconds puts every message in 1970,
        # and dividing by a thousand without rounding loses the ordering
        # within a second.
        '[1]':
          timestamp: 1767225700000

  - name: presence is separate from connection
    source: https://ably.com/docs/api/rest-api#channel-status
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
    expect:
      status: 200
      body:
        # Under status, which is where Ably puts it. This asserted a
        # top-level occupancy and passed, because the Recipe emitted one --
        # and a client reading channel.status.occupancy, which is the real
        # shape, found nothing.
        #
        # The count is subscribers rather than connections: Ably's occupancy
        # has publishers, subscribers, presenceConnections, presenceMembers
        # and presenceSubscribers, and no plain connections at all.
        status.occupancy.subscribers: 4
        # Two of the four have not entered presence. They are connected and
        # invisible to a member list, so the two numbers disagree by however
        # many are lurking.
        status.occupancy.presenceConnections: 2
        status.occupancy.publishers: 2
        status.isActive: true
      absent:
        - occupancy

  - name: a capability is a JSON string rather than an object
    source: https://ably.com/docs/api/rest-api#request-token
    fixture: small-app
    request:
      method: POST
      path: /keys/cauldronApp.key/requestToken
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
      json:
        ttl: 3600000
    expect:
      status: 200
      body:
        # Text that looks like structured data. Reading capability["*"] finds
        # undefined until it is parsed a second time.
        #
        # The request deliberately does not send a capability, so this value
        # is the emulator's rather than an echo of the case's own input.
        capability: '{"*":["*"]}'

  - name: a token carries a clientId only when one was asked for
    # Ably's identity model in one field. A token issued with a clientId can
    # act only as that client; one issued without can assume any identity its
    # capability permits. The difference is the presence of the key, not a
    # null and not an empty string.
    #
    # An emulator that always sends it teaches code to trust an identity that
    # may not be there, and one that never sends it hides the binding
    # entirely. Neither shows up as an error.
    source: https://ably.com/docs/api/rest-api#request-token
    fixture: small-app
    request:
      method: POST
      path: /keys/cauldronApp.key/requestToken
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
      json:
        ttl: 3600000
        clientId: bridge-crew
    expect:
      status: 200
      body:
        clientId: bridge-crew
        # Not sent by the request, so this is the emulator's answer rather
        # than an echo: a token asked for without a capability still comes
        # back with one.
        capability: '{"*":["*"]}'

  - name: and a token nobody named a client for does not carry the key
    # The other half, and the one that matters. Absence, not null and not an
    # empty string, so code testing whether the key exists gets the right
    # answer and code comparing it to "" does not.
    #
    # A fake that always sends clientId teaches an application to trust an
    # identity that may not be there. This is the case that stops one being
    # written by accident.
    source: https://ably.com/docs/api/rest-api#request-token
    fixture: small-app
    request:
      method: POST
      path: /keys/cauldronApp.key/requestToken
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
      json:
        ttl: 3600000
    expect:
      status: 200
      absent:
        - clientId

  - name: the error code is not the HTTP status
    source: https://ably.com/docs/api/rest-api#common
    fixture: small-app
    request:
      method: GET
      path: /channels/doesnotexist
      headers:
        Authorization: Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0
    expect:
      status: 404
      body:
        error:
          # Five digits, a number, and a different number from the status
          # beside it.
          # The first three are the status and the last two are the reason,
          # and the long one is what support threads quote.
          code: 40400
          statusCode: 404
          href: https://help.ably.io/error/40400
      absent:
        - error.type
        - code
        - message
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        error.message: '.'

  - name: the key secret is the half that is checked
    # Not checked live -- see the header. Any app id this project invents is
    # itself unrecognised by Ably's real servers, so a wrong secret for a
    # made-up app id and a made-up app id alone answer identically (see the
    # verified no_credential case below); telling "wrong secret" apart from
    # "no such app" needs a real, paid Ably app this project does not have.
    source: https://ably.com/docs/api/rest-api#authentication
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral
      headers:
        # The right key name, and a wrong secret.
        Authorization: Basic Y2F1bGRyb25BcHAua2V5Ondyb25n
    expect:
      status: 401
      body:
        error:
          code: 40100
          statusCode: 401

  - name: struck live with no credential at all, every route answers 40101
    source: https://rest.ably.io/channels/chat%3Ageneral
    verified: "2026-09-05"
    fixture: small-app
    request:
      method: GET
      path: /channels/chat%3Ageneral
    expect:
      status: 401
      body:
        error:
          code: 40101
          statusCode: 401
          href: https://help.ably.io/error/40101
      matches:
        error.message: "No authentication information provided"

  - name: and a path Ably has never heard of is the same code family, 404 not 401
    source: https://rest.ably.io/this-is-not-a-route
    verified: "2026-09-05"
    fixture: small-app
    request:
      method: GET
      path: /this-is-not-a-route
    expect:
      status: 404
      body:
        error:
          code: 40400
      matches:
        error.message: "Could not find path"

  - name: a real path with a method Ably refuses looks exactly like an unknown route
    # Struck live with DELETE on a real, existing channel path: 404, not 405,
    # with the identical "could not find path" wording an entirely wrong path
    # gets. Ably does not appear to answer 405 for anything this Recipe found.
    source: https://rest.ably.io/channels/chat%3Ageneral
    verified: "2026-09-05"
    fixture: small-app
    request:
      method: DELETE
      path: /channels/chat%3Ageneral
    expect:
      status: 404
      body:
        error:
          code: 40400
      matches:
        error.message: "Could not find path"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=cauldronMessage000003, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads"
    source: "https://ably.com/docs/api/rest-api#message-history"
    fixture: small-app
    request:
      method: GET
      path: "/channels/chat%3Ageneral/messages"
      query:
        "limit": "1"
        "cursor": "cauldronMessage000003"
      headers:
        "Authorization": "Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0"
    expect:
      status: 200
      body:
        "[0].id": "cauldronMessage000002"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=cauldronMessage000003, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads on channels {channel} messages"
    source: "https://ably.com/docs/api/rest-api#message-history"
    fixture: small-app
    request:
      method: GET
      path: "/channels/chat%3Ageneral/messages"
      query:
        "limit": "1"
        "cursor": "cauldronMessage000003"
      headers:
        "Authorization": "Basic Y2F1bGRyb25BcHAua2V5OmNhdWxkcm9uS2V5U2VjcmV0"
    expect:
      status: 200
      body:
        "[0].id": "cauldronMessage000002"
      absent:
        - "[1]"

  # The names. This Recipe declares 4 field(s) on a message that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a message carries the field names this Recipe declares"
    source: "https://ably.com/docs/api/rest-api#message-history"
    fixture: small-app
    request:
      method: GET
      path: "/channels/chat:general/messages"
      headers:
