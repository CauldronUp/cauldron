# Zoom Recipe for Cauldron
#
# Zoom has no sandbox. A Server-to-Server OAuth app reaches a real account, and
# a test that schedules a meeting puts it on somebody's calendar, may email the
# invitees, and counts against the account. Deleting it emails them again. The
# free tier also rate limits hard enough that a CI suite creating a meeting per
# run starts failing on request budget rather than on code.
#
# Two things worth modelling exactly:
#
#   1. The meeting identifier is a number and the meeting UUID is not the same
#      thing. Reports and recordings are keyed by UUID, meetings by id, and the
#      id is large enough that parsing it as a JavaScript number is unsafe.
#      Code that uses one where the other is expected gets a 404 that looks
#      like a missing meeting.
#   2. Meeting type is an integer enum, and a recurring meeting with no fixed
#      time behaves nothing like a scheduled one. Code that reads start_time
#      unconditionally finds nothing on type 3.
#
# The credential shape needed no account, and struck live against
# api.zoom.us on 2026-09-05: this file's authentication_error was already
# right, for both an absent credential and a present, garbage one, which
# had never been checked. A path nothing declares answers a different
# code and sentence again, resolved before any credential is judged.
#
# Tokens below are fixtures, not secrets.

recipe: zoom
capability: voice
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.zoom.us/docs/api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_zoom_token
  # Verified live against api.zoom.us 2026-09-05: a path nothing declares
  # is a 404 with no credential sent at all. Routing wins.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: total_records
    cursor_field: next_page_token
    # Echoed rather than fixed. It was the constant 30, so a client asking
    # for five meetings was handed five and told the page held thirty.
    limit_field: page_size
    # Computed, not fixed. It was the constant 1, so a client looping while
    # page <= page_count never asked for a second page.
    pages_field: page_count
  error:
    style: flat
    code_field: code
    message_field: message

resources:
  meeting:
    collection: meetings
    id:
      # Zoom meeting ids are long numbers that travel as numbers in the JSON
      # but exceed what a JavaScript number holds safely.
      style: digits
      length: 11
    fields:
      uuid:
        type: string
      host_id:
        type: string
      topic:
        type: string
        required: true
      # An integer enum: 1 instant, 2 scheduled, 3 recurring with no fixed
      # time, 8 recurring with a fixed time. A type 3 meeting has no
      # start_time at all.
      type:
        type: integer
        default: 2
      status:
        type: string
        default: waiting
      start_time:
        type: datetime
        stamped: false
      duration:
        type: integer
        default: 60
      timezone:
        type: string
        default: Europe/London
      join_url:
        type: string
      created_at:
        type: datetime

  user:
    collection: users
    id:
      style: opaque
      length: 22
    fields:
      email:
        type: string
        required: true
      first_name:
        type: string
      last_name:
        type: string
      # An integer enum again: 1 basic, 2 licensed. A basic user cannot host
      # a meeting longer than forty minutes, and the API will not say so
      # until the meeting ends.
      type:
        type: integer
        default: 1
      # A pending user has been invited and has not accepted, and cannot host
      # anything yet.
      status:
        type: string
        default: pending
      created_at:
        type: datetime

  recording:
    collection: meetings
    id:
      style: digits
      length: 11
    fields:
      host_id:
        type: string
      uuid:
        type: string
      topic:
        type: string
      # Recordings are keyed by the meeting UUID, not the meeting id, which
      # is the mismatch that produces a 404 that looks like a missing
      # meeting.
      recording_count:
        type: integer
        default: 1
      total_size:
        type: integer
        default: 0
      share_url:
        type: string
      start_time:
        type: datetime

routes:
  - method: GET
    path: /v2/users/{host_id}/meetings
    resource: meeting
    operation: list
    scope: [host_id]
    pagination:
      style: cursor
      limit: 30
      # page_size, not limit. Zoom ignores limit, so this listing was paged
      # by a word it does not take -- and the size it echoes made that
      # invisible, because the echo was a constant thirty.
      limit_param: page_size
      cursor_param: next_page_token

  - method: POST
    path: /v2/users/{host_id}/meetings
    resource: meeting
    operation: create
    scope: [host_id]
    status: 201

  - method: GET
    path: /v2/meetings/{id}
    resource: meeting
    operation: get

  - method: PATCH
    path: /v2/meetings/{id}
    resource: meeting
    operation: update

  - method: DELETE
    path: /v2/meetings/{id}
    resource: meeting
    operation: delete

  - method: GET
    path: /v2/users
    resource: user
    operation: list
    pagination:
      style: cursor
      limit: 30
      # page_size, not limit. Zoom ignores limit, so this listing was paged
      # by a word it does not take -- and the size it echoes made that
      # invisible, because the echo was a constant thirty.
      limit_param: page_size
      cursor_param: next_page_token

  - method: GET
    path: /v2/users/{id}
    resource: user
    operation: get

  - method: GET
    path: /v2/users/{host_id}/recordings
    resource: recording
    operation: list
    scope: [host_id]
    pagination:
      style: cursor
      limit: 30
      # page_size, not limit. Zoom ignores limit, so this listing was paged
      # by a word it does not take -- and the size it echoes made that
      # invisible, because the echo was a constant thirty.
      limit_param: page_size
      cursor_param: next_page_token

webhooks:
  events:
    - meeting.created
    - meeting.started
    - meeting.ended
    - meeting.participant_joined
    - meeting.participant_left
    - recording.completed
  # Zoom nests twice. The meeting is at payload.object, not at the top and not
  # at data.object, and event_ts is milliseconds rather than the seconds every
  # other timestamp in this Recipe uses -- reading it as seconds puts the
  # event in the year 55000.
  payload:
    event: "{event}"
    event_ts: "{created_ms}"
    payload:
      account_id: cauldronAccount01
      object:
        "{object}": true
  signing:
    scheme: hmac-sha256
    header: x-zm-signature
    secret: cauldron-webhook-secret
    # The same shape as Slack's, and deliberately so: v0= and hex, over
    # "v0:<timestamp>:<body>", with the timestamp beside it.
    encoding: hex
    over: "v0:{timestamp}:{body}"
    value: "v0={digest}"
    timestamp_header: x-zm-request-timestamp

errors:
  rate_limit:
    status: 429
    code: "429"
    message: You have exceeded the daily rate limit of API requests
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  # Verified live 2026-09-05: no credential at all and a present, wrong
  # bearer token are byte-identical -- this file already had the right
  # code and sentence for both, just never checked.
  authentication_error:
    status: 401
    code: "124"
    message: Invalid access token.

  # Verified the same day: a path nothing declares. A different code and
  # sentence from the credential failure above.
  unknown_route:
    status: 404
    code: "2300"
    message: This API endpoint is not recognized.

  resource_missing:
    status: 404
    code: "3001"
    message: "Meeting does not exist: {detail}"

  parameter_missing:
    status: 400
    code: "300"
    message: "Validation failed: {detail} is required"

  # Zoom refuses to schedule for a user who has not accepted their invitation,
  # which is the state a freshly provisioned account is in and a test account
  # never is.
  user_not_active:
    status: 400
    code: "1001"
    message: User does not exist or does not belong to this account.

  # A basic licence cannot host a long meeting, and the refusal arrives at
  # schedule time rather than at the forty minute mark.
  meeting_capacity:
    status: 400
    code: "3000"
    message: Cannot schedule a meeting of that duration on a basic plan.

  # The scope wall. A Server-to-Server app missing a scope fails in a way that
  # names the scope, which is unusually helpful and worth reproducing.
  invalid_scope:
    status: 400
    code: "4711"
    message: "Invalid access token, does not contain scopes: meeting:write:admin"

fixtures:
  empty: {}

  small-account:
    user:
      - id: cauldronHost0000000001
        email: ada@example.com
        first_name: Ada
        last_name: Lovelace
        # Licensed, so can host long meetings.
        type: 2
        status: active
      - id: cauldronHost0000000002
        email: grace@example.com
        first_name: Grace
        # Basic, and still pending. Cannot host anything yet.
        type: 1
        status: pending
    meeting:
      - id: "82345678901"
        uuid: aBcDeFgHiJkLmNoPqRsTuQ==
        host_id: cauldronHost0000000001
        topic: Weekly planning
        type: 2
        status: waiting
        start_time: "2026-02-01T10:00:00Z"
        duration: 30
        join_url: https://zoom.us/j/82345678901
      - id: "82345678902"
        uuid: bBcDeFgHiJkLmNoPqRsTuQ==
        host_id: cauldronHost0000000001
        topic: Office hours
        # Recurring with no fixed time. There is no start_time at all, and
        # code that reads one unconditionally finds nothing.
        type: 3
        status: waiting
    recording:
      - id: "82345678901"
        uuid: aBcDeFgHiJkLmNoPqRsTuQ==
        host_id: cauldronHost0000000001
        topic: Weekly planning
        recording_count: 2
        total_size: 148000000
        share_url: https://zoom.us/rec/share/cauldron

# Conformance cases, read from Zoom's API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: a recurring meeting with no fixed time has no start_time
    source: https://developers.zoom.us/docs/api/meetings/
    fixture: small-account
    request:
      method: GET
      path: /v2/meetings/82345678902
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        # Type 3 is recurring with no fixed time. Code that reads start_time
        # unconditionally finds nothing here.
        type: 3
        topic: Office hours
      absent:
        - start_time

  - name: a scheduled meeting keeps the time it was given
    source: https://developers.zoom.us/docs/api/meetings/
    fixture: small-account
    request:
      method: GET
      path: /v2/meetings/82345678901
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        type: 2
        start_time: "2026-02-01T10:00:00Z"
        duration: 30

  - name: the meeting id and the meeting uuid are different things
    source: https://developers.zoom.us/docs/api/meetings/
    fixture: small-account
    request:
      method: GET
      path: /v2/meetings/82345678901
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        id: "82345678901"
        uuid: aBcDeFgHiJkLmNoPqRsTuQ==
      matches:
        # Eleven digits. Reports and recordings are keyed by the uuid, and
        # using one where the other is expected gets a 404 that reads like a
        # missing meeting.
        id: '^[1-9][0-9]{10}$'

  - name: a collection reports a total and a page size
    source: https://developers.zoom.us/docs/api/meetings/
    fixture: small-account
    request:
      method: GET
      path: /v2/users/cauldronHost0000000001/meetings
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        total_records: 2
        page_size: 30
        meetings[0].topic: Weekly planning
      absent:
        - data
        - items

  - name: a pending basic user cannot yet host
    source: https://developers.zoom.us/docs/api/users/
    fixture: small-account
    request:
      method: GET
      path: /v2/users/cauldronHost0000000002
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        # Basic licence, invitation not accepted. A freshly provisioned
        # account is in exactly this state and a test account never is.
        type: 1
        status: pending
        email: grace@example.com

  - name: an unknown meeting is a flat error with Zoom's own code
    source: https://developers.zoom.us/docs/api/
    fixture: small-account
    request:
      method: GET
      path: /v2/meetings/99999999999
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 404
      body:
        code: 3001
      matches:
        message: 'Meeting does not exist'
      absent:
        - error
        - errors

  - name: a bad token is refused before any meeting is read
    source: https://api.zoom.us/v2/users
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/users
    expect:
      status: 401
      body:
        code: 124
        message: Invalid access token.

  - name: and a present, garbage bearer token gets the same answer
    source: https://api.zoom.us/v2/users
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/users
      headers:
        Authorization: Bearer garbage_invalid_000
    expect:
      status: 401
      body:
        code: 124
        message: Invalid access token.

  - name: a path nothing declares is a different failure, checked before any credential
    source: https://api.zoom.us/v2/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No credential sent. Routing answers first regardless.
      path: /v2/not-a-real-endpoint
    expect:
      status: 404
      body:
        code: 2300
        message: This API endpoint is not recognized.

  - name: the paging fields are named next_page_token
    source: https://developers.zoom.us/docs/api
    fixture: small-account
    request:
      method: GET
      path: /v2/users/cauldronHost0000000001/meetings
      query:
        # page_size, not limit. Like SES, this is a case that exists to pin
        # the name of a paging field and was itself paging by a name the
        # provider does not take -- and the size it would have echoed back
        # was a constant, so nothing said so.
        page_size: "1"
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        next_page_token: '.'

  - name: deleting a meeting answers with nothing at all
    source: https://developers.zoom.us/docs/api/meetings/#tag/meetings/DELETE/meetings/{meetingId}
    fixture: small-account
    request:
      method: DELETE
      path: /v2/meetings/82345678901
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      # 204 and an empty body, which is what most APIs answer a delete with and
      # what a client calling .json() on the response cannot survive. An
      # emulator that helpfully returned an object would let that code ship.
      status: 204
      no_body: true

  - name: the meeting is two levels down and the timestamp is milliseconds
    source: https://developers.zoom.us/docs/api/webhooks/
    fixture: small-account
    request:
      method: POST
      path: /v2/users/cauldronHost0000000001/meetings
      headers:
        Authorization: Bearer cauldron_zoom_token
      json:
        topic: Incident review
    expect:
      status: 201
      webhook:
        event: meeting.created
        signature_header: x-zm-signature
        signature: '^v0=[0-9a-f]{64}$'
        header_matches:
          x-zm-request-timestamp: '^[0-9]{10}$'
        body:
          payload.object.topic: Incident review
          payload.account_id: cauldronAccount01
        matches:
          # Thirteen digits, not ten. Read as seconds this lands in the year
          # 55000, and every other timestamp this Recipe sends is seconds --
          # so the one that is not has to be pinned.
          event_ts: '^[0-9]{13}$'
        absent:
          # Not at the top, and not where Stripe puts it.
          - topic
          - data
          - data.object

  - name: the page size in the answer is the one that was asked for
    source: https://developers.zoom.us/docs/api/rest/reference/zoom-api/methods/#operation/meetings
    fixture: small-account
    request:
      method: GET
      path: /v2/users/cauldronHost0000000001/meetings
      query:
        page_size: "1"
      headers:
        Authorization: Bearer cauldron_zoom_token
    expect:
      status: 200
      body:
        # Echoed, not fixed. This was the constant thirty, so one meeting
        # came back under a page_size saying thirty -- from the field whose
        # only job is to say how big the page was.
        page_size: 1
        # And two pages of one, computed rather than the constant 1 that
        # stopped a loop after the first.
        page_count: 2
      absent:
        - meetings[1]

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the user listing answers with what the fixture holds"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "users[0].id": "cauldronHost0000000001"
        "users[1].id": "cauldronHost0000000002"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the recording listing answers with what the fixture holds"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/recordings"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "meetings[0].id": "82345678901"
      absent:
        - "meetings[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if page_size was read.
  - name: "page_size is read, and a page of one is not the whole collection"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/meetings"
      query:
        "page_size": "1"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "meetings[0].id": "82345678901"
      absent:
        - "meetings[1]"

  # And the position. next_page_token=82345678901 answers a different
  # record, which the size alone cannot produce.
  - name: "next_page_token moves the page on, and what comes back is not page one"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/meetings"
      query:
        "page_size": "1"
        "next_page_token": "82345678901"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "meetings[0].id": "82345678902"
      absent:
        - "meetings[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if page_size was read.
  - name: "page_size is read on v2 users, and a page of one is not the whole collection"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users"
      query:
        "page_size": "1"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "users[0].id": "cauldronHost0000000001"
      absent:
        - "users[1]"

  # And the position. next_page_token=cauldronHost0000000001 answers a
  # different record, which the size alone cannot produce.
  - name: "next_page_token moves the page on for v2 users"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users"
      query:
        "page_size": "1"
        "next_page_token": "cauldronHost0000000001"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "users[0].id": "cauldronHost0000000002"
      absent:
        - "users[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether page_size was read or not -- but next_page_token can be:
  # past the only record the collection is empty, where a name the
  # runtime ignored would have answered with the record again.
  - name: "next_page_token moves the page on for v2 users recordings"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/recordings"
      query:
        "page_size": "1"
        "next_page_token": "82345678901"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      absent:
        - "meetings[0]"

  # The names. This Recipe declares 4 field(s) on a meeting that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a meeting carries the field names this Recipe declares"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/meetings"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "meetings[0].created_at": "2026-01-01T00:00:00Z"
        "meetings[0].host_id": "cauldronHost0000000001"
        "meetings[0].join_url": "https://zoom.us/j/82345678901"
        "meetings[0].timezone": "Europe/London"

  # The names. This Recipe declares 4 field(s) on a recording that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a recording carries the field names this Recipe declares"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
      path: "/v2/users/cauldronHost0000000001/recordings"
      headers:
        "Authorization": "Bearer cauldron_zoom_token"
    expect:
      status: 200
      body:
        "meetings[0].host_id": "cauldronHost0000000001"
        "meetings[0].recording_count": 2
        "meetings[0].share_url": "https://zoom.us/rec/share/cauldron"
        "meetings[0].total_size": 148000000

  # The names. This Recipe declares 3 field(s) on a user that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an user carries the field names this Recipe declares"
    source: "https://developers.zoom.us/docs/api/meetings/"
    fixture: small-account
    request:
      method: GET
