  # A minimal dead-feed listing. id and title/url reuse the schema's own
  # id_feed and title_feed/url_feed examples -- the same 75075/"Batman
  # University" identifiers the description uses everywhere else -- rather
  # than inventing a second show. duplicateOf is left unset: nothing in the
  # description ties this particular id to a duplicate, and the field is
  # documented as nullable "except in podcasts/dead", not as always set
  # there.
  one-dead-feed:
    dead_feed:
      - id: 75075
        title: Batman University
        url: https://feeds.theincomparable.com/batmanuniversity

conformance:
  # Every case in this block sends a descriptive User-Agent, because the
  # live host refuses anything else before any of this is even reached --
  # see the header. None of these probes ever held a real X-Auth-Key.

  - name: no credential of any kind
    source: https://api.podcastindex.org/api/1.0/podcasts/trending
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/1.0/podcasts/byfeedid?id=75075
      headers:
        User-Agent: cauldron-recipe-probe/1.0
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body_matches: "Authorization header value either not set or blank\\."

  - name: Authorization and X-Auth-Date present, X-Auth-Key withheld
    source: https://api.podcastindex.org/api/1.0/podcasts/trending
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/1.0/podcasts/byfeedid?id=75075
      headers:
        User-Agent: cauldron-recipe-probe/1.0
        X-Auth-Date: "1788393420"
        Authorization: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      status: 401
      body_matches: "X-Auth-Key header value either not set, blank or corrupt\\."

  - name: Authorization and X-Auth-Key present, X-Auth-Date withheld
    source: https://api.podcastindex.org/api/1.0/podcasts/trending
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/1.0/podcasts/byfeedid?id=75075
      headers:
        User-Agent: cauldron-recipe-probe/1.0
        X-Auth-Key: junkkey0000
        Authorization: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      status: 401
      body_matches: "X-Auth-Date header value either not set, blank or corrupt\\."

  - name: all three present, X-Auth-Date is outside the 3 minute window
    # Real Authorization/X-Auth-Key values, correctly shaped and wrong,
    # answer identically to the junk ones below -- the timestamp check runs
    # before either credential's own content is examined further. Arming
    # skips the shape check Cauldron cannot compute a real signature past;
    # the request shown is exactly what was sent live.
    source: https://api.podcastindex.org/api/1.0/podcasts/trending
    verified: "2026-09-02"
    arm: date_stale
    fixture: empty
    request:
      method: GET
      path: /api/1.0/podcasts/byfeedid?id=75075
      headers:
        User-Agent: cauldron-recipe-probe/1.0
        X-Auth-Key: junkkey0000
        X-Auth-Date: "1234567890"
        Authorization: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      status: 401
      body_matches: "X-Auth-Date header value is not within the \\+/- 3 minute time window\\."

  - name: all three present and fresh, X-Auth-Key is not a registered key
    source: https://api.podcastindex.org/api/1.0/podcasts/trending
    verified: "2026-09-02"
    arm: key_invalid
    fixture: empty
    request:
      method: GET
      path: /api/1.0/podcasts/byfeedid?id=75075
      headers:
        User-Agent: cauldron-recipe-probe/1.0
        X-Auth-Key: junkkey0000
        X-Auth-Date: "1788393420"
        Authorization: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    expect:
      status: 401
      body_matches: "The X-Auth-Key header contains an invalid API key\\."

  - name: routing answers an unrouted path before any credential is examined
    # No auth headers of any kind, and the answer is nginx's own 404, not
    # this API's envelope -- see the header. Confirms auth.after_routing.
    source: https://api.podcastindex.org/api/1.0/no-such-route-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/1.0/no-such-route-xyz
      headers:
        User-Agent: cauldron-recipe-probe/1.0
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: "404 Not Found"

  - name: a wrong method on a real path is still refused for its credentials, not routed away
    # PUT with no credential answers the identical Authorization-absent
    # sentence a GET does -- there is no 405 anywhere on this host. See the
    # header.
