# Bright Data Recipe for Cauldron
#
# Bright Data is not one product behind api.brightdata.com; it is several,
# on the same hostname, with different shapes and -- per Bright Data's own
# docs -- different hosts for some of them (the SERP API and Web Unlocker
# proxy endpoints live on brightdata.com's proxy ports, not this REST host,
# and neither was reachable the way this project is allowed to probe: both
# exist to fetch a THIRD party's page, which this project's standing rule
# for scraping providers forbids doing without an account and a target
# nobody else's crawler should be pointed at). What this Recipe models
# instead is the **Dataset API** (also called the Web Scraper API's async
# mode) at /datasets/v3/*: trigger a collection, poll its progress, and
# download a snapshot. It is reachable, documented with a full OpenAPI
# spec, and answers real, distinguishable responses to no credential at
# all -- which is everything this collection is allowed to probe for. Web
# Unlocker and SERP are not modelled here at all; that is a scope decision
# stated once, not a gap repeated per section.
#
# **Three credential verdicts, not two, verified directly against
# api.brightdata.com on 2026-09-01.** No Authorization header at all:
#
#   401  text/html; charset=utf-8   "Credentials are missing"
#
# A well-formed Bearer token that is simply wrong:
#
#   401  text/html; charset=utf-8   "Invalid credentials"
#
# And a THIRD sentence for a header that cannot be a Bearer credential at
# all -- checked two ways, byte-identical both times:
#
#   Authorization: Bearer <nothing after the prefix>   -> "Auth method is not supported"
#   Authorization: junktoken1234567890 (no scheme)     -> "Auth method is not supported"
#
# Three real sentences for three real verdicts is rare enough in this
# collection that it is worth naming plainly: this is exactly what
# auth.absent_error, auth.malformed_error and auth.rejected_error exist
# for, and Bright Data is the cleanest case of the three this batch found.
#
# **Content-Type lies on every one of these.** Every body above -- and the
# 404 below -- is declared text/html; charset=utf-8 and is, byte for byte,
# a single line of plain text with no markup in it at all. Checked directly
# on every status this Recipe models.
#
# **Writing this Recipe found a bug in the credential check, and the bug is
# worth recording because Bright Data is what exposed it.** The check's own
# comment had said since the verdicts were written that a bare "Bearer " is
# malformed rather than absent -- somebody sent it. The code disagreed: the
# prefix matched, trimming left an empty string, and an empty string fell
# through to the key comparison and came out Rejected, which is the verdict
# for a credential that was actually examined.
#
# Bright Data draws the line where the comment did. It answers "Bearer "
# with nothing after it using the SAME "Auth method is not supported"
# sentence a header with no scheme at all gets -- the malformed one, not
# "Invalid credentials". Verified directly, both requests, 2026-09-01.
#
# That is fixed rather than worked around, and the fix cost nothing
# elsewhere: it touches only an empty value after a prefix, never a token
# that is present and wrong. Fireworks answers that same request with its
# own invalid-key sentence, and its Recipe is unaffected, because a Recipe
# naming no malformed error still falls through to the message it always
# got. All three of Bright Data's sentences are served here.
#
# **Routing is resolved before the credential, and it does not 404 into a
# credential check the way Diffbot's Recipe in this collection does.** A
# path this project invented, /no-such-route, answered 404 "Not found"
# with no Authorization header, and again with a wrong one -- identical
# both times, checked directly. A real path with the WRONG method behaves
# the opposite of what a REST API normally does: DELETE on
# /datasets/v3/trigger, with no credential at all, answered the same 401
# "Credentials are missing" that POST does. There is no 405 anywhere this
# project could find on this host. auth.after_routing: true reproduces the
# path half of this precisely: an unrouted path 404s regardless of
# credential, which is what unknown_route is overridden to answer below.
#
# **OPTIONS is not gated by auth at all, and this Recipe does not
# reproduce that.** OPTIONS /datasets/v3/trigger answered 403 "Guest
# access denied" with no Authorization header, and again with a well-formed
# wrong Bearer token -- identical both times, checked directly. That is a
# third status this project's other probing never produced (401 for every
# other method, 403 only for OPTIONS), and it does not vary with the
# credential the way every other method here does, which reads as a CORS
# preflight handler answering before the real auth layer is ever consulted.
# Cauldron's after_routing defers the credential check until AFTER a route
# match, uniformly for every method that route declares -- there is no way
# to declare a route that matches and still skips the credential gate for
# one specific method. OPTIONS is simply not declared as a route in this
# Recipe, and an OPTIONS request against it falls through to Cauldron's own
# method_not_allowed instead of Bright Data's real "Guest access denied".
# That is stated here rather than forced.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - GET and DELETE were only probed against /datasets/v3/trigger to
#     establish that the auth gate does not care about method (see above);
#     they are not real Dataset API methods and are not declared as
#     routes. An undeclared method against a path this Recipe DOES declare
#     answers Cauldron's own 405 rather than Bright Data's real
#     credential-gated 401 -- the same shape of gap OPTIONS has, for the
#     same reason, and not repeated in full there.
#   - Nothing is actually collected. A triggered job does not transition
#     from running to ready; snapshot content is the literal worked example
#     from Bright Data's own OpenAPI document, not a real scrape.
#   - Web Unlocker, SERP API, Scraper Studio, the Dataset Marketplace and
#     every pre-built Scraper API (LinkedIn, Amazon, and the rest) are not
#     modelled; see the header's opening paragraph for why.
#   - dataset_id and snapshot_id below are the literal example values from
#     Bright Data's own OpenAPI document, not identifiers this project
#     minted or observed against a real account.
#   - Notifications, webhooks, custom_output_fields, discovery-phase
#     triggering and every trigger parameter besides dataset_id are
#     documented in the spec and not modelled here.

recipe: brightdata
capability: infrastructure
version: 0.1.0

upstream:
  api: v3
  docs: https://docs.brightdata.com/api-reference/rest-api/scraper/asynchronous-requests
  spec: https://docs.brightdata.com/api-reference/rest-api/scraper/scraper-rest-api.json
  spec_hash: 715736bea5fee9f55f2b8938a3283cedd9de39ca143fde18129ea6e620d8796b
  spec_seen: "2026-09-01"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldronbrightdata00000000000000000
  absent_error: credentials_missing
  # See the header comment: this covers the common malformed shape (no
  # Bearer prefix at all) correctly and accepts one narrow known gap for
  # "Bearer " with nothing after it, which Cauldron's own engine classifies
  # as Rejected rather than Malformed.
  malformed_error: auth_method_unsupported
  rejected_error: invalid_credentials
  # Routing resolves first: an unrouted path 404s and, per the header
  # comment, a real path answers the SAME credential-gated 401 regardless
  # of method, for every method this project could declare a route for.
  after_routing: true

responses:
  resource:
    style: bare
  error:
    # Plain text, not JSON -- and mislabelled as HTML on every response.
    # See the header comment. Content-Type is set per error below rather
    # than here: the Recipe-wide error envelope has no headers field of its
    # own, only each named failure does.
    style: text

routes:
  # Trigger. Documented, not observed: this project holds no API key and
  # triggering a real collection would mean scraping somebody else's site.
  # dataset_id and the response's snapshot_id are Bright Data's own worked
  # example values, verbatim from the OpenAPI document above. No stored
  # record: Bright Data has nothing that fetches a "trigger" back by id,
  # only the snapshot it names.
  - method: POST
    path: /datasets/v3/trigger
    matches_query:
      dataset_id: gd_l1vikfnt1wgvvqz95w
    status: 200
    raw:
      content_type: application/json
      text: |
        {"snapshot_id":"s_m4x7enmven8djfqak"}

  # Monitor progress. status is running, ready or failed -- the OpenAPI
  # document's own enum, no fourth value invented. No worked example
  # combines all three fields at once, so the values below are the
  # document's own dataset_id/snapshot_id examples paired with the
  # documented enum, not observed together on the wire. The path segment
  # must be named {id} for Cauldron's own identity lookup (see
  # internal/runtime/identity.go); id.field below renames the emitted key
  # back to snapshot_id, which is what Bright Data actually calls it.
  - method: GET
    path: /datasets/v3/progress/{id}
    resource: snapshot
    operation: get

  # Download. The response body below is the OpenAPI document's own
  # generic example for DatasetSnapshotContent, labelled there as
  # illustrative rather than tied to any one dataset -- so this route
  # answers the same fixture whatever snapshot id is asked for.
  - method: GET
    path: /datasets/v3/snapshot/{id}
    raw:
      content_type: application/json
      text: |
        {"url":"https://example.com/product/123","title":"Sample Product","price":"99.99","description":"Product description"}

resources:
  snapshot:
    collection: snapshots
    id:
      style: opaque
      length: 19
      field: snapshot_id
    fields:
      dataset_id:
        type: string
      status:
        type: string
        default: running

errors:
  credentials_missing:
    status: 401
    message: "Credentials are missing"
    headers:
      Content-Type: text/html; charset=utf-8

  invalid_credentials:
    status: 401
    message: "Invalid credentials"
    headers:
      Content-Type: text/html; charset=utf-8

  auth_method_unsupported:
    status: 401
    message: "Auth method is not supported"
    headers:
      Content-Type: text/html; charset=utf-8

  # Overrides Cauldron's own generic 404 body so an unrouted path answers
  # Bright Data's real, mislabelled-as-HTML plain text -- reachable
  # whatever the credential, per the header comment.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/html; charset=utf-8
    message: "Not found"

fixtures:
  empty: {}

  snapshot-in-progress:
    snapshot:
      - id: s_m4x7enmven8djfqak
        dataset_id: gd_l1vikfnt1wgvvqz95w
        status: running

conformance:
  - name: no credential at all is Credentials are missing
    source: https://api.brightdata.com/datasets/v3/trigger
    verified: "2026-09-01"
    request:
      method: POST
      path: /datasets/v3/trigger?dataset_id=gd_l1vikfnt1wgvvqz95w
    expect:
      status: 401
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: "Credentials are missing"

  - name: a well-formed but wrong Bearer token is a different sentence
    source: https://api.brightdata.com/datasets/v3/trigger
    verified: "2026-09-01"
    request:
      method: POST
      path: /datasets/v3/trigger?dataset_id=gd_l1vikfnt1wgvvqz95w
      headers:
        Authorization: "Bearer junktoken1234567890"
    expect:
      status: 401
      body_matches: "Invalid credentials"

  - name: a header with no Bearer prefix at all is a THIRD sentence
    source: https://api.brightdata.com/datasets/v3/trigger
    verified: "2026-09-01"
    request:
      method: POST
      path: /datasets/v3/trigger?dataset_id=gd_l1vikfnt1wgvvqz95w
      headers:
        Authorization: "junktoken1234567890"
    expect:
      status: 401
      body_matches: "Auth method is not supported"

  - name: and a scheme with nothing after it gets that same third sentence
    # "Bearer " and nothing else. Bright Data groups it with a header
    # carrying no scheme at all rather than with a token it does not know,
    # which is the line the credential check draws too -- once the check was
    # corrected to draw it, which writing this Recipe is what prompted. See
    # the header.
    source: https://api.brightdata.com/datasets/v3/trigger
    verified: "2026-09-01"
    request:
      method: POST
      path: /datasets/v3/trigger?dataset_id=gd_l1vikfnt1wgvvqz95w
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body_matches: "Auth method is not supported"

  - name: routing wins over the credential on a path that does not exist
    source: https://api.brightdata.com/no-such-route
    verified: "2026-09-01"
    request:
      method: GET
      path: /no-such-route
    expect:
      # Not 401. Checked with a wrong credential too, on the live host --
      # identical either way, per the header comment.
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: "Not found"

  - name: triggering a collection returns a snapshot id and nothing else
    source: https://docs.brightdata.com/api-reference/rest-api/scraper/scraper-rest-api.json
    request:
      method: POST
      path: /datasets/v3/trigger?dataset_id=gd_l1vikfnt1wgvvqz95w
      headers:
        Authorization: "Bearer cauldronbrightdata00000000000000000"
    expect:
      status: 200
      body:
        snapshot_id: s_m4x7enmven8djfqak

  - name: a running snapshot already has a status, and it is not terminal
    source: https://docs.brightdata.com/api-reference/rest-api/scraper/scraper-rest-api.json
    fixture: snapshot-in-progress
    request:
      method: GET
      path: /datasets/v3/progress/s_m4x7enmven8djfqak
      headers:
        Authorization: "Bearer cauldronbrightdata00000000000000000"
    expect:
      status: 200
      body:
        snapshot_id: s_m4x7enmven8djfqak
        dataset_id: gd_l1vikfnt1wgvvqz95w
        status: running

  - name: snapshot content is a flat record, not a job envelope
    source: https://docs.brightdata.com/api-reference/rest-api/scraper/scraper-rest-api.json
    request:
      method: GET
      path: /datasets/v3/snapshot/s_m4x7enmven8djfqak
      headers:
        Authorization: "Bearer cauldronbrightdata00000000000000000"
    expect:
      status: 200
      body:
        title: "Sample Product"
        price: "99.99"
