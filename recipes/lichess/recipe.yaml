# Lichess Recipe for Cauldron
#
# The game counts do not add up.
#
#   "count": {"all": 23723, "win": 11329, "loss": 11345, "draw": 1044, ...}
#
#   11329 + 11345 + 1044 = 23718
#
# Five games short of "all", on a record where "playing" is 0. Nothing in the
# object accounts for them and nothing names what they are, so an application
# rendering "23,723 games: 11,329 won, 11,345 lost, 1,044 drawn" shows four
# numbers that do not reconcile, and there is no fifth field to blame.
#
# It is the kind of thing that survives forever, because each number is right on
# its own and only the sum is wrong -- and nobody sums them.
#
# **And a list of links is separated by a Windows line ending, inside a JSON
# string.**
#
#   "links": "github.com/ornicar\r\nmas.to/@thibault"
#
# Two links, one field, joined by CRLF. Splitting on "\n" leaves a carriage
# return on the end of the first, which renders as nothing and compares as
# something -- so a client that splits the obvious way gets a URL that looks
# right, prints right, and does not equal itself.
#
# Written against the live API rather than a document: every case below was
# checked against lichess.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Two time units in one record, neither named. createdAt and seenAt are
#      Unix epoch milliseconds -- 1290415680000 -- while playTime.total is
#      6577476, which is seconds. A client dividing the wrong one by a thousand
#      is out by a factor of a million and gets a plausible-looking answer
#      either way.
#   2. Sibling objects do not carry the same keys. perfs.ultraBullet has
#      "prov": true and perfs.bullet has no such key, because provisional is
#      only sent when it is true -- so a client reading .prov gets a boolean on
#      some ratings and undefined on others, across eighteen game types in one
#      object.
#   3. Two 404s, one JSON and one a web page. A user who does not exist answers
#      {"error": "Not found"}; a path that does not exist answers the whole
#      Lichess site in HTML, opening with a comment about the project being
#      open source. A client calling .json() on the second throws on the angle
#      bracket.
#
# And a colour is an integer: patronColor is 10, with nothing saying what the
# other nine are.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One user is served, and the counts move as they play. The figures are the
#     ones that stood at the moment in the verified field, and the arithmetic
#     gap is the finding rather than the figures.
#   - Two of the eighteen perfs are served. The rest are the same shape.
#   - The HTML 404 is served as a fragment: the opening tag, the language and
#     the comment about the project. The real page is tens of kilobytes of
#     markup, and what matters is that it is markup at all.

recipe: lichess
capability: analytics
version: 0.1.0

upstream:
  api: v1
  provider: lichess
  docs: https://lichess.org/api

auth:
  # Public for this endpoint, no key. The rest of the API takes a token.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: error

resources:
  user:
    id:
      style: opaque
      field: id
    fields:
      username:
        type: string
      url:
        type: string
      # A dotted enum.
      flair:
        type: string
      patron:
        type: boolean
      # A colour, as an integer.
      patronColor:
        type: integer
      verified:
        type: boolean
      # Milliseconds.
      createdAt:
        type: integer
      seenAt:
        type: integer
      # Seconds, in the same record, unlabelled.
      playTime:
        type: map
      # Where the arithmetic does not work.
      count:
        type: map
      # Where the sibling objects disagree about their keys.
      perfs:
        type: map
      # Where the links are joined by a carriage return.
      profile:
        type: map
      streamer:
        type: map

routes:
  - method: GET
    path: /api/user/thibault
    resource: user
    operation: get
    id_from: auth

  # A user who does not exist: JSON.
  - method: GET
    path: /api/user/thisuserdoesnotexistatall999
    error: not_found

  # A path that does not exist: the website.
  - method: GET
    path: /api/nosuchthing
    error: page_not_found
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  not_found:
    status: 404
    message: Not found

  page_not_found:
    status: 404
    # The whole site, in HTML, on an API path. Served as a fragment: what
    # matters is that it is markup, and that it opens by mentioning the
    # project's licence.
    style: text
    message: '<!DOCTYPE html><html lang="en-GB" class="system"><!-- Lichess is open source --></html>'

fixtures:
  empty: {}

  thibault:
    user:
      - id: thibault
        username: thibault
        url: "https://lichess.org/@/thibault"
        # A dotted enum.
        flair: nature.seedling
        patron: true
        # A colour, as an integer, with nothing saying what the others are.
        patronColor: 10
        verified: true
        # Milliseconds...
        createdAt: 1290415680000
        seenAt: 1788159738787
        playTime:
          # ...and seconds, in the same record, neither named.
          total: 6577476
          tv: 18024
        count:
          # Five more than its own parts.
          all: 23723
          rated: 21328
          win: 11329
          loss: 11345
          draw: 1044
          # And nothing here accounts for them.
          playing: 0
          bookmark: 79
          import: 73
          me: 0
        perfs:
          ultraBullet:
            games: 3
            rating: 1688
            rd: 361
            prog: 0
            # Sent only when it is true.
            prov: true
          bullet:
            games: 7483
            rating: 1774
            rd: 97
            # A negative progression, and no prov key at all.
            prog: -22
        profile:
          bio: I turn coffee into bugs.
          realName: Thibault Duplessis
          # Two links, one field, joined by a Windows line ending.
          links: "github.com/ornicar\r\nmas.to/@thibault"
        streamer:
          twitch:
            channel: "https://www.twitch.tv/ornicar2"

conformance:
  - name: the game counts do not add up
    source: https://lichess.org/api/user/thibault
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thibault
    expect:
      status: 200
      body:
        # 11329 + 11345 + 1044 = 23718, and this says 23723.
        count.all: 23723
        count.win: 11329
        count.loss: 11345
        count.draw: 1044
        # With nothing in progress to account for the five.
        count.playing: 0
        count.rated: 21328
        # And the four counts that are about something else entirely, in the
        # same object as the ones that should reconcile.
        count.bookmark: 79
        count.import: 73
        count.me: 0

  - name: a list of links is separated by a Windows line ending
    source: https://lichess.org/api/user/thibault
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thibault
    expect:
      status: 200
      body:
        # Splitting on "\n" leaves a carriage return on the first, which
        # renders as nothing and compares as something.
        profile.links: "github.com/ornicar\r\nmas.to/@thibault"
        profile.bio: I turn coffee into bugs.
        profile.realName: Thibault Duplessis

  - name: two time units in one record, neither named
    source: https://lichess.org/api/user/thibault
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thibault
    expect:
      status: 200
      body:
        # Milliseconds...
        createdAt: 1290415680000
        seenAt: 1788159738787
        # ...and seconds, four fields away.
        playTime.total: 6577476
        playTime.tv: 18024

  - name: sibling objects do not carry the same keys
    source: https://lichess.org/api/user/thibault
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thibault
    expect:
      status: 200
      body:
        # Provisional, sent only when it is true...
        perfs.ultraBullet.prov: true
        perfs.ultraBullet.games: 3
        perfs.ultraBullet.rating: 1688
        perfs.ultraBullet.rd: 361
        # ...and absent on the sibling beside it, which also carries a
        # negative progression.
        perfs.bullet.games: 7483
        perfs.bullet.rating: 1774
        perfs.bullet.prog: -22
      absent:
        - perfs.bullet.prov

  - name: a user who does not exist answers JSON
    source: https://lichess.org/api/user/thisuserdoesnotexistatall999
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thisuserdoesnotexistatall999
    expect:
      status: 404
      body:
        error: Not found

  - name: and a path that does not exist answers the website
    source: https://lichess.org/api/nosuchthing
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/nosuchthing
    expect:
      # The same status as the failure above, and not the same kind of thing
      # at all.
      status: 404
      headers:
        Content-Type: text/html
      # A client calling .json() on this throws on the angle bracket.
      body_matches: '^<!DOCTYPE html><html lang="en-GB" class="system"><!-- Lichess is open source --></html>$'

  - name: a colour is an integer and a flair is a dotted word
    source: https://lichess.org/api/user/thibault
    verified: "2026-08-31"
    fixture: thibault
    request:
      method: GET
      path: /api/user/thibault
    expect:
      status: 200
      body:
        # Ten, with nothing saying what the other nine are.
        patronColor: 10
        patron: true
        verified: true
        flair: nature.seedling
        id: thibault
        username: thibault
        url: "https://lichess.org/@/thibault"
        # And a streaming channel, two levels down, on a chess API.
        streamer.twitch.channel: "https://www.twitch.tv/ornicar2"
