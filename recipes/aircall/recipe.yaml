# Aircall Recipe for Cauldron
#
# Written against Aircall's API reference at developers.aircall.io and struck
# live against api.aircall.io on 2026-09-07 with no credential, with a
# deliberately invalid one, and on paths that do and do not exist.
#
# **Three statuses for three states, and every one of them is right.** Struck
# live:
#
#   GET /v1/calls           (no credential)      401 {"message":"Unauthorized"}
#   GET /v1/calls           Basic notreal        403 {"message":"Forbidden"}
#   GET /v1/cauldron-nope   Basic notreal        404 {"message":"Not Found"}
#
# 401 for "I do not know who you are", 403 for "I know and the answer is no",
# 404 for "there is nothing here". That is what RFC 9110 says those three mean,
# and Aircall is one of the few providers in this collection that sends all
# three correctly on one endpoint. Most send one status for everything, and
# several send the one that describes a different failure.
#
# **The body is the status line, copied.** `{"message":"Unauthorized"}`,
# `{"message":"Forbidden"}`, `{"message":"Not Found"}` -- each is the reason
# phrase for the status it arrives with. So the whole body is derivable from
# the first line of the response, and there is no code, no correlation id and
# no link anywhere in it. Getting the statuses right is worth more than any
# body, and this is the same trade [acuity](../acuity) makes in the other
# direction: three fields that all say the status, and one status for
# everything.
#
# **Routing runs before the credential**, which is what makes the 404 above
# possible. `GET /v1/ping` with no credential is a 401 and `GET /v1/` with no
# credential is a 404, so the two are decided by whether the path exists rather
# than by whether a key was sent. The cost is that the whole surface is
# enumerable anonymously: anybody can learn which paths this API serves without
# holding an account. The benefit is that a caller with a typo in the URL is
# told so rather than told to check its key, which is the failure four
# providers here cannot report at all.
#
# **A wrong scheme is a 403 rather than a 401.** `Authorization: Bearer
# notreal` on an API that takes Basic answers "Forbidden" -- so a credential
# that could not possibly authenticate anybody is treated as a caller who is
# known and refused, and the one mistake the status set could have described
# precisely is the one it rounds off.

recipe: aircall
capability: voice
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.aircall.io/api-references
  # No spec: Aircall publishes a rendered reference site.

auth:
  # API ID as the username and API token as the password.
  scheme: basic
  keys:
    - "cauldr0naircallid"
  # Two verdicts, two statuses, both correct -- which is rarer here than it
  # should be.
  absent_error: unauthorized
  rejected_error: forbidden
  # A Bearer prefix on an API that takes Basic is unreadable rather than
  # wrong, and it gets the same answer -- so the one mistake this status set
  # could have described precisely is the one it rounds off.
  malformed_error: forbidden
  # A path that does not exist answers 404 whether or not a credential came
  # with it, so the router decides before the credential does.
  after_routing: true

responses:
  list:
    style: wrapped
    key: calls
    count_field: meta.total
    page_count_field: meta.count
    page_field: meta.current_page
    limit_field: meta.per_page
    cursor_field: meta.next_page_link
    # A whole URL rather than a token, so a client that concatenates it onto
    # a base address builds one that does not exist.
    cursor_url: absolute
    prev_field: meta.previous_page_link
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  call:
    id:
      field: id
      style: numeric
    fields:
      direct_link:
        type: string
      direction:
        type: string
      status:
        type: string
      # Seconds since the epoch as a bare integer, in a field whose name says
      # neither the unit nor the zone.
      started_at:
        type: timestamp
      # Absent on a call nobody picked up, so the field that says when the
      # conversation began is the field a missed call does not have.
      answered_at:
      ended_at:
        type: timestamp
      duration:
        type: integer
      raw_digits:
        type: string
      missed_call_reason:

routes:
  - method: GET
    path: /v1/calls
    resource: call
    operation: list
    pagination:
      style: page
      limit: 20
      max_limit: 50
      limit_param: per_page
      cursor_param: page

errors:
  unauthorized:
    status: 401
    # The reason phrase for 401, and the whole body.
    message: Unauthorized

  forbidden:
    status: 403
    message: Forbidden

  unknown_route:
    status: 404
    message: Not Found

fixtures:
  empty:
    call: []

  company:
    call:
      - id: 1948217603
        direct_link: https://api.aircall.io/v1/calls/1948217603
        direction: inbound
        status: done
        started_at: 1788811245
        answered_at: 1788811251
        ended_at: 1788811502
        duration: 257
        raw_digits: "+16135550142"
      - id: 1948217604
        direct_link: https://api.aircall.io/v1/calls/1948217604
        direction: inbound
        status: done
        started_at: 1788814901
        # Nobody picked up, so there is no answered_at at all and the reason
        # lives in a second field.
        ended_at: 1788814928
        duration: 27
        raw_digits: "+14165550118"
        missed_call_reason: no_available_agent

conformance:
  - name: no credential is 401 and the body is the reason phrase
    source: https://api.aircall.io/v1/calls
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers: {}
    expect:
      status: 401
      body:
        # Derivable from the status line, and the whole body.
        message: Unauthorized

  - name: a wrong credential is 403 rather than 401
    source: https://api.aircall.io/v1/calls
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        # notreal:notreal
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      # The two credential failures are told apart, which most providers in
      # this collection do not do.
      status: 403
      body:
        message: Forbidden

  - name: a wrong scheme is also 403
    source: https://api.aircall.io/v1/calls
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        # Bearer on an API that takes Basic: a credential that could not
        # authenticate anybody is answered as a caller who is known and
        # refused.
        Authorization: "Bearer notreal"
    expect:
      status: 403
      body:
        message: Forbidden

  - name: an unknown path is 404 even with a wrong credential
    source: https://api.aircall.io/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      # The router decides before the credential does, so a caller with a typo
      # is told about the typo.
      status: 404
      body:
        message: Not Found

  - name: an unknown path is 404 with no credential at all
    source: https://api.aircall.io/v1/
    verified: "2026-09-07"
    fixture: company
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      # And the cost of that ordering: the surface is enumerable by anybody,
      # because 401 and 404 separate the paths that exist from the ones that
      # do not without a key being held.
      status: 404
      body:
        message: Not Found

  - name: calls are wrapped beside a meta object
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        'calls[0].id': 1948217603
        'calls[0].direction': inbound
        # A whole URL to the record, on the record -- so the identifier is
        # sent twice, once as a number and once inside an address.
        'calls[0].direct_link': https://api.aircall.io/v1/calls/1948217603
        'calls[0].status': done
        # The number as dialled, E.164, in a field named for the digits
        # rather than for the number.
        'calls[0].raw_digits': "+16135550142"
        'meta.total': 2

  - name: the timestamps are bare seconds since the epoch
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # Integers in fields whose names say neither the unit nor the zone,
        # on an API whose other integer field, duration, is in the same unit
        # and means something else entirely.
        'calls[0].started_at': 1788811245
        'calls[0].ended_at': 1788811502
        'calls[0].duration': 257

  - name: a missed call has no answered_at
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        'calls[0].answered_at': 1788811251
        'calls[1].missed_call_reason': no_available_agent
      absent:
        # So the field that says when the conversation began is the one a
        # missed call does not have, and a client subtracting it from
        # ended_at gets NaN rather than the ring time.
        - 'calls[1].answered_at'

  - name: the next page is a whole URL rather than a token
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
      query:
        per_page: "1"
    expect:
      status: 200
      body:
        'calls[0].id': 1948217603
        'meta.current_page': 1
        # How many are on this page, beside meta.total for how many matched:
        # two counts one word apart, and the one called count is the smaller.
        'meta.count': 1
      matches:
        # A client concatenating this onto a base address builds a URL that
        # does not exist -- the mistake eight Recipes in this collection had
        # to be corrected for.
        'meta.next_page_link': '^https?://'

  - name: the previous link is null on the first page rather than absent
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
      query:
        per_page: "1"
    expect:
      status: 200
      body:
        # The key is always there and only its value moves, so a client
        # testing for the key's presence to find the first page never finds
        # it.
        'meta.previous_page_link': null

  - name: calls page on page and per_page
    source: https://developers.aircall.io/api-references
    fixture: company
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        'calls[0].id': 1948217604
        'meta.current_page': 2
        'meta.per_page': 1

  - name: a company with no calls answers an empty array
    source: https://developers.aircall.io/api-references
    fixture: empty
    request:
      method: GET
      path: /v1/calls
      headers:
        Authorization: "Basic Y2F1bGRyMG5haXJjYWxsaWQ6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        calls: []
        'meta.total': 0
