# Vimeo Recipe for Cauldron
#
# Written against the OpenAPI 3.0.2 document Vimeo publishes at
# github.com/vimeo/openapi -- api.yaml, seven hundred and seventy kilobytes --
# and quoted from the field descriptions in it.
#
# The privacy setting called unlisted is described as a fact about search.
#
# The video privacy enum lists seven values and describes six of them as
# rules about who may watch:
#
#   anybody   -- "Anyone can view the video."
#   contacts  -- "Only contacts can view the video."
#   nobody    -- "No one besides the owner can view the video."
#   password  -- "Anyone with the video's password can view the video."
#   users     -- "Only people with a Vimeo account can view the video."
#   disable   -- "Hide from vimeo"
#
# and the seventh like this:
#
#   unlisted  -- "Not searchable from vimeo.com"
#
# That is a statement about an index, in a list of statements about access,
# and it is the one people choose when they mean private-ish. It does not
# restrict anybody. The same document says so in its other privacy enum, the
# one for a user's default: "unlisted - Anybody can view the user's videos if
# they have a link."
#
# So one value, two descriptions, one file. A reader who finds the video one
# learns that the video will not turn up in search. A reader who finds the
# user one learns that anyone holding the URL can watch it. Only the second is
# a description of who can see the thing, and the first is the one attached to
# the field you actually set.
#
# Four more, each from the same document:
#
#   1. There are two fields called status and they answer different
#      questions. One is "The play status of the video" -- playable,
#      purchase_required, restricted. The other is "The status code for the
#      availability of the video", and its values are about uploading and
#      transcoding: available, quota_exceeded, total_cap_exceeded,
#      transcode_starting, transcoding, transcoding_error, unavailable. A
#      video can be finished and not playable, or playable and over quota,
#      and the field name gives no clue which question you asked.
#   2. And the second one is deprecated in favour of two objects: "This field
#      is deprecated in favor of `upload` and `transcode`." So the migration
#      from one field is to two, and code switching on a single status has to
#      become code reading a pair of nested states.
#   3. A video has no id. The object carries a uri -- "/videos/12345" -- and
#      no identifier field of any kind, so the number every path needs has to
#      be cut off the end of a string. This is Dwolla's shape, and it arrives
#      here on a much more widely used API.
#   4. A privacy value decides how you are allowed to send the request. Of
#      privacy.view: "When this value is `users`, `application/json` is the
#      only valid content type." One field's value constrains the encoding of
#      the request that sets it, which is not a thing a client library can
#      express and not a thing a schema can check.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Uploading is not modelled. Vimeo's upload is tus, a resumable protocol
#     with its own handshake, and nothing about it is JSON over one request.
#     What is served is what a video looks like afterwards, including the
#     states it passes through on the way.
#   - Claim 4 is stated and not served: this format cannot make an accepted
#     content type depend on a field's value, and refusing form encoding
#     outright would be wrong for the other six values.
#   - The deprecated status is served beside upload and transcode, because
#     that is what Vimeo sends -- the deprecation is a note in the document,
#     not an absence on the wire.
#   - With no create route there is nothing here that mints a video, so the
#     default on the play status is a claim about a request that cannot be
#     made. It is kept rather than dropped because a video Vimeo returns
#     always carries the field, and left unexercised on purpose.
#   - error_code is declared as a number and Vimeo's codes are all digits, so
#     the declaration and the format's own inference agree. It is stated
#     because the two would part company the day a code carried a letter, and
#     the inference is not a claim this Recipe wants to rely on.
#   - Channels, groups, albums, portfolios, on-demand pages, the tus upload
#     endpoints and everything about users other than the videos they own are
#     absent. Videos only.
#
# The token and the ids below are fixtures and belong to no account.

recipe: vimeo
capability: media
version: 0.1.0

upstream:
  api: "3.4"
  docs: https://developer.vimeo.com/api/reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_vimeo_fixture_token

responses:
  list:
    style: wrapped
    key: data
    count_field: total
    page_field: page
    limit_field: per_page
    cursor_field: paging.next
    cursor_url: path
  resource:
    style: bare
  error:
    # Four properties, all required, and the code is a number.
    style: flat
    message_field: error
    code_field: error_code
    code_type: number
    type_field: "-"
    fields:
      developer_message: The request could not be completed.
      link: https://developer.vimeo.com/api/reference

resources:
  video:
    id:
      style: numeric
      # Vimeo sends no identifier field at all. The number lives at the end
      # of the uri and nowhere else.
      field: "-"
      carried_by: uri
    fields:
      uri:
        type: string
      name:
        type: string
      description:
        type: string
      link:
        type: string
      duration:
        type: integer
      created_time:
        type: datetime
      # "The play status of the video."
      status:
        type: string
        default: available
      # The availability one, deprecated in favour of the two objects below
      # and still on the wire.
      transcode:
        type: map
      upload:
        type: map
      privacy:
        type: map
      pictures:
        type: map

routes:
  - method: GET
    path: /me/videos
    resource: video
    operation: list
    pagination:
      style: page
      cursor_param: page
      limit_param: per_page
      limit: 25
      first_page: 1

  - method: GET
    path: /videos/{id}
    resource: video
    operation: get

errors:
  authentication_error:
    status: 401
    message: You must provide a valid authenticated access token.
    code: 8003

  resource_missing:
    status: 404
    message: The requested video could not be found.
    code: 5000

  invalid_request:
    status: 400
    message: The request could not be understood.
    code: 2204

fixtures:
  empty: {}

  account:
    video:
      # Unlisted, which reads as a restriction and is not one.
      - id: "912144100"
        uri: /videos/912144100
        name: Warehouse walkthrough
        description: An internal tour, shared with the insurer.
        link: https://vimeo.com/912144100
        duration: 184
        created_time: "2026-06-02T10:14:00.000Z"
        status: available
        transcode:
          status: complete
        upload:
          status: complete
          approach: tus
        privacy:
          # "Not searchable from vimeo.com" -- and anybody holding the link
          # can watch it.
          view: unlisted
          embed: public
          download: false
          add: true
          comments: anybody
        pictures:
          uri: /videos/912144100/pictures/1
          active: true
      # Actually private, for contrast.
      - id: "912144200"
        uri: /videos/912144200
        name: Board meeting recording
        link: https://vimeo.com/912144200
        duration: 3721
        created_time: "2026-06-09T09:00:00.000Z"
        status: available
        transcode:
          status: complete
        upload:
          status: complete
          approach: tus
        privacy:
          view: nobody
          embed: private
          download: false
          add: false
          comments: nobody
        pictures:
          uri: /videos/912144200/pictures/1
          active: true
      # Uploaded, still transcoding, and the play status already says a word
      # that sounds like success.
      - id: "912144300"
        uri: /videos/912144300
        name: Product launch cut 4
        link: https://vimeo.com/912144300
        duration: 0
        created_time: "2026-08-21T16:40:00.000Z"
        status: available
        transcode:
          status: in_progress
        upload:
          status: complete
          approach: tus
        privacy:
          view: anybody
          embed: public
          download: false
          add: true
          comments: anybody
        pictures:
          uri: /videos/912144300/pictures/1
          active: false

conformance:
  - name: the setting that reads as private lets anybody with the link watch
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/912144100
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        # "Not searchable from vimeo.com" is the whole of what the video
        # privacy enum says about this value, and the user privacy enum in
        # the same document says the rest: "Anybody can view the user's
        # videos if they have a link."
        "privacy.view": unlisted
        # And the link is right here on the object, which is the thing that
        # makes it watchable.
        link: https://vimeo.com/912144100
        "privacy.embed": public

  - name: and the one that really is private says a different word entirely
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/912144200
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        # "No one besides the owner can view the video." The distinction the
        # first case is about only exists because this value is the one that
        # means what people think unlisted means.
        "privacy.view": nobody
        "privacy.embed": private

  - name: a video can be transcoding while its status says available
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/912144300
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        # status is "The play status of the video" and transcode.status is
        # where the work is. A player pointed at this video has nothing to
        # play, and the field most code reads says available.
        status: available
        "transcode.status": in_progress
        "upload.status": complete
        duration: 0

  - name: and a finished one differs only in the nested field
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/912144100
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        # Same top-level status, different transcode. The deprecation note --
        # "deprecated in favor of `upload` and `transcode`" -- is a migration
        # from one field to two, and this is why.
        status: available
        "transcode.status": complete
        duration: 184

  - name: a video carries no identifier anywhere except the end of a string
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/912144100
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        # The uri is the only place the number appears, so every client that
        # stores a video ends up doing string surgery on it.
        uri: /videos/912144100
      absent:
        - id
        - video_id

  - name: the listing counts everything and pages by a path
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /me/videos?per_page=2
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 200
      body:
        total: 3
        page: 1
        per_page: 2
        "data[0].uri": /videos/912144100
        "data[1].uri": /videos/912144200
      matches:
        # A path rather than a token, so a client joining it to the base URL
        # builds an address that does not exist.
        "paging.next": '^/me/videos\?'
      absent:
        - data[2]

  - name: a video that is not there is refused with a number for a code
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /videos/999999999
      headers:
        Authorization: Bearer cauldron_vimeo_fixture_token
    expect:
      status: 404
      body:
        # error, developer_message, error_code and link are all required, and
        # the code is a number rather than a string -- so a client comparing
        # it to "5000" never matches.
        error: The requested video could not be found.
        error_code: 5000
        link: https://developer.vimeo.com/api/reference

  - name: a token the account does not know is refused
    source: https://github.com/vimeo/openapi
    fixture: account
    request:
      method: GET
      path: /me/videos
      headers:
        Authorization: Bearer not_this_accounts_token
    expect:
      status: 401
      body:
        error_code: 8003
        developer_message: The request could not be completed.
