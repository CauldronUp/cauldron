# Fly.io Machines API Recipe for Cauldron
#
# The app listing, read from the OpenAPI document Fly serves without a
# credential at docs.machines.dev/openapi.json, and struck live on 2026-09-14
# with no token, with a wrong token, without the required query parameter, on a
# path that does not exist, with a method the path does not take, and on the
# root.
#
# **The challenge asks for a scheme the API does not take.** Every refusal
# carries
#
#   www-authenticate: Basic realm="api.machines.dev"
#
# on an API authenticated with `Authorization: Bearer <fly token>`. A browser
# opening one of these gets a username-and-password box; a client implementing
# the challenge implements the wrong scheme; and `realm` is the hostname, which
# is the one thing the client already had.
#
# **The document declares no authentication at all.**
# `components.securitySchemes` is `{}`, and no operation carries a `security`
# block -- in a 68-path document for an API that refuses every request without
# a token. A generated client is generated without a way to send one.
#
# **And the listing declares no failures.** `GET /v1/apps` has exactly one
# response in the document: `200`. Every refusal below was struck live and none
# of them is in the description, so `cauldron drift` reports each declared error
# as not backed -- correctly, because there is nothing there to back it.
#
# **A missing required query parameter is reported as a missing page.**
# `org_slug` is `required: true` on the listing. Struck live:
#
#   GET /v1/apps?org_slug=personal   (no token)      401  application/json
#   GET /v1/apps                     (wrong token)   404  text/plain  404 page not found
#   GET /v1/cauldron-nope                            404  text/plain  404 page not found
#   PUT /v1/apps                                     404  text/plain  404 page not found
#
# So forgetting the parameter, mistyping the path and mistyping the verb are
# one answer -- Go's default not-found handler, in plain text, from an API that
# is JSON everywhere else -- and all three are answered before the credential.
#
# **A missing token and a wrong one are the same sentence**, and the sentence is
# a Go error chain: `{"error":"Authenticate: token validation error"}`. The
# wrapping verb is in the message, and "token validation error" covers both a
# token that failed validation and a token that was never sent.
#
# **A record carries three identifiers and the one called id is not the one you
# address it by.** The path is `/v1/apps/{app_name}`, so an app is addressed by
# `name`. The record also has `id`, a string, and `internal_numeric_id`, an
# integer -- a field whose name says it is internal, in a public response.
#
# Also pinned: the app record has no `required` array and not one field
# description in the whole schema, so nothing in the document says which of the
# nine fields is guaranteed or what any of them mean; `total_apps` rides beside
# `apps` as the only paging-shaped field, with no page, limit or cursor
# anywhere; and the API root answers `301` with `content-type:
# application/json` and no body.

recipe: flyio
capability: hosting
version: 1.0.0

upstream:
  api: "1.0"
  docs: https://fly.io/docs/machines/api/
  spec: https://docs.machines.dev/openapi.json
  spec_hash: b60122248ee3741e4395c3443a8382c3a76dec3d65292bc2e2265714d3f16a8a
  spec_seen: "2026-09-14"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - FlyV1cauldr0nf1xturet0ken00000000000000
  # One sentence for both, and it is a Go error chain.
  absent_error: token_validation_error
  malformed_error: token_validation_error
  rejected_error: token_validation_error
  # The path, the verb and the required parameter are all resolved first.
  after_routing: true

responses:
  list:
    style: wrapped
    key: apps
    count_field: total_apps
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  app:
    id:
      field: id
      style: opaque
      length: 12
    fields:
      # What the path addresses an app by, which is not the field called id.
      name:
        type: string
      # A third identifier, and its name says it is not for us.
      internal_numeric_id:
        type: integer
      machine_count:
        type: integer
      network:
        type: string
      network_cidr:
        type: string
      organization:
        type: map
      status:
        type: string
      volume_count:
        type: integer

routes:
  - method: GET
    path: /v1/apps
    resource: app
    operation: list
    # No page, no limit, no cursor: total_apps is the whole of the paging.
    pagination:
      style: none

  - method: GET
    path: /v1/apps/{id}
    resource: app
    operation: get
    # The document calls this segment {app_name}: an app is addressed by its
    # name, not by the field called id that sits beside it.
    lookup_by: name
    not_found: app_not_found

errors:
  token_validation_error:
    status: 401
    # A Go error chain, with the wrapping verb still on the front.
    message: "Authenticate: token validation error"
    headers:
      # Basic, on an API that takes a bearer token.
      WWW-Authenticate: Basic realm="api.machines.dev"

  unknown_route:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      Content-Type: text/plain; charset=utf-8
      X-Content-Type-Options: nosniff

  # A verb the path does not take, answered as a page that is not there.
  method_not_allowed:
    status: 404
    style: text
    message: "404 page not found\n"
    headers:
      Content-Type: text/plain; charset=utf-8
      X-Content-Type-Options: nosniff

  # Not observed: reaching it needs a real token. The provider's own envelope
  # with the sentence its CLI surfaces, and the README says so.
  app_not_found:
    status: 404
    message: "Could not find App"

fixtures:
  empty:
    app: []

  fleet:
    app:
      - name: cauldron-web
        # Not the identifier the path uses.
        id: cauldron-web
        # "internal", in a public response.
        internal_numeric_id: 48213907
        machine_count: 3
        network: default
        network_cidr: fdaa:0:3c1f::/48
        organization:
          name: Platform Team
          slug: platform-team
        status: deployed
        volume_count: 1
      - name: cauldron-worker
        id: cauldron-worker
        internal_numeric_id: 48213912
        machine_count: 0
        network: default
        network_cidr: fdaa:0:3c1f::/48
        organization:
          name: Platform Team
          slug: platform-team
        status: pending
        volume_count: 0

conformance:
  - name: the challenge asks for basic on a bearer api
    source: https://api.machines.dev/v1/apps?org_slug=personal
    verified: "2026-09-14"
    fixture: fleet
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: personal
      headers: {}
    expect:
      status: 401
      headers:
        # A browser opening this gets a username and password box.
        WWW-Authenticate: Basic realm="api.machines.dev"
      body:
        # The wrapping verb is still on the front of the sentence.
        error: "Authenticate: token validation error"

  - name: and a wrong token gets the identical sentence
    source: https://api.machines.dev/v1/apps?org_slug=personal
    verified: "2026-09-14"
    fixture: fleet
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: personal
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        error: "Authenticate: token validation error"
      headers:
        WWW-Authenticate: Basic realm="api.machines.dev"

  - name: an unrouted path is plain text from go
    source: https://api.machines.dev/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: fleet
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # Not JSON, and answered before the credential.
        Content-Type: text/plain; charset=utf-8
      body_matches: '\A404 page not found\s*\z'

  - name: and so is a method the path does not take
    source: https://api.machines.dev/v1/apps
    verified: "2026-09-14"
    fixture: fleet
    request:
      method: PUT
      path: /v1/apps
      headers: {}
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '\A404 page not found\s*\z'

  - name: a record carries three identifiers and the path uses none of them twice
    source: https://docs.machines.dev/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: platform-team
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 200
      body:
        # The path addresses by name.
        'apps[0].name': cauldron-web
        # And the record also carries an id.
        'apps[0].id': cauldron-web
        # And a third, whose name says it is not for callers.
        'apps[0].internal_numeric_id': 48213907
        'apps[1].internal_numeric_id': 48213912
        'apps[0].status': deployed
        'apps[1].status': pending

  - name: nine fields with no required array and no descriptions
    source: https://docs.machines.dev/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: platform-team
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 200
      body:
        # Nothing in the document says which of these is guaranteed.
        'apps[0].machine_count': 3
        'apps[1].machine_count': 0
        'apps[0].volume_count': 1
        'apps[0].network': default
        'apps[0].network_cidr': fdaa:0:3c1f::/48
        'apps[0].organization.slug': platform-team
        'apps[0].organization.name': Platform Team

  - name: the whole of the paging is one count
    source: https://docs.machines.dev/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: platform-team
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 200
      body:
        total_apps: 2
      absent:
        # No page, no limit, no cursor, no next.
        - next
        - page
        - limit

  - name: one app travels bare rather than wrapped
    source: https://docs.machines.dev/openapi.json
    fixture: fleet
    request:
      method: GET
      path: /v1/apps/cauldron-worker
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 200
      body:
        name: cauldron-worker
        id: cauldron-worker
        machine_count: 0
        volume_count: 0
        status: pending

  - name: an app that is not there keeps the json envelope
    source: https://api.machines.dev/v1/apps
    fixture: fleet
    request:
      method: GET
      path: /v1/apps/cauldron-nope
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 404
      body:
        error: "Could not find App"

  - name: an organisation with no apps still sends the count
    source: https://docs.machines.dev/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/apps
      query:
        org_slug: platform-team
      headers:
        Authorization: "Bearer FlyV1cauldr0nf1xturet0ken00000000000000"
    expect:
      status: 200
      body:
        apps: []
        total_apps: 0
