# Zoho Books Recipe for Cauldron
#
# **`page_context` is an array.**
#
# A listing answers `{"code": 0, "message": "success", "invoices": [...],
# "page_context": [{...}]}`, and the paging object is wrapped in a list with one
# element in it. So `page_context.has_more_page` is undefined and
# `page_context[0].has_more_page` is the boolean, and the loop everybody writes
# reads undefined, treats it as false, and stops after one page of ten.
#
# That is Zoho's own schema saying so: page_context is declared
# `"type": "array"` with an items object carrying page, per_page,
# has_more_page, sort_column, sort_order, applied_filter, report_name and
# response_option.
#
# **It is recorded here and not served.** This format has no way to describe a
# paging block shaped as a one-element array, so a listing from this emulator
# carries code, message and the records, and no page_context at all. A client
# that reads `page_context[0].has_more_page` finds nothing here and a boolean
# from Zoho; a client that reads `page_context.has_more_page` finds nothing in
# both places, for two different reasons. The shape is above so that nobody has
# to meet it for the first time in production.
#
# **Money is a string.**
#
# `total` and `balance` are declared `"type": "string"` on an accounting API. So
# `invoice.total + other.total` concatenates, `Number(invoice.balance)` is a
# conversion somebody has to remember, and `balance > 100` compares
# lexicographically -- "9.00" is greater than "100.00". `invoice_id` is a string
# too, described as "a set of numeric characters", which is a number-looking
# value that must not be parsed as one.
#
# **`code: 0` is inside a 200, and the same key carries failures.**
#
# Every success is `{"code": 0, "message": "success", ...}`. Every failure is
# `{"code": <non-zero>, "message": "..."}`. So the discriminator is a *value*
# rather than a key: `if (body.code)` happens to work in JavaScript because zero
# is falsy, and `if ("code" in body)` and `if (body.code !== undefined)` are both
# true on success. The presence of an error-looking field is not an error.
#
# **The credential prefix is not Bearer.**
#
#   Authorization: Zoho-oauthtoken 6e80xxxxxxxxxxxxxxxxxxxxxxxx8a80
#
# An OAuth2 access token, carried under a word no OAuth library uses by default.
# A client that reaches for a standard bearer helper sends `Bearer` and is
# refused with a valid token.
#
# **There are eight base URLs and an account lives on exactly one.**
#
# zohoapis.com, .eu, .in, .com.au, .jp, .ca, .com.cn and .sa. The token, the
# organisation and the data all belong to one data centre, and the same request
# against another one is not a routing detail -- it is a different installation
# of Zoho. Only the US host is served here; the rest are recorded because
# choosing the wrong one is the failure this list explains.
#
# **`organization_id` rides on every request.**
#
# Not a header and not part of the path: a query parameter on every call,
# including the ones that already name the record by id.
#
# Written against Zoho's own OpenAPI document -- the invoices.yml linked from
# the reference, 93 paths -- fetched on the date in spec_seen. No case here is
# marked verified: the document is Zoho's, the responses are this emulator's.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Invoices only, and a small part of them. That one document has 93 paths,
#     including the status transitions (sent, void, draft), email, reminders,
#     attachments and templates. Each wants evidence rather than a shape copied
#     from a neighbour.
#   - One data centre. See above.
#   - `page_context`, above: recorded, not served.
#   - The eight statuses are served as values, not as a lifecycle. An invoice
#     here does not move from draft to sent to overdue on its own.

recipe: zohobooks
capability: accounting
version: 0.1.0

upstream:
  api: v3
  docs: https://www.zoho.com/books/api/v3/introduction/
  spec: https://www.zoho.com/books/api/v3/invoices/invoices.yml
  spec_hash: d33267ffdab518312ae719c8bfe573cfebdb91b5ebc3f46624edef4f00294769
  spec_seen: "2026-09-06"

auth:
  # Not Bearer. The word is Zoho-oauthtoken.
  scheme: header
  header: Authorization
  prefix: "Zoho-oauthtoken "
  keys:
    - cauldron0000000000000000000000000000
  absent_error: no_credential
  rejected_error: authentication_error

responses:
  list:
    style: wrapped
    key: invoices
  resource:
    style: wrapped
    key: invoice
  success:
    # On every successful body, beside the payload. Zero is success.
    fields:
      code: 0
      message: success
  error:
    style: flat
    message_field: message

resources:
  invoice:
    id:
      style: opaque
      field: invoice_id
    fields:
      invoice_number:
        type: string
      customer_name:
        type: string
      # sent, draft, overdue, paid, void, unpaid, partially_paid, viewed.
      status:
        type: string
      # A string. On an accounting API.
      total:
        type: string
      balance:
        type: string
      currency_code:
        type: string
      date:
        type: string
      due_date:
        type: string
      reference_number:
        type: string

routes:
  - method: GET
    path: /books/v3/invoices
    resource: invoice
    operation: list
    pagination:
      style: page
      limit: 10
      limit_param: per_page
      cursor_param: page
      first_page: 1

  - method: GET
    path: /books/v3/invoices/{id}
    resource: invoice
    operation: get

  - method: POST
    path: /books/v3/invoices
    resource: invoice
    operation: create

errors:
  no_credential:
    status: 401
    code: 57
    message: "You are not authorized to perform this operation"
  authentication_error:
    status: 401
    code: 57
    message: "You are not authorized to perform this operation"
  resource_missing:
    status: 404
    code: 1002
    message: "The invoice you are looking for does not exist"
  parameter_missing:
    status: 400
    code: 4
    message: "The value passed for {detail} is not valid"
  unknown_route:
    status: 404
    code: 1002
    message: "The requested URL was not found"
  method_not_allowed:
    status: 405
    code: 6
    message: "Method not allowed"
  rate_limit:
    # 100 a minute per organisation.
    status: 429
    code: 14
    message: "You have exceeded maximum number of API calls per minute"

fixtures:
  empty:
    invoice: []

  small-org:
    invoice:
      - invoice_id: "460000000039129"
        invoice_number: INV-000042
        customer_name: Ada Lovelace
        status: overdue
        # Strings. "9.00" sorts above "100.00" and adding two of them
        # concatenates.
        total: "100.00"
        balance: "100.00"
        currency_code: GBP
        date: "2026-07-01"
        due_date: "2026-07-15"
        reference_number: PO-1183

      - invoice_id: "460000000039130"
        invoice_number: INV-000043
        customer_name: Grace Hopper
        status: partially_paid
        total: "250.00"
        balance: "9.00"
        currency_code: GBP
        date: "2026-08-04"
        due_date: "2026-09-04"
        reference_number: PO-1184

      # Void is not deleted and not unpaid: it still lists, with its total.
      - invoice_id: "460000000039131"
        invoice_number: INV-000044
        customer_name: Katherine Johnson
        status: void
        total: "80.00"
        balance: "0.00"
        currency_code: GBP
        date: "2026-08-19"
        due_date: "2026-09-19"
        reference_number: PO-1185

conformance:
  - name: the credential prefix is Zoho-oauthtoken, not Bearer
    source: https://www.zoho.com/books/api/v3/introduction/
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices
      query:
        organization_id: "10234695"
      headers:
        # An OAuth2 access token under a word no OAuth library sends by
        # default.
        Authorization: "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        "invoices[0].invoice_number": "INV-000042"

  - name: and a Bearer prefix is refused with the same token
    source: https://www.zoho.com/books/api/v3/introduction/
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices
      query:
        organization_id: "10234695"
      headers:
        Authorization: "Bearer cauldron0000000000000000000000000000"
    expect:
      status: 401
      body:
        message: "You are not authorized to perform this operation"

  - name: success carries code zero inside a two hundred
    source: https://www.zoho.com/books/api/v3/introduction/
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices
      query:
        organization_id: "10234695"
      headers:
        Authorization: "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        # The same key carries a non-zero number on failure, so the presence
        # of "code" says nothing and only its value does.
        code: 0
        message: "success"

  - name: money is a string, and the balances sort the wrong way round
    source: https://www.zoho.com/books/api/v3/invoices/invoices.yml
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices
      query:
        organization_id: "10234695"
      headers:
        Authorization: "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        # Quoted, because Zoho's schema says "type": "string". The second
        # invoice owes 9.00 and the first owes 100.00, and comparing them as
        # text puts the smaller debt first.
        "invoices[0].balance": "100.00"
        "invoices[1].balance": "9.00"

  - name: a void invoice still lists, with the total it is not owed
    source: https://www.zoho.com/books/api/v3/invoices/invoices.yml
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices/460000000039131
      query:
        organization_id: "10234695"
      headers:
        Authorization: "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        "invoice.status": "void"
        "invoice.total": "80.00"
        "invoice.balance": "0.00"

  - name: an identifier that looks like a number is a string
    source: https://www.zoho.com/books/api/v3/invoices/invoices.yml
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices/460000000039129
      query:
        organization_id: "10234695"
      headers:
        Authorization: "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        # Fifteen digits, and Zoho's own description calls it "a set of
        # numeric characters". Parsing it loses nothing today and everything
        # on the day one arrives with a leading zero.
        "invoice.invoice_id": "460000000039129"

  - name: no credential at all is refused
    source: https://www.zoho.com/books/api/v3/introduction/
    fixture: small-org
    request:
      method: GET
      path: /books/v3/invoices
      query:
        organization_id: "10234695"
    expect:
      status: 401
      body:
        message: "You are not authorized to perform this operation"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 3 and receiving one can only
  # happen if per_page was read.
  - name: "per_page is read on books v3 invoices, and a page of one is not the whole collection"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: GET
      path: "/books/v3/invoices"
      query:
        "organization_id": "10234695"
        "per_page": "1"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        "invoices[0].balance": "100.00"
      absent:
        - "invoices[1]"

  # And the position. page=2 answers a different record, which the size
  # alone cannot produce.
  - name: "page moves the page on for books v3 invoices"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: GET
      path: "/books/v3/invoices"
      query:
        "organization_id": "10234695"
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        "invoices[0].balance": "9.00"
      absent:
        - "invoices[1]"

  # The names. This Recipe declares 5 field(s) on an invoice that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "an invoice carries the field names this Recipe declares"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: GET
      path: "/books/v3/invoices"
      query:
        "organization_id": "10234695"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 200
      body:
        "invoices[0].currency_code": "GBP"
        "invoices[0].customer_name": "Ada Lovelace"
        "invoices[0].date": "2026-07-01"
        "invoices[0].due_date": "2026-07-15"
        "invoices[0].reference_number": "PO-1183"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for method not allowed and nothing
  # asserted any of them, so the wording could have been changed to
  # anything and every case would have stayed green. This makes the
  # refusal happen -- using a method this route does not take -- and
  # asserts what came back, envelope and all.
  - name: "a method this route does not take is refused in these words"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: DELETE
      path: "/books/v3/invoices"
      query:
        "organization_id": "10234695"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 405
      body:
        "message": "Method not allowed"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    arm: rate_limit
    fixture: small-org
    request:
      method: GET
      path: "/books/v3/invoices"
      query:
        "organization_id": "10234695"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 429
      body:
        "message": "You have exceeded maximum number of API calls per minute"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for resource missing and nothing
  # asserted any of them, so the wording could have been changed to
  # anything and every case would have stayed green. This makes the
  # refusal happen -- asking for an id nothing was seeded under -- and
  # asserts what came back, envelope and all.
  - name: "an id nothing was seeded under is refused in these words"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: GET
      path: "/books/v3/invoices/cauldron-no-such-id"
      query:
        "organization_id": "10234695"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 404
      body:
        "message": "The invoice you are looking for does not exist"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for unknown route and nothing asserted
  # any of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # asking for a path this provider does not serve -- and asserts what
  # came back, envelope and all.
  - name: "a path this provider does not serve is refused in these words"
    source: "https://www.zoho.com/books/api/v3/introduction/"
    fixture: small-org
    request:
      method: GET
      path: "/cauldron-no-such-path"
      query:
        "organization_id": "10234695"
      headers:
        "Authorization": "Zoho-oauthtoken cauldron0000000000000000000000000000"
    expect:
      status: 404
      body:
        "message": "The requested URL was not found"



