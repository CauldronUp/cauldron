        metacritic_url: http://www.metacritic.com/game/playstation-4/the-witcher-3-wild-hunt
        playtime: 30
        screenshots_count: 40
        movies_count: 3
        creators_count: 6
        achievements_count: 78
        parent_achievements_count: "0"
        reddit_url: https://www.reddit.com/r/witcher/
        reddit_name: witcher
        reddit_description: "Illustrative text, not fetched from the live API."
        reddit_logo: https://media.rawg.io/media/games/illustrative/witcher-reddit-logo.png
        reddit_count: 42
        twitch_count: "0"
        youtube_count: "0"
        ratings_count: 1500
        suggestions_count: 500
        alternative_names:
          - Wiedzmin 3
        parents_count: 0
        additions_count: 2
        game_series_count: 3
        esrb_rating:
          id: 4
          slug: mature
          name: Mature
        platforms:
          - platform:
              id: 4
              slug: pc
              name: PC
            released_at: "2015-05-18"

conformance:
  - name: no key at all is refused with one sentence
    source: https://api.rawg.io/api/games?page_size=1
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /games
      query:
        page_size: "1"
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error: "The key parameter is not provided"

  - name: an oversized page_size does not change that either
    source: https://api.rawg.io/api/games?page_size=99999
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /games
      query:
        page_size: "99999"
    expect:
      # Still the auth failure: whatever RAWG does with a page this size once
      # a request gets past its own key check is not observable this way.
      status: 401
      body:
        error: "The key parameter is not provided"

  - name: a bad path answers the same body as a bad key, through this engine
    source: https://api.rawg.io/api/nonexistentendpoint
    verified: "2026-08-31"
    fixture: catalogue
    request:
      method: GET
      path: /nonexistentendpoint
    expect:
      # Real RAWG answers this one 404 text/html, because the path never
      # reaches the view that checks the key -- see the header. This case
      # pins what this Recipe's engine actually does, which is check the key
      # first regardless of the path, the same as TMDB's equivalent case.
      status: 401
      body:
        error: "The key parameter is not provided"

  - name: with a key, paging hands back an absolute URL, not a token
    source: https://api.rawg.io/docs/?format=openapi
    fixture: catalogue
    request:
      method: GET
      path: /games
      query:
        key: cauldron-rawg-fixture-key-000000000000
        page_size: "1"
    expect:
      # Documented rather than observed: reaching a 200 needs a key nobody
      # has. count and results.length disagree on purpose -- count is the
      # whole matching set, not this page.
      status: 200
      body:
        count: 2
        "results[0].id": 1
        "results[0].slug": the-witcher-3-wild-hunt
      matches:
        # An absolute URL carrying this request moved on to page 2, not an
        # opaque cursor a client would have to concatenate onto something.
        next: '^https?://.*[?&]page=2'
      absent:
        # No second game leaked onto a page of one.
        - "results[1]"

  - name: the last page sends the cursor field as null, not absent
    source: https://api.rawg.io/docs/?format=openapi
    fixture: catalogue
    request:
      method: GET
      path: /games
      query:
        key: cauldron-rawg-fixture-key-000000000000
        page_size: "1"
        page: "2"
      headers: {}
    expect:
      status: 200
      body:
        count: 2
        next: null
        "results[0].id": 2

  - name: a game addressed by slug gets the same record as by id
    source: https://api.rawg.io/docs/?format=openapi
    fixture: catalogue
    request:
      method: GET
      path: /games/the-witcher-3-wild-hunt
      query:
        key: cauldron-rawg-fixture-key-000000000000
    expect:
      status: 200
      body:
        id: 1
        name: "The Witcher 3: Wild Hunt"

  - name: four _count fields are strings and the rest are numbers
    source: https://api.rawg.io/docs/?format=openapi
    fixture: catalogue
    request:
      method: GET
      path: /games/1
      query:
        key: cauldron-rawg-fixture-key-000000000000
    expect:
      status: 200
      body:
        id: 1
        # RAWG's own documented example string, on the game it documents it
        # against.
        metacritic_url: http://www.metacritic.com/game/playstation-4/the-witcher-3-wild-hunt
        reviews_text_count: "12"
        parent_achievements_count: "0"
        twitch_count: "0"
        youtube_count: "0"
        # Beside them, on the same record, four counts that really are
        # numbers.
        ratings_count: 1500
        reddit_count: 42
        screenshots_count: 40
        movies_count: 3

  - name: the list shape carries none of the detail-only fields
    source: https://api.rawg.io/docs/?format=openapi
    fixture: catalogue
    request:
      method: GET
      path: /games
      query:
        key: cauldron-rawg-fixture-key-000000000000
        page_size: "10"
    expect:
      status: 200
      body:
        count: 2
        "results[0].name": "The Witcher 3: Wild Hunt"
        "results[1].name": "Uncharted 4: A Thief's End"
        # Nullable and null on this one, beside a rated game on the other.
        "results[1].esrb_rating": null
        "results[0].esrb_rating.name": Mature
      absent:
        - "results[0].description"
        - "results[0].website"
        - "results[0].reddit_url"
        - "results[0].metacritic_url"
