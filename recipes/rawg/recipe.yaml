        added: 9000
        added_by_status:
          owned: 8000
          playing: 100
        metacritic: 93
        playtime: 12
        suggestions_count: 200
        updated: "2023-01-01T00:00:00"
        # Nullable, and null on this one: an unrated game, beside a rated one
        # in the same fixture.
        esrb_rating: null
        platforms:
          - platform:
              id: 187
              slug: playstation4
              name: PlayStation 4
            released_at: "2016-05-10"

    game_single:
      - id: "1"
        slug: the-witcher-3-wild-hunt
        name: "The Witcher 3: Wild Hunt"
        name_original: "The Witcher 3: Wild Hunt"
        description: "An award-winning open-world RPG. Illustrative text, not fetched from the live API."
        released: "2015-05-18"
        tba: false
        updated: "2023-11-09T00:00:00"
        background_image: https://media.rawg.io/media/games/illustrative/witcher-3.jpg
        background_image_additional: https://media.rawg.io/media/games/illustrative/witcher-3-alt.jpg
