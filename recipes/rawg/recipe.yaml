# RAWG Recipe for Cauldron
#
# There are two different sentences for "you did not authenticate", and this
# Recipe can only tell one of them.
#
#   GET /api/games?page_size=1            (no key at all)
#   ->  401  {"error": "The key parameter is not provided"}
#
#   GET /api/games?key=totally_fake_key   (a key, and a wrong one)
#   ->  401  {"error": "The API key is not found"}
#
# Both checked against api.rawg.io on 2026-08-31, both HTTP 401, both the same
# one-field envelope -- and two different sentences depending on whether a key
# was sent at all. Cauldron's own auth check cannot see that difference:
# internal/runtime/auth.go's authorised() returns one bool, and the handler
# raises exactly one error, authentication_error, whichever way it failed.
# That is not a RAWG fact this Recipe forgot to model; it is this project's
# own engine having no branch for "present but wrong" that is different from
# "absent", for any provider, on any scheme. This Recipe declares
# authentication_error as the first sentence -- "The key parameter is not
# provided" -- because that is what a caller with no key at all sees, and the
# second sentence above is real, verified, and cannot be reached through this
# Recipe. Stated rather than forced.
#
# **And the key is checked before the path.** GET /api/nonexistentendpoint
# with no key answers the same {"error": "The key parameter is not provided"},
# not a 404 -- verified the same day. The real RAWG API answers a bad path the
# other way round: an unmatched URL never reaches the view that would check
# the key, so /api/nonexistentendpoint with no key at all comes back 404
# Content-Type text/html, Django's own "Not Found" page, not RAWG's JSON error
# shape. Checked live; also unreachable through this Recipe, for the same
# reason as TMDB's equivalent gap -- Cauldron checks a Recipe's auth before it
# ever attempts to match a route, and RAWG's real stack runs those two checks
# in the opposite order.
#
# Also checked and unremarkable: ?page_size=99999 with no key answers the
# identical "key parameter is not provided" body. Whatever RAWG actually does
# with an oversized page once a request gets past its own auth is not
# observable this way, and RAWG's own OpenAPI description declares page_size
# as a bare integer with no documented maximum -- so no clamp and no over_limit
# is declared here. Unverified stays unverified.
#
# No rate-limit header of any kind appears on api.rawg.io, on any probe above.
#
# Two more, from RAWG's own machine-readable description
# (https://api.rawg.io/docs/?format=openapi -- Swagger 2.0, read rather than
# called; nothing below this point was reachable without a key):
#
#   1. Paging is a page number, and the pointer to the next one is not a
#      token. The listing's own schema requires count and results and declares
#      next and previous as nullable URIs -- both full addresses, not opaque
#      cursors, and both nullable independently of each other. Cauldron's list
#      envelope has one cursor field; this Recipe wires next through it as an
#      absolute URL. There is no second field for previous, so RAWG's own
#      "here is where you came from" is real, documented, and not expressible
#      in this format today. Stated rather than forced.
#   2. "_count" is not a promise of a number. Of the thirteen fields across
#      Game and GameSingle whose name ends in _count, nine are declared
#      type: integer and four -- reviews_text_count, parent_achievements_count,
#      twitch_count, youtube_count -- are declared type: string, in the same
#      two objects, with nothing in the name to tell which is which. A client
#      that adds one to reviews_text_count concatenates instead.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No error response of any kind is documented for /games/{id} or /games in
#     RAWG's own OpenAPI description -- only 200. Combined with the auth gate
#     above, there is no way to observe or document what RAWG answers for a
#     game id that does not exist, so no not_found is declared for either
#     route: this Recipe says nothing rather than guessing.
#   - Two games are served, of the real catalogue, and their field values
#     (ratings, counts, identifiers) are illustrative rather than fetched:
#     RAWG's OpenAPI description carries field names and types but no example
#     payloads, and there is no key to call the real endpoints and record one.
#     Two of the actual strings below are the provider's own, though:
#     metacritic_url's documented example is the Witcher 3 Metacritic page,
#     and this Recipe uses exactly that string on exactly that game.
#   - description is declared type: string with no format, so this Recipe does
#     not claim it is HTML, plain text, or Markdown -- unlike TVmaze's summary,
#     nothing here documents which.

recipe: rawg
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://api.rawg.io/docs/
  spec: https://api.rawg.io/docs/?format=openapi
  spec_hash: 8f7781d89f3074a1f88b97fea2637a27fb144165cb04f10366c0716eacd48e3d
  spec_seen: "2026-08-31"

auth:
  scheme: query
  param: key
  keys:
    - cauldron-rawg-fixture-key-000000000000

responses:
  list:
    style: wrapped
    key: results
    count_field: count
    # RAWG's own address for the next page, not a token. There is no field
    # for previous -- see the header.
    cursor_field: next
    cursor_url: absolute
    cursor_null: true
  resource:
    style: bare
  error:
    # One field, no code, no type, no status echoed back.
    style: flat
    message_field: error
    code_field: "-"

resources:
  # /games. Nineteen fields; nine more appear only on the detail resource
  # below.
  game:
    id:
      style: numeric
      type: number
    fields:
      slug:
        type: string
      name:
        type: string
      released:
        type: string
      tba:
        type: boolean
      background_image:
        type: string
      rating:
        type: number
      rating_top:
        type: integer
      ratings:
        type: map
      ratings_count:
        type: integer
      # Declared type: string in RAWG's own schema, unlike ratings_count
      # beside it.
      reviews_text_count:
        type: string
      added:
        type: integer
      added_by_status:
        type: map
      metacritic:
        type: integer
      playtime:
        type: integer
      suggestions_count:
        type: integer
      updated:
        type: datetime
      # Nullable in RAWG's own schema: a game with no ESRB rating sends null,
      # not an absent key.
      esrb_rating:
        type: map
        null_when_unset: true
      platforms:
        type: list

  # /games/{id}. Everything game has, plus the fields below -- description,
  # website, the reddit_* and *_count fields among them -- that a list hit
  # never carries at all.
  game_single:
    id:
      style: numeric
      type: number
    # /games/{id} takes "An ID or a slug identifying this Game," per RAWG's
    # own description.
    alias: slug
    fields:
      slug:
        type: string
      name:
        type: string
      name_original:
        type: string
      description:
        type: string
      released:
        type: string
      tba:
        type: boolean
      updated:
        type: datetime
      background_image:
        type: string
      background_image_additional:
        type: string
      website:
        type: string
      rating:
        type: number
      rating_top:
        type: integer
      ratings:
        type: map
      reviews_text_count:
        type: string
      added:
        type: integer
      added_by_status:
        type: map
      metacritic:
        type: integer
      metacritic_url:
        type: string
      playtime:
        type: integer
      screenshots_count:
        type: integer
      movies_count:
        type: integer
      creators_count:
        type: integer
      achievements_count:
        type: integer
      # A string here and on reviews_text_count above; an integer on
      # ratings_count and reddit_count below. RAWG's own schema, not this
      # Recipe's invention.
      parent_achievements_count:
        type: string
      reddit_url:
        type: string
      reddit_name:
        type: string
      reddit_description:
        type: string
      reddit_logo:
        type: string
      reddit_count:
        type: integer
      twitch_count:
        type: string
      youtube_count:
        type: string
      ratings_count:
        type: integer
      suggestions_count:
        type: integer
      alternative_names:
        type: list
      parents_count:
        type: integer
      additions_count:
        type: integer
      game_series_count:
        type: integer
      esrb_rating:
        type: map
        null_when_unset: true
      platforms:
        type: list

routes:
  - method: GET
    path: /games
    resource: game
    operation: list
    pagination:
      style: page
      # Not documented anywhere in RAWG's own description as a default; kept
      # small and stated as unverified rather than guessed at a round number
      # that looks more authoritative than it is.
      limit: 20
      limit_param: page_size
      cursor_param: page

  - method: GET
    path: /games/{id}
    resource: game_single
    operation: get

errors:
  # Verified against a request with no key. The second real sentence -- "The
  # API key is not found", for a key that is present and wrong -- cannot be
  # reached through this Recipe; see the header.
  authentication_error:
    status: 401
    message: "The key parameter is not provided"

fixtures:
  empty: {}

  # Illustrative values, not fetched -- see the header for why, and for which
  # two strings below are the provider's own rather than this Recipe's.
