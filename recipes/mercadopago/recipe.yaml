# Mercado Pago Recipe for Cauldron
#
# Written against Mercado Pago's API reference at developers.mercadopago.com
# and struck live against api.mercadopago.com on 2026-09-07 with no credential
# and then with a deliberately invalid one.
#
# **A timestamp and a UUID, joined by a semicolon, in one string.** Struck
# live:
#
#   GET /v1/payments/search                     (no credential)
#   401 {"message":"Unauthorized use of live credentials",
#        "error":"unauthorized","status":401,
#        "cause":[{"code":7,
#                  "description":"Unauthorized use of live credentials",
#                  "data":"07-09-2026T21:50:21UTC;b05e2e13-0c9b-478d-8bab-fb2b47a2d3c3"}]}
#
# `data` is two values in one field. The first is a timestamp in
# `DD-MM-YYYYThh:mm:ssUTC` -- day first, `T` in the middle, and the literal
# letters `UTC` where an offset belongs, so it is neither ISO 8601 nor RFC
# 3339 and no date library parses it. The second is a request id. They are
# separated by a semicolon, in a field called `data`, in an array called
# `cause`.
#
# So the two things a caller most wants from a failure -- when it happened and
# what to quote to support -- are both there, concatenated, in the one field
# whose name promises nothing about either.
#
# **"Unauthorized use of live credentials" is the answer to sending none.**
# Struck live with no Authorization header at all. The sentence names a
# specific mistake -- using a production key where a test one belongs, which
# is a real and common error in this API -- and it is the answer to a request
# that carried no key of any kind. The sixth provider in this collection to
# describe the wrong failure, and the most specific about the wrong thing.
#
# **The message appears twice and the status three times.** `message` at the
# top, `description` inside the cause, and they are the same string; `status`
# in the body, the HTTP status, and `error` carrying the status phrase.
#
# **The 404 is in Spanish.** Struck live:
#
#   GET /v1/cauldron-nope
#   404 {"error":"resource not found",
#        "message":"Si quieres conocer los recursos de la API que se encuentran
#                   disponibles visita el Sitio de Desarrolladores de MercadoLibre
#                   (https://developers.mercadopago.com)"}
#
# The `error` field is English and the `message` beside it is Spanish, in one
# body. It also says **MercadoLibre** -- the parent marketplace -- while
# linking developers.mercadopago.com, so the sentence names one company and
# the URL another.

recipe: mercadopago
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://www.mercadopago.com.ar/developers/en/reference
  # No spec: Mercado Pago publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - APP_USR-cauldr0n-f1xture-0000-000000000000
  # One body for both, and it names a mistake neither request made.
  absent_error: unauthorized_live_credentials
  rejected_error: unauthorized_live_credentials

responses:
  list:
    style: wrapped
    key: results
    fields:
      paging:
        total: 2
        limit: 30
        offset: 0
  error:
    style: flat
    message_field: message
    code_field: error
    code_type: string
    status_field: status

resources:
  payment:
    id:
      field: id
      style: numeric
    fields:
      status:
        type: string
        default: pending
      status_detail:
        type: string
      transaction_amount:
        type: number
        default: 0
      currency_id:
        type: string
        default: ARS
      payment_method_id:
        type: string
      date_created:
        type: string
      date_approved:
        type: string

routes:
  - method: GET
    path: /v1/payments/search
    resource: payment
    operation: list
    pagination:
      style: offset
      limit: 30
      limit_param: limit
      cursor_param: offset

errors:
  unauthorized_live_credentials:
    status: 401
    code: unauthorized
    # Names a specific mistake -- a production key where a test one belongs --
    # and it is the answer to a request that carried no key of any kind.
    message: "Unauthorized use of live credentials"
    fields:
      cause:
        - code: 7
          # The same string as `message` above.
          description: "Unauthorized use of live credentials"
          # Two values in one field: a timestamp in DD-MM-YYYYThh:mm:ssUTC,
          # which no date library parses, and a request id, joined by a
          # semicolon.
          data: "07-09-2026T21:50:21UTC;b05e2e13-0c9b-478d-8bab-fb2b47a2d3c3"

  unknown_route:
    status: 404
    code: "resource not found"
    # Spanish, beside an English `error` field, in one body -- and it names
    # MercadoLibre while linking mercadopago.com.
    message: "Si quieres conocer los recursos de la API que se encuentran disponibles visita el Sitio de Desarrolladores de MercadoLibre (https://developers.mercadopago.com)"

fixtures:
  empty:
    payment: []

  seller:
    payment:
      - id: 92104738261
        status: approved
        status_detail: accredited
        transaction_amount: 1500.00
        currency_id: ARS
        payment_method_id: visa
        date_created: "2026-09-04T10:12:44.000-03:00"
        date_approved: "2026-09-04T10:12:47.000-03:00"
      - id: 92104738262
        status: in_process
        # Under review, which can last days -- and status_detail is where the
        # reason lives, so a client switching on `status` sees one word for a
        # payment held for fraud review, one held for funds, and one held for
        # a document check.
        status_detail: pending_review_manual
        transaction_amount: 8990.50
        currency_id: ARS
        payment_method_id: pix
        date_created: "2026-09-07T09:30:02.000-03:00"

conformance:
  - name: the failure joins a timestamp and a request id with a semicolon
    source: https://api.mercadopago.com/v1/payments/search
    verified: "2026-09-07"
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers: {}
    expect:
      status: 401
      body:
        # Two values in one field called `data`, inside an array called
        # `cause`. The when and the what-to-quote, concatenated, in the one
        # field whose name promises neither.
        'cause[0].data': "07-09-2026T21:50:21UTC;b05e2e13-0c9b-478d-8bab-fb2b47a2d3c3"

  - name: the timestamp is day-first with the letters UTC
    source: https://api.mercadopago.com/v1/payments/search
    verified: "2026-09-07"
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers: {}
    expect:
      status: 401
      matches:
        # DD-MM-YYYYThh:mm:ssUTC -- day first, T in the middle, and the
        # literal letters UTC where an offset belongs. Neither ISO 8601 nor
        # RFC 3339, so no date library parses it.
        'cause[0].data': '^\d{2}-\d{2}-\d{4}T\d{2}:\d{2}:\d{2}UTC;'

  - name: the sentence names a mistake the request did not make
    source: https://api.mercadopago.com/v1/payments/search
    verified: "2026-09-07"
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers: {}
    expect:
      status: 401
      body:
        # Struck live with no Authorization header at all. "Live credentials"
        # is a real and common mistake in this API and it is not this one --
        # the sixth provider here to describe the wrong failure, and the most
        # specific about the wrong thing.
        message: "Unauthorized use of live credentials"

  - name: the message is repeated inside the cause
    source: https://api.mercadopago.com/v1/payments/search
    verified: "2026-09-07"
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # The same string twice, and the status three times: `status` in the
        # body, the HTTP status, and `error` carrying the status phrase.
        'cause[0].description': "Unauthorized use of live credentials"
        'cause[0].code': 7
        status: 401
        error: unauthorized

  - name: the not-found is in Spanish beside an English field
    source: https://api.mercadopago.com/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: seller
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 404
      body:
        # One body, two languages -- and the sentence names MercadoLibre, the
        # parent marketplace, while linking mercadopago.com.
        error: "resource not found"
        message: "Si quieres conocer los recursos de la API que se encuentran disponibles visita el Sitio de Desarrolladores de MercadoLibre (https://developers.mercadopago.com)"

  - name: payments are wrapped in results with a paging block
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        'results[0].id': 92104738261
        'results[0].status': approved
        'paging.total': 2

  - name: the reason for a held payment is in a second field
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # `status` is one word for a payment held for fraud review, one held
        # for funds and one held for a document check -- status_detail is
        # where the difference is, and a client switching on status cannot
        # tell a customer what to do.
        'results[1].status': in_process
        'results[1].status_detail': pending_review_manual

  - name: an unapproved payment has no approval time
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        'results[0].date_approved': "2026-09-04T10:12:47.000-03:00"
      absent:
        # Absent rather than null, so "has it been approved" can be answered
        # two ways and only one of them is a field called status.
        - 'results[1].date_approved'

  - name: money is a bare number and the currency is a separate word
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        # 8990.50 as a double on a payments API, with currency_id beside it
        # -- and the currency is per payment, so a listing can mix them.
        'results[1].transaction_amount': 8990.50
        'results[1].currency_id': ARS
        'results[1].payment_method_id': pix

  - name: payments page on limit and offset
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: seller
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
      query:
        limit: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # The paging block reports the whole set rather than the page, and
        # `date_created` carries Buenos Aires' offset rather than UTC.
        'results[0].id': 92104738262
        'results[0].date_created': "2026-09-07T09:30:02.000-03:00"
        'paging.total': 2

  - name: a seller with no payments answers an empty array
    source: https://www.mercadopago.com.ar/developers/en/reference
    fixture: empty
    request:
      method: GET
      path: /v1/payments/search
      headers:
        Authorization: "Bearer APP_USR-cauldr0n-f1xture-0000-000000000000"
    expect:
      status: 200
      body:
        results: []
