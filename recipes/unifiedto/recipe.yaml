# Unified.to Recipe for Cauldron
#
# The unified HRIS employee listing, read from the OpenAPI document Unified.to
# serves without a credential at api.unified.to/openapi.json, and struck live
# on 2026-09-13 with no credential, with a wrong token, on a path that does not
# exist, and with a method the path does not take.
#
# **A credential that was sent is described as missing.** Struck live:
#
#   (no header)     401  {"statusCode":401,"error":"Unauthorized","message":"Missing authentication"}
#   Bearer notreal  401  the identical body
#
# "Missing authentication", to a request carrying a token -- so a caller with a
# revoked key and one with no key at all read the same sentence.
#
# **`raw` means two different things on one operation.** It is a record
# property, `{"type": "object", "additionalProperties": true}`, holding the
# untransformed upstream payload. It is also a query parameter, and there it is
# a string: "Raw parameters to include in the 3rd-party request. Encoded as a
# URL component. eg. raw parameters: foo=bar&zoo=bar -> raw=foo%3Dbar%26zoo%3Dbar"
# -- a query string, percent-encoded by hand, inside a query parameter's value.
#
# **Two thirds of the document's named types exist because a property was an
# object.** 826 of its 1,327 schemas are called `property_<Parent>_<field>` --
# `property_HrisEmployee_emails`, `property_HrisEmployee_compensation` -- one
# per nested property, generated rather than named.
#
# **Nothing on an employee is required.** `HrisEmployee` has no `required` array
# at all, so `id` is optional in the contract that describes it, and the listing
# declares exactly one response, the 200 -- so every failure this Recipe serves
# is outside the contract, and drift says so.
#
# **A field name concatenates two countries.** `ssn_sin` -- the United States'
# Social Security Number and Canada's Social Insurance Number, joined by an
# underscore, on a record served from three data regions, one of which is
# Australia.
#
# **An employee record carries a storage quota, three times.**
# `storage_quota_allocated`, `storage_quota_used` and
# `storage_quota_available`, all `number`, on a person -- and the third is the
# first minus the second.
#
# **And it carries a security posture.** `has_mfa`, a boolean, beside
# `date_of_birth`, `pronouns`, `salutation`, `bio`, `marital_status` and
# `ssn_sin`.
#
# **The field selector is a closed list of every field.** `fields` is an array
# whose items are an `enum` naming each property, so adding a field to the
# record means adding it to the parameter that selects fields.
#
# Also pinned: the document's title is `"Unified.to  API"`, with two spaces; the
# security scheme is called `jwt` and declared
# `{"type": "apiKey", "name": "authorization", "in": "header"}`, so the value is
# a bare secret in a lowercase header; the collection path is singular
# (`/hris/{connection_id}/employee` lists employees); and three servers are
# declared -- North American, European and Australian -- with no field on any
# record saying which answered.

recipe: unifiedto
capability: hr
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://docs.unified.to
  spec: https://api.unified.to/openapi.json
  spec_hash: 20fb747178ac73d71a33a02dc418e1f2174309d0381eddacf69507d12131ae70
  spec_seen: "2026-09-13"

auth:
  scheme: header
  # A lowercase header name, carrying a bare secret.
  header: authorization
  keys:
    - cauldr0nf1xturek3y0000000000000000
  # One sentence for a credential that is absent and one that is wrong.
  absent_error: missing_authentication
  rejected_error: missing_authentication
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: error
    status_field: statusCode

resources:
  employee:
    id:
      field: id
      style: opaque
      length: 24
    fields:
      created_at:
        type: string
      updated_at:
        type: string
      name:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      emails:
        type: list
      title:
        type: string
      manager_id:
      employment_status:
        type: string
      employment_type:
        type: string
      gender:
      pronouns:
      salutation:
      bio:
      date_of_birth:
      marital_status:
      # The United States' abbreviation and Canada's, joined by an underscore.
      ssn_sin:
      employee_number:
        type: string
      hired_at:
      terminated_at:
      termination_reason:
      company_id:
      language_locale:
        type: string
      currency:
        type: string
      timezone:
        type: string
      image_url:
      telephones:
        type: list
      address:
        type: map
      groups:
        type: list
      locations:
        type: list
      # Three of them, on a person, and the third is the first minus the
      # second.
      storage_quota_allocated:
      storage_quota_used:
      storage_quota_available:
      # A security posture, on an HR record.
      has_mfa:
      timeoff_days_total:
      metadata:
        type: map
      # The untransformed upstream payload, under the same name as a query
      # parameter that means something else entirely.
      raw:
        type: map

routes:
  - method: GET
    # Singular: this lists employees.
    path: /hris/{connection_id}/employee
    resource: employee
    operation: list
    pagination:
      style: offset
      first_page: 0
      limit: 100
      limit_param: limit
      cursor_param: offset

errors:
  missing_authentication:
    status: 401
    code: Unauthorized
    # Said to a request that carried a token.
    message: Missing authentication

  unknown_route:
    status: 404
    code: Not Found
    message: Not Found

  method_not_allowed:
    # The same 404 an unrouted path gets.
    status: 404
    code: Not Found
    message: Not Found

fixtures:
  empty:
    employee: []

  workforce:
    employee:
      - id: emp_7Kq2mX9pLz4vB1nR8sT3
        created_at: "2019-03-04T09:12:03.000Z"
        updated_at: "2026-09-02T13:05:41.000Z"
        name: Ada Lovelace
        first_name: Ada
        last_name: Lovelace
        emails:
          - email: ada@example.com
            type: work
        title: Principal Engineer
        manager_id: null
        employment_status: ACTIVE
        employment_type: FULL_TIME
        gender: FEMALE
        pronouns: she/her
        salutation: null
        bio: ""
        date_of_birth: "1815-12-10"
        marital_status: null
        # One field, two countries.
        ssn_sin: null
        employee_number: EMP-0041
        hired_at: "2019-03-04T00:00:00.000Z"
        terminated_at: null
        termination_reason: null
        company_id: cmp_9Zx8Cv7Bn6Mq5Wp4Er3T
        language_locale: en-GB
        currency: GBP
        timezone: Europe/London
        image_url: https://example.com/avatars/0041.png
        telephones:
          - telephone: "+441234567890"
            type: work
        address:
          country: GB
        groups:
          - id: grp_3Hd8jK1mN5pQ7rS9tU2v
        locations:
          - id: loc_4Nb6Vc8Xz2Qa9Ws1Ed3R
        # Three quota fields, on a person.
        storage_quota_allocated: 107374182400
        storage_quota_used: 21474836480
        storage_quota_available: 85899345920
        # And a security posture.
        has_mfa: true
        timeoff_days_total: 25
        metadata: {}
        # The upstream object, under the name a query parameter also uses.
        raw:
          EmployeeID: "10041"
          Status: Active
      - id: emp_4Nb6Vc8Xz2Qa9Ws1Ed3R
        created_at: "2020-06-01T00:00:00.000Z"
        updated_at: "2026-08-31T17:00:00.000Z"
        name: Grace Hopper
        first_name: Grace
        last_name: Hopper
        emails: []
        title: Staff Engineer
        manager_id: emp_7Kq2mX9pLz4vB1nR8sT3
        employment_status: TERMINATED
        employment_type: FULL_TIME
        gender: FEMALE
        pronouns: null
        salutation: null
        bio: null
        date_of_birth: "1906-12-09"
        marital_status: null
        ssn_sin: null
        employee_number: EMP-0088
        hired_at: "2020-06-01T00:00:00.000Z"
        terminated_at: "2026-08-31T00:00:00.000Z"
        termination_reason: VOLUNTARY
        company_id: cmp_9Zx8Cv7Bn6Mq5Wp4Er3T
        language_locale: en-US
        currency: USD
        timezone: America/New_York
        image_url: null
        telephones: []
        address: {}
        groups: []
        locations: []
        storage_quota_allocated: 0
        storage_quota_used: 0
        storage_quota_available: 0
        has_mfa: false
        timeoff_days_total: 0
        metadata: {}
        raw:
          EmployeeID: "10088"
          Status: Terminated

conformance:
  - name: a credential that was sent is described as missing
    source: https://api.unified.to/hris/1/employee
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /hris/1/employee
      headers:
        authorization: notarealkey
    expect:
      status: 401
      body:
        # The same sentence a request with no header at all receives.
        message: Missing authentication
        error: Unauthorized
        statusCode: 401

  - name: and a request with no header gets the same sentence
    source: https://api.unified.to/hris/1/employee
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /hris/1/employee
      headers: {}
    expect:
      status: 401
      body:
        message: Missing authentication
        error: Unauthorized
        statusCode: 401

  - name: an unrouted path says the same two words twice
    source: https://api.unified.to/cauldron-nope
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        error: Not Found
        message: Not Found
        statusCode: 404

  - name: and a wrong method is the same 404
    source: https://api.unified.to/hris/1/employee
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: PUT
      path: /hris/1/employee
      headers: {}
    expect:
      status: 404
      body:
        error: Not Found
        message: Not Found

  - name: a field name concatenates two countries
    source: https://api.unified.to/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
    expect:
      status: 200
      body:
        # The United States' abbreviation and Canada's, on a record served
        # from three data regions.
        '[0].ssn_sin': null
        '[0].date_of_birth': "1815-12-10"
        '[0].pronouns': she/her
        '[1].pronouns': null
        '[0].gender': FEMALE
        '[0].marital_status': null
        '[0].salutation': null
        '[0].bio': ""
        '[1].bio': null

  - name: an employee carries a storage quota three times
    source: https://api.unified.to/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
    expect:
      status: 200
      body:
        # And the third is the first minus the second.
        '[0].storage_quota_allocated': 107374182400
        '[0].storage_quota_used': 21474836480
        '[0].storage_quota_available': 85899345920
        # Beside a security posture.
        '[0].has_mfa': true
        '[1].has_mfa': false
        '[0].timeoff_days_total': 25

  - name: the untransformed upstream object rides under a name a parameter uses
    source: https://api.unified.to/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
    expect:
      status: 200
      body:
        # raw the property: the upstream payload. raw the query parameter: a
        # percent-encoded query string for the upstream request.
        '[0].raw.EmployeeID': "10041"
        '[0].raw.Status': Active
        '[1].raw.Status': Terminated
        '[0].metadata': {}

  - name: the singular path lists people
    source: https://api.unified.to/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
      query:
        limit: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # /employee, and two of them came back before this page.
        '[0].id': emp_4Nb6Vc8Xz2Qa9Ws1Ed3R
        '[0].name': Grace Hopper
        '[0].manager_id': emp_7Kq2mX9pLz4vB1nR8sT3
        '[0].employment_status': TERMINATED
        '[0].terminated_at': "2026-08-31T00:00:00.000Z"
        '[0].termination_reason': VOLUNTARY

  - name: the record carries its locale its currency and its timezone
    source: https://api.unified.to/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
    expect:
      status: 200
      body:
        '[0].language_locale': en-GB
        '[0].currency': GBP
        '[0].timezone': Europe/London
        '[1].currency': USD
        '[0].emails[0].email': ada@example.com
        '[0].emails[0].type': work
        '[1].emails': []
        '[0].telephones[0].telephone': "+441234567890"
        '[0].address.country': GB
        '[1].address': {}
        '[0].groups[0].id': grp_3Hd8jK1mN5pQ7rS9tU2v
        '[0].locations[0].id': loc_4Nb6Vc8Xz2Qa9Ws1Ed3R
        '[0].company_id': cmp_9Zx8Cv7Bn6Mq5Wp4Er3T
        '[0].employee_number': EMP-0041
        '[0].title': Principal Engineer
        '[0].employment_type': FULL_TIME
        '[0].hired_at': "2019-03-04T00:00:00.000Z"
        '[0].created_at': "2019-03-04T09:12:03.000Z"
        '[0].updated_at': "2026-09-02T13:05:41.000Z"
        '[0].image_url': https://example.com/avatars/0041.png
        '[1].image_url': null
        '[0].first_name': Ada
        '[0].last_name': Lovelace

  - name: a connection with no employees answers a bare empty array
    source: https://api.unified.to/openapi.json
    fixture: empty
    request:
      method: GET
      path: /hris/cnx_1/employee
      headers:
        authorization: cauldr0nf1xturek3y0000000000000000
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
