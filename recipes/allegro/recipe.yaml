# Allegro Recipe for Cauldron
#
# Written against the OpenAPI 3.0 description Allegro publishes at
# developer.allegro.pl/swagger.yaml -- a megabyte and a half of it, covering a
# hundred and seventy-two paths. Every enum value, status code, field name and
# quoted sentence below was read out of that document.
#
# The reason this Recipe exists is that an Allegro order exists before it is
# paid, and its data can still change afterwards.
#
# The endpoint is not called orders. It is /order/checkout-forms, and the name
# is the warning: what you are listing is a form somebody is in the middle of
# filling in. Allegro's own descriptions of the four states say it plainly:
#
#   BOUGHT                -- "purchase without checkout form filled in"
#   FILLED_IN             -- "checkout form filled in but payment is not
#                            completed yet so data could still change"
#   READY_FOR_PROCESSING  -- "payment completed. Purchase is ready for
#                            processing"
#   CANCELLED             -- "purchase cancelled by buyer"
#
# So a row appears in the listing before the buyer has entered an address, and
# the address that appears next is not final. Only the third state means the
# money arrived. An integration that treats "a new order appeared" as "pick,
# pack and ship" ships against a delivery address the buyer can still edit,
# for an order that may never be paid -- and nothing errors, because nothing
# went wrong.
#
# Eight more, each from the same document:
#
#   1. There are two status fields and they are different machines. status is
#      the buyer's progress through checkout; fulfillment.status is the
#      seller's own -- NEW, PROCESSING, READY_FOR_SHIPMENT, READY_FOR_PICKUP,
#      SENT, PICKED_UP, CANCELLED, SUSPENDED, RETURNED. Both can say
#      CANCELLED and they do not mean the same thing.
#   2. The seller's status is not entirely the seller's. The description says
#      RETURNED "cannot be set by the seller" and moves on its own, and SENT
#      moves on its own too when a tracking number is added and a setting in
#      the sales centre is enabled -- a setting this API does not expose. So
#      the same write produces a different status in two accounts.
#   3. The API version is in the Accept header, not the URL.
#      application/vnd.allegro.public.v1+json appears on seven hundred and
#      three operations and application/vnd.allegro.beta.v1+json on
#      fifty-eight more, so parts of one API are on a beta media type. A
#      request that asks for application/json is answered 406 Not Acceptable,
#      which the document lists as a response.
#   4. Money is a decimal string, and the schema says why: "The amount
#      provided in a string format to avoid rounding errors." An amount is
#      "123.45" with the currency beside it as an ISO 4217 code.
#   5. A limit or offset outside its range is 422 rather than a clamp or a
#      400. The document's own wording: "Returned when limit or offset value
#      is outside an acceptable range."
#   6. Every checkout form carries a revision -- a short hash, '819b5836' in
#      the example -- which is how a seller notices the buyer edited
#      something. Nothing else in the payload says a form has moved.
#   7. Every failure carries two messages. message is "directed to the
#      developer of the program" and "will always be in English";
#      userMessage "can be presented directly to your user", contains no
#      technical information, and is translated from the Accept-Language
#      header. A client that shows the first to a shopper shows English
#      debugging prose, and one that logs the second logs a sentence whose
#      language depends on the request.
#   8. Except on a 401, which is not that shape at all. AuthError is
#      {error, error_description} -- an OAuth2 body rather than Allegro's own
#      -- so the unwrapping every other failure needs finds nothing there and
#      a client reports the reason as undefined.
#
# The two counts are named apart, count for what came back and totalCount for
# "Number of all objects of requested status(es) available (regardless of the
# provided limit and offset)". That is the same honest arrangement
# commercetools has and is stated as shared rather than claimed here.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The 406 is served by a fallback route, so any Accept other than the
#     vendor media type gets it, including a request that sends no Accept at
#     all. Allegro's behaviour for a missing Accept is not documented, so this
#     refuses something that may well work. That is the loud direction of the
#     mistake.
#   - The 422 for an out-of-range limit is declared and injectable rather than
#     raised: Cauldron can refuse a page larger than a ceiling and cannot yet
#     refuse an offset.
#   - Two true declarations here cannot be fully checked, because Allegro's
#     envelope echoes neither of them back. It sends checkoutForms, count and
#     totalCount and no limit and no offset, so the documented default page
#     size of a hundred is only observable through count -- which pins it as
#     at least the size of the fixture and no more than that -- and the
#     documented offset origin of nought is not observable at all. Both are
#     read out of the document; neither is something a case here can hold to
#     account, and saying so is better than leaving an unchecked claim to look
#     like a checked one.
#   - Nothing here changes state. Fulfillment updates, shipments, invoices,
#     refunds, returns and the whole offer and category model are absent.
#     Reading checkout forms only.
#   - Allegro's writes are commands with a processing status of their own,
#     which is a shape worth modelling and is not modelled here.
#
# The token below is a fixture and belongs to no seller.

recipe: allegro
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.allegro.pl/documentation
  spec: https://developer.allegro.pl/swagger.yaml
  spec_hash: c16cd58041f1600c96814598f91c3e88adefaee0f8e74029b3f87769e74e4d24
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.allegro.fixture.token.000
  # Verified live: a present, wrong Bearer value is a different failure from
  # an absent header. This file had modelled a present wrong token as the
  # absent-header message before that was checked. See the cases below.
  rejected_error: invalid_token_error
  # Verified live: a wrong method on a real path answers 405 with no
  # credential sent at all, so routing is decided before authentication.
  after_routing: true

responses:
  list:
    style: wrapped
    key: checkoutForms
    # Everything matching the filter, whatever the page.
    count_field: totalCount
    # And what came back, which Allegro names separately rather than making
    # one field mean both.
    page_count_field: count
  resource:
    style: bare
  error:
    # ErrorsHolder: {errors: [{code, message, userMessage, details, path}]}.
    # One request can fail several ways, so the failures arrive as an array
    # whether or not there is more than one of them.
    style: list
    key: errors
    # "A message directed to the developer of the program. This message will
    # always be in English."
    message_field: message
    code_field: code
    code_type: string
    type_field: "-"

resources:
  checkoutform:
    id:
      # A UUID, which is what the document's examples show.
      style: uuid
    fields:
      # The buyer's progress through checkout, and the field that says whether
      # any money has arrived.
      status:
        type: string
        default: BOUGHT
      # The seller's own machine, in a different object, with a different
      # vocabulary. Absent until there is something to fulfil.
      fulfillment:
        type: map
      # Absent while the form is still being filled in.
      delivery:
        type: map
      payment:
        type: map
      buyer:
        type: map
      lineItems:
        type: list
      # totalToPay, and nothing else. A decimal string with a currency.
      summary:
        type: map
      marketplace:
        type: map
      messageToSeller:
        type: string
        null_when_unset: true
      # The short hash that moves when the form does.
      revision:
        type: string
      updatedAt:
        type: string

routes:
  # The listing, for a client that asked for the version it wants.
  - method: GET
    path: /order/checkout-forms
    resource: checkoutform
    operation: list
    matches_header:
      Accept: application/vnd.allegro.public.v1+json
    filters:
      # No default. Allegro filters nothing unless asked, which means the
      # first page of a seller's orders contains rows that are not orders
      # yet.
      - param: status
        field: status
    pagination:
      style: offset
      # The documented default, which is also the documented maximum.
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: offset
      # An offset counts records from nought.
      first_page: 0
      over_limit: out_of_range

  # And the same path for a client that asked for anything else.
  - method: GET
    path: /order/checkout-forms
    error: not_acceptable

  - method: GET
    path: /order/checkout-forms/{id}
    resource: checkoutform
    operation: get
    matches_header:
      Accept: application/vnd.allegro.public.v1+json

  - method: GET
    path: /order/checkout-forms/{id}
    error: not_acceptable

errors:
  # The version negotiation failing, which is what a client written against
  # any other REST API gets on its first request. Code, message and example
  # are the document's own.
  # Verified live against api.allegro.pl: the userMessage here was "The
  # request contains incorrect data. Contact the author of the
  # application.", and Allegro actually sends "Request contains invalid
  # data. Contact the application author." -- a different sentence, not a
  # paraphrase this file had gotten close enough to notice was wrong.
  # details and path were "" and are null on the wire.
  not_acceptable:
    status: 406
    code: NotAcceptableException
    message: Not acceptable representation requested. Please check 'Accept' request header
    fields:
      # The second message, which is the one to show a person. "It will not
      # contain any technical information. This message is translated based on
      # the value of the Accept-Language header."
      userMessage: Request contains invalid data. Contact the application author.
      details: null
      path: null

  # Verified live: a method this path does not accept, struck with no
  # credential sent at all -- routing is decided first, see auth above.
  method_not_allowed:
    status: 405
    code: NotAllowedException
    message: The HTTP method is not allowed
    fields:
      userMessage: An error occurred
      # null on the wire, not an empty string -- checked, unlike the
      # not_acceptable entry above which was never struck live.
      details: null
      path: null

  # Verified live: a path this API has never heard of.
  unknown_route:
    status: 404
    code: NotFoundException
    message: Not found
    fields:
      userMessage: Feature unavailable. Contact the application author.
      details: null
      path: null

  # "Returned when limit or offset value is outside an acceptable range" --
  # not a clamp, and not the 400 that the same endpoint uses for an illegal
  # parameter value.
  out_of_range:
    status: 422
    code: InvalidRangeException
    message: Provided limit or offset value is outside an acceptable range.
    fields:
      userMessage: The request contains incorrect data. Contact the author of the application.

  # And the one failure that is not that shape at all. AuthError is
  # {error, error_description} -- an OAuth2 body rather than Allegro's own --
  # so a client that unwraps errors[0].message reads undefined on a 401 and
  # reports the reason as "undefined".
  # Verified live against api.allegro.pl with no Authorization header at
  # all: exactly this, byte for byte.
  authentication_error:
    status: 401
    style: flat
    key: "-"
    message_field: error_description
    code_field: error
    code: unauthorized
    message: Full authentication is required to access this resource

  # Verified live: a present Bearer value Allegro cannot parse as a token at
  # all -- any string, real-token-shaped or not -- gets this instead of the
  # message above. Same OAuth2 envelope, different error and description.
  invalid_token_error:
    status: 401
    style: flat
    key: "-"
    message_field: error_description
    code_field: error
    code: invalid_token
    message: Cannot convert access token to JSON

  resource_missing:
    status: 404
    code: NotFoundException
    message: Checkout form not found.
    fields:
      userMessage: The requested resource could not be found.

fixtures:
  empty: {}

  # One seller's list, in three states. Two of the three are not orders in any
  # sense a warehouse would recognise, and all three are in the listing.
  seller:
    checkoutform:
      # Bought, and nothing else. No address, no payment, no fulfilment -- the
      # buyer has clicked buy and stopped there.
      - id: 9dbd7b47-3b0f-4b8f-9c7f-1d3a5c02f6ea
        status: BOUGHT
        revision: 819b5836
        updatedAt: "2026-02-17T09:12:44.133Z"
        buyer:
          id: b7c1a29d
          login: kupujacy_1
          email: kupujacy_1@allegromail.pl
