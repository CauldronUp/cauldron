conformance:
  - name: an order appears before the buyer has given an address
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?limit=1
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # BOUGHT, which the document defines as "purchase without checkout
        # form filled in". It is in the seller's list and there is nowhere to
        # send it.
        "checkoutForms[0].status": BOUGHT
        "checkoutForms[0].summary.totalToPay.amount": "129.98"
      absent:
        - "checkoutForms[0].delivery"
        - "checkoutForms[0].payment"
        - "checkoutForms[0].fulfillment"

  - name: and the address that appears next can still change
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms/3f5a1c96-8e40-4b23-a7d6-05b9e2c47f18
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # FILLED_IN: "checkout form filled in but payment is not completed yet
        # so data could still change". There is an address, and printing a
        # label from it is a bet.
        status: FILLED_IN
        "delivery.address.city": Warszawa
        # The only thing that moves when the buyer edits the form.
        revision: a41c7de2
      absent:
        # Still no money, and still nothing for a warehouse to do.
        - payment
        - fulfillment

  - name: only the third state means the money arrived
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?status=READY_FOR_PROCESSING
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # One of the three, and the filter is opt in: a listing with no status
        # asks for everything, so the default view of a seller's orders is
        # mostly things that are not orders yet.
        count: 1
        "checkoutForms[0].status": READY_FOR_PROCESSING
        "checkoutForms[0].payment.paidAmount.amount": "97.50"

  - name: there are two status fields and they are different machines
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms/6c2e8f31-9a54-4d07-b1e8-42f0a7d3c956
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # The buyer's, at the end of its run.
        status: READY_FOR_PROCESSING
        # And the seller's, at the start of its own -- a different vocabulary
        # in a different object. Both can say CANCELLED and neither means the
        # other's cancellation. RETURNED, further along, is one the seller
        # cannot set at all: the document says it "cannot be set by the
        # seller" and moves on its own.
        "fulfillment.status": NEW
        "fulfillment.shipmentSummary.lineItemsSent": NONE
        "fulfillment.provider.id": SELLER

  - name: money is a decimal string with the currency beside it
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms/6c2e8f31-9a54-4d07-b1e8-42f0a7d3c956
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # "The amount provided in a string format to avoid rounding errors",
        # which is the schema's own reason. Parsing it as a float undoes the
        # care, and comparing it as a string to 97.5 fails.
        "summary.totalToPay.amount": "97.50"
        "summary.totalToPay.currency": PLN
        "delivery.cost.amount": "12.50"
        "lineItems[0].price.amount": "85.00"

  - name: the version travels in the Accept header
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?limit=1
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      # Seven hundred and three operations declare this media type and
      # fifty-eight more declare a beta one, so the version is a property of
      # the request rather than of the URL.
      status: 200
      body:
        count: 1

  - name: and asking for plain JSON is refused
    # Corrected against a live check: this had asserted "The request
    # contains incorrect data. Contact the author of the application." for
    # userMessage. api.allegro.pl actually sends "Request contains invalid
    # data. Contact the application author." -- a different sentence.
    source: https://developer.allegro.pl/swagger.yaml
    verified: "2026-09-05"
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?limit=1
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/json
    expect:
      # 406, which the document lists as a response on this endpoint. A client
      # written against any other REST API sends application/json and never
      # gets past its first request -- which is the loud kind of failure, and
      # the reason it is worth serving rather than smoothing over.
      status: 406
      body:
        # The document's own example code, and a message written for whoever
        # is debugging rather than for whoever is shopping.
        "errors[0].code": NotAcceptableException
        # The other message, which is the one to show a person and which the
        # Accept-Language header translates. A client that logs this and
        # displays the one above has them the wrong way round.
        "errors[0].userMessage": Request contains invalid data. Contact the application author.
      matches:
        "errors[0].message": Please check 'Accept' request header

  - name: the two counts are named apart
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?limit=1&offset=1
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # count is "number of returned objects"; totalCount is "Number of all
        # objects of requested status(es) available (regardless of the
        # provided limit and offset)".
        count: 1
        totalCount: 3
        "checkoutForms[0].status": FILLED_IN

  - name: a request naming no page size gets a hundred
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      status: 200
      body:
        # The documented default, which is also the documented maximum, so a
        # hundred is both the most and the usual.
        #
        # count is the only view of it. Three records come back, which proves
        # the default is at least three and cannot prove it is a hundred --
        # Allegro's envelope carries no limit to compare against. A default
        # set too low is caught here; one set too high is not, and the note at
        # the top of this file says so rather than leaving the gap silent.
        count: 3
        totalCount: 3

  - name: a page larger than the maximum is refused
    source: https://developer.allegro.pl/swagger.yaml
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms?limit=250
      headers:
        Authorization: Bearer cauldron.allegro.fixture.token.000
        Accept: application/vnd.allegro.public.v1+json
    expect:
      # 422, and the document says why: "Returned when limit or offset value
      # is outside an acceptable range". Not a clamp, and not the 400 the same
      # endpoint uses for an illegal parameter value -- so a client that
      # branches on 400 for bad input takes neither branch.
      status: 422
      body:
        "errors[0].code": InvalidRangeException
      matches:
        "errors[0].message": outside an acceptable range

  - name: and a bad token is not that shape at all
    # Corrected against a live check: this had claimed a present, wrong
    # token gets "unauthorized" / "Full authentication is required to
    # access this resource" -- which is what api.allegro.pl actually sends
    # for no Authorization header at all (see the case below). A token that
    # is present and simply not one Allegro can parse gets a different
    # error and a different sentence, checked with this exact request.
    source: https://developer.allegro.pl/swagger.yaml
    verified: "2026-09-05"
    fixture: seller
    request:
      method: GET
      path: /order/checkout-forms
      headers:
        Authorization: Bearer not-a-real-token
        Accept: application/vnd.allegro.public.v1+json
    expect:
      # AuthError is {error, error_description}: an OAuth2 body rather than
      # Allegro's own. One API, two envelopes, and the boundary is
      # authentication.
      status: 401
      body:
        error: invalid_token
        error_description: Cannot convert access token to JSON
      absent:
        # No errors array, so the unwrapping every other failure needs finds
        # nothing here and a client reports the reason as undefined.
        - errors

  - name: and no Authorization header at all is a different failure again
    # Struck live: the message this file previously (and wrongly) attached
    # to a present, bad token. An entirely absent header gets it for real.
