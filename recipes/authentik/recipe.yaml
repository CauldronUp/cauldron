# authentik Recipe for Cauldron
#
# Written against authentik's own generated OpenAPI 3.0.3 document, published in
# its own repository -- github.com/goauthentik/authentik, schema.yml, 613 paths,
# version 2026.11.0-rc1 -- read on 2026-09-06. authentik is self-hosted and
# there is no public instance, so nothing here is verified live: every claim is
# the provider's own document.
#
# **A null relation means "you did not ask", not "there are none".**
#
# A group carries four pairs of fields: `parents` and `parents_obj`, `users` and
# `users_obj`, `children` and `children_obj`, `roles` and `roles_obj`. The bare
# name is an array of identifiers and takes writes; the `_obj` name is readOnly
# and holds the expanded records.
#
# Whether the expanded ones are filled is decided by four query parameters, and
# they do not agree about their defaults:
#
#   include_users            default true
#   include_parents          default false
#   include_children         default false
#   include_inherited_roles  default false
#
# Three of the four `_obj` fields are declared `nullable: true` AND listed in
# `required`, so they are always present and may be null. So `group.users_obj`
# is a populated array by default and `group.parents_obj` is null on the same
# response -- not because the group has no parents, but because nobody passed
# `include_parents=true`.
#
# A client reading `group.parents_obj.length` throws. One reading
# `if (group.parents_obj)` decides the group is a root. Both are wrong in the
# same direction, and the group may have parents.
#
# `roles_obj` is required and NOT nullable, while `inherited_roles_obj` is
# required and nullable, in the same object, next to each other. So one of the
# two sibling role fields can be null and the other cannot.
#
# **Two identifiers, and the path takes the long one.**
#
# Every group carries `pk`, a UUID string, and `num_pk`, an integer -- both
# required. The path is `/core/groups/{group_uuid}/`, so `pk` is what addresses
# a group and `num_pk` is Django's own integer primary key, exposed and useless
# for fetching. A client that stores the shorter, cheaper-looking one cannot get
# the record back.
#
# **The paging block has no URLs and no nulls.**
#
# `pagination` is `{next, previous, count, current, total_pages, start_index,
# end_index}` -- and `next` and `previous` are `type: number`, both listed in
# `required`. Not URLs, not nullable, not optional. So the usual test for the
# end of a listing -- `next == null`, or the key being absent -- never fires
# here, because the key is always there holding a number. What that number is on
# the last page the document does not say, which is exactly the thing a client
# needs and the thing it has to discover by running out of pages.
#
# **Every listing carries a required field whose schema says nothing.**
#
# `PaginatedGroupList` requires three keys: `pagination`, `results` and
# `autocomplete`. `Autocomplete` is declared, in full, as
# `{"type": "object", "additionalProperties": {}}` -- an object with no
# described properties. A generated client gets a required field it cannot type,
# on every paginated listing in a 613-path API.
#
# **`is_superuser` is on the group and is optional.**
#
# Its own description: "Users added to this group will be superusers." That is
# the most consequential boolean in an identity provider, and it is not in the
# schema's `required` list -- so a response may omit it, and `undefined` is
# falsy. Code that renders a warning when `group.is_superuser` is true renders
# nothing for a group whose response left the key out.
#
# **One of the four declared credential schemes is not a registered one.**
#
# `authentik_device_auth` declares `type: http` with `scheme: bearer+agent`.
# `bearer+agent` is not in the IANA Authentication Scheme registry, which
# OpenAPI's own wording says the value SHOULD be. It appears on 33 operations,
# always beside plain `bearer`, so it is an alternative rather than a
# requirement -- but a generator that maps `type: http` onto a library's
# built-in bearer helper produces the wrong header for it, and a proxy
# validating the scheme token rejects it.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. authentik is self-hosted and
#     there is no public instance.
#   - Groups, listed and fetched. 613 paths is an identity provider: users,
#     applications, providers, sources, flows, stages, policies, outposts,
#     tokens and the whole endpoints surface each want their own evidence.
#   - `pagination.next` and `pagination.previous` are served as page numbers,
#     which is what the document types them as. What the provider puts there on
#     the last page is not stated in the document and is not guessed at here.
#   - `autocomplete` is served as an empty object, because an object with no
#     described properties is what the document declares. Filling it would be
#     inventing a shape.
#   - The four include_* parameters are modelled for users and parents, which is
#     enough to show that a null relation means "not asked for". children and
#     inherited roles are declared and left null.
#   - `bearer+agent` is recorded and not served. The credential checked here is
#     the plain bearer that every one of those 33 operations also accepts.

recipe: authentik
capability: auth
version: 0.1.0

upstream:
  api: "2026.11.0"
  docs: https://docs.goauthentik.io/developer-docs/api/
  spec: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
  spec_hash: 979a6960079564c0dd2566c85c90e3bb97e2043317ce46aa7f0e6f31b6cd9807
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-authentik-token-0000000000
  absent_error: forbidden

responses:
  list:
    style: wrapped
    key: results
    count_field: pagination.count
    page_field: pagination.current
    pages_field: pagination.total_pages
  error:
    style: flat
    message_field: detail
    code_field: code

resources:
  group:
    id:
      # The UUID, which is what the path takes.
      style: uuid
      field: pk
    fields:
      # Django's own integer primary key, exposed beside the UUID and required
      # -- and no path anywhere takes it.
      num_pk:
        type: number
      name:
        type: string
        required: true
      # The most consequential boolean in an identity provider, and the schema
      # does not require it.
      is_superuser:
        type: boolean
        default: false
      # The writable half of each pair: arrays of identifiers.
      parents:
        type: list
      users:
        type: list
      # The read-only half. Present and null unless the matching include_
      # parameter asked for them -- and the defaults disagree.
      parents_obj:
      users_obj:
      children_obj:
      # Required and not nullable, unlike inherited_roles_obj next to it.
      roles_obj:
        type: list
      inherited_roles_obj:
      # A free-form tree, and the only place a deployment puts its own data.
      attributes:

routes:
  - method: GET
    path: /api/v3/core/groups/
    resource: group
    operation: list
    fields:
      # Required on every paginated listing in this API, and declared as an
      # object with no properties. Served empty because that is all the
      # document says.
      autocomplete: {}
    pagination:
      style: page
      limit_param: page_size
      cursor_param: page
      limit: 20
      first_page: 1

  - method: GET
    path: /api/v3/core/groups/{id}/
    resource: group
    operation: get
    not_found: not_found

errors:
  # authentik answers 403 rather than 401 where the document declares a
  # failure on these routes: GET /core/groups/{uuid}/ lists 400 and 403 and no
  # 401 at all.
  forbidden:
    status: 403
    message: "Authentication credentials were not provided."
  not_found:
    status: 404
    message: "Not found."
  invalid:
    status: 400
    code: invalid
    message: "This field is required."
    fields:
      # A validation failure's shape is the failing field's name, because
      # ValidationError declares additionalProperties -- so the keys of an
      # error body are not knowable in advance.
      non_field_errors: []
  rate_limit:
    status: 429
    message: "Request was throttled."

fixtures:
  empty:
    group: []

  directory:
    group:
      - pk: 9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f
        num_pk: 3
        name: authentik Admins
        is_superuser: true
        parents: []
        users: [1, 2]
        users_obj:
          - pk: 1
            username: akadmin
          - pk: 2
            username: cauldron
        # Null because include_parents defaults to false, not because this
        # group is a root.
        parents_obj: null
        children_obj: null
        roles_obj: []
        inherited_roles_obj: null
        attributes: {}
      - pk: 2b7d8e9f-0a1b-4c2d-9e3f-4a5b6c7d8e9f
        num_pk: 4
        name: Viewers
        is_superuser: false
        parents:
          - 9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f
        users: [2]
        users_obj:
          - pk: 2
            username: cauldron
        parents_obj: null
        children_obj: null
        roles_obj: []
        inherited_roles_obj: null
        attributes: {}

conformance:
  - name: a null relation means you did not ask, not that there are none
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # include_users defaults to true, so this one is filled.
        'results[1].users_obj[0].username': cauldron
        # And include_parents defaults to false, so this one is null -- on a
        # group that has a parent, which the writable half right beside it
        # names.
        'results[1].parents_obj': null
        'results[1].parents[0]': 9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f

  - name: three sibling relations default to false and one defaults to true
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # Same naming, same shape, opposite defaults. Reading .length on any
        # of the three nulls throws, and reading truthiness decides the group
        # has none.
        'results[0].children_obj': null
        'results[0].inherited_roles_obj': null
        'results[0].parents_obj': null
      matches:
        # And the one that is filled.
        'results[0].users_obj[0].username': '^akadmin$'

  - name: the paging block holds numbers, and never a null
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      query:
        page: "1"
        page_size: "20"
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # next and previous are typed number and listed in required, so the
        # usual end-of-listing test -- next == null, or the key being absent
        # -- never fires.
        'pagination.count': 2
        'pagination.current': 1
        'pagination.total_pages': 1

  - name: every listing carries a required field with no described shape
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # PaginatedGroupList requires pagination, results and autocomplete.
        # Autocomplete is declared as an object with no properties, so a
        # generated client gets a required field it cannot type.
        autocomplete: {}

  - name: two identifiers, and the path takes the long one
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        pk: 9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f
        # Django's integer primary key, required and addressable by nothing.
        num_pk: 3
        name: authentik Admins

  - name: fetching by the integer identifier finds nothing
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/3/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      # The one a client is most likely to have stored, because it is shorter
      # and looks like a key.
      status: 404
      body:
        detail: "Not found."

  - name: the superuser flag is on the group
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # "Users added to this group will be superusers", in the schema's own
        # words -- and the schema does not list it in required, so a response
        # may omit it and undefined is falsy.
        'results[0].is_superuser': true
        'results[1].is_superuser': false
        'results[0].name': authentik Admins

  - name: no credential is a 403, and the document declares no 401
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers: {}
    expect:
      # GET /core/groups/{group_uuid}/ declares 400 and 403 and no 401 at all,
      # so a client branching on 401 to refresh a token never refreshes.
      status: 403
      body:
        detail: "Authentication credentials were not provided."

  - name: "a validation failure says so in these words"
    source: "https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml"
    arm: invalid
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 400
      body:
        detail: "This field is required."
        # GenericError declares detail and code, and code is the machine
        # half -- the prose in detail is what a serializer produced for
        # whichever field failed.
        code: invalid
        # ValidationError declares additionalProperties, so the other keys of
        # an error body are the names of whichever fields failed -- not
        # knowable in advance, and not the same twice.
        non_field_errors: []

  - name: "the rate limit says so in these words"
    source: "https://docs.goauthentik.io/developer-docs/api/"
    arm: rate_limit
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 429
      body:
        detail: "Request was throttled."

  - name: the writable half of each pair is identifiers, not records
    source: https://raw.githubusercontent.com/goauthentik/authentik/main/schema.yml
    fixture: directory
    request:
      method: GET
      path: /api/v3/core/groups/9c4c1e3f-6a2b-4d5e-8f70-1a2b3c4d5e6f/
      headers:
        Authorization: Bearer cauldron-authentik-token-0000000000
    expect:
      status: 200
      body:
        # users is an array of integers -- the users' own num_pk, not their
        # uuids -- and users_obj is the expanded form. So a group references
        # its members by the identifier a user's own path does not take,
        # which is the same trap one level down.
        'users[0]': 1
        'users[1]': 2
        'users_obj[0].username': akadmin
        # roles_obj is required and not nullable, so it is an empty array
        # where its sibling inherited_roles_obj is null.
        roles_obj: []
        inherited_roles_obj: null
        # And the free-form tree every deployment fills differently.
        attributes: {}
