# Statsig Recipe for Cauldron
#
# Written against Statsig's Console API reference at docs.statsig.com and
# struck live against statsigapi.net on 2026-09-07 with no credential, then
# with a deliberately invalid one, then on a path that does not exist.
#
# **Three different mistakes, one response, and it is not JSON.** Struck live:
#
#   GET /console/v1/gates                            (no credential)
#   GET /console/v1/gates                            STATSIG-API-KEY: not-a-real-key
#   GET /console/v1/cauldron-nope                    STATSIG-API-KEY: not-a-real-key
#
#   401
#   (no Content-Type header at all)
#   Unauthorized
#
# Eleven bytes. No object, no field, no quotes, and **no Content-Type** -- so a
# client cannot even ask what it was given. `response.json()` throws;
# `response.text()` returns a word; and the same word is the answer to "I sent
# nothing", "I sent the wrong key" and "that endpoint does not exist".
#
# From outside, this API is opaque. A caller without a working key cannot
# discover whether a route exists, cannot tell a typo from a permissions
# problem, and cannot parse anything. That is a defensible security posture and
# it is worth being explicit that it is one: the same design that gives an
# attacker nothing gives a developer nothing.
#
# It also means every Statsig client library has a branch that reads the body
# as text on a 401 and as JSON on everything else, and the failing path is the
# one nobody exercises.
#
# **The credential header is `STATSIG-API-KEY`.** Screaming snake case with
# hyphens, which is not a convention anything else here uses -- HTTP header
# names are case-insensitive so it does not matter on the wire, and every code
# sample and every reader's memory carries the shouting.
#
# **The key names its own environment.** A Console API key begins `console-`, a
# server key begins `secret-`, a client key `client-`. So the prefix says which
# of three surfaces a key opens, and sending a server key to the Console API is
# refused with the same eleven bytes as sending nothing.

recipe: statsig
capability: flags
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.statsig.com/console-api/introduction
  # No spec: Statsig's Console API reference is a rendered documentation site.

auth:
  scheme: header
  header: STATSIG-API-KEY
  # The prefix that says which of three surfaces a key opens. A secret- or
  # client- key here is refused exactly like no key at all.
  shape: '^console-[A-Za-z0-9]+$'
  keys:
    - console-cauldronfixturekey000000000000
  # One answer for all three mistakes, struck live.
  absent_error: unauthorized
  shape_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: data

resources:
  gate:
    id:
      field: id
      style: opaque
    fields:
      name:
        type: string
      description:
        type: string
      isEnabled:
        type: boolean
        default: true
      lastModifierName:
        type: string
      lastModifiedTime:
        type: timestamp_ms
      checksPerHour:
        type: number
        default: 0

routes:
  - method: GET
    path: /console/v1/gates
    resource: gate
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: limit
      cursor_param: page

errors:
  unauthorized:
    status: 401
    # Eleven bytes, no envelope. Served as text because there is no shape to
    # serve it through: no object, no field, no quotes.
    style: text
    message: "Unauthorized"

fixtures:
  empty:
    gate: []

  project:
    gate:
      - id: new_checkout
        name: new_checkout
        description: The rebuilt checkout flow
        isEnabled: true
        lastModifierName: Ada Lovelace
        lastModifiedTime: 1788432000000
        checksPerHour: 14203.5
      - id: legacy_export
        name: legacy_export
        description: ""
        # Disabled and still evaluated: a gate that is off still answers every
        # check, and checksPerHour counts those. So traffic on a disabled gate
        # is not a bug, and a number here does not mean anyone is being let
        # through.
        isEnabled: false
        lastModifierName: Grace Hopper
        lastModifiedTime: 1786012800000
        checksPerHour: 8.25

conformance:
  - name: no credential answers eleven bytes with no content type
    source: https://statsigapi.net/console/v1/gates
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers: {}
    expect:
      status: 401
      # Not JSON, not an object, not a field. response.json() throws and
      # response.text() returns a word.
      #
      # Struck live, the real response also carries no Content-Type header at
      # all, so a client cannot even ask what it was handed. This format has
      # no way to omit one and the emulator sends text/plain; the absence is
      # recorded in the README rather than asserted here, because asserting
      # what is served would be asserting the wrong thing.
      body_matches: '^Unauthorized$'

  - name: a wrong key is the same eleven bytes
    source: https://statsigapi.net/console/v1/gates
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: not-a-real-key
    expect:
      status: 401
      body_matches: '^Unauthorized$'

  - name: an unknown path is the same eleven bytes again
    source: https://statsigapi.net/console/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /console/v1/cauldron-nope
      headers:
        STATSIG-API-KEY: not-a-real-key
    expect:
      # Struck live: 401, not 404. Three different mistakes, one answer, so a
      # caller without a working key cannot find out whether a route exists.
      status: 401
      body_matches: '^Unauthorized$'

  - name: a key for another surface is refused like no key at all
    source: https://docs.statsig.com/console-api/introduction
    verified: "2026-09-07"
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        # A server key. The prefix says which of Statsig's three surfaces a
        # key opens, and this is not the Console one.
        STATSIG-API-KEY: secret-cauldronfixturekey00000000000
    expect:
      status: 401
      body_matches: '^Unauthorized$'

  - name: gates are wrapped in data and named by their own id
    source: https://docs.statsig.com/console-api/gates
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
    expect:
      status: 200
      body:
        # id and name are the same string: a Statsig gate is addressed by the
        # name somebody typed, so renaming one changes its identifier.
        'data[0].id': new_checkout
        'data[0].name': new_checkout

  - name: a disabled gate is still being checked
    source: https://docs.statsig.com/console-api/gates
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
    expect:
      status: 200
      body:
        # Off, and answering 8.25 checks an hour. Traffic on a disabled gate
        # is the normal case, so a number here does not mean anyone is being
        # let through.
        'data[1].isEnabled': false
        'data[1].checksPerHour': 8.25

  - name: a description can be empty rather than absent
    source: https://docs.statsig.com/console-api/gates
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
    expect:
      status: 200
      body:
        # An empty string, not null and not missing -- so three ways of
        # meaning "nothing" and this API uses the one a falsy check catches
        # and an existence check does not.
        'data[1].description': ""
        'data[0].description': The rebuilt checkout flow

  - name: the last editor is a name rather than an identifier
    source: https://docs.statsig.com/console-api/gates
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
    expect:
      status: 200
      body:
        # A display name and nothing else: no id, no email. Two people called
        # the same thing are one value, and the field cannot be joined to a
        # user record.
        'data[0].lastModifierName': Ada Lovelace
        'data[0].lastModifiedTime': 1788432000000

  - name: gates page on page and limit
    source: https://docs.statsig.com/console-api/gates
    fixture: project
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
      query:
        page: "2"
        limit: "1"
    expect:
      status: 200
      body:
        'data[0].id': legacy_export

  - name: a project with no gates answers an empty array
    source: https://docs.statsig.com/console-api/gates
    fixture: empty
    request:
      method: GET
      path: /console/v1/gates
      headers:
        STATSIG-API-KEY: console-cauldronfixturekey000000000000
    expect:
      status: 200
      body:
        data: []
