# Okta Recipe for Cauldron
#
# Okta gives you a free developer org, and it is a real identity provider: real
# users, real emails, real password policies, and a rate limit that a test
# suite trips within minutes. Deactivating a user is a two-step dance and
# deleting one is permanent. Worse, the states that matter most are the ones a
# developer org never naturally reaches, because you cannot make a real user
# sit in PASSWORD_EXPIRED or LOCKED_OUT on demand.
#
# Two things worth modelling exactly:
#
#   1. A user's status is a lifecycle, not a boolean. STAGED, PROVISIONED,
#      ACTIVE, LOCKED_OUT, PASSWORD_EXPIRED, SUSPENDED and DEPROVISIONED are
#      seven different answers to "can this person sign in", and only one of
#      them is yes. Code that checks for the absence of DEPROVISIONED lets a
#      suspended user through.
#   2. The user's own attributes live under profile, and the credential
#      material under credentials. Code that reads user.email finds nothing.
#
# Known fidelity gap, stated rather than hidden: Okta pages with a Link
# header, which Cauldron does not model, so cursor paging is not exercised.
#
# Struck live 2026-09-05 against cauldron-test.okta.com -- a subdomain
# nobody provisioned, and Okta's edge answers every one of those identically
# to any org id, confirmed by comparing it against a second, certainly
# unregistered subdomain and getting byte-identical bodies back. That makes
# it a legitimate stand-in for "some Okta org, credential rejected," not a
# real customer's tenant. Three different rejections came back, not the one
# this file declared: no credential at all is a 403 naming an invalid
# session; a right-scheme token nobody issued is the 401 this file already
# had; and the wrong scheme word (Bearer, sent from habit) -- which this
# file's own existing case for exactly that request had asserted the 401
# JSON shape for -- answers no body at all, empty. Split and fixed below.
#
# Tokens below are fixtures, not secrets.

recipe: okta
capability: auth
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.okta.com/docs/api

auth:
  scheme: bearer
  header: Authorization
  # Okta's own scheme for an API token. Not Bearer.
  prefix: "SSWS "
  keys:
    - cauldron_okta_token
  # Three different answers, confirmed live 2026-09-05 against a generic,
  # unprovisioned *.okta.com subdomain (see the header): no credential at
  # all gets a 403 naming an invalid session; the right prefix with a wrong
  # token gets this file's existing 401; the wrong prefix (Bearer, sent from
  # habit) gets no body at all, empty -- which this file's own existing case
  # for that exact request had asserted the 401 JSON shape for instead.
  absent_error: invalid_session
  malformed_error: empty_unauthorized
  rejected_error: authentication_error

responses:
  list:
    style: bare
    # And the next page is advertised in a header rather than in the body,
    # which a bare array has no room for anyway: Okta's own guide says
    # "Pagination links are included in the Link header of responses", with a
    # rel="next" naming the URL of the next page. This Recipe served no
    # pointer at all, so a client following Okta's documented mechanism found
    # nothing to follow.
    link_header: true
  error:
    style: flat
    code_field: errorCode
    message_field: errorSummary
    fields:
      errorId: cauldron00000000000001
      errorCauses: []

resources:
  user:
    id:
      style: opaque
      length: 20
    fields:
      # Seven answers to "can this person sign in", and only ACTIVE is yes.
      # Checking for the absence of DEPROVISIONED lets a suspended user
      # through, and a STAGED one has never had a password at all.
      status:
        type: string
        default: STAGED
      firstName:
        type: string
        in: profile
      lastName:
        type: string
        in: profile
      email:
        type: string
        required: true
        in: profile
      login:
        type: string
        in: profile
      mobilePhone:
        type: string
        in: profile
      created:
        type: datetime
      # Set only when the person has actually signed in. A user who never has
      # is a different thing from one who signed in long ago.
      lastLogin:
        type: datetime
        stamped: false
      statusChanged:
        type: datetime
        stamped: false
      passwordChanged:
        type: datetime
        stamped: false

  group:
    id:
      style: opaque
      length: 20
    fields:
      # An OKTA_GROUP can be edited; an APP_GROUP is owned by an application
      # and writes to it are refused.
      type:
        type: string
        default: OKTA_GROUP
      name:
        type: string
        required: true
        in: profile
      description:
        type: string
        in: profile
      created:
        type: datetime

  application:
    id:
      style: opaque
      length: 20
    fields:
      name:
        type: string
        required: true
      label:
        type: string
      status:
        type: string
        default: ACTIVE
      signOnMode:
        type: string
        default: SAML_2_0
      created:
        type: datetime

routes:
  - method: GET
    path: /api/v1/users
    resource: user
    operation: list
    pagination:
      # Okta's own API guide names both: limit for the page size and after,
      # "a cursor pointing to the end of the returned page", with before for
      # the other direction. limit happens to be the word the runtime
      # supplies and after is not.
      style: cursor
      limit: 200
      limit_param: limit
      cursor_param: after

  - method: POST
    path: /api/v1/users
    resource: user
    operation: create
    # Okta names every step of the lifecycle: create, activate, suspend,
    # deactivate. Only the first is what creating a user does.
    emits: user.lifecycle.create

  - method: GET
    path: /api/v1/users/{id}
    resource: user
    operation: get

  - method: POST
    path: /api/v1/users/{id}
    resource: user
    operation: update

  - method: DELETE
    path: /api/v1/users/{id}
    resource: user
    operation: delete

  - method: GET
    path: /api/v1/groups
    resource: group
    operation: list
    pagination:
      # Okta's own API guide names both: limit for the page size and after,
      # "a cursor pointing to the end of the returned page", with before for
      # the other direction. limit happens to be the word the runtime
      # supplies and after is not.
      style: cursor
      limit: 200
      limit_param: limit
      cursor_param: after

  - method: GET
    path: /api/v1/groups/{id}
    resource: group
    operation: get

  - method: GET
    path: /api/v1/apps
    resource: application
    operation: list
    pagination:
      # Okta's own API guide names both: limit for the page size and after,
      # "a cursor pointing to the end of the returned page", with before for
      # the other direction. limit happens to be the word the runtime
      # supplies and after is not.
      style: cursor
      limit: 200
      limit_param: limit
      cursor_param: after

webhooks:
  # Okta calls these event hooks.
  events:
    - user.lifecycle.create
    - user.lifecycle.activate
    - user.lifecycle.suspend
    - user.lifecycle.deactivate
    - user.account.lock
    - user.session.start
    - group.user_membership.add
  # The top-level eventType is com.okta.event_hook on every delivery Okta
  # has ever sent. It says this is an event hook. The event is two levels
  # down, inside an array, under a field of the same name -- so code
  # switching on body.eventType takes the same branch forever and never
  # knows.
  #
  # And there is no user in it. target is a list of references: an id, a
  # type and a display name, which is what Okta gives you to go and fetch.
  payload:
    eventType: com.okta.event_hook
    eventTypeVersion: "1.0"
    cloudEventsVersion: "0.1"
    contentType: application/json
    eventId: "{id}"
    eventTime: "{created_iso}"
    source: https://cauldron.okta.com/api/v1/eventHooks/whocauldron0000001
    data:
      events:
        - uuid: "{id}"
          published: "{created_iso}"
          eventType: "{event}"
          version: "0"
          outcome:
            result: SUCCESS
          target:
            - id: "{record_id}"
              type: User
  signing:
    scheme: hmac-sha256
    header: x-okta-verification-challenge
    # Not a signature header at all. x-okta-verification-challenge carries
    # the one-time value Okta sends when an event hook is first registered,
    # which an endpoint echoes back to prove it owns the URL. A delivery
    # carries no HMAC: Okta authenticates event hooks with an Authorization
    # header the subscriber chooses.
    #
    # So both the scheme and the header are describing something Okta does
    # not do per delivery, and saying so is worth more than a format.
    secret: cauldron-event-hook-secret

errors:
  rate_limit:
    status: 429
    code: E0000047
    message: "API call exceeded rate limit due to too many requests."
    headers:
      Retry-After: "60"
      X-Rate-Limit-Remaining: "0"

  # A well-formed SSWS token nobody issued. Confirmed live 2026-09-05 -- see
  # the header.
  authentication_error:
    status: 401
    code: E0000011
    message: Invalid token provided

  # No Authorization header at all. Confirmed live 2026-09-05 -- see the
  # header. 403, not 401, and a different code and sentence.
  invalid_session:
    status: 403
    code: E0000005
    message: Invalid session
    fields:
      errorLink: E0000005

  # The wrong scheme word (Bearer, sent from habit). Confirmed live
  # 2026-09-05: no body at all, not this file's usual error shape -- see the
  # header.
  empty_unauthorized:
    status: 401
    empty: true

  resource_missing:
    status: 404
    code: E0000007
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    code: E0000003
    message: "The request body was not well-formed: {detail} is required"

  # The failures a developer org will not produce for you on demand, and the
  # ones sign-in code has to handle correctly.
  password_policy_violation:
    status: 400
    code: E0000080
    message: The password does not meet the complexity requirements of the current password policy.

  user_locked_out:
    status: 403
    code: E0000085
    message: The user account is locked, too many failed sign-in attempts.

  # An API token scoped below what the call needs, which reads like a missing
  # resource until you read the code.
  insufficient_permission:
    status: 403
    code: E0000006
    message: You do not have permission to perform the requested action

fixtures:
  empty: {}

  small-org:
    group:
      - id: cauldronGroup0000001
        type: OKTA_GROUP
        name: Everyone
        description: All users in the org
      - id: cauldronGroup0000002
        # Owned by an application. Writes to it are refused, which surprises
        # anyone syncing groups from an external directory.
        type: APP_GROUP
        name: Salesforce Users
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: cauldronGroup0000003
        type: APP_GROUP
        name: Salesforce Users
    user:
      - id: cauldronUser00000001
        status: ACTIVE
        firstName: Ada
        lastName: Lovelace
        email: ada@example.com
        login: ada@example.com
        lastLogin: "2026-01-14T09:12:00Z"
      - id: cauldronUser00000002
        # Created but never activated. Has never had a password, and cannot
        # sign in. Code checking "not DEPROVISIONED" lets this through.
        status: STAGED
        firstName: Grace
        lastName: Hopper
        email: grace@example.com
        login: grace@example.com
      - id: cauldronUser00000003
        # Was active, now suspended. Also not DEPROVISIONED.
        status: SUSPENDED
        firstName: Alan
        lastName: Turing
        email: alan@example.com
        login: alan@example.com
        lastLogin: "2025-11-02T16:40:00Z"
    application:
      - id: cauldronApp000000001
        name: salesforce
        label: Salesforce
        status: ACTIVE
        signOnMode: SAML_2_0

# Conformance cases, read from Okta's API reference rather than observed
# against a live org. The verify report says so.
conformance:
  - name: user attributes live under profile
    source: https://developer.okta.com/docs/reference/api/users/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users/cauldronUser00000001
      headers:
        Authorization: SSWS cauldron_okta_token
    expect:
      status: 200
      body:
        status: ACTIVE
        profile:
          email: ada@example.com
          firstName: Ada
          login: ada@example.com
      # Code reading user.email finds nothing.
      absent:
        - email
        - firstName

  - name: status is a lifecycle, not a boolean
    source: https://developer.okta.com/docs/reference/api/users/#user-status
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: SSWS cauldron_okta_token
    expect:
      status: 200
      body:
        # Three users, three different answers to "can this person sign in",
        # and only the first is yes. None of them is DEPROVISIONED, so code
        # that checks for the absence of that lets the other two through.
        '[0]':
          status: ACTIVE
        '[1]':
          status: STAGED
        '[2]':
          status: SUSPENDED

  - name: a user who has never signed in has no lastLogin
    source: https://developer.okta.com/docs/reference/api/users/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users/cauldronUser00000002
      headers:
        Authorization: SSWS cauldron_okta_token
    expect:
      status: 200
      body:
        status: STAGED
      # Never activated, never had a password, never signed in. Stamping any
      # of these would claim events that did not happen.
      absent:
        - lastLogin
        - passwordChanged

  - name: the credential scheme is SSWS, not Bearer
    # This asserted the E0000011 JSON shape and passed, because the Recipe
    # served it for every rejection alike. Confirmed live 2026-09-05: the
    # wrong scheme word gets no body at all, empty -- a different failure
    # from a right-scheme token nobody issued.
    source: https://cauldron-test.okta.com/api/v1/users
    verified: "2026-09-05"
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: Bearer cauldron_okta_token
    expect:
      status: 401
      no_body: true

  - name: a right-scheme token nobody issued gets the usual error shape
    source: https://cauldron-test.okta.com/api/v1/users
    verified: "2026-09-05"
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users
      headers:
        Authorization: SSWS junktoken12345
    expect:
      status: 401
      body:
        errorCode: E0000011
        errorSummary: Invalid token provided

  - name: no credential at all is a 403 naming an invalid session
    source: https://cauldron-test.okta.com/api/v1/users
    verified: "2026-09-05"
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users
    expect:
      status: 403
      body:
        errorCode: E0000005
        errorSummary: Invalid session
        errorLink: E0000005

  - name: the error carries a code, a summary and a causes array
    source: https://developer.okta.com/docs/reference/error-codes/
    fixture: small-org
    request:
      method: GET
      path: /api/v1/users/doesnotexist00000000
      headers:
        Authorization: SSWS cauldron_okta_token
    expect:
      status: 404
      body:
        errorCode: E0000007
        errorCauses: []
      matches:
        errorSummary: 'Not found'
        errorId: '^cauldron[0-9]+$'
      absent:
        - error
        - message

  - name: a collection is a bare array
    source: https://developer.okta.com/docs/reference/api/users/#list-users
    fixture: small-org
    request:
      method: GET
      path: /api/v1/groups
      headers:
        Authorization: SSWS cauldron_okta_token
    expect:
      status: 200
      body:
        '[0]':
          type: OKTA_GROUP
          profile:
            name: Everyone
        # Owned by an application, and writes to it are refused.
        '[1]':
          type: APP_GROUP
      absent:
        - data
        - items

  - name: a created user starts STAGED, not active
    source: https://developer.okta.com/docs/reference/api/users/#create-user
    fixture: empty
    request:
      method: POST
      path: /api/v1/users
      headers:
        Authorization: SSWS cauldron_okta_token
      json:
        profile:
          email: alan@example.com
          firstName: Alan
          login: alan@example.com
    expect:
      status: 200
      body:
        # Created is not activated. A user in this state cannot sign in, and
        # code that creates a user and assumes they can is wrong every time.
        status: STAGED
        profile:
          email: alan@example.com
      matches:
        id: '^[A-Za-z0-9]{20}$'

  - name: the top-level eventType is the same string on every delivery
    source: https://developer.okta.com/docs/concepts/event-hooks/
    fixture: small-org
    request:
      method: POST
      path: /api/v1/users
      headers:
        Authorization: SSWS cauldron_okta_token
      json:
        profile:
          login: grace@example.com
          email: grace@example.com
          firstName: Grace
          lastName: Hopper
    expect:
      status: 200
      webhook:
        event: user.lifecycle.create
        body:
          # Always this. Switching on it takes one branch forever.
          eventType: com.okta.event_hook
          # The one that says what happened, two levels down and inside an
          # array, under a field with the same name as the one that does not.
          data.events[0].eventType: user.lifecycle.create
          data.events[0].outcome.result: SUCCESS
          data.events[0].target[0].type: User
        absent:
          # No user in it. A reference is what Okta sends.
          - data.events[0].target[0].profile
          - data.object

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and after=cauldronUser00000001, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and after are the two names this listing reads"
    source: "https://developer.okta.com/docs/reference/api/users/#user-status"
    fixture: small-org
    request:
      method: GET
      path: "/api/v1/users"
      query:
        "limit": "1"
        "after": "cauldronUser00000001"
      headers:
        "Authorization": "SSWS cauldron_okta_token"
    expect:
      status: 200
      body:
        "[0].id": "cauldronUser00000002"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and after=cauldronGroup0000001, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and after are the two names this listing reads on api v1 groups"
    source: "https://developer.okta.com/docs/reference/api/users/#list-users"
    fixture: small-org
    request:
      method: GET
      path: "/api/v1/groups"
      query:
        "limit": "1"
        "after": "cauldronGroup0000001"
      headers:
        "Authorization": "SSWS cauldron_okta_token"
    expect:
      status: 200
      body:
        "[0].id": "cauldronGroup0000002"
      absent:
        - "[1]"
