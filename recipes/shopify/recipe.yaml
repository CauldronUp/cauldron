# Shopify Recipe for Cauldron
#
# Shopify disagrees with both Stripe and GitHub, which is why it is worth
# modelling third:
#
#   * Lists are nested under a plural collection key: {"orders": [...]}.
#   * Auth is a bespoke header, not a bearer token.
#   * The API version is a path segment that partitions nothing, so it is a
#     path parameter deliberately left out of scope.
#
# Scope is one shop's data. A dev store is genuinely quick to obtain, so the
# value here is less "you cannot get a sandbox" and more that a Shopify dev
# store cannot be told to rate limit you, cannot be rewound, and is shared
# with everyone else on the team.

recipe: shopify
version: 0.1.0

upstream:
  api: "2026-01"
  docs: https://shopify.dev/docs/api/admin-rest

auth:
  scheme: header
  header: X-Shopify-Access-Token
  keys:
    - shpat_cauldron

responses:
  list:
    style: wrapped

resources:
  order:
    collection: orders
    id:
      style: numeric
    fields:
      email:
        type: string
      currency:
        type: string
        default: GBP
      financial_status:
        type: string
        default: pending
      fulfillment_status:
        type: string
      total_price:
        type: string
        default: "0.00"
      created_at:
        type: timestamp

  product:
    collection: products
    id:
      style: numeric
    fields:
      title:
        type: string
        required: true
      vendor:
        type: string
      status:
        type: string
        default: active
      created_at:
        type: timestamp

routes:
  # {version} is a path parameter that is not in any scope: it varies, but it
  # does not partition the data.
  - method: GET
    path: /admin/api/{version}/orders.json
    resource: order
    operation: list
    pagination:
      style: cursor
      limit: 50

  - method: POST
    path: /admin/api/{version}/orders.json
    resource: order
    operation: create

  - method: GET
    path: /admin/api/{version}/orders/{id}.json
    resource: order
    operation: get

  - method: PUT
    path: /admin/api/{version}/orders/{id}.json
    resource: order
    operation: update

  - method: DELETE
    path: /admin/api/{version}/orders/{id}.json
    resource: order
    operation: delete

  - method: GET
    path: /admin/api/{version}/products.json
    resource: product
    operation: list
    pagination:
      style: cursor
      limit: 50

  - method: POST
    path: /admin/api/{version}/products.json
    resource: product
    operation: create

  - method: GET
    path: /admin/api/{version}/products/{id}.json
    resource: product
    operation: get

webhooks:
  events:
    - order.created
    - order.updated
    - order.deleted
    - product.created
  signing:
    scheme: hmac-sha256
    header: X-Shopify-Hmac-Sha256
    secret: shpss_cauldron

errors:
  # Shopify's rate limit is the leaky bucket everyone eventually meets in
  # production and almost nobody exercises before then.
  rate_limit:
    status: 429
    code: too_many_requests
    message: Exceeded 2 calls per second for api client.
    headers:
      Retry-After: "2.0"
      X-Shopify-Shop-Api-Call-Limit: "40/40"

  authentication_error:
    status: 401
    code: unauthorized
    message: "[API] Invalid API key or access token (unrecognized login or wrong password)"

  resource_missing:
    status: 404
    code: not_found
    message: Not Found

  validation_failed:
    status: 422
    code: unprocessable_entity
    message: Required parameter missing or invalid

fixtures:
  empty: {}

  small-shop:
    order:
      - id: "450789469"
        email: ada@example.com
        currency: GBP
        financial_status: paid
        fulfillment_status: fulfilled
        total_price: "25.00"
      - id: "450789470"
        email: grace@example.com
        currency: GBP
        financial_status: pending
        total_price: "12.50"
    product:
      - id: "632910392"
        title: Cast iron cauldron
        vendor: Brilliance Digital
        status: active
