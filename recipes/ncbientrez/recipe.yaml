conformance:
  - name: idlist is bare pmids, wrapped two objects deep
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=42673563%5Buid%5D&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esearch.fcgi
    expect:
      status: 200
      body:
        header.type: esearch
        header.version: "0.3"
        # Quoted, on a field the caller reads as a page size.
        esearchresult.retmax: "1"
        esearchresult.retstart: "0"
        "esearchresult.idlist[0]": "42673563"

  - name: count is a decimal-digit string on a field that counts
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=42673563%5Buid%5D&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esearch.fcgi
    expect:
      status: 200
      body:
        esearchresult.count: "1"
        esearchresult.querytranslation: "42673563[UID]"
        esearchresult.translationset: []

  - name: a malformed term is not refused, it is silently repaired
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=42673563%5Buid%5D%28%28&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      # A stray, unclosed "((" appended to the same exact-match query. The
      # real API answers 200 with the ordinary shape and drops the token; a
      # warninglist names it, which this Recipe does not model.
      path: /entrez/eutils/esearch.fcgi
    expect:
      status: 200
      body:
        "esearchresult.idlist[0]": "42673563"
        esearchresult.count: "1"

  - name: leaving term out entirely answers 200 with a capitalised key
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esearch-no-term.fcgi
    expect:
      status: 200
      body:
        # Where idlist and count sit on success. ERROR is the only
        # upper-case key anywhere in this API.
        esearchresult.ERROR: "Empty term and query_key - nothing todo"
        header.type: esearch

  - name: an unknown db answers 200 in the same capitalised shape
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=notarealdb&term=cancer&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esearch-bad-db.fcgi
    expect:
      status: 200
      body:
        esearchresult.ERROR: "Invalid db name specified: notarealdb"

  - name: esummary keys a map by uid and repeats it inside the value
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=42673563&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esummary.fcgi?id=42673563
    expect:
      status: 200
      body:
        header.type: esummary
        # The identifier is both the object's own key and a field inside it,
        # under a different name than the wrapper key uses.
        result.42673563.uid: "42673563"
        result.42673563.lastauthor: "Coffey RJ"
        # A status held as a numeral, quoted.
        result.42673563.pubstatus: "10"
        # A field named for a count, holding an empty string.
        result.42673563.pmcrefcount: ""
        result.42673563.essn: "2767-9764"
        result.42673563.issn: ""

  - name: the nested arrays keep their own shapes
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=42673563&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esummary.fcgi?id=42673563
    expect:
      status: 200
      body:
        "result.42673563.authors[0].name": "Hamilton MS"
        "result.42673563.authors[0].clusterid": ""
        "result.42673563.articleids[1].idtype": doi
        "result.42673563.articleids[1].idtypen": 3
        "result.42673563.history[0].pubstatus": medline
        "result.42673563.pubtype[0]": "Journal Article"

  - name: a well-formed id that does not exist shrinks to two fields
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=999999999999&retmode=json"
    verified: "2026-08-31"
    fixture: citations_with_tombstone
    request:
      method: GET
      path: /entrez/eutils/esummary.fcgi?id=999999999999
    expect:
      status: 200
      body:
        # Not a request-level failure: status 200, the envelope is the
        # ordinary success shape, and the one record inside it answers with
        # a uid and an error instead of the other thirty fields.
        result.999999999999.uid: "999999999999"
        result.999999999999.error: "cannot get document summary"
      absent:
        - result.999999999999.title
        - result.999999999999.pubdate

  - name: an invalid db renames the envelope and swaps it to an array
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=notarealdb&id=1&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esummary-bad-db.fcgi
    expect:
      status: 200
      body:
        header.type: esummary
        # "result" on success. Here it does not exist at all.
        "esummaryresult[0]": "Invalid db name specified: notarealdb"
      absent:
        - result

  - name: a non-numeric id answers a top-level error beside an empty result
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=notanumber&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/esummary-bad-id.fcgi
    expect:
      status: 200
      body:
        # The envelope keeps its real name here, unlike the invalid-db
        # failure above, and it is empty rather than absent.
        error: "Invalid uid notanumber at position= 0"
        result.uids: []

  - name: retmode=json on efetch answers plain text under a json header
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=42673563&rettype=abstract&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch.fcgi?db=pubmed&id=42673563&rettype=abstract&retmode=json
    expect:
      status: 200
      # The lie in full: a header that promises structure over bytes that
      # are not it.
      headers:
        Content-Type: application/json; charset=UTF-8
      body_matches: '^Cancer Res Commun\. 2026 Aug 31\.'

  - name: and the wrapped abstract is real prose, not an escaped fragment
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=42673563&rettype=abstract&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch.fcgi?db=pubmed&id=42673563&rettype=abstract&retmode=json
    expect:
      status: 200
      body_matches: 'DOI: 10\.1158/2767-9764\.CRC-26-0105\nPMID: 42673563'

  - name: everything else efetch answers with is real xml
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=42673563"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch.fcgi?db=pubmed&id=42673563
    expect:
      status: 200
      headers:
        Content-Type: text/xml; charset=UTF-8
      body_matches: '<PMID Version="1">42673563</PMID>$'

  - name: a missing id is a 400 with the urlencoding left in
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch-no-id.fcgi
    expect:
      status: 400
      headers:
        Content-Type: text/plain; charset=UTF-8
      # "+" for space, undecoded, plus the real trailing newline.
      body_matches: '^WebEnv\+parameter\+is\+required\n$'

  - name: an invalid db on efetch still has its percent-escape in it
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=notarealdb&id=1&retmode=json"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch-bad-db.fcgi
    expect:
      status: 400
      headers:
        Content-Type: text/plain; charset=UTF-8
      # %3A is a colon nobody decoded.
      body_matches: '^Database%3A\+notarealdb\+-\+is\+not\+supported\n$'

  - name: efetch on a nonexistent id says nothing went wrong at all
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=999999999999&rettype=abstract&retmode=text"
    verified: "2026-08-31"
    fixture: citations
    request:
      method: GET
      path: /entrez/eutils/efetch-nonexistent-id.fcgi
    expect:
      # Two hundred. Three bytes. No message, no code, nothing that reads as
      # a failure by any convention this API uses anywhere else.
      status: 200
      body_matches: '^1\. $'

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether retmax was read or not -- but retstart can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "retstart moves the page on for entrez eutils esearch.fcgi"
    source: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=42673563%5Buid%5D&retmode=json"
    fixture: citations
    request:
      method: GET
      path: "/entrez/eutils/esearch.fcgi"
      query:
        "retmax": "1"
        "retstart": "1"
    expect:
      status: 200
      absent:
        - "esearchresult.idlist[0]"

