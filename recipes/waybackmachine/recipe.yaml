# Wayback Machine availability Recipe for Cauldron
#
# Ask whether a page existed in 1990 and it says yes, from 2002.
#
#   GET /wayback/available?url=example.com&timestamp=19900101
#   ->  {"archived_snapshots": {"closest": {"available": true,
#         "timestamp": "20020120142510", ...}}, "timestamp": "19900101"}
#
# "closest" means closest available, and nothing in the response says how far
# that is. available is true, status is "200", and the snapshot is from twelve
# years after the date asked for -- from a decade in which the page may have
# been a different page entirely. The distance is computable, but only by
# subtracting two timestamps in two different formats, and no field states it.
#
# **And "timestamp" is in the document twice, meaning two different things.**
# The one inside closest is when the snapshot was taken, fourteen digits. The one
# at the top level is the date the caller asked for, eight digits, echoed back --
# and it is absent entirely when the caller did not send one. So the same key is
# a request parameter in one place and an answer in the other, at two lengths,
# one of them conditional. url is doubled the same way: the top level echoes what
# was sent, and the one inside closest is the archive address.
#
# Written against the live API rather than a document: every case below was
# checked against archive.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. status is the string "200". An HTTP status, quoted, inside the body of a
#      response that already carried one -- so status === 200 is false and
#      status == 200 is true.
#   2. A URL with nothing archived answers archived_snapshots: {} with a 200.
#      An empty object where the success has closest, so
#      body.archived_snapshots.closest.url throws rather than reading a status.
#   3. A request with no url parameter at all answers the plain text
#      "Error: no url parameter" -- with a 200, and content-type
#      text/html; charset=utf-8, from an endpoint whose successes are JSON.
#   4. The archive address is http, and the URL inside it varies. The same site
#      appears as http://example.com/, https://example.com/ and
#      http://example.com:80/ across three snapshots, so the inner URL is
#      whatever was canonical at crawl time rather than what was asked for.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The archive is served rather than searched. This Recipe answers with the
#     snapshots its fixture holds, one per case, because the same URL answers
#     differently for every timestamp and the route is addressed by the URL.
#   - The latest snapshot moves whenever the crawler runs. It is served as
#     recorded.
#   - Only /wayback/available is modelled. The CDX API answers a different
#     document and the /web/ paths answer the archived pages themselves.
#
# The URLs below are public and were recorded on the date in the cases.

recipe: waybackmachine
capability: infrastructure
version: 0.1.0

upstream:
  api: waybackmachine
  docs: https://archive.org/help/wayback_api.php

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # Prose, from an endpoint whose successes are JSON.
    style: text

resources:
  availability:
    id:
      style: opaque
      # The URL in the query string, which is echoed at the top level.
      field: url
    fields:
      # A plural key holding one object, or none.
      archived_snapshots:
        type: map
      # The date asked for, eight digits, and absent when none was sent.
      timestamp:
        type: string

routes:
  - method: GET
    path: /wayback/available
    resource: availability
    operation: get
    id_from: query:url
    not_found: no_url

errors:
  # A 200, in text/html, saying what is missing.
  no_url:
    status: 200
    headers:
      Content-Type: text/html; charset=utf-8
    message: "Error: no url parameter"

fixtures:
  empty: {}

  # ?url=example.com&timestamp=19900101 -- twelve years out, and available.
  nineteen_ninety:
    availability:
      - id: example.com
        archived_snapshots:
          # Closest available, and nothing says how far that is.
          closest:
            # A string.
            status: "200"
            available: true
            # http, and the inner URL carries an explicit port.
            url: http://web.archive.org/web/20020120142510/http://example.com:80/
            # Fourteen digits: when the snapshot was taken.
            timestamp: "20020120142510"
        # Eight digits: the date that was asked for.
        timestamp: "19900101"

  # ?url=https://example.com&timestamp=20100101 -- a day out, and https in.
  twenty_ten:
    availability:
      - id: https://example.com
        archived_snapshots:
          closest:
            status: "200"
            available: true
            # The same site, and this time the inner URL is plain http with no
            # port.
            url: http://web.archive.org/web/20100102003410/http://example.com/
            timestamp: "20100102003410"
        timestamp: "20100101"

  # ?url=example.com with no timestamp at all.
  latest:
    availability:
      - id: example.com
        archived_snapshots:
          closest:
            status: "200"
            available: true
            # And here the inner URL is https.
            url: http://web.archive.org/web/20260828154030/https://example.com/
            timestamp: "20260828154030"

  # A URL nothing has archived.
  unarchived:
    availability:
      - id: zzznotarealsitexyz.invalid
        # An empty object, where every hit has closest.
        archived_snapshots: {}

conformance:
  - name: asking about 1990 answers yes, from 2002
    source: https://archive.org/wayback/available?url=example.com&timestamp=19900101
    verified: "2026-08-28"
    fixture: nineteen_ninety
    request:
      method: GET
      path: /wayback/available?url=example.com&timestamp=19900101
    expect:
      status: 200
      body:
        # "closest" means closest available, and nothing in the response says
        # how far that is -- here, twelve years.
        "archived_snapshots.closest.available": true
        "archived_snapshots.closest.timestamp": "20020120142510"
        timestamp: "19900101"

  - name: the same key is the request in one place and the answer in the other
    source: https://archive.org/wayback/available?url=https://example.com&timestamp=20100101
    verified: "2026-08-28"
    fixture: twenty_ten
    request:
      method: GET
      path: /wayback/available?url=https://example.com&timestamp=20100101
    expect:
      status: 200
      body:
        # Eight digits at the top, fourteen inside, and the same name on both.
        timestamp: "20100101"
        "archived_snapshots.closest.timestamp": "20100102003410"
        # url is doubled the same way.
        url: https://example.com
        "archived_snapshots.closest.url": http://web.archive.org/web/20100102003410/http://example.com/
        # And the second snapshot carries the same quoted status and the
        # same available: true as the twelve-year-old one.
        "archived_snapshots.closest.status": "200"
        "archived_snapshots.closest.available": true

  - name: and the echo is absent when nothing was asked for
    source: https://archive.org/wayback/available?url=example.com
    verified: "2026-08-28"
    fixture: latest
    request:
      method: GET
      path: /wayback/available?url=example.com
    expect:
      status: 200
      body:
        # The snapshot's own timestamp is still there; the caller's is not.
        "archived_snapshots.closest.timestamp": "20260828154030"
        # The same site a third time, and a third inner form: https, no
        # port. The address around it is http with a /web/ prefix, as on
        # both the others.
        "archived_snapshots.closest.url": http://web.archive.org/web/20260828154030/https://example.com/
      absent:
        - timestamp

  - name: the status is a quoted string
    source: https://archive.org/wayback/available?url=example.com&timestamp=19900101
    verified: "2026-08-28"
    fixture: nineteen_ninety
    request:
      method: GET
      path: /wayback/available?url=example.com&timestamp=19900101
    expect:
      status: 200
      body:
        # An HTTP status, quoted, inside the body of a response that already
        # carried one -- so status === 200 is false and status == 200 is true.
        "archived_snapshots.closest.status": "200"

  - name: the archive address is http and the URL inside it varies
    source: https://archive.org/wayback/available?url=example.com&timestamp=19900101
    verified: "2026-08-28"
    fixture: nineteen_ninety
    request:
      method: GET
      path: /wayback/available?url=example.com&timestamp=19900101
    expect:
      status: 200
      body:
        # An explicit port here, plain http on the 2010 snapshot, https on the
        # 2026 one: the inner URL is whatever was canonical at crawl time.
        "archived_snapshots.closest.url": http://web.archive.org/web/20020120142510/http://example.com:80/

  - name: a URL nothing has archived is an empty object
    source: https://archive.org/wayback/available?url=zzznotarealsitexyz.invalid
    verified: "2026-08-28"
    fixture: unarchived
    request:
      method: GET
      path: /wayback/available?url=zzznotarealsitexyz.invalid
    expect:
      # A 200, and body.archived_snapshots.closest.url throws rather than
      # reading a status.
      status: 200
      body:
        url: zzznotarealsitexyz.invalid
        archived_snapshots: {}
      absent:
        - archived_snapshots.closest
        - timestamp

  - name: a request with no url is prose, in HTML, with a 200
    source: https://archive.org/wayback/available
    verified: "2026-08-28"
    fixture: latest
    request:
      method: GET
      path: /wayback/available
    expect:
      # Not JSON, not a 4xx, and the content type is text/html on a body that
      # is one line of text.
      status: 200
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: '^Error: no url parameter$'
