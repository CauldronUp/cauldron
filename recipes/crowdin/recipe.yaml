# Crowdin Recipe for Cauldron
#
# This Recipe models the Cloud API at api.crowdin.com -- every organisation
# sharing one host, one credential space, addressed by numeric project ids.
# Crowdin Enterprise is a separate product on a separate, per-organisation
# host (https://{organization-domain}.api.crowdin.com/api/v2/...), with its
# own credential scoping and its own docs tree
# (support.crowdin.com/developer/enterprise/api/v2/), and none of it is
# checked or claimed here. Say plainly which one a Recipe models is the rule
# this header is following, because the two are close enough in shape that a
# case written against one would look plausible against the other and be
# wrong about the host.
#
# Like Lokalise, Crowdin is localisation management rather than a
# translation engine: projects, strings and translations are stored records,
# not a response from a model. **What Crowdin exposes for "does a translation
# carry a state" is sharper than Lokalise's two independent booleans, and it
# was found in the vendor's own official JS client
# (github.com/crowdin/crowdin-api-client-js, src/stringTranslations/index.ts)
# rather than a fetchable OpenAPI document -- see the fidelity gaps for why
# that substitution was necessary.** A StringTranslation carries id, text,
# pluralCategoryName, user, rating, provider, isPreTranslated, createdAt --
# provider names which machine-translation engine produced it when
# isPreTranslated is true, which is the one place this whole group's
# question gets an honest partial answer: Crowdin will tell you a string was
# machine-translated and by what, but rating is the only number anywhere
# near it, and rating is not a confidence score -- it is a vote count on the
# client's own AddVoteRequest, cast by human reviewers after the fact, not a
# figure the translation arrived with. There is no field on this object
# meaning "how sure was the engine."
#
# **Reviewed and approved are not fields on the translation at all. Approval
# is a separate resource.** GET /projects/{id}/approvals answers a list of
# Approval records -- {id, user, translationId, stringId, languageId,
# createdAt} -- each one a fact that somebody approved a specific
# translationId, on its own timeline, addressable and deletable on its own.
# A translation with no approval simply has no row anywhere in that second
# collection; nothing on the translation itself says un-approved, because
# nothing on it says approved either. That makes Crowdin's version of this
# group's ambiguity a cross-reference rather than a same-record flag: to ask
# "is this translation approved" a caller lists a different endpoint and
# checks for a match, and to ask "is this string untranslated at all" a
# caller finds no StringTranslation row for it -- there is no reachable
# worked example distinguishing that from a translation stored as the empty
# string, because the client's own model declares text: string with no note
# either way, and no live account exists here to create one and look.
#
# **Every credential failure collapses to one sentence**, unlike DeepL and
# unlike Lokalise's own distinct malformed-shape sentences. Checked live
# against GET /api/v2/projects: no Authorization header, "Bearer
# junk-not-real-token-000000", and the same value with no "Bearer " scheme
# at all all answer the identical {"error":{"message":"Unauthorized",
# "code":401}}. auth.rejected_error is left unset for the same reason
# Lokalise's is: there is only the one message to name.
#
# **Routing and method resolve before the credential**, checked live with no
# Authorization header at all: GET /api/v2/no-such-endpoint-xyz answers 404
# {"error":{"message":"Not Found","code":404}}; PATCH /api/v2/projects
# answers a real 405 {"error":{"message":"Method Not Allowed","code":405}}.
# Both are auth.after_routing, the same ordering Fireworks' Recipe elsewhere
# in this collection uses. What is worth pinning about the 405 specifically:
# every response on this host, the 401 and the 404 and the 405 alike, carries
# an identical Access-Control-Allow-Methods: GET, POST, OPTIONS, DELETE,
# PATCH, PUT header -- a static CORS preflight policy for the whole API, not
# a per-path Allow computed for the one route that just refused a request.
# A client reading that header to learn what this path accepts learns
# nothing it did not already know, on every failure this host sends.
#
# **A route naming an id answers about that id before it ever asks who is
# calling, which is a sharper version of the split NocoDB's Recipe records
# elsewhere in this collection.** Checked live, every combination struck
# with no credential and again with a wrong one, byte-identical both times:
#
#   GET /api/v2/projects/999999999  (a numeric id nothing owns)
#     -> 404 {"error":{"message":"Project Not Found","code":404}}
#   GET /api/v2/projects/1           (the same, a different number)
#     -> 404 {"error":{"message":"Project Not Found","code":404}}
#   GET /api/v2/projects/not-a-number  (fails the route's own id pattern)
#     -> 404 {"error":{"message":"Not Found","code":404}}
#
# So a numeric-shaped project id that nothing owns is answered without ever
# consulting a credential -- not refused for lacking one, not refused for
# having a wrong one, simply told the project does not exist -- while the
# bare collection route (no id at all) answers 401 to the identical missing
# credential. NocoDB's Recipe records a route with an id resolving the id
# ahead of the credential and echoing it back in the message; Crowdin's does
# not echo the id, but the ordering is the same family: an id-addressed
# route answers about the id's existence first, on this host regardless of
# whether the id could ever belong to the caller. GET /projects/{id} is
# public here for exactly that reason -- not because Crowdin has a public
# endpoint by design, but because no credential this Recipe could send ever
# changed this specific answer, live, twice.
#
# One live route needed no credential to demonstrate at all, and it is
# reproduced verbatim rather than approximated: GET /api/v2/languages, which
# is Crowdin's own catalogue of every language code the platform recognises,
# genuinely public, no account and no key anywhere in the request. Its
# envelope is doubly wrapped -- {"data": [{"data": {...fields...}}]} -- each
# entry under its own "data" key inside the collection's "data" array, the
# same shape Chargebee's Recipe elsewhere in this collection needs
# entry_style: wrapped for. And its pagination object carries only offset
# and limit; there is no total anywhere in the body, on a live response this
# Recipe actually read.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No upstream.spec is recorded. Crowdin's historical machine-readable
#     description (developer.crowdin.com/openapi/crowdin-api.yml) 301s to a
#     support.crowdin.com path that 404s; the current API reference at
#     support.crowdin.com/developer/api/v2/ is a JavaScript-rendered
#     ReDoc page with no fetchable underlying document this Recipe could
#     find, and no well-known API catalogue is served the way Lokalise's is.
#     The documented-only claims here about StringTranslation and Approval
#     are read from the official JS client's TypeScript source instead --
#     cited above and in each case's source: field -- which is not a
#     substitute for a fingerprintable spec and is not claimed as one.
#   - No account was ever created and no OAuth or personal access token was
#     ever requested, guessed or used. Every 401/404/405 case below was
#     struck live and carries a verified date; the languages catalogue case
#     is live too, read verbatim from a real response. Every case describing
#     StringTranslation or Approval fields carries no verified date, for the
#     reason above.
#   - Of the fifteen-plus fields Language actually carries (editorCode,
#     twoLettersCode, threeLettersCode, locale, androidCode, bcp47Code,
#     osxCode, osxLocale, pluralCategoryNames, pluralRules, pluralExamples)
#     this Recipe declares five. All are real, live values; none is
#     invented.
#   - Strings, files, translation memories, glossaries, machine translation
#     engine configuration, tasks, workflows, screenshots, and every write
#     route (create/update/delete on any resource) are real and none is
#     modelled. This Recipe answers the question its group exists to ask,
#     not a full port of the platform.
#   - A single project's full success shape (GET /api/v2/projects/{id} for
#     an id this Recipe's own fixture holds, with a valid credential) is not
#     demonstrated with a live-called case, because the only project ids
#     struck live belonged to nobody. It is declared from the client
#     library's Project interface, field names only, no fabricated example
#     values -- see the resource below.

recipe: crowdin
capability: cms
version: 0.1.0

upstream:
  api: v2
  provider: crowdin-cloud
  docs: https://support.crowdin.com/developer/api/v2/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-fixture-crowdin-token-0000000000000000
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    entry_style: wrapped
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: number

resources:
  # Named "data" rather than "language" on purpose. entry_style: wrapped
  # below wraps every entry under this resource's own name, and the live
  # envelope wraps every language under the literal key "data" -- the same
  # key the outer collection is already wrapped under, redundantly, both
  # levels named identically. Naming the resource anything more
  # conventional would render a key the wire does not send.
  data:
    id:
      style: opaque
    fields:
      name:
        type: string
      twoLettersCode:
        type: string
      textDirection:
        type: string
      dialectOf:
        type: string
        null_when_unset: true

  # No route below serves a found project: every id this Recipe struck live
  # belonged to nobody, and no worked JSON example was reachable to cite for
  # the found case -- see the fidelity gaps. Declared for the not-found and
  # routing-order cases, which do not need one.
  project:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
      identifier:
        type: string
      sourceLanguageId:
        type: string
      visibility:
        type: string
      createdAt:
        type: string

routes:
  # Genuinely public -- see the header. No credential anywhere in the live
  # request, and the response is unaffected by one either way.
  - method: GET
    path: /api/v2/languages
    resource: data
    operation: list
    public: true
    pagination:
      style: offset
      limit: 25
      limit_param: limit
      cursor_param: offset
      # Crowdin's own offset starts at nought, checked live -- see the
      # conformance case below. Left at the default this renders 1 instead.
      first_page: 0
    # The live envelope nests offset and limit under "pagination" and sends
    # no total anywhere -- see the header and the absent assertion below.
    list:
      page_field: pagination.offset
      limit_field: pagination.limit

  - method: GET
    path: /api/v2/projects
    resource: project
    operation: list
    pagination:
      # offset and limit, struck live on 2026-09-05 against the sibling this
      # Recipe already reads anonymously: ?limit=2&offset=2 on
      # /api/v2/languages answers two records and a pagination object of
      # {"offset": 2, "limit": 2}, and a bare request answers twenty-five
      # with {"offset": 0, "limit": 25}.
      #
      # The header above had already recorded the shape from a live read --
      # "its pagination object carries only offset and limit; there is no
      # total anywhere in the body" -- which is the same two names echoed
      # back. No total is the part a client feels: the only way to know a
      # walk is over is to ask again and be answered with nothing.
      style: offset
      limit: 25
      limit_param: limit
      cursor_param: offset

  # The exact literal id this Recipe struck live that fails the route's own
  # numeric shape -- see the header and the conformance case below. A more
  # general pattern is not expressible here: Cauldron's own id-shape check
  # (misshapen) runs after a route has already matched, so it would answer
  # 400 id_malformed where the live host answers the ordinary unrouted 404
  # instead, which is what this literal route reproduces exactly.
  - method: GET
    path: /api/v2/projects/not-a-number
    public: true
    error: unknown_route

  # Public: no credential this Recipe sent, right or wrong, changed this
  # answer for an id nothing owns -- see the header.
  - method: GET
    path: /api/v2/projects/{id}
    resource: project
    operation: get
    public: true
    not_found: project_not_found

errors:
  authentication_error:
    status: 401
    message: Unauthorized
    code: 401

  unknown_route:
    status: 404
    message: Not Found
    code: 404

  method_not_allowed:
    status: 405
    message: Method Not Allowed
    code: 405

  project_not_found:
    status: 404
    message: Project Not Found
    code: 404

fixtures:
  empty: {}

  catalogue:
    # Every value below is exactly what GET /api/v2/languages answered,
    # live, unauthenticated -- see the header. Not a subset chosen for
    # convenience: "ar" and "tw" are the two records in this fixture because
    # they are the two that show textDirection varying (ltr/rtl) and
    # dialectOf varying (null/a real parent code) in the same response.
    data:
      - id: ar
        name: Arabic
        twoLettersCode: ar
        textDirection: rtl
        dialectOf: null
      - id: tw
        name: "Akan, Twi"
        twoLettersCode: tw
        textDirection: ltr
        dialectOf: ak

    # Not routed to a found case -- see the header and the resource comment.
    project: []

# Every case below carries source. A verified date means this Recipe called
# api.crowdin.com with exactly the request shown and recorded exactly what
# came back; its absence means the case was read from the official JS
# client's TypeScript model source and never called.
conformance:
  - name: no credential at all is Unauthorized
    source: https://api.crowdin.com/api/v2/projects
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects
    expect:
      status: 401
      body:
        "error.message": Unauthorized
        "error.code": 401

  - name: a bearer token nobody issued is the identical sentence
    source: https://api.crowdin.com/api/v2/projects
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects
      headers:
        Authorization: Bearer junk-not-real-token-000000
    expect:
      status: 401
      body:
        "error.message": Unauthorized

  - name: the same value with no Bearer scheme at all is the same sentence too
    source: https://api.crowdin.com/api/v2/projects
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects
      headers:
        Authorization: junk-not-real-token-000000
    expect:
      status: 401
      body:
        "error.message": Unauthorized

  - name: an unrouted path is a 404 with no credential examined
    source: https://api.crowdin.com/api/v2/no-such-endpoint-xyz
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/no-such-endpoint-xyz
    expect:
      status: 404
      body:
        "error.message": Not Found
        "error.code": 404

  - name: and the same is true again with a credential attached
    source: https://api.crowdin.com/api/v2/no-such-endpoint-xyz
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/no-such-endpoint-xyz
      headers:
        Authorization: Bearer junk-not-real-token-000000
    expect:
      status: 404
      body:
        "error.message": Not Found

  - name: a wrong method on a real path is a genuine 405, no credential needed
    source: https://api.crowdin.com/api/v2/projects
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: PATCH
      path: /api/v2/projects
    expect:
      status: 405
      body:
        "error.message": Method Not Allowed
        "error.code": 405

  - name: a numeric project id nothing owns is Project Not Found, not Unauthorized
    # No credential at all. See the header: an id-addressed route answers
    # about the id before it ever asks who is calling, on this host.
    source: https://api.crowdin.com/api/v2/projects/999999999
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects/999999999
    expect:
      status: 404
      body:
        "error.message": Project Not Found
        "error.code": 404

  - name: a wrong credential does not change that answer either
    source: https://api.crowdin.com/api/v2/projects/999999999
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects/999999999
      headers:
        Authorization: Bearer junk-not-real-token-000000
    expect:
      status: 404
      body:
        "error.message": Project Not Found

  - name: a second, lower id confirms it is the id-addressed route, not one number
    source: https://api.crowdin.com/api/v2/projects/1
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects/1
    expect:
      status: 404
      body:
        "error.message": Project Not Found

  - name: an id that fails the route's own shape gets the plain Not Found instead
    source: https://api.crowdin.com/api/v2/projects/not-a-number
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/projects/not-a-number
    expect:
      status: 404
      body:
        "error.message": Not Found

  - name: the language catalogue is public and doubly wrapped
    # Live, unauthenticated, verbatim -- see the header.
    source: https://api.crowdin.com/api/v2/languages
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /api/v2/languages
    expect:
      status: 200
      body:
        "data[0].data.id": ar
        "data[0].data.name": Arabic
        "data[0].data.textDirection": rtl
        "data[1].data.id": tw
        "data[1].data.dialectOf": ak
        "pagination.offset": 0
        "pagination.limit": 25
      absent:
        - "pagination.total"
        - total

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read on api v2 languages, and a page of one is not the whole collection"
    source: "https://api.crowdin.com/api/v2/languages"
    fixture: catalogue
    request:
      method: GET
      path: "/api/v2/languages"
      query:
        "limit": "1"
    expect:
      status: 200
      body:
        "data[0].data.name": "Arabic"
      absent:
        - "data[1]"

  # And the position. offset=1 answers a different record, which the
  # size alone cannot produce.
  - name: "offset moves the page on for api v2 languages"
    source: "https://api.crowdin.com/api/v2/languages"
    fixture: catalogue
    request:
      method: GET
      path: "/api/v2/languages"
      query:
        "limit": "1"
        "offset": "1"
    expect:
      status: 200
      body:
        "data[0].data.name": "Akan, Twi"
      absent:
        - "data[1]"

  # The half of this listing the Recipe can show. No fixture in the file
  # holds a project, so there is no record to assert -- but the route
  # answers, with the status and the envelope beside it, and every case
  # here until now was checking a refusal. This says what an empty
  # answer looks like and asserts the collection is empty rather than
  # absent, which is the distinction a client gets wrong. The record
  # shape stays unevidenced: verify counts this listing as one shown
  # only empty until a fixture holds a record.
  - name: "the project listing answers, and this fixture has none"
    source: "https://api.crowdin.com/api/v2/languages"
    fixture: catalogue
    request:
      method: GET
      path: "/api/v2/projects"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-fixture-crowdin-token-0000000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The half of this listing the Recipe can show. No fixture in the file
  # holds a project, so there is no record to assert -- but the route
  # answers, with the status and the envelope beside it, and every case
  # here until now was checking a refusal. This says what an empty
  # answer looks like and asserts the collection is empty rather than
  # absent, which is the distinction a client gets wrong. The record
  # shape stays unevidenced: verify counts this listing as one shown
  # only empty until a fixture holds a record.
  - name: "the project listing answers, and this fixture has none (/api/v2/projects)"
    source: "https://api.crowdin.com/api/v2/languages"
    fixture: catalogue
    request:
      method: GET
      path: "/api/v2/projects"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-fixture-crowdin-token-0000000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The names. This Recipe declares 1 field(s) on a data that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a data carries the field names this Recipe declares"
    source: "https://api.crowdin.com/api/v2/languages"
    fixture: catalogue
    request:
      method: GET
      path: "/api/v2/languages"
    expect:
      status: 200
      body:
        "data[0].data.twoLettersCode": "ar"




