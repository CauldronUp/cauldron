# DNSimple Recipe for Cauldron
#
# The plain one of this batch's three, and worth reading after
# recipes/cloudflare/recipe.yaml for exactly that reason: DNSimple is a
# conventional bearer-token JSON API with one envelope, {"data": ...}
# around a single object as much as around a collection, and no per-record
# wrapper the way Cloudflare's dns_record has none either -- the difference
# from Cloudflare is that DNSimple's payload sits directly under "data" with
# no sibling success/errors/messages keys at all, and a failure is not the
# same envelope emptied out, it is a completely different, one-key shape:
# {"message": "..."}. There is no Cloudflare-style single four-key contract
# spanning both. This Recipe was modelled against **production**,
# api.dnsimple.com -- DNSimple does publish a live sandbox at
# api.sandbox.dnsimple.com, confirmed reachable and answering the identical
# 401 shape on 2026-09-03, and it is cited here rather than modelled because
# every credential this Recipe holds is a fixture that authenticates on
# neither host, so nothing about the choice of host changes what any case
# below asserts.
#
# **DNSimple's own documentation answers this batch's headline question
# about itself, in its own words, more directly than either other Recipe
# in this batch does.** developer.dnsimple.com's registrar reference (read
# 2026-09-03) documents the availability check's entire response as
# {"data": {"domain": "ruby.codes", "available": true, "premium": true}} --
# two independent booleans and the domain name, nothing else -- and states
# outright that price is *not* included: "if the domain is premium
# (premium: true), please check the premium price" via a *separate*
# endpoint. No error example is shown for this endpoint at all, and the
# reference's own error-code prose is as bare as the example: "Responds
# with HTTP 400 if the domain availability cannot be checked." No worked
# body, no distinction offered anywhere between a domain nobody has
# registered and one the registry reserves or blocks -- the vocabulary this
# batch is checking for simply is not there to fail to have. And the same
# reference states, in as many words, that this one operation "has stricter
# rate limits in place to avoid a high volume of requests" than the rest of
# the API -- DNSimple's own acknowledgement that this exact question is
# asked too often to be answered for free, without ever timestamping the
# answer it does give.
#
# **Price, when it is available at all, is a separate call and a separate
# shape.** GET .../prices answers {"data": {"domain": "bingo.pizza",
# "premium": true, "registration_price": 20.0, "renewal_price": 20.0,
# "transfer_price": 20.0, "restore_price": 20.0, "trustee_price": 20.0}} --
# per developer.dnsimple.com's own worked example, read 2026-09-03. Every
# price is a bare JSON number, not a string the way Namecheap's XML and
# Porkbun's JSON both send theirs elsewhere in this batch, and neither a
# currency code nor the word "year" appears anywhere on the object or in
# the surrounding envelope -- DNSimple is no more explicit about the period
# a price covers than Namecheap is, and considerably less explicit than
# Porkbun, whose own schema says "per year in USD" in so many words. Five
# named prices where Porkbun's schema names three (registration, renewal,
# transfer) and Namecheap's four premium fields name a fourth (restore) but
# not DNSimple's fifth: trustee_price, a cost none of this batch's other
# two providers charge for at all.
#
# **The credential check is where this Recipe earns its keep, and it found
# something none of this batch's brief anticipated: a request shape that
# crashes the API rather than being refused by it.** Four variants of
# Authorization against GET /v2/whoami, all live, all 2026-09-03: no header
# at all, a syntactically fine but wrong bearer token, a header with no
# "Bearer " prefix ("Authorization: junktoken12345"), and a bare
# "Authorization: Bearer " with nothing after the prefix. All four answered
# the byte-identical 401 {"message":"Authentication failed"}. DNSimple does
# not distinguish absent from malformed from rejected at all -- one
# sentence covers everyone who is not carrying a real token -- which is why
# this Recipe's auth block names none of absent_error, malformed_error or
# rejected_error: leaving all three unset is not an omission, it is the
# verified claim that the provider does not tell them apart, exactly as
# Step 2a of this batch's brief describes that choice.
#
# The fifth variant is the one worth the whole file. "Authorization: Basic"
# followed by an ordinary base64 credential -- a scheme DNSimple's own API
# reference never mentions, since the documented scheme is bearer-only --
# answers **500 Internal Server Error**, {"message":"Internal Server
# Error"}, confirmed by sending the exact request twice. Not 401, not 400:
# a request shaped like a *different* authentication scheme entirely trips
# something in DNSimple's own request pipeline hard enough to crash it,
# where a bearer token that is merely wrong, missing, or malformed in the
# ordinary sense is refused cleanly. Cauldron's own auth.scheme: bearer
# checks one prefix and cannot distinguish "no Bearer prefix, otherwise
# unremarkable" from "no Bearer prefix, and it happens to say Basic" --
# both are Malformed to the engine. This Recipe reproduces the 500 as its
# own literal, credential-exempt route matched on the exact header value
# this Recipe actually sent (matches_header, the same device Census's
# Recipe in this collection uses to key its own gated routes on an exact
# credential, here turned around to key a *crash* on one instead) rather
# than claiming every non-Bearer header crashes the service, which was
# never tested and is not this Recipe's claim.
#
# **Method is checked before the credential, on a completely different
# shape from either.** POST and DELETE against /v2/whoami, credentialled
# and not, all answered the identical HTML 400 "Bad request" page --
# DNSimple's own branded error document, not the {"message": ...} shape
# every JSON failure on this host otherwise uses, and not a real 405: no
# Allow header, a 400 rather than a 405. **Routing beats the credential
# too**: GET /v2/nosuchroute, credentialled and not, both answered the
# identical {"message":"Not Found"} at 404. auth.after_routing: true
# reproduces both findings together -- an unmatched path 404s and a matched
# path with the wrong method gets its own fixed failure, neither one ever
# reaching the credential check at all.
#
# **Every response on this host, success or failure, carries
# x-ratelimit-limit: 30**, confirmed on 401s, the 500, and the 404 alike --
# rate-limit accounting runs ahead of, or entirely independently of,
# whether the request is going to succeed.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 200 was ever reached for anything on this host -- no key exists
#     that authenticates against production or the sandbox. The three
#     success bodies below are developer.dnsimple.com's own complete,
#     worked examples, quoted rather than reconstructed from a schema, and
#     each carries no verified date for exactly that reason.
#   - No upstream.spec. DNSimple publishes hand-written reference pages;
#     every URL this Recipe tried for a machine-readable description
#     (openapi.yml, /openapi.json, a GitHub-hosted spec) answered 404, so
#     there is nothing to fetch and fingerprint.
#   - Only whoami, the registrar availability check, the registrar prices
#     check and one zone's record listing are modelled. DNSimple's API
#     surface -- certificates, webhooks, template records, the whole
#     registrar lifecycle beyond a check -- is otherwise undeclared.
#   - route.error on GET /v2/whoami (authentication_error) is never
#     reached by any case in this file: every case that could reach it
#     sends a credential this Recipe's own auth block already classifies
#     as a failure before the route's own terminal action is consulted. No
#     accepted-credential response was ever observed to put there instead.
#
# The bearer token below is a fixture that authenticates on neither
# api.dnsimple.com nor api.sandbox.dnsimple.com.

recipe: dnsimple
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.dnsimple.com/v2/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - dnsimple_cauldron_fixture_pat_0000000000000000000000000000
  # Left unset deliberately, all three -- see the header. Absent, a wrong
  # token, and a header with no Bearer prefix at all all answer the
  # identical sentence, live, so naming a distinct entry for any of them
  # would be a claim this Recipe disproved by sending the request.
  after_routing: true

responses:
  resource:
    style: wrapped
    key: data
  list:
    style: wrapped
    count_field: pagination.total_entries
    page_field: pagination.current_page
    limit_field: pagination.per_page
    pages_field: pagination.total_pages
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  domain_availability:
    id:
      style: opaque
      field: domain
    fields:
      available:
        type: boolean
      premium:
        type: boolean

  domain_price:
    id:
      style: opaque
      field: domain
    fields:
      premium:
        type: boolean
      registration_price:
        type: number
      renewal_price:
        type: number
      transfer_price:
        type: number
      restore_price:
        type: number
      # A fifth named price neither Namecheap's four premium fields nor
      # Porkbun's three cover -- see the header.
      trustee_price:
        type: number

  dns_record:
    collection: data
    id:
      style: numeric
      type: number
    fields:
      # A domain name, not a hex or numeric id -- unlike Cloudflare's
      # zone_id, elsewhere in this collection.
      zone_id:
        type: string
      parent_id:
        type: integer
        null_when_unset: true
      name:
        type: string
      content:
        type: string
      ttl:
        type: integer
      priority:
        type: integer
        null_when_unset: true
      type:
        type: string
        required: true
      regions:
        type: list
      system_record:
        type: boolean
        default: false
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /v2/whoami
    error: authentication_error

  # Credential-blind, confirmed live both ways -- see the header.
  - method: POST
    path: /v2/whoami
    public: true
    error: bad_request_page

  - method: DELETE
    path: /v2/whoami
    public: true
    error: bad_request_page

  # The exact request that crashes the service -- see the header. Matched
  # on this literal header value only, and public: true because the crash
  # was confirmed regardless of whether this Recipe's own auth block would
  # otherwise call it Malformed.
  - method: GET
    path: /v2/whoami
    matches_header:
      Authorization: "Basic anVua6VzZXI6anVua3Bhc3M="
    public: true
    error: internal_server_error

  - method: GET
    path: /v2/{account}/registrar/domains/{id}/check
    resource: domain_availability
    operation: get

  - method: GET
    path: /v2/{account}/registrar/domains/{id}/prices
    resource: domain_price
    operation: get

  - method: GET
    path: /v2/{account}/zones/{zone}/records
    resource: dns_record
    operation: list
    pagination:
      style: page
      limit: 30
      limit_param: per_page
      cursor_param: page

errors:
  authentication_error:
    status: 401
    headers:
      Content-Type: application/json; charset=utf-8
      x-ratelimit-limit: "30"
    message: Authentication failed

  # {"message":"Internal Server Error"} -- live, for the exact Basic-scheme
  # header this Recipe's one literal route matches. See the header: not
  # claimed for any other non-Bearer shape.
  internal_server_error:
    status: 500
    message: Internal Server Error

  # DNSimple's own branded HTML "Bad request" page, not the {"message":...}
  # shape every JSON failure here otherwise uses. Confirmed credential-blind
  # live.
  bad_request_page:
    status: 400
    style: text
    headers:
      Content-Type: text/html; charset=utf-8
    message: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Bad request &middot; DNSimple</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
      </head>
      <body>
        <main class="page">
          <p class="eyebrow">Error 400</p>
          <h1>We couldn&rsquo;t process your request.</h1>
          <p class="lead">Well this is awkward &mdash; you found our 400 page. Choose one of the options below to get back on track.</p>
        </main>
      </body>
      </html>

  unknown_route:
    status: 404
    message: Not Found

fixtures:
  empty: {}

  # DNSimple's own worked examples -- see the header. Cited, not observed:
  # no credential exists that reaches either live.
  documented:
    domain_availability:
      - id: ruby.codes
        available: true
        premium: true
    domain_price:
      - id: bingo.pizza
        premium: true
        registration_price: 20.0
        renewal_price: 20.0
        transfer_price: 20.0
        restore_price: 20.0
        trustee_price: 20.0
    dns_record:
      - id: 5
        zone_id: example.com
        parent_id: null
        name: ""
        content: mxa.example.com
        ttl: 600
        priority: 10
        type: MX
        regions: [global]
        system_record: false
        created_at: "2016-03-22T10:20:53Z"
        updated_at: "2016-03-22T10:20:53Z"

conformance:
  - name: no credential at all is a plain, generic 401
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/whoami
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
        x-ratelimit-limit: "30"
      body:
        message: Authentication failed

  - name: a wrong bearer token is told apart from nothing
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/whoami
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        message: Authentication failed

  - name: nor is a header with no Bearer prefix at all
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/whoami
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        message: Authentication failed

  - name: but a header shaped like Basic authentication crashes the service instead
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/whoami
      headers:
        Authorization: "Basic anVua6VzZXI6anVua3Bhc3M="
    expect:
      status: 500
      body:
        message: Internal Server Error

  - name: a wrong method answers a branded HTML page, not the JSON error shape
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v2/whoami
    expect:
      status: 400
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: "Well this is awkward"

  - name: and the identical page with a credential attached
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /v2/whoami
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 400
      body_matches: "Bad request"

  - name: DELETE gets the same wrong-method page
    source: https://api.dnsimple.com/v2/whoami
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /v2/whoami
    expect:
      status: 400
      body_matches: "400 page"

  - name: an unrecognised path is Not Found, credential-blind
    source: https://api.dnsimple.com/v2/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/nosuchroute
    expect:
      status: 404
      body:
        message: Not Found

  - name: and the identical answer with a credential attached
    source: https://api.dnsimple.com/v2/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v2/nosuchroute
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      body:
        message: Not Found

  - name: an available, premium domain carries no price at all
    # DNSimple's own complete worked example -- see the header. Price is a
    # deliberately separate call.
    source: https://developer.dnsimple.com/v2/registrar/#checkDomain
    fixture: documented
    request:
      method: GET
      path: /v2/1/registrar/domains/ruby.codes/check
      headers:
        Authorization: Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000
    expect:
      status: 200
      body:
        data.domain: ruby.codes
        data.available: true
        data.premium: true
      absent:
        - data.registration_price
        - data.price

  - name: price is a separate shape, five named amounts and no currency or period on any of them
    source: https://developer.dnsimple.com/v2/registrar/#getDomainPrices
    fixture: documented
    request:
      method: GET
      path: /v2/1/registrar/domains/bingo.pizza/prices
      headers:
        Authorization: Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000
    expect:
      status: 200
      body:
        data.domain: bingo.pizza
        data.registration_price: 20.0
        data.trustee_price: 20.0
      absent:
        - data.currency
        - data.available

  - name: a zone record wraps under data beside a pagination object, unlike Cloudflare's result/result_info split
    source: https://developer.dnsimple.com/v2/zones/records/
    fixture: documented
    request:
      method: GET
      path: /v2/1/zones/example.com/records
      headers:
        Authorization: Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000
    expect:
      status: 200
      body:
        "data[0].zone_id": example.com
        "data[0].type": MX
        "data[0].content": mxa.example.com
        "data[0].system_record": false
        pagination.total_entries: 1
      absent:
        - result
        - result_info

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not per_page was read -- but page can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page moves past the only record, and the page comes back empty"
    source: "https://developer.dnsimple.com/v2/zones/records/"
    fixture: documented
    request:
      method: GET
      path: "/v2/1/zones/example.com/records"
      query:
        "per_page": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The names. This Recipe declares 7 field(s) on a dns_record that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a dns_record carries the field names this Recipe declares"
    source: "https://developer.dnsimple.com/v2/zones/records/"
    fixture: documented
    request:
      method: GET
      path: "/v2/ruby.codes/zones/ruby.codes/records"
      headers:
        "Authorization": "Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000"
    expect:
      status: 200
      body:
        "data[0].created_at": "2016-03-22T10:20:53Z"
        "data[0].priority": 10
        "data[0].regions[0]": "global"
        "data[0].ttl": 600
        "data[0].updated_at": "2016-03-22T10:20:53Z"

  # The names. This Recipe declares 3 field(s) on a domain_price that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a domain_price carries the field names this Recipe declares"
    source: "https://developer.dnsimple.com/v2/registrar/#getDomainPrices"
    fixture: documented
    request:
      method: GET
      path: "/v2/bingo.pizza/registrar/domains/bingo.pizza/prices"
      headers:
        "Authorization": "Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000"
    expect:
      status: 200
      body:
        "data.renewal_price": 20
        "data.restore_price": 20
        "data.transfer_price": 20

  # The names. This Recipe declares 2 field(s) on a dns_record that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a dns_record carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.dnsimple.com/v2/zones/records/"
    fixture: documented
    request:
      method: GET
      path: "/v2/ruby.codes/zones/ruby.codes/records"
      headers:
        "Authorization": "Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000"
    expect:
      status: 200
      body:
        "data[0].parent_id": null

  # The names. This Recipe declares 1 field(s) on a domain_price that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a domain_price carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.dnsimple.com/v2/registrar/#getDomainPrices"
    fixture: documented
    request:
      method: GET
      path: "/v2/bingo.pizza/registrar/domains/bingo.pizza/prices"
      headers:
        "Authorization": "Bearer dnsimple_cauldron_fixture_pat_0000000000000000000000000000"
    expect:
      status: 200
      body:
        "data.premium": true




