# Scalekit Recipe for Cauldron
#
# Written against Scalekit's API reference at docs.scalekit.com and struck live
# against api.scalekit.com on 2026-09-07 with no credential, with a
# deliberately invalid one, and with a Host header naming a tenant.
#
# **The API refuses on the domain before anything else.** Struck live, three
# requests:
#
#   GET /api/v1/organizations                        (no credential)
#   GET /api/v1/organizations                        Host: cauldron.scalekit.com
#   GET /api/v1/organizations                        Authorization: Bearer notreal
#
#   404  Content-Type: text/plain
#   invalid domain in request
#
# All three, identically. Not 401, not 403 -- 404, in plain text, saying
# nothing about the credential and everything about the hostname.
#
# Scalekit issues every customer their own subdomain, and `api.scalekit.com` is
# not one of them: it is the apex the documentation names, and it serves
# nothing. So the first request a developer makes, copied from the reference,
# is refused for a reason the reference does not mention -- and the refusal
# does not say what a valid domain would look like.
#
# **A Host header does not help.** Sending `Host: cauldron.scalekit.com`
# changes nothing, because the tenant is resolved from the TLS SNI and the
# certificate rather than from the header. Which is correct, and it means the
# only way to reach this API is to already know your own subdomain.
#
# **It is 404 rather than 421.** RFC 9110 defines 421 Misdirected Request for
# exactly this: a request sent to a server that cannot produce a response for
# the target URI's authority. Nothing in this collection sends a 421, and this
# is the one place it belonged.
#
# **The whole observable API is four words.** No JSON, no code, no correlation
# id, no link. `invalid domain in request`, lower case, no full stop.
#
# **And the host root serves a React application.** `GET /` answers 200 with an
# HTML shell carrying `<meta name="sk-onprem">` -- the self-hosted build of
# Scalekit's dashboard, on the API hostname. So the apex serves a single-page
# app to a browser and four words to an API client.

recipe: scalekit
capability: auth
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.scalekit.com/apis
  # No spec: Scalekit publishes a rendered reference site, and its API is
  # gRPC-transcoded so the surface is described as protobuf rather than
  # OpenAPI.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-scalekit-f1xture-token-0000
  # None of these is reached on the apex hostname, which refuses first.
  absent_error: invalid_domain
  rejected_error: invalid_domain

responses:
  list:
    style: wrapped
    key: organizations
    cursor_field: next_page_token
  error:
    style: text
    message_field: "-"

resources:
  organization:
    id:
      field: id
      style: prefixed
      prefix: "org_"
    fields:
      display_name:
        type: string
      region_code:
        type: string
        default: US
      create_time:
        type: datetime
      external_id:
        type: string

routes:
  - method: GET
    path: /api/v1/organizations
    resource: organization
    operation: list
    pagination:
      style: cursor
      limit: 10
      limit_param: page_size
      cursor_param: page_token

errors:
  invalid_domain:
    # 404 rather than 401, 403 or 421. RFC 9110 defines 421 Misdirected
    # Request for exactly this case, and nothing in this collection sends
    # one.
    status: 404
    style: text
    message: "invalid domain in request"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    organization: []

  environment:
    organization:
      - id: org_59218374651029384
        display_name: Northwind Traders
        region_code: US
        create_time: "2026-05-14T09:02:11Z"
        external_id: cust-0041
      - id: org_59218374651029385
        display_name: Contoso Ltd
        # A different region on the same environment, so where a customer's
        # directory data is stored is per organisation and a client cannot
        # assume one jurisdiction for a listing.
        region_code: EU
        create_time: "2026-07-01T14:30:00Z"

conformance:
  - name: the refusal is about the hostname
    source: https://api.scalekit.com/api/v1/organizations
    verified: "2026-09-07"
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers: {}
    expect:
      # Not 401, not 403. Four words in plain text, saying nothing about the
      # credential and everything about where the request was sent.
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: '^invalid domain in request$'

  - name: a credential does not change it
    source: https://api.scalekit.com/api/v1/organizations
    verified: "2026-09-07"
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Identical. The domain is checked before the credential, so a caller on
      # the apex cannot find out whether their key works.
      status: 404
      body_matches: '^invalid domain in request$'

  - name: a Host header does not change it either
    source: https://api.scalekit.com/api/v1/organizations
    verified: "2026-09-07"
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        # The tenant is resolved from the TLS SNI and the certificate rather
        # than from this header -- which is correct, and it means the only way
        # to reach this API is to already know your own subdomain.
        Host: cauldron.scalekit.com
    expect:
      status: 404
      body_matches: '^invalid domain in request$'

  - name: the whole observable failure is four words
    source: https://api.scalekit.com/api/v1/organizations
    verified: "2026-09-07"
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers: {}
    expect:
      status: 404
      # No JSON, no code, no correlation id, no link. Lower case, no full
      # stop. response.json() throws on every failure this hostname produces.
      body_matches: '^invalid domain in request$'

  - name: organizations are wrapped under their own plural
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
    expect:
      status: 200
      body:
        'organizations[0].id': org_59218374651029384
        'organizations[0].display_name': Northwind Traders

  - name: the identifier is a prefix and seventeen digits
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
    expect:
      status: 200
      body:
        # A Snowflake-shaped id behind a prefix, so it is a string carrying a
        # number that would not survive a double if it were sent as one -- and
        # two organisations created seconds apart are one apart.
        'organizations[1].id': org_59218374651029385

  - name: the region is per organisation
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
    expect:
      status: 200
      body:
        # Where a customer's directory data is stored, on the record rather
        # than on the environment -- so a listing can span jurisdictions and a
        # client cannot assume one for all of them.
        'organizations[0].region_code': US
        'organizations[1].region_code': EU

  - name: the customer's own reference is optional
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
    expect:
      status: 200
      body:
        # The only handle that means anything in the integrating
        # application's own system, and it is optional -- so a client keying
        # on it drops rows.
        'organizations[0].external_id': cust-0041
        'organizations[0].create_time': "2026-05-14T09:02:11Z"
      absent:
        - 'organizations[1].external_id'

  - name: organizations page on a token
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
      query:
        page_size: "1"
    expect:
      status: 200
      body:
        'organizations[0].display_name': Northwind Traders
      matches:
        # A token rather than a URL, absent rather than null on the last page.
        next_page_token: '.'

  - name: the last page carries no token
    source: https://docs.scalekit.com/apis
    fixture: environment
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
      query:
        page_size: "1"
        page_token: org_59218374651029384
    expect:
      status: 200
      body:
        'organizations[0].display_name': Contoso Ltd
      absent:
        - next_page_token

  - name: an environment with no organizations answers an empty array
    source: https://docs.scalekit.com/apis
    fixture: empty
    request:
      method: GET
      path: /api/v1/organizations
      headers:
        Authorization: "Bearer cauldr0n-scalekit-f1xture-token-0000"
    expect:
      status: 200
      body:
        organizations: []
