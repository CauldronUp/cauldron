# Miro Recipe for Cauldron
#
# Miro has no sandbox. A developer team is a real team with a real board count
# against the plan, and a test that creates boards fills the workspace people
# actually use. Deleting a board is soft at first and then permanent, so a
# cleanup step that runs at the wrong moment removes somebody's work. The free
# plan caps boards low enough that a CI suite creating one per run hits the
# limit within a week.
#
# Two things worth modelling exactly:
#
#   1. Position and geometry are nested objects, not flat numbers. An item's
#      coordinates are at position.x and position.y, and its size at
#      geometry.width. Code that reads item.x finds nothing, and there is no
#      error to tell it so: the value is simply undefined and the item lands
#      at the origin.
#   2. The error code is a dotted string, not a number and not a word. It
#      looks like "4.0301" and a client that parses it as a float loses the
#      distinction between 4.03 and 4.0301.
#
# Tokens below are fixtures, not secrets.

recipe: miro
capability: docs
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.miro.com/reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_miro_token

responses:
  list:
    style: wrapped
    count_field: total
    cursor_field: cursor
    fields:
      size: 0
      offset: 0
  error:
    style: flat
    type_field: type
    code_field: code
    message_field: message
    status_field: status

resources:
  board:
    collection: data
    constants:
      type: board
    id:
      style: opaque
      length: 20
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      # A board's sharing policy decides whether a link works for anyone
      # outside the team, and the default is private.
      access:
        type: string
        default: private
      team_access:
        type: string
        default: edit
      view_link:
        type: string
      created_at:
        type: datetime
      modified_at:
        type: datetime

  item:
    collection: data
    id:
      style: digits
      length: 16
    fields:
      board_id:
        type: string
      type:
        type: string
        default: sticky_note
      content:
        type: string
      shape:
        type: string
        default: square
      # Nested under position, which is where Miro puts it. Code reading
      # item.x finds nothing and the item lands at the origin, silently.
      x:
        type: number
        default: 0
        in: position
      y:
        type: number
        default: 0
        in: position
      origin:
        type: string
        default: center
        in: position
      width:
        type: number
        default: 200
        in: geometry
      height:
        type: number
        default: 200
        in: geometry
      created_at:
        type: datetime

  board_member:
    collection: data
    constants:
      type: board_member
    id:
      style: digits
      length: 16
    fields:
      board_id:
        type: string
      name:
        type: string
      # The role decides whether somebody can delete the board. A commenter
      # cannot, and finding out at run time is expensive.
      role:
        type: string
        default: commenter

routes:
  - method: GET
    path: /v2/boards
    resource: board
    operation: list
    pagination:
      style: cursor
      limit: 20

  - method: POST
    path: /v2/boards
    resource: board
    operation: create
    status: 201

  - method: GET
    path: /v2/boards/{id}
    resource: board
    operation: get

  - method: PATCH
    path: /v2/boards/{id}
    resource: board
    operation: update

  - method: DELETE
    path: /v2/boards/{id}
    resource: board
    operation: delete

  - method: GET
    path: /v2/boards/{board_id}/items
    resource: item
    operation: list
    scope: [board_id]
    pagination:
      style: cursor
      limit: 50

  - method: POST
    path: /v2/boards/{board_id}/items
    resource: item
    operation: create
    scope: [board_id]
    status: 201

  - method: GET
    path: /v2/boards/{board_id}/items/{id}
    resource: item
    operation: get
    scope: [board_id]

  - method: GET
    path: /v2/boards/{board_id}/members
    resource: board_member
    operation: list
    scope: [board_id]
    pagination:
      style: cursor
      limit: 50

webhooks:
  events:
    - board_item.created
    - board_item.updated
    - board_item.deleted
    - board.created
  signing:
    scheme: hmac-sha256
    header: X-Miro-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: "4.0429"
    type: error
    message: Too many requests
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  authentication_error:
    status: 401
    code: "1.0000"
    type: error
    message: Invalid or missing access token

  resource_missing:
    status: 404
    code: "4.0301"
    type: error
    message: "Board not found: {detail}"

  parameter_missing:
    status: 400
    code: "3.0100"
    type: error
    message: "Invalid parameters: {detail} is required"

  # A token issued for one team cannot see another's boards, and the failure
  # is a 403 rather than an empty list, which is the difference between
  # "no boards" and "not your team".
  forbidden:
    status: 403
    code: "2.0100"
    type: error
    message: The token does not have access to this team

  # The plan wall. Nothing about the request is wrong.
  board_limit_reached:
    status: 403
    code: "4.0500"
    type: error
    message: The team has reached its board limit

fixtures:
  empty: {}

  small-team:
    board:
      - id: uXjVCauldron0000001=
        name: Roadmap
        description: Quarterly planning
        access: private
        team_access: edit
        view_link: https://miro.com/app/board/uXjVCauldron0000001=/
      - id: uXjVCauldron0000002=
        name: Public retro
        # Anyone with the link can view this one. Assuming every board is
        # private is how a link leaks.
        access: view
        team_access: comment
    item:
      - id: "3000000000000001"
        board_id: uXjVCauldron0000001=
        type: sticky_note
        content: Ship the conformance suite
        x: 120.5
        y: -40
        width: 199
        height: 228
      - id: "3000000000000002"
        board_id: uXjVCauldron0000001=
        type: shape
        shape: round_rectangle
        content: Q2
        x: 0
        y: 0
      - id: "3000000000000003"
        board_id: uXjVCauldron0000002=
        type: sticky_note
        content: Should not appear on the roadmap board
    board_member:
      - id: "4000000000000001"
        board_id: uXjVCauldron0000001=
        name: Ada Lovelace
        role: owner
      - id: "4000000000000002"
        board_id: uXjVCauldron0000001=
        name: Grace Hopper
        # A commenter cannot delete the board, and finding that out at run
        # time is expensive.
        role: commenter

# Conformance cases, read from Miro's REST API reference rather than observed
# against a live team. The verify report says so.
conformance:
  - name: position and geometry are nested, not flat
    source: https://developers.miro.com/reference/get-specific-item
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/items/3000000000000001
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        position:
          x: 120.5
          y: -40
          origin: center
        geometry:
          width: 199
          height: 228
        content: Ship the conformance suite
      # Code reading item.x finds nothing, and nothing says so: the value is
      # undefined and the item lands at the origin.
      absent:
        - x
        - y
        - width

  - name: the error code is a dotted string, not a number
    source: https://developers.miro.com/reference/error-codes
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVNotABoard0000=
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 404
      body:
        # Parsing this as a float loses the difference between 4.03 and
        # 4.0301.
        code: "4.0301"
        type: error
        status: 404
      matches:
        message: 'Board not found'
      absent:
        - error
        - errors

  - name: a collection is wrapped in data with a total
    source: https://developers.miro.com/reference/get-boards
    fixture: small-team
    request:
      method: GET
      path: /v2/boards
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        total: 2
        offset: 0
        data[0].name: Roadmap
        data[0].type: board
      absent:
        - items
        - results

  - name: a board's sharing policy is explicit
    source: https://developers.miro.com/reference/get-specific-board
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000002=
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        # Anyone with the link can view this one. Assuming every board is
        # private is how a link leaks.
        access: view
        team_access: comment
        name: Public retro

  - name: another board's items are not visible
    source: https://developers.miro.com/reference/get-items
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000002=/items
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        total: 1
        data[0].content: Should not appear on the roadmap board
      absent:
        - data[1]

  - name: a created item gets the declared position defaults
    source: https://developers.miro.com/reference/create-sticky-note-item
    fixture: empty
    request:
      method: POST
      path: /v2/boards/uXjVCauldron0000001=/items
      headers:
        Authorization: Bearer cauldron_miro_token
      json:
        content: Added through the API
        position:
          x: 500
          y: 250
    expect:
      status: 201
      body:
        content: Added through the API
        position:
          x: 500
          y: 250
          origin: center
        geometry:
          width: 200
      matches:
        id: '^[1-9][0-9]{15}$'

  - name: a commenter is not an owner
    source: https://developers.miro.com/reference/get-board-members
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/members
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        data[0].role: owner
        # A commenter cannot delete the board. Finding that out at run time
        # is expensive.
        data[1].role: commenter
        data[1].type: board_member

  - name: the paging fields are named cursor
    source: https://developers.miro.com/reference
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/items
      query:
        limit: "1"
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        cursor: '.'
