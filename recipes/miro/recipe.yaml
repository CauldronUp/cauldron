# Miro Recipe for Cauldron
#
# Miro has no sandbox. A developer team is a real team with a real board count
# against the plan, and a test that creates boards fills the workspace people
# actually use. Deleting a board is soft at first and then permanent, so a
# cleanup step that runs at the wrong moment removes somebody's work. The free
# plan caps boards low enough that a CI suite creating one per run hits the
# limit within a week.
#
# Two things worth modelling exactly:
#
#   1. Position and geometry are nested objects, not flat numbers. An item's
#      coordinates are at position.x and position.y, and its size at
#      geometry.width. Code that reads item.x finds nothing, and there is no
#      error to tell it so: the value is simply undefined and the item lands
#      at the origin.
#   2. The error code is a dotted string, not a number and not a word. It
#      looks like "4.0301" and a client that parses it as a float loses the
#      distinction between 4.03 and 4.0301.
#
# Tokens below are fixtures, not secrets.

recipe: miro
capability: docs
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.miro.com/reference
  # This provider's own description, and it declares all three listings
  # this Recipe models. It is where the paging parameter names below
  # were read from.
  spec: https://raw.githubusercontent.com/miroapp/api-clients/main/packages/generator/spec.json
  spec_hash: d0f0aa1ff71229ac04f5d003b597c1102ce70468b7a90478fcb8544bcbf39b46
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_miro_token

responses:
  list:
    style: wrapped
    count_field: total
    cursor_field: cursor
    fields:
      size: 0
      offset: 0
  error:
    style: flat
    type_field: type
    code_field: code
    message_field: message
    status_field: status

resources:
  board:
    collection: data
    constants:
      type: board
    id:
      style: opaque
      length: 20
    fields:
      name:
        type: string
        required: true
      description:
        type: string
      # A board's sharing policy decides whether a link works for anyone
      # outside the team, and the default is private.
      access:
        type: string
        default: private
      team_access:
        type: string
        default: edit
      view_link:
        type: string
      created_at:
        type: datetime
      modified_at:
        type: datetime

  item:
    collection: data
    id:
      style: digits
      length: 16
    fields:
      board_id:
        type: string
      type:
        type: string
        default: sticky_note
      content:
        type: string
      shape:
        type: string
        default: square
      # Nested under position, which is where Miro puts it. Code reading
      # item.x finds nothing and the item lands at the origin, silently.
      x:
        type: number
        default: 0
        in: position
      y:
        type: number
        default: 0
        in: position
      origin:
        type: string
        default: center
        in: position
      width:
        type: number
        default: 200
        in: geometry
      height:
        type: number
        default: 200
        in: geometry
      created_at:
        type: datetime

  board_member:
    collection: data
    constants:
      type: board_member
    id:
      style: digits
      length: 16
    fields:
      board_id:
        type: string
      name:
        type: string
      # The role decides whether somebody can delete the board. A commenter
      # cannot, and finding out at run time is expensive.
      role:
        type: string
        default: commenter

routes:
  - method: GET
    path: /v2/boards
    resource: board
    operation: list
    pagination:
      # Miro's own description declares limit and offset here -- limit
      # "Default: 20", capped at fifty, and offset "The (zero-based) offset
      # of the first item in the collection to return. Default: 0."
      #
      # The items listing on the same API is cursor paging instead, and this
      # one is not. Two styles under one Recipe, from one document.
      style: offset
      limit: 20
      max_limit: 50
      limit_param: limit
      cursor_param: offset

  - method: POST
    path: /v2/boards
    resource: board
    operation: create
    status: 201

  - method: GET
    path: /v2/boards/{id}
    resource: board
    operation: get

  - method: PATCH
    path: /v2/boards/{id}
    resource: board
    operation: update

  - method: DELETE
    path: /v2/boards/{id}
    resource: board
    operation: delete

  - method: GET
    path: /v2/boards/{board_id}/items
    resource: item
    operation: list
    scope: [board_id]
    pagination:
      # And this one is a cursor, where the two listings beside it are
      # offsets. Miro's description says so in the parameter's own words:
      # limit "Default: 10", and "if the number of items in the response is
      # greater than the limit specified, the response returns the cursor
      # parameter with a value".
      style: cursor
      limit: 10
      max_limit: 50
      limit_param: limit
      cursor_param: cursor

  - method: POST
    path: /v2/boards/{board_id}/items
    resource: item
    operation: create
    emits: board_item.created
    scope: [board_id]
    status: 201

  - method: GET
    path: /v2/boards/{board_id}/items/{id}
    resource: item
    operation: get
    scope: [board_id]

  - method: GET
    path: /v2/boards/{board_id}/members
    resource: board_member
    operation: list
    scope: [board_id]
    pagination:
      # Miro's own description declares limit and offset here -- limit
      # "Default: 20", capped at fifty, and offset "The (zero-based) offset
      # of the first item in the collection to return. Default: 0."
      #
      # The items listing on the same API is cursor paging instead, and this
      # one is not. Two styles under one Recipe, from one document.
      style: offset
      limit: 20
      max_limit: 50
      limit_param: limit
      cursor_param: offset

webhooks:
  events:
    - board_item.created
    - board_item.updated
    - board_item.deleted
    - board.created
  signing:
    scheme: hmac-sha256
    header: X-Miro-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: "4.0429"
    type: error
    message: Too many requests
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  # Confirmed live 2026-09-05 against api.miro.com, no account and no key --
  # a missing credential and a wrong one answer this identical body. This
  # file declared code "1.0000" and a different sentence; neither matches.
  authentication_error:
    status: 401
    code: tokenNotProvided
    type: error
    message: No authorization data was found on the request

  resource_missing:
    status: 404
    code: "4.0301"
    type: error
    message: "Board not found: {detail}"

  parameter_missing:
    status: 400
    code: "3.0100"
    type: error
    message: "Invalid parameters: {detail} is required"

  # A token issued for one team cannot see another's boards, and the failure
  # is a 403 rather than an empty list, which is the difference between
  # "no boards" and "not your team".
  forbidden:
    status: 403
    code: "2.0100"
    type: error
    message: The token does not have access to this team

  # The plan wall. Nothing about the request is wrong.
  board_limit_reached:
    status: 403
    code: "4.0500"
    type: error
    message: The team has reached its board limit

fixtures:
  empty: {}

  small-team:
    board:
      - id: uXjVCauldron0000001=
        name: Roadmap
        description: Quarterly planning
        access: private
        team_access: edit
        view_link: https://miro.com/app/board/uXjVCauldron0000001=/
      - id: uXjVCauldron0000002=
        name: Public retro
        # Anyone with the link can view this one. Assuming every board is
        # private is how a link leaks.
        access: view
        team_access: comment
    item:
      - id: "3000000000000001"
        board_id: uXjVCauldron0000001=
        type: sticky_note
        content: Ship the conformance suite
        x: 120.5
        y: -40
        width: 199
        height: 228
      - id: "3000000000000002"
        board_id: uXjVCauldron0000001=
        type: shape
        shape: round_rectangle
        content: Q2
        x: 0
        y: 0
      - id: "3000000000000003"
        board_id: uXjVCauldron0000002=
        type: sticky_note
        content: Should not appear on the roadmap board
    board_member:
      - id: "4000000000000001"
        board_id: uXjVCauldron0000001=
        name: Ada Lovelace
        role: owner
      - id: "4000000000000002"
        board_id: uXjVCauldron0000001=
        name: Grace Hopper
        # A commenter cannot delete the board, and finding that out at run
        # time is expensive.
        role: commenter

# Conformance cases, read from Miro's REST API reference rather than observed
# against a live team. The verify report says so.
conformance:
  - name: an unauthenticated request is refused the same way, credential or not
    source: https://api.miro.com/v2/boards
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/boards
    expect:
      status: 401
      body:
        code: tokenNotProvided
        type: error
        status: 401
        message: No authorization data was found on the request

  - name: position and geometry are nested, not flat
    source: https://developers.miro.com/reference/get-specific-item
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/items/3000000000000001
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        position:
          x: 120.5
          y: -40
          origin: center
        geometry:
          width: 199
          height: 228
        content: Ship the conformance suite
      # Code reading item.x finds nothing, and nothing says so: the value is
      # undefined and the item lands at the origin.
      absent:
        - x
        - y
        - width

  - name: the error code is a dotted string, not a number
    source: https://developers.miro.com/reference/error-codes
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVNotABoard0000=
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 404
      body:
        # Parsing this as a float loses the difference between 4.03 and
        # 4.0301.
        code: "4.0301"
        type: error
        status: 404
      matches:
        message: 'Board not found'
      absent:
        - error
        - errors

  - name: a collection is wrapped in data with a total
    source: https://developers.miro.com/reference/get-boards
    fixture: small-team
    request:
      method: GET
      path: /v2/boards
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        total: 2
        offset: 0
        data[0].name: Roadmap
        data[0].type: board
      absent:
        - items
        - results

  - name: a board's sharing policy is explicit
    source: https://developers.miro.com/reference/get-specific-board
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000002=
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        # Anyone with the link can view this one. Assuming every board is
        # private is how a link leaks.
        access: view
        team_access: comment
        name: Public retro

  - name: another board's items are not visible
    source: https://developers.miro.com/reference/get-items
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000002=/items
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        total: 1
        data[0].content: Should not appear on the roadmap board
      absent:
        - data[1]

  - name: a created item gets the declared position defaults
    source: https://developers.miro.com/reference/create-sticky-note-item
    fixture: empty
    request:
      method: POST
      path: /v2/boards/uXjVCauldron0000001=/items
      headers:
        Authorization: Bearer cauldron_miro_token
      json:
        content: Added through the API
        position:
          x: 500
          y: 250
    expect:
      status: 201
      body:
        content: Added through the API
        position:
          x: 500
          y: 250
          origin: center
        geometry:
          width: 200
      matches:
        id: '^[1-9][0-9]{15}$'

  - name: a commenter is not an owner
    source: https://developers.miro.com/reference/get-board-members
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/members
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      body:
        data[0].role: owner
        # A commenter cannot delete the board. Finding that out at run time
        # is expensive.
        data[1].role: commenter
        data[1].type: board_member

  - name: the paging fields are named cursor
    source: https://developers.miro.com/reference
    fixture: small-team
    request:
      method: GET
      path: /v2/boards/uXjVCauldron0000001=/items
      query:
        limit: "1"
      headers:
        Authorization: Bearer cauldron_miro_token
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        cursor: '.'

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://developers.miro.com/reference/get-boards"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].id": "uXjVCauldron0000001="
      absent:
        - "data[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://developers.miro.com/reference/get-boards"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].id": "uXjVCauldron0000002="
      absent:
        - "data[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read, and a page of one is not the whole collection"
    source: "https://developers.miro.com/reference/get-board-members"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards/uXjVCauldron0000001=/members"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].name": "Ada Lovelace"
      absent:
        - "data[1]"

  # And the position. offset=1 answers a different record, which the
  # size alone cannot produce.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://developers.miro.com/reference/get-board-members"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards/uXjVCauldron0000001=/members"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].name": "Grace Hopper"
      absent:
        - "data[1]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but cursor can be: past the only
  # record the collection is empty, where a name the runtime ignored
  # would have answered with the record again.
  - name: "cursor moves the page on, and what comes back is not page one"
    source: "https://developers.miro.com/reference/get-items"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards/uXjVCauldron0000002=/items"
      query:
        "limit": "1"
        "cursor": "3000000000000003"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      absent:
        - "data[0]"

  # The names. This Recipe declares 4 field(s) on a board that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a board carries the field names this Recipe declares"
    source: "https://developers.miro.com/reference/get-boards"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].created_at": "2026-01-01T00:00:00Z"
        "data[0].description": "Quarterly planning"
        "data[0].modified_at": "2026-01-01T00:00:00Z"
        "data[0].view_link": "https://miro.com/app/board/uXjVCauldron0000001=/"

  # The names. This Recipe declares 1 field(s) on a board_member that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a board_member carries the field names this Recipe declares"
    source: "https://developers.miro.com/reference/get-board-members"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards/uXjVCauldron0000001=/members"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].board_id": "uXjVCauldron0000001="

  # The names. This Recipe declares 8 field(s) on a item that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 8 name(s) that came back at the paths they came back
  # under.
  - name: "an item carries the field names this Recipe declares"
    source: "https://developers.miro.com/reference/get-items"
    fixture: small-team
    request:
      method: GET
      path: "/v2/boards/uXjVCauldron0000001=/items"
      headers:
        "Authorization": "Bearer cauldron_miro_token"
    expect:
      status: 200
      body:
        "data[0].board_id": "uXjVCauldron0000001="
        "data[0].created_at": "2026-01-01T00:00:00Z"
        "data[0].geometry.height": 228
        "data[0].position.origin": "center"
        "data[0].shape": "square"
        "data[0].geometry.width": 199
        "data[0].position.x": 120.5
        "data[0].position.y": -40




