# Agora Recipe for Cauldron
#
# Agora is the third credential shape this group's brief asks after, and it
# is not a bearer key and not a self-signed JWT -- it is HTTP Basic, a
# Customer ID and Customer Secret pair generated once in the Agora Console
# and concatenated with a colon before Base64 encoding, per Agora's own
# words on the authentication page: "Concatenate the customer ID and
# customer secret with a colon, encode the result with Base64, then prefix
# it with Basic." That single credential authenticates two structurally
# different surfaces on the same host, api.agora.io -- project/account
# administration (/dev/v1/project, /dev/v1/projects) and RTC channel
# management (/dev/v1/channel/*) -- confirmed by reading both
# authentication pages independently: docs.agora.io's Console REST API page
# and its RTC RESTful-authentication page state the identical Basic-over-
# Customer-ID/Secret mechanism in almost the same sentence, for what this
# task otherwise has no reason to believe are the same code path.
#
# That management credential is a third shape again from what a client
# actually joining a channel presents. Agora's real-time SDKs authenticate a
# channel join with a Token -- generated from an App Certificate via
# Agora's own AccessToken2 algorithm, a versioned, HMAC-signed, base64
# binary format ("007" the current version prefix) -- not the JWT this
# group's brief describes for LiveKit. This Recipe's own header is a place
# to say so plainly rather than assume the brief's framing carries over
# unchecked: LiveKit's join and management credentials really are one JWT
# mechanism wearing two grants (see recipes/livekit/recipe.yaml's header,
# quoting docs.livekit.io's own words for it), and Agora's real-time join
# Token was not independently verified for this task -- reading its own
# construction was out of scope for what api.agora.io's REST surface alone
# can show -- but nothing this task read anywhere calls it a JWT, and its
# own documented version-prefix scheme is not one. What this Recipe can
# state with confidence, because it struck both live, is the third shape
# the brief asked after directly: RESTful management over api.agora.io is
# HTTP Basic on a Customer ID/Secret pair, a third credential shape again
# from either of the other two providers in this group.
#
# The room-lifecycle question this group exists to answer has the flattest
# possible shape on Agora, flatter even than recipes/livekit/recipe.yaml's
# own answer to the identical question. There is no create route for a
# channel anywhere in Agora's published RTC reference, no delete route, and
# no route that answers about one channel addressed by name alone -- the
# only channel-scoped read is GET /dev/v1/channel/{appid}, a paged listing
# of every channel CURRENTLY OCCUPIED under a project, and Agora's own
# reference states the instability of that snapshot in words rather than
# leaving it implied: "If the number of users in a channel changes
# frequently, the query results may be inaccurate... A channel does not
# appear on any page" is listed as an ordinary, expected outcome, not an
# error condition. A channel that has never existed and a channel that
# emptied a moment before the request both fail to appear on any page, for
# the identical reason -- there was nobody in it when the snapshot was
# taken -- and nothing on this surface can tell those two apart, because
# nothing on this surface addresses a channel independently of who is
# currently connected to it. Compare recipes/whereby/recipe.yaml, the
# group's control, where a create mints a real record with a lifetime a
# clock enforces regardless of occupancy: Agora has no record to mint at
# all. A channel is a name people are connected under, full stop.
#
# GET /dev/v1/channel/user/property/{appid}/{uid}/{channelName} answers the
# occupancy question about one specific user instead of a whole channel,
# and its own documented shape states this group's central ambiguity in
# one sentence: in_channel (boolean) is "Whether the user is in the
# channel. When false, no other fields are returned." A user who left ten
# seconds ago, a user who was never in this channel at all, and a channel
# name that was never occupied by anyone all collapse to the identical
# {"success": true, "data": {"in_channel": false}} -- the same shape this
# group's LiveKit Recipe found for a room name matching nothing in
# ListRooms, reached by a completely different route on a completely
# different provider. Whether uid itself survives alongside in_channel:
# false or disappears too is not stated precisely enough by that one
# sentence to pin either way, and this Recipe does not assert it.
#
# Missing and wrong credentials answer differently, and the direction they
# collapse in is the mirror image of every other provider in this group.
# Struck live against api.agora.io with no account and no key ever created:
#
#   no Authorization header at all
#     -> 401 {"message":"Unauthorized"}
#        WWW-Authenticate: Basic realm="kong"
#   Basic, a well-formed pair, wrong secret
#   Bearer junktoken12345 (wrong scheme entirely)
#   Basic, not valid base64 at all
#   Basic, valid base64, no colon once decoded (not parseable as user:pass)
#   Basic  (prefix, nothing after it)
#     -> 401 {"message":"Invalid authentication credentials"}
#        no WWW-Authenticate header at all
#
# Six requests, five of them different shapes of "something was presented
# and it does not check out," and all five answer the identical sentence --
# a genuinely wrong Basic pair and a completely different Authorization
# scheme collapse together here, not just a Basic pair that fails to parse.
# Only a header that is not there at all gets the other one, and it is the
# only case that carries a WWW-Authenticate challenge. That is the reverse
# of recipes/daily/recipe.yaml's own credential check in this same group,
# where malformed collapses toward absent -- Agora's malformed collapses
# toward rejected instead, and every one of the five shapes above was
# struck live to confirm it is not only the single obvious case (a right-
# shaped, wrong-valued Basic pair) that lands there.
#
# Timed rather than assumed, the same re-check every Recipe in this group
# ran for the reason recipes/100ms/recipe.yaml's own header states: its
# sharpest finding is that its two deepest credential failures differ only
# in cost, sub-2ms against 221ms. Three requests each against
# api.agora.io/dev/v1/projects: absent averaged roughly 112-137ms and
# wrong-credential roughly 117-134ms, the same band with no consistent gap.
# Nothing here suggests Agora's rejected check reaches any further than its
# absent one.
#
# Routing and the credential check answer in the same order as
# recipes/daily/recipe.yaml's, struck independently and confirmed four
# ways: GET /dev/v1/nosuchroute and PATCH /dev/v1/projects (a real path,
# wrong method) both answered 404 {"message":"no Route matched with those
# values"} with no credential at all, and the identical 404 came back again
# with a wrong Basic credential attached to both -- so a credential, right
# or wrong, is never examined once the router has already failed to find a
# match. auth.after_routing: true reproduces this exactly.
#
# Content-Type told the truth on every response this task read: every
# success and every failure, on both the Console and RTC surfaces, answered
# application/json and parsed as the object described.
#
# One more asymmetry, read rather than struck, because it would need a real
# account to trigger: every route on this host answers 201 for success, not
# 200 -- including GET /dev/v1/project and GET /dev/v1/projects, reads that
# most APIs in this collection would answer with 200. The one exception is
# GET /dev/v3/usage, which the same reference states answers 200. A client
# checking response.ok or status === 200 across this API's own routes is
# right on exactly one of the ones this Recipe models and wrong on the
# other two.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no Customer ID or Customer Secret was
#     ever requested, guessed or used. Every 20x case below is read from
#     docs.agora.io's own published reference and carries no verified date;
#     only the credential and routing cases -- struck against
#     api.agora.io/dev/v1/projects with no account -- carry one.
#   - GET /dev/v1/project (singular), which answers one project, is not
#     modelled. Its own reference requires id AND name as separate, both-
#     required query parameters -- a double-key lookup this format has no
#     single-id "get" operation shaped for -- so only list and create are
#     routed for the project resource; this is observed and not forced.
#   - Cloud recording, RTMP conversion, whiteboard, chat, banning rules,
#     the host list, the IP-address lookup and the on-premise recording
#     server APIs are all real, documented parts of Agora's surface and
#     none of them are modelled. This Recipe is scoped to what the group's
#     question turns on: a project's own administration, and how far a
#     channel or a user's occupancy in one can be addressed at all.
#   - Every value in the small-account fixture below except the fixture's
#     own id and appid strings is the literal example value from Agora's
#     own published reference (project1, the "4855..." key pattern, the
#     1464165672 timestamp, channel lkj144's user_count of 3, uid
#     2845863044's join time and role) -- the reference's own worked
#     examples reuse the placeholder "xxxx" for a project id across
#     several distinct entries, which this Recipe does not repeat, because
#     two records sharing one identifier cannot both be stored.
#   - GET /dev/v1/projects (list) has no limit, page size or cursor of any
#     kind documented anywhere this task read -- every project an account
#     holds comes back in one answer. This Recipe declares no pagination
#     for the route either, which means Cauldron's own runtime pages it at
#     ten anyway, reading a "limit" parameter the real endpoint does not
#     take; stated here rather than declared with a parameter invented for
#     it.
#   - Call frequency is documented as "no more than 10 queries per second"
#     per Agora account for the Console surface and never triggered; no
#     specific rate-limit header or body is served for it because none was
#     ever observed.
#
# The credential below is a fixture and belongs to no account.

recipe: agora
capability: voice
version: 0.1.0

upstream:
  api: dev/v1
  docs: https://docs.agora.io/en/api-reference/api-ref/console/solutions-agora-console-rest-api
  spec: https://docs.agora.io/openapi/rtc/channel-management.en.yaml
  spec_hash: 474b90bfffa5428a0a089a38962745355b9de577a09fc09926fcfb23bc9ca8e6
  spec_seen: "2026-09-02"

auth:
  scheme: basic
  # The secret is the password half -- Customer ID is the username,
  # Customer Secret is the password, per Agora's own words on both
  # authentication pages this task read.
  credential: password
  keys:
    - cauldron-fixture-agora-customer-secret-0000000000000000
  # Struck live: absent gets its own sentence and its own WWW-Authenticate
  # challenge. Everything else that was presented and did not check out --
  # a wrong Basic pair, a wrong scheme entirely, unparseable Basic, no
  # colon once decoded, or the prefix alone -- collapsed to the identical
  # second sentence, five different ways, all struck live. See the header.
  absent_error: unauthorized
  malformed_error: invalid_credentials
  rejected_error: invalid_credentials
  # Verified four ways live: an unrouted path and a wrong method on a real
  # path both 404 with no credential examined, whether or not one was sent.
  after_routing: true

responses:
  list:
    style: wrapped
    # Only channel lacks its own collection name (see the route below,
    # which nests two levels deep and overrides this); project's own list
    # route uses its resource's collection: projects instead.
    key: data.channels
  resource:
    style: bare
  error:
    # {"message": "..."} -- one field, no code, no type, on every failure
    # this task struck or read.
    style: flat
    message_field: message
    code_field: "-"

resources:
  # Account administration -- the layer beneath a channel, and the one
  # thing on this host with a genuine create/list lifecycle. Not the
  # group's own "room," but the resource whose credential this Recipe's
  # auth cases were actually struck against.
  project:
    collection: projects
    id:
      style: opaque
    fields:
      name:
        type: string
      # The App ID -- what a channel-management or cloud-recording call
      # addresses a project by, never this resource's own id. Server-minted;
      # defaulted so a freshly created record in a case still carries one.
      vendor_key:
        type: string
        default: cauldron0000fixture0000agora0000vendorkey00
      sign_key:
        type: string
        default: cauldron0000fixture0000agora0000signkey0000
      recording_server:
        type: string
        null_when_unset: true
      status:
        type: integer
        default: 1
      created:
        type: timestamp

  # A page of channels currently occupied under a project -- not a
  # persisted resource with its own lifecycle. See the header: there is no
  # create, no delete, and no way to address one channel independent of
  # who is connected to it right now.
  channel:
    id:
      style: opaque
      field: channel_name
    fields:
      appid:
        type: string
        in: "-"
      user_count:
        type: integer
        default: 0

  # Whether one specific user is, right now, present in one specific
  # channel -- not a resource with a history. See the header for what
  # in_channel: false does and does not say about why.
  user_status:
    id:
      # "This parameter does not support string user accounts; use the
      # integer user ID only" -- the reference's own words.
      style: numeric
      type: number
      field: uid
    fields:
      appid:
        type: string
        in: "-"
      channelName:
        type: string
        in: "-"
      in_channel:
        type: boolean
        default: true
      # None of the three below carry null_when_unset: when in_channel is
      # false, this Recipe's own fixture omits them entirely, the same
      # shape the reference's own sentence describes -- "no other fields
      # are returned" -- rather than rendering them as null.
      join:
        type: timestamp
        stamped: false
      role:
        type: integer
      platform:
        type: integer

routes:
  - method: GET
    path: /dev/v1/projects
    resource: project
    operation: list
    pagination:
      # No limit, page size or cursor of any kind documented anywhere this
      # task read: every project an account holds comes back in one answer.
      # So this listing does not page.
      #
      # The header recorded that and could only record it. A route with no
      # paging block got the runtime's own default -- ten records, reading a
      # "limit" the real endpoint does not take -- which the note called out
      # and could not prevent.
      style: none
    status: 201

  - method: POST
    path: /dev/v1/project
    resource: project
    operation: create
    status: 201
    # {"project": {...}} -- a single object wrapped under its own singular
    # name, unlike the list route's bare "projects" array beside it.
    envelope:
      style: wrapped
      key: project
    returns: [id, name, vendor_key, sign_key, recording_server, status, created]

  - method: GET
    path: /dev/v1/channel/{appid}
    resource: channel
    operation: list
    scope: [appid]
    status: 201
    fields:
      success: true
    list:
      style: wrapped
      key: data.channels
      count_field: data.total_size
    pagination:
      style: page
      limit: 100
      max_limit: 500
      limit_param: page_size
      cursor_param: page_no
      first_page: 0

  - method: GET
    path: /dev/v1/channel/user/property/{appid}/{id}/{channelName}
    resource: user_status
    operation: get
    scope: [appid, channelName]
    status: 201
    fields:
      success: true
    envelope:
      style: wrapped
      key: data

errors:
  # Struck live: no Authorization header at all, and nothing else. The
  # only failure carrying a challenge header.
  unauthorized:
    status: 401
    message: Unauthorized
    headers:
      WWW-Authenticate: 'Basic realm="kong"'

  # Struck live five ways -- see the header: a wrong Basic pair, a wrong
  # scheme entirely, unparseable Basic, no colon once decoded, and the
  # prefix alone with nothing after it. No WWW-Authenticate on this one.
  invalid_credentials:
    status: 401
    message: Invalid authentication credentials

  # Struck live: an unrouted path and a wrong method on a real path, each
  # with and without a credential attached. Kong's own router rescue,
  # reached before the credential plugin ever runs.
  unknown_route: &agora_route_not_found
    status: 404
    message: no Route matched with those values

  method_not_allowed: *agora_route_not_found

fixtures:
  empty: {}

  small-account:
    project:
      # The create-a-project and get-all-projects worked examples, quoted
      # in the header: name, the "4855..." key pattern, and the timestamp
      # are all cited verbatim. The id below is a fixture label, because
      # the reference's own example repeats the placeholder "xxxx" across
      # several distinct project entries -- see the header.
      - id: cauldron-fixture-project-1
        name: project1
        vendor_key: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
        sign_key: 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2
        recording_server: null
        status: 1
        created: 1464165672

    channel:
      # The query-the-channel-list worked example, quoted in the header.
      - id: lkj144
        channel_name: lkj144
        appid: cauldron-fixture-appid-00000000000000000000000000000000
        user_count: 3

    user_status:
      # The query-the-user-status worked example, quoted in the header.
      - id: 2845863044
        uid: 2845863044
        appid: cauldron-fixture-appid-00000000000000000000000000000000
        channelName: cauldron-fixture-channel
        in_channel: true
        join: 1640330382
        role: 2
        platform: 7
      # Not in the reference's own worked example -- built from its prose
      # instead: "When false, no other fields are returned." No join, no
      # role, no platform, and this Recipe does not assert uid one way or
      # the other either -- see the header.
      - id: 9999999999
        uid: 9999999999
        appid: cauldron-fixture-appid-00000000000000000000000000000000
        channelName: cauldron-fixture-channel
        in_channel: false

conformance:
  - name: no credential at all is Unauthorized, with a Basic challenge
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/projects
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Basic realm="kong"'
      body:
        message: Unauthorized

  - name: a well-formed but wrong Basic pair is a different sentence, with no challenge header
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/projects
      headers:
        # base64("junkcustomerid:junkcustomersecret")
        Authorization: Basic anVua2N1c3RvbWVyaWQ6anVua2N1c3RvbWVyc2VjcmV0
    expect:
      status: 401
      body:
        message: Invalid authentication credentials
      absent_headers:
        - WWW-Authenticate

  - name: a completely different scheme collapses to the identical sentence, not the absent one
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/projects
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        message: Invalid authentication credentials

  - name: Basic that is not valid base64 at all lands in the same place too
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/projects
      headers:
        Authorization: "Basic not-valid-base64-!!!"
    expect:
      status: 401
      body:
        message: Invalid authentication credentials

  - name: and so does Basic with nothing after the prefix
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/projects
      headers:
        Authorization: "Basic "
    expect:
      status: 401
      body:
        message: Invalid authentication credentials

  - name: an unrouted path 404s with no credential examined
    source: https://api.agora.io/dev/v1/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/nosuchroute
    expect:
      status: 404
      body:
        message: no Route matched with those values

  - name: and the identical 404 comes back with a credential attached too
    source: https://api.agora.io/dev/v1/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /dev/v1/nosuchroute
      headers:
        Authorization: Basic anVua2N1c3RvbWVyaWQ6anVua2N1c3RvbWVyc2VjcmV0
    expect:
      status: 404
      body:
        message: no Route matched with those values

  - name: a wrong method on a real path gets the identical 404, not a 405
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /dev/v1/projects
    expect:
      status: 404
      body:
        message: no Route matched with those values

  - name: and that holds with a credential attached as well
    source: https://api.agora.io/dev/v1/projects
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PATCH
      path: /dev/v1/projects
      headers:
        Authorization: Basic anVua2N1c3RvbWVyaWQ6anVua2N1c3RvbWVyc2VjcmV0
    expect:
      status: 404
      body:
        message: no Route matched with those values

  - name: a successful read answers 201, not 200
    source: https://docs.agora.io/en/api-reference/api-ref/console/solutions-agora-console-rest-api
    fixture: small-account
    request:
      method: GET
      path: /dev/v1/projects
      headers:
        Authorization: Basic Y2F1bGRyb24tZml4dHVyZS1hZ29yYS1jdXN0b21lci1pZC0wMDAwMDAwMDpjYXVsZHJvbi1maXh0dXJlLWFnb3JhLWN1c3RvbWVyLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw
    expect:
      status: 201
      body:
        "projects[0].name": project1
        "projects[0].vendor_key": 4855xxxxxxxxxxxxxxxxxxxxxxxxeae2

  - name: a channel list is a presence snapshot, not a resource with a lifecycle
    source: https://docs.agora.io/en/api-reference/api-ref/rtc/query-channel-list
    fixture: small-account
    request:
      method: GET
      path: /dev/v1/channel/cauldron-fixture-appid-00000000000000000000000000000000
      headers:
        Authorization: Basic Y2F1bGRyb24tZml4dHVyZS1hZ29yYS1jdXN0b21lci1pZC0wMDAwMDAwMDpjYXVsZHJvbi1maXh0dXJlLWFnb3JhLWN1c3RvbWVyLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw
    expect:
      status: 201
      body:
        success: true
        "data.channels[0].channel_name": lkj144
        "data.channels[0].user_count": 3
        "data.total_size": 1

  - name: a user currently in a channel carries a role and a join time
    source: https://docs.agora.io/en/api-reference/api-ref/rtc/query-user-status
    fixture: small-account
    request:
      method: GET
      path: /dev/v1/channel/user/property/cauldron-fixture-appid-00000000000000000000000000000000/2845863044/cauldron-fixture-channel
      headers:
        Authorization: Basic Y2F1bGRyb24tZml4dHVyZS1hZ29yYS1jdXN0b21lci1pZC0wMDAwMDAwMDpjYXVsZHJvbi1maXh0dXJlLWFnb3JhLWN1c3RvbWVyLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw
    expect:
      status: 201
      body:
        success: true
        "data.in_channel": true
        "data.role": 2
        "data.platform": 7

  - name: a user not currently present answers in_channel false and nothing else
    # Built from the reference's own sentence, not a worked example -- see
    # the header and the fixture comment. This is the identical ambiguity
    # recipes/livekit/recipe.yaml finds by a completely different route:
    # nothing here distinguishes a user who left from one who was never in
    # this channel to begin with, or a channel name nobody has ever used.
    source: https://docs.agora.io/en/api-reference/api-ref/rtc/query-user-status
    fixture: small-account
    request:
      method: GET
      path: /dev/v1/channel/user/property/cauldron-fixture-appid-00000000000000000000000000000000/9999999999/cauldron-fixture-channel
      headers:
        Authorization: Basic Y2F1bGRyb24tZml4dHVyZS1hZ29yYS1jdXN0b21lci1pZC0wMDAwMDAwMDpjYXVsZHJvbi1maXh0dXJlLWFnb3JhLWN1c3RvbWVyLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw
    expect:
      status: 201
      body:
        success: true
        "data.in_channel": false
      absent:
        - data.join
        - data.role
        - data.platform

  - name: creating a project mints an App ID and an App Certificate together
    source: https://docs.agora.io/en/api-reference/api-ref/console/solutions-agora-console-rest-api
    fixture: empty
    request:
      method: POST
      path: /dev/v1/project
      headers:
        Authorization: Basic Y2F1bGRyb24tZml4dHVyZS1hZ29yYS1jdXN0b21lci1pZC0wMDAwMDAwMDpjYXVsZHJvbi1maXh0dXJlLWFnb3JhLWN1c3RvbWVyLXNlY3JldC0wMDAwMDAwMDAwMDAwMDAw
      json:
        name: cauldron-fixture-project
        enable_sign_key: true
    expect:
      status: 201
      body:
        "project.name": cauldron-fixture-project
        "project.status": 1
      matches:
        "project.vendor_key": ".+"
        "project.sign_key": ".+"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether page_size was read or not -- but page_no can be: past the
  # only record the collection is empty, where a name the runtime
