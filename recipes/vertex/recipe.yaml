# Vertex O Series Recipe for Cauldron
#
# The question this Recipe was asked to answer first -- which product does
# api.vertexcloud.com serve, the cloud API or the on-premise one -- has an
# answer this header states before anything else, because it changes what
# the rest of this file can honestly claim: api.vertexcloud.com does not
# resolve. Checked on 2026-09-01 against three independent resolvers --
# Cloudflare's 1.1.1.1, Google's 8.8.8.8 and dns.google, both A and CNAME
# queries -- and every one answered NXDOMAIN (Status 3). It is not a slow
# host or a firewalled one. The name is not registered to anything.
#
# That does not mean Vertex has no presence at that domain. vertexcloud.com
# itself, no subdomain, resolves and 301s live to
# https://www.vertexinc.com/solutions/products/vertex-cloud-indirect-tax --
# a real product, "Vertex Cloud Indirect Tax," still marketed under this
# domain. And Vertex's own published OpenAPI description for "Vertex Tax
# Calculation and Tax GIS API" (fetched from developer.vertexinc.com's
# ReadMe-hosted registry, version 2.9.0) declares exactly one server:
#
#   servers: [{url: "https://developer.vertexcloud.com/api/v2",
#              description: "Development server"}]
#
# developer.vertexcloud.com, not api.vertexcloud.com -- a different
# subdomain than the one this batch was asked to check -- and it is
# labelled a development server in Vertex's own words, not a production
# one. Checked live: developer.vertexcloud.com resolves, as a CNAME to a
# CloudFront distribution (d1f9psgyrjm5hu.cloudfront.net) -- and that
# distribution itself has no A record, on every resolver tried. The one
# server Vertex's own description names is a dangling CNAME. Two more
# vertexcloud.com subdomains do answer live, and neither is the API either:
# tax-calc-api-v1.vertexcloud.com serves a full static "Vertex Developer
# Network" HTML page from S3 behind CloudFront (Content-Type: text/html,
# Server: AmazonS3), and tax-calc-api.vertexcloud.com serves a 237-byte HTML
# stub that meta-refreshes to developer.vertexinc.com/oseries. Both answer
# 200. Neither is JSON. The developer portal's own O Series page states, in
# its own words, "REST v1 API is no longer available" and gives no
# replacement base URL anywhere a page fetch could find one.
#
# So: neither. api.vertexcloud.com does not serve the cloud product or the
# on-premise one, because it is not a live host at all, and the one URL
# Vertex's own machine-readable description names under this domain is
# marked a development environment and does not currently resolve to an IP
# either. What this leaves unanswered is also an answer: Vertex O Series is
# documented throughout as software a customer deploys and calls, not as a
# single global endpoint the way Avalara's api.avalara.com or Anrok's
# api.anrok.com are in this same batch -- consistent with a product that is
# sold on-premise as much as it is hosted, where "the API" has no one
# address to probe without a customer relationship naming it one.
#
# This changes what Step 2 of this batch's brief could establish here.
# Every unauthenticated-failure question it asks -- does absent differ from
# wrong, is the credential checked before or after routing, does routing
# change with method, does Content-Type tell the truth -- needs a request
# that reaches a server, and none of the addresses this Recipe could find
# for Vertex's tax API answers one. That is itself the finding for this
# provider, distinct from its two siblings in this batch: Anrok's auth check
# turned out to be five layers deep and Tipalti's turned out to answer
# nothing at all, and both of those are things a live probe discovered.
# Vertex's is that there was no live probe to run. Every case below carries
# no verified date for exactly that reason -- not because this Recipe did
# not try, but because trying is recorded above rather than in a request
# that could not be sent.
#
# ---
#
# What the OpenAPI description does establish, read rather than called,
# answers this batch's actual question -- is a calculation stored, and what
# does undoing one do -- as precisely as Anrok's does, on a codebase built
# on the opposite assumption about how old the product is allowed to be.
# POST /supplies (or /procurement, the buyer's-perspective mirror of it, or
# /owner) is one endpoint, and saleMessageType decides everything, in the
# description's own words:
#
#   QUOTATION:  "used to estimate taxes on a proposed sale or rental...
#                Because it is an estimate, a quotation request is subject
#                to change until the transaction is finalized and is not
#                stored for reporting and remittance."
#   INVOICE:    "used to initiate tax calculation on a transaction... Invoice
#                transactions are stored and used for reporting and
#                remittance."
#   DISTRIBUTE_TAX: "a tax-only adjustment (debit or credit) to reconcile a
#                tax underpayment or overpayment... Distribute tax
#                transactions are stored and may affect revenue and be used
#                in reporting and remittance."
#   ARBILLING_SYNC: reconciles Accounts Receivable transactions between
#                Vertex O Series and the host system.
#
# One field, four values, and the same shape Anrok's Recipe in this batch
# finds through two separate endpoints instead: a calculation that estimates
# and a calculation that is filed are the identical request with one string
# changed, closer to Avalara's own documentType switch in this same batch's
# earlier group than to Anrok's createEphemeral/createOrUpdate split.
# transactionType (SALE, RENTAL, LEASE) is a second, orthogonal field on the
# same request -- what kind of commerce this is, not whether it is
# recorded -- the same two-axis shape TaxJar's freight_taxable-by-state and
# Avalara's document-type-plus-commit both are in this batch's first group,
# arrived at a third way.
#
# Undoing a stored transaction is two mechanisms, not one, read from three
# separate operations and their response schemas rather than one paragraph:
#
#   DELETE /transactions/{id}: "Delete a transaction stored in the host
#     system." Its own sibling operation says what that actually means:
#     GET /transaction-exists/{transactionid} answers
#     transactionExistsIndicator with the note "Transactions flagged as
#     Deleted are considered to NOT exist in the Tax Journal" -- flagged,
#     not removed. A status change, exactly the shape Anrok's void is in
#     this same batch, on unrelated code three decades apart.
#   POST /transactions/{id}/reversal: "Creates a second transaction with
#     negated taxability amounts to 'reverse' the original transaction."
#     ReversalRequestResponseType's own transactionId field description
#     confirms it: "An optional unique user-defined value to identify the
#     new reversal document created by this operation." A new record, the
#     same shape Anrok's createNegation is -- and Anrok's request body
#     needs a caller-chosen newTransactionId for the identical reason this
#     one's is optional rather than absent: neither provider will mint an
#     identifier for a record it did not decide to create.
#   POST /transactions/{id}/rollback: "Reverts a transaction to its
#     previous state after having been modified by an ARBILLING_SYNC,
#     APINVOICE_SYNC, or ACCRUAL_SYNC" -- a third mechanism, narrower than
#     the other two: it undoes one specific kind of prior modification
#     rather than the transaction's existence or its amounts, and nothing
#     else on this API does what it does.
#
# None of the three is a route below, the same choice avalara/recipe.yaml
# and this batch's own anrok/recipe.yaml make for their commit and void
# steps: each needs a stateful transition this format has no primitive for
# without approximating a mutation nobody watched happen, and reversal in
# particular needs an id-addressed create this Recipe's own /supplies route
# does not share a resource with cleanly. They are established here, from
# the description's own words, rather than stretched into routes that would
# only gesture at them.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No credential was ever held, tested or refused -- see above for why.
#     auth below declares the scheme the description names (a bearer token,
#     however it was minted -- OAuth2 client-credentials or otherwise) and
#     nothing about its failure modes, because nothing about them was
#     observed.
#   - DELETE, reversal, rollback and transaction-exists are not routes. See
#     above.
#   - No worked example exists anywhere in the published description for
#     /supplies, /procurement or /owner -- checked: the entire document
#     contains exactly two "example" values in total, both latitude and
#     longitude on an unrelated tax-area-lookup schema. Every numeric or
#     jurisdictional figure a real calculation would carry -- a rate, a
#     tax amount, a jurisdiction name -- is therefore absent from this
#     Recipe rather than invented: the one conformance case below proves
#     the shape, not an amount, the same choice turso/recipe.yaml makes for
#     its own unwitnessed create response.
#   - address-lookup, coordinates-lookup, taxareaid-lookup,
#     external-jurisdiction-lookup, find-taxareas and changed-taxareas --
#     the GIS half of this same API -- are real, documented, and not
#     modelled. This Recipe is about the calculate-vs-record question this
#     batch was asked to answer, not a full port of Vertex's tax-area
#     lookup surface.
#   - Tax configuration, role management and user management are separate
#     published API descriptions on the same developer portal
#     (vertex-tax-configuration-api.json, vertex-o-series-role-management
#     -public-api-service.json, vertex-o-series-user-management-public-api
#     -service.json) and none of them are read here.
#
# The credential below is a fixture and was never presented to anything.

recipe: vertex
capability: tax
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.vertexinc.com/oseries
  spec: https://dash.readme.com/api/v1/api-registry/1bto7bwmt0de2rl
  spec_hash: c61d7541448fd2badf6e66b6bfa47ef175523bde54363b91453d06c69657dbfb
  spec_seen: "2026-09-01"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.vertex.fixture.token.0000000000000000000000000000

responses:
  resource:
    style: wrapped
    key: data
  error:
    # ApiErrorResponse per the description: {"errors": [{"code", "message",
    # "target"}], "meta"}. No worked example exists for it either, so the
    # one armed case below proves the envelope's shape and not its wording.
    style: list
    key: errors
    message_field: message
    code_field: code

resources:
  # POST /supplies' request and response share this shape almost entirely
  # (SaleRequestType and SaleResponseType repeat nearly every field name),
  # which this Recipe collapses into one resource rather than declaring the
  # response as a second, near-identical copy.
  calculation:
    id:
      # No id rendered by default -- Cauldron mints one for any resource
      # whose id maps to a field, and SaleRequestType requires only
      # transactionType, so minting one here would claim a QUOTATION always
      # gets an identifier back when the description does not say so.
      # transactionId is declared as an ordinary field below instead,
      # present only when the caller actually supplied it.
      style: opaque
      field: "-"
    fields:
      # QUOTATION, INVOICE, DISTRIBUTE_TAX or ARBILLING_SYNC -- the whole
      # question. See the header.
      saleMessageType:
        type: string
        default: QUOTATION
      # SALE, RENTAL or LEASE -- a second, orthogonal question. See the
      # header.
      transactionType:
        type: string
        default: SALE
      # Caller-supplied and optional on create -- SaleRequestType requires
      # only transactionType. A QUOTATION never needs to be found again, so
      # a caller may reasonably never set this at all; no default and not
      # null_when_unset, so an omitted one is genuinely absent below rather
      # than null.
      transactionId:
        type: string
      documentDate:
        type: string
        null_when_unset: true
      documentNumber:
        type: string
        null_when_unset: true
      currency:
        type: string
        null_when_unset: true
      # Required for a credit note, per SaleRequestType's own description:
      # "Identifies the transaction that has already been processed...
      # Required for generation of credit notes reflecting negative INVOICE
      # requests." A third way to correct a stored transaction, distinct
      # from both DELETE and reversal, and one this Recipe only has room to
      # name rather than model -- see the header's gaps.
      originalTransactionId:
        type: string
        null_when_unset: true
      subTotal:
        type: number
        null_when_unset: true
      total:
        type: number
        null_when_unset: true
      totalTax:
        type: number
        null_when_unset: true
      totalIncludedTax:
        type: number
        null_when_unset: true

routes:
  - method: POST
    path: /supplies
    resource: calculation
    operation: create
    status: 200

errors:
  # Documented with a status and, per the description, nothing else --
  # ApiErrorResponse's own components/responses/401 carries no example.
  # Not observed; see the header.
  authentication_error:
    status: 401

  # Armed, to prove the envelope this description declares
  # (ApiErrorResponse: errors[], each an ApiError of code/message/target)
  # without asserting wording no worked example gives this Recipe to cite.
  # code and message below are this Recipe's own placeholders, not read
  # from anywhere -- the conformance case proves their presence and shape
  # with matches rather than asserting either string as observed.
  validation_error:
    status: 400
    code: unspecified
    message: This Recipe has no documented wording for this failure.

fixtures:
  empty: {}

conformance:
  - name: a quotation is not the same string as an invoice, on the identical request shape
    # No worked example exists to compare a real calculation against -- see
    # the header -- so this proves the one thing the description states
    # outright rather than a figure nobody published: saleMessageType is
    # exactly what the caller sent, round-tripped, and nothing on the
    # response says a QUOTATION was stored or an INVOICE was not beyond
    # that single word.
    source: https://developer.vertexinc.com/oseries
    fixture: empty
    request:
      method: POST
      path: /supplies
      headers:
        Authorization: Bearer cauldron.vertex.fixture.token.0000000000000000000000000000
      json:
        transactionType: SALE
        saleMessageType: QUOTATION
        documentDate: "2026-09-01"
        currency: USD
    expect:
      status: 200
      body:
        data.saleMessageType: QUOTATION
        data.transactionType: SALE
      absent:
        - data.transactionId

  - name: and the same request shape with one word changed is what a stored record looks like
    source: https://developer.vertexinc.com/oseries
    fixture: empty
    request:
      method: POST
      path: /supplies
      headers:
        Authorization: Bearer cauldron.vertex.fixture.token.0000000000000000000000000000
      json:
        transactionId: cauldron-demo-0001
        transactionType: SALE
        saleMessageType: INVOICE
        documentDate: "2026-09-01"
        currency: USD
    expect:
      status: 200
      body:
        data.saleMessageType: INVOICE
        data.transactionId: cauldron-demo-0001

  - name: a failure travels in an errors array, per the description's own envelope
    source: https://dash.readme.com/api/v1/api-registry/1bto7bwmt0de2rl
    arm: validation_error
    fixture: empty
    request:
      method: POST
      path: /supplies
      headers:
        Authorization: Bearer cauldron.vertex.fixture.token.0000000000000000000000000000
      json:
        transactionType: SALE
        saleMessageType: QUOTATION
    expect:
      status: 400
      matches:
        "errors[0].code": "."
        "errors[0].message": "."
      absent:
        - message
        - error

  # The names. This Recipe declares 8 field(s) on a calculation that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a calculation carries the field names this Recipe declares"
    source: "https://developer.vertexinc.com/oseries"
    fixture: empty
    request:
      method: POST
      path: "/supplies"
      json:
        transactionType: SALE
        saleMessageType: QUOTATION
        documentDate: '2026-09-01'
        currency: USD
      headers:
        "Authorization": "Bearer cauldron.vertex.fixture.token.0000000000000000000000000000"
    expect:
      status: 200
      body:
        "data.currency": "USD"
        "data.documentDate": "2026-09-01"

