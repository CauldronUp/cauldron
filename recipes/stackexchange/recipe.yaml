# Stack Exchange Recipe for Cauldron
#
# Every failure is 400, and one of them carries a 404 in the body.
#
#   /2.3/questions                     -> 400 {"error_id": 400, "error_name":
#                                              "bad_parameter", "error_message":
#                                              "site is required"}
#   /2.3/nosuchthing?site=stackoverflow-> 400 {"error_id": 404, "error_name":
#                                              "no_method", "error_message":
#                                              "no method found with this name"}
#
# A path that does not exist is a 400 on the wire and a 404 in the payload, so a
# client switching on the status cannot tell "you asked wrongly" from "there is
# nothing there", and a client switching on error_id disagrees with its own
# transport.
#
# **And error_message is sometimes a sentence and sometimes just a parameter
# name.**
#
#   ?site=nosuchsite       -> "No site found for name `nosuchsite`"
#   ?pagesize=9999         -> "pagesize"
#   /questions/9999999999  -> "ids"
#
# Two of the five say what is wrong. The other two are a single word which is
# the name of the offending parameter, in a field called message -- so anything
# showing error_message to a person shows them the word "ids". And the sentence
# that does explain itself wraps the value in Markdown backticks, in a response
# that is not Markdown.
#
# Written against the live API rather than a document: every case below was
# checked against api.stackexchange.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The rate-limit budget is in the body of every answer. quota_max and
#      quota_remaining sit beside the results, so the payload is different on
#      every request even when the data is not, and anything caching or
#      comparing whole responses never sees two the same.
#   2. There is no total. The envelope carries has_more and nothing else, so
#      the only way to learn how many there are is to ask until it says false.
#      A pager cannot be built from this, and nothing says so.
#   3. Every timestamp is a Unix epoch integer, and two of them are identical:
#      last_activity_date and last_edit_date are both 1775626532 on this
#      question, so the two fields cannot be told apart on the record where a
#      client would most want to.
#
# And every item carries its own licence, content_license: "CC BY-SA 4.0",
# repeated per record rather than sent once.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One question is served, and the counters on it move: view_count, score,
#     reputation, answer_count and the two activity dates are all recorded as
#     they stood when checked, and they will not match tomorrow. They are
#     pinned anyway, because a Recipe that omitted them would describe a
#     question with no score.
#   - quota_remaining is a constant here and a countdown upstream. That is the
#     finding: the number is different on every real request, and no fixture
#     can be right about it, so this one records the shape and the maximum.
#   - has_more is served as declared rather than computed from the fixture.

recipe: stackexchange
capability: docs
version: 0.1.0

upstream:
  api: v2.3
  provider: stackexchange
  docs: https://api.stackexchange.com/docs
  supersedes:
    # The version nearly every published client is written against.
    # stackexchange-api reaches api.stackexchange.com/2.2, and two Packagist
    # packages say 2.2 in their own descriptions.
    - version: v2.2
      host: api.stackexchange.com/2.2
      note: the version most published clients still target, and not the one this Recipe describes

auth:
  # Public without a key, at a lower quota. The quota is in the body below.
  scheme: none

responses:
  list:
    style: wrapped
    key: items
  error:
    style: flat
    message_field: error_message
    code_field: error_id
    # A number, and on one failure it is not the HTTP status.
    code_type: number
    type_field: error_name

resources:
  question:
    id:
      style: numeric
      field: question_id
      type: number
    fields:
      title:
        type: string
      link:
        type: string
      tags:
        type: list
      owner:
        type: map
      is_answered:
        type: boolean
      accepted_answer_id:
        type: integer
      answer_count:
        type: integer
      score:
        type: integer
      view_count:
        type: integer
      # Unix epoch integers, and two of them are the same number.
      creation_date:
        type: integer
      last_activity_date:
        type: integer
      last_edit_date:
        type: integer
      protected_date:
        type: integer
      # A licence, on every record.
      content_license:
        type: string

routes:
  - method: GET
    path: /2.3/questions/11227809
    resource: question
    operation: list
    fields:
      # The rate-limit budget, in the body of the answer.
      quota_max: 300
      quota_remaining: 291
      # And no total anywhere: this is all a pager gets.
      has_more: false

  # No site: a sentence that says what is wrong.
  - method: GET
    path: /2.3/questions
    error: site_required

  # A path that does not exist: 400 on the wire, 404 in the payload.
  - method: GET
    path: /2.3/nosuchthing
    error: no_method

  # A site that does not exist: a sentence, with backticks in it.
  - method: GET
    path: /2.3/questions-unknown-site
    error: unknown_site

  # A page size out of range: a message that is one word, and the word is the
  # name of the parameter.
  - method: GET
    path: /2.3/questions-bad-pagesize
    error: bad_pagesize

errors:
  site_required:
    status: 400
    code: "400"
    type: bad_parameter
    message: site is required

  no_method:
    # Four hundred on the wire...
    status: 400
    # ...and four hundred and four in the body.
    code: "404"
    type: no_method
    message: no method found with this name

  unknown_site:
    status: 400
    code: "400"
    type: bad_parameter
    # Markdown backticks, in a response that is not Markdown.
    message: "No site found for name `nosuchsite`"

  bad_pagesize:
    status: 400
    code: "400"
    type: bad_parameter
    # A message that is a parameter name.
    message: pagesize

fixtures:
  empty: {}

  sorted:
    question:
      - id: "11227809"
        title: Why is conditional processing of a sorted array faster than of an unsorted array?
        link: "https://stackoverflow.com/questions/11227809/why-is-conditional-processing-of-a-sorted-array-faster-than-of-an-unsorted-array"
        tags:
          - java
          - c++
          - performance
          - cpu-architecture
          - branch-prediction
        owner:
          account_id: 31692
          user_id: 87234
          display_name: GManNickG
          reputation: 507387
          user_type: registered
          accept_rate: 100
          profile_image: "https://i.sstatic.net/FkjBe.png?s=256"
          link: "https://stackoverflow.com/users/87234/gmannickg"
        is_answered: true
        accepted_answer_id: 11227902
        answer_count: 25
        score: 27545
        view_count: 1997712
        # Unix epoch integers...
        creation_date: 1340805096
        # ...two of which are the same number.
        last_activity_date: 1775626532
        last_edit_date: 1775626532
        protected_date: 1399067470
        # A licence, on the record rather than on the response.
        content_license: CC BY-SA 4.0

conformance:
  - name: a path that does not exist is 400 on the wire and 404 in the body
    source: "https://api.stackexchange.com/2.3/nosuchthing?site=stackoverflow"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/nosuchthing
    expect:
      # Four hundred...
      status: 400
      body:
        # ...and four hundred and four, in the same response.
        error_id: 404
        error_name: no_method
        error_message: no method found with this name

  - name: and a missing parameter is the same status with a different code
    source: https://api.stackexchange.com/2.3/questions
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions
    expect:
      status: 400
      body:
        # The same status as the one above, and the code agrees this time.
        error_id: 400
        error_name: bad_parameter
        error_message: site is required

  - name: an error message that is a sentence with backticks in it
    source: "https://api.stackexchange.com/2.3/questions?site=nosuchsite"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions-unknown-site
    expect:
      status: 400
      body:
        # Markdown, in a response that is not Markdown.
        error_message: "No site found for name `nosuchsite`"
        error_id: 400
        error_name: bad_parameter

  - name: and an error message that is just a parameter name
    source: "https://api.stackexchange.com/2.3/questions?site=stackoverflow&pagesize=9999"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions-bad-pagesize
    expect:
      status: 400
      body:
        # One word, in a field called message, so anything showing it to a
        # person shows them the word "pagesize".
        error_message: pagesize
        error_id: 400
        error_name: bad_parameter

  - name: the rate-limit budget is in the body of every answer
    source: "https://api.stackexchange.com/2.3/questions/11227809?site=stackoverflow"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions/11227809
    expect:
      status: 200
      body:
        # Beside the results, so the payload differs on every request even
        # when the data does not.
        quota_max: 300
        quota_remaining: 291
        # And no total: this is all a pager gets.
        has_more: false
      absent:
        - total

  - name: every timestamp is an epoch integer and two of them are identical
    source: "https://api.stackexchange.com/2.3/questions/11227809?site=stackoverflow"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions/11227809
    expect:
      status: 200
      body:
        # Seconds since 1970, with no units named anywhere.
        "items[0].creation_date": 1340805096
        # And these two are the same number on this question.
        "items[0].last_activity_date": 1775626532
        "items[0].last_edit_date": 1775626532
        "items[0].protected_date": 1399067470

  - name: every item carries its own licence
    source: "https://api.stackexchange.com/2.3/questions/11227809?site=stackoverflow"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions/11227809
    expect:
      status: 200
      body:
        # Repeated per record rather than sent once for the response.
        "items[0].content_license": CC BY-SA 4.0
        "items[0].question_id": 11227809
        "items[0].title": Why is conditional processing of a sorted array faster than of an unsorted array?
        "items[0].accepted_answer_id": 11227902
        "items[0].is_answered": true
        # The counters, as they stood when this was checked. They move, and
        # the header says so; a Recipe that omitted them would describe a
        # question with no score.
        "items[0].answer_count": 25
        "items[0].score": 27545
        "items[0].view_count": 1997712
        # A link built from the title, so it carries the question's own words.
        "items[0].link": "https://stackoverflow.com/questions/11227809/why-is-conditional-processing-of-a-sorted-array-faster-than-of-an-unsorted-array"

  - name: the tags and the owner, as they arrive
    source: "https://api.stackexchange.com/2.3/questions/11227809?site=stackoverflow"
    verified: "2026-08-30"
    fixture: sorted
    request:
      method: GET
      path: /2.3/questions/11227809
    expect:
      status: 200
      body:
        # A tag with a plus in it, which a client building a URL must escape.
        "items[0].tags[1]": c++
        "items[0].tags[0]": java
        "items[0].tags[4]": branch-prediction
        # Two identifiers for one person, and neither is the display name.
        "items[0].owner.account_id": 31692
        "items[0].owner.user_id": 87234
        "items[0].owner.display_name": GManNickG
        # An acceptance rate as a bare number with no units.
        "items[0].owner.accept_rate": 100
        "items[0].owner.user_type": registered
        "items[0].owner.reputation": 507387
        # An avatar with its size in the query string, so the URL is not the
        # image but a request for one.
        "items[0].owner.profile_image": "https://i.sstatic.net/FkjBe.png?s=256"
