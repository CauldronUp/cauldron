# Aptible Recipe for Cauldron
#
# The accounts listing, struck live against api.aptible.com on 2026-09-13 with
# no credential and with a deliberately invalid one. Record shapes come from
# Aptible's own generated Go client, which is open.
#
# **A request with no credential at all answers 200.** Struck live:
#
#   GET /accounts            200 {"_embedded":{"accounts":[]},"total_count":0,
#                                 "per_page":40,"current_page":1,
#                                 "_links":{"self":{"href":"..."}}}
#   Authorization: Bearer x  400 {"code":400,"error":"invalid_token","message":"Invalid Token"}
#
# Not 401. The collection is scoped to whoever is asking, an unauthenticated
# caller owns nothing, and the answer is a successful, well-formed, entirely
# empty page. So a client that checks `response.ok` and reads `total_count`
# concludes the user has no environments -- and a monitoring check written that
# way reports healthy for a token that was never sent.
#
# A *wrong* token is refused, and refused with **400** rather than 401. So the
# two credential states that both mean "you are not signed in" answer a success
# and a bad-request, and 401 never appears.
#
# **The root document is public too.** `GET /` answers a HAL index naming every
# collection -- accounts, apps, databases, stacks, active_plans,
# database_images, external_aws_accounts -- to a caller who has presented
# nothing.
#
# **It is HAL, and it does not link its pages.** The envelope carries
# `total_count`, `per_page` and `current_page`, and `_links` holds exactly one
# key: `self`. No `next`, no `prev`, no `last`. Hypermedia's whole argument is
# that a client follows links instead of building URLs, and the one place this
# API could have made that true is the one place it did not.
#
# **Every record carries `type` and `_type`.** Two discriminators, one of them
# underscored, side by side on the same object.
#
# **And the field names are the engineering team's.** From Aptible's own
# generated client, on the public account record:
#
#   sweetness_stack              gentlemanjerry_endpoint
#   sweetness_stack_version      gentlemanjerry_certificate
#                                gentlemanjerry_docker_name
#                                gentlemanjerry_instance_id
#
# Six fields named after two internal projects. A caller reading an account has
# to know that "sweetness" is the stack and "gentlemanjerry" is the log drain,
# and neither word appears in the product.
#
# **`ca_private_key` is a property of the account model.** It is the one field
# in the whole struct marked `omitempty`; every other field is required by the
# constructor, all thirty of them. So the model that describes an environment
# has a key named for a private key on it, and it is the only key the type
# treats as optional.
#
# **And a name and a handle are both the name.** `handle` is a plain string and
# `name` is nullable, so the human label that may be absent sits beside the
# one that may not, with nothing saying which a client should show.

recipe: aptible
capability: hosting
version: 0.1.0

upstream:
  api: v1
  docs: https://www.aptible.com/docs
  # No spec: Aptible publishes no OpenAPI document at any address this Recipe
  # could find. The record shape below is read from the generated Go client in
  # aptible/aptible-api-go, which is the artefact a description would have
  # produced -- see the README's sources.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.apt1ble.f1xture
  # A wrong token is refused with 400 rather than 401.
  rejected_error: invalid_token

responses:
  list:
    style: wrapped
    key: _embedded.accounts
    count_field: total_count
    limit_field: per_page
    page_field: current_page
  error:
    style: flat
    message_field: message
    # The machine-readable code, beside a numeric copy of the HTTP status.
    code_field: error
    code_type: string
    status_field: code

resources:
  account:
    id:
      field: id
      style: numeric
      type: number
    constants:
      # Two discriminators on one record, one of them underscored.
      type: account
      _type: account
    fields:
      # A nullable name beside a non-nullable handle, both of them the label.
      handle:
        type: string
      onboarding_status:
        type: string
      number:
        type: string
      activated:
        type: boolean
      bastion_port:
        type: integer
      container_count:
        type: integer
      domain_count:
        type: integer
      total_disk_size:
        type: integer
      total_app_count:
        type: integer
      app_container_count:
        type: integer
      database_container_count:
        type: integer
      total_database_count:
        type: integer
      created_at:
        type: datetime
      updated_at:
        type: datetime
      # Internal project names, on the public record.
      sweetness_stack:
      sweetness_stack_version:
      gentlemanjerry_endpoint:
      gentlemanjerry_docker_name:
      # Nullable, and required by the generated constructor like everything
      # else on the model.
      name:
      syslog_host:
      syslog_port:
      bastion_host:
      ssh_portal_port:
      ca_body:

routes:
  - method: GET
    path: /accounts
    resource: account
    operation: list
    # Struck live: a request presenting nothing is answered rather than
    # refused, and a request presenting something wrong is refused. The
    # collection is scoped to the caller, and an anonymous caller owns nothing.
    public: when-absent
    pagination:
      style: page
      first_page: 1
      limit: 40
      limit_param: per_page
      cursor_param: page

errors:
  invalid_token:
    # 400, not 401, for a credential that was presented and rejected.
    status: 400
    code: invalid_token
    message: Invalid Token

fixtures:
  # What an unauthenticated caller is actually served: a successful, complete,
  # empty page.
  empty:
    account: []

  organization:
    account:
      - id: 8127
        handle: production
        name: Production
        onboarding_status: completed
        number: "1042"
        activated: true
        bastion_host: bastion-1042.aptible.in
        bastion_port: 45022
        ssh_portal_port: 45023
        syslog_host: null
        syslog_port: null
        container_count: 14
        domain_count: 3
        total_disk_size: 320
        total_app_count: 4
        app_container_count: 9
        database_container_count: 5
        total_database_count: 5
        created_at: "2024-03-11T08:30:00.000Z"
        updated_at: "2026-08-22T13:45:10.000Z"
        # The stack, under the name the team gave it.
        sweetness_stack: shared-us-west-1
        sweetness_stack_version: v3
        # And the log drain, under the name the team gave that.
        gentlemanjerry_endpoint: null
        gentlemanjerry_docker_name: null
        ca_body: null
      - id: 8128
        handle: staging
        # Nullable, and null: the label a client might show is the one that
        # can be absent.
        name: null
        onboarding_status: completed
        number: "1043"
        activated: true
        bastion_host: bastion-1043.aptible.in
        bastion_port: 45022
        ssh_portal_port: null
        syslog_host: logs.example.com
        syslog_port: 6514
        container_count: 2
        domain_count: 0
        total_disk_size: 40
        total_app_count: 1
        app_container_count: 1
        database_container_count: 1
        total_database_count: 1
        created_at: "2025-01-04T10:00:00.000Z"
        updated_at: "2026-09-01T06:30:00.000Z"
        sweetness_stack: shared-us-west-1
        sweetness_stack_version: v3
        gentlemanjerry_endpoint: https://logs.example.com:9200
        gentlemanjerry_docker_name: gentlemanjerry-1043
        ca_body: null

conformance:
  - name: no credential at all is a success with nothing in it
    source: https://api.aptible.com/accounts
    verified: "2026-09-13"
    fixture: empty
    request:
      method: GET
      path: /accounts
      headers: {}
    expect:
      # Not 401. A client checking response.ok and reading total_count
      # concludes the user has no environments.
      status: 200
      body:
        total_count: 0
        current_page: 1

  - name: a wrong credential is a 400 rather than a 401
    source: https://api.aptible.com/accounts
    verified: "2026-09-13"
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 400
      body:
        # Three keys: the status as a number, the code as a string, and a
        # title-cased sentence.
        code: 400
        error: invalid_token
        message: Invalid Token

  - name: the records sit under an embedded key
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        '_embedded.accounts[0].id': 8127
        '_embedded.accounts[0].handle': production
        '_embedded.accounts[0].number': "1042"
        total_count: 2

  - name: every record carries two discriminators
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        # type and _type, side by side, saying the same thing.
        '_embedded.accounts[0].type': account
        '_embedded.accounts[0]._type': account

  - name: the field names are the engineering team's
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        # A caller has to know that sweetness is the stack and gentlemanjerry
        # is the log drain. Neither word appears in the product.
        '_embedded.accounts[0].sweetness_stack': shared-us-west-1
        '_embedded.accounts[0].sweetness_stack_version': v3
        '_embedded.accounts[1].gentlemanjerry_endpoint': https://logs.example.com:9200
        '_embedded.accounts[1].gentlemanjerry_docker_name': gentlemanjerry-1043

  - name: the name may be absent and the handle may not
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        '_embedded.accounts[0].name': Production
        # Null, beside a handle that cannot be.
        '_embedded.accounts[1].name': null
        '_embedded.accounts[1].handle': staging

  - name: the counts are four different numbers of containers
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        # container_count is not app_container_count plus
        # database_container_count, and nothing on the record says what the
        # difference is.
        '_embedded.accounts[0].container_count': 14
        '_embedded.accounts[0].app_container_count': 9
        '_embedded.accounts[0].database_container_count': 5
        '_embedded.accounts[0].total_app_count': 4
        '_embedded.accounts[0].total_database_count': 5
        '_embedded.accounts[0].total_disk_size': 320

  - name: the page is described and not linked
    source: https://api.aptible.com/accounts
    verified: "2026-09-13"
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
      query:
        per_page: "1"
        page: "1"
    expect:
      status: 200
      body:
        # A page number, a page size and a total, in a hypermedia API whose
        # _links carries only self.
        per_page: 1
        current_page: 1
        total_count: 2
        '_embedded.accounts[0].id': 8127

  - name: the second page has to be built by hand
    source: https://api.aptible.com/accounts
    verified: "2026-09-13"
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
      query:
        per_page: "1"
        page: "2"
    expect:
      status: 200
      body:
        '_embedded.accounts[0].id': 8128
        '_embedded.accounts[0].handle': staging

  - name: the timestamps and the bastion details travel together
    source: https://github.com/aptible/aptible-api-go/blob/main/aptibleapi/model_account.go
    fixture: organization
    request:
      method: GET
      path: /accounts
      headers:
        Authorization: "Bearer cauldr0n.apt1ble.f1xture"
    expect:
      status: 200
      body:
        '_embedded.accounts[0].bastion_host': bastion-1042.aptible.in
        '_embedded.accounts[0].bastion_port': 45022
        '_embedded.accounts[0].ssh_portal_port': 45023
        # Null on one and a number on the other, for the same field.
        '_embedded.accounts[1].ssh_portal_port': null
        '_embedded.accounts[0].created_at': "2024-03-11T08:30:00.000Z"
        '_embedded.accounts[0].updated_at': "2026-08-22T13:45:10.000Z"
        '_embedded.accounts[0].activated': true
        '_embedded.accounts[0].onboarding_status': completed
        # A syslog host and port on one environment and null on the other,
        # and a ca_body that is null on both.
        '_embedded.accounts[1].syslog_host': logs.example.com
        '_embedded.accounts[1].syslog_port': 6514
        '_embedded.accounts[0].syslog_host': null
        '_embedded.accounts[0].ca_body': null
        '_embedded.accounts[0].domain_count': 3
