# DatoCMS Recipe for Cauldron
#
# The records listing on the Content Management API, read from DatoCMS's own
# documentation -- every page of which answers Markdown at the same address
# with `.md` appended -- and struck live against site-api.datocms.com on
# 2026-09-13 with no Accept header, with no credential, with a deliberately
# invalid one, with the header the documentation's own example sends, and on a
# path that does not exist.
#
# **Failures arrive under `data`.** Struck live, all four:
#
#   (no Accept)            406 {"data":[{"id":"29801c","type":"api_error","attributes":{"code":"INVALID_ACCEPT_HEADER",...}}]}
#   Accept, no token       401 {"data":[{"id":"02f293","type":"api_error","attributes":{"code":"INVALID_SITE",...}}]}
#   Accept, wrong token    401 {"data":[{"id":"5413bc","type":"api_error","attributes":{"code":"INVALID_AUTHORIZATION_HEADER",...}}]}
#   /cauldron-nope         404 {"data":[{"id":"cf3acb","type":"api_error","attributes":{"code":"INVALID_ENDPOINT",...}}]}
#
# This is JSON:API, where failures belong in `errors` and the specification
# says `data` and `errors` "MUST NOT coexist in the same document". DatoCMS
# puts the errors *in* `data` -- the same key, holding the same kind of thing,
# an array of resource objects. So `body.data[0]` is a record on success and an
# error on failure, and the only way to tell is to read `type`.
#
# **There is no message anywhere in a failure.** No `title`, no `detail`, no
# sentence. A code, an always-empty `details: {}`, and a `doc_url`. The only
# human-readable thing in the response is a URL a reader has to go and fetch.
#
# **And the `id` is a second error code.** JSON:API defines it as "a unique
# identifier for this particular occurrence of the problem"; struck twice, the
# same failure answers `02f293` both times. It is stable per code, sits beside
# an actual `code` field, and is six hex characters that appear nowhere in the
# documentation -- so the record carries two codes, and the useless one is in
# the field a JSON:API client is told to treat as an occurrence id.
#
# **A missing credential is reported as a problem with the project.** With an
# Accept header and no token at all, the code is `INVALID_SITE` -- not a
# missing header, not an invalid token, but the *site*. A wrong token gets
# `INVALID_AUTHORIZATION_HEADER`. So the failure that means "you sent no
# credential" names a different noun than the one that means "your credential
# is wrong".
#
# **The documentation's own example sends the wrong header.** From the
# pagination page, verbatim:
#
#   curl -H 'Accept: application/json' \
#        -H 'Authentication: Bearer <YOUR-API-TOKEN>' \
#        https://site-api.datocms.com/items?page[limit]=5&page[offset]=5
#
# `Authentication`, not `Authorization`. Struck live, that header is ignored and
# the answer is `INVALID_SITE` -- so a reader who copies the worked example is
# told their project is wrong, and nothing anywhere points at the credential.
#
# **Content negotiation fails before anything else.** Without an Accept header
# the answer is 406 `INVALID_ACCEPT_HEADER`, whatever credential is attached.
# So the first failure a naive client meets is about a header it did not know
# it had to send.
#
# **The product renamed these and the API did not.** The documentation's first
# sentence: "DatoCMS stores the individual pieces of content you create from a
# model as records (for backwards compatibility the API calls these `item`)."
#
# **And a field is a string or an object depending on how you asked.** A link
# field arrives as `"featured_block": "dhVR2HqgRVCTGFi_0bWqLqA"` or as
# `"featured_block": {id, type, attributes, relationships}`, chosen by the
# `nested` parameter -- so a client has to test the type of a field before it
# can read it, and the type depends on the request rather than on the schema.

recipe: datocms
capability: cms
version: 0.1.0

upstream:
  api: "3"
  docs: https://www.datocms.com/docs/content-management-api
  # No spec: DatoCMS documents this API as prose with worked examples, each
  # page also answering Markdown at the same address with `.md` appended.
  # There is no OpenAPI document at any address this Recipe could find.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-dat0cms-f1xture
  # The two credential states name two different nouns.
  absent_error: invalid_site
  rejected_error: invalid_authorization_header
  # An unrouted path answers its own code with a wrong token attached.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    count_field: meta.total_count
  error:
    # The success envelope, holding errors.
    style: list
    key: data
    # No message field of any kind: nothing in a failure is a sentence.
    message_field: "-"
    code_field: attributes.code
    type_field: type

resources:
  item:
    id:
      # Twenty-two characters of base64url, which is a UUID that has been
      # re-encoded rather than a sequence.
      field: id
      style: opaque
      length: 22
    constants:
      # The noun the product stopped using.
      type: item
    fields:
      # The shape of these depends on the model the record was made from, so
      # two records of different models share no field at all.
      title:
        type: string
        in: attributes
      publication_date:
        type: string
        in: attributes
      relationships:
        type: map

routes:
  - method: GET
    path: /items
    resource: item
    operation: list
    pagination:
      style: offset
      # The documentation says both the default and the maximum "vary
      # depending on the specific endpoint", and names neither here.
      limit: 30
      limit_param: page[limit]
      cursor_param: page[offset]

errors:
  invalid_site:
    # Answers a request carrying no credential at all, and names the project.
    status: 401
    code: INVALID_SITE
    type: api_error
    fields:
      id: "02f293"

  invalid_authorization_header:
    status: 401
    code: INVALID_AUTHORIZATION_HEADER
    type: api_error
    fields:
      # Stable across requests, on a field JSON:API defines as identifying one
      # occurrence.
      id: "5413bc"

  unknown_route:
    status: 404
    code: INVALID_ENDPOINT
    type: api_error
    fields:
      id: cf3acb

fixtures:
  empty:
    item: []

  site:
    item:
      - id: A4gkL_8pTZmcyJ-IlIEd2w
        title: My Blog Post
        publication_date: "2024-01-15"
        relationships:
          item_type:
            data:
              id: BxZ9Y2aKQVeTnM4hP8wLpD
              type: item_type
      - id: cEzRZmM3SyeHmAxS5KE9dg
        title: Third Article
        publication_date: "2026-03-04"
        relationships:
          item_type:
            data:
              # The same model, which is the only thing making these two
              # records comparable at all.
              id: BxZ9Y2aKQVeTnM4hP8wLpD
              type: item_type

conformance:
  - name: a missing credential is reported as a bad project
    source: https://site-api.datocms.com/items
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
    expect:
      status: 401
      body:
        # In the success envelope's key, with no sentence anywhere in it --
        # and naming the site rather than the missing header or the token.
        'data[0].type': api_error
        'data[0].attributes.code': INVALID_SITE
        'data[0].id': "02f293"

  - name: a wrong credential names the header instead
    source: https://site-api.datocms.com/items
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        'data[0].attributes.code': INVALID_AUTHORIZATION_HEADER
        # Six hex characters, the same on every occurrence, beside the code
        # that actually says something.
        'data[0].id': "5413bc"
        'data[0].type': api_error

  - name: an unrouted path is the same envelope again
    source: https://site-api.datocms.com/cauldron-nope
    verified: "2026-09-13"
    fixture: site
    request:
      method: GET
      path: /cauldron-nope
      headers:
        Accept: application/json
        Authorization: "Bearer notarealtoken"
    expect:
      status: 404
      body:
        'data[0].attributes.code': INVALID_ENDPOINT
        'data[0].id': cf3acb

  - name: a record is a JSON API resource object called an item
    source: https://www.datocms.com/docs/content-management-api/resources/item
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer cauldr0n-dat0cms-f1xture"
    expect:
      status: 200
      body:
        # The same key the failures above arrive in.
        'data[0].id': A4gkL_8pTZmcyJ-IlIEd2w
        'data[0].type': item
        'data[0].attributes.title': My Blog Post
        'data[0].attributes.publication_date': "2024-01-15"

  - name: the model a record came from is a relationship
    source: https://www.datocms.com/docs/content-management-api/resources/item
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer cauldr0n-dat0cms-f1xture"
    expect:
      status: 200
      body:
        # Which is the only thing telling a client what the attributes above
        # are supposed to be.
        'data[0].relationships.item_type.data.id': BxZ9Y2aKQVeTnM4hP8wLpD
        'data[0].relationships.item_type.data.type': item_type
        'data[1].relationships.item_type.data.id': BxZ9Y2aKQVeTnM4hP8wLpD

  - name: the total sits in the envelope's meta
    source: https://www.datocms.com/docs/content-management-api/pagination
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer cauldr0n-dat0cms-f1xture"
      query:
        page[limit]: "1"
    expect:
      status: 200
      body:
        'meta.total_count': 2
        'data[0].id': A4gkL_8pTZmcyJ-IlIEd2w

  - name: the offset is zero-based and the second page is the second record
    source: https://www.datocms.com/docs/content-management-api/pagination
    fixture: site
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer cauldr0n-dat0cms-f1xture"
      query:
        page[limit]: "1"
        page[offset]: "1"
    expect:
      status: 200
      body:
        'data[0].id': cEzRZmM3SyeHmAxS5KE9dg
        'data[0].attributes.title': Third Article
        'data[0].attributes.publication_date': "2026-03-04"

  - name: a site with no records still sends the envelope
    source: https://www.datocms.com/docs/content-management-api/pagination
    fixture: empty
    request:
      method: GET
      path: /items
      headers:
        Accept: application/json
        Authorization: "Bearer cauldr0n-dat0cms-f1xture"
    expect:
      status: 200
      body:
        data: []
        'meta.total_count': 0
