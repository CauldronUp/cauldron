# Milvus (Zilliz Cloud) Recipe for Cauldron
#
# Meilisearch tells you a write has not landed by handing back a number and
# refusing to call it anything more. Chroma, this group's second Recipe,
# tells you the same thing by handing back nothing at all -- an empty
# object -- and putting the only honesty about it on a second, collection-
# wide endpoint nobody has to call. Milvus is the group's third answer, and
# it is the most dangerous of the three precisely because it looks the most
# finished: POST .../entities/insert answers 200, synchronously, with real
# identifiers --
#
#   {"code": 0, "data": {"insertCount": 10, "insertIds": [0, 1, 2, ...]}}
#
# -- quoted verbatim from Zilliz's own reference. Ten ids, back the moment
# the call returns, no task to poll, no status field, nothing that reads as
# unfinished. And it is still not a promise that a search run one instruction
# later will find any of them, because insertCount is answering a different
# question than "is this searchable" and Milvus's own documentation says so
# in as many words:
#
#   "Milvus returns success when inserted data are ingested to the message
#   queue. However, the data are not yet flushed to the disk... If flush()
#   is called, the data node is forced to write all data in the message
#   queue to persistent storage immediately."
#
# That reads like the answer is "call flush()." It is not. The same
# reference states the opposite directly, under the question "Can I see
# inserted, deleted, or upserted data immediately after the operation
# without waiting for a flush?":
#
#   "Yes, in Milvus, data visibility is not directly tied to flush
#   operations due to its storage-compute disaggregation architecture."
#
# What visibility is tied to is consistency level -- a parameter on the
# *read*, not a receipt on the write, chosen per search or per collection
# from Strong, Bounded Staleness, Session and Eventually. Milvus's own
# glossary, quoted rather than paraphrased:
#
#   Strong:      "the highest and the most strict level of consistency...
#                ensures that users can read the latest version of data."
#   Bounded:     "allows data inconsistency during a certain period of
#                time."
#   Session:     "ensures that all data writes can be immediately perceived
#                in reads during the same session."
#   Eventually:  "There is no guaranteed order of reads and writes, and
#                replicas eventually converge to the same state given that
#                no further write operations are done."
#
# And the default is not the safe end of that list: "The default consistency
# level in Milvus is bounded staleness" -- the level whose own definition is
# "allows data inconsistency during a certain period of time." A search run
# immediately after the insert above, with no consistency level named, is
# not guaranteed to see any of the ten ids that response just handed back,
# and nothing in either response says so. Zilliz Cloud's own REST v2 Search
# endpoint exposes three of the four levels in its consistencyLevel
# parameter -- Strong, Eventually, Bounded -- and its own reference omits
# Session from that specific parameter's list entirely, a narrower menu than
# the open-source core documents. Read from Zilliz's page, not observed; see
# below for why nothing about insert or search could be observed at all.
#
# Set against this group's other four answers for "is a write finished when
# the response says so": Temporal Cloud hands back a second object, built to
# be polled, with no projection of the resource in it. Sumo Logic hands back
# an id and a link.href addressing that second object, plus a warning
# pre-emptively naming its own failure mode. PandaDoc hands back the *same*
# resource a GET would, watchably incomplete under one field. Turso hands
# back a truncated projection of the row, no state field anywhere. Chroma,
# this group's second Recipe, hands back an object with nothing in it and
# puts the only honesty on a separate, collection-scoped gauge. Milvus is
# the odd one out among all five: its write response is the *most* complete
# of any of them -- real, permanent, immediately-reusable identifiers -- and
# that completeness is the trap, because nothing about the response, or
# about a plain read afterwards, says whether those identifiers are visible
# yet. The other four fail loud, by being visibly unfinished. Milvus fails
# quiet.
#
# **None of the paragraphs above could be verified.** Milvus/Zilliz repeats
# the split Pinecone's Recipe in this collection already describes for
# itself: a control plane and a data plane, on two different hosts, and the
# second one is discoverable only through the first. api.cloud.zilliz.com is
# the control plane -- clusters, projects, regions -- confirmed live,
# unauthenticated, 2026-09-01. The vectordb surface above (insert, search,
# query, the whole reason this group exists) lives at a cluster's own
# connectAddress, handed back only by Describe Cluster or List Clusters,
# reachable only with a cluster this task was never going to create. Probed
# directly to be sure: POST api.cloud.zilliz.com/v2/vectordb/collections/
# list, the exact path Zilliz's own reference gives for that operation,
# answers 404 "no Route matched with those values" on the control-plane
# host -- not a credential failure, a routing one; the path genuinely is not
# there. So, exactly as Pinecone's Recipe declines to route its own data
# plane on api.pinecone.io because doing so "would teach that they answer on
# api.pinecone.io, which is the exact mistake this Recipe exists to
# describe," insert, search, query and flush are not modelled as routes
# here. The consistency-level finding above is this Recipe's evidence for
# them, cited and quoted from Zilliz's and Milvus's own documentation, never
# called.
#
# What *is* live, verified, and worth having: List Clusters and Describe
# Cluster both answer with a connectAddress -- "https://in01-xxxxxxxx.aws-
# us-west-2.vectordb.zillizcloud.com:19530" in Zilliz's own worked example --
# which is this Recipe's own version of Pinecone's "an address before an
# index" finding, on the surface this Recipe can actually reach.
#
# Four more, checked live against api.cloud.zilliz.com with no account and
# no key, on 2026-09-01:
#
#   1. A missing credential and a wrong one are different failures, and a
#      third shape most providers in this collection do not draw at all
#      folds into the first rather than the second. No Authorization header:
#      {"code":21118,"message":"The apikey is missing"}. Authorization:
#      Bearer junktoken12345 (well-formed, wrong): {"code":21119,"message":
#      "The apikey is illegal"}. Authorization: junktoken12345 -- present,
#      no Bearer prefix at all -- answers the *first* sentence, 21118
#      "missing", not the second: this host draws the same absent/malformed
#      line Together's Recipe in this collection draws for itself, calling
#      everything short of a well-formed prefix "missing" rather than
#      "wrong." auth.rejected_error carries the 21119 sentence; absent and
#      malformed both fall to authentication_error's default, which is
#      21118, matching the live host on both without needing an override.
#   2. One case beneath this file's discipline either way: "Authorization:
#      Bearer " with nothing after the prefix answers 21118 "missing" live
#      -- the same verdict as no header at all. Cauldron's own credential
#      check does not draw that line the same way: an empty value after a
#      matched prefix reaches the key comparison and fails it, which is
#      Rejected, not Absent -- so this emulator would answer 21119 for the
#      identical request. Recorded here rather than asserted as a case that
#      would fail its own build.
#   3. There is no 405 anywhere on this host. DELETE /v2/projects (a real,
#      GET-only path) answers 404 {"message":"no Route matched with those
#      values","request_id":"..."}, not 405 -- the identical body an
#      entirely unregistered path gets. This gateway does not distinguish
#      "wrong method" from "wrong path"; both are one routing-table miss.
#      Cauldron's own method_not_allowed can be told to answer this way --
#      its status is drawn from the Recipe's own declaration whenever the
#      Recipe names the failure itself rather than borrowing another's
#      shape -- and both cases below are struck with no credential
#      whatsoever, live, because routing runs to completion before the
#      credential is ever examined: auth.after_routing carries that.
#   4. How wrong a path is changes which 404 it gets, and only one shape is
#      the gateway's own. GET /v2/totally-bogus-endpoint-xyz -> the JSON
#      shape above. GET /openapi.json, outside the /v2 prefix the app
#      actually owns, answers a second, plainer 404: an empty body, no
#      Content-Type, Server: awselb/2.0 -- the load balancer in front of the
#      application, answering on its behalf, the same two-tier shape
#      Temporal Cloud's Recipe in this collection records for its own host.
#      Only the JSON shape is declared as unknown_route, for the reason
#      Temporal Cloud's Recipe gives for its own choice: a realistic
#      integration typo lands under the real prefix far more often than it
#      lands entirely outside the application.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Insert, search, query, get, delete, upsert and flush are not modelled
#     at all -- see above. This Recipe's whole contribution to the question
#     this group exists to answer is documentary rather than routed.
#   - No fetchable OpenAPI document was found at a stable URL, on the live
#     host (/v2/openapi.json, /openapi.json and /swagger.json all 404) or at
#     docs.zilliz.com, which serves its reference per-endpoint rather than
#     as one machine-readable file. upstream.spec is not recorded for that
#     reason.
#   - request_id, present on the routing-failure envelope and absent from
#     the auth-failure one, is a fresh value on every real response and is
#     not declared: a fixture asserting one fixed string would be asserting
#     a value the live host never repeats.
#   - List Projects, described in one page of Zilliz's own reference as
#     living at a per-region controller.api.<region>.zillizcloud.com rather
#     than at the host this Recipe describes, is not modelled: it disagrees
#     with the /v2/projects path this Recipe's own live probing found
#     answering directly on api.cloud.zilliz.com, and reconciling the two
#     would be guessing which page is stale.
#   - Create, resume, suspend, drop cluster and every user/role/backup/
#     alert/metrics/billing endpoint the control plane documents are real
#     and not modelled: this Recipe exists to place the control-plane split
#     and its auth/routing shape, not to port cluster administration.
#
# The values below not cited to a live probe are Zilliz's own published
# worked examples (docs.zilliz.com/reference/restful/list-clusters-v2 and
# .../describe-cluster-v2), quoted rather than invented, and carry no
# verified: date because no credential existed to call them.

recipe: milvus
capability: database
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.zilliz.com/reference/restful

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-zilliz-fixture-api-key-00000000000000
  # A credential that is present, prefixed and simply wrong gets its own
  # code and sentence. Absent and malformed (no "Bearer " prefix at all)
  # both fall to authentication_error's default, which already carries the
  # live wording for both -- see the header for the one case this collapse
  # still cannot reach.
  rejected_error: apikey_illegal
  # Routing runs to completion, method mismatch included, before the
  # credential is examined. Verified live, no credential sent either way;
  # see the header.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data.clusters
  resource:
    style: wrapped
    key: data
  # Every success on this host is stamped with a leading "code": 0 --
  # Zilliz's own convention, carried on both the list and the get shapes
  # above. A failure carries a code too, but a different one per failure,
  # which is why this constant belongs to success rather than to the error
  # table below.
  success:
    fields:
      code: 0
  error:
    style: flat
    message_field: message
    code_field: code
    # 21118 and 21119, unquoted digits on the wire -- not the string "21118".
    code_type: number

resources:
  cluster:
    id:
      style: opaque
      field: clusterId
    fields:
      clusterName:
        type: string
      description:
        type: string
        default: ""
      regionId:
        type: string
      plan:
        type: string
      cuType:
        type: string
      cuSize:
        type: integer
      status:
        type: string
      # An address for a host this Recipe cannot reach. See the header: the
      # whole reason this Recipe exists is that everything about whether a
      # write on that host is visible yet lives past this one string.
      connectAddress:
        type: string
      privateLinkAddress:
        type: string
        default: ""
      createTime:
        type: string
      projectId:
        type: string
      deploymentOption:
        type: string

routes:
  - method: GET
    path: /v2/clusters
    resource: cluster
    operation: list
    pagination:
      # pageSize and currentPage, from Zilliz's own RESTful reference read
      # 2026-09-05: pageSize is "the number of records to include in each
      # response" and currentPage is "the current page number", with worked
      # examples of 10 and 1.
      #
      # currentPage is a name this survey has met before as a *response*
      # field -- the Guardian reports one -- and here it is the request
      # parameter. Neither name is limit and neither is cursor.
      #
      # No default and no maximum is stated for either, so neither is
      # declared: the ten in the example is an example, not a default, and
      # writing it down as one would be inventing a fact about Zilliz.
      # first_page is left at the engine's one, which the example supports
      # and the prose does not state.
      style: page
      limit_param: pageSize
      cursor_param: currentPage

  - method: GET
    path: /v2/clusters/{id}
    resource: cluster
    operation: get

errors:
  # 21118: what an absent credential gets, and also what a header with no
  # "Bearer " prefix gets -- see the header for the one shape (an empty
  # value after a matched prefix) this collapse cannot reach.
  authentication_error:
    status: 401
    code: 21118
    message: "The apikey is missing"

  # 21119: a credential that is present, prefixed and wrong. Live.
  apikey_illegal:
    status: 401
    code: 21119
    message: "The apikey is illegal"

  # One routing-table miss covers both a path that does not exist and a
  # method a real path does not accept -- see the header. status is drawn
  # from this declaration because the Recipe names the failure itself
  # rather than borrowing another's shape; code is suppressed because the
  # live body carries none, only message and a request_id this file does
  # not reproduce (see the gaps).
  unknown_route:
    status: 404
    code_field: "-"
    message: "no Route matched with those values"

  method_not_allowed:
    status: 404
    code_field: "-"
    message: "no Route matched with those values"

fixtures:
  empty: {}

  # clusterId, clusterName, regionId and connectAddress below are Zilliz's
  # own worked examples from List Clusters and Describe Cluster, quoted
  # verbatim -- not this file's invention, and not a cluster this task ever
  # created.
  project:
    cluster:
      - id: in01-108240180a4faf8
        clusterName: dedicated-test
        description: ""
        regionId: aws-us-west-2
        plan: Enterprise
        cuType: Performance-optimized
        cuSize: 2
        status: RUNNING
        connectAddress: "https://in01-108240180a4faf8.aws-us-west-2.vectordb.zillizcloud.com:19539"
        privateLinkAddress: ""
        createTime: "2024-06-30T16:34:09Z"
        projectId: proj-b44a39b0c51cf21791a841
        deploymentOption: Dedicated

      # A second, distinct worked example, from List Clusters rather than
      # Describe Cluster -- a different cluster, quoted the same way.
      - id: inxx-xxxxxxxxxxxxxxx
        clusterName: dedicated-3
        description: ""
        regionId: aws-us-west-2
        plan: Enterprise
        cuType: Performance-optimized
        cuSize: 1
        status: RUNNING
        connectAddress: "https://inxx-xxxxxxxxxxxxxxx.aws-us-west-2.vectordb.zillizcloud.com:19530"
        privateLinkAddress: ""
        createTime: "2024-06-30T16:49:50Z"
        projectId: proj-xxxxxxxxxxxxxxxxxxxxxx
        deploymentOption: Dedicated
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: inxx-xxxxxxxxxxxxxxxa
        clusterName: dedicated-3
        description: ''
        regionId: aws-us-west-2
        plan: Enterprise
        cuType: Performance-optimized
        cuSize: 1
        status: RUNNING
        connectAddress: https://inxx-xxxxxxxxxxxxxxx.aws-us-west-2.vectordb.zillizcloud.com:19530
        privateLinkAddress: ''
        createTime: '2024-06-30T16:49:50Z'
        projectId: proj-xxxxxxxxxxxxxxxxxxxxxx
        deploymentOption: Dedicated

conformance:
  - name: a cluster's own address is the only way to reach the surface that matters
    # Describe Cluster's own worked example, quoted verbatim. Everything
    # this group of Recipes is about -- whether a write just landed --
    # happens past this string, on a host this Recipe cannot route; see the
    # header.
    source: https://docs.zilliz.com/reference/restful/describe-cluster-v2
    fixture: project
    request:
      method: GET
      path: /v2/clusters/in01-108240180a4faf8
      headers:
        Authorization: Bearer cauldron-zilliz-fixture-api-key-00000000000000
    expect:
      status: 200
      body:
        code: 0
        data.clusterId: in01-108240180a4faf8
        data.status: RUNNING
        data.connectAddress: "https://in01-108240180a4faf8.aws-us-west-2.vectordb.zillizcloud.com:19539"
      matches:
        data.connectAddress: '^https://.+\.vectordb\.zillizcloud\.com:\d+$'

  - name: listing clusters wraps the array two levels under the envelope's own code
    source: https://docs.zilliz.com/reference/restful/list-clusters-v2
    fixture: project
    request:
      method: GET
      path: /v2/clusters
      headers:
        Authorization: Bearer cauldron-zilliz-fixture-api-key-00000000000000
    expect:
      status: 200
      body:
        code: 0
        "data.clusters[0].clusterId": in01-108240180a4faf8
        "data.clusters[1].clusterId": inxx-xxxxxxxxxxxxxxx
      absent:
        - clusters
        - results

  - name: no credential at all is told the key is missing
    source: https://api.cloud.zilliz.com/v2/clusters
    verified: "2026-09-01"
    fixture: project
    request:
      method: GET
      path: /v2/clusters
    expect:
      status: 401
      body:
        code: 21118
        message: "The apikey is missing"

  - name: a header with no Bearer prefix is called missing too, not wrong
    # Live: the byte-identical sentence and code the case above got, for a
    # header that was genuinely sent -- this host draws the absent/malformed
    # line at the prefix, the same place Together's Recipe in this
    # collection draws it for itself.
    source: https://api.cloud.zilliz.com/v2/clusters
    verified: "2026-09-01"
    fixture: project
    request:
      method: GET
      path: /v2/clusters
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        code: 21118
        message: "The apikey is missing"

  - name: a well-formed wrong key is told something different
    source: https://api.cloud.zilliz.com/v2/clusters
    verified: "2026-09-01"
    fixture: project
    request:
      method: GET
      path: /v2/clusters
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        code: 21119
        message: "The apikey is illegal"

  - name: an unrouted path outranks the credential and answers a routing failure, not an auth one
    # Live, no credential sent -- auth.after_routing carries this.
    source: https://api.cloud.zilliz.com/v2/totally-bogus-endpoint-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/totally-bogus-endpoint-xyz
    expect:
      status: 404
      body:
        message: "no Route matched with those values"
      absent:
        - code

  - name: a wrong method gets the identical routing failure, not a 405
    # Live, no credential sent: DELETE on this exact path -- GET-only, the
    # route this Recipe declares as list -- answers the byte-identical body
    # an unrouted path gets. See the header -- there is no 405 anywhere on
    # this host.
    source: https://api.cloud.zilliz.com/v2/clusters
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v2/clusters
    expect:
      status: 404
      body:
        message: "no Route matched with those values"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # pageSize=1 and currentPage=2, which is a page number, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "pageSize and currentPage are the two names this listing reads"
    source: "https://docs.zilliz.com/reference/restful/list-clusters-v2"
    fixture: project
    request:
      method: GET
      path: "/v2/clusters"
      query:
        "pageSize": "1"
        "currentPage": "2"
      headers:
        "Authorization": "Bearer cauldron-zilliz-fixture-api-key-00000000000000"
    expect:
      status: 200
      body:
        "data.clusters[0].clusterId": "inxx-xxxxxxxxxxxxxxx"
      absent:
        - "data.clusters[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # pageSize=1 and currentPage=2, which is a page number, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "pageSize and currentPage are the two names this listing reads on v2 clusters"
    source: "https://docs.zilliz.com/reference/restful/list-clusters-v2"
    fixture: project
    request:
      method: GET
      path: "/v2/clusters"
      query:
        "pageSize": "1"
        "currentPage": "2"
      headers:
        "Authorization": "Bearer cauldron-zilliz-fixture-api-key-00000000000000"
    expect:
      status: 200
      body:
        "data.clusters[0].clusterId": "inxx-xxxxxxxxxxxxxxx"
      absent:
        - "data.clusters[1]"

  # The names. This Recipe declares 10 field(s) on a cluster that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 8 name(s) that came back at the paths they came back
  # under.
  - name: "a cluster carries the field names this Recipe declares"
    source: "https://docs.zilliz.com/reference/restful/list-clusters-v2"
    fixture: project
    request:
      method: GET
      path: "/v2/clusters"
      headers:
        "Authorization": "Bearer cauldron-zilliz-fixture-api-key-00000000000000"
    expect:
      status: 200
      body:
        "data.clusters[0].clusterName": "dedicated-test"
        "data.clusters[0].createTime": "2024-06-30T16:34:09Z"
        "data.clusters[0].cuSize": 2
        "data.clusters[0].cuType": "Performance-optimized"
        "data.clusters[0].deploymentOption": "Dedicated"
        "data.clusters[0].plan": "Enterprise"
        "data.clusters[0].projectId": "proj-b44a39b0c51cf21791a841"
        "data.clusters[0].regionId": "aws-us-west-2"


