# Aviationstack Recipe for Cauldron
#
# Aviationstack is the one of this collection's three flight-data Recipes
# that puts its credential in the query string rather than a header --
# `?access_key=...` on every request, the same exposed-in-logs shape this
# project's `auth.scheme: query` exists for (see Trello's Recipe for the
# canonical statement of why that is worth reproducing rather than quietly
# upgrading to a header). It is also the provider this collection's own
# brief singles out by reputation: known, historically, for answering an
# invalid credential with HTTP 200 and an error object buried in the body --
# the same "success-shaped failure" this collection already tracks on
# Expensify, Google Maps, VWO and ATTOM. That reputation was checked
# directly against api.aviationstack.com on 2026-09-03 and **it is no longer
# true**. Every credential failure below answered a real 401, never a 200:
#
#   GET /v1/flights (no access_key at all)          -> 401
#   GET /v1/flights?access_key=junkkey12345          -> 401
#   GET /v1/nosuchendpoint?access_key=junkkey12345    -> 401 (same body)
#   GET /v1/nosuchendpoint (no key at all)            -> 401 (same body)
#   PUT /v1/flights?access_key=junkkey12345           -> 401 (same body)
#
# every one of those the identical body for its credential state regardless
# of path or method, which puts Aviationstack beside FlightAware and Airbyte
# elsewhere in this collection: the credential is examined before routing,
# unconditionally, for every path and every verb. Unlike FlightAware,
# though, Aviationstack tells an absent credential from a wrong one -- two
# different codes, two different sentences:
#
#   no access_key at all      -> {"error":{"code":"missing_access_key",
#     "message":"You have not supplied an API Access Key. [Required format:
#     access_key=YOUR_ACCESS_KEY]"}}
#   access_key=junkkey12345   -> {"error":{"code":"invalid_access_key",
#     "message":"You have not supplied a valid API Access Key. [Technical
#     Support: support@apilayer.com]"}}
#
# both 401, both checked live, byte for byte, and this is the axis
# FlightAware's Recipe in this collection explicitly cannot show -- its
# provider collapses both into one identical body. Aviationstack does not.
#
# **The provider's own current reference documents an error envelope the
# wire does not send, and that gap was caught by comparing the two on the
# same day.** docs.apilayer.com/aviationstack's ApiError schema (fetched
# 2026-09-03) declares:
#
#   {"success": false, "error": {"code": 101, "type": "invalid_access_key",
#    "info": "You have not supplied a valid API Access Key. ..."}}
#
# -- code an integer (101, "apilayer numeric error code"), a machine-typed
# `type`, a human `info`, and a top-level `success` flag. What the live host
# actually answered to the byte-identical request, same day, is:
#
#   {"error": {"code": "invalid_access_key", "message": "You have not
#    supplied a valid API Access Key. [Technical Support:
#    support@apilayer.com]"}}
#
# no `success` field anywhere, `code` a string carrying what the schema
# calls `type`, and the human text under `message` rather than `info`. Four
# claims in the provider's own published reference and the wire agrees with
# none of their names, on the one error this Recipe could check both ways
# in the same sitting. This Recipe serves the wire shape -- the one a real
# integration actually receives -- not the documented one, and says so here
# rather than silently picking a side.
#
# **A position carries exactly one clock and nothing else.** The `live`
# object -- from Aviationstack's own worked example, quoted whole below
# because no case here holds a credential that could call it -- is
# `{updated, latitude, longitude, altitude, direction, speed_horizontal,
# speed_vertical, is_ground}`. `updated` is an ISO 8601 timestamp distinct
# from the request time, which answers this collection's first question:
# yes, a position is dated separately from when you asked for it. It does
# not answer the second half of that question at all -- there is no
# receiver, no station, no feed name, no coverage flag anywhere on this
# object or its parent. OpenSky's Recipe in this collection at least has a
# `sensors` field that is null on every ordinary call, which is a place in
# the schema that *could* have said something and does not. Aviationstack's
# `live` object has no such place to begin with: the position is handed
# back exactly as though it were surveyed, with one timestamp for cover.
#
# **A flight has no id, and its nearest thing to one repeats daily.** There
# is no bare "id" field on a flight record anywhere in Aviationstack's
# schema. `flight.icao` (AAL1004 in the worked example) is the closest
# thing, and it is not unique across days any more than FlightAware's
# `ident` is -- see that Recipe's header for the same finding reached
# independently on a different provider. `flight_date` is what disambiguates
# one AAL1004 from the next, exactly the role FlightAware's fa_flight_id
# plays and flight.icao alone does not.
#
# What a stale or cancelled flight's position looks like could not be
# checked. Aviationstack's own reference shows exactly one worked flight
# object, flight_status "active", live populated -- no scheduled, landed,
# cancelled, incident or diverted example anywhere this Recipe could find,
# so whether `live` is null, an empty object, or simply absent once a
# flight is not airborne is not stated by the provider and not guessed at
# here. See the fidelity gaps below.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Every 200 case below is read from the provider's own worked example
#     (docs.apilayer.com/aviationstack, GetFlights, fetched 2026-09-03) and
#     carries no verified date: this Recipe holds no access key, real or
#     fixture-accepted-by-the-provider, and no call in its history could
#     have reached a 200 on the live host.
#   - `live` when the flight is not active is not modelled -- see above.
#   - Two more documented 403 causes -- `function_access_restricted` and
#     `api_access_blocked` -- are named as response-example tabs on the same
#     reference page as `https_access_restricted` below, and their exact
#     wording was not fetched. Naming them without the sentence they answer
#     with would be a claim this Recipe cannot back, so only the one whose
#     body was actually read is declared.
#   - `flight_schedules`, `flightsFuture`, `routes` and every lookup
#     endpoint (`airports`, `airlines`, `airplanes`, `aircraft_types`,
#     `cities`, `countries`, `taxes`) are out of scope: this group of three
#     exists to answer the position/provenance question, and `/v1/flights`
#     is the one surface that carries a position at all.
#   - No upstream.spec. The interactive reference at
#     docs.apilayer.com/aviationstack is a SwaggerHub-rendered single-page
#     app; no fetchable OpenAPI or Swagger JSON/YAML document was found at a
#     stable URL for it, so there is nothing here for `cauldron drift` to
#     fingerprint against. Cited pages are the human-readable reference
#     itself throughout.

recipe: aviationstack
capability: scheduling
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.apilayer.com/aviationstack/docs/api-documentation

auth:
  scheme: query
  param: access_key
  keys:
    - cauldron0000aviationstack0000000000000000
  absent_error: missing_access_key
  rejected_error: invalid_access_key

responses:
  list:
    style: wrapped
    # The whole matching set, next to how many are on this one page --
    # Aviationstack sends both, so both are named apart. See the file
    # header for the documented example's own count:1 beside total:1669022;
    # Cauldron computes both from the fixture actually loaded, so this
    # Recipe reproduces the two keys being distinct rather than the
    # documented example's own enormous magnitude for one of them -- see
    # the conformance case below for exactly what that means in practice.
    count_field: pagination.total
    page_count_field: pagination.count
    limit_field: pagination.limit
    page_field: pagination.offset
  error:
    # {"error": {"code": "...", "message": "..."}} -- the wire shape, not
    # the documented one. See the file header.
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: "-"

resources:
  flight:
    collection: data
    id:
      # No bare id anywhere on this record. flight.icao is the nearest
      # thing and it is not unique across days -- see the file header, and
      # compare FlightAware's ident in this same collection.
      style: opaque
      field: flight.icao
    fields:
      flight_date:
        type: string
      flight_status:
        type: string
      # Each left as a free-form map rather than fully typed: five nested
      # objects, none of them this Recipe's reason for existing. live is
      # the one that is.
      departure:
        type: map
      arrival:
        type: map
      airline:
        type: map
      flight:
        type: map
      aircraft:
        type: map
      # One clock, no receiver, no coverage flag -- see the file header.
      # null_when_unset because a non-active flight's live is documented
      # nowhere this Recipe could confirm; see the fidelity gaps.
      live:
        type: map
        null_when_unset: true

routes:
  - method: GET
    path: /v1/flights
    resource: flight
    operation: list
    pagination:
      style: offset
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: offset
      first_page: 0

errors:
  missing_access_key:
    status: 401
    code: missing_access_key
    message: "You have not supplied an API Access Key. [Required format: access_key=YOUR_ACCESS_KEY]"

  invalid_access_key:
    status: 401
    code: invalid_access_key
    message: "You have not supplied a valid API Access Key. [Technical Support: support@apilayer.com]"

  # Documented, not observed -- see the file header and the fidelity gaps.
  # Reached only by fault injection below, the same way FireHydrant's
  # rate_limit is elsewhere in this collection: a documented shape this
  # Recipe has no key that could trigger for real.
  https_access_restricted:
    status: 403
    code: https_access_restricted
    message: "Access Restricted - Your current Subscription Plan does not support HTTPS Encryption."

fixtures:
  empty: {}

  # Every value below is Aviationstack's own worked example, quoted whole.
  # No key exists here to have called /v1/flights with, so none of it is
  # observed.
  one-flight:
    flight:
      - id: AAL1004
        flight_date: "2019-12-12"
        flight_status: active
        departure:
          airport: San Francisco International
          timezone: America/Los_Angeles
          iata: SFO
          icao: KSFO
          terminal: "2"
          gate: D11
          delay: 13
          scheduled: "2019-12-12T04:20:00+00:00"
          estimated: "2019-12-12T04:20:00+00:00"
          actual: "2019-12-12T04:20:13+00:00"
          estimated_runway: "2019-12-12T04:20:13+00:00"
          actual_runway: "2019-12-12T04:20:13+00:00"
        arrival:
          airport: Dallas/Fort Worth International
          timezone: America/Chicago
          iata: DFW
          icao: KDFW
          terminal: "A"
          gate: A22
          baggage: A17
          delay: 0
          scheduled: "2019-12-12T04:20:00+00:00"
          estimated: "2019-12-12T04:20:00+00:00"
        airline:
          name: American Airlines
          iata: AA
          icao: AAL
        flight:
          number: "1004"
          iata: AA1004
          icao: AAL1004
        aircraft:
          registration: N160AN
          iata: A321
          icao: A321
          icao24: A0F1BB
        live:
          updated: "2019-12-12T10:00:00+00:00"
          latitude: 36.2856
          longitude: -106.807
          altitude: 8846.82
          direction: 114.34
          speed_horizontal: 894.348
          speed_vertical: 1.188
          is_ground: false

conformance:
  - name: no access_key at all names the missing parameter
    source: https://api.aviationstack.com/v1/flights
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/flights
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error.code: missing_access_key
        error.message: "You have not supplied an API Access Key. [Required format: access_key=YOUR_ACCESS_KEY]"
      absent:
        - success
        - error.type
        - error.info

  - name: a wrong key names a different code entirely
    source: https://api.aviationstack.com/v1/flights?access_key=junkkey12345
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: junkkey12345
    expect:
      status: 401
      body:
        error.code: invalid_access_key
        error.message: "You have not supplied a valid API Access Key. [Technical Support: support@apilayer.com]"

  - name: the documented envelope and the wire envelope are not the same shape
    # Same request as the case above, asserting the other half: the four
    # keys the published ApiError schema promises (success, an integer
    # code, type, info) are not what actually arrived. See the file header.
    source: https://api.aviationstack.com/v1/flights?access_key=junkkey12345
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: junkkey12345
    expect:
      status: 401
      matches:
        error.code: "^invalid_access_key$"
      absent:
        - success
        - error.type
        - error.info

  - name: an unrecognised path is refused for its credential before routing is ever considered
    source: https://api.aviationstack.com/v1/nosuchendpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchendpoint
    expect:
      status: 401
      body:
        error.code: missing_access_key

  - name: the same unrecognised path with a wrong key answers the ordinary wrong-key body
    # Not a 404 -- the credential is examined before the router is, for
    # every path, same as FlightAware and Airbyte elsewhere in this
    # collection. Confirmed live with a path that does not exist at all.
    source: https://api.aviationstack.com/v1/nosuchendpoint?access_key=junkkey12345
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchendpoint
      query:
        access_key: junkkey12345
    expect:
      status: 401
      body:
        error.code: invalid_access_key

  - name: a wrong method on a real path is refused for its credential first too
    # PUT rather than GET, wrong key: still the ordinary 401, not a 405 and
    # not a routing error. The credential gate does not consult the method
    # any more than it consults the path.
    source: https://api.aviationstack.com/v1/flights?access_key=junkkey12345
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PUT
      path: /v1/flights
      query:
        access_key: junkkey12345
    expect:
      status: 401
      body:
        error.code: invalid_access_key

  - name: a flight's identity repeats daily, and flight_date is what tells two apart
    # From the provider's own worked example -- see the file header for why
    # this is FlightAware's ident finding on a second, independent
    # provider.
    source: https://docs.apilayer.com/aviationstack/docs/api-documentation
    fixture: one-flight
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: cauldron0000aviationstack0000000000000000
    expect:
      status: 200
      body:
        "data[0].flight_date": "2019-12-12"
        "data[0].flight.icao": AAL1004
        "data[0].flight_status": active

  - name: a position carries one clock, and nothing that names a receiver
    source: https://docs.apilayer.com/aviationstack/docs/api-documentation
    fixture: one-flight
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: cauldron0000aviationstack0000000000000000
    expect:
      status: 200
      body:
        "data[0].live.updated": "2019-12-12T10:00:00+00:00"
        "data[0].live.latitude": 36.2856
        "data[0].live.longitude": -106.807
        "data[0].live.is_ground": false
      absent:
        - "data[0].live.receiver"
        - "data[0].live.source"
        - "data[0].live.station"

  - name: the envelope keeps how many matched and how many are on this page apart
    # count and total are separate keys in Aviationstack's own schema, and
    # this Recipe keeps them separate rather than collapsing them into one
    # number -- see responses.list above. What it cannot reproduce is the
    # documented example's own magnitude: total:1669022 beside count:1 (see
    # the file header). Cauldron computes both from the fixture actually
    # loaded, and this Recipe's one-flight fixture makes them agree at 1 by
    # construction, because a second invented flight would be a fabricated
    # record rather than a documented one. The shape is faithful; the
    # documented gap between the two numbers is not reproduced.
    source: https://docs.apilayer.com/aviationstack/docs/api-documentation
    fixture: one-flight
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: cauldron0000aviationstack0000000000000000
    expect:
      status: 200
      body:
        pagination.limit: 100
        pagination.offset: 0
        pagination.count: 1
        pagination.total: 1

  - name: a documented plan restriction the fixture key was never issued to trigger
    # arm rather than a held key -- see the file header and the fidelity
    # gaps. This is a shape this Recipe read, not one it called.
    source: https://docs.apilayer.com/aviationstack/docs/api-documentation
    fixture: empty
    arm: https_access_restricted
    request:
      method: GET
      path: /v1/flights
      query:
        access_key: cauldron0000aviationstack0000000000000000
    expect:
      status: 403
      body:
        error.code: https_access_restricted
        error.message: "Access Restricted - Your current Subscription Plan does not support HTTPS Encryption."
