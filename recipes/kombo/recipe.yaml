# Kombo Recipe for Cauldron
#
# The unified HRIS employee listing, read from the OpenAPI document Kombo
# serves without a credential at api.kombo.dev/openapi.json, and struck live on
# 2026-09-13 with no credential, with a wrong token, on a path that does not
# exist, and with a method the path does not take.
#
# **An employee listing returns social security numbers by default.** The
# response schema's `required` array includes `ssn` ("The employee's social
# security number"), `tax_id`, `date_of_birth` and `nationality`, and the record
# also carries `home_address`, `bank_accounts`, `gender`, `ethnicity` and
# `marital_status`. The operation's query parameters are all filters; there is
# no field-selection parameter among them, so every caller who can list
# employees receives all of it.
#
# **Two failure shapes under one envelope, and three keys vanish.** Struck live:
#
#   no credential  401  {"status":"error","error":{"code":"PLATFORM.AUTHENTICATION_INVALID","title":"The provided authentication is invalid.","message":"No auth token specified! ...","log_url":null}}
#   bad path       404  {"status":"error","error":{"message":"Can not GET /v1/cauldron-nope"}}
#
# `code`, `title` and `log_url` are on the first and absent from the second, so
# the field a client switches on disappears exactly when the path is wrong.
#
# **And the listing declares a 200 and a `default` and nothing else**, so the
# 401 every anonymous caller meets and the 404 a typo meets are both outside
# the contract -- which is why drift reports all three of this Recipe's
# failures as unbacked.
#
# **`log_url` is always present and always null.** A field for a link to your
# own logs, on every authentication failure, filled in by nothing.
#
# **The refusals use exclamation marks and ask a question.** "No auth token
# specified! Please include your API key in your headers like this:
# `Authorization: Bearer <token>`" and "The specified auth token does not seem
# valid! Is the region (us/eu) in the subdomain correct?" -- the second puts a
# question to the caller, and blames geography for a token that was simply
# wrong.
#
# **And the routing failure says "Can not".** Two words, on every unrouted path.
#
# **A filter can be silently ignored, by request.**
# `ignore_unsupported_filters` is a query parameter, so a caller can ask for a
# narrowed listing and receive a wider one with nothing in the response saying
# which filter was dropped. Beside it, `employment_status` and
# `employment_statuses` are two parameters for one field, and `include_deleted`
# puts deleted employees back in.
#
# **Every record carries the time it was deleted.** `remote_deleted_at` is in
# `required`, on a listing of people who work there.
#
# **And the raw upstream payload rides along.** `remote_data` is a required
# property, so each unified record carries the vendor-specific object it was
# derived from -- which is the thing a unified API exists to hide.
#
# Also pinned: the success schema is named `...PositiveResponse` rather than
# success or ok; `changed_at` is the only timestamp on the record that is not
# nullable; and the document's first server is the EU host, while the message
# for a wrong token asks whether you meant the other one.

recipe: kombo
capability: hr
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://docs.kombo.dev/api-reference
  spec: https://api.kombo.dev/openapi.json
  spec_hash: 6fd72d225969a2ed162d7b7ca40d7d152cb840c440fb337079d4e5913e2a0f36
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - kombo_cauldr0nf1xturek3y0000000000000
  absent_error: no_auth_token_specified
  malformed_error: no_auth_token_specified
  rejected_error: auth_token_not_valid
  after_routing: true

responses:
  list:
    style: wrapped
    key: data.results
    cursor_field: data.next
    cursor_null: true
    fields:
      status: success
  error:
    style: nested
    key: error
    message_field: message
    # A dotted namespace, present on the credential failures and gone from
    # the routing one.
    code_field: code
    fields:
      status: error

resources:
  employee:
    id:
      field: id
      style: opaque
      length: 22
    fields:
      remote_id:
        type: string
      employee_number:
      first_name:
      last_name:
      display_full_name:
      job_title:
      work_email:
      personal_email:
      mobile_phone_number:
      # Required, on a listing.
      ssn:
      tax_id:
      nationality:
      date_of_birth:
      gender:
      ethnicity:
      marital_status:
      home_address:
      bank_accounts:
      employment_status:
      employment_type:
      weekly_hours:
      avatar:
      work_location_id:
      legal_entity_id:
      manager_id:
      start_date:
      termination_date:
      remote_created_at:
      # The one timestamp on the record that is not nullable.
      changed_at:
        type: string
      # Required, on a listing of people who work there.
      remote_deleted_at:
      custom_fields:
      integration_fields:
      # The vendor-specific object the unified record was derived from.
      remote_data:

routes:
  - method: GET
    path: /v1/hris/employees
    resource: employee
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: page_size
      cursor_param: cursor

errors:
  no_auth_token_specified:
    status: 401
    code: PLATFORM.AUTHENTICATION_INVALID
    message: "No auth token specified! Please include your API key in your headers like this: `Authorization: Bearer <token>`"
    fields:
      error.title: The provided authentication is invalid.
      # Always there, and always null.
      error.log_url: null

  auth_token_not_valid:
    status: 401
    code: PLATFORM.AUTHENTICATION_INVALID
    # A question, put to the caller, about geography.
    message: "The specified auth token does not seem valid! Is the region (us/eu) in the subdomain correct?"
    fields:
      error.title: The provided authentication is invalid.
      error.log_url: null

  unknown_route:
    status: 404
    # Two words.
    message: "Can not GET {detail}"
    # And the three keys the credential failures carry, gone.
    code_field: "-"

fixtures:
  empty:
    employee: []

  workforce:
    employee:
      - id: 7Kq2mX9pLz4vB1nR8sT3wY
        remote_id: "10041"
        employee_number: EMP-0041
        first_name: Ada
        last_name: Lovelace
        display_full_name: Ada Lovelace
        job_title: Principal Engineer
        work_email: ada@example.com
        personal_email: null
        mobile_phone_number: null
        # Required by the schema, on a listing.
        ssn: null
        tax_id: null
        nationality: GB
        date_of_birth: "1815-12-10"
        gender: FEMALE
        ethnicity: null
        marital_status: null
        home_address: null
        bank_accounts: null
        employment_status: ACTIVE
        employment_type: FULL_TIME
        weekly_hours: 37.5
        avatar: https://example.com/avatars/10041.png
        work_location_id: 3Hd8jK1mN5pQ7rS9tU2vW
        legal_entity_id: 9Zx8Cv7Bn6Mq5Wp4Er3Ty
        manager_id: null
        start_date: "2019-03-04"
        termination_date: null
        remote_created_at: "2019-03-04T09:12:03Z"
        changed_at: "2026-09-02T13:05:41Z"
        # On an employee who has not been deleted.
        remote_deleted_at: null
        custom_fields: {}
        integration_fields: {}
        # The object the unified record was derived from.
        remote_data:
          EmployeeID: "10041"
          Status: Active
      - id: 4Nb6Vc8Xz2Qa9Ws1Ed3Rf
        remote_id: "10088"
        employee_number: EMP-0088
        first_name: Grace
        last_name: Hopper
        display_full_name: Grace Hopper
        job_title: Staff Engineer
        work_email: grace@example.com
        personal_email: null
        mobile_phone_number: null
        ssn: null
        tax_id: null
        nationality: US
        date_of_birth: "1906-12-09"
        gender: FEMALE
        ethnicity: null
        marital_status: null
        home_address: null
        bank_accounts: null
        employment_status: INACTIVE
        employment_type: FULL_TIME
        weekly_hours: 40
        avatar: null
        work_location_id: null
        legal_entity_id: 9Zx8Cv7Bn6Mq5Wp4Er3Ty
        manager_id: 7Kq2mX9pLz4vB1nR8sT3wY
        start_date: "2020-06-01"
        termination_date: "2026-08-31"
        remote_created_at: "2020-06-01T00:00:00Z"
        changed_at: "2026-08-31T17:00:00Z"
        # And on one who has.
        remote_deleted_at: "2026-09-01T00:00:00Z"
        custom_fields: {}
        integration_fields: {}
        remote_data:
          EmployeeID: "10088"
          Status: Terminated

conformance:
  - name: three keys vanish exactly when the path is wrong
    source: https://api.kombo.dev/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # Two words, and one key.
        status: error
        error.message: Can not GET /v1/cauldron-nope
      absent:
        # The field a client switches on, and the two beside it.
        - error.code
        - error.title
        - error.log_url

  - name: a missing token is told how to send one
    source: https://api.kombo.dev/v1/hris/employees
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers: {}
    expect:
      status: 401
      body:
        error.code: PLATFORM.AUTHENTICATION_INVALID
        error.title: The provided authentication is invalid.
        error.message: "No auth token specified! Please include your API key in your headers like this: `Authorization: Bearer <token>`"
        # Always present, and always null.
        error.log_url: null
        status: error

  - name: a wrong token is asked a question about geography
    source: https://api.kombo.dev/v1/hris/employees
    verified: "2026-09-13"
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      body:
        # The token was wrong; the sentence asks which subdomain you meant.
        error.message: "The specified auth token does not seem valid! Is the region (us/eu) in the subdomain correct?"
        error.code: PLATFORM.AUTHENTICATION_INVALID
        error.log_url: null

  - name: an employee record is required to carry identifying details
    source: https://api.kombo.dev/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
    expect:
      status: 200
      body:
        # ssn, tax_id, nationality and date_of_birth are all in required, and
        # the listing has no field-selection parameter.
        'data.results[0].ssn': null
        'data.results[0].tax_id': null
        'data.results[0].nationality': GB
        'data.results[0].date_of_birth': "1815-12-10"
        'data.results[0].gender': FEMALE
        'data.results[0].ethnicity': null
        'data.results[0].marital_status': null
        'data.results[0].home_address': null
        'data.results[0].bank_accounts': null

  - name: every record carries the time it was deleted
    source: https://api.kombo.dev/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
    expect:
      status: 200
      body:
        # remote_deleted_at is in required, on a listing of people who work
        # there.
        'data.results[0].remote_deleted_at': null
        'data.results[1].remote_deleted_at': "2026-09-01T00:00:00Z"
        'data.results[1].termination_date': "2026-08-31"
        'data.results[0].termination_date': null
        'data.results[0].employment_status': ACTIVE
        'data.results[1].employment_status': INACTIVE

  - name: the raw upstream object rides along with the unified one
    source: https://api.kombo.dev/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
    expect:
      status: 200
      body:
        # Which is the thing a unified API exists to hide.
        'data.results[0].remote_data.EmployeeID': "10041"
        'data.results[0].remote_data.Status': Active
        'data.results[1].remote_data.Status': Terminated
        'data.results[0].remote_id': "10041"
        'data.results[0].id': 7Kq2mX9pLz4vB1nR8sT3wY
        'data.results[0].custom_fields': {}
        'data.results[0].integration_fields': {}

  - name: one timestamp on the record is not nullable
    source: https://api.kombo.dev/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
    expect:
      status: 200
      body:
        # changed_at, beside remote_created_at, start_date and the rest.
        'data.results[0].changed_at': "2026-09-02T13:05:41Z"
        'data.results[0].remote_created_at': "2019-03-04T09:12:03Z"
        'data.results[0].start_date': "2019-03-04"
        'data.results[0].employee_number': EMP-0041
        'data.results[0].first_name': Ada
        'data.results[0].last_name': Lovelace
        'data.results[0].display_full_name': Ada Lovelace
        'data.results[0].job_title': Principal Engineer
        'data.results[0].work_email': ada@example.com
        'data.results[0].personal_email': null
        'data.results[0].mobile_phone_number': null
        'data.results[0].weekly_hours': 37.5
        'data.results[0].employment_type': FULL_TIME
        'data.results[0].avatar': https://example.com/avatars/10041.png
        'data.results[1].avatar': null
        'data.results[0].work_location_id': 3Hd8jK1mN5pQ7rS9tU2vW
        'data.results[0].legal_entity_id': 9Zx8Cv7Bn6Mq5Wp4Er3Ty
        'data.results[0].manager_id': null
        'data.results[1].manager_id': 7Kq2mX9pLz4vB1nR8sT3wY

  - name: the cursor is null when there is no next page
    source: https://api.kombo.dev/openapi.json
    fixture: workforce
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
      query:
        page_size: "1"
        cursor: 7Kq2mX9pLz4vB1nR8sT3wY
    expect:
      status: 200
      body:
        # "If this is null, then there are no more pages."
        'data.next': null
        'data.results[0].id': 4Nb6Vc8Xz2Qa9Ws1Ed3Rf
        status: success

  - name: an account with no employees still says success
    source: https://api.kombo.dev/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/hris/employees
      headers:
        Authorization: "Bearer kombo_cauldr0nf1xturek3y0000000000000"
    expect:
      status: 200
      body:
        # The success schema's own name is PositiveResponse.
        status: success
        'data.results': []
        'data.next': null
