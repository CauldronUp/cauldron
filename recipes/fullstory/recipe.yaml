# FullStory Recipe for Cauldron
#
# FullStory watches a person using a browser, and the task this Recipe
# answers to asked two questions about that: what is the smallest thing it
# has an id for, and is "user" a person or a browser. Both turned out to
# need more live probing than reading, because api.fullstory.com's sidebar
# does not match what its own bare paths answer.
#
# ── There is no "get one session" route ──
#
# The Server API v2 sidebar (developer.fullstory.com/server/sessions/)
# lists exactly three GET/POST operations under Sessions: List Sessions,
# Get Session Events, and two POST actions (Generate Context, Generate
# Summary/Profile). No "Get Session." Probed live on 2026-09-01: GET
# /v2/sessions/12345 -- a bare session id, the shape every other provider in
# this collection addresses a single record by -- answers 404
# {"message":"Not Found","code":"resource_not_found"}, and GET
# /v2/sessions/this-does-not-exist-xyz, a path resembling nothing at all,
# answers the byte-identical 404. A route that does not exist and a route
# that never existed are indistinguishable, because there genuinely is no
# route there to distinguish them. GET /v2/sessions/12345/events, by
# contrast -- the real, documented route -- answers 401
# {"message":"Unauthorized","code":"unauthorized"}, not 404, with no
# credential attached: the path segment /events is what makes this a route
# FullStory recognises at all.
#
# So the smallest thing reachable through the Sessions surface is not a
# session -- it is one session's events, addressed by the session's id in
# the path but never handed back as a "session" object with fields of its
# own. List Sessions, the other real route, is described in the reference's
# own words as returning "up to limit most recent session replay URLs for a
# user, queried by uid and/or email" -- addressed by the user, not by a
# session id at all, and its own description states plainly what it is not
# for: "not intended for use for data export or transformation. For data
# export use cases, see Anywhere: Warehouse." That is this task's export-
# API-versus-retrieval-API question, answered in the documentation's own
# words -- this Recipe models the retrieval surface those two routes are
# part of, and Warehouse, the real export mechanism, is not an HTTP API at
# all (a data-pipeline product, not a route this format can address) so
# there is nothing here to model as a gap so much as a different kind of
# product entirely.
#
# ── User is the app's own uid, upsert rather than merge ──
#
# The Users API is explicit CRUD, confirmed both in its own introduction
# ("basic CRUD functionality for user objects") and in the method badges the
# docs site's own sidebar renders next to each operation: GET List Users,
# POST Create User, GET Get User, POST Update User, DELETE Delete User. What
# identifies one is not a person, and not a browser either, but whatever a
# customer's own app decided to call them: the Create User reference states
# plainly "a user is updated if the given uid is already associated with an
# identified user. Otherwise, a new user is created." So a browser that is
# never identified is not a User this API can see -- it lives only as
# whatever anonymous session data FullStory keeps -- and two browsers
# identified with the same uid become the same User by that single quoted
# rule, upsert rather than merge. What this Recipe cannot establish, because
# nothing reachable says so, is what happens to two browsers identified with
# two genuinely different uids that a person later turns out to share:
# posthog/recipe.yaml, elsewhere in this collection, documents an explicit
# merge for exactly that case ("two distinct ids can become one person...
# a lookup by the older id still works"). FullStory's own quoted sentence
# describes upsert-by-one-key only, no merge of two already-distinct users,
# and this Recipe does not extend that quote into a claim it does not make.
#
# ── One host, and the API key itself carries the region ──
#
# There is no per-tenant hostname the way dynatrace/recipe.yaml's provider
# uses one. Every request goes to api.fullstory.com regardless of account,
# and the reference states plainly why: "All API requests use the
# api.fullstory.com domain. They are automatically routed to the correct
# data center based on what is configured for your Fullstory account," where
# the account's data center is encoded as the first three characters of the
# API key itself ("<data center>.<token>", e.g. na1.xxxx or eu1.xxxx).
# Verified live: every response from every probe in this Recipe, credentialed
# or not, carried x-fullstory-data-realm: na1 -- the routing decision made
# visible in a header, not merely asserted in prose.
#
# ── Auth, routing order, and the one real 405 in this batch of three ──
#
# Probed live, 2026-09-01, on GET /v2/users, GET /v2/users/{id} and GET
# /v2/sessions alike: no Authorization header and a syntactically fine but
# made-up "Basic ..." value answer the identical 401
# {"message":"Unauthorized","code":"unauthorized"} every time -- absent and
# wrong collapse to one sentence, the same finding scoutapm/recipe.yaml and
# dynatrace/recipe.yaml each record about their own providers. Routing
# happens first: GET /v2/this-does-not-exist-xyz 404s with no credential at
# all, and a matched route (GET /v2/users) still gates on the credential
# once matched -- auth.after_routing carries that shape.
#
# Unlike either sibling in this batch, FullStory does answer a genuine 405:
# PATCH /v2/users/{id}, no credential, answers 405
# {"message":"Method Not Allowed","code":"method_not_allowed"} -- and,
# checked specifically because scoutapm/recipe.yaml and dynatrace/recipe.yaml
# both needed to say the opposite about their own hosts, there is no Allow
# header on it at all. OPTIONS on the same paths is a fourth, separate
# behaviour this Recipe cannot fold into the other three: it answers 204
# with a real, route-specific Access-Control-Allow-Methods header on a
# matched path (GET on /v2/sessions, DELETE,GET,POST on /v2/users), and on
# an unrouted path it falls through to a completely different 404 --
# Go net/http's own bare "404 page not found," text/plain, 19 bytes, not the
# {"message":"Not Found","code":"resource_not_found"} JSON every other verb
# gets on the identical path. CORS preflight is evidently handled by a layer
# in front of the JSON API entirely, and this format has one unknown_route
# shape per Recipe -- the JSON one, because it is what every route-bearing
# verb this Recipe models actually sends. The OPTIONS divergence is recorded
# here rather than forced into a case that would misstate it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No response body shape was ever confirmed for any success case. Every
#     live probe in this Recipe stopped at a credential or routing failure,
#     and no worked JSON example for List Users, Get User or Get Session
#     Events was found in the documentation pages this Recipe could reach
#     (they render their examples client-side; the server-rendered text
#     gives descriptions and field names in prose, not worked bodies). This
#     Recipe declares the plainest possible envelope, bare, rather than
#     guessing a wrapper this task never actually saw, and no conformance
#     case below asserts success-body content beyond what an empty fixture
#     trivially proves.
#   - Create, Update and Delete are not modelled on Users, and Generate
#     Context, Generate Summary and Create Profile are not modelled on
#     Sessions -- all are writes, all need a request body this Recipe has no
#     worked example for, and Batch Import and Stream Import (also real,
#     also unmodelled) are bulk-ingest surfaces closer in kind to the
#     Warehouse export product than to anything else in this Recipe.
#   - Annotations and Organization, sibling top-level sections in the same
#     reference, are not reached by anything here at all.
#
# The key below is a fixture and belongs to no real FullStory account.

recipe: fullstory
capability: analytics
version: 0.1.0

upstream:
  api: v2
  docs: https://developer.fullstory.com/server/getting-started/

auth:
  scheme: header
  header: Authorization
  # Fullstory's own literal words: "Authorization: Basic {YOUR_API_KEY}".
  # Not modelled as scheme: basic, which this format treats as real RFC 7617
  # basic auth (a base64 user:pass pair, one half checked as the secret) --
  # nothing reachable here confirms the key is decoded that way rather than
  # compared as one opaque token after a fixed prefix, and no working key
  # was ever available to test the difference.
  prefix: "Basic "
  keys:
    - cauldron-fs-fixture-key-000000000000000000
  # Verified live: an unrouted path 404s with no credential at all, and a
  # matched route (GET /v2/users) still gates on the credential once
  # matched.
  after_routing: true

responses:
  list:
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  user:
    id:
      style: opaque
    fields:
      # The one field this Recipe can ground in a direct quote: "a user is
      # updated if the given uid is already associated with an identified
      # user. Otherwise, a new user is created." See the header for what
      # that does and does not establish about two devices and one person.
      uid:
        type: string

  session:
    # No id field this Recipe declares content for -- see the header. The
    # only real routes reachable from a session's own id address its
    # events, not the session itself, and this resource exists so those
    # routes have something to scope against.
    id:
      style: opaque
      field: "-"
    fields:
      # List Sessions' own reference names this field and describes it as
      # "the customer-defined session identifier set via the Fullstory SDK
      # or server API" -- a second, app-chosen identifier distinct from
      # FullStory's own internal one. No worked value was found for it, so
      # no fixture carries one.
      session_uid:
        type: string
        null_when_unset: true

routes:
  - method: GET
    path: /v2/users
    resource: user
    operation: list

  - method: GET
    path: /v2/users/{id}
    resource: user
    operation: get

  - method: GET
    path: /v2/sessions
    resource: session
    operation: list

errors:
  # Verified live, three ways, on three different routes: no Authorization
  # header, and a syntactically fine but made-up "Basic ..." value, both
  # against GET /v2/users, GET /v2/users/{id} and GET /v2/sessions.
  # Identical body every time -- no absent/malformed/rejected split, one
  # sentence covers all three verdicts.
  authentication_error:
    status: 401
    message: "Unauthorized"
    code: "unauthorized"

  # Verified live: a path resembling nothing FullStory has, no credential.
  # Also what GET /v2/sessions/{id} answers for any id at all -- see the
  # header for why that is the actual finding, not routing noise.
  unknown_route:
    status: 404
    message: "Not Found"
    code: "resource_not_found"

  # Verified live: PATCH /v2/users/{id}, no credential, no Allow header at
  # all -- see the header. The one real 405 among this batch of three
  # Recipes; the other two found none anywhere.
  method_not_allowed:
    status: 405
    message: "Method Not Allowed"
    code: "method_not_allowed"

fixtures:
  empty: {}

conformance:
  - name: no credential and a made-up one answer the identical sentence
    source: https://api.fullstory.com/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/users
    expect:
      status: 401
      body:
        message: "Unauthorized"
        code: "unauthorized"

  - name: and the made-up credential changes nothing about it
    source: https://api.fullstory.com/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/users
      headers:
        Authorization: "Basic anVua2p1bmtqdW5rMDAwMDAwMDAwMDAwMDAwMA=="
    expect:
      status: 401
      body:
        message: "Unauthorized"

  - name: sessions are gated the same way users are
    source: https://api.fullstory.com/v2/sessions
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/sessions
    expect:
      status: 401
      body:
        code: "unauthorized"

  - name: an unrouted path 404s with no credential consulted at all
    source: https://api.fullstory.com/v2/this-does-not-exist-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/this-does-not-exist-xyz
    expect:
      status: 404
      body:
        message: "Not Found"
        code: "resource_not_found"

  - name: a bare session id answers the identical 404 an unrouted path does
    source: https://api.fullstory.com/v2/sessions/12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v2/sessions/12345
    expect:
      # There is no "get one session" route -- see the header. This is the
      # same finding as the case above, reached through a path that looks
      # like it should be a real record rather than a typo.
      status: 404
      body:
        code: "resource_not_found"

  - name: a wrong method on a real path is a genuine 405, with no Allow header
    source: https://api.fullstory.com/v2/users/12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v2/users/12345
    expect:
      status: 405
      body:
        message: "Method Not Allowed"
        code: "method_not_allowed"
