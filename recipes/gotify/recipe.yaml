# Gotify Recipe for Cauldron
#
# Written against Gotify's own generated Swagger 2.0 document, published in its
# own repository -- github.com/gotify/server, docs/spec.json, 30 paths, version
# 2.1.0 -- read on 2026-09-06. Gotify is self-hosted and there is no public
# instance, so nothing here is verified live: every claim is the provider's own
# document.
#
# **`since` means less than.**
#
# The document's own words for the parameter on GET /message:
#
#   since -- "return all messages with an ID less than this value"
#
# In every other Recipe in this collection `since` means after: after this
# time, after this position, going forward. Here it pages backwards, because
# messages come newest-first and paging means walking into the past. A client
# that assumes the usual sense sends the id it started from and receives the
# same page again, or sends the newest id it has seen and receives everything
# it already had.
#
# Nothing errors. `since` is a valid parameter with a valid value, and the
# response is a correct page of the wrong end.
#
# **Seven security definitions, three wire positions, and the type is the first
# letter of the token.**
#
# The document declares appTokenAuthorizationHeader, appTokenHeader,
# appTokenQuery, clientTokenAuthorizationHeader, clientTokenHeader,
# clientTokenQuery and basicAuth. The app and client pairs are the same place:
#
#   appTokenAuthorizationHeader / clientTokenAuthorizationHeader -> Authorization
#   appTokenHeader              / clientTokenHeader              -> X-Gotify-Key
#   appTokenQuery               / clientTokenQuery               -> ?token=
#
# So which kind of token you sent is not visible in the request at all. It is
# the token's first character: the document's own examples are `Axxxxxxxxxx` for
# an application token and `Cxxxxxxxxxx` for a client token. The whole
# access-control model is a prefix letter.
#
# And the two kinds do not reach the same endpoints. POST /message accepts both.
# GET /message and DELETE /message accept a client token only, as do
# /application, /client and /current/user. An application token can write and
# cannot read -- which is a good design, and it means using the wrong one of two
# interchangeable-looking credentials answers 401 on an endpoint that plainly
# exists and that the other token reaches.
#
# **The credential may travel in the query string**, `?token=`, as a declared
# scheme. Third-party proxies and access logs record full URLs by default, and
# Gotify is a self-hosted box commonly sat behind one.
#
# **The next page is a relative path, not a URL.**
#
# `paging.next` is documented as "the relative path for the next page ...
# Should be combined with the gotify base url", with the example
# `/message?limit=50&since=123456`. Every provider modelled here that sends a
# next link sends an absolute URL. A client that passes this one to a URL
# constructor resolves it against whatever base it happens to hold, which on a
# browser is the page's own origin.
#
# **There is no total anywhere.** `paging.size` is how many came back in this
# request, `paging.limit` is what was asked for, `paging.since` is the last id
# seen. Nothing says how many messages exist, so a progress bar has nothing to
# read and a client cannot know it is on the last page except by receiving a
# short one -- or by `next` being empty, which the document says is the signal.
#
# **The error body carries the status a second time, and one of its fields is
# documented as another.** An Error has `error`, `errorCode` and
# `errorDescription`. `errorCode` is the HTTP status repeated in the body. And
# the published description of `errorDescription` reads, in full, "The http
# error code." -- the description of the field above it, copied. A generated
# client's documentation says the wrong thing about the only field carrying the
# actual explanation.
#
# **The shipped document's host is `localhost`.** `host: localhost` with no
# basePath, so a client generated from this document points at the machine it
# was generated on.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Gotify is self-hosted and
#     there is no public instance.
#   - Messages, listed and created. 30 paths is a notification server:
#     applications, clients, users, plugins and the websocket stream each want
#     their own evidence.
#   - The app/client token split IS served: the read route accepts the client
#     token alone and the write route accepts both, which is Gotify's rule. What
#     is not modelled is per-application scoping -- upstream, an application
#     token may post only as its own application, and here any app token posts
#     as the fixture's.
#   - The credential is checked in the Authorization header. X-Gotify-Key and
#     the query-string form are recorded and not served, because serving the
#     query form would make a credential in a URL the easy path in local
#     development.
#   - `paging.next` is served as the relative path the provider sends, which is
#     the finding. Nothing here resolves it.

recipe: gotify
capability: push
version: 0.1.0

upstream:
  api: "2.1.0"
  docs: https://gotify.net/api-docs
  spec: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
  spec_hash: 75df80cc0980e51c9a1448e62a4bc5b1e8209d5b2d83079d5a85784e7ca20ef3
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    # A client token. The C is the type, and it is the only thing in the
    # request that says so.
    - Cauldron0000000000
    # And an application token. The A is the type. Same header, same shape,
    # different reach: this one may post a message and may not read one.
    - Aauldron0000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: messages
    # size is how many came back, not how many exist.
    count_field: paging.size
    count_means: page
    limit_field: paging.limit
    cursor_field: paging.next
    # A path fragment, which is what Gotify sends and what nothing else here
    # does.
    cursor_url: path
  error:
    style: flat
    message_field: error
    fields:
      errorDescription: "you need to provide a valid access token or user credentials to access this api"

resources:
  message:
    id:
      style: numeric
      type: number
    fields:
      appid:
        type: number
        default: 5
      message:
        type: string
        required: true
      title:
        type: string
      priority:
        type: number
        default: 0
      date:
        type: datetime
      # A free-form key-value tree, and the only place a client may put its own
      # data. Untyped here because its shape is the caller's.
      extras:

routes:
  - method: GET
    path: /message
    resource: message
    operation: list
    # A client token only. An application token is refused here and accepted
    # by the route below, which is the whole finding served rather than
    # described: two credentials that look identical on the wire reach
    # different endpoints, and the only thing telling them apart is the first
    # character.
    auth:
      scheme: bearer
      header: Authorization
      prefix: "Bearer "
      keys:
        - Cauldron0000000000
      absent_error: unauthorized
      rejected_error: unauthorized
    pagination:
      style: cursor
      limit_param: limit
      # Named since, and it means "less than this id". Declared here so that
      # renaming it would break a case rather than nothing.
      cursor_param: since
      limit: 100
      max_limit: 200

  - method: POST
    path: /message
    resource: message
    operation: create
    # The one route an application token reaches, and it takes a client token
    # too -- so this is the endpoint where the difference is invisible, and
    # the read side is where it bites.

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
    fields:
      errorCode: 401
      errorDescription: "you need to provide a valid access token or user credentials to access this api"
  forbidden:
    status: 403
    message: "Forbidden"
    fields:
      errorCode: 403
      errorDescription: "you are not allowed to access this api"
  bad_request:
    status: 400
    message: "Bad Request"
    fields:
      errorCode: 400
      errorDescription: "the request is invalid"
  rate_limit:
    status: 429
    message: "Too Many Requests"
    fields:
      errorCode: 429
      errorDescription: "you have sent too many requests"

fixtures:
  empty:
    message: []

  inbox:
    message:
      - id: 25
        appid: 5
        message: "Backup finished"
        title: "backup"
        priority: 4
        date: "2026-09-06T04:00:11.5045044+02:00"
        extras:
          client::display:
            contentType: text/plain
      - id: 24
        appid: 5
        message: "Backup started"
        title: "backup"
        priority: 2
        date: "2026-09-06T03:00:02.1140302+02:00"
        extras:
          client::display:
            contentType: text/plain
      - id: 23
        appid: 7
        message: "Disk 84% full"
        title: "monitor"
        priority: 8
        date: "2026-09-05T22:14:50.9930118+02:00"
        extras:
          client::display:
            contentType: text/plain

conformance:
  - name: the paging block counts this page and nothing else
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 200
      body:
        # size, limit, since, next. No total anywhere in the document, so a
        # client cannot know how many messages exist -- only how many it just
        # received.
        'paging.size': 3
        'paging.limit': 100
        'messages[0].id': 25
      absent:
        - 'paging.total'
        - 'total'

  - name: the next page is a relative path, not a URL
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      query:
        limit: "2"
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 200
      matches:
        # A path fragment beginning with a slash, which the document says to
        # combine with the Gotify base URL yourself. Every other provider here
        # that sends a next link sends an absolute URL, and a client passing
        # this to a URL constructor resolves it against whatever base it holds.
        'paging.next': '^/message\?'
      body:
        'paging.size': 2
      absent:
        - 'messages[2]'

  - name: since means less than, so paging walks into the past
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      query:
        # The document's own words: "return all messages with an ID less than
        # this value". Not after. A client that assumes the usual sense of
        # since receives what it already had, and nothing errors.
        since: "24"
        limit: "2"
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 200
      body:
        # Older than 24, not newer.
        'messages[0].id': 23
      absent:
        - 'messages[1]'

  - name: a client token reads messages
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        # The C is the type. Nothing else in the request says so.
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 200
      body:
        'messages[0].message': "Backup finished"
        'messages[0].title': "backup"
        'messages[0].priority': 4
        'messages[0].appid': 5
        'messages[0].date': "2026-09-06T04:00:11.5045044+02:00"

  - name: an application token posts a message
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: POST
      path: /message
      headers:
        # The A is the type, and this is the one route it reaches.
        Authorization: Bearer Aauldron0000000000
      json:
        message: "Nightly job finished"
        title: "cron"
        priority: 5
    expect:
      status: 200
      body:
        message: "Nightly job finished"
        title: "cron"
        priority: 5
        # The application id, which the caller did not send: an application
        # token posts as its own application and the server fills this in.
        # That is why the token type matters -- a message's origin is the
        # credential, not the body.
        appid: 5
      matches:
        # And the id, which the server assigns.
        id: '^[0-9]+$'
        # A date the server stamps, in Go's own RFC 3339 with a numeric
        # offset rather than a Z.
        date: '^[0-9]{4}-'

  - name: no credential is refused with the status repeated in the body
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      headers: {}
    expect:
      status: 401
      body:
        error: "Unauthorized"
        # The HTTP status, again, inside the body.
        errorCode: 401
        # And the field the document describes as "The http error code." --
        # which is the description of the field above it, copied.
        errorDescription: "you need to provide a valid access token or user credentials to access this api"

  - name: extras is a free-form tree under a namespaced key
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 200
      body:
        # Gotify namespaces its own extras with a double colon, which is not a
        # JSON convention and is awkward in every language that offers dotted
        # access to a decoded object.
        'messages[0].extras.client::display.contentType': text/plain

  - name: "the rate limit says so in these words"
    source: "https://gotify.net/api-docs"
    arm: rate_limit
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 429
      body:
        error: "Too Many Requests"
        errorCode: 429
        errorDescription: "you have sent too many requests"

  - name: "a forbidden request says so in these words"
    source: "https://gotify.net/api-docs"
    arm: forbidden
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 403
      body:
        error: "Forbidden"
        errorCode: 403
        errorDescription: "you are not allowed to access this api"

  - name: "a bad request says so in these words"
    source: "https://gotify.net/api-docs"
    arm: bad_request
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        Authorization: Bearer Cauldron0000000000
    expect:
      status: 400
      body:
        error: "Bad Request"
        errorCode: 400
        errorDescription: "the request is invalid"

  - name: an application token cannot read, on a route a client token reads
    source: https://raw.githubusercontent.com/gotify/server/master/docs/spec.json
    fixture: inbox
    request:
      method: GET
      path: /message
      headers:
        # The same header, the same prefix, the same shape, one letter
        # different -- and this one is refused on an endpoint that plainly
        # exists and that the other token just read.
        Authorization: Bearer Aauldron0000000000
    expect:
      status: 401
      body:
        error: "Unauthorized"
        errorCode: 401
      absent:
        - messages
