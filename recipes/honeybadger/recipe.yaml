# Honeybadger Recipe for Cauldron
#
# Written against Honeybadger's API reference at docs.honeybadger.io and struck
# live against app.honeybadger.io on 2026-09-07 with no credential and then
# with a deliberately invalid one.
#
# **`errors` is a string.** Struck live:
#
#   GET /v2/projects                      (no credential)
#   403 {"errors":"Access denied"}
#
# Plural, and holding two words. Every other provider in this collection that
# names a field `errors` puts an array there -- [sendgrid](../sendgrid) and
# [salesforce](../salesforce) among them -- because the point of the plural is
# that one request can fail several ways at once. Here it is a bare string, so
# `errors[0]` is `"A"` and `errors.length` is 12, and both of those are what a
# client written against the plural will compute.
#
# **A missing credential is 403, and so is a wrong one.** Struck live both
# ways, byte-identical. 403 means the caller was identified and is not
# permitted; sending nothing at all is neither. So the status that would tell a
# client to re-authenticate never arrives, and the two failures needing
# different fixes are one response.
#
# **An unknown path is HTML.** 404 with a full application page, so the JSON
# above is only reachable on paths that exist -- and a client cannot tell a
# typo from a permissions problem by parsing, only by reading.
#
# Honeybadger's own ingest endpoint takes a different credential in a different
# header from this one: reporting an error uses an API key per project in
# `X-API-Key`, and reading data uses a personal auth token as the Basic
# username. Two credentials, two shapes, one product, and the reading half is
# what this Recipe serves.

recipe: honeybadger
capability: observability
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.honeybadger.io/api/reporting/
  # No spec: Honeybadger's reference is a rendered documentation site.

auth:
  # A personal auth token as the Basic username, with an empty password. The
  # ingest side of the product uses X-API-Key instead, which is a different
  # credential entirely.
  scheme: basic
  keys:
    - cauldronhoneybadgerfixturetoken0
  # One response for both, struck live.
  absent_error: access_denied
  rejected_error: access_denied

responses:
  list:
    style: wrapped
    key: results
    count_field: total_count
    page_field: current_page
    limit_field: limit
  error:
    style: flat
    # Plural, and a string. Not an array of one, and not a message.
    message_field: errors
    code_field: "-"

resources:
  project:
    id:
      field: id
      style: numeric
    fields:
      name:
        type: string
      created_at:
        type: datetime
      active:
        type: boolean
        default: true
      environments:
        type: list
      fault_count:
        type: integer
        default: 0
      unresolved_fault_count:
        type: integer
        default: 0

routes:
  - method: GET
    path: /v2/projects
    resource: project
    operation: list
    pagination:
      style: page
      limit: 25
      limit_param: limit
      cursor_param: page

errors:
  access_denied:
    # Not 401. Struck live for a request with no Authorization header at all
    # and for one carrying a token nobody issued -- the same body both times.
    status: 403
    message: "Access denied"

fixtures:
  empty:
    project: []

  account:
    project:
      - id: 74821
        name: checkout-service
        created_at: "2026-03-18T14:22:05.000Z"
        active: true
        environments:
          - production
          - staging
        fault_count: 412
        # Fewer than the total, because a fault stays counted after it is
        # resolved. Two numbers on one record, and only one of them is what a
        # dashboard means by "errors".
        unresolved_fault_count: 7
      - id: 74822
        name: batch-worker
        created_at: "2026-05-02T09:00:00.000Z"
        # Deactivated and still listed, with its counts frozen where they
        # stopped.
        active: false
        environments:
          - production
        fault_count: 58
        unresolved_fault_count: 58

conformance:
  - name: the errors field is a string rather than an array
    source: https://app.honeybadger.io/v2/projects
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers: {}
    expect:
      status: 403
      body:
        # Plural, holding two words. errors[0] is "A" and errors.length is 12
        # for any client written against the array every other provider sends.
        errors: "Access denied"

  - name: a missing credential is 403 rather than 401
    source: https://app.honeybadger.io/v2/projects
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers: {}
    expect:
      # 403 means identified and not permitted. Nothing was sent, so nobody
      # was identified -- and the status that tells a client to authenticate
      # never arrives.
      status: 403

  - name: a wrong credential is the same response
    source: https://app.honeybadger.io/v2/projects
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        # not-a-token as the username, empty password, which is how
        # Honeybadger's auth token is sent.
        Authorization: "Basic bm90LWEtdG9rZW46"
    expect:
      status: 403
      body:
        # Byte-identical to the case above. The two failures that need
        # different fixes are one response.
        errors: "Access denied"

  - name: projects are wrapped in results with a total
    source: https://docs.honeybadger.io/api/reporting/
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
    expect:
      status: 200
      body:
        'results[0].name': checkout-service
        # The whole set, not the page.
        total_count: 2

  - name: a project counts its faults twice
    source: https://docs.honeybadger.io/api/reporting/
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
    expect:
      status: 200
      body:
        # A fault stays counted after it is resolved, so fault_count is
        # lifetime and unresolved_fault_count is now. A dashboard reading the
        # first shows 412 problems when there are 7.
        'results[0].fault_count': 412
        'results[0].unresolved_fault_count': 7
        # And the creation time is UTC with milliseconds, on a record whose
        # counts have no timestamp at all -- so a client cannot tell how stale
        # either number is.
        'results[0].created_at': "2026-03-18T14:22:05.000Z"

  - name: a deactivated project is still in the listing
    source: https://docs.honeybadger.io/api/reporting/
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
    expect:
      status: 200
      body:
        # Inactive, and its two counts equal because nothing has been resolved
        # since it stopped. A listing that hid it would make a paused project
        # look deleted.
        'results[1].active': false
        'results[1].fault_count': 58
        'results[1].unresolved_fault_count': 58

  - name: environments are a bare array of names
    source: https://docs.honeybadger.io/api/reporting/
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
    expect:
      status: 200
      body:
        # Strings rather than objects, so an environment has no identifier and
        # cannot be addressed except by the name a client happens to hold.
        'results[0].environments[0]': production
        'results[0].environments[1]': staging

  - name: a listing pages on page and limit
    source: https://docs.honeybadger.io/api/reporting/
    fixture: account
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
      query:
        page: "2"
        limit: "1"
    expect:
      status: 200
      body:
        'results[0].id': 74822
        current_page: 2
        limit: 1

  - name: an account with no projects answers an empty array
    source: https://docs.honeybadger.io/api/reporting/
    fixture: empty
    request:
      method: GET
      path: /v2/projects
      headers:
        Authorization: "Basic Y2F1bGRyb25ob25leWJhZGdlcmZpeHR1cmV0b2tlbjA6"
    expect:
      status: 200
      body:
        results: []
        total_count: 0
