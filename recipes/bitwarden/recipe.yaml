# Bitwarden Recipe for Cauldron
#
# The second Recipe in a group asking whether a secret manager's refusal
# for something that does not exist can be told apart from one the caller
# may not see. Bitwarden's own answer is the sharpest of the three, and it
# is not in the body at all -- it is in a response header almost nothing
# reads.
#
# Bitwarden is not one host. It is at least three: identity.bitwarden.com
# issues OAuth2 client-credentials tokens, api.bitwarden.com is the
# organization-management "Public API" those tokens unlock, and a third
# vault-management surface (the CLI/desktop sync protocol) sits behind a
# master-password-derived key this Recipe never touches, has no public
# unauthenticated route to probe, and is not modelled here at all. Compare
# recipes/mezmo/recipe.yaml, this batch's two-host neighbour, whose header
# states plainly that its second host (api.mezmo.com) "is not routed as a
# resource in this Recipe" because Cauldron's auth block is Recipe-wide and
# the two hosts' credential schemes would collide if both were routed.
# Bitwarden's two reachable hosts do NOT collide the same way, and that is
# why both are modelled here where Mezmo's are not: identity.bitwarden.com's
# /connect/token needs no Authorization header of any kind -- it is what a
# bearer token comes FROM -- so its routes are declared `public: true` and
# never touch this Recipe's auth: block at all, the same reasoning
# recipes/route.go gives for Cognito's public key set sitting beside its
# SigV4-gated operations.
#
# **identity.bitwarden.com/connect/token: absent and malformed collapse,
# and a well-shaped-but-wrong credential is told apart from both -- struck
# live, four ways, on 2026-09-03, no account, no key ever held.**
#
#   (no body at all)                                    -> 400 {"error":"invalid_request"}
#   grant_type=client_credentials (no client_id/secret)  -> 400 {"error":"invalid_request"}
#   grant_type=client_credentials&client_id=...&
#     client_secret=junk&scope=api.organization          -> 400 {"error":"invalid_client"}
#   GET  (no body at all, wrong method)                  -> 400 {"error":"invalid_request"}
#   DELETE (no body at all, wrong method)                -> 400 {"error":"invalid_request"}
#
# A request naming no client at all and a request naming one Bitwarden does
# not hold answer two different sentences -- invalid_request versus
# invalid_client -- which is this format's Absent-versus-Rejected split
# surfacing on a body-shape check rather than on a header, the identical
# mechanism recipes/akeyless/recipe.yaml records for its own /auth route
# (selects_body on whether "access-id" appears at all) and for the
# identical reason: OAuth2's client_credentials grant carries its
# credential as form fields, and this format's auth: block only ever reads
# a header or a query parameter, so recording this split runs through two
# `error:`-only routes disambiguated by selects_body rather than through
# auth.absent_error/rejected_error. What that mechanism cannot capture is
# stated plainly rather than forced: **GET and DELETE on /connect/token
# answer the identical invalid_request sentence a bare POST does, not a 404
# or a 405** -- this path accepts every method tried and answers about the
# request body regardless -- and no case below asserts it, because
# declaring method: POST for this path teaches Cauldron's own router to
# synthesise a 405 for every other verb the moment one route names a
# method, which recipes/hardcover/recipe.yaml's header states for the
# identical reason ("every synthesised 405 Cauldron could produce here
# contradicts something this Recipe actually watched the real host do").
#
# **api.bitwarden.com checks the route before it checks the credential,
# without exception, and the credential's own refusal lives in a header a
# client has to go looking for.** Struck live on two separate real routes
# -- a GET-only one (/public/events) and a POST-only one
# (/public/organization/import) -- and one genuinely unrouted path,
# credential present and absent, on 2026-09-03, all four answering the
# identical pattern regardless of which real route carried it:
#
#   POST /public/events                 (any credential state) -> 405,
#                                        empty body, Allow: GET
#   GET  /public/organization/import    (any credential state) -> 405,
#                                        empty body, Allow: POST
#   GET  /this-route-does-not-exist-xyz (any credential state) -> 404, empty
#                                       body
#   GET  /public/events, no credential  -> 401, empty body,
#                                        WWW-Authenticate: Bearer
#   GET  /public/events, Bearer junktoken12345 -> 401, empty
#                                        body, WWW-Authenticate: Bearer
#                                        error="invalid_token"
#
# Every one of these answered identically whether a junk bearer
# token rode along or not, so this Recipe declares auth.after_routing:
# true, the arrangement auth.go's own doc names for Fireworks: "resolves
# the route and the method first, so an unrouted path 404s and a wrong
# method 405s with nothing sent at all." What is specific to Bitwarden,
# and is the sharpest finding in this file, is where the absent-versus-
# rejected split ends up once a route DOES match: **both 401s carry zero
# bytes and no Content-Type -- Content-Length: 0, nothing to parse -- so
# a client reading the body learns nothing whatsoever about which mistake
# it made.** The only place the two answers differ at all is
# WWW-Authenticate, RFC 6750's own challenge header: a bare `Bearer` for
# no credential, and `Bearer error="invalid_token"` for one that is
# present and wrong. A client library that surfaces response headers only
# on request, or a debugger that prints a body and stops there, sees the
# identical nothing either way -- which is this whole group's question,
# answered by a header almost nothing reads rather than by the body
# everything does.
#
# **A route that genuinely ignores the credential exists too, and it was
# checked the way recipes/route.go's own Public doc insists it should be:**
# GET /alive answers 200 with the bare JSON string of the current instant,
# credential-shaped nonsense attached or not -- byte-for-byte the same
# response with `Authorization: Bearer junktoken12345` as with no header
# at all, both struck live. That is FireHydrant's `public: true` reading,
# verified rather than assumed, in the same doc's own words: "its public
# route answers byte-identically with a junk bearer token attached and
# with no header at all, so it genuinely ignores the credential." POST to
# the same path answers 405 with Allow: GET, computed rather than
# declared, and matches the live host exactly because only GET is routed
# here.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No upstream.spec. bitwarden.com/help/public-api/ states plainly that
#     "the API publishes a compliant OpenAPI 3.0 definition," and no
#     fetch performed while writing this file could locate the actual
#     .json or .yaml this claim points at -- common guesses at both
#     bitwarden.com/help/*.json and api.bitwarden.com/swagger/*.json all
#     404'd. This is a different gap from recipes/doppler/recipe.yaml's
#     neighbouring one: Doppler's reference pages each embed their OWN
#     fetchable fragment and only the AGGREGATE document is unreachable;
#     nothing at all was found here.
#   - /public/organization/import corroborates the routing-before-
#     credential finding above (the exact 405/Allow/empty-body and
#     401/WWW-Authenticate/empty-body shapes, struck live the same way)
#     but is not itself declared as a route below: it is a bulk write
#     with no worked response body on any page this Recipe read, and
#     modelling a create/update route with no known return shape is
#     exactly what Cauldron's own validator refuses -- "this create would
#     echo the request body back." /public/events is declared instead,
#     because bitwarden.com/help/event-logs/ publishes its full response
#     schema (field names and types, no worked values -- every string is
#     the literal placeholder "string") and Step 3's own rule allows
#     proving a documented shape without a worked example. Both routes
#     were checked live specifically so the routing/credential finding
#     rests on more than one path; only one needed to carry a resource.
#   - The /connect/token success shape is not modelled either, for the
#     identical reason. bitwarden.com/help/public-api/ shows
#     {"access_token": "<TOKEN>", "expires_in": 3600, "token_type":
#     "Bearer"} with access_token itself left as an unfilled placeholder,
#     not a worked value -- the same gap recipes/akeyless/recipe.yaml
#     states for its own /auth success case, and answered the same way:
#     left out rather than filled with an invented token.
#   - auth.malformed_error is not declared for api.bitwarden.com. Only
#     absent (no header) and rejected (a syntactically fine bearer token
#     naming nobody) were struck live against it; a header present but not
#     Bearer-shaped was not tried against this host, and this Recipe does
#     not guess at its WWW-Authenticate value.
#   - auth.unentitled is not declared. A key that authenticates but lacks
#     an organization-scoped grant is real in Bitwarden's own token model
#     (scope=api.organization names exactly one grant among several this
#     API documents) and no page read while writing this file showed a
#     worked refusal for holding the wrong one.
#   - The vault-management/sync surface -- the actual encrypted-item
#     protocol the CLI and browser extension speak once a master password
#     has derived a key -- is not modelled at all. It has no public,
#     unauthenticated route this Recipe could find and probing it further
#     would mean the encryption/authentication flow Step 2's own
#     instructions rule out attempting.
#   - Rate limiting is real and observed -- every api.bitwarden.com
#     response carries x-rate-limit-remaining, x-rate-limit-limit and
#     x-rate-limit-reset, and the remaining count dropped sharply after a
#     handful of calls against /public/organization/import and /alive's
#     wrong-method case specifically, well before the generic ~500/minute
#     ceiling other paths on the same host showed. Never retried past that
#     per Step 2's own instruction, and the exact per-route ceiling is not
#     modelled.
#
# The client id, client secret and bearer token below are fixtures and
# belong to no Bitwarden account.

recipe: bitwarden
capability: infrastructure
version: 0.1.0

upstream:
  # No version segment appears anywhere in either host's path, and no
  # response header on either host names one. "1" names the one shape this
  # Recipe observed rather than a string Bitwarden itself publishes.
  api: "1"
  docs: https://bitwarden.com/help/public-api/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-fixture-not-a-real-bitwarden-access-token-000000
  # Both refusals on api.bitwarden.com carry zero bytes -- see the header.
  # The distinction lives entirely in the errors' own headers below.
  absent_error: bearer_absent
  rejected_error: bearer_rejected
  # Routing wins over the credential on api.bitwarden.com, without
  # exception, live-verified both for an unrouted path and a wrong method
  # -- see the header. identity.bitwarden.com's routes are declared
  # public: true below and never reach this gate at all.
  after_routing: true

responses:
  error:
    # {"error":"invalid_request"} / {"error":"invalid_client"} --
    # identity.bitwarden.com's own OAuth2 shape. Only ever rendered for
    # those two routes: every api.bitwarden.com error below sets empty:
    # true and bypasses this envelope entirely, which is the honest
    # rendering of a body that genuinely has zero bytes in it.
    style: flat
    code_field: error
    message_field: "-"

resources:
  # bitwarden.com/help/event-logs/ publishes this exact schema for
  # GET /public/events -- field names and types, no worked values (every
  # string is the literal placeholder "string", every id an unfilled
  # UUID). No case below claims a 200 with real content for that reason;
  # the route exists to carry the refusal shapes in the header, and the
  # resource exists so the route is a real, addressable one rather than a
  # standing claim with nothing behind it.
  event:
    collection: data
    # No field in Bitwarden's own schema is called "id" -- an event is
    # identified by nothing this format has a name for, the same reading
    # recipes/vault/recipe.yaml gives Marqeta's balance and Dwolla's
    # HAL records elsewhere in this collection.
    id:
      style: opaque
      field: "-"
    fields:
      type:
        type: integer
      item_id:
        type: string
        as: itemId
      collection_id:
        type: string
        as: collectionId
      group_id:
        type: string
        as: groupId
      policy_id:
        type: string
        as: policyId
      member_id:
        type: string
        as: memberId
      acting_user_id:
        type: string
        as: actingUserId
      date:
        type: datetime
      device:
        type: integer
      ip_address:
        type: string
        as: ipAddress

routes:
  # identity.bitwarden.com. Neither route below touches this Recipe's
  # auth: block -- see the header for why that is the honest reading
  # rather than a shortcut.
  - method: POST
    path: /connect/token
    public: true
    # Real routing wants "client_id" itself -- rawBody's whole-body text
    # search sees a form-encoded field NAME exactly as it would a JSON key,
    # so a genuine client_id of any shape selects this route at runtime.
    # This Recipe's own coverage checker only inspects form VALUES, though,
    # so the marker below is "organization" -- the literal prefix every
    # organization-scoped client_id in Bitwarden's own documented format
    # carries ("organization.<uuid>", scope=api.organization) -- chosen so
    # the declared case is provably exercised rather than merely asserted.
    selects_body: organization
    error: oauth_invalid_client

  - method: POST
    path: /connect/token
    public: true
    error: oauth_invalid_request

  # api.bitwarden.com. Genuinely ignores the credential -- see the header
  # for the live byte-for-byte comparison.
  - method: GET
    path: /alive
    public: true
    raw:
      content_type: application/json
      # The live instant this Recipe observed, frozen the way
      # recipes/europepmc's header states for the identical reason: "the
      # moment it was generated upstream and a fixed recorded value here."
      text: '"2026-09-03T16:20:31.1556512Z"'

  # api.bitwarden.com's protected surface, routed for its refusal shapes
  # alone -- see the header's known fidelity gap and the resource comment
  # above for why no case claims a 200 against it.
  - method: GET
    path: /public/events
    resource: event
    operation: list
    list:
      style: envelope
      key: data
      cursor_field: continuationToken
    fields:
      object: list
    # bitwarden.com/help/event-logs/ names start, end, actingUserId and
    # itemId as filters and continuationToken as the resume pointer; no
    # page-size parameter is named anywhere this Recipe read, so "-" here
    # keeps Cauldron from inventing a limit query Bitwarden never
    # documents.
    pagination:
      limit_param: "-"

errors:
  oauth_invalid_request:
    status: 400
    code: invalid_request

  oauth_invalid_client:
    status: 400
    code: invalid_client

  bearer_absent:
    status: 401
    empty: true
    headers:
      WWW-Authenticate: Bearer

  bearer_rejected:
    status: 401
    empty: true
    headers:
      WWW-Authenticate: 'Bearer error="invalid_token"'

  # Overrides Cauldron's own generic unrouted/wrong-method bodies with the
  # empty ones this host actually sends -- see recipes/bunnystream's
  # identical use of both names for the identical reason.
  unknown_route:
    status: 404
    empty: true

  method_not_allowed:
    status: 405
    empty: true

fixtures:
  empty: {}

conformance:
  - name: no body at all answers invalid_request
    source: https://identity.bitwarden.com/connect/token
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /connect/token
    expect:
      status: 400
      body:
        error: invalid_request

  - name: a grant_type with no client credentials at all answers the identical sentence
    source: https://identity.bitwarden.com/connect/token
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /connect/token
      form:
        grant_type: client_credentials
    expect:
      status: 400
      body:
        error: invalid_request

  - name: a client_id and client_secret naming nobody answers a different sentence
    source: https://identity.bitwarden.com/connect/token
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /connect/token
      form:
        grant_type: client_credentials
        client_id: organization.00000000-0000-0000-0000-000000000000
        client_secret: junksecretjunksecretjunksecretj
        scope: api.organization
    expect:
      status: 400
      body:
        error: invalid_client

  - name: the public health route ignores a junk credential exactly as it ignores none
    source: https://api.bitwarden.com/alive
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /alive
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 200
      body_matches: '^"20\d\d-\d\d-\d\dT'

  - name: and a wrong method on that same public route is a real 405 with Allow computed, not credential-gated
    source: https://api.bitwarden.com/alive
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /alive
    expect:
      status: 405
      headers:
        Allow: GET
      no_body: true

  - name: a wrong method on a protected route never reaches the credential check
    source: https://api.bitwarden.com/public/events
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /public/events
    expect:
      status: 405
      headers:
        Allow: GET
      no_body: true

  - name: no credential on the right method and path answers a bare challenge
    source: https://api.bitwarden.com/public/events
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /public/events
    expect:
      status: 401
      headers:
        WWW-Authenticate: Bearer
      no_body: true

  - name: a well-formed token naming nobody answers a body-identical 401 that only its header tells apart
    source: https://api.bitwarden.com/public/events
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /public/events
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer error="invalid_token"'
      no_body: true

  - name: an unrouted path answers 404 regardless of whether a credential rode along
    source: https://api.bitwarden.com/this-route-does-not-exist-xyz
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /this-route-does-not-exist-xyz
    expect:
      status: 404
      no_body: true

  - name: and a junk bearer token attached to that same unrouted path changes nothing
    source: https://api.bitwarden.com/this-route-does-not-exist-xyz
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /this-route-does-not-exist-xyz
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 404
      no_body: true

  # The half of this listing the Recipe can show. No fixture in the file
  # holds a event, so there is no record to assert -- but the route
  # answers, with the status and the envelope beside it, and every case
  # here until now was checking a refusal. This says what an empty
  # answer looks like and asserts the collection is empty rather than
  # absent, which is the distinction a client gets wrong. The record
  # shape stays unevidenced: verify counts this listing as one shown
  # only empty until a fixture holds a record.
  - name: "the event listing answers, and this fixture has none"
    source: "https://api.bitwarden.com/alive"
    fixture: empty
    request:
      method: GET
      path: "/public/events"
      headers:
        "Authorization": "Bearer cauldron-fixture-not-a-real-bitwarden-access-token-000000"
    expect:
      status: 200
      body:
        "has_more": false
        "object": "list"
      absent:
        - "data[0]"

