# OneSignal Recipe for Cauldron
#
# OneSignal has no sandbox. An app in the dashboard is a real app with real
# subscribed devices, and a test that sends a notification sends it: to
# phones, as a banner, at whatever hour the test suite happens to run. There
# is no dry run and no undo, and the free tier is generous enough that nobody
# notices the cost, which makes it more likely somebody points a suite at it.
#
# Four things worth modelling exactly:
#
#   1. A send with nobody to send to answers HTTP 200 with an errors array in
#      the body. The request was fine and the notification went nowhere, so
#      code that branches on the status code counts it as delivered. This is
#      the failure most worth reproducing, because it is exactly what happens
#      when a segment is misspelled or empty.
#   2. recipients is how many devices were targeted, not how many received
#      anything. Delivery is asynchronous and its outcome arrives later, so
#      this number is the ceiling rather than the result.
#   3. The REST key goes after "Basic " unencoded. It is not HTTP Basic
#      despite the word: there is no base64 and no colon, so a client that
#      does the standard thing produces a header OneSignal rejects.
#   4. A device that uninstalled the app is still a subscription with an id.
#      It has notification_types below zero and never receives anything, so a
#      count of subscriptions is not an audience.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing is delivered here, and delivery outcomes arrive by webhook or
#     in the dashboard rather than in the send response. This Recipe covers
#     the send and the state the API exposes.
#   - Whether a send has recipients is a fixture rather than something
#     Cauldron works out from a segment, so "this segment is empty" is a
#     state a test seeds.
#   - OneSignal has both a v1 REST surface and a newer v2. This targets the
#     v1 notification endpoints, which is what most integrations use.
#
# Keys below are fixtures, not secrets.

recipe: onesignal
capability: push
version: 0.1.0

upstream:
  api: v1
  docs: https://documentation.onesignal.com/reference

auth:
  # The word is Basic and the scheme is not. The REST key follows it
  # unencoded, with no colon and no base64, so a client that does the
  # standard thing produces a header OneSignal rejects.
  scheme: header
  header: Authorization
  prefix: "Basic "
  keys:
    - cauldron-rest-api-key

responses:
  list:
    style: wrapped
    count_field: total_count
  resource:
    style: bare
  error:
    style: string_list
    key: errors

resources:
  notification:
    collection: notifications
    # An unresolved disagreement, left unresolved on purpose. OneSignal's
    # machine-readable description declares 103 properties on a read
    # notification and neither recipients nor errors is among them -- they
    # appear only on the create response. Narrowing the read routes to match
    # it failed two cases that cite OneSignal's own view-notification page,
    # which shows recipients on a view.
    #
    # One of those is wrong and this cannot tell which from here. A generated
    # description omitting a field is ordinary; so is a documentation page
    # showing a field the API stopped sending. The create was not like this:
    # there the description, the docs and this Recipe's own comment about
    # delivery counts all agreed, and only the model disagreed.
    id:
      style: uuid
    fields:
      # How many devices were targeted. Not how many received anything:
      # delivery is asynchronous and its outcome arrives later, so this is
      # the ceiling rather than the result.
      recipients:
        type: integer
        default: 0
      # Present when the send matched nobody. A 200 with this in it is the
      # failure most worth reproducing, because it is what a misspelled or
      # empty segment produces.
      errors:
        type: list
      # The caller's own identifier, which OneSignal echoes and does not
      # generate. Null when none was sent, so it cannot be used to correlate
      # unless the caller supplied one.
      external_id:
        type: string
      # Delivery counts, filled in over the following minutes. Absent on a
      # notification that has just been queued, so the fields a dashboard
      # reads do not exist yet.
      successful:
        type: integer
      failed:
        type: integer
      converted:
        type: integer
      queued_at:
        type: timestamp
      # Set when the notification actually went out, which is not when it was
      # accepted. A scheduled send has a send_after in the future and has
      # done nothing yet.
      completed_at:
        type: timestamp
        stamped: false
      send_after:
        type: timestamp
        stamped: false

  subscription:
    collection: players
    id:
      style: uuid
    fields:
      # 1 is subscribed. 0 is unsubscribed by the user. Negative numbers mean
      # the device is gone: -2 is an uninstall. A count of subscriptions is
      # not an audience.
      notification_types:
        type: integer
        default: 1
      device_type:
        type: integer
        default: 0
      # True once OneSignal has confirmed the device is unreachable. It
      # remains in the app, listed, with an id that still resolves.
      invalid_identifier:
        type: boolean
        default: false
      external_user_id:
        type: string
      last_active:
        type: timestamp
      # Segments the device belongs to. A device can be in none, which is not
      # the same as being unsubscribed.
      tags:
        type: list

routes:
  - method: POST
    path: /api/v1/notifications
    resource: notification
    operation: create
    status: 200
    # Four properties, which is what OneSignal's own description declares for
    # this operation: id, recipients, external_id and errors. Nothing else.
    #
    # This route sent the whole resource, delivery counts included, which the
    # comment on those very fields says do not exist yet on a notification
    # that has just been queued. The prose was right and the model disagreed
    # with it.
    #
    # It matters because the counts are the fields somebody reaches for. Code
    # reading res.failed after a send gets a number here and undefined from
    # OneSignal, and `undefined > 0` is false, so a check for failures passes
    # locally and then never fires against the real thing. The outcome needs a
    # second request to GET /notifications/{id}, minutes later, and that is
    # the whole shape of this API.
    returns:
      - id
      - recipients
      - external_id
      - errors

  - method: GET
    path: /api/v1/notifications/{id}
    resource: notification
    operation: get

  - method: GET
    path: /api/v1/notifications
    resource: notification
    operation: list
    pagination:
      # Read from OneSignal's own description, which declares limit and offset
      # on both listings.
      style: offset
      limit: 50
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /api/v1/players/{id}
    resource: subscription
    operation: get

  - method: GET
    path: /api/v1/players
    resource: subscription
    operation: list
    pagination:
      # Read from OneSignal's own description, which declares limit and offset
      # on both listings.
      style: offset
      limit: 50
      limit_param: limit
      cursor_param: offset

webhooks:
  events:
    - notification.displayed
    - notification.clicked
    - notification.dismissed
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    message: Rate limit exceeded

  # Confirmed live 2026-09-05 against onesignal.com, no account and no key
  # -- no credential at all gets this exact sentence. A wrong one's message
  # varies by the shape of what was sent (OneSignal's parser distinguishes
  # v1 and v2 token formats before it ever checks whether the key is real),
  # which this file does not attempt to reproduce.
  authentication_error:
    status: 401
    message: "Access denied.  Please include an 'Authorization: ...' header with a valid API key (https://documentation.onesignal.com/docs/en/keys-and-ids#api-keys)."

  # A credential shaped like standard base64 HTTP Basic (the key with a
  # trailing colon, encoded) reads to OneSignal's parser as a deprecated v1
  # user token rather than as an ordinary wrong key. Confirmed live
  # 2026-09-05 -- see the case that arms this.
  deprecated_v1_token:
    status: 400
    style: string_list
    key: errors
    fields:
      errors:
        - "Request is malformed: Auth token is a deprecated v1 user token format. Please migrate to v2 org tokens.  See https://documentation.onesignal.com/docs/en/keys-and-ids#organization-api-key ."
        - "V1 user token rejected at parse time (deprecated)"

  resource_missing:
    status: 404
    message: "Could not find app_id or notification: {detail}"

  parameter_missing:
    status: 400
    message: "{detail} is required"

  # A segment name that does not exist. OneSignal refuses this one properly
  # rather than sending to nobody, which makes it the better failure of the
  # two and the one nobody plans for.
  invalid_segment:
    status: 400
    message: "Segment is not a valid segment for this app"

  # An app that has not finished setup. Sends are accepted nowhere and the
  # failure names the app rather than the missing configuration.
  app_not_configured:
    status: 400
    message: "App has no active push configuration"

fixtures:
  empty: {}

  small-app:
    notification:
      # Sent to a real audience. recipients is the ceiling, and the delivery
      # counts beside it are what actually happened.
      - id: 11111111-1111-4111-8111-111111111111
        recipients: 1420
        successful: 1388
        failed: 32
        converted: 214
        queued_at: 1767225600
        completed_at: 1767225660
      # Accepted and sent to nobody. HTTP 200, with the reason in an errors
      # array, which is what a misspelled or empty segment produces.
      - id: 22222222-2222-4222-8222-222222222222
        recipients: 0
        errors:
          - All included players are not subscribed
        queued_at: 1767225700
      # Scheduled. Accepted, counted, and nothing has been sent: send_after
      # is in the future and the delivery counts do not exist yet.
      - id: 33333333-3333-4333-8333-333333333333
        recipients: 890
        queued_at: 1767225800
        send_after: 1767312000

    subscription:
      - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        notification_types: 1
        device_type: 0
        external_user_id: user-900
        tags:
          - key: plan
            value: pro
      # Unsubscribed by the user. Still a subscription, still listed, and it
      # receives nothing.
      - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        notification_types: 0
        device_type: 1
        external_user_id: user-901
      # Uninstalled. A negative number, confirmed unreachable, and still
      # holding an id that resolves. A count of subscriptions is not an
      # audience.
      - id: cccccccc-cccc-4ccc-8ccc-cccccccccccc
        notification_types: -2
        device_type: 0
        invalid_identifier: true
        external_user_id: user-902

# Conformance cases, read from the OneSignal REST reference rather than
# observed against a live app. The verify report says so.
conformance:
  - name: no credential at all is refused with a link to the docs
    source: https://onesignal.com/api/v1/apps
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/v1/apps
    expect:
      status: 401
      body:
        errors[0]: "Access denied.  Please include an 'Authorization: ...' header with a valid API key (https://documentation.onesignal.com/docs/en/keys-and-ids#api-keys)."

  - name: a create answers with four properties and no delivery counts
    # OneSignal's own description declares exactly id, recipients, external_id
    # and errors on this operation, and this Recipe was sending the whole
    # notification -- delivery counts included, on a notification that has by
    # definition delivered nothing yet.
    #
    # The counts are what somebody reaches for. Code reading res.failed after
    # a send gets a number from an emulator that sends one and undefined from
    # OneSignal, and `undefined > 0` is false, so a check for failures passes
    # here and never fires there. The outcome needs a second request to
    # GET /notifications/{id}, minutes later. That gap is the API's shape and
    # a fake that hides it teaches the opposite.
    source: https://documentation.onesignal.com/reference/create-notification
    fixture: small-app
    request:
      method: POST
      path: /api/v1/notifications
      headers:
        Authorization: Basic cauldron-rest-api-key
      json:
        app_id: 33333333-3333-4333-8333-333333333333
        included_segments:
          - Subscribed Users
        contents:
          en: The engine is warm
    expect:
      status: 200
      matches:
        # Present, and generated rather than echoed.
        id: '^[0-9a-f-]{36}$'
      absent:
        # Every one of these exists on a notification that has been delivered,
        # and none of them on one that has just been accepted.
        - successful
        - failed
        - converted
        - queued_at
        - completed_at
        - send_after

  - name: a send to nobody answers 200 with errors in the body
    source: https://documentation.onesignal.com/reference/create-notification
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      # Two hundred. The request was fine and the notification went nowhere,
      # so code branching on the status code counts it as delivered. This is
      # what a misspelled or empty segment produces.
      status: 200
      body:
        recipients: 0
        errors[0]: All included players are not subscribed

  - name: recipients is a ceiling rather than a result
    source: https://documentation.onesignal.com/reference/view-notification
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # Fourteen hundred targeted, thirteen hundred and eighty-eight
        # delivered, thirty-two failed. Reporting recipients as the delivery
        # count overstates every send by whatever did not arrive.
        recipients: 1420
        successful: 1388
        failed: 32

  - name: a scheduled notification has no delivery counts yet
    source: https://documentation.onesignal.com/reference/view-notification
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # Accepted, counted, and nothing sent. send_after is in the future.
        recipients: 890
        send_after: 1767312000
      # The fields a dashboard reads do not exist yet, so reading them as
      # zero reports a send that failed rather than one that has not run.
      absent:
        - successful
        - failed
        - completed_at

  - name: a successful send carries no errors array
    source: https://documentation.onesignal.com/reference/create-notification
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        completed_at: 1767225660
      # Absent rather than empty, so a presence check is the right test and
      # a length check on a missing array throws.
      absent:
        - errors

  - name: an unsubscribed device is still a subscription
    source: https://documentation.onesignal.com/reference/view-device
    fixture: small-app
    request:
      method: GET
      path: /api/v1/players/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # Zero means the user turned notifications off. Still listed, still
        # counted, receives nothing.
        notification_types: 0
        external_user_id: user-901

  - name: an uninstalled device has a negative subscription type
    source: https://documentation.onesignal.com/reference/view-device
    fixture: small-app
    request:
      method: GET
      path: /api/v1/players/cccccccc-cccc-4ccc-8ccc-cccccccccccc
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # Negative, and confirmed unreachable. A count of subscriptions is
        # not an audience, and a truthiness check on this number is true for
        # both -2 and 1.
        notification_types: -2
        invalid_identifier: true

  - name: a subscribed device is the only one that receives anything
    source: https://documentation.onesignal.com/reference/view-device
    fixture: small-app
    request:
      method: GET
      path: /api/v1/players/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # One. The other two in this app are listed beside it and reachable
        # by neither.
        notification_types: 1
        tags[0].key: plan
        # Present and false. The uninstalled device above sets it true, so
        # this is the pair that distinguishes them rather than an absence.
        invalid_identifier: false

  - name: the key follows Basic unencoded
    # This asserted a generic "Invalid or missing authentication token" and
    # passed, because the Recipe served that for every rejection alike.
    # Confirmed live 2026-09-05: what a client doing standard HTTP Basic
    # sends -- the key, base64 encoded with a colon -- does not read as "no
    # credential" to OneSignal's parser at all. It reads as a deprecated v1
    # user token, and answers that instead, with a second error beside the
    # first. Two messages in the array, and a status this file had also
    # declared wrong: 400, not 401. Modelled as its own fault, armed rather
    # than reached through routing, because this format's single
    # authentication_error entry cannot carry two different bodies for two
    # different rejected shapes at once.
    source: https://onesignal.com/api/v1/apps
    verified: "2026-09-05"
    arm: deprecated_v1_token
    fixture: small-app
    request:
      method: GET
      path: /api/v1/apps
      headers:
        Authorization: Basic Y2F1bGRyb24tcmVzdC1hcGkta2V5Og==
    expect:
      status: 400
      body:
        errors[0]: "Request is malformed: Auth token is a deprecated v1 user token format. Please migrate to v2 org tokens.  See https://documentation.onesignal.com/docs/en/keys-and-ids#organization-api-key ."
        errors[1]: "V1 user token rejected at parse time (deprecated)"

  - name: failures are an array of bare strings
    source: https://documentation.onesignal.com/reference/create-notification
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications/00000000-0000-4000-8000-000000000000
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 404
      matches:
        # Strings, not objects. Code looping over errors and reading .message
        # from each finds undefined on every one and throws, which is the
        # same shape Datadog has.
        errors[0]: 'Could not find'
      absent:
        - error
        - message

  - name: the total is named total_count
    source: https://documentation.onesignal.com/reference/view-notifications
    fixture: small-app
    request:
      method: GET
      path: /api/v1/notifications
      query:
        limit: "1"
      headers:
        Authorization: Basic cauldron-rest-api-key
    expect:
      status: 200
      body:
        # Three notifications, one returned. The count is of everything that
        # matched rather than of what arrived, so a progress bar sized from
        # the array length is wrong by two.
        total_count: 3
        notifications[0].recipients: 1420
      # This is also the only case here that reads the collection
      # successfully: the other list case was checking that a standard Basic
      # header is refused, so nothing asserted what a working listing looks
      # like.
      absent:
        - notifications[1]


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads"
    source: "https://documentation.onesignal.com/reference/view-notifications"
    fixture: small-app
    request:
      method: GET
      path: "/api/v1/notifications"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Basic cauldron-rest-api-key"
    expect:
      status: 200
      body:
        "notifications[0].id": "22222222-2222-4222-8222-222222222222"
      absent:
        - "notifications[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "limit and offset are the two names this listing reads on api v1 notifications"
    source: "https://documentation.onesignal.com/reference/view-notifications"
    fixture: small-app
    request:
      method: GET
      path: "/api/v1/notifications"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Basic cauldron-rest-api-key"
    expect:
      status: 200
      body:
        "notifications[0].id": "22222222-2222-4222-8222-222222222222"
      absent:
        - "notifications[1]"
