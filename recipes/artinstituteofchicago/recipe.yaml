# Art Institute of Chicago Recipe for Cauldron
#
# One field in the response is licensed differently from the rest of it, and the
# response says so in prose.
#
#   "info": {"license_text": "The `description` field in this response is
#     licensed under a Creative Commons Attribution 4.0 Generic License (CC-By)
#     ... All other data in this response is licensed under a Creative Commons
#     Zero (CC0) 1.0 designation ..."}
#
# Ninety-eight fields on an artwork, ninety-seven of them CC0 and one of them
# CC-BY -- and the only statement of which is which is an English sentence in a
# sibling key, naming the field in backticks. A client that stores the response
# and republishes it under one licence is wrong about exactly one column, and
# nothing structural marks it: description sits in data beside the other
# ninety-seven and looks the same.
#
# **And an image URL is three pieces from two levels of the response.** The
# artwork carries image_id and no image URL at all; the base lives in a
# top-level config key beside data, not in it, and the rest of the path is a
# template the response never mentions. config.iiif_url plus image_id plus
# "/full/843,/0/default.jpg" is the URL, and a client reading only data cannot
# build it.
#
# Written against the live API rather than a document: every case below was
# checked against api.artic.edu on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. date_display and date_end disagree. Seurat's Grande Jatte reads
#      "1884-86, border added 1888-89" and its date_end is 1886, so the string a
#      person reads names a later year than the number a query sorts on. Anything
#      ordering or filtering by date puts this earlier than the display says.
#   2. The same coordinate is in the response three times, and the third is
#      rounded. latitude is 41.8795894858483, longitude is -87.623031400144, and
#      latlon is the string "41.879589485848,-87.623031400144" -- the two numbers
#      joined by a comma with a decimal place dropped from each. Two of the three
#      round-trip and one does not.
#   3. colorfulness is 0 on the Grande Jatte. A pointillist painting made of
#      coloured dots scores zero on the field measuring colour, while a Franz
#      Marc scores 43.0038 -- so 0 means "not computed" and nothing distinguishes
#      it from "computed, and grey".
#   4. has_not_been_viewed_much is a negated boolean, so the ordinary question
#      is a double negative: !artwork.has_not_been_viewed_much.
#   5. alt_classification_ids is classification_ids without its first entry, on
#      both artworks. The name says "alt" and the relationship is "all but the
#      primary", which nothing in the response states.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two artworks are served, not 132,681, and each is trimmed from 98 fields
#     to the 25 the cases read. pagination.total therefore counts the fixture,
#     which is 2.
#   - The live paging envelope carries six keys -- total, limit, offset,
#     total_pages, current_page and next_url -- and only total and limit are
#     served. The other four are computed, and one of them is worth recording
#     here because it disagrees with its neighbours: the envelope reports an
#     offset, and the next_url it hands a client to follow asks for a page.
#     ?limit=2 answers "offset": 0 beside
#     "next_url": ".../artworks?page=2&limit=2", so the fields a client reads
#     and the URL it is told to use are two different paging vocabularies in one
#     object.
#   - description is quoted at its opening clause rather than in full. It is the
#     CC-BY field, and the source URL is on every case that reads it.
#   - thumbnail.alt_text is 264 characters on one of them and is not served;
#     lqip is served whole, because its being a base64 image inside a metadata
#     response is the point.
#   - Only the artworks list and a single artwork are modelled. Search,
#     exhibitions, agents and the other twenty-odd collections answer their own
#     documents.

recipe: artinstituteofchicago
capability: infrastructure
version: 0.1.0

upstream:
  api: artinstituteofchicago
  docs: https://api.artic.edu/docs/

auth:
  # Public, and no key. An AIC-User-Agent header is requested and not enforced.
  scheme: none

responses:
  success:
    fields:
      # Beside data rather than inside it, on every answer, and required to
      # build an image URL from the image_id that is inside it.
      config:
        iiif_url: https://www.artic.edu/iiif/2
        website_url: http://www.artic.edu
      info:
        # The sentence that says one field of ninety-eight is under a different
        # licence from the other ninety-seven, and names it in backticks.
        license_text: The `description` field in this response is licensed under a Creative Commons Attribution 4.0 Generic License (CC-By) and the Terms and Conditions of artic.edu. All other data in this response is licensed under a Creative Commons Zero (CC0) 1.0 designation and the Terms and Conditions of artic.edu.
        license_links:
          - https://creativecommons.org/publicdomain/zero/1.0/
          - https://www.artic.edu/terms
        version: "1.15"
  list:
    style: wrapped
    key: data
    count_field: pagination.total
    limit_field: pagination.limit
  resource:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: error
    status_field: status

resources:
  artwork:
    id:
      style: numeric
      type: number
    fields:
      api_model:
        type: string
      api_link:
        type: string
      title:
        type: string
      # The year as a person reads it, which is not always the year the numbers
      # below carry.
      date_display:
        type: string
      date_start:
        type: integer
      date_end:
        type: integer
      # Two lines, in one string.
      artist_display:
        type: string
      artist_title:
        type: string
      place_of_origin:
        type: string
      medium_display:
        type: string
      dimensions:
        type: string
      credit_line:
        type: string
      main_reference_number:
        type: string
      department_title:
        type: string
      # HTML, in JSON, and the one field under a different licence.
      description:
        type: string
      # An identifier, and no URL anywhere on the record.
      image_id:
        type: string
      # A base64 GIF, inline, on every row of every listing.
      thumbnail:
        type: map
      is_public_domain:
        type: boolean
      is_on_view:
        type: boolean
      is_boosted:
        type: boolean
      # Negated, so the ordinary question is a double negative.
      has_not_been_viewed_much:
        type: boolean
      boost_rank:
        type: integer
      # 0 on a pointillist painting.
      colorfulness:
        type: number
      latitude:
        type: number
      longitude:
        type: number
      # The same pair again, joined by a comma, one decimal place shorter.
      latlon:
        type: string
      classification_ids:
        type: list
      # classification_ids without its first entry.
      alt_classification_ids:
        type: list

routes:
  - method: GET
    path: /api/v1/artworks
    resource: artwork
    operation: list
    pagination:
      style: page
      limit: 12
      limit_param: limit
      cursor_param: page

  - method: GET
    path: /api/v1/artworks/{id}
    resource: artwork
    operation: get
    not_found: item_not_found

errors:
  item_not_found:
    status: 404
    message: Not found
    fields:
      detail: The item you requested cannot be found.

fixtures:
  empty: {}

  collection:
    artwork:
      - id: "9021"
        api_model: artworks
        api_link: https://api.artic.edu/api/v1/artworks/9021
        title: The Bewitched Mill
        # Agreeing with the numbers, which the other artwork's does not.
        date_display: "1913"
        date_start: 1913
        date_end: 1913
        # A newline, inside a display string, and an en dash in the years.
        artist_display: "Franz Marc\nGerman, 1880–1916"
        artist_title: Franz Marc
        place_of_origin: Germany
        medium_display: Oil on canvas
        # Multiplication signs rather than the letter x.
        dimensions: "Without frame: 130.2 × 90.8 cm (51 5/16 × 35 3/4 in.); 130.2 × 91.2 cm (51 1/4 × 35 7/8 in.)"
        credit_line: Arthur Jerome Eddy Memorial Collection
        main_reference_number: "1931.522"
        department_title: Modern Art
        # HTML in a JSON string, and the CC-BY field. Trimmed to its opening
        # clause; the whole of it is at the source URL on the case below.
        description: "<p>Among the German Expressionists, artists who used strong color and exaggerated form to express emotional content, Fra"
        image_id: 6829aab0-8d0e-9438-aebf-a1a379572951
        thumbnail:
          # A whole GIF, base64, inline in a metadata response -- on every row
          # of every listing.
          lqip: data:image/gif;base64,R0lGODlhAwAFAPMAAD1ta11eS15XVlVdWW1zYaVoYWBognd3gJaNiIuUmZiYmomfqrG4tbe7t7C5vgAAACH5BAAAAAAALAAAAAADAAUAAAQL0CSi2CgtICfAOhEAOw==
          width: 6100
          height: 8830
        is_public_domain: true
        is_on_view: false
        is_boosted: false
        has_not_been_viewed_much: false
        boost_rank: null
        # Measured here, and zero on the other one.
        colorfulness: 43.0038
        latitude: null
        longitude: null
        latlon: null
        classification_ids:
          - TM-66
          - TM-9
          - TM-155
        # The same list without its first entry.
        alt_classification_ids:
          - TM-9
          - TM-155

      - id: "27992"
        api_model: artworks
        api_link: https://api.artic.edu/api/v1/artworks/27992
        # An em dash here, where the dates use en dashes.
        title: "A Sunday on La Grande Jatte — 1884"
        # Names 1889, and date_end below says 1886.
        date_display: "1884–86, border added 1888–89"
        date_start: 1884
        date_end: 1886
        # One line here, where the other artwork's has two.
        artist_display: "Georges Seurat (French, 1859–1891)"
        artist_title: Georges Seurat
        place_of_origin: France
        medium_display: Oil on canvas
        dimensions: "207.5 × 308.1 cm (81 3/4 × 121 1/4 in.)"
        credit_line: Helen Birch Bartlett Memorial Collection
        main_reference_number: "1926.224"
        department_title: Painting and Sculpture of Europe
        description: "<p>In <em>Ferris Bueller’s Day Off</em>, Ferris’s best friend Cameron Frye intensely studies this nearly ten-foot-wide painting"
        image_id: 2d484387-2509-5e8e-2c43-22f9981972eb
        thumbnail:
          lqip: data:image/gif;base64,R0lGODlhBQAEAPQAAERBOFFOR1FPRlFPSFROR1ZSSVlWTVdWU1pXTlpYUV5aUV5bU2BeVWNhWGZjWmhlXGtoX21qYXBtZHJvZnRxaHZzanl2bXt4b354cX56cYB9dIJ/dgAAAAAAAAAAAAAAACH5BAAAAAAALAAAAAAFAAQAAAUVICWOZGmeaKqubOu+cCzPdG3feK7vfAgAOw==
          width: 9310
          height: 6237
        is_public_domain: true
        is_on_view: true
        is_boosted: true
        has_not_been_viewed_much: false
        boost_rank: 14
        # A painting made of coloured dots, scoring zero for colour.
        colorfulness: 0
        latitude: 41.8795894858483
        longitude: -87.623031400144
        # The two numbers above, joined by a comma, with a decimal place gone
        # from each.
        latlon: 41.879589485848,-87.623031400144
        classification_ids:
          - TM-66
          - TM-10387
          - TM-78
          - TM-14976
          - TM-9
          - TM-54
        alt_classification_ids:
          - TM-10387
          - TM-78
          - TM-14976
          - TM-9
          - TM-54

conformance:
  - name: the config that builds an image URL is beside the artwork, not in it
    source: https://api.artic.edu/api/v1/artworks/9021
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/9021
    expect:
      status: 200
      body:
        # The record has an identifier and no URL.
        "data.image_id": 6829aab0-8d0e-9438-aebf-a1a379572951
        # The base is a sibling of data rather than a field of it, and the rest
        # of the path -- /full/843,/0/default.jpg -- is in neither.
        "config.iiif_url": https://www.artic.edu/iiif/2
        "config.website_url": http://www.artic.edu
      absent:
        - data.image_url
        - data.iiif_url

  - name: the display date names a later year than the number
    source: https://api.artic.edu/api/v1/artworks/27992
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/27992
    expect:
      status: 200
      body:
        # A person reads 1889 and a query sorts on 1886.
        "data.date_display": "1884–86, border added 1888–89"
        "data.date_start": 1884
        "data.date_end": 1886

  - name: the same coordinate three times, and the third is rounded
    source: https://api.artic.edu/api/v1/artworks/27992
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/27992
    expect:
      status: 200
      body:
        "data.latitude": 41.8795894858483
        "data.longitude": -87.623031400144
        # The two above, joined, with a decimal place dropped from each.
        "data.latlon": 41.879589485848,-87.623031400144

  - name: the colour metric is zero on a painting made of coloured dots
    source: https://api.artic.edu/api/v1/artworks/27992
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/27992
    expect:
      status: 200
      body:
        "data.title": "A Sunday on La Grande Jatte — 1884"
        # Zero, where the Franz Marc scores 43.0038 -- so nothing distinguishes
        # "not computed" from "computed, and grey".
        "data.colorfulness": 0
        # And the boosted flag it does carry is the ranking one.
        "data.is_boosted": true
        "data.boost_rank": 14

  - name: the boolean is negated and the ranking fields are null on the other
    source: https://api.artic.edu/api/v1/artworks/9021
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/9021
    expect:
      status: 200
      body:
        # A number on the wire, not a string, where main_reference_number
        # beside it is a string that looks like one.
        "data.id": 9021
        "data.main_reference_number": "1931.522"
        # And a display date that does agree with its numbers, so the Seurat's
        # disagreement is that artwork's and not the field's.
        "data.date_display": "1913"
        "data.date_start": 1913
        "data.date_end": 1913
        # So the ordinary question is !data.has_not_been_viewed_much.
        "data.has_not_been_viewed_much": false
        "data.is_boosted": false
        "data.boost_rank": null
        "data.colorfulness": 43.0038

  - name: alt_classification_ids is the list without its first entry
    source: https://api.artic.edu/api/v1/artworks/27992
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/27992
    expect:
      status: 200
      body:
        "data.classification_ids[0]": TM-66
        "data.classification_ids[1]": TM-10387
        # The same list, starting one later. "alt" means "all but the primary",
        # which the field name does not say.
        "data.alt_classification_ids[0]": TM-10387
        "data.alt_classification_ids[4]": TM-54

  - name: a base64 GIF rides in every row of the listing
    source: https://api.artic.edu/api/v1/artworks?limit=2
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks?limit=2
    expect:
      status: 200
      body:
        # An entire image, inline, in a metadata response.
        "data[0].thumbnail.lqip": data:image/gif;base64,R0lGODlhAwAFAPMAAD1ta11eS15XVlVdWW1zYaVoYWBognd3gJaNiIuUmZiYmomfqrG4tbe7t7C5vgAAACH5BAAAAAAALAAAAAADAAUAAAQL0CSi2CgtICfAOhEAOw==
        # Beside the dimensions of the picture it is a thumbnail of, which are
        # six thousand pixels wide.
        "data[0].thumbnail.width": 6100
        "data[0].thumbnail.height": 8830

  - name: the count and the page size are nested under pagination
    source: https://api.artic.edu/api/v1/artworks?limit=2
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks?limit=2
    expect:
      status: 200
      body:
        # Two records here against 132,681 live: the emulator counts what it
        # holds, and the names are what this case pins.
        "pagination.total": 2
        "pagination.limit": 2

  - name: the licence of one field is stated in prose in a sibling key
    source: https://api.artic.edu/api/v1/artworks/9021
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/9021
    expect:
      status: 200
      body:
        # Ninety-seven fields CC0 and one CC-BY, and the only statement of
        # which is which is an English sentence naming it in backticks.
        "info.version": "1.15"
        "info.license_links[0]": https://creativecommons.org/publicdomain/zero/1.0/
        "info.license_links[1]": https://www.artic.edu/terms
      body_matches: 'The `description` field in this response is licensed under a Creative Commons Attribution 4\.0'

  - name: a display string carries a newline and three kinds of dash
    source: https://api.artic.edu/api/v1/artworks/9021
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/9021
    expect:
      status: 200
      body:
        # Two lines in one string.
        "data.artist_display": "Franz Marc\nGerman, 1880–1916"
        # And multiplication signs in the measurements, where the years use en
        # dashes and the other artwork's title uses an em dash.
        "data.dimensions": "Without frame: 130.2 × 90.8 cm (51 5/16 × 35 3/4 in.); 130.2 × 91.2 cm (51 1/4 × 35 7/8 in.)"

  - name: an artwork that does not exist
    source: https://api.artic.edu/api/v1/artworks/999999999
    verified: "2026-08-29"
    fixture: collection
    request:
      method: GET
      path: /api/v1/artworks/999999999
    expect:
      status: 404
      body:
        status: 404
        error: Not found
        detail: The item you requested cannot be found.

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://api.artic.edu/api/v1/artworks?limit=2"
    fixture: collection
    request:
      method: GET
      path: "/api/v1/artworks"
      query:
        "limit": "1"
    expect:
      status: 200
      body:
        "data[0].id": 9021
      absent:
        - "data[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://api.artic.edu/api/v1/artworks?limit=2"
    fixture: collection
    request:
      method: GET
      path: "/api/v1/artworks"
      query:
        "limit": "1"
        "page": "2"
    expect:
      status: 200
      body:
        "data[0].id": 27992
      absent:
        - "data[1]"

