# api.video Recipe for Cauldron
#
# api.video answers the group's question in a shape neither Mux nor Livepeer
# nor Bunny does: there is no single status field on a video at all. Reading
# GET /videos/{videoId} -- the record this Recipe otherwise describes --
# answers title, tags, assets, timestamps, and nothing that says whether the
# video plays. That question is answered by a second, dedicated endpoint,
# GET /videos/{videoId}/status, and its own worked example
# (docs.api.video, and the same JSON in the published OpenAPI description
# fingerprinted below) splits the answer into two independently-vocabularied
# sub-objects rather than one field:
#
#   ingest.status:            missing | uploading | uploaded
#   encoding.qualities[].status: waiting | encoding | encoded | failed
#   encoding.playable:        true | false
#
# Neither vocabulary contains the word "ready." The concept a caller actually
# wants -- can I play this -- lives only in encoding.playable, a boolean with
# no status word attached to it at all, and it is a THIRD, separate signal
# from either enum. So the question this group's Recipes keep asking --
# "one status, or two vocabularies that disagree" -- has a third answer here:
# not one status and not two disagreeing ones, but no single status at all,
# assembled by a caller from a boolean and two enums that were never meant to
# be read as one thing.
#
# **Per quality, the terminal success word and the terminal failure word DO
# share a field.** quality.status's own schema enum is waiting, encoding,
# encoded, failed -- four values on one property, encoded and failed both
# reachable from it, so a caller polling one quality's own status genuinely
# can tell "still encoding" from "encoding failed." What that caller cannot
# do is find out why: the Quality schema (components.schemas.quality) has
# exactly three properties -- type, quality, status -- and none of them is a
# reason, a message or a code. And ingest.status's own three values have no
# failure word in them at all: missing, uploading, uploaded, with nothing
# for "the upload was attempted and it did not work." A corrupt or aborted
# upload has no ingest-level status to report itself with.
#
# **A failed encode does not even get its own webhook.** The published
# webhook event catalogue names exactly one lifecycle event for encoding,
# video.encoding.quality.completed -- "when each version is encoded, your
# webhook will get a notification" -- and no video.encoding.quality.failed
# or equivalent exists anywhere in the same document. So the one signal this
# provider actually pushes announces success only; a caller has to poll
# GET .../status to ever learn that a quality reached failed at all, and
# once there, the field that told them has no reason attached to it either.
# Between Cloudflare Stream's errorReasonCode/errorReasonText (this group's
# other Recipe against this document) and this, api.video is the one that
# says a failure happened and nothing about why.
#
# **The two-step credential exchange's own documented example is stale, and
# the live API disagrees with its own published OpenAPI description about
# what a bad key answers.** POST /auth/api-key exchanges an account's
# permanent API key for a short-lived bearer token, and the description
# embedded in that operation's own 400 example (checked against
# oas_apivideo.yaml, fingerprinted below) reads:
#
#   {"type":"https://docs.api.video/docs/authenticationinvalid_credentials",
#    "title":"The user credentials were incorrect.","name":"","status":400}
#
# Struck live today, with no account and no key, the identical call answers:
#
#   401 {"type":"https://docs.api.video/reference/authentication-invalid-api-key",
#        "title":"The API key is invalid.","status":401}
#
# Different status, different type URL, different sentence, and the doc's
# own name:"" field is not there at all. This is Step 2's fifth priority in
# its sharpest form: not a gap in the documentation, a description actively
# contradicted by the live host on the one operation the description bothers
# to give a worked failure example for. This Recipe serves the live answer
# and states the stale one here rather than modelling either as a guess.
#
# **What the exchange DOES get right: the token's lifetime is stated, and
# stated twice.** access-token.access_token's own description: "The token
# lasts for one hour." access-token.expires_in's own description: "Lists the
# time in seconds when your access token expires. It lasts for one hour."
# And the worked example's own JWT is internally consistent with that: its
# body carries iat 1525276147 and exp 1525279747, exactly 3600 seconds
# apart, the same number the example's own expires_in field carries beside
# it. Three independent places agreeing, which is not something this
# collection sees often.
#
# **Absent and malformed collapse to the identical wrong-token sentence, not
# to the identical absent sentence -- the opposite of Together's split in
# this collection.** Struck live against ws.api.video/videos:
#
#   no Authorization header at all
#     -> 401 {"type":".../authentication-missing-authorization-header",
#             "title":"The \"Authorization\" header is missing.","status":401}
#   Authorization: Bearer junktoken12345
#     -> 401 {"type":".../authentication-invalid-access-token",
#             "title":"The access token is invalid or expired.","status":401}
#   Authorization: junktoken12345 (no "Bearer " prefix at all)
#     -> byte-identical to the wrong-bearer-token answer above
#
# Together (elsewhere in this collection) draws its absent/malformed line at
# the prefix and calls everything past it missing. api.video draws the same
# line the opposite way: anything present in the header, prefixed or not, is
# treated as an access token somebody sent and judged on those terms.
# auth.malformed_error names the same entry auth.rejected_error does, for
# that reason, and it is a claim rather than an omission.
#
# **The same 401 status renders in two different media types depending on
# whether the path exists, and this Recipe can serve only one of them.**
# Struck live: a genuinely unrouted path and a wrong method on a real path
# both still answer 401 -- the credential is checked before routing here,
# for every path, the way FireHydrant's and Airbyte's do elsewhere in this
# collection -- but the body is a generic Symfony-style HTML "An Error
# Occurred: Unauthorized" page, with no type field and no JSON at all,
# where a real, known route answers the structured problem+json shown
# above. Status alone cannot tell a caller its own typo from a real
# authentication failure; only the Content-Type can. Cauldron's own
# credential check answers one declared error body for one verdict,
# whatever route it was reached through, so this Recipe's own conformance
# cases can prove the status and cannot reproduce the second body shape --
# stated here, live, dated, rather than forced.
#
# **Which host this Recipe models, and why.** ws.api.video is the production
# base path (x-client-base-paths.production in the description itself) and
# the host every doc example is written against. sandbox.api.video exists
# beside it -- x-client-base-paths.sandbox -- and was probed for parity
# rather than assumed: its /videos with no credential and its /auth/api-key
# with a junk key both answered byte-identical to production, struck live
# today. This Recipe routes to ws.api.video's shape and states that the
# sandbox host answers the same failures rather than declaring it as a
# second host this format has no way to address at once (the same
# limitation mezmo/recipe.yaml and clockify/recipe.yaml both state for
# their own second hosts).
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of the Video schema's own fourteen top-level properties (components.
#     schemas.video, counted directly rather than estimated) this Recipe
#     declares twelve: title, description, playerId, public, panoramic,
#     mp4Support, tags, metadata, publishedAt, updatedAt, source, assets.
#     createdAt -- a third timestamp beside publishedAt and updatedAt, "When
#     a video was created" -- is real and absent. Chapters and captions are
#     not fields on this object at all; they are their own sub-resource
#     endpoints (GET /videos/{id}/captions and /chapters) and are not
#     modelled as routes.
#   - create, update and delete are not modelled on Video. Every credential
#     and status finding above needed only a GET, and this group's rule
#     against uploading or modifying anything already forbids exercising the
#     ones that write.
#   - The status object's populated example (ingest and five qualities) is
#     the one worked example the description publishes for GET .../status,
#     cited whole; a "failed" quality entry is this Recipe's own
#     substitution of that field's own schema-declared enum value into an
#     otherwise-cited record, stated here rather than presented as a second
#     worked example that does not exist.
#   - costRate-shaped free-form fields, custom player theming, and the
#     Live -> recorded-Video linkage (liveStreamId) are declared as real
#     and not modelled with values, for the same reason the status example
#     above is partial: no worked JSON shows them.
#
# Credentials below are fixtures, not secrets.

recipe: apivideo
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.api.video/reference
  spec: https://raw.githubusercontent.com/apivideo/api.video-api-specification/master/oas_apivideo.yaml
  spec_hash: eaea6fe1b5c14d4b59388c15ef37e60fb354a40538e19aa936edd3bd5b19afde
  spec_seen: "2026-09-03"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron0000000000000000000000000000000000
  absent_error: missing_authorization_header
  # A header present without the "Bearer " prefix is judged as an access
  # token and found wanting, not treated as though nothing were sent -- the
  # opposite of Together's split elsewhere in this collection. Naming the
  # same entry for both is the claim, not an omission. See the header.
  malformed_error: invalid_access_token
  rejected_error: invalid_access_token

responses:
  resource:
    style: bare
  list:
    style: wrapped
  # RFC 9110 problem details, flat at the top level: type, title, status and
  # (on some failures) detail/name. No code anywhere -- a client switching on
  # a numeric code has nothing to switch on, only the type URL.
  error:
    style: flat
    message_field: title
    code_field: "-"
    type_field: type
    status_field: status

resources:
  video:
    collection: data
    id:
      # "vi4blUQJFrYWbaG44NChkH27" -- every worked example in the published
      # description uses this exact prefix.
      style: prefixed
      prefix: vi
      field: videoId
    fields:
      title:
        type: string
      description:
        type: string
      playerId:
        type: string
      public:
        type: boolean
        default: false
      panoramic:
        type: boolean
        default: false
      mp4Support:
        type: boolean
        default: true
      tags:
        type: list
      metadata:
        type: list
      publishedAt:
        type: datetime
      updatedAt:
        type: datetime
      source_uri:
        type: string
        in: source
        as: uri
      assets_iframe:
        type: string
        in: assets
        as: iframe
      assets_player:
        type: string
        in: assets
        as: player
      assets_hls:
        type: string
        in: assets
        as: hls
      assets_thumbnail:
        type: string
        in: assets
        as: thumbnail
      assets_mp4:
        type: string
        in: assets
        as: mp4

  # GET /videos/{videoId}/status. Deliberately not the same resource as
  # video above -- see the header: nothing about a video's own record says
  # whether it plays, and this is the second, separately-vocabularied
  # endpoint a caller has to reach to find out.
  video_status:
    id:
      style: prefixed
      prefix: vi
      field: videoId
    fields:
      # missing, uploading, uploaded -- no failure value anywhere in this
      # enum. See the header.
      ingest_status:
        type: string
        default: uploading
        in: ingest
        as: status
      ingest_filesize:
        type: integer
        null_when_unset: true
        in: ingest
        as: filesize
      encoding_playable:
        type: boolean
        default: false
        in: encoding
        as: playable
      # An array of {type, quality, status} per output. status's own enum --
      # waiting, encoding, encoded, failed -- carries no reason field beside
      # it. See the header.
      encoding_qualities:
        type: list
        in: encoding
        as: qualities
      encoding_metadata_width:
        type: integer
        null_when_unset: true
        in: encoding.metadata
        as: width
      encoding_metadata_height:
        type: integer
        null_when_unset: true
        in: encoding.metadata
        as: height
      encoding_metadata_bitrate:
        type: number
        null_when_unset: true
        in: encoding.metadata
        as: bitrate
      encoding_metadata_duration:
        type: integer
        null_when_unset: true
        in: encoding.metadata
        as: duration

  # POST /auth/api-key. Not a video resource at all -- the credential
  # exchange this Recipe's header is about. There is exactly one of these
  # per call and nothing to list or fetch by id afterwards, so it is
  # modelled with the plainest shape this format has: a bare create with no
  # collection wrapper, keyed on the token it mints.
  token:
    id:
      # The provider mints no id-shaped field on this response at all --
      # access_token is the value that matters, and it is declared as an
      # ordinary field below, with the cited JWT as its default, rather than
      # as this resource's identifier, because a create route mints a fresh
      # id and would not use the cited value for one.
      style: opaque
      field: "-"
    fields:
      # Both token defaults are substituted. The vendor's worked example
      # publishes a real-shaped RS256 JWT and an encrypted refresh token,
      # and a fixture carrying either is indistinguishable from a live
      # credential to any scanner that looks. The Recipe's finding is that
      # this endpoint hands back a JWT with a stated hour of life, and a
      # case asserts the eyJ prefix because that claim is real. So the
      # substitute is still a JWT -- header {"alg":"none"}, nothing signed,
      # no base64 run long enough to match a scanner.
      access_token:
        type: string
        default: eyJhbGciOiJub25lIn0.cauldron-fixture-payload.not-a-signature
      token_type:
        type: string
        default: Bearer
      refresh_token:
        type: string
        default: cauldron-fixture-refresh-token
      # Seconds. "It lasts for one hour," stated twice in the published
      # description and consistent with the worked example's own JWT
      # claims -- see the header.
      expires_in:
        type: integer
        default: 3600

routes:
  - method: GET
    path: /videos
    resource: video
    operation: list
    pagination:
      # currentPage and pageSize, per the description's own current-page and
      # page-size parameter components: currentPage defaults to 1 and counts
      # from one, pageSize defaults to 25 with a documented maximum of 100.
      style: page
      limit: 25
      max_limit: 100
      limit_param: pageSize
      cursor_param: currentPage
      first_page: 1

  - method: GET
    path: /videos/{id}
    resource: video
    operation: get

  - method: GET
    path: /videos/{id}/status
    resource: video_status
    operation: get

  # public: true -- this is the route that mints the credential every other
  # route on this Recipe needs, so it cannot itself require one. Struck live
  # with no key at all and found unauthenticated (its own failures are about
  # the apiKey it was sent, not about a header), which is what public
  # declares rather than assumes.
  - method: POST
    path: /auth/api-key
    resource: token
    operation: create
    public: true

errors:
  missing_authorization_header:
    status: 401
    type: https://docs.api.video/reference/authentication-missing-authorization-header
    message: The "Authorization" header is missing.
    headers:
      Content-Type: application/problem+json

  invalid_access_token:
    status: 401
    type: https://docs.api.video/reference/authentication-invalid-access-token
    message: The access token is invalid or expired.
    headers:
      Content-Type: application/problem+json

  # Live, today -- see the header for how this diverges from the same
  # operation's own published OpenAPI example.
  invalid_api_key:
    status: 401
    type: https://docs.api.video/reference/authentication-invalid-api-key
    message: The API key is invalid.
    headers:
      Content-Type: application/problem+json

  # Live, today: {"type":"https://docs.api.video/reference/invalid-attribute",
  # "title":"An attribute is invalid.","status":400,"detail":"This field is
  # missing.","name":"apiKey"} -- both detail and name beside the title,
  # which is why this is the one case on this Recipe carrying either.
  api_key_required:
    status: 400
    type: https://docs.api.video/reference/invalid-attribute
    message: An attribute is invalid.
    headers:
      Content-Type: application/problem+json
    fields:
      detail: This field is missing.
      name: apiKey

fixtures:
  empty: {}

  catalogue:
    video:
      # docs.api.video's own worked example for both "Retrieve a video
      # object" and the first entry of "List all video objects" -- the
      # identical record, cited from both operations' published examples.
      - videoId: vi4blUQJFrYWbaG44NChkH27
        playerId: pl45KFKdlddgk654dspkze
        title: Maths video
        description: An amazing video explaining string theory
        public: false
        panoramic: false
        mp4Support: true
        tags:
          - maths
          - string theory
          - video
        metadata:
          - key: Author
            value: John Doe
          - key: Format
            value: Tutorial
        publishedAt: "2019-12-16T08:25:51.000Z"
        updatedAt: "2019-12-16T08:48:49.000Z"
        source_uri: /videos/vi4blUQJFrYWbaG44NChkH27/source
        assets_iframe: '<iframe src="https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>'
        assets_player: https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27
        assets_hls: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/hls/manifest.m3u8
        assets_thumbnail: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/thumbnail.jpg
        assets_mp4: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/mp4/source.mp4

    video_status:
      # GET .../status's own single published worked example, cited whole --
      # see the header. One quality still encoding, one still waiting,
      # three already encoded, and encoding.playable already true: a caller
      # can watch this video before every quality is done, which is the
      # entire reason playable exists as its own field rather than being
      # derived from the qualities array.
      - videoId: vi4blUQJFrYWbaG44NChkH27
        ingest_status: uploaded
        ingest_filesize: 273579401
        encoding_playable: true
        encoding_qualities:
          - quality: 360p
            status: encoded
          - quality: 480p
            status: encoded
          - quality: 720p
            status: encoded
          - quality: 1080p
            status: encoding
          - quality: 2160p
            status: waiting
        encoding_metadata_width: 424
        encoding_metadata_height: 240
        encoding_metadata_bitrate: 411.218
        encoding_metadata_duration: 4176

      # Not a second worked example -- this Recipe's own substitution of the
      # quality.status schema's fourth enum value into the cited shape
      # above. See the header's fidelity gap for why this is stated rather
      # than presented as observed.
      - videoId: vi4failedqualityexample0
        ingest_status: uploaded
        encoding_playable: false
        encoding_qualities:
          - quality: 360p
            status: failed

conformance:
  - name: no Authorization header at all names the missing header specifically
    source: https://ws.api.video/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /videos
    expect:
      status: 401
      headers:
        Content-Type: application/problem+json
      body:
        type: https://docs.api.video/reference/authentication-missing-authorization-header
        title: 'The "Authorization" header is missing.'
        status: 401

  - name: a wrong bearer token is judged as a token, not as nothing sent
    source: https://ws.api.video/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /videos
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        type: https://docs.api.video/reference/authentication-invalid-access-token
        title: The access token is invalid or expired.

  - name: a header with no Bearer prefix gets the identical wrong-token sentence, not the missing one
    # The opposite of Together's split elsewhere in this collection -- see
    # the header.
    source: https://ws.api.video/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /videos
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        type: https://docs.api.video/reference/authentication-invalid-access-token
        title: The access token is invalid or expired.

  - name: the id-addressed route and the status route are gated the same way
    source: https://ws.api.video/videos/vi4blUQJFrYWbaG44NChkH27/status
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /videos/vi4blUQJFrYWbaG44NChkH27/status
    expect:
      status: 401
      body:
        type: https://docs.api.video/reference/authentication-missing-authorization-header

  - name: the sandbox host answers the identical failure to the production one
    # Struck live against sandbox.api.video directly, not ws.api.video --
    # see the header for why this Recipe still routes to production's shape.
    source: https://sandbox.api.video/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /videos
    expect:
      status: 401
      body:
        type: https://docs.api.video/reference/authentication-missing-authorization-header

  - name: a bad API key is refused live, and differently from what the description's own example shows
    # See the header: the published OpenAPI example for this exact 400
    # response names a different status, a different type and a different
    # sentence. This case serves what the host actually answered today.
    source: https://ws.api.video/auth/api-key
    verified: "2026-09-03"
    fixture: empty
    arm: invalid_api_key
    request:
      method: POST
      path: /auth/api-key
      json:
        apiKey: junktoken12345
    expect:
      status: 401
      body:
        type: https://docs.api.video/reference/authentication-invalid-api-key
        title: The API key is invalid.

  - name: a missing apiKey field names the attribute by name
    source: https://ws.api.video/auth/api-key
    verified: "2026-09-03"
    fixture: empty
    arm: api_key_required
    request:
      method: POST
      path: /auth/api-key
      json: {}
    expect:
      status: 400
      body:
        type: https://docs.api.video/reference/invalid-attribute
        title: An attribute is invalid.
        detail: This field is missing.
        name: apiKey

  - name: the token exchange states its own lifetime, twice over, and the JWT agrees with it
    # Doc-sourced: the published 200 example for POST /auth/api-key, cited
    # whole. No key was ever exchanged for real.
    source: https://raw.githubusercontent.com/apivideo/api.video-api-specification/master/oas_apivideo.yaml
    fixture: catalogue
    request:
      method: POST
      path: /auth/api-key
      json:
        apiKey: cauldron-apivideo-fixture-key-000000000000
    expect:
      status: 200
      body:
        token_type: Bearer
        expires_in: 3600
      matches:
        access_token: '^eyJ'

  - name: readiness lives in a boolean, not in either status word
    # Doc-sourced: GET .../status's own single published worked example.
    # encoding.playable is true while one quality is still encoding and
    # another is still waiting -- see the header for why that is the point.
    source: https://docs.api.video/reference
    fixture: catalogue
    request:
      method: GET
      path: /videos/vi4blUQJFrYWbaG44NChkH27/status
      headers:
        Authorization: Bearer cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        ingest.status: uploaded
        encoding.playable: true
        "encoding.qualities[3].quality": 1080p
        "encoding.qualities[3].status": encoding
        "encoding.qualities[4].quality": 2160p
        "encoding.qualities[4].status": waiting
        "encoding.qualities[0].status": encoded

  - name: a failed quality carries the word and nothing that explains it
    # See the header and the fixture comment: the enum value is the
    # schema's own fourth member of quality.status, substituted into the
    # cited shape rather than drawn from a second worked example.
    source: https://raw.githubusercontent.com/apivideo/api.video-api-specification/master/oas_apivideo.yaml
    fixture: catalogue
    request:
      method: GET
      path: /videos/vi4failedqualityexample0/status
      headers:
        Authorization: Bearer cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        encoding.playable: false
        "encoding.qualities[0].status": failed
      absent:
        - "encoding.qualities[0].reason"
        - "encoding.qualities[0].message"
        - "encoding.qualities[0].errorReason"

  - name: a video's own record says nothing about whether it plays
    source: https://docs.api.video/reference
    fixture: catalogue
    request:
      method: GET
      path: /videos/vi4blUQJFrYWbaG44NChkH27
      headers:
        Authorization: Bearer cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        title: Maths video
        assets.hls: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/hls/manifest.m3u8
      absent:
        - status
        - readyToStream
        - playable
