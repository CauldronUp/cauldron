# Formstack Documents Recipe for Cauldron
#
# Read the name of this directory carefully before reading anything else in
# it. "Formstack" the company sells two unrelated products under one brand:
# Formstack Forms (build a form, collect submissions -- the API at
# developers.formstack.com, versioned "API V2025", token prefix fs_pat_) and
# Formstack Documents, formerly WebMerge before Formstack acquired it and
# kept its engine running under its own name and its own host. This Recipe
# models the second one. www.formstack.com/products/documents says so in its
# own words -- "Formstack Documents is a no-code document generation tool
# that automates the entire document lifecycle, turning your raw data into
# professional, dynamic documents" -- and its own "Documents API" link goes
# to developers.formstack.com's Forms description, and separately to
# www.webmerge.me/developers, which is a wholly different host, a wholly
# different auth scheme, and the actual subject of this file. Conflating the
# two would be the obvious mistake this task warned about: Formstack Forms
# has nothing resembling a merge endpoint, and nothing below was checked
# against it. Every live probe in this file was struck against
# www.webmerge.me, unauthenticated, no account, on the date below.
#
# This is the plainest answer of the three providers this task exists to
# compare. Formstack Documents' merge call is genuinely synchronous and
# genuinely tiny: POST https://www.webmerge.me/merge/<ID>/<KEY> with the
# merge data as the body answers, by default, the complete JSON object
# {"success":1} -- no id, no url, no job, nothing to poll and nothing to
# store, quoted verbatim from www.webmerge.me/developers/documents. The
# generated document itself is not in that response at all; what happens to
# it is configured per document ahead of time (an email delivery, a Dropbox
# drop, a webhook -- "Deliveries" in Formstack's own vocabulary) rather than
# handed back on the wire. The one way to get bytes back on the same call is
# a documented query parameter, download=1, which the same page says
# "Returns merged document in response" -- binary content, not a URL to it,
# and not something this Recipe can reproduce honestly: the page's own
# example body is the placeholder text "%PDF-1.7...(the contents of the
# document - save to file)", an English description standing in for bytes
# rather than a worked example of them, the same gap Anvil's Recipe in this
# collection names for its own Fill PDF endpoint. So of the three providers
# in this group, PandaDoc hands back a resource with a status field to poll,
# PDFMonkey hands back a resource with a status field AND, once success,
# a temporary signed URL, and Formstack Documents hands back neither --
# a bare boolean, with the real output routed around the response entirely
# unless a caller explicitly asks to have it inlined, which this Recipe
# states rather than fakes.
#
# The merge endpoint needs no Authorization header at all -- confirmed live,
# POST and (see below) GET both, with nothing sent. The <ID> and <KEY> in
# the path are themselves the whole credential, a capability URL rather than
# a bearer token, and a combination this Recipe does not hold answers 404
# with {"error":"Sorry, but a document was not selected!"} -- struck live
# against a value this task invented purely to be wrong (000000 /
# badkeybadkeybadk, chosen to look nothing like a real Formstack document
# id), never against the worked 436346/firm3 example the developers page
# itself publishes, because that pair may still belong to somebody's real
# account and calling it would mean generating a document this task
# forbids. The {"success":1} case below therefore carries a source and no
# verified date; the not-found case carries both. One more thing this probe
# found unasked: the docs show only POST for the merge endpoint, but GET
# reached the identical handler and the identical error live, checked
# directly rather than assumed from the POST case.
#
# The management surface -- list/get/create/update/delete under
# /api/documents, a completely different part of this host -- does need a
# credential, and needs it as genuine HTTP Basic auth, Key as the username,
# Secret as the password, per www.webmerge.me/developers/authentication's
# own words: "You will need to pass the Key and Secret... in the following
# format in the HTTP-Authentication header of the request: Key:Secret".
# What this task's probing found here is a clean three-way split that maps
# onto Cauldron's own absent/malformed/rejected verdicts more exactly than
# most:
#
#   - No Authorization header at all: 401, an EMPTY body (zero bytes, not an
#     empty JSON object), Content-Type text/html despite there being no HTML
#     in it, and a WWW-Authenticate: Basic realm="Enter Formstack Documents
#     API Credentials" challenge header.
#   - Every malformed shape this task tried -- Authorization: Bearer
#     junktoken12345 (the wrong scheme entirely), Authorization: Basic
#     ***not-base64*** (does not decode), Authorization: Basic
#     anVzdGFidW5jaG9mY2hhcnNub2NvbG9u (decodes cleanly to a string with no
#     colon in it, so there is no username/password split to make) -- came
#     back byte-identical to the absent case: same empty body, same
#     Content-Type, same challenge header. Formstack Documents does not
#     merely fail to word these two differently; the response is
#     indistinguishable down to the header set, which is itself a finding
#     worth declaring rather than assuming.
#   - A credential that is well-formed and simply wrong -- Basic
#     junkuser:junkpass, a real username:password pair a browser could have
#     sent -- is the one case that answers differently: 401 again, but now
#     Content-Type: application/json and a body of
#     {"error":"A valid API Key\/Secret was not supplied"}, with no
#     WWW-Authenticate header at all.
#
# So absent and malformed genuinely share one answer here and rejected gets
# the provider's own distinct sentence, the same shape Make's Recipe in this
# collection declares (and for the same reason: naming the same error for
# two verdicts is the honest claim once the wire has actually been checked
# both ways, not a shortcut around checking).
#
# Routing beats the credential for a path this host does not have at all,
# and loses to it for a method this host does not support on a path it
# does. A path this API never registered (/api/this-is-not-a-real-endpoint)
# answers Formstack's own branded 404 page -- Content-Type text/html,
# "Page Not Found - Documents | Formstack" in the title, a real HTML body --
# regardless of credential, checked both with none and with a wrong one.
# A real path with an unsupported method (PATCH /api/documents) does not
# 404 and does not 405; it reaches the identical credential gate a GET or a
# POST on the same path reaches, checked with no credential (the empty-body
# challenge) and with a wrong one (the JSON sentence), both live. That is
# the exact split PandaDoc's Recipe in this collection describes for its
# own host and the exact reason this Recipe reaches for the same device:
# Cauldron's own credential check is one verdict per request, checked
# either wholly before routing or wholly after it, and this host is
# neither -- a path is matched before the credential is examined, and a
# method is not. `auth.after_routing` cannot express that split (it would
# make PATCH 405 with nothing sent, which is not what the wire does), so
# this Recipe declares `scheme: none` and gates the credentialed surface a
# route at a time instead, the same trade PandaDoc's and Anvil's Recipes
# in this collection make and for the identical reason.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API Key/Secret was ever requested,
#     guessed or used. The {"success":1} merge response, the full endpoint
#     list under /api/documents (list, get, get fields, get uploaded file,
#     get deliveries, create, update, copy, delete), and the Basic-auth
#     description are all read from www.webmerge.me/developers and its
#     /documents and /authentication pages, and carry no `verified:` date.
#     Every 401 and 404 below was struck live, unauthenticated or with a
#     credential this task invented to be wrong, and carries one.
#   - The management surface (/api/documents and its siblings) is not
#     modelled beyond its credential gate. Formstack's own developer pages
#     name every endpoint under it without ever once showing a worked JSON
#     response body -- not a single example record, not a field list beyond
#     the URL path itself. Inventing a document's shape (an id? a name? a
#     created date? in what format?) to hang a 200 on would be exactly the
#     fabrication this task forbids, so the gate is modelled and the
#     resource behind it is not, the same choice Anvil's Recipe in this
#     collection makes about the fields a real Fill PDF or createEtchPacket
#     call would need that no worked example shows.
#   - download=1 (bytes inlined in the merge response) and test=1 (a
#     documented "test mode" flag on the same endpoint) are real and not
#     modelled -- see the header above for why the former specifically is
#     not a shortage of effort but an absence of anything honest to serve.
#   - Data Routes -- "used to merge multiple documents using one merge
#     request, based on pre-defined conditions", Formstack's own second
#     first-class resource alongside Documents -- are real and not
#     modelled at all; this task's questions are about a single document.
#   - No spec is recorded. Nothing under www.webmerge.me or
#     developers.formstack.com answered a machine-readable description at
#     any path this task tried (openapi.json, swagger.json, openapi.yaml
#     all 404 or redirect to an unrelated login flow), and Formstack
#     Documents' own reference lives entirely in prose pages, not a
#     generated one.
#   - Rate limiting is not documented anywhere this task found for this
#     specific host and was never triggered live.
#
# The credentials below are fixtures and belong to no account.

recipe: formstack
capability: docs
version: 0.1.0

upstream:
  api: documents
  docs: https://www.webmerge.me/developers
  provider: Formstack Documents (WebMerge)

auth:
  # Genuinely HTTP Basic, Key as username and Secret as password, but
  # expressed as scheme none plus per-route matches_header below -- see the
  # header for why neither auth.after_routing setting reproduces this host's
  # actual split (a path is matched before the credential is examined, and a
  # method on a real path is not).
  scheme: none

responses:
  error:
    style: flat
    message_field: error

routes:
  # The merge endpoint. No Authorization header of any kind, confirmed live
  # -- the <ID>/<KEY> pair in the path is the whole credential. Only the
  # documented example is modelled as a success; see the header for why the
  # worked 436346/firm3 pair is cited from the docs rather than called.
  - method: POST
    path: /merge/436346/firm3
    raw:
      content_type: application/json
      text: '{"success":1}'

  # A combination this Recipe was never going to accept, because this task
  # invented it purely to be wrong. Struck live both ways -- see the header's
  # note that GET reaches the identical handler the docs only show POST for.
  - method: POST
    path: /merge/000000/badkeybadkeybadk
    error: document_not_selected

  - method: GET
    path: /merge/000000/badkeybadkeybadk
    error: document_not_selected

  # The management surface. Every route below fires unconditionally, because
  # this Recipe models the gate and not a resource behind it -- see the
  # header. The specific "wrong, well-formed" sentence is reached only by
  # arming it: a bare error route cannot tell a credential that failed to
  # match from one that was never sent, which is exactly the ordering fact
  # this file exists to record rather than paper over.
  - method: GET
    path: /api/documents
    error: no_credential

  - method: POST
    path: /api/documents
    error: no_credential

  # An unsupported method on a real path -- reaches the identical gate a GET
  # does, not a 405. See the header's routing finding.
  - method: PATCH
    path: /api/documents
    error: no_credential

  # A path this host never registered at all, under either prefix this
  # Recipe models. Formstack's own branded page, not a JSON shape -- routing
  # refuses it before anything asks who is calling, checked both with no
  # credential and with a wrong one live.
  - method: GET
    path: /api/this-is-not-a-real-endpoint
    error: not_found_page

errors:
  # Absent and malformed share this verbatim, down to the header set -- see
  # the header. Zero bytes, not an empty JSON object: message is empty and
  # style text writes nothing.
  no_credential:
    status: 401
    style: text
    headers:
      Content-Type: text/html; charset=UTF-8
      WWW-Authenticate: 'Basic realm="Enter Formstack Documents API Credentials"'
    message: ""

  # A well-formed Basic credential this fixture does not hold. Reached only
  # by arming it -- see the routes above.
  wrong_credential:
    status: 401
    message: A valid API Key/Secret was not supplied

  # Formstack's own template, quoted for its stable parts. The page also
  # loads includes/style.css and a redirect script this Recipe does not
  # reproduce, because neither is a claim about the API -- both are static
  # assets a browser would fetch, not data an integration reads.
  not_found_page:
    status: 404
    style: text
    headers:
      Content-Type: text/html; charset=utf-8
    message: |-
      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
      <title>Page Not Found - Documents | Formstack</title>
      </head>
      <body>
          <div id="wrapper" class="margin-top poppins-font">
              <div class="large-content">Oh no, this page does not exist!</div>
              <div class="small-content">Please double-check the link or visit our <a href="https://help.formstack.com/s/" target="_blank">Help Center</a>.</div>
          </div>
      </body>
      </html>

  # The not-found merge combination. Struck live against a pair this task
  # invented to be wrong -- see the header.
  document_not_selected:
    status: 404
    message: Sorry, but a document was not selected!

fixtures:
  empty: {}

conformance:
  - name: a merge with the documented id and key returns nothing but a boolean, never the document itself
    # Cited from the docs rather than called: this pair is the developers
    # page's own worked example and may belong to a real account. See the
    # header for why this Recipe will not generate a document to confirm it.
    source: https://www.webmerge.me/developers/documents
    fixture: empty
    request:
      method: POST
      path: /merge/436346/firm3
      json:
        FirstName: John
        LastName: Smith
    expect:
      status: 200
      headers:
        content-type: application/json
      body:
        success: 1

  - name: a document id and key this Recipe was never going to accept is a 404 naming the document, not the caller
    source: https://www.webmerge.me/merge/000000/badkeybadkeybadk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /merge/000000/badkeybadkeybadk
    expect:
      status: 404
      body:
        error: Sorry, but a document was not selected!

  - name: and GET reaches the identical handler the docs only ever show POST for
    source: https://www.webmerge.me/merge/000000/badkeybadkeybadk
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /merge/000000/badkeybadkeybadk
    expect:
      status: 404
      body:
        error: Sorry, but a document was not selected!

  - name: no Authorization header at all on the management surface is a challenge with an empty body, not a JSON error
    source: https://www.webmerge.me/api/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/documents
    expect:
      status: 401
      headers:
        content-type: text/html; charset=UTF-8
        www-authenticate: 'Basic realm="Enter Formstack Documents API Credentials"'

  - name: a header present but not a parseable Basic credential answers byte-identically to no header at all
    # Bearer-scheme, checked live. Two more shapes -- invalid base64, and
    # valid base64 with no colon in it -- answered the identical challenge
    # and are not each given their own case; see the header.
    source: https://www.webmerge.me/api/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/documents
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      headers:
        content-type: text/html; charset=UTF-8
        www-authenticate: 'Basic realm="Enter Formstack Documents API Credentials"'

  - name: a well-formed Basic credential this fixture does not hold is the one case Formstack words differently, armed because Cauldron cannot tell wrong from missing on its own
    source: https://www.webmerge.me/api/documents
    verified: "2026-09-01"
    arm: wrong_credential
    fixture: empty
    request:
      method: GET
      path: /api/documents
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 401
      headers:
        content-type: application/json
      body:
        error: A valid API Key/Secret was not supplied
      absent:
        - www-authenticate

  - name: an unsupported method on a real path reaches the identical gate a GET does, not a 405
    source: https://www.webmerge.me/api/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/documents
    expect:
      status: 401
      headers:
        www-authenticate: 'Basic realm="Enter Formstack Documents API Credentials"'

  - name: and a wrong credential reaches the identical second sentence on that same unsupported method
    source: https://www.webmerge.me/api/documents
    verified: "2026-09-01"
    arm: wrong_credential
    fixture: empty
    request:
      method: PATCH
      path: /api/documents
      headers:
        Authorization: Basic anVua3VzZXI6anVua3Bhc3M=
    expect:
      status: 401
      body:
        error: A valid API Key/Secret was not supplied

  - name: a path this host never registered is Formstack's own branded page, not a JSON shape, regardless of credential
    source: https://www.webmerge.me/api/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: text/html; charset=utf-8
      body_matches: "Page Not Found - Documents \\| Formstack"
