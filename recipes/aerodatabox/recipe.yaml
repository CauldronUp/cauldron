# AeroDataBox Recipe for Cauldron
#
# AeroDataBox is not one host with one credential. It is distributed
# through RapidAPI's marketplace, and every request carries two headers --
# X-RapidAPI-Key and X-RapidAPI-Host -- where only one of them is a secret.
# That pair, and how RapidAPI's own gateway resolves it, is what this Recipe
# exists to record, because nothing behind the gateway was ever reachable to
# describe. No account was created and no key was ever requested; every
# case below was struck against aerodatabox.p.rapidapi.com with a header
# either missing or invented, on 2026-09-03.
#
# **The gateway checks Host before it checks Key, and Key before it checks
# anything AeroDataBox itself might say.** Four requests, same path
# (/flights/airports/icao/KJFK, a real, documented endpoint), same day:
#
#   no headers at all                              -> 401 {"message":
#     "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more
#     info."}
#   X-RapidAPI-Host set, no Key                     -> 401, identical body
#   X-RapidAPI-Key set (junk), no Host               -> 403 {"message":
#     "You are not subscribed to this API."}
#   X-RapidAPI-Key set (junk), Host set correctly    -> 403, identical body
#   X-RapidAPI-Key set (junk), Host set to a
#     *different real* RapidAPI product's hostname   -> 403, identical body
#   X-RapidAPI-Key set (junk), Host set to a
#     hostname that names no product at all          -> 404 {"message":
#     "API doesn't exists"}
#   no Key, Host set to that same nonexistent name    -> 404, identical body
#
# Read as a decision tree rather than a list, because that is what it is.
# Host resolves first, and resolves against RapidAPI's own product
# directory rather than against AeroDataBox specifically -- a hostname
# naming *any* real product on the marketplace passes this step, whether or
# not it is this one, and only a hostname naming nothing at all fails it
# (404, before the key is ever looked at -- confirmed live with no key
# present). Once Host resolves to something real, Key is checked next: gone
# entirely and the answer is 401 "Invalid API key"; present -- any value,
# because no genuine key was ever held to test the alternative -- and the
# answer is 403 "You are not subscribed to this API." Path never enters
# into it: the identical body above answered a documented path, an invented
# one four segments deep, and every method this Recipe tried, with no
# credential presented -- because nothing here ever reaches AeroDataBox's
# own router. It is a fact about the marketplace, not about the provider:
# RapidAPI's edge is a wall between a caller and every one of its 40
# documented routes, and unlike FlightAware or Duffel elsewhere in this
# collection -- whose auth-vs-routing question is about one application's
# own ordering -- there is no provider-level routing question to ask here
# at all, because the provider's router is never reached without a
# subscription this Recipe never held.
#
# **This answers the question this group of three was given about a fourth
# verdict, and the answer is that it collapses rather than appears.** A
# credential that authenticates and is refused anyway -- the wrong plan, a
# key subscribed to something else -- is Cauldron's Unentitled verdict, and
# the brief for this Recipe asks directly what a right key against a wrong
# Host answers. No real key was ever held to test that combination the way
# the question means it. What *was* tested, live, is its structural
# cousin: a syntactically ordinary key against a Host naming a real but
# different product, and a syntactically ordinary key against the correct
# one. Both answered the byte-identical "You are not subscribed to this
# API." RapidAPI's own lookup, as far as this Recipe could observe it, is
# one check -- "is there an active subscription for (this key, this
# resolved product)" -- and a key that does not exist and a key that exists
# but is subscribed to something else both fail that one check the same
# way. If AeroDataBox's own backend distinguishes a wrong-plan refusal from
# a no-such-key refusal at all, that distinction lives entirely behind a
# wall this Recipe could not get past -- auth.unentitled names keys that
# authenticate and are refused anyway, and this Recipe holds no key that
# authenticates at this layer to name. That is a stronger, more specific
# finding than "not tested": it is that the layer this Recipe *can* observe
# does not appear to keep the two apart, whatever the layer behind it does.
#
# **Coverage has a name here, and it is not a field on a position.**
# AeroDataBox's own published OpenAPI description (doc.aerodatabox.com/
# docs/openapi-rapidapi-v1.json, fetched 2026-09-03, fingerprinted below)
# gives a flight's live position -- FlightLocationContract -- exactly one
# clock: `reportedAtUtc`, "Time (UTC) of when this positional data was
# reported", and it is deliberately not the same clock as the rest of the
# flight: FlightContract.lastUpdatedUtc is documented as covering "the
# latest update of flight information (**excluding Location**)" -- two
# clocks, one for the position and a different one for everything else
# about the flight, named apart on purpose. lat, lon, altitude
# (pressure-adjusted, QNH-corrected), groundSpeed and trueTrack sit beside
# reportedAtUtc, and none of them says who reported it -- no receiver id,
# no station, no feed name, the same gap Aviationstack's `live` object has
# elsewhere in this collection.
#
# What AeroDataBox has that neither OpenSky nor Aviationstack does is a
# second, separate surface whose entire purpose is answering the question a
# position cannot: GET /health/services/airports/{icao}/feeds, "FREE TIER"
# per its own badge, returns per-airport status for three *independent*
# feeds -- FlightSchedules ("static schedules data without actual
# updates"), FlightLiveUpdates ("actual flight status and time updates"),
# and AdsbUpdates ("Flight updates derived from ADS-B data... runway,
# actual/estimated time on the runway, call-sign, ModeS 24-bit ICAO code,
# aircraft registration"), each its own FeedServiceStatus (Down, Degraded,
# OKPartial, OK, Unknown, Unavailable). AdsbUpdates is the schema using the
# words "derived from ADS-B data" about itself -- the one place in this
# trio of Recipes where a provider's own reference names the sensing
# mechanism behind a position in so many words, rather than leaving it to
# be inferred from a field that stays null. A second field,
# FlightAirportMovementContract.quality (Basic, Live, Approximate), makes
# the same distinction at the level of one flight's arrival or departure
# time rather than a whole airport's coverage. Neither the coverage
# endpoint nor the quality field could be called or populated with a real
# value -- see the fidelity gaps -- but the vocabulary existing at all,
# author's own words, is the sharpest answer this group of three found to
# the question it was written to ask.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 200 anywhere in this file, for any route. Every request this
#     Recipe could actually send answered a gateway credential refusal --
#     see above -- and AeroDataBox's own OpenAPI description has no
#     "example" or "examples" key anywhere in it for any schema, checked
#     programmatically against the fetched document. FlightAware's Recipe
#     in this collection had a spec with worked examples to fall back on
#     when no key existed to call it with; Fireworks and Together had
#     "e.g." strings in their schema titles. AeroDataBox has field names,
#     types and prose descriptions and nothing a fixture could be built
#     from honestly, so none was invented. Every route below answers with a
#     declared `error:` and nothing routes to a `resource:` at all.
#   - The Unentitled question is answered structurally above rather than
#     with a passing case, because answering it with a case would mean
#     inventing a key this Recipe never held and asserting a status this
#     Recipe never observed for it.
#   - `function_access_restricted`-style AeroDataBox-specific refusals
#     (a real subscription on a tier below what a given operation needs --
#     TIER 2 is a real badge on several of the 40 documented operations,
#     including the FIDS endpoint this Recipe's main route names) are
#     documented by the provider and entirely unreachable from here, for
#     the same reason as the point above.
#   - auth.keys below names one fixture credential purely so Cauldron's own
#     engine can tell an absent header from a present one; no case in this
#     file ever presents it, because presenting it would answer with the
#     same not_subscribed refusal every other credential gets here, which
#     is a fact about this Recipe's fixture rather than a claim about a
#     real subscription.

recipe: aerodatabox
capability: scheduling
version: 0.1.0

upstream:
  api: "1.15.3.0"
  docs: https://doc.aerodatabox.com/rapidapi.html
  spec: https://doc.aerodatabox.com/docs/openapi-rapidapi-v1.json
  spec_hash: 2b81a290becc842b73600575dfcc9de4ec5dbc379f5e6001691ffb8628b8e3ef
  spec_seen: "2026-09-03"

auth:
  scheme: header
  header: X-RapidAPI-Key
  keys:
    - cauldron0000aerodatabox0000000000000000
  # No header at all: RapidAPI's own edge answers this regardless of Host --
  # see the file header.
  absent_error: invalid_key
  # Present and not a key this Recipe holds: RapidAPI's edge answers the
  # same "not subscribed" refusal a real, differently-subscribed key would
  # get -- see the file header's discussion of the fourth verdict.
  rejected_error: not_subscribed

responses:
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

routes:
  # Checked first: an X-RapidAPI-Host naming no real product at all is
  # refused before the key is ever examined, confirmed live with and
  # without a key present. public: true because that is exactly what was
  # observed -- the credential plays no part in this answer.
  - method: GET
    path: /flights/airports/{codeType}/{code}
    matches_header:
      X-RapidAPI-Host: totally-not-a-real-host.example.com
    public: true
    error: host_not_found

  # The gateway wall. Every request that is not the specific case above
  # lands here, and the credential gate above (auth.absent_error /
  # auth.rejected_error) answers every one of them before this route's own
  # `error:` would ever be reached -- see the fidelity gaps for what that
  # means about the one fixture key this Recipe declares.
  - method: GET
    path: /flights/airports/{codeType}/{code}
    error: not_subscribed

  # A second, simpler documented path, to show the gateway's answer does
  # not depend on which real AeroDataBox route was asked for.
  - method: GET
    path: /airports/{codeType}/{code}
    matches_header:
      X-RapidAPI-Host: totally-not-a-real-host.example.com
    public: true
    error: host_not_found

  - method: GET
    path: /airports/{codeType}/{code}
    error: not_subscribed

errors:
  invalid_key:
    status: 401
    message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."

  not_subscribed:
    status: 403
    message: "You are not subscribed to this API."

  host_not_found:
    status: 404
    message: "API doesn't exists"

fixtures:
  empty: {}

conformance:
  - name: no headers at all is the gateway's own missing-key sentence
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."

  - name: a correct Host with no Key answers the identical missing-key sentence
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Host: aerodatabox.p.rapidapi.com
    expect:
      status: 401
      body:
        message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."

  - name: a key with no Host at all is answered as though it were unsubscribed, not unrecognised
    # The interesting asymmetry: Key present, Host entirely absent, and the
    # gateway does not say "invalid key" -- it says "not subscribed",
    # exactly what a correct Host would have gotten. See the file header.
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Key: junkkeyabc12345
    expect:
      status: 403
      body:
        message: "You are not subscribed to this API."

  - name: the same key against the correct Host answers identically
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Key: junkkeyabc12345
        X-RapidAPI-Host: aerodatabox.p.rapidapi.com
    expect:
      status: 403
      body:
        message: "You are not subscribed to this API."

  - name: and so does a Host naming a different real product entirely
    # Not this API's own host -- weatherapi-com.p.rapidapi.com is a real,
    # different RapidAPI product. Same key, same 403, same sentence: the
    # gateway's refusal does not distinguish "wrong product" from "no
    # subscription to this one" any more than it distinguishes a
    # nonexistent key from a real one on the wrong plan -- see the file
    # header's discussion of the fourth verdict.
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Key: junkkeyabc12345
        X-RapidAPI-Host: weatherapi-com.p.rapidapi.com
    expect:
      status: 403
      body:
        message: "You are not subscribed to this API."

  - name: a Host naming no product at all is refused before the key is ever read
    # No X-RapidAPI-Key header on this request at all, and the answer is
    # still 404, not 401 -- Host resolution runs first. See the file
    # header's decision-tree reading of this whole family of cases.
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Host: totally-not-a-real-host.example.com
    expect:
      status: 404
      body:
        message: "API doesn't exists"

  - name: a key present changes nothing about the unresolved-Host answer
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /airports/icao/KJFK
      headers:
        X-RapidAPI-Key: junkkeyabc12345
        X-RapidAPI-Host: totally-not-a-real-host.example.com
    expect:
      status: 404
      body:
        message: "API doesn't exists"

  - name: an undeclared path on the correct host is still the credential wall, not a 404
    # /this/path/does/not/exist is nowhere in AeroDataBox's own 40-route
    # description, and the gateway answers exactly as it answers a real
    # path -- because nothing here ever reaches a router that could tell
    # the difference. See the file header.
    source: https://aerodatabox.p.rapidapi.com/this/path/does/not/exist
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /this/path/does/not/exist
    expect:
      status: 401
      body:
        message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."

  - name: the FIDS endpoint this Recipe is written about answers the identical wall
    # /flights/airports/{codeType}/{code} is the endpoint whose own
    # description talks about live updates and data coverage -- see the
    # file header -- and it is exactly as unreachable as the simpler
    # airport lookup above.
    source: https://aerodatabox.p.rapidapi.com/flights/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /flights/airports/icao/KJFK
    expect:
      status: 401
      body:
        message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."

  - name: method plays no part in the gateway's answer either
    source: https://aerodatabox.p.rapidapi.com/airports/icao/KJFK
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /airports/icao/KJFK
    expect:
      status: 401
      body:
        message: "Invalid API key. Go to https://docs.rapidapi.com/docs/keys for more info."
