# Paddle Recipe for Cauldron
#
# Paddle has a sandbox, and it is a separate account with its own products,
# prices and webhook endpoints that drift from production the moment anybody
# edits either. It also cannot produce the states that matter on demand: a
# subscription that fails at renewal, one paused mid-term, one with a
# cancellation already scheduled for the period end. Those arrive by waiting.
#
# Two things worth modelling exactly:
#
#   1. A subscription with a scheduled change is still active. Paddle records
#      the intent to cancel separately from the state, so the status stays
#      "active" while scheduled_change says it ends on a date. Code that reads
#      only the status keeps billing somebody who has cancelled, and code that
#      reads only the scheduled change cuts them off early.
#   2. Money is a string in minor units with the currency beside it. It is a
#      string because these amounts exceed what a float holds safely, so
#      parsing it as a number is the bug the type was chosen to prevent.
#
# Tokens below are fixtures, not secrets.

recipe: paddle
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.paddle.com/api-reference/overview

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - pdl_sdbx_cauldron
  # Struck live 2026-09-05 against api.paddle.com with no account. Paddle
  # answers a request carrying no Authorization header at all with
  # authentication_error above -- code forbidden, a sentence about permission
  # -- and one carrying anything it does not recognise with a different
  # failure, authentication_malformed. Both are 403.
  #
  # Every value an outsider can construct reaches the second, this file's own
  # fixture key included. Paddle's own key layout is public -- pdl, an
  # environment, apikey, a ULID, a body and a short tail, separated by
  # underscores -- and a string built to exactly that layout is still
  # malformed to it, so something beyond the shape is checked. That puts the
  # well-formed-but-wrong case out of reach without an account, and auth.shape
  # cannot describe a check whose rule cannot be written down.
  #
  # So rejected_error is authentication_malformed: it is what every wrong
  # credential this Recipe can be sent actually answers. The limit is that a
  # genuine key that is simply revoked or belongs to another account may
  # answer something else again, and nothing here could produce one to find
  # out.
  rejected_error: authentication_malformed

responses:
  list:
    style: wrapped
    count_field: meta.pagination.estimated_total
    # A whole URL, and Paddle's reference says to follow it rather than to
    # build one: "use the next URL directly", because it already carries the
    # filters and sort the request was made with. This Recipe served the bare
    # cursor there.
    cursor_field: meta.pagination.next
    cursor_url: absolute
    has_more_field: meta.pagination.has_more
    fields:
      meta:
        request_id: cauldron00000000-0000-4000-8000-000000000000
        pagination:
          per_page: 50
  resource:
    style: wrapped
    key: data
  # Everything under error, which the dotted names below put there.
  error:
    style: flat
    type_field: error.type
    code_field: error.code
    message_field: error.detail
    fields:
      error:
        documentation_url: https://developer.paddle.com/errors/overview
      meta:
        request_id: cauldron00000000-0000-4000-8000-000000000000

resources:
  subscription:
    collection: data
    id:
      prefix: sub_
      length: 26
    fields:
      customer_id:
        type: string
      # Paddle's real states. "trialing" bills nothing yet and "past_due" is
      # still serving while dunning runs.
      status:
        type: string
        default: active
      currency_code:
        type: string
        default: GBP
      collection_mode:
        type: string
        default: automatic
      # The intent to cancel, recorded separately from the status. A
      # subscription with one of these is still active until the date.
      # The field name is the key inside the sub-object, so these are action
      # and effective_at rather than a prefixed pair.
      action:
        type: string
        in: scheduled_change
      effective_at:
        type: datetime
        stamped: false
        in: scheduled_change
      started_at:
        type: datetime
      next_billed_at:
        type: datetime
        stamped: false
      canceled_at:
        type: datetime
        stamped: false
      paused_at:
        type: datetime
        stamped: false

  price:
    collection: data
    id:
      prefix: pri_
      length: 26
    fields:
      product_id:
        type: string
      description:
        type: string
        required: true
      # A string, in minor units. These exceed what a float holds safely,
      # which is why the type is what it is.
      amount:
        type: string
        required: true
        in: unit_price
      currency_code:
        type: string
        default: GBP
        in: unit_price
      interval:
        type: string
        in: billing_cycle
      frequency:
        type: integer
        in: billing_cycle
      status:
        type: string
        default: active

  customer:
    collection: data
    id:
      prefix: ctm_
      length: 26
    fields:
      email:
        type: string
        required: true
      name:
        type: string
      # An archived customer keeps their history and cannot be billed again.
      status:
        type: string
        default: active
      locale:
        type: string
        default: en
      created_at:
        type: datetime

routes:
  - method: GET
    path: /subscriptions
    resource: subscription
    operation: list
    pagination:
      # Paddle's own pagination reference names both: per_page, fifty by
      # default and two hundred at most "for most endpoints", and after for
      # the position. Neither is the word the runtime supplies, and per_page
      # is not even the same number everywhere -- transactions default and
      # cap at thirty, adjustments default to ten and cap at fifty, neither
      # of which this Recipe routes.
      style: cursor
      limit: 50
      max_limit: 200
      limit_param: per_page
      cursor_param: after

  - method: GET
    path: /subscriptions/{id}
    resource: subscription
    operation: get

  - method: PATCH
    path: /subscriptions/{id}
    resource: subscription
    operation: update

  - method: GET
    path: /prices
    resource: price
    operation: list
    pagination:
      # Paddle's own pagination reference names both: per_page, fifty by
      # default and two hundred at most "for most endpoints", and after for
      # the position. Neither is the word the runtime supplies, and per_page
      # is not even the same number everywhere -- transactions default and
      # cap at thirty, adjustments default to ten and cap at fifty, neither
      # of which this Recipe routes.
      style: cursor
      limit: 50
      max_limit: 200
      limit_param: per_page
      cursor_param: after

  - method: GET
    path: /prices/{id}
    resource: price
    operation: get

  - method: GET
    path: /customers
    resource: customer
    operation: list
    pagination:
      # Paddle's own pagination reference names both: per_page, fifty by
      # default and two hundred at most "for most endpoints", and after for
      # the position. Neither is the word the runtime supplies, and per_page
      # is not even the same number everywhere -- transactions default and
      # cap at thirty, adjustments default to ten and cap at fifty, neither
      # of which this Recipe routes.
      style: cursor
      limit: 50
      max_limit: 200
      limit_param: per_page
      cursor_param: after

  - method: POST
    path: /customers
    resource: customer
    operation: create
    status: 201

  - method: GET
    path: /customers/{id}
    resource: customer
    operation: get

webhooks:
  events:
    - subscription.created
    - subscription.updated
    - subscription.canceled
    - subscription.past_due
    - transaction.completed
    - transaction.payment_failed
    - customer.created
  # Paddle names everything twice over and none of it the way the default
  # does: the event is event_type, the delivery has both an event_id and a
  # separate notification_id, and the time is an RFC 3339 string rather than
  # a number. The record is at data.
  payload:
    event_id: "{id}"
    event_type: "{event}"
    occurred_at: "{created_iso}"
    notification_id: "{id}"
    data:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: Paddle-Signature
    secret: cauldron-notification-secret

errors:
  rate_limit:
    status: 429
    code: too_many_requests
    type: request_error
    message: Too many requests. Please retry after the reset time.
    headers:
      Retry-After: "1"

  # Confirmed live 2026-09-05 against api.paddle.com, no account and no key.
  # This file's status and code were already right; the sentence was
  # invented, and the documentation_url this file shares across every
  # failure is really specific to each one -- this failure's real address
  # ends in /forbidden, not /overview.
  authentication_error:
    status: 403
    code: forbidden
    type: request_error
    message: You aren't permitted to perform this request.
    fields:
      error:
        documentation_url: https://developer.paddle.com/v1/errors/shared/forbidden

  # Struck live 2026-09-05. A credential Paddle does not recognise -- which
  # is every one an outsider can build, including this file's own fixture key
  # -- is a different failure from sending none, and shares only the status.
  # Its documentation_url is its own, like every other failure here.
  authentication_malformed:
    status: 403
    code: authentication_malformed
    type: request_error
    message: "Authentication header included, but incorrectly formatted."
    fields:
      error:
        documentation_url: https://developer.paddle.com/v1/errors/shared/authentication_malformed

  resource_missing:
    status: 404
    code: entity_not_found
    type: request_error
    message: "Entity not found: {detail}"

  parameter_missing:
    status: 400
    code: bad_request
    type: request_error
    message: "Invalid request: {detail} is required"

  # The failures a sandbox will not produce for you, and the ones a billing
  # integration has to survive.
  subscription_update_when_canceled:
    status: 400
    code: subscription_update_when_canceled
    type: request_error
    message: A canceled subscription cannot be updated.

  transaction_payment_declined:
    status: 400
    code: transaction_payment_declined
    type: request_error
    message: The payment was declined by the issuing bank.

  # Paddle refuses to schedule a second change while one is pending, which is
  # what a retried cancellation runs into.
  subscription_change_already_scheduled:
    status: 400
    code: subscription_change_already_scheduled
    type: request_error
    message: A scheduled change already exists on this subscription.

fixtures:
  empty: {}

  small-account:
    customer:
      - id: ctm_cauldron00000000000001
        email: ada@example.com
        name: Ada Lovelace
        status: active
      - id: ctm_cauldron00000000000002
        email: former@example.com
        # Archived. Keeps their history and cannot be billed again.
        status: archived
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: ctm_cauldron00000000000003
        email: former2@example.com
        status: archived
    price:
      - id: pri_cauldron00000000000001
        product_id: pro_cauldron0000000000001
        description: Pro monthly
        amount: "2400"
        currency_code: GBP
        interval: month
        frequency: 1
    subscription:
      - id: sub_cauldron00000000000001
        customer_id: ctm_cauldron00000000000001
        status: active
        currency_code: GBP
        next_billed_at: "2026-02-01T00:00:00Z"
      - id: sub_cauldron00000000000002
        customer_id: ctm_cauldron00000000000001
        # Still active. The cancellation is scheduled, not applied, and the
        # customer keeps their access until the date.
        status: active
        action: cancel
        effective_at: "2026-02-01T00:00:00Z"
        next_billed_at: "2026-02-01T00:00:00Z"
      - id: sub_cauldron00000000000003
        customer_id: ctm_cauldron00000000000002
        # Dunning is running and the customer still has access.
        status: past_due
        next_billed_at: "2026-01-20T00:00:00Z"

# Conformance cases, read from Paddle's API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: no credential at all is a 403, and the sentence names permission
    source: https://api.paddle.com/products
    verified: "2026-09-05"
    request:
      method: GET
      path: /products
    expect:
      status: 403
      body:
        error.type: request_error
        error.code: forbidden
        error.detail: "You aren't permitted to perform this request."
        error.documentation_url: https://developer.paddle.com/v1/errors/shared/forbidden

  - name: a credential Paddle does not recognise is a different 403 entirely
    # Struck live 2026-09-05. Same status as sending nothing, different code,
    # different sentence and a documentation_url of its own -- so a client
    # branching on the status alone cannot tell "you sent nothing" from "what
    # you sent is not a key", which is the distinction this case exists to
    # keep. See the auth block for what could not be established: every value
    # an outsider can build reaches this answer, so a genuine key that is
    # merely wrong may answer something else again.
    source: https://api.paddle.com/products
    verified: "2026-09-05"
    request:
      method: GET
      path: /products
      headers:
        Authorization: Bearer not-a-paddle-key
    expect:
      status: 403
      body:
        error.type: request_error
        error.code: authentication_malformed
        error.detail: "Authentication header included, but incorrectly formatted."
        error.documentation_url: https://developer.paddle.com/v1/errors/shared/authentication_malformed

  - name: a subscription with a scheduled cancellation is still active
    source: https://developer.paddle.com/api-reference/subscriptions/overview
    fixture: small-account
    request:
      method: GET
      path: /subscriptions/sub_cauldron00000000000002
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      body:
        data:
          # Reading only the status keeps billing somebody who has cancelled.
          # Reading only the scheduled change cuts them off early.
          status: active
          scheduled_change:
            action: cancel
            effective_at: "2026-02-01T00:00:00Z"

  - name: a plain active subscription has no scheduled change
    source: https://developer.paddle.com/api-reference/subscriptions/overview
    fixture: small-account
    request:
      method: GET
      path: /subscriptions/sub_cauldron00000000000001
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      body:
        data:
          status: active
      absent:
        - data.scheduled_change
        - data.canceled_at

  - name: past due is still serving
    source: https://developer.paddle.com/api-reference/subscriptions/overview
    fixture: small-account
    request:
      method: GET
      path: /subscriptions/sub_cauldron00000000000003
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      body:
        data:
          # Dunning is running and the customer still has access. Revoking
          # here loses a customer who was about to pay.
          status: past_due

  - name: money is a string in minor units
    source: https://developer.paddle.com/api-reference/prices/overview
    fixture: small-account
    request:
      method: GET
      path: /prices/pri_cauldron00000000000001
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      body:
        data:
          unit_price:
            # A string, and minor units. Parsing it as a number is the bug
            # the type was chosen to prevent.
            amount: "2400"
            currency_code: GBP
          billing_cycle:
            interval: month
            frequency: 1
      absent:
        - data.amount

  - name: a collection carries its paging under meta
    source: https://developer.paddle.com/api-reference/about/pagination
    fixture: small-account
    request:
      method: GET
      path: /subscriptions
      query:
        # per_page, not limit. This sent limit -- which Paddle does not have --
        # against a Recipe that read limit too, so the two agreed and a page of
        # two came back looking asked for.
        per_page: "2"
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      body:
        meta:
          pagination:
            estimated_total: 3
            per_page: 50
            has_more: true
      matches:
        meta.request_id: '^cauldron[0-9a-f-]+$'
      absent:
        - data[2]
        - pagination

  - name: the error is nested under error with a detail, not a message
    source: https://developer.paddle.com/errors/overview
    fixture: small-account
    request:
      method: GET
      path: /subscriptions/sub_doesnotexist
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 404
      body:
        error:
          type: request_error
          code: entity_not_found
          documentation_url: https://developer.paddle.com/errors/overview
      matches:
        error.detail: 'Entity not found'
      # Code reading error.message finds nothing.
      absent:
        - error.message
        - message

  - name: a bad key is a 403, not a 401
    source: https://api.paddle.com/customers
    verified: "2026-09-05"
    request:
      method: GET
      path: /customers
    expect:
      # Paddle answers 403 where most providers answer 401, so code checking
      # for 401 to refresh a credential never fires.
      status: 403
      body:
        error:
          code: forbidden
          type: request_error

  - name: the paging fields are named meta.pagination.next
    source: https://developer.paddle.com/api-reference/overview
    fixture: small-account
    request:
      method: GET
      path: /subscriptions
      query:
        # per_page, for the same reason as the case above.
        per_page: "1"
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        # A whole URL, which "." never checked. Paddle's own reference
        # says to "use the next URL directly", because it carries the
        # filters and sort the request was made with -- and this Recipe
        # served a bare cursor there until cursor_url said otherwise.
        meta.pagination.next: '^https?://[^/]+/subscriptions\?.*after='

  - name: the event is called event_type and the time is a string
    source: https://developer.paddle.com/webhooks/overview
    fixture: small-account
    request:
      method: POST
      path: /customers
      headers:
        Authorization: Bearer pdl_sdbx_cauldron
      json:
        email: grace@example.com
    expect:
      status: 201
      webhook:
        event: customer.created
        body:
          event_type: customer.created
        matches:
          # RFC 3339, not a Unix integer. Code doing arithmetic on it gets
          # NaN rather than a wrong date, which is at least loud.
          occurred_at: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          data.id: '^ctm_'
        absent:
          # Paddle calls it event_type. Nothing answers to type.
          - type
          - data.object


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and after=sub_cauldron00000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and after are the two names this listing reads"
    source: "https://developer.paddle.com/api-reference/about/pagination"
    fixture: small-account
    request:
      method: GET
      path: "/subscriptions"
      query:
        "per_page": "1"
        "after": "sub_cauldron00000000000001"
      headers:
        "Authorization": "Bearer pdl_sdbx_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "sub_cauldron00000000000002"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and after=sub_cauldron00000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and after are the two names this listing reads on subscriptions"
    source: "https://developer.paddle.com/api-reference/about/pagination"
    fixture: small-account
    request:
      method: GET
      path: "/subscriptions"
      query:
        "per_page": "1"
        "after": "sub_cauldron00000000000001"
      headers:
        "Authorization": "Bearer pdl_sdbx_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "sub_cauldron00000000000002"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the customer listing answers with what the fixture holds"
    source: "https://developer.paddle.com/api-reference/subscriptions/overview"
    fixture: small-account
    request:
      method: GET
      path: "/customers"
      headers:
        "Authorization": "Bearer pdl_sdbx_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "ctm_cauldron00000000000001"
        "data[1].id": "ctm_cauldron00000000000002"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # per_page=1 and after=ctm_cauldron00000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "per_page and after are the two names this listing reads on customers"
    source: "https://developer.paddle.com/api-reference/subscriptions/overview"
    fixture: small-account
    request:
      method: GET
      path: "/customers"
      query:
        "per_page": "1"
        "after": "ctm_cauldron00000000000001"
      headers:
        "Authorization": "Bearer pdl_sdbx_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "ctm_cauldron00000000000002"
      absent:
        - "data[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the price listing answers with what the fixture holds"
    source: "https://developer.paddle.com/api-reference/subscriptions/overview"
    fixture: small-account
    request:
      method: GET
      path: "/prices"
      headers:
        "Authorization": "Bearer pdl_sdbx_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "pri_cauldron00000000000001"
      absent:
        - "data[1]"

