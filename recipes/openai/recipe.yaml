# OpenAI Recipe for Cauldron
#
# Written against the OpenAPI 3.1.0 document OpenAI publishes and generates
# its own SDKs from, at github.com/openai/openai-openapi -- three megabytes,
# 182 paths, 1422 schemas -- and quoted from the field descriptions in it.
#
# The refusal is not in the answer.
#
# A chat message carries content and refusal as two separate nullable
# strings. content is "The contents of the message"; refusal is "The refusal
# message generated by the model". They are siblings, and only one of them is
# ever filled in.
#
# So when a model declines, choices[0].message.content is null -- and the
# sentence explaining why is sitting in a field almost nobody reads. Every
# integration written the obvious way logs "the model returned nothing",
# retries, gets the same nothing, and reports an outage. The model answered
# both times, in the field beside the one being read.
#
# It is a 200. It has a finish_reason of stop. Nothing anywhere says a
# refusal happened except the presence of a string in a field whose absence
# is the normal case.
#
# Five more, each from the same document:
#
#   1. The completion token count includes tokens you never receive. Of
#      rejected_prediction_tokens: "the number of tokens in the prediction
#      that did not appear in the completion. However, like reasoning tokens,
#      these tokens are still counted in the total completion tokens for
#      purposes of billing, output, and context window limits." So
#      completion_tokens is not the length of what came back, and the
#      difference is in a nested object most clients never open. A cost model
#      built by tokenising the response undercounts every reasoning request.
#   2. The limit you set is spent on thinking you cannot see.
#      max_completion_tokens is "An upper bound for the number of tokens that
#      can be generated for a completion, including visible output tokens and
#      reasoning tokens." Set it too low against a reasoning model and the
#      budget is consumed before a word is emitted: finish_reason is length,
#      content is empty, and the bill is real.
#   3. The parameter that used to do that is deprecated and refused by half
#      the catalogue. Of max_tokens: "This value is now deprecated in favor of
#      max_completion_tokens, and is not compatible with o-series models." One
#      field, working on some models and rejected by others, with nothing in
#      the request to say which kind you are talking to.
#   4. Nothing is kept unless you said so. store defaults to false, so
#      GET /v1/chat/completions/{completion_id} answers 404 for the
#      completion you just made -- and the listing that would show you what
#      does exist is empty for exactly the same reason.
#   5. content_filter is a finish reason rather than an error: "content was
#      omitted due to a flag from our content filters". A 200, a choice, a
#      message, and the part that mattered removed.
#
# Two shapes here are recorded against other providers and are stated as
# shared rather than offered as findings: finish_reason length means the
# answer was cut off mid-sentence and still arrives with a 200, and a tool
# call is a finish reason rather than a field to test for. Both are Cohere's,
# in those words.
#
# Worth stating because it is not a trap: n can be up to 128 and OpenAI says
# plainly "you will be charged based on the number of generated tokens across
# all of the choices". choices[0] is a habit rather than a rule, and the
# fixture has a two-choice completion so the habit is visible.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No model runs. Which finish reason a completion carries, whether it
#     refused, and how many tokens it reports are what a fixture puts there.
#     That is the point: a refusal and a filtered response are nearly
#     impossible to produce on demand against the real API, and they are
#     exactly the two an integration has never handled.
#   - The token counts are fixtures rather than a tokeniser. Counting a
#     different way would be precisely the wrong lesson, given that claim 1
#     is about the count not matching the text.
#   - A create is served and answers with a stored record, which is what
#     store: true does. The default-false behaviour is modelled on the read
#     side -- an unstored completion is one that is not there -- rather than
#     by having the create decide, because a route here cannot branch on a
#     request field.
#   - Streaming is not modelled. The response shapes differ (delta rather
#     than message) and an emulator that answered a stream with a whole body
#     would teach the wrong parse.
#   - Responses, Assistants, embeddings, images, audio, batches, files,
#     fine-tuning, moderations and the other hundred-odd paths are absent.
#     Chat completions and models only.
#
# The key and the ids below are fixtures and belong to no account.
#
# Drift note, 2026-09-03: the description moved since it was last recorded.
# Diffed the live openai/openai-openapi document against the commit current
# on 2026-08-29 (the last one before this Recipe's spec_seen; nothing landed
# on 2026-08-30 itself). What changed inside what this Recipe names: POST
# /v1/chat/completions now also declares a 503 -- InferenceServiceUnavailable
# -- beside the 200 and 429 it already had. The 429 entry itself was
# re-pointed from TooManyRequests to a new InferenceRateLimited response, but
# the status code is still 429, which is all the fingerprint reads. Neither
# CreateChatCompletionResponse nor Model gained, lost, or retyped a single
# property the Recipe names, and no other route this Recipe uses changed at
# all. No path, method, or field claim this Recipe makes moved, and no
# existing response code was dropped or reshaped, so nothing above
# contradicts what was checked -- same shape as the Attio move. Re-recorded
# rather than fixed.

recipe: openai
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://platform.openai.com/docs/api-reference/chat
  spec: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  spec_hash: 84c757e5cfd59df6d9b5cdf16f4e7cd39d4848133dcb312c295bd3b49a973f36
  spec_seen: "2026-09-03"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk-cauldron-openai-fixture-key

responses:
  list:
    style: wrapped
    key: data
    has_more_field: has_more
    cursor_field: last_id
    fields:
      object: list
  resource:
    style: bare
  error:
    # Nested under error, with four properties that are all required and two
    # of which are nullable -- so code and param are present and null on a
    # failure that has nothing to say about them.
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: type

resources:
  completion:
    id:
      style: prefixed
      prefix: chatcmpl-
    constants:
      object: chat.completion
    fields:
      created:
        type: timestamp
      model:
        type: string
      choices:
        type: list
      usage:
        type: map
      service_tier:
        type: string
        default: default
      system_fingerprint:
        type: string

  model:
    id:
      style: opaque
    constants:
      object: model
    fields:
      created:
        type: timestamp
      owned_by:
        type: string

routes:
  - method: POST
    path: /v1/chat/completions
    resource: completion
    operation: create

  # Only there if the request that made it said store: true.
  - method: GET
    path: /v1/chat/completions/{id}
    resource: completion
    operation: get

  - method: GET
    path: /v1/chat/completions
    resource: completion
    operation: list
    pagination:
      style: cursor
      cursor_param: after
      limit_param: limit
      limit: 20

  - method: GET
    path: /v1/models
    resource: model
    operation: list
    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
    list:
      # The models listing has no paging at all: an object, a data array, and
      # nothing else.
      style: wrapped
      key: data
      has_more_field: "-"
      cursor_field: "-"

  - method: GET
    path: /v1/models/{id}
    resource: model
    operation: get

errors:
  authentication_error:
    status: 401
    message: Incorrect API key provided.
    code: invalid_api_key
    type: invalid_request_error

  resource_missing:
    status: 404
    message: "No such chat completion: {detail}."
    code: "-"
    type: invalid_request_error

  invalid_request:
    status: 400
    message: Invalid request.
    code: "-"
    type: invalid_request_error

  rate_limited:
    status: 429
    message: Rate limit reached for requests.
    code: rate_limit_exceeded
    type: requests

fixtures:
  empty: {}

  account:
    model:
      - id: gpt-5.4
        created: 1741290000
        owned_by: system
      - id: o4-mini
