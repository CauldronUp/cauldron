conformance:
  - name: a refusal leaves the answer field empty and says so somewhere else
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000002
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # content and refusal are siblings, both nullable strings, and only
        # one is ever filled in. Reading content here gets null, and the
        # reason the model gave is in the field beside it.
        "choices[0].message.content": null
        "choices[0].message.refusal": I can't help with that.
        # And nothing else in the response distinguishes this from a normal
        # answer: it stopped normally, at 200.
        "choices[0].finish_reason": stop
        object: chat.completion

  - name: and an ordinary answer leaves the refusal empty instead
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000001
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # The other end of the pair, so both are pinned. refusal is present
        # and null rather than absent, which is what makes reading only
        # content survive every test anybody writes.
        "choices[0].message.refusal": null
        "choices[0].message.content": The kettle boils at 100 degrees Celsius at sea level.

  - name: the completion count includes tokens that never arrived
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000003
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # Eight hundred and thirty-two completion tokens and an empty string
        # of content. "like reasoning tokens, these tokens are still counted
        # in the total completion tokens for purposes of billing, output, and
        # context window limits" -- so tokenising the reply to work out the
        # cost is wrong by the whole of it.
        "usage.completion_tokens": 832
        "usage.completion_tokens_details.reasoning_tokens": 832
        "choices[0].message.content": ""
        # And the budget ran out before a word was emitted.
        "choices[0].finish_reason": length

  - name: and a model that did not reason reports none of them
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000001
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # The other side: fourteen tokens of completion, fourteen tokens of
        # text, nothing hidden. The breakdown is present either way, which is
        # why its absence is never what tells you.
        "usage.completion_tokens": 14
        "usage.completion_tokens_details.reasoning_tokens": 0

  - name: a filtered answer is a stopping reason rather than an error
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000004
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # "content_filter if content was omitted due to a flag from our
        # content filters". A 200, a choice, a message, and the part that
        # mattered removed -- with no refusal either, so both the fields a
        # client might read are null.
        "choices[0].finish_reason": content_filter
        "choices[0].message.content": null
        "choices[0].message.refusal": null

  - name: asking for a completion nobody stored is asking for nothing
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n0000000000000ff
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      # store defaults to false, so this is the ordinary case rather than the
      # exceptional one: the completion was made, answered, billed, and never
      # kept.
      status: 404
      body:
        "error.type": invalid_request_error

  - name: the second choice is billed and is not the one anybody reads
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions/chatcmpl-Ca0uldr0n000000000000005
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # "you will be charged based on the number of generated tokens across
        # all of the choices". Both are here, both count, and choices[0] is a
        # habit rather than a rule.
        "choices[0].index": 0
        "choices[1].index": 1
        "choices[1].message.content": Fill the kettle, then boil it.
        "usage.completion_tokens": 17
        service_tier: flex

  - name: the models listing pages by nothing at all
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        # An object and a data array, and that is the whole envelope: no
        # cursor, no has_more, no count. The completions listing beside it
        # has all three, which is two paging contracts in one API.
        object: list
        "data[0].id": gpt-5.4
        "data[0].object": model
        "data[1].id": o4-mini
      absent:
        - has_more
        - last_id
        - first_id

  - name: the stored completions listing pages by three fields the models one lacks
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/chat/completions?limit=2
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
    expect:
      status: 200
      body:
        object: list
        has_more: true
        "data[0].id": chatcmpl-Ca0uldr0n000000000000001
        "data[1].id": chatcmpl-Ca0uldr0n000000000000002
      matches:
        last_id: '^chatcmpl-'
      absent:
        - data[2]

  - name: a key the account does not know names the parameter it blames
    source: https://github.com/openai/openai-openapi
    fixture: account
    request:
      method: GET
      path: /v1/models
      headers:
        Authorization: Bearer sk-not-this-accounts-key
    expect:
      status: 401
      body:
        # type, message, param and code are all required, and two of them are
        # nullable -- so a client switching on error.code has to handle the
        # value being null on failures that have nothing to say about it.
        "error.type": invalid_request_error
        "error.code": invalid_api_key
        "error.message": Incorrect API key provided.

  - name: a completion minted here is named the way OpenAI names them
    source: https://github.com/openai/openai-openapi
    fixture: empty
    request:
      method: POST
      path: /v1/chat/completions
      headers:
        Authorization: Bearer sk-cauldron-openai-fixture-key
      json:
        model: gpt-5.4
        store: true
    expect:
      status: 200
      body:
        # The type is on the object rather than only in the documentation,
        # which is how a client tells a completion from a list of them when
        # both arrive down the same pipe.
        object: chat.completion
        model: gpt-5.4
      matches:
        # chatcmpl-, which code in the wild really does prefix-match on --
        # and an emulator minting bare strings would let that code ship.
        id: '^chatcmpl-'


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and after=chatcmpl-Ca0uldr0n000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and after are the two names this listing reads"
    source: "https://github.com/openai/openai-openapi"
    fixture: account
    request:
      method: GET
      path: "/v1/chat/completions"
      query:
        "limit": "1"
        "after": "chatcmpl-Ca0uldr0n000000000000001"
      headers:
        "Authorization": "Bearer sk-cauldron-openai-fixture-key"
    expect:
      status: 200
      body:
        "data[0].id": "chatcmpl-Ca0uldr0n000000000000002"
      absent:
        - "data[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and after=chatcmpl-Ca0uldr0n000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and after are the two names this listing reads on v1 chat completions"
    source: "https://github.com/openai/openai-openapi"
    fixture: account
    request:
      method: GET
      path: "/v1/chat/completions"
      query:
        "limit": "1"
        "after": "chatcmpl-Ca0uldr0n000000000000001"
      headers:
        "Authorization": "Bearer sk-cauldron-openai-fixture-key"
    expect:
      status: 200
      body:
        "data[0].id": "chatcmpl-Ca0uldr0n000000000000002"
      absent:
        - "data[1]"
