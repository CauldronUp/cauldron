            audio_tokens: 0
            accepted_prediction_tokens: 0
            rejected_prediction_tokens: 0
      # A refusal. The answer field is null and the sentence is in the field
      # beside it, and the finish reason says the model stopped normally.
      - id: chatcmpl-Ca0uldr0n000000000000002
        created: 1755000100
        model: gpt-5.4
        service_tier: default
        system_fingerprint: fp_cauldron0001
        choices:
          - index: 0
            finish_reason: stop
            message:
              role: assistant
