      - id: chatcmpl-Ca0uldr0n000000000000003
        created: 1755000200
        model: o4-mini
        service_tier: default
        system_fingerprint: fp_cauldron0002
        choices:
          - index: 0
            finish_reason: length
            message:
              role: assistant
              content: ""
              refusal: null
              annotations: []
            logprobs: null
        usage:
          prompt_tokens: 52
          # Eight hundred and thirty-two of these were reasoning, which is
          # the whole of it: the visible answer is empty.
          completion_tokens: 832
          total_tokens: 884
          prompt_tokens_details:
            cached_tokens: 0
            audio_tokens: 0
          completion_tokens_details:
            reasoning_tokens: 832
            audio_tokens: 0
            accepted_prediction_tokens: 0
            rejected_prediction_tokens: 0
      # Content removed by the filter, reported as a stopping reason rather
