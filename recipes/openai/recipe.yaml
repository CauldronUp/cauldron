      - id: chatcmpl-Ca0uldr0n000000000000004
        created: 1755000300
        model: gpt-5.4
        service_tier: default
        system_fingerprint: fp_cauldron0001
        choices:
          - index: 0
            finish_reason: content_filter
            message:
              role: assistant
              content: null
              refusal: null
              annotations: []
            logprobs: null
        usage:
          prompt_tokens: 44
          completion_tokens: 0
          total_tokens: 44
          prompt_tokens_details:
            cached_tokens: 0
            audio_tokens: 0
          completion_tokens_details:
            reasoning_tokens: 0
            audio_tokens: 0
            accepted_prediction_tokens: 0
            rejected_prediction_tokens: 0
      # Two choices, both billed, and only one of them is the one everybody
