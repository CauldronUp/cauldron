          total_tokens: 38
          prompt_tokens_details:
            cached_tokens: 0
            audio_tokens: 0
          completion_tokens_details:
            reasoning_tokens: 0
            audio_tokens: 0
            accepted_prediction_tokens: 0
            rejected_prediction_tokens: 0
      # A reasoning model that spent its whole budget thinking. Empty
      # content, finish_reason length, and eight hundred billable tokens
