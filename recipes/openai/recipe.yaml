      - id: chatcmpl-Ca0uldr0n000000000000005
        created: 1755000400
        model: gpt-5.4
        service_tier: flex
        system_fingerprint: fp_cauldron0001
        choices:
          - index: 0
            finish_reason: stop
            message:
              role: assistant
              content: Boil the kettle first.
              refusal: null
              annotations: []
            logprobs: null
          - index: 1
            finish_reason: stop
            message:
              role: assistant
              content: Fill the kettle, then boil it.
              refusal: null
              annotations: []
            logprobs: null
        usage:
          prompt_tokens: 19
          # Both choices, which is what "charged based on the number of
