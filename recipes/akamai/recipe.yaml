# Akamai Recipe for Cauldron
#
# This collection's question is whether an API exposes a deployment state
# distinct from the saved configuration, and whether a caller can tell
# "saved" from "serving." Read bunny/recipe.yaml, cloudflare/recipe.yaml
# and imagekit/recipe.yaml first, per this task's instructions, and every
# one of them shares a fact this Recipe does not: a reachable host.
# api.bunny.net, video.bunnycdn.com, api.cloudflare.com, api.imagekit.io,
# api.fastly.com and api.keycdn.com -- every other host this collection's
# CDN group touches -- answer a request from a machine that has never held
# an account. Akamai's management API does not. Its hosts look like
# `akab-h05tnam3wl42son7nktnlnnx-kbob3i3v.luna.akamaiapis.net` --
# customer-specific and, per Akamai's own EdgeGrid documentation,
# "provisioned after credentials are created," delivered inside the
# `.edgerc` file a customer downloads from Akamai Control Center. There is
# no shared, generic Akamai API hostname anywhere this Recipe could find --
# so say plainly, as this task's own instructions ask: nothing in this
# Recipe was probed live. Every case below is sourced from Akamai's own
# published technical documentation and carries no verified date, for the
# entire file, because there was never a host to verify anything against.
#
# That makes Akamai a different answer again to the reachability question
# hotelbeds/recipe.yaml, sumsub/recipe.yaml and podcastindex/recipe.yaml
# each already answer for this collection. Those three share one host per
# provider that anyone can reach with no account -- Podcast Index answers
# it directly, with five distinct sentences for five distinct credential
# failures; Hotelbeds and Sumsub each sit behind a gateway that collapses
# every failure into one shape before the provider's own signature check is
# ever reached, so the finer distinction exists and is simply unreachable
# from where this Recipe stands. Akamai is not gated -- it is absent. There
# is no gateway to send a request to and watch collapse, because there is
# no address for one. That is a fourth answer this task's question has not
# had yet: not "the distinction is masked," but "there was never a
# connection to mask it on."
#
# **EdgeGrid is the most elaborate credential in this collection, and its
# shape is exact and citable even though nothing could be sent to see it
# used.** Per techdocs.akamai.com/developer/docs/authenticate-with-edgegrid,
# the Authorization header is:
#
#   EG1-HMAC-SHA256 client_token={value};access_token={value};
#   timestamp={value};nonce={value};signature={value}
#
# five named parameters -- a client token, an access token, a timestamp in
# `yyyyMMddTHH:mm:ss+0000` form, a nonce guarding against replay, and a
# base64-encoded HMAC-SHA256 signature -- separated by semicolons inside
# one scheme, where Podcast Index spreads the same five-ish concerns across
# three separate headers (Authorization, X-Auth-Key, X-Auth-Date) and
# Fastly and KeyCDN each need exactly one static value. The same page warns
# a caller's clock must stay "no more than 30 seconds out of sync with
# internet time services," which is the timestamp parameter's whole reason
# for existing, stated as an operational warning rather than as a
# documented error response.
#
# **What each malformation answers could not be established, and that
# absence was checked for rather than assumed.** This Recipe searched
# Akamai's own authentication documentation, its general techdocs error
# pages, and the EdgeGrid page's own linked material for a missing-header
# case, a malformed-parameter case, an expired-timestamp case, a
# reused-nonce case and an unrecognised-token case -- the five-way
# breakdown Podcast Index's own documentation gives directly. None of the
# pages this Recipe could fetch itemised a distinct status code or message
# for any of the five. So this is not the Fastly or KeyCDN shape, where
# every failure this Recipe could send collapsed to one sentence and that
# collapse is the finding -- this is a provider whose own published
# materials do not say, as far as this Recipe's search could establish,
# which is a different and weaker kind of gap and is named as one rather
# than smoothed into a false collapse. auth.absent_error,
# auth.malformed_error and auth.rejected_error are left unset for that
# reason, and Cauldron does not verify the HMAC signature itself, the same
# gap dynamodb/recipe.yaml states for AWS SigV4 in this same collection: a
# request whose Authorization header merely has the right shape is
# accepted, because implementing EdgeGrid's signing algorithm to reject a
# wrongly signed one is not what this project is for.
#
# **The activation state this group's question is asking about is not a
# side note in Akamai's API -- it is two networks deep, and Akamai's own
# worked example says so in one JSON object.** A property
# (GET /papi/v1/properties/{propertyId}) carries three version numbers at
# once, not one: `latestVersion` (the newest draft), `stagingVersion` and
# `productionVersion` (the version number actually live on each network,
# or null if nothing has ever gone there). Akamai's own reference page
# supplies a complete worked example rather than a schema alone:
#
#   {"propertyId": "prp_175780", "propertyName": "example.com",
#    "latestVersion": 2, "stagingVersion": 1, "productionVersion": null}
#
# quoted verbatim below. Read plainly: version 2 has been saved and is
# nobody's yet; version 1 is what staging is actually serving; production
# is serving nothing this property has ever shipped. Three numbers, one
# object, and "saved" and "serving" are visibly two different questions
# with two different answers -- compare bunny/recipe.yaml's header, which
# has to argue this same point from a single video's single status field,
# and fastly/recipe.yaml's header, which has to argue it from a real
# `locked: true` with no real `active: true` anywhere in that Recipe's own
# sourcing. Akamai's own documentation hands the argument over already
# made, needing no invented value on either side of it.
#
# A version's own record (GET .../versions/{propertyVersion}) restates the
# same split from the version's side: `productionStatus` and
# `stagingStatus` are two independent enum fields on one object, each one
# of ACTIVE, INACTIVE, PENDING, ABORTED, DEACTIVATED,
# PENDING_DEACTIVATION or PENDING_CANCELLATION, and Akamai's own worked
# example carries two different values for the two fields at once:
#
#   {"propertyVersion": 2, "productionStatus": "INACTIVE",
#    "stagingStatus": "ACTIVE", ...}
#
# also quoted verbatim below -- the same version, live on one network and
# not the other, in the provider's own words. Akamai's own description
# adds, in prose rather than as a schema field: "If ACTIVE, the version is
# read-only and currently serving traffic" -- the same active/locked pairing
# fastly/recipe.yaml's header draws out of two separate Fastly fields,
# stated here as one field doing double duty for both ideas on Akamai.
#
# An activation record (GET .../activations/{activationId}) is the history
# of one attempt to move one version onto one network, and its own status
# enum is richer again: ACTIVE, INACTIVE, PENDING, ZONE_1, ZONE_2, ZONE_3,
# ABORTED, FAILED, DEACTIVATED, PENDING_DEACTIVATION and NEW -- the
# ZONE_1/ZONE_2/ZONE_3 trio documented as "progressive activation stages,"
# a real, named, in-between state this Recipe's other two CDN Recipes have
# nothing to compare it to: Fastly's Version is a flat pair of booleans
# with no gradient between them, and KeyCDN has no activation-state field
# at all. Akamai's own worked example for this object is quoted verbatim
# below too, at status PENDING, and ZONE_1 through ZONE_3 are stated in
# this header rather than forced into a fixture: no worked example at any
# of those three specific values was found anywhere this Recipe could
# fetch, and inventing one would be exactly the fabrication this
# collection's rules forbid.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Fast Purge (CCU v3) is entirely unmodelled, and the reason is worth
#     stating precisely rather than waved past. This Recipe fetched
#     techdocs.akamai.com/purge-cache/llms.txt, which lists real page
#     titles -- "Invalidations," "Deletions," "Rate limit status" -- and
#     every specific reference page this Recipe then tried under that
#     index (reference/api, reference/invalidations, reference/post-url,
#     reference/delete-url, reference/get-purge-status,
#     docs/purge-mechanisms) either 404'd or returned a page shell with no
#     example response body fetchable through it. So the pages exist and
#     this Recipe could not read what is on them, which is a narrower and
#     more honest gap than either modelling the route from memory or not
#     mentioning it at all. No purgeId, no status field and no polling
#     endpoint for this product is claimed anywhere below.
#   - contractId and groupId are real, documented query parameters on most
#     PAPI routes -- required "when properties span multiple contracts or
#     groups," optional on GET .../properties/{propertyId} itself when an
#     account has only one of each. Neither is modelled as a required
#     scope here, because every route below is a single-id fetch and this
#     Recipe found no worked example showing what an omitted-but-required
#     case answers.
#   - No routing-order or method-mismatch case exists in this Recipe at
#     all -- not collapsed, not declared, absent. This task's standard
#     probe list asks for an unrouted path and a wrong method, with and
#     without a credential; neither has an answer here, because there was
#     no host to send either probe to. Stated as its own gap rather than
#     defaulted silently: auth.after_routing is left at its default
#     (checked first), which is Cauldron's baseline behaviour and not a
#     claim this Recipe is making about Akamai.
#   - Only Property Manager (PAPI) is modelled: property, version and
#     activation, read-only. Edge DNS, Certificate Provisioning, Cloudlets,
#     Bot Manager, Image and Video Manager, and every other Akamai product
#     are out of scope.
#   - Create, update, delete and the activation POST itself are not
#     modelled. Every route below is a GET, and this task's rules forbid
#     ever calling the write ones for real -- not that reachability was
#     available to call them with regardless.
#   - No upstream.spec. Each PAPI resource's schema lives on its own
#     techdocs page rather than in one fetchable machine-readable
#     description this Recipe could fingerprint.
#
# Client tokens, access tokens and signatures below are fixtures, not
# secrets, and belong to no account -- there is no account for them to
# belong to.

recipe: akamai
capability: cdn
version: 0.1.0

upstream:
  api: v1
  docs: https://techdocs.akamai.com/property-mgr/reference/property-manager-api

auth:
  scheme: header
  header: Authorization
  # Shape-checked, not signature-verified -- see the header, and see
  # dynamodb/recipe.yaml in this collection for the same gap against a
  # different signed scheme. A request whose Authorization header merely
  # matches this shape is accepted.
  pattern: '^EG1-HMAC-SHA256 client_token=[^;]+;access_token=[^;]+;timestamp=[^;]+;nonce=[^;]+;signature=[A-Za-z0-9+/]+=*$'

responses:
  # No single key fits every list on this API -- versions.items and
  # activations.items, per Akamai's own worked examples -- so the Recipe-
  # wide default is overridden per route below rather than guessed at
  # here. See techdocs.akamai.com/property-mgr/reference/get-property-versions
  # and .../get-property-activations, each quoted in its own conformance
  # case.
  list:
    style: wrapped
    key: items
  resource:
    style: bare
  error:
    # Akamai's own general API documentation elsewhere describes an
    # RFC 7807-shaped envelope (type, title, detail, status) for its
    # platform broadly, but no worked example reachable from this
    # Recipe's search confirmed that shape for EdgeGrid's own credential
    # failures specifically -- see the header. Left at this format's plain
    # default rather than naming fields this Recipe cannot back with a
    # citation; no conformance case in this file reaches this block at
    # all, for the same reason.
    style: flat

resources:
  # GET /papi/v1/properties/{propertyId}. Field names and the worked
  # example are Akamai's own -- see the header.
  property:
    id:
      style: opaque
      field: propertyId
    fields:
      propertyName:
        type: string
      latestVersion:
        type: integer
      stagingVersion:
        type: integer
        null_when_unset: true
      productionVersion:
        type: integer
        null_when_unset: true
      contractId:
        type: string
      groupId:
        type: string
      assetId:
        type: string
      accountId:
        type: string

  # GET /papi/v1/properties/{propertyId}/versions and .../versions/{id}.
  # productionStatus and stagingStatus are independent -- see the header.
  property_version:
    id:
      style: numeric
      field: propertyVersion
      type: number
    fields:
      propertyId:
        type: string
        in: "-"
      updatedByUser:
        type: string
      updatedDate:
        type: datetime
      productionStatus:
        type: string
        default: INACTIVE
      stagingStatus:
        type: string
        default: INACTIVE
      etag:
        type: string
      note:
        type: string
        null_when_unset: true
      productId:
        type: string

  # GET /papi/v1/properties/{propertyId}/activations and .../{id}. A
  # richer status enum than property_version's -- see the header for
  # ZONE_1/ZONE_2/ZONE_3, none of which is given a fixture value because no
  # worked example at any of the three was found.
  activation:
    id:
      style: opaque
      field: activationId
    fields:
      activationType:
        type: string
        default: ACTIVATE
      propertyId:
        type: string
        in: "-"
      propertyName:
        type: string
      propertyVersion:
        type: integer
      network:
        type: string
      status:
        type: string
        default: PENDING
      submitDate:
        type: datetime
      updateDate:
        type: datetime
      note:
        type: string
        null_when_unset: true
      notifyEmails:
        type: list

routes:
  - method: GET
    path: /papi/v1/properties/{id}
    resource: property
    operation: get

  # Akamai's own worked example wraps the array two levels deep --
  # {"versions": {"items": [...]}} -- alongside contractId/groupId/
  # accountId at the top level, per
  # techdocs.akamai.com/property-mgr/reference/get-property-versions.
  - method: GET
    path: /papi/v1/properties/{propertyId}/versions
    resource: property_version
    operation: list
    pagination:
      # offset and limit, from Akamai's own Property Manager description
      # read 2026-09-05, which lists both on this route beside contractId
      # and groupId. No default is stated for either, so none is declared
      # and the engine's ten stands as the fallback -- what settles here is
      # that the position is an offset rather than the cursor the runtime
      # was reading.
      style: offset
      limit_param: limit
      cursor_param: offset
    scope: [propertyId]
    list:
      key: versions.items

  - method: GET
    path: /papi/v1/properties/{propertyId}/versions/{id}
    resource: property_version
    operation: get
    scope: [propertyId]

  # {"activations": {"items": [...]}}, the same two-level shape as
  # versions above with the resource's own plural name in place of
  # "versions" -- per
  # techdocs.akamai.com/property-mgr/reference/get-property-activations.
  - method: GET
    path: /papi/v1/properties/{propertyId}/activations
    resource: activation
    operation: list
    pagination:
      # The activations listing takes contractId, groupId and
      # accountSwitchKey and nothing else, from the same description. Those
      # name which account and which property, not which page. A property
      # has the activations it has and they arrive together.
      #
      # Worth the contrast with the versions listing above, which takes
      # offset and limit on the same API and the same property. One
      # provider, two sub-resources of one object, and only one of them
      # pages.
      style: none
    scope: [propertyId]
    list:
      key: activations.items

  - method: GET
    path: /papi/v1/properties/{propertyId}/activations/{id}
    resource: activation
    operation: get
    scope: [propertyId]

errors:
  # Declared only to satisfy this format's requirement of a Recipe-wide
  # authentication_error entry -- never reached by any case below. See the
  # header: this Recipe could not establish what Akamai actually answers
  # for a rejected EdgeGrid credential.
  authentication_error:
    status: 401
    message: Not authenticated.

fixtures:
  empty: {}

  # Every value below is quoted verbatim from Akamai's own published API
  # reference, cited per case, and none of it was observed against a live
  # host -- see the header for why no host existed to observe it against.
  documented-examples:
    property:
      # techdocs.akamai.com/property-mgr/reference/get-property's own
      # worked example -- the header's flagship case for this group's
      # question.
      - id: prp_175780
        propertyName: example.com
        latestVersion: 2
        stagingVersion: 1
        productionVersion: null
        contractId: ctr_K-0N7RAK71
        groupId: grp_32145
        assetId: aid_101
        accountId: act_A-CCT1234

    property_version:
      # techdocs.akamai.com/property-mgr/reference/get-property-versions's
      # own worked example for the version object itself did not state
      # which property it belonged to (propertyId lives in the path, not
      # the version body), so this fixture files it under prp_175780,
      # matching the property fixture above, to give the version routes a
      # property to scope under.
      - id: 2
        propertyVersion: 2
        propertyId: prp_175780
        updatedByUser: jsmith
        updatedDate: "2014-05-10T19:06:13Z"
        productionStatus: INACTIVE
        stagingStatus: ACTIVE
        etag: 5891b5b522d5df08
        note: updated caching
        productId: prd_Alta

    activation:
      # techdocs.akamai.com/property-mgr/reference/get-property-activations's
      # own worked example. Its own propertyId (prp_173136) and
      # propertyVersion (1) are quoted as given, distinct from the
      # property and version examples above -- three separate pages, not
      # one coherent account, and this Recipe is not blending them into
      # one that wasn't published.
      - id: atv_1696985
        activationType: ACTIVATE
        propertyId: prp_173136
        propertyName: example.com
        propertyVersion: 1
        network: STAGING
        status: PENDING
        submitDate: "2014-03-02T02:22:12Z"
        updateDate: "2014-03-01T21:12:57Z"
        note: Sample activation
        notifyEmails:
          - you@example.com
          - them@example.com

conformance:
  - name: a property carries three version numbers, and two of them can disagree
    # The header's flagship case. latestVersion is the newest draft;
    # stagingVersion and productionVersion are what each network actually
    # serves, and here they are not the same number -- one of them is not
    # even a number at all.
    source: https://techdocs.akamai.com/property-mgr/reference/get-property
    fixture: documented-examples
    request:
      method: GET
      path: /papi/v1/properties/prp_175780
      headers:
        Authorization: EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl
    expect:
      status: 200
      body:
        propertyId: prp_175780
        latestVersion: 2
        stagingVersion: 1
        productionVersion: null

  - name: a version's production and staging status are two independent fields
    source: https://techdocs.akamai.com/property-mgr/reference/get-property-versions
    fixture: documented-examples
    request:
      method: GET
      path: /papi/v1/properties/prp_175780/versions/2
      headers:
        Authorization: EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl
    expect:
      status: 200
      body:
        propertyVersion: 2
        productionStatus: INACTIVE
        stagingStatus: ACTIVE
        etag: 5891b5b522d5df08

  - name: an activation is the history of one attempt on one network, not the version's own state
    source: https://techdocs.akamai.com/property-mgr/reference/get-property-activations
    fixture: documented-examples
    request:
      method: GET
      path: /papi/v1/properties/prp_173136/activations/atv_1696985
      headers:
        Authorization: EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl
    expect:
      status: 200
      body:
        activationId: atv_1696985
        network: STAGING
        status: PENDING
        propertyVersion: 1
      absent:
        - productionStatus
        - stagingStatus

  - name: a version list wraps its array two levels deep, beside the property's own identifiers
    # Akamai's own worked example: {"versions": {"items": [...]}}, with
    # contractId/groupId/accountId sitting alongside "versions" rather than
    # inside it. Not a bare array, and not one level of wrapping either --
    # see the route's own comment for the source.
    source: https://techdocs.akamai.com/property-mgr/reference/get-property-versions
    fixture: documented-examples
    request:
      method: GET
      path: /papi/v1/properties/prp_175780/versions
      headers:
        Authorization: EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl
    expect:
      status: 200
      body:
        "versions.items[0].propertyVersion": 2
      absent:
        - items
        - data

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the activation listing answers with what the fixture holds"
    source: "https://techdocs.akamai.com/property-mgr/reference/get-property"
    fixture: documented-examples
    request:
      method: GET
      path: "/papi/v1/properties/prp_173136/activations"
      headers:
        "Authorization": "EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl"
    expect:
      status: 200
      body:
        "activations.items[0].activationId": "atv_1696985"
      absent:
        - "activations.items[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but offset can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "offset moves past the only record, and the page comes back empty"
    source: "https://techdocs.akamai.com/property-mgr/reference/get-property-versions"
    fixture: documented-examples
    request:
      method: GET
      path: "/papi/v1/properties/prp_175780/versions"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "EG1-HMAC-SHA256 client_token=cauldron-akamai-fixture-client-token;access_token=cauldron-akamai-fixture-access-token;timestamp=20260903T00:00:00+0000;nonce=cauldron-fixture-nonce-00000000;signature=Y2F1bGRyb24tYWthbWFpLWZpeHR1cmUtc2lnbmF0dXJl"
    expect:
      status: 200
      absent:
        - "versions.items[0]"


