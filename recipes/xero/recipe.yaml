# Xero Recipe for Cauldron
#
# Accounting is the worst case for testing against a live service. Xero's demo
# company resets on a schedule and cannot be driven from CI, a trial
# organisation expires, and a real organisation contains real books that a test
# must never touch. Most integrations end up with a fixture file and no
# exercise of the API's actual behaviour at all.
#
# Three things this Recipe insists on:
#
#   1. A request for one invoice returns a list of one. The response is
#      {"Invoices": [{...}]}, so client code reads Invoices[0], and anyone
#      expecting a single object gets an array with no warning.
#   2. The Xero-tenant-id header is required. A token can reach several
#      organisations and Xero will not guess which, so omitting it is a
#      failure rather than a default.
#   3. Everything is PascalCase, including the identifier. There is no "id"
#      field anywhere in this API.
#
# Known fidelity gap, stated rather than hidden: some Xero date fields use the
# .NET format, /Date(1518685950940+0000)/. Cauldron emits RFC 3339.
#
# The credential shape needed no organisation, and struck live against
# api.xero.com on 2026-09-05 it found the sentence and the shape both
# wrong. No credential at all, a present garbage bearer token, and a path
# nothing declares all answer byte-identical (aside from a random Instance
# uuid): RFC 7807 problem details -- {Type, Title, Status, Detail,
# Instance, Extensions}, PascalCase -- from the gateway in front of the
# Accounting API, not this file's own {Type, ErrorNumber, Message} shape.
# The sentence lives in Detail and reads "AuthenticationUnsuccessful", not
# "Token is invalid or has expired". Checked before routing: an unrouted
# path gets the identical gateway answer rather than a 404.
#
# Tokens below are fixtures, not secrets.

recipe: xero
capability: accounting
version: 0.1.0

upstream:
  api: "2.0"
  docs: https://developer.xero.com/documentation/api/accounting/overview

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-xero-access-token

# A token can reach several organisations. Xero will not guess which one.
required_headers:
  Xero-tenant-id: parameter_missing

responses:
  list:
    style: wrapped
  # A single object comes back as a list of one under the plural name.
  resource:
    style: wrapped
    array: true
  error:
    style: flat
    type_field: Type
    code_field: ErrorNumber
    message_field: Message

resources:
  invoice:
    collection: Invoices
    id:
      style: uuid
      field: InvoiceID
    fields:
      Type:
        type: string
        default: ACCREC
      InvoiceNumber:
        type: string
      Reference:
        type: string
      # Xero's real lifecycle. An invoice in DRAFT has no effect on the books,
      # and code that treats every invoice in the list as owed money
      # overstates the ledger.
      Status:
        type: string
        default: DRAFT
      LineAmountTypes:
        type: string
        default: Exclusive
      SubTotal:
        type: number
        default: 0
      TotalTax:
        type: number
        default: 0
      Total:
        type: number
        default: 0
      AmountDue:
        type: number
        default: 0
      AmountPaid:
        type: number
        default: 0
      CurrencyCode:
        type: string
        default: GBP
      # Xero sends every date twice, and the one with the obvious name is the
      # one that does not work. Date is Microsoft's format --
      # /Date(1552262400000+0000)/ -- which no ordinary parser accepts, so
      # new Date(invoice.Date) is Invalid Date. DateString beside it is ISO,
      # and is the one to read.
      #
      # Xero's own description says so without meaning to: it marks Date with
      # x-is-msdate and declares UpdatedDateUTCString next to UpdatedDateUTC,
      # the same pairing. DateString itself it does not declare, though its
      # sibling is declared, so check reports it every time.
      #
      # Date was missing from this Recipe entirely until msdate existed,
      # which was the worse half: a client reading the field Xero documents
      # first found nothing here and an unusable string in production.
      Date:
        type: msdate
      DateString:
        type: datetime
      # The same pairing again, and this Recipe explained the trap above and
      # then fell into it here. UpdatedDateUTC was declared as a plain
      # datetime, so it read as ISO from this emulator and arrives from Xero
      # as /Date(...)/ -- the exact bug the comment above exists to prevent,
      # on the second date field rather than the first.
      #
      # Xero's own description marks it x-is-msdate-time and declares
      # UpdatedDateUTCString beside it as "UTC ISO-8601 formatted timestamp".
      # That sibling was not modelled at all, so the readable form of the
      # field was unavailable here and the unreadable one was wrong.
      UpdatedDateUTC:
        type: msdate
      UpdatedDateUTCString:
        type: datetime

  contact:
    collection: Contacts
    id:
      style: uuid
      field: ContactID
    fields:
      Name:
        type: string
        required: true
      ContactNumber:
        type: string
      EmailAddress:
        type: string
      ContactStatus:
        type: string
        default: ACTIVE
      IsSupplier:
        type: boolean
        default: false
      IsCustomer:
        type: boolean
        default: false
      # Microsoft's format here too. Xero marks it x-is-msdate-time on every
      # object that has it, and declares no UpdatedDateUTCString beside this
      # one -- so the readable sibling the invoice has is not modelled here,
      # because the description does not say it exists.
      UpdatedDateUTC:
        type: msdate

  account:
    collection: Accounts
    id:
      style: uuid
      field: AccountID
    fields:
      Code:
        type: string
        required: true
      Name:
        type: string
        required: true
      Type:
        type: string
        default: REVENUE
      TaxType:
        type: string
        default: OUTPUT2
      Class:
        type: string
        default: REVENUE
      EnablePaymentsToAccount:
        type: boolean
        default: false
      # Microsoft's format here too. Xero marks it x-is-msdate-time on every
      # object that has it, and declares no UpdatedDateUTCString beside this
      # one -- so the readable sibling the invoice has is not modelled here,
      # because the description does not say it exists.
      UpdatedDateUTC:
        type: msdate

routes:
  - method: GET
    path: /api.xro/2.0/Invoices
    resource: invoice
    operation: list
    pagination:
      # Checked against Xero's own OpenAPI description: page and pageSize in
      # the query, counting from one. Neither was read while this said limit,
      # so the first response held every record and reported no next page.
      style: page
      limit: 100
      limit_param: pageSize
      cursor_param: page

  - method: POST
    path: /api.xro/2.0/Invoices
    resource: invoice
    operation: create
    emits: INVOICE.CREATE

  - method: GET
    path: /api.xro/2.0/Invoices/{id}
    resource: invoice
    operation: get

  - method: POST
    path: /api.xro/2.0/Invoices/{id}
    resource: invoice
    operation: update
    emits: INVOICE.UPDATE

  - method: GET
    path: /api.xro/2.0/Contacts
    resource: contact
    operation: list
    pagination:
      # Checked against Xero's own OpenAPI description: page and pageSize in
      # the query, counting from one. Neither was read while this said limit,
      # so the first response held every record and reported no next page.
      style: page
      limit: 100
      limit_param: pageSize
      cursor_param: page

  - method: POST
    path: /api.xro/2.0/Contacts
    resource: contact
    operation: create
    emits: CONTACT.CREATE

  - method: GET
    path: /api.xro/2.0/Contacts/{id}
    resource: contact
    operation: get

  - method: GET
    path: /api.xro/2.0/Accounts
    resource: account
    operation: list
    pagination:
      # Checked against Xero's own OpenAPI description: the Accounts endpoint
      # takes neither page nor pageSize -- unlike Invoices and Contacts
      # beside it -- and answers with every account.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

  - method: GET
    path: /api.xro/2.0/Accounts/{id}
    resource: account
    operation: get

webhooks:
  events:
    - INVOICE.CREATE
    - INVOICE.UPDATE
    - CONTACT.CREATE
    - CONTACT.UPDATE
  signing:
    scheme: hmac-sha256
    header: x-xero-signature
    secret: cauldron-webhook-key

errors:
  rate_limit:
    status: 429
    code: "0"
    type: RateLimitException
    message: Rate limit exceeded
    headers:
      Retry-After: "60"
      X-Rate-Limit-Problem: minute

  # Verified live against api.xero.com 2026-09-05: no credential at all, a
  # present garbage bearer token, and a path nothing declares all answer
  # byte-identical (aside from a random Instance uuid) -- checked before
  # routing, at the gateway rather than the Accounting API this Recipe
  # otherwise models. The shape is not this file's {Type, ErrorNumber,
  # Message}; it is RFC 7807 problem details, PascalCase, with a sentence
  # this file had also gotten wrong.
  authentication_error:
    status: 401
    style: flat
    message_field: Detail
    code_field: "-"
    message: AuthenticationUnsuccessful
    fields:
      Type: null
      Title: Unauthorized
      Status: 401
      Extensions: {}

  resource_missing:
    status: 404
    code: "16"
    type: NoDataProcessedException
    message: "The resource could not be found: {detail}"

  parameter_missing:
    status: 400
    code: "10"
    type: ValidationException
    message: "A validation exception occurred: {detail} is required"

  # The failures accounting integrations actually hit, and that a demo company
  # cannot be made to produce on request.
  account_code_not_valid:
    status: 400
    code: "10"
    type: ValidationException
    message: Account code must be specified and must be valid.

  invoice_not_editable:
    status: 400
    code: "10"
    type: ValidationException
    message: Invoice not of valid status for modification. An invoice that has been paid cannot be edited.

  # Xero refuses a duplicate invoice number outright, which is what breaks a
  # retried import halfway through.
  duplicate_invoice_number:
    status: 400
    code: "10"
    type: ValidationException
    message: Invoice # must be unique.

fixtures:
  empty: {}

  small-org:
    contact:
      - id: 11111111-1111-4111-8111-111111111111
        Name: Analytical Engines
        ContactNumber: CUST-1001
        EmailAddress: ada@example.com
        IsCustomer: true
      - id: 22222222-2222-4222-8222-222222222222
        Name: Paper Supplies Ltd
        IsSupplier: true
    invoice:
      - id: 33333333-3333-4333-8333-333333333333
        Type: ACCREC
        InvoiceNumber: INV-0001
        Status: AUTHORISED
        SubTotal: 1000
        TotalTax: 200
        Total: 1200
        AmountDue: 1200
        CurrencyCode: GBP
      - id: 44444444-4444-4444-8444-444444444444
        Type: ACCREC
        InvoiceNumber: INV-0002
        # A draft has no effect on the books. Code that treats every invoice
        # in the list as owed money overstates the ledger.
        Status: DRAFT
        SubTotal: 500
        Total: 500
        AmountDue: 500
      - id: 55555555-5555-4555-8555-555555555555
        Type: ACCREC
        InvoiceNumber: INV-0003
        Status: PAID
        Total: 300
        AmountDue: 0
        AmountPaid: 300
    account:
      - id: 66666666-6666-4666-8666-666666666666
        Code: "200"
        Name: Sales
        Type: REVENUE
        TaxType: OUTPUT2

# Conformance cases, read from Xero's Accounting API reference rather than
# observed against a live organisation. The verify report says so.
conformance:
  - name: no credential at all is RFC 7807 problem details, not this file's own error shape
    source: https://api.xero.com/api.xro/2.0/Invoices
    verified: "2026-09-05"
    request:
      method: GET
      path: /api.xro/2.0/Invoices
    expect:
      status: 401
      body:
        Type: null
        Title: Unauthorized
        Status: 401
        Detail: AuthenticationUnsuccessful
        Extensions: {}
      absent:
        - ErrorNumber
        - Message

  - name: a present, garbage bearer token answers byte-identical
    source: https://api.xero.com/api.xro/2.0/Invoices
    verified: "2026-09-05"
    request:
      method: GET
      path: /api.xro/2.0/Invoices
      headers:
        Authorization: Bearer garbage_invalid_000
    expect:
      status: 401
      body:
        Title: Unauthorized
        Detail: AuthenticationUnsuccessful

  - name: and so does a path nothing declares -- checked before routing, not after
    source: https://api.xero.com/api.xro/2.0/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No credential sent. The gateway answers the same way regardless of
      # whether the path exists.
      path: /api.xro/2.0/not-a-real-endpoint
    expect:
      status: 401
      body:
        Title: Unauthorized
        Detail: AuthenticationUnsuccessful

  - name: a request for one invoice returns a list of one
    source: https://developer.xero.com/documentation/api/accounting/invoices
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      body:
        # Invoices[0], not Invoice. Anyone expecting an object gets an array
        # with no warning at all.
        Invoices[0].InvoiceNumber: INV-0001
        Invoices[0].Status: AUTHORISED
        Invoices[0].AmountDue: 1200
      absent:
        - invoice
        - Invoice
        - Invoices[1]

  - name: the date with the obvious name is the one that does not parse
    # Xero sends every date twice. Date is Microsoft's format and is not a
    # date to anything that reads it: new Date(invoice.Date) is Invalid Date,
    # and Date.parse returns NaN. DateString beside it is ISO and is the one
    # to use.
    #
    # The trap is which name a developer reaches for first. Date was missing
    # from this Recipe altogether, so the field Xero documents first read as
    # undefined here and as an unusable string in production -- a bug that
    # only ever appears against the real API.
    source: https://developer.xero.com/documentation/api/accounting/types
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      body:
        Invoices[0].Date: "/Date(1767225600000+0000)/"
        Invoices[0].DateString: "2026-01-01T00:00:00Z"

  - name: and the same pairing on the timestamp nobody reads first
    # UpdatedDateUTC is the field a sync keys on, and it is Microsoft's format
    # like Date is: Xero marks it x-is-msdate-time in its own description and
    # declares UpdatedDateUTCString beside it as the ISO one.
    #
    # This Recipe modelled UpdatedDateUTC as a plain datetime and did not
    # model its sibling at all, which is the trap described one field up. A
    # sync comparing invoice.UpdatedDateUTC to a stored timestamp worked here
    # and compared a parseable string to /Date(...)/ against Xero.
    source: https://developer.xero.com/documentation/api/accounting/types
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/33333333-3333-4333-8333-333333333333
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      matches:
        # Microsoft's, and unreadable to every ordinary parser.
        Invoices[0].UpdatedDateUTC: '^/Date\([0-9]+\+0000\)/$'
        # ISO, and the one to compare against anything.
        Invoices[0].UpdatedDateUTCString: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'

  - name: a request without the tenant header is refused
    source: https://developer.xero.com/documentation/guides/how-to-guides/xero-oauth2-app/
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices
      headers:
        Authorization: Bearer cauldron-xero-access-token
    expect:
      # A token can reach several organisations and Xero will not guess which.
      status: 400
      body:
        Type: ValidationException
        ErrorNumber: 10

  - name: the identifier is InvoiceID, and there is no id anywhere
    source: https://developer.xero.com/documentation/api/accounting/invoices
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      matches:
        Invoices[0].InvoiceID: '^[0-9a-f-]{36}$'
      absent:
        - Invoices[0].id

  - name: a draft invoice is not money owed
    source: https://developer.xero.com/documentation/api/accounting/types
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/44444444-4444-4444-8444-444444444444
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      body:
        # Code that sums AmountDue across every invoice in the list without
        # checking Status overstates the ledger by this much.
        Invoices[0].Status: DRAFT
        Invoices[0].AmountDue: 500

  - name: a paid invoice owes nothing
    source: https://developer.xero.com/documentation/api/accounting/types
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/55555555-5555-4555-8555-555555555555
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      body:
        Invoices[0].Status: PAID
        Invoices[0].AmountDue: 0
        Invoices[0].AmountPaid: 300

  - name: a failure is flat and PascalCase, with a Type and an ErrorNumber
    source: https://developer.xero.com/documentation/api/accounting/requests-and-responses
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices/99999999-9999-4999-8999-999999999999
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 404
      body:
        Type: NoDataProcessedException
        ErrorNumber: 16
      matches:
        Message: 'could not be found'
      absent:
        - error
        - errors
        - message

  - name: contacts and accounts use the same list envelope
    source: https://developer.xero.com/documentation/api/accounting/contacts
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Contacts
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
    expect:
      status: 200
      body:
        Contacts[0].Name: Analytical Engines
        Contacts[0].IsCustomer: true
        Contacts[1].IsSupplier: true
      absent:
        - data
        - Contacts[2]

  - name: invoices page by pageSize and page, counting from one
    # Not "limit", which Xero does not accept. Read from the wrong name
    # nothing was there, so the first response held every invoice and
    # reported no next page.
    source: https://raw.githubusercontent.com/XeroAPI/Xero-OpenAPI/master/xero_accounting.yaml
    fixture: small-org
    request:
      method: GET
      path: /api.xro/2.0/Invoices
      headers:
        Authorization: Bearer cauldron-xero-access-token
        Xero-tenant-id: cauldron-tenant
      query:
        pageSize: "1"
        page: "2"
    expect:
      status: 200
      body:
        # The second invoice, because Xero counts pages from one.
        Invoices[0].InvoiceNumber: INV-0002
      absent:
        - Invoices[1]

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the account listing answers with what the fixture holds"
    source: "https://developer.xero.com/documentation/api/accounting/invoices"
    fixture: small-org
    request:
      method: GET
      path: "/api.xro/2.0/Accounts"
      headers:
        "Authorization": "Bearer cauldron-xero-access-token"
        "Xero-tenant-id": "cauldron-tenant"
    expect:
      status: 200
      body:
        "Accounts[0].AccountID": "66666666-6666-4666-8666-666666666666"
      absent:
        - "Accounts[1]"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if pageSize was read --
  # with the name ignored the whole collection comes back, because the
  # whole collection is two records. No third record is needed for that,
  # and none is invented.
  - name: "pageSize is read, because a page of one out of two is not the whole collection"
    source: "https://developer.xero.com/documentation/api/accounting/contacts"
    fixture: small-org
    request:
      method: GET
      path: "/api.xro/2.0/Contacts"
      query:
        "pageSize": "1"
      headers:
        "Authorization": "Bearer cauldron-xero-access-token"
        "Xero-tenant-id": "cauldron-tenant"
    expect:
      status: 200
      body:
        "Contacts[0].ContactID": "11111111-1111-4111-8111-111111111111"
      absent:
        - "Contacts[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://developer.xero.com/documentation/api/accounting/contacts"
    fixture: small-org
    request:
      method: GET
      path: "/api.xro/2.0/Contacts"
      query:
        "pageSize": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer cauldron-xero-access-token"
        "Xero-tenant-id": "cauldron-tenant"
    expect:
      status: 200
      body:
        "Contacts[0].ContactID": "22222222-2222-4222-8222-222222222222"
      absent:
        - "Contacts[1]"

  # The names. This Recipe declares 4 field(s) on a account that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "an account carries the field names this Recipe declares"
    source: "https://developer.xero.com/documentation/api/accounting/invoices"
    fixture: small-org
    request:
      method: GET
      path: "/api.xro/2.0/Accounts"
      headers:
        "Authorization": "Bearer cauldron-xero-access-token"
        "Xero-tenant-id": "cauldron-tenant"
    expect:
      status: 200
      body:
        "Accounts[0].Class": "REVENUE"
        "Accounts[0].Code": "200"
        "Accounts[0].EnablePaymentsToAccount": false
        "Accounts[0].TaxType": "OUTPUT2"

  # The names. This Recipe declares 3 field(s) on a contact that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a contact carries the field names this Recipe declares"
    source: "https://developer.xero.com/documentation/api/accounting/contacts"
    fixture: small-org
    request:
      method: GET
      path: "/api.xro/2.0/Contacts"
      headers:
        "Authorization": "Bearer cauldron-xero-access-token"
        "Xero-tenant-id": "cauldron-tenant"
    expect:
      status: 200
      body:
        "Contacts[0].ContactNumber": "CUST-1001"
        "Contacts[0].ContactStatus": "ACTIVE"
        "Contacts[0].EmailAddress": "ada@example.com"

  # The names. This Recipe declares 6 field(s) on a invoice that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
