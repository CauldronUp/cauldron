# Budibase Recipe for Cauldron
#
# Budibase matches neither of the two shapes named for this batch. Retool's
# Recipe in this collection found there is no data-table API at all, only
# organisation management -- Budibase is the opposite of that: the smallest
# addressable record really is a row, tables really do have caller-defined
# columns, and /tables/{tableId}/rows/{rowId} is a genuine data-bearing GET,
# not an administrative one. NocoDB's Recipe found an auth order that flips
# on whether the route names an id -- Budibase's does not flip on that at
# all: the same two-header gate runs identically whether the path names a
# table, a row, or neither, checked live on both a collection route
# (/tables/search) and a record route (/tables/{tableId}/rows/{rowId}). Its
# nearest relative already in this collection is Algolia, which also needs
# two headers to reach anything and already uses required_headers to say so
# -- but Algolia's Recipe only had to model one gate beyond the credential.
# Budibase, checked live, has three, and this Recipe can only reach two of
# them.
#
# **The host named for this Recipe is not the API.** api.budibase.app
# resolves, answers on the same Cloudflare edge as budibase.app, and every
# request to it answers 404 {"message":"Tenant not found"} with
# x-budibase-tenant-id: api on the response. Budibase's cloud is
# multi-tenant by subdomain -- a real tenant lives at
# https://<tenant>.budibase.app -- and "api" is not a tenant anybody
# provisioned, not a separate API surface. The actual public API is served
# from the same host as the builder UI, budibase.app itself, at
# /api/public/v1/*. Checked live, both ways, on the date below.
#
# **Three gates, checked in order, and this Recipe can reach the first two.**
#
#   (no headers at all)                                -> 400 Invalid app ID
#   x-budibase-app-id: app_ws_00000000...  (no key)     -> 400 Invalid API key
#   x-budibase-app-id: app_ws_00000000...
#     x-budibase-api-key: junkjunkjunk                  -> 401 Session not authenticated
#
# The first two are format checks and collapse absent with malformed: a
# header carrying no value at all and one carrying "totallyrandomjunk" (no
# app_ prefix) answer the identical "Invalid app ID" sentence, live-checked
# both ways. Once x-budibase-app-id merely has the right shape, the gate
# moves on to the next header and asks nothing further about the first --
# checked live by sending an app-id-shaped value nobody holds and reaching
# the api-key sentence, not a third repetition of the app-id one. Only once
# *both* headers are present does the third gate answer, and it is not a
# format check: "Session not authenticated" is what a syntactically fine
# api-key gets when it is not a session Budibase's own store recognises,
# checked live with a garbage value that passed both of the first two gates
# cleanly. That third gate is the one this Recipe cannot reproduce.
# Cauldron checks one credential (here, x-budibase-app-id, by pattern) and
# then one required_headers presence check (x-budibase-api-key) in that
# fixed order -- the same order this host uses for its own first two gates,
# which is what makes them reachable at all. There is no third stage: once
# both of this Recipe's own gates pass, Cauldron considers the request
# authenticated and serves the matched route. So the fixture credential
# this Recipe's own routes accept is not a credential Budibase itself ever
# accepted -- it was checked live and refused with "Session not
# authenticated" every time. The 200s below describe the documented shape
# of a real session's answer, the same "read from the description, not
# observed" standing every doc-sourced case elsewhere in this collection
# already carries, with one thing added: this Recipe also has live proof
# that its own accepted shape was tried and specifically rejected, not
# merely never attempted.
#
# **A row's id carries its table's id inside it, literally.** Budibase's own
# worked example: a row in table ta_5b1649e42a5b41dea4ef7742a36a7a70 has id
# ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4 --
# "ro_" plus the table's own id plus an underscore plus a suffix. tableId is
# also sent as its own field on every row alongside that id, so nothing
# about addressing a row depends on parsing it out -- but a client that
# assumes an id is opaque and stores it as a bare key is one string-split
# away from a table id it already had another field for.
#
# **The vendor's own docs still say "app" throughout the "workspace"
# endpoints.** Budibase is mid-rename: every /applications/* route in its
# published description is marked deprecated, and /workspaces/* is not --
# Create/Update/Search all exist under both names. Read the schemas rather
# than the paths and the rename has not finished: workspaceOutput is a
# byte-for-byte copy of applicationOutput, down to descriptions that still
# read "The name of the app," "The status of the app, stating it if is the
# development or published version," on the resource with the new name.
# The example objects for both "application" and "workspace" are the exact
# same JSON, and neither is what its own schema calls the identifying
# field: `_id` is "app_metadata" -- a constant, the same on every app,
# because it is a CouchDB document id inside a per-app database rather than
# a value that varies across apps -- and the field that actually is unique,
# appId, is not listed among applicationOutput's or workspaceOutput's own
# declared properties at all. And the docs' own prose for the header this
# Recipe's first gate checks calls it, in one sentence, both things at
# once: "this header is used to provide the unique Workspace ID for your
# app." This Recipe does not route /applications or /workspaces at all --
# see the fidelity gaps -- because the finding worth keeping is this
# paragraph, not a fixture built on a schema the vendor has not settled.
#
# **hasNextPage has no equivalent in this format, and saying so matters.**
# Row search pages with a bookmark and a boolean, documented as: "If
# pagination in use, this will determine if there is another page to
# fetch." This format's complete_field expects the opposite sense -- a
# field that is true when NO pages remain -- and there is no invert. Mapping
# hasNextPage onto complete_field would tell a paging loop the wrong thing
# on purpose. Left undeclared; a caller of this Recipe's own search route
# reads hasNextPage off the body directly rather than through the paging
# vocabulary.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The third auth gate (session validity) cannot be reproduced -- see
#     above. Every 200 below is read from Budibase's own published OpenAPI
#     description (raw.githubusercontent.com/Budibase/budibase, master,
#     packages/server/specs/openapi.yaml) and carries no verified date.
#   - /applications and /workspaces are not routed at all. See the header:
#     the finding is the schemas disagreeing with their own rename, not a
#     shape worth serving as a fixture.
#   - The row query language (string, fuzzy, range, equal, notEqual, empty,
#     notEmpty, oneOf, contains, notContains, containsAny, sort) is real,
#     documented on rowSearch, and not modelled -- this Recipe's own search
#     route accepts a body and ignores its query entirely, the same
#     boundary Algolia's Recipe draws around its own filter syntax.
#   - update (PUT) and delete (DELETE) on a row are real, documented, and
#     not modelled; create and the two reads already carry this Recipe's
#     findings twice over.
#   - Rate limiting is real -- every response this Recipe received carried
#     x-ratelimit-limit: 10 and a counting-down x-ratelimit-remaining, even
#     the ones refused before any credential was read -- and no 429 was
#     triggered; this project does not retry into a limit. Neither header
#     is declared or asserted below: a static fixture cannot count down a
#     remaining value the way the live host does, and asserting the limit
#     alone would claim half a mechanism.
#   - No 405 was found. PATCH and a nonexistent path both under
#     /api/public/v1/ were not struck for this Recipe; every failure this
#     Recipe did strike was a credential gate, never a routing miss, so no
#     unknown_route or method_not_allowed case is claimed either way.
#
# The header and api-key values below are fixtures and belong to no
# workspace.

recipe: budibase
capability: database
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.budibase.com/docs/public-api
  spec: https://raw.githubusercontent.com/Budibase/budibase/master/packages/server/specs/openapi.yaml
  spec_hash: c0867f53cc272d6262399665fe6e99203d06cd516d5c7e49e132ac7f2824a004
  spec_seen: "2026-09-01"

auth:
  # The first of the two gates this Recipe can reach. Pattern-based rather
  # than a fixed key list, the same device AWS SigV4 Recipes in this
  # collection use for a value that is computed per caller rather than
  # issued from a fixed set: Budibase's own docs describe the shape
  # ("should start with app_ (production) or app_dev (development)") and
  # any value matching it clears this gate live, whether or not the app
  # behind it is real. See the header: absent and malformed both land on
  # the identical sentence, checked live both ways.
  scheme: header
  header: x-budibase-app-id
  # Documented as app_ or app_dev_ followed by hex; checked live, this gate
  # also clears app_ws_00000000000000000000000000000000 -- a third prefix
  # the docs do not name, and the one this Recipe's own fixture uses below.
  pattern: "^app_[a-z0-9_]+$"
  absent_error: invalid_app_id
  malformed_error: invalid_app_id

# The second gate. Presence only -- see the header: any nonempty value
# reaches the third, unreproducible gate rather than a further shape check
# here, which is exactly what required_headers checks and nothing more.
required_headers:
  x-budibase-api-key: invalid_api_key

responses:
  list:
    style: wrapped
  resource:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: message
    status_field: status
    code_field: "-"

resources:
  table:
    collection: data
    id:
      style: prefixed
      prefix: "ta_"
    fields:
      name:
        type: string
        required: true
      # Column definitions, keyed by the caller's own field names -- the
      # same free-form shape Stripe's metadata already models in this
      # collection, because a fixed schema cannot describe a schema that is
      # itself per-table.
      schema:
        type: map

  row:
    collection: data
    # ro_ta_<owning table's own id>_<suffix> -- see the header. Not modelled
    # as a composite; this format has no style for an id that embeds
    # another record's id verbatim, so the fixture below carries the real
    # shape and this comment carries the claim.
    id:
      style: opaque
    fields:
      # Echoed on every row Budibase's own examples show, unlike NocoDB's
      # table_id in this collection, which the provider never repeats in
      # the body.
      tableId:
        type: string
        required: true
      name:
        type: string
      age:
        type: integer
      # A list of related rows. Its own shape depends on which route
      # answered -- see the header's citation of rowGetById's own
      # description ("enriched with the full related rows, rather than the
      # squashed 'primaryDisplay' format returned by the search endpoint")
      # -- and this format has no per-route field-shape override, so the
      # two fixtures below each carry the shape their own route documents
      # rather than forcing one on both.
      relationship:
        type: list

routes:
  - method: POST
    path: /tables/search
    resource: table
    operation: list
    pagination:
      # The body is a single name to match, from Budibase's own openapi.yaml
      # read 2026-09-05. No size, no position: a search over an app's tables
      # answers the tables that matched.
      #
      # So this does not page, and the runtime was serving ten of it while
      # reading a "limit" nobody sends.
      style: none

  - method: POST
    path: /tables/{tableId}/rows/search
    resource: row
    operation: list
    scope: [tableId]
    pagination:
      style: cursor
      # "For internal tables this will be limited to 1000, for SQL tables it
      # will be 5000" -- Budibase's own words; the internal figure is the
      # one served here.
      limit: 1000
      limit_param: limit
      cursor_param: bookmark

  - method: GET
    path: /tables/{tableId}/rows/{id}
    resource: row
    operation: get
    scope: [tableId]

  - method: POST
    path: /tables/{tableId}/rows
    resource: row
    operation: create
    scope: [tableId]

errors:
  invalid_app_id:
    status: 400
    message: Invalid app ID provided, please check the x-budibase-app-id header.

  invalid_api_key:
    status: 400
    message: Invalid API key provided, please check the x-budibase-api-key header.

fixtures:
  empty: {}

  # Budibase's own worked examples, quoted rather than invented -- see the
  # header for why every 200 case below carries no verified date.
  demo:
    table:
      - id: ta_5b1649e42a5b41dea4ef7742a36a7a70
        name: People
        schema:
          name:
            type: string
            name: name
          age:
            type: number
            name: age
          relationship:
            type: link
            name: relationship
            relationshipType: many-to-many

    row:
      # The search/list shape: relationship squashed to primaryDisplay + id.
      - id: ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4
        tableId: ta_5b1649e42a5b41dea4ef7742a36a7a70
        name: Mike
        age: 30
        relationship:
          - primaryDisplay: Joe
            _id: ro_ta_users_us_8f3d717147d74d759d8cef5b6712062f

  # A separate fixture for the single-row GET, whose own route documents a
  # deeper shape than search's -- see the header and the row field's own
  # comment.
  demo-enriched:
    row:
      - id: ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4
        tableId: ta_5b1649e42a5b41dea4ef7742a36a7a70
        name: eg
        relationship:
          - _id: ro_ta_users_us_8f3d717147d74d759d8cef5b6712062f
            name: Joe
            tableId: ta_users

conformance:
  - name: no headers at all is refused for the app id first
    source: https://budibase.app/api/public/v1/tables/search
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /tables/search
    expect:
      status: 400
      body:
        message: Invalid app ID provided, please check the x-budibase-app-id header.

  - name: a value with no app_ prefix at all answers the identical sentence, not a different one
    source: https://budibase.app/api/public/v1/tables/search
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /tables/search
      headers:
        x-budibase-app-id: totallyrandomjunk
    expect:
      status: 400
      body:
        message: Invalid app ID provided, please check the x-budibase-app-id header.

  - name: an app-id-shaped header nobody holds clears the first gate and reaches the second
    source: https://budibase.app/api/public/v1/tables/search
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /tables/search
      headers:
        x-budibase-app-id: app_ws_00000000000000000000000000000000
    expect:
      status: 400
      body:
        message: Invalid API key provided, please check the x-budibase-api-key header.

  - name: the identical two gates run in the identical order on an id-addressed route too
    # NocoDB's Recipe in this collection finds an id changing which check
    # runs first; Budibase's does not. Struck against the record route
    # rather than the collection one, same result.
    source: https://budibase.app/api/public/v1/tables/mtcauldron/rows/1
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /tables/mtcauldron/rows/1
    expect:
      status: 400
      body:
        message: Invalid app ID provided, please check the x-budibase-app-id header.

  - name: a table listing wraps its array under data
    source: https://raw.githubusercontent.com/Budibase/budibase/master/packages/server/specs/openapi.yaml
    fixture: demo
    request:
      method: POST
      path: /tables/search
      headers:
        x-budibase-app-id: app_ws_00000000000000000000000000000000
        x-budibase-api-key: cauldron-budibase-fixture-key-0000000000000000
      json:
        name: People
    expect:
      status: 200
      body:
        "data[0].name": People
        "data[0].id": ta_5b1649e42a5b41dea4ef7742a36a7a70

  - name: a row's id carries its own table's id inside it, and tableId is sent too
    source: https://raw.githubusercontent.com/Budibase/budibase/master/packages/server/specs/openapi.yaml
    fixture: demo
    request:
      method: POST
      path: /tables/ta_5b1649e42a5b41dea4ef7742a36a7a70/rows/search
      headers:
        x-budibase-app-id: app_ws_00000000000000000000000000000000
        x-budibase-api-key: cauldron-budibase-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        "data[0].id": ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4
        "data[0].tableId": ta_5b1649e42a5b41dea4ef7742a36a7a70
        "data[0].relationship[0].primaryDisplay": Joe
      absent:
        - "data[0].relationship[0].name"

  - name: fetching one row by id answers the enriched shape search does not
    # rowGetById's own description, quoted in the header: "enriched with the
    # full related rows, rather than the squashed primaryDisplay format
    # returned by the search endpoint."
    source: https://raw.githubusercontent.com/Budibase/budibase/master/packages/server/specs/openapi.yaml
    fixture: demo-enriched
    request:
      method: GET
      path: /tables/ta_5b1649e42a5b41dea4ef7742a36a7a70/rows/ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4
      headers:
        x-budibase-app-id: app_ws_00000000000000000000000000000000
        x-budibase-api-key: cauldron-budibase-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        "data.relationship[0].name": Joe
        "data.relationship[0].tableId": ta_users
      absent:
        - "data.relationship[0].primaryDisplay"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but bookmark can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "bookmark moves past the only record, and the page comes back empty"
    source: "https://raw.githubusercontent.com/Budibase/budibase/master/packages/server/specs/openapi.yaml"
    fixture: demo
    request:
      method: POST
      path: "/tables/ta_5b1649e42a5b41dea4ef7742a36a7a70/rows/search"
      query:
        "limit": "1"
        "bookmark": "ro_ta_5b1649e42a5b41dea4ef7742a36a7a70_e6dc7e38cf1343b2b56760265201cda4"
      headers:
        "x-budibase-app-id": "app_ws_00000000000000000000000000000000"
        "x-budibase-api-key": "cauldron-budibase-fixture-key-0000000000000000"
    expect:
      status: 200
      absent:
        - "data[0]"

