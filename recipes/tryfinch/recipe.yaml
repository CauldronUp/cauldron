# Finch Recipe for Cauldron
#
# The employee directory, read from the OpenAPI document Finch serves without a
# credential at api.tryfinch.com/openapi.json, and struck live on 2026-09-13
# with no header at all, with a wrong bearer, on a path that does not exist,
# with a method the path does not take, and with a version header Finch does
# not know.
#
# **Nothing gets past the version header.** Struck live, with no
# `Finch-API-Version` on the request:
#
#   GET /employer/directory          400  Missing 'Finch-API-Version' header
#   GET /employer/directory + token  400  Missing 'Finch-API-Version' header
#   GET /cauldron-nope               400  Missing 'Finch-API-Version' header
#   PUT /employer/directory          400  Missing 'Finch-API-Version' header
#
# A wrong path, a wrong method and a wrong credential are all indistinguishable
# until the header is right. And the header is declared in the document as a
# *parameter*, `required: true`, with `default: "2020-09-17"` -- so a generated
# client fills it in and a hand-written one does not, and the two have entirely
# different first experiences of the API.
#
# **Its pattern is unanchored.**
# `([12]\d{3}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]))`, with no `^` and no `$`,
# on a `format: date` string. Any value containing a date anywhere passes the
# declared check.
#
# **The 401 tells you the name of the middleware.** A wrong token answers
# "AUTHENTICATION MIDDLEWARE: could not match any resolver for the token
# format" -- capitals, a colon, and an internal word ("resolver") that exists
# nowhere in the documentation.
#
# **And the vendor's own error code is missing exactly from the credential
# failures.** Every other failure carries `finch_code` beside `name`:
#
#   400  name: invalid_request_error   finch_code: invalid_request
#   404  name: not_found_error         finch_code: item_not_found
#   401  name: unauthorized_request_error   (no finch_code)
#   401  name: invalid_token_error          (no finch_code)
#
# The field a client switches on to stay version-independent is absent from the
# two failures every integration meets first. And where it is present, `name`
# and `finch_code` say the same word with and without `_error` -- except the
# 404, where one says "route" and the other says "item".
#
# **And the operation declares 200, 202 and 422 -- so neither 401 nor the 404
# is in the contract at all.** Drift reports all four of this Recipe's
# credential and routing failures as unbacked, and each report is right: the
# document describes the 400 for a bad version and the 422 for a bad request,
# and nothing for being refused.
#
# **A 202 on a GET is shaped exactly like a failure.** The document's own
# example: `{"code": 202, "name": "sync_in_progress", "finch_code":
# "data_sync_in_progress", "message": "The data being requested is being
# fetched. Please check back later."}` -- the same four keys as every error, on
# a successful status. Code that decides "this body has `code` and `name`, so it
# is an error" is right every time except this one.
#
# **The identifier pattern accepts a uuid with no hyphens, and any string
# containing one.** `[0-9a-fA-F]{8}[-]?(?:[0-9a-fA-F]{4}[-]?){3}[0-9a-fA-F]{12}`
# is unanchored and every hyphen in it is optional, under a description that
# reads "A stable Finch `id` (UUID v4)".
#
# **Every field but the identifier is nullable.** `first_name`, `middle_name`,
# `last_name`, `manager`, `department` and `is_active` are each
# `nullable: true`, so an individual in the directory may have no name -- and
# `is_active` is a boolean with three states, on "is this person employed".
#
# **The count is optional and the offset is not.** `Paging` requires `offset`
# and leaves `count`, "the total number of elements for the entire query", out
# of `required`.
#
# Also pinned: nine `/sandbox/` paths in the production document, at the
# production host, beside the real ones; `/employer/individual` and
# `/employer/employment` are POSTs that read; and the document's version is the
# same date the header wants, so the API's version and its request header are
# one string in two places.

recipe: tryfinch
capability: hr
version: 0.1.0

upstream:
  api: "2020-09-17"
  docs: https://developer.tryfinch.com
  spec: https://api.tryfinch.com/openapi.json
  spec_hash: 5b995af1fa025de8cfb34c3b88fcbce0efaf0f11aa4baf32dac8ed83ff25ed69
  spec_seen: "2026-09-13"

required_headers:
  Finch-API-Version:
    error: missing_version_header

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xtureacc3ssto0000000000000
  absent_error: unauthorized_request
  rejected_error: invalid_token
  malformed_error: invalid_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: individuals
    # Optional, where the offset beside it is required.
    count_field: paging.count
    page_field: paging.offset
  error:
    style: flat
    message_field: message
    # invalid_request_error, not_found_error, invalid_token_error.
    code_field: name
    status_field: code

resources:
  individual:
    id:
      field: id
      # Declared by a pattern that is unanchored and whose hyphens are all
      # optional.
      style: uuid
    fields:
      # Every one of these is nullable.
      first_name:
      middle_name:
      last_name:
      manager:
      department:
      # A boolean with three states.
      is_active:

routes:
  - method: GET
    path: /employer/directory
    resource: individual
    operation: list
    pagination:
      style: offset
      first_page: 0
      limit: 100
      limit_param: limit
      cursor_param: offset

errors:
  missing_version_header:
    status: 400
    code: invalid_request_error
    message: Missing 'Finch-API-Version' header
    fields:
      # The same word as the name above, without the suffix.
      finch_code: invalid_request

  unauthorized_request:
    status: 401
    code: unauthorized_request_error
    message: "Unauthorized request: no authentication given"
    # And no finch_code at all.

  invalid_token:
    status: 401
    code: invalid_token_error
    # The middleware's own name, in capitals, and a word from its internals.
    message: "AUTHENTICATION MIDDLEWARE: could not match any resolver for the token format"

  unknown_route:
    status: 404
    code: not_found_error
    message: Route not found
    fields:
      # "item", where the name says "not_found" and the message says "Route".
      finch_code: item_not_found

  method_not_allowed:
    # The same 404 an unrouted path gets.
    status: 404
    code: not_found_error
    message: Route not found
    fields:
      finch_code: item_not_found

fixtures:
  empty:
    individual: []

  company:
    individual:
      - id: 8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60
        first_name: Ada
        middle_name: null
        last_name: Lovelace
        manager:
          id: 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21
        department:
          name: Engineering
        is_active: true
      - id: 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21
        # Every name field is nullable, so an individual in the directory can
        # have none of them.
        first_name: null
        middle_name: null
        last_name: null
        manager: null
        department: null
        # The third state of the boolean.
        is_active: null

conformance:
  - name: a wrong token names the middleware that refused it
    source: https://api.tryfinch.com/employer/directory
    verified: "2026-09-13"
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Capitals, a colon, and a word from the implementation.
        message: "AUTHENTICATION MIDDLEWARE: could not match any resolver for the token format"
        name: invalid_token_error
        code: 401
      absent:
        # The vendor code every other failure carries.
        - finch_code

  - name: and a missing one is refused without it too
    source: https://api.tryfinch.com/employer/directory
    verified: "2026-09-13"
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
    expect:
      status: 401
      body:
        message: "Unauthorized request: no authentication given"
        name: unauthorized_request_error
        code: 401
      absent:
        # So the field a client switches on is gone from both of the failures
        # every integration meets first.
        - finch_code

  - name: an unrouted path does carry the vendor code
    source: https://api.tryfinch.com/cauldron-nope
    verified: "2026-09-13"
    fixture: company
    request:
      method: GET
      path: /cauldron-nope
      headers:
        Finch-API-Version: "2020-09-17"
    expect:
      status: 404
      body:
        # name says not_found, message says Route, finch_code says item.
        name: not_found_error
        message: Route not found
        finch_code: item_not_found
        code: 404

  - name: a wrong method is the same four hundred and four
    source: https://api.tryfinch.com/employer/directory
    verified: "2026-09-13"
    fixture: company
    request:
      method: PUT
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
    expect:
      status: 404
      body:
        name: not_found_error
        message: Route not found
        finch_code: item_not_found

  - name: nothing gets past the version header
    source: https://api.tryfinch.com/employer/directory
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Authorization: "Bearer cauldr0nf1xtureacc3ssto0000000000000"
    expect:
      status: 400
      body:
        # Declared as a required parameter -- with a default, so a generated
        # client sends it and a hand-written one does not.
        message: Missing 'Finch-API-Version' header
        name: invalid_request_error
        finch_code: invalid_request
        code: 400

  - name: every field but the identifier is nullable
    source: https://api.tryfinch.com/openapi.json
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
        Authorization: "Bearer cauldr0nf1xtureacc3ssto0000000000000"
    expect:
      status: 200
      body:
        # An individual in the directory, with no name.
        'individuals[1].first_name': null
        'individuals[1].middle_name': null
        'individuals[1].last_name': null
        'individuals[1].manager': null
        'individuals[1].department': null
        'individuals[0].first_name': Ada
        'individuals[0].last_name': Lovelace
        'individuals[0].middle_name': null

  - name: is_active is a boolean with three states
    source: https://api.tryfinch.com/openapi.json
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
        Authorization: "Bearer cauldr0nf1xtureacc3ssto0000000000000"
    expect:
      status: 200
      body:
        # "true if the individual is an active employee or contractor", and
        # nullable.
        'individuals[0].is_active': true
        'individuals[1].is_active': null
        'individuals[0].manager.id': 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21
        'individuals[0].department.name': Engineering
        'individuals[0].id': 8f2c1d0b-6a4e-4c3d-9b7f-1e5a2d8c4b60

  - name: the count is optional and the offset is not
    source: https://api.tryfinch.com/openapi.json
    fixture: company
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
        Authorization: "Bearer cauldr0nf1xtureacc3ssto0000000000000"
      query:
        limit: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # Paging requires offset and leaves count out of required.
        'paging.offset': 1
        'paging.count': 2
        'individuals[0].id': 4d7e6f5a-3b2c-4d1e-9f8a-7b6c5d4e3f21

  - name: a company with no directory still sends the paging block
    source: https://api.tryfinch.com/openapi.json
    fixture: empty
    request:
      method: GET
      path: /employer/directory
      headers:
        Finch-API-Version: "2020-09-17"
        Authorization: "Bearer cauldr0nf1xtureacc3ssto0000000000000"
    expect:
      status: 200
      body:
        individuals: []
        'paging.count': 0
        'paging.offset': 0
