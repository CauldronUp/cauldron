# Anvil Recipe for Cauldron
#
# The third of three Recipes asked the same question: does creating a
# document here leave you with something usable, or something to poll for?
# Anvil's answer, on the evidence this task could gather, is the same shape
# as SignNow's Recipe in this collection reaches and for a related
# structural reason -- but it is worth stating what that evidence actually
# is, because no account exists to confirm it the way the auth and routing
# findings below were confirmed.
#
# createEtchPacket -- the mutation that makes a signable packet from one or
# more PDFs, Anvil's nearest equivalent to PandaDoc's "create from template"
# -- takes its files inline in the mutation's own variables (files:
# [EtchFile!], each one uploaded as part of the same call) rather than
# referencing something uploaded earlier and still being processed
# somewhere. There is no prior "upload, then wait" step this mutation
# depends on. Its own field set, read directly from the official Node SDK's
# GraphQL query string (src/graphql/mutations/createEtchPacket.js -- the
# literal source the SDK sends, not a paraphrase of it) is eid, name,
# status, isTest, allowUpdates, numberRemainingSigners, detailsURL,
# webhookURL, completedAt, archivedAt, createdAt, updatedAt, and a nested
# documentGroup. status is real and is not the PandaDoc shape: Anvil's own
# guide states plainly that "before sending an EtchPacket, the packet will
# be in draft mode" -- draft here is where a packet starts and stays until a
# separate sendEtchPacket call moves it on, a signing-workflow state
# (draft/sent/completed, closer to what DocuSign's Recipe in this collection
# already models for an envelope) rather than a not-yet-finished-processing
# state the caller is told to poll past. Nothing in the SDK, the guide, or
# the schema names a transitional state a freshly created packet passes
# through before it is safe to read back.
#
# The REST half tells the same story more plainly, because it names its own
# answer: Anvil's Fill PDF documentation states outright that "the response
# body will be binary PDF bytes" and that there is no job or status object,
# for POST /api/v1/fill/{pdfTemplateID}.pdf. A fill either answers with the
# finished PDF in the same response or it does not answer at all; there is
# no third state to have modelled even if this Recipe had a way to reach one.
#
# None of that is a claim this Recipe could check against a live packet,
# and it says so rather than asserting it as observed. What the live host
# answers without any account at all -- and this is unusually rich for a
# provider reachable with zero credentials -- is the auth, routing and
# content-type behaviour the task actually asked to have probed, struck
# against app.useanvil.com on the date below with no key of any kind:
#
#   1. Missing and wrong are not the same shape here, and the difference is
#      sharper than most of this collection's pairs. A GraphQL query naming
#      a field that needs no session (`{ currentUser { id } }`) with no
#      Authorization header at all answers 200 with
#      {"data":{"currentUser":null}} -- the request is *accepted* and simply
#      resolves to nobody, the same shape GitHub's /user or Turso's
#      /v1/auth/validate answer about an authenticated caller, inverted for
#      an anonymous one. A field that actually needs a session
#      (`{ organizations { id } }`) with the same missing header still
#      answers 200, but now with both data and an error at once --
#      {"errors":[{"message":"Not authorized!","path":["organizations"],
#      ...}],"data":{"organizations":null}} -- the standard GraphQL
#      partial-failure shape, HTTP 200 throughout. A *present* but wrong
#      credential never reaches either of those. It is refused outright,
#      401, before any field resolves: a garbage Basic header (real-shaped
#      key as username, blank password, exactly the form Anvil's own fill
#      -PDF curl example uses) answers {"errors":[{"message":"Unauthorized:
#      malformed key"}]}, with no "data" key at all. Three shapes for one
#      question -- accepted-and-anonymous, accepted-and-refused-per-field,
#      and refused-outright -- and which one you get depends on what was
#      asked and what was sent, not on a single missing/wrong binary.
#   2. The refusal shape itself depends on which auth *scheme* was
#      attempted, which is a finding this collection has not needed before.
#      A Basic-shaped credential that is wrong answers
#      {"errors":[{"message":"Unauthorized: malformed key"}]} -- a GraphQL
#      envelope, on both /graphql and the REST fill endpoint alike, struck
#      both ways live. A Bearer-shaped credential, wrong the same way,
#      answers a completely different envelope on the identical two routes:
#      {"error":"invalid_token","message":"Not a valid credential format"},
#      singular "error" rather than an "errors" array, with a
#      WWW-Authenticate: Bearer realm="api", error="invalid_token",
#      error_description="Not a valid credential format" header that the
#      Basic-scheme failure never carries at all. One shared credential
#      layer sits in front of both surfaces -- confirmed by the Basic and
#      Bearer failures being byte-identical on /graphql and on
#      /api/v1/fill/... -- and it answers in the shape of whichever scheme
#      it thinks you were attempting, not in one shape for the provider.
#   3. A third shape exists for no credential *at all* on the REST surface,
#      which has no per-field graceful-null concept the way GraphQL does:
#      POST /api/v1/fill/{id}.pdf with nothing in Authorization answers 401
#      {"name":"AuthorizationError","message":"Not logged in."} -- a third
#      envelope again, "name" and "message" rather than "errors" or "error".
#      So this one provider answers an absent-or-wrong credential four
#      different ways depending on the surface and the scheme, all struck
#      live: GraphQL-anonymous-per-field (200), GraphQL-Basic-refused (401,
#      errors array), GraphQL-Bearer-refused (401, singular error plus a
#      challenge header), and REST-absent (401, name/message). Documenting
#      one of these as "the" auth failure would misdescribe the other three.
#   4. Routing beats the credential on both surfaces, and the two surfaces
#      fail a wrong method two different ways. PATCH /graphql -- checked
#      with no credential -- answers 405 with Allow: GET, POST and the body
#      "Apollo Server supports only GET/POST requests.", plain text, not
#      the GraphQL error envelope at all: this is Apollo Server's own
#      framework-level rejection, reached before the application ever sees
#      the request. PATCH /api/v1/fill/{id}.pdf answers plain-text
#      "Not Found", 404, with no Allow header -- the REST router simply has
#      no route registered for that method at all, the same body a
#      completely unregistered path under /api/v1/ gets. Two different
#      failures for "the method is wrong," one per surface, and neither one
#      needs a credential to reach.
#   5. GET /graphql -- a real, registered method on this path (OPTIONS
#      advertises GET, POST) -- answers 400 "GET query missing.", plain
#      text again, because Apollo Server requires the query in the request
#      and a GET carries none by default. A third plain-text, non-JSON
#      failure from the same framework layer, distinct from both the 405
#      above and every JSON error this Recipe struck elsewhere.
#   6. And the sharpest routing finding of the three: a path this host
#      genuinely has no route for at all -- neither /graphql's prefix nor
#      /api/v1/'s -- does not 404 at all. GET /this-is-not-a-real-endpoint
#      and GET /api/v1/this-is-not-a-real-endpoint both answer 200, with
#      Content-Type text/html, the React application's own index page. This
#      is a single-page application's client-side routing doing exactly
#      what it is built to do -- every unmatched server path falls through
#      to the app shell so the browser's own router can decide what to
#      show -- and it means there is no API-shaped 404 anywhere on this host
#      for a path outside the two prefixes this Recipe models. A client
#      mistyping a path here does not get an error to catch; it gets 200
#      and a page meant for a browser.
#   7. Content-Type is honest exactly where the API answers JSON, and
#      genuinely is not JSON in three different ways for three different
#      reasons -- the SPA fallback (text/html, by design, see above), the
#      Fill PDF endpoint's own success response (binary PDF bytes, by
#      design, per Anvil's own documentation), and Apollo Server's two
#      framework-level rejections (plain text, from a layer this
#      application's own JSON formatting never touches). None of these
#      announce application/json and then send something else; each one
#      correctly labels what it actually is. That is the same honest
#      answer PandaDoc's Recipe in this collection reaches on the identical
#      question, arrived at independently.
#
# On modelling GraphQL: this Recipe follows linear/recipe.yaml in this
# collection, the precedent the task named -- one path, one method, several
# routes told apart by selects (the query's root field) rather than by URL,
# because that is the only thing that can tell them apart. What this
# format's vocabulary genuinely cannot express, and what is stated here
# rather than forced, is claim 1 above in full: a Cauldron Recipe's
# credential check is evaluated once per request, before any route or field
# is chosen, so a single request cannot be modelled as "some of this query
# succeeds and some of it is refused" the way GraphQL's own per-field error
# model actually behaves. Cauldron's `arm` mechanism -- used below, the same
# device Mezmo's and FireHydrant's Recipes in this collection use -- can
# reproduce the two *outright*-refused shapes (Basic-wrong and
# Bearer-wrong) precisely, because those really are one verdict for the
# whole request. It cannot reproduce the per-field partial shape
# (organizations refused while currentUser resolves) as a route-level
# behaviour distinguishing two fields in one query; that shape is recorded
# in this header, quoted exactly from the live response, rather than
# claimed by a route this format has no way to make honest.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every claim about EtchPacket's fields and about the Fill PDF
#     endpoint's request and response shape is read from Anvil's own
#     published guide and from the official Node SDK's GraphQL source, not
#     observed, and carries no `verified:` date. The auth, routing and
#     content-type findings above were all struck live, unauthenticated (and,
#     for the credential-shape findings, with deliberately wrong credentials
#     this task permits sending), and carry one.
#   - GraphQL introspection is disabled without a session -- `{ __schema
#     { queryType { name } } }` answers {"errors":[{"message":"Must be
#     authenticated"}]}, checked live -- so no part of this Recipe's schema
#     claims come from asking the live host what it serves. `{__typename}`
#     alone, which touches no part of the schema, answers normally
#     ({"data":{"__typename":"Query"}}) and is the only field this Recipe
#     confirmed live rather than from documentation.
#   - The GraphQL side of this Recipe models createEtchPacket and the
#     etchPacket query only, per the task's scope. currentUser and
#     organizations are cited above as evidence for the per-field auth
#     shape and are not modelled as routes, because a route needs a fixture
#     record and no worked example exists for either without an account --
#     the honest choice this task's rules ask for, rather than inventing an
#     organisation or a signed-in user.
#   - sendEtchPacket, signers, webhooks, the whole PDF-template ("cast")
#     management surface, and every REST endpoint under /api/v1/ other than
#     fill are real and not modelled.
#   - What a syntactically well-formed and genuinely correct API key answers
#     is not established for either surface. Every credential this Recipe
#     tried -- garbage Basic, real-shaped-key-as-username Basic with a blank
#     password (Anvil's own documented form), and Bearer -- was refused as
#     "malformed" or "not a valid credential format" by a check this Recipe
#     could not get past without a real key.
#   - No spec is recorded. Anvil's GraphQL schema has no fetchable
#     description this Recipe could find -- introspection needs a session,
#     per the gap above -- and this format's drift-checking machinery reads
#     OpenAPI descriptions, which is not what a GraphQL schema is regardless.
#
# The credentials below are fixtures and belong to no account.

recipe: anvil
capability: signing
version: 0.1.0

upstream:
  api: graphql
  docs: https://www.useanvil.com/docs/api/getting-started/
  provider: anvil
  # Found by cauldron discover rather than recorded by hand. This
  # document declares four of the thirteen routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://app.useanvil.com/api/v1/openapi.json
  spec_hash: d930bf48dc98b3a833351d143836257548d783fe8e84b5d4f56d179b7f3d8c10
  spec_seen: "2026-09-05"

auth:
  # Genuinely HTTP Basic with the API key as the username and an empty
  # password -- Anvil's own Fill PDF documentation shows exactly this form,
  # "-u YOUR_API_KEY:" -- but expressed as scheme none plus matches_header
  # below, for the same reason Temporal Cloud's and Turso's Recipes in this
  # collection make that trade: a single Cauldron-wide scheme is one
  # verdict per request, and this host answers a missing credential, a
  # wrong Basic one, a wrong Bearer one, and a wrong method four
  # genuinely different ways -- see the header.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # {"errors": [{"message": "..."}]} -- ordinary GraphQL, the same shape
    # Linear's Recipe in this collection declares.
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  etch_packet:
    collection: data.createEtchPacket
    id:
      # Anvil's own name for the identifier, on every resource its GraphQL
      # schema exposes -- confirmed against the Node SDK's query strings,
      # which ask for eid rather than id throughout.
      style: opaque
      field: eid
    fields:
      name:
        type: string
      # draft while unsent, per Anvil's own guide -- a signing-workflow
      # state, not a still-processing one. See the header.
      status:
        type: string
        default: draft
      isTest:
        type: boolean
        default: false
      allowUpdates:
        type: boolean
        default: true
      numberRemainingSigners:
        type: integer
        default: 0
      detailsURL:
        type: string
      webhookURL:
        type: string
        null_when_unset: true
      completedAt:
        type: datetime
        null_when_unset: true
        stamped: false
      archivedAt:
        type: datetime
        null_when_unset: true
        stamped: false
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: POST
    path: /graphql
    resource: etch_packet
    operation: create
    selects: createEtchPacket
    matches_header:
      Authorization: Basic Y2F1bGRyb24tYW52aWwtZml4dHVyZS1rZXktMDAwMDAwMDAwMDowMDAwMDAwMDAwMDAwMDAwMDA=
    envelope:
      style: wrapped
      key: data.createEtchPacket
    returns: [id, name, status, isTest]

  # Not selects-gated, on purpose: the credential check this reproduces
  # runs before any field is resolved on the live host, and does not care
  # what the query asked for -- checked live with a currentUser query,
  # which resolves gracefully to null when the request has no credential
  # at all but is refused outright, before resolving anything, once a
  # credential is present and wrong. See the header's first two findings.
  - method: POST
    path: /graphql
    matches_header:
      # The exact wire shape this Recipe struck live: a Basic-scheme header
      # whose base64 decodes cleanly, just not to this fixture's key. See
      # the header's second finding for why this and the Bearer case below
      # are two different failures rather than one.
      Authorization: Basic anVua2FwaWtleTpqdW5rc2VjcmV0
    error: unauthorized_malformed_key

  # The exact form Anvil's own Fill PDF documentation shows -- the key as
  # the Basic username, nothing after the colon -- struck live on its own
  # to rule out "maybe an empty password specifically is the problem." It
  # is not: the answer is byte-identical to the route above.
  - method: POST
    path: /graphql
    matches_header:
      Authorization: Basic Y2F1bGRyb25GaXh0dXJlQW52aWxLZXkwMDAwMDAwMDAwOg==
    error: unauthorized_malformed_key

  - method: POST
    path: /graphql
    matches_header:
      Authorization: Bearer cauldron-anvil-not-a-real-token-000000000000
    error: unauthorized_invalid_token

  # No credential at all, on a query that names no field needing one:
  # accepted, not refused -- see the header's first finding. currentUser
  # itself is not modelled as a resource (no worked example without an
  # account), so this answers the shape rather than the value: an empty
  # envelope rather than an invented user or an invented refusal. Scoped to
  # this one query by selects, deliberately: a credential-less
  # createEtchPacket request is untried and unclaimed by this Recipe -- see
  # the header on why the per-field partial-failure shape is stated in
  # prose rather than routed.
  - method: POST
    path: /graphql
    selects: currentUser
    raw:
      content_type: application/json
      text: '{"data":{"currentUser":null}}'

  # A wrong HTTP method on the real GraphQL path. Apollo Server's own
  # rejection, plain text, reached before any credential is examined.
  - method: PATCH
    path: /graphql
    error: apollo_method_not_allowed

  # A registered method carrying no query. Also Apollo Server's own
  # framework-level answer, also plain text.
  - method: GET
    path: /graphql
    error: apollo_query_missing

  # The Fill PDF endpoint. Never routed to a success case -- see the
  # header: what a real template id and a real key answer with is binary
  # PDF bytes this Recipe has no worked example to reproduce honestly, and
  # this format has no route for "bytes this Recipe never observed."
  - method: POST
    path: /api/v1/fill/{id}.pdf
    matches_header:
      Authorization: Basic anVua2FwaWtleTpqdW5rc2VjcmV0
    error: unauthorized_malformed_key

  - method: POST
    path: /api/v1/fill/{id}.pdf
    matches_header:
      Authorization: Bearer cauldron-anvil-not-a-real-token-000000000000
    error: unauthorized_invalid_token

  - method: POST
    path: /api/v1/fill/{id}.pdf
    error: not_logged_in

  # A wrong method on the REST path -- and a different failure from
  # PATCH /graphql above, because this surface has no framework-level 405
  # of its own; the method simply matches nothing. See the header.
  - method: PATCH
    path: /api/v1/fill/{id}.pdf
    error: rest_not_found

  # A path outside both prefixes this Recipe models. The single-page
  # application's own client-side-routing fallback -- 200, not 404 -- see
  # the header's sharpest routing finding.
  - method: GET
    path: /this-is-not-a-real-endpoint
    raw:
      content_type: text/html; charset=utf-8
      text: <!doctype html><html lang="en" class="app-loading"><head><title>Anvil</title></head><body><div id="root"></div></body></html>

  # The identical fallback under /api/v1/, confirmed live as its own case
  # rather than assumed from the one above: this is not a REST-specific
  # 404, it is the same whole-application catch-all.
  - method: GET
    path: /api/v1/this-is-not-a-real-endpoint
    raw:
      content_type: text/html; charset=utf-8
      text: <!doctype html><html lang="en" class="app-loading"><head><title>Anvil</title></head><body><div id="root"></div></body></html>

errors:
  # A well-formed Basic header this fixture does not recognise. Identical,
  # struck live, on /graphql and on the REST fill endpoint -- one shared
  # credential layer in front of both.
  unauthorized_malformed_key:
    status: 401
    message: "Unauthorized: malformed key"

  # A Bearer-shaped credential, refused by a different check entirely: a
  # singular "error" key rather than a GraphQL "errors" array, and a
  # WWW-Authenticate challenge the Basic-scheme failure never carries.
  unauthorized_invalid_token:
    status: 401
    style: flat
    message_field: message
    code_field: error
    code: invalid_token
    headers:
      www-authenticate: 'Bearer realm="api", error="invalid_token", error_description="Not a valid credential format"'
    message: Not a valid credential format

  # The REST surface's own shape for no credential at all -- a third
  # envelope again, "name" and "message" rather than "errors" or "error".
  not_logged_in:
    status: 401
    style: flat
    message_field: message
    code_field: name
    code: AuthorizationError
    message: Not logged in.

  # Apollo Server's own built-in rejection for a method it does not serve,
  # reached before the application's own GraphQL handling and before any
  # credential is examined. Plain text, with the real Allow header.
  apollo_method_not_allowed:
    status: 405
    style: text
    headers:
      Content-Type: text/plain; charset=utf-8
      allow: "GET, POST"
    message: Apollo Server supports only GET/POST requests.

  # Apollo Server's own answer to a GET carrying no query. Also plain text,
  # also reached before any credential is examined.
  apollo_query_missing:
    status: 400
    style: text
    headers:
      Content-Type: text/plain; charset=utf-8
    message: GET query missing.

  # The REST router's plain 404, for a method or a path it has no route
  # registered for -- not JSON, and not the GraphQL-shaped envelope either.
  rest_not_found:
    status: 404
    style: text
    headers:
      Content-Type: text/plain; charset=utf-8
    message: Not Found

fixtures:
  empty: {}

conformance:
  - name: a well-formed but wrong Basic credential is refused before any field resolves
    source: https://app.useanvil.com/graphql
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /graphql
      headers:
        Content-Type: application/json
        Authorization: Basic anVua2FwaWtleTpqdW5rc2VjcmV0
      json:
        query: "query { currentUser { id } }"
    expect:
      status: 401
      body:
        errors[0].message: "Unauthorized: malformed key"
      absent:
        - data

  - name: the key-as-username form Anvil's own documentation shows is refused the identical way
    source: https://app.useanvil.com/graphql
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /graphql
      headers:
        Content-Type: application/json
        Authorization: Basic Y2F1bGRyb25GaXh0dXJlQW52aWxLZXkwMDAwMDAwMDAwOg==
      json:
        query: "query { currentUser { id } }"
    expect:
      status: 401
      body:
        errors[0].message: "Unauthorized: malformed key"

  - name: a Bearer-shaped credential is a different failure entirely, with a challenge header the Basic one never carries
    source: https://app.useanvil.com/graphql
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /graphql
      headers:
        Content-Type: application/json
        Authorization: Bearer cauldron-anvil-not-a-real-token-000000000000
      json:
        query: "query { currentUser { id } }"
    expect:
      status: 401
      headers:
        www-authenticate: 'Bearer realm="api", error="invalid_token", error_description="Not a valid credential format"'
      body:
        error: invalid_token
        message: Not a valid credential format
      absent:
        - errors
        - data

  - name: and the identical credential shape is refused the identical way on the REST surface
    source: https://app.useanvil.com/api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
      headers:
        Authorization: Bearer cauldron-anvil-not-a-real-token-000000000000
    expect:
      status: 401
      headers:
        www-authenticate: 'Bearer realm="api", error="invalid_token", error_description="Not a valid credential format"'
      body:
        error: invalid_token

  - name: no credential at all on the REST surface is a third envelope again
    source: https://app.useanvil.com/api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
    expect:
      status: 401
      body:
        name: AuthorizationError
        message: Not logged in.

  - name: a wrong method on the GraphQL path is Apollo Server's own rejection, plain text and pre-credential
    source: https://app.useanvil.com/graphql
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /graphql
    expect:
      status: 405
      headers:
        Content-Type: text/plain; charset=utf-8
        allow: "GET, POST"
      body_matches: "^Apollo Server supports only GET/POST requests\\.$"

  - name: a registered method with no query is a different plain-text failure from the same framework layer
    source: https://app.useanvil.com/graphql
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /graphql
    expect:
      status: 400
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: "^GET query missing\\.$"

  - name: a wrong method on the REST surface is a plain 404, not Apollo's 405
    source: https://app.useanvil.com/api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/v1/fill/aBcDeFgHiJkLmNoPqRs.pdf
    expect:
      status: 404
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: "^Not Found$"

  - name: a path outside both prefixes this Recipe models is 200, not 404 -- the single-page app's own fallback
    source: https://app.useanvil.com/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-endpoint
    expect:
      status: 200
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: "<title>Anvil</title>"

  - name: and the identical fallback answers under the REST prefix too, confirmed as its own case rather than assumed
    source: https://app.useanvil.com/api/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/this-is-not-a-real-endpoint
    expect:
      status: 200
