# PDFMonkey Recipe for Cauldron
#
# PDFMonkey is the one provider in this group of three that says the word
# "asynchronous" about itself in its own quick-start: "Generation is
# asynchronous: you create a document, then check its status until it's
# ready." A document moves through exactly the states its own Document
# Statuses page draws as a state diagram -- draft, then pending, then
# generating, then success or failure, with one documented retry edge,
# failure back to pending -- and the field carrying that is named status,
# the identical field name PandaDoc's Recipe in this collection uses for
# its own version of the same idea. Put the two side by side and the
# difference is exact rather than vague: PandaDoc's create answers
# document.uploaded and its own docs say that status "usually retains" it
# "for 3-5 seconds" before moving on its own, no second call required.
# PDFMonkey's create answers draft and goes no further than that until a
# caller explicitly asks it to, by sending "status": "pending" in the same
# create request -- skip that and, per PDFMonkey's own words, "the document
# stays here" (draft) "and you must update it later to trigger generation."
# Ask for pending and the object PDFMonkey hands back is the one quoted
# below verbatim from its own current docs (dated 2026-08-20): id
# a5e86d72-f5b7-43d4-a04e-8b7e08e6741c, status "pending", download_url
# null. Polling the same id once generation finishes -- a second worked
# example on the Download URL page, same id -- shows status "success" and
# download_url populated: PandaDoc's document.uploaded-to-document.draft
# transition, told with PDFMonkey's own field names instead.
#
# What download_url actually is is the sharper of the two providers' answers
# to this task's central question. PDFMonkey's own words, quoted exactly
# from the Download URL page (last updated the same day as the rest of this
# documentation): "This is a temporary signed URL pointing to the generated
# PDF or image stored on S3. It triggers a file download (not inline
# display) and expires after 1 hour." Its own FAQ answers the lifetime
# question by name -- "How long is a PDFMonkey download URL valid?" -- with
# "Each download URL is a temporary signed link valid for 1 hour. After
# that, it returns a 403 Forbidden error. Fetch the document again via the
# API to get a fresh URL -- no need to regenerate the document." So the URL
# expires, the provider states the exact lifetime rather than leaving it to
# be discovered by waiting, and re-fetching the same document record mints
# a new one rather than reusing or extending the old -- an integration can
# hold the document id indefinitely but cannot hold the URL past an hour.
# A second field, public_share_link, is the deliberate opposite: "Permanent
# public URL to view and download the file... does not expire," gated to
# paid plans, and null on every document that has not had one issued.
# Neither PandaDoc's document nor Anvil's EtchPacket in this collection
# carries a documented expiring-URL field at all, which is what makes this
# the provider in the group that answers the "does a URL expire" branch of
# the question in the affirmative, in writing, with a number.
#
# PDFMonkey also complicates its own "asynchronous" framing in one place
# worth naming rather than smoothing over: POST /api/v1/documents/sync,
# documented on the same page, "creates a document and polls for completion
# server-side, so you get the finished result in a single request" -- a real
# synchronous option, six-minute timeout, answering a DocumentCard rather
# than a Document. This Recipe does not model it. The default and
# recommended path, and the one every worked example on this provider's own
# docs actually shows a request/response pair for, is the async one below;
# the sync endpoint is real and is stated here rather than silently folded
# into the async shape.
#
# Auth and routing, struck live against api.pdfmonkey.io, unauthenticated
# and with credentials this task invented to be wrong, no account:
#
#   1. Absent and wrong are two different envelopes, not two different
#      sentences in one envelope. No Authorization header at all answers
#      {"error":"You need to sign in or sign up before continuing."} -- a
#      flat, singular "error" string. Anything that IS an Authorization
#      header and is not accepted -- a wrong Bearer token, "Bearer " with
#      nothing after it, a raw token with no Bearer prefix at all, all three
#      checked live -- answers the identical different shape:
#      {"errors":[{"status":"401","title":"Unauthorized","detail":"We were
#      unable to authenticate you based on the provided API key..."}]}, a
#      JSON:API-shaped array. PDFMonkey does not distinguish malformed from
#      rejected at all -- an empty-after-prefix token and a wrong-shaped
#      header both land in the same envelope a plainly wrong token does --
#      but it distinguishes both of those from absent sharply, in the
#      response's whole shape rather than only its wording.
#   2. The detail sentence echoes back the start of whatever was sent:
#      "We received a key statrting with jun…" for a probe beginning
#      "junk" -- typo and truncation both PDFMonkey's own, quoted exactly
#      rather than corrected, and stable enough to be worth quoting only
#      because this Recipe fixes the probe value (junktoken12345) that
#      produces it. A different wrong token would echo a different
#      fragment; this Recipe does not attempt to reproduce that per-request
#      templating and states the one literal response its one fixture
#      credential produces.
#   3. Routing beats the credential outright, and beats it the same way for
#      a path that does not exist and a method that is not supported on one
#      that does. GET to a path under /api/v1/ this host does not register
#      answers 404 with a Rails application's own "404 Not Found" page,
#      Content-Type text/html -- checked with no credential and with a
#      wrong one, byte-identical either way. PATCH /api/v1/documents -- a
#      real path, GET and POST both live and both auth-gated on it --
#      answers the identical 404 page, not a 405, and not the JSON
#      credential error either: no Allow header, no credential examined,
#      checked both without one and with a wrong one. Cauldron's own
#      after_routing flag is the shape of that ordering (route resolved
#      before credential), and this file uses the same device PandaDoc's
#      and Anvil's Recipes in this collection use to get there for a
#      narrower reason: PDFMonkey's wrong-method answer is 404, not a real
#      405, so declaring GET and POST as ordinary routes here would let
#      Cauldron's own Allow-header synthesis invent a 405 this host never
#      sends. Gating the two real routes with matches_header keeps them out
#      of that calculation, the same way PandaDoc's Recipe notes its
#      identical routes are excluded from it.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested,
#     guessed or used. The create and Download-URL worked examples, the
#     status table and state diagram, and the sync endpoint's description
#     are all read from pdfmonkey.io's own current docs (dated 2026-08-20)
#     and carry no `verified:` date. Every 401 and 404 below was struck
#     live and carries one.
#   - Listing documents, DocumentCard (the lighter shape list and polling
#     endpoints answer instead of the full Document), templates, webhooks,
#     the synchronous /documents/sync endpoint, and public_share_link's
#     issuing flow are real and not modelled. This Recipe models create and
#     get-by-id on the full Document only, which is what the group's
#     question turns on.
#   - checksum, app_id and preview_url are not settable by a create request
#     and no worked example shows them varying by input, so this Recipe
#     serves one fixed value for each on every created document rather than
#     computing one -- a fixture simplification, not a claim that a real
#     account's checksum does not vary by content.
#   - download_url's own worked example on PDFMonkey's Download URL page
#     elides the S3 signature query string with a literal "..." in the
#     provider's own docs, not this Recipe's abbreviation of it. Reproduced
#     verbatim rather than completed with an invented signature.
#   - 422 validation errors (a missing document_template_id) are documented
#     -- {"errors":{"document_template_id":["can't be blank"]}} -- and not
#     modelled, because this Recipe's create route enforces only that the
#     request names a template, the same scope PandaDoc's Recipe in this
#     collection gives its own create route.
#   - No spec is recorded. No path this task tried under api.pdfmonkey.io
#     or www.pdfmonkey.io answered a machine-readable description.
#
# The key below is a fixture and belongs to no account.

recipe: pdfmonkey
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://www.pdfmonkey.io/docs/api/documents/
  provider: PDFMonkey

auth:
  # Genuinely Bearer, but expressed as scheme none plus matches_header below
  # -- see the header's third finding. PDFMonkey's wrong-method answer is a
  # 404, not a 405, so ordinary GET/POST routes here would let Cauldron's
  # own Allow-header synthesis claim a 405 this host never sends; gating the
  # two real routes with matches_header keeps them out of that calculation
  # the same way PandaDoc's Recipe in this collection does for the
  # identical reason.
  scheme: none

responses:
  resource:
    style: bare

resources:
  document:
    # PDFMonkey's own wire shape nests a whole document -- id included --
    # one level down, under "document", on both a create's response and a
    # get's: {"document": {"id": ..., "document_template_id": ..., ...}}.
    # Every field below carries `in: document` for exactly that reason, and
    # the identifier is renamed to the same nested path so it lands beside
    # its own siblings rather than at the top of the envelope on its own.
    id:
      style: uuid
      field: id
    fields:
      # PDFMonkey's field genuinely repeats "document" once nested --
      # confirmed against every worked example this Recipe cites -- so the
      # wire name is stated explicitly rather than left for the validator
      # to flag as a likely mistake.
      document_template_id:
        type: string
        in: document
        as: document_template_id
      # draft unless a create request sets it to pending -- PDFMonkey's own
      # words: "if you don't set status: pending... the document stays
      # here." See the header.
      status:
        type: string
        default: draft
        in: document
      payload:
        type: map
        null_when_unset: true
        in: document
      meta:
        type: map
        null_when_unset: true
        in: document
      # null until status reaches success; a temporary signed URL after,
      # good for one hour per PDFMonkey's own stated lifetime. See the
      # header.
      download_url:
        type: string
        null_when_unset: true
        in: document
      preview_url:
        type: string
        default: https://preview.pdfmonkey.io/pdf/web/viewer.html?file=...
        in: document
      public_share_link:
        type: string
        null_when_unset: true
        in: document
      failure_cause:
        type: string
        null_when_unset: true
        in: document
      filename:
        type: string
        null_when_unset: true
        in: document
      generation_logs:
        type: list
        default: []
        in: document
      output_type:
        type: string
        default: pdf
        in: document
      checksum:
        type: string
        default: c230530f6f0aa32900af0924cf228e5c
        in: document
      app_id:
        type: string
        default: d6b4e8f2-7a3c-4d1e-9f5b-2c8a1d3e6f90
        in: document
      created_at:
        type: datetime
        in: document
      updated_at:
        type: datetime
        in: document

routes:
  - method: POST
    path: /api/v1/documents
    resource: document
    operation: create
    id_as: document.id
    matches_header:
      Authorization: Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000
    returns: [id, app_id, checksum, created_at, document_template_id, download_url, failure_cause, filename, generation_logs, meta, output_type, payload, preview_url, public_share_link, status, updated_at]

  - method: POST
    path: /api/v1/documents
    error: signed_out

  - method: GET
    path: /api/v1/documents/{id}
    resource: document
    operation: get
    id_as: document.id
    matches_header:
      Authorization: Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000

  - method: GET
    path: /api/v1/documents/{id}
    error: signed_out

  # Listing is not modelled -- see the header -- so this path only ever
  # demonstrates the gate.
  - method: GET
    path: /api/v1/documents
    error: signed_out

  # An unsupported method on a real path. Not a 405: the identical
  # Rails-application 404 an unrouted path gets, with no credential
  # examined at all. See the header's third finding.
  - method: PATCH
    path: /api/v1/documents
    error: not_found_page

  - method: GET
    path: /api/v1/this-is-not-a-real-endpoint
    error: not_found_page

errors:
  # Absent only -- see the header's first finding.
  signed_out:
    status: 401
    style: flat
    message_field: error
    headers:
      Content-Type: application/json; charset=utf-8
    message: You need to sign in or sign up before continuing.

  # Reached only by arming it: matches_header cannot tell "some other
  # Authorization value" apart from "none at all" on its own, and the live
  # failure this reproduces needs a header that was genuinely present and
  # wrong. The same device PandaDoc's and Anvil's Recipes in this
  # collection use for an identical problem. This is also the Recipe-wide
  # default for any verdict not named above, so it is what a wrong
  # credential gets without needing its own route.
  authentication_error:
    status: 401
    style: list
    key: errors
    message_field: detail
    fields:
      status: "401"
      title: Unauthorized
    # Echoes the start of whatever was sent -- see the header's second
    # finding. This exact sentence is what the fixture credential
    # (junktoken12345) below produces; a different wrong value would echo a
    # different fragment.
    message: "We were unable to authenticate you based on the provided API key. Please verify that you provided the intended key. We received a key statrting with jun… If you think this is an error on our side feel free to contact us at support@pdfmonkey.io."

  # Rails' own default 404 page, quoted for its stable parts -- the meta
  # csrf-token this host actually sends is a fresh value per request and is
  # not reproduced, the same call PandaDoc's Recipe in this collection
  # makes about a live bot-challenge script's random query string.
  not_found_page:
    status: 404
    style: text
    headers:
      Content-Type: text/html; charset=utf-8
    message: |-
      <!DOCTYPE html>
      <html lang="en" class="h-full bg-white">
        <head>
          <title>PDFMonkey</title>
        </head>
        <body class="h-full">
          <main>
            <h1>404 Not Found</h1>
          </main>
        </body>
      </html>

fixtures:
  empty: {}

  # The exact id PDFMonkey's own Download URL page uses for its "once
  # generation finishes" example, polling the same id the create example
  # elsewhere on this page shows mid-flight. See the header.
  documents:
    document:
      - id: a5e86d72-f5b7-43d4-a04e-8b7e08e6741c
        document_template_id: 2903f5b4-623b-4e10-b2e3-dc7e2e67ea39
        status: success
        # Elided by PDFMonkey's own docs, not by this Recipe. See the
        # header.
        download_url: https://pdfmonkey-production.s3.eu-west-1.amazonaws.com/...
        preview_url: https://preview.pdfmonkey.io/...
        public_share_link: null

conformance:
  - name: no Authorization header at all is a flat sentence, not the JSON:API envelope a wrong one gets
    source: https://api.pdfmonkey.io/api/v1/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/documents
    expect:
      status: 401
      headers:
        content-type: application/json; charset=utf-8
      body:
        error: You need to sign in or sign up before continuing.
      absent:
        - errors

  - name: a wrong Bearer token is a JSON:API array, armed because matches_header cannot tell wrong from absent on its own
    source: https://api.pdfmonkey.io/api/v1/documents
    verified: "2026-09-01"
    arm: authentication_error
    fixture: empty
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        errors[0].status: "401"
        errors[0].title: Unauthorized
        errors[0].detail: "We were unable to authenticate you based on the provided API key. Please verify that you provided the intended key. We received a key statrting with jun… If you think this is an error on our side feel free to contact us at support@pdfmonkey.io."
      absent:
        - error

  - name: Bearer with nothing after it is not treated as absent -- the identical JSON:API array a wrong token gets
    source: https://api.pdfmonkey.io/api/v1/documents
    verified: "2026-09-01"
    arm: authentication_error
    fixture: empty
    request:
      method: GET
      path: /api/v1/documents
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        errors[0].title: Unauthorized

  - name: create leaves a document in draft unless the request asks for pending
    source: https://www.pdfmonkey.io/docs/api/documents/
    fixture: empty
    request:
      method: POST
      path: /api/v1/documents
      headers:
        Authorization: Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000
      json:
        document:
          document_template_id: 2903f5b4-623b-4e10-b2e3-dc7e2e67ea39
    expect:
      status: 200
      body:
        document.status: draft
        document.download_url: null
      matches:
        document.id: ".+"

  - name: setting status to pending on create is what actually queues generation, and the file is not ready in the same response
    source: https://www.pdfmonkey.io/docs/api/documents/
    fixture: empty
    request:
      method: POST
      path: /api/v1/documents
      headers:
        Authorization: Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000
      json:
        document:
          document_template_id: 2903f5b4-623b-4e10-b2e3-dc7e2e67ea39
          status: pending
          payload:
            clientName: Peter Parker
    expect:
      status: 200
      body:
        document.status: pending
        document.download_url: null
      matches:
        document.id: ".+"

  - name: polling the same id once generation finishes shows the field that changed, and a URL that was not there before
    source: https://www.pdfmonkey.io/docs/generating-documents/download-url/
    fixture: documents
    request:
      method: GET
      path: /api/v1/documents/a5e86d72-f5b7-43d4-a04e-8b7e08e6741c
      headers:
        Authorization: Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000
    expect:
      status: 200
      body:
        document.status: success
        document.download_url: https://pdfmonkey-production.s3.eu-west-1.amazonaws.com/...
        document.public_share_link: null

  - name: a path this host never registered is a Rails application's own 404 page, not a JSON shape
    source: https://api.pdfmonkey.io/api/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/this-is-not-a-real-endpoint
    expect:
      status: 404
      headers:
        content-type: text/html; charset=utf-8
      body_matches: "<h1>404 Not Found</h1>"

  - name: and the identical page answers a wrong credential on that same unrouted path, because routing never lets the credential be examined
    source: https://api.pdfmonkey.io/api/v1/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/this-is-not-a-real-endpoint
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      headers:
        content-type: text/html; charset=utf-8

  - name: an unsupported method on a real path is the identical 404 page, not a 405, and no credential is examined
    source: https://api.pdfmonkey.io/api/v1/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/v1/documents
    expect:
      status: 404
      headers:
        content-type: text/html; charset=utf-8
      body_matches: "<h1>404 Not Found</h1>"

  - name: and a wrong credential on that same unsupported method changes nothing about the answer
    source: https://api.pdfmonkey.io/api/v1/documents
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/v1/documents
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      headers:
        content-type: text/html; charset=utf-8

  # The names. This Recipe declares 12 field(s) on a document that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 7 name(s) that came back at the paths they came back
  # under.
  - name: "a document carries the field names this Recipe declares"
    source: "https://www.pdfmonkey.io/docs/generating-documents/download-url/"
    fixture: documents
    request:
      method: GET
      path: "/api/v1/documents/a5e86d72-f5b7-43d4-a04e-8b7e08e6741c"
      headers:
        "Authorization": "Bearer cauldron-pdfmonkey-fixture-key-000000000000000000000000"
    expect:
      status: 200
      body:
        "document.app_id": "d6b4e8f2-7a3c-4d1e-9f5b-2c8a1d3e6f90"
        "document.checksum": "c230530f6f0aa32900af0924cf228e5c"
        "document.created_at": "2026-01-01T00:00:00Z"
        "document.document_template_id": "2903f5b4-623b-4e10-b2e3-dc7e2e67ea39"
        "document.output_type": "pdf"
        "document.preview_url": "https://preview.pdfmonkey.io/..."
        "document.updated_at": "2026-01-01T00:00:00Z"

