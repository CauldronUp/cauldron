# Maven Central Recipe for Cauldron
#
# The search API is Apache Solr's response, handed over unedited.
#
# There is no envelope of Maven Central's own. What comes back is what the
# search engine produced, including a header describing the engine's own work:
#
#   "responseHeader": {
#     "status": 0,
#     "QTime": 1,
#     "params": {"q": "...", "fl": "id,g,a,v,p,ec,timestamp,tags",
#                "sort": "score desc,timestamp desc,g asc,a asc,v desc",
#                "indent": "off", "wt": "json", "version": "2.2"}
#   }
#
# So a successful search reports **status 0**, which is Solr's convention and
# not an HTTP status, sitting in a body that arrived with a 200. Beside it is
# QTime, how many milliseconds the query took, and params -- the request read
# back to you, including the internal field list the service asked Solr for and
# the sort expression it used. None of that is about Maven. It is the search
# engine's diagnostics, on the public API, in every response.
#
# **And the fields are single letters.** A result is g, a, v, p and ec:
# groupId, artifactId, version, packaging, and a list of the file extensions
# that exist for it. Nothing in the response says so.
#
# Written against the live API rather than a document: every case below was
# checked against search.maven.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A search that matches nothing is a 200 that says it succeeded. status is
#      0, numFound is 0, docs is [], and there is no other signal -- so an
#      artifact that does not exist and a query that was mistyped are the same
#      response.
#   2. A query Solr will not parse is a 400 in plain text that names Solr and
#      then stops: "Solr returned 400, msg:" with nothing after the colon. The
#      service is relaying an error it did not read.
#   3. start is a number in one place and an empty string in the other.
#      response.start is 0; responseHeader.params.start is "". The same concept,
#      twice in one document, in two types -- because one is what the service
#      computed and the other is what the caller sent, echoed as text.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The Solr query language is not interpreted. q takes expressions like
#     "g:com.google.guava AND a:guava" with wildcards, ranges and boosts, and
#     this Recipe answers with what its fixture holds rather than parsing them
#     -- the same reading recorded for Google Drive's q.
#   - params echoes the request. The header below carries the parameters of the
#     query the cases send; a different query would echo itself instead, which
#     is the behaviour and is not served.
#   - timestamp is epoch milliseconds and is served as the number it is. What
#     is not served is that it is the moment the artifact was published to the
#     index rather than released.
#   - The repository itself is a separate host: repo1.maven.org serves the
#     .jar and .pom files, and a POM is XML.
#
# The artifacts below are public and were recorded on the date in the cases.

recipe: mavencentral
capability: infrastructure
version: 0.1.0

upstream:
  api: solrsearch
  docs: https://central.sonatype.org/search/rest-api-guide/

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  list:
    style: wrapped
    # Solr's own nesting: the array is two levels down.
    key: response.docs
    count_field: response.numFound
  error:
    # "Solr returned 400, msg:" and nothing after it.
    style: text

resources:
  artifact:
    id:
      style: opaque
      field: id
    fields:
      # groupId, artifactId, version, packaging -- one letter each, and
      # nothing in the response says which is which.
      g:
        type: string
      a:
        type: string
      v:
        type: string
      p:
        type: string
      # The file extensions that exist for this artifact.
      ec:
        type: list
      # Epoch milliseconds.
      timestamp:
        type: integer
      tags:
        type: list

routes:
  - method: GET
    path: /solrsearch/select
    resource: artifact
    operation: list
    pagination:
      style: offset
      limit_param: rows
      cursor_param: start
      limit: 20
    fields:
      # Solr's record offset, which is a number here and an empty string in
      # the header below.
      response.start: 0
      # The search engine's diagnostics, on the public API, in every response.
      responseHeader:
        status: 0
        QTime: 1
        params:
          q: g:com.google.guava AND a:guava
          core: gav
          indent: "off"
          fl: id,g,a,v,p,ec,timestamp,tags
          # Sent as text, where response.start is a number.
          start: ""
          sort: score desc,timestamp desc,g asc,a asc,v desc
          rows: "3"
          wt: json
          version: "2.2"

errors:
  invalid_request:
    status: 400
    headers:
      Content-Type: text/plain
    message: "Solr returned 400, msg: "

  resource_missing:
    status: 404
    message: Not Found

fixtures:
  empty: {}

  central:
    artifact:
      - id: com.google.guava:guava:33.4.8-jre
        g: com.google.guava
        a: guava
        v: 33.4.8-jre
        # Not "jar": the packaging is what the POM declared.
        p: bundle
        ec:
          - .module
          - -sources.jar
          - .pom
          - -javadoc.jar
          - .jar
        timestamp: 1744651522422
        tags:
          - include
          - more
          - classes
          - libraries
          - utility
          - google

      # The same version, built for a different platform, published eight
      # minutes earlier -- so the two differ by a suffix on the version and
      # nothing else.
      - id: com.google.guava:guava:33.4.8-android
        g: com.google.guava
        a: guava
        v: 33.4.8-android
        p: bundle
        ec:
          - .module
          - -sources.jar
          - .pom
          - -javadoc.jar
          - .jar
        timestamp: 1744650919688
        tags:
          - include
          - more
          - classes

conformance:
  - name: the response is Solr's, and a status of zero means it worked
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # Solr's convention, not HTTP's, in a body that arrived with a 200.
        "responseHeader.status": 0
        "responseHeader.QTime": 1

  - name: and the header reads the request back with Solr's internals in it
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # The field list the service asks Solr for and the sort expression it
        # uses, published on the public API in every response.
        "responseHeader.params.fl": id,g,a,v,p,ec,timestamp,tags
        "responseHeader.params.sort": score desc,timestamp desc,g asc,a asc,v desc
        "responseHeader.params.version": "2.2"
        "responseHeader.params.q": g:com.google.guava AND a:guava

  - name: the fields are single letters
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # groupId, artifactId, version, packaging. Nothing in the response
        # says which is which, and p is "bundle" rather than "jar" because
        # that is what the POM declared.
        "response.docs[0].g": com.google.guava
        "response.docs[0].a": guava
        "response.docs[0].v": 33.4.8-jre
        "response.docs[0].p": bundle

  - name: start is a number in one place and an empty string in the other
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # One is what the service computed; the other is what the caller sent,
        # echoed as text. Same concept, one document, two types.
        "response.start": 0
        "responseHeader.params.start": ""

  - name: the extension list is what exists rather than what it is
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # ec holds file suffixes, some with a leading dot and some with a
        # leading hyphen, so joining them to a base name needs two rules.
        "response.docs[0].ec[0]": .module
        "response.docs[0].ec[1]": -sources.jar
        "response.docs[0].ec[4]": .jar

  - name: the timestamp is epoch milliseconds
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json
    expect:
      status: 200
      body:
        # Thirteen digits, not ten and not a string, so a client that treats
        # it as seconds lands in 57 000 years' time.
        "response.docs[0].timestamp": 1744651522422

  - name: a search that matches nothing says it succeeded
    source: https://search.maven.org/solrsearch/select?q=g:not.a.real.group.cauldron&rows=2&wt=json
    verified: "2026-08-27"
    fixture: empty
    request:
      method: GET
      path: /solrsearch/select?q=g:not.a.real.group.cauldron&rows=2&wt=json
    expect:
      # status 0, numFound 0, an empty array, and a 200. An artifact that does
      # not exist and a query that was mistyped are the same response.
      status: 200
      body:
        "responseHeader.status": 0
        "response.numFound": 0
      absent:
        - response.docs[0]

  - name: a query Solr will not parse is relayed without being read
    source: https://search.maven.org/solrsearch/select?q=&wt=json
    verified: "2026-08-27"
    fixture: central
    arm: invalid_request
    request:
      method: GET
      path: /solrsearch/select?q=&wt=json
    expect:
      # Plain text, naming Solr, and stopping at the colon -- the service is
      # passing on an error it did not look at.
      status: 400
      headers:
        Content-Type: text/plain
      body_matches: '^Solr returned 400, msg: $'

  - name: the count is of everything and the page is what you asked for
    source: https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=1&wt=json
    verified: "2026-08-27"
    fixture: central
    request:
      method: GET
      path: /solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=1&wt=json
    expect:
      status: 200
      body:
        # rows=1 against guava answers one doc and numFound 150, so the number
        # beside the array is not the length of the array and never was.
        "response.docs[0].v": 33.4.8-jre
        "response.numFound": 2
      absent:
        - response.docs[1]

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if rows was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "rows is read, because a page of one out of two is not the whole collection"
    source: "https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json"
    fixture: central
    request:
      method: GET
      path: "/solrsearch/select"
      query:
        "q": "g:com.google.guava+AND+a:guava"
        "core": "gav"
        "rows": "1"
        "wt": "json"
    expect:
      status: 200
      body:
        "response.docs[0].id": "com.google.guava:guava:33.4.8-jre"
      absent:
        - "response.docs[1]"

  # And the position. Asking for one page-worth from start=1 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "start moves the page on, and the second record is what comes back"
    source: "https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json"
    fixture: central
    request:
      method: GET
      path: "/solrsearch/select"
      query:
        "q": "g:com.google.guava+AND+a:guava"
        "core": "gav"
        "rows": "1"
        "wt": "json"
        "start": "1"
    expect:
      status: 200
      body:
        "response.docs[0].id": "com.google.guava:guava:33.4.8-android"
      absent:
        - "response.docs[1]"

  # The names. This Recipe declares 1 field(s) on a artifact that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an artifact carries the field names this Recipe declares"
    source: "https://search.maven.org/solrsearch/select?q=g:com.google.guava+AND+a:guava&core=gav&rows=3&wt=json"
    fixture: central
    request:
      method: GET
      path: "/solrsearch/select"
      query:
        "q": "g:com.google.guava+AND+a:guava"
        "core": "gav"
        "rows": "3"
        "wt": "json"
    expect:
      status: 200
      body:
        "response.docs[0].tags[0]": "include"


