# Helicone Recipe for Cauldron
#
# Written against Helicone's API reference at docs.helicone.ai and struck live
# against api.helicone.ai on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **`trace` is the name of the function that rejected you.** Struck live, three
# requests:
#
#   POST /v1/request/query                  (no credential)
#   401 {"error":"No authorization header","trace":"isAuthenticated.error"}
#
#   POST /v1/request/query                  Authorization: Bearer sk-helicone-notreal
#   401 {"error":"No API key found","trace":"isAuthenticated.error"}
#
#   POST /v1/cauldron-nope                  Authorization: Bearer sk-helicone-notreal
#   401 {"error":"No API key found","trace":"isAuthenticated.error"}
#
# `trace` is a constant. Not a request id, not a span id, not a timestamp --
# the string `isAuthenticated.error`, identical on every failure, which is a
# source-code identifier: a function called `isAuthenticated` and the branch
# inside it. So the field named for correlating one request against a server
# log correlates nothing, and what it actually discloses is a name from the
# codebase.
#
# It is also the most useful thing in the response for the person debugging,
# which is the tension worth naming: a caller who greps Helicone's open-source
# repository for `isAuthenticated` finds the check that refused them. Helicone
# is open source, so that is arguably a deliberate affordance rather than a
# leak. It is still not a trace.
#
# **"No API key found" is the answer to sending an API key.** The second
# request carried a bearer token. The sentence says none was found. So the two
# failures are separated by their prose and the prose describes the wrong one
# -- the same shape [loops](../loops) has, and here the field that would carry
# the distinction is occupied by a constant.
#
# **An unknown path answers 401 rather than 404.** Routing happens after
# authentication, so a caller cannot discover whether an endpoint exists, and
# the sentence they get is about a key they did send.

recipe: helicone
capability: observability
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.helicone.ai/rest/request/post-v1requestquery
  # No spec: Helicone publishes a rendered documentation site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk-helicone-cauldr0n-f1xture-00000-00000
  # Two sentences, one of them describing the wrong failure. Struck live.
  absent_error: no_authorization_header
  rejected_error: no_api_key_found

responses:
  list:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: error
    code_field: "-"
    fields:
      # A constant on every failure, and a function name rather than an
      # identifier. Declared on the envelope because it does not vary.
      trace: isAuthenticated.error

resources:
  request:
    id:
      field: request_id
      style: uuid
    fields:
      request_created_at:
        type: datetime
      request_model:
        type: string
      response_status:
        type: integer
        default: 200
      completion_tokens:
        type: integer
        default: 0
      prompt_tokens:
        type: integer
        default: 0
      costUSD:
        type: number
        default: 0

routes:
  # A read that is a POST, because the filter is a document: Helicone's query
  # endpoint takes a filter tree in the body and answers a listing.
  - method: POST
    path: /v1/request/query
    resource: request
    operation: list
    pagination:
      # limit and offset in the request body, beside the filter -- so a
      # listing's paging controls are not in the query string and cannot be
      # bookmarked or logged as part of the URL.
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset
      in: body

errors:
  no_authorization_header:
    status: 401
    # Accurate: nothing was sent.
    message: "No authorization header"

  no_api_key_found:
    status: 401
    # Not accurate: a key was sent and was not accepted. The sentence
    # describes the other failure, and the field that could have carried the
    # distinction is a constant.
    message: "No API key found"

fixtures:
  empty:
    request: []

  organization:
    request:
      - request_id: 8f3c2b91-47ad-4e06-9b25-1d7c05fa6e38
        request_created_at: "2026-09-06T14:20:11.402Z"
        request_model: gpt-4o-mini
        response_status: 200
        prompt_tokens: 812
        completion_tokens: 147
        costUSD: 0.00021705
      - request_id: b71e94d2-05fc-4a83-8117-6e2af9c3d540
        request_created_at: "2026-09-06T14:22:47.913Z"
        request_model: claude-sonnet-4-5
        # A failed upstream call, recorded with a 500 and no completion. The
        # tokens it consumed getting there are still counted and still cost
        # money, which is the reason to record it at all.
        response_status: 500
        prompt_tokens: 1204
        completion_tokens: 0
        costUSD: 0.0036120

conformance:
  - name: the trace field is a function name
    source: https://api.helicone.ai/v1/request/query
    verified: "2026-09-07"
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers: {}
    expect:
      status: 401
      body:
        # isAuthenticated.error -- a function and the branch inside it, not a
        # request id. Identical on every failure, so it correlates nothing.
        trace: isAuthenticated.error
        error: "No authorization header"

  - name: the trace does not change with the failure
    source: https://api.helicone.ai/v1/request/query
    verified: "2026-09-07"
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-notreal"
    expect:
      status: 401
      body:
        # The same constant, on a different failure, minutes apart. What it
        # discloses is a name from the codebase; what it does not do is
        # identify this request.
        trace: isAuthenticated.error

  - name: no API key found is the answer to sending an API key
    source: https://api.helicone.ai/v1/request/query
    verified: "2026-09-07"
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-notreal"
    expect:
      status: 401
      body:
        # A bearer token was sent. The sentence says none was found, so the
        # prose describes the other failure and the only other field is a
        # constant.
        error: "No API key found"

  - name: an unknown path is a credential failure
    source: https://api.helicone.ai/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: organization
    request:
      method: POST
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer sk-helicone-notreal"
    expect:
      # Routing happens after authentication, so a caller cannot discover
      # whether an endpoint exists -- and is told about a key they did send.
      status: 401
      body:
        error: "No API key found"

  - name: a read is a POST because the filter is a document
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
    expect:
      status: 200
      body:
        'data[0].request_id': 8f3c2b91-47ad-4e06-9b25-1d7c05fa6e38
        'data[0].request_model': gpt-4o-mini

  - name: a failed upstream call still cost money
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
    expect:
      status: 200
      body:
        # 500 from the model provider, no completion tokens, and 1204 prompt
        # tokens already spent. A dashboard filtering to successful requests
        # hides the spend it most wants to explain.
        'data[1].response_status': 500
        'data[1].completion_tokens': 0
        'data[1].prompt_tokens': 1204

  - name: cost is a float with eight places
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
    expect:
      status: 200
      body:
        # A JSON number, not a decimal string -- so a client summing a month
        # of these accumulates binary floating-point error on a currency
        # value, and the field is named for the currency rather than typed
        # for it.
        'data[0].costUSD': 0.00021705

  - name: the field names mix two conventions
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
    expect:
      status: 200
      body:
        # request_created_at is snake case and costUSD is camel case with an
        # acronym, on the same record. A generated struct needs two tag
        # styles for one object.
        'data[0].request_created_at': "2026-09-06T14:20:11.402Z"
        'data[1].costUSD': 0.0036120

  - name: paging lives in the body beside the filter
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: organization
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
      json:
        limit: 1
        offset: 1
    expect:
      status: 200
      body:
        # Not in the query string, so the controls cannot be bookmarked, are
        # not in an access log, and a caching proxy sees one URL for every
        # page.
        'data[0].request_id': b71e94d2-05fc-4a83-8117-6e2af9c3d540

  - name: an organization with no requests answers an empty array
    source: https://docs.helicone.ai/rest/request/post-v1requestquery
    fixture: empty
    request:
      method: POST
      path: /v1/request/query
      headers:
        Authorization: "Bearer sk-helicone-cauldr0n-f1xture-00000-00000"
    expect:
      status: 200
      body:
        data: []
