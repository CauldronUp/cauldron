# Codat Recipe for Cauldron
#
# Written against Codat's API reference at docs.codat.io and struck live
# against api.codat.io on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The failure tells you whether to retry, and the answer is "Unknown".**
# Struck live, all three:
#
#   GET /companies                     (no credential)
#   401 {"statusCode":401,"service":"PublicApi","error":"Unauthorized",
#        "correlationId":"3a94fab4...","canBeRetried":"Unknown","detailedErrorCode":0}
#
#   GET /companies                     Authorization: Basic bm90cmVhbA==
#   401 {... "canBeRetried":"Unknown","detailedErrorCode":0}
#
#   GET /cauldron-nope                 Authorization: Basic bm90cmVhbA==
#   404 {"statusCode":404,"service":"PublicApi","error":"NotFound",
#        "correlationId":"b044c298...","canBeRetried":"Unknown","detailedErrorCode":0}
#
# `canBeRetried` is a tri-state sent as a string, and it is `"Unknown"` on
# every failure a public probe can reach. So the field that exists to answer
# the one question a client has about a failure -- do I try again -- declines
# to answer it, in a type that has to be string-compared rather than tested as
# a boolean.
#
# It is still better than not having it. The three-valued design is right: yes,
# no, and "I do not know" are genuinely different answers, and most providers
# here offer none of them. The problem is that the third is the only one
# reachable without an account, which means a client written against this API
# has an untested branch for the other two.
#
# **`detailedErrorCode` is 0 on everything.** A second code beside `error`,
# reserved for detail, carrying none.
#
# **`service` names the internal service that answered.** `"PublicApi"` -- so a
# failure says which of Codat's deployments produced it, on a request with no
# account behind it. Mild, and it is the same class of thing
# [gong](../gong) does with a build number and [imgix](../imgix) with a
# version.
#
# **The 404 keeps the shape.** Same six fields, `error` changing from
# `Unauthorized` to `NotFound` -- so one parser reads every failure, and the
# correlation id is present on all of them, which is what
# [confluent](../confluent) gets wrong one Recipe over.
#
# **`error` is the status phrase in PascalCase**, not a code and not a
# sentence: `Unauthorized`, `NotFound`. There is no message field anywhere, so
# the only prose about a failure is the phrase HTTP already sent.

recipe: codat
capability: accounting
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.codat.io/platform-api
  # No spec: Codat publishes a rendered reference site.

auth:
  # The API key as the Basic username, base64 of "key:".
  scheme: basic
  keys:
    - cauldr0ncodatf1xturekey000000
  absent_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: results
    count_field: totalResults
    page_field: pageNumber
    limit_field: pageSize
  error:
    style: flat
    # The status phrase in PascalCase, and the closest thing here to a code.
    # There is no message field at all.
    message_field: error
    code_field: "-"
    status_field: statusCode
    fields:
      # The internal deployment that answered.
      service: PublicApi
      # A tri-state sent as a string, and Unknown on everything a public probe
      # can reach.
      canBeRetried: Unknown
      # A second code reserved for detail, carrying none.
      detailedErrorCode: 0

resources:
  company:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      platform:
        type: string
      redirect:
        type: string
      # Untyped, so a company with nothing connected omits it rather than
      # being given a zero date that would read as a sync.
      lastSync:
      created:
        type: datetime
      dataConnections:
        type: list

routes:
  - method: GET
    path: /companies
    resource: company
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: pageSize
      cursor_param: page

errors:
  unauthorized:
    status: 401
    message: Unauthorized
    fields:
      correlationId: 3a94fab495dd0f84c4d17d80c87374df

  unknown_route:
    status: 404
    # The same six fields, one word different. One parser reads every failure
    # this API produces.
    message: NotFound
    fields:
      correlationId: b044c29899cdec00c7254c15d44d322a

fixtures:
  empty:
    company: []

  client:
    company:
      - id: 3d2f9c14-8b7e-4a05-9612-7c8e3d0a5f41
        name: Northwind Traders
        platform: Xero
        redirect: "https://link.codat.io/company/3d2f9c14-8b7e-4a05-9612-7c8e3d0a5f41"
        lastSync: "2026-09-06T03:00:12.4410000Z"
        created: "2026-04-19T10:31:00.0000000Z"
        dataConnections:
          - accounting
      - id: 8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5
        name: Contoso Ltd
        # No platform yet: a company can exist before anything is connected to
        # it, which is what the redirect link is for.
        platform: ""
        redirect: "https://link.codat.io/company/8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5"
        created: "2026-08-28T15:47:22.0000000Z"
        dataConnections: []

conformance:
  - name: the failure declines to say whether to retry
    source: https://api.codat.io/companies
    verified: "2026-09-07"
    fixture: client
    request:
      method: GET
      path: /companies
      headers: {}
    expect:
      status: 401
      body:
        # A tri-state as a string, and this is the only one of the three
        # reachable without an account -- so a client written against this
        # API has an untested branch for the other two.
        canBeRetried: Unknown
        error: Unauthorized

  - name: the detailed code carries no detail
    source: https://api.codat.io/companies
    verified: "2026-09-07"
    fixture: client
    request:
      method: GET
      path: /companies
      headers: {}
    expect:
      status: 401
      body:
        # A second code beside error, reserved for detail, zero on
        # everything.
        detailedErrorCode: 0
        statusCode: 401

  - name: the failure names the deployment that answered
    source: https://api.codat.io/companies
    verified: "2026-09-07"
    fixture: client
    request:
      method: GET
      path: /companies
      headers: {}
    expect:
      status: 401
      body:
        # On a request with no account behind it. Mild, and the same class of
        # thing Gong does with a build number and imgix with a version.
        service: PublicApi
        correlationId: 3a94fab495dd0f84c4d17d80c87374df

  - name: an unknown path keeps every field
    source: https://api.codat.io/cauldron-nope
    verified: "2026-09-07"
    fixture: client
    request:
      method: GET
      path: /cauldron-nope
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
    expect:
      status: 404
      body:
        # Six fields, one word different, and the correlation id is still
        # there -- which is what Confluent gets wrong on the same failure.
        error: NotFound
        statusCode: 404
        canBeRetried: Unknown
        correlationId: b044c29899cdec00c7254c15d44d322a

  - name: there is no message field anywhere
    source: https://api.codat.io/companies
    verified: "2026-09-07"
    fixture: client
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic bm90cmVhbA=="
    expect:
      status: 401
      absent:
        # The only prose about a failure is the status phrase HTTP already
        # sent, in PascalCase, in a field called error.
        - message
        - detail

  - name: companies are wrapped in results with a total
    source: https://docs.codat.io/platform-api
    fixture: client
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
    expect:
      status: 200
      body:
        'results[0].name': Northwind Traders
        'results[0].platform': Xero
        totalResults: 2

  - name: a company can exist before anything is connected
    source: https://docs.codat.io/platform-api
    fixture: client
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
    expect:
      status: 200
      body:
        # An empty platform and no connections, with a redirect link waiting.
        # So a listing of companies is not a listing of data sources, and the
        # count a dashboard shows is the wrong one.
        'results[1].platform': ""
        'results[1].dataConnections': []
      absent:
        - 'results[1].lastSync'

  - name: timestamps carry seven decimal places
    source: https://docs.codat.io/platform-api
    fixture: client
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
    expect:
      status: 200
      body:
        # .NET's DateTime round-trip format: hundred-nanosecond ticks, seven
        # places rather than three. A parser expecting milliseconds either
        # truncates or refuses, and both readings look like a working client.
        'results[0].lastSync': "2026-09-06T03:00:12.4410000Z"
        'results[0].created': "2026-04-19T10:31:00.0000000Z"

  - name: the redirect is the link a customer follows
    source: https://docs.codat.io/platform-api
    fixture: client
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
      query:
        pageSize: "1"
        page: "2"
    expect:
      status: 200
      body:
        # Built from the company id, on a different host from the API -- so
        # this is the one field a client can construct itself and the one it
        # must not, because the host is not api.codat.io.
        'results[0].redirect': "https://link.codat.io/company/8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5"
        pageNumber: 2
        pageSize: 1

  - name: a client with no companies answers an empty array
    source: https://docs.codat.io/platform-api
    fixture: empty
    request:
      method: GET
      path: /companies
      headers:
        Authorization: "Basic Y2F1bGRyMG5jb2RhdGYxeHR1cmVrZXkwMDAwMDA6"
    expect:
      status: 200
      body:
        results: []
        totalResults: 0
