# Shlink Recipe for Cauldron
#
# Written against Shlink's own OpenAPI 3.1 document, published in its own
# repository -- github.com/shlinkio/shlink, docs/swagger/, 18 paths, version 3.0
# -- read on 2026-09-06. The document is split across files: every path, every
# parameter and every schema is a `$ref` to its own JSON file, so reading it
# means fetching about forty of them. Shlink is self-hosted and the public demo
# hosts did not answer, so nothing here is verified live.
#
# **The API version is a path variable, and every path accepts every version.**
#
# The paths are `/rest/v{version}/short-urls`, and `version` is declared as a
# path parameter:
#
#   name: version
#   in: path
#   required: true
#   schema: {type: string, enum: ["3", "2", "1"]}
#
# A string enum of three values. So `/rest/v1/short-urls` and
# `/rest/v3/short-urls` are the same operation with a different substitution,
# and nothing in the schema says which version introduced what.
#
# The document knows -- its own filenames record it: `v1_short-urls.json`,
# `v2_visits.json`, `v3_short-urls_{shortCode}_redirect-rules.json`. That
# knowledge is in the file layout and not in the API description, so
# `/rest/v1/short-urls/{shortCode}/redirect-rules` -- a v3 feature at v1 -- is a
# syntactically valid request that a generated client will happily build.
#
# **The path parameter is only half the identifier.**
#
#   GET    /rest/v{version}/short-urls/{shortCode}?domain=...
#   PATCH  /rest/v{version}/short-urls/{shortCode}?domain=...
#   DELETE /rest/v{version}/short-urls/{shortCode}?domain=...
#
# A short code is unique per domain, not globally: the same code can exist on
# `example.com` and on the default domain at once. `domain` is a query
# parameter, and it is `required: false`.
#
# So the URL of a DELETE does not say which record it removes. Omitting the
# domain deletes the one on the default domain, which may not be the one the
# caller meant -- and there is no error, because both are real short URLs. The
# identity of the thing being destroyed depends on a parameter you can forget.
#
# **`domain: null` means the default domain, not the absence of one.** The field
# is `type: ["string", "null"]`, described as "Null if it belongs to default
# domain". So the falsy value is a specific domain rather than no domain, and
# grouping short URLs by `domain` puts every default-domain link under the key
# `null`.
#
# **Query parameters with square brackets in their names.**
#
# `tags[]` and `excludeTags[]` -- PHP's array convention, in the parameter's
# `name`. A conforming client percent-encodes them to `tags%5B%5D`, and the
# name a generator sees is `tags[]`, which is not an identifier in any language
# it might generate. Every generator renames it, differently.
#
# **The records are two levels down, under the resource's own name.**
#
#   {"shortUrls": {"data": [ ... ], "pagination": { ... }}}
#
# So `body.data` is undefined and `body.shortUrls.data` is the list. The outer
# key is the resource name, which means a shared unwrapper needs to know the
# resource before it can find the records.
#
# **Five numbers in the pagination block, three of which count different
# things.** `currentPage`, `pagesCount`, `itemsPerPage`, `itemsInCurrentPage`
# and `totalItems`. Two count items -- this page and the whole set -- one counts
# pages, and `itemsPerPage` is what was asked for rather than what arrived. A
# client that reads the wrong one of `itemsInCurrentPage` and `totalItems` sizes
# a progress bar to the page.
#
# **A visit count that separates the robots.** `visitsSummary` is
# `{total, nonBots, bots}`, all three required. `total` includes the bots, so
# the obvious field to read is the one that flatters the number -- and the
# honest one is `nonBots`, which a client only finds by looking.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Shlink is self-hosted and
#     the public demo hosts did not answer on 2026-09-06.
#   - Short URLs, listed and fetched. 18 paths is a URL shortener: tags,
#     domains, visits, orphan visits, redirect rules, the Mercure surface and
#     the redirect itself each want their own evidence -- and the redirect,
#     `GET /{shortCode}`, is the only endpoint that matters to an end user.
#   - The version is served as a literal `v3` in the route path. Routing all
#     three would mean claiming this Recipe knows which endpoints each version
#     really serves, which is exactly what the document does not say.
#   - `domain` is declared and not routed. Serving the same short code twice
#     under two domains is the finding, and reproducing it would need two
#     records with one identifier, which this format's store does not hold.

recipe: shlink
capability: marketing
version: 0.1.0

upstream:
  api: "3.0"
  docs: https://shlink.io/documentation/api-docs/
  spec: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/swagger.json
  spec_hash: 8ce1c00ac8907a5e5a33ccae553912a4e206286278fc8915b18628731fc4f2a1
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldron-shlink-api-key-0000
  absent_error: invalid_api_key

responses:
  list:
    # Two levels: the resource's own name, then data.
    style: wrapped
    key: shortUrls.data
    count_field: shortUrls.pagination.totalItems
    page_field: shortUrls.pagination.currentPage
    limit_field: shortUrls.pagination.itemsPerPage
    page_count_field: shortUrls.pagination.itemsInCurrentPage
    pages_field: shortUrls.pagination.pagesCount
  error:
    # RFC 7807, as PeerTube's is -- and Shlink adds its own `type` URIs rather
    # than about:blank.
    style: flat
    message_field: detail
    fields:
      status: 404

resources:
  short_url:
    id:
      style: opaque
      field: shortCode
    fields:
      # The whole address, beside the code -- so the record carries the answer
      # and the ingredient.
      shortUrl:
        type: string
      longUrl:
        type: string
        required: true
      # Null means the default domain, which is a domain, not an absence.
      domain:
        type: string
      title:
        type: string
      tags:
        type: list
      dateCreated:
        type: datetime
      crawlable:
        type: boolean
        default: false
      forwardQuery:
        type: boolean
        default: true
      hasRedirectRules:
        type: boolean
        default: false
      # {total, nonBots, bots}, all three required.
      visitsSummary:

routes:
  - method: GET
    # v3 literally, because the document's `{version}` accepts "1", "2" and "3"
    # and says nothing about which endpoints each really serves.
    path: /rest/v3/short-urls
    resource: short_url
    operation: list
    pagination:
      style: page
      cursor_param: page
      limit_param: itemsPerPage
      limit: 10
      first_page: 1
    filters:
      - field: title
        param: searchTerm

  - method: GET
    path: /rest/v3/short-urls/{id}
    resource: short_url
    operation: get
    not_found: short_url_not_found

errors:
  invalid_api_key:
    status: 401
    message: "Provided API key does not exist or is invalid."
    fields:
      type: "https://shlink.io/api/error/invalid-api-key"
      title: "Invalid API key"
      status: 401
  short_url_not_found:
    status: 404
    message: "No URL found with short code \"nope\""
    fields:
      type: "https://shlink.io/api/error/short-url-not-found"
      title: "Short URL not found"
      status: 404
  invalid_argument:
    status: 400
    message: "Provided data is not valid"
    fields:
      type: "https://shlink.io/api/error/invalid-data"
      title: "Invalid data"
      status: 400
      # Same shape as PeerTube's -- a keyed map of what went wrong -- and this
      # one is not hyphenated.
      invalidElements:
        - longUrl
  rate_limit:
    status: 429
    message: "Too many requests"
    fields:
      type: "https://shlink.io/api/error/too-many-requests"
      title: "Too Many Requests"
      status: 429

fixtures:
  empty:
    short_url: []

  links:
    short_url:
      - shortCode: aB3xY
        shortUrl: https://s.example.com/aB3xY
        longUrl: https://example.com/a-very-long-address
        # A real domain, so this one is not on the default.
        domain: s.example.com
        title: A long address
        tags:
          - docs
          - external
        dateCreated: "2026-04-02T10:11:00+00:00"
        crawlable: false
        forwardQuery: true
        hasRedirectRules: false
        visitsSummary:
          # total includes the bots, and nonBots is the honest number.
          total: 412
          nonBots: 260
          bots: 152
      - shortCode: qP7zK
        shortUrl: https://example.com/qP7zK
        longUrl: https://example.com/another-address
        # Null, meaning the DEFAULT domain -- not the absence of one.
        domain: null
        title: null
        tags: []
        dateCreated: "2026-08-30T16:45:00+00:00"
        crawlable: true
        forwardQuery: false
        hasRedirectRules: true
        visitsSummary:
          total: 0
          nonBots: 0
          bots: 0

conformance:
  - name: the records are two levels down, under the resource's own name
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/paths/v1_short-urls.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        # body.data is undefined; body.shortUrls.data is the list. The outer
        # key is the resource name, so a shared unwrapper has to know the
        # resource before it can find the records.
        'shortUrls.data[0].shortCode': aB3xY
        'shortUrls.data[1].shortCode': qP7zK
      absent:
        - data

  - name: five numbers in the pagination block count three different things
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/definitions/Pagination.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      query:
        page: "1"
        itemsPerPage: "1"
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        # totalItems is the whole set; itemsInCurrentPage is this page;
        # pagesCount counts pages; itemsPerPage is what was asked for rather
        # than what arrived. Reading the wrong one of the two item counts
        # sizes a progress bar to the page.
        'shortUrls.pagination.totalItems': 2
        'shortUrls.pagination.itemsInCurrentPage': 1
        'shortUrls.pagination.pagesCount': 2
        'shortUrls.pagination.currentPage': 1
        'shortUrls.pagination.itemsPerPage': 1

  - name: a null domain is the default domain, not the absence of one
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/definitions/ShortUrl.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        # "Null if it belongs to default domain", in the schema's own words.
        # So the falsy value is a specific domain, and grouping by this field
        # files every default-domain link under the key null.
        'shortUrls.data[1].domain': null
        'shortUrls.data[0].domain': s.example.com

  - name: the short code is only half the identifier
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/paths/v1_short-urls_%7BshortCode%7D.json
    fixture: links
    request:
      method: GET
      # {shortCode} is the path parameter, and `domain` is a query parameter
      # declared required: false on the GET, the PATCH and the DELETE. A short
      # code is unique per domain, so the URL of a destructive call does not
      # say which record it addresses -- and omitting the domain silently
      # means the default one.
      path: /rest/v3/short-urls/aB3xY
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        shortCode: aB3xY
        # The record carries the answer beside the ingredient: the code, and
        # the whole address built from it.
        shortUrl: https://s.example.com/aB3xY
        longUrl: https://example.com/a-very-long-address
        title: A long address
        # Tags are a bare array of strings, filtered by tags[] with literal
        # square brackets in the parameter's name.
        'tags[0]': docs
        'tags[1]': external
        # RFC 3339 with a numeric offset rather than a Z, which is PHP's
        # DateTimeInterface::ATOM and not what most of this collection sends.
        dateCreated: "2026-04-02T10:11:00+00:00"

  - name: a visit count separates the robots, and total includes them
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/definitions/VisitsSummary.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls/aB3xY
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        # All three required. `total` is the obvious field and the flattering
        # one; `nonBots` is the honest one, and a client only finds it by
        # looking.
        'visitsSummary.total': 412
        'visitsSummary.nonBots': 260
        'visitsSummary.bots': 152

  - name: three booleans that change what a redirect does
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/definitions/ShortUrl.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls/qP7zK
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        # crawlable puts it in robots.txt; forwardQuery decides whether the
        # caller's query string survives the redirect; hasRedirectRules says
        # the destination is conditional and this record does not say on what.
        # Three independent booleans, and only the third is a hint that the
        # longUrl above may not be where anyone lands.
        crawlable: true
        forwardQuery: false
        hasRedirectRules: true
        longUrl: https://example.com/another-address

  - name: the search parameter is searchTerm
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/paths/v1_short-urls.json
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      query:
        # Beside tags[] and excludeTags[], whose names carry literal square
        # brackets -- PHP's array convention, in the parameter name, which is
        # not an identifier in any language a generator targets.
        searchTerm: "A long address"
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 200
      body:
        'shortUrls.data[0].shortCode': aB3xY
      absent:
        - 'shortUrls.data[1]'

  - name: no credential is refused with a problem document
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      headers: {}
    expect:
      status: 401
      body:
        # RFC 7807 again, and Shlink mints its own type URIs rather than using
        # about:blank -- so the type is actually a discriminator here, which
        # PeerTube's 404 is not.
        type: "https://shlink.io/api/error/invalid-api-key"
        title: "Invalid API key"
        detail: "Provided API key does not exist or is invalid."
        status: 401

  - name: a missing short code says so in these words
    source: https://raw.githubusercontent.com/shlinkio/shlink/develop/docs/swagger/
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls/nope
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 404
      body:
        type: "https://shlink.io/api/error/short-url-not-found"
        title: "Short URL not found"
        detail: "No URL found with short code \"nope\""
        status: 404

  - name: "invalid data names the fields that were wrong"
    source: "https://shlink.io/documentation/api-docs/"
    arm: invalid_argument
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 400
      body:
        type: "https://shlink.io/api/error/invalid-data"
        title: "Invalid data"
        detail: "Provided data is not valid"
        status: 400
        # An RFC 7807 extension member, and unlike PeerTube's it is spelled
        # without a hyphen -- so this one is a property access.
        'invalidElements[0]': longUrl

  - name: "the rate limit says so in these words"
    source: "https://shlink.io/documentation/api-docs/"
    arm: rate_limit
    fixture: links
    request:
      method: GET
      path: /rest/v3/short-urls
      headers:
        X-Api-Key: cauldron-shlink-api-key-0000
    expect:
      status: 429
      body:
        type: "https://shlink.io/api/error/too-many-requests"
        title: "Too Many Requests"
        detail: "Too many requests"
        status: 429
