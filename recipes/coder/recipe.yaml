# Coder Recipe for Cauldron
#
# Written against Coder's own generated Swagger 2.0 document, published in its
# own repository -- github.com/coder/coder, coderd/apidoc/swagger.json, 344
# paths, "Coder API 2.0" -- read on 2026-09-06. Coder is self-hosted and there
# is no public instance, so nothing here is verified live: every claim is the
# provider's own document.
#
# **The search parameter is a language, and one of its keys is not a filter.**
#
# `GET /api/v2/workspaces` takes `q`, described as a "Search query in the format
# `key:value`". Twelve keys are listed:
#
#   owner            template          name           status
#   has-agent        dormant           healthy        has-ai-task
#   last_used_after  last_used_before  has_external_agent
#   include_agent_metadata
#
# The last one is documented, in the parameter's own description, as
# "expands each agent with the named metadata keys **rather than filtering**;
# repeat the key for multiple items".
#
# So eleven of the twelve narrow the result and the twelfth changes its shape,
# and they share one parameter, one syntax and one description. A caller
# assembling `q` from user input can widen the response by accident, and a
# client typing the response has to know that one search key adds fields to it.
#
# **And the keys do not agree about separators.** `has-agent` and `has-ai-task`
# use hyphens; `has_external_agent`, `last_used_after` and
# `include_agent_metadata` use underscores. Two conventions, one vocabulary, in
# the same string.
#
# **A workspace's state is whether a timestamp is null.**
#
# From the document's own descriptions:
#
#   dormant_at   "DormantAt being non-nil indicates a workspace that is
#                 dormant. A dormant workspace is no longer accessible must be
#                 activated. It is subject to deletion..."
#   deleting_at  "DeletingAt indicates the time at which the workspace will be
#                 permanently deleted. A workspace is eligible for deletion if
#                 it is dormant..."
#
# There is no `status` field carrying "dormant". The state is the nullness of a
# date. So `if (workspace.dormant_at)` is the check, a client that renders the
# value as a date shows the user when they stopped being able to reach it, and a
# listing quietly contains workspaces that are already unreachable.
#
# `deleting_at` is worse: it is a timestamp in the *future*, naming when the
# workspace will be destroyed. A listing of workspaces includes ones scheduled
# for deletion, and nothing but a non-null date in a field says so.
#
# **`/api/experimental/` and `/api/v2/` are in the same document.**
#
# Six paths under `/api/experimental/` -- AI model prices, chat streaming, MCP
# server OAuth callbacks, user skills, a watch stream -- sit beside 300-odd
# under `/api/v2/`, with no marking in the operations themselves. A client
# generated from this document gets methods for all of them and no signal about
# which are stable, beyond a path segment a reader has to notice.
#
# **Three credentials, and one of them names a product feature.**
#
#   Authorization                    apiKey, header
#   Coder-Session-Token              apiKey, header
#   X-AI-Governance-Gateway-Key      apiKey, header
#
# Three header credentials in one API. The third exists for a gateway feature,
# so which header authenticates depends on what the request is for rather than
# on who is calling.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Coder is self-hosted and
#     there is no public instance.
#   - Workspaces, listed and fetched. 344 paths is a development platform:
#     templates, builds, agents, organisations, groups, audit, provisioners,
#     the OAuth2 surface and the whole experimental block each want their own
#     evidence.
#   - `q` is served as a filter on one key. Reproducing the mini-language would
#     mean implementing a parser, and what the finding needs is that one of its
#     keys does not filter -- which is recorded rather than served.
#   - Ten of the 33 workspace fields are modelled.

recipe: coder
capability: hosting
version: 0.1.0

upstream:
  api: "2.0"
  docs: https://coder.com/docs/reference/api
  spec: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
  spec_hash: 99eefc2958df2d92bb43d8005d18191edac6abb7e8fbe08d29f1cbb6927de380
  spec_seen: "2026-09-06"

auth:
  scheme: header
  # Not Authorization, though that is declared too. This is the one Coder's own
  # CLI and SDK send.
  header: Coder-Session-Token
  keys:
    - cauldronCoderSessionToken00000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: workspaces
    count_field: count
  error:
    style: flat
    message_field: message
    fields:
      detail: ""

resources:
  workspace:
    id:
      style: uuid
    fields:
      name:
        type: string
        required: true
      owner_id:
        type: string
      # The username, beside the id -- so a listing carries both and neither
      # is stable: a rename changes one and not the other.
      owner_name:
        type: string
      organization_id:
        type: string
      organization_name:
        type: string
      # Non-nil means dormant. There is no status field that says so.
      dormant_at:
        type: string
      # A timestamp in the future, naming when this will be destroyed.
      deleting_at:
        type: string
      last_used_at:
        type: datetime
      created_at:
        type: datetime
      # Whether the template moved on without it.
      outdated:
        type: boolean
        default: false
      favorite:
        type: boolean
        default: false
      # Milliseconds, and the only duration on the record.
      ttl_ms:
        type: number

routes:
  - method: GET
    path: /api/v2/workspaces
    resource: workspace
    operation: list
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 25
    filters:
      - field: owner_name
        param: q

  - method: GET
    path: /api/v2/workspaces/{id}
    resource: workspace
    operation: get
    not_found: not_found

errors:
  unauthorized:
    status: 401
    message: "Invalid session token."
    fields:
      detail: "Session token is invalid or expired."
  not_found:
    status: 404
    message: "Resource not found or you do not have access to this resource"
    fields:
      detail: ""
  forbidden:
    status: 403
    message: "Forbidden."
    fields:
      detail: ""
  rate_limit:
    status: 429
    message: "You've been rate limited."
    fields:
      detail: "Please wait and try again."

fixtures:
  empty:
    workspace: []

  deployment:
    workspace:
      - id: 8a2f1c4d-3b5e-4a6f-9c8d-0e1f2a3b4c5d
        name: dev
        owner_id: 11111111-1111-4111-8111-111111111111
        owner_name: cauldron
        organization_id: 22222222-2222-4222-8222-222222222222
        organization_name: coder
        # Reachable: both dates are null.
        dormant_at: null
        deleting_at: null
        last_used_at: "2026-09-06T08:41:00Z"
        created_at: "2026-05-12T09:00:00Z"
        outdated: false
        favorite: true
        ttl_ms: 28800000
      - id: 4c6e8a0b-2d4f-4681-a3c5-6e7f8a9b0c1d
        name: old-branch
        owner_id: 11111111-1111-4111-8111-111111111111
        owner_name: cauldron
        organization_id: 22222222-2222-4222-8222-222222222222
        organization_name: coder
        # Non-nil, so this one is dormant -- and no field says the word.
        dormant_at: "2026-08-14T00:00:00Z"
        # And a date in the future, which is when it will be destroyed. It is
        # in a listing of workspaces like any other.
        deleting_at: "2026-09-13T00:00:00Z"
        last_used_at: "2026-07-02T16:20:00Z"
        created_at: "2026-02-01T11:30:00Z"
        # The template moved on without it.
        outdated: true
        favorite: false
        ttl_ms: 28800000

conformance:
  - name: a workspace's state is whether a timestamp is null
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # "DormantAt being non-nil indicates a workspace that is dormant."
        # There is no status field carrying the word, so the check is the
        # nullness of a date -- and a client that renders the value shows the
        # user when they stopped being able to reach it.
        'workspaces[0].dormant_at': null
        'workspaces[1].dormant_at': "2026-08-14T00:00:00Z"

  - name: a listing contains workspaces scheduled for deletion
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # A timestamp in the FUTURE, naming when the workspace will be
        # permanently deleted -- and it sits in an ordinary listing beside a
        # healthy one, with nothing but this field to tell them apart.
        'workspaces[1].deleting_at': "2026-09-13T00:00:00Z"
        'workspaces[0].deleting_at': null
        'workspaces[1].name': old-branch

  - name: the search parameter takes key:value pairs
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      query:
        # Twelve keys share this one parameter, and the twelfth --
        # include_agent_metadata -- is documented as expanding the response
        # "rather than filtering". So a search string can widen what comes
        # back, and a client typing the response has to know that.
        #
        # The keys also disagree about separators: has-agent and has-ai-task
        # use hyphens, has_external_agent and last_used_after use underscores.
        q: cauldron
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        'workspaces[0].owner_name': cauldron
        count: 2

  - name: the count is the whole set and the records are under their own name
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      query:
        limit: "1"
        offset: "0"
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # {count, workspaces} -- the resource's own name as the key, so a
        # shared unwrapper has to know the resource before it can find the
        # records.
        count: 2
        'workspaces[0].name': dev
      absent:
        - 'workspaces[1]'
        - data
        - results

  - name: a record carries the owner twice and neither is stable
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces/8a2f1c4d-3b5e-4a6f-9c8d-0e1f2a3b4c5d
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # The uuid and the username, and the same again for the organisation.
        # A rename changes the name and not the id, so a client that displays
        # one and keys on the other shows a stale label until it refetches.
        owner_id: 11111111-1111-4111-8111-111111111111
        owner_name: cauldron
        organization_id: 22222222-2222-4222-8222-222222222222
        organization_name: coder
        name: dev

  - name: outdated says the template moved on without it
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # A boolean about a relationship to another record, on this one -- so
        # it is true until somebody rebuilds, and nothing here says which
        # version it is behind.
        'workspaces[1].outdated': true
        'workspaces[0].outdated': false
        'workspaces[0].favorite': true

  - name: the only duration on the record is milliseconds
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces/8a2f1c4d-3b5e-4a6f-9c8d-0e1f2a3b4c5d
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 200
      body:
        # ttl_ms, beside four RFC 3339 strings. One duration in milliseconds
        # and four instants as text, on one record.
        ttl_ms: 28800000
        last_used_at: "2026-09-06T08:41:00Z"
        created_at: "2026-05-12T09:00:00Z"

  - name: no credential is refused
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers: {}
    expect:
      status: 401
      body:
        # message and detail, both present, and detail is the empty string on
        # most failures -- so a client that reports detail reports nothing.
        message: "Invalid session token."
        detail: "Session token is invalid or expired."

  - name: a missing workspace and a forbidden one say the same thing
    source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces/00000000-0000-4000-8000-000000000000
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 404
      body:
        # "Resource not found or you do not have access to this resource" --
        # one sentence covering both, which is a deliberate choice not to leak
        # existence, and it means a caller cannot tell a typo from a
        # permission problem.
        message: "Resource not found or you do not have access to this resource"

  - name: "a forbidden request says so in these words"
    source: "https://coder.com/docs/reference/api"
    arm: forbidden
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 403
      body:
        message: "Forbidden."

  - name: "the rate limit says so in these words"
    source: "https://coder.com/docs/reference/api"
    arm: rate_limit
    fixture: deployment
    request:
      method: GET
      path: /api/v2/workspaces
      headers:
        Coder-Session-Token: cauldronCoderSessionToken00000000
    expect:
      status: 429
      body:
        message: "You've been rate limited."
        detail: "Please wait and try again."
