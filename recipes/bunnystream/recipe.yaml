# Bunny Stream Recipe for Cauldron
#
# video.bunnycdn.com is one of the two hosts bunny/recipe.yaml already
# models, and that Recipe's own header states its purpose precisely: the
# async pair between a Video Library (synchronous) and a Video (which is
# not). This Recipe is not a duplicate of it. It exists for the question
# this group was formed to ask -- one status or two disagreeing
# vocabularies, does a caller learn why an encode failed, is progress a
# trustworthy percentage -- and for one live finding bunny/recipe.yaml never
# probed: what a library id that is not yours answers versus one that does
# not exist. Every credential and routing case below was struck live today
# against video.bunnycdn.com directly, independently of that Recipe's own
# probes, with no account and no key.
#
# **The status vocabulary is one field, and it has two failure words on it,
# not zero and not two disagreeing ones.** bunny.net's own rendered schema
# for the Video object (bunny.net/docs/api-reference/stream/manage-videos/
# get-video, read from the page's own embedded JSON rather than paraphrased)
# declares one integer enum, status, with nine members: 0 Created, 1
# Uploaded, 2 Processing, 3 Transcoding, 4 Finished, 5 Error, 6
# UploadFailed, 7 JitSegmenting, 8 JitPlaylistsCreated. Finished is the one
# success word. Error and UploadFailed are both failure words, both on the
# identical field, both reachable from a fresh Created record without
# reading any second object -- Bunny does not repeat Livepeer's asset/task
# split in this collection at all. What it has instead is two ways to fail
# rather than one, and nothing on the record says which of the two a caller
# should expect for which cause; a client branching on "status == 5" alone
# misses every UploadFailed video.
#
# **A failed encode says why, in more detail than either of this group's
# other two Recipes -- and with no worked example to check any of it
# against.** The same schema declares transcodingMessages, an array bunny/
# recipe.yaml's own field list does not carry at all:
#
#   timeStamp   string, date-time
#   level       integer enum: 0 Undefined ("Shouldn't be used"), 1
#               Information, 2 Warning, 3 Error ("An error, meaning that
#               the video will most likely not be playable")
#   issueCode   integer enum, twelve members: 0 Undefined through 11
#               CaptionGenerationFailed, by way of 7 OriginalCorrupted
#               ("video file is corrupted and couldn't be processed
#               properly") and 10 JitFailed ("video failed JIT encoding")
#   message     string | null
#   value       string | null
#
# A severity, a numeric taxonomy of twelve specific causes, and a free-text
# sentence -- richer than Cloudflare Stream's errorReasonCode/
# errorReasonText pair and further from api.video's answer of nothing at
# all, this collection's other two Recipes against this same question. And
# it is the one part of this Recipe with no worked JSON anywhere to cite:
# bunny/recipe.yaml's own header already states that no field on this
# object has a published example, and this array is no exception. Every
# fixture below that populates it uses the schema's own enum members --
# level 3, issueCode 7 -- with message and value left absent, because a
# free-text sentence has no citable value and inventing one would be
# exactly the fabrication Step 3 forbids.
#
# **encodeProgress is declared with no stated units or range at all, which
# is a third answer to this group's progress question.** Cloudflare Stream
# states pctComplete is "a percentage as a string, between 0 and 100."
# api.video states its quality.status enum has four members and no percent
# field at all. Bunny's own schema entry for encodeProgress reads, in
# full: "type: integer, format: int32, description: The current encode
# progress of the video." No stated range, no stated unit, not even a claim
# that it is a percentage -- the field bunny/recipe.yaml's own header
# already declined to give any fixture a value to, for the same reason.
# This Recipe does the same and states the schema's own silence rather than
# assuming the obvious reading is the correct one.
#
# **The schema and the guide disagree about what a freshly created video
# carries, on this provider's own materials.** Every property on the Video
# schema -- status, encodeProgress, width, height, framerate, outputCodecs,
# thumbnailCount, storageSize among them -- is marked "isRequired": true in
# bunny.net's own rendered page. bunny.net/docs/reference/video_createvideo
# says otherwise in prose: a freshly created video has nothing populated
# beyond status, because nothing has been uploaded or encoded yet -- the
# fact bunny/recipe.yaml's own header and fixture already rely on. One
# provider, one schema and one guide, disagreeing about whether "required"
# means "the response type promises this key" or "the value exists yet."
# This Recipe follows the guide's prose over the schema's blanket
# requiredness, the same choice bunny/recipe.yaml already made, and states
# the tension here because nothing forced that choice to be checked before.
#
# **A library id that is not yours and one that does not exist answer
# identically, because nothing this far can tell them apart -- and a
# non-numeric one is caught before either question is even asked.** Four
# requests, struck live today, no credential on any of them:
#
#   GET /library/308006/videos   -> 401 {"Success":false,"Message":
#                                     "Authentication has been denied for
#                                     this request.","StatusCode":401}
#   GET /library/0/videos        -> byte-identical
#   GET /library/abc/videos      -> 400 {"type":"https://tools.ietf.org/
#                                     html/rfc9110#section-15.5.1","title":
#                                     "One or more validation errors
#                                     occurred.","status":400,"errors":
#                                     {"libraryId":["The value 'abc' is not
#                                     valid."]},"traceId":"..."}
#   GET /library/abc/videos, AccessKey: junkjunkjunk12345
#                                 -> byte-identical to the 400 above
#
# libraryId is bound to a numeric route parameter, and ASP.NET's own model
# binding rejects a non-numeric value with its own RFC 9110 problem details
# before any application code -- including the credential check -- ever
# runs, whether or not a credential was sent. A numeric-shaped id, real or
# not, is accepted by the router and gated by the ordinary credential check
# like anything else, and every numeric id this Recipe tried answered
# identically. That is a narrower version of the finding Clockify's Recipe
# makes elsewhere in this collection about a workspace id in the same
# position -- there, literally any string works; here, only the numeric
# ones do, and the ones that are not get a distinctly-shaped refusal for a
# completely different reason. The video id in the path one segment further
# along is not bound this way at all: GET .../videos/not-a-guid, string
# rather than numeric, reaches the identical ordinary 401 a real-looking
# guid does, credential or none -- struck live both ways. So this host
# shape-validates one path parameter ahead of authentication and not its
# neighbour, which auth.go's Canada Post entry already names as a pattern
# this format's AfterRouting boolean cannot express, and this Recipe states
# it rather than forcing it.
#
# **AccessKey, and the two verdicts this scheme can distinguish collapse to
# one.** No header at all and a well-formed junk value both answer the
# identical 401 above, struck live both ways against a numeric library id.
# auth.absent_error and auth.rejected_error both name the same entry
# deliberately, the way this format's own guidance prefers over leaving one
# unset: a Recipe that names the same entry for two verdicts is stating
# that the provider does not tell them apart, which is what was found here.
# auth.malformed_error is left unset, because this scheme declares no
# prefix and no pattern for Cauldron's own credential check to rule a
# shape out with (internal/runtime/auth.go: Malformed is reached only
# through a wrong prefix or an empty value after one, neither of which
# applies to a bare header scheme), so nothing this Recipe observed could
# have reached it even if a third sentence existed to find.
#
# **Both routing checks bunny/recipe.yaml already established were
# re-struck rather than assumed, and agree.** An unrouted path 404s with an
# empty body and no credential examined; a wrong method on a real path
# answers a real 405 with Allow: GET, POST and an empty body, credential or
# none. Both dated below independently.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Of roughly thirty documented Video fields this Recipe declares
#     fifteen, one more than bunny/recipe.yaml's own count because
#     transcodingMessages is new here. collectionId, category, chapters,
#     moments, captions, smartGenerateStatus and the analytics pair
#     (averageWatchTime, totalWatchTime) are real and absent.
#   - No worked JSON example exists anywhere in Bunny's published reference
#     for a Video object, the same absence bunny/recipe.yaml's own header
#     states -- this Recipe proves the shape and populates only the
#     identifiers it mints itself and the enum values the schema itself
#     names, never a field bunny.net has not put a number or a sentence to.
#   - Video Library management (api.bunny.net) is out of scope entirely.
#     This Recipe is Stream only.
#   - Update and delete are not modelled, and create is modelled only as a
#     doc-sourced, unverified route -- never called against the live host,
#     the same restraint this group's rule against uploading or modifying
#     anything requires. It exists mainly so this Recipe's own computed
#     Allow header agrees with what Bunny actually advertises on the list
#     path; every credential and status finding above needed only the two
#     GET routes.
#
# Keys below are fixtures, not secrets.

recipe: bunnystream
capability: media
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.bunny.net/reference/video_getvideo

auth:
  scheme: header
  header: AccessKey
  keys:
    - cauldron-bunnystream-fixture-accesskey-00000
  # Both verdicts this scheme can reach collapse to the identical sentence
  # -- see the header. Named explicitly rather than left to the shared
  # fallback, so a reader can see both were checked rather than assuming
  # only one was.
  absent_error: stream_authentication_error
  rejected_error: stream_authentication_error
  # Routing and the method are resolved before the credential, verified
  # both ways below: an unrouted path 404s and a wrong method 405s with no
  # AccessKey examined at all. This is Fireworks' own arrangement
  # elsewhere in this collection and the reverse of the default. It does
  # not reach far enough to express the libraryId shape check the header
  # describes -- Cauldron's router matches a path template as a string
  # with no notion of a typed segment to fail on, so that finding stays
  # prose rather than a case; see the header for exactly what it cannot
  # reproduce.
  after_routing: true

responses:
  resource:
    style: bare
  list:
    style: wrapped
  error:
    style: flat
    message_field: Message
    code_field: "-"
    status_field: StatusCode
    fields:
      Success: false

resources:
  video:
    collection: items
    id:
      style: uuid
      field: guid
    fields:
      # Named to match the {libraryId} path parameter for scope matching;
      # rendered on the wire under Bunny's own name, videoLibraryId.
      libraryId:
        type: integer
        as: videoLibraryId
      title:
        type: string
      dateUploaded:
        type: datetime
      views:
        type: integer
        default: 0
      isPublic:
        type: boolean
        default: false
      # 0 Created, 1 Uploaded, 2 Processing, 3 Transcoding, 4 Finished, 5
      # Error, 6 UploadFailed, 7 JitSegmenting, 8 JitPlaylistsCreated -- the
      # full enum, one field, two failure words on it. See the header.
      status:
        type: integer
        default: 0
      length:
        type: integer
      width:
        type: integer
      height:
        type: integer
      framerate:
        type: number
      availableResolutions:
        type: string
      thumbnailFileName:
        type: string
      hasMP4Fallback:
        type: boolean
        default: false
      # No stated range or unit anywhere in the schema -- see the header.
      # Declared and never given a fixture value, the same restraint
      # bunny/recipe.yaml already applies to this field.
      encodeProgress:
        type: integer
      # New in this Recipe -- see the header. A severity, a twelve-member
      # cause taxonomy and a free-text pair, with no worked example
      # anywhere to cite a populated message or value from.
      transcodingMessages:
        type: list

routes:
  - method: GET
    path: /library/{libraryId}/videos
    resource: video
    operation: list
    scope: [libraryId]
    pagination:
      style: page
      limit: 100
      limit_param: itemsPerPage
      cursor_param: page
      first_page: 1

  - method: GET
    path: /library/{libraryId}/videos/{id}
    resource: video
    operation: get
    scope: [libraryId]

  # 200, status 0 (Created) -- bunny.net/docs/reference/video_createvideo's
  # own words: nothing else populated because nothing has been uploaded or
  # encoded yet. Doc-sourced, not called: no account exists to create a
  # video with. Declared mainly so this Recipe's own computed Allow header
  # on the list path matches what Bunny actually sends -- GET and POST --
  # rather than the GET-only header an emulator with no create route would
  # compute.
  - method: POST
    path: /library/{libraryId}/videos
    resource: video
    operation: create
    scope: [libraryId]
    status: 200

errors:
  # video.bunnycdn.com's own envelope: Success, Message, StatusCode.
  # Verified live for both absent and rejected -- see the header.
  stream_authentication_error:
    status: 401
    message: Authentication has been denied for this request.

  # Live: zero bytes, no envelope at all -- neither of Kestrel's own
  # framework-level responses carries the application's Success/Message/
  # StatusCode shape. Allow is still computed and set beside this one; see
  # internal/runtime/handler.go for why declaring the real 405 status here
  # is what keeps that header attached.
  unknown_route:
    status: 404
    empty: true

  method_not_allowed:
    status: 405
    empty: true

fixtures:
  empty: {}

  small-library:
    video:
      # Just created: status 0, nothing else populated -- the guide's own
      # words, not the schema's blanket "isRequired". See the header.
      - guid: 8f14e45f-ceea-467e-adde-3fb5c96725db
        libraryId: 308006
        title: onboarding-draft.mov
        dateUploaded: "2026-08-30T14:02:00Z"
        views: 0
        isPublic: false
        status: 0

      # Finished: the one status value that plays.
      - guid: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        libraryId: 308006
        title: product-launch-2026.mp4
        dateUploaded: "2026-08-14T10:00:00Z"
        views: 812
        isPublic: true
        status: 4
        hasMP4Fallback: true

      # Error: the first of the two failure words on this one field, with
      # a transcoding message explaining why -- level 3 (Error, "the video
      # will most likely not be playable") and issueCode 7
      # (OriginalCorrupted, "video file is corrupted and couldn't be
      # processed properly"), both the schema's own enum titles, cited
      # rather than invented. message and value are left off: no worked
      # example anywhere gives either a citable string.
      - guid: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        libraryId: 308006
        title: corrupted-upload.mov
        dateUploaded: "2026-08-15T02:00:00Z"
        views: 0
        isPublic: false
        status: 5
        transcodingMessages:
          - timeStamp: "2026-08-15T02:05:00Z"
            level: 3
            issueCode: 7

      # UploadFailed: the second failure word this one field carries, and
      # the reason a client checking only "status == 5" misses videos that
      # never got as far as being decoded at all.
      - guid: 1a5a3f10-0000-4000-8000-000000000009
        libraryId: 308006
        title: never-finished-uploading.mp4
        dateUploaded: "2026-08-16T02:00:00Z"
        views: 0
        isPublic: false
        status: 6

conformance:
  - name: no AccessKey at all is refused, and the video id is not what stops it
    source: https://video.bunnycdn.com/library/308006/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /library/308006/videos
    expect:
      status: 401
      body:
        Success: false
        Message: Authentication has been denied for this request.
        StatusCode: 401

  - name: a well-formed wrong AccessKey answers byte-identically
    source: https://video.bunnycdn.com/library/308006/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /library/308006/videos
      headers:
        AccessKey: junkjunkjunk12345
    expect:
      status: 401
      body:
        Success: false
        Message: Authentication has been denied for this request.

  - name: a library id that is somebody else's answers the identical sentence a nonexistent one does
    # /library/0/videos, struck live with no credential -- byte-identical
    # to /library/308006/videos above. Neither this Recipe nor the live
    # host can tell "not yours" from "does not exist" from "is yours" at
    # this layer; see the header.
    source: https://video.bunnycdn.com/library/0/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /library/0/videos
    expect:
      status: 401
      body:
        Success: false
        Message: Authentication has been denied for this request.
        StatusCode: 401

  # The non-numeric-libraryId shape check (GET /library/abc/videos, live,
  # 400 RFC 9110 problem details, beating even a presented AccessKey) is
  # stated in the header rather than modelled here: Cauldron's router
  # matches a path template as a plain string, with no notion of a typed
  # segment to fail on ahead of the credential the way ASP.NET's model
  # binding does. A case sending that path through this Recipe would reach
  # the ordinary credential check and answer 401, not the 400 actually
  # struck live -- so it is recorded as evidence rather than forced into a
  # case that would misstate what this runtime does.

  - name: an unrouted path 404s with an empty body, no credential needed to see it
    source: https://video.bunnycdn.com/totally-bogus-endpoint-xyz
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /totally-bogus-endpoint-xyz
    expect:
      status: 404
      no_body: true

  - name: a wrong method on a real path is a real 405 with a real Allow header, no credential needed
    source: https://video.bunnycdn.com/library/308006/videos
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /library/308006/videos
    expect:
      status: 405
      headers:
        Allow: "GET, POST"
      no_body: true

  - name: a video mid-lifecycle carries nothing beyond status, per the guide rather than the schema's blanket requiredness
    source: https://bunny.net/docs/reference/video_createvideo
    fixture: small-library
    request:
      method: GET
      path: /library/308006/videos/8f14e45f-ceea-467e-adde-3fb5c96725db
      headers:
        AccessKey: cauldron-bunnystream-fixture-accesskey-00000
    expect:
      status: 200
      body:
        status: 0
        title: onboarding-draft.mov
      absent:
        - length
        - encodeProgress
        - transcodingMessages

  - name: two failure words share the one field a success word is on
    source: https://bunny.net/docs/reference/video_getvideo
    fixture: small-library
    request:
      method: GET
      path: /library/308006/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8
      headers:
        AccessKey: cauldron-bunnystream-fixture-accesskey-00000
    expect:
      status: 200
      body:
        status: 5
        "transcodingMessages[0].level": 3
        "transcodingMessages[0].issueCode": 7
      absent:
        - "transcodingMessages[0].message"
        - "transcodingMessages[0].value"

  - name: UploadFailed is the second failure word, and status alone does not distinguish which one happened
    source: https://bunny.net/docs/reference/video_getvideo
    fixture: small-library
    request:
      method: GET
      path: /library/308006/videos/1a5a3f10-0000-4000-8000-000000000009
      headers:
        AccessKey: cauldron-bunnystream-fixture-accesskey-00000
    expect:
      status: 200
      body:
        status: 6
        title: never-finished-uploading.mp4

  - name: a non-guid video id is not shape-checked the way the library id is
    # Struck live: GET .../videos/not-a-guid answers the ordinary 401, not
    # a 400 -- the video id segment is bound as an opaque string rather
    # than a typed route parameter. Verified both with and without a
    # credential; both answered byte-identical to an ordinary wrong id.
    source: https://video.bunnycdn.com/library/308006/videos/not-a-guid
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /library/308006/videos/not-a-guid
      headers:
        AccessKey: junkjunkjunk12345
    expect:
      status: 401
      body:
        Success: false
        Message: Authentication has been denied for this request.

  - name: a freshly created video starts at status 0 with nothing else populated
    # bunny.net/docs/reference/video_createvideo's own words. Not observed
    # -- no account exists to create one.
    source: https://bunny.net/docs/reference/video_createvideo
    fixture: empty
    request:
      method: POST
      path: /library/308006/videos
      headers:
        AccessKey: cauldron-bunnystream-fixture-accesskey-00000
      json:
        title: new-upload.mov
    expect:
      status: 200
      body:
        status: 0
      absent:
        - length
        - encodeProgress
        - transcodingMessages

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the video listing answers with what the fixture holds"
    source: "https://bunny.net/docs/reference/video_createvideo"
    fixture: small-library
    request:
      method: GET
      path: "/library/308006/videos"
      headers:
        "AccessKey": "cauldron-bunnystream-fixture-accesskey-00000"
    expect:
      status: 200
      body:
        "items[0].guid": "8f14e45f-ceea-467e-adde-3fb5c96725db"
        "items[1].guid": "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      absent:
        - "items[4]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # itemsPerPage=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "itemsPerPage and page are the two names this listing reads"
    source: "https://bunny.net/docs/reference/video_createvideo"
    fixture: small-library
    request:
      method: GET
      path: "/library/308006/videos"
      query:
        "itemsPerPage": "1"
        "page": "2"
      headers:
        "AccessKey": "cauldron-bunnystream-fixture-accesskey-00000"
    expect:
      status: 200
      body:
        "items[0].guid": "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      absent:
        - "items[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # itemsPerPage=1 and page=2, which is a page number, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "itemsPerPage and page are the two names this listing reads on library {libraryId} videos"
    source: "https://bunny.net/docs/reference/video_createvideo"
    fixture: small-library
    request:
      method: GET
      path: "/library/308006/videos"
      query:
        "itemsPerPage": "1"
        "page": "2"
      headers:
        "AccessKey": "cauldron-bunnystream-fixture-accesskey-00000"
    expect:
      status: 200
      body:
        "items[0].guid": "3f2504e0-4f89-11d3-9a0c-0305e82c3301"
      absent:
        - "items[1]"

  # The names. This Recipe declares 12 field(s) on a video that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a video carries the field names this Recipe declares"
    source: "https://bunny.net/docs/reference/video_createvideo"
    fixture: small-library
    request:
      method: GET
      path: "/library/308006/videos"
      headers:
        "AccessKey": "cauldron-bunnystream-fixture-accesskey-00000"
    expect:
      status: 200
      body:
        "items[0].dateUploaded": "2026-08-30T14:02:00Z"
        "items[0].hasMP4Fallback": false
        "items[0].isPublic": false
        "items[0].videoLibraryId": 308006
        "items[0].views": 0




