# PocketBase Recipe for Cauldron
#
# The collections listing, read from PocketBase's own source and documentation
# -- it is open -- and struck live against pocketbase.io on 2026-09-13 with no
# credential, with a deliberately invalid one, and on a path that does not
# exist.
#
# **The success key is on every failure, empty.** Struck live:
#
#   (no header)      401 {"data":{},"message":"The request requires valid record authorization token.","status":401}
#   Authorization: x 401 {"data":{},"message":"The request requires valid record authorization token.","status":401}
#   /api/cauldron-nope 404 {"data":{},"message":"File not found.","status":404}
#
# `data` is where a successful write puts its record, and it is present and
# empty on every error. So `body.data` is truthy on both a success and a
# failure, and a client testing for it learns nothing.
#
# **An unrouted API path is a missing file.** `File not found.` -- because the
# same process serves the API and the static web assets, so a path that matches
# no route falls through to the file server and is reported as a file. A caller
# who mistypes an endpoint is told about the filesystem.
#
# **And the two credential states are one sentence.** A missing header and a
# wrong token answer byte-identical bodies.
#
# **`null` is the most restrictive value a rule can have and `""` is the most
# permissive.** Each collection carries five access rules -- `listRule`,
# `viewRule`, `createRule`, `updateRule`, `deleteRule` -- typed as nullable
# strings, and PocketBase's own documentation gives them these meanings:
#
#   null            only an authorised superuser (this is the default)
#   ""              anyone: superusers, authorised users and guests
#   "expression"    only callers satisfying the filter
#
# So the difference between "nobody but an administrator" and "the entire
# internet" is `null` against `""` in a JSON string field -- two values that
# most languages treat as equally falsy, that most form encoders cannot tell
# apart, and that differ by two characters in a diff.
#
# **A listing that fails its rule answers 200 and no records.** From the same
# documentation: "the API will return 200 empty items response in case a request
# doesn't satisfy a listRule, 400 for unsatisfied createRule". Authorisation
# failure on a read is shaped exactly like an empty collection, so a client
# cannot tell "you may not see these" from "there are none".
#
# **The rules are also filters.** The documentation again: "PocketBase API Rules
# act also as records filter" -- the same expression that decides whether a
# caller may list also decides which rows come back, so a partial result and a
# complete one are indistinguishable.
#
# **One record shape covers three kinds of collection.** `Collection` embeds
# base, auth and view options together, so a base collection's record carries
# the fields an auth collection would use and a view collection's carries both.

recipe: pocketbase
capability: database
version: 0.1.0

upstream:
  api: v0
  docs: https://pocketbase.io/docs/api-collections/
  # No spec: PocketBase documents this API as prose and ships its own JS and
  # Dart clients. There is no OpenAPI document at any address this Recipe could
  # find; the record shape below is read from core/collection_model.go, which
  # is the artefact a description would have produced.

auth:
  # A superuser token, in the header without a scheme prefix.
  scheme: header
  header: Authorization
  keys:
    - cauldr0n.p0cketbase.f1xture
  # One sentence for both states.
  absent_error: unauthorized
  rejected_error: unauthorized
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    page_field: page
    limit_field: perPage
    count_field: totalItems
    pages_field: totalPages
  error:
    style: flat
    message_field: message
    # The HTTP status, repeated in the body.
    status_field: status
    code_field: "-"
    fields:
      # The success key, present and empty, on every failure.
      data: {}

resources:
  collection:
    id:
      field: id
      style: opaque
      length: 15
    fields:
      name:
        type: string
      # base, auth or view -- and one record shape covers all three.
      type:
        type: string
      system:
        type: boolean
      fields:
        type: list
      indexes:
        type: list
      created:
        type: datetime
      updated:
        type: datetime
      # Untyped, so the difference between null and "" survives: null is
      # superusers only and "" is everyone.
      listRule:
      viewRule:
      createRule:
      updateRule:
      deleteRule:

routes:
  - method: GET
    path: /api/collections
    resource: collection
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 30
      max_limit: 500
      limit_param: perPage
      cursor_param: page

errors:
  unauthorized:
    status: 401
    message: The request requires valid record authorization token.

  unknown_route:
    status: 404
    # The API and the static assets are served by one process, so an unrouted
    # path falls through to the file server.
    message: File not found.

fixtures:
  empty:
    collection: []

  instance:
    collection:
      - id: pbc_3142635823
        name: posts
        type: base
        system: false
        # Anyone, including guests.
        listRule: ""
        viewRule: ""
        # Only callers satisfying the expression.
        createRule: "@request.auth.id != ''"
        updateRule: "@request.auth.id = author"
        # Superusers only, which is what null means.
        deleteRule: null
        fields:
          - name: title
            type: text
            required: true
          - name: author
            type: relation
            required: false
        indexes: []
        created: "2026-01-15T09:30:00.000Z"
        updated: "2026-06-02T14:12:05.000Z"
      - id: _pb_users_auth_
        name: users
        type: auth
        # A system collection, which cannot be renamed, deleted or have its
        # rules changed.
        system: true
        # Every rule locked: null on all five.
        listRule: null
        viewRule: null
        createRule: null
        updateRule: null
        deleteRule: null
        fields:
          - name: email
            type: email
            required: true
        indexes:
          - "CREATE UNIQUE INDEX idx_users_email ON users (email)"
        created: "2026-01-15T09:30:00.000Z"
        updated: "2026-01-15T09:30:00.000Z"

conformance:
  - name: the success key is on the failure, empty
    source: https://pocketbase.io/api/collections
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers: {}
    expect:
      status: 401
      body:
        # Truthy on a success and truthy on a failure.
        data: {}
        message: The request requires valid record authorization token.
        # And the status, repeated inside the body.
        status: 401

  - name: a wrong token is the same sentence
    source: https://pocketbase.io/api/collections
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: notarealtoken
    expect:
      status: 401
      body:
        # Byte-identical to the case above.
        message: The request requires valid record authorization token.
        data: {}

  - name: an unrouted API path is a missing file
    source: https://pocketbase.io/api/cauldron-nope
    verified: "2026-09-13"
    fixture: instance
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Authorization: notarealtoken
    expect:
      status: 404
      body:
        # One process serves the API and the static assets, so a path that
        # matches no route is reported as a file.
        message: File not found.
        status: 404
        data: {}

  - name: null is the locked rule and empty string is the open one
    source: https://pocketbase.io/docs/api-rules-and-filters/
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
    expect:
      status: 200
      body:
        # "" means superusers, authorised users and guests...
        'items[0].listRule': ""
        'items[0].viewRule': ""
        # ...and null means only an authorised superuser.
        'items[0].deleteRule': null
        'items[1].listRule': null
        'items[1].viewRule': null

  - name: a rule that is not null or empty is a filter expression
    source: https://pocketbase.io/docs/api-rules-and-filters/
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
    expect:
      status: 200
      body:
        # The same field that holds null and "" also holds code, and the same
        # expression filters which records come back.
        'items[0].createRule': "@request.auth.id != ''"
        'items[0].updateRule': "@request.auth.id = author"

  - name: a system collection cannot be changed and says so
    source: https://github.com/pocketbase/pocketbase/blob/master/core/collection_model.go
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
    expect:
      status: 200
      body:
        'items[1].system': true
        'items[1].name': users
        'items[1].type': auth
        'items[1].id': _pb_users_auth_
        'items[0].system': false
        'items[0].type': base

  - name: a collection carries its own schema and its own indexes
    source: https://github.com/pocketbase/pocketbase/blob/master/core/collection_model.go
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
    expect:
      status: 200
      body:
        'items[0].fields[0].name': title
        'items[0].fields[0].type': text
        'items[0].fields[0].required': true
        'items[0].fields[1].type': relation
        # Raw SQL, in a JSON array, on the record.
        'items[1].indexes[0]': "CREATE UNIQUE INDEX idx_users_email ON users (email)"
        'items[0].indexes': []
        'items[0].created': "2026-01-15T09:30:00.000Z"
        'items[0].updated': "2026-06-02T14:12:05.000Z"

  - name: the envelope counts pages and records
    source: https://pocketbase.io/docs/api-collections/
    fixture: instance
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
      query:
        perPage: "1"
        page: "1"
    expect:
      status: 200
      body:
        page: 1
        perPage: 1
        totalItems: 2
        totalPages: 2
        'items[0].id': pbc_3142635823

  - name: an instance with no collections still carries the counts
    source: https://pocketbase.io/docs/api-collections/
    fixture: empty
    request:
      method: GET
      path: /api/collections
      headers:
        Authorization: cauldr0n.p0cketbase.f1xture
    expect:
      status: 200
      body:
        items: []
        totalItems: 0
