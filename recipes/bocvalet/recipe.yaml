# Bank of Canada Valet Recipe for Cauldron
#
# The response documents its own key names, inside itself.
#
#   "seriesDetail": {"FXUSDCAD": {"dimension": {"key": "d", "name": "Date"}}}
#   "observations": [{"d": "2026-08-28", "FXUSDCAD": {"v": "1.3888"}}]
#
# The date lives under "d", and the only thing that says so is a sibling object
# describing the dimension. A client that wants the date has to read
# seriesDetail[series].dimension.key first and then subscript by whatever it
# finds -- or hardcode "d" and hope.
#
# **And the number is two levels down, under a key the caller supplied.** The
# rate is obs[seriesName].v: the series name is a JSON key rather than a value,
# and the value under it is an object with one field, called v, holding a
# string. So reading one exchange rate is `obs["FXUSDCAD"].v`, parsed to a
# number afterwards, where the series name came from the request.
#
# Written against the live API rather than a document: every case below was
# checked against www.bankofcanada.ca on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The same key differs by one letter between endpoints, and the shapes
#      differ too. /observations returns "seriesDetail", a map keyed by series
#      name. /series/{name} returns "seriesDetails", a flat object with the
#      name as a field. Singular and plural, keyed and flat, for the same
#      thing.
#   2. The terms of use ride in every response. "terms": {"url": "https://www
#      .bankofcanada.ca/terms/"} is the first key of every successful body, on
#      an API about numbers.
#   3. The failure links its own documentation, to an anchor. A bad parameter
#      answers {"message": ..., "docs": "https://www.bankofcanada.ca/valet
#      /docs#/Series/get_observations__seriesNames___format_"} -- a generated
#      OpenAPI operation id, underscores and all, in a URL fragment.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The rate moves. What is served is what was recorded on the date shown.
#   - One series is served, of the thousands the list endpoint carries -- that
#     one answers 3.6 megabytes.
#   - The CSV format is recorded rather than served: it begins with a UTF-8
#     byte order mark and contains three tables in one file, headed "TERMS AND
#     CONDITIONS", "SERIES" and "OBSERVATIONS", separated by blank lines.

recipe: bocvalet
capability: analytics
version: 0.1.0

upstream:
  api: bocvalet
  docs: https://www.bankofcanada.ca/valet/docs

auth:
  # Public, no key.
  scheme: none

responses:
  success:
    fields:
      # The terms of use, first, on an API about numbers.
      terms:
        url: https://www.bankofcanada.ca/terms/
  list:
    style: wrapped
    key: observations
  resource:
    style: wrapped
    key: seriesDetails
  error:
    style: flat
    message_field: message

resources:
  observation:
    id:
      style: opaque
      # The date, under a one-letter key the response explains elsewhere.
      field: d
    fields:
      # The series name is the key and the value is an object of one field.
      FXUSDCAD:
        type: map

  series:
    id:
      style: opaque
      field: name
    fields:
      label:
        type: string
      description:
        type: string

routes:
  - method: GET
    path: /valet/observations/FXUSDCAD/json
    resource: observation
    operation: list
    pagination:
      # recent, and no position. Struck live on 2026-09-05: a bare request
      # answers 2,415 observations -- the whole series -- and ?recent=2
      # answers two. So recent is the size, and it counts backwards from
      # today rather than forwards from a start, which is why it is named
      # that way and why there is no offset to go with it.
      #
      # The Valet API's other way of narrowing a series is start_date and
      # end_date, which are filters on the observation rather than a
      # position in a page, and this Recipe does not model them. "-" for the
      # position says there is no name for one; the runtime was reading
      # "cursor".
      style: cursor
      limit: 100
      limit_param: recent
      cursor_param: "-"
    fields:
      # The map that explains the key names above it.
      seriesDetail:
        FXUSDCAD:
          label: USD/CAD
          description: "Daily average exchange rate: daily value of the US dollar expressed in Canadian dollars, for 1 unit of US dollar"
          dimension:
            # The name of the field the date is under.
            key: d
            name: Date

  - method: GET
    path: /valet/series/FXUSDCAD/json
    resource: series
    operation: get
    id_from: auth

  # A parameter that is not a number, answered with a link to a generated
  # operation id.
  - method: GET
    path: /valet/observations/FXUSDCAD/json-bad-recent
    error: bad_recent

errors:
  bad_recent:
    status: 400
    message: Bad recent observations request parameters, must be numeric
    fields:
      # A generated OpenAPI operation id, underscores and all, in a fragment.
      docs: "https://www.bankofcanada.ca/valet/docs#/Series/get_observations__seriesNames___format_"

fixtures:
  empty: {}

  rates:
    observation:
      - id: "2026-08-28"
        d: "2026-08-28"
        # The rate, two levels down, as a string.
        FXUSDCAD:
          v: "1.3888"
      - id: "2026-08-27"
        d: "2026-08-27"
        FXUSDCAD:
          v: "1.3861"

    series:
      - id: FXUSDCAD
        name: FXUSDCAD
        label: USD/CAD
        description: "Daily average exchange rate: daily value of the US dollar expressed in Canadian dollars, for 1 unit of US dollar"

conformance:
  - name: the response documents its own key names
    source: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=2
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/observations/FXUSDCAD/json
    expect:
      status: 200
      body:
        # The date is under "d", and this is the only thing that says so.
        "seriesDetail.FXUSDCAD.dimension.key": d
        "seriesDetail.FXUSDCAD.dimension.name": Date
        # And here it is, under exactly that.
        "observations[0].d": "2026-08-28"

  - name: the number is two levels down under a key the caller supplied
    source: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=2
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/observations/FXUSDCAD/json
    expect:
      status: 200
      body:
        # obs[seriesName].v, where the series name came from the request and
        # the value is a string.
        "observations[0].FXUSDCAD.v": "1.3888"
        "observations[1].FXUSDCAD.v": "1.3861"
        "observations[1].d": "2026-08-27"

  - name: the terms of use ride in every response
    source: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=2
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/observations/FXUSDCAD/json
    expect:
      status: 200
      body:
        # The first key of every successful body, on an API about numbers.
        "terms.url": https://www.bankofcanada.ca/terms/

  - name: the series is described in the observations too
    source: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=2
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/observations/FXUSDCAD/json
    expect:
      status: 200
      body:
        # Keyed by series name, where the other endpoint puts the name inside.
        "seriesDetail.FXUSDCAD.label": USD/CAD
        "seriesDetail.FXUSDCAD.description": "Daily average exchange rate: daily value of the US dollar expressed in Canadian dollars, for 1 unit of US dollar"

  - name: and the same key differs by one letter on the other endpoint
    source: https://www.bankofcanada.ca/valet/series/FXUSDCAD/json
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/series/FXUSDCAD/json
    expect:
      status: 200
      body:
        # seriesDetails, plural, and flat: the name is a field here and a key
        # there.
        "seriesDetails.name": FXUSDCAD
        "seriesDetails.label": USD/CAD
        "seriesDetails.description": "Daily average exchange rate: daily value of the US dollar expressed in Canadian dollars, for 1 unit of US dollar"
        "terms.url": https://www.bankofcanada.ca/terms/
      absent:
        # Not the singular one, on this endpoint.
        - seriesDetail

  - name: a parameter that is not a number links a generated operation id
    source: https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=notanumber
    verified: "2026-08-30"
    fixture: rates
    request:
      method: GET
      path: /valet/observations/FXUSDCAD/json-bad-recent
    expect:
      status: 400
      body:
        message: Bad recent observations request parameters, must be numeric
        # Underscores and all, in a URL fragment.
        docs: "https://www.bankofcanada.ca/valet/docs#/Series/get_observations__seriesNames___format_"

  # The page size, and only that: this route names no position at all --
  # cursor_param is "-" -- so there is nowhere to page to and no second
  # case to write. Asking for one out of 2 and receiving one can only
  # happen if recent was read.
  - name: "recent is read on valet observations FXUSDCAD json, and a page of one is not the whole collection"
    source: "https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?recent=2"
    fixture: rates
    request:
      method: GET
      path: "/valet/observations/FXUSDCAD/json"
      query:
        "recent": "1"
    expect:
      status: 200
      body:
        "observations[0].d": "2026-08-28"
      absent:
        - "observations[1]"

