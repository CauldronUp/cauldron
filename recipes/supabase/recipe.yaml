# Supabase's management API — the one that creates and administers projects,
# not the per-project PostgREST endpoint.
#
# Four things here break code that reads them the obvious way:
#
#   1. A project has two identifiers and only one of them works. `ref` is what
#      every path takes; `id` is marked "Deprecated: Use `ref` instead" in
#      Supabase's own description and is still sent beside it. Code that
#      stores `id` and interpolates it into /v1/projects/{ref} addresses
#      nothing, and gets a 404 rather than a hint.
#
#      Stated gap: only `ref` is sent here. A resource keys on one identifier
#      and emits it under one name, so a second one cannot sit beside it --
#      and of the two, the one that works is the one worth having. The trap
#      is described here rather than reproduced, which is the weaker half of
#      what this Recipe could do. See docs/backlog.md.
#
#   2. Status has fifteen values and none of them is "ACTIVE". A project that
#      is working says ACTIVE_HEALTHY, so `status === 'ACTIVE'` is never true
#      — and `status.startsWith('ACTIVE')` is true for ACTIVE_UNHEALTHY,
#      which is a project that is not working.
#
#   3. Creating a project answers with no database at all. The listing
#      carries a database object with the host in it; the create response
#      does not, because there is nothing to connect to yet. Code that
#      creates a project and reads project.database.host reads undefined.
#
#   4. Secrets come back with their values. GET on the secrets endpoint is a
#      plaintext dump, in a body that gets logged.
#
# Checking the credential live against api.supabase.com on 2026-09-05 found
# something worse than a wrong claim: nothing was checking it at all. auth
# declared scheme: bearer and no keys and no pattern, which this project's
# own rule reads as "accepts anything" -- so every one of this file's own
# cases, all of which send Authorization: Bearer sbp_cauldron, would have
# passed unchanged with that header removed or replaced with garbage. keys
# now names the fixture token the cases already used. The live probe itself
# found a real distinction once that was fixed: no header at all answers
# {"message":"Unauthorized"} and a well-formed bearer value that is not a
# real access token answers {"message":"JWT could not be decoded"} instead --
# two verdicts this file could not have told apart even after the fix, had
# the probe not supplied both.
#
# Tokens below are fixtures, not secrets.

recipe: supabase
capability: database
version: 0.1.0
upstream:
  api: v1
  docs: https://api.supabase.com/api/v1-json
  spec: https://supabase.com/openapi.json
  spec_hash: fff4011295b53a0ef93859390884b51924a94cc4a1f1da13a6e9f6b78ab2818b
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  prefix: "Bearer "
  # Every conformance case below sends Authorization: Bearer sbp_cauldron,
  # and until this line existed nothing checked it: no keys and no pattern
  # meant every request judged Accepted regardless of what -- or whether --
  # a credential was sent, so a case with a garbage token would have passed
  # exactly as this one does. Found while verifying live, not by the live
  # probe itself.
  keys:
    - sbp_cauldron
  # Verified live against api.supabase.com 2026-09-05: a well-formed bearer
  # value that is not a real access token gets a different message than no
  # header at all.
  rejected_error: invalid_jwt

responses:
  list:
    # A bare array. There is no envelope to unwrap and no count beside it.
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: message

resources:
  project:
    collection: projects
    id:
      # The ref, which is the identifier every path takes and the one
      # Supabase generates. Twenty lower-case letters.
      style: opaque
      length: 20
      field: ref
    fields:
      name:
        type: string
        required: true
      organization_id:
        type: string
      region:
        type: string
        default: eu-west-2
      # One of fifteen. ACTIVE_HEALTHY is the working one; "ACTIVE" on its
      # own is not a value this API ever sends.
      status:
        type: string
        default: COMING_UP
      created_at:
        type: datetime
      # Present on a listing and absent from a create, because a project
      # still coming up has nothing to connect to.
      database_host:
        type: string
        in: database
        as: host
      database_version:
        type: string
        in: database
        as: version

  secret:
    collection: secrets
    id:
      style: opaque
      length: 12
      field: "-"
      carried_by: name
    fields:
      project_ref:
        type: string
        in: "-"
      name:
        type: string
        required: true
      # In the clear. Supabase sends it, so this sends it.
      value:
        type: string
        required: true
      updated_at:
        type: datetime

routes:
  # The listing carries the database object; the create below does not.
  - method: GET
    path: /v1/projects
    resource: project
    operation: list

    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
  - method: GET
    path: /v1/projects/{id}
    resource: project
    operation: get

  # A created project has no database. Supabase omits the object entirely
  # rather than sending an empty one, so project.database.host is a read on
  # undefined rather than an empty string.
  #
  # This said no returns was needed, on the grounds that a project just asked
  # for has no host yet and so emits nothing -- and noted, as though it were
  # a curiosity, that renaming the entry broke no case. That was the warning.
  # Nothing was enforcing it: a client that posts a database object gets it
  # stored and echoed, and the response carries a host on a project that
  # cannot have one. The case below sends exactly that.
  - method: POST
    path: /v1/projects
    resource: project
    operation: create
    status: 201
    returns:
      - id
      - name
      - organization_id
      - region
      - status
      - created_at

  - method: GET
    path: /v1/projects/{project_ref}/secrets
    resource: secret
    operation: list
    pagination:
      # The description declares no query parameters on this route at all --
      # no limit, no offset, no cursor.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. Read from the description this Recipe already
      # records, checked on 2026-09-05.
      style: none
    scope: [project_ref]

errors:
  resource_missing:
    status: 404
    message: "Project not found: {detail}"

  # Verified live 2026-09-05: no Authorization header at all, and a bad
  # path with no credential sent either -- checked before routing.
  authentication_error:
    status: 401
    message: Unauthorized

  # Verified the same day: a well-formed bearer value that does not decode
  # as a JWT. A different sentence than the absent case above.
  invalid_jwt:
    status: 401
    message: JWT could not be decoded

  parameter_missing:
    status: 400
    message: "The request is missing {detail}."

fixtures:
  empty: {}

  small-org:
    project:
      # Working, and the only status value that means so.
      - id: abcdefghijklmnopqrst
        name: cauldron-production
        organization_id: org_cauldron
        region: eu-west-2
        status: ACTIVE_HEALTHY
        created_at: "2026-01-10T09:00:00Z"
        database_host: db.abcdefghijklmnopqrst.supabase.co
        database_version: "15.8"
      # Contains the word ACTIVE and does not work. A prefix test on the
      # status says this project is fine.
      - id: bcdefghijklmnopqrstu
        name: cauldron-staging
        organization_id: org_cauldron
        region: eu-west-2
        status: ACTIVE_UNHEALTHY
        created_at: "2026-01-11T09:00:00Z"
        database_host: db.bcdefghijklmnopqrstu.supabase.co
        database_version: "15.8"
      # Still coming up, which is where every project starts.
      - id: cdefghijklmnopqrstuv
        name: cauldron-preview
        organization_id: org_cauldron
        region: eu-west-2
        status: COMING_UP
        created_at: "2026-01-15T14:00:00Z"

    secret:
      - id: SERVICE_KEY
        project_ref: abcdefghijklmnopqrst
        name: SERVICE_KEY
        value: sb_secret_cauldron_0000000000
        updated_at: "2026-01-10T09:05:00Z"
      - id: STRIPE_KEY
        project_ref: abcdefghijklmnopqrst
        name: STRIPE_KEY
        value: sk_test_cauldron_0000000000
        updated_at: "2026-01-12T11:00:00Z"

# Conformance cases, read from Supabase's published OpenAPI description rather
# than observed against a live account. The verify report says so.
conformance:
  - name: no credential at all answers Unauthorized
    source: https://api.supabase.com/v1/projects
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/projects
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: a well-formed bearer value that is not a real token gets a different message
    source: https://api.supabase.com/v1/projects
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_garbage000invalid
    expect:
      status: 401
      body:
        message: JWT could not be decoded

  - name: a missing project is a flat object with a message
    # This Recipe had no case exercising a failure at all -- one of two out of
    # a hundred and sixty-seven -- so the shape a client unwraps an error at
    # was declared and never produced.
    #
    # message is asserted for presence rather than wording. The wording is
    # this Recipe's own, from the errors block, so pinning the text would
    # assert the Recipe against itself; the name is the part Supabase decides
    # and the part a client reads.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects/nosuchproject
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 404
      matches:
        message: '.'
      absent:
        # Flat, so there is no envelope to reach through. Code written for a
        # nested error finds undefined twice over.
        - error
        - errors

  - name: a working project says ACTIVE_HEALTHY, never ACTIVE
    # Fifteen status values and none of them is "ACTIVE", so
    # `status === 'ACTIVE'` is never true and the code guarding on it never
    # runs.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 200
      body:
        '[0]':
          name: cauldron-production
          status: ACTIVE_HEALTHY

  - name: a broken project also begins with ACTIVE
    # ACTIVE_UNHEALTHY. A prefix test says this project is fine and it is
    # not, which is worse than a value that fails the test outright: the
    # check passes and the project does not work.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 200
      body:
        '[1]':
          name: cauldron-staging
          status: ACTIVE_UNHEALTHY

  - name: a created project has no database to connect to
    # The listing carries a database object with the host in it and the
    # create response does not, because there is nothing to connect to yet.
    # Code that creates a project and reads project.database.host reads a
    # property of undefined.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: POST
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_cauldron
      json:
        name: cauldron-new
        organization_id: org_cauldron
    expect:
      status: 201
      body:
        name: cauldron-new
        status: COMING_UP
      absent:
        - database
        - database.host

  - name: a posted database object does not come back on a created project
    # The case above sends nothing and so proves nothing: the fields were
    # unset, and unset fields are not emitted whatever the route says. This
    # one posts a host. Supabase declares eight properties on a create and
    # database is not among them, so the only right answer is to drop it.
    source: https://api.supabase.com/api/v1
    fixture: small-org
    request:
      method: POST
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_cauldron
      json:
        name: cauldron-posted-host
        organization_id: org_cauldron
        database:
          host: db.attacker.example
          version: "15"
    expect:
      status: 201
      body:
        name: cauldron-posted-host
        status: COMING_UP
      absent:
        - database
        - database.host

  - name: a listed project does have one
    # The other half. Without it the case above would hold against an
    # emulator that never sends a database at all, which is a different and
    # simpler lie.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 200
      body:
        '[0]':
          database:
            host: db.abcdefghijklmnopqrst.supabase.co
            version: "15.8"

  - name: a project is addressed by ref
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects/abcdefghijklmnopqrst
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 200
      body:
        ref: abcdefghijklmnopqrst
        name: cauldron-production

  - name: secrets come back with their values
    # A plaintext dump, in a body that gets logged. Supabase sends them, so
    # this sends them -- an emulator that redacted the values would hide the
    # only thing worth noticing about this endpoint.
    source: https://api.supabase.com/api/v1-json
    fixture: small-org
    request:
      method: GET
      path: /v1/projects/abcdefghijklmnopqrst/secrets
      headers:
        Authorization: Bearer sbp_cauldron
    expect:
      status: 200
      body:
        '[0]':
          name: SERVICE_KEY
          value: sb_secret_cauldron_0000000000

  # The names. This Recipe declares 5 field(s) on a project that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a project carries the field names this Recipe declares"
    source: "https://api.supabase.com/api/v1-json"
    fixture: small-org
    request:
      method: GET
      path: "/v1/projects"
      headers:
        "Authorization": "Bearer sbp_cauldron"
    expect:
      status: 200
      body:
        "[0].created_at": "2026-01-10T09:00:00Z"
        "[0].database.host": "db.abcdefghijklmnopqrst.supabase.co"
        "[0].organization_id": "org_cauldron"
        "[0].region": "eu-west-2"
        "[0].database.version": "15.8"

  # The names. This Recipe declares 2 field(s) on a secret that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a secret carries the field names this Recipe declares"
    source: "https://api.supabase.com/api/v1-json"
    fixture: small-org
    request:
      method: GET
      path: "/v1/projects/abcdefghijklmnopqrst/secrets"
      headers:
        "Authorization": "Bearer sbp_cauldron"
    expect:
      status: 200
      body:
        "[0].updated_at": "2026-01-10T09:05:00Z"
        "[0].value": "sb_secret_cauldron_0000000000"

