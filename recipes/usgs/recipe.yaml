# USGS earthquake catalogue Recipe for Cauldron
#
# Asking for a page removes the count.
#
# The metadata block changes shape with the request. Ask without a limit and it
# carries count; ask with one and count is gone, replaced by limit and offset:
#
#   ?format=geojson&minmagnitude=6&starttime=...  ->  metadata: {..., count: 11}
#   ?format=geojson&minmagnitude=5&limit=2        ->  metadata: {..., limit: 2,
#                                                                     offset: 1}
#
# So a client that pages and reads metadata.count to know when to stop finds
# undefined -- on exactly the requests where it is paging, and only there. The
# total is available when you did not ask for a page and withheld when you did.
#
# **And offset is one-based.** A request that sent no offset at all comes back
# saying offset: 1, because the service counts records from one. Anything
# treating it as a zero-based cursor and adding the page size skips a record on
# every page after the first.
#
# Written against the live API rather than a document: every case below was
# checked against earthquake.usgs.gov on the date in its verified field.
#
# Six more the Recipe pins:
#
#   1. coordinates is [longitude, latitude, depth]. Longitude first, which is
#      GeoJSON's order and the opposite of the way everyone says it aloud, and
#      the third element is depth in kilometres rather than an altitude. So
#      [-103.4604, 8.4191, 10] is 8.4 °N 103.5 °W, ten kilometres down, and
#      reading it as a latitude-longitude pair puts the epicentre in the wrong
#      hemisphere without erroring.
#   2. ids, sources and types are comma-delimited strings that begin and end
#      with a comma. ",us7000tcf3,usauto7000tcf3,attkg5cs," splits into five
#      elements for three identifiers, the first and last of them empty.
#   3. "type" appears four times in one document with four meanings:
#      FeatureCollection at the top, Feature on each entry, Point on each
#      geometry, and earthquake in the properties. Nothing but the path says
#      which vocabulary is in force.
#   4. mag is a JSON number, so a magnitude of 5.0 arrives as 5 and prints as
#      "5" -- while the title beside it, built by the service, says "M 5.0".
#   5. tz, felt, cdi, mmi and alert are present and null rather than absent, on
#      an event that has none of them, and carry values on one that does. So
#      the key is always there and its absence is never the signal.
#   6. metadata.status is 200. The HTTP status, restated inside the body, on a
#      response that already carried it.
#
# The failures are plain text, from an endpoint that was asked for GeoJSON:
#
#   Error 400: Bad Request
#
#   Bad minmagnitude value "abc". Valid values are numeric
#
#   Usage details are available from https://earthquake.usgs.gov/fdsnws/event/1
#
#   Request:
#   /fdsnws/event/1/query?format=geojson&amp;minmagnitude=abc
#
# A multi-line human-readable report, content-type text/plain;charset=UTF-8 with
# no space after the semicolon, in answer to format=geojson. And the request it
# reads back has its ampersand written as &amp; -- an HTML entity, in a plain
# text body, so the URL echoed is not the URL sent.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The catalogue is served rather than queried. Real requests filter by time,
#     magnitude, distance and depth; this Recipe answers with the two events its
#     fixture holds, the same reading recorded for Google Drive's q and Maven
#     Central's Solr expressions.
#   - The paged route is selected by limit=2 rather than by the presence of a
#     limit, because a route matches a declared value. The behaviour is the
#     presence; the declaration is one value of it.
#   - metadata.generated and the timestamp inside the error text change on every
#     request. Both are served as recorded, so their presence and type are
#     right and their variability is not modelled.
#   - Only format=geojson is served. The csv, text, xml, kml and quakeml
#     formats, and the /count and /application.json paths, are not modelled.
#
# The events below are public and were recorded on the date in the cases.

recipe: usgs
capability: infrastructure
version: 0.1.0

upstream:
  api: fdsnws-event-1
  docs: https://earthquake.usgs.gov/fdsnws/event/1/

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  list:
    style: wrapped
    # The resource names the collection; GeoJSON calls it features.
  error:
    # A multi-line human-readable report, in answer to format=geojson.
    style: text

resources:
  feature:
    collection: features
    id:
      style: opaque
      field: id
    fields:
      # "Feature" here. "FeatureCollection" at the top of the document,
      # "Point" inside geometry, and "earthquake" inside properties.
      type:
        type: string
      properties:
        type: map
      # coordinates is [longitude, latitude, depth].
      geometry:
        type: map

routes:
  # No limit: the metadata carries a count.
  - method: GET
    path: /fdsnws/event/1/query
    resource: feature
    operation: list
    pagination:
      # limit and offset, which the header above already establishes and
      # pins: the metadata block "carries count; ask with one and count is
      # gone, replaced by limit and offset". Both names were in a response
      # this Recipe asserts, and the declaration beside them said nothing,
      # so the runtime read "limit" -- right by luck -- and "cursor", which
      # the service has never had.
      #
      # One thing the names cannot carry, and the header already says it:
      # this offset is one-based. "A request that sent no offset at all
      # comes back saying offset: 1, because the service counts records from
      # one." The engine's offset positions count from zero, so a caller
      # resuming from a number this fake reports is one record out at the
      # real service. Stated rather than smoothed over -- naming the
      # parameter is still better than sending one the service does not read
      # at all.
      style: offset
      limit: 20
      limit_param: limit
      cursor_param: offset
    list:
      style: wrapped
      # Computed, and present only on this route.
      count_field: metadata.count
    fields:
      type: FeatureCollection
      metadata:
        generated: 1787894114000
        url: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=5
        title: USGS Earthquakes
        # The HTTP status, restated inside the body.
        status: 200
        api: 2.7.0

  # A limit, and the count is gone.
  - method: GET
    path: /fdsnws/event/1/query
    resource: feature
    operation: list
    matches_query:
      # The behaviour is the presence of a limit; a route matches a value.
      limit: "2"
    pagination:
      style: offset
      limit_param: limit
      cursor_param: offset
      limit: 20
    fields:
      type: FeatureCollection
      metadata:
        generated: 1787894076000
        url: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
        title: USGS Earthquakes
        status: 200
        api: 2.7.0
        limit: 2
        # One-based, on a request that sent no offset.
        offset: 1

errors:
  bad_parameter:
    status: 400
    headers:
      # No space after the semicolon.
      Content-Type: text/plain;charset=UTF-8
    message: |-
      Error 400: Bad Request

      Bad minmagnitude value "abc". Valid values are numeric

      Usage details are available from https://earthquake.usgs.gov/fdsnws/event/1

      Request:
      /fdsnws/event/1/query?format=geojson&amp;minmagnitude=abc

      Request Submitted:
      2026-08-28T05:14:51+00:00

      Service version:
      2.7.0

  event_missing:
    status: 404
    headers:
      Content-Type: text/plain;charset=UTF-8
    message: |-
      Error 404: Not Found

      Not Found

      Usage details are available from https://earthquake.usgs.gov/fdsnws/event/1

      Request:
      /fdsnws/event/1/query?eventid=notarealevent&amp;format=geojson

      Request Submitted:
      2026-08-28T05:14:52+00:00

      Service version:
      2.7.0

fixtures:
  empty: {}

  recent:
    feature:
      - id: us7000tch3
        type: Feature
        properties:
          # 5, not 5.0. The title beside it says otherwise.
          mag: 5
          place: northern East Pacific Rise
          time: 1787884757518
          updated: 1787886185040
          # Present and null, on an event that has none of these.
          tz: null
          url: https://earthquake.usgs.gov/earthquakes/eventpage/us7000tch3
          detail: https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=us7000tch3&format=geojson
          felt: null
          cdi: null
          mmi: null
          alert: null
          status: reviewed
          tsunami: 0
          sig: 385
          net: us
          code: 7000tch3
          # A comma at each end, so a naive split gives three elements for one
          # identifier.
          ids: ",us7000tch3,"
          sources: ",us,"
          types: ",origin,phase-data,"
          nst: 52
          dmin: 10.261
          rms: 0.65
          gap: 194
          magType: mww
          # The fourth meaning of "type" in this document.
          type: earthquake
          title: M 5.0 - northern East Pacific Rise
        geometry:
          type: Point
          # Longitude, latitude, depth in kilometres. 8.4 °N 103.5 °W, ten
          # kilometres down.
          coordinates:
            - -103.4604
            - 8.4191
            - 10

      - id: us7000tcf3
        type: Feature
        properties:
          mag: 6
          place: 145 km N of Caluula, Somalia
          time: 1787864858352
          updated: 1787886426040
          tz: null
          url: https://earthquake.usgs.gov/earthquakes/eventpage/us7000tcf3
          detail: https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=us7000tcf3&format=geojson
          felt: null
          cdi: null
          # The same keys, carrying values, on the event that has them.
          mmi: 3.9
          alert: green
          status: reviewed
          tsunami: 0
          sig: 554
          net: us
          code: 7000tcf3
          # Three identifiers, five elements after a split on the comma.
          ids: ",us7000tcf3,usauto7000tcf3,attkg5cs,"
          sources: ",us,usauto,at,"
          types: ",ground-failure,internal-moment-tensor,internal-origin,losspager,moment-tensor,origin,phase-data,shakemap,"
          nst: 92
          dmin: 6.114
          rms: 0.88
          gap: 27
          magType: mww
          type: earthquake
          title: M 6.0 - 145 km N of Caluula, Somalia
        geometry:
          type: Point
          coordinates:
            - 50.5425
            - 13.2654
            - 10

conformance:
  - name: asking without a limit answers with a count
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        "metadata.count": 2
        # The HTTP status, restated inside the body.
        "metadata.status": 200
        "metadata.api": 2.7.0
        "metadata.title": USGS Earthquakes
      absent:
        - metadata.limit
        - metadata.offset

  - name: asking for a page takes the count away and offsets from one
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    expect:
      status: 200
      body:
        # A client paging and reading metadata.count finds undefined, on
        # exactly the requests where it pages.
        "metadata.limit": 2
        # One-based, on a request that sent no offset at all.
        "metadata.offset": 1
      absent:
        - metadata.count

  - name: the coordinates are longitude first and the third one is depth
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # 8.4 °N 103.5 °W, ten kilometres down. Read as a latitude-longitude
        # pair it is in the wrong hemisphere, and nothing errors.
        "features[0].geometry.coordinates[0]": -103.4604
        "features[0].geometry.coordinates[1]": 8.4191
        "features[0].geometry.coordinates[2]": 10
        "features[1].geometry.coordinates[0]": 50.5425

  - name: the identifier lists begin and end with a comma
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # Three identifiers, five elements after splitting on the comma, the
        # first and last of them empty.
        "features[1].properties.ids": ",us7000tcf3,usauto7000tcf3,attkg5cs,"
        "features[1].properties.sources": ",us,usauto,at,"
        "features[0].properties.ids": ",us7000tch3,"

  - name: type means four different things in one document
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # Four vocabularies, one key, and nothing but the path to tell them
        # apart.
        type: FeatureCollection
        "features[0].type": Feature
        "features[0].geometry.type": Point
        "features[0].properties.type": earthquake

  - name: a magnitude of five point zero arrives as the number five
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # The service's own title says 5.0 and the number beside it prints
        # as "5".
        "features[0].properties.mag": 5
        "features[0].properties.title": M 5.0 - northern East Pacific Rise
        "features[1].properties.mag": 6
        "features[1].properties.title": M 6.0 - 145 km N of Caluula, Somalia

  - name: the optional measurements are present and null rather than absent
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # The same keys carry values on the event that has them, so the key
        # being there is never the signal.
        "features[1].properties.mmi": 3.9
        "features[1].properties.alert": green
        # null, spelled, on the event that has neither.
        "features[0].properties.mmi": null
        "features[0].properties.alert": null
        "features[0].properties.tz": null

  - name: the timestamps are epoch milliseconds
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=2&minmagnitude=5
    verified: "2026-08-28"
    fixture: recent
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=5
    expect:
      status: 200
      body:
        # Thirteen digits, on time, updated and metadata.generated alike.
        "features[0].properties.time": 1787884757518
        "features[0].properties.updated": 1787886185040
        "metadata.generated": 1787894114000

  - name: a bad parameter answers plain text to a request for GeoJSON
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=abc
    verified: "2026-08-28"
    fixture: recent
    arm: bad_parameter
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=abc
    expect:
      # A multi-line human-readable report. Calling .json() on it throws.
      status: 400
      headers:
        Content-Type: text/plain;charset=UTF-8
      body_matches: 'Bad minmagnitude value "abc"\. Valid values are numeric'

  - name: and the request it reads back has its ampersand as an HTML entity
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=abc
    verified: "2026-08-28"
    fixture: recent
    arm: bad_parameter
    request:
      method: GET
      path: /fdsnws/event/1/query?format=geojson&minmagnitude=abc
    expect:
      status: 400
      # In a plain text body, so the URL echoed is not the URL sent.
      body_matches: 'format=geojson&amp;minmagnitude=abc'

  - name: an event that does not exist is a 404 in the same prose
    source: https://earthquake.usgs.gov/fdsnws/event/1/query?eventid=notarealevent&format=geojson
    verified: "2026-08-28"
    fixture: recent
    arm: event_missing
    request:
      method: GET
      path: /fdsnws/event/1/query?eventid=notarealevent&format=geojson
    expect:
      status: 404
      headers:
        Content-Type: text/plain;charset=UTF-8
      body_matches: '^Error 404: Not Found'
