# Short.io Recipe for Cauldron
#
# This Recipe models api.short.io. api.short.cm is real too, documented
# nowhere as deprecated, and every single probe below -- every failure shape,
# every routing edge, both hosts, every one of them struck live -- answered
# byte-for-byte identically on both hostnames, differing only in Cloudflare's
# own per-request headers (CF-RAY, the NEL/Report-To beacons). Two hostnames,
# one backend, and nothing found here distinguishes them. If Short.io's own
# docs draw a line between the two anywhere, it was not found; this Recipe
# states what was actually checked rather than a division that could not be
# observed.
#
# Short.io's own guide settles the archived-link question in one sentence,
# and it is the sharpest finding in this whole group of three: "An archived
# short link is only hidden from the Dashboard, yet it remains accessible and
# functions as intended." (developers.short.io/docs/archiving-a-short-url).
# Archiving is a dashboard-visibility flag, not a deactivation. A visitor
# following an archived link never notices anything changed. Compare
# bitly/recipe.yaml, whose identical question about its own archived field
# goes unanswered anywhere in Bitly's published description, and
# dub/recipe.yaml, same gap.
#
# The destination is mutable -- "Update original URL, title or path for an
# existing short link by id" -- and nothing in Short.io's docs for that
# endpoint or for "Getting link info" names a field that remembers what
# originalURL used to hold. No history array, no previousURL, nothing. A
# link's destination can change any number of times with zero trace of it on
# the record itself.
#
# Click counts are absent from the link object too, the same shape
# bitly/recipe.yaml found for its own Bitlink and the opposite of
# dub/recipe.yaml's Link. The full worked response for "Getting link info" --
# quoted verbatim below in the fixture -- has thirteen fields and not one of
# them counts anything. A click total lives on an entirely separate surface:
# GET /link/{linkId} ("Link statistics... for link in given period") and
# GET /domain/{domainId}/link_clicks, neither modelled here, because neither
# question this group asks turns on their exact shape.
#
# **This host answers the identical "you are not authorised" fact in FOUR
# different envelopes, and which one a caller gets depends only on which
# route they hit.** All four were struck live, unauthenticated, on real
# routes with fabricated ids:
#
#   GET  /api/links              {"statusCode":401,"error":"Unauthorized","message":"Unauthorized"}
#   GET  /links/expand           the identical body, same three keys
#   POST /links                  {"message":"Unauthorized","statusCode":401,"success":false}
#   POST /links/{id}   (update)  {"message":"Unauthorized"}
#   DELETE /links/{id} (delete)  {"success":false,"error":"Unauthorized"}
#
# Five requests, four distinct combinations of the same four keys --
# {message, error, statusCode, success} -- appearing and disappearing in
# different subsets with no visible pattern tying the subset to the verb or
# to the path prefix (the two GET routes agree with each other and neither
# POST route agrees with the other POST route). A client that learned this
# host's auth-failure shape from any single route generalises to the wrong
# thing everywhere else. Compare mezmo/recipe.yaml's four envelopes for the
# same underlying fact across two products, and rootly/recipe.yaml's much
# smaller two-shape split within one route.
#
# **Absent, wrong, and wrong-with-a-scheme-word-attached are one answer, not
# three, on every route checked.** No Authorization header, a bare junk
# string, and "Authorization: Bearer junktoken12345" (a scheme word this API
# does not use -- the header is meant to carry a bare key with none) all
# answered the identical body on GET /api/links, struck separately. This
# runtime's own binary credential check already reproduces that for free, the
# same shape rootly/recipe.yaml found for a completely different provider.
#
# **The write-side {id} path parameter is numeric-only, and the check runs
# before the credential is examined at all -- inside the router, not inside
# the handler.** A fabricated alphanumeric id on DELETE or POST /links/{id}
# -- "fakeid00000000000000", never a real Short.io id shape -- answers the
# identical routing 404 an unrouted path gets: {"message":"Route
# DELETE:/links/fakeid00000000000000 not found","error":"Not Found",
# "statusCode":404}, credential or none. The bare digits "123456789" in the
# identical position reaches the real, route-specific 401 shown above
# instead. Nothing about the record was ever looked up in either case -- this
# is the router's own path pattern refusing to match a non-numeric segment,
# the same shape auth.go documents for Canada Post's tracking-number check,
# except here it runs inside routing itself rather than after the credential.
# Not modelled as a route-level pattern: Cauldron's path segments match
# literal prefixes and suffixes around a placeholder, with no digits-only
# class to declare, so the routes below match any {id} and the cases send a
# genuinely numeric one to reach the gate the live host actually gates.
#
# **There is no 405 anywhere on this host either, matching Turso's finding in
# this collection for a completely different API.** A wrong method on a real
# path -- PATCH /links, DELETE /api/links -- answers the identical routing
# 404 an unmatched path gets, quoting "METHOD:PATH" in the message, credential
# or none. A typo in the method and a typo in the path are the same mistake
# here.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - create_unauthorized, update_unauthorized and delete_unauthorized are
#     declared as fixed-error routes rather than resource routes: no worked
#     200 example exists anywhere in Short.io's docs for creating, updating
#     or deleting a link (only a full example for reading one, and a
#     three-field example for archiving), and every request this Recipe
#     could construct against them -- with no credential, which is all that
#     is possible here -- answers the fixed body declared. That is not a
#     simplification of what was observed; it is what was observed.
#   - Archiving (POST /links/archive, {"success":true} on success per
#     Short.io's own guide) is cited in the header above and not routed: no
#     credential exists to check its failure shape, and modelling the
#     success body alone without knowing whether its 401 matches any of the
#     four shapes above would be a guess dressed as a route.
#   - GET /link/{linkId} and GET /domain/{domainId}/link_clicks (click
#     statistics), GET /links/opengraph, /links/folders, domain management
#     and every bulk endpoint are real, documented, and not routed: this
#     Recipe is about the questions the task named, not a full port.
#   - The single "Getting link info" worked example (DomainId 115111,
#     OwnerId 141117, idString "LINK_ID") is quoted in full in the header
#     above and is not re-fixtured separately from the list example below:
#     both are Short.io's own docs, and using one fixture for both GET routes
#     avoids two examples silently drifting apart under one Recipe.
#   - No upstream.spec is recorded. developers.short.io serves per-page
#     Markdown (append .md to any doc URL) and an llms.txt index rather than
#     one fetchable OpenAPI document this Recipe could find.
#   - The numeric-only {id} routing constraint described in the header is
#     stated, not served: it is a live-verified fact about api.short.io's own
#     router, and Cauldron's path segments match a literal prefix and suffix
#     around a placeholder with no digits-only class to declare. Modelling it
#     would mean the update and delete routes below matching only a numeric
#     {id} and refusing any other shape with the unrouted body instead --
#     which this format has no way to express -- so both routes match any
#     {id} here, and the cases send a genuinely numeric one to reach the gate
#     the live host actually gates rather than one it would refuse first.
#
# Every case below not carrying a verified date was read from
# developers.short.io/docs/getting-a-list-of-links.md and
# developers.short.io/docs/getting-a-link-info.md, and never called -- this
# Recipe was written with no credential and created no account. The key
# below is a fixture and belongs to no account.

recipe: shortio
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.short.io/

auth:
  # None at the Recipe level, deliberately -- this host answers auth failure
  # in four different envelopes depending only on which route is hit (see the
  # header), which a single Recipe-wide verdict cannot express any more than
  # Turso's per-route matches_header split could for a different provider.
  # Each GET route below carries its own matches_header naming the fixture
  # key directly, with a header-less duplicate falling back to that route's
  # own named failure; the write routes need no matches_header at all, since
  # every request this Recipe could construct against them -- with no
  # credential, which is all that was possible here -- answers the identical
  # fixed body regardless of what was sent.
  scheme: none

responses:
  list:
    style: wrapped
    key: links
    count_field: count
    # Per the OpenAPI fragment embedded on the Link list reference page:
    # nullable, so this Recipe sends it as null on the last page rather than
    # omitting it.
    cursor_field: nextPageToken
    cursor_null: true
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  link:
    # "lnk_" prefixes every id in Short.io's own worked examples, on every
    # record, in both docs pages this Recipe cites.
    id:
      style: prefixed
      prefix: "lnk_"
    fields:
      # The same value the identifier already holds, sent again under a
      # second key -- genuinely, in Short.io's own worked examples, not a
      # declared duplicate invented here.
      idString:
        type: string
      originalURL:
        type: string
      path:
        type: string
      shortURL:
        type: string
      secureShortURL:
        type: string
      cloaking:
        type: boolean
        default: false
      title:
        type: string
        null_when_unset: true
      tags:
        type: list
      createdAt:
        type: datetime
      skipQS:
        type: boolean
        default: false
      archived:
        type: boolean
        default: false
      DomainId:
        type: integer
      OwnerId:
        type: integer
      hasPassword:
        type: boolean
        default: false

routes:
  - method: GET
    path: /api/links
    resource: link
    operation: list
    matches_header:
      Authorization: cauldron_shortio_fixture_key_0000000000000000
    filters:
      - param: domain_id
        field: DomainId
    # "the limit value must be less than 150" per Short.io's own guide, and
    # the same ceiling is in the embedded OpenAPI fragment (maximum: 150).
    pagination:
      # The size is limit and it caps at 150, from Short.io's own
      # openapi.json read 2026-09-05, which types it with maximum: 150
      # beside the pageToken this route already declared. Naming it makes
      # the cap enforceable rather than merely described.
      limit_param: limit
      style: cursor
      limit: 30
      max_limit: 150
      cursor_param: pageToken

  - method: GET
    path: /api/links
    error: authentication_error

  # Addressed by domain and path together; this Recipe's fixture holds one
  # domain, so path alone is enough to key the lookup -- see LookupBy.
  - method: GET
    path: /links/expand
    resource: link
    operation: get
    id_from: "query:path"
    lookup_by: path
    matches_header:
      Authorization: cauldron_shortio_fixture_key_0000000000000000

  - method: GET
    path: /links/expand
    error: authentication_error

  # No worked 200 example exists for creating a link -- see the header. Every
  # request this Recipe could construct answers this fixed body.
  - method: POST
    path: /links
    error: create_unauthorized

  # Matches any {id}; the live host only reaches this gate for a numeric one
  # -- see the header. The case below sends a numeric id to demonstrate what
  # the live host actually gates, not what this Recipe's router accepts.
  - method: POST
    path: /links/{id}
    error: update_unauthorized

  - method: DELETE
    path: /links/{id}
    error: delete_unauthorized

  # A specific unrouted path, declared and pinned rather than left to a
  # generic fallback, because the live body names the method and the path
  # joined by a colon -- a shape this runtime's own built-in unknown_route
  # substitution does not produce. See the header.
  - method: GET
    path: /this-is-not-a-real-endpoint
    error: unrouted_get

  # A wrong method on a real path, pinned the same way and for the same
  # reason -- see the header for why there is no 405 to compute an Allow for.
  - method: PATCH
    path: /links
    error: unrouted_patch

errors:
  # GET /api/links and GET /links/expand, no credential and any wrong one
  # alike. See the header.
  authentication_error:
    status: 401
    message: Unauthorized
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      statusCode: 401
      error: Unauthorized

  # POST /links. A third field (success) and a different key order from the
  # GET shape above -- see the header.
  create_unauthorized:
    status: 401
    style: flat
    message_field: message
    message: Unauthorized
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      statusCode: 401
      success: false

  # POST /links/{id}. One key only.
  update_unauthorized:
    status: 401
    style: flat
    message_field: message
    message: Unauthorized
    code_field: "-"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # DELETE /links/{id}. success and error, no statusCode, no message.
  delete_unauthorized:
    status: 401
    style: flat
    message_field: "-"
    code_field: "-"
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      success: false
      error: Unauthorized

  # The live, exact body for GET /this-is-not-a-real-endpoint -- see the
  # route above and the header for why this is pinned per-route rather than
  # produced by the generic fallback.
  unrouted_get:
    status: 404
    style: flat
    message_field: message
    message: "Route GET:/this-is-not-a-real-endpoint not found"
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      error: Not Found
      statusCode: 404

  # The live, exact body for PATCH /links -- a routing 404, not a 405. See
  # the header.
  unrouted_patch:
    status: 404
    style: flat
    message_field: message
    message: "Route PATCH:/links not found"
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      error: Not Found
      statusCode: 404

fixtures:
  empty: {}

  # Every field and value here is Short.io's own worked example from
  # developers.short.io/docs/getting-a-list-of-links.md, trimmed to two of
  # the four entries shown. User (the owning account, nested on each record
  # in that same example) is not declared -- see the header.
  domain-links:
    link:
      - id: lnk_4Th1_8MAbEywPHUsk11111
        idString: lnk_4Th1_8MAbEywPHUsk11111
        originalURL: YOUR_LONG_URL
        path: slug1
        shortURL: http://mydomain.fr/slug1
        secureShortURL: https://mydomain.fr/slug1
        cloaking: false
        title: Link Title
        tags: []
        createdAt: "2024-10-29T08:00:47.490Z"
        skipQS: false
        archived: false
        DomainId: 11111
        OwnerId: 11111
        hasPassword: false
      - id: lnk_4Th1_YUSVK9T92Dewx11111
        idString: lnk_4Th1_YUSVK9T92Dewx11111
        originalURL: YOUR_LONG_URL2
        path: slug2
        shortURL: http://mydomain.fr/slug2
        secureShortURL: https://mydomain.fr/slug2
        cloaking: false
        title: Link Title
        tags: []
        createdAt: "2024-10-29T07:59:57.487Z"
        skipQS: false
        archived: false
        DomainId: 11111
        OwnerId: 11111
        hasPassword: false

# Every case below carries source. A verified date means this Recipe called
# api.short.io with exactly the request shown and recorded exactly what came
# back; its absence means the case was read from Short.io's published docs
# and never called.
conformance:
  - name: no credential at all on the list route
    source: https://api.short.io/api/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: "/api/links?domain_id=1"
    expect:
      status: 401
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        statusCode: 401
        error: Unauthorized
        message: Unauthorized

  - name: a wrong key on the same route answers the identical body
    source: https://api.short.io/api/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: "/api/links?domain_id=1"
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        statusCode: 401
        error: Unauthorized
        message: Unauthorized

  - name: a scheme word this API does not use is called wrong, the same as any other wrong key
    source: https://api.short.io/api/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: "/api/links?domain_id=1"
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: expand answers the identical envelope to the list route, not one of the write shapes
    source: https://api.short.io/links/expand
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: "/links/expand?domain=example.com&path=abc"
    expect:
      status: 401
      body:
        statusCode: 401
        error: Unauthorized
        message: Unauthorized

  - name: creating a link has its own three-field shape, in a different order
    source: https://api.short.io/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /links
      json: {}
    expect:
      status: 401
      body:
        message: Unauthorized
        statusCode: 401
        success: false
      absent:
        - error

  - name: and a wrong key answers the identical write-side body
    source: https://api.short.io/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /links
      headers:
        Authorization: junktoken12345
      json: {}
    expect:
      status: 401
      body:
        message: Unauthorized
        success: false

  - name: retargeting a link's destination by id reaches a third shape -- one key only
    # The body is what Short.io's own guide names for changing a link's
    # destination (originalURL); the id is numeric to reach the gate the
    # live host actually checks -- see the header.
    source: https://api.short.io/links/123456789
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /links/123456789
      json:
        originalURL: https://www.newdestination.com
    expect:
      status: 401
      body:
        message: Unauthorized
      absent:
        - error
        - statusCode
        - success

  - name: deleting by id is a fourth shape again -- success and error, no message
    source: https://api.short.io/links/123456789
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /links/123456789
    expect:
      status: 401
      body:
        success: false
        error: Unauthorized
      absent:
        - message
        - statusCode

  - name: an unrouted path is the identical routing 404, credential or none
    source: https://api.short.io/this-is-not-a-real-endpoint
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-endpoint
      headers:
        Authorization: junktoken12345
    expect:
      status: 404
      body:
        message: "Route GET:/this-is-not-a-real-endpoint not found"
        error: Not Found
        statusCode: 404

  - name: a wrong method on a real path is the same routing 404, never a 405
    source: https://api.short.io/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /links
    expect:
      status: 404
      body:
        message: "Route PATCH:/links not found"
        error: Not Found
        statusCode: 404

  - name: the list envelope wraps two links under their own key, beside a count
    source: https://developers.short.io/docs/getting-a-list-of-links.md
    fixture: domain-links
    request:
      method: GET
      path: "/api/links?domain_id=11111"
      headers:
        Authorization: cauldron_shortio_fixture_key_0000000000000000
    expect:
      status: 200
      body:
        count: 2
        "links[0].path": slug1
        "links[0].originalURL": YOUR_LONG_URL
        "links[0].archived": false
      absent:
        # No click count anywhere on the record -- see the header.
        - "links[0].clicks"
        - "links[0].totalClicks"
        - "links[0].source"
        - "links[0].User"

  - name: a page short of the whole set carries a cursor under Short.io's own name for it
    source: https://developers.short.io/reference/get_api-links.md
    fixture: domain-links
    request:
      method: GET
      path: "/api/links?domain_id=11111&limit=1"
      headers:
        Authorization: cauldron_shortio_fixture_key_0000000000000000
    expect:
      status: 200
      matches:
        nextPageToken: "."

  - name: a single link answers bare, with the same absent click count
    source: https://developers.short.io/docs/getting-a-link-info.md
    fixture: domain-links
    request:
      method: GET
      path: "/links/expand?domain=mydomain.fr&path=slug1"
      headers:
        Authorization: cauldron_shortio_fixture_key_0000000000000000
    expect:
      status: 200
      body:
        path: slug1
        originalURL: YOUR_LONG_URL
        idString: lnk_4Th1_8MAbEywPHUsk11111
        archived: false
      absent:
        - clicks
        - data
        - link

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://developers.short.io/docs/getting-a-list-of-links.md"
    fixture: domain-links
    request:
      method: GET
      path: "/api/links"
      query:
        "domain_id": "11111"
        "limit": "1"
      headers:
        "Authorization": "cauldron_shortio_fixture_key_0000000000000000"
    expect:
      status: 200
      body:
        "links[0].id": "lnk_4Th1_8MAbEywPHUsk11111"
      absent:
        - "links[1]"

  # And the position. Asking for one page-worth from
  # pageToken=lnk_4Th1_8MAbEywPHUsk11111 answers the *second* record,
  # which can only happen if the name was read. Between them these two
  # cases pin both halves; either name renamed to what the runtime falls
  # back on fails one of them.
  - name: "pageToken moves the page on, and the second record is what comes back"
    source: "https://developers.short.io/docs/getting-a-list-of-links.md"
    fixture: domain-links
    request:
      method: GET
      path: "/api/links"
      query:
        "domain_id": "11111"
        "limit": "1"
        "pageToken": "lnk_4Th1_8MAbEywPHUsk11111"
      headers:
        "Authorization": "cauldron_shortio_fixture_key_0000000000000000"
    expect:
      status: 200
      body:
        "links[0].id": "lnk_4Th1_YUSVK9T92Dewx11111"
      absent:
        - "links[1]"

