# Sauce Labs Recipe for Cauldron
#
# The job listing, read from the Jobs API reference at docs.saucelabs.com, and
# struck live on 2026-09-14 against two regions with no credential, with a wrong
# basic credential, on a path that does not exist, with a method the path does
# not take, and on the root.
#
# **A path that does not exist asks for a credential; a path that does exist
# says it does not.** Struck live on api.us-west-1.saucelabs.com:
#
#   GET /rest/v1/cauldron-nope             401  {"detail":"Authorization failed"}
#   GET /rest/v1/cauldronuser/jobs         404  Not found          text/plain
#   PUT /rest/v1/cauldronuser/jobs         404  "Not Found"        application/json
#   GET /rest/v1.1/jobs                    401  {"detail":"Authorization failed"}
#
# The inversion is the finding: the invented path is challenged for a
# credential, and the real endpoint shape -- with a username that is not an
# account -- answers 404 before any credential is read. So the username segment
# is resolved ahead of authentication.
#
# **And "not found" is spelled two ways in two formats on one path.** With no
# credential, `GET` answers `Not found` as `text/plain`, lowercase f. `PUT` on
# the same path answers `"Not Found"` -- a bare JSON string, quotes included,
# `application/json; charset=utf-8`, capital F. A client calling `.json()` gets
# a throw on one and the string "Not Found" on the other, where `body.detail` is
# undefined rather than missing.
#
# **The account name is a path segment.** `/rest/v1/{username}/jobs`, so the
# account appears in every URL, every access log and every `Referer` -- and it
# is also half of the Basic credential.
#
# **A field named for a boolean carries a word.** `public` is a string, and the
# reference's own example value is `"team"`, so `if (job.public)` is true for a
# job visible only to a team.
#
# **A field is a past-tense verb.** `breakpointed`, nullable, beside `container`
# and `performance_enabled` -- three booleans-ish fields in three grammars.
#
# **Four identifiers on one record**: `id`, `org_id`, `team_id` and `group_id`,
# and `url` sits among them as null on the reference's own example.
#
# **And the format of the response is a query parameter.** `format` takes `json`
# or `csv` and defaults to `json`, so the media type of a successful answer is
# decided by a value in the query string rather than by `Accept`.
#
# Also pinned: `creation_time` is Unix seconds and `deletion_time` is null
# beside it, with no unit on either; `skip` is the name of the offset
# parameter; and both regional hosts -- us-west-1 and eu-central-1 -- answer
# identically, with the region in the hostname and nothing on the record saying
# which one served it.

recipe: saucelabs
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.saucelabs.com/dev/api/jobs/

auth:
  scheme: basic
  # The username is the account name -- the same one that is in the path --
  # and the access key is the password.
  credential: password
  keys:
    - cauld70n-f1xt-ure0-key0-000000000000
  absent_error: authorization_failed
  malformed_error: authorization_failed
  rejected_error: authorization_failed
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  job:
    id:
      field: id
      style: hex
      length: 32
    fields:
      status:
        type: string
      # Unix seconds, with no unit on the field.
      creation_time:
        type: integer
      deletion_time:
      # Null on the reference's own example.
      url:
      org_id:
        type: string
      team_id:
        type: string
      group_id:
        type: string
      # A string, under a name that reads as a boolean.
      public:
        type: string
      performance_enabled:
        type: boolean
      assigned_tunnel_id:
      container:
        type: boolean
      # A past-tense verb, nullable.
      breakpointed:
      base_config:
        type: map
      command_counts:
        type: map

routes:
  - method: GET
    # The account name, in every URL.
    path: /rest/v1/{username}/jobs
    resource: job
    operation: list
    pagination:
      style: offset
      limit: 100
      limit_param: limit
      # Not "offset".
      cursor_param: skip
    filters:
      - param: status
        field: status

errors:
  authorization_failed:
    status: 401
    message: Authorization failed
    headers:
      WWW-Authenticate: Basic realm="SauceLabs"

  # Live, a path this API does not have is challenged for a credential rather
  # than reported as missing. Struck on /rest/v1/cauldron-nope with nothing
  # sent.
  unknown_route:
    status: 401
    message: Authorization failed
    headers:
      WWW-Authenticate: Basic realm="SauceLabs"

  # And a verb the path does not take is a bare JSON string.
  method_not_allowed:
    status: 404
    style: string
    message: Not Found

fixtures:
  empty:
    job: []

  jobs:
    job:
      - id: 3bad2bfb82404fb184c74716b668d65f
        status: complete
        creation_time: 1618283133
        deletion_time: null
        # A field called url, with nothing in it.
        url: null
        org_id: 5b0dcbd1f0e14a5e9c0b1f2d3a4b5c6d
        team_id: 9f2e4c7a3b184d609a550c1e7b2d8f43
        group_id: 7d51b9ae2f044c868b153e9a0d7c6f21
        # "team", under a name that reads as a boolean.
        public: team
        performance_enabled: true
        assigned_tunnel_id: null
        container: false
        breakpointed: null
        base_config: {}
        command_counts:
          All: 142
          Error: 0
      - id: c41a7e6b0d9f4823ae5c17b2f8d30e95
        status: error
        creation_time: 1618369544
        deletion_time: null
        url: null
        org_id: 5b0dcbd1f0e14a5e9c0b1f2d3a4b5c6d
        team_id: 9f2e4c7a3b184d609a550c1e7b2d8f43
        group_id: 7d51b9ae2f044c868b153e9a0d7c6f21
        # A second value for the field that is not a boolean.
        public: private
        performance_enabled: false
        assigned_tunnel_id: null
        container: false
        breakpointed: null
        base_config: {}
        command_counts:
          All: 7
          Error: 1

conformance:
  - name: a missing credential is refused under a realm naming the vendor
    source: https://api.us-west-1.saucelabs.com/rest/v1.1/jobs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers: {}
    expect:
      status: 401
      headers:
        WWW-Authenticate: Basic realm="SauceLabs"
      body:
        detail: Authorization failed

  - name: and a wrong access key is the same sentence
    source: https://api.us-west-1.saucelabs.com/rest/v1.1/jobs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers:
        # nobody:notreal
        Authorization: "Basic bm9ib2R5Om5vdHJlYWw="
    expect:
      status: 401
      body:
        detail: Authorization failed

  - name: a path this api does not have is challenged rather than refused
    source: https://api.us-west-1.saucelabs.com/rest/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      # Not a 404: the invented path asks for a credential.
      body:
        detail: Authorization failed
      headers:
        WWW-Authenticate: Basic realm="SauceLabs"

  - name: and a wrong verb is a bare json string with a capital f
    source: https://api.us-west-1.saucelabs.com/rest/v1/cauldronuser/jobs
    verified: "2026-09-14"
    fixture: jobs
    request:
      method: PUT
      path: /rest/v1/cauldron-team/jobs
      headers: {}
    expect:
      status: 404
      # Quotes included. body.detail is undefined, not missing.
      body_matches: '\A"Not Found"\s*\z'

  - name: a field named for a boolean carries a word
    source: https://docs.saucelabs.com/dev/api/jobs/
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers:
        # cauldron-team:cauld70n-f1xt-ure0-key0-000000000000
        Authorization: "Basic Y2F1bGRyb24tdGVhbTpjYXVsZDcwbi1mMXh0LXVyZTAta2V5MC0wMDAwMDAwMDAwMDA="
    expect:
      status: 200
      body:
        # if (job.public) is true for a job visible only to a team.
        '[0].public': team
        '[1].public': private
        '[0].status': complete
        '[1].status': error
        '[0].performance_enabled': true
        '[1].performance_enabled': false

  - name: four identifiers and a url with nothing in it
    source: https://docs.saucelabs.com/dev/api/jobs/
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers:
        Authorization: "Basic Y2F1bGRyb24tdGVhbTpjYXVsZDcwbi1mMXh0LXVyZTAta2V5MC0wMDAwMDAwMDAwMDA="
    expect:
      status: 200
      body:
        '[0].id': 3bad2bfb82404fb184c74716b668d65f
        '[0].org_id': 5b0dcbd1f0e14a5e9c0b1f2d3a4b5c6d
        '[0].team_id': 9f2e4c7a3b184d609a550c1e7b2d8f43
        '[0].group_id': 7d51b9ae2f044c868b153e9a0d7c6f21
        # A field called url, and nothing in it.
        '[0].url': null
        '[0].deletion_time': null
        '[0].assigned_tunnel_id': null

  - name: three grammars for three flags
    source: https://docs.saucelabs.com/dev/api/jobs/
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers:
        Authorization: "Basic Y2F1bGRyb24tdGVhbTpjYXVsZDcwbi1mMXh0LXVyZTAta2V5MC0wMDAwMDAwMDAwMDA="
    expect:
      status: 200
      body:
        # A past participle, a noun and an adjective-plus-verb.
        '[0].breakpointed': null
        '[0].container': false
        '[0].base_config': {}
        '[0].command_counts.All': 142
        '[0].command_counts.Error': 0
        # Unix seconds, with no unit on the field.
        '[0].creation_time': 1618283133
        '[1].creation_time': 1618369544

  - name: the offset parameter is called skip
    source: https://docs.saucelabs.com/dev/api/jobs/
    fixture: jobs
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      query:
        limit: "1"
        skip: "1"
        status: error
      headers:
        Authorization: "Basic Y2F1bGRyb24tdGVhbTpjYXVsZDcwbi1mMXh0LXVyZTAta2V5MC0wMDAwMDAwMDAwMDA="
    expect:
      status: 200
      body_matches: '\A\[[\s\S]*\]\s*\z'

  - name: an account with no jobs is a bare empty array
    source: https://docs.saucelabs.com/dev/api/jobs/
    fixture: empty
    request:
      method: GET
      path: /rest/v1/cauldron-team/jobs
      headers:
        Authorization: "Basic Y2F1bGRyb24tdGVhbTpjYXVsZDcwbi1mMXh0LXVyZTAta2V5MC0wMDAwMDAwMDAwMDA="
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
