# Namecheap Recipe for Cauldron
#
# Cloudflare's Recipe in this same collection is the reference point every
# provider here gets measured against, and Namecheap disagrees with it on
# every axis that matters. Cloudflare answers JSON, wraps everything in one
# four-key envelope, and authenticates with a single bearer token. Namecheap
# answers XML, has no envelope at all -- a top-level <ApiResponse> with a
# Status attribute and nothing else consistent between a success and a
# failure -- and authenticates with four query parameters presented at once:
# ApiUser, ApiKey, UserName and ClientIp. This format is JSON-only. Every
# route below either serves recorded bytes through the raw mechanism
# (internal/recipe/raw.go, whose own comment already names "Canada Post,
# PrestaShop and the older USPS generation" as waiting behind this wall --
# Namecheap belongs on that list too) or an error entry with style: text.
# No resources: section exists in this file, because there is no honest way
# to declare a typed field on an XML attribute this format was never built
# to describe. Canada Post's Recipe in this collection is the precedent
# followed throughout.
#
# The question this batch of three exists to answer -- does the response say
# when it was checked, and does it distinguish "not registered" from
# "reserved, premium, or blocked" -- has a sharp answer here, read from
# Namecheap's own documentation (archived copy, cited below, since the live
# docs site answers Cloudflare's bot challenge to every request this Recipe
# sent it). The whole <ApiResponse> carries a Server name, a
# GMTTimeDifference (the answering server's own UTC offset, not the check's
# time) and an ExecutionTime (how long the call took to run, in seconds --
# 1.358 in Namecheap's own example). None of those is a timestamp of when
# the check happened, and no field anywhere in DomainCheckResult is either.
# A domain is available until somebody else registers it, and Namecheap's
# answer to "when was this instant" is silence, on every field it sends.
#
# The availability vocabulary is Available="true"/"false" and, separately,
# IsPremiumName="true"/"false" -- two independent booleans, not a fixed
# vocabulary of reasons. Namecheap's own worked "Example Response (regular
# domain)" (web.archive.org copy of
# namecheap.com/support/api/methods/domains/check/, snapshot
# 2025-10-05T23:13:19Z) answers a taken domain with nothing more specific
# than Available="false" ErrorNo="0" Description="": the same shape an
# already-registered name gets and the same shape a registry-reserved or
# blocked one would presumably get, because nothing in the schema or the two
# worked examples distinguishes them. Description exists and is empty in
# both examples this Recipe could find; whatever it is for, it is not doing
# that job here. Premium status is only ever shown attached to an *available*
# domain -- Namecheap's second worked example, "us.xyz", is
# Available="true" IsPremiumName="true" -- so whether a premium name that is
# already taken still carries IsPremiumName="true" or reverts to looking
# like an ordinary registered domain is not answered by anything this Recipe
# could read.
#
# A price does accompany availability, and only for premium names: four
# separate fields (PremiumRegistrationPrice, PremiumRenewalPrice,
# PremiumRestorePrice, PremiumTransferPrice) plus IcannFee and EapFee, all
# six sent as bare numeric attribute strings on the same element. None of
# them is ever labelled "per year" -- not "12mo", not a period field, not a
# currency code anywhere on the record or in the surrounding envelope.
# Namecheap's own "Response Parameters" table glosses PremiumRegistrationPrice
# as "Registration Price for the premium domain" and stops there. A client
# has to already know, from outside the wire, that a domain price is
# necessarily annual and necessarily whatever currency the account bills in.
#
# The four-parameter credential is where this Recipe earns its place beside
# Porkbun's body pair and DNSimple's bearer header in this batch, and it was
# probed exhaustively live against api.namecheap.com with a fixture ApiKey
# that authenticates nothing (Namecheap's docs describe apiuser/apikey
# activation as a manual, per-account approval step; no account was ever
# created and no real key was ever requested). Sending every combination of
# present, absent and empty for ApiUser, ApiKey, UserName, ClientIp and
# Command against namecheap.domains.check, all on 2026-09-03, produced a
# strict, checkable priority order for which parameter's absence gets
# reported when more than one is missing at once:
#
#   ApiUser absent (regardless of anything else)
#     -> Error 1010101 "Parameter APIUser is missing"
#   Command absent (ApiUser present)
#     -> Error 1010104 "Parameter Command is missing"
#   ApiKey absent or empty (ApiUser, Command present)
#     -> Error 1010102 "Parameter APIKey is missing"
#   ClientIp absent (ApiUser, Command, ApiKey present)
#     -> Error 1010105 "Parameter ClientIP is missing"
#   ClientIp present but not IP-shaped, e.g. "not-an-ip" or "999.999.999.999"
#   (ApiUser, Command, ApiKey all present, ApiKey's own value never checked)
#     -> Error 1011105 "Parameter ClientIP is invalid"
#   Everything else: ApiKey wrong, ClientIp a syntactically valid IP that is
#   simply not the account's whitelisted one, or UserName absent entirely
#     -> Error 1011102 "API Key is invalid or API access has not been enabled"
#
# Two things in that table are the actual finding. First: UserName has no
# presence check of its own anywhere in this priority chain. Sending every
# other parameter and omitting UserName does not answer "Parameter UserName
# is missing" -- there is no such error number anywhere this Recipe could
# reach -- it answers the identical 1011102 a wrong ApiKey gets. Namecheap
# checks ApiUser's presence and ApiKey's and Command's and ClientIP's, each
# with its own numbered sentence, and simply never built one for UserName;
# its absence is indistinguishable from a bad key.
#
# Second, and this is the sharpest thing in this file: **a syntactically
# valid ClientIp that is not the account's whitelisted address is
# indistinguishable from a wrong API key.** This Recipe sent ClientIp
# values that fail basic shape validation ("not-an-ip", "999.999.999.999")
# and got a dedicated 1011105 for both, live. It also sent a
# perfectly well-formed address that cannot be anyone's whitelisted IP
# (127.0.0.1) and got exactly 1011102, byte for byte the same body a
# deliberately wrong ApiKey gets. A credential that includes the caller's
# own IP address is a shape none of the other two Recipes in this batch
# have, and having it does not buy Namecheap a third, more specific answer
# for "your key is fine but you're calling from the wrong place" -- that
# case is folded into "your key is wrong," and a caller has no way, from the
# response alone, to tell which of the two is actually true.
#
# All of this arrives as **HTTP 200**. Every case in that table -- four
# distinct missing-parameter errors, one shape error, and the generic
# invalid-key catch-all -- was sent and answered with a plain 200 OK, live,
# every time; not one of them ever produced a 4xx or 5xx status. The only
# way to know a Namecheap call failed is to parse the XML and read
# Status="ERROR" off the root element. A client that checks response.ok, or
# any HTTP-status-based branch at all, cannot tell a successful domain check
# from "you forgot every parameter" -- both are 200.
#
# That flat status code is also why this Recipe's auth block only carries
# ApiKey. Cauldron's auth.scheme: query checks one named parameter; the live
# host checks four, in the fixed order above, and Absent/Malformed/Rejected
# describe one credential's failure modes, not a four-parameter priority
# chain. What this Recipe declares is the slice that maps cleanly:
# ApiKey absent (all three ahead of it present) is auth.absent_error,
# ApiKey present and wrong is auth.rejected_error, and both are pinned to
# HTTP 200 rather than the runtime's usual 401 default, because that is what
# was actually sent. ApiUser, Command and ClientIp's own presence checks
# have no equivalent in this format at all -- there is no "this query
# parameter is absent" route matcher, only matches_query, which tests
# presence and value, never absence -- so they are recorded here rather than
# routed. The one exception is the ClientIp shape check, because that *is* a
# specific, present value (matches_query can see it), and because it beats
# ApiKey's own validity check on the wire: this Recipe's one public: true
# route reproduces that exactly, matching only requests whose ClientIp is
# literally "not-an-ip" and answering 1011105 regardless of what ApiKey
# carries -- confirmed live by sending that exact ClientIp with ApiKey
# absent entirely, which still answered 1010102 "APIKey is missing" (ApiKey
# presence outranks ClientIp shape), and with ApiKey present and wrong,
# which answered 1011105 as this Recipe's route now does. The route is
# public only for that one literal value; it does not claim ClientIp shape
# is checked before ApiKey presence in general, only that it beats ApiKey's
# *validity* check when ApiKey is merely wrong rather than missing.
#
# Routing was checked the way Step 2 of this batch's own brief asks: a path
# this host does not serve at all, credentialled and not. GET
# /nosuchroute -- a different IIS static path entirely, not a namecheap.com
# marketing redirect -- answered the identical boilerplate IIS "404 - File
# or directory not found" HTML page with and without every parameter this
# Recipe holds attached, live. That is genuinely credential-blind routing,
# not merely "this Recipe never tried," so auth.after_routing: true is a
# verified claim rather than a default left alone. A path that still lands
# on the same ASP.NET handler -- /xml.response/extra, an arbitrary suffix --
# is not "unrouted" at all from the application's point of view: it answered
# the ordinary parameter-missing XML, exactly as /xml.response itself does,
# because IIS's own routing for this host does not distinguish them. Method
# is not checked either, in either direction: GET, POST (both query-string
# and form-encoded bodies) and DELETE against /xml.response all produced the
# identical parameter/credential logic, live, and no method on this path
# ever answered a 405 or anything resembling one. PUT and PATCH could not be
# cleanly probed the same way -- both answered curl's own 411 Length
# Required before reaching Namecheap at all, an artifact of sending no
# request body on a method that expects one, not a finding about the
# provider -- so this Recipe declares only the three methods actually
# confirmed live: GET, POST, DELETE.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 200 with a real account was ever possible -- no key exists that
#     authenticates anything. The two success bodies below are Namecheap's
#     own complete, worked examples from its archived documentation, quoted
#     verbatim rather than reconstructed from field-level schema examples;
#     no value in either one was invented. Every other conformance case in
#     this file is a live, verified failure.
#   - The three fallback routes (GET, POST and DELETE on /xml.response with
#     no matching query) terminate in api_key_invalid, which is never
#     actually reached by any case in this file: every case that could
#     reach it sends a credential this Recipe's own auth block already
#     classifies as Absent or Rejected before the route's own error is ever
#     consulted. It is set to the nearest evidenced behaviour -- what a
#     request naming an unrecognised Command answered when this Recipe
#     tried one live (namecheap.bogus.command, with a wrong key, got the
#     identical 1011102) -- and it is not itself a verified claim about
#     what a genuinely accepted key would get asked something this Recipe
#     does not otherwise model.
#   - ApiUser, Command and ClientIp's own presence-check sentences
#     (1010101, 1010104, 1010105) are recorded in this header, live and
#     dated, and are not routes: see above for why this format cannot
#     express an absent query parameter as a match condition.
#   - No rate limit of any kind is documented anywhere this Recipe could
#     find -- not on the method reference page, not on the getting-started
#     or global-parameters pages -- so none is modelled. That silence is
#     itself worth recording next to Porkbun's explicit 1-check-per-10-
#     seconds and DNSimple's explicitly "stricter" limit on the same kind
#     of endpoint, elsewhere in this batch.
#   - No upstream.spec. Namecheap publishes hand-written HTML reference
#     pages, not a machine-readable description of any kind, so there is
#     nothing to fetch and fingerprint the way Cloudflare's spec_hash does.
#   - Only namecheap.domains.check is modelled. Namecheap's API surface is
#     several hundred commands behind this one path, selected by the
#     Command parameter, and this Recipe claims exactly one of them.
#
# The ApiKey below is a fixture that authenticates nothing on the real
# service, not a secret withheld from this file.

recipe: namecheap
capability: infrastructure
version: 0.1.0

upstream:
  api: unversioned
  docs: https://www.namecheap.com/support/api/intro/

auth:
  scheme: query
  param: ApiKey
  keys:
    - cauldron0000000000000000000000
  absent_error: apikey_missing
  rejected_error: api_key_invalid
  after_routing: true

responses:
  error:
    style: text

routes:
  # Namecheap's own complete, worked "Example Response (regular domain)" --
  # quoted verbatim, not reconstructed. See the header: no key exists to
  # have observed this live, so it carries no verified date.
  - method: GET
    path: /xml.response
    matches_query:
      Command: namecheap.domains.check
      DomainList: testapi.xyz
    raw:
      content_type: text/xml; charset=utf-8
      text: |
        <?xml version="1.0" encoding="utf-8"?>
        <ApiResponse xmlns="http://api.namecheap.com/xml.response" Status="OK">
        <Errors/>
        <Warnings/>
        <RequestedCommand>namecheap.domains.check</RequestedCommand>
        <CommandResponse Type="namecheap.domains.check">
        <DomainCheckResult Domain="testapi.xyz" Available="false" ErrorNo="0" Description="" IsPremiumName="false" PremiumRegistrationPrice="0" PremiumRenewalPrice="0" PremiumRestorePrice="0" PremiumTransferPrice="0" IcannFee="0" EapFee="0"/>
        </CommandResponse>
        <Server>PHX01APIEXT02</Server>
        <GMTTimeDifference>--4:00</GMTTimeDifference>
        <ExecutionTime>1.358</ExecutionTime>
        </ApiResponse>

  # Namecheap's own "Example Response (premium domain)" -- verbatim.
  # Available="true" and IsPremiumName="true" together, with all four
  # premium price fields populated and neither a currency nor a "per year"
  # label anywhere on the element. See the header.
  - method: GET
    path: /xml.response
    matches_query:
      Command: namecheap.domains.check
      DomainList: us.xyz
    raw:
      content_type: text/xml; charset=utf-8
      text: |
        <?xml version="1.0" encoding="utf-8"?>
        <ApiResponse xmlns="http://api.namecheap.com/xml.response" Status="OK">
        <Errors/>
        <Warnings/>
        <RequestedCommand>namecheap.domains.check</RequestedCommand>
        <CommandResponse Type="namecheap.domains.check">
        <DomainCheckResult Domain="us.xyz" Available="true" ErrorNo="0" Description="" IsPremiumName="true" PremiumRegistrationPrice="13000.0000" PremiumRenewalPrice="13000.0000" PremiumRestorePrice="65.0000" PremiumTransferPrice="13000.0000" IcannFee="0.0000" EapFee="0.0000"/>
        </CommandResponse>
        <Server>PHX01APIEXT01</Server>
        <GMTTimeDifference>--4:00</GMTTimeDifference>
        <ExecutionTime>2.647</ExecutionTime>
        </ApiResponse>

  # The one value this Recipe confirmed beats ApiKey's own validity check --
  # see the header for the exact priority ordering this proves and does not
  # prove. Public only for this literal ClientIp value: a request with the
  # same malformed value and ApiKey genuinely absent instead of merely wrong
  # was not re-tested with this route in mind and is not claimed here.
  - method: GET
    path: /xml.response
    matches_query:
      ClientIp: not-an-ip
    public: true
    error: clientip_invalid

  # The fallback for everything else on each method -- see the header's
  # fidelity-gaps note on why api_key_invalid is an evidenced approximation
  # here rather than a verified claim about an accepted credential.
  - method: GET
    path: /xml.response
    error: api_key_invalid

  - method: POST
    path: /xml.response
    error: api_key_invalid

  - method: DELETE
    path: /xml.response
    error: api_key_invalid

errors:
  # Every credential/parameter failure below is HTTP 200 -- see the header.
  # Namecheap signals nothing through the status line; Status="ERROR" on the
  # root element is the only tell.
  apikey_missing:
    status: 200
    headers:
      Content-Type: text/xml; charset=utf-8
    message: |
      <?xml version="1.0" encoding="utf-8"?>
      <ApiResponse Status="ERROR" xmlns="http://api.namecheap.com/xml.response">
        <Errors>
          <Error Number="1010102">Parameter APIKey is missing</Error>
        </Errors>
        <Warnings />
        <RequestedCommand />
        <Server>Server 1360233658</Server>
        <GMTTimeDifference>--4:00</GMTTimeDifference>
        <ExecutionTime>0</ExecutionTime>
      </ApiResponse>

  # Reached by: a wrong ApiKey, a syntactically valid but non-whitelisted
  # ClientIp, an absent UserName, or an unrecognised Command -- see the
  # header for why this one sentence covers all four on the live host.
  api_key_invalid:
    status: 200
    headers:
      Content-Type: text/xml; charset=utf-8
    message: |
      <?xml version="1.0" encoding="utf-8"?>
      <ApiResponse Status="ERROR" xmlns="http://api.namecheap.com/xml.response">
        <Errors>
          <Error Number="1011102">API Key is invalid or API access has not been enabled</Error>
        </Errors>
        <Warnings />
        <RequestedCommand />
        <Server>Server 1360233661</Server>
        <GMTTimeDifference>--4:00</GMTTimeDifference>
        <ExecutionTime>0</ExecutionTime>
      </ApiResponse>

  clientip_invalid:
    status: 200
    headers:
      Content-Type: text/xml; charset=utf-8
    message: |
      <?xml version="1.0" encoding="utf-8"?>
      <ApiResponse Status="ERROR" xmlns="http://api.namecheap.com/xml.response">
        <Errors>
          <Error Number="1011105">Parameter ClientIP is invalid</Error>
        </Errors>
        <Warnings />
        <RequestedCommand />
        <Server>Server 1360233661</Server>
        <GMTTimeDifference>--4:00</GMTTimeDifference>
        <ExecutionTime>0</ExecutionTime>
      </ApiResponse>

  # IIS's own stock 404 page, not Namecheap's -- confirmed credential-blind,
  # so auth.after_routing: true is verified rather than assumed. See the
  # header.
  unknown_route:
    status: 404
    headers:
      Content-Type: text/html
    message: |
      <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
      <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
      <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1"/>
      <title>404 - File or directory not found.</title>
      <style type="text/css">
      <!--
      body{margin:0;font-size:.7em;font-family:Verdana, Arial, Helvetica, sans-serif;background:#EEEEEE;}
      fieldset{padding:0 15px 10px 15px;}
      h1{font-size:2.4em;margin:0;color:#FFF;}
      h2{font-size:1.7em;margin:0;color:#CC0000;}
      h3{font-size:1.2em;margin:10px 0 0 0;color:#000000;}
      #header{width:96%;margin:0 0 0 0;padding:6px 2% 6px 2%;font-family:"trebuchet MS", Verdana, sans-serif;color:#FFF;
      background-color:#555555;}
      #content{margin:0 0 0 2%;position:relative;}
      .content-container{background:#FFF;width:96%;margin-top:8px;padding:10px;position:relative;}
      -->
      </style>
      </head>
      <body>
      <div id="header"><h1>Server Error</h1></div>
      <div id="content">
       <div class="content-container"><fieldset>
        <h2>404 - File or directory not found.</h2>
        <h3>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</h3>
       </fieldset></div>
      </div>
      </body>
      </html>

fixtures:
  empty: {}

conformance:
  - name: an absent ApiKey is a distinct, numbered sentence, with everything else present
    # ApiUser, Command and ClientIp all present -- only ApiKey missing.
    # Confirms the priority table in the header: without this, an absent
    # ApiUser or Command would have been reported instead.
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: example.com
    expect:
      status: 200
      headers:
        Content-Type: text/xml; charset=utf-8
      body_matches: 'Number="1010102">Parameter APIKey is missing'

  - name: a wrong ApiKey is a different sentence, same HTTP status
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: junkkey123
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1011102">API Key is invalid'

  - name: an absent UserName gets no sentence of its own at all
    # Every other parameter present, including a wrong ApiKey. The answer is
    # byte-identical to the case above, which is the finding: Namecheap
    # never built a distinct "UserName is missing" message, unlike the other
    # three checked parameters.
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: junkkey123
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1011102">API Key is invalid'

  - name: a syntactically invalid ClientIp gets its own sentence, ahead of the key's own validity
    # ApiKey is present and wrong here, and the answer is about ClientIp
    # anyway -- the shape check runs first. Compare the next case.
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: junkkey123
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: not-an-ip
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1011105">Parameter ClientIP is invalid'

  - name: but a well-formed ClientIp that is simply not whitelisted is not told apart from a bad key
    # 127.0.0.1 passes shape validation and cannot be anyone's whitelisted
    # address. The answer is the identical sentence a wrong ApiKey gets --
    # the sharpest finding in this file. See the header.
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: junkkey123
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "127.0.0.1"
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1011102">API Key is invalid'

  - name: method is not examined -- POST reaches the identical parameter logic
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: POST
      path: /xml.response
      query:
        ApiUser: cauldron
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1010102">Parameter APIKey is missing'

  - name: and neither does DELETE
    source: https://api.namecheap.com/xml.response
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: junkkey123
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: example.com
    expect:
      status: 200
      body_matches: 'Number="1011102">API Key is invalid'

  - name: a genuinely different path answers IIS's own 404, credential-blind
    source: https://api.namecheap.com/nosuchroute
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /nosuchroute
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: "404 - File or directory not found"

  - name: everything answers 200 -- domains.check against a plain registered domain
    # Namecheap's own complete worked example, quoted verbatim. No key was
    # ever held to observe this live -- see the header.
    source: https://web.archive.org/web/20251005231319/https://www.namecheap.com/support/api/methods/domains/check/
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: cauldron0000000000000000000000
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: testapi.xyz
    expect:
      status: 200
      headers:
        Content-Type: text/xml; charset=utf-8
      body_matches: 'Domain="testapi.xyz" Available="false".*IsPremiumName="false"'

  - name: a premium name is Available and IsPremiumName together, with four separate prices and no currency or period on any of them
    source: https://web.archive.org/web/20251005231319/https://www.namecheap.com/support/api/methods/domains/check/
    fixture: empty
    request:
      method: GET
      path: /xml.response
      query:
        ApiUser: cauldron
        ApiKey: cauldron0000000000000000000000
        UserName: cauldron
        Command: namecheap.domains.check
        ClientIp: "203.0.113.5"
        DomainList: us.xyz
    expect:
      status: 200
      body_matches: 'Domain="us\.xyz" Available="true".*IsPremiumName="true" PremiumRegistrationPrice="13000\.0000"'
