# Transport for London Recipe for Cauldron
#
# The severity scale runs backwards.
#
#   statusSeverity 10  ->  "Good Service"
#   statusSeverity  9  ->  "Minor Delays"
#   statusSeverity  6  ->  "Severe Delays"
#   statusSeverity  5  ->  "Part Closure"
#   statusSeverity  4  ->  "Planned Closure"
#   statusSeverity  3  ->  "Part Suspended"
#
# The bigger number is the better railway. Every other severity scale a client
# has met counts upward into trouble -- syslog, HTTP, CVSS, log levels -- and
# this one counts downward, so sorting descending to put the worst lines first
# puts the healthiest lines first instead, silently, on data that looks sorted.
#
# **And every object carries its .NET type and assembly.**
#
#   "$type": "Tfl.Api.Presentation.Entities.Line, Tfl.Api.Presentation.Entities"
#
# Namespace, class, comma, assembly: JSON.NET's TypeNameHandling, on the wire,
# on every object at every depth -- Line, LineStatus, ValidityPeriod,
# Disruption, ApiError. It begins with a dollar sign, so it needs a subscript in
# most languages, and it is the single longest field in a small response.
#
# Written against the live API rather than a document: every case below was
# checked against api.tfl.gov.uk on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A status carries the year 1. "created": "0001-01-01T00:00:00" on every
#      LineStatus -- .NET's DateTime.MinValue, no timezone, serialised straight
#      onto the wire because nothing set it. The Line beside it carries a real
#      2026 timestamp in the same field name.
#   2. The 404 names an internal host. "Resource not found:
#      http://api:8001/NoSuchEndpoint" -- a service name and a port from inside
#      the deployment, in a message sent to the public internet.
#   3. A failure says what went wrong four times. exceptionType
#      "EntityNotFoundException" is a .NET class name, httpStatusCode is 404,
#      httpStatus is "NotFound", and message is a sentence -- beside
#      relativeUri echoing the path and timestampUtc carrying seven fractional
#      digits, which is .NET's resolution and finer than a JavaScript Date can
#      hold.
#
# And one line can have two statuses at once: on the date recorded, district
# was both "Severe Delays" and "Minor Delays", and metropolitan was both
# "Severe Delays" and "Part Suspended". lineStatuses is an array, and reading
# [0] is a guess about which half of the truth you get.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Line status changes by the minute. What is served is what was recorded on
#     the date in the cases.
#   - Two lines are served, of eleven on the Underground alone.
#   - reason ends with a trailing space on the real API. It is kept.

recipe: tfl
capability: infrastructure
version: 0.1.0

upstream:
  api: tfl
  docs: https://api-portal.tfl.gov.uk/

auth:
  # Public for these endpoints. A key raises the rate limit.
  scheme: none

responses:
  list:
    # A bare array. The type name is inside each element, not around them.
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    fields:
      # JSON.NET's TypeNameHandling, on the failure too.
      "$type": "Tfl.Api.Presentation.Entities.ApiError, Tfl.Api.Presentation.Entities"
      # A .NET class name, in a field a client is meant to switch on.
      exceptionType: EntityNotFoundException
      # The same fact as the status line, twice more.
      httpStatusCode: 404
      httpStatus: NotFound
      # Seven fractional digits: .NET's resolution, finer than a JavaScript
      # Date can hold.
      timestampUtc: "2026-08-30T09:52:43.2736636Z"

resources:
  line:
    id:
      style: opaque
      field: id
    fields:
      # Namespace, class, comma, assembly. The longest field in the object.
      "$type":
        type: string
      name:
        type: string
      modeName:
        type: string
      disruptions:
        type: list
      created:
        type: string
      modified:
        type: string
      # An array, because a line can be two things at once.
      lineStatuses:
        type: list
      routeSections:
        type: list
      serviceTypes:
        type: list
      crowding:
        type: map

  mode:
    id:
      style: opaque
      field: modeName
    fields:
      "$type":
        type: string
      isTflService:
        type: boolean
      isFarePaying:
        type: boolean
      isScheduledService:
        type: boolean
      modeName:
        type: string

routes:
  - method: GET
    path: /Line/Meta/Modes
    resource: mode
    operation: list
    pagination:
      # Struck live on 2026-09-05: both listings come back whole -- eighteen
      # transport modes, eleven tube lines with their status -- and ?limit=2
      # answers the same eighteen. There is no size parameter and no
      # position.
      #
      # These are the sort of collection that does not page because it
      # cannot grow: London has the lines it has. The runtime was serving
      # ten of the eighteen modes and offering a cursor for the rest.
      style: none

  - method: GET
    path: /Line/Mode/tube/Status
    resource: line
    operation: list
    pagination:
      # Struck live on 2026-09-05: both listings come back whole -- eighteen
      # transport modes, eleven tube lines with their status -- and ?limit=2
      # answers the same eighteen. There is no size parameter and no
      # position.
      #
      # These are the sort of collection that does not page because it
      # cannot grow: London has the lines it has. The runtime was serving
      # ten of the eighteen modes and offering a cursor for the rest.
      style: none

  - method: GET
    path: /Line/{id}
    resource: line
    operation: get
    not_found: line_not_recognised

  # A path with nothing behind it, whose message names the deployment.
  - method: GET
    path: /NoSuchEndpoint
    error: resource_not_found

errors:
  line_not_recognised:
    status: 404
    message: "The following line id is not recognised: nosuchline"
    fields:
      relativeUri: /Line/nosuchline

  resource_not_found:
    status: 404
    # A service name and a port from inside the deployment, sent to the public
    # internet.
    message: "Resource not found: http://api:8001/NoSuchEndpoint"
    fields:
      relativeUri: /NoSuchEndpoint

fixtures:
  empty: {}

  network:
    line:
      # Severity 6 is worse than severity 10.
      - id: victoria
        "$type": "Tfl.Api.Presentation.Entities.Line, Tfl.Api.Presentation.Entities"
        name: Victoria
        modeName: tube
        disruptions: []
        created: "2026-08-27T12:26:42.08Z"
        modified: "2026-08-27T12:26:42.08Z"
        lineStatuses:
          - $type: "Tfl.Api.Presentation.Entities.LineStatus, Tfl.Api.Presentation.Entities"
            id: 0
            lineId: victoria
            statusSeverity: 6
            statusSeverityDescription: Severe Delays
            reason: "Victoria Line: Severe delays due to an earlier customer incident. Tickets are being accepted on London Buses, London Overground, Great Northern, Thameslink, Southwestern Railway and South Eastern. "
            # .NET's DateTime.MinValue, because nothing set it.
            created: "0001-01-01T00:00:00"
        routeSections: []
        serviceTypes: []

      # The healthy one, whose number is higher.
      - id: piccadilly
        "$type": "Tfl.Api.Presentation.Entities.Line, Tfl.Api.Presentation.Entities"
        name: Piccadilly
        modeName: tube
        disruptions: []
        created: "2026-08-27T12:26:42.08Z"
        modified: "2026-08-27T12:26:42.08Z"
        lineStatuses:
          - $type: "Tfl.Api.Presentation.Entities.LineStatus, Tfl.Api.Presentation.Entities"
            id: 0
            lineId: piccadilly
            statusSeverity: 10
            statusSeverityDescription: Good Service
            created: "0001-01-01T00:00:00"
        routeSections: []
        serviceTypes: []

    mode:
      - id: bus
        "$type": "Tfl.Api.Presentation.Entities.Mode, Tfl.Api.Presentation.Entities"
        isTflService: true
        isFarePaying: true
        isScheduledService: true
        modeName: bus
      - id: cable-car
        "$type": "Tfl.Api.Presentation.Entities.Mode, Tfl.Api.Presentation.Entities"
        isTflService: true
        isFarePaying: true
        isScheduledService: true
        modeName: cable-car

conformance:
  - name: the severity scale runs backwards
    source: https://api.tfl.gov.uk/Line/Mode/tube/Status
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/Mode/tube/Status
    expect:
      status: 200
      body:
        # Six is Severe Delays...
        "[0].id": victoria
        "[0].lineStatuses[0].statusSeverity": 6
        "[0].lineStatuses[0].statusSeverityDescription": Severe Delays
        # ...and ten is Good Service, so the bigger number is the better
        # railway and sorting descending puts the healthiest lines first.
        "[1].id": piccadilly
        "[1].name": Piccadilly
        "[1].lineStatuses[0].statusSeverity": 10
        "[1].lineStatuses[0].statusSeverityDescription": Good Service

  - name: every object carries its .NET type and assembly
    source: https://api.tfl.gov.uk/Line/victoria
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/victoria
    expect:
      status: 200
      body:
        # Namespace, class, comma, assembly -- and it begins with a dollar
        # sign, so it needs a subscript in most languages.
        "$type": "Tfl.Api.Presentation.Entities.Line, Tfl.Api.Presentation.Entities"
        id: victoria
        name: Victoria
        modeName: tube

  - name: and so does every object inside it
    source: https://api.tfl.gov.uk/Line/Mode/tube/Status
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/Mode/tube/Status
    expect:
      status: 200
      body:
        # A different class, at a different depth, in the same response.
        "[0].lineStatuses[0].$type": "Tfl.Api.Presentation.Entities.LineStatus, Tfl.Api.Presentation.Entities"

  - name: a status carries the year 1
    source: https://api.tfl.gov.uk/Line/Mode/tube/Status
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/Mode/tube/Status
    expect:
      status: 200
      body:
        # .NET's DateTime.MinValue, no timezone, on the wire because nothing
        # set it -- beside a Line whose own "created" is a real 2026 date.
        "[0].lineStatuses[0].created": "0001-01-01T00:00:00"
        "[0].created": "2026-08-27T12:26:42.08Z"

  - name: the modes are a bare array of typed objects
    source: https://api.tfl.gov.uk/Line/Meta/Modes
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/Meta/Modes
    expect:
      status: 200
      body:
        "[0].modeName": bus
        "[0].$type": "Tfl.Api.Presentation.Entities.Mode, Tfl.Api.Presentation.Entities"
        # Three booleans that are all true for a bus, so nothing here
        # distinguishes them until something is not.
        "[0].isTflService": true
        "[0].isFarePaying": true
        "[0].isScheduledService": true
        "[1].modeName": cable-car

  - name: a line that is not a line says which four times
    source: https://api.tfl.gov.uk/Line/nosuchline
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/nosuchline
    expect:
      status: 404
      body:
        # A .NET class name in a field a client is meant to switch on...
        exceptionType: EntityNotFoundException
        # ...the status as a number...
        httpStatusCode: 404
        # ...the status as a string...
        httpStatus: NotFound
        # ...and a sentence, beside the path echoed back.
        message: "The following line id is not recognised: nosuchline"
        relativeUri: /Line/nosuchline

  - name: and the failure is typed too, to seven decimal places
    source: https://api.tfl.gov.uk/Line/nosuchline
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /Line/nosuchline
    expect:
      status: 404
      body:
        "$type": "Tfl.Api.Presentation.Entities.ApiError, Tfl.Api.Presentation.Entities"
        # Seven fractional digits: .NET's resolution, finer than a JavaScript
        # Date can hold.
        timestampUtc: "2026-08-30T09:52:43.2736636Z"

  - name: a path with nothing behind it names the deployment
    source: https://api.tfl.gov.uk/NoSuchEndpoint
    verified: "2026-08-30"
    fixture: network
    request:
      method: GET
      path: /NoSuchEndpoint
    expect:
      status: 404
      body:
        # A service name and a port from inside the deployment, sent to the
        # public internet.
        message: "Resource not found: http://api:8001/NoSuchEndpoint"
        relativeUri: /NoSuchEndpoint
