# Dog CEO Recipe for Cauldron
#
# "message" is a URL, or an array of strings, or an error sentence.
#
#   /api/breeds/image/random   ->  200 {"message": "https://.../n02091032_8150.jpg",
#                                       "status": "success"}
#   /api/breed/hound/list      ->  200 {"message": ["afghan", "basset", ...],
#                                       "status": "success"}
#   /api/breed/zzzz/images/random -> 404 {"message": "Breed not found (main breed
#                                       does not exist)", "status": "error",
#                                       "code": 404}
#
# One key, three meanings, and two of them are strings. A client cannot tell the
# image URL from the error sentence by type -- both are strings under "message"
# -- so the only way to know which arrived is to read "status" first, or to
# notice that one of them starts with https. Code that assigns message straight
# to an img src renders a broken image whose alt text is the error.
#
# **And the sub-breed list is the same key again, as an array.** So the field is
# string-or-array depending on the endpoint, and string-or-string depending on
# whether it worked.
#
# Written against the live API rather than a document: every case below was
# checked against dog.ceo on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. status is a word, beside an HTTP status that agrees with it. "success"
#      and "error" restate what the status line already said -- and unlike most
#      APIs that do this, these two do agree: the failure is a real 404.
#   2. code appears only on the failure. A success has message and status; a
#      failure has message, status and code -- so the object's shape depends on
#      whether it worked, and code duplicates the status line a third time.
#   3. The sub-breed list is bare names. "afghan", "basset", "blood" -- not
#      "hound/afghan" and not objects, so a client holding the list has to
#      remember which breed it asked about to build the next URL.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One image and one breed's sub-breeds are served, not the collection. The
#     random endpoint is random and this answers the recorded one.
#   - Only the random-image, sub-breed-list and one failure are modelled. The
#     all-breeds list, the by-breed image lists and the multiple-image forms
#     answer their own documents.

recipe: dogceo
capability: infrastructure
version: 0.1.0

upstream:
  api: dogceo
  docs: https://dog.ceo/dog-api/documentation/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  success:
    fields:
      # A word restating the status line, on every answer that worked.
      status: success
  resource:
    # Bare, because the image endpoint's own envelope is the message key and
    # the field carries that name itself. A wrapped resource envelope here
    # would be a declaration the route overrides away.
    style: bare
  list:
    style: wrapped
    key: message
    entry_field: name
  error:
    style: flat
    message_field: message
    fields:
      status: error

resources:
  image:
    id:
      style: opaque
      # A URL is the whole of the answer; nothing else identifies it.
      field: "-"
      carried_by: url
    fields:
      url:
        type: string
        as: message

  subbreed:
    id:
      style: opaque
      field: "-"
      carried_by: name
    fields:
      # Bare names, so a client has to remember the breed it asked about.
      name:
        type: string
      breed:
        type: string
        in: "-"

routes:
  - method: GET
    path: /api/breeds/image/random
    resource: image
    operation: get
    id_from: auth

  - method: GET
    path: /api/breed/{breed}/list
    resource: subbreed
    operation: list
    pagination:
      # Struck live on 2026-09-05: the sub-breed list comes back whole, as
      # seven names under message for hound, with no parameters of any kind.
      # There is nothing to page.
      #
      # So this listing does not page: no page size, no position, no pointer
      # to a next page. The runtime was reading "limit" and "cursor", which
      # nothing here answers to.
      style: none
    scope: [breed]

  # A breed that does not exist, and the third meaning of "message".
  - method: GET
    path: /api/breed/zzzz/images/random
    error: breed_not_found

errors:
  breed_not_found:
    status: 404
    message: Breed not found (main breed does not exist)
    fields:
      # The status line, restated twice: once as a word and once as a number.
      code: 404

fixtures:
  empty: {}

  kennel:
    image:
      - id: greyhound
        # A URL, under the key that holds an error sentence when it fails.
        url: https://images.dog.ceo/breeds/greyhound-italian/n02091032_8150.jpg

    subbreed:
      # Bare names under the same key, as an array.
      - id: afghan
        breed: hound
        name: afghan
      - id: basset
        breed: hound
        name: basset
      - id: blood
        breed: hound
        name: blood
      - id: english
        breed: hound
        name: english
      - id: ibizan
        breed: hound
        name: ibizan
      - id: plott
        breed: hound
        name: plott
      - id: walker
        breed: hound
        name: walker

      # A second breed, so the breed in the path is partitioning rather than
      # decorating.
      - id: cattle
        breed: bulldog
        name: boston

conformance:
  - name: the key holds a URL
    source: https://dog.ceo/api/breeds/image/random
    verified: "2026-08-30"
    fixture: kennel
    request:
      method: GET
      path: /api/breeds/image/random
    expect:
      status: 200
      body:
        # A string, under the key that holds an error sentence when it fails.
        message: https://images.dog.ceo/breeds/greyhound-italian/n02091032_8150.jpg
        # A word restating the status line.
        status: success

  - name: and an array of bare names, on another endpoint
    source: https://dog.ceo/api/breed/hound/list
    verified: "2026-08-30"
    fixture: kennel
    request:
      method: GET
      path: /api/breed/hound/list
    expect:
      status: 200
      body:
        # The same key, as an array -- so the field is string-or-array
        # depending on which endpoint answered.
        "message[0]": afghan
        "message[1]": basset
        "message[6]": walker
        status: success

  - name: and an error sentence, indistinguishable from the URL by type
    source: https://dog.ceo/api/breed/zzzz/images/random
    verified: "2026-08-30"
    fixture: kennel
    request:
      method: GET
      path: /api/breed/zzzz/images/random
    expect:
      status: 404
      body:
        # A string under "message", exactly like the image URL, so nothing but
        # reading "status" first tells them apart.
        message: Breed not found (main breed does not exist)
        status: error
        # And the status line a third time, as a number.
        code: 404

  - name: the success has no code and the failure does
    source: https://dog.ceo/api/breeds/image/random
    verified: "2026-08-30"
    fixture: kennel
    request:
      method: GET
      path: /api/breeds/image/random
    expect:
      status: 200
      body:
        status: success
      absent:
        # So the object's shape depends on whether it worked.
        - code

  - name: the sub-breeds carry no breed of their own
    source: https://dog.ceo/api/breed/hound/list
    verified: "2026-08-30"
    fixture: kennel
    request:
      method: GET
      path: /api/breed/hound/list
    expect:
      status: 200
      body:
        # Bare names, not "hound/afghan" and not objects, so a client holding
        # the list has to remember which breed it asked about to build the next
        # URL.
        "message[2]": blood
        "message[3]": english
        "message[4]": ibizan
        "message[5]": plott
      absent:
        # Seven sub-breeds for this breed, and the other breed's is not among
        # them.
        - message[7]
