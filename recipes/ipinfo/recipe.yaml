# IPinfo Recipe for Cauldron
#
# This Recipe, maxmind/recipe.yaml and geoapify/recipe.yaml were written
# together as a group, on the same day, against one question: an IP address
# geolocation is a guess with a confidence, but most APIs hand it back as a
# flat fact. Does the wire ever admit uncertainty, or does it answer with a
# city as though it knew? IPinfo answers the credential half of that question
# in the sharpest way this whole collection has found anywhere, geocoding
# Recipes included. Struck live, with no account and no token, against
# ipinfo.io:
#
#   GET /8.8.8.8/json                                         -> 200, full free-tier body
#   GET /8.8.8.8/json  Authorization: Bearer junktoken12345    -> 403 {"status":403,"error":{"title":"Unknown token","message":"Please ensure you've entered your token correctly. Refer to https://ipinfo.io/developers for details, or contact us at support@ipinfo.io for help"}}
#   GET /8.8.8.8/json  Authorization: Bearer                   -> 200, byte-identical to the first
#   GET /8.8.8.8/json  Authorization: junktoken12345            -> 200, byte-identical to the first
#
# here/recipe.yaml and what3words/recipe.yaml, elsewhere in this collection,
# both found that a query-string credential lets "unauthenticated" mean two
# different things -- absent and wrong -- and both providers answer with an
# error either way, just not the *same* error. IPinfo does not do that. An
# absent credential is not an error at all: it is a fully successful 200 with
# a real, if reduced, body. A credential that is present, has the right
# prefix and is simply wrong for any account is the only thing on this host
# that produces a 4xx. And a credential that is present but cannot even be
# parsed as an attempt -- "Bearer " with nothing after it, or a bare
# "junktoken12345" with no "Bearer " at all -- is not treated as a rejected
# credential and is not treated as a malformed one either: it falls through
# to exactly the same free-tier 200 an absent header gets, checked both ways
# above and byte-identical both times. Cauldron's own auth verdicts --
# absent, malformed, rejected -- exist to let a Recipe name a provider's
# distinct sentence for each. IPinfo does not have three sentences or even
# two: it has one success shape for "nothing usable was presented" and one
# failure shape for "something was presented and it was wrong," full stop.
# That is a shape Cauldron's binary accepted/refused auth model cannot
# express at all -- every scheme it has treats a non-accepted credential as a
# reason to refuse the request, never as a reason to serve a thinner
# version of it -- so this Recipe declares auth.scheme: none, which is the
# literal truth about what a request needs to succeed here, and reaches the
# 403 by arming it, the same device ip-api's own Recipe in this collection
# uses for its TLS entitlement wall. See "Known fidelity gaps" below for
# exactly what that trades away.
#
# **The free tier is real data, not a stub, and precisely which fields it
# carries was the thing worth pinning.** Every unauthenticated 200 this
# Recipe struck against a real, publicly-routable address came back with
# exactly this shape and no more:
#
#   ip, hostname, city, region, country, loc, org, postal, timezone, readme,
#   anycast (present only when true)
#
# Nothing here is an accuracy signal. loc is one string, "lat,lon" comma-
# joined, not two numbers -- the same choice ip-api's Recipe in this
# collection notes for its own "as" field: two pieces of data pushed into
# one field a client has to split itself. org is the same trick again --
# "AS15169 Google LLC", an ASN and an organisation name in one string with a
# space where a client would want a boundary -- byte-for-byte the shape
# ip-api's Recipe already found and named for its own "as" field, on a
# completely different provider. Every unauthenticated response also carries
# readme, a link to https://ipinfo.io/missingauth -- which, fetched
# directly, 404s with this Recipe's own "Wrong ip" body (see below), because
# the router treats every path segment as a candidate address, including the
# one the API's own error message points a caller to.
#
# **IPinfo's own documentation, read three pages deep, says a token buys a
# different shape on this exact route, not just a higher rate limit.** None
# of the following was struck live -- no token exists for this Recipe to
# use -- and each is cited from developers.ipinfo.io, not observed:
#
#   - IPinfo Core (developers/data-types, developers/ip-privacy-detection-
#     api-data): a token adds is_anonymous and is_hosting, two booleans,
#     inline on this same response.
#   - IPinfo Plus and Max (developers/ip-geolocation-api-data): add a
#     genuine accuracy signal this free tier has none of -- radius, "the
#     estimated accuracy radius in kilometers," and last_changed, a
#     geolocation-stability date. Max's own /anonymous surface goes
#     further still: is_vpn, is_proxy, is_tor, is_relay, each a named
#     boolean rather than the free tier's silence.
#   - A Custom Extended Privacy Detection product, sold separately from the
#     geolocation route entirely, adds a literal confidence field --
#     described as "an integer" with no scale given on the one page that
#     names it.
#
# So the honest answer to "does IPinfo admit uncertainty" is: not on the
# route this Recipe can reach, and yes, by name, on three routes upward that
# this Recipe cannot verify and will not fabricate. See
# maxmind/recipe.yaml for a provider whose accuracy_radius and confidence
# fields are pinned with page-cited numbers instead, because MaxMind's own
# documentation happened to publish a full worked example where IPinfo's
# does not go further than field names and tier tables.
#
# **A private, reserved or otherwise unroutable address collapses the entire
# response to two fields and a boolean, on the free tier, with no error
# status anywhere.** Every one of the ranges below answered 200, and every
# one answered the identical shape -- an id and bogon: true, nothing else,
# not even the fields that were merely empty:
#
#   GET /10.0.0.1/json        -> {"ip":"10.0.0.1","bogon":true}     (RFC 1918 private)
#   GET /192.0.2.1/json       -> {"ip":"192.0.2.1","bogon":true}    (TEST-NET-1, RFC 5737)
#   GET /198.51.100.1/json    -> {"ip":"198.51.100.1","bogon":true} (TEST-NET-2, RFC 5737)
#   GET /127.0.0.1/json       -> {"ip":"127.0.0.1","bogon":true}    (loopback)
#   GET /224.0.0.1/json       -> {"ip":"224.0.0.1","bogon":true}    (multicast)
#
# Contrast ip-api's Recipe in this collection, whose provider answers a
# malformed query with a "fail" status in an otherwise identically-shaped
# body -- ip-api never drops a key. IPinfo's bogon answer is not a thinner
# version of the same envelope; it omits hostname, city, region, country,
# loc, org, postal, timezone and readme outright, which is a stronger and
# more honest signal than a row of empty strings would be, and is exactly
# why this Recipe's fixture records below carry only the keys the live
# response carried and nothing else -- Cauldron only ever emits a key a
# fixture record actually holds, so the shape below reproduces the omission
# rather than nulling it out.
#
# **IPv4 and IPv6 answer the same shape, with one concrete difference this
# Recipe's own probes found and no more.** 2001:4860:4860::8888, Google's
# public IPv6 resolver, answers city, region, country, loc, org, postal,
# timezone, readme and anycast: true -- everything 8.8.8.8 answers except
# hostname, which is simply absent rather than null. Whether that is a
# general IPv6-versus-IPv4 pattern or specific to this one address's own
# missing PTR record was not established further, and is reported as
# observed rather than generalised.
#
# **A wrong path outranks the credential question entirely, and so, more
# surprisingly, does a malformed identifier in a path shape this host would
# otherwise accept.** Both struck live, no token, and reused from the same
# error:
#
#   GET /v1/totally-bogus-endpoint-xyz    -> 404 {"status":404,"error":{"title":"Wrong ip","message":"Please provide a valid IP address"}}
#   GET /not-an-ip/json                   -> 404, byte-identical
#
# There is exactly one router on this host and it does not distinguish "a
# path this API does not have" from "a path this API has, addressing an
# identifier that cannot be an IP" -- both fail the same address-parsing
# step before anything about a credential is ever consulted, which is a
# structural counterpart to Rootly's Recipe elsewhere in this collection
# (router first for a path it does not have) without Rootly's own split
# (credential first for one it does): here there is no credential check on
# this path at all, on any route, that a wrong path or a bad identifier
# could ever reach ahead of.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - auth.scheme: none is the literal truth about what this route needs to
#     succeed, and it is also why the free tier is what this Recipe answers
#     with by default rather than something an emulator would normally call
#     the "authenticated" case. The 403 "Unknown token" sentence is real,
#     struck live, and carries a verified date -- reached by arming it,
#     because Cauldron's credential model has no way to serve a thinner body
#     to an absent credential and a sharper error to a present-and-wrong one
#     on the same route without one of those two behaviours winning
#     unconditionally.
#   - The three token-gated shapes named above -- Core's is_anonymous /
#     is_hosting, Plus/Max's radius / last_changed / is_vpn / is_proxy /
#     is_tor / is_relay, and the Custom tier's confidence -- are documented
#     field names, not routes. No token was ever requested, guessed or used,
#     and no case below claims any of them.
#   - This host answers any method other than GET on this same path with
#     200 and the caller's own address, silently, rather than a 404 or a
#     405 -- confirmed live with POST, PUT, PATCH and DELETE, each reusing
#     whatever GET on the bare host would have answered. That response
#     necessarily identifies whoever made the request, so it cannot be
#     fixtured here without recording somebody's real address, and this
#     Recipe declares no route for it. A POST, PUT, PATCH or DELETE against
#     this emulator therefore answers Cauldron's own generic 405 instead --
#     the one place this Recipe is known to be less permissive than the
#     host it stands in for, stated plainly rather than left for a reader to
#     discover by being surprised.
#   - The bare /{ip} path (no /json suffix) was checked with two different
#     User-Agent strings and answered two different content types -- JSON to
#     curl, an HTML info page to a browser UA -- which is User-Agent
#     sniffing on an undocumented default rather than a documented format
#     negotiation, and is not modelled: this Recipe routes only the explicit
#     /json suffix its own documentation names.
#   - No rate-limit header was seen on any response this Recipe struck, so
#     none is declared. ip-api's Recipe in this collection has two
#     (X-Rl, X-Ttl); IPinfo, at least unauthenticated, appears to have
#     none, which is itself worth having said rather than assumed.

recipe: ipinfo
capability: infrastructure
version: 0.1.0

upstream:
  api: core
  docs: https://ipinfo.io/developers

auth:
  # The literal truth about this route: nothing is required to succeed. See
  # the header for why "absent" is not a failure mode here at all, and for
  # how the one real credential failure this host has (a well-formed, wrong
  # bearer token) is reached instead.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # {"status": 404, "error": {"title": "...", "message": "..."}} on every
    # failure this Recipe struck. status sits beside error, not inside it --
    # a flat envelope with two dotted names rather than a nested one, because
    # StatusField on the nested style would place status inside "error" and
    # this host does not.
    style: flat
    message_field: error.message
    code_field: error.title
    type_field: "-"
    status_field: status

resources:
  lookup:
    id:
      # The address itself, echoed back under the name the request used it
      # to ask about. Not a provider-minted identifier in any sense the rest
      # of this collection means one -- see ip-api's Recipe (field: query)
      # and what3words' Recipe (field: words) for the same non-id shape on
      # two other providers in this collection.
      style: opaque
      field: ip
    fields:
      # Absent on a bogon response, and on the one IPv6 address this Recipe
      # checked -- see the header. Present is the common case for a
      # publicly-routable IPv4 address with a PTR record.
      hostname:
        type: string
      city:
        type: string
      region:
        type: string
      country:
        type: string
      # "lat,lon" as one comma-joined string, not two numbers. See the
      # header's comparison with ip-api's own single-string "as" field.
      loc:
        type: string
      # An ASN and an organisation name pushed into one string with a space
      # for a boundary -- see the header.
      org:
        type: string
      postal:
        type: string
      timezone:
        type: string
      # A link to https://ipinfo.io/missingauth, present on every
      # unauthenticated 200 this Recipe struck against a real address. Not
      # present on a bogon response.
      readme:
        type: string
      # Present only when true -- absent rather than false on every other
      # response this Recipe struck, bogon or not.
      anycast:
        type: boolean
      # The entire signal a private, reserved or otherwise unroutable
      # address gets. See the header: every other field is simply missing
      # on this shape, not null and not empty.
      bogon:
        type: boolean

routes:
  - method: GET
    path: /{id}/json
    resource: lookup
    operation: get

  # A path shape this route would otherwise accept, addressing an
  # identifier that cannot be an IP at all. Struck live and reused from the
  # identical unrouted-path answer -- see the header for why one router
  # answers both the same way.
  - method: GET
    path: /not-an-ip/json
    error: unknown_route

errors:
  # Reused for two live-distinct probes that turned out to be one failure --
  # see the header and both routes above.
  unknown_route:
    status: 404
    code: Wrong ip
    message: Please provide a valid IP address

  # The one real credential failure this host has. Reached by arming it --
  # see the header for why Cauldron's own auth model cannot reach this
  # unconditionally on a Recipe that also has to answer an absent credential
  # with a real 200.
  unknown_token:
    status: 403
    code: Unknown token
    message: "Please ensure you've entered your token correctly. Refer to https://ipinfo.io/developers for details, or contact us at support@ipinfo.io for help"

fixtures:
  empty: {}

  addresses:
    lookup:
      # A public resolver with a reverse DNS record. anycast: true, along
      # with every other Google Public DNS address this Recipe checked.
      - id: 8.8.8.8
        hostname: dns.google
        city: Mountain View
        region: California
        country: US
        loc: "37.4056,-122.0775"
        org: "AS15169 Google LLC"
        postal: "94043"
        timezone: America/Los_Angeles
        readme: https://ipinfo.io/missingauth
        anycast: true

      # The same resolver's IPv6 address. Identical shape, minus hostname --
      # see the header for what this Recipe does and does not claim about
      # why.
      - id: "2001:4860:4860::8888"
        city: Mountain View
        region: California
        country: US
        loc: "38.0088,-122.1175"
        org: "AS15169 Google LLC"
        postal: "94043"
        timezone: America/Los_Angeles
        readme: https://ipinfo.io/missingauth
        anycast: true

      # RFC 1918 private space. Nothing here but the two fields every bogon
      # answer carries.
      - id: 10.0.0.1
        bogon: true

      # TEST-NET-1, RFC 5737. Byte-identical shape to the private range
      # above -- this host does not distinguish "private" from "reserved
      # for documentation" any more finely than bogon: true.
      - id: 192.0.2.1
        bogon: true

conformance:
  - name: no credential at all is a complete, successful answer
    source: https://ipinfo.io/8.8.8.8/json
    verified: "2026-09-02"
    fixture: addresses
    request:
      method: GET
      path: /8.8.8.8/json
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        ip: 8.8.8.8
        hostname: dns.google
        city: Mountain View
        country: US
        loc: "37.4056,-122.0775"
        org: "AS15169 Google LLC"
        readme: https://ipinfo.io/missingauth
        anycast: true

  - name: a credential that cannot even be parsed as an attempt gets the same answer as none at all
    # "Authorization: junktoken12345", no "Bearer " prefix anywhere on the
    # request -- struck live and byte-identical to the case above, which is
    # what auth.scheme: none reproduces without any special-casing: this
    # host never looks at the header at all unless it starts with "Bearer "
    # and has something after it.
    source: https://ipinfo.io/8.8.8.8/json
    verified: "2026-09-02"
    fixture: addresses
    request:
      method: GET
      path: /8.8.8.8/json
      headers:
        Authorization: junktoken12345
    expect:
      status: 200
      body:
        ip: 8.8.8.8
        hostname: dns.google

  - name: a credential that is present, well-formed and wrong is the one real failure this host has
    # Reached by arming unknown_token -- see the header for why. Live:
    # "Authorization: Bearer junktoken12345" against this exact path.
    source: https://ipinfo.io/8.8.8.8/json
    verified: "2026-09-02"
    arm: unknown_token
    fixture: addresses
    request:
      method: GET
      path: /8.8.8.8/json
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 403
      body:
        status: 403
        error.title: Unknown token
        error.message: "Please ensure you've entered your token correctly. Refer to https://ipinfo.io/developers for details, or contact us at support@ipinfo.io for help"

  - name: a private address collapses to an id and a boolean, nothing else
    source: https://ipinfo.io/10.0.0.1/json
    verified: "2026-09-02"
    fixture: addresses
    request:
      method: GET
      path: /10.0.0.1/json
    expect:
      status: 200
      body:
        ip: 10.0.0.1
        bogon: true
      absent:
        - city
        - country
        - loc
        - org
        - hostname
        - readme
        - anycast

  - name: a documentation-range address collapses the same way, not just a private one
    source: https://ipinfo.io/192.0.2.1/json
    verified: "2026-09-02"
    fixture: addresses
    request:
      method: GET
      path: /192.0.2.1/json
    expect:
      status: 200
      body:
        ip: 192.0.2.1
        bogon: true
      absent:
        - city
        - country

  - name: IPv6 answers the same shape as IPv4, missing only a reverse DNS record this address does not have
    source: https://ipinfo.io/2001:4860:4860::8888/json
    verified: "2026-09-02"
    fixture: addresses
    request:
      method: GET
      path: /2001:4860:4860::8888/json
    expect:
      status: 200
      body:
        ip: "2001:4860:4860::8888"
        city: Mountain View
        country: US
        loc: "38.0088,-122.1175"
        anycast: true
      absent:
        - hostname

  - name: an unrouted path answers by the same failure a malformed identifier would
    source: https://ipinfo.io/v1/totally-bogus-endpoint-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-endpoint-xyz
    expect:
      status: 404
      body:
        status: 404
        error.title: Wrong ip
        error.message: Please provide a valid IP address

  - name: and a path shaped like a real lookup with an identifier that cannot be an address answers identically
    source: https://ipinfo.io/not-an-ip/json
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /not-an-ip/json
    expect:
      status: 404
      body:
        error.title: Wrong ip
        error.message: Please provide a valid IP address
