# Melio Recipe for Cauldron
#
# Melio is accounts payable, and the question this group of Recipes exists
# to answer -- once a payment is submitted, can it be un-submitted, and what
# does the API say if you try outside the window -- turns out to have an
# answer here that is more interesting than "yes" or "no": it is "there is a
# route for that, and this Recipe never got past the door far enough to see
# what it does."
#
# api.melio.com is not partner-gated at the network level. Every route named
# below was struck live, 2026-09-01, with no account, no API key and no
# partner agreement of any kind, and every one of them answered -- with
# structure, not silence. What gates real use is authentication: every
# route this Recipe found needs a bearer token this Recipe was never issued,
# and Melio's own documentation portal, docs.melio.com, describes the token
# as something a partner receives through onboarding rather than something
# a self-serve signup produces. So the honest shape of this Recipe is not
# "nothing is reachable" -- plenty is -- it is "everything reachable is a
# refusal," and every case below is one of those refusals, dated and struck
# against the real host, because that is the whole and complete truth of
# what an unauthenticated caller gets from this API.
#
# **A default HTTP client is refused before any of that -- by Cloudflare, not
# by Melio.** curl's own default User-Agent gets a 403 "Attention Required"
# challenge page on both api.melio.com and docs.melio.com, identical to what
# a browser sees when it is asked to prove it is not a bot. An ordinary
# desktop-browser User-Agent string clears it -- nothing about credentials,
# cookies or a challenge response, only the header -- and every case below
# was struck that way. This is recorded because it is itself the first
# finding: the edge in front of this API distinguishes automation from a
# browser before Melio's own application ever sees the request, and a
# monitoring script polling this host with a bare HTTP client would learn
# nothing except "blocked" and never reach the API at all.
#
# **The cancel route exists, is a POST to a sub-resource, and this Recipe
# has never seen it accept a request.** GET /v1/payments/{id}/cancel
# answers "Could not find method GET for path /payments/{id}/cancel in
# openapi spec" -- which is only sayable because the *path* was found and
# the *method* was not. DELETE and PUT get the identical shape of refusal
# for the identical path. POST does not: POST /v1/payments/123/cancel
# answers 401 "Missing Authorization Header", the same credential gate
# every other real route on this host answers with. That is three
# consistent, independent confirmations that POST /v1/payments/{id}/cancel
# is a real, registered route on this API, struck with no body and an empty
# body alike, and this Recipe has never once seen what it returns, because
# doing so needs a bearer token this Recipe does not have and will not
# fabricate one to get.
#
# **The payment resource answers to at least three verbs that could plausibly
# stop it, and nothing here says which one is authoritative.** Besides the
# POST .../cancel route above, GET, PATCH and DELETE all resolve as real,
# credential-gated methods on /v1/payments/{id} -- each answers 401, not
# the "could not find method" shape PUT and POST answer on that same path.
# So a status write (PATCH) and an outright deletion (DELETE) are both
# live, registered possibilities on the same resource the sub-resource
# cancel route also targets, and no case here can say which of the three is
# what a real integration is meant to call, because none of the three ever
# answered anything but a demand for a credential. Recording all three
# rather than guessing at one is the honest version of this finding.
#
# **A bill is not a payment, and the two have no cancel-shaped route in
# common.** /v1/bills/{id}/cancel, /bills/{id}/void and /bills/{id}/pay all
# answer "Could not find path" -- none exists. Only /v1/payments/{id}/cancel
# does. Whatever a bill represents in Melio's model, ending one is not
# addressed the way ending a payment is, or is not addressed by a route
# this API's own OpenAPI validator recognises at all.
#
# **Missing and wrong credentials are told apart, and body validation runs
# before either check.** Checked live against GET /v1/bills:
#
#   no Authorization header at all         -> 401 {"error":{"message":
#                                              "Missing Authorization
#                                              Header","code":"401"}}
#   Authorization: junk (no Bearer prefix) -> 401, the byte-identical body
#   Authorization: Bearer junktoken12345   -> 401 {"error":{"message":
#                                              "Unauthorized","code":"401"}}
#
# Absent and unprefixed collapse to the identical sentence; a well-formed,
# wrong bearer token gets a different one. That is a real three-way split --
# absent, malformed, rejected -- and each verdict below carries its own
# error, the mechanism Step 2a of this group's brief describes.
#
# What decides the *shape* of the whole response, though, is not the
# credential at all. POST /v1/bills and POST /v1/payments were both struck
# with an empty JSON body and with no credential, and separately with the
# identical empty body and a wrong bearer token attached -- four requests,
# two identical 400s, credential never once relevant:
#
#   POST /v1/bills    {} -> 400 {"error":{"message":"Bad request","code":
#                          "400","data":[{"path":"amount","errorCode":
#                          "required.openapi.requestValidation","message":
#                          "must have required property 'amount'", ...},
#                          {"path":"vendorId", ...},{"path":"dueDate", ...}]}}
#   POST /v1/payments {} -> 400, the same shape, naming paymentBillsInfo,
#                          fundingSourceId, deliveryMethodId, scheduledDate,
#                          deliveryPreference and vendorId as missing
#
# This is Northflank's own arrangement, reached independently on a
# completely different host -- auth.after_routing's own comment names it as
# one of five orderings the flag cannot express: "its nested build route
# checks the body's shape first and answers 400 to a request carrying no
# credential at all." Melio's whole /v1 surface does this for every POST:
# the body is validated against the OpenAPI schema before the credential is
# examined, every time, regardless of what the credential was.
#
# **Routing resolves in three visibly different tiers, and the vendor's own
# infrastructure does not agree with itself about how to say "no route
# here."** Struck live, all with a browser User-Agent and no credential:
#
#   GET /                    -> 403 {"message":"Missing Authentication
#                                Token"} -- API Gateway's own default,
#                                x-amzn-errortype:
#                                MissingAuthenticationTokenException. The
#                                name is misleading: nothing about a token
#                                was checked. AWS API Gateway sends this
#                                exact shape for *any* unmapped resource,
#                                which the root path is here.
#   GET /foo                -> 404, an Express fallback page, HTML:
#                                "Cannot GET /foo" -- a different framework
#                                answering, a different media type, no JSON
#                                at all.
#   GET /v1/nosuchroute      -> 400 {"error":{"message":"OpenApi validation
#                                error - Could not find path /nosuchroute in
#                                openapi spec","code":"400"}} -- the
#                                OpenAPI-validator layer that also produces
#                                every 400 in this file, and the message
#                                strips this Recipe's own /v1 prefix from
#                                the path it echoes back, the same
#                                self-inconsistency Fireworks' Recipe
#                                records elsewhere in this collection.
#   GET /v2/bills            -> 401 {"code":"INTERNAL_ERROR","message":
#                                "Unauthorized"} -- a fourth shape again,
#                                key order reversed from every /v1 error,
#                                and a routine missing-credential 401
#                                mislabelled as an internal error. /v2 is
#                                live and answers, and it is not the same
#                                application /v1 is.
#
# Four requests, four different failure envelopes, from what is nominally
# one API. This Recipe models the one tier that matters for the routes it
# declares -- the OpenAPI-validator 400 for an unrecognised /v1 path -- and
# records the other three here rather than adding routes for a root path
# and a /v2 surface this Recipe does not otherwise touch.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 2xx response of any kind is modelled anywhere in this file. Every
#     route below answers only with a failure, because that is the entire
#     truth of what this Recipe could observe: no credential exists, none
#     was requested, and inventing a payment, bill or vendor object to fill
#     the gap would be exactly the fabrication this group's brief warns
#     against. Rapyd's Recipe elsewhere in this collection takes the
#     identical position for the identical reason, on a different payments
#     API this Recipe was equally unable to authenticate against.
#   - The payment and bill resources below carry no fields at all beyond a
#     placeholder, because no successful body was ever observed to declare
#     one from. What is real and cited is the *names* of the fields Melio's
#     own validator demands on create -- amount, vendorId, dueDate for a
#     bill; paymentBillsInfo, fundingSourceId, deliveryMethodId,
#     scheduledDate, deliveryPreference, vendorId for a payment -- and those
#     are asserted in the create-validation cases below, which is the only
#     place this Recipe has real evidence for them.
#   - Partial-body validation is not modelled: every case here sends an
#     empty object, which is the only body this Recipe ever tried. What a
#     body missing only one of several required fields answers is not
#     known and not guessed at.
#   - docs.melio.com is a Stoplight-hosted documentation portal and a
#     client-rendered single-page app once past the Cloudflare check --
#     its HTML names a project id and nothing else Cauldron could read
#     without executing its JavaScript, so no field, schema or status
#     enum below is sourced from it. Everything here comes from the wire
#     itself.
#   - /v2 exists, answers, and is not modelled -- see above. Whatever
#     surface Melio's public marketing calls "the API" may be either
#     version or neither; this Recipe describes only what /v1 answered.
#
# Every credential, id and body below is a fixture Cauldron invented for
# routing purposes, not a value read from any account -- there is no
# account. Every error body quoted above and modelled below is the live
# wire response this Recipe actually received on 2026-09-01.

recipe: melio
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.melio.com/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-melio-fixture-bearer-token-0000000000000000
  # A header with no "Bearer " prefix at all lands here too -- Melio's own
  # classification, not this runtime's default: "Authorization: junk"
  # answered the byte-identical body an absent header does, live.
  absent_error: missing_authorization_header
  malformed_error: missing_authorization_header
  rejected_error: unauthorized
  # Routing (does the path exist in the OpenAPI spec, does the method) and
  # body validation both resolve before the credential is ever examined --
  # see the header. after_routing reproduces the routing half faithfully;
  # the body-validation half needed its own routes below, because Cauldron
  # has no mechanism for "validate the body before the credential," the
  # same gap Northflank's Recipe names elsewhere in this collection.
  after_routing: true

responses:
  resource:
    style: wrapped
    key: "-"
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    # A string that happens to be all digits -- "401", not 401 -- live and
    # verified. Declared explicitly rather than left to the digits-become-a-
    # number default, which would silently drop this the way it drops
    # Adyen's leading zeros elsewhere in this collection.
    code_type: string

resources:
  # No successful call was ever answered -- see the header. These exist
  # only so a well-formed route has an operation to resolve to. "id" below
  # is Cauldron's own default field name, asserted nowhere -- no case in
  # this file shows a 200 for any of these three resources, so nothing
  # here claims that name is what Melio actually sends. The real, cited
  # field names Melio's own validator demands are asserted directly in the
  # create-validation conformance cases, not declared here, because this
  # Recipe has no worked object to hang them on.
  bill:
    id:
      style: opaque
    fields:
      amount:
        type: number
        in: "-"

  payment:
    id:
      style: opaque
    fields:
      amount:
        type: number
        in: "-"

  vendor:
    id:
      style: opaque
    fields:
      name:
        type: string
        in: "-"

routes:
  - method: GET
    path: /v1/bills
    resource: bill
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05: docs.melio.com answers **403** to anything that
    # is not a browser, on the reference path and on the llms.txt its own
    # documentation platform normally serves. Nothing about these three
    # listings could be read, so nothing is declared for them.

  - method: GET
    path: /v1/bills/{id}
    resource: bill
    operation: get

  # An ordinary route: under normal request handling this Recipe's engine
  # checks the credential once a route has matched, exactly like every
  # other route here. What live Melio actually does -- validate the body
  # before the credential, so an empty body 400s even with no credential
  # sent -- is a routing/auth ordering this format cannot express, the
  # same gap Northflank's Recipe names elsewhere in this collection. The
  # conformance case for that finding below arms bill_validation_failed
  # directly rather than claiming this route reaches it unaided.
  - method: POST
    path: /v1/bills
    resource: bill
    operation: create

  - method: GET
    path: /v1/payments
    resource: payment
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05: docs.melio.com answers **403** to anything that
    # is not a browser, on the reference path and on the llms.txt its own
    # documentation platform normally serves. Nothing about these three
    # listings could be read, so nothing is declared for them.

  - method: GET
    path: /v1/payments/{id}
    resource: payment
    operation: get

  # Confirmed live as a real, registered, credential-gated method on this
  # same path -- see the header. A third live verb this Recipe cannot say
  # is or is not the same thing as the cancel route below.
  - method: DELETE
    path: /v1/payments/{id}
    resource: payment
    operation: delete

  - method: POST
    path: /v1/payments
    resource: payment
    operation: create

  # Confirmed live as a real, registered, credential-gated route -- see the
  # header. Never seen to succeed.
  - method: POST
    path: /v1/payments/{id}/cancel
    resource: payment
    operation: update

  - method: GET
    path: /v1/vendors
    resource: vendor
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05: docs.melio.com answers **403** to anything that
    # is not a browser, on the reference path and on the llms.txt its own
    # documentation platform normally serves. Nothing about these three
    # listings could be read, so nothing is declared for them.

  - method: GET
    path: /v1/vendors/{id}
    resource: vendor
    operation: get

errors:
  # No Authorization header at all, and also a header present with no
  # "Bearer " prefix -- Melio calls both of these missing. Live, verified.
  missing_authorization_header:
    status: 401
    code: "401"
    message: "Missing Authorization Header"

  # A bearer token that is present and simply wrong. A different sentence
  # from the one above -- see the header for why that split matters.
  unauthorized:
    status: 401
    code: "401"
    message: "Unauthorized"

  # What every unrecognised path under /v1 answers, live -- see the header
  # for the three other shapes this same host answers to a bad path
  # depending on exactly which layer intercepts it, none of which is this
  # one. Live, the sentence echoes the specific path with this Recipe's own
  # /v1 prefix stripped; this runtime has no per-request substitution for
  # an arbitrary invented path, so only the fixed half of the sentence is
  # declared, and the header quotes the exact live text for the three
  # specific paths this Recipe actually struck.
  unknown_route:
    status: 400
    code: "400"
    message: "OpenApi validation error - Could not find path in openapi spec"

  # What a real path answers to a method the OpenAPI spec does not
  # register for it. Not a 405 -- see the header. Same limitation as
  # unknown_route above.
  method_not_allowed:
    status: 400
    code: "400"
    message: "OpenApi validation error - Could not find method in openapi spec"

  # POST /v1/bills with an empty body, live and verified -- three required
  # properties named by Melio's own OpenAPI validator. Reached in the
  # conformance case below by arming this fault directly rather than
  # through the route's ordinary request handling -- see the header and
  # the route above for why: this runtime checks the credential once a
  # route matches, and live Melio checks the body first, an ordering this
  # format cannot express.
  bill_validation_failed:
    status: 400
    code: "400"
    fields:
      # error.<name> is where a field ends up inside the "error" wrapper --
      # a bare name here would sit beside it instead, one level too shallow.
      error.data:
        - path: amount
          errorCode: required.openapi.requestValidation
          message: "must have required property 'amount'"
          location: body
          missingProperty: amount
        - path: vendorId
          errorCode: required.openapi.requestValidation
          message: "must have required property 'vendorId'"
          location: body
          missingProperty: vendorId
        - path: dueDate
          errorCode: required.openapi.requestValidation
          message: "must have required property 'dueDate'"
          location: body
          missingProperty: dueDate
    message: "Bad request"

  # POST /v1/payments with an empty body, live and verified -- six required
  # properties, naming both the funding side and the bills being paid. Same
  # arming caveat as bill_validation_failed above.
  payment_validation_failed:
    status: 400
    code: "400"
    fields:
      error.data:
        - path: paymentBillsInfo
          errorCode: required.openapi.requestValidation
          message: "must have required property 'paymentBillsInfo'"
          location: body
          missingProperty: paymentBillsInfo
        - path: fundingSourceId
          errorCode: required.openapi.requestValidation
          message: "must have required property 'fundingSourceId'"
          location: body
          missingProperty: fundingSourceId
        - path: deliveryMethodId
          errorCode: required.openapi.requestValidation
          message: "must have required property 'deliveryMethodId'"
          location: body
          missingProperty: deliveryMethodId
        - path: scheduledDate
          errorCode: required.openapi.requestValidation
          message: "must have required property 'scheduledDate'"
          location: body
          missingProperty: scheduledDate
        - path: deliveryPreference
          errorCode: required.openapi.requestValidation
          message: "must have required property 'deliveryPreference'"
          location: body
          missingProperty: deliveryPreference
        - path: vendorId
          errorCode: required.openapi.requestValidation
          message: "must have required property 'vendorId'"
          location: body
          missingProperty: vendorId
    message: "Bad request"

fixtures:
  empty: {}

# Every case below carries source and a verified date: api.melio.com was
# called with exactly the request shown, on 2026-09-01, with a
# desktop-browser User-Agent and no credential that worked -- because none
# exists -- and this is what came back, in full. Nothing in this Recipe's
# conformance suite is read from documentation rather than struck live: the
# whole and only truth this Recipe could establish about Melio is what an
# unauthenticated request answers, so that is the whole and only suite.
conformance:
  - name: no credential at all is told the header is missing
    source: https://api.melio.com/v1/bills
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/bills
    expect:
      status: 401
      body:
        error.message: "Missing Authorization Header"
        error.code: "401"

  - name: a header with no Bearer prefix is called missing too, not wrong
    source: https://api.melio.com/v1/bills
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/bills
      headers:
        Authorization: junk
    expect:
      status: 401
      body:
        error.message: "Missing Authorization Header"

  - name: a well-formed wrong bearer token gets a different sentence
    source: https://api.melio.com/v1/bills
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/bills
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.message: "Unauthorized"
        error.code: "401"

  - name: an unrecognised path under v1 is a 400 from the OpenAPI validator, not a 404
    # Live, verbatim: "OpenApi validation error - Could not find path
    # /nosuchroute in openapi spec" -- quoted in full in the header. This
    # case asserts the fixed half only; see unknown_route's own comment for
    # why the per-path echo is not reproduced here.
    source: https://api.melio.com/v1/nosuchroute
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/nosuchroute
    expect:
      status: 400
      body:
        error.code: "400"
      matches:
        error.message: "Could not find path in openapi spec"

  - name: a wrong method on a real path is the identical validator shape, not a 405
    # Live, verbatim: "...Could not find method DELETE for path /bills in
    # openapi spec" -- quoted in full in the header; see the note above.
    source: https://api.melio.com/v1/bills
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v1/bills
    expect:
      status: 400
      body:
        error.code: "400"
      matches:
        error.message: "Could not find method in openapi spec"

  - name: creating a bill with no body names its three required fields
    # Live and verified, but reached here by arming the fault directly
    # rather than through this route's ordinary handling -- see the header
    # and bill_validation_failed's own comment. A plain POST /v1/bills
    # through this Recipe's normal request handling reaches the credential
    # gate first, which is not what live Melio does for this exact request;
    # this case exists to carry the real, cited body rather than to claim
    # the ordering is reproduced.
    source: https://api.melio.com/v1/bills
    verified: "2026-09-01"
    arm: bill_validation_failed
    fixture: empty
    request:
      method: POST
      path: /v1/bills
      json: {}
    expect:
      status: 400
      body:
        error.code: "400"
        error.data[0].missingProperty: amount
        error.data[1].missingProperty: vendorId
        error.data[2].missingProperty: dueDate

  - name: creating a payment with no body names its six required fields
    # Same arming caveat as the bill case above.
    source: https://api.melio.com/v1/payments
    verified: "2026-09-01"
    arm: payment_validation_failed
    fixture: empty
    request:
      method: POST
      path: /v1/payments
      json: {}
    expect:
      status: 400
      body:
        error.code: "400"
        error.data[0].missingProperty: paymentBillsInfo
        error.data[1].missingProperty: fundingSourceId
        error.data[2].missingProperty: deliveryMethodId
        error.data[3].missingProperty: scheduledDate
        error.data[4].missingProperty: deliveryPreference
        error.data[5].missingProperty: vendorId

  - name: the cancel route is real -- GET is refused for its method, not for a missing path
    # Live, verbatim: "...Could not find method GET for path
    # /payments/{id}/cancel in openapi spec", the OpenAPI template rather
    # than the resolved path -- quoted in full in the header.
    source: https://api.melio.com/v1/payments/123/cancel
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/payments/123/cancel
    expect:
      status: 400
      body:
        error.code: "400"
      matches:
        error.message: "Could not find method in openapi spec"

  - name: and POST to that same route reaches the credential gate, never a body or a payment
    # The route this whole Recipe was written to find: cancelling a payment
    # is POST to a sub-resource. This is as far as this Recipe could reach
    # -- see the header. No 200 for this route exists anywhere in this
    # file, because none was ever seen.
    source: https://api.melio.com/v1/payments/123/cancel
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/payments/123/cancel
    expect:
      status: 401
      body:
        error.message: "Missing Authorization Header"

  - name: a bill has no cancel route of its own
    # Live, verbatim: "...Could not find path /bills/123/cancel in openapi
    # spec" -- the resolved path, not a template, unlike the "could not
    # find method" cases above; quoted in full in the header.
    source: https://api.melio.com/v1/bills/123/cancel
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/bills/123/cancel
    expect:
      status: 400
      body:
        error.code: "400"
      matches:
        error.message: "Could not find path in openapi spec"

  - name: DELETE on the payment itself is also a live, credential-gated route
    # Not the same as the cancel sub-resource above -- a third verb this
    # Recipe cannot say is or is not authoritative. See the header.
    source: https://api.melio.com/v1/payments/123
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /v1/payments/123
    expect:
      status: 401
      body:
        error.message: "Missing Authorization Header"
