# Packagist Recipe for Cauldron
#
# The versions array is a chain of diffs, and reading one entry gives you the
# wrong answer.
#
# GET /p2/monolog/monolog.json returns eighty-seven version entries. The first
# has twenty-one keys. The second has eight. The third has seven. They are not
# smaller releases -- each entry after the first carries **only the fields that
# differ from the entry before it**, and everything unchanged is left out.
#
# So packages["monolog/monolog"][1].license is undefined. Not because 3.9.0 has
# no licence: because it has the same licence as 3.10.0, so the field was
# dropped. Getting one version's real metadata means replaying every entry from
# index 0 forward and merging.
#
# **And the chain runs newest first.** Entry 0 is 3.10.0, entry 1 is 3.9.0,
# entry 84 is 1.0.1. The deltas apply backwards in version order, so a reader
# who assumes chronological order replays the whole thing the wrong way round
# and gets an answer for every version -- all of them wrong, none of them
# throwing.
#
# The only signal that any of this is happening is a sibling key at the top of
# the document:
#
#   "minified": "composer/2.0"
#
# Nothing inside an entry says it is a patch. A client that fetches this URL,
# indexes into the array and reads a field will be right about the newest
# release and quietly wrong about all the others.
#
# **A field that goes away is the string "__unset".** Six of monolog's entries
# carry one: 1.27.1 has extra: "__unset", 1.0.2 has require-dev: "__unset" and
# suggest: "__unset", 1.0.1 has autoload: "__unset". So a merge that copies
# values across finds seven characters where it expected an object, and the
# tombstone is indistinguishable from a real value to anything not looking for
# it.
#
# Written against the live API rather than a document: Packagist's metadata
# endpoint is public and needs no credential, and every case below was checked
# against repo.packagist.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A missing package is a bare JSON string served as HTML. The body is
#      "404 not found, no packages here" -- with the quotes, so it parses as
#      JSON and is not an object -- and the Content-Type is text/html. A client
#      calling .json() succeeds and gets a string; one branching on the content
#      type refuses to try.
#   2. Two timestamps for one release, seventeen seconds apart. time is when
#      the tag was made and published-time is when Packagist saw it, and
#      nothing names the difference.
#   3. A version has four components when normalised. version is "3.10.0" and
#      version_normalized is "3.10.0.0", so comparing the two as strings never
#      matches and sorting on the wrong one sorts lexicographically.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The fixture holds five of monolog's eighty-seven entries. They are the
#     real first two and three of the real tombstone entries, so the shape of
#     the chain is served and its length is not.
#   - Merging is not performed, because the point is that the API does not
#     perform it either. What is served is what arrives.
#   - The packages.json root, the search API, the rich package endpoint at
#     packagist.org/packages/{name}.json and publishing are absent.
#
# The fixture below is public data about a public package, recorded on the date
# in the cases.

recipe: packagist
capability: infrastructure
version: 0.1.0

upstream:
  api: p2
  docs: https://packagist.org/apidoc

auth:
  # Public.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # A bare JSON string: valid JSON, and not an object.
    style: string

resources:
  metadata:
    id:
      style: opaque
      field: "-"
    fields:
      vendor:
        type: string
        in: "-"
      packages:
        type: map
      # The only signal that the entries are patches.
      minified:
        type: string
      security-advisories:
        type: list

routes:
  - method: GET
    path: /p2/{vendor}/{id}.json
    resource: metadata
    operation: get
    scope: [vendor]

errors:
  resource_missing:
    status: 404
    headers:
      Content-Type: text/html
    message: 404 not found, no packages here

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  repository:
    metadata:
      - id: monolog
        vendor: monolog
        minified: composer/2.0
        security-advisories:
          - advisoryId: PKSA-dmw8-jd8k-q3c6
            # A range, as a string, with no spaces and no operator field.
            affectedVersions: ">=1.8.0,<1.12.0"
        packages:
          monolog/monolog:
            # Twenty-one keys: the whole record, once.
            - name: monolog/monolog
              version: 3.10.0
              version_normalized: 3.10.0.0
              description: Sends your logs to files, sockets, inboxes, databases and various web services
              type: library
              license:
                - MIT
              homepage: https://github.com/Seldaek/monolog
              keywords:
                - log
                - logging
                - psr-3
              time: "2026-01-02T08:56:05+00:00"
              published-time: "2026-01-02T08:56:22+00:00"
              dist:
                url: https://api.github.com/repos/Seldaek/monolog/zipball/b321dd6749f0bf7189444158a3ce785cc16d69b0
                type: zip
                # Empty, on every entry.
                shasum: ""
                reference: b321dd6749f0bf7189444158a3ce785cc16d69b0
              source:
                url: https://github.com/Seldaek/monolog.git
                type: git
                reference: b321dd6749f0bf7189444158a3ce785cc16d69b0
              require:
                php: ">=8.1"
                psr/log: ^2.0 || ^3.0

            # Eight keys. Everything else is unchanged from the entry above --
            # including the licence, which is why reading it here finds
            # nothing.
            - version: 3.9.0
              version_normalized: 3.9.0.0
              time: "2025-11-13T15:31:16+00:00"
              published-time: "2025-11-13T15:31:31+00:00"
              dist:
                url: https://api.github.com/repos/Seldaek/monolog/zipball/1111111111111111111111111111111111111111
                type: zip
                shasum: ""
                reference: "1111111111111111111111111111111111111111"
              source:
                url: https://github.com/Seldaek/monolog.git
                type: git
                reference: "1111111111111111111111111111111111111111"
              require-dev:
                phpunit/phpunit: ^10.5.17
              support:
                issues: https://github.com/Seldaek/monolog/issues

            # A tombstone: extra existed on the newer entries and does not
            # exist here.
            - version: 1.27.1
              version_normalized: 1.27.1.0
              time: "2022-06-09T08:53:42+00:00"
              published-time: "2022-06-09T08:53:55+00:00"
              extra: __unset

            # Two at once.
            - version: 1.0.2
              version_normalized: 1.0.2.0
              time: "2011-10-24T09:33:15+00:00"
              published-time: "2011-10-24T09:33:20+00:00"
              require-dev: __unset
              suggest: __unset

            - version: 1.0.1
              version_normalized: 1.0.1.0
              time: "2011-04-23T09:19:16+00:00"
              published-time: "2011-04-23T09:19:20+00:00"
              autoload: __unset

      # A different vendor's package, so the vendor segment is something the
      # cases can see. psr/log answers 200 and psr/monolog answers 404, both
      # checked -- a package name means nothing without the vendor beside it.
      - id: log
        vendor: psr
        minified: composer/2.0
        security-advisories: []
        packages:
          psr/log:
            - name: psr/log
              version: 3.0.2
              version_normalized: 3.0.2.0
              type: library
              license:
                - MIT
              time: "2024-09-11T13:17:53+00:00"
              published-time: "2024-09-11T13:18:02+00:00"

conformance:
  - name: the versions array is a chain of diffs
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # The first entry carries the whole record.
        "packages.monolog/monolog[0].version": 3.10.0
        "packages.monolog/monolog[0].license[0]": MIT
        "packages.monolog/monolog[0].type": library
      absent:
        # And the second carries only what changed, so the licence is not
        # there -- 3.9.0 has the same one, which is exactly why it is missing.
        - "packages.monolog/monolog[1].license"
        - "packages.monolog/monolog[1].type"
        - "packages.monolog/monolog[1].description"
        - "packages.monolog/monolog[1].name"

  - name: the chain runs newest first
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # Index 0 is the newest and the deltas apply backwards in version
        # order, so replaying the array in the direction it is written means
        # walking from the newest release to the oldest.
        "packages.monolog/monolog[0].version": 3.10.0
        "packages.monolog/monolog[1].version": 3.9.0
        "packages.monolog/monolog[4].version": 1.0.1

  - name: the only signal is a sibling key
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # Nothing inside an entry says it is a patch. This is the whole
        # declaration, at the top of the document, beside the packages.
        minified: composer/2.0

  - name: a field that goes away is the string __unset
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # Seven characters where a merge expects an object, and
        # indistinguishable from a real value to anything not looking for it.
        "packages.monolog/monolog[2].extra": __unset
        "packages.monolog/monolog[3].require-dev": __unset
        "packages.monolog/monolog[3].suggest": __unset
        "packages.monolog/monolog[4].autoload": __unset

  - name: a missing package is a bare JSON string served as HTML
    source: https://repo.packagist.org/p2/notavendor-cauldron/notapackage.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/notavendor-cauldron/notapackage.json
    expect:
      # With the quotes, so it parses as JSON and is not an object -- and the
      # content type says HTML. A client calling .json() succeeds and gets a
      # string; one branching on the content type refuses to try.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '^"404 not found, no packages here"'

  - name: two timestamps for one release, seconds apart
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # time is when the tag was made; published-time is when Packagist saw
        # it. Seventeen seconds here, and nothing names the difference.
        "packages.monolog/monolog[0].time": "2026-01-02T08:56:05+00:00"
        "packages.monolog/monolog[0].published-time": "2026-01-02T08:56:22+00:00"

  - name: a normalised version has four components
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # So comparing the two as strings never matches, and sorting on the
        # wrong one sorts lexicographically.
        "packages.monolog/monolog[0].version": 3.10.0
        "packages.monolog/monolog[0].version_normalized": 3.10.0.0
        "packages.monolog/monolog[2].version_normalized": 1.27.1.0

  - name: the archive checksum is empty on every entry
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # dist.shasum is the empty string, not absent and not null, beside a
        # reference that is the git commit. The field that would verify a
        # download is present, typed correctly, and carries nothing.
        "packages.monolog/monolog[0].dist.shasum": ""
        "packages.monolog/monolog[0].dist.reference": b321dd6749f0bf7189444158a3ce785cc16d69b0
        "packages.monolog/monolog[0].dist.type": zip

  - name: advisories sit beside the packages rather than inside them
    source: https://repo.packagist.org/p2/monolog/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/monolog/monolog.json
    expect:
      status: 200
      body:
        # A sibling of packages, with the affected range as one string. No
        # entry in the versions array says it is affected, so matching them up
        # is the caller's job and needs a version-range parser.
        "security-advisories[0].advisoryId": PKSA-dmw8-jd8k-q3c6
        "security-advisories[0].affectedVersions": ">=1.8.0,<1.12.0"

  - name: a package name means nothing without the vendor beside it
    source: https://repo.packagist.org/p2/psr/monolog.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/psr/monolog.json
    expect:
      # monolog/monolog answers 200 and psr/log answers 200; psr/monolog is a
      # 404, because the two halves of the name are not independent.
      status: 404
      body_matches: '^"404 not found, no packages here"'

  - name: and the vendor that does have it answers with it
    source: https://repo.packagist.org/p2/psr/log.json
    verified: "2026-08-26"
    fixture: repository
    request:
      method: GET
      path: /p2/psr/log.json
    expect:
      status: 200
      body:
        "packages.psr/log[0].name": psr/log
        "packages.psr/log[0].version": 3.0.2
        minified: composer/2.0
      absent:
        - "packages.monolog/monolog"
