# Voyage AI Recipe for Cauldron
#
# The embeddings endpoint, read from Voyage's own published Python client
# (voyage-ai/voyageai-python), and struck live against api.voyageai.com on
# 2026-09-13 with no credential, with a wrong one, with a malformed body, with
# an unknown argument, on a path that does not exist, and with a method the path
# does not take.
#
# **The body is checked before the credential.** Struck live, with no
# `Authorization` header on any of them:
#
#   {}                                 400  ...missing one or more required arguments
#   not json                           400  ...Error for argument '0': JSON decode error
#   {"input":["hi"],"model":"...","zzz":1}  400  ...Argument 'zzz' is not supported by our API
#   {"input":["hello"],"model":"voyage-3"}  401  {"detail":"Unauthorized"}
#
# So an anonymous caller can enumerate the request contract one argument at a
# time -- the validator names the unsupported argument and says the required
# ones are missing -- and only a well-formed request gets as far as being
# refused.
#
# **And the refusal is one word.** `{"detail":"Unauthorized"}`: no code, no
# request id in the body, nothing to branch on.
#
# **The validation message says the same thing twice, with a `.;` between.**
# Sending `{}` answers:
#
#   The request body is not valid JSON, or some arguments were not specified
#   properly. In particular, Your request body was missing one or more required
#   arguments.; Your request body was missing one or more required arguments.
#
# A fixed preamble that offers two possibilities, then "In particular," and then
# one clause per problem -- each a complete sentence starting with a capital,
# joined by a full stop and a semicolon.
#
# **A body that is not JSON at all is blamed on argument zero.** `Error for
# argument '0': JSON decode error` -- a positional argument, in an API whose
# arguments are all named. Recorded here rather than served: a conformance case
# sends JSON by construction and cannot send something that is not.
#
# **The client reads the request id from the wrong header.** `error.py` does
# `self.headers.get("request-id", None)`, and the response carries
# `x-request-id`. So `VoyageError.__str__`, which prints
# `Request {id}: {message}` when it finds one, never finds one.
#
# **And it parses an error shape the API does not send.**
# `construct_error_object` returns nothing unless the body has an `error` key
# holding a dict. Every failure above is `{"detail": "..."}`. The published
# client reads two things off a failure and gets neither.
#
# **The response wrapper refuses to hold an empty string.**
# `VoyageResponse.__setitem__` raises `ValueError` on `""` with the message "We
# interpret empty strings as None in requests" -- so any response field that
# arrives as two quotes throws inside the client, and the reason given is about
# requests.
#
# **And the client keeps two things and discards the rest.**
# `EmbeddingsObject.update` appends `d.embedding` for each item and adds
# `response.usage.total_tokens`, and nothing else survives. Its `embeddings` is
# typed `Union[List[List[float]], List[List[int]]]`, so one field holds floats
# or integers depending on what was asked for, and `update` accumulates across
# calls rather than replacing.
#
# Also pinned: the server names itself `uvicorn` in a response header on every
# request.

recipe: voyageai
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.voyageai.com/reference
  # No spec: Voyage documents this API as prose and publishes a Python client.
  # No OpenAPI description is served at any address this Recipe could find, so
  # the response shape below is what that client reads.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - pa-cauldr0nf1xturek3y00000000000000000000000000000000000000
  # One word, for a credential that is missing and one that is wrong.
  absent_error: unauthorized
  rejected_error: unauthorized
  after_routing: true

responses:
  error:
    style: flat
    message_field: detail
    code_field: "-"

resources:
  embedding:
    id:
      # Nothing in the response identifies the call.
      field: "-"
      style: hex
      length: 32
    fields:
      # The two members the vendor's own client keeps.
      data:
        type: list
      usage:
        type: map
      # The request's arguments, which the validator names when they are
      # missing and never echoes when they are not.
      input:
        type: list
        required: true
        in: "-"
      model:
        type: string
        required: true
        in: "-"

routes:
  - method: POST
    path: /v1/embeddings
    resource: embedding
    operation: create
    status: 200
    returns:
      - data
      - usage
    headers:
      # The header the client looks for under another name.
      x-request-id: 78f086c7aeb9ddb1e5268d0dd83cdbff
      # The ASGI server, named to every caller.
      server: uvicorn
    fields:
      data:
        # Floats here; integers when a different dtype is asked for, on the
        # same field.
        - embedding:
            - 0.0213
            - -0.0119
            - 0.0447
      usage:
        total_tokens: 3

errors:
  unauthorized:
    status: 401
    # One word, and nothing else in the body.
    message: Unauthorized

  parameter_missing:
    status: 400
    # A preamble offering two possibilities, then one complete sentence per
    # problem, joined with a full stop and a semicolon.
    message: "The request body is not valid JSON, or some arguments were not specified properly. In particular, Your request body was missing one or more required arguments.; Your request body was missing one or more required arguments."

  method_not_allowed:
    status: 405
    message: Method Not Allowed

  unknown_route:
    status: 404
    message: Not Found

fixtures:
  empty:
    embedding: []

  vectors:
    embedding:
      - input:
          - hello
        model: voyage-3
        data:
          - embedding:
              - 0.0213
              - -0.0119
              - 0.0447
        usage:
          total_tokens: 3

conformance:
  - name: a well-formed body with no credential is refused in one word
    source: https://api.voyageai.com/v1/embeddings
    verified: "2026-09-13"
    fixture: vectors
    request:
      method: POST
      path: /v1/embeddings
      headers:
        Content-Type: application/json
      json:
        input:
          - hello
        model: voyage-3
    expect:
      status: 401
      body:
        # No code, no request id in the body, nothing to branch on.
        detail: Unauthorized

  - name: an unrouted path is two words
    source: https://api.voyageai.com/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: vectors
    request:
      method: POST
      path: /v1/cauldron-nope
      headers: {}
      json: {}
    expect:
      status: 404
      body:
        detail: Not Found

  - name: a method the route does not take is three
    source: https://api.voyageai.com/v1/embeddings
    verified: "2026-09-13"
    fixture: vectors
    request:
      method: GET
      path: /v1/embeddings
      headers: {}
    expect:
      status: 405
      body:
        detail: Method Not Allowed

  - name: the validation message says the same thing twice
    source: https://api.voyageai.com/v1/embeddings
    fixture: vectors
    request:
      method: POST
      path: /v1/embeddings
      headers:
        Content-Type: application/json
        Authorization: "Bearer pa-cauldr0nf1xturek3y00000000000000000000000000000000000000"
      json: {}
    expect:
      status: 400
      body:
        # A preamble offering two possibilities, then one complete sentence
        # per missing argument, joined by a full stop and a semicolon.
        detail: "The request body is not valid JSON, or some arguments were not specified properly. In particular, Your request body was missing one or more required arguments.; Your request body was missing one or more required arguments."

  - name: the client looks for the request id under another name
    source: https://github.com/voyage-ai/voyageai-python
    fixture: vectors
    request:
      method: POST
      path: /v1/embeddings
      headers:
        Content-Type: application/json
        Authorization: "Bearer pa-cauldr0nf1xturek3y00000000000000000000000000000000000000"
      json:
        input:
          - hello
        model: voyage-3
    expect:
      status: 200
      headers:
        # error.py reads headers.get("request-id"), and this is the header.
        x-request-id: 78f086c7aeb9ddb1e5268d0dd83cdbff
        # The ASGI server, named to every caller.
        server: uvicorn

  - name: the client keeps the vectors and the token count and drops the rest
    source: https://github.com/voyage-ai/voyageai-python
    fixture: vectors
    request:
      method: POST
      path: /v1/embeddings
      headers:
        Content-Type: application/json
        Authorization: "Bearer pa-cauldr0nf1xturek3y00000000000000000000000000000000000000"
      json:
        input:
          - hello
        model: voyage-3
    expect:
      status: 200
      body:
        # EmbeddingsObject.update appends d.embedding for each item and adds
        # response.usage.total_tokens. Nothing else survives the client.
        'data[0].embedding[0]': 0.0213
        'data[0].embedding[1]': -0.0119
        'data[0].embedding[2]': 0.0447
        'usage.total_tokens': 3

  - name: the arguments the validator names are never echoed back
    source: https://github.com/voyage-ai/voyageai-python
    fixture: vectors
    request:
      method: POST
      path: /v1/embeddings
      headers:
        Content-Type: application/json
        Authorization: "Bearer pa-cauldr0nf1xturek3y00000000000000000000000000000000000000"
      json:
        input:
          - hello
        model: voyage-3
    expect:
      status: 200
      absent:
        # input and model are required on the way in and absent on the way
        # out, so nothing on the response says what was embedded or by what.
        - input
        - model
