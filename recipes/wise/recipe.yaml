# Cases marked verified were run unauthenticated against api.transferwise.com
# on 2026-08-31, exactly as shown. No key of any kind was requested, guessed
# or used to produce any of them -- the two 400/401 cases below that need a
# request to succeed arm a Recipe-declared fault or send this Recipe's own
# fixture bearer token, and say so. Cases with no verified field describe
# response shapes read in Wise's current or archived documentation and never
# called.
conformance:
  - name: a missing bearer token is an OAuth-shaped error, not a Recipe-shaped one
    source: https://api.transferwise.com/v1/rates
    verified: "2026-08-31"
    request:
      method: GET
      path: /v1/rates
    expect:
      status: 401
      body:
        error: missing_token
        error_description: "Missing token"
      absent:
        - message
        - status
        - code

  - name: an unknown path is a 404 the real API reaches with no token, and this Recipe cannot
    # Live, this exact body came from a request with no Authorization header
    # at all. Reaching it here needs this Recipe's own fixture bearer token,
    # because Cauldron checks the credential before it ever looks at the
    # path -- see the header for the full asymmetry.
    source: https://api.transferwise.com/v1/totally-not-a-real-path
    verified: "2026-08-31"
    request:
      method: GET
      path: /v1/totally-not-a-real-path
      headers:
        Authorization: "Bearer cauldron-wise-api-token"
    expect:
      status: 404
      body:
        status: "404"
        message: "Resource not found"
        error: "Not Found"

  - name: a temporary quote needs no profile, and here it still needs the token this Recipe declares
    source: https://api.transferwise.com/v1/quotes?source=GBP&target=EUR&sourceAmount=100&rateType=FIXED
    verified: "2026-08-31"
    request:
      method: GET
      path: /v1/quotes
      headers:
        Authorization: "Bearer cauldron-wise-api-token"
    expect:
      status: 200
      body:
        source: GBP
        target: EUR
        targetAmount: 115.68
        rate: 1.16673
        rateType: FIXED
        fee: 0.85
        feeDetails.transferwise: 0.85
        feeDetails.priceSetId: 5297
        guaranteedTargetAmount: false
        ofSourceAmount: true
      matches:
        # Wise sent this whole-currency-unit amount as "100.00", not "100" --
        # a literal this exact rather than a bare body match would blur.
        sourceAmount: '^100\.0+$'
      absent:
        # The anonymous shape carries none of these. A caller with a profile
        # gets all three; this one gets none.
        - id
        - createdByUserId
        - profile

