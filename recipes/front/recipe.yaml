# Front Recipe for Cauldron
#
# Front is a shared inbox, which makes it the worst kind of thing to test
# against for real: a test that replies to a conversation sends an email to a
# customer. There is no sandbox. Teams use a spare inbox and a spare domain,
# which drifts from the production setup in exactly the ways that matter, and
# the states worth exercising, an archived conversation, an unassigned one, a
# comment that must stay internal, are never rehearsed.
#
# Two things worth modelling exactly:
#
#   1. The envelope keys are underscore-prefixed. A collection is under
#      _results, paging under _pagination, and the error under _error. Code
#      written by analogy with any other provider reaches for data, results or
#      error and finds nothing.
#   2. Timestamps are floating point Unix seconds, not integers and not
#      strings. Code that parses them as integers loses the sub-second part
#      that Front uses to order messages inside a conversation.
#
# Probed live, unauthenticated, on 2026-09-05, against api2.frontapp.com:
#
#   1. GET /conversations with no Authorization header at all answers 401
#      {"_error":{"status":401,"title":"Unauthenticated","message":"JSON
#      Web Token error"}}. An invented Bearer token answers a different
#      sentence under the identical title, still 401: {"_error":{"status":
#      401,"title":"Unauthenticated","message":"Invalid token"}}. Neither
#      matches what this file declared before this probe -- code
#      "Unauthorized", message "The API token is invalid or missing" -- on
#      either count, though the envelope shape (_error, already modelled)
#      was right. auth.absent_error below carries the split.
#   2. GET /not-a-real-endpoint and PUT on /conversations (a method this
#      Recipe does not declare for it), both with no credential, answer the
#      identical "JSON Web Token error" point 1 already covers -- Front
#      checks the credential before it looks at the path or the method at
#      all, which is Cauldron's own default ordering and needed no change
#      here.
#
# Tokens below are fixtures, not secrets.

recipe: front
capability: support
version: 0.1.0

upstream:
  api: "1"
  docs: https://dev.frontapp.com/reference
  # Front publishes its own description in its own GitHub organisation,
  # and it declares every listing this Recipe models. It is where the
  # paging parameter names below were read from.
  spec: https://raw.githubusercontent.com/frontapp/front-api-specs/main/core-api/core-api.json
  spec_hash: 801946656ac7edbf3a27f28e1359e5cc414f2ae8df26d720a8f070f4990dc0f5
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Struck live: an absent credential and a present-but-wrong one carry
  # different sentences under the identical title. See the header.
  absent_error: no_token
  keys:
    - cauldron_front_token

responses:
  list:
    style: wrapped
    cursor_field: _pagination.next
    # A whole URL. Front's own description gives this field the
    # description "Link to next page of results" and the example
    # "https://yourCompany.api.frontapp.com/message_templates?page_token=9fa92a7f385fd7be43f7153055b30e6d"
    # -- host, path and the page_token beside it. This Recipe served the
    # bare token, under a field a client is meant to request as it stands.
    cursor_url: absolute
    fields:
      _links:
        self: https://api2.frontapp.com
  error:
    # Everything under _error, which the dotted names below put there.
    style: flat
    code_field: _error.title
    message_field: _error.message
    status_field: _error.status

resources:
  conversation:
    collection: _results
    id:
      prefix: cnv_
      length: 8
    fields:
      subject:
        type: string
      # Front's real states. An archived conversation is not deleted and is
      # still returned by an unfiltered listing, so an inbox count that does
      # not filter is wrong from the first archive.
      status:
        type: string
        default: unassigned
      # Front sends both as objects, not as flat scalars. The assignee is a
      # teammate with an id, an email and a name; the recipient is a handle
      # with a role beside it. Code comparing conversation.assignee to a
      # teammate id never matches against Front, and -- worse -- an
      # unassigned conversation has no assignee at all, so the object being
      # absent is how you tell, not a null id.
      assignee_id:
        type: string
        in: assignee
        as: id
      recipient_handle:
        type: string
        in: recipient
        as: handle
      is_private:
        type: boolean
        default: false
      # Floating point Unix seconds. The fractional part orders messages
      # inside a conversation, and parsing as an integer discards it.
      created_at:
        type: number
      waiting_since:
        type: number

  message:
    collection: _results
    id:
      prefix: msg_
      length: 8
    fields:
      # In the path on every route that reaches this, and Front does not
      # repeat it on the object. It stays a field because the scope filters
      # on it, and comes off the wire.
      conversation_id:
        type: string
        in: "-"
      type:
        type: string
        default: email
      # An inbound message came from the customer; an outbound one came from
      # an agent. A handler that replies to its own output loops.
      is_inbound:
        type: boolean
        default: true
      # Not is_draft, which Front has never sent. A draft is a message whose
      # draft_mode is set, and the value matters as much as the fact: a
      # private draft is visible to its author alone, so a teammate reading
      # the conversation does not see it and does not know it is there.
      # Nothing here is a draft, so the field is absent, which is the signal.
      draft_mode:
        type: string
      subject:
        type: string
      blurb:
        type: string
      # An object, like the assignee. Front's author is a teammate with an id,
      # an email and a name, and an inbound message has none at all -- the
      # customer is in recipients, not here.
      author_id:
        type: string
        in: author
        as: id
      created_at:
        type: number

  comment:
    collection: _results
    id:
      prefix: com_
      length: 8
    fields:
      # In the path on every route that reaches this, and Front does not
      # repeat it on the object. It stays a field because the scope filters
      # on it, and comes off the wire.
      conversation_id:
        type: string
        in: "-"
      # An object, like the assignee. Front's author is a teammate with an id,
      # an email and a name, and an inbound message has none at all -- the
      # customer is in recipients, not here.
      author_id:
        type: string
        in: author
        as: id
      body:
        type: string
        required: true
      # A comment is internal by construction. Posting one where a reply was
      # meant is invisible to the customer; the reverse is not.
      is_pinned:
        type: boolean
        default: false
      posted_at:
        type: number

routes:
  - method: GET
    path: /conversations
    resource: conversation
    operation: list
    pagination:
      # Front's own description names both: limit for the page size,
      # page_token for the position. This block declared the style and
      # neither name, so the runtime read "cursor" -- a parameter Front does
      # not have. Front ignores an unknown parameter rather than refusing
      # it, so a paging loop written against this fake asked for page two by
      # a name nothing reads and got page one back, forever.
      style: cursor
      limit: 50
      limit_param: limit
      cursor_param: page_token

  - method: GET
    path: /conversations/{id}
    resource: conversation
    operation: get

  # 204, with no body. Front acknowledges the change and sends nothing back,
  # so code that reads the updated conversation out of the response gets
  # undefined for every field and has to fetch it again to see the result.
  - method: PATCH
    path: /conversations/{id}
    resource: conversation
    operation: update
    status: 204
    empty_body: true

  - method: GET
    path: /conversations/{conversation_id}/messages
    resource: message
    operation: list
    scope: [conversation_id]
    pagination:
      # Front's own description names both: limit for the page size,
      # page_token for the position. This block declared the style and
      # neither name, so the runtime read "cursor" -- a parameter Front does
      # not have. Front ignores an unknown parameter rather than refusing
      # it, so a paging loop written against this fake asked for page two by
      # a name nothing reads and got page one back, forever.
      style: cursor
      limit: 50
      limit_param: limit
      cursor_param: page_token

  - method: GET
    path: /messages/{id}
    resource: message
    operation: get

  - method: GET
    path: /conversations/{conversation_id}/comments
    resource: comment
    operation: list
    scope: [conversation_id]
    pagination:
      # Front's own description names both: limit for the page size,
      # page_token for the position. This block declared the style and
      # neither name, so the runtime read "cursor" -- a parameter Front does
      # not have. Front ignores an unknown parameter rather than refusing
      # it, so a paging loop written against this fake asked for page two by
      # a name nothing reads and got page one back, forever.
      style: cursor
      limit: 50
      limit_param: limit
      cursor_param: page_token

  - method: POST
    path: /conversations/{conversation_id}/comments
    resource: comment
    operation: create
    scope: [conversation_id]
    status: 201

webhooks:
  events:
    - inbound
    - outbound
    - out_reply
    - archive
    - reopen
    - assign
    - unassign
    - comment
    - tag
  signing:
    scheme: hmac-sha256
    header: X-Front-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: Too Many Requests
    message: Rate limit exceeded
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  # Struck live with an invented Bearer token, present and wrong.
  authentication_error:
    status: 401
    code: Unauthenticated
    message: Invalid token

  # Struck live with no credential at all: the identical title, a different
  # sentence. Also what an unrouted path and a wrong method get -- Front
  # checks the credential before it looks at either.
  no_token:
    status: 401
    code: Unauthenticated
    message: "JSON Web Token error"

  resource_missing:
    status: 404
    code: Not found
    message: "Unknown resource ID: {detail}"

  parameter_missing:
    status: 400
    code: Bad request
    message: "Invalid request body: {detail} is required"

  # Front refuses to send from a channel the token cannot use, and the failure
  # arrives after the conversation already exists, which is the awkward half
  # state a live inbox makes hard to reach on purpose.
  channel_not_permitted:
    status: 403
    code: Forbidden
    message: The token does not have permission to send from this channel

  # A conversation that somebody else has open is locked briefly, which is a
  # race a single-developer test never produces.
  conflict:
    status: 409
    code: Conflict
    message: The conversation was modified by another user

fixtures:
  empty: {}

  small-inbox:
    conversation:
      - id: cnv_00001
        subject: Refund for order 4412
        status: unassigned
        recipient_handle: ada@example.com
        created_at: 1767225600.482
      - id: cnv_00002
        subject: Where is my delivery
        status: assigned
        assignee_id: tea_00001
        recipient_handle: grace@example.com
        created_at: 1767225601.115
      - id: cnv_00003
        subject: Resolved last week
        # Archived, not deleted, and still returned by an unfiltered listing.
        status: archived
        recipient_handle: alan@example.com
        created_at: 1767225602.900
    message:
      - id: msg_00001
        conversation_id: cnv_00001
        is_inbound: true
        subject: Refund for order 4412
        blurb: The jacket arrived damaged.
        created_at: 1767225600.482
      - id: msg_00002
        conversation_id: cnv_00001
        # Outbound. A handler that replies to its own output loops forever.
        is_inbound: false
        blurb: Sorry about that, sending a replacement.
        created_at: 1767225660.221
    comment:
      - id: com_00001
        conversation_id: cnv_00001
        body: Customer has had two damaged orders this month.
        posted_at: 1767225700.010

# Conformance cases. The resource shapes are read from Front's API reference
# rather than observed against a live inbox -- replying sends a real email,
# so no inbox for one was ever created. The refusal cases at the end are
# struck live, unauthenticated, and carry a verified date; see the header.
conformance:
  - name: a collection is under _results, not data
    source: https://dev.frontapp.com/reference/conversations
    fixture: small-inbox
    request:
      method: GET
      path: /conversations
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        _results[0].subject: Refund for order 4412
        _results[0].status: unassigned
      # Code written by analogy with any other provider reaches for one of
      # these and finds nothing.
      absent:
        - data
        - results
        - items

  - name: the error is under _error with a status and a title
    source: https://dev.frontapp.com/reference/errors
    fixture: small-inbox
    request:
      method: GET
      path: /conversations/cnv_99999
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 404
      body:
        _error:
          status: 404
          title: Not found
      matches:
        _error.message: 'Unknown resource ID'
      absent:
        - error
        - message
        - errors

  - name: timestamps are floating point seconds
    source: https://dev.frontapp.com/reference/conversations
    fixture: small-inbox
    request:
      method: GET
      path: /conversations/cnv_00001
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        # The fractional part orders messages inside a conversation. Parsing
        # this as an integer discards it and the order goes with it.
        created_at: 1767225600.482
        subject: Refund for order 4412

  - name: an archived conversation is still in the list
    source: https://dev.frontapp.com/reference/conversations
    fixture: small-inbox
    request:
      method: GET
      path: /conversations
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        # An inbox count that does not filter on status is wrong from the
        # first archive.
        _results[2].status: archived
        _results[2].subject: Resolved last week

  - name: inbound and outbound messages are distinguishable
    source: https://dev.frontapp.com/reference/messages
    fixture: small-inbox
    request:
      method: GET
      path: /conversations/cnv_00001/messages
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        # A handler that cannot tell its own output from the customer's
        # replies to itself forever.
        _results[0].is_inbound: true
        _results[1].is_inbound: false
      absent:
        - _results[2]

  - name: paging is under _pagination, not at the top level
    source: https://dev.frontapp.com/reference/pagination
    fixture: small-inbox
    request:
      method: GET
      path: /conversations
      query:
        limit: "2"
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      matches:
        # A whole URL carrying page_token, not a bare cursor id. This asserted
        # the id, which is what the Recipe served and not what Front sends:
        # its own description gives the field the example
        # "https://yourCompany.api.frontapp.com/message_templates?page_token=..."
        # and names the parameter page_token, where this Recipe was reading
        # "cursor" -- a name Front does not have and does not refuse, so a
        # paging loop asked for page two and got page one back every time.
        _pagination.next: '^https?://[^/]+/conversations\?.*page_token='
      absent:
        - next
        - next_cursor
        - _results[2]

  - name: the assignee and the recipient are objects, not identifiers
    # Front sends a teammate and a handle, each as an object. Comparing
    # conversation.assignee to a teammate id never matches -- and an
    # unassigned conversation has no assignee at all, so the object's absence
    # is how you tell, rather than a null id.
    source: https://dev.frontapp.com/reference/conversation
    fixture: small-inbox
    request:
      method: GET
      path: /conversations/cnv_00002
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        assignee.id: tea_00001
        recipient.handle: grace@example.com
      absent:
        - assignee_id
        - recipient_handle

  - name: a message does not say which conversation it is on
    # The conversation is in the path and Front does not repeat it on the
    # message, so code that reads a listing and groups by
    # message.conversation_id groups everything under undefined.
    source: https://dev.frontapp.com/reference/message
    fixture: small-inbox
    request:
      method: GET
      path: /conversations/cnv_00001/messages
      headers:
        Authorization: Bearer cauldron_front_token
    expect:
      status: 200
      body:
        _results[0].id: msg_00001
      absent:
        - _results[0].conversation_id
        # Nothing here is a draft, and that is what an absent draft_mode
        # means. There is no is_draft to read.
        - _results[0].draft_mode
        - _results[0].is_draft

  - name: updating a conversation answers 204 and no body at all
    # Front acknowledges the change and sends nothing back, so code that
    # reads the updated conversation out of the response gets undefined for
    # every field and has to fetch it again to see the result.
    source: https://dev.frontapp.com/reference/update-conversation
    fixture: small-inbox
    request:
      method: PATCH
      path: /conversations/cnv_00002
      headers:
        Authorization: Bearer cauldron_front_token
      json:
        status: archived
    expect:
      status: 204
      absent:
        - id
        - status

  - name: a comment does not say which conversation it is on
    # The conversation is in the path and does not come back: Front's comment
    # carries an author, a body, attachments, is_pinned, posted_at and an id,
    # and nothing naming the conversation. Code that posts a comment and
    # stores response.conversation_id to thread it later stores undefined.
    #
    # This case used to assert conversation_id: cnv_00002 here, and passed,
    # because the Recipe put it on the wire.
    source: https://dev.frontapp.com/reference/comments
    fixture: small-inbox
    request:
      method: POST
      path: /conversations/cnv_00002/comments
      headers:
        Authorization: Bearer cauldron_front_token
      json:
        body: Checked with the courier, out for delivery today.
    expect:
      status: 201
      body:
        body: Checked with the courier, out for delivery today.
        is_pinned: false
      matches:
        id: '^com_[A-Za-z0-9]{8}$'
      absent:
        - conversation_id

  - name: no credential at all is a JWT error, not an invalid-token one
    source: https://api2.frontapp.com/conversations
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /conversations
    expect:
      status: 401
      body:
        _error.status: 401
        _error.title: Unauthenticated
        _error.message: "JSON Web Token error"

  - name: an invented token gets a different sentence under the same title
    source: https://api2.frontapp.com/conversations
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /conversations
      headers:
        Authorization: Bearer totally-invented-wrong-token
    expect:
      status: 401
      body:
        _error.title: Unauthenticated
        _error.message: "Invalid token"

  - name: an unrouted path gets the identical refusal, not a 404
    # Struck live with no credential at all. Front checks the credential
    # before it looks at the path at all.
    source: https://api2.frontapp.com/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /not-a-real-endpoint
    expect:
      status: 401
      body:
        _error.message: "JSON Web Token error"

  - name: a wrong method gets the identical refusal, not a 405
    # PUT on /conversations, a method this Recipe does not declare for it.
    # Struck live with no credential at all.
    source: https://api2.frontapp.com/conversations
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PUT
      path: /conversations
    expect:
      status: 401
      body:
        _error.message: "JSON Web Token error"


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and page_token=cnv_00001, which is the identifier of the
  # last record on the previous page, and asserts the second record came
  # back on its own: one to skip, one to return, and a third behind it
  # to prove the size stopped the page.
  - name: "limit and page_token are the two names this listing reads"
    source: "https://dev.frontapp.com/reference/conversations"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations"
      query:
        "limit": "1"
        "page_token": "cnv_00001"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].id": "cnv_00002"
      absent:
        - "_results[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the comment listing answers with what the fixture holds"
    source: "https://dev.frontapp.com/reference/conversations"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations/cnv_00001/comments"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].id": "com_00001"
      absent:
        - "_results[1]"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://dev.frontapp.com/reference/messages"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations/cnv_00001/messages"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].id": "msg_00001"
      absent:
        - "_results[1]"

  # And the position. Asking for one page-worth from
  # page_token=msg_00001 answers the *second* record, which can only
  # happen if the name was read. Between them these two cases pin both
  # halves; either name renamed to what the runtime falls back on fails
  # one of them.
  - name: "page_token moves the page on, and the second record is what comes back"
    source: "https://dev.frontapp.com/reference/messages"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations/cnv_00001/messages"
      query:
        "limit": "1"
        "page_token": "msg_00001"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].id": "msg_00002"
      absent:
        - "_results[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but page_token can be shown, and it is the
  # half nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "page_token moves past the only record, and the page comes back empty"
    source: "https://dev.frontapp.com/reference/conversations"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations/cnv_00001/comments"
      query:
        "limit": "1"
        "page_token": "com_00001"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      absent:
        - "_results[0]"

  # The names. This Recipe declares 1 field(s) on a comment that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a comment carries the field names this Recipe declares"
    source: "https://dev.frontapp.com/reference/conversations"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations/cnv_00001/comments"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].posted_at": 1767225700.01

  # The names. This Recipe declares 2 field(s) on a conversation that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a conversation carries the field names this Recipe declares"
    source: "https://dev.frontapp.com/reference/conversations"
    fixture: small-inbox
    request:
      method: GET
      path: "/conversations"
      headers:
        "Authorization": "Bearer cauldron_front_token"
    expect:
      status: 200
      body:
        "_results[0].is_private": false

  # The names. This Recipe declares 3 field(s) on a message that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a message carries the field names this Recipe declares"
    source: "https://dev.frontapp.com/reference/messages"
    fixture: small-inbox
