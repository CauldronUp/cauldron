# Spaceflight News Recipe for Cauldron
#
# One record links the same site twice, once securely and once not.
#
#   "url":       "https://spaceflightnow.com/2026/08/29/roman-space-telescope-..."
#   "image_url": "http://spaceflightnow.com/wp-content/uploads/2022/07/...jpg"
#
# The article is https and its picture is http, on the same host, in the same
# object. A page served over TLS that renders image_url gets a mixed-content
# block and shows nothing, while the link beside it works -- so the bug appears
# only in the half of the record nobody reads first.
#
# **And the API's own 404 page carries a third-party analytics beacon.** A path
# that does not exist answers HTML with a script tag pointing at
# static.cloudflareinsights.com/beacon.min.js. An API error page, loading a
# tracker.
#
# Written against the live API rather than a document: every case below was
# checked against api.spaceflightnewsapi.net on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Two timestamps, two precisions. published_at is "2026-08-29T22:17:36Z"
#      to the second and updated_at is "2026-08-30T11:10:33.799046Z" to the
#      microsecond, in one record, so anything comparing them string-wise
#      compares different shapes.
#   2. A limit that is not a number is silently replaced. ?limit=notanumber
#      answers 200 with ten records and a next link reading limit=10 -- the
#      default, substituted without comment, so a client with a broken
#      parameter never learns.
#   3. Absence is spelled two ways in one record. An author's socials is null
#      and the article's events is [], four fields apart.
#
# And the two failures do not agree on a format: an article that does not exist
# answers JSON, {"detail": "No Article matches the given query."}, with the word
# Article capitalised in the middle of a sentence, and a path that does not
# exist answers HTML.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One article is served, of 35,875, and the news moves.
#   - The 404 page's beacon is served as part of the recorded body. The script
#     is inert here: nothing fetches it, and the point is that the bytes are in
#     the response at all.

recipe: spaceflightnews
capability: docs
version: 0.1.0

upstream:
  api: spaceflightnews
  docs: https://api.spaceflightnewsapi.net/v4/documentation

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: results
    count_field: count
  resource:
    style: bare
  error:
    style: flat
    message_field: detail

resources:
  article:
    id:
      style: numeric
      field: id
      type: number
    fields:
      title:
        type: string
      # https...
      url:
        type: string
      # ...and http, on the same host.
      image_url:
        type: string
      news_site:
        type: string
      summary:
        type: string
      # To the second.
      published_at:
        type: string
      # To the microsecond.
      updated_at:
        type: string
      featured:
        type: boolean
      authors:
        type: list
      launches:
        type: list
      # Empty, where an author's socials is null.
      events:
        type: list

routes:
  - method: GET
    path: /v4/articles/
    resource: article
    operation: list

  - method: GET
    path: /v4/articles/{id}
    resource: article
    operation: get
    not_found: article_not_found

  # A path that does not exist, answered in HTML with a tracker in it.
  - method: GET
    path: /v4/nosuchthing
    error: page_not_found
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  article_not_found:
    status: 404
    # The framework's sentence, with the model name capitalised mid-sentence.
    message: No Article matches the given query.

  page_not_found:
    status: 404
    style: text
    # An API error page, loading a third-party tracker.
    message: "\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <title>Not Found</title>\n</head>\n<body>\n  <h1>Not Found</h1><p>The requested resource was not found on this server.</p>\n<script type=\"module\" src=\"https://static.cloudflareinsights.com/beacon.min.js\"></script>\n</body>\n</html>\n"

fixtures:
  empty: {}

  news:
    article:
      - id: "39729"
        title: "Roman Space Telescope, NASA’s next ‘great observatory,’ poised for Sunday launch"
        # Secure...
        url: https://spaceflightnow.com/2026/08/29/roman-space-telescope-nasas-next-great-observatory-poised-for-sunday-launch/
        # ...and not, on the same host.
        image_url: http://spaceflightnow.com/wp-content/uploads/2022/07/20220719roman.jpg
        news_site: Spaceflight Now
        summary: "Using a donated Hubble-class mirror originally built for a spy satellite, NASA's Roman Space Telescope is poised for launch Sunday on a $4.3 billion mission to open a new window on the universe. Liftoff from the Kennedy Space Center atop a SpaceX Falcon Heavy is scheduled for 7:26 a.m. EDT (1126 UTC)."
        # To the second...
        published_at: "2026-08-29T22:17:36Z"
        # ...and to the microsecond.
        updated_at: "2026-08-30T11:10:33.799046Z"
        featured: false
        authors:
          - name: William Harwood
            # Null, where events below is empty.
            socials: null
        launches:
          - launch_id: 521f3a1c-f977-4306-9b7f-495858719adf
            # A provider whose name carries a version number.
            provider: Launch Library 2
        # Empty, where socials is null.
        events: []

conformance:
  - name: one record links the same site twice, once securely and once not
    source: https://api.spaceflightnewsapi.net/v4/articles/?limit=1
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/
    expect:
      status: 200
      body:
        # The article, over TLS...
        "results[0].url": https://spaceflightnow.com/2026/08/29/roman-space-telescope-nasas-next-great-observatory-poised-for-sunday-launch/
        # ...and its picture, not, on the same host. A page over TLS that
        # renders this shows nothing.
        "results[0].image_url": http://spaceflightnow.com/wp-content/uploads/2022/07/20220719roman.jpg
        "results[0].news_site": Spaceflight Now
        # A telescope built from a spy satellite's spare mirror, in a summary
        # that carries a dollar figure and two clock formats.
        "results[0].summary": "Using a donated Hubble-class mirror originally built for a spy satellite, NASA's Roman Space Telescope is poised for launch Sunday on a $4.3 billion mission to open a new window on the universe. Liftoff from the Kennedy Space Center atop a SpaceX Falcon Heavy is scheduled for 7:26 a.m. EDT (1126 UTC)."

  - name: two timestamps, two precisions
    source: https://api.spaceflightnewsapi.net/v4/articles/?limit=1
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/
    expect:
      status: 200
      body:
        # To the second...
        "results[0].published_at": "2026-08-29T22:17:36Z"
        # ...and to the microsecond, in one record.
        "results[0].updated_at": "2026-08-30T11:10:33.799046Z"

  - name: absence is spelled two ways in one record
    source: https://api.spaceflightnewsapi.net/v4/articles/?limit=1
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/
    expect:
      status: 200
      body:
        # Null on the author...
        "results[0].authors[0].socials": null
        "results[0].authors[0].name": William Harwood
      body_matches: '"events": \[\]'

  - name: the rest of the record
    source: https://api.spaceflightnewsapi.net/v4/articles/?limit=1
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/
    expect:
      status: 200
      body:
        "results[0].id": 39729
        "results[0].featured": false
        # A launch identified by UUID, from a provider whose name carries a
        # version number.
        "results[0].launches[0].launch_id": 521f3a1c-f977-4306-9b7f-495858719adf
        "results[0].launches[0].provider": Launch Library 2
        count: 1

  - name: the title carries typographic quotation marks
    source: https://api.spaceflightnewsapi.net/v4/articles/?limit=1
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/
    expect:
      status: 200
      body:
        # U+2019 and U+2018, not ASCII apostrophes, in a headline.
        "results[0].title": "Roman Space Telescope, NASA’s next ‘great observatory,’ poised for Sunday launch"

  - name: an article that does not exist names the model mid-sentence
    source: https://api.spaceflightnewsapi.net/v4/articles/999999999
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/articles/999999999
    expect:
      status: 404
      body:
        # The framework's own sentence, with Article capitalised in the middle
        # of it.
        detail: No Article matches the given query.

  - name: and a path that does not exist loads a tracker
    source: https://api.spaceflightnewsapi.net/v4/nosuchthing
    verified: "2026-08-30"
    fixture: news
    request:
      method: GET
      path: /v4/nosuchthing
    expect:
      # HTML rather than JSON, and a third-party analytics beacon inside an API
      # error page.
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '<script type="module" src="https://static\.cloudflareinsights\.com/beacon\.min\.js"></script>'
