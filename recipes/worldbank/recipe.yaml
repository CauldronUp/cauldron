# World Bank Recipe for Cauldron
#
# The success is a two-element array and the failure is a one-element array.
#
#   /v2/country/CA?format=json
#   ->  200 [{"page": 1, "pages": 1, "per_page": "50", "total": 1}, [ {...} ]]
#
#   /v2/country/ZZZ?format=json
#   ->  200 [{"message": [{"id": "120", "key": "Invalid value", ...}]}]
#
# body[1] is the collection on success and undefined on failure, and both come
# back 200. Nothing about the status, the content type or the outer shape says
# which one arrived except how many elements the array has -- so
# `body[1].map(...)` throws on the failure, and the exception is a TypeError
# about undefined rather than anything naming the country code that was wrong.
#
# **And per_page is a string where its three neighbours are numbers.** The
# paging object is {"page": 1, "pages": 1, "per_page": "50", "total": 1}: four
# fields describing one page, three of them integers and one quoted, with
# nothing to distinguish them but reading each value.
#
# Written against the live API rather than a document: every case below was
# checked against api.worldbank.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. iso2Code and iso2code are both on the record. The country's is capital-C
#      and the ones inside region, adminregion, incomeLevel and lendingType are
#      lowercase, so the same field name is spelled two ways one level apart.
#   2. Three of those codes are not ISO codes. North America is "XU", High
#      income is "XD" and Not classified is "XX" -- placeholders from the
#      user-assigned range, in a field named after the standard, for things that
#      are not countries.
#   3. A missing value is an object of empty strings. Canada has no
#      adminregion, so the field is {"id": "", "iso2code": "", "value": ""}:
#      fully formed, three keys, nothing in any of them, where null would do.
#   4. latitude and longitude are strings. "45.4215" and "-75.6919", quoted, on
#      a record whose page numbers are not.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One country is served, not 296. page, pages and per_page are fixed at
#     1, 1 and "50" because the fixture is one page; total tracks what the
#     fixture holds.
#   - The refusal is routed on the literal code ZZZ, which is the one that was
#     checked. A listing whose scope matches nothing answers an empty
#     collection, and this API answers a one-element array with a message in it,
#     so the two shapes cannot come from one route.
#   - Only the country lookup is modelled. The indicator, source, topic and
#     lending-type endpoints answer their own documents, and the indicator data
#     endpoint is where most of this API's traffic goes.
#   - Omitting format=json answers XML rather than an error, which is recorded
#     below and not served: it is a different document in a different language,
#     and the route would have to answer two content types from one path.

recipe: worldbank
capability: infrastructure
version: 0.1.0

upstream:
  api: worldbank
  docs: https://datahelpdesk.worldbank.org/knowledgebase/articles/889392

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    # Two elements: the paging object, then the records.
    style: tuple
    count_field: total
    fields:
      # Fixed, because the fixture is one page. The interesting one is
      # per_page, which is quoted while its three neighbours are not.
      page: 1
      pages: 1
      per_page: "50"
  error:
    # A one-element array, where the success has two. The array is the whole
    # body, so there is no envelope for a response-level field, and the object
    # inside it is built entirely from the failure's own fields -- because what
    # sits there is not a sentence and a code but a list of objects.
    style: list
    key: "-"
    message_field: "-"
    code_field: "-"

resources:
  country:
    id:
      style: opaque
      # The three-letter code, where iso2Code beside it is the two-letter one.
      field: id
    fields:
      # Capital C here, lowercase inside every nested object below.
      iso2Code:
        type: string
      name:
        type: string
      region:
        type: map
      # An object of empty strings, where null would do.
      adminregion:
        type: map
      incomeLevel:
        type: map
      lendingType:
        type: map
      capitalCity:
        type: string
      # Quoted, on a record whose page numbers are not.
      longitude:
        type: string
      latitude:
        type: string

routes:
  # The refusal is its own route, on the literal code that was checked. A
  # listing with a scope that matches nothing answers an empty collection, and
  # this API answers a differently-shaped document instead -- which is the
  # finding, and not something a listing route can express.
  - method: GET
    path: /v2/country/ZZZ
    matches_query:
      format: json
    error: invalid_value

  - method: GET
    path: /v2/country/{id}
    resource: country
    operation: list
    pagination:
      # per_page and page, struck live on 2026-09-05 and echoed straight
      # back in the metadata object this API puts in front of its data:
      # ?per_page=2&page=2 answers {"page": 2, "pages": 148, "per_page":
      # "2", "total": 295}.
      #
      # per_page comes back as the string "2" rather than the number 2,
      # beside a page that is a number -- the same field pair, two types, in
      # one object. Fifty by default. The runtime was reading "limit" and
      # "cursor".
      style: page
      limit: 50
      limit_param: per_page
      cursor_param: page
      first_page: 1
    matches_query:
      format: json

errors:
  invalid_value:
    status: 200
    fields:
      # A list of objects under a key called message, inside the single element
      # of the outer array. Three levels to say one thing went wrong.
      message:
        - id: "120"
          key: Invalid value
          value: The provided parameter value is not valid

fixtures:
  empty: {}

  countries:
    country:
      - id: CAN
        # Capital C.
        iso2Code: CA
        name: Canada
        region:
          id: NAC
          # Lowercase c, one level down, and a code that is not an ISO
          # country: XU is from the user-assigned range.
          iso2code: XU
          value: North America
        # Fully formed, three keys, nothing in any of them.
        adminregion:
          id: ""
          iso2code: ""
          value: ""
        incomeLevel:
          id: HIC
          # XD, for an income bracket.
          iso2code: XD
          value: High income
        lendingType:
          id: LNX
          # And XX, for the absence of a classification.
          iso2code: XX
          value: Not classified
        capitalCity: Ottawa
        # Quoted.
        longitude: "-75.6919"
        latitude: "45.4215"

conformance:
  - name: the success is a two-element array
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # The paging object first...
        "[0].total": 1
        # ...and the records second, so body[1] is the collection.
        "[1][0].id": CAN
        "[1][0].name": Canada

  - name: and the failure is a one-element array, with the same status
    source: https://api.worldbank.org/v2/country/ZZZ?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/ZZZ?format=json
    expect:
      # Not 404. body[1] is undefined here and the collection above, so
      # body[1].map(...) throws with a TypeError that names nothing useful.
      status: 200
      body:
        "[0].message[0].id": "120"
        "[0].message[0].key": Invalid value
        "[0].message[0].value": The provided parameter value is not valid
      absent:
        # One element, where the success has two.
        - "[1]"

  - name: per_page is a string where its three neighbours are numbers
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # Four fields describing one page, and only one of them quoted.
        "[0].page": 1
        "[0].pages": 1
        "[0].per_page": "50"
        "[0].total": 1

  - name: iso2Code and iso2code are both on the record
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # Capital C at the top...
        "[1][0].iso2Code": CA
        # ...and lowercase one level down, in every nested object.
        "[1][0].region.iso2code": XU
        "[1][0].incomeLevel.iso2code": XD
        "[1][0].lendingType.iso2code": XX

  - name: three of those codes are not ISO codes
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # A continent, an income bracket and the absence of a classification,
        # all wearing codes from the range ISO 3166 reserves for private use.
        "[1][0].region.value": North America
        "[1][0].region.iso2code": XU
        "[1][0].incomeLevel.value": High income
        "[1][0].incomeLevel.iso2code": XD
        "[1][0].lendingType.value": Not classified
        "[1][0].lendingType.iso2code": XX

  - name: a missing value is an object of empty strings
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # Fully formed, three keys, nothing in any of them, where null would
        # do -- so `if (country.adminregion)` is true and reading .value off it
        # gives the empty string.
        "[1][0].adminregion.id": ""
        "[1][0].adminregion.iso2code": ""
        "[1][0].adminregion.value": ""

  - name: the coordinates are strings
    source: https://api.worldbank.org/v2/country/CA?format=json
    verified: "2026-08-30"
    fixture: countries
    request:
      method: GET
      path: /v2/country/CAN?format=json
    expect:
      status: 200
      body:
        # Quoted, on a record whose page numbers are not.
        "[1][0].latitude": "45.4215"
        "[1][0].longitude": "-75.6919"
        "[1][0].capitalCity": Ottawa
        "[1][0].region.id": NAC
        "[1][0].incomeLevel.id": HIC
        "[1][0].lendingType.id": LNX
