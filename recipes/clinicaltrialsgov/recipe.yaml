# ClinicalTrials.gov Recipe for Cauldron
#
# Every failure is plain text, and one of them is nothing at all.
#
#   /studies/NCT00000000          ->  400  text/plain
#                                     Parameter `nctId` has incorrect format
#   /studies?pageSize=notanumber  ->  400  text/plain
#                                     Value provided in parameter `pageSize`
#                                     cannot be converted to 32-bit integer
#   /nosuchthing                  ->  404  no content type, zero bytes
#
# A client calling .json() on the first two throws on the letter P. On the third
# there is nothing to throw on: no body, no Content-Type header, an empty 404.
# And the messages are formatted for a renderer that is not there -- the
# parameter names are wrapped in Markdown backticks, in a response declared as
# plain text.
#
# **And a date says whether it actually happened.** Every date is an object with
# a type beside it:
#
#   "startDateStruct":            {"date": "2019-01-24", "type": "ACTUAL"}
#   "primaryCompletionDateStruct": {"date": "2024-12-31", "type": "ESTIMATED"}
#
# So a study's start is a fact and its completion is a guess, and the only thing
# distinguishing them is a word one level down -- in fields whose names end in
# "Struct", which is a word about the code rather than the trial.
#
# Written against the live API rather than a document: every case below was
# checked against clinicaltrials.gov on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The record says it does not know, and says what it last knew, in adjacent
#      fields. "overallStatus": "UNKNOWN" sits beside "lastKnownStatus":
#      "RECRUITING", so the study is simultaneously of unknown status and known
#      to have been recruiting.
#   2. A date can be a month. "statusVerifiedDate": "2024-01" has a year and a
#      month and no day, in the same object as dates that have all three.
#   3. "phases" is a list of one string, and the string is "NA". Not an empty
#      list, not null: the two letters, inside an array, meaning the question
#      does not apply.
#
# And the sponsor's own identifier carries a space and a slash: "30-225 ex
# 17/18", under orgStudyIdInfo.id, which is an id inside an Info inside a
# Module.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One study is served, and three of its thirteen protocol modules. The
#     others -- sponsorCollaborators, oversight, description, conditions,
#     armsInterventions, outcomes, eligibility, contactsLocations, references
#     and ipdSharingStatement -- are left out, along with derivedSection.
#   - The empty 404 is served with Cauldron's own content type. The body is
#     empty, as it is upstream; the absence of the header is recorded here
#     rather than served.

recipe: clinicaltrialsgov
capability: docs
version: 0.1.0

upstream:
  api: v2
  provider: clinicaltrialsgov
  docs: https://clinicaltrials.gov/data-api/api
  supersedes:
    # The classic site this API replaced. clinical-trials-gov reaches it, and
    # was left out of detection for that reason.
    - version: ct2
      host: clinicaltrials.gov/ct2
      note: the classic interface this API replaced

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: studies
  resource:
    style: bare
  error:
    # No JSON at all. A client calling .json() throws on the letter P.
    style: text

resources:
  study:
    id:
      style: opaque
      field: "-"
      carried_by: protocolSection
    fields:
      protocolSection:
        type: map
      hasResults:
        type: boolean

routes:
  - method: GET
    path: /api/v2/studies
    resource: study
    operation: list

    pagination:
      # pageSize and pageToken, struck live on 2026-09-05. Ten by default,
      # and the token resumes correctly at whatever size the caller asked
      # for -- ?pageSize=2 then following the token answers records three
      # and four of the ten a bare request returns, not records eleven and
      # twelve.
      #
      # That was worth checking, because the tokens returned for pageSize=2
      # and pageSize=10 share their first twenty characters and only diverge
      # after that. A client that compares cursors by prefix, or logs a
      # truncated one, sees two different positions as the same page.
      #
      # The size name was already right by luck. The position was not: the
      # runtime was reading "cursor", and there is no cursor here.
      # pageSize was already established from the provider's own refusal:
      # ?pageSize=notanumber answers 400 with "Value provided in parameter
      # `pageSize` cannot be converted to 32-bit integer", struck live and
      # pinned in a case below. A provider that names a parameter while
      # refusing it has named it.
      #
      # The position used to be left undeclared here, on the grounds that
      # nothing had reached a second page and a name nobody has seen the API
      # answer to is a guess whatever its provenance. That is no longer
      # true: it was walked on 2026-09-05.
      style: cursor
      limit: 10
      limit_param: pageSize
      cursor_param: pageToken
  # An identifier that is not one: plain text, with backticks in it.
  - method: GET
    path: /api/v2/studies/NCT00000000
    error: bad_nct_id
    headers:
      Content-Type: text/plain; charset=UTF-8

  # A parameter that will not convert: plain text again, naming the width.
  - method: GET
    path: /api/v2/studies-bad-pagesize
    error: bad_page_size
    headers:
      Content-Type: text/plain; charset=UTF-8

  # A path that does not exist: nothing at all.
  - method: GET
    path: /api/v2/nosuchthing
    resource: study
    operation: get
    id_from: auth
    status: 404
    empty_body: true

errors:
  bad_nct_id:
    status: 400
    # Markdown backticks, in a response declared as plain text.
    message: "Parameter `nctId` has incorrect format"

  bad_page_size:
    status: 400
    # The integer width, in a message for whoever typed the URL.
    message: "Value provided in parameter `pageSize` cannot be converted to 32-bit integer"

fixtures:
  empty: {}

  trials:
    study:
      - id: NCT03816735
        hasResults: false
        protocolSection:
          identificationModule:
            nctId: NCT03816735
            orgStudyIdInfo:
              # A space and a slash, inside an id inside an Info inside a
              # Module.
              id: 30-225 ex 17/18
            organization:
              fullName: Medical University of Graz
              class: OTHER
            briefTitle: Laser vs Hyaluronic Acid for GSM in Breast Cancer
          statusModule:
            # It does not know...
            overallStatus: UNKNOWN
            # ...and it says what it last knew, one line later.
            lastKnownStatus: RECRUITING
            # A year and a month, and no day.
            statusVerifiedDate: "2024-01"
            expandedAccessInfo:
              hasExpandedAccess: false
            # A fact...
            startDateStruct:
              date: "2019-01-24"
              type: ACTUAL
            # ...and a guess, told apart by one word a level down.
            primaryCompletionDateStruct:
              date: "2024-12-31"
              type: ESTIMATED
          designModule:
            studyType: INTERVENTIONAL
            # A list of one string, and the string is two letters.
            phases:
              - "NA"
            designInfo:
              allocation: RANDOMIZED
              interventionModel: PARALLEL
              primaryPurpose: TREATMENT
              maskingInfo:
                masking: NONE
            enrollmentInfo:
              count: 50
              type: ESTIMATED

conformance:
  - name: a date says whether it actually happened
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=1
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies
    expect:
      status: 200
      body:
        # A fact...
        "studies[0].protocolSection.statusModule.startDateStruct.date": "2019-01-24"
        "studies[0].protocolSection.statusModule.startDateStruct.type": ACTUAL
        # ...and a guess, in fields whose names end in a word about the code.
        "studies[0].protocolSection.statusModule.primaryCompletionDateStruct.date": "2024-12-31"
        "studies[0].protocolSection.statusModule.primaryCompletionDateStruct.type": ESTIMATED

  - name: the record does not know, and says what it last knew
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=1
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies
    expect:
      status: 200
      body:
        # Adjacent fields, saying both.
        "studies[0].protocolSection.statusModule.overallStatus": UNKNOWN
        "studies[0].protocolSection.statusModule.lastKnownStatus": RECRUITING
        # And a date that is a month, in the same object as dates that are not.
        "studies[0].protocolSection.statusModule.statusVerifiedDate": "2024-01"
        # A negated fact about access, nested one level for no reason the
        # response gives.
        "studies[0].protocolSection.statusModule.expandedAccessInfo.hasExpandedAccess": false

  - name: phases is a list of one string and the string is NA
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=1
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies
    expect:
      status: 200
      body:
        # Not an empty list, not null: two letters inside an array.
        "studies[0].protocolSection.designModule.phases[0]": "NA"
        "studies[0].protocolSection.designModule.studyType": INTERVENTIONAL
        # And an enrolment that is also an estimate.
        "studies[0].protocolSection.designModule.enrollmentInfo.count": 50
        "studies[0].protocolSection.designModule.enrollmentInfo.type": ESTIMATED

  - name: an identifier with a space and a slash in it
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=1
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies
    expect:
      status: 200
      body:
        # An id, inside an Info, inside a Module.
        "studies[0].protocolSection.identificationModule.orgStudyIdInfo.id": 30-225 ex 17/18
        "studies[0].protocolSection.identificationModule.nctId": NCT03816735
        "studies[0].protocolSection.identificationModule.organization.fullName": Medical University of Graz
        # A class of OTHER, which is the only value most of them have.
        "studies[0].protocolSection.identificationModule.organization.class": OTHER
        "studies[0].protocolSection.identificationModule.briefTitle": Laser vs Hyaluronic Acid for GSM in Breast Cancer

  - name: the masking is a word inside an object inside an object
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=1
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies
    expect:
      status: 200
      body:
        "studies[0].protocolSection.designModule.designInfo.maskingInfo.masking": NONE
        "studies[0].protocolSection.designModule.designInfo.allocation": RANDOMIZED
        "studies[0].protocolSection.designModule.designInfo.primaryPurpose": TREATMENT
        "studies[0].hasResults": false

  - name: an identifier that is not one is plain text with backticks in it
    source: https://clinicaltrials.gov/api/v2/studies/NCT00000000
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies/NCT00000000
    expect:
      # Markdown formatting, in a response declared as plain text, for a
      # renderer that is not there.
      status: 400
      headers:
        Content-Type: text/plain
      body_matches: '^Parameter `nctId` has incorrect format$'

  - name: and a parameter that will not convert names the integer width
    source: https://clinicaltrials.gov/api/v2/studies?pageSize=notanumber
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/studies-bad-pagesize
    expect:
      status: 400
      headers:
        Content-Type: text/plain
      body_matches: '^Value provided in parameter `pageSize` cannot be converted to 32-bit integer$'

  - name: a path that does not exist is nothing at all
    source: https://clinicaltrials.gov/api/v2/nosuchthing
    verified: "2026-08-30"
    fixture: trials
    request:
      method: GET
      path: /api/v2/nosuchthing
    expect:
      # Zero bytes, and upstream no Content-Type header either -- so there is
      # not even a wrong document to parse.
      status: 404
      body_matches: '^$'

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not pageSize was read -- but pageToken can be shown, and it is the
  # half nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "pageToken moves past the only record, and the page comes back empty"
    source: "https://clinicaltrials.gov/api/v2/studies?pageSize=1"
    fixture: trials
    request:
      method: GET
      path: "/api/v2/studies"
      query:
        "pageSize": "1"
        "pageToken": "NCT03816735"
    expect:
      status: 200
      absent:
        - "studies[0]"

