# Pulumi Cloud Recipe for Cauldron
#
# Written against Pulumi's REST API reference at pulumi.com/docs and struck
# live against api.pulumi.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **The message says "or".** Struck live, both ways, byte-identical:
#
#   GET /api/user/stacks                    (no credential)
#   GET /api/user/stacks                    Authorization: token pul-notreal
#   401 {"code":401,"message":"Unauthorized: No credentials provided or are invalid."}
#
# One sentence covering two cases, joined by a conjunction. It is honest -- the
# server genuinely is not telling you which -- and it is the one thing a caller
# needs to know, because the two have entirely different fixes. Most providers
# in this collection collapse these two failures into one message and quietly
# pick a side, usually the wrong one: [loops](../loops) says "Invalid API key"
# to a request carrying no key at all. Pulumi says both, and that is better and
# still not useful.
#
# The sentence also carries its own status word before the colon and the
# numeric status in `code` beside it, so 401 appears three times in one
# exchange: the HTTP status, the `code` field, and the word "Unauthorized".
#
# **An unknown path is `text/plain`, and it is Go's.** Struck live:
#
#   GET /api/cauldron-nope
#   404  Content-Type: text/plain
#   404 page not found
#
# That is `http.NotFound`'s exact output from Go's standard library -- the
# default handler, unreplaced. So the JSON envelope above is only produced by
# routes that exist, and the failure a client meets while getting a URL wrong
# is the one `.json()` throws on.
#
# **The credential scheme is `token`.** `Authorization: token pul-...`, not
# `Bearer`. GitHub popularised it and almost nothing else uses it, so every
# HTTP library's built-in bearer helper produces a header this API refuses --
# and refuses with the sentence above, which does not mention the scheme.

recipe: pulumi
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
  # No spec: Pulumi publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  # Not "Bearer ". GitHub's scheme, which almost nothing else uses.
  prefix: "token "
  keys:
    - pul-cauldr0nf1xture0000000000000000000000
  # One sentence for both, struck live.
  absent_error: unauthorized
  rejected_error: unauthorized
  # A Bearer prefix where this API wants token. Struck live, the same sentence
  # comes back, which is the point: the refusal never mentions the scheme.
  malformed_error: unauthorized

responses:
  list:
    style: wrapped
    key: stacks
    cursor_field: continuationToken
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: number

resources:
  stack:
    id:
      # A stack has no id of its own. It is addressed by the triple
      # organization/project/stack, and this is the last of the three.
      field: stackName
      style: opaque
    fields:
      orgName:
        type: string
      projectName:
        type: string
      # Untyped, so a stack that has never run omits it rather than being
      # given a zero -- which would sort to 1970 and read as an update.
      lastUpdate:
      resourceCount:
        type: integer
        default: 0

routes:
  - method: GET
    path: /api/user/stacks
    resource: stack
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: pageSize
      cursor_param: continuationToken

errors:
  unauthorized:
    status: 401
    code: "401"
    # Two cases in one sentence, joined by a conjunction. Honest, and still
    # not actionable.
    message: "Unauthorized: No credentials provided or are invalid."

  unknown_route:
    status: 404
    # Go's http.NotFound, unreplaced -- so an unknown path is text and every
    # other failure here is JSON.
    style: text
    message: "404 page not found"
    headers:
      Content-Type: text/plain

fixtures:
  empty:
    stack: []

  account:
    stack:
      - stackName: prod
        orgName: cauldron-demo
        projectName: platform
        lastUpdate: 1788134400
        resourceCount: 142
      - stackName: staging
        orgName: cauldron-demo
        projectName: platform
        # Never updated: no lastUpdate at all rather than a zero, so a client
        # sorting on it has to decide where an absent value goes.
        resourceCount: 0

conformance:
  - name: the refusal names both failures in one sentence
    source: https://api.pulumi.com/api/user/stacks
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers: {}
    expect:
      status: 401
      body:
        # Struck live with no Authorization header at all. "No credentials
        # provided or are invalid" -- the server is not telling you which,
        # and says so, which is more than most providers here manage.
        message: "Unauthorized: No credentials provided or are invalid."
        code: 401

  - name: a wrong credential is the same sentence
    source: https://api.pulumi.com/api/user/stacks
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-notreal"
    expect:
      status: 401
      body:
        message: "Unauthorized: No credentials provided or are invalid."

  - name: a bearer prefix is not the scheme this API takes
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        # What every HTTP library's built-in bearer helper sends. Pulumi takes
        # GitHub's "token" scheme, and the refusal does not mention it.
        Authorization: "Bearer pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 401
      body:
        code: 401

  - name: an unknown path is Go's own not-found
    source: https://api.pulumi.com/api/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 404
      headers:
        # http.NotFound's exact output, the standard library default left in
        # place -- so the JSON envelope is produced only by routes that exist.
        Content-Type: text/plain
      body_matches: '^404 page not found'

  - name: a stack is addressed by three names and has no id
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 200
      body:
        # organization, project and stack, all three needed to name one thing
        # and none of them unique on its own. Two organizations can each have
        # a platform/prod.
        'stacks[0].orgName': cauldron-demo
        'stacks[0].projectName': platform
        'stacks[0].stackName': prod

  - name: a stack that has never run omits its update time
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 200
      body:
        'stacks[1].stackName': staging
        'stacks[1].resourceCount': 0
      absent:
        # Absent rather than zero, so a client sorting by last update has to
        # decide where a missing value goes -- and zero would have sorted it
        # to 1970 instead.
        - 'stacks[1].lastUpdate'

  - name: the update time is seconds rather than milliseconds
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 200
      body:
        # Ten digits, not thirteen. A client that assumes milliseconds -- the
        # commoner convention in this collection -- lands in 1970.
        'stacks[0].lastUpdate': 1788134400
        'stacks[0].resourceCount': 142

  - name: stacks page on a continuation token
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
      query:
        pageSize: "1"
    expect:
      status: 200
      body:
        'stacks[0].stackName': prod
      matches:
        continuationToken: '.'

  - name: the last page carries no token
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: account
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
      query:
        pageSize: "1"
        continuationToken: prod
    expect:
      status: 200
      body:
        'stacks[0].stackName': staging
      absent:
        - continuationToken

  - name: an account with no stacks answers an empty array
    source: https://www.pulumi.com/docs/pulumi-cloud/reference/cloud-rest-api/
    fixture: empty
    request:
      method: GET
      path: /api/user/stacks
      headers:
        Authorization: "token pul-cauldr0nf1xture0000000000000000000000"
    expect:
      status: 200
      body:
        stacks: []
