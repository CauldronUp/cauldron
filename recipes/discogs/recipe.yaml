# Discogs Recipe for Cauldron
#
# Same collection as recipes/spotify/recipe.yaml, and the two answer the
# "same real-world object, three schemes" question in opposite directions.
# Spotify mints an opaque id and never lets anyone edit the catalogue by
# hand. Discogs is a wiki: every artist, release and master here was typed
# in by a volunteer, edits are public, and entries genuinely get merged and
# deleted -- which is exactly the case this Recipe was asked to establish.
#
# Checked live against api.discogs.com on 2026-09-02, with no account, no
# app registered and no token ever sent:
#
#   GET /artists/108713                          -> 200 (Discogs' own doc
#                                                   example id, still real)
#   GET /artists/999999999 (well-formed, absent)  -> 404 "Artist not found."
#   GET /artists/notanumber (malformed shape)     -> 404 "The requested
#                                                   resource was not found."
#   GET /nosuchpath-xyz (unrouted entirely)       -> 404 "The requested
#                                                   resource was not found."
#   GET /releases/1                               -> 200 (a real, live
#                                                   release: The Persuader,
#                                                   "Stockholm", Svek 1999)
#   GET /releases/999999999 (absent)              -> 404 "That release does
#                                                   not exist or may have
#                                                   been deleted."
#   GET /masters/1660109                          -> 200 (release 1's master)
#   GET /masters/999999999 (absent)               -> 404 "That master
#                                                   release does not exist
#                                                   or may have been
#                                                   deleted."
#   DELETE /artists/108713                        -> 405, Allow header
#   (no User-Agent header, any path, any method)  -> 403, HTML, Cloudflare
#
# **The malformed id and the unrouted path draw the identical body.**
# "notanumber" in the artist slot and a path Discogs has never heard of both
# answer the same fifteen-word sentence, byte for byte, where a well-formed
# but absent numeric id gets a resource-specific one ("Artist not found.").
# That means an id shape check happens before the /artists/{id} route is
# reached at all -- a non-numeric segment never gets as far as looking
# anything up -- and Cauldron's own id.pattern mechanism exists to say
# exactly this. It is not declared here anyway: pattern enforcement in this
# format is proven by a conformance case answering 400 (see
# internal/recipe/validate.go's refusesShape, which only counts a 400 as
# evidence), and Discogs' real answer to a bad shape is 404, identical to
# routing miss. Forcing the case to claim 400 would misdescribe the one
# status this finding is actually about, so it is stated here, with the
# real bodies above, and left off the routes below rather than served
# through a mechanism built for a different provider's shape of the same
# idea.
#
# **The "not found" wording is not the same wording Discogs' own
# documentation shows, on two of four resources out of four checked.** The
# developer reference at discogs.com/developers ships a worked 404 example
# for Get an Artist -- {"message": "Artist not found."} -- dated inside its
# own recorded headers to 2014-07-01, and the live answer today matches it
# exactly. The same page's Get a Master Release example, from the same
# 2014 snapshot, shows {"message": "Master Release not found."}. The live
# answer, checked today, is {"message": "That master release does not
# exist or may have been deleted."} -- a different, longer sentence, and
# the release endpoint's own doc example ("Release not found.") has drifted
# the identical way, to "That release does not exist or may have been
# deleted." Twelve years is long enough for a provider to change its own
# wording and not its own published example of that wording. Label, tested
# alongside these but not modelled below, answers a third and shorter
# sentence again -- "Label not found", no trailing period at all -- so the
# four resource types do not even agree on punctuation.
#
# **The softer wording is the actual answer to this Recipe's question.**
# "That release does not exist or may have been deleted" is Discogs saying,
# in its own words, that absence-because-it-never-existed and
# absence-because-it-was-removed are one and the same message. There is no
# separate status for a release a moderator merged away, no Location
# header pointing at the surviving id (checked: none of the 404s above
# carry one), and nothing in the body naming a successor. A release that
# gets merged into a more complete duplicate -- Discogs' own moderation
# workflow, wikis being wikis -- and a release id nobody has ever used
# answer the identical sentence. This project holds no account and created
# none of the entries in this catalogue, so a specific, confirmed-merged
# release id to call directly was not available to test against; what is
# directly verified, live, above, is that the wire draws no distinction
# between the two causes for any id this Recipe could construct. No
# redirect, no tombstone field, no separate status -- the absence of a
# distinguishing signal is itself the finding, not a gap in testing it.
#
# **The identifier that does admit two things are the same is master_id,
# and it only works inside Discogs' own catalogue.** /releases/1 carries
# master_id: 1660109; /masters/1660109 carries main_release: 1 pointing
# straight back, plus most_recent_release: 14529598, a *different* release
# id for a later pressing of the same recording. Three release ids already
# named on one master -- 1, 14529598, and every other pressing
# /masters/{id}/versions would list (not modelled: see gaps) -- are
# Discogs' own claim that distinct catalogue numbers, distinct labels and
# distinct years can still be one underlying work. That is real, and it is
# entirely internal: nothing in either payload names an ISRC, a barcode
# scheme any other catalogue could look up, or an MBID. `identifiers` on a
# release is barcodes and matrix/runout etched-in-the-vinyl text, both
# artefacts of one physical object, not a cross-catalogue key. No field
# anywhere in either resource below is named anything like musicbrainz,
# mbid, isni or upc-as-identifier. The only "is this the same thing"
# mechanism this API has is its own master_id, and the question this
# collection's header asks -- an MBID or other cross-catalogue identifier
# -- is answered here with a plain no, checked by reading every key both
# live responses actually returned.
#
# **A track has no identifier of its own, anywhere.** tracklist entries
# carry position ("A", "B1", "C1"...), title and duration and nothing else
# -- no id, no uri, nothing a second request could use to name this track
# apart from "the one at this position on this release." Compare Spotify,
# whose track is a first-class resource with its own opaque id independent
# of the album it sits on. A Discogs track's whole address is
# (release_id, position), which is a location on one physical release
# rather than an identity, and it is why the header's cross-catalogue
# question above has an easy answer for artists and releases and none at
# all for tracks: there is no id to be stable or unstable about.
#
# **Every request needs a User-Agent, and this is the one place the
# published guidance and the live enforcement disagree.** The developer
# page is explicit -- "Your application must provide a User-Agent string
# that identifies itself" -- and names curl's own default string,
# "curl/7.9.8 (i686-pc-linux-gnu)...", as one of its "bad examples that are
# unclear or obscure the nature of the application." Checked live: a
# request carrying curl's real, unmodified default User-Agent
# (curl/8.16.0) is not refused at all -- 200, same as a descriptive one.
# What actually draws the 403 is a header that is not on the request in the
# first place ("User-Agent:" sent with no value, which curl renders as
# omitting the header entirely). So the documented advice is about being a
# considerate API citizen and the enforced rule is narrower and cruder:
# present or absent, not good or bad. required_headers below models the
# rule that is actually enforced.
#
# **The check runs before routing, before the method, and produces
# Discogs' own branded page rather than its API's JSON.** Checked with no
# User-Agent on all four combinations this Recipe probes -- a real path, a
# nonexistent one, GET and DELETE -- and all four came back 403,
# Content-Type: text/html; charset=UTF-8, a Cloudflare-served page titled
# "403 Forbidden | Discogs" whose visible text reads "403 Forbidden. Access
# Denied." This runs ahead of the JSON API entirely: it is Discogs' edge,
# not its application, refusing the request before anything api.discogs.com
# itself would recognise as a route or a credential. That ordering is
# exactly what this format's required_headers already does by default
# (checked before the router, per internal/runtime/handler.go), so nothing
# had to be reshaped to describe it -- only the body is approximated; see
# the gaps below.
#
# **A credential is optional almost everywhere and Discogs draws a real
# three-way line on the one route that actually requires one.** Every route
# this Recipe declares works with no Authorization header and no token at
# all, checked live, which is why auth.scheme is none. GET /oauth/identity
# is different -- it always 401s -- and it does not collapse absent, wrong
# and malformed into one sentence the way most of this collection's
# providers do:
#
#   no credential at all                          "You must authenticate to
#                                                   access this resource."
#   Authorization: Bearer junk (wrong scheme)      "Bad token."
#   Authorization: Discogs token=junk (right       "Invalid consumer token.
#     scheme, wrong value)                         Please register an app
#                                                   before making requests."
#
# absent, malformed and rejected, three different sentences, verified live
# -- exactly the split auth.absent_error / malformed_error / rejected_error
# exist to carry. It is not declared below. Cauldron's auth scheme is one
# setting for the whole Recipe with no per-route exemption (FireHydrant's
# Recipe in this collection names the same limit for its own noauth/ping),
# and every route this Recipe actually models needs no credential -- making
# the whole Recipe require one to reach this three-way split would mean
# claiming every artist and release lookup above needs a token, which the
# same live host just finished proving false. Recorded here, verified,
# dated, and left out rather than let the tail wag the dog.
#
# **A wrong or absent credential is not even checked the same way across
# two live endpoints of one host.** /oauth/identity validates a token
# wherever it travels -- header or query, wrong either way gets "Invalid
# consumer token." /database/search, which needs no credential at all,
# answers 200 to a garbage token sent as Authorization: Discogs token=junk
# (checked twice, both 200, real results) and 401 "Invalid consumer token"
# to the identical garbage value sent as ?token=junk on the same path.
# Same host, same wrong string, one channel silently ignored and the other
# validated. Not modelled: this Recipe declares no search route at all,
# because the inconsistency is the finding and there is nowhere faithful
# to put it once one channel is simply not checked.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The malformed-id-equals-unrouted-path finding (see above) has no
#     conformance case. Declaring id.pattern would need a 400 that Discogs
#     never sends for this; not declaring it means Cauldron would answer a
#     bad-shape id with this route's ordinary not_found message rather than
#     the generic one real Discogs sends. Stated in prose, not served.
#   - The three-way credential verdict on /oauth/identity is not modelled
#     at all, for the reason given above -- one Recipe-wide auth scheme,
#     and every declared route is genuinely open.
#   - /database/search is not modelled: no route, no fixture, nothing. Its
#     own auth inconsistency (see above) has no honest single behaviour to
#     serve, and its result shape -- artists, releases, masters and labels
#     interleaved in one array, told apart only by a "type" field -- would
#     be a second Recipe's worth of work on its own.
#   - The 403's real body is a multi-kilobyte Cloudflare-rendered HTML
#     document with an embedded challenge script. errors.missing_user_agent
#     below serves the page's own visible heading text under style: text
#     and Content-Type: text/html; charset=UTF-8, not the page itself --
#     the same choice Airbrake's and Together's Recipes make for their own
#     unreproducible HTML gaps in this collection.
#   - method_not_allowed's message is Discogs' real wording with this
#     format's {detail} standing in for the method alone: real Discogs
#     says "Method DELETE is not allowed for this resource.", naming only
#     the verb, and {detail} composes "DELETE /artists/108713" -- method
#     and path together -- because that is the one string this format
#     hands an error template. The conformance case below checks status
#     only and does not assert the composed message or the Allow header
#     value: Cauldron computes Allow from this Recipe's own declared
#     methods (GET alone, so "GET"), where the live header is always
#     "HEAD,OPTIONS,GET,OPTIONS" -- with OPTIONS listed twice, an oddity
#     confirmed on every 405 and every real 200 this Recipe checked and not
#     asserted anywhere, because nothing about it is a claim this format
#     could falsify. Airbrake's Recipe in this collection states the same
#     kind of Allow-header gap in these words: "Cauldron does not model an
#     implicit HEAD alongside a declared GET... stated rather than asserted
#     around."
#   - Rate limiting is real and observed -- x-discogs-ratelimit: 25 with no
#     credential, 60 the moment any token parameter is present on the
#     request, valid or not -- and not modelled: this format has no
#     mechanism for a limit that changes tier based on a credential's mere
#     presence rather than its validity, and cauldron fault's rate-limit
#     injection is a flat per-Recipe setting, not a per-request one.
#   - members (a group's line-up, each with its own artist id and an
#     active boolean) is modelled below because release 1's artist,
#     Nickelback, has one and it is real, live data. aliases -- the field
#     that would actually claim "this artist id and that one are the same
#     person under a different name," which is the sharpest possible
#     answer to this header's own question -- is neither documented on the
#     page this Recipe read nor present on the one fixture artist this
#     Recipe holds, so it is not declared rather than guessed at from a
#     name recalled and not observed.
#   - No write route of any kind. Discogs' submission and edit workflow is
#     what actually produces a merge, and none of it needs modelling to
#     answer the question this Recipe was asked: what a GET sees on either
#     side of one, which the header above establishes directly.
#   - No upstream.spec. Discogs publishes a prose reference at
#     discogs.com/developers and no OpenAPI or other machine-readable
#     description anywhere on it -- checked by fetching the page and
#     searching it for "openapi", "swagger" and ".yaml", all absent.

recipe: discogs
capability: media
version: 0.1.0

upstream:
  api: v2
  docs: https://www.discogs.com/developers

auth:
  # None of the routes this Recipe declares need a credential -- checked
  # live, every one of them, with no Authorization header and no token
  # anywhere on the request. See the header for the one route that does
  # and is not modelled.
  scheme: none

required_headers:
  # Checked with the header entirely absent (not merely empty) on GET and
  # DELETE, a real path and a fake one -- all four answered the same 403
  # before anything else about the request was consulted. See the header
  # for the documented-vs-enforced gap and for why only the presence check
  # is served.
  User-Agent: missing_user_agent

responses:
  resource:
    style: bare
  error:
    # {"message": "..."} -- one field, no code, no type, on every failure
    # this Recipe reached.
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  artist:
    id:
      style: numeric
      type: number
    fields:
      name:
        type: string
      resource_url:
        type: string
      uri:
        type: string
      releases_url:
        type: string
      profile:
        type: string
      urls:
        type: list
      namevariations:
        type: list
      # A group's own line-up, each entry a real artist id with its own
      # /artists/{id} route -- not an alias claim. See the header: this is
      # the relation Discogs actually documents and observes here, and
      # aliases (the same-person-different-name claim) is neither.
      members:
        type: list
      data_quality:
        type: string

  release:
    id:
      style: numeric
      type: number
    fields:
      status:
        type: string
      year:
        type: integer
      resource_url:
        type: string
      uri:
        type: string
      title:
        type: string
      artists:
        type: list
      artists_sort:
        type: string
      labels:
        type: list
      formats:
        type: list
      genres:
        type: list
      styles:
        type: list
      country:
        type: string
      # The intra-catalogue "same thing" pointer. See the header: this is
      # the only cross-reference either resource carries, and it never
      # leaves Discogs' own id space.
      master_id:
        type: integer
      master_url:
        type: string
      notes:
        type: string
        null_when_unset: true
      # Barcodes and matrix/runout text -- artefacts of one physical
      # object, not a cross-catalogue key. See the header.
      identifiers:
        type: list
      # Each entry is {position, type_, title, duration} and carries no id
      # of its own. See the header: a track's whole address is its release
      # plus this position string.
      tracklist:
        type: list
      data_quality:
        type: string

  master:
    id:
      style: numeric
      type: number
    fields:
      # Points back at a release id -- the release this master treats as
      # canonical, per the header's cross-reference.
      main_release:
        type: integer
      # A different release id again: the newest pressing under this
      # master, distinct from main_release on this very fixture.
      most_recent_release:
        type: integer
      resource_url:
        type: string
      uri:
        type: string
      main_release_url:
        type: string
      most_recent_release_url:
        type: string
      versions_url:
        type: string
      title:
        type: string
      artists:
        type: list
      year:
        type: integer
      genres:
        type: list
      styles:
        type: list
      tracklist:
        type: list
      data_quality:
        type: string

routes:
  - method: GET
    path: /artists/{id}
    resource: artist
    operation: get
    not_found: artist_not_found

  - method: GET
    path: /releases/{id}
    resource: release
    operation: get
    not_found: release_not_found

  - method: GET
    path: /masters/{id}
    resource: master
    operation: get
    not_found: master_not_found

errors:
  artist_not_found:
    status: 404
    message: "Artist not found."

  # Softer than the artist wording, and softer than this same route's own
  # 2014 documented example -- see the header's doc-drift finding.
  release_not_found:
    status: 404
    message: "That release does not exist or may have been deleted."

  master_not_found:
    status: 404
    message: "That master release does not exist or may have been deleted."

  # What both an unrouted path and a malformed id answer, byte for byte.
  # Only the unrouted-path half is reachable through a declared route; see
  # the header for why the malformed-id half has no conformance case.
  unknown_route:
    status: 404
    message: "The requested resource was not found."

  # {detail} composes method and path together; real Discogs names only
  # the method. See the header's gap list.
  method_not_allowed:
    status: 405
    message: "Method {detail} is not allowed for this resource."

  # The visible heading of a much larger Cloudflare-rendered page. See the
  # header.
  missing_user_agent:
    status: 403
    style: text
    headers:
      Content-Type: "text/html; charset=UTF-8"
    message: "403 Forbidden. Access Denied."

fixtures:
  empty: {}

  catalogue:
    artist:
      # Discogs' own documented example id (Get an Artist, still live and
      # unchanged), and the id this Recipe called directly.
      - id: 108713
        name: Nickelback
        resource_url: https://api.discogs.com/artists/108713
        uri: https://www.discogs.com/artist/108713-Nickelback
        releases_url: https://api.discogs.com/artists/108713/releases
        profile: >-
          Alternative rock band from Hanna, Alberta (Canada).


          The band was formed in 1995. The band having sold almost 50
          million albums worldwide, ranking as the 11th best selling music
          act of the 2000s, and is the 2nd best selling foreign act in the
          U.S. behind The Beatles for the 2000's.
        urls:
          - "http://www.nickelback.com/"
          - "https://www.facebook.com/Nickelback/"
          - "https://twitter.com/Nickelback"
          - "https://www.instagram.com/nickelback/"
          - "https://www.youtube.com/user/nickelbacktv"
          - "https://www.youtube.com/user/NickelbackVEVO"
          - "https://en.wikipedia.org/wiki/Nickelback"
        namevariations:
          - "Nickel Back"
          - "Nickelbeck"
          - "Nicklback"
          - "Nickleback"
          - "Nikelback"
        members:
          - id: 270222
            name: Chad Kroeger
            resource_url: https://api.discogs.com/artists/270222
            active: true
          - id: 685754
            name: Mike Kroeger
            resource_url: https://api.discogs.com/artists/685754
            active: true
          - id: 685755
            name: Daniel Adair
            resource_url: https://api.discogs.com/artists/685755
            active: true
          # A past member -- active: false, on the same fixture as three
          # current ones, so the field is not a constant.
          - id: 685756
            name: "Ryan \"Vik\" Vikedal"
            resource_url: https://api.discogs.com/artists/685756
            active: false
          - id: 685757
            name: Ryan Peake
            resource_url: https://api.discogs.com/artists/685757
            active: true
        data_quality: "Needs Vote"

    release:
      # Discogs' real release id 1: The Persuader, "Stockholm" (Svek, 1999).
      # Called directly, not an invented example.
      - id: 1
        status: Accepted
        year: 1999
        resource_url: https://api.discogs.com/releases/1
        uri: https://www.discogs.com/release/1-The-Persuader-Stockholm
        title: Stockholm
        artists:
          - id: 1
            name: The Persuader
            anv: ""
            join: ""
            role: ""
            tracks: ""
            resource_url: https://api.discogs.com/artists/1
        artists_sort: "Persuader, The"
        labels:
          - id: 5
            name: Svek
            catno: SK032
            entity_type: "1"
            entity_type_name: Label
            resource_url: https://api.discogs.com/labels/5
        formats:
          - name: Vinyl
            qty: "2"
            descriptions:
              - "12\""
              - "33 ⅓ RPM"
        genres:
          - Electronic
        styles:
          - Deep House
        country: Sweden
        master_id: 1660109
        master_url: https://api.discogs.com/masters/1660109
        notes: >-
          The song titles are the names of six Stockholm districts.


          Title on labels: - Stockholm -


          [Labels:]

          Recorded at the Globe studio, Stockholm


          Fax: +46 8 679 64 53
        identifiers:
          - type: "Matrix / Runout"
            value: "MPO SK 032 A1 G PHRUPMASTERGENERAL T2T LONDON"
            description: A-side runout
          - type: "Matrix / Runout"
            value: "MPO SK 032 B1"
            description: B-side runout
          - type: "Matrix / Runout"
            value: "MPO SK 032 C1"
            description: C-side runout
          - type: "Matrix / Runout"
            value: "MPO SK 032 D1"
            description: D-side runout
        tracklist:
          - position: A
            type_: track
            title: Östermalm
            duration: "4:45"
          - position: B1
            type_: track
            title: Vasastaden
            duration: "6:11"
          - position: B2
            type_: track
