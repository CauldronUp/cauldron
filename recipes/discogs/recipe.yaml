conformance:
  # Observed. No User-Agent header at all -- not an empty one, the header
  # is not on the request.
  - name: no User-Agent is refused before anything else about the request
    source: https://api.discogs.com/artists/108713
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: GET
      path: /artists/108713
    expect:
      status: 403
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "403 Forbidden\\. Access Denied\\."

  # Observed. The same missing-header refusal reaches a path this Recipe
  # has no route for at all, and a write method, identically -- see the
  # header: this runs ahead of routing and the method both.
  - name: and it is checked before routing, for any method
    source: https://api.discogs.com/nosuchpath-xyz
    verified: "2026-09-02"
    fixture: catalogue
    request:
      method: DELETE
      path: /artists/108713
    expect:
      status: 403
      headers:
        Content-Type: "text/html; charset=UTF-8"
      body_matches: "403 Forbidden\\. Access Denied\\."

