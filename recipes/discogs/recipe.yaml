            duration: "5:16"
        data_quality: Correct

    master:
      # release 1's own master. main_release points straight back at it;
      # most_recent_release names a different, later pressing.
      - id: 1660109
        main_release: 1
        most_recent_release: 14529598
        resource_url: https://api.discogs.com/masters/1660109
        uri: https://www.discogs.com/master/1660109-The-Persuader-Stockholm
        main_release_url: https://api.discogs.com/releases/1
        most_recent_release_url: https://api.discogs.com/releases/14529598
        versions_url: https://api.discogs.com/masters/1660109/versions
        title: Stockholm
        artists:
          - id: 1
            name: The Persuader
            anv: ""
