# Postscript Recipe for Cauldron
#
# Postscript is SMS marketing for Shopify stores, and the question this
# batch asked of it is the consent one, not the carriage one: a subscriber
# opted in somewhere, and the API has to record where. This continues the
# thread recipes/buttondown/recipe.yaml opened and recipes/kit/recipe.yaml,
# recipes/constantcontact/recipe.yaml and recipes/drip/recipe.yaml (all this
# same batch) kept going -- is a contact a person or a subscription, and can
# an integration ever move one back to subscribed without them asking.
# recipes/omnisend/recipe.yaml, read immediately before this one, found an
# ordinary create that is an upsert with no guard-rail language anywhere:
# any caller who already knows an address can flip it back to subscribed,
# silently, through the one documented route. Postscript's own materials
# read as the deliberate opposite of that, on both halves of the question.
#
# **Where the opt-in came from is required, and it is required exactly
# once: on the way in.** Create Subscriber's own request schema
# (developers.postscript.io/reference/create-subscriber, fetched as the
# page's own embedded OpenAPI fragment) lists `keyword_id` and `keyword`
# both inside its `required` array, and separately documents `origin` --
# `website`, `social`, or `other`, default `other` -- as "Where the
# subscriber originated from." The companion guide, "How to Add Subscribers
# Using the API," walks through minting a Keyword first (POST-free, done in
# the dashboard, "select OPT IN and create whatever REPLY you want") and
# only then sending `{"origin": "website", "phone_number": ..., "keyword":
# ...}` to create a subscriber against it. So yes: there is an opt-in-source
# mechanism, and it is a real, first-class, separately addressable object
# (GET /api/v2/keywords, its own worked example quoted below) rather than a
# free-text field somebody could leave blank.
#
# **And then it is gone.** Grepped across every field Get Subscriber, Get
# Subscribers and Update Subscriber's own response schemas declare
# (developers.postscript.io/reference/get-subscriber, get-subscribers,
# update-subscriber-by-id -- all three, same worked example, word for word):
# neither `keyword` nor `keyword_id` nor `origin` appears on any of them.
# Not on the single-subscriber read, not on the list, not on the update
# response, and -- see below -- not even on create's own response, the one
# call that just received it. A caller who wants to know where a subscriber
# came from has to have kept the answer themselves; Postscript's own API
# never hands it back.
#
# **THE FINDING THIS RECIPE EXISTS TO MAKE: a subscriber created through
# this API is not a subscriber yet, and there is no way to poll for the
# moment it becomes one.** Create Subscriber's own documentation, quoted
# verbatim: "If adding a new subscriber, note that a subscriber does not
# become a full subscriber until *after* they have opted in. That means,
# you'll initially get back a pending subscriber id. **This id cannot be
# used to fetch an active subscriber.** To get the subscriber's id when
# they opt in, you'll need to set up a webhook to listen to our
# `shop.subscriber.opt_in` event and get it there." `shop.subscriber.opt_in`
# and `shop.subscriber.opt_out` are both real, declared event enum values on
# Create Webhook Subscription's own schema (quoted below). A REST client
# with no inbound endpoint -- exactly what this Recipe's own conformance
# harness is -- has no way to learn that consent completed, ever, by
# calling anything. It can write a pending record and it can be told, later,
# by a push it has to have set up in advance. Compare Zenvia's Recipe in
# this collection, which found the identical shape for a completely
# different reason (delivery status, not consent): "the smallest thing you
# can ask about after a send is not a message and not a batch. It is
# nothing." Here it is even sharper, because the docs name the specific
# thing this Recipe cannot do -- fetch by the id create just returned -- in
# so many words, rather than this Recipe inferring it from an absent route.
#
# The response shape carries this out structurally, not just in prose.
# Create Subscriber's own worked 200 example --
#
#   {created_at, data, email, id, phone_number, properties,
#    shopify_customer_id, tags, updated_at}
#
# -- is missing exactly two fields every one of Get Subscriber's, Get
# Subscribers' and Update Subscriber's identical worked examples carry:
# `ps_id` and `subscriptions` (the `{promotional: {can_send}, transactional:
# {can_send}}` object). There is nothing to report about subscription state
# on a create response, because -- per the prose above -- nothing has
# happened yet to have a subscription state. `ps_id` is worth one more
# sentence: Get Subscribers' own query-parameter description for
# `ps_id__eq` calls it "their ps_id tracking ID. This ID is stored in the
# ps_id cookie for subscribers on the front end and is used to uniquely
# identify a subscriber across sessions" -- a THIRD identifier, a browser
# cookie value, distinct from the API's own opaque `id`, and it is exactly
# the field a front-end integration would want to correlate a create
# against, and exactly the field create cannot supply yet either. And
# create's own response is documented at status 200, never 201 -- no
# signal in the status line either, the opposite of Omnisend's 201-new /
# 200-upsert pair in this same batch.
#
# **Resubscribe: the documented answer is closer to no than Omnisend's
# unguarded yes.** Update Subscriber's own request schema accepts exactly
# three fields -- `email`, `tags`, `properties` -- and nothing that touches
# `subscriptions`. There is no field on this endpoint's own schema that
# could flip `can_send` back to true. The only route that moves a
# subscription at all is Unsubscribe (PATCH /api/v2/compliance/unsubscribe,
# "Opt outs subscribers from Postscript messaging," `postscript_subscriber_
# id` or `phone_number` in, `{"message":"OK"}` at 202 out), and it is named
# for exactly one direction. Nowhere in this API's own reference index --
# Unsubscribe, Redact, Create Custom Event, Get Subscriber(s), Update
# Subscriber -- is there a Resubscribe, an Opt-In, or any route whose
# request body can set `can_send: true` on an existing record. The "how to
# add subscribers" guide is silent on what POSTing a phone number that
# already exists, unsubscribed, actually does -- no upsert language, no 409,
# no mention of the case at all -- so this Recipe does not claim an answer
# for it either. Where Omnisend's gap was a stated mechanism with no
# guard-rail language attached, Postscript's gap is silence on whether the
# mechanism exists at all. That is the sharper of the two answers this
# batch's question can get, and it is the one Postscript gives.
#
# Redact is one cascade further, and its own description says so outright:
# "When passed an email, phone number, Shopify customer ID, or Postscript
# subscriber ID, this endpoint will also unsubscribe the subscriber if they
# have an active subscription" -- a data-erasure call that reaches into
# consent state as a side effect, quoted verbatim, not inferred.
#
# **Postscript's own schema disagrees with itself twice, on the exact
# fields this batch cares about.** Create Subscriber's `required` array
# names `keyword_id`, `keyword` AND `phone_number` all three -- but the same
# page's prose says "You need to pass either a `keyword_id` or `keyword`
# body parameter," and the how-to guide's own worked curl example sends
# `keyword` and never `keyword_id` at all. This Recipe's create case below
# follows the guide's literal example -- keyword, not keyword_id -- because
# it is the one Postscript actually shows being called; the stricter
# both-required schema reading is recorded here and not modelled, the same
# choice this collection makes wherever a provider's schema and its own
# worked example disagree (remotecom/recipe.yaml's `type: "hris"` is the
# precedent). Separately, `properties` is typed `string, format: json,
# default: "{\"key\": \"value\"}"` on both Create's and Update's own request
# schemas, and a literal JSON object -- `{"has_purchased": true, ...}` -- on
# every one of the four response schemas that return it. This Recipe
# declares `properties` a map, matching every response this Recipe could
# actually observe a shape for, and states the request-schema's own
# self-contradiction here rather than resolving it silently.
#
# **The documented 400 for every mutation this Recipe could find is a
# literal, deliberately empty object.** Get Subscriber, Get Subscribers,
# Update Subscriber, Create Subscriber and Create Webhook Subscription all
# five declare their own 400 identically: `"examples": {"Result": {"value":
# "{}"}}, "schema": {"type": "object", "properties": {}}` -- not an omitted
# example, an explicitly typed empty schema, repeated byte for byte five
# times. Postscript's own materials promise nothing whatsoever about what a
# validation failure looks like, anywhere, and this Recipe does not invent
# a shape none of its own documentation states even once.
#
# **Missing and wrong credentials answer two different sentences, checked
# live, 2026-09-01, against api.postscript.io, with no account and no key
# ever created:**
#
#   no Authorization header at all
#   Authorization: "" (present, empty value)
#     -> 401, text/plain, 29 bytes: "Missing Authorization header"
#   Authorization: junktoken12345 (no scheme word)
#   Authorization: Bearer  (the scheme word, nothing after it)
#   Authorization: Bearer junktoken12345 (well-formed, simply wrong)
#     -> 401, text/plain, 13 bytes: "Unauthorized"
#
# five requests, two sentences, and the split lands exactly where Cauldron's
# own credential check draws it: `net/http`'s `Header.Get` cannot tell "not
# sent" from "sent as an empty string" apart, so both collapse to Absent by
# construction, matching what this host actually does; every other shape of
# wrong -- no scheme, an empty value after the declared prefix, or a
# well-formed value nobody issued -- is Malformed or Rejected, and both
# verdicts get the identical thirteen-byte sentence here, so this Recipe
# names only `auth.absent_error` and lets the other two fall through to the
# same generic message the live wire actually sends them.
#
# **The credential check runs before routing or method are examined, on
# every path and method this Recipe struck.** A path this Recipe invented,
# and DELETE on a real, declared path, both answered the identical
# credential-based sentence a well-formed request to a real route gets --
# never a 404, never a 405, and the message depended only on whether a
# credential was present, not on whether the path or method were real:
#
#   GET  /api/v2/this-route-does-not-exist   no credential   -> "Missing..."
#   GET  /api/v2/this-route-does-not-exist   junk credential -> "Unauthorized"
#   DELETE /api/v2/subscribers               no credential   -> "Missing..."
#   DELETE /api/v2/subscribers               junk credential -> "Unauthorized"
#
# **One route is genuinely public, and now it is modelled, the same way
# firehydrant/recipe.yaml's own /v1/noauth/ping is.** GET / (no path at
# all) answers 200 {"status": "OK", "success": true} with no credential
# presented, every time this Recipe struck it -- a health check, not a
# resource, and declared below with public: when-absent rather than
# folded into the Recipe-wide scheme every other route here actually
# needs. Not public: always: every strike of this route sent no
# credential at all, so only the absent half is verified, and whether a
# wrong or well-formed-but-fake one is waved through the way FireHydrant's
# noauth/ping is, or refused the way football-data's competitions list is,
# was never tried -- see the route's own comment.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - `id`, `email` and `phone_number` are typed `string` with no `example`
#     value anywhere on any of the four response schemas that carry them --
#     every worked JSON body Postscript's own reference pages show uses the
#     literal four-letter placeholder text "string" for all three, ReadMe.io's
#     auto-generated type placeholder rather than a worked value. This
#     Recipe reproduces that literal text rather than inventing a more
#     plausible-looking id, email or phone number that nothing in
#     Postscript's own materials shows -- the same choice payoneer/recipe.yaml
#     makes for its own unresolved `{AccountHolderId}`-style template
#     placeholders, stated there for the identical reason.
#   - `X-Postscript-Shop-Token` (a second header, required only for partner
#     credentials calling on behalf of a shop, per api-authentication.md)
#     and the legacy HTTP Basic form (username the Private API Key, blank
#     password, "remains supported" per the same page) are both real,
#     documented, and not modelled. Neither is blocked by a scheme limit --
#     the legacy Basic form is one credential through a second carrier,
#     which auth.also already exists for (Clearbit's own Basic-with-blank-
#     password is the precedent), and the partner header is an additional
#     one required alongside the primary credential, which
#     required_headers already exists for. What is missing is not a
#     mechanism, it is a wire observation: neither path was ever struck
#     live, and the plain Bearer path -- the one every worked example in
#     the docs actually shows -- is the only one this Recipe could exercise
#     start to finish without guessing at a shape nobody's example gives.
#   - `data` (an opaque object on every subscriber, undocumented beyond its
#     type) is declared and always empty in every fixture below, because no
#     worked example anywhere shows it populated.
#   - Create Custom Event and the whole event-tracking surface are not
#     modelled: this Recipe is scoped to the consent question the batch
#     asked, not to a complete client for this API.
#   - No page-size query parameter is documented on Get Subscribers -- only
#     `page` -- so no `pagination` block is declared on that route; the
#     fixture holds a single page and `page_info.total_pages` describes only
#     that page's own count, not a claim about a real account's size.
#   - No `429` case is declared. No rate-limit header or body was seen on
#     any live request this Recipe made, and none is documented on any page
#     this Recipe read.
#   - The documented 403 on Unsubscribe and Redact -- {"errors":[{"loc":[],
#     "msg":"Access denied. You do not have permissions to access the
#     requested resource.","type":"v2.access_denied"}]} -- is a third,
#     structured JSON shape, unlike either live text/plain sentence above,
#     and is not reachable without a real, under-scoped credential this
#     Recipe never had. Recorded here and not asserted by any case.
#
# No upstream.spec is recorded. Each reference page above embeds its own
# separate OpenAPI 3.1.0 fragment -- one path per document, title
# "partner-api", version "2.0" -- rather than one fetchable description at a
# stable URL, the same gap bamboohr/recipe.yaml, zenvia/recipe.yaml and
# omnisend/recipe.yaml state for the same reason. The key below is a
# fixture and belongs to no account.

recipe: postscript
capability: sms
version: 0.1.0

upstream:
  api: "2.0"
  provider: postscript
  docs: https://developers.postscript.io/reference/get-subscriber

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_cauldron0000000000000000000000
  # Absent gets its own sentence -- and a present-but-empty header collapses
  # into it too, by construction, not by choice; see the header. Malformed
  # and Rejected are left unset because both verdicts answer the identical
  # generic sentence live.
  absent_error: missing_authorization_header

responses:
  list:
    style: wrapped
  resource:
    style: bare
  # Both live sentences this Recipe can reach are plain text, not JSON --
  # see the header.
  error:
    style: text

resources:
  # GET /api/v2/subscribers, GET /api/v2/subscribers/{id}, PATCH
  # /api/v2/subscribers/{id} and POST /api/v2/subscribers all answer this
  # same shape -- create's own route below narrows it with `returns`,
  # because two fields never arrive on that one response. See the header.
  subscriber:
    collection: subscribers
    id:
      # "string" -- Postscript's own literal placeholder text on every
      # worked example this Recipe found. See the header.
      style: opaque
    fields:
      email:
        type: string
        null_when_unset: true
      phone_number:
        type: string
      # A front-end cookie tracking id, per Get Subscribers' own
      # ps_id__eq description -- a THIRD identifier beside `id` and
      # whatever `keyword`/`origin` recorded on the way in. Absent on
      # create's own response -- see the header, and the route below.
      ps_id:
        type: integer
        null_when_unset: true
      shopify_customer_id:
        type: integer
        null_when_unset: true
      data:
        type: map
        default: {}
      # A JSON object on every response this Recipe could see a shape for,
      # despite being typed a JSON-encoded string on the request schema --
      # see the header's documentation self-contradiction.
      properties:
        type: map
        null_when_unset: true
      tags:
        type: list
        default: []
      # {promotional: {can_send}, transactional: {can_send}} -- the closest
      # thing this object has to a subscription status, and a boolean per
      # channel, not an enum with a timestamp. Absent on create's own
      # response -- see the header, and the route below.
      subscriptions:
        type: map
        null_when_unset: true
      created_at:
        type: datetime
      updated_at:
        type: datetime

  # GET /api/v2/keywords. A real, separately addressable opt-in-source
  # object -- see the header -- and proof that "keyword" exists as a first-
  # class concept in this API even though it never appears on a subscriber
  # once one is read back.
  keyword:
    collection: keywords
    id:
      style: opaque
    fields:
      keyword:
        type: string
      triggered_count:
        type: integer
        default: 0
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /api/v2/subscribers
    resource: subscriber
    operation: list
    pagination:
      # page, and no size. From Postscript's own description read
      # 2026-09-05, this route takes twenty-odd filters, a sort, and exactly
      # one paging parameter: page, "page number of results to start from".
      # There is no per-page, no limit and no cursor anywhere on it, so the
      # page size is Postscript's to choose and the caller cannot ask for a
      # different one.
      #
      # What the description does not say is what number the first page has,
      # or how big a page is. Neither is declared: first_page is left to the
      # engine's default of one, which is what "page number of results to
      # start from" implies and is not the same as what it states. If
      # Postscript numbers from zero -- Braze and Navitia both do -- the
      # walk here starts one page in. Written down rather than asserted.
      style: page
      limit_param: "-"
      cursor_param: page
    list:
      page_field: page_info.page
      pages_field: page_info.total_pages

  - method: GET
    path: /api/v2/subscribers/{id}
    resource: subscriber
    operation: get

  - method: PATCH
    path: /api/v2/subscribers/{id}
    resource: subscriber
    operation: update

  # keyword and keyword_id are input only -- see the header -- and are not
  # in this list because they never appear on this route's own response
  # either. status is documented at 200, never 201, on this route alone.
  - method: POST
    path: /api/v2/subscribers
    resource: subscriber
    operation: create
    status: 200
    returns:
      - created_at
      - data
      - email
      - id
      - phone_number
      - properties
      - shopify_customer_id
      - tags
      - updated_at

  - method: GET
    path: /api/v2/keywords
    resource: keyword
    operation: list
    pagination:
      # No query parameters at all, from the same description: the endpoint
      # "returns a list of all active keywords for a shop". A shop's
      # keywords are its configuration -- a handful of words people can text
      # -- and they arrive together.
      #
      # Compare the subscriber listing above, which takes a page number on
      # the same API. One provider, two listings, and only the one that
      # grows with the customer base pages.
      style: none

  # Not a resource update: it takes an id OR a phone number, addresses no
  # path segment, and answers a bare acknowledgement rather than the
  # subscriber it changed. Raw, not typed -- see the header for what the
  # documented 403 alongside this looks like and why it is not modelled.
  - method: PATCH
    path: /api/v2/compliance/unsubscribe
    status: 202
    raw:
      content_type: application/json
      text: '{"message": "OK"}'

  # Cascades into unsubscribe as a side effect when a subscription is
  # active -- quoted verbatim in the header. Same shape as unsubscribe
  # above for the same reason.
  - method: PATCH
    path: /api/v2/compliance/redact
    status: 202
    raw:
      content_type: application/json
      text: '{"message": "OK"}'

  # Genuinely public -- see the header. A health check, not a resource, and
  # now sayable without misdescribing every other route below it: this
  # route names its own exemption rather than moving the Recipe-wide
  # scheme, the same device firehydrant/recipe.yaml's /v1/noauth/ping uses.
  #
  # when-absent, not always: every live strike of this route sent no
  # credential at all, so only that half is verified. Whether a wrong or
  # well-formed-but-fake credential is waved through the way FireHydrant's
  # noauth/ping does, or refused the way football-data's competitions list
  # does, was never tried -- see PublicMode's own doc comment on why the
  # two are not interchangeable and why the stronger claim needs its own
  # check rather than an assumption.
  - method: GET
    path: /
    public: when-absent
    raw:
      content_type: application/json
      text: '{"status": "OK", "success": true}'

errors:
  # Live, 2026-09-01, both a fully absent header and one present with an
  # empty value -- see the header for why those collapse together.
  missing_authorization_header:
    status: 401
    message: "Missing Authorization header"

  # Live, 2026-09-01: no scheme word, an empty value after the "Bearer "
  # prefix, and a well-formed value nobody issued all three answer this
  # identical sentence.
  authentication_error:
    status: 401
    message: "Unauthorized"

fixtures:
  empty: {}

  # The one worked example Get Subscriber, Get Subscribers and Update
  # Subscriber all three publish, word for word, on their own separate
  # reference pages -- quoted verbatim, not independently observed three
  # times. See the header for why id/email/phone_number are the literal
  # placeholder text "string".
  small-shop:
    subscriber:
      - id: "string"
        email: "string"
        phone_number: "string"
        ps_id: 42
        shopify_customer_id: 0
        data: {}
        properties:
          has_purchased: true
          days_since_purchase: 5
          categories: ["Beauty", "Home Goods"]
          birthday: "1991-01-01"
        tags: ["VIP"]
        subscriptions:
          promotional:
            can_send: true
          transactional:
            can_send: true
        created_at: "2019-08-24T14:15:22Z"
        updated_at: "2019-08-24T14:15:22Z"

    # Get Keywords' own worked example, quoted verbatim.
    keyword:
      - id: kw_31afjew824892ks
        keyword: YOUROCK
        triggered_count: 10
        created_at: "2021-10-01T03:17:09.306630"
        updated_at: "2021-10-01T03:17:09.306639"

# Seven cases below carry `verified:` -- struck against api.postscript.io,
# 2026-09-01, with no account and no key of any kind. The rest are read
# from developers.postscript.io's own embedded OpenAPI fragments and carry
# no verified date, because reaching a genuine 200 needs a key this Recipe
# was never issued.
conformance:
  - name: no credential at all is Missing, not Unauthorized
    source: https://api.postscript.io/api/v2/subscribers
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: GET
      path: /api/v2/subscribers
    expect:
      status: 401
      headers:
        Content-Type: "text/plain; charset=utf-8"
      body_matches: "^Missing Authorization header$"

  - name: a present but empty Authorization value collapses into the identical Missing sentence
    # Somebody sent an Authorization header; Go's own Header.Get cannot
    # tell that apart from nobody having sent one at all, and this host
    # cannot either -- see the header. Live.
    source: https://api.postscript.io/api/v2/subscribers
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: GET
      path: /api/v2/subscribers
      headers:
        Authorization: ""
    expect:
      status: 401
      body_matches: "^Missing Authorization header$"

  - name: no scheme word at all is Unauthorized instead
    source: https://api.postscript.io/api/v2/subscribers
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: GET
      path: /api/v2/subscribers
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: and a well-formed but wrong bearer token gets the identical sentence
    source: https://api.postscript.io/api/v2/subscribers
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: GET
      path: /api/v2/subscribers
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: a path this Recipe has never heard of is refused for its credential, not its path
    source: https://api.postscript.io/api/v2/this-route-does-not-exist
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: GET
      path: /api/v2/this-route-does-not-exist
    expect:
      status: 401
      body_matches: "^Missing Authorization header$"

  - name: a wrong method on a real path is refused the same way, never a 404 or a 405
    source: https://api.postscript.io/api/v2/subscribers
    verified: "2026-09-01"
    fixture: small-shop
    request:
      method: DELETE
      path: /api/v2/subscribers
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body_matches: "^Unauthorized$"

  - name: the root health check answers with no credential presented at all
    # Proves the exemption: this route is public, every other route on this
    # Recipe is not, and this is the request that shows the difference is
    # real rather than declared -- the same case firehydrant/recipe.yaml
    # runs for its own /v1/noauth/ping. Only the absent-credential half is
    # claimed here -- see the route's own comment on why this is
    # public: when-absent and not public: always.
    source: https://api.postscript.io/
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        status: OK
        success: true

  - name: keyword and origin are required to create a subscriber and never come back
    source: https://developers.postscript.io/docs/how-to-add-subscribers-using-api
    fixture: small-shop
    request:
      method: POST
