# Hunter.io Recipe for Cauldron
#
# Hunter answers "not found" three different ways depending which of its
# three lookups you ask, and says so with three different amounts of
# precision.
#
# **Domain Search documents its empty case exactly, in words this Recipe
# quotes rather than paraphrases:** "When the queried domain is unsupported
# or no domain can be found ... the API still responds with 200 OK. In that
# case data.domain, data.pattern, and data.organization are null,
# data.emails is an empty array, and meta.results is 0." That is a genuine
# three-way split for a single field -- data.domain is a string on a match,
# null on a miss, and the request never 4xxs either way -- and it is stated
# plainly enough to quote. It is not modelled as a reachable case in this
# Recipe, though, for a narrower reason: Cauldron looks a "get" resource up
# by the same field a Recipe's lookup_by names, so a fixture record whose
# domain field is null can never be the record a query for that domain
# finds. Faithfully reproducing "the field you searched by comes back null"
# needs the runtime to distinguish "found nothing" from "found a record
# whose key is absent," which this operation's lookup does not do. Recorded
# here, quoted precisely, rather than served through a fixture that would
# have to fake the one thing being demonstrated.
#
# **Email Finder documents that a miss is free and says nothing about its
# shape.** "If no email can be found, no credit is charged" is the entire
# statement on the subject, on https://hunter.io/api-documentation/v2,
# fetched 2026-09-02. No status code, no body, not even in the surrounding
# prose about what a caller should expect back. This Recipe declares no
# route for that case rather than guess between a 404, a 200 with a null
# email, and Domain Search's null-field convention borrowed across -- any of
# the three would be a claim this Recipe never read anywhere.
#
# **Email Verifier never says "not found" at all.** It evaluates whatever
# string you give it and always answers 200 with a verdict, one of six
# `status` values: valid, invalid, accept_all, webmail, disposable, unknown.
# "unknown" is explicitly the not-found-shaped member of that set --
# Hunter's own words are "we failed to verify the email address" -- but it
# arrives in the same envelope as every other verdict, indistinguishable in
# shape from success. Three lookups, three different relationships between
# "found nothing" and the HTTP contract.
#
# **The confidence score has a different name on each of the two endpoints
# that share it.** Hunter's own reference glossary states the equivalence
# directly: "score Estimation of the probability the email address returned
# is correct, between 0 and 100. In Hunter's products, the confidence score
# is the score returned by the Email Finder." Email Finder's own field is
# literally named score; Domain Search's per-address field for the identical
# quantity is named confidence. One product, one concept, two field names,
# and nothing about either JSON body says they are the same measurement --
# only a paragraph of prose does.
#
# **A low score does not mean unverified, and the two are independently
# reported on purpose.** Every Email Finder and Email Verifier result
# carries score alongside a separate verification.status (valid, accept_all,
# unknown). "For accept-all emails, the score estimates the probability that
# the email address is valid" -- score is Hunter's confidence in a guess,
# verification.status is whether SMTP actually confirmed it, and an
# accept-all domain can carry a high score with a status that is never
# better than accept_all, because there is no mail-server answer that could
# make it "valid." A caller checking score alone cannot tell a confirmed
# address from a plausible one; the two fields answer different questions
# and this Recipe's worked example carries "status": "valid" precisely so
# the distinction has something to sit next to.
#
# **Absent, malformed and rejected are one message, verified across three
# endpoints and two credential carriers.** No api_key query parameter; an
# empty one; a junk one; a junk Authorization: Bearer header: all four,
# struck live against /v2/domain-search, /v2/email-finder and
# /v2/email-verifier on 2026-09-02, answered the byte-identical body,
# {"errors":[{"id":"authentication_failed","code":401,"details":"No user
# found for the API key supplied"}]}. Hunter draws no line at all between
# these three verdicts, which is why none of auth.absent_error,
# .malformed_error or .rejected_error is set below -- naming the same error
# for all three would say nothing setting none of them does not already say.
#
# **Which HTTP method reaches the credential check depends on whether Hunter
# registers that verb anywhere in its API, not on this path.** GET, POST and
# OPTIONS against /v2/domain-search, with no credential, all answered the
# 401 above. PUT, PATCH and DELETE against the same path, same credential,
# each answered a different 404 instead: {"errors":[{"id":"not_found",
# "code":404,"details":"The requested resource couldn't be found."}]} --
# JSON, not the marketing site's page, and never once carrying the 401 body,
# regardless of whether a credential was sent. A wholly unrouted path (GET
# /v2/nosuchroute) answers yet a third shape, an HTML 404 from Hunter's own
# marketing site, again whether or not a credential was sent -- confirming
# that verbs Hunter never registers anywhere skip the credential check
# entirely, the same as a path it never registers. All of this was struck
# live and none of it fits Cauldron's auth.after_routing, which is a single
# Recipe-wide boolean for "credential first" or "route first": Hunter's real
# rule keys on which verbs its Rails app maps ANY route to at all, not on
# whether this path takes this verb, and not on routing generally. This
# Recipe leaves after_routing at its default (credential first,
# unconditional) because that is what the two operations it declares -- GET
# -- actually receive, and states the PUT/PATCH/DELETE finding here rather
# than forcing a boolean this format does not have. The 404 JSON shape is
# declared as errors.method_not_allowed with its real, non-405 status, so
# Cauldron's own router-miss handler answers it rather than a synthesised
# 405 with an invented Allow header -- reaching it needs this Recipe's own
# valid key, which is a request never made against the live API, so the case
# below carries no verified date even though the body is the literal one
# observed with no credential at all. The HTML unrouted-path shape is not
# served at all, the same call made in this collection's Together AI Recipe:
# pinning a marketing page would be pinning the website, not the API.
#
# **Neither Content-Type nor status code ever lied in this Recipe's probes.**
# Every JSON error this Recipe struck really was application/json; the one
# HTML 404 really was text/html; the 403/429 split below is read rather than
# reconstructed, and nothing observed contradicted it.
#
# **403 is the short-term rate limit; 429 is the long-term plan quota --
# which is backwards from the convention this collection sees almost
# everywhere else.** Hunter's own HTTP Status Code Summary, quoted exactly:
# "403 - Forbidden: You have reached the rate limit." and "429 - Too many
# requests: You have reached your usage limit. Upgrade your plan if
# necessary." A client written against the usual assumption -- 429 means
# slow down and retry, 403 means a permissions problem -- retries the wrong
# one and gives up on the other.
#
# **No credits-consumed field or header exists anywhere in Hunter's
# documentation.** The only signals are prose, and both say the same thing
# in different words: Email Finder's "if no email can be found, no credit is
# charged," and Domain Search's "a new query is counted for calls returning
# at least one result." Neither response body nor any response header ever
# states how many credits a specific call used. Compare apolloio/recipe.yaml,
# written alongside this one, whose bulk enrichment sibling endpoint
# documents a literal credits_consumed field -- a real difference within
# this trio, not a guess.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Domain Search's meta.params (an echo of the request's own query
#     parameters) is not modelled: Cauldron's constants are fixed per route,
#     and echoing arbitrary caller input back is not a fixed value.
#   - linked_domains, disposable, webmail and pattern are declared; the
#     Email Verifier's deprecated `result` field (deliverable/undeliverable/
#     risky, explicitly superseded by `status` in Hunter's own words) is not.
#   - Every route here is a GET. Leads, campaigns, the Combined Enrichment
#     Beta endpoint and every write are absent.
#   - 403 (rate limit) and 429 (usage limit) are declared with the status
#     and message Hunter's own status-code table gives verbatim; neither is
#     armed as a conformance case, because no worked JSON example anywhere
#     in Hunter's documentation shows the "id" value their {"errors":[...]}
#     envelope would carry, and this Recipe will not invent one for a field
#     every other error in this file quotes from a real response or a real
#     table row.
#
# Every case below not carrying a verified date was read from
# https://hunter.io/api-documentation/v2, fetched 2026-09-02, not observed
# against a real account -- this Recipe was written with no API key and
# created no account. Keys below are fixtures, not secrets.

recipe: hunterio
capability: crm
version: 0.1.0

upstream:
  api: v2
  docs: https://hunter.io/api-documentation/v2
  # Found by cauldron discover rather than recorded by hand. This
  # document declares all three routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://hunter.io/openapi.json
  spec_hash: 6765dc59e5904c0949c66a44f268644235a9240fa656295142dd25e66ce1d9c2
  spec_seen: "2026-09-05"

auth:
  scheme: query
  param: api_key
  keys:
    - cauldron0000000000000000000000

responses:
  resource:
    style: wrapped
    key: data
  error:
    style: list
    key: errors
    message_field: details
    code_field: code
    type_field: id

resources:
  person_match:
    id:
      style: opaque
      field: "-"
    fields:
      first_name:
        type: string
        null_when_unset: true
      last_name:
        type: string
        null_when_unset: true
      email:
        type: string
      # 0-100, documented as "estimation of the probability the email
      # address returned is correct" -- see the header for why Domain
      # Search's per-address equivalent is spelled "confidence" instead.
      score:
        type: integer
      domain:
        type: string
      accept_all:
        type: boolean
        default: false
      position:
        type: string
        null_when_unset: true
      twitter:
        type: string
        null_when_unset: true
      linkedin_url:
        type: string
        null_when_unset: true
      phone_number:
        type: string
        null_when_unset: true
      company:
        type: string
        null_when_unset: true
      sources:
        type: list
      # valid/accept_all/unknown -- distinct from score. See the header: a
      # high score and a non-valid status can and do co-exist for an
      # accept-all domain, and this is the field that says which is which.
      verification_status:
        type: string
        in: verification
        as: status
      verification_date:
        type: string
        null_when_unset: true
        in: verification
        as: date

  domain_search:
    id:
      style: opaque
      field: "-"
    fields:
      domain:
        type: string
      disposable:
        type: boolean
        default: false
      webmail:
        type: boolean
        default: false
      accept_all:
        type: boolean
        default: false
      pattern:
        type: string
        null_when_unset: true
      organization:
        type: string
        null_when_unset: true
      linked_domains:
        type: list
      # Each entry is {value, type, confidence, first_name, last_name,
      # position, ..., sources, verification} -- the same per-address shape
      # Email Finder returns for one address, opaque here because this
      # format has no way to declare a list field's own element schema.
      emails:
        type: list

  email_verification:
    id:
      style: opaque
      field: "-"
    fields:
      email:
        type: string
      # valid/invalid/accept_all/webmail/disposable/unknown -- see the
      # header for what "unknown" means and why it is the not-found-shaped
      # member of this set rather than a distinct HTTP outcome.
      status:
        type: string
      score:
        type: integer
      regexp:
        type: boolean
      gibberish:
        type: boolean
      disposable:
        type: boolean
      webmail:
        type: boolean
      mx_records:
        type: boolean
      smtp_server:
        type: boolean
      smtp_check:
        type: boolean
      accept_all:
        type: boolean
      block:
        type: boolean
      sources:
        type: list

routes:
  - method: GET
    path: /v2/email-finder
    resource: person_match
    operation: get
    # Real Hunter disambiguates by domain plus first_name/last_name (or
    # full_name) together; email is the output of this lookup, not an
    # input, so it cannot be the key. This Recipe's fixture holds one
    # candidate per domain and keys on that alone -- a real domain with two
    # plausible matches would need the name parameters this format has no
    # way to combine into one lookup key.
    id_from: query:domain
    lookup_by: domain
    headers:
      Content-Type: application/json; charset=utf-8

  - method: GET
    path: /v2/domain-search
    resource: domain_search
    operation: get
    id_from: query:domain
    lookup_by: domain
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      meta.results: 35
      meta.results_approximate: false
      meta.limit: 10
      meta.offset: 0

  - method: GET
    path: /v2/email-verifier
    resource: email_verification
    operation: get
    id_from: query:email
    lookup_by: email
    headers:
      Content-Type: application/json; charset=utf-8

errors:
  # The one message every absent, empty, junk-query-param and junk-header
  # credential answered, verified across all three routes below.
  authentication_error:
    status: 401
    type: authentication_failed
    code: "401"
    message: No user found for the API key supplied
    headers:
      Content-Type: application/json; charset=utf-8

  # A verb Hunter's app never registers for any path, whatever the
  # credential. Real status, per the header -- 404, not a synthesised 405 --
  # so no Allow header is computed for it either.
  method_not_allowed:
    status: 404
    type: not_found
    code: "404"
    message: The requested resource couldn't be found.

  # Struck live: the general worked example on hunter.io/api-documentation/v2
  # for a malformed request, quoted exactly.
  wrong_params:
    status: 400
    type: wrong_params
    code: "400"
    message: You are missing the domain parameter

  # Documented status and message, quoted verbatim from the HTTP Status Code
  # Summary table -- see the header for why this Recipe declares it without
  # arming a conformance case for it.
  rate_limit:
    status: 403
    message: You have reached the rate limit.

  # Documented status and message, quoted verbatim -- see the header for
  # why this is the usage-quota failure and not the rate limit, backwards
  # from what its status code usually means elsewhere in this collection.
  usage_limit:
    status: 429
    message: You have reached your usage limit. Upgrade your plan if necessary.

fixtures:
  empty: {}

  # alexis@reddit.com, patrick@stripe.com and intercom.com/ciaran@intercom.com
  # are Hunter's own published worked examples on
  # https://hunter.io/api-documentation/v2, copied field for field, not a
  # real lookup this Recipe performed.
  worked-examples:
    person_match:
      - email: alexis@reddit.com
        first_name: Alexis
        last_name: Ohanian
        score: 97
        domain: reddit.com
        accept_all: false
        position: Cofounder
        company: Reddit
        sources:
          - domain: redditblog.com
            uri: "http://redditblog.com/2008/10/22/widgets-get-an-upgrade-and-a-firefox-extension-that-will-rock-your-world"
            extracted_on: "2018-10-19"
            last_seen_on: "2021-05-18"
            still_on_page: true
        verification_status: valid
        verification_date: "2021-06-14"

    email_verification:
      - email: patrick@stripe.com
        status: valid
        score: 100
        regexp: true
        gibberish: false
        disposable: false
        webmail: false
        mx_records: true
        smtp_server: true
        smtp_check: true
        accept_all: false
        block: false
        sources:
          - domain: beta.paganresearch.io
            uri: "http://beta.paganresearch.io/details/stripe"
            extracted_on: "2020-06-17"
            last_seen_on: "2020-06-17"
            still_on_page: true

    domain_search:
      - domain: intercom.com
        disposable: false
        webmail: false
        accept_all: true
        pattern: "{first}"
        organization: Intercom
        linked_domains: []
        emails:
          - value: ciaran@intercom.com
            type: personal
            confidence: 92
            first_name: Ciaran
            last_name: Lee
            position: Support Engineer
            seniority: senior
            department: it
            decision_maker: false
            twitter: ciaran_lee
            sources:
              - domain: github.com
                uri: "http://github.com/ciaranlee"
                extracted_on: "2015-07-29"
                last_seen_on: "2017-07-01"
                still_on_page: true
            verification:
              date: "2019-12-06"
              status: valid

# Every case below carries source. A verified date means this Recipe called
# api.hunter.io with exactly the request shown and recorded exactly what came
# back; its absence means the case was read from
# https://hunter.io/api-documentation/v2 and never called.
conformance:
  - name: no api_key at all gets the same message a junk one does
    source: https://api.hunter.io/v2/domain-search
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?domain=intercom.com
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        "errors[0].id": authentication_failed
        "errors[0].code": 401
        "errors[0].details": No user found for the API key supplied

  - name: a junk api_key query parameter answers identically
    source: https://api.hunter.io/v2/domain-search
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?domain=intercom.com&api_key=junk12345
    expect:
      status: 401
      body:
        "errors[0].id": authentication_failed

  - name: and so does a junk Authorization Bearer header on a different route
    source: https://api.hunter.io/v2/email-finder
    verified: "2026-09-02"
    fixture: worked-examples
    request:
      method: GET
      path: /v2/email-finder?domain=reddit.com&first_name=Alexis&last_name=Ohanian
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        "errors[0].id": authentication_failed

  - name: a verb this app never registers 404s instead, with no credential examined
    # Struck live with no credential at all, against a real path: PUT,
    # PATCH and DELETE on /v2/domain-search each answered this exact body,
    # never the 401 above. Reaching this same body through Cauldron needs a
    # credential this Recipe holds, because a wrong one is intercepted
    # before routing is ever attempted here -- see the header. That
    # combination -- a valid key on a verb Hunter never registers -- was
    # never sent to the live API, so this case carries no verified date even
    # though the body it asserts is the literal one observed.
    source: https://api.hunter.io/v2/domain-search
    fixture: worked-examples
    request:
      method: DELETE
      path: /v2/domain-search?domain=intercom.com&api_key=cauldron0000000000000000000000
    expect:
      status: 404
      body:
        "errors[0].id": not_found
        "errors[0].details": The requested resource couldn't be found.

  - name: a domain search wraps the match under data, confidence not score
    source: https://hunter.io/api-documentation/v2
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?domain=intercom.com&api_key=cauldron0000000000000000000000
    expect:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        "data.domain": intercom.com
        "data.organization": Intercom
        "data.pattern": "{first}"
        "data.emails[0].value": ciaran@intercom.com
        "data.emails[0].confidence": 92
        "meta.results": 35
        "meta.results_approximate": false
      absent:
        - "data.emails[0].score"
        - domain
        - emails

  - name: an email finder match names the same measurement score instead
    source: https://hunter.io/api-documentation/v2
    fixture: worked-examples
    request:
      method: GET
      path: /v2/email-finder?domain=reddit.com&first_name=Alexis&last_name=Ohanian&api_key=cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "data.email": alexis@reddit.com
        "data.score": 97
        "data.verification.status": valid
      absent:
        - "data.confidence"
        - "data.verification.confidence"

  - name: email verifier reports score and verification status as two separate answers
    source: https://hunter.io/api-documentation/v2
    fixture: worked-examples
    request:
      method: GET
      path: /v2/email-verifier?email=patrick@stripe.com&api_key=cauldron0000000000000000000000
    expect:
      status: 200
      body:
        "data.status": valid
        "data.score": 100
        "data.smtp_check": true
        "data.accept_all": false

  - name: a malformed request is a real 400, quoted from the published worked example
    source: https://hunter.io/api-documentation/v2
    arm: wrong_params
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?api_key=cauldron0000000000000000000000
    expect:
      status: 400
      body:
        "errors[0].id": wrong_params
        "errors[0].details": You are missing the domain parameter

  - name: 403 is the rate limit, documented rather than triggered
    source: https://hunter.io/api-documentation/v2
    arm: rate_limit
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?domain=intercom.com&api_key=cauldron0000000000000000000000
    expect:
      status: 403

  - name: 429 is the usage quota, not the rate limit -- documented rather than triggered
    source: https://hunter.io/api-documentation/v2
    arm: usage_limit
    fixture: worked-examples
    request:
      method: GET
      path: /v2/domain-search?domain=intercom.com&api_key=cauldron0000000000000000000000
    expect:
      status: 429

  # The names. This Recipe declares 3 field(s) on a domain_search that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a domain_search carries the field names this Recipe declares"
    source: "https://hunter.io/api-documentation/v2"
    fixture: worked-examples
    request:
      method: GET
      path: "/v2/domain-search"
      query:
        "domain": "intercom.com"
        "api_key": "cauldron0000000000000000000000"
    expect:
      status: 200
      body:
        "data.disposable": false
        "data.webmail": false

  # The names. This Recipe declares 8 field(s) on a email_verification
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 7 name(s) that came back at the paths they came
  # back under.
  - name: "an email_verification carries the field names this Recipe declares"
    source: "https://hunter.io/api-documentation/v2"
    fixture: worked-examples
    request:
      method: GET
      path: "/v2/email-verifier"
      query:
        "email": "patrick@stripe.com"
        "api_key": "cauldron0000000000000000000000"
    expect:
      status: 200
      body:
        "data.block": false
        "data.disposable": false
        "data.gibberish": false
        "data.mx_records": true
        "data.regexp": true
        "data.smtp_server": true
        "data.webmail": false

  # The names. This Recipe declares 9 field(s) on a person_match that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 5 name(s) that came back at the paths they came back
  # under.
  - name: "a person_match carries the field names this Recipe declares"
    source: "https://hunter.io/api-documentation/v2"
    fixture: worked-examples
    request:
      method: GET
      path: "/v2/email-finder"
      query:
        "domain": "reddit.com"
        "first_name": "Alexis"
        "last_name": "Ohanian"
        "api_key": "cauldron0000000000000000000000"
    expect:
      status: 200
      body:
        "data.company": "Reddit"
        "data.verification.date": "2021-06-14"
        "data.first_name": "Alexis"
        "data.last_name": "Ohanian"
        "data.position": "Cofounder"

  # The names. This Recipe declares 1 field(s) on an email_verification
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "an email_verification carries the field names this Recipe declares, and 1 more of them"
    source: "https://hunter.io/api-documentation/v2"
    fixture: worked-examples
    request:
      method: GET
      path: "/v2/email-verifier"
      query:
        "email": "patrick@stripe.com"
        "api_key": "cauldron0000000000000000000000"
    expect:
      status: 200
      body:
        "data.sources[0].domain": "beta.paganresearch.io"

  # The names. This Recipe declares 4 field(s) on a person_match that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
