# GBIF species match Recipe for Cauldron
#
# A name it could not find comes back at a hundred per cent confidence.
#
#   GET /v1/species/match?name=Zzzznotaspeciesxyz
#   ->  200  {"confidence": 100, "matchType": "NONE", "synonym": false}
#
# Three fields and a 200. confidence is 100 -- the highest the scale goes -- on
# the one answer that found nothing, so code ranking results by confidence puts
# the failures first. Every real match scores lower: an exact one is 99, a fuzzy
# one 95, a genus standing in for a species 94.
#
# **And "synonym" is present only when nothing was found.** The no-match carries
# synonym: false. The response whose status actually is "SYNONYM" does not carry
# the field at all. The one key named for the concept appears exactly where the
# concept does not apply and is absent where it does.
#
# Written against the live API rather than a document: every case below was
# checked against api.gbif.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A deprecated name matches EXACTly. Felis concolor is what cougars were
#      called until 1993; asking for it answers matchType "EXACT" with
#      confidence 98 and status "SYNONYM". The match is exact because the string
#      exactly matched a name nobody should use.
#   2. And that response carries two keys for two different taxa. usageKey is
#      2435104, the synonym; speciesKey and acceptedUsageKey are both 2435099,
#      the accepted species. The field with the plainest name is the one not to
#      store.
#   3. A misspelled species silently becomes a genus. Puma notaspecies answers
#      matchType "HIGHERRANK" at confidence 94, rank "GENUS", scientificName
#      "Puma Jardine, 1834" -- and a client printing scientificName prints a
#      genus and an 1834 authorship as though they were the species asked for.
#   4. A typo is corrected without saying what changed. Puma concolour answers
#      matchType "FUZZY" at 95 with the corrected name and no record of the
#      input, so nothing in the response can be shown to a user as "did you
#      mean".
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The backbone taxonomy is served rather than matched. A real request runs a
#     fuzzy matcher over ten million names with rank and classification hints;
#     this Recipe answers with the names its fixture holds.
#   - The /v1/species, /v1/occurrence and /v1/dataset endpoints are not
#     modelled, and the classification keys here point into them.
#   - A request with no name parameter at all is stated rather than served. It
#     answers the same 200 with confidence 100 and matchType NONE, plus a
#     note: "No name given" -- so a forgotten parameter and a name nobody uses
#     are the same answer, one of them with prose attached. The match route is
#     addressed by the name in the query string, and an absent parameter
#     addresses nothing, so no case here can send it.
#
# The names below are public and were recorded on the date in the cases.

recipe: gbif
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://techdocs.gbif.org/en/openapi/

auth:
  # Public for reading.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # A Java parser's own exception text, in plain prose.
    style: text

resources:
  match:
    id:
      style: opaque
      # The name in the query string, which is never echoed: what comes back is
      # the name the matcher settled on.
      field: "-"
      carried_by: canonicalName
    fields:
      # The matched taxon, which on a synonym is the one not to use.
      usageKey:
        type: integer
      # The one to use, on the responses that have it.
      acceptedUsageKey:
        type: integer
      scientificName:
        type: string
      canonicalName:
        type: string
      rank:
        type: string
      status:
        type: string
      # 100 on the answer that found nothing.
      confidence:
        type: integer
      # EXACT, FUZZY, HIGHERRANK or NONE.
      matchType:
        type: string
      # Present only when nothing was found.
      synonym:
        type: boolean
      kingdom:
        type: string
      phylum:
        type: string
      class:
        type: string
      order:
        type: string
      family:
        type: string
      genus:
        type: string
      species:
        type: string
      speciesKey:
        type: integer
      genusKey:
        type: integer

routes:
  - method: GET
    path: /v1/species/match
    resource: match
    operation: get
    id_from: query:name

  # /v1/species/{key} takes an integer, so a path segment that is not one is
  # handed to a number parser and the parser's exception becomes the response.
  - method: GET
    path: /v1/species/notarealendpoint
    error: not_a_number

errors:
  not_a_number:
    status: 400
    headers:
      Content-Type: text/plain
    # Java's NumberFormatException, verbatim, on a JSON API.
    message: 'For input string: "notarealendpoint"'

fixtures:
  empty: {}

  # A name nothing in ten million matches.
  nothing:
    match:
      - id: Zzzznotaspeciesxyz
        # The highest the scale goes, on the worst answer it gives.
        confidence: 100
        matchType: NONE
        # And here is the field, on the one response where it means nothing.
        synonym: false


  backbone:
    match:
      - id: Puma concolor
        usageKey: 2435099
        scientificName: Puma concolor (Linnaeus, 1771)
        canonicalName: Puma concolor
        rank: SPECIES
        status: ACCEPTED
        # Lower than the no-match above.
        confidence: 99
        matchType: EXACT
        kingdom: Animalia
        phylum: Chordata
        class: Mammalia
        order: Carnivora
        family: Felidae
        genus: Puma
        species: Puma concolor
        speciesKey: 2435099
        genusKey: 2435098

      # What cougars were called until 1993. The match is exact and the name is
      # deprecated.
      - id: Felis concolor
        # The synonym.
        usageKey: 2435104
        # The species. Two keys, two taxa, one response.
        acceptedUsageKey: 2435099
        scientificName: Felis concolor Linnaeus, 1771
        canonicalName: Felis concolor
        rank: SPECIES
        status: SYNONYM
        confidence: 98
        # Exact, because the string exactly matched a name nobody should use.
        matchType: EXACT
        kingdom: Animalia
        phylum: Chordata
        class: Mammalia
        order: Carnivora
        family: Felidae
        genus: Puma
        # The accepted name, under a key that is not usageKey.
        species: Puma concolor
        speciesKey: 2435099
        genusKey: 2435098

      # A misspelled species, answered with its genus.
      - id: Puma notaspecies
        usageKey: 2435098
        scientificName: Puma Jardine, 1834
        canonicalName: Puma
        # Not SPECIES.
        rank: GENUS
        status: ACCEPTED
        confidence: 94
        matchType: HIGHERRANK
        kingdom: Animalia
        phylum: Chordata
        class: Mammalia
        order: Carnivora
        family: Felidae
        genus: Puma
        genusKey: 2435098

      # A typo, corrected silently.
      - id: Puma concolour
        usageKey: 2435099
        scientificName: Puma concolor (Linnaeus, 1771)
        canonicalName: Puma concolor
        rank: SPECIES
        status: ACCEPTED
        confidence: 95
        matchType: FUZZY
        kingdom: Animalia
        phylum: Chordata
        class: Mammalia
        order: Carnivora
        family: Felidae
        genus: Puma
        species: Puma concolor
        speciesKey: 2435099
        genusKey: 2435098

conformance:
  - name: a name it could not find comes back at full confidence
    source: https://api.gbif.org/v1/species/match?name=Zzzznotaspeciesxyz
    verified: "2026-08-28"
    fixture: nothing
    request:
      method: GET
      path: /v1/species/match?name=Zzzznotaspeciesxyz
    expect:
      # 100 is the highest the scale goes, and every real match below scores
      # lower, so ranking results by confidence puts the failures first.
      status: 200
      body:
        confidence: 100
        matchType: NONE
        synonym: false
      absent:
        - usageKey
        - scientificName
        - rank

  - name: and an exact match scores lower than the failure
    source: https://api.gbif.org/v1/species/match?name=Puma concolor
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Puma concolor
    expect:
      status: 200
      body:
        confidence: 99
        matchType: EXACT
        status: ACCEPTED
        usageKey: 2435099
      absent:
        # The field that would say so is missing on every match.
        - synonym

  - name: a deprecated name matches exactly
    source: https://api.gbif.org/v1/species/match?name=Felis concolor
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Felis concolor
    expect:
      status: 200
      body:
        # The match is exact because the string exactly matched a name nobody
        # should use, and the status is the only thing that says so.
        matchType: EXACT
        confidence: 98
        status: SYNONYM
        canonicalName: Felis concolor
        # The authorship without parentheses, which in zoological nomenclature
        # means the species is still in the genus it was described in -- on a
        # name that has not been for thirty years.
        scientificName: Felis concolor Linnaeus, 1771
      absent:
        # And the key named for the concept is not here.
        - synonym

  - name: and it carries two keys for two different taxa
    source: https://api.gbif.org/v1/species/match?name=Felis concolor
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Felis concolor
    expect:
      status: 200
      body:
        # usageKey is the synonym. The field with the plainest name is the one
        # not to store.
        usageKey: 2435104
        acceptedUsageKey: 2435099
        speciesKey: 2435099
        species: Puma concolor

  - name: a misspelled species silently becomes a genus
    source: https://api.gbif.org/v1/species/match?name=Puma notaspecies
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Puma notaspecies
    expect:
      status: 200
      body:
        # A client printing scientificName prints a genus and an 1834
        # authorship as though they were the species it asked for.
        matchType: HIGHERRANK
        confidence: 94
        rank: GENUS
        scientificName: Puma Jardine, 1834
        status: ACCEPTED
      absent:
        - species
        - speciesKey

  - name: a typo is corrected without saying what changed
    source: https://api.gbif.org/v1/species/match?name=Puma concolour
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Puma concolour
    expect:
      status: 200
      body:
        # Nothing in the response records the input, so nothing here can be
        # shown to a user as "did you mean".
        matchType: FUZZY
        confidence: 95
        canonicalName: Puma concolor
        rank: SPECIES

  - name: the classification arrives flattened beside its keys
    source: https://api.gbif.org/v1/species/match?name=Puma concolor
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/match?name=Puma concolor
    expect:
      status: 200
      body:
        # Seven ranks as top-level strings and their keys as separate
        # top-level integers, rather than one list of {rank, name, key}.
        kingdom: Animalia
        class: Mammalia
        family: Felidae
        genus: Puma
        genusKey: 2435098
        speciesKey: 2435099


  - name: a path segment that is not a number leaks the parser's exception
    source: https://api.gbif.org/v1/species/notarealendpoint
    verified: "2026-08-28"
    fixture: backbone
    request:
      method: GET
      path: /v1/species/notarealendpoint
    expect:
      # /v1/species/{key} takes an integer key, so the segment was handed to a
      # number parser and Java's NumberFormatException text came back as the
      # body -- in plain prose, from an API whose every success is JSON.
      status: 400
      headers:
        Content-Type: text/plain
      body_matches: '^For input string: "notarealendpoint"$'
