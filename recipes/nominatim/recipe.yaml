# Nominatim Recipe for Cauldron
#
# Nothing found is an empty array here and an error object there, and both are
# 200.
#
#   GET /search?q=zzzznotarealplacexyz&format=jsonv2   ->  200  []
#   GET /reverse?lat=0&lon=0&format=jsonv2             ->  200  {"error":
#                                                                "Unable to
#                                                                 geocode"}
#
# Same service, same format parameter, same status, and two different answers to
# the same question. The reverse one is the expensive shape: an object with an
# error key where an object of results should be, so response.lat is undefined
# and there is no status anywhere to branch on. Code that reads the answer
# without checking gets undefined; code that checks response.ok gets true.
#
# **And search answers with an array while reverse answers with a bare object.**
# Not an array of one -- an object. So the two endpoints of one geocoder cannot
# share a parser, and the difference is not in the format parameter, which says
# jsonv2 in both.
#
# Written against the live API rather than a document: every case below was
# checked against nominatim.openstreetmap.org on the date in its verified field.
#
# Six more the Recipe pins:
#
#   1. A request without a User-Agent is refused, in plain text, from an
#      endpoint that was asked for JSON: 403 and the single line
#      "Access denied. See https://operations.osmfoundation.org/policies/
#      nominatim/". Most HTTP clients send a User-Agent; fetch in a browser
#      and some server-side libraries do not, and this is the first thing an
#      integration hits.
#   2. lat and lon are strings. "43.6425637", not 43.6425637, so arithmetic on
#      them concatenates and a comparison sorts lexically.
#   3. boundingbox is four strings in the order south, north, west, east --
#      that is minlat, maxlat, minlon, maxlon. It is neither GeoJSON's
#      [west, south, east, north] nor a pair of coordinates in sequence, so
#      every conversion has to be written out by hand.
#   4. The keys of address depend on the place. A restaurant has amenity,
#      house_number, road, neighbourhood and quarter; somewhere rural has none
#      of them. And one key carries an administrative level inside its own
#      name: ISO3166-2-lvl4, where the 4 is the depth at which that country
#      keeps its subdivisions and is 3 or 6 elsewhere. So the key to read is
#      not knowable in advance.
#   5. importance arrives in scientific notation. 8.130235751883753e-05 is a
#      JSON number and correct, and anything printing it into a template or a
#      URL writes "8.130235751883753e-5".
#   6. place_id is local to the installation. It changes when the database is
#      rebuilt and differs between mirrors; osm_type and osm_id together are
#      the stable identity, and they are two fields rather than one.
#
# One more, not a shape but the reason a lot of results look wrong: reverse
# geocoding the CN Tower's coordinates answers with the restaurant inside it.
# The nearest node beats the containing way, so the name that comes back is the
# most specific thing at the point rather than the thing anyone would name.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The gazetteer is served rather than searched. A real request parses the
#     query, ranks candidates and applies viewbox, countrycodes and layer
#     filters; this Recipe answers with the places its fixture holds, the same
#     reading recorded for Google Drive's q and Maven Central's Solr
#     expressions.
#   - The usage policy is not modelled. The public instance allows one request
#     a second, refuses bulk use, and blocks by User-Agent; only the missing
#     User-Agent is served, because a rate limit is not a response shape.
#   - Only format=jsonv2 is served. The xml, json, geojson and geocodejson
#     formats each answer a different document, and geojson in particular
#     renames almost everything.
#
# The places below are public and were recorded on the date in the cases.

recipe: nominatim
capability: infrastructure
version: 0.1.0

upstream:
  api: nominatim
  docs: https://nominatim.org/release-docs/latest/api/Overview/

auth:
  # Public, and no key at all -- but see required_headers below.
  scheme: none

required_headers:
  # The public instance refuses a request that does not identify itself, and
  # says so in plain text.
  User-Agent:
    error: access_denied

responses:
  resource:
    style: bare
  list:
    # A bare array. reverse answers a bare object instead.
    style: bare
  error:
    style: flat
    message_field: error

resources:
  place:
    id:
      style: numeric
      # Local to the installation: it changes when the database is rebuilt.
      # osm_type and osm_id together are the stable identity.
      field: place_id
      type: number
    fields:
      licence:
        type: string
      # The stable pair, in two fields.
      osm_type:
        type: string
      osm_id:
        type: integer
      # Strings, both of them.
      lat:
        type: string
      lon:
        type: string
      category:
        type: string
      type:
        type: string
      place_rank:
        type: integer
      # In scientific notation when it is small enough.
      importance:
        type: number
      addresstype:
        type: string
      name:
        type: string
      display_name:
        type: string
      # Keys that depend on the place, one of them carrying an administrative
      # level inside its own name.
      address:
        type: map
      # Four strings: south, north, west, east.
      boundingbox:
        type: list

routes:
  - method: GET
    path: /search
    resource: place
    operation: list

    pagination:
      # limit, and no position. Struck live on 2026-09-05: ?q=london answers
      # three results and ?limit=2 answers two, so the size is read -- and
      # there is nothing to ask for a second page with, because a geocoder
      # answers the best matches rather than a walkable collection.
      #
      # "-" says the provider takes no name for a position. The runtime was
      # reading "cursor".
      style: cursor
      limit: 10
      limit_param: limit
      cursor_param: "-"
  - method: GET
    path: /reverse
    resource: place
    operation: get
    id_from: query:place_id

errors:
  access_denied:
    status: 403
    # Plain prose, where every other answer here is JSON.
    style: text
    headers:
      Content-Type: text/plain; charset=utf-8
    # One line, no JSON, from a request that said format=jsonv2.
    message: Access denied. See https://operations.osmfoundation.org/policies/nominatim/

  # A 200. The only failure in this collection that is not a failure status.
  ungeocodable:
    status: 200
    message: Unable to geocode

fixtures:
  empty: {}

  toronto:
    place:
      # /search?q=CN+Tower
      - id: "352931986"
        licence: Data © OpenStreetMap contributors, ODbL 1.0. http://osm.org/copyright
        osm_type: way
        osm_id: 32742038
        # Strings.
        lat: "43.6425637"
        lon: "-79.3870872"
        category: man_made
        type: tower
        place_rank: 30
        importance: 0.502218163087928
        addresstype: man_made
        name: CN Tower
        display_name: CN Tower, 290, Bremner Boulevard, Harbourfront-CityPlace, Downtown, Toronto, Golden Horseshoe, Ontario, M5V 3L9, Canada
        # south, north, west, east -- minlat, maxlat, minlon, maxlon.
        boundingbox:
          - "43.6423338"
          - "43.6427965"
          - "-79.3874416"
          - "-79.3867985"

  # /reverse?lat=43.6426&lon=-79.3871 -- the restaurant inside the tower.
  point:
    place:
      - id: "351544610"
        licence: Data © OpenStreetMap contributors, ODbL 1.0. http://osm.org/copyright
        # A node, where the search above found a way.
        osm_type: node
        osm_id: 11026053456
        lat: "43.6425825"
        lon: "-79.3870640"
        category: amenity
        type: restaurant
        place_rank: 30
        # Scientific notation.
        importance: 8.130235751883753e-05
        addresstype: amenity
        name: 360 Restaurant
        display_name: 360 Restaurant, 290, Bremner Boulevard, Harbourfront-CityPlace, Downtown, Toronto, Golden Horseshoe, Ontario, M5V 3L9, Canada
        address:
          amenity: 360 Restaurant
          house_number: "290"
          road: Bremner Boulevard
          neighbourhood: Harbourfront-CityPlace
          quarter: Downtown
          city: Toronto
          state_district: Golden Horseshoe
          state: Ontario
          # The 4 is the administrative depth at which Canada keeps its
          # subdivisions, and it is 3 or 6 in other countries.
          ISO3166-2-lvl4: CA-ON
          postcode: M5V 3L9
          country: Canada
          country_code: ca
        boundingbox:
          - "43.6425325"
          - "43.6426325"
          - "-79.3871140"
          - "-79.3870140"

conformance:
  - name: a search that matches nothing is an empty array and a 200
    source: https://nominatim.openstreetmap.org/search?q=zzzznotarealplacexyz&format=jsonv2
    verified: "2026-08-28"
    fixture: empty
    request:
      method: GET
      path: /search?q=zzzznotarealplacexyz&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      # An empty array. The reverse endpoint answers the same question with an
      # object instead.
      status: 200
      absent:
        - "[0]"

  - name: and a reverse that matches nothing is an error object and a 200
    source: https://nominatim.openstreetmap.org/reverse?lat=0&lon=0&format=jsonv2
    verified: "2026-08-28"
    fixture: point
    arm: ungeocodable
    request:
      method: GET
      path: /reverse?lat=0&lon=0&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      # An object with an error key where an object of results should be, so
      # response.lat is undefined and response.ok is true.
      status: 200
      body:
        error: Unable to geocode

  - name: search answers with an array and reverse with a bare object
    source: https://nominatim.openstreetmap.org/reverse?lat=43.6426&lon=-79.3871&format=jsonv2
    verified: "2026-08-28"
    fixture: point
    request:
      method: GET
      path: /reverse?place_id=351544610&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # Not an array of one. The format parameter says jsonv2 on both.
        place_id: 351544610
        name: 360 Restaurant
      absent:
        - "[0]"

  - name: latitude and longitude are strings
    source: https://nominatim.openstreetmap.org/search?q=CN+Tower&format=jsonv2&limit=1
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /search?q=CN+Tower&format=jsonv2&limit=1
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # Arithmetic on these concatenates and comparison sorts lexically.
        "[0].lat": "43.6425637"
        "[0].lon": "-79.3870872"
        "[0].osm_type": way
        "[0].osm_id": 32742038
        # And the thing the search found is the tower itself, where the
        # reverse below finds the restaurant inside it.
        "[0].name": CN Tower
        "[0].category": man_made
        "[0].importance": 0.502218163087928

  - name: the bounding box is four strings, south north west east
    source: https://nominatim.openstreetmap.org/search?q=CN+Tower&format=jsonv2&limit=1
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /search?q=CN+Tower&format=jsonv2&limit=1
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # minlat, maxlat, minlon, maxlon -- neither GeoJSON's order nor a pair
        # of coordinates in sequence.
        "[0].boundingbox[0]": "43.6423338"
        "[0].boundingbox[1]": "43.6427965"
        "[0].boundingbox[2]": "-79.3874416"
        "[0].boundingbox[3]": "-79.3867985"

  - name: the address keys depend on the place, and one holds a level number
    source: https://nominatim.openstreetmap.org/reverse?lat=43.6426&lon=-79.3871&format=jsonv2
    verified: "2026-08-28"
    fixture: point
    request:
      method: GET
      path: /reverse?place_id=351544610&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # The 4 is the administrative depth at which Canada keeps its
        # subdivisions; elsewhere the key is lvl3 or lvl6, so the key to read
        # is not knowable in advance.
        "address.ISO3166-2-lvl4": CA-ON
        "address.quarter": Downtown
        "address.house_number": "290"
        "address.country_code": ca

  - name: importance arrives in scientific notation
    source: https://nominatim.openstreetmap.org/reverse?lat=43.6426&lon=-79.3871&format=jsonv2
    verified: "2026-08-28"
    fixture: point
    request:
      method: GET
      path: /reverse?place_id=351544610&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # Correct JSON, and anything printing it into a template writes
        # "8.130235751883753e-5".
        importance: 8.130235751883753e-05
        place_rank: 30

  - name: the nearest node beats the containing way
    source: https://nominatim.openstreetmap.org/reverse?lat=43.6426&lon=-79.3871&format=jsonv2
    verified: "2026-08-28"
    fixture: point
    request:
      method: GET
      path: /reverse?place_id=351544610&format=jsonv2
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # Reverse geocoding the CN Tower's own coordinates answers with the
        # restaurant inside it: a node, where the search answers a way.
        osm_type: node
        name: 360 Restaurant
        category: amenity
        type: restaurant

  - name: a request that does not identify itself is refused in plain text
    source: https://nominatim.openstreetmap.org/search?q=CN+Tower&format=jsonv2&limit=1
    verified: "2026-08-28"
    fixture: toronto
    request:
      method: GET
      path: /search?q=CN+Tower&format=jsonv2&limit=1
    expect:
      # 403, one line, no JSON, from a request that said format=jsonv2.
      status: 403
      headers:
        Content-Type: text/plain; charset=utf-8
      body_matches: '^Access denied\. See https://operations\.osmfoundation\.org/policies/nominatim/$'

  # The names. This Recipe declares 3 field(s) on a place that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a place carries the field names this Recipe declares"
    source: "https://nominatim.openstreetmap.org/search?q=CN+Tower&format=jsonv2&limit=1"
    fixture: toronto
    request:
      method: GET
      path: "/search"
      query:
        "q": "CN+Tower"
        "format": "jsonv2"
        "limit": "1"
      headers:
        "User-Agent": "cauldron-recipe-research/0.1"
    expect:
      status: 200
      body:
        "[0].addresstype": "man_made"
        "[0].display_name": "CN Tower, 290, Bremner Boulevard, Harbourfront-CityPlace, Downtown, Toronto, Golden Horseshoe, Ontario, M5V 3L9, Canada"
        "[0].licence": "Data \u00a9 OpenStreetMap contributors, ODbL 1.0. http://osm.org/copyright"

