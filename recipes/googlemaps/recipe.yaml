# Google Maps Platform (Geocoding API) Recipe for Cauldron
#
# Struck live, today, with no account and no real key ever created. Nothing
# below geocodes a real address: the one address this Recipe answers with a
# real result is Google's own published worked example, quoted verbatim from
# its documentation, and every probe against the live host used either that
# exact string or a deliberately meaningless one
# ("nonexistentplacequery12345xyz").
#
# **The API answers 200 and puts the real outcome inside the body, in a
# field called status -- but only once a request has already cleared a
# completely different, ordinary-HTTP layer in front of it.** Two layers,
# not one, and they disagree about almost everything:
#
#   GET /maps/api/geocode/json?address=nonexistentplacequery12345xyz
#     no key at all      -> 200, {"error_message":"You must use an API key to
#                            authenticate each request to Google Maps Platform
#                            APIs. For additional information, please refer to
#                            http://g.co/dev/maps-no-account","results":[],
#                            "status":"REQUEST_DENIED"}
#     key=junkjunkjunk12345
#                         -> 200, {"error_message":"The provided API key is
#                            invalid. ","results":[],"status":"REQUEST_DENIED"}
#   GET /maps/api/nosuchendpoint/json          -> 404, real HTTP status,
#                                                  Google's own stock HTML
#                                                  error page, credential or not
#   PATCH /maps/api/geocode/json               -> 405, the identical HTML
#                                                  shape, naming the method
#                                                  and path in the page itself
#
# The first layer -- call it the application -- never answers anything but
# 200. Every failure it can produce, including "you sent no credential at
# all," is a JSON body under a success status line, exactly the shape this
# collection already records for Expensify and VWO, and worth setting beside
# both because Google occupies neither of their positions:
#
#   - Expensify's own move is total: HTTP status is 200 on every failure this
#     API can produce, without exception -- a bad credential, a malformed
#     request, an unsupported action, all the same status line, all the way
#     down. Nothing on that host ever answers a real 4xx.
#   - VWO's 200-wearing-failure is narrower and specific: only a wrong
#     *version segment* in the path gets the 200 treatment
#     ({"API_ERROR":"INCORRECT_API_VERSION",...} at HTTP 200); a bad
#     credential on a real path gets a genuine 401, and a genuinely unrouted
#     path gets a genuine 404.
#   - Google Maps sits between them. A bad or missing key gets the 200
#     treatment, same as Expensify's total collapse -- but a route Google
#     does not have, or a method it does not accept on one it does, gets a
#     real 404 or 405 from an entirely different piece of software (Google's
#     own front-end web server, serving its stock "That's an error" page),
#     the same shape VWO reserves for genuine routing misses. So the split
#     this Recipe's group was sent to find -- when does the status line tell
#     the truth -- runs along the *same* boundary Cauldron's own routing
#     already has a name for: routing wins the 200, credential loses it.
#
# **Absent and wrong key are not the same sentence, even though they are the
# same status enum value and the same HTTP status.** Both above are
# "status":"REQUEST_DENIED" at 200; the only place they differ at all is
# error_message, word for word -- and the wrong-key sentence carries its own
# small, quotable oddity: "The provided API key is invalid. " ends in a
# trailing space, verbatim, checked twice to rule out a transcription slip.
# A client that branches on status alone cannot tell these two apart; one
# that reads error_message can.
#
# **Body validation beats the credential, and neither ever produces the JSON
# status field's REQUEST_DENIED shape for it.** Checked live: no key and no
# address parameter at all answers 400 INVALID_REQUEST -- a *real* non-200
# HTTP status this time, still JSON, still inside the application layer --
# and a junk key with no address answers the identical 400 INVALID_REQUEST,
# not REQUEST_DENIED. So on this one host, missing the required parameter
# outranks a missing or wrong credential, which is the mirror image of the
# case this Recipe otherwise makes (routing beats credential): here it is
# request-shape validation that beats the credential, one layer further in.
# Not modelled as a route: this format has no mechanism for "a query
# parameter must be present, checked before the credential and independently
# of it" the way it has one for required *headers* (RequiredHeader, checked
# with the credential rather than the router) -- inventing a fourth layer
# to capture one more ordering was judged not worth the row of routing
# priority it would cost the finding this Recipe was actually sent to make.
# Stated here, live-verified, rather than forced.
#
# **The 200-vs-not split lands exactly on Cauldron's own AfterRouting
# boundary**, which is why this Recipe can set it and mean it structurally
# rather than only in prose. after_routing: true reproduces, organically and
# without arming anything: an unrouted path 404s and a wrong method 405s
# with no credential ever examined (verified with no key and, separately,
# with a junk one -- byte-identical either way), and only once the path and
# method are both right does the credential get looked at, landing on the
# 200-wearing-REQUEST_DENIED shape rather than a transport-level refusal.
#
# **Content-Type tells the truth throughout the application layer and stops
# telling it the moment the front-end server answers instead.** Every 200
# and every application-level 400 announces application/json; charset=UTF-8
# and means it. The 404 and 405 pages announce text/html; charset=UTF-8 --
# also true, also honest, and a third content type on the same host from a
# client's point of view, because nothing about the URL or the documented
# API suggests HTML is ever coming back.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no real key was ever requested,
#     guessed or used. The two 200-with-results cases below (OK and
#     ZERO_RESULTS) and the OVER_QUERY_LIMIT case are read from Google's own
#     published Geocoding API reference and carry no `verified:` date; every
#     REQUEST_DENIED, INVALID_REQUEST-adjacent finding above, and every
#     404/405 case below was struck live today and does.
#   - The one address this Recipe resolves to a real result is
#     "1600 Amphitheatre Parkway, Mountain View, CA" -- Google's own worked
#     example, quoted verbatim including its coordinates, place_id and
#     formatted address. Every other address this emulator is asked about
#     answers ZERO_RESULTS, which is both the honest limit of what a Recipe
#     with no real geocoding can offer and the documented, correct answer
#     for "the geocode was successful but returned no results."
#   - address_components, viewport and every field of geometry beyond
#     location and location_type are real, documented, and not modelled.
#     Of roughly a dozen fields on a geocoding result this Recipe declares
#     five.
#   - Reverse geocoding (?latlng=...), place_id lookup (?place_id=...), the
#     components filter and every other Google Maps Platform product
#     (Places, Directions, Distance Matrix, Address Validation -- see
#     googleaddress/recipe.yaml, which uses a completely different
#     credential mechanism, X-Goog-Api-Key as a header rather than key as a
#     query parameter, on the same platform) are out of scope. This Recipe
#     is about the one question its group was sent to answer.
#   - OVER_QUERY_LIMIT is documented ("indicates that you are over your
#     quota") and never triggered -- there is no real quota to exceed with no
#     account. No error_message is claimed for it: Google's own reference
#     states what the status means and shows no worked error_message beside
#     it, so none is invented.
#   - The 404 and 405 HTML pages are Google's own stock front-end error
#     pages, quoted here for their stable parts only -- the title and the
#     one sentence naming the path or the method -- the same trim
#     pdfmonkey/recipe.yaml applies to Rails' default 404 page. The
#     surrounding CSS, the Google logo styling and the "robot.png" reference
#     are real, present on every response, and not reproduced.
#   - The Geocoding API is not documented as paging at all: it answers
#     whatever matched, once. That used to be stated here and left
#     undeclared, which meant Cauldron's own default applied anyway -- page
#     at ten, reading a "limit" parameter Google does not accept. Both
#     routes now declare style: none.
#
# The key below is a fixture and belongs to no Google Cloud project.

recipe: googlemaps
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.google.com/maps/documentation/geocoding/overview

auth:
  scheme: query
  param: key
  keys:
    - AIza-cauldron-fixture-key
  absent_error: request_denied_no_key
  rejected_error: request_denied_bad_key
  # Routing wins the 200 -- see the header. Verified with no credential and,
  # separately, with a junk one: both a genuinely unrouted path and a wrong
  # method on a real one answer the identical HTML page either way.
  after_routing: true

responses:
  list:
    style: wrapped
  resource:
    style: bare
  # {"error_message": "...", ...}, at HTTP 200 for a credential failure --
  # see the errors table below, where each REQUEST_DENIED entry overrides
  # the status to 200 explicitly. No "code" anywhere on this host.
  error:
    style: flat
    message_field: error_message
    code_field: "-"

resources:
  geocode_result:
    collection: results
    id:
      style: opaque
      field: place_id
    fields:
      formatted_address:
        type: string
      types:
        type: list
      # geometry.location.{lat,lng} and geometry.location_type -- the part of
      # a much larger, real geometry object (viewport, bounds) this Recipe
      # declares. See the header.
      lat:
        type: number
        in: geometry.location
        as: lat
      lng:
        type: number
        in: geometry.location
        as: lng
      location_type:
        type: string
        in: geometry
        as: location_type

routes:
  # The one address this Recipe can answer for real -- Google's own worked
  # example. A route declaring matches_query beats one that does not, so this
  # wins only when the exact address is asked for; everything else falls to
  # the route below.
  #
  # matches_query is written to ask "does this parameter carry this value
  # among its comma-separated members" -- the shape Clover's ?expand=a,b and
  # Asana's opt_fields need -- and an address is not that: a literal comma
  # inside "1600 Amphitheatre Parkway, Mountain View, CA" splits the value
  # into three members, none of which is the whole address, so the match
  # never fires against the address exactly as Google's own example writes
  # it. The comma is dropped from the value this route matches on for that
  # reason; the response this route answers with still carries Google's
  # formatted_address, coordinates and place_id verbatim, commas included --
  # see the fixture and the conformance case below.
  - method: GET
    path: /maps/api/geocode/json
    resource: geocode_result
    operation: list
    pagination:
      # The Geocoding API answers whatever matched, once. No size, no
      # position -- see the header.
      #
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none
    matches_query:
      address: "1600 Amphitheatre Parkway Mountain View CA"
    list:
      fields:
        status: OK

  # Every other address this Recipe is asked about -- and, since AfterRouting
  # checks the credential only once a route has matched, this is also the
  # route a request with no key or a wrong one reaches before the credential
  # is ever looked at, landing it on REQUEST_DENIED rather than here. See the
  # header.
  - method: GET
    path: /maps/api/geocode/json
    resource: geocode_result
    operation: list
    pagination:
      # The Geocoding API answers whatever matched, once. No size, no
      # position -- see the header.
      #
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none
    list:
      fields:
        status: ZERO_RESULTS

errors:
  # Both REQUEST_DENIED entries override status to 200 explicitly -- the
  # finding this Recipe exists to carry. See the header for the trailing
  # space in the wrong-key sentence, verbatim and checked twice.
  request_denied_no_key:
    status: 200
    headers:
      Content-Type: application/json; charset=UTF-8
    message: "You must use an API key to authenticate each request to Google Maps Platform APIs. For additional information, please refer to http://g.co/dev/maps-no-account"
    fields:
      status: REQUEST_DENIED
      results: []

  request_denied_bad_key:
    status: 200
    headers:
      Content-Type: application/json; charset=UTF-8
    message: "The provided API key is invalid. "
    fields:
      status: REQUEST_DENIED
      results: []

  # Documented, not observed -- see the header's fidelity gaps for why no
  # error_message is claimed here.
  rate_limit:
    status: 200
    message_field: "-"
    fields:
      status: OVER_QUERY_LIMIT
      results: []

  # Google's own stock 404, quoted for its stable parts -- see the header.
  # {detail} is the request's own path, which is what the real page echoes;
  # the query string it also echoes on a real miss is not reproduced here
  # because this Recipe's own case sends none, see the header.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/html; charset=UTF-8
    message: |-
      <!DOCTYPE html>
      <html lang=en>
        <title>Error 404 (Not Found)!!1</title>
        <p><b>404.</b> <ins>That's an error.</ins>
        <p>The requested URL <code>{detail}</code> was not found on this server.  <ins>That's all we know.</ins>

  # The identical page shape, naming the method and path instead. Cauldron's
  # own {detail} for this failure is "METHOD /path" as one string (see
  # internal/runtime/handler.go), which does not split into Google's own two-
  # part sentence, so the literal text below is pinned to the one method and
  # path this Recipe's own case actually sends rather than templated -- the
  # same trade pdfmonkey/recipe.yaml and rootly/recipe.yaml make for a
  # provider's own wording tied to one specific probe. A real Allow header is
  # also not part of Google's answer here (checked: absent from the live
  # response) and this emulator adds one anyway, because a declared 405
  # status is exactly the one status Cauldron always attaches it to -- a
  # small, stated infidelity rather than a hidden one.
  method_not_allowed:
    status: 405
    style: text
    headers:
      Content-Type: text/html; charset=UTF-8
    message: |-
      <!DOCTYPE html>
      <html lang=en>
        <title>Error 405 (Method Not Allowed)!!1</title>
        <p><b>405.</b> <ins>That's an error.</ins>
        <p>The request method PATCH is inappropriate for the URL <code>/maps/api/geocode/json</code>.  <ins>That's all we know.</ins>

fixtures:
  empty: {}

  # Google's own worked example, quoted verbatim from its Geocoding API
  # reference -- the coordinates, the place_id and the formatted address are
  # all Google's, not this Recipe's invention.
  googleplex:
    geocode_result:
      - id: ChIJRxcAvRO7j4AR6hm6tys8yA8
        place_id: ChIJRxcAvRO7j4AR6hm6tys8yA8
        formatted_address: "1600 Amphitheatre Pkwy, Mountain View, CA 94043, USA"
        types:
          - street_address
        lat: 37.4222804
        lng: -122.0843428
        location_type: ROOFTOP

conformance:
  - name: no key at all is a 200 wearing REQUEST_DENIED
    source: https://maps.googleapis.com/maps/api/geocode/json?address=nonexistentplacequery12345xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /maps/api/geocode/json
      query:
        address: nonexistentplacequery12345xyz
    expect:
      status: 200
      headers:
        Content-Type: application/json; charset=UTF-8
      body:
        status: REQUEST_DENIED
        error_message: "You must use an API key to authenticate each request to Google Maps Platform APIs. For additional information, please refer to http://g.co/dev/maps-no-account"
        results: []

  - name: a junk key answers the same status and a different sentence
    source: https://maps.googleapis.com/maps/api/geocode/json?address=nonexistentplacequery12345xyz&key=junkjunkjunk12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /maps/api/geocode/json
      query:
        address: nonexistentplacequery12345xyz
        key: junkjunkjunk12345
    expect:
      status: 200
      body:
        status: REQUEST_DENIED
        # The trailing space is Google's own -- see the header.
        error_message: "The provided API key is invalid. "
        results: []

  - name: a route this host does not have is a real 404, HTML, no credential examined
    source: https://maps.googleapis.com/maps/api/totally-bogus-endpoint-xyz/json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /maps/api/totally-bogus-endpoint-xyz/json
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=UTF-8
      body_matches: "The requested URL <code>/maps/api/totally-bogus-endpoint-xyz/json</code> was not found on this server"

  - name: and a junk key on that same path changes nothing about the answer
    source: https://maps.googleapis.com/maps/api/totally-bogus-endpoint-xyz/json?key=junkjunkjunk12345
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /maps/api/totally-bogus-endpoint-xyz/json
      query:
        key: junkjunkjunk12345
    expect:
      status: 404
      body_matches: "was not found on this server"

  - name: a wrong method on a real path is a real 405, HTML, naming the method and the path
    source: https://maps.googleapis.com/maps/api/geocode/json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /maps/api/geocode/json
    expect:
      status: 405
      headers:
        Content-Type: text/html; charset=UTF-8
      body_matches: "The request method PATCH is inappropriate for the URL <code>/maps/api/geocode/json</code>"

  - name: the one address this Recipe can answer for real is Google's own worked example
    # Sent without the comma Google's own example writes it with -- see the
    # note on the route above for why matches_query cannot select on the
    # address containing one. The result itself carries Google's real,
    # comma-including formatted_address.
    source: https://developers.google.com/maps/documentation/geocoding/requests-geocoding
    fixture: googleplex
    request:
      method: GET
      path: /maps/api/geocode/json
      query:
        address: "1600 Amphitheatre Parkway Mountain View CA"
        key: AIza-cauldron-fixture-key
    expect:
      status: 200
      body:
        status: OK
        "results[0].formatted_address": "1600 Amphitheatre Pkwy, Mountain View, CA 94043, USA"
        "results[0].place_id": ChIJRxcAvRO7j4AR6hm6tys8yA8
        "results[0].geometry.location.lat": 37.4222804
        "results[0].geometry.location.lng": -122.0843428
        "results[0].geometry.location_type": ROOFTOP

  - name: every other address answers ZERO_RESULTS, not an error
    # Documented: "indicates that the geocode was successful but returned no
    # results." This is also this Recipe's own honest limit -- see the
    # header -- and the two happen to be the same answer.
    source: https://developers.google.com/maps/documentation/geocoding/requests-geocoding
    fixture: empty
    request:
      method: GET
      path: /maps/api/geocode/json
      query:
        address: some other address entirely
        key: AIza-cauldron-fixture-key
    expect:
      status: 200
      body:
        status: ZERO_RESULTS
        results: []

  - name: exceeding the quota is documented as a third named status, armed since no real quota exists to exceed
    source: https://developers.google.com/maps/documentation/geocoding/overview
    arm: rate_limit
    fixture: empty
    request:
      method: GET
      path: /maps/api/geocode/json
      query:
        address: "1600 Amphitheatre Parkway, Mountain View, CA"
        key: AIza-cauldron-fixture-key
    expect:
      status: 200
      body:
        status: OVER_QUERY_LIMIT
        results: []
