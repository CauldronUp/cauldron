# Discourse, the forum. Its shapes are the reason this Recipe exists.
#
#   1. A topic listing is two levels down. /latest.json answers with
#      topic_list.topics, not topics, and code reading response.topics gets
#      undefined rather than an error. The envelope also carries per_page,
#      inside topic_list rather than beside it.
#
#   2. The users are a sibling array, not embedded in the topics. A topic
#      carries last_poster_username and a posters list of ids; the user
#      objects with names and avatars live in response.users. Rendering a
#      topic row means joining two arrays that arrived in one body.
#
#   3. Authentication is two headers, not one. Api-Key and Api-Username are
#      both required, and a key on its own is refused -- which is the failure
#      every Discourse integration hits first, because every other API in the
#      world takes one credential.
#
#   4. A topic has title and fancy_title and they are different strings.
#      fancy_title is HTML: smart quotes and entities, ready to inject into a
#      page and wrong to compare against anything a human typed.
#
#   5. A single topic nests its posts under post_stream.posts, with
#      chunk_size beside them, so the posts are paginated inside the topic
#      rather than by the URL that fetched it.
#
# Credentials below are fixtures, not secrets.

recipe: discourse
capability: chat
version: 0.1.0
upstream:
  api: v3
  docs: https://docs.discourse.org/openapi.json

auth:
  scheme: header
  header: Api-Key
  keys:
    - cauldron_discourse_key

required_headers:
  # The half everybody forgets. Discourse's own description marks both
  # headers required, and a key without a username is not a partial
  # credential -- it is no credential.
  Api-Username:
    error: authentication_error

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    # A bare array of strings under errors, which is not an object and has no
    # message to read. Code doing error.message finds undefined.
    style: string_list
    key: errors

resources:
  topic:
    # Two levels down. Not "topics".
    collection: topic_list.topics
    id:
      style: numeric
    fields:
      # What somebody typed.
      title:
        type: string
        required: true
      # What Discourse renders: HTML entities and smart quotes, the same
      # words and a different string. Comparing this to a search term or to
      # anything a human entered does not match.
      fancy_title:
        type: string
      slug:
        type: string
      posts_count:
        type: integer
        default: 1
      # A username, not a user. The object with the name and the avatar is
      # in the users array beside the topics.
      last_poster_username:
        type: string
      category_id:
        type: integer
      # Three timestamps that mean different things. bumped_at moves when
      # anything happens; last_posted_at only when somebody posts.
      created_at:
        type: datetime
      bumped_at:
        type: datetime
      last_posted_at:
        type: datetime
      closed:
        type: boolean
        default: false
      archived:
        type: boolean
        default: false
      views:
        type: integer
        default: 0

  user:
    # Beside the topics, not inside them.
    collection: users
    id:
      style: numeric
    fields:
      username:
        type: string
        required: true
      name:
        type: string
      # A template rather than a URL. Discourse substitutes a pixel size into
      # it, so using it as an address asks for a file whose name contains
      # braces.
      avatar_template:
        type: string

routes:
  # The latest topics, with the users beside them in the same body.
  - method: GET
    path: /latest.json
    resource: topic
    operation: list
    beside:
      - user
    pagination:
      # per_page and page. The size is settable and comes back inside
      # topic_list, so a client can read what it was given rather than assume
      # thirty.
      #
      # Observed on 2026-08-23: meta.discourse.org/latest.json answers thirty
      # topics with topic_list.per_page thirty, and ?per_page=5 answers five
      # with topic_list.per_page five.
      style: page
      limit: 30
      limit_param: per_page
      cursor_param: page
    list:
      # per_page lives inside topic_list, not next to it, so a client reading
      # response.per_page finds nothing.
      #
      # And it echoes the size that was used rather than stating a fixed one.
      # It was the constant 30, which is right until somebody asks for five:
      # the listing then returned five topics and said thirty, from the one
      # field whose whole job is to say how big the page was. Real Discourse
      # answers ?per_page=5 with topic_list.per_page five, observed on
      # 2026-08-23.
      limit_field: topic_list.per_page
    fields:
      topic_list.can_create_topic: true

  # A topic on its own is not the topic from the listing. Discourse's own
  # description gives the two different properties: bumped_at and
  # last_poster_username exist only in the list, and post_stream, chunk_size
  # and participant_count only here. Code that reads a row, then fetches the
  # topic and expects the same fields, finds some of them missing.
  - method: GET
    path: /t/{id}.json
    resource: topic
    operation: get
    returns:
      - id
      - title
      - fancy_title
      - slug
      - posts_count
      - category_id
      - created_at
      - last_posted_at
      - closed
      - archived
      - views

  - method: GET
    path: /categories.json
    resource: topic
    operation: list
    pagination:
      # Not paged. category_list carries can_create_category,
      # can_create_topic and categories, and nothing about a page at all --
      # a forum has few enough categories to send them whole.
      #
      # Observed on 2026-08-23: meta.discourse.org/categories.json answers
      # twelve categories with no paging fields anywhere in the body.
      limit: 30
      limit_param: "-"
      cursor_param: "-"

errors:
  authentication_error:
    status: 403
    message: You are not permitted to view the requested resource. The API username or key is invalid.

  resource_missing:
    status: 404
    message: The requested URL or resource could not be found.

fixtures:
  empty: {}

  small-forum:
    topic:
      - id: "101"
        title: "Ada's notes on the engine"
        # The same words, rendered. An apostrophe became an entity, so this
        # string does not equal the one above.
        fancy_title: "Ada&rsquo;s notes on the engine"
        slug: adas-notes-on-the-engine
        posts_count: 4
        last_poster_username: ada
        category_id: 5
        created_at: "2026-01-10T09:00:00Z"
        last_posted_at: "2026-01-14T11:00:00Z"
        # Bumped after the last post: something happened that was not a post.
        bumped_at: "2026-01-15T08:00:00Z"
        closed: false
        archived: false
        views: 128
      - id: "102"
        title: Closed for the holidays
        fancy_title: Closed for the holidays
        slug: closed-for-the-holidays
        posts_count: 2
        last_poster_username: grace
        category_id: 5
        created_at: "2026-01-02T10:00:00Z"
        last_posted_at: "2026-01-03T10:00:00Z"
        bumped_at: "2026-01-03T10:00:00Z"
        closed: true
        archived: false
        views: 40

    user:
      - id: "1"
        username: ada
        name: Ada Lovelace
        avatar_template: /user_avatar/forum.example/ada/{size}/1_2.png
      - id: "2"
        username: grace
        name: Grace Hopper
        avatar_template: /user_avatar/forum.example/grace/{size}/2_2.png

# Conformance cases, read from Discourse's published OpenAPI description
# rather than observed against a live forum. The verify report says so.
conformance:
  - name: the topics are two levels down
    # response.topics is undefined. The list is topic_list.topics, and
    # per_page is inside that object rather than beside it -- so a client
    # reading either at the top level finds nothing and no error.
    #
    # Checked against meta.discourse.org on 2026-08-22, which needs no key to
    # read: the body's whole top level is topic_list, users, primary_groups
    # and flair_groups. No topics, no per_page. topic_list.per_page is 30,
    # which is the number this Recipe declares.
    source: https://docs.discourse.org/openapi.json
    verified: "2026-08-22"
    fixture: small-forum
    request:
      method: GET
      path: /latest.json
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: system
    expect:
      status: 200
      body:
        topic_list.topics[0].title: "Ada's notes on the engine"
        topic_list.per_page: 30
      absent:
        # Not at the top level, which is where the obvious reading looks.
        - topics
        - per_page

  - name: the users arrive beside the topics, not inside them
    # A topic carries last_poster_username, a string. The object with the
    # name and the avatar is in a separate array in the same body, so
    # rendering a row means joining the two.
    #
    # Checked against meta.discourse.org on 2026-08-22: its first topic
    # carries last_poster_username as a string and neither a last_poster nor
    # a user object, and users[0] carries username and name.
    source: https://docs.discourse.org/openapi.json
    verified: "2026-08-22"
    fixture: small-forum
    request:
      method: GET
      path: /latest.json
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: system
    expect:
      status: 200
      body:
        topic_list.topics[0].last_poster_username: ada
        users[0].username: ada
        users[0].name: Ada Lovelace
      absent:
        # No user object on the topic to read a name from.
        - topic_list.topics[0].last_poster
        - topic_list.topics[0].user

  - name: a key without a username is not a credential
    # Both headers are required in Discourse's own description. Every other
    # API takes one credential, so this is the failure a Discourse
    # integration hits first -- and it is a 403, not a 401.
    #
    # The only case here with no verified date, and deliberately. Checking it
    # against a real forum means sending a credential-shaped header to
    # somebody else's server to watch it be rejected, which is not a thing to
    # do to a stranger's install for the sake of a date in a file. The other
    # five needed nothing but a GET anybody can make.
    source: https://docs.discourse.org/openapi.json
    fixture: small-forum
    request:
      method: GET
      path: /latest.json
      headers:
        Api-Key: cauldron_discourse_key
    expect:
      status: 403
      matches:
        # A bare array of strings under errors, which is the shape declared
        # for every failure here and was asserted by nothing. Code reading
        # body.error or body.message finds undefined, and code reading
        # errors[0].message finds undefined too -- the entries are strings,
        # not objects.
        errors[0]: '.'

  - name: title and fancy_title are different strings
    # The same words, rendered. fancy_title is HTML, so comparing it to
    # anything a human typed does not match -- and putting title where
    # fancy_title belongs loses the rendering.
    #
    # Checked against meta.discourse.org topic 395632 on 2026-08-22: title is
    # "You're invited to try the Discourse Free plan beta!" and fancy_title is
    # the same words with the apostrophe as &rsquo;. That is the entity this
    # fixture models, on a real topic nobody wrote for the purpose.
    source: https://docs.discourse.org/openapi.json
    verified: "2026-08-22"
    fixture: small-forum
    request:
      method: GET
      path: /t/101.json
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: system
    expect:
      status: 200
      body:
        title: "Ada's notes on the engine"
        fancy_title: "Ada&rsquo;s notes on the engine"

  - name: bumped_at moves without a new post
    # Three timestamps that mean different things. This topic was bumped
    # after its last post, so ordering by last_posted_at and ordering by
    # bumped_at give different lists.
    #
    # Read from the listing, because that is the only place bumped_at
    # exists. The first version of this case read it from /t/{id}.json and
    # passed, because the emulator sent a field Discourse does not.
    #
    # Checked against meta.discourse.org on 2026-08-22: a listed topic carries
    # both last_posted_at and bumped_at. The dates here are the fixture's; what
    # was observed is that the listing is where both live.
    source: https://docs.discourse.org/openapi.json
    verified: "2026-08-22"
    fixture: small-forum
    request:
      method: GET
      path: /latest.json
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: system
    expect:
      status: 200
      body:
        topic_list.topics[0].last_posted_at: "2026-01-14T11:00:00Z"
        topic_list.topics[0].bumped_at: "2026-01-15T08:00:00Z"

  - name: a topic on its own is not the topic from the listing
    # Discourse's description gives the two different properties. bumped_at
    # and last_poster_username are in the list and not here, so code that
    # reads a row and then fetches the topic expecting the same fields finds
    # them missing -- and finds undefined rather than an error.
    #
    # Checked against meta.discourse.org topic 395632 on 2026-08-22: /t/{id}
    # answers 64 keys. title and last_posted_at are among them; bumped_at and
    # last_poster_username are not. This is the case the description alone
    # would not have settled, because a description lists what a response may
    # carry and not what it leaves out.
    source: https://docs.discourse.org/openapi.json
    verified: "2026-08-22"
    fixture: small-forum
    request:
      method: GET
      path: /t/101.json
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: system
    expect:
      status: 200
      body:
        title: "Ada's notes on the engine"
        last_posted_at: "2026-01-14T11:00:00Z"
      absent:
        - bumped_at
        - last_poster_username

  - name: a topic listing takes per_page and reports what it gave
    verified: "2026-08-23"
    # Checked against meta.discourse.org on 2026-08-23, which needs no key:
    # /latest.json answers thirty topics with topic_list.per_page thirty, and
    # ?per_page=5 answers five with topic_list.per_page five. The size is
    # settable and the body says which size was used, so a client need not
    # assume.
    source: https://docs.discourse.org/openapi.json
    fixture: small-forum
    request:
      method: GET
      path: /latest.json
      query:
        per_page: "1"
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: cauldron
    expect:
      status: 200
      body:
        # The half the name claims and the assertions did not check. One
        # topic came back and the envelope says one, rather than repeating a
        # thirty that was true of nothing.
        topic_list.per_page: 1
      absent:
        - topic_list.topics[1]

  - name: the categories are not paged
    verified: "2026-08-23"
    # Checked against meta.discourse.org on 2026-08-23: /categories.json
    # answers twelve categories, and category_list carries
    # can_create_category, can_create_topic and categories -- nothing about a
    # page anywhere in the body. A forum has few enough categories to send
    # them whole, so a size is not something Discourse accepts here.
    source: https://docs.discourse.org/openapi.json
    fixture: small-forum
    request:
      method: GET
      path: /categories.json
      query:
        # Ignored, where the same word on /latest.json is not.
        per_page: "1"
      headers:
        Api-Key: cauldron_discourse_key
        Api-Username: cauldron
    expect:
      status: 200
      # Both, where the same word on /latest.json returns one.
      body:
        topic_list.topics[1].title: Closed for the holidays
