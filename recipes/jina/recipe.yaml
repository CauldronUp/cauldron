# Jina AI Recipe for Cauldron
#
# The models listing, struck live against api.jina.ai on 2026-09-13 with no
# credential, with a deliberately invalid one, and on a path that does not
# exist. The record shape below is the live response, which anyone can fetch.
#
# **One model is named three ways and the vendor is spelled differently in
# each.** From the live catalogue:
#
#   "id":              "jina-ai/jina-ocr-v1"
#   "hugging_face_id": "jinaai/jina-ocr-v1"
#   "name":            "Jina AI: Jina OCR v1"
#
# Hyphenated, unhyphenated, and spaced with a colon. Three identifiers for one
# model and no two of them agree on how to write the company's own name, so a
# client matching a model across this API and Hugging Face has to know the
# mapping rather than derive it.
#
# **The models list is public and ignores a wrong key; the endpoint next to it
# does not.** `/v1/models` answers 200 and the whole catalogue with no header
# and with `Bearer notarealtoken` alike, while `/v1/embeddings` answers 401 to
# the same caller. So one host has an endpoint that never reads the credential
# beside one that does, and the first is the one people use to check their
# setup.
#
# **Prices are strings, including the zeroes.** `"prompt": "0.0000005"`,
# `"image": "0"`, `"request": "0"`. Sending decimals as strings avoids binary
# floating point, which is right -- and it means a client comparing a price to
# zero is comparing to the string `"0"`, and there is no currency field and no
# unit field anywhere to say what the number counts.
#
# **`quantization` is the empty string.** Not null, not absent: two quotes,
# where a value belongs.
#
# **A model record carries geography.** `datacenters` is a list of
# `{country_code}` objects, so the answer to "where does this run" is on the
# same object as the price and the context length.
#
# **The credential failure is three sentences and a dashboard link.**
# "Authentication required. Provide your API key via the Authorization header:
# 'Authorization: Bearer <api-key>'. Get your API key at
# https://jina.ai/api-dashboard/key-manager." -- an instruction, an example and
# a URL, in the field a client would print.
#
# **And an unrouted path is `{"detail":"Invalid endpoint"}`** with a request id
# beside it: the same FastAPI key as the 401, two words, and no mention of what
# was asked for.

recipe: jina
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://jina.ai/api-dashboard/
  # No spec: Jina documents this API as prose and an OpenAI-compatible surface.
  # There is no OpenAPI document at any address this Recipe could find, and the
  # record shape below is the live response, which needs no credential.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - jina_cauldr0nf1xturek3y00000000000
  absent_error: authentication_required
  rejected_error: authentication_required
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    # FastAPI's one key, with a request id beside it.
    style: flat
    message_field: detail
    code_field: "-"

resources:
  model:
    id:
      field: id
      style: opaque
      length: 19
    fields:
      # The same model under a second name, spelled without the hyphen.
      hugging_face_id:
        type: string
      # And under a third, spelled with a space and a colon.
      name:
        type: string
      created:
        type: integer
      context_length:
        type: integer
      max_output_length:
        type: integer
      # Two quotes, where a value belongs.
      quantization:
        type: string
      description:
        type: string
      input_modalities:
        type: list
      output_modalities:
        type: list
      supported_sampling_parameters:
        type: list
      supported_features:
        type: list
      # Prices as strings, including the zeroes, with no currency anywhere.
      pricing:
        type: map
      # Where the model runs, on the record that says what it costs.
      datacenters:
        type: list

routes:
  - method: GET
    path: /v1/models
    resource: model
    operation: list
    # Struck live with no credential and with a wrong one, both answered.
    public: true
    pagination:
      style: none

  - method: POST
    # The endpoint next door, which does read the header -- and answers this
    # to the same caller the listing above serves.
    path: /v1/embeddings
    public: true
    error: authentication_required

errors:
  authentication_required:
    status: 401
    # An instruction, an example and a URL, in one field.
    message: "Authentication required. Provide your API key via the Authorization header: 'Authorization: Bearer <api-key>'. Get your API key at https://jina.ai/api-dashboard/key-manager."

  unknown_route:
    status: 404
    # Two words, in the same key as the 401, saying nothing about what was
    # asked for.
    message: Invalid endpoint

fixtures:
  empty:
    model: []

  catalogue:
    model:
      - id: jina-ai/jina-ocr-v1
        # The same model, without the hyphen.
        hugging_face_id: jinaai/jina-ocr-v1
        # And again, with a space and a colon.
        name: "Jina AI: Jina OCR v1"
        created: 1788998400
        context_length: 32768
        max_output_length: 8192
        # Two quotes.
        quantization: ""
        description: A document OCR model served through the chat completions schema.
        input_modalities:
          - text
          - image
        output_modalities:
          - text
        supported_sampling_parameters:
          - max_completion_tokens
          - temperature
          - top_p
          - seed
        supported_features:
          - streaming
          - structured_outputs
        pricing:
          # A decimal as a string, which avoids binary floating point...
          prompt: "0.0000005"
          completion: "0.000002"
          # ...and a zero as a string, which does not need to.
          image: "0"
          request: "0"
          input_cache_read: "0"
          input_cache_write: "0"
        datacenters:
          - country_code: US

conformance:
  - name: the catalogue is served to a caller with nothing
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        'data[0].id': jina-ai/jina-ocr-v1

  - name: a wrong credential is ignored on the public listing
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers:
        # The endpoint beside this one answers 401 to the same request.
        Authorization: "Bearer notarealtoken"
    expect:
      status: 200
      body:
        'data[0].id': jina-ai/jina-ocr-v1

  - name: the endpoint next door does read the header
    source: https://api.jina.ai/v1/embeddings
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: POST
      path: /v1/embeddings
      headers: {}
      json: {}
    expect:
      status: 401
      body:
        # An instruction, an example and a dashboard URL, in the field a
        # client would print -- from the same host that answered the listing
        # above without reading anything.
        detail: "Authentication required. Provide your API key via the Authorization header: 'Authorization: Bearer <api-key>'. Get your API key at https://jina.ai/api-dashboard/key-manager."

  - name: an unrouted path says two words and a request id
    source: https://api.jina.ai/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # The same key the 401 uses, saying nothing about what was asked for.
        detail: Invalid endpoint

  - name: one model is named three ways
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        # Hyphenated, unhyphenated, and spaced with a colon: no two agree on
        # how to spell the company's own name.
        'data[0].id': jina-ai/jina-ocr-v1
        'data[0].hugging_face_id': jinaai/jina-ocr-v1
        'data[0].name': "Jina AI: Jina OCR v1"

  - name: prices are strings and so are the zeroes
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        # A decimal as a string avoids binary floating point. A zero as a
        # string does not need to, and there is no currency or unit field
        # anywhere to say what either counts.
        'data[0].pricing.prompt': "0.0000005"
        'data[0].pricing.completion': "0.000002"
        'data[0].pricing.image': "0"
        'data[0].pricing.request': "0"

  - name: a model record carries geography and an empty quantization
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        # Where it runs, on the record that says what it costs.
        'data[0].datacenters[0].country_code': US
        # Two quotes, where a value belongs.
        'data[0].quantization': ""
        'data[0].created': 1788998400
        'data[0].context_length': 32768
        'data[0].max_output_length': 8192

  - name: the capabilities are two lists and the modalities two more
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: catalogue
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        'data[0].input_modalities[1]': image
        'data[0].output_modalities[0]': text
        'data[0].supported_features[0]': streaming
        'data[0].supported_sampling_parameters[0]': max_completion_tokens
        'data[0].description': A document OCR model served through the chat completions schema.

  - name: an empty catalogue still sends the envelope
    source: https://api.jina.ai/v1/models
    verified: "2026-09-13"
    fixture: empty
    request:
      method: GET
      path: /v1/models
      headers: {}
    expect:
      status: 200
      body:
        data: []
