# Keycloak Admin REST API Recipe for Cauldron
#
# Written against the OpenAPI 3.0.3 document Keycloak publishes at
# keycloak.org/docs-api/latest/rest-api/openapi.json -- 560 kilobytes, 273
# paths, titled "Keycloak Admin REST API" -- and quoted from the parameter and
# field descriptions in it.
#
# Creating a user tells you nothing about the user you created.
#
# POST /admin/realms/{realm}/users is documented like this:
#
#   201 Created
#
# and that is all of it. No content. No schema. No headers. The document
# describes no response body for the endpoint that creates the central object
# of the whole API, and it does not say where the identifier went either.
#
# It went into a Location header, which the document does not mention. So the
# two ways to learn the id of a user you have just made are to read a header
# nothing in the contract declares, or to list users and search for the one
# you think you created -- and searching, as claim 2 below explains, has its
# own surprises.
#
# Every generated client inherits this. A create returns void, and the caller
# is left holding a username and no id, in an API where every subsequent call
# takes the id.
#
# Four more, each from the same document:
#
#   1. enabled does not mean able to log in. A user carries enabled,
#      emailVerified and requiredActions, and a required action stops a login
#      dead: an account with enabled: true and requiredActions:
#      ["UPDATE_PASSWORD"] is, from the API's point of view, a working
#      account, and from the person's point of view a locked one. Nothing in
#      enabled says so, and provisioning code that sets enabled and moves on
#      creates accounts nobody can use.
#   2. Search is prefix-based, and the punctuation is the API. Of search: "A
#      String contained in username, first or last name, or email. Default
#      search behavior is prefix-based (e.g., foo or foo*). Use *foo* for
#      infix search and \"foo\" for exact." So looking for a substring finds
#      nothing unless you wrap it in asterisks, and looking for an exact
#      match means embedding quotation marks in a query parameter. Three
#      modes, encoded in punctuation, with the least useful one as the
#      default.
#   3. first is the pagination offset. Not a page number, not a cursor -- of
#      first: "Pagination offset", with max as "Maximum results size
#      (defaults to 100)". And the exact parameter's own description says it
#      "defines whether the params 'last', 'first', 'email' and 'username'
#      must match exactly", naming first as a field to match on in the same
#      parameter list where first is the offset. Two meanings, one word, one
#      endpoint.
#   4. The realm is in the path twice over, in two different shapes. The
#      admin API is /admin/realms/{realm}/... and the token endpoint that
#      gets you into it is /realms/{realm}/protocol/openid-connect/token --
#      same realm, different prefix, and a client that builds one base URL
#      cannot reach both.
#
# Checked live 2026-09-05 for anything reachable, and there is nothing to
# probe. Keycloak is middleware you run yourself: there is no vendor-operated
# multi-tenant host the way api.stripe.com or api.notion.com is one, only
# whatever hostname the operator who deployed it chose. keycloak.org itself
# is documentation and downloads -- www.keycloak.org/admin/realms/master/users
# answers a GitHub Pages 404, because the marketing site is not the product --
# and no demo or reference instance is published anywhere in Keycloak's own
# docs to point a request at instead. Every reachable Keycloak admin API on
# the public internet belongs to some third party who deployed their own
# instance, and probing a stranger's identity provider is not this Recipe's
# subject, whatever the read-only rule would otherwise allow. No case below
# carries a verified date for exactly that reason: there is no host this
# Recipe is entitled to ask.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Claim 2 is stated and not served. This format matches a filter value
#     exactly, and teaching it prefix, infix and quoted-exact semantics for
#     one parameter would be inventing a query language rather than
#     describing one. What is served is the parameter and the records it
#     selects; what is not is the punctuation.
#   - The Location header on a create is served, because a client has nowhere
#     else to get the identifier, and it is worth being explicit that this is
#     the emulator being more helpful than the document: Keycloak really does
#     send it, and really does not write it down.
#   - Getting a token is not modelled. It lives under a different path prefix
#     with its own form encoding and its own grant types, and this Recipe
#     authenticates the way the admin API does -- with the bearer token that
#     flow produces.
#   - requiredActions is seeded as an empty list on the working account and
#     also defaults to one, so either alone produces the same wire. The
#     output is what the cases pin; which of the two produced it is not a
#     distinction anything outside this file can observe.
#   - Clients, groups, roles, identity providers, sessions, events and the
#     other two hundred and sixty paths are absent. Realm users only.
#
# The token and the ids below are fixtures and belong to no realm.

recipe: keycloak
capability: identity
version: 0.1.0

upstream:
  api: admin
  docs: https://www.keycloak.org/docs-api/latest/rest-api/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-keycloak-fixture-token

responses:
  list:
    # A bare array. Keycloak's admin listings carry no envelope, no count and
    # no paging metadata at all -- the only way to know whether there is more
    # is to ask for one past the end.
    style: bare
  resource:
    style: bare
  error:
    style: flat
    message_field: errorMessage
    code_field: "-"
    type_field: "-"

resources:
  user:
    id:
      style: uuid
    fields:
      username:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      # Verified or not, and unrelated to whether the account works.
      emailVerified:
        type: boolean
        default: false
      # True on an account nobody can log into, if the list below is not
      # empty.
      enabled:
        type: boolean
        default: true
      # The thing that actually stops a login.
      requiredActions:
        type: list
        default: []
      createdTimestamp:
        type: timestamp_ms
      totp:
        type: boolean
        default: false
      # The partition lives in the path and is not repeated in the body.
      realm:
        type: string
        in: "-"

routes:
  - method: GET
    path: /admin/realms/{realm}/users
    resource: user
    operation: list
    scope:
      - realm
    filters:
      - param: username
        field: username
      - param: enabled
        field: enabled
    pagination:
      style: offset
      cursor_param: first
      limit_param: max
      limit: 100

  # 201, and nothing else. The identifier is in a header the document does
  # not declare.
  - method: POST
    path: /admin/realms/{realm}/users
    resource: user
    operation: create
    scope:
      - realm
    status: 201
    empty_body: true
    headers:
      Location: /admin/realms/cauldron/users/{id}

  - method: GET
    path: /admin/realms/{realm}/users/{id}
    resource: user
    operation: get
    scope:
      - realm

errors:
  authentication_error:
    status: 401
    message: HTTP 401 Unauthorized

  resource_missing:
    status: 404
    message: User not found

  conflict:
    status: 409
    message: User exists with same username

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  realm:
    user:
      # Enabled, verified, and able to log in. The only combination anybody
      # tests.
      - id: 4f8a1c02-6b7d-4e35-9a10-c2d84e97b531
        realm: cauldron
        username: ada
        email: ada@example.com
        firstName: Ada
        lastName: Lovelace
        emailVerified: true
        enabled: true
        requiredActions: []
        createdTimestamp: 1754899200000
        totp: false
      # Enabled, and locked out. requiredActions is what stops the login and
      # enabled says nothing about it.
      - id: 91c7e4b6-2a03-4f18-bd52-7e60a3c19d84
        realm: cauldron
        username: grace
        email: grace@example.com
        firstName: Grace
        lastName: Hopper
        emailVerified: true
        enabled: true
        requiredActions:
          - UPDATE_PASSWORD
        createdTimestamp: 1755158400000
        totp: false
      # Disabled outright, which is the state people think the one above is
      # in.
      - id: c30d95a8-7f42-4b61-8e07-1d5b28fa6c93
        realm: cauldron
        username: alan
        email: alan@example.com
        firstName: Alan
        lastName: Turing
        emailVerified: false
        enabled: false
        requiredActions: []
        createdTimestamp: 1755244800000
        totp: false

conformance:
  - name: creating a user answers with nothing at all
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: empty
    request:
      method: POST
      path: /admin/realms/cauldron/users
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
      json:
        username: katherine
        email: katherine@example.com
        enabled: true
    expect:
      # "201 Created", and the document declares no content, no schema and no
      # headers for it. A generated client returns void from the call that
      # makes the central object of this API.
      status: 201
      no_body: true
      header_matches:
        # And this is where the identifier went. Keycloak sends it; the
        # document does not say so, which is why a client generated from that
        # document has nowhere to look.
        Location: '^/admin/realms/cauldron/users/[0-9a-f-]{36}$'

  - name: an enabled account can be one nobody can log into
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users/91c7e4b6-2a03-4f18-bd52-7e60a3c19d84
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # enabled: true, email verified, and a required action that stops the
        # login dead. Provisioning code that sets enabled and moves on makes
        # accounts in exactly this state.
        enabled: true
        emailVerified: true
        "requiredActions[0]": UPDATE_PASSWORD
        username: grace

  - name: and the account that really is off says so in the field people read
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users/c30d95a8-7f42-4b61-8e07-1d5b28fa6c93
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # The state people think the one above is in. Two accounts, both
        # unusable, and only one of them admits it in enabled.
        enabled: false
        username: alan
      absent:
        - requiredActions[0]

  - name: a working account has an empty list rather than no list
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users/4f8a1c02-6b7d-4e35-9a10-c2d84e97b531
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        enabled: true
        emailVerified: true
        username: ada
        # Present and empty, which is what makes truthiness the wrong test:
        # an empty array is truthy in JavaScript and this account is fine.
        requiredActions: []
      absent:
        # And the realm is in the path rather than on the object, so a user
        # pulled out of a listing carries no memory of which realm it came
        # from.
        - realm

  - name: the listing has no envelope, no count and no paging of any kind
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # A bare array. Nothing says how many there are, nothing says whether
        # there are more, and the only way to find out is to ask for one past
        # the end.
        "[0].username": ada
        "[1].username": grace
        "[2].username": alan
      absent:
        - "[3]"
        - total
        - count

  - name: the offset is called first and counts records
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users?first=1&max=1
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # "Pagination offset", not a page number -- and in the same parameter
        # list the exact parameter's description names "first" as a field to
        # match on, which is a different first entirely.
        "[0].username": grace
      absent:
        - "[1]"

  - name: filtering by enabled finds the locked account too
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users?enabled=true
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # "Boolean representing if user is enabled or not" -- so the filter
        # that sounds like "accounts that work" returns the one with a
        # required action on it as well.
        "[0].username": ada
        "[1].username": grace
      absent:
        - "[2]"

  - name: another realm's users are not in this realm's listing
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/somebody-else/users
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body: {}
      absent:
        # Every path carries the realm, and a realm nobody has heard of
        # answers with an empty array rather than a refusal.
        - "[0]"

  - name: a user that is not there is refused with a message and nothing else
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users/00000000-0000-0000-0000-000000000000
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 404
      body:
        # errorMessage and nothing to branch on beside it.
        errorMessage: User not found
      absent:
        - error
        - code

  - name: a token the realm does not know is refused
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users
      headers:
        Authorization: Bearer not-this-realms-token
    expect:
      status: 401
      body:
        errorMessage: HTTP 401 Unauthorized

  - name: the username filter matches exactly here and would not there
    source: https://www.keycloak.org/docs-api/latest/rest-api/
    fixture: realm
    request:
      method: GET
      path: /admin/realms/cauldron/users?username=grace
      headers:
        Authorization: Bearer cauldron-keycloak-fixture-token
    expect:
      status: 200
      body:
        # Of username: "A String contained in username, or the complete
        # username, if param 'exact' is true". Against Keycloak this is a
        # prefix match unless exact is set; here it is an equality, which is
        # the gap stated at the top of this file rather than a claim about
        # the provider.
        "[0].username": grace
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # max=1 and first=1, which is a count of records to skip, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "max and first are the two names this listing reads"
    source: "https://www.keycloak.org/docs-api/latest/rest-api/"
    fixture: realm
    request:
      method: GET
      path: "/admin/realms/cauldron/users"
      query:
        "max": "1"
        "first": "1"
      headers:
        "Authorization": "Bearer cauldron-keycloak-fixture-token"
    expect:
      status: 200
      body:
        "[0].id": "91c7e4b6-2a03-4f18-bd52-7e60a3c19d84"
      absent:
        - "[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # max=1 and first=1, which is a count of records to skip, and asserts
  # the second record came back on its own: one to skip, one to return,
  # and a third behind it to prove the size stopped the page.
  - name: "max and first are the two names this listing reads on admin realms {realm} users"
    source: "https://www.keycloak.org/docs-api/latest/rest-api/"
    fixture: realm
    request:
      method: GET
      path: "/admin/realms/cauldron/users"
      query:
        "max": "1"
        "first": "1"
      headers:
        "Authorization": "Bearer cauldron-keycloak-fixture-token"
    expect:
      status: 200
      body:
        "[0].id": "91c7e4b6-2a03-4f18-bd52-7e60a3c19d84"
      absent:
        - "[1]"
