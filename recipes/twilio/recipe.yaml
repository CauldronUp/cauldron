# Twilio Recipe for Cauldron
#
# Twilio is here because it is the provider people most often cannot test
# properly. Its sandbox sends real messages to real phones, costs real money,
# and refuses unverified numbers, so most teams end up stubbing it by hand and
# never exercising a delivery failure at all.
#
# It also exercises two things no other shipped Recipe does:
#
#   * HTTP Basic authentication, where the account SID is the username.
#   * A resource scoped by a path segment that is also an identifier
#     ({AccountSid}), rather than by a plain name.
#
# Known fidelity gap, stated rather than hidden: Twilio accepts PascalCase
# request parameters (To, From, Body) and returns snake_case fields (to, from,
# body). Cauldron does not model request-to-response field mapping yet, so a
# created message stores the parameters as sent. Reads of seeded fixtures are
# faithful; reads of records you created through this Recipe are not.

recipe: twilio
capability: sms
version: 0.1.0

upstream:
  api: "2010-04-01"
  docs: https://www.twilio.com/docs/usage/api

auth:
  scheme: basic
  keys:
    - ACcauldron00000000000000000000000

responses:
  list:
    style: wrapped
  # Twilio errors are flat, and carry a numeric code its client libraries
  # switch on, plus a link to the page explaining that code.
  error:
    style: flat
    code_field: code
    status_field: status
    fields:
      more_info: https://www.twilio.com/docs/errors

resources:
  message:
    collection: messages
    id:
      prefix: SM
      length: 32
      # Twilio calls the identifier sid, not id, on every resource it has.
      field: sid
    fields:
      account_sid:
        type: string
      to:
        type: string
      from:
        type: string
      body:
        type: string
      status:
        type: string
        default: queued
      direction:
        type: string
        default: outbound-api
      price:
        type: string
      error_code:
        type: string
      date_created:
        type: timestamp

routes:
  - method: GET
    path: /2010-04-01/Accounts/{account_sid}/Messages.json
    resource: message
    operation: list
    scope: [account_sid]
    pagination:
      style: page
      limit: 50
      # Twilio capitalises its query parameters. Its own description declares
      # PageSize and Page, so the lower-case spellings are ignored entirely.
      limit_param: PageSize
      cursor_param: Page

  - method: POST
    path: /2010-04-01/Accounts/{account_sid}/Messages.json
    resource: message
    operation: create
    # Twilio answers a message create with 201.
    status: 201
    scope: [account_sid]

  - method: GET
    path: /2010-04-01/Accounts/{account_sid}/Messages/{id}.json
    resource: message
    operation: get
    scope: [account_sid]

  - method: DELETE
    path: /2010-04-01/Accounts/{account_sid}/Messages/{id}.json
    resource: message
    operation: delete
    scope: [account_sid]

errors:
  # The failures that matter here are the ones a real sandbox will not produce
  # on demand: an unreachable handset, a blocked number, a spent balance.
  rate_limit:
    status: 429
    code: "20429"
    message: Too Many Requests
    headers:
      Retry-After: "1"

  authentication_error:
    status: 401
    code: "20003"
    message: Authentication Error - invalid username

  resource_missing:
    status: 404
    code: "20404"
    message: The requested resource was not found

  unreachable_destination:
    status: 400
    code: "21612"
    message: The 'To' phone number is not currently reachable via SMS

  blocked_number:
    status: 400
    code: "21610"
    message: Attempt to send to unsubscribed recipient

  insufficient_funds:
    status: 402
    code: "20005"
    message: Account not active or insufficient funds

fixtures:
  empty: {}

  small-account:
    message:
      - id: SM00000000000000000000000000000001
        account_sid: ACcauldron00000000000000000000000
        to: "+441234567890"
        from: "+441234567891"
        body: Your order has shipped.
        status: delivered
        direction: outbound-api
        price: "-0.04"
      - id: SM00000000000000000000000000000002
        account_sid: ACcauldron00000000000000000000000
        to: "+441234567892"
        from: "+441234567891"
        body: Your verification code is 123456.
        status: failed
        direction: outbound-api
        error_code: "30003"

# Conformance cases, read from Twilio's REST reference rather than observed
# against a live account, which the verify report states.
#
# Basic authentication carries the account SID as the username, so the header
# below is base64 of "ACcauldron00000000000000000000000:cauldron".
conformance:
  - name: a message list is wrapped under its collection name
    source: https://www.twilio.com/docs/messaging/api/message-resource#read-multiple-message-resources
    fixture: small-account
    request:
      method: GET
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages.json
      headers:
        Authorization: Basic QUNjYXVsZHJvbjAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwOmNhdWxkcm9u
    expect:
      status: 200
      body:
        messages[0].status: delivered
        messages[1].status: failed
      absent:
        - data

  - name: a single message is reachable through its .json path
    source: https://www.twilio.com/docs/messaging/api/message-resource#fetch-a-message-resource
    fixture: small-account
    request:
      method: GET
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages/SM00000000000000000000000000000001.json
      headers:
        Authorization: Basic QUNjYXVsZHJvbjAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwOmNhdWxkcm9u
    expect:
      status: 200
      body:
        status: delivered
        to: "+441234567890"
        price: "-0.04"

  - name: a failed message keeps the error code that explains it
    source: https://www.twilio.com/docs/api/errors/30003
    fixture: small-account
    request:
      method: GET
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages/SM00000000000000000000000000000002.json
      headers:
        Authorization: Basic QUNjYXVsZHJvbjAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwOmNhdWxkcm9u
    expect:
      status: 200
      body:
        status: failed
        error_code: "30003"

  - name: sending a message answers 201
    source: https://www.twilio.com/docs/messaging/api/message-resource#create-a-message-resource
    fixture: empty
    request:
      method: POST
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages.json
      headers:
        Authorization: Basic QUNjYXVsZHJvbjAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwOmNhdWxkcm9u
      form:
        to: "+441234567890"
        from: "+441234567891"
        body: Testing without spending money
    expect:
      status: 201
      matches:
        sid: '^SM[a-zA-Z0-9]{32}$'

  - name: an unknown message is a flat error with a numeric code
    source: https://www.twilio.com/docs/api/errors/20404
    fixture: small-account
    request:
      method: GET
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages/SM99999999999999999999999999999999.json
      headers:
        Authorization: Basic QUNjYXVsZHJvbjAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwOmNhdWxkcm9u
    expect:
      status: 404
      body:
        code: 20404
        status: 404
        more_info: https://www.twilio.com/docs/errors
      absent:
        - error

  - name: an unauthenticated request is refused before any resource is read
    source: https://www.twilio.com/docs/usage/api#authenticate-with-http
    request:
      method: GET
      path: /2010-04-01/Accounts/ACcauldron00000000000000000000000/Messages.json
    expect:
      status: 401
      body:
        code: 20003
        status: 401
