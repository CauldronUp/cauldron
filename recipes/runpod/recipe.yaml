# Runpod Recipe for Cauldron
#
# The pod listing, read from the OpenAPI document Runpod serves without a
# credential at rest.runpod.io/v1/openapi.json, and struck live on 2026-09-13
# with no credential, with a wrong one, on a path that does not exist, and with
# a method the path does not take.
#
# **A refusal typed as JSON with nothing in it.** Struck live:
#
#   HTTP/1.1 401 Unauthorized
#   Content-Type: application/json
#   Content-Length: 0
#
# Zero bytes, announced as JSON. `response.json()` throws on it, `response.text()`
# returns the empty string, and there is no code, no message and no identifier
# anywhere in the body, because there is no body. The only handle on the failure
# is a header.
#
# **Two of those headers, for one request.** `x-request-id: req_1b210a59-...`
# and `x-trace-id: trace_e6aa3fb2-...`, both uuids, both fresh, differing only
# in their prefix -- and a support thread has to be told which one is wanted.
#
# **A path that does not exist is a 400, and the lecture is the body.** Struck
# live:
#
#   GET /v1/cauldron-nope  400 text/plain
#   [{"error":"At #/paths/get for GET https://rest.runpod.io/v1/cauldron-nope,
#     The GET request contains a path of '/v1/cauldron-nope' however that path,
#     or the GET method for that path does not exist in the specification.
#     Suggestion: Check the path is correct, and check that the correct HTTP
#     method has been used (e.g. GET, POST, PUT, DELETE)"}]
#
# Bad Request, for a request that was not bad -- it was addressed to nothing.
# The message is a spec-validating middleware talking to its own author: it
# names an internal JSON pointer, quotes the path back, and then lists the HTTP
# verbs for the reader. `#/paths/get` is not a pointer into any OpenAPI
# document; the wrong-method failure beside it says `#/paths/pods/put`, which is
# not one either, and the two are not even wrong the same way.
#
# **And a JSON array labelled text/plain, next to an empty body labelled JSON.**
# One API, two adjacent requests, both content types wrong, in opposite
# directions.
#
# **One record prints the same instant twice, once in JavaScript.**
#
#   lastStartedAt:     "2024-07-12T19:14:40.144Z"
#   lastStatusChange:  "Rented by User: Fri Jul 12 2024 15:14:40 GMT-0400 (Eastern Daylight Time)"
#
# The second is `Date.prototype.toString()` with a sentence glued to the front,
# in a field named like a timestamp -- carrying the *server's* timezone, spelled
# out in English, on a record delivered to callers anywhere.
#
# **Two prices, one exampled as a number and one as a string.**
# `adjustedCostPerHr` is `type: number, example: 0.69`; `costPerHr` beside it is
# `type: number, example: "0.74"`. The declaration agrees and the examples do
# not, and a generated client's fixtures come from the examples.
#
# **The ports are on the record twice, in two encodings.** `ports` is
# `["8888/http", "22/tcp"]` and `portMappings` is `{"22": 10341}` -- an object
# whose keys are port numbers written as strings and whose values are port
# numbers written as integers.
#
# **Three string fields are exampled as null and not declared nullable.**
# `aiApiId`, `endpointId` and `templateId` are each `type: string` with
# `example: null`, while `publicIp` and `portMappings` on the same schema do say
# `nullable: true`. Nullability is declared twice and demonstrated three more
# times.
#
# **And `ListPods` declares no 401, and two failures that are about one pod.**
# Its responses are 200, `400 "Invalid ID supplied."` and `404 "Pod not found."`
# -- on an operation that takes no identifier, from a host that answers 401 to
# every anonymous request. The listing also takes sixteen query parameters, six
# of them `include*` flags that change what a record contains. Drift reports
# the 401 as unbacked, and it is: the only failure every caller meets is the one
# no operation declares, while the 400 it does declare is there for a reason
# that has nothing to do with the one it answers.

recipe: runpod
capability: infrastructure
version: 0.1.0

upstream:
  api: "0.1.0"
  docs: https://docs.runpod.io/api-reference
  spec: https://rest.runpod.io/v1/openapi.json
  spec_hash: 2d8e8f762ef4d845988fc062b2eb2ec529c9c7a5c867bba284930a294d3d62b4
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - rpa_CAULDR0NF1XTUREK3Y0000000000000000000000
  # One verdict, and it has nothing in it to tell them apart with.
  absent_error: unauthorized
  rejected_error: unauthorized
  after_routing: true

responses:
  list:
    # A bare array, under sixteen query parameters.
    style: bare
  error:
    # A bare array of objects, with no envelope around it.
    style: list
    key: "-"
    message_field: error
    code_field: "-"

resources:
  pod:
    id:
      field: id
      style: opaque
      length: 14
    fields:
      name:
        type: string
      # What it is supposed to be, rather than what it is.
      desiredStatus:
        type: string
      image:
        type: string
      machineId:
        type: string
      # A number, exampled as a number...
      adjustedCostPerHr:
        type: number
      # ...and a number, exampled as a string.
      costPerHr:
        type: number
      # ISO 8601, with a Z on it.
      lastStartedAt:
        type: string
      # And the same instant as JavaScript prints it, with a sentence in front.
      lastStatusChange:
        type: string
      # The ports, as slash-delimited strings...
      ports:
        type: list
      # ...and the ports again, string keys to integer values.
      portMappings:
      publicIp:
      # Exampled as null, declared as a string.
      templateId:
      endpointId:
      aiApiId:
      consumerUserId:
        type: string
      cpuFlavorId:
        type: string
      vcpuCount:
        type: number
      memoryInGb:
        type: number
      containerDiskInGb:
        type: integer
      volumeInGb:
        type: integer
      volumeMountPath:
        type: string
      volumeEncrypted:
        type: boolean
      interruptible:
        type: boolean
      locked:
        type: boolean
      slsVersion:
        type: integer
      env:
        type: map

routes:
  - method: GET
    path: /v1/pods
    resource: pod
    operation: list
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    # Zero bytes, announced as JSON.
    empty: true
    headers:
      Content-Type: application/json
      # The only handle on the failure, and there are two of them.
      x-request-id: req_1b210a59-3670-4ce2-a6ed-3c9a6060fdb1
      x-trace-id: trace_e6aa3fb2-dea5-4577-a6dd-5df962ce6733

  unknown_route:
    # Bad Request, for a request addressed to nothing.
    status: 400
    # A JSON array, announced as text.
    headers:
      Content-Type: text/plain; charset=utf-8
    # An internal pointer, the path quoted back, and a list of the HTTP verbs.
    message: "At #/paths/get for GET https://rest.runpod.io{detail}, The GET request contains a path of '{detail}' however that path, or the GET method for that path does not exist in the specification. Suggestion: Check the path is correct, and check that the correct HTTP method has been used (e.g. GET, POST, PUT, DELETE)"

  method_not_allowed:
    status: 400
    headers:
      Content-Type: text/plain; charset=utf-8
    # A different pointer shape from the one above, and no more valid.
    message: "At #/paths/pods/put for PUT https://rest.runpod.io/v1/pods, The PUT method for that path does not exist in the specification. Suggestion: Check the path is correct, and check that the correct HTTP method has been used (e.g. GET, POST, PUT, DELETE)"

fixtures:
  empty:
    pod: []

  rented:
    pod:
      - id: xedezhzb9la3ye
        name: pytorch-devbox
        desiredStatus: RUNNING
        image: runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04
        machineId: s194cr8pls2z
        adjustedCostPerHr: 0.69
        costPerHr: 0.74
        lastStartedAt: "2026-07-12T19:14:40.144Z"
        # The same instant, as JavaScript prints it, in the server's timezone.
        lastStatusChange: "Rented by User: Fri Jul 12 2026 15:14:40 GMT-0400 (Eastern Daylight Time)"
        ports:
          - 8888/http
          - 22/tcp
        # The same ports again: string keys, integer values.
        portMappings:
          "22": 10341
        publicIp: 100.65.0.119
        templateId: null
        endpointId: null
        aiApiId: null
        consumerUserId: user_2PyTJrLzeuwfZilRZ7JhCQDuSqo
        cpuFlavorId: cpu3c
        vcpuCount: 24
        memoryInGb: 62
        containerDiskInGb: 50
        volumeInGb: 20
        volumeMountPath: /workspace
        volumeEncrypted: false
        interruptible: false
        locked: false
        slsVersion: 0
        env:
          ENV_VAR: value
      - id: q7kf2mv0xza81b
        name: idle-cpu
        # Supposed to be stopped, on a record that says nothing about whether
        # it is.
        desiredStatus: EXITED
        image: runpod/base:0.6.2-cpu
        machineId: h8821jdlmsq4
        adjustedCostPerHr: 0
        costPerHr: 0.11
        lastStartedAt: "2026-08-02T06:00:12.010Z"
        lastStatusChange: "Stopped by User: Sat Aug 02 2026 02:00:12 GMT-0400 (Eastern Daylight Time)"
        ports: []
        portMappings: null
        publicIp: null
        templateId: null
        endpointId: null
        aiApiId: null
        consumerUserId: user_2PyTJrLzeuwfZilRZ7JhCQDuSqo
        cpuFlavorId: cpu3c
        vcpuCount: 4
        memoryInGb: 16
        containerDiskInGb: 20
        volumeInGb: 0
        volumeMountPath: /workspace
        volumeEncrypted: false
        interruptible: true
        locked: false
        slsVersion: 0
        env: {}

conformance:
  - name: a refusal typed as JSON with nothing in it
    source: https://rest.runpod.io/v1/pods
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers: {}
    expect:
      status: 401
      # Zero bytes, announced as JSON: .json() throws and there is no code, no
      # message and no identifier to quote.
      no_body: true
      headers:
        Content-Type: application/json
      header_matches:
        # The only handles on the failure, and there are two of them.
        x-request-id: '\Areq_[0-9a-f-]{36}\z'
        x-trace-id: '\Atrace_[0-9a-f-]{36}\z'

  - name: a wrong credential is the same nothing
    source: https://rest.runpod.io/v1/pods
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      no_body: true
      headers:
        Content-Type: application/json

  - name: a path that does not exist is a bad request and a lecture
    source: https://rest.runpod.io/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /v1/cauldron-nope
      headers: {}
    expect:
      # Bad Request, for a request addressed to nothing.
      status: 400
      headers:
        # A JSON array, announced as text.
        Content-Type: text/plain; charset=utf-8
      body:
        # An internal pointer that points into no document, the path quoted
        # back, and a list of the HTTP verbs for the reader.
        '[0].error': "At #/paths/get for GET https://rest.runpod.io/v1/cauldron-nope, The GET request contains a path of '/v1/cauldron-nope' however that path, or the GET method for that path does not exist in the specification. Suggestion: Check the path is correct, and check that the correct HTTP method has been used (e.g. GET, POST, PUT, DELETE)"

  - name: a wrong method is wrong in a differently shaped pointer
    source: https://rest.runpod.io/v1/pods
    verified: "2026-09-13"
    fixture: rented
    request:
      method: PUT
      path: /v1/pods
      headers: {}
    expect:
      status: 400
      body:
        # #/paths/pods/put here, #/paths/get there: not even wrong the same
        # way.
        '[0].error': "At #/paths/pods/put for PUT https://rest.runpod.io/v1/pods, The PUT method for that path does not exist in the specification. Suggestion: Check the path is correct, and check that the correct HTTP method has been used (e.g. GET, POST, PUT, DELETE)"

  - name: one record prints the same instant twice and once in JavaScript
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        # ISO 8601, with a Z...
        '[0].lastStartedAt': "2026-07-12T19:14:40.144Z"
        # ...and Date.prototype.toString() with a sentence in front, carrying
        # the server's timezone spelled out in English.
        '[0].lastStatusChange': "Rented by User: Fri Jul 12 2026 15:14:40 GMT-0400 (Eastern Daylight Time)"
        '[1].lastStatusChange': "Stopped by User: Sat Aug 02 2026 02:00:12 GMT-0400 (Eastern Daylight Time)"
        '[1].lastStartedAt': "2026-08-02T06:00:12.010Z"

  - name: the ports are on the record twice in two encodings
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        # Slash-delimited strings...
        '[0].ports[0]': 8888/http
        '[0].ports[1]': 22/tcp
        # ...and string keys to integer values, for the same ports.
        '[0].portMappings.22': 10341
        '[1].ports': []
        '[1].portMappings': null
        '[0].publicIp': 100.65.0.119
        '[1].publicIp': null

  - name: two prices, one exampled as a number and one as a string
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        # Both type: number in the schema; only one of them is exampled that
        # way, and a generated client's fixtures come from the examples.
        '[0].adjustedCostPerHr': 0.69
        '[0].costPerHr': 0.74
        '[1].adjustedCostPerHr': 0
        '[1].costPerHr': 0.11

  - name: three string fields are null and never declared nullable
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        # type: string, example: null, three times over, on a schema that does
        # say nullable elsewhere.
        '[0].templateId': null
        '[0].endpointId': null
        '[0].aiApiId': null
        '[0].consumerUserId': user_2PyTJrLzeuwfZilRZ7JhCQDuSqo

  - name: a pod says what it is supposed to be
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        # desiredStatus, and no field anywhere saying what it actually is.
        '[0].desiredStatus': RUNNING
        '[1].desiredStatus': EXITED
        '[0].id': xedezhzb9la3ye
        '[0].name': pytorch-devbox
        '[0].image': runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04
        '[0].machineId': s194cr8pls2z
        '[0].interruptible': false
        '[1].interruptible': true
        '[0].locked': false
        '[0].slsVersion': 0

  - name: the hardware and the volume are on the same record as the price
    source: https://rest.runpod.io/v1/openapi.json
    fixture: rented
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body:
        '[0].vcpuCount': 24
        '[0].memoryInGb': 62
        '[0].containerDiskInGb': 50
        '[0].volumeInGb': 20
        '[0].volumeMountPath': /workspace
        '[0].volumeEncrypted': false
        '[0].cpuFlavorId': cpu3c
        '[0].env.ENV_VAR': value
        '[1].env': {}

  - name: an account with no pods answers a bare empty array
    source: https://rest.runpod.io/v1/openapi.json
    fixture: empty
    request:
      method: GET
      path: /v1/pods
      headers:
        Authorization: "Bearer rpa_CAULDR0NF1XTUREK3Y0000000000000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
