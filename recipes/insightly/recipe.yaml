# Insightly Recipe for Cauldron
#
# Written against Insightly's published Swagger 2.0 document at
# api.insightly.com/v3.1/swagger/docs/v3.1 and struck live against
# api.na1.insightly.com on 2026-09-09 with no credential, with a deliberately
# invalid one, and on a path that does not exist.
#
# **946 documented string fields say no valid value exists.** The document
# carries `maxLength: 0` on 2,521 schema nodes, and 946 of those are typed
# `string`. `maxLength` constrains strings, and zero means the empty string is
# the longest permitted value -- so on every one of those 946 fields the
# document declares that nothing the API can send would validate.
#
# The two that matter most on a Contact are its timestamps.
# `DATE_CREATED_UTC` and `DATE_UPDATED_UTC` are `type: string`,
# `format: date-time`, `maxLength: 0`. A generator that emits validation from
# this document rejects every record the API returns. `DATE_OF_BIRTH`, three
# fields away, is also a date-time string and carries `maxLength: 255`, so the
# document is not even consistent about it.
#
# The integers carry it too -- `CONTACT_ID` and `OWNER_USER_ID` are
# `type: integer` with `maxLength: 0` -- where the keyword simply does not
# apply and is ignored. That is the harmless half. The 946 strings are not.
#
# **`FIRST_NAME` is required and `CONTACT_ID` is not.** The Contact schema's
# entire `required` list is one entry, and it is the given name. A contact must
# have a first name and need not have an identifier.
#
# It is the third shape of that mistake in as many Recipes. [close](../close)
# marks `name` required and types it nullable. [adobesign](../adobesign)
# requires `hidden` -- a boolean saying whether you can see the record -- and
# does not require `id` or `status`. Here the identifier is simply not on the
# list. Three providers, three ways of guaranteeing the wrong field.
#
# **The Authorization header is a hand-rolled parameter again.** `required:
# true`, `type: string`, `in: header`, on every operation -- the same
# malpractice [close](../close) and [middesk](../middesk) publish. Three
# providers in one batch describe authentication as a string the caller
# assembles rather than as a security scheme.
#
# **One sentence answers everything, and ASP.NET wrote it.**
#
#   401 {"Message":"Authorization has been denied for this request."}
#
# Struck live for a missing credential, a wrong one, and a path that does not
# exist. `Message` is PascalCase -- the only field in this collection's error
# bodies that is -- because it is ASP.NET Web API's own
# `HttpError`, not something Insightly composed. The passive voice names no
# actor and no reason, and because an unknown path answers it too, nothing
# about this API's surface is discoverable without a working key.
#
# **The host contains a pod.** `https://api.{pod}.insightly.com/v3.1/`, where
# the pod is na1, eu1 and so on. A caller has to know which shard its account
# is on before its first request, and the reference writes the hostname with a
# placeholder in it. [scalekit](../scalekit) refuses on the same axis and says
# so in four words; Insightly's apex answers normally, so a request to the
# wrong pod fails as a credential problem rather than as a routing one.
#
# **The total is opt-in.** `count_total` is a boolean query parameter,
# defaulting off, so a listing reports how many records matched only if the
# caller asked in advance -- and `brief` is a second boolean that changes the
# shape of every record in the response.

recipe: insightly
capability: crm
version: 0.1.0

upstream:
  api: v3.1
  docs: https://api.insightly.com/v3.1/Help
  spec: https://api.insightly.com/v3.1/swagger/docs/v3.1
  spec_hash: 658f3fdff89e9b4420a4109e9a3c7acfc369767ae9de58eccfe8416befc60984
  spec_seen: "2026-09-09"

auth:
  # The API key as the Base64-encoded username, password blank, which is what
  # the reference says and what the hand-rolled header parameter does not.
  scheme: basic
  keys:
    - cauldr0n-1ns1ghtly-f1xture-key
  # One sentence for all three.
  absent_error: authorization_denied
  rejected_error: authorization_denied

responses:
  list:
    # No envelope: the 200 schema is an array of Contact and nothing else, so
    # a listing carries no count, no paging and no room for one.
    style: bare
  error:
    style: flat
    # PascalCase, because ASP.NET Web API wrote it rather than Insightly.
    message_field: Message
    code_field: "-"

resources:
  contact:
    id:
      # Not in the schema's required list, unlike FIRST_NAME.
      field: CONTACT_ID
      style: numeric
    fields:
      # The one field the document guarantees.
      FIRST_NAME:
        type: string
      LAST_NAME:
        type: string
      SALUTATION:
        type: string
      EMAIL_ADDRESS:
        type: string
      PHONE:
        type: string
      # type string, format date-time, maxLength 0 -- so the document says no
      # value it can hold would validate.
      DATE_CREATED_UTC:
        type: string
      DATE_UPDATED_UTC:
        type: string
      OWNER_USER_ID:
        type: integer
      BACKGROUND:
        type: string
      SOCIAL_LINKEDIN:
        type: string

routes:
  - method: GET
    path: /v3.1/Contacts
    resource: contact
    operation: list
    pagination:
      # OData's names rather than an API's own, on an endpoint that is not
      # OData.
      style: offset
      limit: 100
      max_limit: 500
      limit_param: top
      cursor_param: skip

errors:
  authorization_denied:
    status: 401
    # ASP.NET Web API's own HttpError sentence, passive, naming no actor.
    message: "Authorization has been denied for this request."

fixtures:
  empty:
    contact: []

  organisation:
    contact:
      - CONTACT_ID: 214785301
        SALUTATION: Ms
        FIRST_NAME: Ada
        LAST_NAME: Lovelace
        EMAIL_ADDRESS: ada@example.invalid
        PHONE: "+16135550142"
        DATE_CREATED_UTC: "2026-04-11 08:30:00"
        DATE_UPDATED_UTC: "2026-08-22 13:45:10"
        OWNER_USER_ID: 1884562
        BACKGROUND: Met at the London office
        SOCIAL_LINKEDIN: https://www.linkedin.com/in/example
      - CONTACT_ID: 214785302
        # The only required field, and the only one this record has beyond
        # the identifier -- which the schema does not require.
        FIRST_NAME: Grace
        DATE_CREATED_UTC: "2026-09-02 09:41:00"
        DATE_UPDATED_UTC: "2026-09-02 09:41:00"
        OWNER_USER_ID: 1884562

conformance:
  - name: a missing credential is ASP.NETs own sentence
    source: https://api.na1.insightly.com/v3.1/Contacts
    verified: "2026-09-09"
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers: {}
    expect:
      status: 401
      body:
        # PascalCase, passive, and not written by Insightly.
        Message: "Authorization has been denied for this request."

  - name: a wrong credential is the same sentence
    source: https://api.na1.insightly.com/v3.1/Contacts
    verified: "2026-09-09"
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        # notreal:notreal
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      status: 401
      body:
        Message: "Authorization has been denied for this request."

  - name: an unknown path is the same sentence again
    source: https://api.na1.insightly.com/v3.1/CauldronNope
    verified: "2026-09-09"
    fixture: organisation
    request:
      method: GET
      path: /v3.1/CauldronNope
      headers:
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      # So nothing about this API's surface is discoverable without a key
      # that works.
      status: 401
      body:
        Message: "Authorization has been denied for this request."

  - name: the failure field is PascalCase
    source: https://api.na1.insightly.com/v3.1/Contacts
    verified: "2026-09-09"
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers: {}
    expect:
      status: 401
      body_matches: '"Message"'

  - name: contacts are a bare array
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        # The 200 schema is an array of Contact and nothing else, so there is
        # no count and nowhere to put one.
        '[0].CONTACT_ID': 214785301
        '[0].FIRST_NAME': Ada

  - name: the field names are upper snake case
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        # Database column names on the wire, which is what a CRM built on one
        # ends up publishing.
        '[0].LAST_NAME': Lovelace
        '[0].EMAIL_ADDRESS': ada@example.invalid
        '[0].OWNER_USER_ID': 1884562
        '[0].SALUTATION': Ms

  - name: only the first name is guaranteed
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        # The schema's whole required list is ["FIRST_NAME"], so a contact
        # must have a given name and need not have an identifier.
        '[1].FIRST_NAME': Grace
      absent:
        - '[1].LAST_NAME'
        - '[1].EMAIL_ADDRESS'
        - '[1].PHONE'

  - name: the timestamps are the fields the document forbids
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        # type string, format date-time, maxLength 0 -- and a space instead of
        # a T, so they are not RFC 3339 either.
        '[0].DATE_CREATED_UTC': "2026-04-11 08:30:00"
        '[0].DATE_UPDATED_UTC': "2026-08-22 13:45:10"

  - name: a contact never edited has two identical timestamps
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body:
        '[1].DATE_CREATED_UTC': "2026-09-02 09:41:00"
        '[1].DATE_UPDATED_UTC': "2026-09-02 09:41:00"
        '[0].BACKGROUND': Met at the London office
        '[0].SOCIAL_LINKEDIN': https://www.linkedin.com/in/example
        '[0].PHONE': "+16135550142"

  - name: contacts page on top and skip
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: organisation
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
      query:
        # OData's names, on an endpoint that is not OData, defaulting to 100
        # and capped at 500.
        top: "1"
        skip: "1"
    expect:
      status: 200
      body:
        '[0].CONTACT_ID': 214785302
        '[0].FIRST_NAME': Grace

  - name: an organisation with no contacts answers an empty array
    source: https://api.insightly.com/v3.1/swagger/docs/v3.1
    fixture: empty
    request:
      method: GET
      path: /v3.1/Contacts
      headers:
        Authorization: "Basic Y2F1bGRyMG4tMW5zMWdodGx5LWYxeHR1cmUta2V5Og=="
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
