# TriNet Recipe for Cauldron
#
# This is not a Recipe for TriNet's employee or employment data, because no
# such data was ever visible. It is a Recipe for the one thing that was:
# api.trinet.com answers, coherently and in detail, and does so entirely in
# refusals.
#
# TriNet's own marketing site names a public API and points at documentation
# for it -- www.trinet.com/customer-resource-center/technology/integration-
# center says "TriNet APIs give developers the freedom to build upon
# integration from the TriNet platform" and links to
# https://apidocs.trinet.com/. That hostname does not resolve: no DNS record
# answers for it at all, checked directly, not through a search index. There
# is no other developer portal, API reference, or OpenAPI description this
# Recipe could find anywhere else on trinet.com or off it. So the honest
# starting point is the one the batch's brief invited: nothing about
# TriNet's actual employee or employment model is documented anywhere this
# Recipe could reach, and nothing here claims a field, a shape or a value
# for either. No resource is declared below. Every route that exists is
# declared with `error:` alone, because the only thing api.trinet.com will
# say to an unauthenticated caller is that it is unauthenticated -- and it
# says that four different ways, all struck live, with no account, no API
# key and no OAuth client ever created.
#
# The gateway is Apigee (Google Cloud's API management product), identifiable
# from its own fault shape and its own error codes -- "keymanagement.service"
# and "oauth.v2" are Apigee's internal policy namespaces, not TriNet's -- and
# from a 411 this Recipe does not model (see the gaps). Four requests were
# struck against the bare host, https://api.trinet.com, with no path telling
# them apart in any of what came back:
#
#   no Authorization header at all
#     -> 400 Bad Request, Content-Type: text/json
#        {"_statusCode": 400, "_statusText": "Bad Request",
#         "message": "Invalid accesstoken or apikey"}
#
#   Authorization: junktoken12345 (present, no scheme word at all)
#     -> the identical 400, byte for byte
#
#   Authorization: Basic amFuazpqdW5r (a well-formed, different HTTP auth
#   scheme; the base64 decodes to "junk:junk")
#     -> 401 Unauthorized, application/json
#        {"fault":{"faultstring":"Invalid ApiKey",
#                   "detail":{"errorcode":"oauth.v2.InvalidApiKey"}}}
#
#   Authorization: Bearer  (the literal scheme word and nothing after it)
#     -> 401 Unauthorized, application/json,
#        WWW-Authenticate: Bearer realm="null",error="invalid_token",
#          error_description="oauth.v2.InvalidAccessToken: Invalid access
#          token"
#        {"fault":{"faultstring":"Invalid access token",
#                   "detail":{"errorcode":"oauth.v2.InvalidAccessToken"}}}
#
#   Authorization: Bearer junktoken12345 (a well-formed, non-empty, simply
#   wrong bearer value)
#     -> 401 Unauthorized, application/json,
#        WWW-Authenticate: Bearer realm="null",error="invalid_token",
#          error_description="keymanagement.service.invalid_access_token:
#          Invalid Access Token"
#        {"fault":{"faultstring":"Invalid Access Token",
#                   "detail":{"errorcode":"keymanagement.service.invalid_access_token"}}}
#
# That is four different bodies for five different requests, and the last
# two are the interesting pair: both are a "Bearer"-scheme header that fails,
# one empty and one merely wrong, and Apigee's own internal fault namespace
# changes between them -- oauth.v2 for the empty one, keymanagement.service
# for the non-empty one, with a capital A in "Access" on one and a lowercase
# a on the other. Two different subsystems inside one gateway's OAuthV2
# token check, reached by two inputs that differ only in whether anything
# was typed after the word "Bearer ".
#
# This is Step 2a's mechanism doing exactly the job it exists for, and
# unusually cleanly: absent, malformed and rejected are three genuinely
# different sentences here, and all three come from the single Bearer
# channel alone, with no arming needed. Absent (no header at all) falls
# through to authentication_error, which is the generic 400 above -- the
# same sentence a request with no credential of any kind gets everywhere on
# this host. auth.malformed_error names invalid_bearer_token, the empty-
# after-prefix case. auth.rejected_error names invalid_access_token, the
# non-empty-but-wrong case. Nothing is armed and nothing is invented: all
# three were struck live, on the date recorded on every case below.
#
# What that three-way split cannot also carry, because malformed_error can
# only name one errors entry, is the other two live-verified shapes above:
# a bare, unprefixed "Authorization: junktoken12345" -- which Cauldron's own
# credential check classifies as Malformed the same way "Bearer " with
# nothing after it is, because both lack the declared "Bearer " prefix --
# actually answers the *generic 400*, identically to no header at all, not
# the 401 malformed_error names. And "Authorization: Basic ..." -- also
# Malformed by that same classification -- answers a *third* sentence,
# "Invalid ApiKey", that neither malformed_error nor any other single field
# can hold at the same time as the Bearer-empty case. Both are recorded here
# with their exact live bytes and neither is asserted by a case below:
# asserting either would mean declaring malformed_error away from the
# sentence the more central "Bearer " failure actually gets, and every
# malformed Bearer case would stop matching. This is the same shape of gap
# remotecom/recipe.yaml records for the identical reason, on a completely
# different provider, the same day.
#
# **Credentials are checked before routing, unconditionally, for every path
# and every method.** A path this Recipe entirely invented,
# /v1/totally-bogus-path-xyz, answered the identical generic 400 with no
# credential sent -- the same body a real request to the bare host gets, so
# there is no way to tell a typo'd path from a real one without a working
# credential, and no route below needs declaring to prove it: the credential
# check runs before the router is ever consulted, which is Cauldron's own
# default (auth.after_routing is not set), so nothing had to be reshaped to
# fit. A POST carrying a body and a wrong bearer token to a different
# invented path answered the identical rejected-credential body the GET
# case did, confirming the gate does not care about the method either.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No resource is declared, anywhere. TriNet's own employee, employment,
#     company and payroll data model is entirely undocumented at any URL
#     this Recipe could reach -- see above -- and this Recipe does not
#     guess at it. The one route below carries no resource and no
#     operation; it exists only so this Recipe has a route to declare at
#     all, and no case exercises it, because every request this Recipe
#     sends fails the credential check before routing is ever attempted.
#     Its path is not a claim that TriNet has an endpoint there.
#   - A bodyless POST or PATCH -- curl with no -d -- answers 411 Length
#     Required, {"fault":{"faultstring":"Content-Length is missing",
#     "detail":{"errorcode":"messaging.adaptors.http.flow.LengthRequired"}}},
#     before anything about credentials is examined at all. That is a fact
#     about this gateway's HTTP-level strictness rather than about any
#     endpoint, it is not reachable through an ordinary HTTP client library
#     making a real request (which sends a Content-Length or a
#     Transfer-Encoding automatically), and Cauldron has no mechanism for
#     "this method requires a body before anything else is checked" that
#     is not itself an endpoint. Not modelled.
#   - The 400 body's own raw bytes carry stray whitespace baked into what
#     reads as a hand-templated string rather than a serialized object: the
#     live response is `"\n                {...}\n            "`, sixteen
#     spaces before the brace and twelve after the closing one, which
#     Content-Type: text/json (not application/json) corroborates. The case
#     below asserts the JSON content and the Content-Type header, both
#     struck live; it does not assert the exact padding, because Cauldron's
#     structured body assertions compare parsed fields rather than raw
#     bytes and reproducing arbitrary incidental whitespace exactly would
#     be pinning an implementation accident rather than a claim about the
#     API. The bytes are quoted above for a reader who wants them exactly.
#   - Whether a genuinely correct accesstoken/apikey pair, once TriNet
#     issues one to a partner, reaches a 200 of any shape is not knowable
#     from here. No case below claims one.
#
# Keys below are fixtures, not secrets, and belong to no account. No
# upstream.spec is recorded, because no machine-readable description of
# this API was ever found -- see above.

recipe: trinet
capability: hr
version: 0.1.0

upstream:
  api: v1
  docs: https://www.trinet.com/customer-resource-center/technology/integration-center

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-trinet-fixture-accesstoken-0000000000000000
  # Absent is left unnamed: it already falls through to authentication_error,
  # which is the live generic 400 -- see the header. malformed_error and
  # rejected_error are the other two of the three live, distinct Bearer-
  # channel sentences; see the header for the two more that were also struck
  # live and could not also be carried by this mechanism.
  malformed_error: invalid_bearer_token
  rejected_error: invalid_access_token

responses:
  # The shape both 401s share: {"fault":{"faultstring":"...",
  # "detail":{"errorcode":"..."}}}. Apigee's own OAuthV2 fault envelope, not
  # TriNet's -- see the header. The 400 overrides this entirely per error,
  # below, because it is a different shape from a different subsystem.
  error:
    style: flat
    message_field: fault.faultstring
    code_field: fault.detail.errorcode
    type_field: "-"

resources: {}

routes:
  # No resource exists to route to -- see the header's first fidelity gap.
  # This path is not a claim that TriNet answers here; it is what "at least
  # one route is required" needs, and no case below ever reaches it: the
  # credential check answers every request first, for every path this
  # Recipe struck, including this one.
  - method: GET
    path: /v1/company/employees
    error: authentication_error

errors:
  # The live generic 400, struck four separate ways -- see the header. Its
  # own shape, not the fault envelope above: three flat fields, a
  # non-standard Content-Type, and stray whitespace this Recipe does not
  # reproduce exactly (see the header's fidelity gap).
  authentication_error:
    status: 400
    style: flat
    message_field: message
    code_field: "-"
    fields:
      _statusCode: 400
      _statusText: "Bad Request"
    headers:
      Content-Type: "text/json"
    message: "Invalid accesstoken or apikey"

  # "Authorization: Bearer " with nothing after it -- present, and ruled out
  # by the declared prefix leaving nothing behind. Apigee's oauth.v2
  # namespace; a lowercase a in "access token". Named by auth.malformed_error.
  invalid_bearer_token:
    status: 401
    code: oauth.v2.InvalidAccessToken
    message: "Invalid access token"
    headers:
      WWW-Authenticate: 'Bearer realm="null",error="invalid_token",error_description="oauth.v2.InvalidAccessToken: Invalid access token"'

  # A well-formed, non-empty bearer value this Recipe does not hold.
  # Apigee's keymanagement.service namespace instead -- a different
  # subsystem from the empty-token case above, not merely a different
  # message -- and a capital A in "Access Token". Named by
  # auth.rejected_error.
  invalid_access_token:
    status: 401
    code: keymanagement.service.invalid_access_token
    message: "Invalid Access Token"
    headers:
      WWW-Authenticate: 'Bearer realm="null",error="invalid_token",error_description="keymanagement.service.invalid_access_token: Invalid Access Token"'

fixtures:
  empty: {}

# Every case below carries a verified date. No documentation for this API
# was ever found -- see the header -- so there is nothing to read a
# doc-sourced case from, and no case here claims one. Every request was
# struck against https://api.trinet.com directly, with no account, no API
# key and no OAuth client ever created.
conformance:
  - name: no credential at all is a generic 400, not a 401
    source: https://api.trinet.com
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/company/employees
    expect:
      status: 400
      headers:
        Content-Type: "text/json"
      body:
        message: "Invalid accesstoken or apikey"
        _statusCode: 400
        _statusText: "Bad Request"
      absent:
        - fault
        - error

  - name: an empty bearer token is refused by a different subsystem than a wrong one
    # oauth.v2.InvalidAccessToken, lowercase a. See the header for the pair
    # this is half of.
    source: https://api.trinet.com
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/company/employees
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer realm="null",error="invalid_token",error_description="oauth.v2.InvalidAccessToken: Invalid access token"'
      body:
        fault.faultstring: "Invalid access token"
        fault.detail.errorcode: oauth.v2.InvalidAccessToken

  - name: a well-formed but wrong bearer token gets the other subsystem's sentence
    # keymanagement.service.invalid_access_token, capital A. Same status as
    # the empty-token case, different errorcode namespace, different
    # capitalisation -- not a typo, struck twice.
    source: https://api.trinet.com
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/company/employees
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      headers:
        WWW-Authenticate: 'Bearer realm="null",error="invalid_token",error_description="keymanagement.service.invalid_access_token: Invalid Access Token"'
      body:
        fault.faultstring: "Invalid Access Token"
        fault.detail.errorcode: keymanagement.service.invalid_access_token

  - name: an entirely invented path fails exactly the same way, with no credential examined
    # Proves the ordering rather than assuming it: auth.after_routing is not
    # set, Cauldron's default is to check the credential before routing, and
    # this is the live request that shows TriNet actually works that way --
    # no route below needs declaring for this path at all.
    source: https://api.trinet.com/v1/totally-bogus-path-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-path-xyz
    expect:
      status: 400
      body:
        message: "Invalid accesstoken or apikey"

  - name: the credential gate does not care about the method either
    # POST, a body, and a different invented path -- same wrong-token
    # sentence as the GET case above.
    source: https://api.trinet.com/v1/another-invented-path
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /v1/another-invented-path
      headers:
        Authorization: Bearer junktoken12345
      json:
        anything: goes
    expect:
      status: 401
      body:
        fault.faultstring: "Invalid Access Token"
        fault.detail.errorcode: keymanagement.service.invalid_access_token
