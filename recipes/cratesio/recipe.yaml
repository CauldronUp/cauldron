# crates.io Recipe for Cauldron
#
# Four fields say which version is the latest one, and on a real crate they
# disagree.
#
# A crate object carries max_version, newest_version, max_stable_version and
# default_version. On serde all four read 1.0.229, which is the ordinary case
# and the reason nobody notices. On rand, checked the same day:
#
#   max_version         0.10.2
#   newest_version      0.8.8
#   max_stable_version  0.10.2
#   default_version     0.10.2
#
# newest means most recently published and max means highest by semver, so a
# patch to an old line published after a newer release makes the field called
# newest_version two minor lines behind the one called max_version. 0.10.2 went
# up on 2 July and 0.8.8 on 25 August. Code that reads newest_version to show
# "latest" shows 0.8.8, and it is right about the word and wrong about the
# question.
#
# **A request with no User-Agent is refused.** Not for authentication -- this
# API needs no credential at all -- but for attribution:
#
#   "We require that all requests include a `User-Agent` header. To allow us to
#    determine the impact your bot has on our service, we ask that your user
#    agent actually identify your bot, and not just report the HTTP client
#    library you're using."
#
# It is a 403, and the body goes on to give worked examples of bad, better and
# best. So the first thing a hand-rolled client meets is a refusal that has
# nothing to do with permission, and a library that sets no default User-Agent
# fails against a registry that is otherwise entirely public.
#
# Written against the live API rather than a document: crates.io publishes no
# OpenAPI, the endpoints are public, and every case below was checked against
# crates.io on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. id is a string on a crate and a number on a version. crate.id is "rand"
#      -- the name again, beside a name field holding the same value -- and
#      versions[i].id is 3073518. One field name, two types, one response.
#   2. One link in the links object is null and the rest are paths.
#      version_downloads, owners, owner_team, owner_user and
#      reverse_dependencies are all strings; versions is null. A client that
#      walks the object and fetches each value throws on the fifth key.
#   3. versions means two things at two levels. The response's versions is an
#      array of whole version objects; crate.versions inside it is an array of
#      integer ids for the same releases. Same name, same response, one holding
#      records and one holding numbers.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - There is no authentication, because there is none on these endpoints.
#     The 403 below is the User-Agent rule and not a credential check, and this
#     Recipe declares no scheme so that the difference is visible.
#   - Search, owners, reverse dependencies, download statistics and publishing
#     are absent. Publishing is a different protocol with a token, which is the
#     line drawn at PyPI.
#   - The keywords and categories arrays are carried as they arrive rather than
#     modelled.
#
# The fixture below is public data about public crates, recorded on the date in
# the cases.

recipe: cratesio
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://crates.io/data-access
  spec: https://crates.io/api/openapi.json
  spec_hash: ba6f84f9ed367af4aa9f71abe8da9d13010c167348e81412e04caf003f709f4b
  spec_seen: "2026-08-31"

auth:
  # Public. The refusal below is about identifying your bot, not about who you
  # are, and declaring no scheme is what keeps those two apart.
  scheme: none

required_headers:
  User-Agent: user_agent_required

responses:
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: detail
    code_field: "-"
    type_field: "-"

resources:
  crate_response:
    id:
      style: opaque
      field: "-"
    fields:
      crate:
        type: map
      # Whole objects here; integer ids under crate.versions.
      versions:
        type: list
      keywords:
        type: list
      categories:
        type: list

  version:
    id:
      style: opaque
      field: "-"
    fields:
      crate:
        type: string
        in: "-"
      version:
        type: map

routes:
  - method: GET
    path: /api/v1/crates/{id}
    resource: crate_response
    operation: get

  - method: GET
    path: /api/v1/crates/{crate}/{id}
    resource: version
    operation: get
    scope: [crate]

errors:
  user_agent_required:
    status: 403
    message: "We require that all requests include a `User-Agent` header.  To allow us to determine the impact your bot has on our service, we ask that your user agent actually identify your bot, and not just report the HTTP client library you're using."

  resource_missing:
    status: 404
    message: "crate `not-a-real-crate-cauldron-fixture` does not exist"

  invalid_request:
    status: 400
    message: Bad Request

fixtures:
  empty: {}

  registry:
    crate_response:
      # The crate where the four latest-version fields disagree.
      - id: rand
        crate:
          # A string, and the name again.
          id: rand
          name: rand
          description: "Random number generators and other randomness functionality.\n"
          max_version: 0.10.2
          # Most recently published, and two minor lines behind.
          newest_version: 0.8.8
          max_stable_version: 0.10.2
          default_version: 0.10.2
          downloads: 1588552246
          recent_downloads: 391196493
          num_versions: 93
          yanked: false
          exact_match: false
          repository: https://github.com/rust-random/rand
          homepage: https://rust-random.github.io/book
          documentation: https://docs.rs/rand
          created_at: "2015-02-03T06:17:14.147783Z"
          updated_at: "2026-08-25T07:45:50.786344Z"
          trustpub_only: true
          badges: []
          # Integer ids for the same releases the sibling array holds whole.
          versions:
            - 3073518
            - 2693360
          links:
            version_downloads: /api/v1/crates/rand/downloads
            # The one null among five paths.
            versions: null
            owners: /api/v1/crates/rand/owners
            owner_team: /api/v1/crates/rand/owner_team
            owner_user: /api/v1/crates/rand/owner_user
            reverse_dependencies: /api/v1/crates/rand/reverse_dependencies
        versions:
          - id: 3073518
            num: 0.8.8
            crate: rand
            yanked: false
            yank_message: null
            created_at: "2026-08-25T07:45:50.786344Z"
            downloads: 213534
            crate_size: 84217
            license: MIT OR Apache-2.0
            rust_version: null
            edition: "2018"
            checksum: e058c7de0b26af77780c769414d6257830bb240f3c38477dbc2c16e5f54d6d4c
            has_lib: true
            bin_names: []
            dl_path: /api/v1/crates/rand/0.8.8/download
            readme_path: /api/v1/crates/rand/0.8.8/readme
          - id: 2693360
            num: 0.10.2
            crate: rand
            yanked: false
            created_at: "2026-07-02T09:01:38.792937Z"
        keywords:
          - id: random
            keyword: random
            crates_cnt: 583
        categories:
          - id: algorithms
            category: Algorithms
            slug: algorithms

      # The ordinary case, where all four agree and nobody notices.
      - id: serde
        crate:
          id: serde
          name: serde
          max_version: 1.0.229
          newest_version: 1.0.229
          max_stable_version: 1.0.229
          default_version: 1.0.229
          num_versions: 316
          yanked: false
          created_at: "2014-12-05T20:20:39.487502Z"
          updated_at: "2026-07-18T23:05:13.266456Z"
        versions: []
        keywords: []
        categories: []

    version:
      - id: 0.8.8
        crate: rand
        version:
          id: 3073518
          num: 0.8.8
          crate: rand
          yanked: false
          created_at: "2026-08-25T07:45:50.786344Z"
          crate_size: 84217
          license: MIT OR Apache-2.0
          checksum: e058c7de0b26af77780c769414d6257830bb240f3c38477dbc2c16e5f54d6d4c
          dl_path: /api/v1/crates/rand/0.8.8/download

      # A different crate's release, so the crate segment is something the
      # cases can see. serde 1.0.229 answers 200 and rand 1.0.229 answers 404,
      # both checked -- and 0.8.8 exists under both crates, which is what
      # makes a version string meaningless without the crate beside it.
      - id: 1.0.229
        crate: serde
        version:
          id: 2817185
          num: 1.0.229
          crate: serde
          yanked: false
          created_at: "2026-07-18T23:05:13.266456Z"
          crate_size: 83669
          license: MIT OR Apache-2.0
          checksum: 4148590afebada386688f18773da617792bf2ef03ffc1e4cbd2b1d45b023e0ba
          dl_path: /api/v1/crates/serde/1.0.229/download

conformance:
  - name: four fields for the latest version, and they disagree
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # newest means most recently published; max means highest by semver.
        # 0.10.2 went up on 2 July and 0.8.8 on 25 August, so the field named
        # newest is two minor lines behind the one named max.
        "crate.max_version": 0.10.2
        "crate.newest_version": 0.8.8
        "crate.max_stable_version": 0.10.2
        "crate.default_version": 0.10.2

  - name: and on the ordinary crate all four agree
    source: https://crates.io/api/v1/crates/serde
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/serde
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # Which is why nobody notices: every crate anybody checks first looks
        # like this.
        "crate.max_version": 1.0.229
        "crate.newest_version": 1.0.229
        "crate.max_stable_version": 1.0.229
        "crate.default_version": 1.0.229

  - name: a request with no User-Agent is refused
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
    expect:
      # Not authentication: this API needs no credential at all. A library
      # that sets no default User-Agent fails against an entirely public
      # registry, and the body explains itself at length.
      status: 403
      body:
        "errors[0].detail": "We require that all requests include a `User-Agent` header.  To allow us to determine the impact your bot has on our service, we ask that your user agent actually identify your bot, and not just report the HTTP client library you're using."

  - name: id is a string on a crate and a number on a version
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # The crate's id is its name, sitting beside a name field holding the
        # same value; a version's id is an integer. One field name, two types,
        # one response.
        "crate.id": rand
        "crate.name": rand
        "versions[0].id": 3073518

  - name: one link in the links object is null and the rest are paths
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # A client that walks the object and fetches each value throws on the
        # one that is not there.
        "crate.links.owners": /api/v1/crates/rand/owners
        "crate.links.reverse_dependencies": /api/v1/crates/rand/reverse_dependencies
        "crate.links.versions": null

  - name: versions means two things at two levels
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # The response's versions holds whole records; crate.versions holds
        # integer ids for the same releases.
        "versions[0].num": 0.8.8
        "crate.versions[0]": 3073518
        "crate.num_versions": 93

  - name: a version carries its own size and checksum
    source: https://crates.io/api/v1/crates/rand
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        "versions[0].crate_size": 84217
        "versions[0].license": MIT OR Apache-2.0
        "versions[0].checksum": e058c7de0b26af77780c769414d6257830bb240f3c38477dbc2c16e5f54d6d4c
        "versions[0].rust_version": null

  - name: one version is wrapped under its own name
    source: https://crates.io/api/v1/crates/rand/0.8.8
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand/0.8.8
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        # The whole response is {"version": {...}} -- one key, where the crate
        # endpoint answers with four.
        "version.num": 0.8.8
        "version.id": 3073518
        "version.dl_path": /api/v1/crates/rand/0.8.8/download
      absent:
        - crate
        - versions

  - name: a crate nobody has published names itself in the refusal
    source: https://crates.io/api/v1/crates/not-a-real-crate-cauldron-fixture
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/not-a-real-crate-cauldron-fixture
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 404
      body:
        # The errors array again, with the crate name inside the sentence.
        "errors[0].detail": "crate `not-a-real-crate-cauldron-fixture` does not exist"

  - name: a version string means nothing without the crate beside it
    source: https://crates.io/api/v1/crates/rand/1.0.229
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/rand/1.0.229
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      # 1.0.229 is a real release of serde and answers 200 under that name.
      # Asked for under rand it is a 404 -- and 0.8.8 answers 200 under both
      # crates, naming two entirely different releases.
      status: 404
      body:
        "errors[0].detail": "crate `not-a-real-crate-cauldron-fixture` does not exist"

  - name: and the crate that does have it answers with it
    source: https://crates.io/api/v1/crates/serde/1.0.229
    verified: "2026-08-25"
    fixture: registry
    request:
      method: GET
      path: /api/v1/crates/serde/1.0.229
      headers:
        User-Agent: cauldron-conformance (github.com/CauldronUp/cauldron)
    expect:
      status: 200
      body:
        "version.num": 1.0.229
        "version.crate": serde
        "version.id": 2817185

  # The names. This Recipe declares 2 field(s) on a crate_response that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a crate_response carries the field names this Recipe declares"
    source: "https://crates.io/api/v1/crates/rand"
    fixture: registry
    request:
      method: GET
      path: "/api/v1/crates/rand"
      headers:
        "User-Agent": "cauldron-conformance (github.com/CauldronUp/cauldron)"
    expect:
      status: 200
      body:
        "categories[0].category": "Algorithms"
        "keywords[0].crates_cnt": 583

