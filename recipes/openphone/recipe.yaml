# OpenPhone Recipe for Cauldron
#
# Written against OpenPhone's API reference at openphone.com/docs and struck
# live against api.openphone.com on 2026-09-06 with no credential and then with
# a deliberately invalid one.
#
# **A failure is JSON and a not-found is HTML.** Struck live:
#
#   GET /v1/phone-numbers                       (no credential)
#   401 application/json
#   {"error":{"message":"Missing authorization header","key":"Unauthorized",
#             "trace":"5640373784117800080"}}
#
#   GET /v1/cauldron-nonexistent
#   404 text/html; charset=utf-8
#   <!DOCTYPE html><html lang="en">...
#
# So the one failure a client is guaranteed to meet while getting a URL right --
# getting it wrong -- is the one that is not JSON. Every `.json()` in the
# happy-path and error-path code throws there, and the content type says so a
# beat too late for code that does not check it. It is Express's default
# handler underneath, showing through.
#
# **`trace` is a 64-bit integer sent as a string.** `"5640373784117800080"`, 19
# digits, quoted. Nineteen digits do not survive a double, which is why it is
# quoted -- and it means the correlation id cannot be compared numerically or
# stored as a number, and a client that does either silently corrupts the value
# it would quote to support.
#
# **`key` is the vocabulary and it repeats the status word.** Struck live:
#
#   no header       message "Missing authorization header"   key "Unauthorized"
#   wrong header    message "Unauthorized"                    key "Unauthorized"
#
# So the machine-readable field is `Unauthorized` for both, and the only thing
# separating "you sent nothing" from "you sent the wrong thing" is the prose --
# where for the missing case the prose is precise and for the wrong case it is
# the same word as the key. A client switching on `key` cannot tell them apart,
# and a client switching on `message` gets one useful sentence and one echo.
#
# **The credential carries no scheme.** `Authorization: <key>`, bare -- no
# `Bearer `, which OpenPhone's documentation states and which every HTTP
# library's built-in bearer helper gets wrong by adding one.

recipe: openphone
capability: chat
version: 0.1.0

upstream:
  api: v1
  docs: https://www.openphone.com/docs/api-reference/introduction
  # No spec: OpenPhone's reference is a rendered documentation site.

auth:
  # Not bearer. The key goes in Authorization with no prefix at all, which is
  # unusual enough that the documentation calls it out and every bearer helper
  # in every HTTP library gets it wrong.
  scheme: header
  header: Authorization
  keys:
    - cauldr0nf1xtureopenph0neap1key00
  absent_error: missing_authorization
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: data
  error:
    style: nested
    key: error
    message_field: message
    # OpenPhone's own vocabulary, and the field a client is meant to branch on.
    code_field: "-"
    type_field: key

resources:
  phone_number:
    id:
      field: id
      style: prefixed
      prefix: PN
    fields:
      name:
        type: string
      number:
        type: string
      formattedNumber:
        type: string
      createdAt:
        type: datetime

routes:
  - method: GET
    path: /v1/phone-numbers
    resource: phone_number
    operation: list
    pagination:
      style: none

errors:
  missing_authorization:
    status: 401
    type: Unauthorized
    # Precise, and the only one of the two that is.
    message: "Missing authorization header"
    fields:
      # A 64-bit integer as text: 19 digits do not survive a double, so it is
      # quoted -- and it cannot be compared numerically or stored as a number
      # without corrupting the value somebody would quote to support.
      'error.trace': "5640373784117800080"

  unauthorized:
    status: 401
    type: Unauthorized
    # The same word as the key beside it, so the structured field and the
    # sentence say one thing between them.
    message: "Unauthorized"
    fields:
      'error.trace': "6861409971010616104"

  # Struck live: text/html, from Express's default handler. Served here as the
  # bytes rather than through the error envelope, because the finding is that
  # it is not JSON.
  unknown_route:
    status: 404
    empty: true

fixtures:
  empty:
    phone_number: []

  workspace:
    phone_number:
      - id: PNsL3xK9mQ
        name: Support
        number: "+15550100"
        formattedNumber: "(555) 010-0"
        createdAt: "2026-02-14T09:30:00.000Z"
      - id: PNr7VbT2wY
        name: Sales
        number: "+15550142"
        formattedNumber: "(555) 014-2"
        createdAt: "2026-06-01T14:05:22.000Z"

conformance:
  - name: no credential says exactly what is missing
    source: https://api.openphone.com/v1/phone-numbers
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers: {}
    expect:
      status: 401
      body:
        'error.message': "Missing authorization header"
        'error.key': Unauthorized

  - name: a wrong credential repeats the key as its message
    source: https://api.openphone.com/v1/phone-numbers
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        Authorization: "not-a-real-key"
    expect:
      status: 401
      body:
        # Struck live. key is Unauthorized for both failures, so the
        # machine-readable field cannot separate them, and here the sentence
        # is the same word.
        'error.message': "Unauthorized"
        'error.key': Unauthorized

  - name: the correlation id is an integer sent as text
    source: https://api.openphone.com/v1/phone-numbers
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers: {}
    expect:
      status: 401
      matches:
        # 19 digits, quoted. A double holds 15 or 16 of them, so parsing this
        # as a number changes the value a client would quote to support.
        'error.trace': '^[0-9]{19}$'

  - name: a bearer prefix is not the credential
    source: https://www.openphone.com/docs/api-reference/introduction
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        # The key with "Bearer " in front of it, which is what every HTTP
        # library's built-in helper sends and what OpenPhone does not take.
        Authorization: "Bearer cauldr0nf1xtureopenph0neap1key00"
    expect:
      status: 401
      body:
        'error.key': Unauthorized

  - name: an unknown path is not JSON at all
    source: https://api.openphone.com/v1/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: workspace
    request:
      method: GET
      path: /v1/cauldron-nonexistent
      headers:
        Authorization: "cauldr0nf1xtureopenph0neap1key00"
    expect:
      # Struck live: text/html, from Express's default handler. The one failure
      # a client meets while getting a URL wrong is the one .json() throws on.
      status: 404
      no_body: true

  - name: phone numbers arrive under data with prefixed identifiers
    source: https://www.openphone.com/docs/api-reference/phone-numbers/list
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        Authorization: "cauldr0nf1xtureopenph0neap1key00"
    expect:
      status: 200
      body:
        'data[0].id': PNsL3xK9mQ
        'data[0].name': Support

  - name: a number is sent twice in two formats
    source: https://www.openphone.com/docs/api-reference/phone-numbers/list
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        Authorization: "cauldr0nf1xtureopenph0neap1key00"
    expect:
      status: 200
      body:
        # E.164 and a display form, as separate fields. Only one of them is
        # safe to send back in a request, and nothing in either name says
        # which.
        'data[0].number': "+15550100"
        'data[0].formattedNumber': "(555) 010-0"
        'data[1].number': "+15550142"

  - name: timestamps carry milliseconds
    source: https://www.openphone.com/docs/api-reference/phone-numbers/list
    fixture: workspace
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        Authorization: "cauldr0nf1xtureopenph0neap1key00"
    expect:
      status: 200
      body:
        'data[1].createdAt': "2026-06-01T14:05:22.000Z"

  - name: a workspace with no numbers answers an empty array
    source: https://www.openphone.com/docs/api-reference/phone-numbers/list
    fixture: empty
    request:
      method: GET
      path: /v1/phone-numbers
      headers:
        Authorization: "cauldr0nf1xtureopenph0neap1key00"
    expect:
      status: 200
      body:
        data: []
