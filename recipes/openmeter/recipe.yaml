# OpenMeter Cloud Recipe for Cauldron
#
# The meters listing, read from the OpenAPI document OpenMeter publishes in its
# own repository at api/openapi.cloud.yaml, and struck live against
# openmeter.cloud on 2026-09-13 with no credential, with a wrong bearer token,
# and with a Basic header.
#
# **The one field the contract requires is the one the server leaves out.**
# `UnexpectedProblemResponse` lists `required: [type, title, detail, instance]`.
# Struck live:
#
#   404  {"type":"about:blank","title":"Not Found","status":404,"instance":"urn:request:45fc..."}
#   405  {"type":"about:blank","title":"Method Not Allowed","status":405,"instance":"urn:request:40a8..."}
#
# No `detail`. And `status`, which every one of those documents does send, is
# not in the required list. The schema requires four fields and gets three, and
# volunteers a fourth it never promised.
#
# **`invalid token: invalid token`.** A wrong bearer answers "failed to validate
# security requirements: invalid token: invalid token" -- a Go error wrapped
# around itself, the same three words twice, with the name of the middleware
# that raised it in front. The sentence a client prints is the call stack.
#
# **Every problem type is the one that means "no type".** `type` is declared
# `format: uri` with `default: about:blank`, and all five live documents send
# exactly that. RFC 9457 reserves `about:blank` for a problem with no semantics
# beyond its status code, so the machine-readable field exists on every failure
# to say there is nothing machine-readable here. (The schema's own description
# cites RFC 7807, which 9457 obsoleted in July 2023.)
#
# **Three sentences behind one title.** All three 401s are `"title":
# "Unauthorized"` and differ only in `detail`:
#
#   (no header)      failed to validate security requirements: no matching security requirement
#   Bearer notreal   failed to validate security requirements: invalid token: invalid token
#   Basic Zm9v...    failed to validate security requirements: invalid authorization header
#
# Three different causes, one title, and the field that separates them is the
# field the 404 and the 405 omit.
#
# **The identifier pattern accepts two spellings of the same identifier.**
# `^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$` -- a ULID in Crockford base32,
# which drops I, L, O and U to stop transcription errors, and then permits both
# cases. `01G65Z755AFWAKHE12NY0CQ9FH` and `01g65z755afwakhe12ny0cq9fh` both
# validate, are the same identifier, and are not the same string.
#
# **A record can tell you when it was permanently deleted.** `deletedAt` is
# "Timestamp of when the resource was permanently deleted", carried on a record
# in your hands, and `includeDeleted` is a query parameter on the listing that
# puts it there.
#
# **And the two failures with no `detail` are the two the operation never
# declares.** `listMeters` lists 400, 401, 403, 412, 500, 503 and a `default`,
# so the 404 and the 405 this API actually answers are outside its own
# enumeration -- which is why drift reports them as unbacked, and the report is
# right.
#
# Also pinned: `valueProperty` and every value in `groupBy` are JSONPath
# expressions carried as strings, so the meter's aggregation rule is a
# mini-language the contract does not describe; and the listing declares `page`
# and `pageSize` and answers a bare array with no total and no next.

recipe: openmeter
capability: analytics
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://openmeter.io/docs
  spec: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
  spec_hash: 3ca2f39b566e507412e45e351e024469aec3615e8d9786db1f5f9ae24d74a2f0
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - om_cauldr0nf1xtureto0000000000000
  absent_error: no_matching_security_requirement
  rejected_error: invalid_token
  # A Basic header is a header the scheme cannot read, and it gets its own
  # sentence under the same title.
  malformed_error: invalid_authorization_header
  after_routing: true

responses:
  list:
    # page and pageSize are declared parameters; the response is a bare array.
    style: bare
  error:
    style: flat
    # RFC 9457's summary of the problem type, and the only prose on every
    # document: detail is declared required and sent by three failures of the
    # five below.
    message_field: title
    code_field: "-"
    # The field whose value is always the value that means "there is no type".
    type_field: type
    # Sent on every document, and absent from the schema's required list.
    status_field: status

resources:
  meter:
    id:
      field: id
      # A ULID, declared by a pattern that accepts it in either case.
      style: opaque
      length: 26
    fields:
      slug:
        type: string
      name:
        type: string
      description:
        type: string
      aggregation:
        type: string
      eventType:
        type: string
      # A JSONPath expression, carried as a string.
      valueProperty:
        type: string
      # Names to JSONPath expressions, likewise.
      groupBy:
        type: map
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # "Timestamp of when the resource was permanently deleted."
      deletedAt:
      metadata:
      annotations:

routes:
  - method: GET
    path: /api/v1/meters
    resource: meter
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 100
      limit_param: pageSize
      cursor_param: page

  - method: POST
    path: /api/v1/meters
    resource: meter
    operation: create

errors:
  no_matching_security_requirement:
    status: 401
    type: about:blank
    message: Unauthorized
    fields:
      detail: "failed to validate security requirements: no matching security requirement"
      instance: urn:request:cadabba0000000000000000000000000

  invalid_token:
    status: 401
    type: about:blank
    # A Go error wrapped around itself: the same three words twice.
    message: Unauthorized
    fields:
      detail: "failed to validate security requirements: invalid token: invalid token"
      instance: urn:request:cadabba0000000000000000000000000

  invalid_authorization_header:
    status: 401
    type: about:blank
    message: Unauthorized
    fields:
      detail: "failed to validate security requirements: invalid authorization header"
      instance: urn:request:cadabba0000000000000000000000000

  unknown_route:
    status: 404
    type: about:blank
    # detail is required by the schema and is not here.
    message: Not Found
    fields:
      instance: urn:request:cadabba0000000000000000000000000

  method_not_allowed:
    status: 405
    type: about:blank
    message: Method Not Allowed
    fields:
      instance: urn:request:cadabba0000000000000000000000000

fixtures:
  empty:
    meter: []

  usage:
    meter:
      - id: 01G65Z755AFWAKHE12NY0CQ9FH
        slug: tokens_total
        name: Tokens Total
        description: AI Token Usage
        aggregation: SUM
        eventType: prompt
        # The aggregation rule, as a string in a language the schema does not
        # describe.
        valueProperty: $.tokens
        groupBy:
          model: $.model
          type: $.type
        createdAt: "2026-01-01T01:01:01.001Z"
        updatedAt: "2026-01-01T01:01:01.001Z"
        deletedAt: null
        metadata: null
        annotations: null
      # The same identifier, in the other case the declared pattern accepts.
      - id: 01g65z755afwakhe12ny0cq9fh
        slug: requests_total
        name: Requests Total
        description: ""
        aggregation: COUNT
        eventType: request
        valueProperty: null
        groupBy: {}
        createdAt: "2026-02-14T08:00:00.000Z"
        updatedAt: "2026-08-03T17:45:12.220Z"
        # Permanently deleted, and in the listing.
        deletedAt: "2026-08-03T17:45:12.220Z"
        metadata: null
        annotations: null

conformance:
  - name: the field the schema requires is the field that is missing
    source: https://openmeter.cloud/api/v1/cauldron-nope
    verified: "2026-09-13"
    fixture: usage
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        # required: [type, title, detail, instance] -- three of four, plus one
        # the list never asked for.
        type: about:blank
        title: Not Found
        status: 404
      absent:
        - detail
      matches:
        instance: '\Aurn:request:[0-9a-f]{32}\z'

  - name: a wrong method drops the same field
    source: https://openmeter.cloud/api/v1/meters
    verified: "2026-09-13"
    fixture: usage
    request:
      method: PUT
      path: /api/v1/meters
      headers: {}
    expect:
      status: 405
      body:
        type: about:blank
        title: Method Not Allowed
        status: 405
      absent:
        - detail

  - name: a missing credential names the middleware that refused it
    source: https://openmeter.cloud/api/v1/meters
    verified: "2026-09-13"
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers: {}
    expect:
      status: 401
      body:
        title: Unauthorized
        detail: "failed to validate security requirements: no matching security requirement"
        type: about:blank
        status: 401

  - name: a wrong token is invalid twice
    source: https://openmeter.cloud/api/v1/meters
    verified: "2026-09-13"
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_notarealtoken"
    expect:
      status: 401
      body:
        # The same three words, wrapped around themselves.
        detail: "failed to validate security requirements: invalid token: invalid token"
        title: Unauthorized

  - name: a Basic header is a third sentence under the same title
    source: https://openmeter.cloud/api/v1/meters
    verified: "2026-09-13"
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Basic Zm9vOmJhcg=="
    expect:
      status: 401
      body:
        detail: "failed to validate security requirements: invalid authorization header"
        # Three causes, one title.
        title: Unauthorized

  - name: an anonymous create is refused by the same sentence as a read
    source: https://openmeter.cloud/api/v1/meters
    verified: "2026-09-13"
    fixture: usage
    request:
      method: POST
      path: /api/v1/meters
      headers: {}
      json:
        slug: prompt_tokens
        aggregation: SUM
        eventType: prompt
    expect:
      status: 401
      body:
        detail: "failed to validate security requirements: no matching security requirement"

  - name: the aggregation rule is a JSONPath expression in a string
    source: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_cauldr0nf1xtureto0000000000000"
    expect:
      status: 200
      body:
        '[0].slug': tokens_total
        '[0].aggregation': SUM
        '[0].eventType': prompt
        # A mini-language the contract does not describe, in a field typed
        # string.
        '[0].valueProperty': $.tokens
        '[0].groupBy.model': $.model
        '[0].groupBy.type': $.type
        '[0].name': Tokens Total
        '[0].description': AI Token Usage

  - name: the two spellings of one identifier both satisfy the pattern
    source: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_cauldr0nf1xtureto0000000000000"
    expect:
      status: 200
      body:
        # Crockford base32 drops I, L, O and U to stop transcription errors,
        # and the pattern then permits both cases.
        '[0].id': 01G65Z755AFWAKHE12NY0CQ9FH
        '[1].id': 01g65z755afwakhe12ny0cq9fh

  - name: a permanently deleted meter is in the listing
    source: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_cauldr0nf1xtureto0000000000000"
    expect:
      status: 200
      body:
        # "Timestamp of when the resource was permanently deleted", on a
        # record in your hands.
        '[1].deletedAt': "2026-08-03T17:45:12.220Z"
        '[1].aggregation': COUNT
        '[1].metadata': null
        '[1].annotations': null
        '[0].deletedAt': null
        '[1].createdAt': "2026-02-14T08:00:00.000Z"
        '[1].updatedAt': "2026-08-03T17:45:12.220Z"

  - name: the paged listing answers a bare array
    source: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
    fixture: usage
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_cauldr0nf1xtureto0000000000000"
      query:
        pageSize: "1"
        page: "2"
    expect:
      status: 200
      body:
        # No total, no next: page and pageSize go in and an array comes back.
        '[0].slug': requests_total

  - name: an account with no meters answers an empty array
    source: https://raw.githubusercontent.com/openmeterio/openmeter/main/api/openapi.cloud.yaml
    fixture: empty
    request:
      method: GET
      path: /api/v1/meters
      headers:
        Authorization: "Bearer om_cauldr0nf1xtureto0000000000000"
    expect:
      status: 200
      body_matches: '\A\[\s*\]\s*\z'
