# Vast.ai Recipe for Cauldron
#
# The instance listing, read from Vast.ai's own published CLI (vast-python's
# vast.py), and struck live against cloud.vast.ai on 2026-09-13 with no
# credential, with a wrong bearer, with the key in the query string, on a path
# that does not exist, and with a method the path does not take.
#
# **A wrong key is a 404.** Struck live:
#
#   (no header)     403  {"success":false,"error":"auth_error","msg":"This action requires login."}
#   Bearer notreal  404  {"success":false,"error":"auth_error","msg":"Invalid user key"}
#
# The body says `auth_error` and the status line says Not Found. A client
# branching on the status retries the path; one branching on the body fixes the
# key; the same response tells them different things. And the missing credential
# is Forbidden, which is the status for a caller who has been identified.
#
# **The key is accepted in the query string.** `?api_key=notarealkey` is read and
# judged, so the credential can travel in the URL -- into access logs, browser
# history and `Referer` headers -- and nothing about the API stops it.
#
# **The discriminator disappears exactly when the path is wrong.** An unrouted
# path answers `{"success":false,"msg":"Not found"}` -- two keys where every
# other failure has three, with `error` simply absent.
#
# **And the address without the trailing slash is a permanent redirect to
# another hostname.** `GET https://cloud.vast.ai/api/v0/instances` answers a 301
# to `https://console.vast.ai/api/v0/instances/`, as an HTML page from the
# proxy. The host changes, the path gains a slash, and the body is not JSON.
#
# **`duration` means two different things on two records.** In the vendor's own
# CLI it is divided by 86400 and labelled `Max_Days` on an offer, and divided by
# 3600 and labelled `age(hours)` on an instance. One field name, one unit on the
# wire, two meanings and two tables.
#
# **And the instance carries a second time field that does say its unit.**
# `uptime_mins` beside `duration`: minutes in the name, seconds in the one
# without a name for them.
#
# **`reliability2` is a fraction the same tool renders two ways.** The instance
# and offer tables multiply it by 100 and call it `R`; the volume table prints
# it raw to four decimals and calls it `reliab`. A field with a version number
# in its name, and no unit anywhere in the response.
#
# **Three status fields.** `actual_status`, `intended_status` and `status_msg` --
# so a record says what it is, what it was meant to be, and a sentence about the
# difference, and the field a client reads first is the one called "actual".
#
# Also pinned: `cpu_ram` is megabytes, which the CLI divides by 1000 rather than
# 1024 to show gigabytes; `dph_total` is dollars per hour abbreviated to eight
# characters, with no currency field anywhere; and `success: false` sits in the
# body of every failure beside a status line that already said so.

recipe: vastai
capability: infrastructure
version: 0.1.0

upstream:
  api: v0
  docs: https://docs.vast.ai/api-reference
  # No spec: Vast.ai publishes a Python CLI rather than a machine-readable
  # description, and no OpenAPI document is served at any address this Recipe
  # could find. The record shape below is that CLI's own field tables.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nf1xturek3y00000000000000000000000000000000000000000000000
  also:
    # The same secret, in the URL.
    - scheme: query
      param: api_key
      prefix: "-"
  absent_error: requires_login
  rejected_error: invalid_user_key
  malformed_error: requires_login
  # The router runs first for a path that does not exist, and the credential
  # check runs first for a method a real path does not take.
  after_routing: true

responses:
  list:
    style: wrapped
    key: instances
  error:
    style: flat
    message_field: msg
    code_field: error
    fields:
      # Beside a status line that already said so.
      success: false

resources:
  instance:
    id:
      field: id
      style: numeric
      type: number
    fields:
      machine_id:
        type: integer
      # What it is, what it was meant to be, and a sentence about the gap.
      actual_status:
        type: string
      intended_status:
        type: string
      status_msg:
      num_gpus:
        type: integer
      gpu_name:
        type: string
      gpu_util:
        type: number
      cpu_cores_effective:
        type: number
      # Megabytes, which the CLI divides by a thousand to print gigabytes.
      cpu_ram:
        type: number
      disk_space:
        type: number
      ssh_host:
        type: string
      ssh_port:
        type: integer
      # Dollars per hour, in eight characters, with no currency anywhere.
      dph_total:
        type: number
      image_uuid:
        type: string
      inet_up:
        type: number
      inet_down:
        type: number
      # A fraction, with a version number in its name.
      reliability2:
        type: number
      label:
      # Seconds, on a field the CLI reads as days on one record and hours here.
      duration:
        type: number
      # And minutes, said in the name.
      uptime_mins:
        type: number

routes:
  - method: GET
    path: /api/v0/instances/
    resource: instance
    operation: list
    pagination:
      style: none

errors:
  requires_login:
    # Forbidden, to a caller who has not been identified at all.
    status: 403
    code: auth_error
    message: This action requires login.

  invalid_user_key:
    # Not Found, for a credential that was merely wrong.
    status: 404
    code: auth_error
    message: Invalid user key

  method_not_allowed:
    # Live, a wrong method on a real path is answered by the credential check
    # rather than by the router.
    status: 403
    code: auth_error
    message: This action requires login.

  unknown_route:
    status: 404
    # The discriminator, gone exactly when the path is wrong.
    code_field: "-"
    message: Not found

fixtures:
  empty:
    instance: []

  rented:
    instance:
      - id: 19483726
        machine_id: 40218
        # Running, and meant to be running.
        actual_status: running
        intended_status: running
        status_msg: ""
        num_gpus: 2
        gpu_name: RTX 4090
        gpu_util: 97.4
        cpu_cores_effective: 12.5
        # Megabytes on the wire.
        cpu_ram: 128846
        disk_space: 200
        ssh_host: ssh4.vast.ai
        ssh_port: 41022
        dph_total: 0.7412
        image_uuid: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-devel
        inet_up: 921.4
        inet_down: 943.8
        # A fraction, printed as a percentage by two tables and raw by a third.
        reliability2: 0.9987
        label: trainer
        # Seconds, on the field the same CLI reads as days elsewhere.
        duration: 183621.4
        # And minutes, on the one that says so.
        uptime_mins: 3060.36
      - id: 19483999
        machine_id: 51177
        # Meant to be running, and not.
        actual_status: exited
        intended_status: running
        status_msg: "Error response from daemon: OCI runtime create failed"
        num_gpus: 1
        gpu_name: A100 PCIE
        gpu_util: 0
        cpu_cores_effective: 8
        cpu_ram: 64420
        disk_space: 50
        ssh_host: ssh6.vast.ai
        ssh_port: 42311
        dph_total: 1.104
        image_uuid: vastai/base-image:cuda-12.4
        inet_up: 512
        inet_down: 498.2
        reliability2: 0.9421
        label: null
        duration: 902.0
        uptime_mins: 0

conformance:
  - name: a wrong key is answered Not Found
    source: https://cloud.vast.ai/api/v0/instances/
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      # The status line says the thing is not there...
      status: 404
      body:
        # ...and the body says the credential is wrong.
        error: auth_error
        msg: Invalid user key
        success: false

  - name: and a missing one is answered Forbidden
    source: https://cloud.vast.ai/api/v0/instances/
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers: {}
    expect:
      # Forbidden, to a caller who has not been identified at all.
      status: 403
      body:
        error: auth_error
        msg: This action requires login.
        success: false

  - name: the key is read from the query string
    source: https://cloud.vast.ai/api/v0/instances/
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers: {}
      query:
        # Read and judged, so the secret can live in a URL.
        api_key: notarealkey
    expect:
      status: 404
      body:
        error: auth_error
        msg: Invalid user key

  - name: the discriminator disappears when the path is wrong
    source: https://cloud.vast.ai/api/v0/cauldron-nope
    verified: "2026-09-13"
    fixture: rented
    request:
      method: GET
      path: /api/v0/cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        msg: Not found
        success: false
      absent:
        # Two keys, where every other failure has three.
        - error

  - name: a method the route does not take is answered by the credential check
    source: https://cloud.vast.ai/api/v0/instances/
    verified: "2026-09-13"
    fixture: rented
    request:
      method: PUT
      path: /api/v0/instances/
      headers: {}
    expect:
      status: 403
      body:
        error: auth_error
        msg: This action requires login.

  - name: a record says what it is and what it was meant to be
    source: https://github.com/vast-ai/vast-python
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Three status fields, and the one a client reads first is called
        # "actual".
        'instances[0].actual_status': running
        'instances[0].intended_status': running
        'instances[0].status_msg': ""
        'instances[1].actual_status': exited
        'instances[1].intended_status': running
        'instances[1].status_msg': "Error response from daemon: OCI runtime create failed"

  - name: two time fields and only one says its unit
    source: https://github.com/vast-ai/vast-python
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Seconds, divided by 86400 on an offer and by 3600 here...
        'instances[0].duration': 183621.4
        # ...and minutes, in the name.
        'instances[0].uptime_mins': 3060.36
        'instances[1].duration': 902.0
        'instances[1].uptime_mins': 0

  - name: a fraction with a version number in its name
    source: https://github.com/vast-ai/vast-python
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # Printed as a percentage by two of the CLI's tables and raw by a
        # third, with no unit anywhere in the response.
        'instances[0].reliability2': 0.9987
        'instances[1].reliability2': 0.9421
        'instances[0].gpu_util': 97.4
        'instances[1].gpu_util': 0

  - name: megabytes divided by a thousand and dollars with no currency
    source: https://github.com/vast-ai/vast-python
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        # The CLI shows this as RAM in gigabytes by dividing by 1000.
        'instances[0].cpu_ram': 128846
        # Eight characters for dollars per hour, and nothing naming the
        # currency.
        'instances[0].dph_total': 0.7412
        'instances[1].dph_total': 1.104
        'instances[0].cpu_cores_effective': 12.5
        'instances[0].disk_space': 200
        'instances[0].num_gpus': 2
        'instances[0].gpu_name': RTX 4090
        'instances[0].machine_id': 40218
        'instances[0].image_uuid': pytorch/pytorch:2.4.0-cuda12.1-cudnn9-devel
        'instances[0].inet_up': 921.4
        'instances[0].inet_down': 943.8

  - name: the address to reach the machine is on the record
    source: https://github.com/vast-ai/vast-python
    fixture: rented
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        'instances[0].ssh_host': ssh4.vast.ai
        'instances[0].ssh_port': 41022
        'instances[1].ssh_host': ssh6.vast.ai
        'instances[0].label': trainer
        'instances[1].label': null
        'instances[0].id': 19483726

  - name: an account with no instances still sends the envelope
    source: https://github.com/vast-ai/vast-python
    fixture: empty
    request:
      method: GET
      path: /api/v0/instances/
      headers:
        Authorization: "Bearer cauldr0nf1xturek3y00000000000000000000000000000000000000000000000"
    expect:
      status: 200
      body:
        instances: []
