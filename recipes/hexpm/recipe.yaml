# Hex.pm Recipe for Cauldron
#
# The API hands you the dependency line to paste, and the three it hands you
# disagree about what to depend on.
#
# Every package carries a configs object with a ready-made declaration for each
# build tool in the ecosystem. For phoenix 1.8.13 they are, verbatim:
#
#   "mix.exs":       {:phoenix, "~> 1.8"}
#   "rebar.config":  {phoenix, "1.8.13"}
#   "erlang.mk":     dep_phoenix = hex 1.8.13
#
# The first is a range: ~> 1.8 accepts any 1.8.x and will pick up 1.8.14 on the
# next resolve. The other two are exact pins. So the same request, in one
# object, tells an Elixir project to float within a minor line and an Erlang
# project to freeze on a patch -- and the only thing deciding which policy you
# get is which key you copied.
#
# Neither is wrong for its tool. What is worth recording is that the choice is
# made for you, invisibly, by a field most people read as three spellings of
# one answer.
#
# Written against the live API rather than a document: Hex publishes no
# OpenAPI, the package endpoint is public, and every case below was checked
# against hex.pm on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. There are four download counters and one of them has no window.
#      downloads is {"all": ..., "day": ..., "week": ..., "recent": ...}.
#      all, day and week say what they measure; recent does not, and there is
#      no month beside it to infer from. It is the second largest of the four
#      and nothing in the response says over what.
#   2. Two fields for the latest version, agreeing today. latest_version and
#      latest_stable_version are both 1.8.13 for phoenix, and they part
#      company the moment a pre-release is published -- the same shape as
#      crates.io's four, which is how a reader learns this is a category of
#      trap rather than one provider's quirk.
#   3. maintainers is always empty and owners is where the people are. meta
#      .maintainers is [] on phoenix, a field kept from an older shape, while
#      owners carries the actual usernames and their API URLs.
#   4. An advisory has three identifiers. security_advisories[0].id is
#      "EEF-CVE-2026-56812" with aliases holding the CVE and the GHSA for the
#      same finding, so deduplicating across sources means matching on a list
#      rather than on an id.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The fixture holds three of phoenix's 180 releases. The releases array
#     carries a version, a URL and a timestamp per entry and nothing else --
#     the release detail is a second request per version, which is the shape
#     and is not served.
#   - Publishing, docs publishing, owners management, the repository endpoints
#     and the audit API are absent.
#   - private is nullable and is null on the public repository, which is
#     served; what it means on a private organisation is not something this
#     file can check.
#
# The fixture below is public data about a public package, recorded on the date
# in the cases.

recipe: hexpm
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://github.com/hexpm/specifications/blob/main/apiary.apib

auth:
  # Public for reads.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    status_field: status
    code_field: "-"
    type_field: "-"

resources:
  package:
    id:
      style: opaque
      field: name
    fields:
      repository:
        type: string
      private:
        type: boolean
      url:
        type: string
      html_url:
        type: string
      docs_html_url:
        type: string
      # Three build tools, three answers.
      configs:
        type: map
      # Four counters, three windows.
      downloads:
        type: map
      meta:
        type: map
      owners:
        type: list
      releases:
        type: list
      retirements:
        type: map
      security_advisories:
        type: list
      latest_version:
        type: string
      latest_stable_version:
        type: string
      inserted_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /api/packages/{id}
    resource: package
    operation: get

errors:
  resource_missing:
    status: 404
    message: Page not found

  invalid_request:
    status: 400
    message: Bad request

fixtures:
  empty: {}

  registry:
    package:
      - id: phoenix
        repository: hexpm
        private: null
        url: https://hex.pm/api/packages/phoenix
        html_url: https://hex.pm/packages/phoenix
        docs_html_url: https://phoenix.hexdocs.pm/
        configs:
          # A range.
          mix.exs: '{:phoenix, "~> 1.8"}'
          # An exact pin.
          rebar.config: '{phoenix, "1.8.13"}'
          # And another.
          erlang.mk: dep_phoenix = hex 1.8.13
        downloads:
          all: 154179815
          day: 72638
          week: 406640
          # The fourth, over an unnamed window.
          recent: 4177048
        meta:
          description: Peace of mind from prototype to production
          licenses:
            - MIT
          links:
            GitHub: https://github.com/phoenixframework/phoenix
            Changelog: https://phoenix.hexdocs.pm/changelog.html
          # Kept from an older shape, and empty.
          maintainers: []
        owners:
          - username: chrismccord
            url: https://hex.pm/api/users/chrismccord
        releases:
          - version: 1.8.13
            url: https://hex.pm/api/packages/phoenix/releases/1.8.13
            has_docs: true
            inserted_at: "2026-08-25T09:12:05.501145Z"
          - version: 1.8.12
            url: https://hex.pm/api/packages/phoenix/releases/1.8.12
            has_docs: true
            inserted_at: "2026-07-14T10:02:11.101204Z"
          - version: 1.8.11
            url: https://hex.pm/api/packages/phoenix/releases/1.8.11
            has_docs: true
            inserted_at: "2026-06-02T08:44:52.884319Z"
        retirements: {}
        security_advisories:
          - id: EEF-CVE-2026-56812
            aliases:
              - CVE-2026-56812
              - GHSA-63mc-hw7g-86rr
        latest_version: 1.8.13
        latest_stable_version: 1.8.13
        inserted_at: "2014-04-21T22:38:32.000000Z"
        updated_at: "2026-08-25T09:12:08.458607Z"

conformance:
  - name: the three dependency lines disagree about what to depend on
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # ~> 1.8 floats within the minor line and will pick up 1.8.14 on the
        # next resolve; the other two freeze on the patch. One object, one
        # request, two dependency policies, chosen by which key you copied.
        "configs.mix\\.exs": '{:phoenix, "~> 1.8"}'
        "configs.rebar\\.config": '{phoenix, "1.8.13"}'
        "configs.erlang\\.mk": dep_phoenix = hex 1.8.13

  - name: four download counters and one has no window
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # all, day and week say what they measure. recent does not, there is
        # no month to infer from, and it is the second largest of the four.
        "downloads.all": 154179815
        "downloads.day": 72638
        "downloads.week": 406640
        "downloads.recent": 4177048

  - name: two fields for the latest version, agreeing today
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # They part company the moment a pre-release is published, which is
        # the same shape as crates.io's four and is how a reader learns this
        # is a category rather than one provider's quirk.
        name: phoenix
        latest_version: 1.8.13
        latest_stable_version: 1.8.13
        "releases[0].version": 1.8.13

  - name: maintainers is empty and owners is where the people are
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # meta.maintainers is kept from an older shape and is empty; owners
        # carries the usernames and their API URLs, one level up.
        "meta.maintainers": []
        "owners[0].username": chrismccord
        "owners[0].url": https://hex.pm/api/users/chrismccord

  - name: an advisory has three identifiers for one finding
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # Hex's own id, with the CVE and the GHSA beside it, so deduplicating
        # across sources means matching on a list rather than on an id.
        "security_advisories[0].id": EEF-CVE-2026-56812
        "security_advisories[0].aliases[0]": CVE-2026-56812
        "security_advisories[0].aliases[1]": GHSA-63mc-hw7g-86rr

  - name: a release entry is a pointer rather than a release
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # A version, a URL, a docs flag and a timestamp. No requirements, no
        # checksum, no licence -- those are a second request per version, and
        # phoenix has 180 of them.
        "releases[1].version": 1.8.12
        "releases[1].url": https://hex.pm/api/packages/phoenix/releases/1.8.12
        "releases[1].has_docs": true
      absent:
        - "releases[1].requirements"
        - "releases[1].checksum"

  - name: retirements is an empty object rather than an empty list
    source: https://hex.pm/api/packages/phoenix
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/phoenix
    expect:
      status: 200
      body:
        # A map keyed by version, beside security_advisories which is an
        # array, so the two things a client checks before installing are
        # shaped differently from each other.
        retirements: {}
        private: null
        repository: hexpm

  - name: a package nobody has published repeats its status in the body
    source: https://hex.pm/api/packages/not-a-real-package-cauldron
    verified: "2026-08-26"
    fixture: registry
    request:
      method: GET
      path: /api/packages/not-a-real-package-cauldron
    expect:
      status: 404
      body:
        # Clean JSON with the status repeated inside it -- the sixth distinct
        # not-found shape in this collection, after a JSON object, a bare
        # sentence, an HTML page, a 200 with an empty array and a bare JSON
        # string served as HTML.
        message: Page not found
        status: 404

  # The names. This Recipe declares 4 field(s) on a package that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 4 name(s) that came back at the paths they came back
  # under.
  - name: "a package carries the field names this Recipe declares"
    source: "https://hex.pm/api/packages/phoenix"
    fixture: registry
    request:
      method: GET
      path: "/api/packages/phoenix"
    expect:
      status: 200
      body:
        "docs_html_url": "https://phoenix.hexdocs.pm/"
        "html_url": "https://hex.pm/packages/phoenix"
        "inserted_at": "2014-04-21T22:38:32.000000Z"
        "updated_at": "2026-08-25T09:12:08.458607Z"

