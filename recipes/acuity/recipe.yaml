# Acuity Scheduling Recipe for Cauldron
#
# Written against Acuity's API reference at developers.acuityscheduling.com and
# struck live against acuityscheduling.com on 2026-09-07 with no credential,
# with a deliberately invalid one, and on a path that does not exist.
#
# **Three fields, one fact, three renderings.** Struck live, identically for
# all three requests:
#
#   401 {"status_code":401,"message":"Unauthorized","error":"unauthorized"}
#
# `status_code` is the number. `message` is the status phrase, capitalised.
# `error` is the status phrase, lower-cased. Every one of the three is
# derivable from the status line, and the body carries nothing the status did
# not already say.
#
# It is the most compact example in this collection of a pattern several
# providers have. [beehiiv](../beehiiv) sends the status three times and adds a
# real `errors` array beside it. [terraformcloud](../terraformcloud) sends it
# twice and stops. Acuity sends it three times and stops -- so a client that
# parses the body learns the status, and a client that reads the status line
# learns the same thing sooner.
#
# **The three renderings disagree about case.** `Unauthorized` and
# `unauthorized`, in one object, both meaning the reason phrase. A client
# switching on `error` and a client displaying `message` are reading the same
# word with different capitalisation, and neither field says which is which.
#
# **An unknown path is a 401 too**, so the route is judged after the credential
# and a path cannot be shown not to exist.
#
# **The credential is Basic with the user id as the username.** Acuity's own
# convention is `userId:apiKey`, so the username is a number and the password
# is the secret -- and the refusal says nothing about either half.

recipe: acuity
capability: scheduling
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.acuityscheduling.com/reference
  # No spec: Acuity publishes a rendered reference site.

auth:
  # userId:apiKey. The username is a number and the password is the secret.
  scheme: basic
  keys:
    - "12345678"
  absent_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: error
    code_type: string
    status_field: status_code

resources:
  appointment:
    id:
      field: id
      style: numeric
    fields:
      firstName:
        type: string
      lastName:
        type: string
      email:
        type: string
      datetime:
        type: string
      endTime:
        type: string
      type:
        type: string
      canceled:
        type: boolean
        default: false
      price:
        type: string

routes:
  - method: GET
    path: /api/v1/appointments
    resource: appointment
    operation: list
    pagination:
      style: page
      limit: 100
      max_limit: 100
      limit_param: max
      cursor_param: page

errors:
  unauthorized:
    status: 401
    # The status phrase, lower-cased, in the field a client branches on.
    code: unauthorized
    # The status phrase, capitalised, in the field a client displays. Same
    # word, different case, one object.
    message: Unauthorized

fixtures:
  empty:
    appointment: []

  calendar:
    appointment:
      - id: 1284461902
        firstName: Ada
        lastName: Lovelace
        email: ada@example.invalid
        datetime: "2026-09-12T10:00:00-0400"
        endTime: "10:45"
        type: Consultation
        canceled: false
        price: "150.00"
      - id: 1284461903
        firstName: Grace
        lastName: Hopper
        email: grace@example.invalid
        datetime: "2026-09-12T11:00:00-0400"
        endTime: "11:30"
        type: Follow-up
        # Cancelled and still in the listing, with no default filter -- so a
        # client counting bookings counts this one unless it checks.
        canceled: true
        price: "0.00"

conformance:
  - name: the failure says the status three times
    source: https://acuityscheduling.com/api/v1/appointments
    verified: "2026-09-07"
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers: {}
    expect:
      status: 401
      body:
        # The number, the phrase capitalised, and the phrase lower-cased. All
        # three derivable from the status line, and the body carries nothing
        # the status did not already say.
        status_code: 401
        message: Unauthorized
        error: unauthorized

  - name: the two phrase fields disagree about case
    source: https://acuityscheduling.com/api/v1/appointments
    verified: "2026-09-07"
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers: {}
    expect:
      status: 401
      body:
        # One object, one word, two capitalisations -- and neither field name
        # says which is the one to branch on.
        message: Unauthorized
        error: unauthorized

  - name: a wrong credential is byte-identical
    source: https://acuityscheduling.com/api/v1/appointments
    verified: "2026-09-07"
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        # notreal:notreal
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      status: 401
      body:
        status_code: 401
        error: unauthorized

  - name: an unknown path is a credential failure
    source: https://acuityscheduling.com/api/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: calendar
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers:
        Authorization: "Basic bm90cmVhbDpub3RyZWFs"
    expect:
      # The route is judged after the credential, so a path cannot be shown
      # not to exist.
      status: 401
      body:
        error: unauthorized

  - name: appointments are a bare array
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # No envelope on success, where every failure has three fields.
        '[0].id': 1284461902
        '[0].firstName': Ada

  - name: the start is a timestamp and the end is a clock time
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # `datetime` is a full offset timestamp and `endTime` is "10:45" --
        # a wall clock with no date and no zone. So computing a duration means
        # combining a date from one field with a time from another, and an
        # appointment crossing midnight cannot be represented at all.
        '[0].datetime': "2026-09-12T10:00:00-0400"
        '[0].endTime': "10:45"

  - name: the offset has no colon in it
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # -0400 rather than -04:00 -- ISO 8601 basic format, not RFC 3339, so
        # a strict parser refuses it. The same shape dlocal has.
        '[1].datetime': "2026-09-12T11:00:00-0400"

  - name: a cancelled appointment is in the listing
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # No default filter, so a client counting bookings counts this one --
        # and the spelling is the American one, which is worth knowing before
        # grepping for it.
        '[1].canceled': true
        '[1].price': "0.00"

  - name: money is a decimal string
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body:
        # "150.00" as text, which is exact -- and with no currency field
        # anywhere on the record, so the amount is unlabelled.
        '[0].price': "150.00"
        '[0].type': Consultation

  - name: appointments page on max and page
    source: https://developers.acuityscheduling.com/reference
    fixture: calendar
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
      query:
        # `max` rather than limit, which usually means the largest value
        # rather than how many to send -- and there is no total anywhere, so a
        # client cannot tell a full last page from a full middle one.
        max: "1"
        page: "2"
    expect:
      status: 200
      body:
        '[0].lastName': Hopper
        '[0].email': grace@example.invalid

  - name: a calendar with no appointments answers an empty array
    source: https://developers.acuityscheduling.com/reference
    fixture: empty
    request:
      method: GET
      path: /api/v1/appointments
      headers:
        Authorization: "Basic MTIzNDU2Nzg6Y2F1bGRyb24="
    expect:
      status: 200
      body_matches: '^\[\s*\]\s*$'
