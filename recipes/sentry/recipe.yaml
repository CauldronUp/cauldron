# Sentry Recipe for Cauldron
#
# Sentry has no sandbox and no test mode. An integration that reads issues
# needs issues, and the only way to get them is to send real errors into a real
# project, which then pollutes the alerting everyone else depends on. Teams
# make a scratch project, forget to point alerts away from it, and page
# somebody at three in the morning for a deliberately thrown exception.
#
# Two things worth modelling exactly:
#
#   1. Failures are a single "detail" string and nothing else. No code, no
#      type, no nesting. Code written for almost any other provider has
#      nothing to read, and the property it reaches for is undefined rather
#      than absent, so it throws instead of reporting.
#   2. Collections are bare arrays. The paging cursor lives in a Link header
#      rather than the body, which is why an emulator returning an object with
#      a next_cursor would teach the wrong thing entirely.
#
# Known fidelity gap, stated rather than hidden: Cauldron does not model the
# Link header, so cursor paging is not exercised. Everything else about the
# shape is.
#
# Checked live against sentry.io, unauthenticated, 2026-09-05: no
# Authorization header at all answers exactly what this file already had,
# "Authentication credentials were not provided.", and a syntactically
# fine but fictitious bearer answers a different sentence, "Invalid org
# token", not modelled before this check. A wrong method on a real path
# lands on the absent-credential sentence too, so the credential is
# checked first -- but a genuinely unrouted path does not: it answers a
# distinctive plain-text 404, "Route not found, did you forget a trailing
# slash?", with a caret pointing at the fix, needing no credential at all.
# Sentry checks the path and the credential in an order that depends on
# which mistake was made, which this project's routing mechanism cannot
# express in one setting without breaking the wrong-method case, so that
# finding is recorded rather than encoded.
#
# Tokens below are fixtures, not secrets.

recipe: sentry
capability: observability
version: 0.1.0

upstream:
  api: "0"
  docs: https://docs.sentry.io/api
  # Sentry publishes its own description in its own GitHub
  # organisation, and it declares all three listings this Recipe
  # models. It is where the paging parameter names below came from.
  spec: https://raw.githubusercontent.com/getsentry/sentry-api-schema/main/openapi-derefed.json
  spec_hash: 933b51a174539389c3b1c878073b3469aa2d88e662a26f4259703bc0fb339971
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sntrys_cauldron
  # Verified live, 2026-09-05: a wrong token is a different sentence from
  # a missing one. See the file header.
  rejected_error: invalid_org_token

responses:
  list:
    style: bare
  # A Sentry failure is one string called detail. Nothing else.
  error:
    style: flat
    message_field: detail

resources:
  issue:
    collection: issues
    id:
      style: digits
      length: 10
    fields:
      # In the path on the listing that reaches it, and Sentry does not put it
      # on the issue. What an issue carries is a project object; the slug on
      # its own is the Recipe's way of scoping the listing, and it stays off
      # the wire.
      project_slug:
        type: string
        in: "-"
      shortId:
        type: string
      title:
        type: string
        required: true
      culprit:
        type: string
      # Sentry's own lifecycle. An ignored issue still receives events and
      # still counts against quota; it just stops alerting. Code that treats
      # ignored as resolved reports a problem as fixed when it is not.
      status:
        type: string
        default: unresolved
      level:
        type: string
        default: error
      # These are strings in the API, not numbers, which catches out anyone
      # summing them without a parse.
      count:
        type: string
        default: "1"
      userCount:
        type: integer
        default: 0
      isSubscribed:
        type: boolean
        default: false
      firstSeen:
        type: datetime
      lastSeen:
        type: datetime

  project:
    collection: projects
    id:
      style: digits
      length: 7
    fields:
      slug:
        type: string
        required: true
      name:
        type: string
        required: true
      platform:
        type: string
      dateCreated:
        type: datetime

  release:
    collection: releases
    id:
      style: digits
      length: 10
    fields:
      version:
        type: string
        required: true
      shortVersion:
        type: string
      ref:
        type: string
      dateCreated:
        type: datetime
      dateReleased:
        type: datetime

routes:
  - method: GET
    path: /api/0/projects/{organization}/{project_slug}/issues/
    resource: issue
    operation: list
    scope: [project_slug]
    pagination:
      # Sentry's own description declares limit and cursor here, and
      # per_page and cursor on the two organisation listings below -- two
      # names for the page size on one API. This block declared the style
      # and neither name, so the runtime read limit everywhere, which is
      # right on this route and wrong on the other two.
      style: cursor
      limit: 25
      limit_param: limit
      cursor_param: cursor

  # Under the organization. Sentry's bare /api/0/issues/{id}/ is gone -- the
  # single-issue endpoints are /api/0/organizations/{org}/issues/{id}/ now,
  # and its description declares no other. Code written against the old shape
  # gets a 404 that reads like a missing issue rather than a missing route.
  - method: GET
    path: /api/0/organizations/{organization}/issues/{id}/
    resource: issue
    operation: get

  - method: PUT
    path: /api/0/organizations/{organization}/issues/{id}/
    resource: issue
    operation: update

  - method: DELETE
    path: /api/0/organizations/{organization}/issues/{id}/
    resource: issue
    operation: delete
    # 202, and nothing in the body. Sentry accepts the deletion and does it
    # later, so a client that reads a 204 as "gone" is reading a 202 as
    # "gone" too -- and the issue is still there for a while afterwards.
    status: 202
    empty_body: true

  - method: GET
    path: /api/0/organizations/{organization}/projects/
    resource: project
    operation: list
    pagination:
      # per_page here, not limit -- Sentry's own description names it, and
      # names limit on the issues listing instead. The cursor is the same
      # word on all three.
      style: cursor
      limit: 25
      limit_param: per_page
      cursor_param: cursor

  - method: GET
    path: /api/0/organizations/{organization}/releases/
    resource: release
    operation: list
    pagination:
      # per_page here, not limit -- Sentry's own description names it, and
      # names limit on the issues listing instead. The cursor is the same
      # word on all three.
      style: cursor
      limit: 25
      limit_param: per_page
      cursor_param: cursor

  - method: POST
    path: /api/0/organizations/{organization}/releases/
    resource: release
    operation: create
    status: 201

webhooks:
  events:
    - issue.created
    - issue.resolved
    - issue.ignored
    - issue.assigned
    - error.created
  signing:
    scheme: hmac-sha256
    header: Sentry-Hook-Signature
    secret: cauldron-client-secret

errors:
  rate_limit:
    status: 429
    message: You are attempting to use this endpoint too frequently.
    headers:
      Retry-After: "40"
      X-Sentry-Rate-Limit-Remaining: "0"

  # Verified live, 2026-09-05: no Authorization header at all.
  authentication_error:
    status: 401
    message: Authentication credentials were not provided.

  # Verified live, 2026-09-05: a syntactically fine but fictitious bearer.
  invalid_org_token:
    status: 401
    message: Invalid org token

  resource_missing:
    status: 404
    message: The requested resource does not exist

  parameter_missing:
    status: 400
    message: "{detail} is required."

  # A token scoped to read events cannot resolve an issue, and the message
  # does not say which scope is missing, which is worth reproducing exactly.
  insufficient_scope:
    status: 403
    message: You do not have permission to perform this action.

  # The state that ends a CI run and looks nothing like a code failure: the
  # organisation is over its event quota and Sentry starts refusing.
  quota_exceeded:
    status: 429
    message: Event limit exceeded for this organization.

fixtures:
  empty: {}

  small-org:
    project:
      - id: "1000001"
        slug: checkout
        name: Checkout
        platform: javascript-react
    issue:
      - id: "5000000001"
        project_slug: checkout
        shortId: CHECKOUT-1
        title: "TypeError: Cannot read properties of undefined (reading 'total')"
        culprit: app/cart/summary.tsx
        status: unresolved
        level: error
        count: "412"
        userCount: 97
      - id: "5000000002"
        project_slug: checkout
        shortId: CHECKOUT-2
        title: "NetworkError when attempting to fetch resource"
        status: ignored
        level: warning
        count: "38"
        userCount: 12
      - id: "5000000003"
        project_slug: checkout
        shortId: CHECKOUT-3
        title: "ReferenceError: analytics is not defined"
        status: resolved
        level: error
        count: "7"
    release:
      - id: "6000000001"
        version: checkout@2026.1.0
        shortVersion: 2026.1.0

# The two auth cases below were checked live against sentry.io,
# unauthenticated, on 2026-09-05 -- see the file header. Everything else,
# which needs a real organisation to reach, is read from Sentry's API
# reference rather than observed.
conformance:
  - name: no Authorization header at all
    source: https://sentry.io/api/0/organizations/cauldron/issues/
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/0/organizations/cauldron/issues/9999999999/
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."

  - name: and a fictitious bearer is a different sentence entirely
    source: https://sentry.io/api/0/organizations/cauldron/issues/
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/0/organizations/cauldron/issues/9999999999/
      headers:
        Authorization: Bearer sntrys_fakecauldronprobeonly0000
    expect:
      status: 401
      body:
        detail: "Invalid org token"

  - name: a failure is one detail string and nothing else
    source: https://docs.sentry.io/api/
    fixture: small-org
    request:
      method: GET
      path: /api/0/organizations/cauldron/issues/9999999999/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 404
      body:
        detail: The requested resource does not exist
      # Code written for almost any other provider reaches for a property
      # that is undefined here and throws instead of reporting the failure.
      absent:
        - error
        - errors
        - message
        - code

  - name: deleting an issue is accepted, not done
    # 202 with no body. Sentry takes the deletion and performs it later, so
    # an issue is still readable for a while afterwards and a client that
    # treats the response as "gone" is wrong twice: about the status, which
    # is not 204, and about the state, which is not deleted yet.
    source: https://docs.sentry.io/api/events/delete-an-issue/
    fixture: small-org
    request:
      method: DELETE
      path: /api/0/organizations/cauldron/issues/5000000001/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 202
      absent:
        - id
        - detail

  - name: an issue list is a bare array
    source: https://docs.sentry.io/api/events/list-a-projects-issues/
    fixture: small-org
    request:
      method: GET
      path: /api/0/projects/cauldron/checkout/issues/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 200
      body:
        '[0]':
          shortId: CHECKOUT-1
          status: unresolved
        '[1]':
          shortId: CHECKOUT-2
      # A client unmarshalling into a slice must not receive an object, and
      # the cursor is not in the body at all.
      absent:
        - data
        - next_cursor
        - '[3]'

  - name: an ignored issue is not a resolved one
    source: https://docs.sentry.io/product/issues/states-triage/
    fixture: small-org
    request:
      method: GET
      path: /api/0/organizations/cauldron/issues/5000000002/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 200
      body:
        # An ignored issue still receives events and still counts against
        # quota. It has just stopped alerting. Code that treats ignored as
        # resolved reports a live problem as fixed.
        status: ignored
        level: warning
        shortId: CHECKOUT-2

  - name: event counts are strings, not numbers
    source: https://docs.sentry.io/api/events/list-a-projects-issues/
    fixture: small-org
    request:
      method: GET
      path: /api/0/organizations/cauldron/issues/5000000001/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 200
      body:
        # count is a string and userCount is a number, in the same object.
        # Summing count without a parse concatenates instead of adding.
        count: "412"
        userCount: 97
      # The project is in the path of the listing that reaches an issue, and
      # Sentry does not put its slug on the issue. What an issue carries is a
      # project object, so code reading issue.project_slug to build a link
      # back reads undefined.
      absent:
        - project_slug

  - name: a missing token is refused with the same one-string shape
    source: https://docs.sentry.io/api/auth/
    request:
      method: GET
      path: /api/0/organizations/cauldron/projects/
    expect:
      status: 401
      body:
        detail: Authentication credentials were not provided.
      absent:
        - error
        - code

  - name: another project's issues are not visible
    source: https://docs.sentry.io/api/events/list-a-projects-issues/
    fixture: small-org
    request:
      method: GET
      path: /api/0/projects/cauldron/billing/issues/
      headers:
        Authorization: Bearer sntrys_cauldron
    expect:
      status: 200
      absent:
        - '[0]'

  - name: a release is created with a numeric string identifier
    source: https://docs.sentry.io/api/releases/create-a-new-release-for-an-organization/
    fixture: empty
    request:
      method: POST
      path: /api/0/organizations/cauldron/releases/
      headers:
        Authorization: Bearer sntrys_cauldron
      json:
        version: checkout@2026.2.0
    expect:
      status: 201
      body:
        version: checkout@2026.2.0
      matches:
        id: '^[1-9][0-9]{9}$'

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=5000000001, which is the identifier of the last
  # record on the previous page, and asserts the second record came back
  # on its own: one to skip, one to return, and a third behind it to
  # prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads"
    source: "https://docs.sentry.io/api/events/list-a-projects-issues/"
    fixture: small-org
    request:
      method: GET
      path: "/api/0/projects/cauldron/checkout/issues/"
      query:
        "limit": "1"
        "cursor": "5000000001"
      headers:
        "Authorization": "Bearer sntrys_cauldron"
    expect:
      status: 200
      body:
        "[0].id": "5000000002"
      absent:
        - "[1]"
