# Electricity Maps Recipe for Cauldron
#
# Compare carbonintensity/recipe.yaml, in the same collection: that one
# provider names no key of its own -- open, single country, no credential --
# and answers a carbon-intensity number as two numbers and a category
# (forecast, actual, index) with no field saying which of the two the
# category was derived from. Electricity Maps is the global, versioned,
# credentialled version of the same question, and it draws the
# measured/estimated/forecast line in a different, more legible place: a
# real boolean, isEstimated, sits beside carbonIntensity on the endpoints
# that can be wrong about it -- and disappears entirely on the one endpoint
# whose whole job is to be a guess about the future. That asymmetry, not the
# boolean itself, is this Recipe's sharpest finding; see below.
#
# GET /v3/carbon-intensity/latest?zone=DK-DK2, Electricity Maps' own
# published example (docs.electricitymaps.com/reference, fetched
# 2026-09-02, not observed -- no key was ever held):
#
#   {"zone": "DK-DK2", "carbonIntensity": 318,
#    "datetime": "2024-05-19T03:00:00.000Z",
#    "updatedAt": "2025-07-25T12:32:42.039Z",
#    "createdAt": "2024-05-16T03:48:50.419Z",
#    "emissionFactorType": "lifecycle", "flowTraced": true,
#    "isEstimated": false, "estimationMethod": "FORECASTS_HIERARCHY",
#    "temporalGranularity": "hourly"}
#
# Three timestamps, doing three different jobs: datetime is the half hour
# the number is FOR, updatedAt is when this record last changed, createdAt
# is when it was first written -- so the value-refers-to time and the
# value-was-computed time are both on the wire, named apart, on every
# /latest and /history row. That is the "does it say which" question this
# whole group exists to ask, answered as generously as any provider in this
# collection answers it. And then the same worked example undercuts its own
# flag: isEstimated is false and estimationMethod is
# "FORECASTS_HIERARCHY" in one object -- a name for the technique used to
# fill a gap, sitting beside a boolean saying no gap was filled. Electricity
# Maps' own published example does not resolve this, and neither does this
# Recipe; it is quoted exactly as published, in the fixture below, because
# inventing a self-consistent pair would be a claim about the provider
# nobody checked.
#
# GET /v3/carbon-intensity/forecast?zone=DK-DK2, the same provider's other
# published example:
#
#   {"zone": "DK-DK2", "forecast": [{"carbonIntensity": 101,
#    "datetime": "2025-08-20T09:00:00.000Z"}],
#    "updatedAt": "2026-01-01T00:00:00.000Z"}
#
# No isEstimated. No estimationMethod. No createdAt. A forecast entry
# carries a value, the time it is for, and nothing marking it as a forecast
# at all -- that fact lives entirely in which path was requested, never in
# the object itself. Join the two together, the way an integration
# scheduling load against "the carbon intensity of DK-DK2" naturally would,
# and a forecast row and a measured row are the same shape: {carbonIntensity,
# datetime}. Nothing downstream of the join can tell them apart. This is
# the same finding this collection's WattTime and EIA Recipes both make
# independently, in two unrelated schemas: forecast-ness is a property of
# the endpoint, not of the record.
#
# Zones are addressed by a key, not a coordinate. GET /v3/zones is the one
# genuinely public route on this host -- confirmed live, 2026-09-02, no
# Authorization or auth-token header sent, HTTP 200 -- and it answers the
# real, current map: an object keyed by zone, not an array, with entries
# like {"DK": {"zoneName": "Denmark", "zoneKey": "DK", "countryCode": "DK",
# "zoneParentKey": null, "subZoneKeys": ["DK-DK1", "DK-DK2"],
# "isCommerciallyAvailable": true, "tier": null}} beside
# {"DK-DK1": {"zoneName": "West Denmark", "countryName": "Denmark",
# "zoneKey": "DK-DK1", "countryCode": "DK", "zoneParentKey": "DK",
# "subZoneKeys": [], "isCommerciallyAvailable": true, "tier": "TIER_A"}}.
# A country-level zone (DK) carries no countryName -- its own zoneName
# already is one -- and no tier; a subzone (DK-DK1) carries both, plus a
# zoneParentKey pointing back at DK. The scheme is ISO-alpha-2 country codes
# at the top and hyphen-joined, sometimes two segments deep
# (US-TEX-ERCO), for everything under them, but the hyphen prefix is not
# itself authoritative -- zoneParentKey is the field that actually says
# which country a subzone belongs to, and it is one level only: nothing in
# the response says US-NW-BPAT's grandparent is US without a second lookup.
#
# An unknown zone is checked before the credential, not after -- the
# opposite order from every other route on this host. Confirmed live,
# 2026-09-02, both ways:
#
#   GET /v3/carbon-intensity/latest?zone=ZZ-NOTAZONE   (no credential)
#   GET /v3/carbon-intensity/latest?zone=ZZ-NOTAZONE   (auth-token: junk12345)
#     both -> 400 {"status":"error","message":"Zone 'ZZ-NOTAZONE' does not exist."}
#
# A syntactically ordinary but wrong credential normally gets 401 -- see
# below -- but on this exact path, with this exact query, it never reaches
# that check at all: the same 400 comes back whether a credential was sent
# or not. And a zone that fails on shape rather than lookup answers the
# identical sentence: `zone=NOT_A_ZONE!!`, also confirmed live both ways,
# answers `{"status":"error","message":"Zone 'NOT_A_ZONE!!' does not
# exist."}` -- Electricity Maps does not distinguish "not a zone key we
# have" from "not shaped like a zone key at all." Cauldron's
# auth.after_routing flag cannot express this: it defers a credential check
# until a ROUTE has matched, and this is a query PARAMETER's value being
# checked ahead of the credential on a route that has already matched. It is
# modelled instead the way Cauldron's `public` flag is meant for -- two
# routes on the same path, selected by the literal zone value via
# matches_query, each marked public so the credential check the general
# route still enforces never runs for either -- which reproduces the exact
# live requests and their exact bodies rather than approximating the order
# with a Recipe-wide setting built for a different axis.
#
# Absent and wrong credentials get the same top-level "error" string and
# different "message" sentences, both confirmed live, 2026-09-02:
#
#   (no auth-token header)     401 {"error":"Invalid auth-token",
#                                    "message":"Please provide a valid
#                                    authentication header. See
#                                    https://app.electricitymaps.com/docs/
#                                    getting-started#authorization for
#                                    details"}
#   auth-token: junk12345      401 {"error":"Invalid auth-token",
#                                    "message":"The provided token is
#                                    invalid. If this token used to work,
#                                    please visit https://help.electricitymaps.com
#                                    to get support"}
#
# A header sent with a genuinely empty value -- `auth-token:` with nothing
# after the colon, confirmed with curl's semicolon syntax to force the byte
# onto the wire rather than have the client silently drop it -- answers the
# absent sentence, not the wrong one. Go's own http.Header.Get returns "" for
# a header that is missing and for one that is present and empty alike, so
# Cauldron's own credential check already collapses these two cases the same
# way live Electricity Maps does; nothing extra needed declaring here.
#
# A wrong method on a route that exists still reaches the credential check:
# PATCH and DELETE on /v3/carbon-intensity/latest, confirmed live with no
# credential and with a junk one, answer the identical 401 pair above --
# never a 404, never a 405. A path with no route at all does not: GET
# /v3/nosuchroute, confirmed live both with and without a credential,
# answers Express's own default handler --
#
#   404, Content-Type: text/html; charset=utf-8, 153 bytes:
#   <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
#   <title>Error</title></head><body><pre>Cannot GET /v3/nosuchroute</pre>
#   </body></html>
#
# -- regardless of the credential sent. That is this collection's Rootly
# split (see recipes/rootly/recipe.yaml and internal/recipe/auth.go): the
# credential is checked first for any path the router recognises, whatever
# the method, and the router is checked first for a path it does not
# recognise at all. Reproducing it with Cauldron's own after_routing flag
# would also flip the wrong-method case above to a 405, which is not what
# was observed -- so, like Rootly, this is stated rather than forced, and
# unlike Rootly the real 404 body is HTML rather than JSON, which this
# Recipe's error table cannot serve as anything but a misrepresentation of
# what the wire actually sends. It is quoted here in full instead of
# approximated as a route.
#
# What this Recipe could not establish, despite trying: Electricity Maps'
# free tier is documented in marketing copy as scoped to "your region" and
# a 14-day trial as "all signals, real-time and forecasted," which implies
# a paid or trial token asking for a zone outside its plan answers
# differently from one asking inside it -- but no page this Recipe could
# reach (getting-started, quickstart/authorization, the API reference for
# carbon-intensity/latest and /forecast, or the pricing page) shows what
# that answer's status or body actually is. Apollo.io's Recipe in this
# collection records the same kind of verdict -- a valid credential locked
# out of one endpoint's configured scope -- because Apollo's own OpenAPI
# description names it as a worked example: a status, an error_code, a
# sentence. Electricity Maps' documentation states that the restriction
# exists and never shows what it looks like on the wire, so this Recipe
# does not declare it. A schema with no worked example gets served as an
# empty fixture elsewhere in this collection; a restriction with no schema
# at all has nothing to serve.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The unrouted-path 404 is HTML and is described in this header rather
#     than served -- see above.
#   - /v3/carbon-intensity/history, /electricity-mix/*, /power-breakdown/*,
#     and every emissions-factor, price and flow endpoint are undeclared.
#     history repeats /latest's own fields per entry (confirmed from its own
#     published example) and would have added a fixture rather than a new
#     finding.
#   - The free-tier/trial zone-entitlement failure is not modelled -- see
#     above.
#   - Rate limiting is undocumented on every page this Recipe reached and
#     was never triggered live, so no 429 is declared.
#   - v3 and v4 both answer identically for every route this Recipe probed
#     live (zones, carbon-intensity/latest); this Recipe models v3 only,
#     because Electricity Maps' own quickstart curl example uses v4 while
#     its reference pages document v3 paths, and nothing this Recipe read
#     says which is authoritative going forward.
#   - No upstream.spec. Electricity Maps' documentation is a Mintlify-style
#     site with per-endpoint pages rather than one fetchable OpenAPI
#     document at a stable URL; unlike WattTime's Redoc page in this same
#     group, no single description exists here to fingerprint.
#
# The auth-token value below is a fixture and belongs to no account.

recipe: electricitymaps
capability: analytics
version: 0.1.0

upstream:
  api: v3
  docs: https://app.electricitymaps.com/docs/reference/carbon-intensity/latest

auth:
  scheme: header
  header: auth-token
  keys:
    - cauldron0000000000000000000000000000000000
  # Same top-level "error" string for both verdicts; only "message" differs
  # -- see the header. Naming two different errors here, rather than one
  # shared string, is the honest description of that split.
  absent_error: auth_token_missing
  rejected_error: auth_token_invalid

responses:
  # A map keyed by zone, with no wrapper -- see the header. The only list
  # operation this Recipe declares (GET /v3/zones), so this is safe as a
  # Recipe-wide default.
  list:
    style: map
    key: "-"
  resource:
    style: bare
  error:
    # {"error": "...", "message": "..."} -- two sibling strings, neither
    # nested inside the other. "error" carries a fixed classifier string on
    # the auth failures and code_field points at it; zone_not_found (below)
    # overrides code_field to point at "status" instead, because that route
    # uses the same two-string shape for an unrelated pair of keys.
    style: flat
    message_field: message
    code_field: error

resources:
  intensity:
    id:
      style: opaque
      field: "-"
      carried_by: zone
    fields:
      zone:
        type: string
      carbonIntensity:
        type: number
      datetime:
        type: datetime
      updatedAt:
        type: datetime
      createdAt:
        type: datetime
      emissionFactorType:
        type: string
      flowTraced:
        type: boolean
      # See the header: false here sits beside an estimationMethod naming a
      # technique for filling a gap, in Electricity Maps' own published
      # example, and this Recipe repeats the pair exactly rather than
      # resolving it.
      isEstimated:
        type: boolean
      estimationMethod:
        type: string
      temporalGranularity:
        type: string

  # A forecast entry. No isEstimated, no estimationMethod, no createdAt --
  # see the header. Only updatedAt, once, for the whole array; each entry
  # inside forecast carries just carbonIntensity and datetime, the same two
  # fields a measured row on `intensity` above carries beside its flags.
  forecast:
    id:
      style: opaque
      field: "-"
      carried_by: zone
    fields:
      zone:
        type: string
      updatedAt:
        type: datetime
      forecast:
        type: list

  zone:
    id:
      # Left at the default rather than renamed to zoneKey, because the wire
      # genuinely repeats it: the live response is
      # {"DK": {"zoneName": "Denmark", "zoneKey": "DK", ...}}, so zoneKey is
      # both the key and a field inside the value. A renamed id.field would
      # be the key and be dropped from the value, which is one zoneKey short
      # of what Electricity Maps sends. Declared as an ordinary field below
      # instead.
      #
      # Writing this Recipe first found a real bug -- a keyed list read the
      # identifier as "id" literally and silently dropped every record whose
      # id.field was renamed. That is fixed, and this is still the right
      # shape for this provider.
      style: opaque
    fields:
      zoneKey:
        type: string
      zoneName:
        type: string
      # Present on a subzone (DK-DK1: "Denmark"), absent on the country-level
      # zone that owns it (DK has no countryName at all -- zoneName already
      # is one).
      countryName:
        type: string
        null_when_unset: true
      # A colloquial name, rare: US-TEX-ERCO carries "ERCOT" here and most
      # zones carry nothing.
      displayName:
        type: string
        null_when_unset: true
      countryCode:
        type: string
      # null on a country-level zone, the parent's own key on a subzone --
      # see the header for why the hyphen prefix alone is not this.
      zoneParentKey:
        type: string
        null_when_unset: true
      subZoneKeys:
        type: list
      isCommerciallyAvailable:
        type: boolean
      # null on a country-level zone (DK), a real tier on the zones
      # Electricity Maps actually prices (DK-DK1: TIER_A).
      tier:
        type: string
        null_when_unset: true

routes:
  # Genuinely public -- see the header. Live, current data: every value in
  # the fixture below is what the API answered on 2026-09-02, trimmed to
  # five entries from several hundred.
  - method: GET
    path: /v3/zones
    resource: zone
    operation: list
    pagination:
      # Struck live on 2026-09-05: this answers all 350 zones as a single
      # object keyed by zone code, and ?limit=2 answers the same 350. It is
      # not even an array -- a "page" of a keyed object is not a smaller
      # object, it is a different one with keys missing, and a client
      # looking up "DE" in it would get nothing and conclude Germany is not
      # covered.
      #
      # So this does not page. The runtime was serving ten zones of the 350
      # and offering a cursor for the rest.
      style: none
    public: true

  - method: GET
    path: /v3/carbon-intensity/latest
    resource: intensity
    operation: get
    id_from: query:zone

  # A zone that parses as one and is not on the map. public: true so the
  # credential check the route above still enforces never runs for this
  # exact query -- see the header for why after_routing cannot express this
  # instead.
  - method: GET
    path: /v3/carbon-intensity/latest
    matches_query:
      zone: ZZ-NOTAZONE
    public: true
    error: zone_not_found_unknown

  # A zone that does not parse as one at all, answered with the identical
  # sentence shape -- see the header.
  - method: GET
    path: /v3/carbon-intensity/latest
    matches_query:
      zone: NOT_A_ZONE!!
    public: true
    error: zone_not_found_malformed

  - method: GET
    path: /v3/carbon-intensity/forecast
    resource: forecast
    operation: get
    id_from: query:zone

errors:
  auth_token_missing:
    status: 401
    code: Invalid auth-token
    message: >-
      Please provide a valid authentication header. See
      https://app.electricitymaps.com/docs/getting-started#authorization
      for details
    headers:
      Content-Type: application/json; charset=utf-8

  auth_token_invalid:
    status: 401
    code: Invalid auth-token
    message: >-
      The provided token is invalid. If this token used to work, please
      visit https://help.electricitymaps.com to get support
    headers:
      Content-Type: application/json; charset=utf-8

  zone_not_found_unknown:
    status: 400
    code_field: status
    code: error
    message: "Zone 'ZZ-NOTAZONE' does not exist."
    headers:
      Content-Type: application/json; charset=utf-8

  zone_not_found_malformed:
    status: 400
    code_field: status
    code: error
    message: "Zone 'NOT_A_ZONE!!' does not exist."
    headers:
      Content-Type: application/json; charset=utf-8

fixtures:
  empty: {}

  live-map:
    # Struck live against api.electricitymaps.com/v3/zones, 2026-09-02, no
    # credential. Five of several hundred entries, chosen for the contrast
    # the header describes: a country-level zone and its two subzones, a
    # third-country example, and the one zone in this whole map that carries
    # a colloquial displayName.
    zone:
      - id: DK
        zoneKey: DK
        zoneName: Denmark
        countryCode: DK
        zoneParentKey: null
        subZoneKeys: ["DK-DK1", "DK-DK2"]
        isCommerciallyAvailable: true
        tier: null
      - id: DK-DK1
        zoneKey: DK-DK1
        zoneName: West Denmark
        countryName: Denmark
        countryCode: DK
        zoneParentKey: DK
        subZoneKeys: []
        isCommerciallyAvailable: true
        tier: TIER_A
      - id: DK-DK2
        zoneKey: DK-DK2
        zoneName: East Denmark
        countryName: Denmark
        countryCode: DK
        zoneParentKey: DK
        subZoneKeys: []
        isCommerciallyAvailable: true
        tier: TIER_A
      - id: FR
        zoneKey: FR
        zoneName: France
        countryCode: FR
        zoneParentKey: null
        subZoneKeys: []
        isCommerciallyAvailable: true
        tier: TIER_A
      - id: US-TEX-ERCO
        zoneKey: US-TEX-ERCO
        zoneName: Electric Reliability Council of Texas
        displayName: ERCOT
        countryName: USA
        countryCode: US
        zoneParentKey: US
        subZoneKeys: []
        isCommerciallyAvailable: true
        tier: TIER_A

  published-example:
    # Electricity Maps' own worked examples for /carbon-intensity/latest and
    # /carbon-intensity/forecast, docs.electricitymaps.com, fetched
    # 2026-09-02. Cited, not observed -- no key was ever held.
    intensity:
      - id: DK-DK2
        zone: DK-DK2
        carbonIntensity: 318
        datetime: "2024-05-19T03:00:00.000Z"
        updatedAt: "2025-07-25T12:32:42.039Z"
        createdAt: "2024-05-16T03:48:50.419Z"
        emissionFactorType: lifecycle
        flowTraced: true
        isEstimated: false
        estimationMethod: FORECASTS_HIERARCHY
        temporalGranularity: hourly

    forecast:
      - id: DK-DK2
        zone: DK-DK2
        updatedAt: "2026-01-01T00:00:00.000Z"
        forecast:
          - carbonIntensity: 101
            datetime: "2025-08-20T09:00:00.000Z"

conformance:
  - name: the zones map is public, current, and keyed by zone rather than listed
    source: https://api.electricitymaps.com/v3/zones
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: GET
      path: /v3/zones
    expect:
      status: 200
      body:
        "DK.zoneName": Denmark
        "DK.zoneParentKey": null
        "DK.tier": null
        "DK-DK1.zoneParentKey": DK
        "DK-DK1.countryName": Denmark
        "DK-DK1.tier": TIER_A
        "US-TEX-ERCO.displayName": ERCOT
      absent:
        - data
        - zones

  - name: no credential at all gets one sentence
    source: https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=DK-DK1
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: GET
      path: /v3/carbon-intensity/latest?zone=DK-DK1
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: Invalid auth-token
        message: >-
          Please provide a valid authentication header. See
          https://app.electricitymaps.com/docs/getting-started#authorization
          for details

  - name: a wrong credential gets the same error string and a different sentence
    source: https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=DK-DK1
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: GET
      path: /v3/carbon-intensity/latest?zone=DK-DK1
      headers:
        auth-token: junk12345
    expect:
      status: 401
      body:
        error: Invalid auth-token
        message: >-
          The provided token is invalid. If this token used to work, please
          visit https://help.electricitymaps.com to get support

  - name: a wrong method on a route that exists still reaches the credential check
    source: https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=DK-DK1
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: PATCH
      path: /v3/carbon-intensity/latest?zone=DK-DK1
    expect:
      status: 401
      body:
        error: Invalid auth-token
        message: >-
          Please provide a valid authentication header. See
          https://app.electricitymaps.com/docs/getting-started#authorization
          for details

  - name: an unknown zone answers 400 before the credential is ever checked
    # Struck live both with no credential and with a junk one -- identical
    # both times, which is the finding: see the header.
    source: https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=ZZ-NOTAZONE
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: GET
      path: /v3/carbon-intensity/latest?zone=ZZ-NOTAZONE
      headers:
        auth-token: junk12345
    expect:
      status: 400
      body:
        status: error
        message: "Zone 'ZZ-NOTAZONE' does not exist."

  - name: a zone that is not shaped like one at all answers the identical sentence shape
    source: https://api.electricitymaps.com/v3/carbon-intensity/latest?zone=NOT_A_ZONE!!
    verified: "2026-09-02"
    fixture: live-map
    request:
      method: GET
      path: "/v3/carbon-intensity/latest?zone=NOT_A_ZONE!!"
    expect:
      status: 400
      body:
        status: error
        message: "Zone 'NOT_A_ZONE!!' does not exist."

  - name: a measured value carries when it is for, when it changed, and when it was made -- and an estimation method that disagrees with its own flag
    # Cited, not observed -- see the header for the isEstimated/
    # estimationMethod pair as Electricity Maps itself published it.
    source: https://app.electricitymaps.com/docs/reference/carbon-intensity/latest
    fixture: published-example
    request:
      method: GET
      path: /v3/carbon-intensity/latest?zone=DK-DK2
      headers:
        auth-token: cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        carbonIntensity: 318
        datetime: "2024-05-19T03:00:00.000Z"
        updatedAt: "2025-07-25T12:32:42.039Z"
        createdAt: "2024-05-16T03:48:50.419Z"
        isEstimated: false
        estimationMethod: FORECASTS_HIERARCHY

  - name: a forecast entry carries no flag marking it as one
    source: https://app.electricitymaps.com/docs/reference/carbon-intensity/forecast
    fixture: published-example
    request:
      method: GET
      path: /v3/carbon-intensity/forecast?zone=DK-DK2
      headers:
        auth-token: cauldron0000000000000000000000000000000000
    expect:
      status: 200
      body:
        "forecast[0].carbonIntensity": 101
        "forecast[0].datetime": "2025-08-20T09:00:00.000Z"
        updatedAt: "2026-01-01T00:00:00.000Z"
      absent:
        - isEstimated
        - estimationMethod
        - createdAt
        - "forecast[0].isEstimated"

  # The names. This Recipe declares 1 field(s) on a forecast that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a forecast carries the field names this Recipe declares"
    source: "https://app.electricitymaps.com/docs/reference/carbon-intensity/forecast"
    fixture: published-example
    request:
      method: GET
      path: "/v3/carbon-intensity/forecast"
      query:
        "zone": "DK-DK2"
      headers:
        "auth-token": "cauldron0000000000000000000000000000000000"
    expect:
      status: 200
      body:
        "zone": "DK-DK2"

  # The names. This Recipe declares 4 field(s) on a intensity that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
