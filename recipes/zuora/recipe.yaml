# Zuora Recipe for Cauldron
#
# Written against Zuora's API reference at developer.zuora.com and struck live
# against rest.zuora.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **One code, two sentences, and the key order changes between them.** Struck
# live:
#
#   GET /v1/accounts                        (no credential)
#   401 {"reasons":[{"code":"90000011","message":"Unauthorized"}],"success":false}
#
#   GET /v1/accounts                        Authorization: Bearer notreal
#   401 {"reasons":[{"message":"Authentication error","code":"90000011"}],"success":false}
#
# The code is `90000011` for both. The sentence is not. So the eight-digit
# number -- the field that exists to be branched on -- cannot separate "you
# sent nothing" from "you sent something wrong", and the prose can.
#
# And the keys arrive in a different order: `code` first on one, `message`
# first on the other. Two code paths building the same object, and the only
# reader that notices is one comparing bytes -- which is every recorded
# fixture, every snapshot test and every cache key built from a response body.
#
# **The code is eight digits in a string.** `"90000011"` -- Zuora's own
# numbering, wide enough to encode a category and an ordinal, and quoted, so
# `code === 90000011` is false and `parseInt` is required before any
# comparison. There is no separate category field, so the structure is inside
# the digits and nothing says how to read it.
#
# **The success flag is on the failure.** `"success": false` beside the
# reasons -- so a client can check one boolean rather than a status, which is
# the good half. It is also the third field name for the same idea in this
# collection after [loops](../loops)'s `success` and Sift's `status: 0`.
#
# **The field is called `reasons`.** Not errors, not messages -- an array of
# reasons, plural, because Zuora's validation genuinely can fail several ways
# at once and each one gets an entry. The name is better than `errors` for what
# it holds.
#
# **An unknown path answers the credential failure.** 401 with
# "Authentication error" on `/v1/cauldron-nope`, so routing is judged after
# authentication and a path cannot be shown not to exist.

recipe: zuora
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.zuora.com/v1-api-reference/api/
  # No spec: Zuora publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-zuora-f1xture-token-000000
  # One code, two sentences, struck live.
  absent_error: unauthorized
  rejected_error: authentication_error

responses:
  list:
    style: wrapped
    key: accounts
    cursor_field: nextPage
    fields:
      # The same boolean rides success and failure, which is what makes it
      # worth checking.
      success: true
  error:
    style: list
    key: reasons
    message_field: message
    # Eight digits in a string. There is no category field beside it, so the
    # structure is inside the number.
    code_field: code
    code_type: string
    type_field: "-"
    fields:
      success: false

resources:
  account:
    id:
      field: id
      style: hex
    fields:
      accountNumber:
        type: string
      name:
        type: string
      currency:
        type: string
        default: USD
      balance:
        type: number
        default: 0
      status:
        type: string
        default: Active
      autoPay:
        type: boolean
        default: false

routes:
  - method: GET
    path: /v1/accounts
    resource: account
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: pageSize
      cursor_param: nextPage

errors:
  unauthorized:
    status: 401
    code: "90000011"
    # A word, for a request that carried nothing.
    message: "Unauthorized"

  authentication_error:
    status: 401
    # The same eight digits. The number cannot separate the two failures and
    # the sentence can, which is the wrong way round.
    code: "90000011"
    message: "Authentication error"

fixtures:
  empty:
    account: []

  tenant:
    account:
      - id: 2c92c0f96b1a7c8d016b1e2f3a4b5c6d
        accountNumber: A00000042
        name: Northwind Traders
        currency: USD
        balance: 0
        status: Active
        autoPay: true
      - id: 2c92c0f96b1a7c8d016b1e2f3a4b5c6e
        accountNumber: A00000043
        name: Contoso Ltd
        currency: EUR
        # Owing money and still Active: Zuora's status is the subscription
        # lifecycle rather than the dunning state, so a client reading status
        # to decide whether to chase somebody reads the wrong field.
        balance: 1249.50
        status: Active
        autoPay: false

conformance:
  - name: both credential failures carry the same code
    source: https://rest.zuora.com/v1/accounts
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers: {}
    expect:
      status: 401
      body:
        # 90000011 for a request that sent nothing.
        'reasons[0].code': "90000011"
        'reasons[0].message': Unauthorized

  - name: the sentence separates what the code cannot
    source: https://rest.zuora.com/v1/accounts
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # The same eight digits, a different sentence. The field that exists
        # to be branched on cannot tell the two apart and the prose can, which
        # is the wrong way round.
        'reasons[0].code': "90000011"
        'reasons[0].message': "Authentication error"

  - name: the code is quoted so it is not a number
    source: https://rest.zuora.com/v1/accounts
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers: {}
    expect:
      status: 401
      body:
        # code === 90000011 is false; parseInt is required before any
        # comparison. And there is no category field, so whatever structure
        # is inside the eight digits is undocumented on the wire.
        'reasons[0].code': "90000011"

  - name: the success flag rides the failure
    source: https://rest.zuora.com/v1/accounts
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers: {}
    expect:
      status: 401
      body:
        # One boolean to check on both paths rather than a status. The good
        # half of this envelope, and the third name for the same idea in this
        # collection.
        success: false

  - name: an unknown path is a credential failure
    source: https://rest.zuora.com/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Routing is judged after authentication, so a path cannot be shown not
      # to exist.
      status: 401
      body:
        'reasons[0].message': "Authentication error"

  - name: a listing carries the same flag set true
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
    expect:
      status: 200
      body:
        success: true
        'accounts[0].accountNumber': A00000042

  - name: an identifier is 32 hex characters and not a UUID
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
    expect:
      status: 200
      body:
        # No dashes, so it will not parse as a UUID -- and there is a second,
        # human-facing identifier beside it that a person will quote instead.
        'accounts[0].id': 2c92c0f96b1a7c8d016b1e2f3a4b5c6d
        'accounts[0].name': Northwind Traders

  - name: an account owing money is still Active
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
    expect:
      status: 200
      body:
        # status is the subscription lifecycle, not the dunning state, so a
        # client reading it to decide whether to chase somebody reads the
        # wrong field. The balance is the one that knows.
        'accounts[1].status': Active
        'accounts[1].balance': 1249.50
        'accounts[1].autoPay': false

  - name: money is a bare JSON number
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
    expect:
      status: 200
      body:
        # 1249.50 as a double, on a billing API, with the currency in a
        # separate field. Every sum a client computes is binary
        # floating-point.
        'accounts[1].balance': 1249.50
        'accounts[1].currency': EUR

  - name: the cursor is a whole path rather than a token
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
      query:
        pageSize: "1"
    expect:
      status: 200
      body:
        'accounts[0].accountNumber': A00000042
      matches:
        # Sent by no other case, so this pair pins both parameter names.
        nextPage: '.'

  - name: the last page carries no cursor
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: tenant
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
      query:
        pageSize: "1"
        nextPage: 2c92c0f96b1a7c8d016b1e2f3a4b5c6d
    expect:
      status: 200
      body:
        'accounts[0].accountNumber': A00000043
      absent:
        - nextPage

  - name: a tenant with no accounts answers an empty array
    source: https://developer.zuora.com/v1-api-reference/api/
    fixture: empty
    request:
      method: GET
      path: /v1/accounts
      headers:
        Authorization: "Bearer cauldr0n-zuora-f1xture-token-000000"
    expect:
      status: 200
      body:
        accounts: []
        success: true
