# CrowdSec Recipe for Cauldron
#
# Written against CrowdSec's own Swagger 2.0 document, published in its own
# repository -- github.com/crowdsecurity/crowdsec,
# pkg/models/localapi_swagger.yaml, 13 paths, version 1.0.0 -- read on
# 2026-09-06. The Local API runs on the operator's own machine and there is no
# public instance, so nothing here is verified live: every claim is the
# provider's own document.
#
# **The block list contains entries marked "do not block", and the marker is
# optional.**
#
# A Decision carries `simulated`, described as "true if the decision result from
# a scenario in simulation mode". Simulation is how an operator tries a scenario
# without acting on it -- so the decisions list, which is the list a bouncer
# reads to decide who to turn away, contains entries that were deliberately not
# meant to be enforced.
#
# `simulated` is `readOnly` and is not in the schema's `required` list. So it may
# be absent, and absent is falsy. That happens to fail in the safe direction for
# a client using truthiness -- an absent flag reads as "not simulated", which
# enforces -- and it is the wrong direction for a client trying to *count*
# simulated decisions, which will undercount. Either way, a bouncer that never
# reads the field enforces every simulation the operator was testing.
#
# **The credential's header name is a header name and a value prefix.**
#
# The document declares:
#
#   JWTAuthorizer:
#     type: apiKey
#     in: header
#     name: "Authorization: Bearer"
#
# `name` under `in: header` is the header's name. `Authorization: Bearer` is not
# a header name -- it contains a colon and a space, neither of which is legal in
# one. A generator that does what the document says produces a header called
# `Authorization: Bearer` and a value of the token, which most HTTP libraries
# reject outright and the rest send as a malformed line.
#
# The other scheme, `APIKeyAuthorizer`, is `X-Api-Key` and is correct. So one of
# the two credentials in this document cannot be used by anything generated from
# it.
#
# **A decision's lifetime is a string, and there are two of them.**
#
# `duration` is `type: string` -- "4h", "24h", Go's own duration syntax -- and
# `until` is a separate string holding an absolute date. Both describe when a
# decision stops applying, in different units, and nothing says which wins if
# they disagree. Arithmetic on either needs a parser: one for Go durations and
# one for timestamps.
#
# **Two fields whose meaning depends on which way the call is going.**
#
#   id    "(only relevant for GET ops) the unique id"
#   uuid  "only relevant for LAPI->CAPI, ignored for cscli->LAPI and
#          crowdsec->LAPI"
#
# So a Decision's identity depends on the operation and on which of four
# directions the traffic is flowing, and the document says so in prose rather
# than in the schema. There is no shape that describes a decision as it exists;
# there is only a shape with two identifiers and a note about when each is real.
#
# **The type is an open enum with no members.** `type` is "the type of decision,
# might be 'ban', 'captcha' or something custom". A field with three named
# possibilities, none of them declared as an enum, and an explicit invitation to
# invent more -- so no generated client can have a type for it and no exhaustive
# switch is possible.
#
# **A plural field holding one string.** `ErrorResponse` has `message` (required)
# and `errors`, which is `type: string` and described as "more detail on
# individual errors". Individual, plural, and a single string.
#
# **Nine filters and no pagination.** GET /decisions takes scope, value, type,
# ip, range, contains, origins, scenarios_containing and
# scenarios_not_containing -- and no limit, no page, no cursor. A decisions list
# on a busy installation is the whole blocklist, and the API offers no way to
# ask for part of it. The streaming endpoint beside it exists for exactly this
# reason and is a different shape.
#
# **HEAD is declared beside GET on every read.** Unusual in an OpenAPI document,
# and worth knowing: a client may probe with HEAD, and the document says so.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. The Local API runs on the
#     operator's own machine.
#   - Decisions, listed. 13 paths is a security agent: alerts, watchers, the
#     decisions stream, allowlists and usage metrics each want their own
#     evidence, and the stream in particular is a different shape from the
#     listing.
#   - The credential checked here is X-Api-Key, which is the scheme this
#     document gets right. The JWT scheme is recorded and not served, because
#     serving a header named "Authorization: Bearer" would mean emitting a
#     malformed header line to demonstrate a defect in a document.
#   - `duration` is served as the Go duration string the provider sends. Nothing
#     here converts it, and nothing reconciles it with `until`.

recipe: crowdsec
capability: infrastructure
version: 0.1.0

upstream:
  api: "1.0.0"
  docs: https://docs.crowdsec.net/docs/next/local_api/intro
  spec: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
  spec_hash: eb63110ac9a8c2435d839c54f49bcfe6fca9089fc15c3f520334c9c6d04b3b26
  spec_seen: "2026-09-06"

auth:
  # The scheme this document declares correctly. The other one names its header
  # "Authorization: Bearer", which is not a header name.
  scheme: header
  header: X-Api-Key
  keys:
    - cauldroncrowdsecapikey0000000000
  absent_error: unauthorized

responses:
  list:
    # A bare array. GetDecisionsResponse is declared as an array of Decision
    # with no envelope and nothing beside it.
    style: bare
  error:
    style: flat
    message_field: message

resources:
  decision:
    id:
      style: numeric
      type: number
    fields:
      # "only relevant for LAPI->CAPI, ignored for cscli->LAPI and
      # crowdsec->LAPI" -- a second identifier whose reality depends on which
      # of four directions the call is going.
      uuid:
        type: string
      origin:
        type: string
        required: true
      # "might be 'ban', 'captcha' or something custom" -- three named
      # possibilities, no enum, and an invitation to invent more.
      type:
        type: string
        required: true
      # IP, Range, Username, Country -- what the value is measured in.
      scope:
        type: string
        required: true
      value:
        type: string
        required: true
      # A Go duration string, not a number of seconds.
      duration:
        type: string
        required: true
      # And the absolute form of the same idea, beside it.
      until:
        type: string
      scenario:
        type: string
        required: true
      # The decision that was not meant to be acted on. readOnly, and not
      # required, so it may be absent -- and absent is falsy.
      simulated:
        type: boolean
        default: false

routes:
  - method: GET
    path: /v1/decisions
    resource: decision
    operation: list
    pagination:
      # None. Nine filters and no limit, no page, no cursor -- a decisions
      # list is the whole blocklist or nothing.
      style: none
    filters:
      - field: scope
        param: scope
      - field: value
        param: value
      - field: type
        param: type

errors:
  unauthorized:
    status: 403
    message: "access forbidden"
  invalid:
    status: 400
    message: "invalid request"
    fields:
      # Plural, and a single string.
      errors: "scope: must be one of Ip, Range, Username, Country"
  rate_limit:
    status: 429
    message: "too many requests"

fixtures:
  empty:
    decision: []

  blocklist:
    decision:
      - id: 4471
        uuid: ""
        origin: crowdsec
        type: ban
        scope: Ip
        value: 203.0.113.44
        duration: "4h"
        until: "2026-09-06T18:31:00Z"
        scenario: crowdsecurity/ssh-bf
        simulated: false
      - id: 4472
        uuid: ""
        origin: cscli
        type: captcha
        scope: Ip
        value: 198.51.100.7
        duration: "24h"
        until: "2026-09-07T14:02:00Z"
        scenario: manual 'captcha' from 'cauldron'
        # The one the operator was testing and did not want enforced. A
        # bouncer that ignores this field turns this address away.
        simulated: true
      - id: 4473
        uuid: ""
        origin: lists:firehol_cruzit_web_attacks
        type: ban
        scope: Range
        value: 192.0.2.0/24
        duration: "168h"
        until: "2026-09-13T09:00:00Z"
        scenario: update
        simulated: false

conformance:
  - name: the block list contains a decision marked not to be acted on
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # "true if the decision result from a scenario in simulation mode".
        # It is in the same array as the ones that should be enforced, and a
        # bouncer that does not read this field turns this address away.
        '[1].simulated': true
        '[1].value': 198.51.100.7
        '[0].simulated': false

  - name: a decision's lifetime is a Go duration string, with an absolute form beside it
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # Not seconds, not milliseconds, not ISO 8601. Go's duration syntax,
        # which needs its own parser -- and 168h rather than 7d, because Go
        # has no day unit.
        '[0].duration': "4h"
        '[2].duration': "168h"
        # And the same idea again as an absolute time, with nothing saying
        # which wins if they disagree.
        '[0].until': "2026-09-06T18:31:00Z"

  - name: the scope says what the value is measured in
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      query:
        scope: Range
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # An address and a CIDR block sit in the same field, and only scope
        # tells them apart -- so code that parses value as an IP throws on
        # every Range decision.
        '[0].scope': Range
        '[0].value': 192.0.2.0/24
      absent:
        - '[1]'

  - name: the type is an open set with three named members
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      query:
        type: captcha
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # "might be 'ban', 'captcha' or something custom." No enum in the
        # schema, so no generated client can have a type for this and no
        # switch over it can be exhaustive.
        '[0].type': captcha
      absent:
        - '[1]'

  - name: a listing is a bare array with no envelope and no paging
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # Nine filter parameters and not one that bounds the response. On a
        # busy installation this is the whole blocklist.
        '[0].id': 4471
        '[2].id': 4473
      absent:
        - '[3]'
        - total
        - next

  - name: the origin says where a decision came from, including a third party
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        # "the origin of the decision : cscli, crowdsec" -- and in practice a
        # fourth shape, lists:<name>, for decisions pulled from a subscribed
        # blocklist. The document names two of the values it carries.
        '[0].origin': crowdsec
        '[1].origin': cscli
        '[2].origin': lists:firehol_cruzit_web_attacks
        '[2].scenario': update

  - name: no credential is refused with 403, not 401
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers: {}
    expect:
      # The Local API answers 403 where most providers answer 401, so a client
      # branching on 401 to fetch a credential never fetches one.
      status: 403
      body:
        message: "access forbidden"

  - name: "a plural field carries one string"
    source: "https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml"
    arm: invalid
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 400
      body:
        message: "invalid request"
        # "more detail on individual errors", type: string. Plural name,
        # singular type, so a client iterating it iterates characters.
        errors: "scope: must be one of Ip, Range, Username, Country"

  - name: "the rate limit says so in these words"
    source: "https://docs.crowdsec.net/docs/next/local_api/intro"
    arm: rate_limit
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 429
      body:
        message: "too many requests"

  - name: the value filter matches an address exactly, not by containment
    source: https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/pkg/models/localapi_swagger.yaml
    fixture: blocklist
    request:
      method: GET
      path: /v1/decisions
      query:
        # value, beside a separate `contains` boolean that changes what
        # matching means -- so the same query string means two things
        # depending on a flag sent alongside it.
        value: 203.0.113.44
      headers:
        X-Api-Key: cauldroncrowdsecapikey0000000000
    expect:
      status: 200
      body:
        '[0].value': 203.0.113.44
        '[0].scenario': crowdsecurity/ssh-bf
        # Empty rather than absent. The document says this one is "only
        # relevant for LAPI->CAPI, ignored for cscli->LAPI and crowdsec->LAPI"
        # -- so on a local read it is present and carries nothing, which is a
        # third state beside "a uuid" and "no such field".
        '[0].uuid': ""
      absent:
        - '[1]'
