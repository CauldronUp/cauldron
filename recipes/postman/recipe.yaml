# Postman Recipe for Cauldron
#
# Written against Postman's API reference at learning.postman.com and struck
# live against api.getpostman.com on 2026-09-07 with no credential and then
# with a deliberately invalid one.
#
# **The first provider in this collection to use `type` for what it is for.**
# Struck live:
#
#   GET /cauldron-nope
#   404  Content-Type: application/problem+json
#   {"type":"https://api.postman.com/problems/not-found",
#    "instance":"/cauldron-nope",
#    "detail":"The requested resource could not be found.",
#    "status":404,
#    "title":"Not Found"}
#
# Five members, all five of RFC 9457's, and `type` is **a URI under Postman's
# own domain naming a Postman problem**. `instance` is the path that produced
# it, which is the other member almost nobody sends.
#
# Three other providers here reach for the same specification and all three
# miss: [triggerdev](../triggerdev) points `type` at MDN's page about the HTTP
# status, [agicap](../agicap) at the RFC clause defining 500, and
# [revai](../revai) omits it entirely. Postman is the fourth and the only one
# that gets it right. It is worth recording that the specification is usable,
# because the other three make it look as though it is not.
#
# **And the 401 is not a problem document at all.** Struck live:
#
#   GET /collections                          (no credential)
#   401 {"error":{"name":"AuthenticationError","message":"Invalid API Key. Every request requires a valid API Key to be sent."}}
#
# `application/json`, a nested `error`, a class name and a sentence. So one API
# has a carefully-built problem document for routing failures and an ordinary
# envelope for credential ones, and a client needs both parsers.
#
# **The key order flips between the two 401s.** Struck live, seconds apart:
#
#   no credential    {"error":{"name":"AuthenticationError","message":"Invalid API Key. ..."}}
#   wrong key        {"error":{"message":"Invalid API Key. ...","name":"AuthenticationError"}}
#
# Same fields, same values, opposite order. Two code paths building one object.
# The third instance of this in the collection after [zuora](../zuora) and
# [browserbase](../browserbase), and the only reader that notices is one
# comparing bytes -- every recorded fixture, every snapshot test, every cache
# key built from a body.
#
# **"Invalid API Key" is the answer to sending no API key.** The fourth
# provider here to write that sentence for a request that carried none, after
# [loops](../loops), [helicone](../helicone) and [beehiiv](../beehiiv).

recipe: postman
capability: docs
version: 0.1.0

upstream:
  api: v1
  docs: https://learning.postman.com/docs/developer/postman-api/intro-api/
  # No spec: Postman publishes a rendered reference site, and its own public
  # workspace holds a collection rather than an OpenAPI document.

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
  # One sentence for both, and it describes the second.
  absent_error: authentication_error
  rejected_error: authentication_error

responses:
  list:
    style: wrapped
    key: collections
  error:
    style: nested
    key: error
    message_field: message
    # A class name, in the field a client branches on -- the same choice
    # saltedge and metagraph make.
    code_field: name
    code_type: string
    type_field: "-"

resources:
  collection:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      owner:
        type: string
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      uid:
        type: string
      isPublic:
        type: boolean
        default: false

routes:
  - method: GET
    path: /collections
    resource: collection
    operation: list
    pagination:
      style: none

errors:
  authentication_error:
    status: 401
    code: AuthenticationError
    # Struck live for a request carrying no key at all, which is what makes
    # the sentence describe the other failure.
    message: "Invalid API Key. Every request requires a valid API Key to be sent."

  unknown_route:
    status: 404
    # A full RFC 9457 document, on the routing failure only -- so one API has
    # two error models and a client needs both parsers.
    style: flat
    message_field: detail
    code_field: "-"
    message: "The requested resource could not be found."
    headers:
      Content-Type: application/problem+json
    fields:
      # A URI under Postman's own domain, naming a Postman problem. The first
      # correct use of this field in the collection.
      type: "https://api.postman.com/problems/not-found"
      # The path that produced it -- the other member almost nobody sends.
      instance: "/cauldron-nope"
      title: "Not Found"
      status: 404

fixtures:
  empty:
    collection: []

  workspace:
    collection:
      - id: 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de
        name: Cauldron API
        owner: "4821903"
        uid: "4821903-3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de"
        createdAt: "2026-05-02T09:14:00.000Z"
        updatedAt: "2026-09-01T16:22:41.000Z"
        isPublic: false
      - id: 8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5
        name: Cauldron Public
        owner: "4821903"
        uid: "4821903-8e51a7d3-2c46-4f89-b03d-1a6f4e29c7b5"
        createdAt: "2026-06-18T11:40:00.000Z"
        updatedAt: "2026-06-18T11:40:00.000Z"
        isPublic: true

conformance:
  - name: the routing failure is a full problem document
    source: https://api.getpostman.com/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /cauldron-nope
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 404
      headers:
        Content-Type: application/problem+json
      body:
        title: "Not Found"
        detail: "The requested resource could not be found."
        status: 404

  - name: the problem type names a Postman problem
    source: https://api.getpostman.com/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /cauldron-nope
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 404
      body:
        # A URI under Postman's own domain, identifying the problem rather
        # than the status. The first correct use of this field in the
        # collection, against three that miss it.
        type: "https://api.postman.com/problems/not-found"
        # And the path that produced it, which is the RFC member almost
        # nobody sends.
        instance: "/cauldron-nope"

  - name: the credential failure is a different model entirely
    source: https://api.getpostman.com/collections
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers: {}
    expect:
      status: 401
      body:
        # application/json, a nested error, a class name and a sentence. So
        # one API has a carefully-built problem document for routing failures
        # and an ordinary envelope for credential ones.
        'error.name': AuthenticationError
        'error.message': "Invalid API Key. Every request requires a valid API Key to be sent."
      absent:
        - type
        - instance

  - name: the sentence describes the other failure
    source: https://api.getpostman.com/collections
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: notreal
    expect:
      status: 401
      body:
        # Struck live both ways, and byte-identical apart from key order:
        # "Invalid API Key" is also the answer to sending no API key. The
        # fourth provider here to write that sentence for a request that
        # carried none.
        'error.message': "Invalid API Key. Every request requires a valid API Key to be sent."

  - name: collections are wrapped under their own plural
    source: https://learning.postman.com/docs/developer/postman-api/intro-api/
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 200
      body:
        'collections[0].name': Cauldron API
        'collections[0].id': 3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de

  - name: every collection carries two identifiers
    source: https://learning.postman.com/docs/developer/postman-api/intro-api/
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 200
      body:
        # `uid` is the owner's numeric id and the collection's UUID joined by
        # a hyphen, and it is the one most endpoints take -- so the field
        # called `id` is not the handle, and building `uid` requires knowing
        # who owns the thing.
        'collections[0].uid': "4821903-3f9a1c62-5b48-4d07-9e13-8a2f7c4b61de"
        'collections[0].owner': "4821903"

  - name: a public collection is in the same listing
    source: https://learning.postman.com/docs/developer/postman-api/intro-api/
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 200
      body:
        # A boolean separates a collection anybody can read from one nobody
        # can, in one array, with no default filter -- so a script that
        # publishes every collection it finds has one flag between it and an
        # accident.
        'collections[1].isPublic': true
        'collections[0].isPublic': false

  - name: an untouched collection has equal timestamps
    source: https://learning.postman.com/docs/developer/postman-api/intro-api/
    fixture: workspace
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 200
      body:
        'collections[1].createdAt': "2026-06-18T11:40:00.000Z"
        'collections[1].updatedAt': "2026-06-18T11:40:00.000Z"

  - name: a workspace with no collections answers an empty array
    source: https://learning.postman.com/docs/developer/postman-api/intro-api/
    fixture: empty
    request:
      method: GET
      path: /collections
      headers:
        X-Api-Key: PMAK-cauldr0nf1xture000000000000-0000000000000000000000000000000000
    expect:
      status: 200
      body:
        collections: []
