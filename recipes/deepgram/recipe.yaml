# Deepgram Recipe for Cauldron
#
# Deepgram has no sandbox. There are free credits, which is a real account with
# a smaller number on it, and every transcription is billed by the minute of
# audio. A suite that transcribes on each run pays each time.
#
# It is worth having alongside the AssemblyAI Recipe rather than instead of it,
# because the two disagree about almost everything while doing the same job.
# Deepgram's pre-recorded endpoint is synchronous and answers with the
# transcript; AssemblyAI's is asynchronous and answers with an id. Deepgram
# reports word timings in seconds as floats; AssemblyAI in whole milliseconds.
# Deepgram buries the text four levels down; AssemblyAI puts it at the top.
# Code written against one and pointed at the other finds nothing at every
# level, and a team that switches providers meets all of it at once.
#
# Four things worth modelling exactly:
#
#   1. The transcript is at results.channels[0].alternatives[0].transcript.
#      Two arrays, both almost always of length one, which is why indexing
#      zero works until somebody enables multichannel and the second channel
#      is silently ignored.
#   2. Word timings are seconds, as floats. 1.34 is one and a bit seconds in.
#      Treating them as milliseconds puts every word in the first two
#      thousandths of the audio.
#   3. Failures use err_code and err_msg, not code and message, and carry a
#      request_id that Deepgram support asks for. A client reading message
#      finds nothing.
#   4. The key goes in Authorization with a Token prefix. Not Bearer, and not
#      bare: a third spelling, and the wrong one fails as though the key were
#      invalid.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Nothing transcribes here. The text in a fixture is the text returned.
#   - The callback form of the pre-recorded endpoint is asynchronous and
#     answers with a request_id instead of a transcript. That is not modelled;
#     this Recipe covers the synchronous form.
#   - Live streaming is a WebSocket and is not modelled at all.
#
# Keys below are fixtures, not secrets.

recipe: deepgram
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.deepgram.com/reference
  # Found by cauldron discover rather than recorded by hand. This
  # document declares one of the two routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://developers.deepgram.com/openapi.json
  spec_hash: fe8a44923c7179a7844fd4a5268a53681999ce0e5a661ef467a85059a7a70b53
  spec_seen: "2026-09-05"

auth:
  scheme: header
  header: Authorization
  # "Token", not "Bearer" and not bare. A third spelling among the providers
  # here, and the wrong one fails as though the key were invalid rather than
  # as though the header were.
  prefix: "Token "
  keys:
    - cauldron0000000000000000000000000000000000000000

responses:
  list:
    style: wrapped
    key: results
  resource:
    style: bare
  # err_code and err_msg, not code and message, with a request_id beside them
  # that support asks for.
  error:
    style: flat
    message_field: err_msg
    code_field: err_code
    code_type: string
    type_field: "-"
    fields:
      request_id: 00000000-0000-4000-8000-000000000000

resources:
  transcription:
    id:
      style: uuid
    fields:
      # The whole answer, nested. results.channels[0].alternatives[0] is where
      # the text lives, and both arrays are almost always length one.
      results_channels:
        type: list
        in: results
        as: channels
      metadata_duration:
        type: number
        in: metadata
        as: duration
      # How many channels the audio had. One unless multichannel was asked
      # for, which is why indexing zero works right up until it does not.
      metadata_channels:
        type: integer
        in: metadata
        as: channels
      # The models Deepgram used, as an array of identifiers. A transcript is
      # not reproducible without knowing which, and the model can change
      # under a name like "nova-2".
      metadata_models:
        type: list
        in: metadata
        as: models
      metadata_request_id:
        type: string
        in: metadata
        as: request_id

routes:
  - method: POST
    path: /v1/listen
    resource: transcription
    operation: create
    status: 200

  - method: GET
    path: /v1/listen/{id}
    resource: transcription
    operation: get

webhooks:
  # Deepgram calls a callback URL when one is supplied, which is a parameter
  # on the request rather than a subscription. Declaring an event catalogue
  # would be describing a different mechanism.
  events: []
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: TOO_MANY_REQUESTS
    message: Rate limit exceeded

  authentication_error:
    status: 401
    code: INVALID_AUTH
    message: "Invalid credentials."

  resource_missing:
    status: 404
    code: NOT_FOUND
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    code: Bad Request
    message: "{detail} is required"

  # The account is out of credits. Requests stop being accepted and nothing
  # already submitted is affected.
  insufficient_credits:
    status: 402
    code: INSUFFICIENT_CREDITS
    message: "Project does not have enough credits for this request."

  # Audio Deepgram cannot decode. It arrives as a real HTTP failure rather
  # than a transcript with empty text, which is the useful direction.
  corrupt_audio:
    status: 400
    code: REMOTE_CONTENT_ERROR
    message: "The remote content could not be decoded as audio."

fixtures:
  empty: {}

  small-account:
    transcription:
      # A single channel with a single alternative, which is the shape almost
      # every response has and the reason indexing zero looks safe.
      - id: 11111111-1111-4111-8111-111111111111
        metadata_duration: 4.32
        metadata_channels: 1
        metadata_models:
          - 30089e05-99d1-4376-b32e-c263170674af
        metadata_request_id: 11111111-1111-4111-8111-111111111111
        results_channels:
          - alternatives:
              - transcript: heat the pan before the oil goes in
                confidence: 0.994
                words:
                  # Seconds, as floats. Treating these as milliseconds puts
                  # every word in the first two thousandths of the audio.
                  - word: heat
                    start: 0.32
                    end: 0.61
                    confidence: 0.99
                  - word: the
                    start: 0.61
                    end: 0.72
                    confidence: 0.97
      # Two channels, because multichannel was asked for. Code that indexes
      # zero silently ignores everything the second speaker said.
      - id: 22222222-2222-4222-8222-222222222222
        metadata_duration: 12.8
        metadata_channels: 2
        metadata_models:
          - 30089e05-99d1-4376-b32e-c263170674af
        metadata_request_id: 22222222-2222-4222-8222-222222222222
        results_channels:
          - alternatives:
              - transcript: so how did the seasoning go
                confidence: 0.981
          - alternatives:
              - transcript: it came off again
                confidence: 0.972

# Conformance cases, read from the Deepgram API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: the transcript is four levels down
    source: https://developers.deepgram.com/reference/pre-recorded
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 200
      body:
        # results.channels[0].alternatives[0].transcript. Two arrays, both of
        # length one here, which is why indexing zero looks safe.
        results.channels[0].alternatives[0].transcript: heat the pan before the oil goes in
        results.channels[0].alternatives[0].confidence: 0.994
      # A client reading either of these finds nothing.
      absent:
        - transcript
        - results.transcript

  - name: word timings are seconds rather than milliseconds
    source: https://developers.deepgram.com/reference/pre-recorded
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 200
      body:
        # 0.32 seconds into 4.32 seconds of audio. AssemblyAI reports the same
        # thing as 320, in milliseconds, so code moved between the two is
        # wrong by a factor of a thousand in one direction or the other.
        results.channels[0].alternatives[0].words[0].start: 0.32
        results.channels[0].alternatives[0].words[0].end: 0.61
        metadata.duration: 4.32

  - name: a second channel exists and indexing zero ignores it
    source: https://developers.deepgram.com/docs/multichannel
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/22222222-2222-4222-8222-222222222222
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 200
      body:
        # Everything the second speaker said is in channels[1], and code that
        # reads channels[0] and stops is silently missing half the
        # conversation.
        results.channels[0].alternatives[0].transcript: so how did the seasoning go
        results.channels[1].alternatives[0].transcript: it came off again
        metadata.channels: 2

  - name: a single channel response says so in the metadata
    source: https://developers.deepgram.com/reference/pre-recorded
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 200
      body:
        # One, which is the only thing distinguishing this from the response
        # above without counting the array.
        metadata.channels: 1
      absent:
        - results.channels[1]

  - name: the model is an identifier rather than a name
    source: https://developers.deepgram.com/reference/pre-recorded
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 200
      body:
        # A transcript is not reproducible without knowing which model
        # produced it, and the model behind a name like "nova-2" changes.
        metadata.models[0]: 30089e05-99d1-4376-b32e-c263170674af

  - name: a failure uses err_code and err_msg
    source: https://developers.deepgram.com/reference/errors
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/00000000-0000-4000-8000-000000000001
      headers:
        Authorization: Token cauldron0000000000000000000000000000000000000000
    expect:
      status: 404
      body:
        # Not code and message. A client written for almost any other API in
        # this collection finds neither.
        err_code: NOT_FOUND
        request_id: 00000000-0000-4000-8000-000000000000
      matches:
        err_msg: 'Not found'
      absent:
        - code
        - message
        - error

  - name: the prefix is Token, not Bearer
    # Verified live against api.deepgram.com, both with the wrong Bearer
    # prefix and with no header at all: byte-identical 401.
    source: https://developers.deepgram.com/docs/authenticating
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        # A third spelling among the providers here: LaunchDarkly wants the
        # key bare, most want Bearer, and Deepgram wants Token. The wrong one
        # fails as though the key were invalid.
        Authorization: Bearer cauldron0000000000000000000000000000000000000000
    expect:
      status: 401
      body:
        err_code: INVALID_AUTH

  - name: a bare key is refused too
    # Verified live against api.deepgram.com with a present, wrong token
    # (correct Token scheme).
    source: https://developers.deepgram.com/docs/authenticating
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /v1/listen/11111111-1111-4111-8111-111111111111
      headers:
        Authorization: cauldron0000000000000000000000000000000000000000
    expect:
      status: 401
      body:
        err_code: INVALID_AUTH
      matches:
        err_msg: 'Invalid credentials'

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://developers.deepgram.com/reference"
    arm: rate_limit
    fixture: small-account
    request:
      method: GET
      path: "/v1/listen/11111111-1111-4111-8111-111111111111"
      headers:
        "Authorization": "Token cauldron0000000000000000000000000000000000000000"
    expect:
      status: 429
      body:
        "err_code": "TOO_MANY_REQUESTS"
        "err_msg": "Rate limit exceeded"
        "request_id": "00000000-0000-4000-8000-000000000000"

