# Geoapify Recipe for Cauldron
#
# See ipinfo/recipe.yaml for the header this group of three Recipes shares.
# Geoapify is the plainest of the three on the credential question this
# group of Recipes keeps asking, and it is also the one whose own published
# OpenAPI spec settles the accuracy/confidence question completely rather
# than leaving it to a documentation page this Recipe had to read around.
#
# **Key-in-query, the same transport as here/recipe.yaml and
# what3words/recipe.yaml elsewhere in this collection -- and, unlike either
# of those two, Geoapify does not tell an absent key apart from a wrong
# one.** Six separate requests, one date, api.geoapify.com:
#
#   GET /v1/ipinfo                                    (no key at all)     -> 401 {"statusCode":401,"error":"Unauthorized","message":"Invalid apiKey"}
#   GET /v1/ipinfo?ip=8.8.8.8&apiKey=junkkey12345      (wrong key)         -> 401, byte-identical
#   GET /v1/ipinfo?ip=8.8.8.8&apiKey=                  (empty key)         -> 401, byte-identical
#   GET /v1/ipinfo?ip=8.8.8.8&apiKey=0123456789abcdef0123456789abcdef (key-shaped junk) -> 401, byte-identical
#   GET /v1/ipinfo?ip=8.8.8.8 -H 'X-Api-Key: junkkey12345'                -> 401, byte-identical
#   GET /v1/ipinfo?ip=8.8.8.8 -H 'Authorization: Bearer junkkey12345'      -> 401, byte-identical
#
# Every shape of "not a working key" this Recipe could think to try
# collapses to one sentence, which is most of this whole group of Recipes'
# providers and the reason HERE's and what3words' Recipes call the
# distinction out specifically -- they are the exception, not the rule, and
# Geoapify is worth having in the group precisely as the plain case beside
# them. auth.absent_error, .malformed_error and .rejected_error are all left
# unset for that reason: one generic authentication_error covers every
# verdict, honestly, because six different ways of failing to present a key
# never produced a second sentence.
#
# Geoapify's own OpenAPI security schemes (fetched from
# github.com/geoapify/geoapify-openapi-specs, see upstream.spec) document
# x-api-key as a real alternative to the apiKey query parameter, "Supported
# as an alternative authentication method for public APIs" in the schemes'
# own words. This Recipe cannot confirm whether that header is actually read
# and rejected or simply never looked at: a rejected credential and an
# absent one already answer identically here, so a junk value on either
# channel is indistinguishable from that channel not existing at all.
# Compare what3words' Recipe in this collection, which could tell its own
# alternate header transport apart from silence precisely because its
# absent and rejected sentences differ -- the same probe, answering a
# question on one provider that it cannot answer on this one.
#
# **The credential check runs unconditionally, before routing and before
# the method is even considered, with one narrow and expected exception.**
# Four more, no key anywhere on any of them:
#
#   GET    /v1/totally-bogus-endpoint-xyz    -> 401 Invalid apiKey, not 404
#   POST   /v1/ipinfo                        -> 401 Invalid apiKey, not 405
#   PUT    /v1/ipinfo                        -> 401 Invalid apiKey, not 405
#   DELETE /v1/ipinfo                        -> 401 Invalid apiKey, not 405
#
# This is Airbyte's own ordering, named in this project's auth.go and
# demonstrated on a different provider by that Recipe: checks the credential
# first, always, for every path and every method without exception. No
# after_routing is declared for that reason, and none is needed -- Cauldron's
# own default (credential before routing) already reproduces every case
# above with nothing extra to say, the identical situation FireHydrant's
# Recipe in this collection describes for its own provider.
#
# The one exception is CORS preflight, and it is not really an exception to
# anything about Geoapify's own design: OPTIONS /v1/ipinfo answers 200 with
# no key at all, an empty text/plain body and Allow: GET, HEAD -- struck
# live, and the standard shape a browser's own preflight expects from any
# API, not a credential decision Geoapify made. Cauldron has no OPTIONS
# special-casing anywhere in its runtime, so this emulator answers OPTIONS
# the same 401 every other method gets rather than bypassing the gate --
# stated in the fidelity gaps below rather than modelled, since modelling it
# would mean claiming a general CORS mechanism Cauldron does not have for
# the sake of one provider's preflight response.
#
# **The one thing this Recipe could never reach live, on any provider in
# this group, is what a private, reserved or malformed address actually
# does -- and here that gap is total rather than partial.** ipinfo's and
# maxmind's own Recipes in this group each found *something*: ipinfo has a
# free tier that answers the boundary directly, and maxmind's own error
# catalogue at least names IP_ADDRESS_RESERVED as a documented, separate
# 400. Geoapify's OpenAPI spec documents exactly one ip-shaped failure,
# 400 Bad Request, "\"ip\" must be a valid ip address with a optional CIDR"
# -- which is a syntax check, and says nothing about what a syntactically
# valid private or reserved address returns. No worked example, no error
# code, no field anywhere addresses that question for this provider, and
# this Recipe was never going to reach it live either way: the credential
# gate answers everything, valid address, invalid address, private address
# alike, before this 400 could ever fire. So the honest report for Geoapify
# on the one question this whole group of Recipes exists to ask is: not
# established, by this Recipe, from any source it could reach.
#
# **The accuracy/confidence question this whole group of Recipes exists to
# ask has a clean, complete answer for Geoapify, and it is the sharpest
# three-way contrast in the group.** Fetched directly from Geoapify's own
# published OpenAPI spec (see upstream.spec) rather than a documentation
# page read around: IpGeolocationResponse's full schema is ip, city, state,
# country, continent, location {latitude, longitude}, subdivisions[],
# postal. No radius. No confidence. No accuracy field of any kind, at any
# tier -- Geoapify's IP Geolocation product has exactly one tier, unlike
# IPinfo's four or MaxMind's three, so there is no higher plan this Recipe
# had to decline to verify. See ipinfo/recipe.yaml (an accuracy signal
# exists, gated behind a token this Recipe never held) and
# maxmind/recipe.yaml (the same signal, named and scaled precisely, gated
# the identical way) for the other two answers this group of three Recipes
# found to the same question. Geoapify hands back a city as though it knew,
# and its own schema confirms that is the entire claim being made.
#
# **The one worked example is Geoapify's own**, quoted from the 200 example
# embedded directly in its OpenAPI document rather than read from a
# narrative documentation page -- New York, at 40.7128, -74.006, for
# 134.64.222.45, with country United States (ISO US, capital
# "Washington D.C.", geoname_id 6252001) and continent North America (code
# NA). Compare what3words' Recipe in this collection for the same situation
# on a different provider: a worked example quoted from prose documentation
# rather than a machine-readable spec, because what3words publishes no
# OpenAPI file this Recipe could find. Geoapify does, and that is also why
# upstream.spec is recorded below where it is not for either sibling in
# this group.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No key was ever requested, guessed or used. Every 401 case below is
#     struck live and carries a verified date. The 200 and the 400 cases
#     are Geoapify's own documented examples and carry neither.
#   - OPTIONS is not modelled -- see above. This emulator refuses it like
#     any other unauthenticated request; the live host answers a CORS
#     preflight with no credential at all.
#   - Whether a well-formed private, reserved or unroutable address answers
#     differently from a public one is not established for this provider,
#     by this Recipe, from any source available to it -- see above. This is
#     the one question in this group of three Recipes that Geoapify's own
#     materials simply do not address.
#   - subdivisions (an array of named regions) and every localised names
#     object (city.names, country.names, continent.names, each a map of
#     language code to name) are present in the schema and left out of the
#     fields this Recipe declares, to keep the resource to the fields the
#     accuracy question actually needed. country.languages, an array of
#     {iso_code, name, name_native}, is left out for the same reason.
#   - The ip parameter is documented as optional -- "Omit ip to use the
#     client address detected by the API," the same self-lookup shape
#     ipinfo's Recipe in this group found and specifically avoided
#     fixturing, for the identical reason: the response would identify
#     whoever ran this Recipe's own probes. No request without ip was ever
#     sent with a real key, because none exists; the one request this
#     Recipe sent without ip (checking whether the credential gate fires
#     first) never reached far enough to trigger it.
#   - EU-region routing (api-eu.geoapify.com, named in the spec's own
#     servers list as "EU-focused... uses EU infrastructure") is not
#     modelled: this Recipe describes api.geoapify.com only.

recipe: geoapify
capability: infrastructure
version: 0.1.0

upstream:
  api: v1
  docs: https://apidocs.geoapify.com/docs/ip-geolocation/
  spec: https://raw.githubusercontent.com/geoapify/geoapify-openapi-specs/main/api-specs/ip-geolocation/ip-geolocation-api-openapi-specs.json
  spec_hash: 9cc6c1f212c81499e4f502e762a2bd17372a2f422805fc5f5f5750bf194967b0
  spec_seen: "2026-09-02"

auth:
  # In the query string -- see the header and here/recipe.yaml,
  # what3words/recipe.yaml for the rest of this group. x-api-key is
  # documented as an alternative header transport and is not wired; see the
  # header for why this Recipe cannot even confirm it is read.
  scheme: query
  param: apiKey
  keys:
    - cauldron_geoapify_fixture_apikey_00000000000000

responses:
  resource:
    style: bare
  error:
    # {"statusCode": ..., "error": "...", "message": "..."} on every
    # failure Geoapify's own gateway sends, per its own GatewayError schema.
    style: flat
    status_field: statusCode
    type_field: error
    message_field: message
    code_field: "-"

resources:
  ip_lookup:
    id:
      # The address itself, echoed back under "ip" -- confirmed by
      # Geoapify's own OpenAPI schema and its one worked example, not
      # guessed. Not a provider-minted identifier, the same non-id shape
      # ipinfo's and what3words' Recipes in this collection already use.
      style: opaque
      field: ip
    fields:
      city_name:
        type: string
        in: city
        as: name
      state_name:
        type: string
        in: state
        as: name
      country_name:
        type: string
        in: country
        as: name
      country_iso_code:
        type: string
        in: country
        as: iso_code
      country_geoname_id:
        type: integer
        in: country
        as: geoname_id
      country_capital:
        type: string
        in: country
        as: capital
      country_currency:
        type: string
        in: country
        as: currency
      country_flag:
        type: string
        in: country
        as: flag
      continent_code:
        type: string
        in: continent
        as: code
      continent_name:
        type: string
        in: continent
        as: name
      # No accuracy_radius, no confidence, anywhere on this schema -- see
      # the header. latitude/longitude are the entire location object
      # Geoapify's own spec declares.
      location_latitude:
        type: number
        in: location
        as: latitude
      location_longitude:
        type: number
        in: location
        as: longitude
      postal_code:
        type: string
        in: postal
        as: code

routes:
  - method: GET
    path: /v1/ipinfo
    resource: ip_lookup
    operation: get
    id_from: "query:ip"

errors:
  # The one sentence every verdict this Recipe could produce shares -- see
  # the header for the six separate ways this was checked.
  authentication_error:
    status: 401
    type: Unauthorized
    message: Invalid apiKey
    headers:
      Content-Type: "application/json; charset=utf-8"

  # Documented in Geoapify's own OpenAPI spec and never reached live -- the
  # credential gate answers first for every request this Recipe could send.
  # See the header.
  invalid_ip:
    status: 400
    type: Bad Request
    message: "\"ip\" must be a valid ip address with a optional CIDR"

fixtures:
  empty: {}

  # Geoapify's own worked example, embedded directly in its OpenAPI
  # document's 200 response -- quoted rather than guessed. See the header
  # and upstream.spec.
  documented:
    ip_lookup:
      - id: 134.64.222.45
        city_name: New York
        state_name: New York
        country_name: United States
        country_iso_code: US
        country_geoname_id: 6252001
        country_capital: "Washington D.C."
        country_currency: "USD,USN,USS"
        country_flag: "🇺🇸"
        continent_code: NA
        continent_name: North America
        location_latitude: 40.7128
        location_longitude: -74.006
        postal_code: "10123"

conformance:
  - name: no key at all is Invalid apiKey
    source: https://api.geoapify.com/v1/ipinfo
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/ipinfo
    expect:
      status: 401
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        statusCode: 401
        error: Unauthorized
        message: Invalid apiKey

  - name: a wrong key answers the identical sentence
    source: https://api.geoapify.com/v1/ipinfo?ip=8.8.8.8&apiKey=junkkey12345
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: "/v1/ipinfo?ip=8.8.8.8&apiKey=junkkey12345"
    expect:
      status: 401
      body:
        statusCode: 401
        error: Unauthorized
        message: Invalid apiKey

  - name: an empty key answers the identical sentence too
    source: "https://api.geoapify.com/v1/ipinfo?ip=8.8.8.8&apiKey="
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: "/v1/ipinfo?ip=8.8.8.8&apiKey="
    expect:
      status: 401
      body:
        message: Invalid apiKey

  - name: a key-shaped 32-character junk value answers no differently than a short one
    source: https://api.geoapify.com/v1/ipinfo?ip=8.8.8.8&apiKey=0123456789abcdef0123456789abcdef
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: "/v1/ipinfo?ip=8.8.8.8&apiKey=0123456789abcdef0123456789abcdef"
    expect:
      status: 401
      body:
        message: Invalid apiKey

  - name: the documented alternate header transport cannot be told apart from silence either
    # X-Api-Key: junkkey12345, no apiKey query parameter at all. See the
    # header for why this cannot prove the channel is read rather than
    # ignored -- the answer is the same either way.
    source: https://api.geoapify.com/v1/ipinfo?ip=8.8.8.8
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/ipinfo?ip=8.8.8.8
      headers:
        X-Api-Key: junkkey12345
    expect:
      status: 401
      body:
        message: Invalid apiKey

  - name: a path this host has no route for still answers the credential sentence, not a routing one
    source: https://api.geoapify.com/v1/totally-bogus-endpoint-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v1/totally-bogus-endpoint-xyz
    expect:
      status: 401
      body:
        statusCode: 401
        message: Invalid apiKey

  - name: and so does a method this route does not accept
    source: https://api.geoapify.com/v1/ipinfo
    verified: "2026-09-02"
    fixture: empty
    request:
      method: DELETE
      path: /v1/ipinfo
    expect:
      status: 401
      body:
        message: Invalid apiKey

  - name: a syntactically invalid address is documented as its own 400, never reached live
    source: https://raw.githubusercontent.com/geoapify/geoapify-openapi-specs/main/api-specs/ip-geolocation/ip-geolocation-api-openapi-specs.json
    arm: invalid_ip
    fixture: documented
    request:
      method: GET
      path: "/v1/ipinfo?ip=not-an-ip&apiKey=cauldron_geoapify_fixture_apikey_00000000000000"
    expect:
      status: 400
      body:
        statusCode: 400
        error: Bad Request
        message: "\"ip\" must be a valid ip address with a optional CIDR"

  - name: the one worked example names a city, a country and a continent, and nothing about how sure it is
    source: https://raw.githubusercontent.com/geoapify/geoapify-openapi-specs/main/api-specs/ip-geolocation/ip-geolocation-api-openapi-specs.json
    fixture: documented
    request:
      method: GET
      path: "/v1/ipinfo?ip=134.64.222.45&apiKey=cauldron_geoapify_fixture_apikey_00000000000000"
    expect:
      status: 200
      body:
        ip: 134.64.222.45
        city.name: New York
        state.name: New York
        country.name: United States
        country.iso_code: US
        country.geoname_id: 6252001
        country.capital: "Washington D.C."
        continent.code: NA
        continent.name: North America
        location.latitude: 40.7128
        location.longitude: -74.006
        postal.code: "10123"
      absent:
        - location.accuracy_radius
        - confidence
        - accuracy
