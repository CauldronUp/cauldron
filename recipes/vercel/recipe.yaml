# Vercel Recipe for Cauldron
#
# Vercel has no test mode. Creating a deployment through the API creates a real
# deployment: it builds, it costs build minutes, and it can be promoted to
# production by accident. Deleting one is permanent. Teams that automate
# against it end up with a scratch project full of half-finished builds, and
# the failures worth handling (a build that fails, a deployment stuck in
# QUEUED, a token without team scope) cannot be produced on demand.
#
# Two things worth getting exactly right:
#
#   1. The error is nested under "error" with a code and a message, and
#      most failures carry nothing else -- no type, no status inside the
#      body, so code written for Stripe's shape reads error.type and finds
#      nothing. The credential failures are the exception: each carries its
#      own extra boolean (missingToken, invalidToken), which is where the
#      "nothing else" part of this claim turned out to need a footnote --
#      see below.
#   2. Deployment state is a string enum, and READY is not the only terminal
#      value. Code that polls until state is not BUILDING and then assumes
#      success ships a broken build.
#
# The credential shape needed no account, and struck live against
# api.vercel.com on 2026-09-05 it found this file's claim wrong on the
# sentence and incomplete on the shape: no token at all answers "The
# request is missing an authentication token" with missingToken: true, and
# a present, wrong token answers "Not authorized" with invalidToken: true
# instead -- two different sentences and two different flags, not the one
# sentence this file had for both. An existing case had sent no token at
# all while calling it "a bad token"; fixed below. A path nothing declares
# is a 404, resolved before either credential question is asked.
#
# Tokens below are fixtures, not secrets.

recipe: vercel
capability: hosting
version: 0.1.0

upstream:
  api: v13
  docs: https://vercel.com/docs/rest-api
  spec: https://vercel.com/openapi.json
  spec_hash: 4f99c931115198c36f0b1333f296bfb67dabf64ec66d5f7ba7da36ba1c254006
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron_vercel_token
  # Verified live against api.vercel.com 2026-09-05: no token at all and a
  # present, wrong one are different sentences with different extra
  # boolean flags, not the same failure. Checked before routing too: a
  # path nothing declares is a 404 with no token sent.
  absent_error: missing_token
  after_routing: true

# Vercel wraps a single domain under "domain" and wraps neither a project nor
# a deployment, so the domain fetch below carries its own envelope. Code
# reading one domain reads res.domain.name; code reading one project reads
# res.name. The wrapping is per endpoint here, not per API.
responses:
  list:
    style: wrapped
    count_field: pagination.count
    cursor_field: pagination.next
    # Stated rather than modelled: Vercel's own description types this field as
    # a number and describes it as a "Timestamp that must be used to request the
    # next page", and what this Recipe serves there is the last record's
    # identifier as a string. The engine has one kind of cursor and it is the
    # identifier, so the shape is wrong here in a way no declaration available
    # can fix -- and a reader is better off knowing that than finding it.
    #
    # What the name fixes is the parameter it goes back in: until on the
    # deployments listing, from on the projects one, neither of them "cursor".
  # Nested, with a code and a message and nothing else.
  error:
    style: nested
    type_field: "-"

resources:
  deployment:
    collection: deployments
    id:
      prefix: dpl_
      length: 24
    fields:
      name:
        type: string
        required: true
      url:
        type: string
      # Vercel's real lifecycle. READY is not the only terminal state, and
      # code that polls until BUILDING ends and assumes success ships a
      # broken build.
      state:
        type: string
        default: QUEUED
      readyState:
        type: string
        default: QUEUED
      target:
        type: string
      # A deployment is a preview unless it is explicitly production, and
      # promoting one by accident is the expensive mistake here.
      source:
        type: string
        default: cli
      # Nested under creator, which is how Vercel sends it. The field name
      # is the key inside the sub-object, so these are uid and username.
      uid:
        type: string
        in: creator
      username:
        type: string
        in: creator
      # created and state are the older spellings, and Vercel sends them on
      # the listing only. A single deployment carries createdAt and
      # readyState and neither of the old names, so the routes below say so:
      # code that reads deployment.state from a listing and then re-reads it
      # after fetching the same deployment gets undefined the second time.
      created:
        type: timestamp_ms
      createdAt:
        type: timestamp_ms
      buildingAt:
        type: timestamp_ms

  project:
    collection: projects
    id:
      prefix: prj_
      length: 24
    fields:
      name:
        type: string
        required: true
      framework:
        type: string
      accountId:
        type: string
      nodeVersion:
        type: string
        default: "22.x"
      createdAt:
        type: timestamp_ms
      updatedAt:
        type: timestamp_ms

  domain:
    collection: domains
    id:
      prefix: dom_
      length: 24
    fields:
      name:
        type: string
        required: true
      # Which project this belongs to, and which URL it forwards to. Neither
      # is on an account domain: Vercel's v5 domain object has no projectId
      # and no redirect, because both belong to a project's domain, which is
      # a different endpoint and a different object. The association is worth
      # keeping in the record -- it is what makes a fixture coherent -- so it
      # stays off the wire rather than being deleted.
      projectId:
        type: string
        in: "-"
      redirect:
        type: string
        in: "-"
      # An unverified domain serves nothing, and the verification step is
      # exactly what a scratch project cannot rehearse.
      verified:
        type: boolean
        default: false
      createdAt:
        type: timestamp_ms

routes:
  # Vercel versions each endpoint on its own and the numbers do not move
  # together: the listing is v7, the create and the fetch are v13, projects
  # are v10 to read and v11 to make. This had the listing on v6 and both
  # project routes on v9, which is a Recipe written against an older set of
  # docs than the one anybody reads now.
  - method: GET
    path: /v7/deployments
    resource: deployment
    operation: list
    pagination:
      # Vercel's own description declares limit and until here -- until
      # being a JavaScript timestamp, "Get Deployments created before this"
      # -- and no parameter called cursor, which is what this block was
      # making the runtime read.
      #
      # The projects listing on the same API takes from instead, so the two
      # positions are named differently and neither is the word this Recipe
      # was sending.
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: until

  - method: POST
    path: /v13/deployments
    resource: deployment
    operation: create
    # No created and no state. A single deployment carries createdAt and
    # readyState; the older names are the listing's alone.
    returns:
      - id
      - name
      - url
      - readyState
      - target
      - source
      - uid
      - username
      - createdAt
      - buildingAt

  - method: GET
    path: /v13/deployments/{id}
    resource: deployment
    operation: get
    # No created and no state. A single deployment carries createdAt and
    # readyState; the older names are the listing's alone.
    returns:
      - id
      - name
      - url
      - readyState
      - target
      - source
      - uid
      - username
      - createdAt
      - buildingAt

  # 200, not 204. Vercel answers a deployment delete with a body, so code
  # that treats no-content as the success signal and skips parsing takes the
  # wrong path against the real API.
  - method: DELETE
    path: /v13/deployments/{id}
    resource: deployment
    operation: delete
    status: 200

  - method: GET
    path: /v10/projects
    resource: project
    operation: list
    pagination:
      # from, not until and not cursor. Vercel's own description says it
      # takes "projects updated after the given timestamp or continuation
      # token" -- a different name from the deployments listing's, on the
      # same API, for the same job.
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: from

  - method: POST
    path: /v11/projects
    resource: project
    operation: create

  - method: GET
    path: /v9/projects/{id}
    resource: project
    operation: get

  - method: GET
    path: /v5/domains
    resource: domain
    operation: list
    pagination:
      # limit and until, the same pair as the deployments listing and not
      # the same as the projects one beside it. Three listings on this API
      # and two different names for the position, both read from Vercel's
      # own description.
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: until

  - method: GET
    path: /v5/domains/{id}
    resource: domain
    operation: get
    envelope:
      style: wrapped
      key: domain

webhooks:
  events:
    - deployment.created
    - deployment.succeeded
    - deployment.error
    - deployment.canceled
    - deployment.promoted
    - project.created
    - domain.created
  # createdAt is milliseconds, like the createdAt on the deployment itself.
  # The record is at payload, one word away from the default's data.object
  # and not reachable by it.
  payload:
    id: "{id}"
    type: "{event}"
    createdAt: "{created_ms}"
    region: lhr1
    payload:
      "{object}": true
  signing:
    scheme: hmac-sha256
    header: x-vercel-signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: too_many_requests
    message: Too many requests are being made to the API.
    headers:
      Retry-After: "1"
      X-RateLimit-Remaining: "0"

  # Verified live 2026-09-05: a present, wrong bearer token.
  authentication_error:
    status: 403
    code: forbidden
    message: Not authorized
    fields:
      error.invalidToken: true

  # Verified the same day: no Authorization header sent at all. Same
  # status and code, a different sentence and a different boolean flag.
  missing_token:
    status: 403
    code: forbidden
    message: The request is missing an authentication token
    fields:
      error.missingToken: true

  resource_missing:
    status: 404
    code: not_found
    message: "The resource could not be found: {detail}"

  # Verified live 2026-09-05: a path nothing declares.
  unknown_route:
    status: 404
    code: not_found
    message: "The requested API endpoint was not found."

  parameter_missing:
    status: 400
    code: bad_request
    message: "Invalid request: {detail} is required"

  # A personal token used against a team resource. The message is unhelpful in
  # the real API too, which is why reproducing it is worth something.
  team_scope_missing:
    status: 403
    code: forbidden
    message: Not authorized to access this team

  # A build that fails is a normal outcome, not an API error, but the
  # deployment-limit refusal is a real one and only appears under load.
  deployment_limit_reached:
    status: 402
    code: deployment_limit_reached
    message: You have reached your deployment limit for today.

fixtures:
  empty: {}

  small-team:
    project:
      - id: prj_000000000000000000000001
        name: marketing-site
        framework: nextjs
        nodeVersion: "22.x"
    deployment:
      - id: dpl_000000000000000000000001
        name: marketing-site
        url: marketing-site-abc123.vercel.app
        state: READY
        readyState: READY
        target: production
        username: ada
      - id: dpl_000000000000000000000002
        name: marketing-site
        url: marketing-site-def456.vercel.app
        # A failed build. Code that polls until the state stops being
        # BUILDING and then assumes success ships this one.
        state: ERROR
        readyState: ERROR
      - id: dpl_000000000000000000000003
        name: marketing-site
        url: marketing-site-ghi789.vercel.app
        state: QUEUED
        readyState: QUEUED
    domain:
      - id: dom_000000000000000000000001
        name: example.com
        projectId: prj_000000000000000000000001
        verified: true
      - id: dom_000000000000000000000002
        name: staging.example.com
        projectId: prj_000000000000000000000001
        # Unverified domains serve nothing.
        verified: false
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: dom_000000000000000000000003
        name: staging.example.com
        projectId: prj_000000000000000000000001
        verified: false

# Conformance cases, read from Vercel's REST API reference rather than observed
# against a live team. The verify report says so.
conformance:
  - name: deleting a deployment answers 200, not 204
    # Vercel answers with a body. Code that treats no-content as the success
    # signal, or calls .json() only when the status is not 204, takes a
    # different path against the real API than it does here.
    source: https://vercel.com/docs/rest-api/endpoints/deployments
    fixture: small-team
    request:
      method: DELETE
      path: /v13/deployments/dpl_000000000000000000000001
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      absent:
        - error

  - name: an account domain carries no project and no redirect
    # Both belong to a project's domain, which is a different endpoint and a
    # different object. Vercel's v5 domain has neither, so code reading
    # domain.projectId to decide which project a domain serves gets a value
    # here and undefined in production.
    source: https://vercel.com/docs/rest-api/endpoints/domains
    fixture: small-team
    request:
      method: GET
      path: /v5/domains
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        domains[0].name: example.com
      absent:
        - domains[0].projectId
        - domains[0].redirect

  - name: a domain is wrapped and a project is not, in the same API
    # Vercel wraps a single domain under "domain" and wraps neither a project
    # nor a deployment. Code that learns the shape from one endpoint and
    # applies it to the other is one level out, in whichever direction it
    # guessed, and nothing about the two responses says which.
    source: https://vercel.com/docs/rest-api/endpoints/domains
    fixture: small-team
    request:
      method: GET
      path: /v5/domains/dom_000000000000000000000001
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        domain.name: example.com
      absent:
        - name
        - id

  - name: and the project it belongs to is not wrapped at all
    source: https://vercel.com/docs/rest-api/endpoints/projects
    fixture: small-team
    request:
      method: GET
      path: /v9/projects/prj_000000000000000000000001
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        name: marketing-site
      absent:
        - project
        - domain

  - name: the error is nested with a code and a message and nothing else
    source: https://vercel.com/docs/rest-api/errors
    fixture: small-team
    request:
      method: GET
      path: /v13/deployments/dpl_doesnotexist
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 404
      body:
        error:
          code: not_found
      matches:
        error.message: 'could not be found'
      # Code written for Stripe's shape reads error.type and finds nothing.
      absent:
        - error.type
        - message
        - errors

  - name: READY is not the only terminal deployment state
    source: https://vercel.com/docs/rest-api/endpoints/deployments
    fixture: small-team
    request:
      method: GET
      path: /v13/deployments/dpl_000000000000000000000002
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        # Code that polls until the state stops being BUILDING and then
        # assumes success ships this deployment.
        readyState: ERROR
        name: marketing-site
      # state is the listing's spelling. A single deployment carries
      # readyState and not state, so code that reads deployment.state off a
      # listing and re-reads it after fetching the same deployment gets
      # undefined the second time -- and undefined is not BUILDING, so a
      # poll that waits for the state to change stops immediately and calls
      # a failed build finished.
      absent:
        - state
        - created

  - name: a collection carries its paging state under pagination
    source: https://vercel.com/docs/rest-api/endpoints/deployments
    fixture: small-team
    request:
      method: GET
      path: /v7/deployments
      query:
        limit: "2"
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        pagination:
          count: 3
        deployments[0].state: READY
        deployments[1].state: ERROR
      matches:
        # This Recipe's own value, and deliberately not a claim about Vercel's.
        # Vercel sends a timestamp number here and this serves an identifier
        # string -- see the responses.list note above, where the divergence is
        # stated. What this case pins is that a next pointer appears at all,
        # under pagination rather than at the top level.
        pagination.next: '^dpl_[0-9]+$'
      absent:
        - deployments[2]
        - data

  - name: timestamps are milliseconds
    source: https://vercel.com/docs/rest-api/endpoints/deployments
    fixture: empty
    request:
      method: POST
      path: /v13/deployments
      headers:
        Authorization: Bearer cauldron_vercel_token
      json:
        name: marketing-site
    expect:
      status: 200
      body:
        name: marketing-site
        # A new deployment has not built yet. Treating a create response as
        # a finished deployment is the mistake this catches.
        readyState: QUEUED
        source: cli
      matches:
        createdAt: '^[0-9]{13}$'
        id: '^dpl_[A-Za-z0-9]{24}$'

  - name: the creator is nested, not flattened onto the deployment
    source: https://vercel.com/docs/rest-api/endpoints/deployments
    fixture: small-team
    request:
      method: GET
      path: /v13/deployments/dpl_000000000000000000000001
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        creator:
          username: ada
        target: production
      absent:
        - username

  - name: no token at all is a 403, not a 401 -- and a different sentence than a wrong one
    # Named "a bad token" and sent none at all. Struck live against
    # api.vercel.com 2026-09-05: an absent token answers "The request is
    # missing an authentication token" with missingToken: true, not the
    # "Not authorized" sentence a present, wrong token gets. Fixed here.
    source: https://api.vercel.com/v7/deployments
    verified: "2026-09-05"
    request:
      method: GET
      path: /v7/deployments
    expect:
      # Vercel answers 403 where most providers answer 401, and code checking
      # for 401 to trigger a token refresh never fires.
      status: 403
      body:
        error:
          code: forbidden
          message: The request is missing an authentication token
          missingToken: true

  - name: a present, wrong token gets a different sentence and flag
    source: https://api.vercel.com/v7/deployments
    verified: "2026-09-05"
    request:
      method: GET
      path: /v7/deployments
      headers:
        Authorization: Bearer garbage_invalid_000
    expect:
      status: 403
      body:
        error:
          code: forbidden
          message: Not authorized
          invalidToken: true

  - name: a path nothing declares is a 404, checked before any credential
    source: https://api.vercel.com/v7/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No token sent. Routing answers first regardless.
      path: /v7/not-a-real-endpoint
    expect:
      status: 404
      body:
        error:
          code: not_found
          message: "The requested API endpoint was not found."

  - name: an unverified domain is listed, flagged rather than hidden
    source: https://vercel.com/docs/rest-api/endpoints/domains
    fixture: small-team
    request:
      method: GET
      path: /v5/domains
      headers:
        Authorization: Bearer cauldron_vercel_token
    expect:
      status: 200
      body:
        domains[0].verified: true
        domains[1].verified: false
        domains[1].name: staging.example.com

  - name: the deployment is at payload and the timestamp is milliseconds
    source: https://vercel.com/docs/webhooks/webhooks-api
    fixture: small-team
    request:
      method: POST
      path: /v13/deployments
      headers:
        Authorization: Bearer cauldron_vercel_token
      json:
        name: marketing-site
    expect:
      status: 200
      webhook:
        event: deployment.created
        body:
          type: deployment.created
        matches:
          createdAt: '^[0-9]{13}$'
          payload.id: '^dpl_'
        absent:
          # One word away, and nothing there.
          - data
          - data.object


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and until=dpl_000000000000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and until are the two names this listing reads"
    source: "https://vercel.com/docs/rest-api/endpoints/deployments"
    fixture: small-team
    request:
      method: GET
      path: "/v7/deployments"
      query:
        "limit": "1"
        "until": "dpl_000000000000000000000001"
      headers:
        "Authorization": "Bearer cauldron_vercel_token"
    expect:
      status: 200
      body:
        "deployments[0].id": "dpl_000000000000000000000002"
      absent:
        - "deployments[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and until=dpl_000000000000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and until are the two names this listing reads on v7 deployments"
    source: "https://vercel.com/docs/rest-api/endpoints/deployments"
    fixture: small-team
    request:
      method: GET
      path: "/v7/deployments"
      query:
        "limit": "1"
        "until": "dpl_000000000000000000000001"
      headers:
        "Authorization": "Bearer cauldron_vercel_token"
    expect:
      status: 200
      body:
        "deployments[0].id": "dpl_000000000000000000000002"
      absent:
        - "deployments[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and until=dom_000000000000000000000001, which is the
  # identifier of the last record on the previous page, and asserts the
  # second record came back on its own: one to skip, one to return, and
  # a third behind it to prove the size stopped the page.
  - name: "limit and until are the two names this listing reads on v5 domains"
    source: "https://vercel.com/docs/rest-api/endpoints/domains"
    fixture: small-team
    request:
      method: GET
      path: "/v5/domains"
      query:
        "limit": "1"
        "until": "dom_000000000000000000000001"
      headers:
        "Authorization": "Bearer cauldron_vercel_token"
    expect:
      status: 200
      body:
        "domains[0].id": "dom_000000000000000000000002"
      absent:
        - "domains[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the project listing answers with what the fixture holds"
    source: "https://vercel.com/docs/rest-api/endpoints/deployments"
    fixture: small-team
    request:
      method: GET
      path: "/v10/projects"
      headers:
        "Authorization": "Bearer cauldron_vercel_token"
    expect:
      status: 200
      body:
        "projects[0].id": "prj_000000000000000000000001"
      absent:
        - "projects[1]"

