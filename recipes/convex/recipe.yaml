# Convex Recipe for Cauldron
#
# Checked live, 2026-09-01, with no account, no deployment and no credential,
# against a deployment name that does not exist:
# https://cauldron-fixture-does-not-exist-00000.convex.cloud. The question
# the task named was whether DNS fails for a name like that. It does not.
# Convex fronts *.convex.cloud (and *.convex.site, the separate HTTP Actions
# host -- checked live too) with a Cloudflare wildcard, so any string in that
# position resolves, connects and gets a real HTTP answer from a gateway
# component that identifies itself in a response header as "usher" --
# convex-usher: usher, on every response this Recipe struck, real path or
# not, real deployment or not. Nothing about the deployment's non-existence
# ever shows up as a connection failure. It shows up, if it shows up at all,
# as a 404 with an empty body.
#
# "If it shows up at all" matters, because usher does not check whether the
# deployment exists first. It checks whether the *request* is well-formed
# first, and a malformed request never gets far enough to learn that the
# deployment behind the hostname it was sent to is imaginary:
#
#   POST /api/query, no body, no Content-Type
#     -> 400 {"code":"BadJsonBody",
#             "message":"Expected request with `Content-Type: application/json`"}
#   POST /api/query, Content-Type: application/json, body {}
#     -> 400 {"code":"BadJsonBody",
#             "message":"Failed to deserialize the JSON body into the target
#             type: missing field `path` at line 1 column 2"}
#   GET /api/query, no query string
#     -> 400 {"code":"BadQueryArgs",
#             "message":"Failed to deserialize query string: missing field `path`"}
#   PATCH /api/query
#     -> 405, Allow: GET,HEAD,POST, empty body
#   POST /api/query, Content-Type: application/json,
#        body {"path":"foo:bar","args":{},"format":"json"} -- shaped
#        correctly, naming a function that cannot exist
#     -> 404, empty body
#   GET /no-such-route
#     -> 404, empty body -- byte-identical to the line above
#
# Every one of those was struck against the same nonexistent deployment, so
# none of it required the deployment to be real. Shape validation runs
# first and fails on its own terms regardless of what the hostname names;
# only a request that clears it reaches the point where "does this
# deployment, or this function within it, exist" is even asked -- and that
# question is answered with the same bare 404 an unmatched path gets. A
# client cannot tell "your deployment name is wrong" from "your function
# path is wrong" from "this path was never a route on this host at all".
# All three are one shape.
#
# The other half of the question this task named -- missing vs wrong
# credential, and whether routing beats auth -- has a plain answer on this
# host: for a function-call route (/api/query, /api/mutation, /api/action,
# /api/run/*), it does not apply, because there is no platform-level
# credential check to order against routing at all. None of the requests
# above carried an Authorization header and none of them were refused for
# it. Convex's functions are public HTTP endpoints by default; whether a
# given one demands a signed-in caller is a line the function's own code
# writes (ctx.auth.getUserIdentity()), not a gate the platform enforces
# before dispatch. A Recipe with one Cauldron-wide auth scheme has nothing
# to wire here, because the real host has nothing wired here either.
#
# That is not true everywhere on Convex. api.convex.dev -- the control
# plane behind the CLI and dashboard, a second host this emulator cannot
# also be (see the gaps) -- gates real operations, checked live the same
# day:
#
#   GET /api/teams, no credential
#     -> 401 {"code":"MissingAccessToken",
#             "message":"An access token is required for this command."}
#   GET /api/teams, Authorization: Bearer junkjunkjunk00000000000000
#     -> 401 {"code":"AccessTokenInvalid",
#             "message":"Access Token could not be decoded"}
#   GET /api/teams, Authorization: Convex junkjunkjunk00000000000000
#     -> 401, the identical MissingAccessToken body -- the deploy-key scheme
#        name in the wrong place is read as no credential at all, not as a
#        wrong one
#   POST /api/teams, PUT /api/teams, DELETE /api/teams, no credential
#     -> 405, Allow: GET,HEAD -- method routing answers before auth does
#   GET /api/this-is-not-a-real-endpoint, with and without a credential
#     -> 404, empty body, no access-control-allow-credentials header at all
#        (present on every route this Recipe did match) -- path routing
#        answers before auth does too, on every method tried
#
# So api.convex.dev genuinely distinguishes missing from wrong, in both the
# message and the machine-readable code, and genuinely checks routing before
# auth regardless of method -- three real findings the task asked for,
# struck live, on a host this file does not route a single path against.
# They are recorded here as prose because Cauldron serves one address per
# Recipe and the data-plane findings above are the ones this task named
# first; see pinecone/recipe.yaml in this collection for the identical
# trade made the other way (control plane routed, data plane prose).
#
# What "create" returns, for the question this whole group exists to ask:
# there is no platform create. Every function-call route above dispatches to
# code the developer wrote; the platform's own write primitive,
# ctx.db.insert(table, value) inside a mutation, is documented to hand back
# only the new document's Id -- a string -- not the document. What the HTTP
# envelope's own "value" field holds on any given call is whatever that
# function chose to return, which can be the id, the full document, both, or
# neither. Turso's create truncates a fixed projection; SingleStore's create
# hands back a password and no record; Convex's create is not a fixed
# response at all, because Convex does not define what "create" means at the
# platform layer. That absence is the finding, not a gap in this Recipe.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - api.convex.dev is not routed. See above -- one emulator, one address,
#     and the data-plane questions this task named came first.
#   - No real deployment exists and none was created. The success case
#     below -- the {"status":"success","value":...,"logLines":[...]} shape
#     documented at docs.convex.dev/http-api/, worked example
#     acoustic-panther-728.convex.cloud with function path messages:list --
#     is read from that page, not observed, and carries no verified date.
#     value is fixtured as an empty object because no worked call-result
#     value is shown on that page either; this Recipe declares the envelope
#     Convex documents and does not invent what a function would have
#     returned inside it.
#   - A genuine function-execution failure -- the code's own
#     {"status":"error","errorMessage":...,"errorData":...,"logLines":[...]}
#     shape, also documented on the same page -- is a different envelope
#     again from every gateway-level failure struck live above (which are
#     all {"code":...,"message":...}, no status field at all). It is not
#     modelled: reaching it needs a real function that actually throws, and
#     this Recipe has no function to run.
#   - convex.site (HTTP Actions, user-defined endpoints) was checked live
#     for the identical nonexistent-deployment question and answers the
#     identical usher 404 -- same gateway, same shape, not routed separately
#     here because there is nothing more to say about it that convex.cloud's
#     routes do not already say.
#   - No openapi.json or equivalent machine-readable description was found
#     at api.convex.dev; /openapi.json and /api/openapi.json both 404 there,
#     checked live. upstream.spec is left unset rather than pointed at
#     something that does not resolve.
#
# The deployment name and function path below are fixtures. Nothing this
# file names points at a real Convex project.

recipe: convex
capability: database
version: 0.1.0

upstream:
  api: http-api
  docs: https://docs.convex.dev/http-api/

auth:
  # None to wire: the routes this Recipe models answer identically with or
  # without an Authorization header, checked live -- see the header. The
  # real credential-gated host (api.convex.dev) is not routed at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  # The result of a function call. No identifier: nothing here is a record a
  # second request could address by id, the same shape Mezmo's ingest
  # acknowledgment takes in this collection, for the same reason -- see the
  # header for what this envelope can and cannot claim about the value it
  # carries.
  function_result:
    id:
      style: opaque
      field: "-"
    fields:
      status:
        type: string
        default: success
      value:
        type: map
        default: {}
      logLines:
        type: list
        default: []

routes:
  # The one success case this Recipe declares, and it is documented rather
  # than observed -- see the header. selects_body picks it out only when the
  # request names the function path Convex's own docs example uses.
  - method: POST
    path: /api/query
    matches_header:
      Content-Type: application/json
    selects_body: messages
    resource: function_result
    operation: create
    status: 200

  # Content-Type present, body valid JSON, but the required "path" field is
  # missing -- struck live against a fixture object naming a function that
  # cannot exist, so this route is picked by mentioning "foo" rather than by
  # being empty (an empty {} would also mean "no path field", but this
  # Recipe uses it to demonstrate the deployment/function-miss case
  # instead -- see the next route and the header for why the two need to
  # stay distinguishable at all).
  - method: POST
    path: /api/query
    matches_header:
      Content-Type: application/json
    selects_body: foo
    error: unknown_route

  # Same header, same valid JSON, a "path" field present -- and the function
  # it names cannot exist because nothing about this Recipe's fixture data
  # does. Struck live: 404, empty body, indistinguishable from a path this
  # host never registered at all. See the header for why that indistinguish-
  # ability is the finding rather than a shortcut this Recipe is taking.
  - method: POST
    path: /api/query
    matches_header:
      Content-Type: application/json
    error: bad_json_body

  # No Content-Type at all -- the check this host runs before it even tries
  # to parse JSON.
  - method: POST
    path: /api/query
    error: missing_content_type

  - method: GET
    path: /api/query
    error: bad_query_args

  # A method nothing here answers to, on a path that otherwise does. Real
  # 405, real Allow header, struck live.
  - method: PATCH
    path: /api/query
    error: method_not_allowed

errors:
  # {"code":"BadJsonBody","message":"Failed to deserialize the JSON body
  # into the target type: missing field `path` at line 1 column 2"} --
  # struck live, byte for byte.
  bad_json_body:
    status: 400
    code: BadJsonBody
    message: "Failed to deserialize the JSON body into the target type: missing field `path` at line 1 column 2"

  # {"code":"BadJsonBody","message":"Expected request with `Content-Type:
  # application/json`"} -- struck live, the check that runs before the one
  # above.
  missing_content_type:
    status: 400
    code: BadJsonBody
    message: "Expected request with `Content-Type: application/json`"

  # {"code":"BadQueryArgs","message":"Failed to deserialize query string:
  # missing field `path`"} -- struck live. GET is a genuine second transport
  # for this route, not a mistake this host merely tolerates: it fails on
  # its own terms rather than with a 405.
  bad_query_args:
    status: 400
    code: BadQueryArgs
    message: "Failed to deserialize query string: missing field `path`"

  # A real 405 with a real Allow header, struck live. The body itself was
  # zero bytes -- Cauldron's own built-in wording stands in for it, the same
  # trade appsignal/recipe.yaml in this collection makes for its own
  # zero-byte failures, and no case below claims the message is observed.
  method_not_allowed:
    status: 405
    style: text
    headers:
      allow: "GET,HEAD,POST"

  # A bare 404, zero bytes, struck live both for a path this host never
  # registered and for a well-formed request naming a function that cannot
  # exist -- the same body either way. See method_not_allowed for why the
  # message here is a stand-in rather than a quotation.
  unknown_route:
    status: 404
    style: text

fixtures:
  empty: {}

conformance:
  - name: a nonexistent deployment still resolves and still answers -- DNS never fails
    # cauldron-fixture-does-not-exist-00000.convex.cloud, checked live: the
    # Cloudflare wildcard resolves any name in this position, and usher
    # answers a bare 404 for the function path this case names, exactly as
    # it would for a path this host never registered at all. No
    # Authorization header was sent for this case or any other in this
    # file -- none was ever required. See the header for api.convex.dev,
    # where that stops being true.
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/api/query
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/query
      headers:
        Content-Type: application/json
      json:
        path: "foo:bar"
        args: {}
        format: json
    expect:
      status: 404

  - name: an unmatched path gets the identical bare 404
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/no-such-route
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /no-such-route
    expect:
      status: 404

  - name: a malformed body fails on shape before deployment identity is ever asked about
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/api/query
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/query
      headers:
        Content-Type: application/json
      json: {}
    expect:
      status: 400
      body:
        code: BadJsonBody
        message: "Failed to deserialize the JSON body into the target type: missing field `path` at line 1 column 2"

  - name: no Content-Type at all fails a check that runs even earlier
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/api/query
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/query
    expect:
      status: 400
      body:
        code: BadJsonBody
        message: "Expected request with `Content-Type: application/json`"

  - name: GET is a genuine second transport, and fails on its own terms rather than with a 405
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/api/query
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/query
    expect:
      status: 400
      body:
        code: BadQueryArgs
        message: "Failed to deserialize query string: missing field `path`"

  - name: a method nothing answers to gets a real 405 with a real Allow header
    source: https://cauldron-fixture-does-not-exist-00000.convex.cloud/api/query
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/query
    expect:
      status: 405
      headers:
        allow: "GET,HEAD,POST"

  - name: a real function call's success envelope, documented rather than observed
    # No account, deployment or function exists for this Recipe to call, so
    # this case cannot carry a verified date -- see the header. The exact
    # request below, run against the same nonexistent deployment every case
    # above used, would not reach this response: it would 404, the same as
    # every other well-formed request this file struck against a function
    # that cannot exist. Cauldron's own emulator answers what this Recipe
    # declares rather than what the live sandbox fixture would actually do,
    # which is the gap this comment exists to name rather than paper over.
    source: https://docs.convex.dev/http-api/
    fixture: empty
    request:
      method: POST
      path: /api/query
      headers:
        Content-Type: application/json
      json:
        path: "messages:list"
        args: {}
        format: json
    expect:
      status: 200
      body:
        status: success
        value: {}
        logLines: []
