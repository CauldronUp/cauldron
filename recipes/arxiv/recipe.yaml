# arXiv Recipe for Cauldron
#
# arXiv's classic API answers Atom XML on every route it has, success or
# failure alike -- there is no format parameter, no Accept negotiation, and
# no JSON mode at all. The classic API predates arXiv's newer JSON-based
# initiatives entirely, and content negotiation makes no difference: Accept:
# application/json still comes back as application/atom+xml. A client
# calling .json() on any response here, success or failure, throws.
#
# A well-formed identifier nothing uses is a 200 with zero results. A
# malformed one is a 400.
#
#   GET /api/query?id_list=9999.99999   ->  200  0 results, empty feed
#   GET /api/query?id_list=notanid      ->  400  "incorrect id format for notanid"
#
# The first is a syntactically valid arXiv identifier that names no paper; the
# second is not shaped like an identifier at all. A client checking "did this
# paper exist" by looking at the status code gets the wrong signal for the
# common case -- a typo'd but well-formed id -- and the right one only for the
# rarer case of sending garbage.
#
# **And an unrecognised search field is not rejected. It is swallowed.**
#
#   GET /api/query?search_query=zzzzz:electron
#   -> 200, and the echoed query string reads search_query=all:zzzzz:electron
#
# "zzzzz" is not a field arXiv knows about -- ti, au, abs, cat, all and a
# handful of others are the whole list -- so the parser falls back to treating
# the entire string, prefix included, as a literal phrase under the all: field.
# The request succeeds, answers zero results, and nothing anywhere says the
# field name was never recognised. A typo'd field prefix and a real search
# that happens to match nothing are the same response.
#
# Written against the live API rather than a document: every case below was
# checked against export.arxiv.org on the date in its verified field.
#
# Two more the Recipe pins:
#
#   1. Paging past the end of a result set does not answer with an empty page.
#      It answers 500. ?start=200000 against a 185,582-row search -- and
#      ?start set to the row count exactly -- both fail the same way a page
#      too large does: ?max_results=20000 also 500s, though ?max_results=5000
#      succeeds. All three land on the identical generic body, "the server
#      encountered an internal error ... overloaded or ... an error in the
#      application", which is indistinguishable from a real outage and gives
#      no indication that a page size or an offset was the actual cause. A
#      paging loop that walks to the end of a large result set, or a caller
#      who asks for more than a few thousand records in one call, gets a 500
#      rather than a clean boundary answer.
#   2. Combining search_query and id_list does not let one override the
#      other. It intersects them: id_list=1706.03762 alongside
#      search_query=all:banana answers zero results, for a paper that exists
#      and is perfectly fetchable on its own. A client that adds id_list to an
#      existing search thinking it narrows to "these ids from this search, or
#      failing that, these ids" gets neither -- it gets the empty set the
#      moment the two disagree.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The result counts move. totalResults for search_query=all:electron read
#     185582 on the date below and climbs by the hour as new papers are
#     submitted; what the case pins is the shape and the fact that the field
#     is a live count of the whole matching set, not the number pinned itself.
#   - Free-text search is not modelled. There is no fixture behind a Lucene
#     query the way there is behind a books table, so only the exact
#     query strings below are recognised; anything else served through
#     `cauldron serve` answers Cauldron's own "no such route" rather than a
#     result set, which is honest about the gap rather than inventing a
#     result for a search this Recipe never ran.
#   - There is no route modelling a bare GET with neither parameter. Whether
#     that should 400 depends on both search_query and id_list being absent,
#     and this format's query matcher can only test a parameter's value, not
#     its absence, so the one shape it can express and prove is
#     search_query sent empty -- confirmed byte-for-byte identical to omitting
#     the parameter outright, and recorded as the case below.
#   - The advertised host, http://export.arxiv.org, 301-redirects to https on
#     every request. Not modelled: a route in this format has a path and a
#     method, and no way to be told apart by scheme.
#   - Every request in the classic API's own documentation asks for a
#     descriptive User-Agent, and unlike MusicBrainz's Recipe in this same
#     collection, arXiv does not enforce it: a bare curl/8.x default and an
#     explicitly empty header both answered 200 during this research.

recipe: arxiv
capability: docs
version: 0.1.0

upstream:
  api: classic
  provider: arxiv
  docs: https://info.arxiv.org/help/api/user-manual.html

auth:
  # Public. The classic API's own documentation asks for a descriptive
  # User-Agent and does not enforce one -- unlike MusicBrainz, whose Recipe
  # in this collection really does 403 a request that omits it.
  scheme: none

responses:
  # Every failure this Recipe describes answers in this shape. Successes
  # are raw Atom bytes recorded directly on their routes -- see the header.
  error:
    style: text

routes:
  # A fetch by id_list, unversioned, resolves to the current version: the
  # request named 1706.03762 and the entry that came back is 1706.03762v7.
  - method: GET
    path: /api/query
    matches_query:
      id_list: "1706.03762"
    raw:
      content_type: application/atom+xml; charset=utf-8
      text: |
        <?xml version='1.0' encoding='UTF-8'?>
        <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
          <id>https://arxiv.org/api/zUwBFJ+vAUSpXAR7QFveSY/bZos</id>
          <title>arXiv Query: search_query=&amp;id_list=1706.03762&amp;start=0&amp;max_results=10</title>
          <updated>2026-09-01T00:31:37Z</updated>
          <link href="https://arxiv.org/api/query?search_query=&amp;start=0&amp;max_results=10&amp;id_list=1706.03762" type="application/atom+xml"/>
          <opensearch:itemsPerPage>10</opensearch:itemsPerPage>
          <opensearch:totalResults>1</opensearch:totalResults>
          <opensearch:startIndex>0</opensearch:startIndex>
          <entry>
            <id>http://arxiv.org/abs/1706.03762v7</id>
            <title>Attention Is All You Need</title>
            <updated>2023-08-02T00:41:18Z</updated>
            <link href="https://arxiv.org/abs/1706.03762v7" rel="alternate" type="text/html"/>
            <link href="https://arxiv.org/pdf/1706.03762v7" rel="related" type="application/pdf" title="pdf"/>
            <summary>The dominant sequence transduction models are based on complex recurrent or convolutional neural networks in an encoder-decoder configuration. The best performing models also connect the encoder and decoder through an attention mechanism. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms, dispensing with recurrence and convolutions entirely. Experiments on two machine translation tasks show these models to be superior in quality while being more parallelizable and requiring significantly less time to train. Our model achieves 28.4 BLEU on the WMT 2014 English-to-German translation task, improving over the existing best results, including ensembles by over 2 BLEU. On the WMT 2014 English-to-French translation task, our model establishes a new single-model state-of-the-art BLEU score of 41.8 after training for 3.5 days on eight GPUs, a small fraction of the training costs of the best models from the literature. We show that the Transformer generalizes well to other tasks by applying it successfully to English constituency parsing both with large and limited training data.</summary>
            <category term="cs.CL" scheme="http://arxiv.org/schemas/atom"/>
            <category term="cs.LG" scheme="http://arxiv.org/schemas/atom"/>
            <published>2017-06-12T17:57:34Z</published>
            <arxiv:comment>15 pages, 5 figures</arxiv:comment>
            <arxiv:primary_category term="cs.CL"/>
            <author>
              <name>Ashish Vaswani</name>
            </author>
            <author>
              <name>Noam Shazeer</name>
            </author>
            <author>
              <name>Niki Parmar</name>
            </author>
            <author>
              <name>Jakob Uszkoreit</name>
            </author>
            <author>
              <name>Llion Jones</name>
            </author>
            <author>
              <name>Aidan N. Gomez</name>
            </author>
            <author>
              <name>Lukasz Kaiser</name>
            </author>
            <author>
              <name>Illia Polosukhin</name>
            </author>
          </entry>
        </feed>
  # A search with results -- two entries of 185,582. The first carries
  # its abstract's original leading whitespace; the second does not.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron"
      max_results: "2"
    raw:
      content_type: application/atom+xml; charset=utf-8
      text: |
        <?xml version='1.0' encoding='UTF-8'?>
        <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
          <id>https://arxiv.org/api/dcXCKtYUYdD3VKb/I1GDXjTZxR0</id>
          <title>arXiv Query: search_query=all:electron&amp;id_list=&amp;start=0&amp;max_results=2</title>
          <updated>2026-09-01T01:10:36Z</updated>
          <link href="https://arxiv.org/api/query?search_query=all:electron&amp;start=0&amp;max_results=2&amp;id_list=" type="application/atom+xml"/>
          <opensearch:itemsPerPage>2</opensearch:itemsPerPage>
          <opensearch:totalResults>185582</opensearch:totalResults>
          <opensearch:startIndex>0</opensearch:startIndex>
          <entry>
            <id>http://arxiv.org/abs/cond-mat/0011267v1</id>
            <title>The electronic structure of cuprates from high energy spectroscopy</title>
            <updated>2000-11-15T16:19:15Z</updated>
            <link href="https://arxiv.org/abs/cond-mat/0011267v1" rel="alternate" type="text/html"/>
            <link href="https://arxiv.org/pdf/cond-mat/0011267v1" rel="related" type="application/pdf" title="pdf"/>
            <summary>  We report studies of the electronic structure and elementary excitations of doped and undoped cuprate chains, ladders and planes. Using high energy spectroscopies such as x-ray absorption, core level photoemission and angle resolved photoemission spectroscopy, important information regarding the charge distribution and hole dynamics can be obtained. The comparison of the experimental data with suitable theoretical models sets constraints on the parameters entering into the model calculations, and offers insight into the important physical quantities governing the electronic structure of these materials. Recurring themes include the importance of the dimensionality of the Cu-O network (1D-&gt;2D) and the crucial role played by the spin-background in determining the dynamics of low-lying excitations in these strongly correlated systems.</summary>
            <category term="cond-mat.supr-con" scheme="http://arxiv.org/schemas/atom"/>
            <category term="cond-mat.str-el" scheme="http://arxiv.org/schemas/atom"/>
            <published>2000-11-15T16:19:15Z</published>
            <arxiv:comment>J. Electron Spec. Relat. Phenom.: special issue on electron correlation, in press</arxiv:comment>
            <arxiv:primary_category term="cond-mat.supr-con"/>
            <arxiv:journal_ref>J. Electron Spectr. Relat. Phenom. 117-118, 203 (2001)</arxiv:journal_ref>
            <author>
              <name>Mark S. Golden</name>
            </author>
            <author>
              <name>Christian Duerr</name>
            </author>
            <author>
              <name>Andreas Koitzsch</name>
            </author>
            <author>
              <name>Sibylle Legner</name>
            </author>
            <author>
              <name>Zhiwei Hu</name>
            </author>
            <author>
              <name>Sergey Borisenko</name>
            </author>
            <author>
              <name>Martin Knupfer</name>
            </author>
            <author>
              <name>Joerg Fink</name>
            </author>
          </entry>
          <entry>
            <id>http://arxiv.org/abs/cond-mat/0211289v1</id>
            <title>Surface effects on the electronic energy loss of charged particles entering a metal surface</title>
            <updated>2002-11-14T15:23:14Z</updated>
            <link href="https://arxiv.org/abs/cond-mat/0211289v1" rel="alternate" type="text/html"/>
            <link href="https://arxiv.org/pdf/cond-mat/0211289v1" rel="related" type="application/pdf" title="pdf"/>
            <summary>  Surface effects on the electronic energy loss of charged particles entering a metal surface are investigated within linear-response theory, in the framework of time-dependent density functional theory. Interesting phenomena occur in the loss spectra originated by the boundary (bregenzung) effect, which is as a consequence of the orthogonality of surface and bulk excitation modes. Our calculations indicate that the presence of a non-abrupt electron-density profile at the surface severely affects the nature of surface excitations, as deduced from comparison with simplified models.</summary>
            <category term="cond-mat.mtrl-sci" scheme="http://arxiv.org/schemas/atom"/>
            <published>2002-11-14T15:23:14Z</published>
            <arxiv:comment>7 pages, 3 figures, to appear in J. Electron Spectrosc</arxiv:comment>
            <arxiv:primary_category term="cond-mat.mtrl-sci"/>
            <arxiv:journal_ref>J. Electron Spectrosc. 129, 223 (2003)</arxiv:journal_ref>
            <author>
              <name>A. Garcia-Lekue</name>
            </author>
            <author>
              <name>J. M. Pitarke</name>
            </author>
          </entry>
        </feed>
  # A well-formed identifier nothing uses: 200, and a feed with no <entry>
  # in it at all, rather than a 404.
  - method: GET
    path: /api/query
    matches_query:
      id_list: "9999.99999"
    raw:
      content_type: application/atom+xml; charset=utf-8
      text: |
        <?xml version='1.0' encoding='UTF-8'?>
        <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
          <id>https://arxiv.org/api/1lIon7zuEVy1/SVAukuOybHhGM8</id>
          <title>arXiv Query: search_query=&amp;id_list=9999.99999&amp;start=0&amp;max_results=10</title>
          <updated>2026-09-01T01:05:35Z</updated>
          <link href="https://arxiv.org/api/query?search_query=&amp;start=0&amp;max_results=10&amp;id_list=9999.99999" type="application/atom+xml"/>
          <opensearch:itemsPerPage>10</opensearch:itemsPerPage>
          <opensearch:totalResults>0</opensearch:totalResults>
          <opensearch:startIndex>0</opensearch:startIndex>
        </feed>
  # An id that is not shaped like one at all.
  - method: GET
    path: /api/query
    matches_query:
      id_list: "notanid"
    error: incorrect_id_format
  # zzzzz: is not a field arXiv parses. Rather than reject it, the whole
  # string -- prefix included -- becomes a literal phrase under all:, which
  # the echoed query string in the title gives away and nothing else does.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "zzzzz:electron"
    raw:
      content_type: application/atom+xml; charset=utf-8
      text: |
        <?xml version='1.0' encoding='UTF-8'?>
        <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
          <id>https://arxiv.org/api/gk9N6jvLr6wAX3c/59VXY+g9IRM</id>
          <title>arXiv Query: search_query=all:zzzzz:electron&amp;id_list=&amp;start=0&amp;max_results=10</title>
          <updated>2026-09-01T01:39:58Z</updated>
          <link href="https://arxiv.org/api/query?search_query=all:zzzzz:electron&amp;start=0&amp;max_results=10&amp;id_list=" type="application/atom+xml"/>
          <opensearch:itemsPerPage>10</opensearch:itemsPerPage>
          <opensearch:totalResults>0</opensearch:totalResults>
          <opensearch:startIndex>0</opensearch:startIndex>
        </feed>
  # Unbalanced parentheses.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron AND ("
    error: invalid_query_string
  # Neither parameter given a value.
  - method: GET
    path: /api/query
    matches_query:
      search_query: ""
    error: missing_query_or_id
  # 1706.03762 exists and answers on its own. Paired here with a
  # search_query it does not match, the combination is an intersection:
  # zero results, not the id_list falling back to answering by itself.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:banana"
      id_list: "1706.03762"
    raw:
      content_type: application/atom+xml; charset=utf-8
      text: |
        <?xml version='1.0' encoding='UTF-8'?>
        <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
          <id>https://arxiv.org/api/zudrAThW6/J562NxINOz0TFTe7A</id>
          <title>arXiv Query: search_query=all:banana&amp;id_list=1706.03762&amp;start=0&amp;max_results=10</title>
          <updated>2026-09-01T01:44:31Z</updated>
          <link href="https://arxiv.org/api/query?search_query=all:banana&amp;start=0&amp;max_results=10&amp;id_list=1706.03762" type="application/atom+xml"/>
          <opensearch:itemsPerPage>10</opensearch:itemsPerPage>
          <opensearch:totalResults>0</opensearch:totalResults>
          <opensearch:startIndex>0</opensearch:startIndex>
        </feed>
  # A negative start.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron"
      start: "-1"
    error: start_must_be_non_negative
  # A non-numeric max_results.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron"
      max_results: "abc"
    error: max_results_must_be_integer
  # A page larger than the classic API can serve.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron"
      max_results: "20000"
    error: internal_error_overloaded
  # Paging past the end of the result set -- the same failure, a different trigger.
  - method: GET
    path: /api/query
    matches_query:
      search_query: "all:electron"
      start: "200000"
      max_results: "2"
    error: internal_error_overloaded
  # A path the classic API does not expose.
  - method: GET
    path: /api/nosuchthing
    error: unknown_path

errors:
  # Not shaped like an identifier at all: 400, and the failure itself
  # arrives as a feed containing one <entry>, in the same envelope a real
  # result would use.
  incorrect_id_format:
    status: 400
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:39:43Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors#incorrect_id_format_for_notanid</id>
          <title>Error</title>
          <updated>2026-09-01T01:39:43Z</updated>
          <link href="https://arxiv.org/api/errors#incorrect_id_format_for_notanid" rel="alternate" type="text/html"/>
          <summary>incorrect id format for notanid</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # Unbalanced parentheses. The message quotes the malformed fragment back
  # verbatim, having already applied the all: fallback above to it.
  invalid_query_string:
    status: 400
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:39:44Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors</id>
          <title>Error</title>
          <updated>2026-09-01T01:39:44Z</updated>
          <link href="https://arxiv.org/api/errors" rel="alternate" type="text/html"/>
          <summary>Invalid query string: 'all:electron AND ('</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # search_query sent empty. Confirmed byte-for-byte identical to omitting
  # the parameter outright, which this format cannot match on to give it
  # its own route -- see the header.
  missing_query_or_id:
    status: 400
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:45:20Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors</id>
          <title>Error</title>
          <updated>2026-09-01T01:45:20Z</updated>
          <link href="https://arxiv.org/api/errors" rel="alternate" type="text/html"/>
          <summary>Either a search_query or id_list must be specified for the classic API.</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # A negative start is refused outright, in the same one-entry-feed shape
  # as every other classic-API error.
  start_must_be_non_negative:
    status: 400
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:40:11Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors#start_must_be_non-negative</id>
          <title>Error</title>
          <updated>2026-09-01T01:40:11Z</updated>
          <link href="https://arxiv.org/api/errors#start_must_be_non-negative" rel="alternate" type="text/html"/>
          <summary>start must be non-negative</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # A non-numeric max_results is refused the same way.
  max_results_must_be_integer:
    status: 400
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:40:13Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors#max_results_must_be_an_integer</id>
          <title>Error</title>
          <updated>2026-09-01T01:40:13Z</updated>
          <link href="https://arxiv.org/api/errors#max_results_must_be_an_integer" rel="alternate" type="text/html"/>
          <summary>max_results must be an integer</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # The generic failure a page too large, or a start past the end of the
  # result set, both land on -- see the header. Two routes below arm this
  # one error from two different requests, because the body they produce is
  # byte-for-byte the same.
  internal_error_overloaded:
    status: 500
    style: text
    headers:
      Content-Type: application/atom+xml; charset=utf-8
    message: |
      <?xml version='1.0' encoding='UTF-8'?>
      <feed xmlns:opensearch="http://a9.com/-/spec/opensearch/1.1/" xmlns:arxiv="http://arxiv.org/schemas/atom" xmlns="http://www.w3.org/2005/Atom">
        <id>https://arxiv.org/</id>
        <title>arXiv Search Results</title>
        <updated>2026-09-01T01:42:05Z</updated>
        <opensearch:itemsPerPage>1</opensearch:itemsPerPage>
        <opensearch:totalResults>1</opensearch:totalResults>
        <opensearch:startIndex>0</opensearch:startIndex>
        <entry>
          <id>https://arxiv.org/api/errors</id>
          <title>Error</title>
          <updated>2026-09-01T01:42:05Z</updated>
          <link href="https://arxiv.org/api/errors" rel="alternate" type="text/html"/>
          <summary>The server encountered an internal error and was unable to complete your request. Either the server is overloaded or there is an error in the application.</summary>
          <author>
            <name>arXiv api core</name>
          </author>
        </entry>
      </feed>

  # A path the classic API does not expose at all falls through to a bare
  # HTML template shared across statuses, on a plain Content-Type with no
  # charset -- a wholly different shape from every error above, all of
  # which are Atom XML on a Content-Type that declares one. A repeat of
  # this same request during this research once answered 503 with the
  # identical template and a title of 503 instead of 404, which looks like
  # an edge/CDN-level fluctuation rather than a second application state,
  # so it is noted here rather than pinned as a case.
  unknown_path:
    status: 404
    style: text
    headers:
      Content-Type: text/html
    message: |-
      <!DOCTYPE html>
      <html>
        <head>
          <meta charset="UTF-8">
          <title>404</title>
        </head>
        <body>
          404
        </body>
      </html>

fixtures:
  empty: {}

conformance:
  - name: a fetch by id_list resolves to the current version
    source: https://export.arxiv.org/api/query?id_list=1706.03762
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        id_list: "1706.03762"
    expect:
      status: 200
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # The request named 1706.03762, with no version. What came back is v7.
      body_matches: '<id>http://arxiv\.org/abs/1706\.03762v7</id>[\s\S]*<title>Attention Is All You Need</title>'

  - name: a search answers a live count and two shapes of abstract
    source: https://export.arxiv.org/api/query?search_query=all:electron&max_results=2
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron"
        max_results: "2"
    expect:
      status: 200
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # The count is a live figure -- see the header -- and the first
      # abstract carries its original leading whitespace, unlike the one in
      # the case above, which has none.
      body_matches: '<opensearch:itemsPerPage>2</opensearch:itemsPerPage>[\s\S]*<opensearch:totalResults>185582</opensearch:totalResults>[\s\S]*<summary>  We report studies'

  - name: a well-formed id nothing uses is 200 with zero results, not 404
    source: https://export.arxiv.org/api/query?id_list=9999.99999
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        id_list: "9999.99999"
    expect:
      status: 200
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # Zero results and no <entry> at all, on a 200 -- the same status a
      # real hit answers with.
      body_matches: '<opensearch:totalResults>0</opensearch:totalResults>'

  - name: an id that is not shaped like one at all is a 400
    source: https://export.arxiv.org/api/query?id_list=notanid
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        id_list: "notanid"
    expect:
      status: 400
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # The opposite of the case above: the id that fails is the one that
      # cannot even be looked up, not the one that names nothing.
      body_matches: '<id>https://arxiv\.org/api/errors#incorrect_id_format_for_notanid</id>[\s\S]*<summary>incorrect id format for notanid</summary>'

  - name: "an unrecognised field prefix is folded into all: rather than rejected"
    source: https://export.arxiv.org/api/query?search_query=zzzzz:electron
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "zzzzz:electron"
    expect:
      status: 200
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # zzzzz is not a field arXiv parses. Nothing says so directly; the
      # only evidence is the echoed query string, which shows the whole
      # string -- prefix included -- searched as a literal phrase under all:.
      body_matches: 'search_query=all:zzzzz:electron[\s\S]*<opensearch:totalResults>0</opensearch:totalResults>'

  - name: unbalanced parentheses are a 400 quoting the fragment back
    source: https://export.arxiv.org/api/query?search_query=all:electron+AND+(
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron AND ("
    expect:
      status: 400
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      body_matches: '<summary>Invalid query string: ''all:electron AND \(''</summary>'

  - name: search_query sent empty is a 400, byte-identical to omitting it
    source: https://export.arxiv.org/api/query?search_query=
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: ""
    expect:
      status: 400
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # This Recipe cannot route on a parameter's absence -- see the header --
      # so this is the empty-string trigger. A bare GET with neither
      # parameter, checked directly against the live API, answers the same
      # bytes.
      body_matches: '<summary>Either a search_query or id_list must be specified for the classic API\.</summary>'

  - name: id_list is narrowed by search_query rather than answering on its own
    source: https://export.arxiv.org/api/query?search_query=all:banana&id_list=1706.03762
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:banana"
        id_list: "1706.03762"
    expect:
      status: 200
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # 1706.03762 is a real, individually fetchable paper -- the first case
      # above. Paired with a search_query it does not match, the answer is
      # zero results: the two conditions intersect rather than either one
      # winning outright.
      body_matches: '<opensearch:totalResults>0</opensearch:totalResults>'

  - name: a negative start is refused outright
    source: https://export.arxiv.org/api/query?search_query=all:electron&start=-1
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron"
        start: "-1"
    expect:
      status: 400
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      body_matches: '<id>https://arxiv\.org/api/errors#start_must_be_non-negative</id>[\s\S]*<summary>start must be non-negative</summary>'

  - name: a non-numeric max_results is refused outright
    source: https://export.arxiv.org/api/query?search_query=all:electron&max_results=abc
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron"
        max_results: "abc"
    expect:
      status: 400
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      body_matches: '<id>https://arxiv\.org/api/errors#max_results_must_be_an_integer</id>[\s\S]*<summary>max_results must be an integer</summary>'

  - name: a page too large is a 500, not a clean boundary answer
    source: https://export.arxiv.org/api/query?search_query=all:electron&max_results=20000
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron"
        max_results: "20000"
    expect:
      status: 500
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # max_results=5000 against the same search_query succeeds; 20000 does
      # not. The boundary in between was not narrowed further -- see the
      # header -- because each attempt near it cost up to a minute before
      # answering or timing out.
      body_matches: '<summary>The server encountered an internal error and was unable to complete your request\. Either the server is overloaded or there is an error in the application\.</summary>'

  - name: paging past the end of the result set is the same 500
    source: https://export.arxiv.org/api/query?search_query=all:electron&start=200000&max_results=2
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/query
      query:
        search_query: "all:electron"
        start: "200000"
        max_results: "2"
    expect:
      status: 500
      headers:
        Content-Type: application/atom+xml; charset=utf-8
      # start=200000 is past the ~185,582 rows all:electron matched at the
      # time; start set to the row count exactly failed the identical way.
      # Byte-for-byte the same body as the oversized max_results above --
      # one failure, two triggers.
      body_matches: '<summary>The server encountered an internal error and was unable to complete your request\. Either the server is overloaded or there is an error in the application\.</summary>'

  - name: a path the classic API does not expose is a bare HTML template
    source: https://export.arxiv.org/api/nosuchthing
    verified: "2026-08-31"
    request:
      method: GET
      path: /api/nosuchthing
    expect:
      status: 404
      headers:
        Content-Type: text/html
      # A wholly different shape from every case above: no XML, no
      # declared charset, a template shared across statuses rather than a
      # body naming this one.
      body_matches: '<title>404</title>'
