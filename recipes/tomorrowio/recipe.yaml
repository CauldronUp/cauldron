# Tomorrow.io Recipe for Cauldron
#
# See weatherapi/recipe.yaml's header for the question this group of three
# Recipes -- WeatherAPI, Tomorrow.io and Visual Crossing -- was written to
# ask: what a forecast's age looks like on a commercial weather API, next to
# the free, governmental ones this collection already has (Open-Meteo,
# nationalweatherservice/recipe.yaml). Tomorrow.io's own answer is the
# cleanest of the three on the timestamp question and the murkiest of the
# three on the units question, and both are worth having precisely because
# they cut the opposite way from WeatherAPI's Recipe in this same group.
#
# **There is exactly one timestamp on this response, and it is genuinely,
# unambiguously UTC.** The Realtime Weather endpoint's own published example
# -- read from the OpenAPI document embedded in
# https://docs.tomorrow.io/reference/realtime-weather, operationId
# realtime-weather -- answers:
#
#   {
#       "data": {
#           "time": "2023-01-26T07:48:00Z",
#           "values": { "temperature": 1.88, "temperatureApparent": -0.69, ... }
#       },
#       "location": { "lat": 43.653480529785156, "lon": -79.3839340209961,
#                      "name": "Old Toronto, Toronto, Golden Horseshoe, Ontario, Canada",
#                      "type": "administrative" }
#   }
#
# data.time carries a trailing Z. No offset arithmetic, no bare local string
# the way WeatherAPI's last_updated is, no interval-with-a-duration the way
# the National Weather Service's validTimes is -- Date.parse on this string
# behaves the same way in every reader's timezone, which is not something
# this collection's weather Recipes have been able to say about a provider
# yet. But it is also the *only* timestamp anywhere in this document: there
# is no separate field for when the underlying model run happened, no
# generatedAt the way the National Weather Service's forecast carries beside
# its periods, nothing distinguishing "the instant this reading describes"
# from "the instant a client asked." A caller gets a clean UTC instant and no
# way to tell from it whether the number beside it is five seconds old or
# fifty minutes old -- the age this whole group of Recipes was written to
# find is not answered by the one clock this API shows a caller, because that
# clock has only one hand.
#
# **And the number beside it has no unit anywhere a caller can read.**
# temperature, windSpeed, pressureSurfaceLevel and visibility carry no _c/_f
# or _mph/_kph suffix the way WeatherAPI's fields do, and there is no
# separate units object the way Open-Meteo's hourly_units is. The one thing
# that does exist is a documented, optional units query parameter --
# "Unit system of the field values, either \"metric\" or \"imperial\"" -- and
# the response body never echoes which one produced the numbers in front of
# a caller. That is the assumed-from-a-request-parameter case this
# collection's header comments keep asking after, stated as plainly as a
# provider is likely to state it: send units=imperial instead of
# units=metric (or omit it and get whatever this endpoint's own undocumented
# default is -- its schema lists no default at all, unlike the POST
# /timelines body a few hundred lines later in the same OpenAPI document,
# which does declare one, "metric") and the field named "temperature" holds a
# different number, under the identical key, with nothing in the payload
# saying so. The one worked example this Recipe could find is internally
# consistent with the metric system -- 984.57 for pressureSurfaceLevel is
# hectopascal-scale, not the roughly-29 inHg an imperial reading would show,
# and 1.88 for a Toronto morning in late January reads as Celsius rather than
# an implausible 1.88 °F -- which is an inference from the numbers
# themselves, not a label the response carries; nothing in the document
# states which system generated them.
#
# **The credential travels in the query string, the third data point for the
# question here/recipe.yaml and what3words/recipe.yaml's headers name for
# HERE and what3words, and weatherapi/recipe.yaml's header names for its own
# provider in this group.** Struck live, with no account and no key, against
# api.tomorrow.io:
#
#   GET /v4/weather/realtime?location=42.3478,-71.0466                     -> 401 {"code":401001,"type":"Invalid Auth","message":"The method requires authentication but it was not presented or is invalid."}
#   GET /v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345  -> 401, byte-identical
#   GET /v4/weather/realtime?location=42.3478,-71.0466&apikey=              -> 401, byte-identical
#   GET /v4/weather/realtime (apikey: junkkey12345 as a HEADER, not a query parameter) -> 401, byte-identical
#   GET /v4/weather/realtime (no location, no key)                          -> 401, byte-identical
#
# One sentence, for all five. Where WeatherAPI's Recipe in this group finds a
# provider that draws a clean, numbered line between absent and wrong,
# Tomorrow.io is the collapse the brief for this whole exercise warned is the
# common case -- and it is worth having exactly because the message says so
# about itself: "was not presented or is invalid" is the vendor's own words
# for declining to tell the two apart, not an inference this Recipe is
# making from the outside. The header-instead-of-query probe above matters
# for a structural reason rather than a rhetorical one: this API's own
# OpenAPI document declares apikey's transport explicitly --
# securitySchemes.sec0 is {"type":"apiKey","in":"query","name":"apikey"} --
# so sending it as a header is not a second scheme this Recipe is choosing
# not to wire, the way what3words' X-Api-Key alternative is; it is a
# transport the provider's own spec never offered, and the live host
# confirms that by treating it exactly as absent. No malformed_error and no
# rejected_error are declared: every verdict this Recipe could produce
# collapses into the one generic sentence, which is the honest default this
# format falls back to on its own.
#
# **Routing and method both outrank the credential, and a wrong method is
# not a distinct failure at all -- it is the identical routing-miss a wrong
# path gets.** Struck live, four ways, all with no key:
#
#   GET   /v4/nosuchroute                                                   -> 404 {"message":"no Route matched with those values","request_id":"..."}
#   GET   /v4/nosuchroute?apikey=junkkey12345                                -> 404, identical message, credential present or not
#   PATCH /v4/weather/realtime?location=42.3478,-71.0466                     -> 404, identical message
#   PATCH /v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345  -> 404, identical message, credential present or not
#
# turso/recipe.yaml in this collection already names the shape of this
# finding for a different host -- "there is no 405 anywhere on this host
# that was findable without a credential: a mistyped path and a mistyped
# method are the same failure" -- and Tomorrow.io is the same shape again,
# down to the credential being irrelevant in both directions: PATCH with no
# key and PATCH with a wrong key answer the identical 404, which is what
# proves the router never consults the credential for a method it was not
# going to accept regardless. auth.after_routing carries the ordering, and
# both the unrouted-path and wrong-method errors below reuse it: this
# Recipe's method_not_allowed is not a typo for 405, the way Turso's is not
# either -- it is what the wire actually sends. The request_id in the real
# body is not reproduced: it is a fresh hex string on every call this Recipe
# struck, and pinning one would be inventing a value a real client can never
# rely on holding still.
#
# **Two error envelopes live on the one host, and neither carries the other's
# fields.** The credential failure is {"code": 401001, "type": "Invalid
# Auth", "message": "..."}; the routing failure is {"message": "...",
# "request_id": "..."} -- no code, no type, and an id the credential failure
# never carries either. This Recipe's own error style (flat,
# type_field: "-" recipe-wide) needs the authentication_error entry's own
# `fields: {type: Invalid Auth}` to put the type key back for that one
# failure alone, because Cauldron's flat style cannot vary type_field by
# error the way it already lets code_field and message_field vary. See
# internal/recipe/auth.go and internal/runtime/errors.go for why: Style, Key,
# MessageField and CodeField are all per-error overridable, and TypeField is
# not, so the escape hatch every Recipe author reaches for when a category
# key needs to appear on some failures and not others is the same declared
# `fields:` map nationalweatherservice/recipe.yaml and what3words/recipe.yaml
# both already use for extra keys a style's own knobs cannot name.
#
# **No Cache-Control, no ETag, no Age -- just Cloudflare's own signal that
# nothing was served from a cache.** Every response this Recipe struck
# carries cf-cache-status: DYNAMIC and nothing else caching-shaped at all --
# a different mechanism from WeatherAPI's Recipe in this group, which finds
# an explicit Cache-Control: no-cache on every data response next to a
# static page on the same host that caches normally. Tomorrow.io does not
# say "do not cache this" in so many words; it simply never says anything
# that would let an intermediary decide to. Either way a caller learns
# nothing about how long an answer stays true, and neither vendor documents
# a refresh cadence for how often the underlying data changes.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every 401 and every 404 below are struck live and carry a
#     verified date; the one 200 case is Tomorrow.io's own documented
#     example and carries none.
#   - The 200 case's units are inferred from the numbers rather than labelled
#     by the response -- see the header. No imperial-unit worked example
#     exists anywhere this Recipe could find, so units=imperial is not
#     modelled at all: producing a second fixture would mean inventing the
#     Fahrenheit and mph figures nobody has published.
#   - The 404 body's request_id is not reproduced. It is a random hex string
#     on the live host and no conformance case below asserts a value for it.
#   - Of data.values' documented fields this Recipe declares nineteen: the
#     temperature, wind, pressure, cloud, precipitation-type-intensity and UV
#     fields the one worked example actually populates. hailProbability and
#     hailSize appear in the /weather/forecast minutely example this Recipe
#     read alongside this one but not in realtime's own example, and are not
#     declared here for that reason.
#   - Only GET /v4/weather/realtime is modelled. /v4/weather/forecast (the
#     hourly/daily counterpart, whose own worked example this Recipe also
#     read while confirming the units and timestamp findings above) and the
#     POST /v4/timelines endpoint -- documented, in the same OpenAPI file, as
#     the more general product these two GET routes are convenience wrappers
#     over -- are both left out. /timelines takes a JSON body rather than
#     query parameters and is a different shape of route than anything this
#     Recipe's probes exercised without a key.
#   - No upstream.spec_hash is recorded even though upstream.spec is: the
#     document is served embedded inside a documentation page's SSR props
#     rather than at a stable, independently fetchable URL, and fingerprinting
#     a blob extracted from HTML would be fingerprinting this Recipe's own
#     extraction rather than something a future run could re-derive the same
#     way.

recipe: tomorrowio
capability: infrastructure
version: 0.1.0

upstream:
  api: v4
  docs: https://docs.tomorrow.io/reference/realtime-weather

auth:
  # In the query string -- see the header, and here/recipe.yaml,
  # what3words/recipe.yaml and weatherapi/recipe.yaml for the rest of this
  # collection's comparison. Confirmed live: the identical credential sent as
  # a header instead is treated as though nothing were sent at all, which
  # matches this API's own OpenAPI security scheme (apiKey, in: query) rather
  # than a second transport this Recipe is choosing not to wire.
  scheme: query
  param: apikey
  keys:
    - cauldron_tomorrowio_fixture_key_0000000000000
  # The route and the method are both resolved before the credential is
  # looked at. Verified four ways with no key at all: an unrouted path 404s,
  # a wrong method on a real path 404s the same way, and neither answer
  # changes when a key -- right or wrong -- is added. See the header.
  after_routing: true
  # No rejected_error and no malformed_error: every verdict this Recipe could
  # produce collapses into the same sentence, which the live host's own
  # wording says explicitly ("was not presented or is invalid") rather than
  # this Recipe inferring the collapse from the outside. See the header.

responses:
  resource:
    style: bare
  error:
    # Flat at the top level, not nested under an "error" key. code_field and
    # type_field are both suppressed recipe-wide because the routing-miss
    # failure carries neither at all, and Cauldron's own built-in fallback
    # code for that failure would otherwise leak through even with no code:
    # set on the error entry below. The credential failure's own code and
    # type are put back with their own `fields:` entry -- see the header for
    # why CodeField and TypeField cannot vary per error the way Style, Key
    # and MessageField already do.
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  conditions:
    id:
      # location is never echoed under its own name -- location.name is a
      # resolved, geocoded string ("Old Toronto, Toronto, Golden Horseshoe,
      # Ontario, Canada" for a request that named neither "Old Toronto" nor
      # that hierarchy), so there is no field here that carries the value a
      # caller sent. See weatherapi/recipe.yaml's identical reasoning for
      # its own id.
      style: opaque
      field: "-"
    fields:
      # The one clock this response shows a caller -- see the header for
      # what it is not.
      time:
        type: datetime
        in: data
        as: time
      temperature:
        type: number
        in: data.values
        as: temperature
      temperatureApparent:
        type: number
        in: data.values
        as: temperatureApparent
      dewPoint:
        type: number
        in: data.values
        as: dewPoint
      humidity:
        type: integer
        in: data.values
        as: humidity
      windSpeed:
        type: number
        in: data.values
        as: windSpeed
      windGust:
        type: number
        in: data.values
        as: windGust
      windDirection:
        type: integer
        in: data.values
        as: windDirection
      pressureSurfaceLevel:
        type: number
        in: data.values
        as: pressureSurfaceLevel
      visibility:
        type: number
        in: data.values
        as: visibility
      weatherCode:
        type: integer
        in: data.values
        as: weatherCode
      cloudBase:
        type: number
        in: data.values
        as: cloudBase
      cloudCeiling:
        type: number
        in: data.values
        as: cloudCeiling
      cloudCover:
        type: integer
        in: data.values
        as: cloudCover
      precipitationProbability:
        type: integer
        in: data.values
        as: precipitationProbability
      freezingRainIntensity:
        type: integer
        in: data.values
        as: freezingRainIntensity
      rainIntensity:
        type: integer
        in: data.values
        as: rainIntensity
      sleetIntensity:
        type: integer
        in: data.values
        as: sleetIntensity
      snowIntensity:
        type: integer
        in: data.values
        as: snowIntensity
      uvIndex:
        type: integer
        in: data.values
        as: uvIndex
      uvHealthConcern:
        type: integer
        in: data.values
        as: uvHealthConcern
      location_lat:
        type: number
        in: location
        as: lat
      location_lon:
        type: number
        in: location
        as: lon
      location_name:
        type: string
        in: location
        as: name
      location_type:
        type: string
        in: location
        as: type

routes:
  - method: GET
    path: /v4/weather/realtime
    resource: conditions
    operation: get
    id_from: query:location

errors:
  # The one sentence every verdict this Recipe can produce collapses into.
  # See the header and the auth block above.
  authentication_error:
    status: 401
    message: "The method requires authentication but it was not presented or is invalid."
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      # Put back because code_field and type_field are both suppressed
      # recipe-wide -- see the header and the responses.error block above.
      code: 401001
      type: "Invalid Auth"

  # Overrides Cauldron's own built-in name so a routing miss gets the live
  # host's own wording. No code, no type: a different, thinner envelope from
  # the credential failure above -- see the header.
  unknown_route:
    status: 404
    message: "no Route matched with those values"
    headers:
      Content-Type: "application/json; charset=utf-8"

  # status: 404 here is not a typo for 405 -- see the header and
  # turso/recipe.yaml for the identical shape of finding on a different
  # host. A wrong method on a real path answers the same routing-miss body
  # an unrouted path gets, never a real 405, and the credential is never
  # examined either way.
  method_not_allowed:
    status: 404
    message: "no Route matched with those values"
    headers:
      Content-Type: "application/json; charset=utf-8"

fixtures:
  empty: {}

  # Tomorrow.io's own published example for GET /v4/weather/realtime --
  # quoted, not observed. See the header for why its numbers read as the
  # metric system despite nothing in the document labelling them that way.
  toronto:
    conditions:
      - id: toronto
        time: "2023-01-26T07:48:00Z"
        temperature: 1.88
        temperatureApparent: -0.69
        dewPoint: 0.88
        humidity: 96
        windSpeed: 2.38
        windGust: 3.38
        windDirection: 10
        pressureSurfaceLevel: 984.57
        visibility: 9.9
        weatherCode: 1001
        cloudBase: 0.07
        cloudCeiling: 0.07
        cloudCover: 100
        precipitationProbability: 0
        freezingRainIntensity: 0
        rainIntensity: 0
        sleetIntensity: 0
        snowIntensity: 0
        uvIndex: 0
        uvHealthConcern: 0
        location_lat: 43.653480529785156
        location_lon: -79.3839340209961
        location_name: "Old Toronto, Toronto, Golden Horseshoe, Ontario, Canada"
        location_type: administrative

conformance:
  - name: no credential at all gets the one sentence this API has
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime?location=42.3478,-71.0466
    expect:
      status: 401
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        code: 401001
        type: "Invalid Auth"
        message: "The method requires authentication but it was not presented or is invalid."

  - name: a key that is present and wrong gets the byte-identical sentence
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345
    expect:
      status: 401
      body:
        code: 401001
        message: "The method requires authentication but it was not presented or is invalid."

  - name: an explicitly empty key answers the same as no key at all
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466&apikey=
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime?location=42.3478,-71.0466&apikey=
    expect:
      status: 401
      body:
        code: 401001

  - name: the same credential sent as a header instead of a query parameter is not read at all
    # Live: this API's own security scheme names query as the only transport,
    # and the host confirms it -- see the header.
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime?location=42.3478,-71.0466
      headers:
        apikey: junkkey12345
    expect:
      status: 401
      body:
        code: 401001
        message: "The method requires authentication but it was not presented or is invalid."

  - name: a missing location parameter never gets a chance to matter either
    source: https://api.tomorrow.io/v4/weather/realtime
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime
    expect:
      status: 401
      body:
        code: 401001

  - name: an unrouted path answers before the key is examined
    source: https://api.tomorrow.io/v4/nosuchroute
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v4/nosuchroute
    expect:
      status: 404
      body:
        message: "no Route matched with those values"
      absent:
        - code
        - type

  - name: and a key changes nothing about that answer
    source: https://api.tomorrow.io/v4/nosuchroute?apikey=junkkey12345
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /v4/nosuchroute?apikey=junkkey12345
    expect:
      status: 404
      body:
        message: "no Route matched with those values"

  - name: a wrong method on a real path is the same routing miss, not a 405
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: PATCH
      path: /v4/weather/realtime?location=42.3478,-71.0466
    expect:
      status: 404
      body:
        message: "no Route matched with those values"
      absent:
        - code
        - type

  - name: and a key changes nothing about that answer either
    source: https://api.tomorrow.io/v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345
    verified: "2026-09-02"
    fixture: toronto
    request:
      method: PATCH
      path: /v4/weather/realtime?location=42.3478,-71.0466&apikey=junkkey12345
    expect:
      status: 404
      body:
        message: "no Route matched with those values"

  - name: an authenticated call answers one UTC instant and no units label anywhere
    # Tomorrow.io's own documented example for this endpoint -- see the
    # header for why its numbers read as metric despite nothing in the body
    # saying so.
    source: https://docs.tomorrow.io/reference/realtime-weather
    fixture: toronto
    request:
      method: GET
      path: /v4/weather/realtime?location=toronto&apikey=cauldron_tomorrowio_fixture_key_0000000000000
    expect:
      status: 200
      body:
        data.time: "2023-01-26T07:48:00Z"
        data.values.temperature: 1.88
        data.values.temperatureApparent: -0.69
        data.values.humidity: 96
        data.values.windSpeed: 2.38
        data.values.pressureSurfaceLevel: 984.57
        data.values.weatherCode: 1001
        location.lat: 43.653480529785156
        location.lon: -79.3839340209961
        location.name: "Old Toronto, Toronto, Golden Horseshoe, Ontario, Canada"
        location.type: administrative
      absent:
        - code
        - error
        - units

  # The names. This Recipe declares 14 field(s) on a conditions that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 14 name(s) that came back at the paths they came
  # back under.
  - name: "a conditions carries the field names this Recipe declares"
    source: "https://docs.tomorrow.io/reference/realtime-weather"
    fixture: toronto
    request:
      method: GET
      path: "/v4/weather/realtime"
      query:
        "location": "toronto"
        "apikey": "cauldron_tomorrowio_fixture_key_0000000000000"
    expect:
      status: 200
      body:
        "data.values.cloudBase": 0.07
        "data.values.cloudCeiling": 0.07
        "data.values.cloudCover": 100
        "data.values.dewPoint": 0.88
        "data.values.freezingRainIntensity": 0
        "data.values.precipitationProbability": 0
        "data.values.rainIntensity": 0
        "data.values.sleetIntensity": 0
        "data.values.snowIntensity": 0
        "data.values.uvHealthConcern": 0
        "data.values.uvIndex": 0
        "data.values.visibility": 9.9
        "data.values.windDirection": 10
        "data.values.windGust": 3.38

