# Kaleyra Recipe for Cauldron
#
# Kaleyra runs its messaging REST API on regional pods -- api.in.kaleyra.io
# for the India pod, which is the host every worked example in Kaleyra's own
# documentation uses, and this Recipe models that one. api.kaleyra.io (no
# region prefix) is a live, separate host answering the identical gateway
# shape for a routing failure (checked live, 2026-09-01, same body, same
# code, same status), which is evidence the two sit behind the same gateway
# family rather than proof they are the same pod; only api.in.kaleyra.io is
# declared below, because that is the host the send examples this Recipe's
# fixtures come from actually name.
#
# THE ORDERING: routing and method resolve before the credential is ever
# looked at, and a route that does not exist and a method a real route does
# not support are answered identically -- one shape, one status, neither of
# them 404 or 405. Checked live, 2026-09-01, all four combinations, with and
# without a credential:
#
#   GET  /v1/{sid}/messages                    -> 401 (a real, registered
#                                                  route; see below)
#   GET  /v1/{sid}/no-such-route                -> 400, no credential needed
#   PATCH /v1/{sid}/messages                    -> 400, no credential needed
#   PATCH /v1/{sid}/messages, with a credential  -> the identical 400
#
# The unrouted-path and wrong-method cases both answer
# {"code":"RBC618","message":"Sorry, the page you are looking for could not
# be found.","data":[],"error":{}} -- 400, not 404 and not 405, with no
# Allow header and no distinction between "this path was never registered"
# and "this path exists for a different method." A client cannot tell a
# typo in its own routing table from a legitimate method it should not have
# tried. auth.after_routing: true carries this, and the two conformance
# cases below send exactly what the live requests sent -- including the one
# that carries a credential anyway, to prove the credential made no
# difference to the outcome.
#
# THE CREDENTIAL ITSELF DOES NOT DISTINGUISH ABSENT FROM WRONG EITHER.
# Checked live: no api-key header at all and a well-formed junk one both
# answer the byte-identical body --
# {"code":"RBC001","message":"Incorrect SID or API key.","data":[],
# "error":{"error":"Incorrect SID or API key."}} -- which is itself worth
# noting for what it names: the sentence blames "SID or API key" together,
# because the account SID travels in the path (/v1/{sid}/messages) rather
# than as a separate credential, and a wrong SID and a wrong key are
# indistinguishable failures from the same one check.
#
# A GET ROUTE THIS RECIPE CANNOT DOCUMENT. GET /v1/{sid}/messages -- no
# path suffix, no message id, no query string -- answered 401 live rather
# than the 400 routing-miss every unregistered path and method gets, which
# means it IS a real, registered route on this gateway. Nothing in
# Kaleyra's own published reference (developers.kaleyra.io, its SMS API
# section, or the llms.txt index of every page on that site) documents what
# it returns; the only documented GET under /v1/{sid}/messages/ is
# /status, which requires a message_ids query parameter this bare path
# does not carry. This Recipe declares the route exactly as far as it was
# actually able to check it -- that the credential gate applies to it -- and
# no further, the same device Census's Recipe in this collection uses for
# a resource name it deliberately never declares either.
#
# THE FINDING THIS RECIPE EXISTS TO MAKE: a send answers with one parent id
# and a nested per-recipient array whose own ids are that parent id with a
# suffix appended, and asking about delivery status later renames the
# parent id yet again. Kaleyra's own worked example
# (developers.kaleyra.io/docs/send-your-first-sms), sending to ONE
# recipient:
#
#   {"id": "ee8aXXXX-XXXX-XXXX-XXXX-9b717XXXX30d", "sender": "KLRHXA",
#    "type": "DEFAULT", "body": "Hello! This is my first SMS.",
#    "createdDateTime": "2019-11-04 10:42:23+00:00", "totalCount": 1,
#    "data": [{"message_id": "ee8aXXXX-XXXX-XXXX-XXXX-9b717XXXX30d:1",
#              "recipient": "1XXXXXXXXXX"}],
#    "dlrurl": null, "error": {}}
#
# and Kaleyra's own worked bulk example -- the identical endpoint, a comma-
# joined "to" string rather than an array, per
# developers.kaleyra.io/docs/send-bulk-sms -- answers the same shape with
# more entries in "data", each one's message_id built the same way: the
# parent id, a colon, and that recipient's position in the send. Not an
# array of independent ids (Plivo's answer to this in the sibling SMS
# comparison), not a shared id with no per-recipient breakdown at all
# (Bandwidth's and Sinch's), and not a full per-recipient status object
# (Infobip's) -- a parent id, a derived child id per recipient, and NO
# status of any kind for either one at send time, on either the single or
# the bulk case, because they are the same endpoint. Finding out what
# happened means a second call, GET /v1/{sid}/messages/status?message_ids=
# -- and asking it about that child id gets back, per Kaleyra's own worked
# example (developers.kaleyra.io/docs/sms-status):
#
#   {"data": [{"campaign_id": "507XXXX-XXX-XXXX-XXXX-b8f6b452c04a:1",
#              "status": "Delivered", "status_details": "DELIVERED"}],
#    "error": {}}
#
# The same colon-suffixed id, under a THIRD name: message_id on the send,
# then still message_id as the query parameter the status call takes, and
# campaign_id on the way back out. A client that stored what it sent under
# the name Kaleyra gave it has to know that name does not survive the round
# trip -- the same shape of trap Bandwidth's Recipe documents for id
# becoming messageId and Sinch's for id becoming batch_id, a third time
# from a third provider.
#
# Kaleyra's own documented delivery-status vocabulary
# (developers.kaleyra.io/docs/sms-status-and-status-trace-codes) has three
# terminal states -- Delivered, Undelivered, NOT-SENT -- and two in-progress
# ones, SUBMITTED and "Sent - No DLR", each with its own long list of
# specific trace codes (DELIVRD, ENROUTE, and dozens of carrier- and
# account-level rejection reasons) explaining which terminal state a
# message actually reached and why.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The message_id-to-campaign_id rename above is not modelled as a
#     route. The child id is not a plain identifier this format's id
#     styles can mint -- it is the parent id plus a literal colon and an
#     integer position, and no id style here (prefixed, numeric, timestamp,
#     opaque, uuid, hex, digits) produces a value derived from another
#     field on the same record. Sinch's Recipe in this collection states
#     the identical kind of gap for its own recipient-level delivery report,
#     for the identical reason.
#   - The "data" array is declared on the resource, for the header's
#     finding, but is not in any route's `returns`: every entry in it would
#     need the derived child-id shape above, which cannot be minted
#     faithfully. dlrurl and error are the same kind of gap: always null
#     and always {} in every worked example this Recipe found, which is not
#     evidence of what either field would carry once populated.
#   - The bulk send (a comma-joined "to" string rather than an array) is
#     not modelled as a distinct route, because it is not a distinct
#     endpoint -- see the header. What differs is only the request body's
#     "to" value and the number of entries the (unmodelled) "data" array
#     would carry.
#   - No validation-error (400) case from the messaging endpoint itself is
#     declared. Kaleyra's published error-code table
#     (developers.kaleyra.io/docs/sms-error-codes) is confirmed to belong
#     to a different, older HTTP GET/XML-era API by its own E-series
#     numbering and its own documented top-level status table (200/202/400/
#     500 with no RBC-prefixed codes anywhere in it) -- neither matches
#     what this Recipe's own live probes of the REST JSON gateway actually
#     returned (RBC001, RBC618), so those E-codes are not declared here as
#     if they belonged to this endpoint.
#   - No rate_limit error is declared. No 429 was seen on any live probe,
#     and Kaleyra's own SMS error-code table -- even setting aside the gap
#     above -- names no rate-limit-specific code.
#   - No upstream.spec is recorded. developers.kaleyra.io is a ReadMe-hosted
#     portal; no publicly fetchable OpenAPI document was found at a stable
#     URL for the messaging API specifically.
#
# The SID and key below are fixtures and belong to no account.

recipe: kaleyra
capability: sms
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.kaleyra.io/docs/sms-api-overview

auth:
  # A raw header value, checked before routing -- see the header for both
  # findings. Absent and wrong collapse to the identical body, so neither
  # absent_error nor rejected_error is set.
  scheme: header
  header: api-key
  keys:
    - cauldron00000000kaleyraapikey0000
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code

resources:
  message:
    collection: messages
    id:
      style: uuid
    fields:
      sid:
        type: string
        in: "-"
      sender:
        type: string
      # DEFAULT in every worked example this Recipe found, regardless of
      # the request's own "type" (OTP/MKT/TXN/TXND) -- see the header's
      # send-vs-response mismatch. Cauldron does not compute this either;
      # it is a fixed default, faithful to the shape and not to the logic.
      type:
        type: string
        default: DEFAULT
      body:
        type: string
      # Kaleyra's own format, not RFC 3339: "2019-11-04 10:42:23+00:00" --
      # a space where RFC 3339 requires "T". The identical gap Plivo's
      # Recipe in this collection states for the same reason, and this
      # field travels as a plain, uninterpreted string for it. Not echoed
      # from any request field, so it carries Kaleyra's own documented
      # example value as a fixed default -- faithful to the shape, not to
      # the clock.
      createdDateTime:
        type: string
        default: "2019-11-04 10:42:23+00:00"
      totalCount:
        type: integer
        default: 1
      # Declared for the header's finding; not returned by any route below.
      # See the fidelity gaps.
      data:
        type: list
        in: "-"
      dlrurl:
        type: string
        in: "-"
      error:
        type: map
        in: "-"

routes:
  - method: POST
    path: /v1/{sid}/messages
    resource: message
    operation: create
    scope:
      - sid
    returns:
      - id
      - sender
      - type
      - body
      - createdDateTime
      - totalCount

  # A real, credential-gated route this Recipe cannot document further --
  # see the header. Declared with no resource, the same device Census's
  # Recipe in this collection uses for a name it deliberately never
  # declares either.
  - method: GET
    path: /v1/{sid}/messages
    error: authentication_error

errors:
  # Struck live four separate ways -- no header, and a well-formed junk
  # key -- and identical every time. Names both the SID and the key because
  # the SID travels in the path rather than as a separate credential; see
  # the header.
  authentication_error:
    status: 401
    code: RBC001
    message: "Incorrect SID or API key."
    fields:
      data: []
      error:
        error: "Incorrect SID or API key."

  # What routing itself answers, for a path this Recipe never registered
  # and for a method a real route does not support alike -- 400, not 404
  # and not 405, with no credential examined either way. See the header.
  unknown_route:
    status: 400
    code: RBC618
    message: "Sorry, the page you are looking for could not be found."
    fields:
      data: []
      error: {}

  method_not_allowed:
    status: 400
    code: RBC618
    message: "Sorry, the page you are looking for could not be found."
    fields:
      data: []
      error: {}

fixtures:
  empty: {}

# Four cases are struck live against api.in.kaleyra.io, 2026-09-01, with no
# account of any kind. The send case is read from Kaleyra's own published
# worked example, and carries no verified date, because reaching a genuine
# 200 needs a real SID and key this Recipe does not have.
conformance:
  - name: no credential and a wrong one answer the identical body
    source: https://api.in.kaleyra.io/v1/HXAP16XXXXXX97IN/messages
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/HXAP16XXXXXX97IN/messages
    expect:
      status: 401
      body:
        code: RBC001
        message: "Incorrect SID or API key."

  - name: and so does a well-formed junk key
    source: https://api.in.kaleyra.io/v1/HXAP16XXXXXX97IN/messages
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/HXAP16XXXXXX97IN/messages
      headers:
        api-key: junkkeyjunkkeyjunkkeyjunkkey0000
    expect:
      status: 401
      body:
        code: RBC001
        message: "Incorrect SID or API key."

  - name: a path this Recipe never registered is a 400, not a 404, with no credential examined
    source: https://api.in.kaleyra.io/v1/HXAP16XXXXXX97IN/no-such-route
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /v1/HXAP16XXXXXX97IN/no-such-route
    expect:
      status: 400
      body:
        code: RBC618
        message: "Sorry, the page you are looking for could not be found."
      absent:
        - error.error

  - name: and so is a wrong method on a route that does exist, credential or no credential
    # Struck both ways live: with a credential attached, to prove routing
    # answers first regardless, and the byte-identical shape either way.
    source: https://api.in.kaleyra.io/v1/HXAP16XXXXXX97IN/messages
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /v1/HXAP16XXXXXX97IN/messages
      headers:
        api-key: junkkeyjunkkeyjunkkeyjunkkey0000
    expect:
      status: 400
      body:
        code: RBC618
        message: "Sorry, the page you are looking for could not be found."

  - name: a send answers a parent id, and no status of any kind
    source: https://developers.kaleyra.io/docs/send-your-first-sms
    fixture: empty
    request:
      method: POST
      path: /v1/HXAP16XXXXXX97IN/messages
      headers:
        api-key: cauldron00000000kaleyraapikey0000
      json:
        to: "+91XXXXXXXXXX"
        sender: KLRHXA
        body: "Hello! This is my first SMS."
    expect:
      status: 200
      body:
        sender: KLRHXA
        type: DEFAULT
        body: "Hello! This is my first SMS."
        createdDateTime: "2019-11-04 10:42:23+00:00"
        totalCount: 1
      matches:
        id: '^[0-9a-f-]{36}$'
      # No status, ever, on the send response itself -- see the header. The
      # per-recipient "data" array this endpoint really does answer with is
      # not modelled at all; see the fidelity gaps.
      absent:
        - status
        - delivered
        - data
