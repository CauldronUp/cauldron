# Omnisend Recipe for Cauldron
#
# Third of a group of three email-marketing platforms closing the question
# recipes/buttondown/recipe.yaml opened and recipes/kit/recipe.yaml,
# recipes/constantcontact/recipe.yaml (this same batch) and
# recipes/drip/recipe.yaml (this same batch) each answered differently:
# is a contact a person or a subscription, and can an integration ever
# move one back to subscribed without their asking? Omnisend's answer to
# the second half is the starkest yes of the four -- its own documentation
# names the exact mechanism in one sentence and attaches no warning to it
# at all -- and its answer to the question this provider was specifically
# picked for (is a contact a customer, or two records) is a clean, verified
# one: one record, always.
#
# ## A contact and a customer are the same record
#
# There is no `/customers` resource anywhere on this API. E-commerce shows
# up as *properties on the contact* -- `customerLifecycleStage`,
# `averageOrderValue`, `totalSpent` are documented segment-filter
# properties on the `contact` entity (api-docs.omnisend.com's own
# segmentation reference), not fields on a linked second object -- and as
# *events* -- "placed order", keyed to a contact by its own identifiers,
# arriving through the same `POST /events` surface as any other behavioural
# signal, with an explicit warning attached: sending a batch of these
# "could result in duplicate messages being sent to customers" if an
# automation is armed, language that treats "customer" as a word for what
# a contact is doing, not a second kind of record it might also be. Struck
# live and verified below: `GET /api/customers` answers the identical 404
# an entirely invented path gets, with a valid-shaped credential attached
# and the resource genuinely absent rather than merely unauthorized.
#
# ## The consent/status field, and its full documented vocabulary
#
# Every channel a contact can be reached by -- currently `email` and `sms`,
# per the `Identifier`/`Channel` schemas -- carries its own status,
# independently: `subscribed`, `unsubscribed`, or `nonSubscribed` (Channel
# schema, api-docs.omnisend.com/reference/get_contacts, openapi 3.0.0,
# title "Contacts API", version "2026"). A contact's top-level `status`
# field mirrors only the email channel and says so in its own description:
# "Email channel subscription status **derived from the primary email
# identifier** (read-only)." It is a convenience projection, not the
# source of truth -- the source of truth is `identifiers[].channels`,
# written directly on create and update.
#
# ## Three separate places consent lives, only one of them a snapshot
#
# `statuses[]` (`ContactStatus`: channel, status, statusChangedAt) is a
# snapshot -- "Most recent subscription status per channel." `consents[]`
# (`Consent`: channel, createdAt, ip, source, userAgent) and `optIns[]`
# (`OptIn`: channel, optInAt) are both documented explicitly as *history*,
# in these words: "Consent records per channel, **sorted by collection
# date**" and "Opt-in history per channel, **sorted by date**" -- two
# separate append-only arrays, both read-only, both genuinely a consent
# record distinct from the field it explains, which answers this batch's
# question as plainly as any provider in it: yes, there is a separate
# consent-history record here, and there are two of them, carrying
# different things (a source/IP/user-agent per grant vs. a bare timestamp
# per opt-in).
#
# ## Can a create silently flip somebody back to subscribed? Yes, and
# ## nothing on the page says not to.
#
# `POST /contacts`'s own description, unconditionally: "Creates a new
# contact. **If a contact with the provided email identifier already
# exists, it will be updated instead.** Returns `201 Created` for new
# contacts and `200 OK` when an existing contact was updated." The
# embedded OpenAPI's own 200 response description repeats it in fewer
# words: "Existing contact updated (upsert by email)." There is no 409, no
# `collision_behavior` switch, and no separate endpoint the way Constant
# Contact's Recipe in this same batch documents for its own plain-create-
# refuses / sign_up_form-merges split -- one route, one behaviour, always
# upsert. And the request body that drives it is the same `identifiers[].
# channels.email.status` field a create-or-update always accepts: a
# caller who already knows an address -- from a list bought elsewhere, a
# CSV export, anywhere -- can call this one ordinary, fully documented
# route with `status: "subscribed"` for that address and move any existing
# record back to subscribed, whether or not the address asked for that.
# Grepped across every page this Recipe fetched for this provider:
# `post_contacts.md`, `contacts.md`, the segmentation guide, the pagination
# and responses references -- nothing containing "resubscribe",
# "re-subscribe", "already unsubscribed", or any consent guard-rail at all
# turned up anywhere. Constant Contact's Recipe in this batch quotes a
# vendor warning in bold, twice, about exactly this transition; Omnisend's
# equivalent page is silent. This Recipe does not model the merge-on-
# collision behaviour as a route -- Cauldron's generic create operation has
# no primitive for "look up by a non-id field and update in place instead
# of minting a new record," the identical gap Buttondown's and Constant
# Contact's Recipes in this collection both state for their own create
# endpoints -- but the finding above is the reason this Recipe exists.
#
# ## Two live API generations on one host, and only one is documented
#
# `api.omnisend.com/v3/contacts` is not mentioned anywhere in the current
# documentation (`api-docs.omnisend.com/llms.txt`, fetched in full, names
# no `/v3` path at all) and is still live, struck today:
#
#   GET  /v3/contacts   no credential at all      -> 400 {"error":"Bad Request"}
#   GET  /v3/contacts   junk X-API-KEY             -> 403 {"error":"Forbidden"}
#   GET  /v3/contacts   junk Authorization: Bearer -> 403 (identical)
#   GET  /v3/contacts   empty X-API-KEY header     -> 400 (identical to absent)
#   GET  /v3/contacts   unrelated header (X-Foo)   -> 400 (identical to absent)
#
# -- a genuine three-way split by presence rather than validity, and a
# different status code for each half (400 vs. 403), unlike anything else
# in this batch. This retired generation is described here and not
# modelled as routes: this Recipe is about the currently documented
# surface, and giving equal weight to an undocumented legacy generation
# would double the file for a shape this batch's question does not turn
# on. `/v3/this-is-not-a-real-endpoint` 404s with an empty body and no
# Content-Type at all, regardless of credential -- routing beats auth on
# this retired generation exactly as it does on the current one, see below.
#
# ## The current generation's credential verdicts: all four collapse
#
# Struck live today against `GET /api/contacts`: no `Authorization` header,
# an empty one, the wrong prefix (`Bearer junktoken12345`), and the right
# prefix with a wrong value (`Omnisend-API-Key junkapikey12345`) all
# answer the byte-identical body --
#
#   401 {"type":"https://problems.omnisend.com/unauthorized",
#        "title":"Unauthorized","status":401}
#
# -- so `auth.absent_error`, `.malformed_error` and `.rejected_error` are
# all left unset below, the same honest collapse Buttondown's and Constant
# Contact's Recipes in this collection make for the identical reason. This
# is also a genuine narrowing from the retired v3 generation just above,
# which kept a real distinction the current one dropped.
#
# ## Routing order: splits on whether the path exists at all, not on method
#
# Checked live in every direction:
#
#   GET    /api/this-is-not-a-real-endpoint   no cred   -> 404 Problem
#   GET    /api/this-is-not-a-real-endpoint   junk cred -> 404 (identical)
#   DELETE /api/contacts (a real path, no route for DELETE) no cred -> 401
#   PATCH  /api/contacts (same, no route for PATCH)        no cred -> 401
#
# A path this generation has never had answers its 404 with or without a
# credential attached; a path it does have, asked for with a method it has
# never registered, answers the *same* 401 a correctly-methoded
# unauthenticated request gets -- there is no 405 anywhere in evidence, and
# no case in this Recipe claims one exists, because none was ever
# triggered with a real credential to rule 405 out entirely. This is the
# split Rootly's Recipe elsewhere in this collection already named and
# `auth.after_routing` cannot express on its own -- "credential first for
# every path it has, router first for every path it does not" -- so, per
# that Recipe's own precedent and the guidance this batch was written
# against, it is stated here rather than forced into the boolean. Because
# Cauldron's own default ordering (credential checked unconditionally,
# before the router) already matches this host's behaviour for every path
# it has, only the two "path genuinely does not exist" cases below need a
# valid credential attached to reach Cauldron's router at all -- a request
# the live probe never had to make -- and carry no `verified:` date for
# that reason, the same caveat Buttondown's Recipe states for the
# identical mismatch.
#
# ## Content-Type
#
# `application/problem+json` on every failure this Recipe observed on the
# current generation, and the body really is RFC 9457 shaped -- `type`,
# `title`, `status`, and `detail` where a detail exists (present on the
# 404 for a genuinely missing path: `"detail":"Endpoint not found."`;
# absent on the 401s this Recipe struck, which carry no `detail` key at
# all). The retired v3 generation announces plain `application/json` and
# delivers exactly that; its unrouted 404 announces no Content-Type header
# at all over a zero-byte body -- three failure shapes on two generations
# of one provider.
#
# ## Known fidelity gaps, stated rather than hidden
#
#   - No `upstream.spec`. Omnisend's documentation is ReadMe.io-hosted with
#     a separate OpenAPI 3.0.0 fragment embedded in each endpoint's own
#     page (`get_contacts.md`, `post_contacts.md`, ...) rather than one
#     unified document, and each page wraps its fragment in Markdown --
#     fetching the URL this Recipe would need to point `upstream.spec` at
#     does not return parseable JSON or YAML on its own. There is no
#     single address this project's drift check could fingerprint.
#   - `email`, `phone` and the top-level `status` convenience field are
#     real, documented, read-only projections derived from `identifiers[]`
#     -- see the header above -- and are not modelled as independent
#     fields; `identifiers[]` is what this Recipe writes and reads, which
#     is the actual source of truth and the field this batch's question is
#     about.
#   - `customProperties`, `tags`, `segments`, `birthdate`, `gender`,
#     address fields, and `trackingConsents.emailOpen` (a fourth,
#     separately-tracked consent -- open-tracking, not marketing consent
#     at all) are real, documented ContactResponse fields and are not
#     modelled.
#   - PATCH /contacts?email=... (update by email, a query parameter rather
#     than a path segment) is real and documented and not modelled;
#     PATCH /contacts/{id} (update by id) is modelled instead, because
#     Cauldron's update operation addresses a record by its path id.
#   - `Bearer` OAuth (client-credentials, token URL
#     `https://app.omnisend.com/oauth2/token`) is a second real credential
#     scheme this API accepts alongside the `Authorization: Omnisend-API-Key`
#     header this Recipe wires -- Cauldron's auth block is one scheme per
#     Recipe, and the API-key path is the one this Recipe could exercise
#     without an OAuth app, the same choice Kit's Recipe in this collection
#     makes for its own v4 API-key/Bearer pair. `GET
#     https://app.omnisend.com/oauth2/token` was struck live for routing
#     information alone -- 404, plain text, "404 page not found" -- and
#     not pursued further: this project's own rule against retrying a
#     rate-limiting endpoint made a POST attempt against a live token
#     endpoint the wrong kind of probe to make without a registered OAuth
#     client, so nothing about a real token exchange is claimed here.
#   - The `errors[]` array `ValidationProblem` carries on a 400, and the
#     `retryAfter` field `RateLimitProblem` carries on a 429, are both
#     real, documented shapes and are not modelled: neither was triggered
#     live (both require a request this Recipe never had a reason to send
#     -- a malformed body, or enough traffic to be throttled), and this
#     Recipe's single `responses.error` style already carries the simpler
#     `type`/`title`/`status`/`detail` shape every 401/403/404 this Recipe
#     did observe actually uses.
#
# Every case below not carrying a `verified:` date was read from
# api-docs.omnisend.com (fetched via its own published `llms.txt` index
# and per-endpoint Markdown pages, each embedding a real OpenAPI 3.0.0
# fragment), not observed against a real account -- this Recipe was
# written with no credential and no account exists to create one against.
# The key below is a fixture and authenticates nothing.

recipe: omnisend
capability: marketing
version: 0.1.0

upstream:
  api: "2026-03-15"
  provider: omnisend
  docs: https://api-docs.omnisend.com/reference/contacts
  # No spec: see the header -- a fragmented, Markdown-wrapped OpenAPI
  # description with no single parseable address.

auth:
  scheme: header
  header: Authorization
  prefix: "Omnisend-API-Key "
  keys:
    - cauldron-omnisend-fixture-key-000000000000
  # All four verdicts this wire can produce collapse to one sentence -- see
  # the header. absent_error/malformed_error/rejected_error are left unset
  # on purpose.
  #
  # Deliberately NOT after_routing: true. See the header -- this host
  # splits on whether the path exists at all, not on the method, which the
  # boolean cannot express; Cauldron's own unconditional default already
  # matches this host's behaviour for every path it actually has.

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    style: flat
    message_field: "-"
    code_field: "-"
    type_field: type
    status_field: status

resources:
  contact:
    collection: contacts
    # 24 hex characters -- a MongoDB ObjectId shape, per the schema's own
    # example (60a6170920d91c215e949b5c).
    id:
      style: hex
      length: 24
    fields:
      firstName:
        type: string
        null_when_unset: true
      lastName:
        type: string
        null_when_unset: true
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # The source of truth this whole Recipe is about -- see the header
      # for why email/phone/status are left undeclared in favour of this
      # one field. A list of {type, id, channels: {channelName: {status,
      # statusChangedAt}}} objects, per the Identifier/Channel schemas.
      identifiers:
        type: list
        default: []
      # Read-only history -- see the header for why this is a genuinely
      # separate record from the field it explains, not a rename of it.
      # {channel, createdAt, ip, source, userAgent} per entry.
      consents:
        type: list
        default: []
      # A second, separate read-only history -- {channel, optInAt} per
      # entry. See the header for why this and consents are not the same
      # array under two names.
      optIns:
        type: list
        default: []
      # A read-only snapshot, not a history -- {channel, status,
      # statusChangedAt} per entry, one current row per channel.
      statuses:
        type: list
        default: []

routes:
  - method: GET
    path: /api/contacts
    resource: contact
    operation: list
    pagination:
      style: cursor
      limit_param: limit
      cursor_param: after
    list:
      cursor_field: paging.cursors.after
      cursor_null: true

  - method: GET
    path: /api/contacts/{id}
    resource: contact
    operation: get

  - method: POST
    path: /api/contacts
    resource: contact
    operation: create
    status: 201

  - method: PATCH
    path: /api/contacts/{id}
    resource: contact
    operation: update

errors:
  # The reserved fallback every unset verdict lands on -- see the header.
  authentication_error:
    status: 401
    type: https://problems.omnisend.com/unauthorized
    fields:
      title: Unauthorized

  unknown_route:
    status: 404
    type: https://problems.omnisend.com/not-found
    fields:
      title: Not found
      detail: Endpoint not found.

  # A route this generation has, naming a record it does not -- the general
  # Problem shape's own worked example in responses.md uses this identical
  # type/title for exactly this case ("Segment '...' not found."), quoted
  # for the type and title only: the vendor's example is about a segment,
  # not a contact, so no contact-specific detail sentence is asserted here.
  resource_missing:
    status: 404
    type: https://problems.omnisend.com/not-found
    fields:
      title: Not found

fixtures:
  empty: {}

  # Every value below was read from a schema's own `example:` annotation in
  # the published OpenAPI fragment (get_contacts.md), not invented -- the
  # id, the identifiers/channels shape, and the consent/opt-in/status
  # entries are the vendor's own worked examples for each field, combined
  # onto one record because no single end-to-end worked response shows
  # every array populated together.
  small-account:
    contact:
      - id: 60a6170920d91c215e949b5c
        firstName: John
        lastName: Doe
        createdAt: "2021-05-20T12:00:00Z"
        updatedAt: "2021-05-20T12:30:00Z"
        identifiers:
          - type: email
            id: example@example.com
            channels:
              email:
                status: subscribed
                statusChangedAt: "2023-05-22T10:25:14.263Z"
        consents:
          - channel: email
            createdAt: "2021-05-20T12:00:00Z"
            ip: 161.1.1.1
            source: api
            userAgent: Mozilla/5.0
        optIns:
          - channel: email
            optInAt: "2021-05-20T12:00:00Z"
        statuses:
          - channel: email
            status: subscribed
            statusChangedAt: "2023-05-22T10:25:14.263Z"

conformance:
  - name: no Authorization header at all is refused
    source: https://api.omnisend.com/api/contacts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /api/contacts
    expect:
      status: 401
      body:
        type: https://problems.omnisend.com/unauthorized
        title: Unauthorized
        status: 401

  - name: the wrong scheme entirely gets the identical sentence
    source: https://api.omnisend.com/api/contacts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /api/contacts
      headers:
        Authorization: "Bearer junktoken12345"
    expect:
      status: 401
      body:
        title: Unauthorized

  - name: a present but empty Authorization value gets the identical sentence too
    source: https://api.omnisend.com/api/contacts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /api/contacts
      headers:
        Authorization: ""
    expect:
      status: 401
      body:
        title: Unauthorized

  - name: the right prefix with a simply wrong key gets the identical sentence again
    source: https://api.omnisend.com/api/contacts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: GET
      path: /api/contacts
      headers:
        Authorization: "Omnisend-API-Key junkapikey12345"
    expect:
      status: 401
      body:
        type: https://problems.omnisend.com/unauthorized
        title: Unauthorized

  - name: a method this path has never registered still reaches the auth gate, not a routing miss
    source: https://api.omnisend.com/api/contacts
    verified: "2026-09-01"
    fixture: small-account
    request:
      method: DELETE
      path: /api/contacts
    expect:
      status: 401
      body:
        title: Unauthorized

  - name: a path this generation has never had 404s with no credential sent at all
    # See the header: Cauldron's own default checks the credential
    # unconditionally before routing, so reaching the router's own 404
    # here needs a valid credential the live probe never sent -- carries
    # no verified date for that reason, even though the body below is the
    # literal one this Recipe watched happen.
    source: https://api.omnisend.com/api/this-is-not-a-real-endpoint
    fixture: small-account
    request:
      method: GET
      path: /api/this-is-not-a-real-endpoint
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 404
      body:
        type: https://problems.omnisend.com/not-found
        title: Not found
        detail: Endpoint not found.

  - name: there is no separate customers resource -- a contact and a customer are one record
    # Struck live with a valid-shaped credential attached, for the same
    # reason as the case above: this generation checks auth before
    # routing on every path it does have, so a credential is needed to
    # reach the router's verdict on a path it does not. The 404 is
    # byte-identical to any other invented path -- there is nothing here
    # to distinguish, which is the finding. See the header.
    source: https://api.omnisend.com/api/customers
    fixture: small-account
    request:
      method: GET
      path: /api/customers
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 404
      body:
        detail: Endpoint not found.

  - name: a listing wraps its array under contacts
    source: https://api-docs.omnisend.com/reference/get_contacts.md
    fixture: small-account
    request:
      method: GET
      path: /api/contacts
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 200
      body:
        "contacts[0].id": 60a6170920d91c215e949b5c
        "contacts[0].firstName": John

  - name: consent is a separate history from the current status, and from opt-in history again
    source: https://api-docs.omnisend.com/reference/get_contacts.md
    fixture: small-account
    request:
      method: GET
      path: /api/contacts/60a6170920d91c215e949b5c
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 200
      body:
        id: 60a6170920d91c215e949b5c
        "identifiers[0].channels.email.status": subscribed
        "statuses[0].status": subscribed
        "consents[0].source": api
        "consents[0].ip": 161.1.1.1
        "optIns[0].channel": email

  - name: fetching an id nobody minted is the same not-found shape as an unrouted path
    source: https://api-docs.omnisend.com/reference/get_contacts-id.md
    fixture: small-account
    request:
      method: GET
      path: /api/contacts/000000000000000000000000
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 404
      body:
        type: https://problems.omnisend.com/not-found

  - name: creating a brand new contact is 201, not 200
    # See the header: 200 is reserved for the upsert-by-email branch this
    # Recipe does not mechanically model. This case only exercises a
    # plainly new identifier.
    source: https://api-docs.omnisend.com/reference/post_contacts.md
    fixture: small-account
    request:
      method: POST
      path: /api/contacts
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
      json:
        firstName: Jane
        lastName: Doe
        identifiers:
          - type: email
            id: jane.doe@example.com
            channels:
              email:
                status: subscribed
                statusChangedAt: "2024-01-01T00:00:00Z"
            consent:
              source: omnisend-form
              ip: 192.168.1.1
              createdAt: "2024-01-01T00:00:00Z"
    expect:
      status: 201
      body:
        firstName: Jane
        "identifiers[0].id": jane.doe@example.com
        "identifiers[0].channels.email.status": subscribed

  - name: updating a contact by id does not change its id
    source: https://api-docs.omnisend.com/reference/patch_contacts-id.md
    fixture: small-account
    request:
      method: PATCH
      path: /api/contacts/60a6170920d91c215e949b5c
      headers:
        Authorization: "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
      json:
        firstName: Jonathan
    expect:
      status: 200
      body:
        id: 60a6170920d91c215e949b5c
        firstName: Jonathan

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but after can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "after moves past the only record, and the page comes back empty"
    source: "https://api-docs.omnisend.com/reference/get_contacts.md"
    fixture: small-account
    request:
      method: GET
      path: "/api/contacts"
      query:
        "limit": "1"
        "after": "60a6170920d91c215e949b5c"
      headers:
        "Authorization": "Omnisend-API-Key cauldron-omnisend-fixture-key-000000000000"
    expect:
      status: 200
      absent:
        - "contacts[0]"

