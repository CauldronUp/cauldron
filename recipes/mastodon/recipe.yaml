# Mastodon Recipe for Cauldron
#
# Mastodon is per-instance, and this Recipe describes one real, public
# instance rather than "Mastodon" in the abstract: mastodon.social, the
# flagship server the Mastodon project itself operates, checked live on
# 2026-09-02, api/v2/instance's own "version" field reading
# "4.8.0-alpha.2+pr-40283-14051b2" on the day this was written. Every
# fixture below is a real account or a real status this instance actually
# answered with -- @Mastodon, the project's own account, and @Gargron
# (Eugen Rochko, Mastodon's creator, user id 1 on this server, whose first
# ever toot -- "Hello world", 2016-03-16 -- this Recipe fetched live and
# uses as its oldest fixture) -- never a fabricated handle or id.
#
# **A status id is local to the instance that minted it, not global, and
# Mastodon's own field documentation says so in the words it chooses.**
# docs.joinmastodon.org/entities/Status describes id as "ID of the status in
# the database" -- this database, this server's own -- and uri as "URI of
# the status used for federation" -- the separate value that actually
# travels between servers. Two different words for two different scopes,
# on two different fields of the same object, and this Recipe's own live
# fetches show the id half of that split concretely: @Mastodon's own boost
# of a @MastodonEngineering post (both accounts live on mastodon.social,
# fetched together in one page of @Mastodon's own statuses) is one status --
# id 117128801091131239, its own uri ending in .../activity, the shape
# ActivityPub gives an Announce -- wrapping a *different* status entirely:
# the reblogged post carries id 117128796127029335, a uri of its own,
# ending in .../117128796127029335 with no /activity suffix, and a
# different author. The boost is not the post; it has its own database row
# and its own id, and reblogging something never reuses the id of the thing
# it reblogs even on the *same* server. A copy of a post federated onto a
# second server would repeat the more consequential version of that split
# -- a new local database row on that server, a new id, and the identical
# uri -- and that is Mastodon's own architecture per the field
# documentation above rather than something this session held two servers
# open long enough to watch happen: reaching it live needs a post known to
# have federated onto a second public instance and a case this Recipe could
# construct without guessing which post that would be, and no such
# constructed case appears below because of it.
#
# **A read needs no credential, full stop, for both resources this Recipe
# routes.** Every case below was checked with no Authorization header at
# all, live, and mastodon.social answered every one of them. That was not
# always true of every endpoint on this instance -- see the header's next
# two paragraphs -- but for a single status and a single account, reading
# in public really is unauthenticated, and docs.joinmastodon.org's own
# methods page for statuses.show says why in as many words: "Public for
# public statuses... public statuses no longer require token (added in
# version 2.7.0)."
#
# **The documentation gets its own 404 wrong, on the resource that matters
# most.** docs.joinmastodon.org's statuses.show page states the not-found
# response is 404 {"error": "Record not found"}. Checked live against
# mastodon.social on 2026-09-02, a status id with no chance of existing
# answers 404 {"error": "Not Found"} -- twenty-one bytes, a different
# sentence entirely. The identical check against accounts.lookup, on the
# same instance, on the same day, answers {"error": "Record not found"} --
# matching the documentation exactly. So the documented sentence is real,
# and it belongs to a different endpoint than the one the page describing
# it names.
#
# **Two more real routes exist on this instance and are not modelled here,
# because this Recipe's one credential scheme (none, for the reads above)
# cannot also express what they need.** GET /api/v1/timelines/public with no
# credential answers 422 {"error": "This method requires an authenticated
# user"} -- checked live; the public timeline stopped being public some
# time before this session, and 422 rather than 401 is itself worth having
# noticed. GET /api/v1/accounts/verify_credentials answers 401
# {"error": "The access token is invalid"} for no Authorization header, for
# "Authorization: Bearer junktoken12345", and for "Authorization:
# junktoken12345" with no Bearer prefix at all -- three different shapes of
# wrong, checked live, one identical sentence for all three, Doorkeeper's
# (Mastodon's OAuth2 provider gem) own default. PUT and DELETE on a real
# status's own path answer the same 401 with no credential, live -- not
# 405, and not the ordinary get route's success -- so a write verb is
# refused for its credential before anything about the record is examined,
# on a path this Recipe does route for GET. Modelling that split needs a
# credential requirement that depends on the HTTP method on one shared
# path, which is exactly the shape Census's Recipe in this collection
# needed for its own GET/PUT split and solved with scheme: none plus
# matches_header on every route -- a mechanism built for a resource this
# Recipe already routes without it. Doing both at once was not attempted;
# the finding is recorded here, live and dated, instead.
#
# **OPTIONS, and any path this instance has no route for at all, answers
# the same page -- the web application's own "not found," not a JSON API
# response.** Checked live: GET on a path under /api/v1/ this Recipe made
# up, and OPTIONS on a route this Recipe does declare, both answer 404 with
# an HTML document titled "The page you are looking for isn't here. -
# Mastodon", Content-Type "*/*; charset=utf-8" -- a wildcard, not a real
# media type, on a host whose every JSON response says
# "application/json; charset=utf-8" exactly. Rails routes GET, POST, PUT,
# PATCH and DELETE explicitly for the paths that take them and never
# registers OPTIONS at all, so an OPTIONS request finds no route the same
# way a wholly invented path does -- there is no 405 anywhere on this
# instance for any method this Recipe tried.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - reblog is not modelled as a field. A status's reblog is either null or
#     another complete status object, and this format has no way to
#     collapse a nested field group to a bare null when every field inside
#     it is unset -- the same gap Rootly's Recipe in this collection states
#     for an incident with no severity. The live boost example the header
#     describes is cited rather than fixtured for the same reason.
#   - Of Mastodon's roughly seventy documented status attributes this
#     Recipe declares eleven. Media attachments, polls, mentions, tags,
#     custom emoji, the edit history, and every moderation and filter field
#     are entirely absent.
#   - Of the account entity's several dozen fields, this Recipe declares
#     nine. Fields, roles, moved, discoverable and every counting/approval
#     flag added since 4.3 are absent.
#   - verify_credentials, timelines/public, and every write are described
#     in the header and routed nowhere -- see above.
#   - No upstream.spec recorded: Mastodon does publish an OpenAPI-adjacent
#     reference at docs.joinmastodon.org, generated from the same source as
#     the prose this header cites, but no single machine-readable document
#     URL for the whole API was fetched or fingerprinted this session.

recipe: mastodon
capability: chat
version: 0.1.0

upstream:
  api: v1
  provider: mastodon
  docs: https://docs.joinmastodon.org/methods/statuses/

auth:
  # The two resources this Recipe routes -- a public status, a public
  # account -- take no credential on mastodon.social, checked live, and this
  # Recipe's one scheme has to be the one that matches what it actually
  # routes. See the header for the two real routes on this same instance
  # that are never this permissive, and why they are described rather than
  # modelled.
  scheme: none

responses:
  resource:
    style: bare
  error:
    # {"error": "..."} everywhere on this instance -- the message itself
    # sits under "error", with no separate code or type field anywhere in
    # any failure this Recipe checked.
    style: flat
    message_field: error
    code_field: "-"

resources:
  status:
    id:
      # "ID of the status in the database" -- a string on the wire, cast
      # from an integer, per docs.joinmastodon.org's own words for this
      # field; digits because it must never be parsed as a JSON number, the
      # same shape this collection already uses for Discord's snowflakes.
      style: digits
    fields:
      uri:
        type: string
      url:
        type: string
        null_when_unset: true
      created_at:
        type: datetime
      content:
        type: string
      visibility:
        type: string
        default: public
      replies_count:
        type: integer
      reblogs_count:
        type: integer
      favourites_count:
        type: integer
      account_id:
        type: string
        as: id
        in: account
      account_username:
        type: string
        as: username
        in: account
      account_acct:
        type: string
        as: acct
        in: account
      account_display_name:
        type: string
        as: display_name
        in: account

  account:
    # Addressed by numeric id (the ordinary path) or by acct (lookup) --
    # the same dual-addressing Jira's issue key and number already have in
    # this collection, and the same alias mechanism.
    alias: acct
    id:
      style: digits
    fields:
      username:
        type: string
      acct:
        type: string
      display_name:
        type: string
      url:
        type: string
      uri:
        type: string
      created_at:
        type: datetime
      followers_count:
        type: integer
      following_count:
        type: integer
      statuses_count:
        type: integer

  # api/v2/instance's own answer -- a singleton, the one record this
  # sandbox holds for it, the same shape GitHub's /user or Slack's
  # auth.test already use id_from: auth for.
  instance:
    id:
      field: "-"
      style: opaque
    fields:
      domain:
        type: string
      title:
        type: string
      version:
        type: string
      active_month:
        type: integer
        as: active_month
        in: usage.users

routes:
  - method: GET
    path: /api/v1/statuses/{id}
    resource: status
    operation: get
    not_found: status_not_found

  - method: GET
    path: /api/v1/accounts/lookup
    resource: account
    operation: get
    id_from: query:acct
    not_found: account_not_found

  - method: GET
    path: /api/v1/accounts/{id}
    resource: account
    operation: get
    not_found: account_not_found

  - method: GET
    path: /api/v2/instance
    resource: instance
    operation: get
    id_from: auth

errors:
  # The live wire's own words -- twenty-one bytes -- and not the sentence
  # docs.joinmastodon.org's own statuses.show page documents for this same
  # situation. See the header.
  status_not_found:
    status: 404
    message: Not Found

  # This one does match the documentation, on the same instance, the same
  # day -- see the header's contrast with status_not_found above.
  account_not_found:
    status: 404
    message: Record not found

  # Rails' own catch-all "page not found," reached by any path this
  # instance has no route for and by OPTIONS on a path it does -- see the
  # header. The real page is a full HTML document; only the stable title is
  # reproduced. The wildcard Content-Type is not a typo: the live response
  # really does announce "*/*" rather than a real media type, on a host
  # whose JSON answers always say application/json.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "*/*; charset=utf-8"
    message: "<title>The page you are looking for isn&#39;t here.\n - Mastodon</title>"

  # Rails never registers OPTIONS (or any method beside the ones a route
  # explicitly declares) for these paths, so a method this Recipe's own
  # router would otherwise refuse with a computed 405 answers the identical
  # unrouted page instead -- declared with a status other than 405 so
  # Cauldron's own Allow-header computation, built for a provider that does
  # have one, stays off; the live response carries no Allow header either.
  # The same device Turso's Recipe in this collection already uses for its
  # own no-405 host.
  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "*/*; charset=utf-8"
    message: "<title>The page you are looking for isn&#39;t here.\n - Mastodon</title>"

fixtures:
  empty: {}

  # Real accounts and real statuses this instance answered with, live, on
  # 2026-09-02. Nothing below is invented.
  mastodon-social:
    account:
      # The Mastodon project's own account, user id 13179 on this instance.
      - id: "13179"
        username: Mastodon
        acct: Mastodon
        display_name: Mastodon
        url: https://mastodon.social/@Mastodon
        uri: https://mastodon.social/users/Mastodon
        created_at: "2016-11-23T00:00:00.000Z"
        followers_count: 878000
        following_count: 51
        statuses_count: 564

      # Eugen Rochko, Mastodon's creator -- user id 1 on the server he
      # started, per its own numbering.
      - id: "1"
        username: Gargron
        acct: Gargron
        display_name: Eugen Rochko
        url: https://mastodon.social/@Gargron
        uri: https://mastodon.social/users/Gargron
        created_at: "2016-03-16T00:00:00.000Z"
        followers_count: 382449
        following_count: 737
        statuses_count: 82168

    status:
      # Mastodon's own most recent post as of this session.
      - id: "117156549508722805"
        uri: https://mastodon.social/users/Mastodon/statuses/117156549508722805
        url: https://mastodon.social/@Mastodon/117156549508722805
        created_at: "2026-08-25T14:11:16.256Z"
        content: "<p>Hannah Aubry is leaving Mastodon after her time with us as community director and board member. We’re very grateful for her contributions, ideas, and commitment to Mastodon and the fediverse. Thank you, Hannah! We wish you all the very best for what comes next.</p>"
        visibility: public
        replies_count: 13
        reblogs_count: 113
        favourites_count: 444
        account_id: "13179"
        account_username: Mastodon
        account_acct: Mastodon
        account_display_name: Mastodon

      # The very first toot, and the oldest live record either Recipe in
      # this collection's social group holds: 2016-03-16, id 1, on the
      # server its author founded.
      - id: "1"
        uri: https://mastodon.social/users/Gargron/statuses/1
        url: https://mastodon.social/@Gargron/1
        created_at: "2016-03-16T14:44:31.580Z"
        content: <p>Hello world</p>
        visibility: public
        replies_count: 65
        reblogs_count: 608
        favourites_count: 1153
        account_id: "1"
        account_username: Gargron
        account_acct: Gargron
        account_display_name: Eugen Rochko

    instance:
      - domain: mastodon.social
        title: Mastodon
        version: 4.8.0-alpha.2+pr-40283-14051b2
        active_month: 265580

conformance:
  - name: a real, recent status -- id, uri and url are three different things
    source: https://mastodon.social/api/v1/statuses/117156549508722805
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/statuses/117156549508722805
    expect:
      status: 200
      body:
        id: "117156549508722805"
        uri: https://mastodon.social/users/Mastodon/statuses/117156549508722805
        url: https://mastodon.social/@Mastodon/117156549508722805
        visibility: public
        replies_count: 13
        "account.acct": Mastodon
      matches:
        id: '^[0-9]+$'

  - name: the oldest live record in this Recipe -- Mastodon's own first post
    source: https://mastodon.social/api/v1/statuses/1
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/statuses/1
    expect:
      status: 200
      body:
        id: "1"
        uri: https://mastodon.social/users/Gargron/statuses/1
        content: <p>Hello world</p>
        "account.username": Gargron
        "account.id": "1"

  - name: a status id with no chance of existing answers Not Found, not the documented Record not found
    source: https://mastodon.social/api/v1/statuses/999999999999999999
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/statuses/999999999999999999
    expect:
      status: 404
      body:
        error: Not Found

  - name: an account resolved by acct carries both a web url and a federation uri
    source: https://mastodon.social/api/v1/accounts/lookup?acct=Mastodon
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/accounts/lookup
      query:
        acct: Mastodon
    expect:
      status: 200
      body:
        id: "13179"
        username: Mastodon
        url: https://mastodon.social/@Mastodon
        uri: https://mastodon.social/users/Mastodon
        statuses_count: 564

  - name: the same account, addressed by its numeric id instead
    source: https://mastodon.social/api/v1/accounts/1
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/accounts/1
    expect:
      status: 200
      body:
        id: "1"
        username: Gargron
        acct: Gargron
        display_name: Eugen Rochko

  - name: a lookup naming nobody answers the documented sentence, on this endpoint
    source: https://mastodon.social/api/v1/accounts/lookup?acct=thisAccountShouldNotExistXYZ123456789
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v1/accounts/lookup
      query:
        acct: thisAccountShouldNotExistXYZ123456789
    expect:
      status: 404
      body:
        error: Record not found

  - name: instance metadata needs no credential and no identifier at all
    source: https://mastodon.social/api/v2/instance
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: GET
      path: /api/v2/instance
    expect:
      status: 200
      body:
        domain: mastodon.social
        title: Mastodon
        "usage.users.active_month": 265580

  - name: a path this instance has no route for answers the web app's own 404, not a JSON one
    source: https://mastodon.social/api/v1/totally-bogus-endpoint-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/v1/totally-bogus-endpoint-xyz
    expect:
      status: 404
      headers:
        Content-Type: "*/*; charset=utf-8"
      body_matches: "isn&#39;t here"

  - name: OPTIONS on a route this Recipe does declare gets the identical unrouted page
    # Rails never registers OPTIONS for a route it declares GET for, so this
    # answers exactly what a wholly invented path does -- no 405 anywhere
    # on this instance, for any method this Recipe tried.
    source: https://mastodon.social/api/v1/statuses/1
    verified: "2026-09-02"
    fixture: mastodon-social
    request:
      method: OPTIONS
      path: /api/v1/statuses/1
    expect:
      status: 404
      headers:
        Content-Type: "*/*; charset=utf-8"
      body_matches: "isn&#39;t here"
