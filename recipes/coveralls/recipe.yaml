# Coveralls Recipe for Cauldron
#
# Coveralls is the control for this batch, not another instance of it. The
# other two providers here are internal-tool builders whose smallest record
# a human names -- a table, a row, a workspace. Coveralls' smallest record is
# named by a build: a single POST from a CI job, and almost nothing about
# this API reads back what that POST carried. The read side exists -- this
# Recipe found it live, unauthenticated, on a real public repository, and it
# is worth saying plainly what it answers with and what it does not: a
# rollup of percentages and a commit, never the per-file, per-line detail
# the write side accepts. Say the header's own conclusion up front, because
# it is the reason this Recipe looks the shape it does: **the read side is
# real but thin, and this API is a write surface that happens to have a
# receipt.**
#
# coveralls.io/api is also not quite where the read side lives, which is
# worth correcting before anything else. /api/repos and /api/v1/jobs are
# real, both checked live, and both are management/ingest paths gated by a
# session or a repo token. The public read routes this Recipe models are
# not under /api/ at all: GET /{service}/{owner}/{repo}.json and
# GET /jobs/{id}.json sit at the host's own root, unauthenticated for a
# public repository, and answer real JSON. A Recipe scoped only to /api/
# would describe the write half and miss the one place a build's own report
# can be read back.
#
# **A job POST returns an id pointing at a receipt, not the report.**
# Coveralls' own worked example, quoted verbatim from
# docs.coveralls.io/api-jobs-endpoint's guide for POST /api/v1/jobs:
#
#   {"message":"Job #6F97449D268333D87EE1D263482E8AFCCC4693A5.2",
#    "url":"https://coveralls.io/jobs/116403628"}
#
# Two fields. Not the coverage percentage the job just reported, not the
# source_files array the caller just sent -- an id, wrapped in a url, and a
# message that turns out to be worth reading closely: the number after the
# commit sha is not a version tag, it is a counter, and this Recipe checked
# what it counts. GET /jobs/116403628.json -- the exact id this documented
# example names, fetched live rather than assumed -- answers
# {"id":116403628,"repo_name":"coverallsapp/coveralls-node-demo",
# "full_number":"6f97449d268333d87ee1d263482e8afccc4693a5.2",
# "timestamp":"2023-03-09T06:17:06Z","covered_percent":41.17...}, the same
# hash, the same ".2", on a real historical job. A ".2" on a real record is
# evidence a job is not the first one this API ever saw for that commit --
# jobs number per commit rather than overwrite the slot a commit already
# has, which is this Recipe's answer, read from a live record rather than
# guessed, to the question of whether a repeated post for one commit
# replaces or duplicates: it appends, with a counter that says so.
#
# **The report is addressable afterwards, and reading it back is much
# thinner than what was sent.** GET /jobs/{id}.json is real and answers
# {id, repo_name, full_number, timestamp, covered_percent} -- a rollup, the
# same five fields on every job this Recipe could check, and nothing else:
# no source_files, no per-line hit counts, none of the detail POST /jobs
# requires (repo_token, service_name, service_job_id, source_files, all
# named required in Coveralls' own schema). What a build sends is a full
# report; what anything can read back through this API is five scalars.
# That is the finding the header opened with, pinned to two real requests
# rather than stated on faith.
#
# **The management surface does not tell absent from wrong, and neither
# gate names the credential it wanted.** GET /api/repos, checked live three
# ways -- no header, ?repo_token=junk, Authorization: Bearer junk -- answers
# the byte-identical {"error":"Forbidden"}, 403, every time. Coveralls' own
# docs describe this route as needing an active browser session or a
# personal API token passed a way the docs do not pin to a header name, and
# none of the three shapes this Recipe could construct without one changed
# a single byte of the answer.
#
# **Validation runs before authentication on the one route this project
# will safely call.** POST /api/v1/jobs with no body, no file, no token at
# all -- the only request against this route this Recipe would send, since
# a real one uploads a coverage report -- answers 422
# {"message":"JSON file not found or failed to parse.","error":true,
# "url":""}, not a 401 or 403. Coveralls' repo_token is not a header or a
# query parameter here; it is a field inside the uploaded file, so there is
# nothing at the HTTP layer to check a credential against until a file has
# been found and parsed. A missing token cannot be reported before a
# missing file is.
#
# **A record that does not exist and a path that was never routed answer
# the identical page.** Struck live, four ways -- a repo name shaped
# correctly and belonging to nobody, a path under /api/ that does not
# exist, a wrong method on a real path (PATCH /api/repos), and a path this
# host has no route for at all -- and all four answer Coveralls' own
# branded Rails error page, title "Coveralls :: Oops, something went wrong
# (404)", text/html, 404. Rootly's and NocoDB's Recipes elsewhere in this
# collection each found two DIFFERENT shapes for "no route" versus "no
# record"; Coveralls is the opposite finding, one shape for both, and it is
# declared here by pointing the repo resource's own not_found at the same
# errors entry an unmatched path already falls back to, rather than
# inventing a second shape nothing here observed.
#
# No 405 exists either: PATCH on /api/repos and GET on /api/v1/jobs (a
# route this Recipe only ever POSTs to) both answer the identical branded
# page, not a distinct method-not-allowed shape -- the same finding Turso's
# and NocoDB's Recipes make for their own hosts, reached independently
# here.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - POST /api/v1/jobs is multipart/form-data, and sending is not modelled
#     -- the same boundary DropboxSign's and Onfido's Recipes in this
#     collection draw around their own uploads. What this Recipe serves for
#     that route is the one request it is safe to make (no file at all) and
#     the 422 that answers it; the 200 quoted above is prose, not a
#     fixture, because nothing here ever sent a file to earn it.
#   - GET /jobs/{id} with no .json suffix -- the HTML view a human would
#     open -- answers a Cloudflare managed-challenge 403
#     (Cf-Mitigated: challenge), checked live, and is not modelled: that is
#     an edge policy in front of the page, not a fact about the API, the
#     same reasoning Rootly's Recipe gives for excluding a Webflow 404 on
#     two of its own methods.
#   - GET /api/v1/repos/{owner}/{repo}, the versioned path this Recipe
#     expected the JSON API to answer read requests on by analogy with
#     /api/repos, does not exist: checked live, it answers the same
#     branded 404 an invented path does. Coveralls' own read routes are the
#     unversioned, unauthenticated .json ones above, not a versioned /api/
#     mirror of them.
#   - Listing a repository's builds/jobs is not modelled. No path this
#     Recipe tried for one (/{service}/{owner}/{repo}/builds.json among
#     them) answered anything but the branded 404, and inventing a path
#     nothing here confirmed would be a claim about the wire, not a
#     citation of it.
#   - POST /api/repos, PUT /api/repos and DELETE /api/repos are documented
#     and not modelled: each needs the same session or token GET /api/repos
#     does, and this Recipe never held either.
#   - No rate-limit header was seen on any response this Recipe struck, so
#     none is declared.
#
# lemurheavy/coveralls-ruby and coverallsapp/coveralls-node-demo are real,
# public repositories, and every field cited from them was read live or
# copied verbatim from Coveralls' own published documentation, on the date
# below. No coverage report was ever submitted and no application was ever
# created by this Recipe.

recipe: coveralls
capability: ci
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.coveralls.io/api-introduction

auth:
  # No route this Recipe can safely demonstrate ever succeeds with a
  # credential this Recipe could hold -- see the header. Every gate below
  # is a fixed answer rather than a checked one.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"

resources:
  # Addressed at /{service}/{owner}/{repo}.json by the repo segment alone,
  # scoped under service and owner -- not by the numeric id this same body
  # carries. See below: the two are kept apart on purpose.
  repo:
    id:
      # The repo segment mints and addresses the record; the wire's own
      # "id" key is a different value entirely and is recovered as an
      # ordinary field below, the same split the National Weather Service
      # Recipe in this collection uses for the identical collision.
      style: opaque
      field: "-"
    fields:
      # The partition lives in the path and Coveralls never repeats either
      # segment in the body; repo_name below carries the combined form the
      # wire actually sends.
      service:
        type: string
        in: "-"
      owner:
        type: string
        in: "-"
      # The real wire "id" -- 38892702 on the cited example -- never used
      # to address this record through any route this Recipe found.
      numeric_id:
        type: number
        as: id
      repo_name:
        type: string
      branch:
        type: string
      url:
        type: string
        null_when_unset: true
      badge_url:
        type: string
      calculated_at:
        type: datetime
      created_at:
        type: datetime
      commit_message:
        type: string
      committer_name:
        type: string
      committer_email:
        type: string
      commit_sha:
        type: string
      updated_at:
        type: datetime
      coverage_change:
        type: number
      covered_percent:
        type: number
      covered_lines:
        type: integer
      missed_lines:
        type: integer
      relevant_lines:
        type: integer
      covered_branches:
        type: integer
      missed_branches:
        type: integer
      relevant_branches:
        type: integer

  # The read side of a single build. Five fields -- see the header for what
  # this leaves out of what the write side accepted.
  job:
    id:
      style: numeric
      type: number
    fields:
      repo_name:
        type: string
      # The commit sha and a counter, lowercase on this route -- Coveralls'
      # own POST response capitalises the sha in "message" and does not in
      # this field. See the header for what the counter itself is evidence
      # of.
      full_number:
        type: string
      timestamp:
        type: datetime
      covered_percent:
        type: number

routes:
  - method: GET
    path: /{service}/{owner}/{id}.json
    resource: repo
    operation: get
    scope: [service, owner]
    headers:
      Content-Type: application/json; charset=utf-8
    # A repo shaped correctly and belonging to nobody answers the identical
    # branded page an unrouted path does -- see the header. Reusing the
    # same entry states that as a fact about this host rather than
    # inventing a second 404 shape nothing here observed.
    not_found: unknown_route

  - method: GET
    path: /jobs/{id}.json
    resource: job
    operation: get

  - method: GET
    path: /api/repos
    error: forbidden

  # See the header: nothing at the HTTP layer to check before a file has
  # been found, so every request this Recipe safely sends here gets the
  # identical validation failure regardless of what credential, if any, is
  # attached.
  - method: POST
    path: /api/v1/jobs
    error: missing_json_file

errors:
  # The message sits under "error" here, a plain string -- and on the very
  # next route below, "error" is a boolean and the message sits under
  # "message" instead. One host, two unrelated jobs for the same key name.
  forbidden:
    status: 403
    message_field: error
    message: Forbidden
    headers:
      Content-Type: application/json; charset=utf-8

  missing_json_file:
    status: 422
    message: JSON file not found or failed to parse.
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      error: true
      url: ""

  # Coveralls' own branded Rails error page -- real, live, and reused for
  # every one of the four "no" shapes the header lists: an unrouted path,
  # a real path with the wrong method, and (via the repo route's own
  # not_found above) a well-formed repo nobody owns.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: "Coveralls :: Oops, something went wrong (404)"

  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: "Coveralls :: Oops, something went wrong (404)"

fixtures:
  empty: {}

  # lemurheavy/coveralls-ruby, fetched live at the source below on the date
  # this Recipe was verified. Every field is the literal value that came
  # back; none is invented.
  public:
    repo:
      - id: coveralls-ruby
        service: github
        owner: lemurheavy
        numeric_id: 38892702
        repo_name: lemurheavy/coveralls-ruby
        branch: migrate-ci-to-github-actions-use-coveralls-action
        url: null
        badge_url: https://s3.amazonaws.com/assets.coveralls.io/badges/coveralls_91.svg
        calculated_at: "2021-04-16T17:47:08Z"
        created_at: "2021-04-16T17:46:20Z"
        commit_message: "Bump up version of Coveralls Github Action to v1.1.2 to avoid warning about `flag-name` missing from valid inputs. "
        # Substituted. The live response carried a real contributor's name and
        # their personal address, because a Coveralls build record quotes the
        # git commit it came from. Every other field here is the literal value
        # that came back; these two are not, and a public fixture is a worse
        # place for somebody's email than a public commit is.
        committer_name: Cauldron Fixture Committer
        committer_email: committer@example.com
        commit_sha: 7d6023ed4658f12bdfc1c363de54e4eb36934024
        updated_at: "2023-07-28T23:37:07Z"
        coverage_change: 0.0
        covered_percent: 90.88235294117646
        covered_lines: 309
        missed_lines: 31
        relevant_lines: 340
        covered_branches: 0
        missed_branches: 0
        relevant_branches: 0

    # coverallsapp/coveralls-node-demo, job 116403628 -- the exact id
    # Coveralls' own documented POST response names. Fetched live rather
    # than assumed.
    job:
      - id: 116403628
        repo_name: coverallsapp/coveralls-node-demo
        full_number: 6f97449d268333d87ee1d263482e8afccc4693a5.2
        timestamp: "2023-03-09T06:17:06Z"
        covered_percent: 41.1764705882353

conformance:
  - name: a public repo's rollup answers real fields, live
    source: https://coveralls.io/github/lemurheavy/coveralls-ruby.json
    verified: "2026-09-01"
    fixture: public
    request:
      method: GET
      path: /github/lemurheavy/coveralls-ruby.json
    expect:
      status: 200
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        id: 38892702
        repo_name: lemurheavy/coveralls-ruby
        commit_sha: 7d6023ed4658f12bdfc1c363de54e4eb36934024
        covered_percent: 90.88235294117646
        url: null
      absent:
        - source_files
        - jobs

  - name: a job is addressable afterwards, and answers a rollup rather than the report it was sent with
    source: https://coveralls.io/jobs/116403628.json
    verified: "2026-09-01"
    fixture: public
    request:
      method: GET
      path: /jobs/116403628.json
    expect:
      status: 200
      body:
        id: 116403628
        repo_name: coverallsapp/coveralls-node-demo
        full_number: 6f97449d268333d87ee1d263482e8afccc4693a5.2
        covered_percent: 41.1764705882353
      absent:
        - source_files
        - message
        - url

  - name: no credential of any kind is told from a wrong one
    source: https://coveralls.io/api/repos
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repos
    expect:
      status: 403
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: Forbidden

  - name: a garbage repo_token query parameter answers the identical body
    source: https://coveralls.io/api/repos
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repos
      query:
        repo_token: junkjunkjunk0000000000
    expect:
      status: 403
      body:
        error: Forbidden

  - name: and so does a garbage bearer header
    source: https://coveralls.io/api/repos
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repos
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 403
      body:
        error: Forbidden

  - name: an empty job submission fails validation before any credential would be read
    source: https://coveralls.io/api/v1/jobs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v1/jobs
    expect:
      status: 422
      body:
        message: JSON file not found or failed to parse.
        error: true
        url: ""

  - name: a repo shaped correctly and belonging to nobody gets the same branded page an unrouted path does
    source: https://coveralls.io/github/this-owner-does-not-exist-xyz/this-repo-does-not-exist-xyz.json
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /github/this-owner-does-not-exist-xyz/this-repo-does-not-exist-xyz.json
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "Coveralls :: Oops, something went wrong \\(404\\)"

  - name: a path this host has no route for at all gets the identical page
    source: https://coveralls.io/this-is-not-a-real-thing-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-thing-xyz
    expect:
      status: 404
      body_matches: "Coveralls :: Oops, something went wrong \\(404\\)"

  - name: a wrong method on a real path is the same page too, not a 405
    source: https://coveralls.io/api/repos
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/repos
    expect:
      status: 404
      body_matches: "Coveralls :: Oops, something went wrong \\(404\\)"

  - name: and so is a GET on a route this Recipe only ever POSTs to
    source: https://coveralls.io/api/v1/jobs
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v1/jobs
    expect:
      status: 404
      body_matches: "Coveralls :: Oops, something went wrong \\(404\\)"
