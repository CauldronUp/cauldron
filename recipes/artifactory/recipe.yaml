# JFrog Artifactory Recipe for Cauldron
#
# Struck live against releases.jfrog.io on 2026-09-01 -- JFrog's own
# distribution instance, running Artifactory/7.161.16, no account created and
# no token ever requested, guessed or used. It serves JFrog's actual public
# downloads (jfrog-cli, the Artifactory RPM/Debian packages, and ninety-odd
# more real repositories) and answers every path this Recipe probed, so
# every fixture value below except the credential is real bytes this Recipe
# watched come back, not an invented example.
#
# Three failures for one bad credential, not two. GET /api/security/users
# (an endpoint this Recipe never got past, on this instance or presumably
# any other) answered three different sentences for three different things
# that are all, in the end, "not authorised":
#
#   no Authorization header at all       -> 401 {"errors":[{"status":401,
#                                            "message":"Unauthorized"}]}
#   Authorization: Bearer junktoken12345 -> 401 {"errors":[{"status":401,
#                                            "message":"Props Authentication
#                                            Token not found"}]}
#   Authorization: Bearer  (empty)       -> 401 {"errors":[{"status":401,
#                                            "message":"Unauthorized"}]}
#   Basic junkuser:junkpass              -> 401 {"errors":[{"status":401,
#                                            "message":"Bad Credentials"}]}
#
# Absent and empty-after-prefix collapse to the same generic sentence --
# "Bearer " with nothing after it is treated exactly like no header at all
# here, which is the opposite of what this format's own guidance expects by
# default and is recorded as observed rather than assumed. A bearer value
# that is merely wrong gets its own distinct sentence, "Props Authentication
# Token not found" -- an internal name (Artifactory's access/identity tokens
# are called "Props" tokens in its own error vocabulary) leaking into a
# message meant for an integrator. That is this Recipe's absent/rejected
# split; malformed is not separately declared because nothing this Recipe
# sent Artifactory ever failed a shape check before reaching the credential
# comparison itself. Basic's own wrong-credential sentence ("Bad
# Credentials") is not modelled as a second scheme -- Cauldron's auth is one
# scheme per Recipe -- and is recorded here because it is a third sentence
# for a fourth request shape on the very same endpoint, which is worth
# knowing exists even where this format cannot serve it.
#
# Routing resolves before the credential, unconditionally, and the evidence
# is a wrong method on two different kinds of path:
#
#   PUT  /api/repositories (real, GET-only)     -> 405, Allow: GET,OPTIONS
#   PUT  /this-does-not-exist-xyz (invented)    -> 405, Allow: OPTIONS, GET,
#                                                   HEAD, POST
#   GET  /this-does-not-exist-xyz               -> 404 {"errors":[{"status":
#                                                   404,"message":"Not
#                                                   Found"}]}
#
# all three struck with no credential at all. The generic artifact-download
# namespace (/artifactory/{repoKey}/{path...}, which structurally accepts
# GET, HEAD, POST and OPTIONS for any string whatsoever, real repository or
# not) and the narrow REST namespace (/artifactory/api/..., whose declared
# routes carry their own Allow set) are two different route tables with two
# different accepted-method lists, and a wrong method on either answers
# before any credential is examined -- auth.after_routing: true, the
# Fireworks arrangement, confirmed on both tables independently.
#
# Only the narrow REST namespace's own 405 is encoded as a case below.
# Cauldron's own automatic method-mismatch detection -- which is what
# answers a wrong method with no credential examined at all -- only fires
# for a path some *other* declared route already claims; a path this
# Recipe declares no route for at all falls to the ordinary unrouted-path
# 404 instead. Declaring an explicit route for the invented path to force
# its own 405 does not reproduce the live finding either, because this
# runtime's after_routing gates any route it successfully matches --
# error-only or not -- behind the credential check once matched, which is
# exactly backwards from what was observed (no credential examined at
# all). Reproducing it faithfully would need the credential-free
# treatment Cauldron gives an unrouted path to extend to a route this
# Recipe declares on purpose, which is not a shape this runtime has today.
# So it is recorded above, dated, and left there.
#
# Two kinds of "not found" for the same missing file, depending only on
# which of Artifactory's own APIs is asked. A real repository, a real path
# prefix, a filename that does not exist:
#
#   GET /jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/nope-not-real
#     -> 404 {"errors":[{"status":404,"message":"File not found.; Path:
#        'jfrog-cli:v2/2.119.0/jfrog-cli-linux-amd64/nope-not-real'"}]}
#        -- note the repository and its path joined by a colon, not the
#        slash the URL itself used.
#   GET /api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/nope-not-real
#     -> 404 {"errors":[{"status":404,"message":"Unable to find item"}]}
#
# same repository, same path, same status, two sentences and two envelopes
# -- the download path names the file it could not find and the storage API
# does not.
#
# The one real file this Recipe fetched metadata for --
# jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/jfrog, 70338693 bytes -- answers
# with real sha1/md5/sha256 checksums under both "checksums" and
# "originalChecksums" (identical on this file; the second exists for the
# rarer case a checksum was overridden by hand and is not itself modelled),
# and every checksum is repeated a third time as an X-Checksum-* response
# header on a plain GET of the file's own bytes. size arrives as a **JSON
# string** -- "70338693", not a bare number -- on an API answering
# Content-Type: application/json, which is exactly the kind of thing a
# schema declaring "type": "integer" would reject outright.
#
# Deletion, from JFrog's own published documentation
# (docs.jfrog.com/artifactory/docs/trash-can, read today, no `verified:`
# date on anything drawn from it): "The feature implements a soft delete.
# Deleted artifacts are retained in the Trash Can rather than immediately
# destroyed... An administrator or user with Manage permissions can enable
# the Trash Can and configure its retention period... If you accidentally
# deleted items from a local repository, you can restore them from the
# Trash Can within the specified retention period," to either the original
# location or a custom path. No default number of days is stated anywhere
# in what this Recipe could read today -- the retention period is
# documented as admin-configured, not as a fixed figure the way Akeyless's
# delete-in-days default of 7 is -- and this Recipe does not invent one.
# Trash Can is also documented as something that must be switched on by an
# administrator, so a deployment that never enabled it deletes immediately
# and permanently; nothing this Recipe read states what a GET on a trashed
# item's original path answers while it is still recoverable, which is
# left an open question rather than guessed at.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - releases.jfrog.io itself allows anonymous GET on /api/repositories and
#     on every download path this Recipe tried -- watched live, 200 with no
#     Authorization header at all. That is a real, common Artifactory
#     configuration for a public distribution instance, and it is not what
#     this Recipe serves: Cauldron's auth is one scheme for the whole
#     Recipe with no per-route exemption (the exact gap firehydrant's own
#     header states for its one public route), so every route below
#     requires the fixture bearer token uniformly, which is the more
#     common posture for a private Artifactory and the only one this
#     format can express without falsely implying every route here is
#     open. The credential-shape findings above were struck against the
#     one endpoint on this instance that really does stay gated
#     (api/security/users) for exactly this reason.
#   - Upload (PUT), copy, move and the Trash Can's own restore/purge APIs
#     are not modelled. Every route below is a GET.
#   - AQL (Artifactory Query Language) search is real and not modelled;
#     this format has no way to execute a query language, the same
#     exclusion this collection already makes for SOQL, GROQ and Algolia's
#     search.
#   - originalChecksums is declared as present on the fixture and not
#     separately asserted -- see above.
#   - No upstream.spec is recorded. JFrog's own documentation platform
#     (jfrog.com/help) renders every page through client-side JavaScript;
#     the machine-readable OpenAPI fragments it embeds are fetched by the
#     page's own script rather than served at one fixed, fetchable URL
#     this Recipe could name and re-check.
#
# The bearer token below is a fixture and belongs to no JFrog account.

recipe: artifactory
capability: infrastructure
version: 0.1.0

upstream:
  api: "7"
  provider: artifactory
  docs: https://jfrog.com/help/r/jfrog-rest-apis/artifactory-rest-apis

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.artifactory.identity.token.0000000000
  # Absent and "Bearer " with nothing after it both fall through to this
  # Recipe's generic authentication_error, matching the identical live
  # "Unauthorized" both produced -- see the header for why that collapse is
  # observed rather than assumed here.
  rejected_error: bearer_rejected
  after_routing: true

responses:
  list:
    style: bare
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    code_field: "-"
    fields:
      status: 0

resources:
  repository:
    id:
      style: opaque
      field: key
    fields:
      description:
        type: string
        null_when_unset: true
      # LOCAL, REMOTE or VIRTUAL.
      type:
        type: string
      url:
        type: string
      packageType:
        type: string

  # api/storage's own shape: metadata about one file, addressed by
  # repository plus path rather than by any single id field.
  artifact:
    id:
      style: opaque
      field: "-"
    fields:
      # Echoed at the top level of a real response, unlike most scope
      # fields in this collection -- Artifactory really does repeat it.
      repo:
        type: string
      path:
        type: string
      created:
        type: datetime
      createdBy:
        type: string
      lastModified:
        type: datetime
      modifiedBy:
        type: string
      lastUpdated:
        type: datetime
      downloadUri:
        type: string
      mimeType:
        type: string
      # A JSON string, not a number -- see the header.
      size:
        type: string
      sha1:
        type: string
        in: checksums
      md5:
        type: string
        in: checksums
      sha256:
        type: string
        in: checksums
      uri:
        type: string

routes:
  - method: GET
    path: /api/repositories
    resource: repository
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05. JFrog's reference redirects twice and lands on
    # a 404: jfrog.com/help/r/jfrog-rest-apis/get-repositories 301s to
    # docs-redirect.jfrog.com, which 301s to docs.jfrog.com, which does
    # not have the page. The repository listing is very likely unpaged --
    # an instance has the repositories an administrator configured -- but
    # "likely" is why nothing is declared.

  - method: GET
    path: /api/storage/{repo}/{id...}
    resource: artifact
    operation: get
    scope: [repo]

errors:
  authentication_error:
    status: 401
    style: list
    key: errors
    message_field: message
    fields:
      status: 401
    message: Unauthorized

  # Present, well-formed enough to compare, and refused -- Artifactory's
  # own internal name for its access/identity tokens leaking into the
  # sentence. See the header.
  bearer_rejected:
    status: 401
    style: list
    key: errors
    message_field: message
    fields:
      status: 401
    message: Props Authentication Token not found

  resource_missing:
    status: 404
    style: list
    key: errors
    message_field: message
    fields:
      status: 404
    message: Unable to find item

  # The narrow REST API's own 405, on a path this Recipe already knows --
  # Cauldron reaches this automatically for any other method against a
  # route declared above, and this name is the one it looks for first.
  method_not_allowed:
    status: 405
    style: list
    key: errors
    message_field: message
    fields:
      status: 405
    message: Method Not Allowed
    headers:
      Allow: "GET,OPTIONS"

fixtures:
  empty: {}

  jfrog-releases:
    repository:
      - id: jfrog-cli
        description: ""
        type: LOCAL
        url: https://releases.jfrog.io/artifactory/jfrog-cli
        packageType: Generic
      - id: jfrog-debs
        description: Debian repository for JFrog debian files
        type: LOCAL
        url: https://releases.jfrog.io/artifactory/jfrog-debs
        packageType: Debian

    artifact:
      # The record's own internal id is the trailing path the greedy route
      # parameter captures -- no leading slash, since the previous segment's
      # own slash is the delimiter, not part of the value. The "path" field
      # below is the separate, real value Artifactory's own API answers
      # with, leading slash included.
      - id: v2/2.119.0/jfrog-cli-linux-amd64/jfrog
        repo: jfrog-cli
        path: /v2/2.119.0/jfrog-cli-linux-amd64/jfrog
        created: "2026-08-07T10:35:26.917Z"
        createdBy: "jfrt@01e3ya3k8g46eq0x48dtzs1nym"
        lastModified: "2026-08-07T10:35:26.917Z"
        modifiedBy: "jfrt@01e3ya3k8g46eq0x48dtzs1nym"
        lastUpdated: "2026-08-07T10:35:26.938Z"
        downloadUri: https://releases.jfrog.io/artifactory/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/jfrog
        mimeType: application/octet-stream
        size: "70338693"
        sha1: 2de2b6861cd1697dc8ad9d0361fde7949fbc8fa5
        md5: dccc223d86284f6844062f3df2863d0b
        sha256: ad2c80bceaea1ad0460997935eb55af2cf678aa3a159a1c4e3ea09e50cf39236
        uri: https://releases.jfrog.io/artifactory/api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/jfrog

conformance:
  - name: no credential at all is refused with the generic sentence
    source: https://releases.jfrog.io/artifactory/api/security/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repositories
    expect:
      status: 401
      body:
        "errors[0].status": 401
        "errors[0].message": Unauthorized

  - name: and so does an empty bearer value, the same as sending none
    # "Authorization: Bearer " with nothing after it. Somebody sent that,
    # and Artifactory answers it identically to the absent case above --
    # see the header for the contrast with this format's usual assumption.
    source: https://releases.jfrog.io/artifactory/api/security/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repositories
      headers:
        Authorization: "Bearer "
    expect:
      status: 401
      body:
        "errors[0].message": Unauthorized

  - name: a present, well-formed, wrong token gets its own sentence
    source: https://releases.jfrog.io/artifactory/api/security/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/repositories
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        "errors[0].status": 401
        "errors[0].message": Props Authentication Token not found

  - name: a wrong method on a real endpoint is refused before any credential, with its own Allow set
    source: https://releases.jfrog.io/artifactory/api/repositories
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/repositories
    expect:
      status: 405
      headers:
        Allow: "GET,OPTIONS"
      body:
        "errors[0].status": 405
        "errors[0].message": Method Not Allowed

  - name: a repository lists as a bare array with its key as the identifier
    source: https://releases.jfrog.io/artifactory/api/repositories
    verified: "2026-09-01"
    fixture: jfrog-releases
    request:
      method: GET
      path: /api/repositories
      headers:
        Authorization: Bearer cauldron.artifactory.identity.token.0000000000
    expect:
      status: 200
      body:
        "[0].key": jfrog-cli
        "[0].type": LOCAL
        "[0].packageType": Generic
        "[1].key": jfrog-debs
        "[1].packageType": Debian

  - name: a real file's checksums are pinned three separate ways in this Recipe and were watched in two
    # sha1, md5 and sha256 are the exact bytes releases.jfrog.io answered
    # with for this file's storage info; the same three values arrived a
    # second time as X-Checksum-Sha1/Md5/Sha256 response headers on a plain
    # GET of the file itself (not separately modelled as a route here).
    source: https://releases.jfrog.io/artifactory/api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/jfrog
    verified: "2026-09-01"
    fixture: jfrog-releases
    request:
      method: GET
      path: /api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/jfrog
      headers:
        Authorization: Bearer cauldron.artifactory.identity.token.0000000000
    expect:
      status: 200
      body:
        repo: jfrog-cli
        # A JSON string, not a bare number -- see the header.
        size: "70338693"
        mimeType: application/octet-stream
        "checksums.sha1": 2de2b6861cd1697dc8ad9d0361fde7949fbc8fa5
        "checksums.sha256": ad2c80bceaea1ad0460997935eb55af2cf678aa3a159a1c4e3ea09e50cf39236

  - name: a file that is not there answers naming "Unable to find item", not the download path's own sentence
    source: https://releases.jfrog.io/artifactory/api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/nope-not-real
    verified: "2026-09-01"
    fixture: jfrog-releases
    request:
      method: GET
      path: /api/storage/jfrog-cli/v2/2.119.0/jfrog-cli-linux-amd64/nope-not-real
      headers:
        Authorization: Bearer cauldron.artifactory.identity.token.0000000000
    expect:
      status: 404
      body:
        "errors[0].status": 404
        "errors[0].message": Unable to find item
