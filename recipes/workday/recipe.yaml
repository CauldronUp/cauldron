# Workday Recipe for Cauldron
#
# The premise this Recipe was assigned to check was that nothing at
# api.workday.com would answer at all -- Workday's real integration surface
# is per-tenant, reached at a customer's own <tenant>.workday.com host under
# /ccx/api/{service}/{version}/{tenant}/{endpoint} (Workday's own public REST
# API directory, community.workday.com/sites/default/files/file-hosting/restapi/,
# confirms the /ccx/api shape but is itself a client-rendered app with no
# fetchable index of paths behind it -- this Recipe tried a handful of
# guessed JSON/OpenAPI locations under it and every one 404d). That premise
# was half right. api.workday.com is real:
#
#   GET  /                          -> 404 {"error":"Not Found"}
#   GET  /common/v1                 -> 401 {"error":"Unauthorized"}
#   GET  /common/v1/workers         -> 401 (any credential shape, any method)
#   GET  /staffing/v1               -> 401, identical shape
#   GET  /totally/bogus/xyz         -> 404 {"error":"Not Found"}
#
# every one of those struck live, and wd-common-request-id on every response
# is Workday's own edge, not a parked domain or a generic Cloudflare 404. So
# api.workday.com exists, is reachable with no tenant named anywhere in the
# request, and answers Bearer-token 401s for two path prefixes that match
# names in Workday's own service catalogue -- Common and Staffing, the ones
# this batch was asked to look for. What it will not do, with no credential
# this Recipe has ever held, is say anything about a worker.
#
# The routing order is exactly Fireworks' "route resolved, then the
# credential, method never mind" -- with the method half genuinely absent
# rather than merely unobserved. Struck live, no credential:
#
#   GET     /common/v1/workers   -> 401
#   POST    /common/v1/workers   -> 401
#   PATCH   /common/v1/workers   -> 401
#   OPTIONS /common/v1/workers   -> 401
#
# every method on a recognised prefix answers the identical 401, never a 405
# with an Allow header. /totally/bogus/xyz -- a path under no recognised
# service name -- answers 404 regardless of method, and /common (the prefix
# alone, no version, no resource) still 401s, so it is the *prefix* being
# recognised that flips the answer from 404 to 401, not the full path and not
# the method. Cauldron's auth.after_routing exists for exactly this ordering
# in the other direction (Fireworks' unrouted-404-and-wrong-method-405), but
# it 405s a matched-path/wrong-method request unconditionally once declared
# -- see internal/runtime/handler.go -- and this host has never once answered
# 405 to anything this Recipe sent it. Declaring after_routing here would
# assert a status code this Recipe never observed, so it is left unset: the
# default (checked first, unconditionally) is what every case below actually
# exercises, and the prefix-recognised-before-credential behaviour above is
# recorded in this header rather than forced into a case, the same call
# together/recipe.yaml makes for its own unrouted-path finding.
#
# Every credential shape this Recipe tried against a recognised prefix
# answered the identical body:
#
#   (no header at all)                       -> {"error":"Unauthorized"}
#   Authorization: Bearer junktoken12345     -> identical
#   Authorization: junktoken12345 (no scheme)-> identical
#   HTTP Basic, junk:junk                    -> identical
#
# one message for every shape, www-authenticate: Bearer on all of them
# (no realm, unlike Rippling's Bearer realm="api" on the same kind of
# gateway) and none on the two 404s. No absent_error, malformed_error or
# rejected_error is declared below for the same reason Rippling's is not:
# nothing this Recipe sent ever produced a second sentence to name.
#
# The question this whole batch exists to answer -- does a terminated
# employee still appear in a default listing, and can a caller tell
# "terminated" from "never existed" -- is unanswerable from what is reachable
# here. Workday's Worker resource, its terminate/status fields, and the
# per-tenant OAuth2 client-credentials token that would be needed to see any
# of it are not things this generic gateway will hand over to an unauthenticated
# caller, and Workday's REST-vs-SOAP split means even a real tenant may not
# expose worker status through this surface at all -- third-party
# integration guides describe REST coverage of Staffing (workers,
# organizations, supervisory hierarchy) as partial, with SOAP remaining the
# primary surface for HR data, but none of that is Workday's own worked
# example and none of it is asserted below. A small true Recipe beats a
# large guessed one: this one models the gateway that is actually reachable
# and says nothing about a worker.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No resource, no fixture beyond "empty", and no 200 anywhere in this
#     Recipe. Nothing under api.workday.com answered with anything but 401
#     or 404 to any request this Recipe was able to construct, and a
#     per-tenant OAuth2 client-credentials token is required to get further
#     -- this Recipe never obtained one and never will without a real
#     Workday customer's tenant.
#   - SOAP is not modelled at all. Workday's own HR and Staffing operations
#     lean on SOAP more than REST per every third-party guide this Recipe
#     read, and Cauldron emulates HTTP/JSON APIs, not WSDL-described SOAP
#     services.
#   - Every route below is error-only (method + path + error, no resource,
#     no operation) -- see recipe.go's everyRouteIsRaw: a Recipe whose every
#     route names an error rather than a resource owes no resource
#     declaration, and this one has nothing honest to put in one.
#
# The key below is a fixture and belongs to no tenant.

recipe: workday
capability: hr
version: 0.1.0

upstream:
  api: v1
  docs: https://community.workday.com/sites/default/files/file-hosting/restapi/index.html

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-workday-fixture-token-0000000000000000

responses:
  error:
    style: flat
    message_field: error
    code_field: "-"
    type_field: "-"

routes:
  - method: GET
    path: /common/v1/workers
    error: authentication_error

  - method: POST
    path: /common/v1/workers
    error: authentication_error

  - method: GET
    path: /staffing/v1/workers
    error: authentication_error

errors:
  authentication_error:
    status: 401
    message_field: error
    message: "Unauthorized"
    headers:
      www-authenticate: Bearer

fixtures:
  empty: {}

conformance:
  - name: no credential at all, on the Common service
    source: https://api.workday.com/common/v1/workers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /common/v1/workers
    expect:
      status: 401
      headers:
        Content-Type: application/json
        www-authenticate: Bearer
      body:
        error: Unauthorized

  - name: a wrong bearer token answers the identical body
    source: https://api.workday.com/common/v1/workers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /common/v1/workers
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: a header with no scheme is refused the same way
    source: https://api.workday.com/common/v1/workers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /common/v1/workers
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: the Staffing service answers the identical shape
    # A second top-level service prefix, struck to prove this is a gateway
    # policy rather than something specific to /common.
    source: https://api.workday.com/staffing/v1/workers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /staffing/v1/workers
    expect:
      status: 401
      body:
        error: Unauthorized

  - name: a wrong method on a recognised prefix is still refused for its credential, never a 405
    # POST struck live with no credential at all. No Allow header, no 405,
    # anywhere this Recipe tried -- see the header.
    source: https://api.workday.com/common/v1/workers
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /common/v1/workers
    expect:
      status: 401
      body:
        error: Unauthorized
