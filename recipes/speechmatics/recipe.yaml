# Speechmatics Batch Recipe for Cauldron
#
# The job listing, read from the Speechmatics documentation and from
# speechmatics-python's own batch client, and struck live on 2026-09-13 with no
# key, with a wrong bearer token, on a path that does not exist, with a method
# the path does not take, on the previous major version, and on the root.
#
# **The refusal never reaches the application.** Every 401 is nginx's default
# error page:
#
#   <html>
#   <head><title>401 Authorization Required</title></head>
#   <body>
#   <center><h1>401 Authorization Required</h1></center>
#   <hr><center>nginx</center>
#   </body>
#   </html>
#
# `Content-Type: text/html`, from a JSON API; the server software named in the
# body; no `WWW-Authenticate` header; and "Authorization Required", which is
# nginx's wording for the status the specification calls Unauthorized. A client
# calling `.json()` on a wrong key throws instead of reporting it.
#
# **The 404 is JSON, and it is served as HTML.**
#
#   GET /v2/cauldron-nope
#   404  Content-Type: text/html
#   {"code":404, "details": "path not found"}
#
# Valid JSON, declared `text/html` -- so a client that trusts the content type
# will not parse it and one that trusts the body will. Its spacing is
# hand-written: a space after the comma and after the second colon, none after
# the first.
#
# **So one API answers two failures in two formats, and neither is the one it
# announces.** The 401 is HTML declared HTML; the 404 is JSON declared HTML;
# the success is JSON declared JSON.
#
# **The previous major version is a missing path.** `/v1/jobs` answers the same
# `path not found` as a route that never existed -- no Gone, no upgrade
# sentence, nothing naming a v2.
#
# **A wrong verb is answered by the credential gate.** `PUT /v2/jobs` gets the
# nginx 401, while an unrouted path gets the JSON 404 with no key sent -- so the
# path is resolved before the credential and the method is not.
#
# **The listing takes no parameters, and silently truncates.**
# `speechmatics-python`'s `list_jobs()` takes no arguments, and its docstring
# says it "Lists last 100 jobs within 7 days associated with auth_token for the
# SaaS or all of the jobs for the batch appliance". So the same call returns a
# capped list from the cloud and an uncapped one from the appliance, with
# nothing in the response saying which, no parameter to widen it, and no field
# that says anything was left out.
#
# **A single job and a list of jobs arrive under different keys.** The listing
# is `{"jobs": [...]}` and one job is `{"job": {...}}`, so the wrapper changes
# with the cardinality and code cannot read both the same way.
#
# Also pinned: `duration` is a bare number, documented in seconds nowhere on the
# record; `id` is ten characters of lowercase alphanumeric with no prefix and no
# format; the root of the API host answers `200` with a styled HTML page titled
# "Speechmatics API v2"; and the SDK's own note about the cap beside it warns of
# "rate-limitting at the API end for over-use".

recipe: speechmatics
capability: ai
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.speechmatics.com/speech-to-text/batch

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nspeechmat1csf1xturekey00
  # One page for all three, and the application never sees the request.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized
  # The path is resolved first: an unrouted path 404s with no key at all.
  after_routing: true

responses:
  list:
    style: wrapped
    key: jobs
  resource:
    # A different key for one of the same thing.
    style: wrapped
    key: job

resources:
  job:
    id:
      field: id
      style: opaque
      length: 10
    fields:
      status:
        type: string
      created_at:
        type: string
      data_name:
        type: string
      # A number. Seconds, said nowhere on the record.
      duration:
        type: integer
      config:
        type: map

routes:
  # The API host's front door is a web page.
  - method: GET
    path: /
    public: true
    raw:
      content_type: text/html
      text: "<html> <head> <title>Speechmatics API v2</title> </head> <body> <div id=\"main\"><p>Speechmatics API v2</p></div> </body> </html>"

  - method: GET
    path: /v2/jobs
    resource: job
    operation: list
    # No page, no limit, no filter: list_jobs() takes no arguments.
    pagination:
      style: none

  - method: GET
    path: /v2/jobs/{id}
    resource: job
    operation: get
    not_found: job_missing

errors:
  unauthorized:
    status: 401
    style: text
    message: "<html>\n<head><title>401 Authorization Required</title></head>\n<body>\n<center><h1>401 Authorization Required</h1></center>\n<hr><center>nginx</center>\n</body>\n</html>\n"
    headers:
      # From a JSON API, and the server software is in the body.
      Content-Type: text/html
    # And no WWW-Authenticate, which RFC 9110 says a 401 MUST carry.

  unknown_route:
    status: 404
    # JSON, spacing and all, served as HTML.
    style: text
    message: '{"code":404, "details": "path not found"}'
    headers:
      Content-Type: text/html

  # A verb the path does not take is answered by the credential gate.
  method_not_allowed:
    status: 401
    style: text
    message: "<html>\n<head><title>401 Authorization Required</title></head>\n<body>\n<center><h1>401 Authorization Required</h1></center>\n<hr><center>nginx</center>\n</body>\n</html>\n"
    headers:
      Content-Type: text/html

  # Not observed: reaching it needs a real key. The provider's own 404 shape
  # with the sentence its documentation uses, and the README says so.
  job_missing:
    status: 404
    style: text
    message: '{"code":404, "details": "job not found"}'
    headers:
      Content-Type: text/html

fixtures:
  empty:
    job: []

  jobs:
    job:
      - id: yjbmf9kqub
        status: running
        created_at: "2026-09-11T17:50:54.113Z"
        data_name: example.wav
        # Seconds.
        duration: 275
        config:
          type: transcription
          transcription_config:
            language: en
            additional_vocab: null
            channel_diarization_labels: null
          notification_config: null
      - id: p2xk4wd8ra
        status: done
        created_at: "2026-09-12T08:02:19.004Z"
        data_name: board-meeting.mp3
        duration: 4820
        config:
          type: transcription
          transcription_config:
            language: en
            additional_vocab: null
            channel_diarization_labels: null
          notification_config: null

conformance:
  - name: the refusal never reaches the application
    source: https://asr.api.speechmatics.com/v2/jobs
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: text/html
      # nginx's default page, with the server software in it.
      body_matches: '[\s\S]*<hr><center>nginx</center>[\s\S]*'
      absent_headers:
        # RFC 9110 says a 401 MUST send this.
        - WWW-Authenticate

  - name: and a wrong token gets the same page
    source: https://asr.api.speechmatics.com/v2/jobs
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer notarealkey"
    expect:
      status: 401
      # "Authorization Required", for the status called Unauthorized.
      body_matches: '[\s\S]*<title>401 Authorization Required</title>[\s\S]*'

  - name: a path that does not exist is json declared as html
    source: https://asr.api.speechmatics.com/v2/cauldron-nope
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: GET
      path: /v2/cauldron-nope
      headers: {}
    expect:
      status: 404
      headers:
        # Valid JSON, announced as HTML.
        Content-Type: text/html
      # The spacing is the provider's own.
      body_matches: '\A\{"code":404, "details": "path not found"\}\z'

  - name: and the previous major version is one of those paths
    source: https://asr.api.speechmatics.com/v1/jobs
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: GET
      path: /v1/jobs
      headers: {}
    expect:
      status: 404
      # No Gone, no upgrade sentence, nothing naming v2.
      body_matches: '\A\{"code":404, "details": "path not found"\}\z'

  - name: a wrong verb is answered by the credential gate instead
    source: https://asr.api.speechmatics.com/v2/jobs
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: PUT
      path: /v2/jobs
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: text/html
      body_matches: '[\s\S]*401 Authorization Required[\s\S]*'

  - name: the front door of the api host is a web page
    source: https://asr.api.speechmatics.com/
    verified: "2026-09-13"
    fixture: jobs
    request:
      method: GET
      path: /
      headers: {}
    expect:
      status: 200
      headers:
        Content-Type: text/html
      body_matches: '[\s\S]*<title>Speechmatics API v2</title>[\s\S]*'

  - name: the listing takes no parameters at all
    source: https://github.com/speechmatics/speechmatics-python
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0nspeechmat1csf1xturekey00"
    expect:
      status: 200
      body:
        # "Lists last 100 jobs within 7 days … or all of the jobs for the
        # batch appliance", and nothing here says which happened.
        'jobs[0].id': yjbmf9kqub
        'jobs[0].status': running
        'jobs[0].data_name': example.wav
        'jobs[1].id': p2xk4wd8ra
        'jobs[1].status': done
      absent:
        - total
        - next
        - truncated

  - name: a duration is a bare number and a timestamp is a string
    source: https://docs.speechmatics.com/speech-to-text/batch
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0nspeechmat1csf1xturekey00"
    expect:
      status: 200
      body:
        # Seconds, said nowhere on the record.
        'jobs[0].duration': 275
        'jobs[1].duration': 4820
        'jobs[0].created_at': "2026-09-11T17:50:54.113Z"
        'jobs[0].config.type': transcription
        'jobs[0].config.transcription_config.language': en
        'jobs[0].config.transcription_config.additional_vocab': null
        'jobs[0].config.notification_config': null

  - name: one job arrives under a different key than many
    source: https://docs.speechmatics.com/speech-to-text/batch
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs/yjbmf9kqub
      headers:
        Authorization: "Bearer cauldr0nspeechmat1csf1xturekey00"
    expect:
      status: 200
      body:
        # job, where the listing said jobs.
        'job.id': yjbmf9kqub
        'job.status': running
        'job.duration': 275
        'job.data_name': example.wav

  - name: a job that is not there keeps the json-as-html shape
    source: https://asr.api.speechmatics.com/v2/jobs
    fixture: jobs
    request:
      method: GET
      path: /v2/jobs/zzzzzzzzzz
      headers:
        Authorization: "Bearer cauldr0nspeechmat1csf1xturekey00"
    expect:
      status: 404
      headers:
        Content-Type: text/html
      body_matches: '\A\{"code":404, "details": "job not found"\}\z'

  - name: an account with no jobs is an empty array under jobs
    source: https://github.com/speechmatics/speechmatics-python
    fixture: empty
    request:
      method: GET
      path: /v2/jobs
      headers:
        Authorization: "Bearer cauldr0nspeechmat1csf1xturekey00"
    expect:
      status: 200
      body:
        jobs: []
