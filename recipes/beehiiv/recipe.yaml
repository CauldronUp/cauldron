# beehiiv Recipe for Cauldron
#
# Written against beehiiv's API reference at developers.beehiiv.com and struck
# live against api.beehiiv.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **"The api key is not valid" is the answer to sending no api key.** Struck
# live, both ways, byte-identical:
#
#   GET /v2/publications                    (no credential)
#   GET /v2/publications                    Authorization: Bearer notreal
#   401 {"status":401,"statusText":"unauthorized",
#        "errors":[{"message":"The api key is not valid","code":"INVALID_API_KEY"}]}
#
# The third provider in this collection to describe the wrong failure in that
# exact way, after [loops](../loops) and [helicone](../helicone). It is the
# commonest mistake in an error message: the sentence is written for the case
# somebody was thinking about, and then reused for the case they were not.
#
# The `code` is `INVALID_API_KEY`, which repeats the mistake in the field a
# client branches on -- so both halves of the response agree, and both are
# wrong about half the requests that produce them.
#
# **The status appears three times.** `401` as the HTTP status, `401` again in
# `status`, and `"unauthorized"` in `statusText` -- the reason phrase,
# lower-cased, which is the same choice [terraformcloud](../terraformcloud)
# makes with its `title`. Two of the three are derivable from the first.
#
# **The `errors` array is the good part.** Objects rather than strings, each
# with a `message` and a `code`, so a request that fails validation several
# ways at once gets an entry per way and a client can show all of them. That is
# the shape [gong](../gong) reaches for and misses by putting strings in it, and
# the one [honeybadger](../honeybadger) misses by putting a string where the
# array goes.
#
# **An unknown path is an empty HTML response.** 404, `text/html`, zero bytes.
# So the failure a client meets while getting a URL wrong has no body at all,
# and `.json()` throws on nothing rather than on a page.

recipe: beehiiv
capability: email
version: 0.1.0

upstream:
  api: v2
  docs: https://developers.beehiiv.com/api-reference/publications/index
  # No spec: beehiiv publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0nbeehiivf1xturekey00000000000000000000
  # One response for both, and it describes the second.
  absent_error: invalid_api_key
  rejected_error: invalid_api_key

responses:
  list:
    style: wrapped
    key: data
    fields:
      limit: 10
      page: 1
      total_results: 2
      total_pages: 1
  error:
    style: list
    key: errors
    message_field: message
    code_field: code
    code_type: string
    type_field: "-"
    fields:
      # Beside the array: the status twice more, once as a number and once as
      # the reason phrase in lower case.
      status: 401
      statusText: unauthorized

resources:
  publication:
    id:
      field: id
      style: prefixed
      prefix: "pub_"
    fields:
      name:
        type: string
      organization_name:
        type: string
      referral_program_enabled:
        type: boolean
        default: false
      created:
        type: timestamp

routes:
  - method: GET
    path: /v2/publications
    resource: publication
    operation: list
    pagination:
      style: page
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: page

errors:
  invalid_api_key:
    status: 401
    code: INVALID_API_KEY
    # Struck live for a request carrying no key at all, which is what makes
    # the sentence wrong about half the requests that produce it.
    message: "The api key is not valid"

fixtures:
  empty:
    publication: []

  account:
    publication:
      - id: pub_8f1c2a67-3b95-4e08-91d7-6c0a54e2b3f9
        name: The Cauldron Weekly
        organization_name: Cauldron
        referral_program_enabled: true
        created: 1780272000
      - id: pub_2d7e9c31-6a48-4f2b-8057-b93e1d6a4c72
        name: Field Notes
        organization_name: Cauldron
        referral_program_enabled: false
        created: 1786089600

conformance:
  - name: the message describes the other failure
    source: https://api.beehiiv.com/v2/publications
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers: {}
    expect:
      status: 401
      body:
        # Struck live with no Authorization header at all. The third provider
        # here to write this sentence for a request that carried no key.
        'errors[0].message': "The api key is not valid"
        'errors[0].code': INVALID_API_KEY

  - name: a wrong key is byte-identical to none
    source: https://api.beehiiv.com/v2/publications
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        'errors[0].message': "The api key is not valid"
        'errors[0].code': INVALID_API_KEY

  - name: the status arrives three times
    source: https://api.beehiiv.com/v2/publications
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers: {}
    expect:
      status: 401
      body:
        # As the HTTP status, as a number in the body, and as the reason
        # phrase lower-cased. Two of the three are derivable from the first.
        status: 401
        statusText: unauthorized

  - name: the errors array holds objects rather than strings
    source: https://api.beehiiv.com/v2/publications
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers: {}
    expect:
      status: 401
      body:
        # A message and a code per entry, so a request failing validation
        # several ways gets an entry per way and a client can show all of
        # them. The shape Gong reaches for with strings and Honeybadger
        # misses entirely.
        'errors[0].code': INVALID_API_KEY

  - name: publications are wrapped in data with prefixed ids
    source: https://developers.beehiiv.com/api-reference/publications/index
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer cauldr0nbeehiivf1xturekey00000000000000000000"
    expect:
      status: 200
      body:
        # A prefix and then a UUID, so the identifier is longer than a UUID
        # and will not parse as one.
        'data[0].id': pub_8f1c2a67-3b95-4e08-91d7-6c0a54e2b3f9
        'data[0].name': The Cauldron Weekly

  - name: the creation time is seconds rather than milliseconds
    source: https://developers.beehiiv.com/api-reference/publications/index
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer cauldr0nbeehiivf1xturekey00000000000000000000"
    expect:
      status: 200
      body:
        # Ten digits, in a field called created rather than created_at, so
        # neither the name nor the value says which unit it is in.
        'data[0].created': 1780272000

  - name: two publications share an organisation
    source: https://developers.beehiiv.com/api-reference/publications/index
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer cauldr0nbeehiivf1xturekey00000000000000000000"
    expect:
      status: 200
      body:
        # organization_name is a name and not an id, so two organisations
        # called the same thing are one value and the field cannot be joined
        # to anything.
        'data[1].organization_name': Cauldron
        'data[1].referral_program_enabled': false

  - name: a listing reports four numbers about itself
    source: https://developers.beehiiv.com/api-reference/publications/index
    fixture: account
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer cauldr0nbeehiivf1xturekey00000000000000000000"
      query:
        limit: "10"
        page: "1"
    expect:
      status: 200
      body:
        # limit, page, total_results and total_pages, all at the top level
        # beside data rather than in a meta object -- so a record called
        # "page" would collide with the envelope.
        limit: 10
        page: 1
        total_results: 2
        total_pages: 1

  - name: an account with no publications answers an empty array
    source: https://developers.beehiiv.com/api-reference/publications/index
    fixture: empty
    request:
      method: GET
      path: /v2/publications
      headers:
        Authorization: "Bearer cauldr0nbeehiivf1xturekey00000000000000000000"
    expect:
      status: 200
      body:
        data: []
