# Ory Network Recipe for Cauldron
#
# This is the hosted product, not kratos/recipe.yaml's self-hosted software --
# and the honest answer to "does it need its own Recipe" turned out to be
# "barely." Ory Network's own combined OpenAPI description settles what wire
# it speaks: fetched live from the URL upstream.spec below, its info block
# reads "Documentation for all public and administrative Ory APIs.
# Administrative APIs can only be accessed with a valid Personal Access
# Token. Public APIs are mostly used in browsers" -- and its whoami operation
# is word-for-word the one kratos/recipe.yaml already pins, down to the same
# session_inactive id. Ory Network is Kratos and Hydra behind one gateway,
# not a third piece of software with its own opinions. What genuinely differs
# is the gateway, not the API behind it, so this Recipe stays small and
# reports the gateway rather than re-declaring the software.
#
# The one host, twice over. Ory's own servers block names the pattern this
# Recipe was checked against directly: `https://{project_slug}.projects.
# oryapis.com/`, default project_slug "playground" -- the exact host every
# case below struck. Self-hosted Kratos splits public and admin across two
# ports; kratos/recipe.yaml says so and models one host as a known
# simplification. Ory Network's single host is not a simplification. It is
# the real thing: public self-service routes take no Ory Network API key at
# all (a session cookie or token instead, which an anonymous caller has
# none of), and admin routes take one of two token types -- a Personal
# Access Token (`oryAccessToken`) or a workspace key (`oryWorkspaceApiKey`)
# -- named as separate security schemes in the same spec. That makes a
# fourth arrangement in this collection, worth setting beside the other
# three by name: Mezmo splits credential schemes across two hostnames that
# do not overlap at all; Census keeps one host and lets the HTTP method
# decide whether a credential is even checked; Ory Network keeps one host
# and lets which *routes* a caller is asking for decide which of two
# disjoint credential families is required, with the public half requiring
# none. Nobody in this collection resolves the two halves in the same
# order, and Ory Network is the only one of the four where "no credential"
# is a legitimate answer for half of its own surface.
#
# The sharpest thing this Recipe carries was struck live, not read: an
# unmatched path on the playground project answers a clean, byte-identical
# 155-byte JSON 404 --
#
#   {"error":{"code":404,"details":{"ruleId":"6176b3cb"},"message":
#   "Invalid path","reason":"No resource found using the specified path.",
#   "status":"Not Found"}}
#
# -- checked against four unrelated paths (the bare root, /health/alive,
# /relationships, and the literal path this Recipe declares below) and
# identical every time, ruleId included. That is Ory's own edge answering,
# and its shape is the same nested error.code/message/reason/status envelope
# Kratos's own software uses elsewhere in this collection -- proof the
# convention holds even at the layer in front of the identity software,
# not only inside it. It also settles something kratos/recipe.yaml could
# only guess at: that Recipe's own `code` fields are quoted strings ("404",
# "410") because Cauldron's Code field is typed as a Go string, and Kratos's
# own genericError schema documents code as `type: integer`. This Recipe's
# live 404 confirms the schema was right and the string was Cauldron's
# limitation, not a claim either Recipe makes about the wire -- so
# route_not_found below carries code as a bare number specifically to
# reproduce what was actually seen, not to correct its sibling.
#
# Every real route answers differently, and this Recipe does not attempt to
# reproduce it. GET /sessions/whoami, GET /.well-known/openid-configuration,
# GET /self-service/login/browser and GET /admin/identities were all struck
# live with no credential at all, and all five answered a Cloudflare managed
# challenge -- 403, `Cf-Mitigated: challenge`, a "Just a moment..." page
# built for a JS-executing browser -- before Ory's own software ever saw the
# request. The same probes with an Accept: application/json header and a
# browser User-Agent changed nothing. That is the live answer to this
# collection's own question -- what does an anonymous caller of whoami
# actually get -- and today, on this project, it is not 401. It is a
# challenge page, and per this Recipe's own standing instruction against
# defeating anti-bot protection, nothing here attempts to pass it. The 401
# session_inactive shape wired below is carried over from what Ory's spec
# documents and kratos/recipe.yaml already pins, not re-observed, and it
# carries no verified date for exactly that reason.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The Cloudflare challenge itself is not modelled. Its body is
#     non-deterministic (a per-request nonce and Ray ID) and it is not Ory's
#     own answer -- it is this one project's WAF configuration, which
#     unmatched paths on the same host do not even trigger. Modelling it
#     would describe Cloudflare, not the identity provider.
#   - The session object returned on a match is intentionally thin --
#     active and one identity field -- rather than the fuller shape
#     kratos/recipe.yaml already carries in full. Repeating that detail
#     here a second time, unverified both times, would read as independent
#     confirmation of something only ever read once.
#   - Only one literal unmatched path is declared, per the same caveat
#     census/recipe.yaml states for its own equivalent case: it is not a
#     stand-in for every path this Recipe did not try, only the one it did.
#   - Ory Permissions has no reachable public instance and is absent
#     entirely, matching this collection's own prior assessment of Ory
#     Network as a whole.
#   - Admin routes (Personal Access Token / workspace key) are not modelled.
#     Both credential families are documented above rather than routed,
#     because no case exercising them could be struck without an account.
#
# The key below is a fixture and belongs to no project.

recipe: ory
capability: auth
version: 0.1.0

upstream:
  api: Cloud
  docs: https://www.ory.com/docs/reference/api
  spec: https://raw.githubusercontent.com/ory/docs/master/docs/reference/api.json
  spec_hash: 95e8053ebea0263a2299195a29e731aacddd67a0b5aaf24d650c58067bcbdd58
  spec_seen: "2026-09-01"

auth:
  # None at the Recipe level, on purpose, for the same reason
  # census/recipe.yaml gives: the live host's own order -- an unmatched path
  # needs no credential to reach a real 404, and Cauldron's default
  # auth-before-routing check would 401 it instead. The one route that does
  # need a credential carries its own matches_header below.
  scheme: none

responses:
  error:
    style: nested
    key: error
    code_field: code
    message_field: message
    # Disabled recipe-wide rather than per error, because Cauldron's
    # per-error overrides do not reach type_field -- see the header's note
    # on route_not_found. session_inactive's error.id is declared in its own
    # fields block below instead, which reaches the wire the same way.
    type_field: "-"

resources:
  # Intentionally thin -- see the header for why this does not restate the
  # fuller session kratos/recipe.yaml already carries.
  session:
    collection: sessions
    id:
      style: uuid
    fields:
      active:
        type: boolean
        default: true
      identity_id:
        type: string
        in: identity
        as: id

routes:
  # Answers about whoever the token belongs to. Nothing in the request names
  # a session -- see kratos/recipe.yaml for the same shape struck the same
  # way, and this Recipe's header for why it is not re-verified here.
  - method: GET
    path: /sessions/whoami
    resource: session
    operation: get
    id_from: auth
    matches_header:
      Authorization: Bearer cauldron-ory-network-session-fixture-0000000000

  - method: GET
    path: /sessions/whoami
    error: session_inactive

  # One literal unmatched path, struck live. See the header: it is not a
  # stand-in for every path this Recipe did not try.
  - method: GET
    path: /this-is-not-a-real-resource
    error: route_not_found

errors:
  # Documented, not re-observed today -- see the header for why. Kept
  # word-for-word what kratos/recipe.yaml already pins, because Ory Network
  # runs that same software behind its gateway.
  session_inactive:
    status: 401
    code: "401"
    message: "No active session was found in this request."
    fields:
      error:
        id: session_inactive
        reason: "No active session was found in this request."
        status: Unauthorized

  # Struck live, four separate paths, byte-identical every time -- see the
  # header. code_field is disabled here because this shape has none of
  # Kratos's quoted string code: the gateway's own error has no
  # machine-readable id at all, only an opaque ruleId nested under details,
  # and code arrives as the bare JSON number the schema always said it was.
  route_not_found:
    status: 404
    code_field: "-"
    message: "Invalid path"
    fields:
      error:
        code: 404
        reason: "No resource found using the specified path."
        status: "Not Found"
        details:
          ruleId: "6176b3cb"

fixtures:
  empty: {}

  one-project:
    session:
      - id: 2b6f1d84-0e57-4c93-a8b2-5f4d1c9e6073
        active: true
        identity_id: 4c8b3e70-2d19-45af-b6c1-7e0d9a5f3821

conformance:
  - name: an unmatched path needs no credential to reach a real 404
    # The routing layer's own answer, struck with no Authorization header at
    # all against a path this Recipe declares no route for besides this
    # error. Ory's own edge, not Cloudflare and not Kratos.
    source: https://playground.projects.oryapis.com/this-is-not-a-real-resource
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-resource
    expect:
      status: 404
      headers:
        Content-Type: application/json
      body:
        error.code: 404
        error.message: "Invalid path"
        error.reason: "No resource found using the specified path."
        error.status: "Not Found"
        error.details.ruleId: "6176b3cb"
      absent:
        - error.id

  - name: a second unmatched path confirms it is the routing layer, not a one-off
    source: https://playground.projects.oryapis.com/relationships
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /this-is-not-a-real-resource
    expect:
      status: 404
      body:
        error.code: 404
        error.details.ruleId: "6176b3cb"

  - name: whoami names no session and answers about the one credential's owner
    # Documented, not re-observed -- see the header. Cross-check against
    # kratos/recipe.yaml's identical case, struck the same way against the
    # same spec.
    source: https://raw.githubusercontent.com/ory/docs/master/docs/reference/api.json
    fixture: one-project
    request:
      method: GET
      path: /sessions/whoami
      headers:
        Authorization: Bearer cauldron-ory-network-session-fixture-0000000000
    expect:
      status: 200
      body:
        active: true
        identity.id: 4c8b3e70-2d19-45af-b6c1-7e0d9a5f3821

  - name: no session is 401 with a machine-readable id, not the challenge page a real anonymous caller gets today
    # See the header at length: the live answer for this exact request,
    # struck today with no credential, was a Cloudflare managed challenge,
    # not this. This is what Ory's own software answers once past it, per
    # the spec kratos/recipe.yaml also reads this from.
    source: https://raw.githubusercontent.com/ory/docs/master/docs/reference/api.json
    fixture: one-project
    request:
      method: GET
      path: /sessions/whoami
    expect:
      status: 401
      body:
        error.id: session_inactive
        error.message: "No active session was found in this request."
        error.status: Unauthorized
      absent:
        - message
        - id
