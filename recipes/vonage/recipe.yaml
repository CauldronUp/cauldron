# Vonage Recipe for Cauldron
#
# Vonage sends real messages to real handsets and charges for every one. There
# is no test mode on the SMS API: a test suite either spends money on each run
# or never exercises the send path at all. The failures that matter, an
# unroutable number, a spent balance, a message rejected by a carrier, arrive
# only in production and only on somebody else's network.
#
# Two things worth modelling exactly, and both are the kind of thing a
# well-behaved fake would tidy away:
#
#   1. Success is status "0", a string. In JavaScript and PHP that value is
#      falsy, so `if (message.status)` treats every successful send as a
#      failure and every failure as a success. Reproducing the string is the
#      whole point.
#   2. The field names are hyphenated: message-count, message-id,
#      remaining-balance. They cannot be reached with dot notation in most
#      languages, which is exactly the sort of thing a hand-written fake
#      silently renames.
#
# The credential shape needed no account, and struck live against
# rest.nexmo.com on 2026-09-05 it found two different provider APIs living
# in one Recipe, each with its own failure shape this file had never run.
# The SMS API (/sms/json) answers a credential failure as this file's own
# 200-status message-count envelope, with codes 2 (missing) and 4 (wrong)
# -- not the 401 and single sentence this file had claimed. The Account API
# (/account/numbers) answers something else again: RFC 7807 problem
# details, {type, title, detail}, on a 422 for an absent credential and a
# 401 for a present, wrong one -- the shape this file's authentication_error
# had actually been modelling, just at the wrong status with the wrong
# sentence. The two are now told apart with a per-route auth block on
# /account/numbers.
#
# /search/message could not be checked at all: every request to it,
# credentialed or not, answered a bare 404 from the same envoy gateway the
# other two hosts answer through, which reads as an endpoint this account's
# edge no longer routes rather than a credential question. Left as
# documentation, since nothing distinguishing could be observed.
#
# Keys below are fixtures, not secrets.

recipe: vonage
capability: sms
version: 0.1.0

upstream:
  api: "1"
  docs: https://developer.vonage.com/en/api/sms

auth:
  scheme: query
  param: api_key
  keys:
    - cauldron-api-key
  # Verified live against rest.nexmo.com 2026-09-05, on the SMS API
  # (/sms/json): a credential failure there is HTTP 200, not 401 -- the
  # legacy shape this Recipe's envelope already matches in field names, but
  # not in status, code or sentence. Neither verdict had ever been checked.
  absent_error: sms_missing_api_key
  rejected_error: sms_bad_credentials

responses:
  list:
    style: wrapped
    count_field: message-count
  error:
    style: flat
    code_field: status
    message_field: error-text
    # Verified live 2026-09-05: status inside a message is a JSON string
    # ("2", "4"), matching the resource's own status field a row up --
    # without this, the codes here that happen to be all digits render as
    # bare numbers instead.
    code_type: string

resources:
  message:
    collection: messages
    id:
      style: hex
      field: message-id
      length: 16
    fields:
      to:
        type: string
        required: true
      # A string zero. In JavaScript and PHP that is falsy, so
      # `if (message.status)` gets it exactly backwards on every send.
      status:
        type: string
        default: "0"
      # Money as a decimal string. Adding two of these as floats is how a
      # spend report drifts.
      remaining-balance:
        type: string
        default: "10.00000000"
      message-price:
        type: string
        default: "0.03330000"
      network:
        type: string
      # Only present when something went wrong, which is how a client can
      # tell a real failure from a status it did not recognise.
      error-text:
        type: string

  number:
    collection: numbers
    id:
      style: digits
      field: msisdn
      length: 12
    fields:
      country:
        type: string
        default: GB
      type:
        type: string
        default: mobile-lvn
      # Which features the number supports. Sending SMS from a voice-only
      # number fails at send time and nothing earlier says so.
      features:
        type: string
        default: SMS
      cost:
        type: string
        default: "1.00"

routes:
  - method: POST
    path: /sms/json
    resource: message
    operation: create

  # Verified live 2026-09-05: this route's own credential failures are RFC
  # 7807 problem details on a real HTTP status, not the SMS API's 200 with
  # an embedded code -- a different API under the same account, so it
  # names its own auth block rather than inheriting the Recipe-wide one.
  - method: GET
    path: /account/numbers
    resource: number
    operation: list
    auth:
      scheme: query
      param: api_key
      keys:
        - cauldron-api-key
      absent_error: numbers_missing_auth
      rejected_error: authentication_error
    pagination:
      # Read from Vonage's own Numbers API reference: the page size is size,
      # defaulting to ten and capped at a hundred, and the position is index,
      # a page number starting at one rather than an offset.
      #
      # A hundred was the cap written down as the default. Every page this
      # served was ten times the real one.
      style: page
      limit: 10
      max_limit: 100
      limit_param: size
      cursor_param: index
      first_page: 1

  - method: GET
    path: /search/message
    resource: message
    operation: list
    pagination:
      # Still unstated, and this is what was tried on 2026-09-05: the Numbers
      # API reference beside it gave size and index plainly, and the SMS
      # Search reference this route needs -- developer.vonage.com's
      # /en/api/sms-search -- answered 504 twice, with no other primary
      # source reachable. The parameter list is the retired SMS API's, which
      # is documented nowhere else Vonage still serves.
      #
      # So the number below is a page size with no name attached to it, which
      # is what the runtime will read `limit` for. That is a guess and it is
      # labelled as one rather than dressed up as a declaration.
      limit: 100

webhooks:
  # Vonage calls these delivery receipts and inbound message callbacks.
  events:
    - delivered
    - expired
    - failed
    - rejected
    - accepted
    - buffered
  signing:
    scheme: hmac-sha256
    header: Authorization
    secret: cauldron-signature-secret

errors:
  rate_limit:
    status: 429
    code: "1"
    message: Throttled
    headers:
      Retry-After: "1"

  # Verified live 2026-09-05, on the SMS API: a present, wrong api_key/
  # api_secret pair. Not 401 -- Vonage's own message-count envelope, at 200,
  # the shape every SMS send answers success or failure in.
  # message-count is not reproduced: a per-error style override reads the
  # envelope-level Fields from the Recipe-wide default rather than from
  # this entry, so a value declared here would land inside messages[0]
  # instead of beside it. Stated rather than served wrong.
  sms_bad_credentials:
    status: 200
    style: list
    key: messages
    code: "4"
    message: Bad Credentials

  # Verified the same day: no api_key at all. Same envelope, a different
  # code and sentence.
  sms_missing_api_key:
    status: 200
    style: list
    key: messages
    code: "2"
    message: Missing api_key

  # Verified live 2026-09-05, on the Account API (/account/numbers): a
  # completely different failure family from the SMS API above -- RFC 7807
  # problem details, on a real HTTP status. This is the one this Recipe's
  # single authentication_error had actually modelled, at the wrong status
  # and with the wrong sentence.
  authentication_error:
    status: 401
    style: flat
    message_field: detail
    code_field: title
    code: Unauthorized
    message: "You did not provide correct credentials."
    fields:
      type: "https://developer.nexmo.com/api-errors#unauthorized"

  # Verified the same day: no credential at all, on the Account API. A 422,
  # not a 401 -- and a third shape again from the two above.
  numbers_missing_auth:
    status: 422
    style: flat
    message_field: detail
    code_field: title
    code: Missing Auth
    message: "Auth header is required"
    fields:
      type: "https://developer.nexmo.com/api-errors#missing-auth"

  resource_missing:
    status: 404
    code: "8"
    message: "Not found: {detail}"

  parameter_missing:
    status: 400
    code: "2"
    message: "Missing mandatory parameter: {detail}"

  # The failures that only exist once a message reaches a real network, and
  # that a paid send is the only other way to see.
  insufficient_balance:
    status: 402
    code: "9"
    message: Partner quota violation

  illegal_number:
    status: 400
    code: "15"
    message: Illegal Sender Address, rejected by the destination network

  unroutable:
    status: 400
    code: "6"
    message: The number is unroutable on this network

  # A number that cannot send SMS at all, which fails at send time and
  # nothing earlier warns about.
  invalid_message_class:
    status: 400
    code: "12"
    message: The number does not support this message type

fixtures:
  empty: {}

  small-account:
    number:
      - id: "447700900001"
        country: GB
        type: mobile-lvn
        features: SMS
        cost: "1.00"
      - id: "447700900002"
        country: GB
        type: landline
        # Voice only. Sending SMS from this fails at send time and nothing
        # earlier says so.
        features: VOICE
        cost: "1.00"
      # A third record, so the paging case below has one to skip, one to
      # return, and one behind it to prove the page size stopped the page.
      # A copy of the record above under a fresh identifier: two already
      # established this collection holds more than one, so a third claims
      # nothing new about the provider.
      - id: '447700900003'
        country: GB
        type: landline
        features: VOICE
        cost: '1.00'
    message:
      - id: "0a00000000000001"
        to: "447700900123"
        # Success. A string zero, which is falsy in JavaScript and PHP.
        status: "0"
        network: "23410"
        message-price: "0.03330000"
        remaining-balance: "9.96670000"
      - id: "0a00000000000002"
        to: "447700900999"
        # Failure. The code is a different string, and error-text is present
        # only here.
        status: "6"
        error-text: The number is unroutable on this network
        remaining-balance: "9.96670000"

# Conformance cases, read from Vonage's SMS API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: success is the string zero
    source: https://developer.vonage.com/en/api/sms
    fixture: small-account
    request:
      method: GET
      path: /search/message
      query:
        api_key: cauldron-api-key
    expect:
      status: 200
      body:
        # A string, and zero. `if (message.status)` treats this successful
        # send as a failure and the failed one below as a success.
        messages[0].status: "0"
        messages[1].status: "6"

  - name: only a failed message carries error text
    source: https://developer.vonage.com/en/api/sms
    fixture: small-account
    request:
      method: GET
      path: /search/message
      query:
        api_key: cauldron-api-key
    expect:
      status: 200
      body:
        messages[1].error-text: The number is unroutable on this network
      # Its presence is how a client tells a real failure from a status it
      # did not recognise, so stamping one on the success would remove the
      # only reliable signal.
      absent:
        - messages[0].error-text

  - name: the field names are hyphenated
    source: https://developer.vonage.com/en/api/sms
    fixture: small-account
    request:
      method: GET
      path: /search/message
      query:
        api_key: cauldron-api-key
    expect:
      status: 200
      body:
        # Not reachable with dot notation in most languages, which is exactly
        # what a hand-written fake silently renames.
        message-count: 2
        messages[0].message-id: "0a00000000000001"
        messages[0].remaining-balance: "9.96670000"
      absent:
        - messages[0].id
        - message_count

  - name: money is a decimal string
    source: https://developer.vonage.com/en/api/sms
    fixture: small-account
    request:
      method: GET
      path: /search/message
      query:
        api_key: cauldron-api-key
    expect:
      status: 200
      body:
        # Adding two of these as floats is how a spend report drifts.
        messages[0].message-price: "0.03330000"
        messages[0].remaining-balance: "9.96670000"

  - name: a voice-only number cannot send SMS
    source: https://developer.vonage.com/en/api/numbers
    fixture: small-account
    request:
      method: GET
      path: /account/numbers
      query:
        api_key: cauldron-api-key
    expect:
      status: 200
      body:
        numbers[0].features: SMS
        # Sending from this one fails at send time, and nothing earlier in
        # the flow warns about it.
        numbers[1].features: VOICE
        numbers[1].msisdn: "447700900002"
      absent:
        - numbers[1].id

  - name: the credential travels in the query string
    # Used to assert the SMS API's {status, error-text} shape for a request
    # against the Account API. Struck live against rest.nexmo.com
    # 2026-09-05: /account/numbers answers RFC 7807 problem details, on a
    # 422 for no credential at all, not the shape or status this case had
    # claimed and never run.
    source: https://rest.nexmo.com/account/numbers
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      # Vonage puts the key in the URL, so it ends up in access logs. A
      # header-based fake would hide that.
      path: /account/numbers
    expect:
      status: 422
      body:
        title: Missing Auth
        detail: "Auth header is required"
        type: "https://developer.nexmo.com/api-errors#missing-auth"

  - name: a present, wrong credential on the Account API is a 401 with a different sentence
    source: https://rest.nexmo.com/account/numbers
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /account/numbers
      query:
        api_key: garbage
        api_secret: garbage
    expect:
      status: 401
      body:
        title: Unauthorized
        detail: "You did not provide correct credentials."
        type: "https://developer.nexmo.com/api-errors#unauthorized"

  - name: the SMS API answers a credential failure as a 200, not the Account API's shape
    source: https://rest.nexmo.com/sms/json
    verified: "2026-09-05"
    request:
      method: POST
      path: /sms/json
      form:
        to: "15551234567"
        from: Test
        text: hi
    expect:
      status: 200
      body:
        messages[0].status: "2"
        messages[0].error-text: "Missing api_key"

  - name: and a present, wrong credential on the SMS API is a different code, still 200
    source: https://rest.nexmo.com/sms/json
    verified: "2026-09-05"
    request:
      method: POST
      path: /sms/json
      query:
        api_key: garbage
        api_secret: garbage
      form:
        to: "15551234567"
        from: Test
        text: hi
    expect:
      status: 200
      body:
        messages[0].status: "4"
        messages[0].error-text: "Bad Credentials"

  - name: a send answers with the same message shape
    source: https://developer.vonage.com/en/api/sms
    fixture: empty
    request:
      method: POST
      path: /sms/json
      query:
        api_key: cauldron-api-key
      form:
        to: "447700900123"
    expect:
      status: 200
      body:
        status: "0"
      matches:
        message-id: '^[0-9a-f]{16}$'
      absent:
        - error-text
        - id

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # size=1 and index=2, which is a page number, and asserts the second
  # record came back on its own: one to skip, one to return, and a third
  # behind it to prove the size stopped the page.
  - name: "size and index are the two names this listing reads"
    source: "https://developer.vonage.com/en/api/numbers"
    fixture: small-account
    request:
      method: GET
      path: "/account/numbers"
      query:
        "api_key": "cauldron-api-key"
        "size": "1"
        "index": "2"
    expect:
      status: 200
      body:
        "numbers[0].msisdn": "447700900002"
      absent:
        - "numbers[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "page" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # size=1 and index=2, which is a page number, and asserts the second
  # record came back on its own: one to skip, one to return, and a third
  # behind it to prove the size stopped the page.
  - name: "size and index are the two names this listing reads on account numbers"
    source: "https://developer.vonage.com/en/api/numbers"
    fixture: small-account
    request:
      method: GET
      path: "/account/numbers"
      query:
        "api_key": "cauldron-api-key"
        "size": "1"
        "index": "2"
    expect:
      status: 200
      body:
        "numbers[0].msisdn": "447700900002"
      absent:
        - "numbers[1]"

  # The names. This Recipe declares 2 field(s) on a message that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a message carries the field names this Recipe declares"
    source: "https://developer.vonage.com/en/api/sms"
    fixture: small-account
    request:
      method: GET
      path: "/search/message"
      query:
        "api_key": "cauldron-api-key"
    expect:
      status: 200
      body:
        "messages[0].network": "23410"
        "messages[0].to": "447700900123"

  # The names. This Recipe declares 2 field(s) on a number that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a number carries the field names this Recipe declares"
    source: "https://developer.vonage.com/en/api/numbers"
    fixture: small-account
    request:
      method: GET
      path: "/account/numbers"
      query:
        "api_key": "cauldron-api-key"
    expect:
      status: 200
      body:
        "numbers[0].cost": "1.00"
        "numbers[0].country": "GB"

  # The names. This Recipe declares 1 field(s) on a number that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a number carries the field names this Recipe declares, and 1 more of them"
    source: "https://developer.vonage.com/en/api/numbers"
    fixture: small-account
    request:
      method: GET
      path: "/account/numbers"
      query:
        "api_key": "cauldron-api-key"
    expect:
      status: 200
      body:
        "numbers[0].type": "mobile-lvn"



