# Grafana Cloud Recipe for Cauldron
#
# Written against Grafana's Cloud API reference at grafana.com/docs and struck
# live against grafana.com on 2026-09-07 with no credential and then with a
# deliberately invalid one.
#
# **"Login Required" is a browser sentence, on an API.** Struck live:
#
#   GET /api/orgs                            (no credential)
#   401 {"code":"Unauthorized","message":"Login Required","requestId":"01efe1da-..."}
#
#   GET /api/orgs                            Authorization: Bearer notreal
#   401 {"code":"InvalidCredentials","message":"Token could not be parsed","requestId":"28dcdfe5-..."}
#
# Nothing on this surface has a login. A caller holds a service-account token
# or a cloud access policy token, and there is no session and no form. "Login
# Required" is what the same handler says to a browser hitting grafana.com
# without a cookie, reaching an API client through a shared middleware -- so
# the sentence is accurate about a completely different request.
#
# **The two failures do have different codes, and that is the good half.**
# `Unauthorized` for nothing sent and `InvalidCredentials` for something wrong,
# with two different sentences. Most providers in this collection collapse
# these into one response; Grafana separates them in both the machine-readable
# field and the prose, and then puts the wrong prose in one of them.
#
# **"Token could not be parsed" is precise about the right thing.** It says the
# string was unreadable rather than unrecognised -- so a caller who pasted a
# truncated token knows to look at the string, and one whose token was revoked
# knows it is not this message.
#
# **An unknown path answers the credential failure.** 401 with
# `InvalidCredentials` on `/api/cauldron-nope`, so routing is judged after
# authentication.
#
# **`requestId` is a UUID and it is the only correlation id.** One field, in
# the body, on every failure -- no header twin, which after
# [gong](../gong) and [imgix](../imgix) in this collection is worth noticing as
# the simpler and better choice.

recipe: grafanacloud
capability: observability
version: 0.1.0

upstream:
  api: v1
  docs: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
  # No spec: Grafana publishes a rendered reference site for the Cloud API.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - glc_cauldr0nf1xture000000000000000000000000
  # Two codes and two sentences, struck live -- and one of the sentences is
  # about a login this surface does not have.
  absent_error: login_required
  rejected_error: invalid_credentials

responses:
  list:
    style: wrapped
    key: items
    count_field: total
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  org:
    id:
      field: id
      style: numeric
    fields:
      name:
        type: string
      slug:
        type: string
      url:
        type: string
      createdAt:
        type: datetime

routes:
  - method: GET
    path: /api/orgs
    resource: org
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: pageSize
      cursor_param: page

errors:
  login_required:
    status: 401
    code: Unauthorized
    # Accurate about a browser request. There is no login on this surface: a
    # caller holds a service-account or access-policy token, and there is no
    # session and no form.
    message: "Login Required"
    fields:
      requestId: 01efe1da-87c1-4966-9fa7-e83f8c17392f

  invalid_credentials:
    status: 401
    # A different code and a different sentence, which is more than most
    # providers here manage -- and this one is precise about the right thing:
    # the string was unreadable rather than unrecognised.
    code: InvalidCredentials
    message: "Token could not be parsed"
    fields:
      requestId: 28dcdfe5-bf25-49d7-8633-41a7fb8302db

fixtures:
  empty:
    org: []

  account:
    org:
      - id: 1284461
        name: Cauldron
        slug: cauldron
        url: "https://grafana.com/orgs/cauldron"
        createdAt: "2026-03-02T09:14:00.000Z"
      - id: 1284462
        name: Cauldron Sandbox
        # The slug is what every URL uses and the numeric id is what the API
        # returns, so a person reading a dashboard link and a client reading a
        # record hold two different handles for one organisation.
        slug: cauldron-sandbox
        url: "https://grafana.com/orgs/cauldron-sandbox"
        createdAt: "2026-07-19T15:40:22.000Z"

conformance:
  - name: no credential asks for a login that does not exist
    source: https://grafana.com/api/orgs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers: {}
    expect:
      status: 401
      body:
        # A browser sentence reaching an API client through shared
        # middleware. Accurate about a completely different request.
        message: "Login Required"
        code: Unauthorized

  - name: a wrong credential says what it could not do
    source: https://grafana.com/api/orgs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # Unreadable rather than unrecognised, so a caller who pasted a
        # truncated token knows to look at the string -- and one whose token
        # was revoked knows this is not their message.
        message: "Token could not be parsed"
        code: InvalidCredentials

  - name: the two failures carry different codes
    source: https://grafana.com/api/orgs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers: {}
    expect:
      status: 401
      body:
        # Unauthorized here and InvalidCredentials for a wrong token. Most
        # providers in this collection collapse the two; Grafana separates
        # them in both fields and then puts the wrong prose in one.
        code: Unauthorized

  - name: there is one correlation id and it is in the body
    source: https://grafana.com/api/orgs
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers: {}
    expect:
      status: 401
      body:
        # A UUID, and no header twin -- which after Gong and imgix in this
        # collection is worth noticing as the simpler and better choice.
        requestId: 01efe1da-87c1-4966-9fa7-e83f8c17392f

  - name: an unknown path is a credential failure
    source: https://grafana.com/api/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        code: InvalidCredentials

  - name: organisations are wrapped in items with a total
    source: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer glc_cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        'items[0].name': Cauldron
        total: 2

  - name: a record carries two handles for one organisation
    source: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer glc_cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        # The slug is what every URL uses and the numeric id is what the API
        # returns, so a person reading a dashboard link and a client reading a
        # record are holding different keys for the same thing.
        'items[1].id': 1284462
        'items[1].slug': cauldron-sandbox
        'items[1].url': "https://grafana.com/orgs/cauldron-sandbox"

  - name: timestamps are UTC with milliseconds
    source: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer glc_cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        'items[0].createdAt': "2026-03-02T09:14:00.000Z"

  - name: organisations page on page and pageSize
    source: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
    fixture: account
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer glc_cauldr0nf1xture000000000000000000000000"
      query:
        page: "2"
        pageSize: "1"
    expect:
      status: 200
      body:
        'items[0].id': 1284462
        page: 2
        pageSize: 1

  - name: an account with no organisations answers an empty array
    source: https://grafana.com/docs/grafana-cloud/developer-resources/api-reference/cloud-api/
    fixture: empty
    request:
      method: GET
      path: /api/orgs
      headers:
        Authorization: "Bearer glc_cauldr0nf1xture000000000000000000000000"
    expect:
      status: 200
      body:
        items: []
        total: 0
