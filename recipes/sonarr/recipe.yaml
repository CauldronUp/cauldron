# Sonarr Recipe for Cauldron
#
# Written against Sonarr's own generated OpenAPI document, published in its own
# repository -- github.com/Sonarr/Sonarr, src/Sonarr.Api.V3/openapi.json, 162
# paths, info.version 3.0.0 -- read on 2026-09-06. Sonarr is self-hosted, so
# there is no public instance to strike: nothing here is verified live, and the
# claims are the provider's own document.
#
# This Recipe exists in a pair with `radarr`, and the pair is the point.
#
# **Sonarr and Radarr are the same API until they are not.**
#
# Same fork, same framework, same `/api/v3` prefix, same `info.version` string
# of "3.0.0", same two credential schemes with the same names. 134 paths appear
# in both documents. A client written for one and pointed at the other connects,
# authenticates, and answers 200.
#
# Thirteen of those shared paths take different parameters. GET /api/v3/history
# takes `seriesIds` and `includeSeries` here, and `movieIds` and `includeMovie`
# on Radarr. GET /api/v3/calendar takes four parameters here that Radarr does
# not have. The framework is ASP.NET Core, whose model binding drops a query
# key with no matching property rather than refusing it -- so the wrong
# parameter is not an error, it is a filter that does not filter, and the
# response is every record instead of none.
#
# **And the same integer means different things on the two.**
#
# `eventType` is a filter taking an array of integers, and a response field
# holding a string. The two documents list their members in this order:
#
#   position | Sonarr                 | Radarr
#   ---------|------------------------|-----------------------
#      0     | unknown                | unknown
#      1     | grabbed                | grabbed
#      2     | seriesFolderImported   | downloadFolderImported
#      3     | downloadFolderImported | downloadFailed
#      4     | downloadFailed         | movieFileDeleted
#      5     | episodeFileDeleted     | movieFolderImported
#      6     | episodeFileRenamed     | movieFileRenamed
#      7     | downloadIgnored        | downloadIgnored
#
# Only nought, one and seven agree. Neither document pins explicit values, so
# the integers a caller sends are the members' declaration positions -- which
# means `?eventType=3` asks for successful imports here and failed downloads on
# Radarr. A monitoring job counting failures against the wrong one of the pair
# counts successes, and nothing anywhere returns an error.
#
# What tells them apart is `appName` on GET /api/v3/system/status, and nothing
# else: not the path, not the version, not the credential, not the shape of a
# listing.
#
# **The same field is an integer going out and a string coming back.**
#
# You filter with `eventType=3` and read back `"eventType": "downloadFolderImported"`.
# One name, one endpoint, two types, and no client type can round-trip it.
#
# **The credential is documented as a query parameter as well as a header.**
#
# Both schemes are declared: `X-Api-Key` in a header, and `apikey` in the query
# string, described in the document as "Apikey passed as query parameter". A
# credential in a URL reaches access logs, proxy logs, browser history and
# Referer headers -- and these are self-hosted boxes commonly put behind a
# reverse proxy that logs full URLs by default.
#
# **The status endpoint is a host inventory.** SystemResource carries
# startupPath, appData, osName, osVersion, isDocker, sqliteVersion,
# migrationVersion, runtimeVersion, branch and packageUpdateMechanism. Absolute
# filesystem paths and host details, behind a credential that the same document
# says may travel in the query string.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Sonarr is self-hosted and
#     there is no public instance; every claim is the generated document's.
#   - History and system status. 162 paths is a media manager: series,
#     episodes, files, queue, indexers, download clients, import lists,
#     notifications, quality profiles and the command endpoint each want their
#     own evidence.
#   - The eventType filter is served as a filter over the string field, not
#     over the integers. Serving the integer mapping would mean asserting the
#     declaration positions are the wire values, which the document does not
#     state -- it is inferred from the enum having no explicit values, and the
#     inference is written down rather than encoded.
#   - The credential is checked in the header. The query-string scheme is
#     recorded and not served, because serving it would make a credential in a
#     URL the easy path in local development.

recipe: sonarr
capability: media
version: 0.1.0

upstream:
  api: "v3"
  docs: https://sonarr.tv/docs/api/
  spec: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
  spec_hash: 781a37e2a6a777ac780b11e9a2674b55109e5b92fcfb624141587f9f10b3a783
  spec_seen: "2026-09-06"

auth:
  scheme: header
  header: X-Api-Key
  keys:
    - cauldronsonarrapikey0000000000000
  absent_error: unauthorized

responses:
  list:
    style: wrapped
    key: records
    count_field: totalRecords
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message

resources:
  history:
    id:
      style: numeric
      type: number
    fields:
      # The scope field Radarr does not have. Its counterpart there is
      # movieId, and a client sending the wrong one filters nothing.
      seriesId:
        type: number
      episodeId:
        type: number
      sourceTitle:
        type: string
      # A string here and an integer in the filter of the same name.
      eventType:
        type: string
        default: grabbed
      downloadId:
        type: string
      # An ISO 8601 string, unlike most of this document's numbers.
      date:
        type: datetime
      qualityCutoffNotMet:
        type: boolean
        default: false

  status:
    id:
      style: opaque
      field: appName
    fields:
      # The only field in the whole API that says which of the pair you are
      # talking to.
      appName:
        type: string
      instanceName:
        type: string
      version:
        type: string
      branch:
        type: string
      # Host inventory, behind a credential the same document says may travel
      # in a query string.
      appData:
        type: string
      startupPath:
        type: string
      osName:
        type: string
      isDocker:
        type: boolean
        default: false
      sqliteVersion:
        type: string
      migrationVersion:
        type: number

routes:
  - method: GET
    path: /api/v3/history
    resource: history
    operation: list
    pagination:
      style: page
      limit_param: pageSize
      cursor_param: page
      limit: 10
      first_page: 1
    filters:
      # The one that exists here and not on Radarr.
      - field: seriesId
        param: seriesIds
      - field: eventType
        param: eventType

  - method: GET
    path: /api/v3/system/status
    resource: status
    operation: list
    list:
      style: bare
      collapse_single: true
      cursor_field: "-"
      key: "-"
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    message: "Unauthorized"
  not_found:
    status: 404
    message: "NotFound"
  rate_limit:
    status: 429
    message: "Too Many Requests"

fixtures:
  empty:
    history: []
    status: []

  library:
    status:
      - appName: Sonarr
        instanceName: Sonarr
        version: 4.0.15.2941
        branch: main
        appData: /config
        startupPath: /app/sonarr/bin
        osName: ubuntu
        isDocker: true
        sqliteVersion: 3.45.1
        migrationVersion: 216
    history:
      - id: 9001
        seriesId: 12
        episodeId: 3401
        sourceTitle: "Example.Series.S02E04.1080p"
        eventType: grabbed
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-05T18:22:41Z"
        qualityCutoffNotMet: false
      - id: 9002
        seriesId: 12
        episodeId: 3401
        sourceTitle: "Example.Series.S02E04.1080p"
        # Position 3 here, and position 3 on Radarr is downloadFailed.
        eventType: downloadFolderImported
        downloadId: "A1B2C3D4E5F6"
        date: "2026-09-05T18:41:09Z"
        qualityCutoffNotMet: false
      - id: 9003
        seriesId: 40
        episodeId: 5120
        sourceTitle: "Other.Show.S01E01.720p"
        eventType: downloadFailed
        downloadId: "F6E5D4C3B2A1"
        date: "2026-09-06T02:10:55Z"
        qualityCutoffNotMet: true

conformance:
  - name: only appName says which of the pair this is
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # Not the path, not the version string, not the credential, not the
        # shape of a listing. This field.
        appName: Sonarr
        # And this is 3.0.0 in the document on both sides of the pair, so it
        # discriminates nothing.
        version: 4.0.15.2941

  - name: the status endpoint is a host inventory
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # Absolute filesystem paths and host details, behind a credential the
        # same document says may travel in a query string.
        appData: /config
        startupPath: /app/sonarr/bin
        osName: ubuntu
        isDocker: true
        sqliteVersion: 3.45.1
        migrationVersion: 216

  - name: the paged envelope names its own page and size back
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        page: "1"
        pageSize: "2"
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # page, pageSize, totalRecords, records. Not data, not results, and
        # the count is of the whole set.
        page: 1
        pageSize: 2
        totalRecords: 3
        'records[0].id': 9001
      absent:
        - 'records[2]'

  - name: eventType is a string coming back and an integer going out
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        # The filter takes an array of integers upstream. This Recipe filters
        # on the string, because encoding the integer mapping would mean
        # asserting that the enum's declaration positions are its wire values
        # -- which is inferred and not stated. The name is what is pinned here.
        eventType: downloadFolderImported
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # A string coming back, where the filter of the same name takes
        # integers going out. No client type round-trips it.
        'records[0].eventType': downloadFolderImported
        'records[0].id': 9002
      absent:
        - 'records[1]'

  - name: the scope field is seriesId, which Radarr does not have
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      query:
        # seriesIds here; movieIds on Radarr. ASP.NET Core model binding drops
        # a query key with no matching property, so sending the wrong one is
        # not an error -- it is a filter that returns everything.
        seriesIds: "40"
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        'records[0].seriesId': 40
        'records[0].id': 9003
      absent:
        - 'records[1]'

  - name: a record names the episode as well as the series
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # Two identifiers where Radarr has one, because a series has episodes
        # and a movie is the whole thing.
        'records[0].seriesId': 12
        'records[0].episodeId': 3401
        'records[0].sourceTitle': "Example.Series.S02E04.1080p"
        'records[0].downloadId': "A1B2C3D4E5F6"
        'records[0].date': "2026-09-05T18:22:41Z"
        'records[0].qualityCutoffNotMet': false

  - name: no credential is refused
    source: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers: {}
    expect:
      status: 401
      body:
        message: "Unauthorized"

  - name: "the rate limit says so in these words"
    source: "https://sonarr.tv/docs/api/"
    arm: rate_limit
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 429
      body:
        message: "Too Many Requests"

  - name: "a missing record says so in these words"
    source: "https://sonarr.tv/docs/api/"
    arm: not_found
    fixture: library
    request:
      method: GET
      path: /api/v3/history
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 404
      body:
        message: "NotFound"

  - name: "the instance names itself separately from the product"
    source: "https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json"
    fixture: library
    request:
      method: GET
      path: /api/v3/system/status
      headers:
        X-Api-Key: cauldronsonarrapikey0000000000000
    expect:
      status: 200
      body:
        # instanceName is settable and defaults to the product name, so it
        # looks like a discriminator and is not one: an operator running two
        # Sonarrs renames one of them, and an operator running Sonarr and
        # Radarr may rename both to the same thing.
        instanceName: Sonarr
        branch: main
