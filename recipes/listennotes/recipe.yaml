conformance:
  - name: no credential is needed at all, and the record is real production data
    source: https://listen-api-test.listennotes.com/api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    verified: "2026-09-02"
    fixture: sw7x7
    request:
      method: GET
      path: /api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    expect:
      status: 200
      body:
        id: 4d3fe717742d4963a85562e9f84d8c79
        title: "Star Wars 7x7: A Daily Bite-Sized Dose of Star Wars Joy"
        rss: http://sw7x7.libsyn.com/rss

  - name: the feed's own guid travels beside Listen Notes' own id, on the same episode
    source: https://listen-api-test.listennotes.com/api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    verified: "2026-09-02"
    fixture: sw7x7
    request:
      method: GET
      path: /api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    expect:
      status: 200
      body:
        episodes[0].id: 4e7c59e10e4640b98f2f3cb1777dbb43
        episodes[0].guid_from_rss: bbada2b3a99054ce93b0eb95dd762b4d
        episodes[0].maybe_audio_invalid: false

  - name: the episode route answers a completely different show than the podcast route
    source: https://listen-api-test.listennotes.com/api/v2/episodes/6b6d65930c5a4f71b254465871fed370
    verified: "2026-09-02"
    fixture: winning-mindset
    request:
      method: GET
      path: /api/v2/episodes/6b6d65930c5a4f71b254465871fed370
    expect:
      status: 200
      body:
        id: 6b6d65930c5a4f71b254465871fed370
        title: "S1 Ep16: Arly Velasquez on Managing Risk"
        podcast.id: 073a66b496824a5d9e80d52621f372dc
        podcast.title: A Winning Mindset

  - name: an unrouted path answers plain text, not this API's JSON
    source: https://listen-api-test.listennotes.com/api/v2/no-such-route-xyz
    verified: "2026-09-02"
    fixture: empty
    request:
      method: GET
      path: /api/v2/no-such-route-xyz
    expect:
      status: 404
      headers:
        Content-Type: text/plain
      body_matches: "resource not found"

  - name: a wrong method answers the identical 404, not a 405
    source: https://listen-api-test.listennotes.com/api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    verified: "2026-09-02"
    fixture: empty
    request:
      method: PUT
      path: /api/v2/podcasts/4d3fe717742d4963a85562e9f84d8c79
    expect:
      status: 404
      body_matches: "resource not found"

