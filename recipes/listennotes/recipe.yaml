  # A Winning Mindset, the test host's own canned episode -- a completely
  # different show from the podcast fixture above, copied verbatim from a
  # live response today. See the header: this is what every episode id this
  # Recipe tried against this route answered, including the podcast
  # fixture's own episode ids.
  winning-mindset:
    episode:
      - id: 6b6d65930c5a4f71b254465871fed370
        link: https://audioboom.com/posts/7742178?utm_source=listennotes.com&utm_campaign=Listen+Notes&utm_medium=website
