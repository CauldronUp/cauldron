# Listen Notes Recipe for Cauldron
#
# This Recipe models listen-api-test.listennotes.com, not
# listen-api.listennotes.com -- say that up front, because the two answer
# differently enough that a Recipe silent about which one it describes would
# be lying about half of it.
#
# Listen Notes' own documentation calls the test host "No API Key Needed",
# and it means it literally: every GET this Recipe struck against it answered
# 200 with a full, real-shaped record -- no X-ListenAPI-Key header, no
# account, ever created or held. That is the gift the brief for this group
# asked to be recorded, and here is exactly what it is worth and what it is
# not.
#
# **What it is worth:** every field below, every value in every fixture, is
# copied byte-for-byte from a response this Recipe actually received today.
# Not one line is read from a schema's "example" annotation the way this
# group's Podcast Index sibling had to lean on. GET /api/v2/podcasts/{id}
# answers Star Wars 7x7 (id 4d3fe717742d4963a85562e9f84d8c79) and
# GET /api/v2/episodes/{id} answers a Paralympics show called A Winning
# Mindset (id 6b6d65930c5a4f71b254465871fed370) -- two completely unrelated
# canned shows, one per endpoint, real production data frozen for testing.
#
# **What it is not:** a simulated database. Checked live, deliberately,
# against several different ids: GET /api/v2/podcasts/{id} answers the
# identical Star Wars 7x7 record whatever id is in the path -- a real id, a
# short nonsense string, a 32-character string shaped like a real one but
# belonging to nothing. Same for episodes: aaa111, bbb222 and the episode's
# own real id all answer the identical A Winning Mindset record. The host
# never inspects the id at all, on either route. That means this mock can
# demonstrate the *shape* of a lookup and cannot demonstrate a *miss* --
# there is no live "not found" case to serve, because nothing this Recipe
# could send ever produced one. The fixtures below use each endpoint's own
# one real id, which is the honest choice: it is what a caller holding that
# exact id actually gets, and every other id gets it too, which is recorded
# rather than modelled as a second route.
#
# **The identifier is Listen Notes' own, minted, not derived from the feed.**
# id (32 lowercase hex characters, e.g. 4d3fe717742d4963a85562e9f84d8c79) is
# described in Listen Notes' published OpenAPI as "Podcast id, which can be
# used to further fetch detailed podcast metadata via GET /podcasts/{id}" --
# an opaque handle with no stated derivation. It is not the feed's own guid
# and it is not a hash of the feed url: MD5 of "https://sw7x7.libsyn.com/rss"
# and of "http://sw7x7.libsyn.com/rss" (the scheme this exact fixture's rss
# field actually carries) were both tried against this exact id, and neither
# matches. That does not prove Listen Notes never derives an id from
# anything -- it proves this one specific candidate derivation is wrong,
# which is the honest, narrower claim. What is not in doubt is that the
# feed's own identifier travels on the record as a *separate* field:
# episode.guid_from_rss (e.g. "bbada2b3a99054ce93b0eb95dd762b4d") is the raw
# <guid> Listen Notes read out of the RSS item, sitting beside episode.id,
# Listen Notes' own key, on the very same object. A caller who only has the
# feed-native guid cannot look anything up with it through this API -- there
# is no byguid route published anywhere in Listen Notes' reference -- but can
# at least recognise which entry is which once a listing is already in hand.
#
# **The whole question this group exists to ask has no field for it on the
# podcast object at all, and that absence is the finding.** No dead, no
# is_active, no last_crawled, no lastGoodHttpStatusTime -- nothing on
# PodcastFull, checked against Listen Notes' own published schema, says
# whether the feed behind a listing is still being read successfully. What
# exists instead, all documented and none of it observed (no PRO/ENTERPRISE
# key was ever held, and none of these needs the test host's canned data to
# make the point):
#
#   - POST /podcasts/{id}/rss -- "Refresh a podcast's RSS feed... available
#     only in the PRO/ENTERPRISE plan" -- is the *only* place a timestamp for
#     "last successfully fetched" appears anywhere in this API, and it is not
#     a fact a caller can read; it is the receipt for an action a caller has
#     to pay to take, capped at once per hour, answering
#     {"status": "refreshing"|"refreshed", "last_refreshed_at_ms": ...}. There
#     is no passive equivalent on GET /podcasts/{id}.
#   - DeletedItem -- "An episode or a podcast could be deleted from our
#     podcast database. Possible reasons: 1) Podcast producers sometimes
#     delete their old episodes. 2) Copyright issues." -- is a *different,
#     thinner* object shape ({id, title, status: "deleted", error}) that
#     replaces the normal record entirely, reachable only through the batch
#     lookup endpoints (POST /podcasts and POST /episodes, neither modelled
#     here -- see the gaps below). This is Listen Notes' answer to "delisted
#     from the directory," and it says nothing about the feed itself, only
#     that Listen Notes stopped carrying this specific entry.
#   - episode.maybe_audio_invalid is the one live, observed signal this
#     Recipe actually carries, and it is a third, narrower thing again:
#     "Whether or not this episode's audio is invalid. Podcasters may delete
#     the original audio." An episode can be maybe_audio_invalid: true and
#     still be a completely normal, fully-populated, non-deleted record --
#     the MP3 the enclosure points at might be gone while the episode's own
#     directory entry is not.
#
# Three unrelated mechanisms, at three different reaches (a paid action; a
# whole-record replacement reachable only in bulk; a boolean on the record
# you already have), and no single one of them is what Podcast Index's
# lastGoodHttpStatusTime or Taddy's feedRefreshDetails.dateLastRefreshed is:
# a fact about the feed's own fetch health that a caller can simply read.
#
# **The real host disagrees with the mock host on almost everything except
# the shape of a successful record**, all checked live, with no credential
# ever held real:
#
#   listen-api.listennotes.com/api/v2/podcasts/{id}
#     no key, or a junk X-ListenAPI-Key    -> 401, body exactly "{}",
#                                              Content-Type application/json,
#                                              byte-identical for both
#     an unrouted path, no key             -> 404, body exactly "{}"
#     POST (a method this route does not
#       support), no key                   -> 405 Method Not Allowed,
#                                              Allow: GET, DELETE, HEAD,
#                                              OPTIONS, Content-Type
#                                              text/html, zero-byte body --
#                                              a real 405, checked before any
#                                              credential is examined: the
#                                              identical answer with a junk
#                                              key sent too
#     DELETE, junk key                     -> 401 "{}" -- DELETE is a
#                                              genuinely routed method here
#                                              (per its own Allow header),
#                                              and reaches the credential
#                                              check rather than the method
#                                              check
#
# So the real host tells a missing credential from an unrouted path from an
# unsupported method three different ways (a bare 401, a bare 404, a real
# 405 with a computed Allow), and does not tell a missing credential from a
# wrong one at all -- "{}" is served identically for both. The mock host
# never reaches any of this: it has no credential of any kind to check, and
# its own 404 (below) is the one thing both hosts were checked on where they
# do not even agree with each other on media type, body or status wording.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - listen-api.listennotes.com is not modelled as routes at all. This
#     Recipe's auth is genuinely none, matching the host it actually serves;
#     reproducing the real host's X-ListenAPI-Key scheme on the same routes
#     would refuse every request this Recipe's own fixtures need to answer,
#     which is the same reasoning Mezmo's Recipe in this collection gives for
#     leaving its own second host unrouted. Every real-host finding above was
#     checked live and is recorded rather than served.
#   - No not-found case. See above: nothing this Recipe could send the mock
#     host ever produced one.
#   - DeletedItem, RefreshRssResponse and the batch endpoints
#     (POST /podcasts, POST /episodes) are not modelled: each needs a real
#     key (RefreshRss) or is not covered by anything the test host answers
#     for a single-record GET (the batch shapes), so there is nothing this
#     Recipe observed to fixture.
#   - Of roughly thirty documented PodcastFull fields this Recipe declares
#     about twenty. looking_for's own sub-fields, has_guest_interviews,
#     next_episode_pub_date and the extra.* social-link block are present in
#     the fixture (because the live response carries them) but only
#     partially typed as resource fields; the untyped ones still appear on
#     the wire exactly as received, because a fixture is the literal
#     response this Recipe got, not a filtered projection of it.
#   - rss is documented as "available only in the PRO/ENTERPRISE plan," and
#     the test host's response -- stamped x-listenapi-plan: FREE on the very
#     same response -- carries it anyway. Recorded as a live discrepancy
#     between the description and the wire, not resolved: this Recipe serves
#     what the mock host actually sent.
#   - genre_ids is a bare array of integers with no names attached anywhere
#     on this record; GET /genres is a separate, undocumented-here route this
#     Recipe does not model, so the numbers below are uninterpreted.

recipe: listennotes
capability: media
version: 0.1.0

upstream:
  api: v2
  docs: https://www.listennotes.com/api/docs/
  spec: https://listen-api.listennotes.com/api/v2/openapi.json
  spec_hash: 7c56ef0085953f7238e85fa6ae9abafd70f2b70d4367437dc1e40b1a75df1ffe
  spec_seen: "2026-09-02"

auth:
  # The test host checks no credential of any kind -- see the header. This
  # is the whole and honest description of what listen-api-test answers, not
  # a placeholder waiting to be tightened.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: text

resources:
  podcast:
    id:
      style: opaque
    fields:
      rss:
        type: string
        null_when_unset: true
      type:
        type: string
      email:
        type: string
        null_when_unset: true
      image:
        type: string
        null_when_unset: true
      title:
        type: string
      country:
        type: string
        null_when_unset: true
      website:
        type: string
        null_when_unset: true
      # Full episode objects, verbatim -- see episode below for the fields
      # each one carries. Not a separate resource: this array travels inside
      # the podcast record on this route, the reverse of how a single
      # episode carries its own podcast (see episode.podcast).
      episodes:
        type: list
      language:
        type: string
        null_when_unset: true
      genre_ids:
        type: list
      itunes_id:
        type: integer
        null_when_unset: true
      publisher:
        type: string
        null_when_unset: true
      thumbnail:
        type: string
        null_when_unset: true
      is_claimed:
        type: boolean
        default: false
      description:
        type: string
        null_when_unset: true
      has_sponsors:
        type: boolean
        default: false
      # A popularity score, not a health signal -- see the header. Nothing
      # on this record says whether the feed behind it is still being read.
      listen_score:
        type: integer
        null_when_unset: true
      total_episodes:
        type: integer
      listennotes_url:
        type: string
      explicit_content:
        type: boolean
        default: false
      latest_episode_id:
        type: string
        null_when_unset: true
      latest_pub_date_ms:
        type: timestamp
        null_when_unset: true
      earliest_pub_date_ms:
        type: timestamp
        null_when_unset: true
      update_frequency_hours:
        type: integer
        null_when_unset: true
      listen_score_global_rank:
        type: string
        null_when_unset: true

  episode:
    id:
      style: opaque
    fields:
      link:
        type: string
        null_when_unset: true
      audio:
        type: string
        null_when_unset: true
      image:
        type: string
        null_when_unset: true
      title:
        type: string
      thumbnail:
        type: string
        null_when_unset: true
      description:
        type: string
        null_when_unset: true
      pub_date_ms:
        type: timestamp
      # The feed's own <guid>, carried beside Listen Notes' own id -- see
      # the header. Not derived from the id above; a completely separate
      # value with a completely separate source.
      guid_from_rss:
        type: string
        null_when_unset: true
      listennotes_url:
        type: string
      audio_length_sec:
        type: integer
        null_when_unset: true
      explicit_content:
        type: boolean
        default: false
      # A different question from "is this episode still listed" -- see the
      # header. This can be true on an otherwise completely ordinary,
      # present, undeleted record.
      maybe_audio_invalid:
        type: boolean
        default: false
      listennotes_edit_url:
        type: string
        null_when_unset: true
      # The full parent podcast, nested -- the mirror of podcast.episodes
      # above. Only present on the single-episode route.
      podcast:
        type: map

routes:
  - method: GET
    path: /api/v2/podcasts/{id}
    resource: podcast
    operation: get

  - method: GET
    path: /api/v2/episodes/{id}
    resource: episode
    operation: get

errors:
  # The test host's own wording, live: plain text, not JSON, for both an
  # unrouted path and a method this Recipe declares no route for.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: text/plain
    message: resource not found

  # No real 405 on this host -- see the header for its real-host sibling,
  # which does have one. A wrong method here answers the identical 404
  # "resource not found" an unrouted path does.
  method_not_allowed:
    status: 404
    style: text
    headers:
      Content-Type: text/plain
    message: resource not found

fixtures:
  empty: {}

  # Star Wars 7x7, the test host's own canned podcast -- copied verbatim
