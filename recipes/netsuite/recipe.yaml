# NetSuite Recipe for Cauldron
#
# There is no shared sandbox and nothing at this host answers without one.
# NetSuite's REST Record API is addressed at {accountId}.suitetalk.api.
# netsuite.com, a hostname minted per account rather than a single shared
# endpoint every integration reaches -- and that is not a detail read off a
# docs page, it is what this Recipe struck when it tried. Checked live,
# 2026-09-01, with three different fabricated account ids
# (fakeaccount123, 1234567, TSTDRV1234567): every one of
# {id}.suitetalk.api.netsuite.com came back "Could not resolve host" --
# NXDOMAIN, not a refusal, not a 403, nothing with an HTTP status at all.
# The bare wildcard host, suitetalk.api.netsuite.com with no account
# prefix, has no A or AAAA record either, checked the same way -- there is
# not even a generic catch-all to strike. Two other NetSuite hostnames do
# resolve and neither is this API: rest.netsuite.com, an older generic REST
# host behind Akamai, answers a bare 404 with Content-Length 0 for a record
# path (a routing edge with no application behind it for this purpose);
# system.netsuite.com answers a 301 to /pages/customerlogin.jsp, the
# ordinary UI sign-in page, unrelated to the record API entirely. Between
# them they confirm there is no generic door into this API at all -- every
# real integration reaches a URL that does not exist until an account
# provisions it, which is a fact this Recipe could only learn by trying, the
# same way fauna/recipe.yaml in this collection learned db.fauna.com no
# longer exists at all. NetSuite's own case is not a shutdown -- the host
# is real for every account that has one -- but the effect on what this
# Recipe can strike live is identical: nothing.
#
# So every route, every error body and every field below is modelled from
# Oracle's own published NetSuite Applications Suite documentation
# (docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/...), not observed,
# and no case below carries a verified date -- see fauna/recipe.yaml for the
# identical stance taken for a different reason, and the header there for
# why a Recipe says this once, plainly, rather than on every single case.
#
# The central question this group of Recipes exists to answer -- can a
# posted transaction be deleted, and what happens instead when it cannot --
# has a documented answer sharper than either of the other two providers in
# this group manage, and it is worth stating before anything else:
#
#   Deleting really does remove the record. Oracle's own words: "You may
#   want to remove a transaction from the system entirely... NetSuite does
#   not retain the details of a deleted transaction. However, the audit
#   trail includes a record that the transaction was deleted." Nothing is
#   kept behind it.
#
#   Voiding is a status on the SAME record, and nothing is minted. "Voiding
#   a transaction sets its total and all its line items to 0 but doesn't
#   remove it from the system," and it is explicitly the preferred move --
#   "the audit trail is preserved" -- over deleting. Compare Sage Intacct's
#   Recipe in this same group: reversing a bill there changes the original's
#   own state AND mints a second, new transaction. NetSuite does only the
#   first half of that.
#
#   Deletion is refused only for a linked record, not for "posted" as such:
#   "you can't delete an invoice that has been paid and that has an
#   associated customer payment transaction," and the documented remedy is
#   to close or void the linked transactions rather than delete them. An
#   Open, unpaid invoice with nothing pointing at it is not documented as
#   blocked at all -- the restriction is about what else references the
#   record, not about whether the record itself has posted.
#
# What could not be settled, stated rather than guessed: the literal wire
# shape of a refused delete. Oracle's own "Deleting a Record Instance"
# reference page shows only the success case -- DELETE .../customer/107,
# HTTP 204, no body -- and no worked example of the linked-transaction
# refusal appears anywhere this Recipe could find in NetSuite's published
# REST reference. The business rule above is Oracle's own words; the JSON
# body a real refusal sends is not, and this Recipe declares no route for
# it rather than construct one. Voiding fares the same way from the other
# direction: Oracle's REST record API documents a generic transform
# mechanism -- POST .../{record}/{id}/!transform/{targetType}, 204 on
# success, demonstrated turning a sales order into an invoice -- but no
# target type for voiding an invoice appears documented anywhere this
# Recipe could find, so this Recipe does not guess one. The REST API's own
# four ordinary verbs -- create, get, update, delete -- map cleanly onto
# draft, read, edit and gone; the operation accounting actually wants most
# for a posted record, reversing it, is not clearly one of the four at all
# in what Oracle has published for this surface.
#
# What could be established: the error envelope, in full, cited example by
# example from Oracle's own "Error Handling in REST Web Services" reference.
# Every failure is RFC 7807-shaped -- {type, title, status, o:errorDetails:
# [{detail, o:errorCode}]} -- an envelope none of this project's other
# accounting Recipes share (Xero's is PascalCase and flat, QuickBooks nests
# under Fault.Error, Sage Intacct in this same group is not JSON at all).
# And NetSuite's own RESTlets/REST Web Services Authentication Errors
# reference names two of Step 2a's three verdicts explicitly, as the two
# values a WWW-Authenticate challenge header's own error parameter takes:
# invalid_request (400) for "one or more parameters are missing, repeated,
# or malformed" -- this Recipe's auth.malformed_error -- and invalid_token
# (401) for a token that is "expired, revoked, malformed, or invalid",
# which doubles as this Recipe's generic authentication_error and therefore
# as what an absent credential gets too. Nothing in either reference
# separately confirms a third sentence for a wholly absent Authorization
# header, so auth.absent_error and auth.rejected_error are both left unset
# here rather than guessed apart -- see auth.go's own account of the
# difference between a Recipe that was not checked and one that was checked
# and found the same.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No case carries a verified date, for the reason stated at the top.
#   - Only get and delete are routed. No worked example of a NetSuite REST
#     list response (items, hasMore, offset and so on) turned up in any
#     source this Recipe checked, Oracle's own or third-party -- the two
#     worked examples the search this Recipe ran did surface both show a
#     single record, never a collection -- so list is not modelled rather
#     than guessed at. create and update are absent for the identical
#     reason: no worked request/response body for either appears in what
#     this Recipe could reach.
#   - The delete-refusal-on-a-linked-record body, and the void mechanism
#     entirely, are described in prose above and routed nowhere -- see the
#     paragraph above explaining why.
#   - o:errorPath, the field-level pointer NetSuite's own 400 INVALID_
#     CONTENT example shows (e.g. "item.items[0].item"), is real, cited,
#     and not modelled: it bears on a validation failure this group's
#     question has no use for, and reaching for completeness on a surface
#     this narrow risks the opposite of fidelity. The concurrency-limit
#     error's own redundant top-level o:errorCode, by contrast, is
#     modelled -- see errors.rate_limit below -- because "flat" style's
#     dotted message_field/code_field already reach past the array by the
#     time that one mattered, and leaving a field out only because it was
#     awkward under the wrong style would have been a worse reason than
#     "it does not bear on the question."
#   - OAuth 1.0a Token-Based Authentication -- an HMAC-SHA256-signed
#     Authorization header, which NetSuite's REST API accepts as an
#     alternative to the OAuth 2.0 bearer token modelled here -- is not
#     modelled, for the same reason auth.go's own Pattern field exists for
#     AWS SigV4: verifying a real signature is not what this project does,
#     and a Recipe accepting one unsigned would be worse than one silent
#     about the scheme at all.
#   - Only invoice is modelled. NetSuite's REST record service covers
#     several hundred record types; this Recipe declares the one this
#     group's own question is about.
#
# Tokens below are fixtures, not secrets, and belong to no real account.

recipe: netsuite
capability: accounting
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_156570709583.html

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-netsuite-access-token-0000000000
  # invalid_request, RFC 7807-shaped, per NetSuite's own RESTlets/REST Web
  # Services Authentication Errors reference -- see the header. Absent and
  # rejected are both left to the generic authentication_error, because
  # neither reference this Recipe found separately confirms a third
  # sentence for a wholly missing header.
  malformed_error: invalid_request

responses:
  error:
    # {type, title, status, o:errorDetails: [{detail, o:errorCode}]} --
    # Oracle's own RFC 7807-shaped envelope, cited example by example below.
    # "list" wraps every declared field inside the array it produces, with
    # nowhere for title and status to sit beside it rather than inside it,
    # which is not this envelope's real shape. "flat" is used instead, with
    # message_field and code_field as full dotted paths reaching inside
    # o:errorDetails[0] -- the same mechanism sageintacct/recipe.yaml uses
    # in this same group for its own two-key-deep envelope -- while
    # type_field and status_field stay bare names and land at the true top
    # level, which is where Oracle's own examples actually put title and
    # status.
    style: flat
    message_field: "o:errorDetails[0].detail"
    code_field: "o:errorDetails[0].o:errorCode"
    type_field: title
    status_field: status
    fields:
      type: "https://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html"

resources:
  # Every field and value here is Oracle's own worked example, cited in
  # full at https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/
  # section_0210111448.html ("Use Case of Retrieving an Invoice"): GET
  # .../record/v1/invoice/1215/ answering exactly this body. Nothing here
  # was observed; everything here was read.
  invoice:
    id:
      # "1215" -- digits, but sent as a JSON string, the same choice
      # QuickBooks makes in this same collection for Customer, Invoice and
      # Account (compare quickbooks/recipe.yaml). Minted as a plain
      # sequence, unlike Xero's uuid or Sage Intacct's type-prefixed opaque
      # key elsewhere in this group.
      style: numeric
    fields:
      tranId:
        type: string
      # A reference object -- {links, id, refName} -- nested the same way
      # Rootly's severity and FireHydrant's milestones nest elsewhere in
      # this collection: two sibling fields sharing one `in:` path rather
      # than a single object-typed field, because this format has no bare
      # object type to declare one with.
      statusId:
        type: string
        in: status
        as: id
      statusRefName:
        type: string
        in: status
        as: refName
      total:
        type: number
      amountPaid:
        type: number
      amountRemaining:
        type: number
      entityId:
        type: string
        in: entity
        as: id
      entityRefName:
        type: string
        in: entity
        as: refName
      currencyId:
        type: string
        in: currency
        as: id
      currencyRefName:
        type: string
        in: currency
        as: refName
      # A bare date, "2023-02-21", not a full timestamp -- Oracle's own
      # example gives it no time component at all, so this is declared as a
      # plain string rather than claimed as the datetime type this format
      # would otherwise stamp a current timestamp into.
      dueDate:
        type: string
      createdDate:
        type: datetime
      email:
        type: string
      billAddress:
        type: string

routes:
  - method: GET
    path: /services/rest/record/v1/invoice/{id}
    resource: invoice
    operation: get

  # The generic mechanic Oracle's own "Deleting a Record Instance"
  # reference documents -- 204, no body -- demonstrated there against
  # /customer/107 rather than an invoice. Applied here to the one resource
  # this Recipe models, against a record that carries none of the
  # linked-transaction conditions Oracle's own business rule names (see the
  # header) -- not a claim that this specific fixture record was ever
  # deleted against a real account, since none was.
  - method: DELETE
    path: /services/rest/record/v1/invoice/{id}
    resource: invoice
    operation: delete
    status: 204
    empty_body: true

errors:
  # {"type":"...","title":"Unauthorized","status":401,"o:errorDetails":
  # [{"detail":"Invalid login attempt. For more details, see the Login
  # Audit Trail in the NetSuite UI at Setup > Users/Roles > User
  # Management > View Login Audit Trail.","o:errorCode":"INVALID_LOGIN"}]}
  # -- Oracle's own worked example, word for word.
  authentication_error:
    status: 401
    type: Unauthorized
    code: INVALID_LOGIN
    message: "Invalid login attempt. For more details, see the Login Audit Trail in the NetSuite UI at Setup > Users/Roles > User Management > View Login Audit Trail."

  # {"type":"...","title":"Bad Request","status":400,"o:errorDetails":
  # [{"detail":"The request could not be understood by the server due to
  # malformed syntax.","o:errorCode":"INVALID_REQUEST"}]} -- from the same
  # reference; the WWW-Authenticate challenge header carries the matching
  # wording ("couldn't" rather than "could not") from NetSuite's own
  # RESTlets/REST Web Services Authentication Errors page, and both are
  # asserted below.
  invalid_request:
    status: 400
    type: Bad Request
    code: INVALID_REQUEST
    message: "The request could not be understood by the server due to malformed syntax."
    headers:
      WWW-Authenticate: 'Bearer error="invalid_request", error_description="The request could not be understood by the server due to malformed syntax."'

  # {"type":"...","title":"Not Found","status":404,"o:errorDetails":
  # [{"detail":"Record does not exist.","o:errorCode":"NONEXISTENT_ID"}]}
  resource_missing:
    status: 404
    type: Not Found
    code: NONEXISTENT_ID
    message: "Record does not exist."

  # {"type":"...","title":"Bad Request","status":429,"o:errorCode":
  # "USER_ERROR","o:errorDetails":[{"detail":"Concurrent request limit
  # exceeded. Request blocked.","o:errorCode":
  # "CONCURRENCY_LIMIT_EXCEEDED"}]} -- documented exactly this way: 429
  # with the title "Bad Request" rather than any 429-specific wording, and
  # a second, different o:errorCode sitting at the top level beside the
  # array. Both are Oracle's own, not this Recipe's invention.
  rate_limit:
    status: 429
    type: Bad Request
    code: CONCURRENCY_LIMIT_EXCEEDED
    message: "Concurrent request limit exceeded. Request blocked."
    fields:
      "o:errorCode": USER_ERROR

  # {"type":"...","title":"Internal Server Error","status":500,
  # "o:errorDetails":[{"detail":"An unexpected error occurred. Error ID:
  # jrgbpyylphhishmmlxyt","o:errorCode":"UNEXPECTED_ERROR"}]} -- the error
  # id is Oracle's own example value, generated per incident on the real
  # API and quoted here as the documented literal rather than as a claim
  # this Recipe could regenerate one.
  server_error:
    status: 500
    type: Internal Server Error
    code: UNEXPECTED_ERROR
    message: "An unexpected error occurred. Error ID: jrgbpyylphhishmmlxyt"

fixtures:
  empty: {}

  small-account:
    invoice:
      # Oracle's own cited worked example -- see the resource declaration
      # above for the full citation. Every value here was read, not
      # invented.
      - id: "1215"
        tranId: INV07
        statusId: Open
        statusRefName: Open
        total: 1000.0
        amountPaid: 0.0
        amountRemaining: 1000.0
        entityId: "614"
        entityRefName: "8 Another Company 1661496973"
        currencyId: "1"
        currencyRefName: USA
        dueDate: "2023-02-21"
        createdDate: "2023-02-06T09:48:00Z"
        email: another.customer@example.com
        billAddress: "Dwight Schrute\nNew York NY 10001\nUnited States"
      # This Recipe's own fixture, not a cited example -- it exists only so
      # the delete case below has a record to act on. DELETE's own
      # response has no body (see the route), so nothing about this
      # record's field values is ever asserted or needs a citation.
      - id: "1216"
        tranId: INV08
        statusId: Open
        statusRefName: Open
        total: 500.0
        entityId: "614"
        entityRefName: "8 Another Company 1661496973"

# Every case below carries source and no verified date -- see the header
# for why: this Recipe never held a working account hostname to call.
conformance:
  - name: an invoice is a reference-object-nested record, read the way Oracle shows it
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_0210111448.html
    fixture: small-account
    request:
      method: GET
      path: /services/rest/record/v1/invoice/1215
      headers:
        Authorization: Bearer cauldron-netsuite-access-token-0000000000
    expect:
      status: 200
      body:
        id: "1215"
        tranId: INV07
        status.id: Open
        status.refName: Open
        total: 1000.0
        amountPaid: 0.0
        amountRemaining: 1000.0
        entity.id: "614"
        entity.refName: "8 Another Company 1661496973"
        dueDate: "2023-02-21"
      # The nested reference object Oracle's own JSON actually shows --
      # {"status": {"id", "refName"}, "entity": {"id", "refName"}} -- not
      # the flattened statusId/entityId field names this Recipe's own
      # declaration uses internally to get there (see the resource
      # declaration's own comment on why two sibling fields, not one
      # object-typed field). Only the HATEOAS links array is genuinely
      # absent.
      absent:
        - links

  - name: a request with no credential at all is refused the same as a wrong one
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/subsect_158521885412.html
    fixture: empty
    request:
      method: GET
      path: /services/rest/record/v1/invoice/1215
    expect:
      status: 401
      body:
        title: Unauthorized
        status: 401
        "o:errorDetails[0].o:errorCode": INVALID_LOGIN

  - name: a bearer value with no prefix is a different failure, malformed rather than wrong
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/subsect_158521885412.html
    fixture: empty
    request:
      method: GET
      path: /services/rest/record/v1/invoice/1215
      headers:
        Authorization: cauldron-netsuite-access-token-0000000000
    expect:
      status: 400
      body:
        title: Bad Request
        "o:errorDetails[0].o:errorCode": INVALID_REQUEST
      header_matches:
        WWW-Authenticate: '^Bearer error="invalid_request"'

  - name: a nonexistent invoice id answers Record does not exist
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_156570709583.html
    fixture: small-account
    request:
      method: GET
      path: /services/rest/record/v1/invoice/999999999
      headers:
        Authorization: Bearer cauldron-netsuite-access-token-0000000000
    expect:
      status: 404
      body:
        title: Not Found
        "o:errorDetails[0].detail": "Record does not exist."
        "o:errorDetails[0].o:errorCode": NONEXISTENT_ID

  - name: deleting an unlinked invoice answers 204 with nothing at all
    # The generic mechanic; see the route's own comment for why this is
    # not a claim that record 1216 was ever deleted against a real
    # account.
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_1545142287.html
    fixture: small-account
    request:
      method: DELETE
      path: /services/rest/record/v1/invoice/1216
      headers:
        Authorization: Bearer cauldron-netsuite-access-token-0000000000
    expect:
      status: 204
      no_body: true

  - name: a concurrency-limited request carries a second, redundant error code
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_156570709583.html
    fixture: small-account
    arm: rate_limit
    request:
      method: GET
      path: /services/rest/record/v1/invoice/1215
      headers:
        Authorization: Bearer cauldron-netsuite-access-token-0000000000
    expect:
      status: 429
      body:
        title: Bad Request
        "o:errorCode": USER_ERROR
        "o:errorDetails[0].o:errorCode": CONCURRENCY_LIMIT_EXCEEDED

  - name: an unexpected error carries the literal id Oracle's own example shows
    source: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_156570709583.html
    fixture: small-account
    arm: server_error
    request:
      method: GET
      path: /services/rest/record/v1/invoice/1215
      headers:
        Authorization: Bearer cauldron-netsuite-access-token-0000000000
    expect:
      status: 500
      body:
        title: Internal Server Error
        "o:errorDetails[0].detail": "An unexpected error occurred. Error ID: jrgbpyylphhishmmlxyt"

  # The names. This Recipe declares 3 field(s) on a invoice that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an invoice carries the field names this Recipe declares"
    source: "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_0210111448.html"
    fixture: small-account
    request:
      method: GET
      path: "/services/rest/record/v1/invoice/1215"
      headers:
        "Authorization": "Bearer cauldron-netsuite-access-token-0000000000"
    expect:
      status: 200
      body:
        "billAddress": "Dwight Schrute\nNew York NY 10001\nUnited States"
        "createdDate": "2023-02-06T09:48:00Z"
        "email": "another.customer@example.com"

