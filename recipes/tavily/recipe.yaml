# Tavily Recipe for Cauldron
#
# Tavily answers one POST with a list of results and, when asked, a second
# thing riding beside them: "answer", an LLM-generated sentence summarising
# what the results say. Tavily's own schema describes it as "A short answer
# to the user's query, generated by an LLM," included only when the caller
# asks for it, and nothing in that description -- or anywhere else this
# project could find in Tavily's reference -- ties it back to which result
# or results it was drawn from. No citation array, no result index, no
# per-sentence source. It sits beside results the way a caption sits beside
# a photograph rather than pointing into it: a synthesis a caller either
# trusts whole or checks by hand against every result underneath it, because
# nothing in the response says which of them the sentence came from. This is
# the free-floating shape the brief for this collection asked to be checked
# for by name, and this is what checking it against Tavily's own documented
# schema finds.
#
# The other question this collection tracks -- does a result carry a crawl
# or publication date -- has a cleaner answer here than free-floating
# attribution does: no. Tavily's result schema was read field by field
# against its own OpenAPI page and no published_date, crawled_at or anything
# resembling one is documented on a result object. A caller can ask Tavily
# to filter by start_date, end_date or time_range, so the provider plainly
# tracks a date for each page somewhere in its own index -- it is simply not
# a field the response hands back. What comes back is score, a relevance
# number, and nothing that says when the page underneath it was written or
# when Tavily last looked at it.
#
# No account was created and no key was requested, guessed, or used. Every
# case citing a verified date below was sent to api.tavily.com directly, with
# no key, an empty header, one with no Bearer prefix, a wrong one, or a GET
# where POST is the only documented method; Tavily's own site advertises a
# free tier and this project did not sign up for one.
#
# **Every credential failure this project could produce answers the same
# sentence.** No Authorization header, an empty one, one with no Bearer
# prefix, and one carrying a well-formed but wrong tvly- key all answered,
# checked directly:
#
#   401  {"detail":{"error":"Unauthorized: missing or invalid API key."}}
#
# One message for four different mistakes, which is the ordinary case this
# collection has mostly found -- unlike Exa and Fireworks, sitting beside
# this Recipe in the same probing session, both of which do tell a missing
# credential from a wrong one. Tavily's own wording already says as much:
# "missing or invalid," one sentence doing the work of two.
#
# **Whether the credential is checked before routing depends on whether the
# path exists, which is Rootly's split, recorded elsewhere in this
# collection, and not this format's after_routing boolean.** GET where POST
# is the only method /search has -- a real path, the wrong verb -- answers
# the identical 401 above, checked directly with no credential sent at all:
# the gate runs regardless of what a caller asked for, on a path Tavily
# actually has. A path this project invented answers differently, checked
# directly both with and without a credential:
#
#   404  (no body, Content-Length: 0)
#
# So an unrouted path is not gated at all -- the router refuses it first, and
# the credential is never examined. after_routing is one setting for the
# whole Recipe and cannot describe "gated when the path is real, ungated
# when it is not" at the same time; auth.go names Rootly as the Recipe this
# happened to first, and this is the second. What is declared below is the
# gated half, because that is the one an integration written against a real
# path will actually hit; the unrouted-path 404 is recorded here rather than
# modelled as a route, because Cauldron's own credential check runs before
# routing whenever after_routing is left at its default, and turning it on
# would misdescribe the gated half to fix the half nobody calls by accident.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The unrouted-path 404 above is not served. See the paragraph just
#     above: reproducing it would require the credential to survive a route
#     miss without gating a route hit, which is the same unexpressable split
#     Rootly's Recipe already states a gap for.
#   - request_id is not reproduced. Tavily's own schema gives it as an
#     example UUID on every successful response and this project never
#     observed one twice, so it is a fresh value per call -- which this
#     format has no mechanism for outside a resource's own minted
#     identifier, and a search response is not addressing one resource.
#     Exa's Recipe in this collection states the identical gap for the
#     identical reason, on the field it calls requestId.
#   - Neither a genuine 200 nor a genuine answer was ever observed. Every
#     success case below is sourced to Tavily's own OpenAPI schema and its
#     per-field "example:" annotations, cited and not observed, and carries
#     no verified date. The field names and the score example are Tavily's;
#     the title, url and content text around them are this Recipe's own,
#     not anything scraped from a live result.
#   - The selects_body trigger below is the real parameter name,
#     include_answer, rather than an invented marker -- which is more
#     faithful than the alternative and comes with the same known limit
#     every Recipe using selects_body already states: the match is a
#     whole-word text search over the rendered body, not a parse, so a
#     request sending "include_answer": false would trigger the same route
#     an actual true does. Nothing here can tell the two apart.
#   - search_depth, topic, time_range, include_images and every other
#     documented request parameter beyond include_answer are unmodelled;
#     every route here answers the same fixture whatever else was asked.
#   - raw_content, images and favicon are declared on the resource because
#     Tavily's schema documents them, and are never populated by any route
#     below: raw_content is null unless a caller asks for it and this
#     Recipe never models that ask, and images is Tavily's own separate
#     top-level array, not modelled at all.
#   - No rate-limit header was found on any failure this project checked.

recipe: tavily
capability: search
version: 0.1.0

upstream:
  api: unversioned
  docs: https://docs.tavily.com/documentation/api-reference/endpoint/search

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - tvly-cauldronfixturekey0000000000000000
  # See the header: absent, empty, unprefixed and merely-wrong all answer
  # the identical sentence, so this stays undeclared and every verdict
  # falls through to the one generic message.

responses:
  list:
    style: wrapped
    key: results
  # {"detail": {"error": "..."}} -- one level of nesting, one field inside
  # it, no code and no type anywhere in the envelope.
  error:
    style: nested
    key: detail
    message_field: error
    code_field: "-"
    type_field: "-"
  resource:
    style: bare

resources:
  result:
    id:
      # Tavily's own example: "a3f9c2-04", a short opaque token rather than
      # a UUID or a prefixed identifier.
      style: opaque
    fields:
      title:
        type: string
        required: true
      url:
        type: string
        required: true
      content:
        type: string
      score:
        type: number
      # Documented, and null unless a caller asks for it -- see the header's
      # stated gap. No route below ever sets it.
      raw_content:
        type: string
        null_when_unset: true
      favicon:
        type: string
        null_when_unset: true

routes:
  # include_answer is the real request field, matched as a whole word over
  # the rendered body -- see the header's stated limit on this mechanism.
  - method: POST
    path: /search
    resource: result
    operation: list
    selects_body: include_answer
    fields:
      # Free-floating on purpose: nothing here names which result it came
      # from, because nothing in Tavily's own schema does either. This is
      # the finding this Recipe exists for.
      answer: A synthesis of the results below, generated by an LLM and not attributed to any one of them.
      usage.credits: 1

  # No marker in the body: the plain listing, with no answer field at all.
  - method: POST
    path: /search
    resource: result
    operation: list
    fields:
      usage.credits: 1

errors:
  # The one sentence every credential failure this project could produce
  # answers with. See the header: absent, empty, unprefixed and wrong all
  # reach this, undifferentiated.
  authentication_error:
    status: 401
    message: "Unauthorized: missing or invalid API key."
    headers:
      Content-Type: application/json

fixtures:
  empty: {}

  results:
    result:
      - id: c4uldr0n1
        title: "Cauldron: fixtures for API integrations"
        url: https://cauldronup.example/
        content: An emulator that models what a provider actually sends, not what its docs promise.
        score: 0.8123456

conformance:
  - name: no key at all is one sentence covering both mistakes
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Content-Type: application/json
      json:
        query: cauldron search recipe
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        "detail.error": "Unauthorized: missing or invalid API key."

  - name: a header with no Bearer prefix answers the identical sentence
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Authorization: junktoken1234567890
      json:
        query: cauldron search recipe
    expect:
      status: 401
      body:
        "detail.error": "Unauthorized: missing or invalid API key."

  - name: an empty Authorization header answers the same sentence too
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Authorization: ""
      json:
        query: cauldron search recipe
    expect:
      status: 401
      body:
        "detail.error": "Unauthorized: missing or invalid API key."

  - name: a well-formed tvly- key that is simply wrong is the same sentence again
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Authorization: Bearer tvly-junkkey1234567890abcdef
      json:
        query: cauldron search recipe
    expect:
      status: 401
      body:
        "detail.error": "Unauthorized: missing or invalid API key."

  - name: a wrong method on a real path is refused for its credential, not its verb
    # GET where POST is the only method /search has, no credential sent at
    # all -- this is what shows the gate runs ahead of routing on a path
    # Tavily actually has. See the header for the unrouted-path contrast
    # this format cannot express in the same Recipe.
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: GET
      path: /search
    expect:
      status: 401
      body:
        "detail.error": "Unauthorized: missing or invalid API key."

  - name: no rate-limit header survives an auth failure
    source: https://api.tavily.com/search
    verified: "2026-09-03"
    fixture: results
    request:
      method: POST
      path: /search
      json:
        query: cauldron search recipe
    expect:
      status: 401
      absent_headers:
        - Retry-After
        - X-RateLimit-Limit
        - X-RateLimit-Remaining

  - name: a result carries a relevance score and no publication or crawl date
    # Tavily's own schema documents score and does not document
    # published_date, crawled_at or anything resembling either on a result
    # object -- see the header. No key was held to call this live, so no
    # verified date.
    source: https://docs.tavily.com/documentation/api-reference/endpoint/search
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Authorization: Bearer tvly-cauldronfixturekey0000000000000000
      json:
        query: cauldron search recipe
    expect:
      status: 200
      body:
        "results[0].title": "Cauldron: fixtures for API integrations"
        "results[0].score": 0.8123456
        usage.credits: 1
      absent:
        - "results[0].published_date"
        - "results[0].publishedDate"
        - "results[0].crawled_at"
        - "results[0].date"
        - answer

  - name: an answer, when asked for, carries no reference to which result it came from
    # The finding this Recipe exists for. include_answer is a real request
    # field, matched as a whole word -- see the header's stated limit. No
    # key was held to call this live.
    source: https://docs.tavily.com/documentation/api-reference/endpoint/search
    fixture: results
    request:
      method: POST
      path: /search
      headers:
        Authorization: Bearer tvly-cauldronfixturekey0000000000000000
      json:
        query: cauldron search recipe
        include_answer: true
    expect:
      status: 200
      body:
        answer: A synthesis of the results below, generated by an LLM and not attributed to any one of them.
        "results[0].title": "Cauldron: fixtures for API integrations"
      absent:
        # Nothing in Tavily's own schema names a citation, a source index or
        # a per-sentence reference back into results -- see the header.
        - answer_citations
        - answer_references
        - answer_sources
        - "answer.citations"
        - "answer.sources"
