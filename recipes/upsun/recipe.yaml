# Upsun Recipe for Cauldron
#
# The organizations listing, read from the OpenAPI document Upsun serves without
# a credential at meta.upsun.com/openapi-spec, and struck live against
# api.upsun.com on 2026-09-13 with no credential, with a deliberately invalid
# one, on the deprecated path, and on an organization that does not exist.
#
# **Four failure shapes, from one API.** Struck live:
#
#   /projects                      400 application/problem+json
#                                  {"type":"http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.1",
#                                   "title":"Deprecated endpoint. See https://docs.upsun.com/api/",
#                                   "status":400,"detail":"Bad Request."}
#   /organizations                 401 {"error":"authentication_required","error_description":"Bearer authentication is required."}
#   /organizations (wrong token)   401 {"error":"invalid_token","error_description":"The access token is invalid."}
#   /organizations/<uuid>/projects 404 {"status":404,"title":"Not Found","message":"Organization not found."}
#
# A problem document, an OAuth error, another OAuth error, and a fourth object
# that is half a problem document -- `title` from RFC 9457 and `message` where
# `detail` belongs. Four shapes, two media types, and nothing in a response
# saying which to expect.
#
# **The deprecation notice is typed with a dead specification.** RFC 9457 says
# `type` is a URI identifying the *problem kind*, and that dereferencing it
# should give human-readable documentation of that kind. This one points at
# section 10.4.1 of RFC 2616 -- the 1999 HTTP/1.1 specification's definition of
# "400 Bad Request", obsoleted in 2014. So the machine-readable identity of the
# problem is a link to a retired document's definition of the status code that
# is already sitting in the `status` field.
#
# **And `title` and `detail` are the wrong way round.** RFC 9457 says `title` is
# a summary of the problem *type* that "SHOULD NOT change from occurrence to
# occurrence", and `detail` is the explanation specific to this occurrence.
# Here `title` carries the deprecation notice and a URL, and `detail` carries
# the generic phrase `Bad Request.` -- so the stable field holds the specific
# message and the specific field holds the generic one.
#
# **The notice points at the documentation of the API that sent it.** Not at a
# replacement endpoint: at `docs.upsun.com/api/`, the whole reference. A client
# reading this has been told that something is deprecated and not what to call
# instead.
#
# **And `/projects` is not in the description at all.** 187 paths, and the one
# that answers the deprecation notice is not among them.
#
# **Whether you are asked to authenticate depends on whether the path has an id
# in it.** With no credential, `/organizations` answers 401
# `authentication_required` and `/organizations/<a uuid>/projects` answers 404
# `Organization not found.` -- so identifier lookup runs before the credential
# check on the second, and an anonymous caller can tell a real organization id
# from a made-up one.
#
# **The 401 is not declared.** `GET /organizations` lists 200, 400 and 403 --
# and answers 401 to every request arriving without a token.
#
# **api.platform.sh answers all of this byte for byte.** Two brands, one
# gateway, and a deprecation notice on one of them pointing at the other's
# documentation.
#
# **One record, two identifier formats.** `id` is a ULID and `owner_id` is a
# UUID, on the same object, for the organization and the person who owns it.
#
# **And three fields are the organization's name.** `namespace` ("the namespace
# in which the organization name is unique"), `name` ("a unique machine name")
# and `label` ("the human-readable label"). Nothing in the record says which one
# a caller sends back.
#
# **Nothing on the record is required.** Seventeen properties and no `required`
# array, including `id`.
#
# **And the page size defaults to something its own type forbids.**
# `page[size]` is declared `{"type": "integer", "minimum": 1, "default": null}`.
# null is not an integer and is not at least 1, so the default the description
# gives is not a value the parameter permits.

recipe: upsun
capability: hosting
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://docs.upsun.com/api/
  spec: https://meta.upsun.com/openapi-spec
  spec_hash: dd42d9260418de4c9e0f20df55c52067c0ef67fa971465650d64b75211e74c4f
  spec_seen: "2026-09-13"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n.up5un.f1xturet0ken
  # Two OAuth codes for the two credential states, which is more than most of
  # this collection manages.
  absent_error: authentication_required
  rejected_error: invalid_token
  after_routing: true

responses:
  list:
    style: wrapped
    key: items
    count_field: count
    cursor_field: _links.next.href
    cursor_url: absolute
    prev_field: _links.previous.href
  error:
    # RFC 6749's shape, which two of the four failures use.
    style: flat
    message_field: error_description
    code_field: error
    code_type: string

resources:
  organization:
    id:
      # A ULID, beside an owner_id that is a UUID.
      field: id
      style: opaque
      length: 26
    fields:
      # Three fields are the name: the namespace it is unique within, the
      # machine name, and the label a person reads.
      namespace:
        type: string
      name:
        type: string
      label:
        type: string
      # fixed or flexible.
      type:
        type: string
      owner_id:
        type: string
      country:
        type: string
      # active or restricted.
      status:
        type: string
      vendor:
        type: string
      billing_profile_id:
        type: string
      billing_legacy:
        type: boolean
      # An email address, on the organization record.
      security_contact:
        type: string
      capabilities:
        type: list
      ai_agent_settings:
        type: map
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /organizations
    resource: organization
    operation: list
    pagination:
      style: cursor
      max_limit: 100
      # Declared `"default": null` on an integer with a minimum of 1, so the
      # default the description gives is not a value the type permits.
      limit: 20
      limit_param: page[size]
      cursor_param: page[after]

  - method: GET
    # Not in the description's 187 paths, and the only thing it answers is
    # the notice that it is gone -- to a caller with no credential, which is
    # the only kind of caller that sees it.
    path: /projects
    public: true
    error: deprecated_endpoint

errors:
  authentication_required:
    status: 401
    code: authentication_required
    message: Bearer authentication is required.

  invalid_token:
    status: 401
    code: invalid_token
    message: The access token is invalid.

  deprecated_endpoint:
    status: 400
    # A problem document, where the two failures above are OAuth errors.
    style: flat
    code_field: "-"
    # RFC 9457 says this should not change from occurrence to occurrence. It
    # is the only place the notice appears.
    message_field: title
    message: "Deprecated endpoint. See https://docs.upsun.com/api/"
    headers:
      Content-Type: application/problem+json; charset=utf-8
    fields:
      # Section 10.4.1 of the 1999 HTTP/1.1 specification, obsoleted in 2014:
      # the definition of the status code already in the field below.
      type: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.1
      status: 400
      # The per-occurrence field, carrying the generic phrase.
      detail: Bad Request.

fixtures:
  empty:
    organization: []

  account:
    organization:
      - id: 01JQZ8XK4M7N2P5R9T3V6W8Y0B
        namespace: upsun
        name: cauldron
        label: Cauldron
        type: flexible
        # A UUID, beside an id that is a ULID.
        owner_id: 2c6b9a4a-2b9c-4d3f-9e21-2a6b6a2f0b3d
        country: GB
        status: active
        vendor: upsun
        billing_profile_id: bp-8127
        billing_legacy: false
        security_contact: security@example.com
        capabilities:
          - projects
          - observability
        ai_agent_settings: {}
        created_at: "2024-03-11T08:30:00Z"
        updated_at: "2026-08-22T13:45:10Z"
      - id: 01JQZ8XK4M7N2P5R9T3V6W8Y0C
        namespace: upsun
        name: cauldron-labs
        label: Cauldron Labs
        type: fixed
        owner_id: 2c6b9a4a-2b9c-4d3f-9e21-2a6b6a2f0b3d
        country: GB
        # The other value of the enum.
        status: restricted
        vendor: upsun
        billing_profile_id: bp-8128
        billing_legacy: true
        security_contact: security@example.com
        capabilities: []
        ai_agent_settings: {}
        created_at: "2025-01-04T10:00:00Z"
        updated_at: "2026-09-01T06:30:00Z"

conformance:
  - name: no credential names the scheme it wants
    source: https://api.upsun.com/organizations
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /organizations
      headers: {}
    expect:
      # Undeclared: this operation lists 200, 400 and 403 and no 401.
      status: 401
      body:
        error: authentication_required
        error_description: Bearer authentication is required.

  - name: a wrong credential is a different OAuth code
    source: https://api.upsun.com/organizations
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 401
      body:
        # Two codes for two states, which is more than most of this
        # collection manages.
        error: invalid_token
        error_description: The access token is invalid.

  - name: the deprecated path is typed with a retired specification
    source: https://api.upsun.com/projects
    verified: "2026-09-13"
    fixture: account
    request:
      method: GET
      path: /projects
      headers: {}
    expect:
      status: 400
      headers:
        # A problem document, where the two failures above are OAuth errors.
        Content-Type: application/problem+json; charset=utf-8
      body:
        # RFC 2616 section 10.4.1 is the 1999 definition of "400 Bad
        # Request", and 400 is already in the status field below it.
        type: http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html#sec10.4.1
        status: 400
        # The notice is in the field RFC 9457 says should not change between
        # occurrences...
        title: "Deprecated endpoint. See https://docs.upsun.com/api/"
        # ...and the field for this occurrence carries the generic phrase.
        detail: Bad Request.

  - name: an organization is named three times
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
    expect:
      status: 200
      body:
        # The namespace it is unique within, the machine name, and the label
        # a person reads. Nothing says which one goes back in a request.
        'items[0].namespace': upsun
        'items[0].name': cauldron
        'items[0].label': Cauldron

  - name: one record carries two identifier formats
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
    expect:
      status: 200
      body:
        # A ULID for the organization and a UUID for the person who owns it.
        'items[0].id': 01JQZ8XK4M7N2P5R9T3V6W8Y0B
        'items[0].owner_id': 2c6b9a4a-2b9c-4d3f-9e21-2a6b6a2f0b3d
        'items[0].type': flexible
        'items[1].type': fixed

  - name: billing and security sit on the organization
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
    expect:
      status: 200
      body:
        # An email address, a billing profile, and a boolean saying the
        # account is on the old billing system.
        'items[0].security_contact': security@example.com
        'items[0].billing_profile_id': bp-8127
        'items[1].billing_legacy': true
        'items[0].billing_legacy': false
        'items[0].country': GB
        'items[0].vendor': upsun

  - name: the status enum has two values and both are here
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
    expect:
      status: 200
      body:
        'items[0].status': active
        'items[1].status': restricted
        'items[0].capabilities[0]': projects
        'items[1].capabilities': []
        'items[0].ai_agent_settings': {}
        'items[0].created_at': "2024-03-11T08:30:00Z"
        'items[0].updated_at': "2026-08-22T13:45:10Z"

  - name: the page carries a total and a link to the next
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
      query:
        page[size]: "1"
    expect:
      status: 200
      body:
        count: 2
        'items[0].id': 01JQZ8XK4M7N2P5R9T3V6W8Y0B
      matches:
        # A whole URL, in a links object spelled the same way each record's
        # own _links is.
        '_links.next.href': '^https?://'

  - name: the cursor is the last record's identifier
    source: https://meta.upsun.com/openapi-spec
    fixture: account
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
      query:
        page[size]: "1"
        page[after]: 01JQZ8XK4M7N2P5R9T3V6W8Y0B
    expect:
      status: 200
      body:
        'items[0].id': 01JQZ8XK4M7N2P5R9T3V6W8Y0C
        'items[0].label': Cauldron Labs

  - name: an account with no organizations still carries the count
    source: https://meta.upsun.com/openapi-spec
    fixture: empty
    request:
      method: GET
      path: /organizations
      headers:
        Authorization: "Bearer cauldr0n.up5un.f1xturet0ken"
    expect:
      status: 200
      body:
        items: []
        count: 0
