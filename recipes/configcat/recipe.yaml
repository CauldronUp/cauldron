# ConfigCat Recipe for Cauldron
#
# Two paths that differ by one character, and the thing you came for has a
# different name in each.
#
# ConfigCat serves a flag's value at /v1/settings/{settingKeyOrId}/value and at
# /v2/settings/{settingKeyOrId}/value. Both are current, both are documented,
# and they answer with different documents:
#
#   v1  SettingValueModel   -- value, rolloutRules, rolloutPercentageItems
#   v2  SettingFormulaModel -- defaultValue, targetingRules,
#                              percentageEvaluationAttribute
#
# The field holding the value is called value in one and defaultValue in the
# other. The targeting rules are two arrays in one and one array in the other.
# Nothing in either path says which vocabulary it speaks except the digit, and
# a client that upgrades the URL and not the reader gets undefined from a 200.
#
# Written against the OpenAPI document ConfigCat serves at
# api.configcat.com/docs/v1/swagger.json -- 76 paths, 204 schemas, and the
# source of every description quoted here.
#
# Four more the Recipe pins:
#
#   1. Two credentials in one request, doing different jobs. The Authorization
#      header carries Basic credentials that say who you are; X-CONFIGCAT-SDKKEY
#      says which config and environment you mean. Only six of the API's
#      seventy-six operations take the SDK key, and they are exactly these: the
#      value endpoints. So the request that reads a flag needs a secret the
#      rest of the API has no use for.
#   2. One path segment, two identifier spaces. Of settingKeyOrId: "The key or
#      id of the Setting." A setting has a key, which is a string a human
#      chose, and a settingId, which is an int32 -- and both go in the same
#      slot. A flag whose key is "42" is addressed by the URL that also
#      addresses setting number 42.
#   3. "May I save this" has four answers in v2 and one in v1. v2 sends
#      readOnly ("Indicates whether you have Read-only access to the
#      Environment"), approveRequired ("a mandatory approval is required for
#      saving and publishing"), canBypassApproval and reasonRequired ("a
#      mandatory note required for saving and publishing"). v1 sends readOnly
#      alone, so the same flag looks editable on one path and gated on the
#      other.
#   4. The type of value follows the flag. settingType is boolean, string, int
#      or double, and value "must respect the setting type" -- so one field's
#      JSON type is different per flag, and isJson sits beside settingType for
#      the strings that are really documents.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Addressing a setting by its numeric id is described above and not
#     served. This format looks a record up by one named field, and the point
#     of settingKeyOrId is that it accepts two -- so the ambiguity is written
#     down and the key form is what the cases use. What is served is the
#     other half of it: the response carries both identifiers, so the
#     collision is visible in the data.
#   - Writing a value is absent. A PUT or PATCH here can be refused for want
#     of a note -- the reason query parameter exists "if the Product's 'Config
#     changes require a reason' preference is turned on" -- and that is a
#     rule about a product setting rather than about a request.
#   - The management surface is absent: products, configs, environments,
#     members, permission groups, tags, segments, webhooks, audit logs, code
#     references and change requests are seventy of the seventy-six paths.
#
# The credentials and flags below are fixtures and belong to no product.

recipe: configcat
capability: flags
version: 0.1.0

upstream:
  api: v1
  docs: https://api.configcat.com/docs/

auth:
  # "To authenticate with the API you have to fill the Authorization HTTP
  # request header with your Public API credentials." The password half is the
  # secret; the username half is the Basic auth id.
  scheme: basic
  credential: password
  keys:
    - cauldronFixtureManagementApiPassword0000

required_headers:
  # The second credential, and the one that says which environment the answer
  # is about. Six operations in the whole API take it.
  X-CONFIGCAT-SDKKEY: invalid_request

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  setting_value:
    id:
      style: opaque
      field: "-"
    fields:
      # v1 calls it value.
      value:
        type: boolean
      rolloutRules:
        type: list
      rolloutPercentageItems:
        type: list
      setting:
        type: map
      config:
        type: map
      environment:
        type: map
      readOnly:
        type: boolean
      updatedAt:
        type: datetime
      lastUpdaterUserEmail:
        type: string

  setting_formula:
    id:
      style: opaque
      field: "-"
    fields:
      # v2 calls it defaultValue, and wraps it.
      defaultValue:
        type: map
      targetingRules:
        type: list
      percentageEvaluationAttribute:
        type: string
      lastVersionId:
        type: string
      setting:
        type: map
      config:
        type: map
      environment:
        type: map
      readOnly:
        type: boolean
      approveRequired:
        type: boolean
      canBypassApproval:
        type: boolean
      reasonRequired:
        type: boolean
      changeRequestCount:
        type: integer

routes:
  - method: GET
    path: /v1/settings/{id}/value
    resource: setting_value
    operation: get

  - method: GET
    path: /v2/settings/{id}/value
    resource: setting_formula
    operation: get

errors:
  # Verified live against api.configcat.com on the exact route this Recipe
  # models, with no Authorization header at all and with a made-up Basic
  # credential: byte-identical 401 with no body at all -- not this JSON,
  # which had never been checked against the live host.
  authentication_error:
    status: 401
    empty: true

  resource_missing:
    status: 404
    message: Not Found

  invalid_request:
    status: 400
    message: The X-CONFIGCAT-SDKKEY header is required.

fixtures:
  empty: {}

  product:
    setting_value:
      - id: isAwesomeFeatureEnabled
        # A boolean flag, so the value is a boolean. A string flag's would be
        # a string and an int flag's a number, from the same field.
        value: true
        rolloutRules:
          - comparisonAttribute: Email
            comparator: contains
            comparisonValue: "@cauldron.test"
            value: false
        rolloutPercentageItems:
          - percentage: 20
            value: false
        setting:
          settingId: 42
          key: isAwesomeFeatureEnabled
          name: Awesome feature
          settingType: boolean
        config:
          configId: 08d8becf-1b8e-4b1e-9b0e-000000000001
          name: Main config
        environment:
          environmentId: 08d8becf-1b8e-4b1e-9b0e-000000000002
          name: Production
        readOnly: false
        updatedAt: "2026-05-19T14:22:31Z"
        lastUpdaterUserEmail: ada@cauldron.test

    setting_formula:
      - id: isAwesomeFeatureEnabled
        defaultValue:
          boolValue: true
        targetingRules:
          - conditions:
              - userCondition:
                  comparisonAttribute: Email
                  comparator: sensitiveTextEquals
                  stringValue: ada@cauldron.test
            value:
              boolValue: false
        percentageEvaluationAttribute: Identifier
        lastVersionId: 08d8becf-1b8e-4b1e-9b0e-000000000003
        setting:
          settingId: 42
          key: isAwesomeFeatureEnabled
          name: Awesome feature
          settingType: boolean
        config:
          configId: 08d8becf-1b8e-4b1e-9b0e-000000000001
          name: Main config
        environment:
          environmentId: 08d8becf-1b8e-4b1e-9b0e-000000000002
          name: Production
        readOnly: false
        approveRequired: true
        canBypassApproval: false
        reasonRequired: true
        changeRequestCount: 2

conformance:
  - name: v1 calls the value value
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        # SettingValueModel: a bare value, and two separate rule arrays.
        value: true
        "rolloutRules[0].comparator": contains
        "rolloutPercentageItems[0].percentage": 20
      absent:
        - defaultValue
        - targetingRules

  - name: and v2 calls it defaultValue and wraps it
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v2/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        # SettingFormulaModel, from a path one character away. The value is
        # under a different name and inside an object, and the two rule arrays
        # have become one.
        "defaultValue.boolValue": true
        "targetingRules[0].value.boolValue": false
        percentageEvaluationAttribute: Identifier
      absent:
        - value
        - rolloutRules
        - rolloutPercentageItems

  - name: may I save this has four answers on v2 and one on v1
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v2/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        # Not read-only, and still not saveable without an approval and a
        # note. v1 sends readOnly alone, so the same flag looks editable
        # there.
        readOnly: false
        approveRequired: true
        canBypassApproval: false
        reasonRequired: true
        changeRequestCount: 2

  - name: v1 answers the same question with readOnly and nothing else
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        readOnly: false
      absent:
        - approveRequired
        - reasonRequired
        - canBypassApproval

  - name: the path took a key and the body carries a number as well
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        # "The key or id of the Setting." Both live on the object, one a
        # string somebody chose and one an int32, and the same URL slot takes
        # either -- so a flag keyed "42" collides with setting number 42.
        "setting.key": isAwesomeFeatureEnabled
        "setting.settingId": 42
        "setting.settingType": boolean

  - name: the value's type follows the flag's type
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 200
      body:
        # settingType is boolean, string, int or double, and the value "must
        # respect the setting type" -- so this field's JSON type is a
        # property of the flag rather than of the API.
        value: true
        "setting.settingType": boolean

  - name: the second credential is required and the first does not stand in
    source: https://api.configcat.com/docs/v1/swagger.json
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
    expect:
      # Authenticated, and still refused: the SDK key is what says which
      # config and environment the question is about.
      status: 400
      body:
        message: The X-CONFIGCAT-SDKKEY header is required.

  - name: credentials this product does not know are refused
    # Corrected against a live check: this had asserted a JSON body,
    # {"message":"Unauthorized"}. Struck live against api.configcat.com on
    # this exact route, the real answer carries no body at all.
    source: https://api.configcat.com/docs/v1/swagger.json
    verified: "2026-09-05"
    fixture: product
    request:
      method: GET
      path: /v1/settings/isAwesomeFeatureEnabled/value
      headers:
        Authorization: "Basic Y2F1bGRyb246bm90LXRoZS1yaWdodC1wYXNzd29yZA=="
        X-CONFIGCAT-SDKKEY: configcat-sdk-1/cauldronFixtureSdkKey/000000000000
    expect:
      status: 401
      no_body: true

  # The names. This Recipe declares 3 field(s) on a setting_formula that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a setting_formula carries the field names this Recipe declares"
    source: "https://api.configcat.com/docs/v1/swagger.json"
    fixture: product
    request:
      method: GET
      path: "/v2/settings/isAwesomeFeatureEnabled/value"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        "X-CONFIGCAT-SDKKEY": "configcat-sdk-1/cauldronFixtureSdkKey/000000000000"
    expect:
      status: 200
      body:
        "lastVersionId": "08d8becf-1b8e-4b1e-9b0e-000000000003"

  # The names. This Recipe declares 4 field(s) on a setting_value that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a setting_value carries the field names this Recipe declares"
    source: "https://api.configcat.com/docs/v1/swagger.json"
    fixture: product
    request:
      method: GET
      path: "/v1/settings/isAwesomeFeatureEnabled/value"
      headers:
        "Authorization": "Basic Y2F1bGRyb246Y2F1bGRyb25GaXh0dXJlTWFuYWdlbWVudEFwaVBhc3N3b3JkMDAwMA=="
        "X-CONFIGCAT-SDKKEY": "configcat-sdk-1/cauldronFixtureSdkKey/000000000000"
    expect:
      status: 200
      body:
        "lastUpdaterUserEmail": "ada@cauldron.test"
        "updatedAt": "2026-05-19T14:22:31Z"

