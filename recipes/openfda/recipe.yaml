# openFDA Recipe for Cauldron
#
# Every value begins with its own field name.
#
#   "purpose":     ["Purpose Pain reliever"]
#   "warnings":    ["Warnings Reye's syndrome : Children and teenagers ..."]
#   "do_not_use":  ["Do not use if you are allergic to aspirin ..."]
#   "stop_use":    ["Stop use and ask a doctor if an allergic reaction ..."]
#   "questions":   ["Questions or comments? Call 1-877-753-3935 ..."]
#
# These are scanned drug labels, and the section heading came along with the
# section. So the field name is both the machine-readable key and the first
# words of the human-readable value, and rendering "Purpose: Purpose Pain
# reliever" is the natural thing to build.
#
# **And two of them begin with a different field's name.**
# indications_and_usage starts "Uses for the temporary relief", and
# storage_and_handling starts "Other information store between". So stripping
# the prefix is not a fix: the prefix is the heading printed on the box, the key
# is what a database called it, and they are not the same vocabulary.
#
# Written against the live API rather than a document: every case below was
# checked against api.fda.gov on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. Every field is an array of one. Not just the repeated ones -- brand_name,
#      generic_name, application_number, route, purpose, warnings, all of them,
#      one element each. A client reading label.purpose gets an array and
#      renders "[object Object]" or a comma.
#   2. Finding nothing is a 404, and so is a typo. A search that matches no
#      records answers {"error": {"code": "NOT_FOUND", "message": "No matches
#      found!"}} -- with an exclamation mark -- and a search naming a field that
#      does not exist answers exactly the same thing, byte for byte. There is
#      nothing to tell an empty result from a misspelt query.
#   3. A path that does not exist is Express's default page. `<pre>Cannot GET
#      /drug/nosuchendpoint.json</pre>` in text/html, from the web framework
#      rather than the API, on a host whose every other answer is JSON.
#
# And the temperature is written with the wrong character. "store between
# 15-30ºC" uses U+00BA MASCULINE ORDINAL INDICATOR, not U+00B0 DEGREE SIGN --
# a character that looks right at a glance, sorts differently, and does not
# match a search for degrees.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One label is served, of 441 matching aspirin alone, and its longer text
#     fields are trimmed to their opening sentence.
#   - last_updated moves with the data. It is the date recorded.

recipe: openfda
capability: docs
version: 0.1.0

upstream:
  api: openfda
  docs: https://open.fda.gov/apis/

auth:
  # Public. A key raises the rate limit.
  scheme: none

responses:
  success:
    fields:
      # A paragraph of legal text, in every successful response.
      meta:
        disclaimer: "Do not rely on openFDA to make decisions regarding medical care. While we make every effort to ensure that data is accurate, you should assume all results are unvalidated. We may limit or otherwise restrict your access to the API in line with our Terms of Service."
        terms: https://open.fda.gov/terms/
        license: https://open.fda.gov/license/
        last_updated: "2026-08-28"
        results:
          skip: 0
          limit: 1
          total: 441
  list:
    style: wrapped
    key: results
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: code

resources:
  label:
    id:
      style: uuid
      field: id
    fields:
      # Every one of these is an array of one.
      purpose:
        type: list
      indications_and_usage:
        type: list
      warnings:
        type: list
      do_not_use:
        type: list
      stop_use:
        type: list
      keep_out_of_reach_of_children:
        type: list
      questions:
        type: list
      active_ingredient:
        type: list
      inactive_ingredient:
        type: list
      storage_and_handling:
        type: list
      # A date with no separators, and a number as a string.
      effective_time:
        type: string
      version:
        type: string
      set_id:
        type: string
      openfda:
        type: map

routes:
  - method: GET
    path: /drug/label.json
    resource: label
    operation: list

    pagination:
      # limit and skip, and the default is **one**. Struck live on
      # 2026-09-05: a bare request answers a single label with meta.results
      # {"skip": 0, "limit": 1, "total": 262663}, and ?limit=2&skip=2
      # answers {"skip": 2, "limit": 2} -- the API echoing both parameters
      # back under the names it reads them from.
      #
      # A default of one is worth having right. This Recipe was serving ten,
      # so a client that never sets a limit saw ten here and one from
      # openFDA, which is the difference between a loop that runs and a loop
      # that thinks it has finished.
      style: offset
      limit: 1
      limit_param: limit
      cursor_param: skip
  # A search that matches nothing, and a search naming a field that does not
  # exist. The same answer, byte for byte.
  - method: GET
    path: /drug/label-no-matches.json
    error: no_matches

  # The web framework's own page, on a JSON API.
  - method: GET
    path: /drug/nosuchendpoint.json
    error: cannot_get
    headers:
      Content-Type: text/html; charset=utf-8

errors:
  no_matches:
    status: 404
    code: NOT_FOUND
    # With an exclamation mark.
    message: No matches found!

  cannot_get:
    status: 404
    style: text
    message: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Error</title>\n</head>\n<body>\n<pre>Cannot GET /drug/nosuchendpoint.json</pre>\n</body>\n</html>\n"

fixtures:
  empty: {}

  labels:
    label:
      - id: 008ee85b-5cac-45a6-a857-a828f8125175
        # The value begins with the key.
        purpose:
          - Purpose Pain reliever
        # And these two begin with a different key.
        indications_and_usage:
          - Uses for the temporary relief of minor aches and pains or as recommended by your doctor.
        storage_and_handling:
          - "Other information store between 15-30ºC (59-86ºF)"
        warnings:
          - "Warnings Reye's syndrome : Children and teenagers who have or are recovering from chicken pox or flu-like symptoms should not use this product."
        do_not_use:
          - Do not use if you are allergic to aspirin or any other pain reliever/fever reducer.
        stop_use:
          - Stop use and ask a doctor if an allergic reaction occurs. Seek medical help right away.
        keep_out_of_reach_of_children:
          - Keep out of reach of children. In case of overdose, get medical help or contact a Poison Control Center right away.
        questions:
          - Questions or comments? Call 1-877-753-3935 Monday-Friday 9AM-5PM EST
        active_ingredient:
          - Active ingredient (in each tablet) Aspirin 81 mg (NSAID)* *nonsteroidal anti-inflammatory drug
        inactive_ingredient:
          - Inactive ingredients croscarmellose sodium, D&C yellow #10, lactose monohydrate, methacrylic acid copolymer
        # Eight digits, no separators.
        effective_time: "20240416"
        # A number, quoted.
        version: "3"
        set_id: 0058175f-3474-40c3-a046-6cfaec86d84b
        openfda:
          application_number:
            - M013
          brand_name:
            - Low Dose Aspirin
          generic_name:
            - ASPIRIN
          manufacturer_name:
            - P & L Development, LLC
          product_ndc:
            - 59726-065
          product_type:
            - HUMAN OTC DRUG
          route:
            - ORAL
          substance_name:
            - ASPIRIN

conformance:
  - name: every value begins with its own field name
    source: https://api.fda.gov/drug/label.json?limit=1&search=openfda.brand_name:aspirin
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label.json
    expect:
      status: 200
      body:
        # The key is the first word of the value, because the section heading
        # came along with the section.
        "results[0].purpose[0]": Purpose Pain reliever
        "results[0].questions[0]": Questions or comments? Call 1-877-753-3935 Monday-Friday 9AM-5PM EST
        "results[0].do_not_use[0]": Do not use if you are allergic to aspirin or any other pain reliever/fever reducer.
        "results[0].stop_use[0]": Stop use and ask a doctor if an allergic reaction occurs. Seek medical help right away.

  - name: and two of them begin with a different field's name
    source: https://api.fda.gov/drug/label.json?limit=1&search=openfda.brand_name:aspirin
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label.json
    expect:
      status: 200
      body:
        # "Uses", not "Indications and usage".
        "results[0].indications_and_usage[0]": Uses for the temporary relief of minor aches and pains or as recommended by your doctor.
        # "Other information", not "Storage and handling". So stripping the
        # prefix is not a fix -- the prefix is the heading printed on the box
        # and the key is what a database called it.
        "results[0].storage_and_handling[0]": "Other information store between 15-30ºC (59-86ºF)"

  - name: every field is an array of one
    source: https://api.fda.gov/drug/label.json?limit=1&search=openfda.brand_name:aspirin
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label.json
    expect:
      status: 200
      body:
        # Not just the long text: the identifiers too, one element each.
        "results[0].openfda.brand_name[0]": Low Dose Aspirin
        "results[0].openfda.generic_name[0]": ASPIRIN
        "results[0].openfda.application_number[0]": M013
        "results[0].openfda.route[0]": ORAL
        "results[0].openfda.product_type[0]": HUMAN OTC DRUG

  - name: the date has no separators and the version is a string
    source: https://api.fda.gov/drug/label.json?limit=1&search=openfda.brand_name:aspirin
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label.json
    expect:
      status: 200
      body:
        # Eight digits, so sorting works and parsing does not.
        "results[0].effective_time": "20240416"
        # A number, quoted.
        "results[0].version": "3"
        "results[0].set_id": 0058175f-3474-40c3-a046-6cfaec86d84b

  - name: the legal text rides in every success
    source: https://api.fda.gov/drug/label.json?limit=1&search=openfda.brand_name:aspirin
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label.json
    expect:
      status: 200
      body:
        # A paragraph, on every response, above the data.
        "meta.disclaimer": "Do not rely on openFDA to make decisions regarding medical care. While we make every effort to ensure that data is accurate, you should assume all results are unvalidated. We may limit or otherwise restrict your access to the API in line with our Terms of Service."
        "meta.terms": https://open.fda.gov/terms/
        "meta.license": https://open.fda.gov/license/
        "meta.last_updated": "2026-08-28"
        # Paging nested one level down from where a client would look.
        "meta.results.skip": 0
        "meta.results.limit": 1
        "meta.results.total": 441

  - name: finding nothing is a 404, with an exclamation mark
    source: https://api.fda.gov/drug/label.json?search=openfda.brand_name:zzzznotadrug&limit=1
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/label-no-matches.json
    expect:
      # An empty result set, reported as a failure. A search naming a field
      # that does not exist answers exactly this too, byte for byte, so there
      # is nothing to tell an empty result from a misspelt query.
      status: 404
      body:
        "error.code": NOT_FOUND
        "error.message": No matches found!

  - name: and a path that does not exist is the web framework's own page
    source: https://api.fda.gov/drug/nosuchendpoint.json?limit=1
    verified: "2026-08-30"
    fixture: labels
    request:
      method: GET
      path: /drug/nosuchendpoint.json
    expect:
      # From Express rather than the API, in HTML, on a host whose every other
      # answer is JSON.
      status: 404
      headers:
        Content-Type: text/html
      # Anchored at the first byte, because an envelope carrying the HTML
      # inside a field would contain the same tag and the point is that
      # nothing wraps it.
      body_matches: '^<!DOCTYPE html>[\s\S]*<pre>Cannot GET /drug/nosuchendpoint\.json</pre>'
