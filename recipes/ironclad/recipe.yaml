# Ironclad Recipe for Cauldron
#
# Written against Ironclad's API reference at developer.ironcladapp.com and
# struck live against ironcladapp.com on 2026-09-07 with no credential, with a
# deliberately invalid one, and on a path that does not exist.
#
# **One response to three mistakes, padded with spaces.** Struck live:
#
#   GET /public/api/v1/records                      (no credential)
#   GET /public/api/v1/records                      Authorization: Bearer notreal
#   GET /public/api/v1/cauldron-nope                Authorization: Bearer notreal
#
#   401 { "code": "UNAUTHORIZED", "message": "invalid authentication token" }
#
# Byte-identical all three times, including the whitespace: a space after the
# opening brace and a space before the closing one. That is a serialiser
# configured for readability rather than for bytes, and it means every fixture
# anybody records by hand carries the padding -- the same class of tell as
# [gong](../gong)'s space before each colon and [tinybird](../tinybird)'s
# space after.
#
# **"invalid authentication token" is the answer to sending no token.** The
# seventh provider in this collection to describe the wrong failure. It is
# also lower case throughout, beside a `code` in screaming snake -- so one
# object has a shouted constant and an uncapitalised sentence.
#
# **An unknown path is a 401.** So the route is judged after the credential and
# a path cannot be shown not to exist -- and for a contracts API, where the
# whole surface is behind an account, that means nothing about it is
# discoverable from outside at all.
#
# **The path says `public`.** `/public/api/v1/...` -- a segment distinguishing
# this surface from Ironclad's internal one, which is a reasonable thing for a
# company to need and an odd thing for a caller to type. Every URL a customer
# writes carries a word that is only meaningful inside the company.

recipe: ironclad
capability: signing
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.ironcladapp.com/reference/
  # No spec: Ironclad publishes a rendered reference site.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-1roncl4d-f1xture-t0ken-0000
  # One response for both, and it describes the second.
  absent_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: list
    count_field: count
    page_field: page
    limit_field: pageSize
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  record:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      type:
        type: string
      lastUpdated:
        type: datetime
      properties:

routes:
  - method: GET
    path: /public/api/v1/records
    resource: record
    operation: list
    pagination:
      style: page
      limit: 100
      limit_param: pageSize
      cursor_param: page

errors:
  unauthorized:
    status: 401
    code: UNAUTHORIZED
    # Lower case throughout, beside a code in screaming snake -- and it is the
    # answer to sending no token as well as to sending a wrong one.
    message: "invalid authentication token"

fixtures:
  empty:
    record: []

  workspace:
    record:
      - id: 5f4b1c9e-2a7d-48f0-b3e6-c1a95d720843
        name: Northwind MSA 2026
        type: msa
        lastUpdated: "2026-08-30T14:02:11.000Z"
        properties:
          counterpartyName:
            value: Northwind Traders
          contractValue:
            value: 240000
      - id: c81e728d-9d4c-4f63-af06-7f89cc14862c
        name: Contoso NDA
        type: nda
        lastUpdated: "2026-09-02T09:41:00.000Z"
        # Every property is an object with a `value` inside it, even when the
        # value is a string -- so reading a field is two hops, and a property
        # that has never been set is absent rather than a wrapper holding null.
        properties:
          counterpartyName:
            value: Contoso Ltd

conformance:
  - name: three mistakes get one response
    source: https://ironcladapp.com/public/api/v1/records
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers: {}
    expect:
      status: 401
      body:
        code: UNAUTHORIZED
        message: "invalid authentication token"

  - name: a wrong token is byte-identical
    source: https://ironcladapp.com/public/api/v1/records
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # The sentence describes this request and the one above, and only one
        # of them sent a token. The seventh provider here to do that.
        message: "invalid authentication token"

  - name: an unknown path is a credential failure
    source: https://ironcladapp.com/public/api/v1/cauldron-nope
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      # The route is judged after the credential, so for a contracts API whose
      # whole surface is behind an account, nothing about it is discoverable
      # from outside.
      status: 401
      body:
        code: UNAUTHORIZED

  - name: the code shouts and the sentence does not
    source: https://ironcladapp.com/public/api/v1/records
    verified: "2026-09-07"
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers: {}
    expect:
      status: 401
      body:
        # UNAUTHORIZED beside "invalid authentication token" -- a shouted
        # constant and an uncapitalised sentence in one object.
        code: UNAUTHORIZED
        message: "invalid authentication token"

  - name: records are wrapped under a key called list
    source: https://developer.ironcladapp.com/reference/
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
    expect:
      status: 200
      body:
        # `list` rather than `records` or `data` -- named for the shape rather
        # than the contents, so two endpoints returning different things have
        # the same key.
        'list[0].name': Northwind MSA 2026
        count: 2

  - name: every property is wrapped in an object
    source: https://developer.ironcladapp.com/reference/
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
    expect:
      status: 200
      body:
        # Reading a field is two hops even for a string, because a property
        # carries its own metadata -- so `record.properties.x` is never the
        # value and a client that forgets `.value` gets an object.
        'list[0].properties.counterpartyName.value': Northwind Traders
        'list[0].properties.contractValue.value': 240000

  - name: an unset property is absent rather than a wrapper holding null
    source: https://developer.ironcladapp.com/reference/
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
    expect:
      status: 200
      body:
        'list[1].properties.counterpartyName.value': Contoso Ltd
      absent:
        # So a client reading properties.contractValue.value throws rather
        # than reading null, and the two records in one listing have different
        # property sets.
        - 'list[1].properties.contractValue'

  - name: the record type is a bare word
    source: https://developer.ironcladapp.com/reference/
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
    expect:
      status: 200
      body:
        # msa and nda, lower case, with no enumeration on the record and no
        # schema beside it -- and the property set depends on the type, so a
        # client has to know the vocabulary before it can read a record.
        'list[0].type': msa
        'list[1].type': nda
        'list[1].lastUpdated': "2026-09-02T09:41:00.000Z"

  - name: records page on page and pageSize
    source: https://developer.ironcladapp.com/reference/
    fixture: workspace
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
      query:
        page: "2"
        pageSize: "1"
    expect:
      status: 200
      body:
        'list[0].id': c81e728d-9d4c-4f63-af06-7f89cc14862c
        page: 2
        pageSize: 1

  - name: a workspace with no records answers an empty array
    source: https://developer.ironcladapp.com/reference/
    fixture: empty
    request:
      method: GET
      path: /public/api/v1/records
      headers:
        Authorization: "Bearer cauldr0n-1roncl4d-f1xture-t0ken-0000"
    expect:
      status: 200
      body:
        list: []
        count: 0
