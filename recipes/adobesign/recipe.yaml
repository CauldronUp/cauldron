# Adobe Acrobat Sign Recipe for Cauldron
#
# Written against Adobe's published OpenAPI document for REST API v6 and struck
# live against api.na1.adobesign.com on 2026-09-07 with no credential, with a
# deliberately invalid one, with a credential carrying no scheme prefix, and on
# a path that does not exist.
#
# **Three failures, three codes, and every sentence is true.** Struck live:
#
#   (no header)            401 {"code":"NO_AUTHORIZATION_HEADER",
#                               "message":"Authorization header not provided"}
#   Bearer notreal         401 {"code":"INVALID_ACCESS_TOKEN",
#                               "message":"Access token provided is invalid or has expired"}
#   /cauldron-nope         404 {"code":"NOT_FOUND","message":"Resource not found"}
#
# One shape, three codes, and each says what actually happened. The first names
# the header rather than the key, so a caller who put the token in the wrong
# place is pointed at the right one. The second says "invalid **or has
# expired**", which is the honest version of the confident claim
# [wave](../wave) makes -- Wave tells a request carrying no credential that its
# authentication expired; Adobe tells a request carrying a wrong one that it
# might have. After seven providers in this collection that answer "invalid
# key" to a request holding none, this is the counterexample.
#
# **And the published document says the body is something else.** The
# specification's own examples for this endpoint's 401 are:
#
#   {"reason": "NO_AUTHORIZATION_HEADER: Authorization header not provided.",
#    "status": 401}
#
# Two fields, `reason` and `status`, with the code and the sentence
# concatenated into one string by a colon, and a full stop at the end. The wire
# sends two different fields, `code` and `message`, with the code and the
# sentence apart, and no full stop. Not one of the three is the same. The
# schema beside those examples is `{"type": "object"}` with no properties at
# all, so the examples are the only description the document offers of this
# body, and they are wrong about every part of it.
#
# **The document declares the credential optional.** `Authorization` is listed
# as a header parameter with `required: false`, on an operation whose every
# response to a request without one is the 401 above. A generator reading this
# emits a client whose auth argument is optional.
#
# **And it does not say where the API is.** `servers` is a single entry whose
# `url` is `/api/rest/v6` -- a path with no host. Acrobat Sign shards by
# region, so na1, eu1, jp1 and the rest are all real and the document names
# none of them; the shard a customer belongs to is not discoverable from the
# specification at all.
#
# **`id` and `status` are not in `required` and `hidden` is.** The document
# guarantees seven fields on an agreement: `displayDate`,
# `displayParticipantSetInfos`, `groupId`, `esign`, `hidden`,
# `latestVersionId` and `name`. So a conforming response must say whether an
# agreement is hidden from you and need not say what it is called by, or what
# is happening to it. The two fields any client reads first are the two the
# schema does not promise.
#
# **The status is written from the reader's point of view.** Thirty values, of
# which eight begin `WAITING_FOR_MY_`: WAITING_FOR_MY_SIGNATURE,
# WAITING_FOR_MY_APPROVAL, WAITING_FOR_MY_DELEGATION, and five more. So the
# same agreement has a different `status` depending on who asked, and a cached
# copy of one is only true for the account that fetched it.

recipe: adobesign
capability: signing
version: 0.1.0

upstream:
  api: v6
  docs: https://secure.na1.adobesign.com/public/docs/restapi/v6
  spec: https://api.na1.adobesign.com/restapijson/v6/restapi.json
  spec_hash: f555a1ad56acef824fbaa6f8b168d2ab39154423f26ed881e1289390c05e9a92
  spec_seen: "2026-09-07"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - 3AAABLcauldr0nadobes1gnf1xture
  # Three failures, three codes, three true sentences.
  absent_error: no_authorization_header
  rejected_error: invalid_access_token
  # A token with no scheme in front of it is unreadable rather than wrong,
  # and gets the same answer -- so the one mistake this vocabulary could have
  # named precisely is the one it folds in.
  malformed_error: invalid_access_token
  # A path that does not exist answers NOT_FOUND rather than the credential
  # failure, so routing is not hidden behind authentication.
  after_routing: true

responses:
  list:
    style: wrapped
    key: userAgreementList
    cursor_field: page.nextCursor
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  agreement:
    id:
      field: id
      style: opaque
    fields:
      name:
        type: string
      # A boolean the document requires on every agreement, where the
      # identifier and the status are optional.
      hidden:
        type: boolean
      esign:
        type: boolean
      groupId:
        type: string
      # "Format would be yyyy-MM-dd'T'HH:mm:ssZ", says the document -- a Java
      # SimpleDateFormat pattern, quoted T and all, where a schema would
      # normally say date-time.
      displayDate:
        type: datetime
      latestVersionId:
        type: string
      # Thirty values, eight of them beginning WAITING_FOR_MY_, so the same
      # agreement reads differently to each participant.
      status:
        type: string
      type:
        type: string
      displayParticipantSetInfos:
        type: list

routes:
  - method: GET
    path: /api/rest/v6/agreements
    resource: agreement
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: pageSize
      cursor_param: cursor

errors:
  no_authorization_header:
    status: 401
    code: NO_AUTHORIZATION_HEADER
    # Names the header rather than the key, so a caller who put the token
    # somewhere else is pointed at the right place. No full stop -- the
    # document's own example has one.
    message: "Authorization header not provided"
    headers:
      Content-Type: application/json;charset=UTF-8

  invalid_access_token:
    status: 401
    code: INVALID_ACCESS_TOKEN
    # "or has expired" is the honest version of the claim Wave makes with
    # certainty about a request that sent nothing.
    message: "Access token provided is invalid or has expired"
    headers:
      Content-Type: application/json;charset=UTF-8

  unknown_route:
    status: 404
    code: NOT_FOUND
    message: "Resource not found"
    headers:
      Content-Type: application/json;charset=UTF-8

fixtures:
  empty:
    agreement: []

  account:
    agreement:
      - id: CBJCHBCAABAAcauldr0n1Xk7Qw3ZmR
        name: Supplier agreement 2026
        hidden: false
        esign: true
        groupId: CBJCHBCAABAAgr0up1d0000000000
        displayDate: "2026-08-30T14:02:11Z"
        latestVersionId: 3AAABLcauldr0nvers10n1d0001
        # From the reader's point of view: this is what the account that
        # fetched it has to do, not what state the agreement is in.
        status: WAITING_FOR_MY_SIGNATURE
        type: AGREEMENT
        displayParticipantSetInfos:
          - displayUserSetMemberInfos:
              - fullName: Ada Lovelace
                email: ada@example.invalid
      - id: CBJCHBCAABAAcauldr0n9Pt2Lx8Vn
        name: Contractor NDA
        # Hidden from this user, and in the listing all the same -- the
        # showHiddenAgreements parameter defaults to false and this record
        # says so on itself.
        hidden: true
        esign: true
        groupId: CBJCHBCAABAAgr0up1d0000000000
        displayDate: "2026-09-02T09:41:00Z"
        latestVersionId: 3AAABLcauldr0nvers10n1d0002
        status: SIGNED
        type: AGREEMENT
        displayParticipantSetInfos: []

conformance:
  - name: a missing header is named as a missing header
    source: https://api.na1.adobesign.com/api/rest/v6/agreements
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers: {}
    expect:
      status: 401
      body:
        # Points at the header rather than at the key, which is what a caller
        # who put the token in a query parameter needs to hear.
        code: NO_AUTHORIZATION_HEADER
        message: "Authorization header not provided"

  - name: the sentence has no full stop where the document's example does
    source: https://api.na1.adobesign.com/api/rest/v6/agreements
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers: {}
    expect:
      status: 401
      # The document's example ends the same sentence with a full stop.
      body_matches: 'header not provided"'

  - name: a wrong token admits it might merely have expired
    source: https://api.na1.adobesign.com/api/rest/v6/agreements
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        code: INVALID_ACCESS_TOKEN
        # Adobe says "or has expired" about a token it was sent; Wave says
        # "expired" about a request that sent none.
        message: "Access token provided is invalid or has expired"

  - name: a token with no scheme in front of it is the same failure
    source: https://api.na1.adobesign.com/api/rest/v6/agreements
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        # No Bearer prefix at all, which is a different mistake and gets the
        # same code.
        Authorization: "notreal"
    expect:
      status: 401
      body:
        code: INVALID_ACCESS_TOKEN

  - name: an unknown path has its own code
    source: https://api.na1.adobesign.com/api/rest/v6/cauldron-nope
    verified: "2026-09-07"
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/cauldron-nope
      headers:
        Authorization: "Bearer notreal"
    expect:
      # Three failures, three codes -- and this one is reached with a wrong
      # credential, so routing is not hidden behind authentication.
      status: 404
      body:
        code: NOT_FOUND
        message: "Resource not found"

  - name: agreements are wrapped under a name that says whose they are
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        # userAgreementList, not agreements: the envelope key says the
        # listing belongs to the caller, which is the same point the status
        # values make.
        'userAgreementList[0].name': Supplier agreement 2026
        'userAgreementList[0].id': CBJCHBCAABAAcauldr0n1Xk7Qw3ZmR

  - name: the status is written from the reader's point of view
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        # Eight of the thirty values begin WAITING_FOR_MY_, so the same
        # agreement reads differently to every participant and a cached copy
        # is only true for the account that fetched it.
        'userAgreementList[0].status': WAITING_FOR_MY_SIGNATURE
        'userAgreementList[1].status': SIGNED

  - name: an agreement hidden from the caller is in the listing
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        # The document requires this boolean on every agreement and does not
        # require the identifier beside it.
        'userAgreementList[0].hidden': false
        'userAgreementList[1].hidden': true
        'userAgreementList[1].esign': true

  - name: the display date has no fractional seconds and a bare Z
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        # The document describes the format as a Java SimpleDateFormat
        # pattern -- yyyy-MM-dd'T'HH:mm:ssZ -- rather than as date-time.
        'userAgreementList[0].displayDate': "2026-08-30T14:02:11Z"
        'userAgreementList[0].latestVersionId': 3AAABLcauldr0nvers10n1d0001
        'userAgreementList[0].groupId': CBJCHBCAABAAgr0up1d0000000000
        'userAgreementList[0].type': AGREEMENT

  - name: the participant list is an array of nested member objects
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        # Required on every agreement, and reaching a signer's name is three
        # hops through two plurals.
        'userAgreementList[0].displayParticipantSetInfos[0].displayUserSetMemberInfos[0].fullName': Ada Lovelace
        'userAgreementList[1].displayParticipantSetInfos': []

  - name: agreements page on a cursor beside the array
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
      query:
        pageSize: "1"
    expect:
      status: 200
      body:
        'userAgreementList[0].id': CBJCHBCAABAAcauldr0n1Xk7Qw3ZmR
      matches:
        # In a `page` object whose only property is this one, so the envelope
        # exists to hold a single string.
        'page.nextCursor': '.'

  - name: the cursor goes back in a parameter of its own name
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: account
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
      query:
        pageSize: "1"
        cursor: CBJCHBCAABAAcauldr0n1Xk7Qw3ZmR
    expect:
      status: 200
      body:
        'userAgreementList[0].id': CBJCHBCAABAAcauldr0n9Pt2Lx8Vn
        'userAgreementList[0].name': Contractor NDA

  - name: an account with no agreements answers an empty array
    source: https://api.na1.adobesign.com/restapijson/v6/restapi.json
    fixture: empty
    request:
      method: GET
      path: /api/rest/v6/agreements
      headers:
        Authorization: "Bearer 3AAABLcauldr0nadobes1gnf1xture"
    expect:
      status: 200
      body:
        userAgreementList: []
