# Wikidata REST Recipe for Cauldron
#
# The English label is not there, and the name is under a code that is not a
# language.
#
#   GET /w/rest.php/wikibase/v1/entities/items/Q42
#   ->  labels:       75 languages, and "en" is not one of them
#       labels.mul:   "Douglas Adams"
#       descriptions: 121 languages, and "en" is the first
#
# Douglas Adams has no English label. Nor a German, French, Spanish, Italian,
# Dutch, Portuguese, Polish or Swedish one: every Latin-script language was
# replaced by a single entry under "mul", which is ISO 639-3 for "multiple
# languages" and is not a language anybody's browser will ask for. Asking the
# label endpoint directly for it confirms the absence:
#
#   GET .../items/Q42/labels/en   ->  404 resource-not-found
#   GET .../items/Q42/labels/mul  ->  200 "Douglas Adams"
#
# So item.labels[userLang] ?? item.labels.en, which is what every client writes,
# shows nothing at all -- while item.descriptions.en beside it works, because the
# descriptions were not consolidated. Two sibling objects, keyed the same way,
# disagreeing about which languages exist.
#
# **And every key in statements is an opaque number.** Three hundred and twelve
# of them on this item: P31, P21, P106, P569. Nothing in the response says what
# any of them means; learning that P569 is "date of birth" is another request,
# per property, to another endpoint.
#
# Written against the live API rather than a document: every case below was
# checked against wikidata.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A statement's value is {"type": "value", "content": ...} and content is a
#      string for an item reference and an object for a date. Same key, two
#      shapes, decided by a data_type on the property beside it.
#   2. A date is three fields and one of them is a URL. time is
#      "+1952-03-11T00:00:00Z" with a leading plus on the year, precision is the
#      integer 11, and calendarmodel is
#      "http://www.wikidata.org/entity/Q1985727" -- so knowing the date is
#      Gregorian means resolving another entity.
#   3. A statement identifier is "Q42$F078E5B3-F9A8-480E-B7AC-D97778CBBEF9": the
#      item, a dollar sign, and a UUID. It has to be URL-encoded to be sent
#      anywhere -- and the item's own case is not consistent across them. Of
#      this item's 312 statements, 285 begin "Q42$" and 27 begin "q42$".
#   4. A missing item and a missing label are the same body with one nested
#      field different: code and message are identical and only
#      context.resource_type says which was asked for.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The knowledge base is served rather than queried. There is no search in
#     this Recipe, and SPARQL is a different service on a different host.
#   - An item carries 75 labels, 121 descriptions, 312 statements and 132
#     sitelinks. The fixture holds a handful of each and says so; the counts are
#     the finding rather than the contents.
#   - Statements carry qualifiers and references with content hashes. One
#     reference is served to show the shape; the rest are not.
#
# The item below is public and was recorded on the date in the cases.

recipe: wikidata
capability: infrastructure
version: 0.1.0

upstream:
  api: wikibase/v1
  docs: https://www.wikidata.org/wiki/Wikidata:REST_API

auth:
  # Public for reading.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  item:
    id:
      style: opaque
      field: id
    fields:
      type:
        type: string
      # 75 languages, and none of them Latin-script.
      labels:
        type: map
      # 121 languages, and "en" is among them.
      descriptions:
        type: map
      aliases:
        type: map
      # Every key an opaque property number.
      statements:
        type: map
      sitelinks:
        type: map

routes:
  - method: GET
    path: /w/rest.php/wikibase/v1/entities/items/{id}
    resource: item
    operation: get
    not_found: item_missing

  # Asking for one label directly, which is how the absence is confirmed.
  - method: GET
    path: /w/rest.php/wikibase/v1/entities/items/Q42/labels/en
    error: label_missing

errors:
  # The same body as the one below, with one nested field different.
  item_missing:
    status: 404
    code: resource-not-found
    message: The requested resource does not exist
    fields:
      context:
        resource_type: item

  label_missing:
    status: 404
    code: resource-not-found
    message: The requested resource does not exist
    fields:
      context:
        # The only thing that distinguishes the two.
        resource_type: label

fixtures:
  empty: {}

  encyclopedia:
    item:
      - id: Q42
        type: item
        labels:
          # No en, de, fr, es, it, nl, pt, pl or sv: every Latin-script
          # language was consolidated into the entry below.
          mul: Douglas Adams
          ar: دوغلاس آدمز
          el: Ντάγκλας Άνταμς
          ja: ダグラス・アダムズ
        descriptions:
          # Here it is, under the code the labels object does not have.
          en: British science fiction writer and humorist (1952–2001)
          fr: écrivain de science-fiction et humoriste anglais (1952–2001)
        aliases:
          # The aliases went the same way the labels did.
          mul:
            - Douglas Noël Adams
            - Douglas Noel Adams
            - Douglas N. Adams
        statements:
          # An opaque number, and nothing here says it means "instance of".
          P31:
            - id: Q42$F078E5B3-F9A8-480E-B7AC-D97778CBBEF9
              rank: normal
              property:
                id: P31
                data_type: wikibase-item
              value:
                type: value
                # A string, where the date below has an object.
                content: Q5
              qualifiers:
                - property:
                    id: P805
                    data_type: wikibase-item
                  value:
                    type: value
                    content: Q42395533
              references:
                - hash: a4d108601216cffd2ff1819ccf12b483486b62e7
                  parts:
                    - property:
                        id: P248
                        data_type: wikibase-item
                      value:
                        type: value
                        content: Q19938912
          # "date of birth", and nothing in the document says so.
          P569:
            # Lower case, where the statement above is upper. 285 of this
            # item's statement ids start Q42$ and 27 start q42$.
            - id: q42$D8404CDA-25E4-4334-AF13-A3290BCD9C0F
              rank: normal
              property:
                id: P569
                data_type: time
              value:
                type: value
                content:
                  # A leading plus on the year.
                  time: "+1952-03-11T00:00:00Z"
                  # 11 means day. It is a number and nothing decodes it.
                  precision: 11
                  # A URL to another entity, which is how you learn the
                  # calendar is Gregorian.
                  calendarmodel: http://www.wikidata.org/entity/Q1985727
        sitelinks:
          enwiki:
            title: Douglas Adams
            badges:
              - Q17437798
            url: https://en.wikipedia.org/wiki/Douglas_Adams

conformance:
  - name: the English label is not there and the name is under mul
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # ISO 639-3 for "multiple languages", which is not a language anybody's
        # browser will ask for.
        "labels.mul": Douglas Adams
      absent:
        # Every Latin-script language, gone.
        - labels.en
        - labels.de
        - labels.fr

  - name: and the description under that code works
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # Two sibling objects, keyed the same way, disagreeing about which
        # languages exist.
        "descriptions.en": British science fiction writer and humorist (1952–2001)
        # And French, which says "anglais" where the English one says British.
        "descriptions.fr": écrivain de science-fiction et humoriste anglais (1952–2001)
        "aliases.mul[0]": Douglas Noël Adams
        # A language that does have a label, so the absence above is not the
        # object being empty.
        "labels.el": Ντάγκλας Άνταμς

  - name: asking for the English label directly confirms the absence
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42/labels/en
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42/labels/en
    expect:
      status: 404
      body:
        code: resource-not-found
        message: The requested resource does not exist
        "context.resource_type": label

  - name: and a missing item is the same body with one field different
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q999999999
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q999999999
    expect:
      # code and message are identical. Only the nested resource_type says
      # which of the two was asked for.
      status: 404
      body:
        code: resource-not-found
        message: The requested resource does not exist
        "context.resource_type": item

  - name: every key in statements is an opaque number
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # Three hundred and twelve of them live. Nothing in the response says
        # what any of them means.
        "statements.P31[0].property.id": P31
        "statements.P31[0].property.data_type": wikibase-item
        "statements.P569[0].property.id": P569
        "statements.P569[0].property.data_type": time

  - name: a value is a string on one statement and an object on another
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # Same key, two shapes, decided by the data_type beside it.
        "statements.P31[0].value.type": value
        "statements.P31[0].value.content": Q5
        "statements.P569[0].value.content.time": "+1952-03-11T00:00:00Z"

  - name: a date is three fields and one of them is a URL
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # A leading plus on the year, an integer precision nothing decodes, and
        # a URL you must resolve to learn the calendar is Gregorian.
        "statements.P569[0].value.content.precision": 11
        "statements.P569[0].value.content.calendarmodel": http://www.wikidata.org/entity/Q1985727

  - name: a statement identifier carries a dollar sign
    source: https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42
    verified: "2026-08-28"
    fixture: encyclopedia
    request:
      method: GET
      path: /w/rest.php/wikibase/v1/entities/items/Q42
    expect:
      status: 200
      body:
        # The item, a dollar sign and a UUID, so it has to be URL-encoded to be
        # sent anywhere.
        "statements.P31[0].id": Q42$F078E5B3-F9A8-480E-B7AC-D97778CBBEF9
        # And the same item, in lower case, on the statement beside it: 285
        # of these begin Q42$ and 27 begin q42$.
        "statements.P569[0].id": q42$D8404CDA-25E4-4334-AF13-A3290BCD9C0F
        "statements.P31[0].rank": normal
        # And a reference is identified by a content hash.
        "statements.P31[0].references[0].hash": a4d108601216cffd2ff1819ccf12b483486b62e7

  # The names. This Recipe declares 1 field(s) on an item that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an item carries the field names this Recipe declares"
    source: "https://www.wikidata.org/w/rest.php/wikibase/v1/entities/items/Q42"
    fixture: encyclopedia
    request:
      method: GET
      path: "/w/rest.php/wikibase/v1/entities/items/Q42"
    expect:
      status: 200
      body:
        "sitelinks.enwiki.badges[0]": "Q17437798"

