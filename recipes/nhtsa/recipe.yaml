# NHTSA vPIC Recipe for Cauldron
#
# Four errors arrive in one string, and one of them is 400 on a 200.
#
#   GET /api/vehicles/decodevinvalues/NOTAVIN?format=json
#   ->  200  {"Count": 1, "Results": [{"ErrorCode": "6,7,11,400", ...}]}
#
# ErrorCode is a comma-separated list of numbers inside a string. Four codes for
# one VIN, and 400 among them, which looks like an HTTP status and is not: the
# response is a 200 and always is. ErrorText is those four joined with "; " --
# and one of them contains its own semicolon, so splitting on the separator gives
# five pieces for four errors.
#
# **And the failure is a success with 148 empty strings in it.** Count is 1, the
# Results array holds one object, and 148 of that object's 154 fields are "".
# Make is "", ModelYear is "". Nothing is absent and nothing is null: a VIN the
# service could not read looks exactly like a VIN it read and found nothing about.
#
# Written against the live API rather than a document: every case below was
# checked against vpic.nhtsa.dot.gov on the date in its verified field.
#
# Five more the Recipe pins:
#
#   1. Every value is a string. ModelYear is "2003", EngineCylinders is "6",
#      ErrorCode is "0" on a success, and DisplacementL is "2.998832712" -- a
#      three-litre engine to nine decimal places, as text.
#   2. Message is a two-hundred-and-fifty-character disclaimer, on every
#      successful response, explaining that a missing value does not mean the
#      feature is absent. It is the field a client would log, and it is the same
#      paragraph every time.
#   3. SearchCriteria is the request as a human-readable sentence:
#      "VIN(s): 1HGCM82633A004352", with a label, a colon and parentheses. It is
#      prose rather than data, and parsing it back means stripping a prefix.
#   4. ErrorCode is "0" and ErrorText is "0 - VIN decoded clean. Check Digit
#      (9th position) is correct" on a request that worked. The error fields are
#      populated on success and the code that means success is a string zero.
#   5. SuggestedVIN on a bad VIN is "N!TAV!N": the input with its invalid
#      characters replaced by exclamation marks. It is not a VIN and cannot be
#      submitted anywhere; the correction is in AdditionalErrorText, as
#      "Invalid character(s): 2:O, 6:I."
#
# One more that is the same shape as MusicBrainz's: the format parameter is not
# optional. Without ?format=json the same path answers XML.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - A result carries 154 keys and the fixture holds fourteen of them. The
#     count is the finding; the contents are mostly "".
#   - The batch endpoint, the make and model lookups and the manufacturer
#     endpoints are not modelled.
#   - The XML default is stated rather than served: the parameter is a query
#     rather than a path, and this Recipe's routes match on its presence
#     through the value that selects JSON.
#
# The VINs below are public and were recorded on the date in the cases.

recipe: nhtsa
capability: infrastructure
version: 0.1.0

upstream:
  api: vpic
  docs: https://vpic.nhtsa.dot.gov/api/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  list:
    style: wrapped
    count_field: Count
  error:
    style: flat
    # Lower case, where every successful response spells it Message.
    message_field: message

resources:
  decode:
    collection: Results
    id:
      style: opaque
      field: VIN
    fields:
      # A comma-separated list of numbers, in a string.
      ErrorCode:
        type: string
      ErrorText:
        type: string
      AdditionalErrorText:
        type: string
      # The input with its bad characters masked, not a VIN.
      SuggestedVIN:
        type: string
      # Strings, all of them.
      Make:
        type: string
      Model:
        type: string
      ModelYear:
        type: string
      Manufacturer:
        type: string
      VehicleType:
        type: string
      BodyClass:
        type: string
      EngineCylinders:
        type: string
      # Nine decimal places, as text.
      DisplacementL:
        type: string
      PossibleValues:
        type: string

routes:
  - method: GET
    path: /api/vehicles/decodevinvalues/{id}
    resource: decode
    operation: list
    matches_query:
      # Without this the same path answers XML.
      format: json
    fields:
      # The same disclaimer on every successful response.
      Message: >-
        Results returned successfully. NOTE: Any missing decoded values should
        be interpreted as NHTSA does not have data on the specific variable.
        Missing value should NOT be interpreted as an indication that a feature
        or technology is unavailable for a vehicle.

  # There is one failure status on this API, and it is for a path that does not
  # exist rather than for anything about a vehicle.
  - method: GET
    path: /api/vehicles/notarealendpoint
    error: no_such_resource

errors:
  # A path that is not there, answered by whatever is behind the public host
  # -- and the message quotes the URI that host saw.
  no_such_resource:
    status: 404
    message: >-
      No HTTP resource was found that matches the request URI
      'https://backend-vpic-api.nhtsa.dot.gov/api/vehicles/notarealendpoint?format=json'.

fixtures:
  empty: {}

  vins:
    decode:
      - id: 1HGCM82633A004352
        # "0" means it worked, and the error fields are filled in anyway.
        ErrorCode: "0"
        ErrorText: 0 - VIN decoded clean. Check Digit (9th position) is correct
        AdditionalErrorText: ""
        SuggestedVIN: ""
        Make: HONDA
        Model: Accord
        # A string.
        ModelYear: "2003"
        Manufacturer: AMERICAN HONDA MOTOR CO., INC.
        VehicleType: PASSENGER CAR
        BodyClass: Coupe
        EngineCylinders: "6"
        # Three litres, to nine decimal places, as text.
        DisplacementL: "2.998832712"
        PossibleValues: ""

      # A VIN the service could not read. Count is still 1 and the status is
      # still 200.
      - id: NOTAVIN
        # Four codes in one string, and 400 is not the HTTP status.
        ErrorCode: 6,7,11,400
        # Joined with "; ", and the second one contains its own semicolon.
        ErrorText: "6 - Incomplete VIN; 7 - Manufacturer is not registered with NHTSA for sale or importation in the U.S. for use on U.S roads; Please contact the manufacturer directly for more information; 11 - Incorrect Model Year - Position 10 does not match valid model year codes (I, O, Q, U, Z, 0). Decoded data may not be accurate.; 400 - Invalid Characters Present"
        AdditionalErrorText: "Invalid character(s): 2:O, 6:I."
        # The input with its bad characters masked. Not a VIN.
        SuggestedVIN: N!TAV!N
        # Empty strings, not nulls and not absences.
        Make: ""
        Model: ""
        ModelYear: ""
        Manufacturer: ""
        VehicleType: ""
        BodyClass: ""
        EngineCylinders: ""
        DisplacementL: ""
        PossibleValues: ""

conformance:
  - name: four errors arrive in one string and one of them is 400
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/NOTAVIN?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/NOTAVIN?format=json
    expect:
      # 400 looks like an HTTP status and is not: this response is a 200 and
      # always is.
      status: 200
      body:
        "Results[1].ErrorCode": 6,7,11,400
      matches:
        # Joined with "; ", and the second error contains its own semicolon, so
        # splitting on the separator gives five pieces for four errors.
        "Results[1].ErrorText": '^6 - Incomplete VIN; 7 - Manufacturer is not registered.*400 - Invalid Characters Present$'

  - name: the failure is a success with empty strings in it
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/NOTAVIN?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/NOTAVIN?format=json
    expect:
      status: 200
      body:
        # 148 of the 154 fields are "". Nothing is absent and nothing is null,
        # so a VIN that could not be read looks like one that decoded to
        # nothing.
        "Results[1].Make": ""
        "Results[1].ModelYear": ""
        "Results[1].BodyClass": ""
        Count: 2

  - name: the suggested VIN is the input with its bad characters masked
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/NOTAVIN?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/NOTAVIN?format=json
    expect:
      status: 200
      body:
        # Not a VIN, and it cannot be submitted anywhere. The correction is in
        # the field beside it.
        "Results[1].SuggestedVIN": N!TAV!N
        "Results[1].AdditionalErrorText": "Invalid character(s): 2:O, 6:I."

  - name: every value is a string
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    expect:
      status: 200
      body:
        # A year, a cylinder count and a displacement, none of them numbers.
        "Results[0].ModelYear": "2003"
        "Results[0].EngineCylinders": "6"
        "Results[0].DisplacementL": "2.998832712"
        "Results[0].Make": HONDA

  - name: the error fields are populated on a success
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    expect:
      status: 200
      body:
        # The code that means success is a string zero, and the text restates
        # it as prose.
        "Results[0].ErrorCode": "0"
        "Results[0].ErrorText": 0 - VIN decoded clean. Check Digit (9th position) is correct
        "Results[0].SuggestedVIN": ""

  - name: the message is a disclaimer rather than a status
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    expect:
      status: 200
      matches:
        # Two hundred and fifty characters, on every successful response, and
        # the same paragraph every time.
        Message: '^Results returned successfully\. NOTE: Any missing decoded values.*unavailable for a vehicle\.$'

  - name: the decoded body is a list even for one VIN
    source: https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/decodevinvalues/1HGCM82633A004352?format=json
    expect:
      status: 200
      body:
        # Count beside a Results array, on a path that takes one VIN.
        "Results[0].Model": Accord
        "Results[0].BodyClass": Coupe
        "Results[0].VehicleType": PASSENGER CAR
        "Results[0].Manufacturer": AMERICAN HONDA MOTOR CO., INC.
        # The VIN is echoed back inside the record it decoded.
        "Results[0].VIN": 1HGCM82633A004352

  - name: the only failure status leaks the host behind the public one
    source: https://vpic.nhtsa.dot.gov/api/vehicles/notarealendpoint?format=json
    verified: "2026-08-28"
    fixture: vins
    request:
      method: GET
      path: /api/vehicles/notarealendpoint?format=json
    expect:
      # The message quotes the URI as the backend saw it, on a host the caller
      # never named: backend-vpic-api.nhtsa.dot.gov rather than vpic. And the
      # field is spelled "message" here and "Message" on every success.
      status: 404
      body:
        message: "No HTTP resource was found that matches the request URI 'https://backend-vpic-api.nhtsa.dot.gov/api/vehicles/notarealendpoint?format=json'."
      absent:
        - Message
        - Count
        - Results
