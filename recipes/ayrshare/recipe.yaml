# Ayrshare Recipe for Cauldron
#
# The group's question for Ayrshare was the Airbyte-versus-Census one --
# recipes/airbyte/recipe.yaml records a job's JobStatusEnum with a dedicated
# third word, "incomplete", distinct from both succeeded and failed;
# recipes/census/recipe.yaml quotes a sync run answering
# {"records_failed": 1, ..., "status": "completed"}, one row refused and the
# field meant to say how the run went saying the same word it would say if
# that row had gone through too. Ayrshare posts to several networks in one
# call, which raises the identical question one level up: does a per-network
# failure get its own word, or does it disappear into a verdict that also
# covers success?
#
# POST /api/post's own worked examples, read side by side, answer it. A
# request that reaches every named platform:
#
#   {"status": "success", "errors": [], "postIds": [
#      {"status": "success", "platform": "twitter", "id": "128889...", ...},
#      {"status": "success", "platform": "facebook", "id": "104923...", ...}
#   ], "id": "RhrbDtYh7hdSMc67zC8H"}
#
# and one where every named platform is refused:
#
#   {"status": "error", "errors": [
#      {"platform": "youtube", "code": 156, "message": "..."},
#      {"platform": "twitter", "code": 110, "message": "Status is a duplicate."}
#   ], "postIds": [], "id": "0OGBzZssN5hxy8dMSRaD"}
#
# postIds and errors are independent arrays, each one populated per platform,
# each carrying its own platform field -- the mechanism this task's question
# turns on, and Ayrshare states it as plainly as any provider in this
# collection could: a failure really is reported per network, with its own
# code and message, not folded into one shared sentence. What Ayrshare's own
# published reference does not contain, searched across every worked example
# on this page, is a third body demonstrating one platform landing in each
# array from the SAME call -- every worked example here is either all-succeed
# or all-fail. Inventing a body with, say, one entry in each array to
# illustrate the case directly would be exactly the fabrication Step 3
# forbids, since no published number backs it. What the two real examples
# establish beyond dispute is the top-level verdict's own rule: "status" is
# "success" only when errors is empty, and "error" the moment it is not --
# a boolean built from a count, not a third word, and not proportional to how
# much of the batch actually landed. That puts Ayrshare on the Census side of
# this question and inverts Census's own failure mode while landing there:
# Census's "completed" hides a records_failed of one behind a word that
# reads as clean. Ayrshare's "error" cannot be missed -- but it cannot be
# ignored either, on a request where most of the batch actually posted,
# because this format has no word between "every network took it" and
# "something, somewhere, did not." A client checking status alone before
# looking at postIds cannot tell one dead platform in five from five, and
# has to open the errors array to find out which -- the one thing Airbyte's
# dedicated "incomplete" spares a caller from needing to do at all.
#
# What a create commits to and whether it can be undone is this group's
# other question, and Ayrshare's answer to the second half is the sharpest
# finding in this Recipe: it depends which platform, and it depends whether
# the post has gone out yet. DELETE /api/post's own reference states it in
# as many words -- "Scheduled posts: Deletable across all platforms" against
# "Published posts: Deletable on Twitter and Facebook, but not on Instagram
# or TikTok (no API support)" -- so undoing a commitment that has not
# happened yet is universal, and undoing one that has already reached the
# public is a fact about the specific network, not about Ayrshare. Even
# within one network the answer can split further: the same reference states
# a Facebook image story cannot be deleted through this API while a Facebook
# video story can. A post's own record persists either way and stays
# addressable by GET /api/post/{id} -- id is Ayrshare's own batch identifier,
# never one platform's native post id, confirmed by get-post's own worked
# example naming both "id": "8tNTr73VV8Y66bHwC2322" at the top and a
# different, platform-native "id" nested inside postIds[0] -- which is the
# same two-identifiers-on-one-record shape recipes/calcom/recipe.yaml already
# states for a booking's id and uid, one level further: here a caller has to
# know which of two ids a network's own dashboard will recognise, because
# only the nested one will.
#
# And DELETE's own response is a third envelope, on the same host as the two
# above. POST answers postIds as an ARRAY of objects each carrying its own
# "platform" field. DELETE answers a flat object keyed BY the platform name
# itself -- {"twitter": {"action": "delete", "status": "success", "id":
# "..."}, "facebook": {...}, "status": "success"} -- no array, no "platform"
# field inside each entry, because the key already says which network it is.
# Two shapes for the identical idea, per-network outcome, on two routes of
# the same resource.
#
# Credentials, struck live against app.ayrshare.com with no account and no
# key ever created, on every one of five requests: 403, not 401 -- the one
# provider in this task's group whose status code for "you did not
# authenticate" is not 401 at all. The envelope is flat and constant apart
# from one field: {"action": "authorization", "status": "error", "code":
# 102, "message": "API Key not valid. Please be sure to send a Header
# Authorization containing 'Bearer API_KEY'. https://www.ayrshare.com/docs/
# apis/overview#authorization", "details": "..."}. action, status, code and
# message never moved across five distinct requests -- no header at all, a
# header with no Bearer prefix, "Bearer " with nothing after it, a POST with
# no credential, and a request to a path this Recipe has never heard of --
# and details is the one field that ever changed, carrying exactly two
# sentences rather than five: "Either the 'Bearer' is missing or no API Key
# was sent in the header." for every one of the first four, and "API Key
# received in header: junktoken12345" -- echoing the exact junk value sent,
# struck live -- for a syntactically fine but wrong bearer token. Absent and
# malformed collapse to the identical sentence; a genuinely presented,
# wrong-shaped-or-not credential gets the other one, and Cauldron's own auth
# check has no mechanism to echo an arbitrary presented value back into a
# templated message the way the real API does -- see the fidelity gaps --
# so this Recipe's rejected_error carries the literal sentence for the one
# junk value every case below actually sends, "junktoken12345", rather than
# a generic echo it cannot compute.
#
# Routing does not enter into it at all. The unrouted-path probe above and a
# PATCH and a DELETE against a real path with no credential all answered the
# byte-identical 403 authorization body -- the credential is checked before
# anything about the path or method is examined, on every request this task
# struck, the same arrangement recipes/airbyte/recipe.yaml already states for
# a different provider and needs no auth.after_routing to reproduce.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account was ever created and no API key was ever requested, guessed
#     or used. Every 200 below is read from www.ayrshare.com's published API
#     reference and carries no verified date; every credential case below
#     was struck live with no account and carries today's date.
#   - The "API Key received in header: {value}" sentence templates the exact
#     credential a caller sent, and this runtime's auth check passes no such
#     value through to a Recipe's error message (see internal/runtime/
#     handler.go's refuse(), which calls writeRecipeError with a fixed
#     detail string for every verdict). This Recipe's rejected_error is
#     therefore the literal sentence for "junktoken12345" specifically, not
#     a template -- correct for every conformance case below, because they
#     all send that exact value, and not a faithful reproduction of the
#     mechanism for an arbitrary caller-sent one.
#   - Only /api/post (create) and /api/post/{id} (get) are routed for
#     posting. DELETE /api/post is not: Cauldron's delete operation answers
#     an empty body by convention, and the real one is a per-platform object
#     keyed by network name -- see the header -- which this format's delete
#     path has no declared mechanism to shape. The finding is recorded here,
#     cited to the live-observed all-success and all-fail create bodies plus
#     the delete reference's own worked example, rather than served as a
#     route this Recipe cannot answer honestly.
#   - Of the fields on a posted record this Recipe declares post, platforms,
#     status, id, postIds, errors, created and scheduleDate. mediaUrls,
#     profileTitle, refId, shortenLinks and type are real, documented fields
#     and none of them are typed here.
#   - profiles, media upload, analytics, comments, auto-hashtags, the Jobs
#     API and every platform-specific option object (Instagram, TikTok,
#     Pinterest, and the rest each have their own nested request shape) are
#     real, documented parts of this API and none of them are modelled. This
#     Recipe is scoped to what the group's question turns on: what a
#     multi-platform commit reports back, and what undoing it does and does
#     not reach.
#   - No worked example anywhere in the Post reference shows one platform in
#     postIds and another in errors from the same call -- see the header for
#     what this Recipe concludes from the mechanism anyway, and why it does
#     not fabricate the missing body.
#   - No rate-limit response was ever struck (every live probe here needed
#     no credential and none returned one), so none is declared.
#   - No upstream.spec. Neither www.ayrshare.com nor app.ayrshare.com serves
#     an OpenAPI document at any conventional path this task probed
#     (openapi.json at either host's root, or under /docs); the reference is
#     hand-written prose with inline worked examples, not a generated site.
#
# The key below is a fixture and belongs to no account.

recipe: ayrshare
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://www.ayrshare.com/docs/apis/overview

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-ayrshare-fixture-api-key-0000000000000000
  # Absent and malformed answer the identical sentence, struck live four
  # separate ways -- see the header. rejected_error carries the sentence for
  # "junktoken12345" specifically, the one value every case below actually
  # sends -- see the fidelity gaps for why this format cannot template an
  # arbitrary one the way the real API does.
  absent_error: authorization_error
  malformed_error: authorization_error
  rejected_error: api_key_rejected

responses:
  resource:
    style: bare
  error:
    # {"action": "authorization", "status": "error", "code": 102, "message":
    # "...", "details": "..."} -- flat, four constants and one templated
    # field. status_field is not status_field here in the usual sense:
    # Ayrshare's "status" is the literal word "error" on every failure this
    # Recipe answers, so it is stamped as a fields constant rather than
    # through code_field, which targets the numeric 102 this provider
    # actually varies by category.
    style: flat
    message_field: details
    code_field: code
    code_type: number
    type_field: "-"
    fields:
      action: authorization
      status: error

resources:
  post:
    id:
      # "RhrbDtYh7hdSMc67zC8H" -- Ayrshare's own batch identifier, never one
      # platform's native post id. See the header: postIds[].id is the
      # native one, and a caller has to know which is which.
      style: opaque
    fields:
      post:
        type: string
        required: true
      platforms:
        type: list
        required: true
      # success only when nothing in errors -- see the header. Not a
      # proportional word: one platform down out of five still reads error,
      # the identical value five down out of five does.
      status:
        type: string
        default: success
      # Per platform, each entry carrying its own status, id, platform and
      # postUrl -- raw, not declared field by field, the same choice
      # recipes/firehydrant/recipe.yaml makes for its own milestones list.
      postIds:
        type: list
        default: []
      # Per platform, each entry carrying its own platform, code and
      # message -- independent of postIds, not a mirror of it. See the
      # header for why status collapses what these two arrays keep apart.
      errors:
        type: list
        default: []
      created:
        type: datetime
      scheduleDate:
        type: datetime
        null_when_unset: true

routes:
  - method: POST
    path: /api/post
    resource: post
    operation: create

  - method: GET
    path: /api/post/{id}
    resource: post
    operation: get

errors:
  # The sentence for a request that presented nothing at all -- struck live
  # four separate ways, see the header.
  authorization_error:
    status: 403
    code: 102
    message: "Either the 'Bearer' is missing or no API Key was sent in the header."

  # The sentence for a credential that was genuinely presented and refused.
  # Templates the exact value in the real API; this Recipe's version is the
  # literal sentence for the one value its own conformance cases send -- see
  # the fidelity gaps.
  api_key_rejected:
    status: 403
    code: 102
    message: "API Key received in header: junktoken12345"

fixtures:
  empty: {}

  small-account:
    post:
      # Every named platform succeeded. Ayrshare's own worked example,
      # quoted in the header.
      - id: RhrbDtYh7hdSMc67zC8H
        post: Check out our latest product launch!
        platforms: [twitter, facebook]
        status: success
        postIds:
          - status: success
            id: "1288899996423983105"
            platform: twitter
            postUrl: https://x.com/handle/status/1288899996423983105
          - status: success
            id: "104923907983682_108329000309742"
            platform: facebook
            postUrl: https://www.facebook.com/104923907983682_108329000309742
        errors: []
        created: "2024-11-19T19:00:00Z"

      # Every named platform was refused, and by two different reasons --
      # Ayrshare's own worked example, quoted in the header. postIds stays
      # empty; nothing here landed anywhere.
      - id: 0OGBzZssN5hxy8dMSRaD
        post: New merch drop this Friday
        platforms: [youtube, twitter]
        status: error
        postIds: []
        errors:
          - action: post
            status: error
            code: 156
            message: Youtube does not seem to be linked...
            platform: youtube
          - action: post
            status: error
            code: 110
            message: Status is a duplicate.
            platform: twitter
        created: "2024-11-19T19:05:00Z"

      # get-post's own worked example: a single-platform post, fully
      # addressable after the fact, with its own scheduleDate distinct from
      # created.
      - id: 8tNTr73VV8Y66bHwC2322
        post: "#75304 Eighty percent of success is showing up. - John D. Rockefeller"
        platforms: [twitter]
        status: success
        postIds:
          - status: success
            id: "1858948421974925758"
            postUrl: https://twitter.com/wondrouswaffles/status/185894842197493444
            platform: twitter
        errors: []
        created: "2024-11-19T19:00:14Z"
        scheduleDate: "2024-11-19T19:00:14Z"

# Every case below carries source. A verified date means this Recipe called
# app.ayrshare.com with exactly the request shown and recorded exactly what
# came back; its absence means the case was read from
# www.ayrshare.com's published API reference and never called -- no account
# was ever created and no API key was ever requested, guessed or used. This
# Recipe never posts, and never will: every write case below is
# documentation-only, by construction.
conformance:
  - name: no credential at all is a 403, not a 401
    source: https://app.ayrshare.com/api/profiles
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
    expect:
      status: 403
      body:
        action: authorization
        status: error
        code: 102
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: a header with no Bearer prefix reads the same as absent
    source: https://app.ayrshare.com/api/profiles
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
      headers:
        Authorization: junktoken12345
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: and so does Bearer with nothing after it
    source: https://app.ayrshare.com/api/profiles
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
      headers:
        Authorization: "Bearer "
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: a credential that was genuinely presented gets a different sentence, echoing the value
    source: https://app.ayrshare.com/api/profiles
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 403
      body:
        details: "API Key received in header: junktoken12345"

  - name: a POST with no credential is refused before its body is read
    source: https://app.ayrshare.com/api/post
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/post
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: an unrouted path answers the identical authorization body
    source: https://app.ayrshare.com/api/no-such-route-xyz
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/no-such-route-xyz
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: a wrong method on a real path never reaches routing either
    source: https://app.ayrshare.com/api/profiles
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /api/post
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: a second wrong method confirms it, not a one-off
    source: https://app.ayrshare.com/api/post
    verified: "2026-09-01"
    fixture: empty
    request:
      method: DELETE
      path: /api/post
    expect:
      status: 403
      body:
        details: "Either the 'Bearer' is missing or no API Key was sent in the header."

  - name: every platform succeeding reports success and a native id per network
    source: https://www.ayrshare.com/docs/apis/post/post
    fixture: small-account
    request:
      method: GET
      path: /api/post/RhrbDtYh7hdSMc67zC8H
      headers:
        Authorization: Bearer cauldron-ayrshare-fixture-api-key-0000000000000000
    expect:
      status: 200
      body:
        status: success
        "postIds[0].platform": twitter
        "postIds[0].id": "1288899996423983105"
        "postIds[1].platform": facebook
      absent:
        - "errors[0]"

  - name: every platform failing is one word, whether it is one network or five
    # See the header: this is the mechanism, not a claim that a genuinely
    # mixed body looks like this -- no worked example gives one.
    source: https://www.ayrshare.com/docs/apis/post/post
    fixture: small-account
    request:
      method: GET
      path: /api/post/0OGBzZssN5hxy8dMSRaD
      headers:
        Authorization: Bearer cauldron-ayrshare-fixture-api-key-0000000000000000
    expect:
      status: 200
      body:
        status: error
        "errors[0].platform": youtube
        "errors[0].code": 156
        "errors[1].platform": twitter
        "errors[1].message": Status is a duplicate.
      absent:
        - "postIds[0]"

  - name: the batch id at the top is not any platform's own post id
    # RhrbDtYh7hdSMc67zC8H addresses the whole call; 1288899996423983105 is
    # Twitter's own id for its half of it, nested one level down. Compare
    # recipes/calcom/recipe.yaml's booking id and uid.
    source: https://www.ayrshare.com/docs/apis/post/get-post
    fixture: small-account
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
      headers:
        Authorization: Bearer cauldron-ayrshare-fixture-api-key-0000000000000000
    expect:
      status: 200
      body:
        id: 8tNTr73VV8Y66bHwC2322
        "postIds[0].id": "1858948421974925758"
      matches:
        scheduleDate: "."

  - name: a resource comes back bare, with no envelope
    source: https://www.ayrshare.com/docs/apis/post/get-post
    fixture: small-account
    request:
      method: GET
      path: /api/post/8tNTr73VV8Y66bHwC2322
      headers:
        Authorization: Bearer cauldron-ayrshare-fixture-api-key-0000000000000000
    expect:
      status: 200
      body:
        post: "#75304 Eighty percent of success is showing up. - John D. Rockefeller"
      absent:
        - data
        - post_data
