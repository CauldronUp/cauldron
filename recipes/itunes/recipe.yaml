# iTunes Search Recipe for Cauldron
#
# The JSON is served as JavaScript.
#
#   Content-Type: text/javascript; charset=utf-8
#
# Every JSON response, success and failure alike. A browser sniffs its way to
# the right parser and fetch(...).json() works, so nobody notices -- until the
# request goes through anything that checks the content type before parsing,
# which then refuses a body it could have read, or hands it to a JavaScript
# evaluator because that is what the header asked for.
#
# The API says why itself, in the one place it explains anything: a 400 lists
# its own parameters, and one of them is
#
#   "callback": "A javascript function to handle your search results"
#
# It was built for JSONP, and it still announces JavaScript to callers who never
# asked for a callback.
#
# **And a failure ships the documentation.** A bad parameter answers 400 with
# {"errorMessage": "Invalid value(s) for key(s): [country]", "queryParameters":
# {...}}, where queryParameters is a map from parameter name to a sentence
# describing it -- "ISO-2A country code", "The number of search results to
# return". The manual arrives in the error, and nowhere else.
#
# **And there is no such thing as no results.** A search for a term that is not
# a word returns matches anyway:
#
#   ?term=zzzzqqqxyznothing  ->  resultCount 60, every one an audiobook by
#                                "ZZZ Sleep" -- "Countdown 999-0: Clock",
#                                "Countdown 999-0: Waterfall"
#
# The search decomposes the term and finds something for the part of it that is
# pronounceable, so a page reporting "60 results for zzzzqqqxyznothing" is
# showing sleep recordings. There is no count a client can test to learn that
# nothing matched, because nothing is what never comes back.
#
# Written against the live API rather than a document: every case below was
# checked against itunes.apple.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A band is not the first result for its own name. ?term=radiohead answers
#      a feature film -- kind "feature-movie", artistName "Drew Thomas",
#      trackName "Coachella", genre "Music Feature Films" -- and the band only
#      appears once the caller asks for entity=musicArtist.
#   2. The array is heterogeneous and the shapes barely overlap. A track result
#      carries wrapperType, kind, trackName and trackId; an artist result
#      carries wrapperType, artistType, artistId and amgArtistId, and has no
#      kind at all. One array, two key sets, told apart only by wrapperType.
#   3. Asking wrong and finding nothing are the same answer -- unless the way
#      you asked wrong was a bad parameter. An id that does not exist and a
#      search with no term at all both answer 200 with {"resultCount": 0,
#      "results": []}; ?country=ZZ answers 400. Whether an unusable request is
#      an error depends on which part of it was unusable.
#   4. And there is a third content type. A path that does not exist answers
#      Apache's own HTML page as text/html; charset=iso-8859-1 -- Latin-1, on a
#      host whose every other response is UTF-8.
#
# And amgArtistId is a foreign key into All Media Guide, which stopped being
# called that in 2013.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The real body is wrapped in whitespace: three newlines before the opening
#     brace and three after the closing one, so the response is not the
#     document, it contains it. Cauldron writes the document. Byte-exact
#     comparisons against the real API will differ by six bytes.
#   - Two results are served, of a catalogue.
#   - The search term is not modelled, so the sandbox answers the recorded
#     results whatever is asked for. What a nonsense term returns is recorded
#     above rather than served.

recipe: itunes
capability: media
version: 0.1.0

upstream:
  api: itunes
  docs: https://performance-partners.apple.com/search-api

auth:
  # Public, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: results
    # Named for the count of results rather than the total, and it is both.
    count_field: resultCount
  resource:
    style: bare
  error:
    # Flat, with the sentence under errorMessage and the manual beside it.
    style: flat
    message_field: errorMessage

resources:
  result:
    id:
      style: numeric
      # Apple calls it trackId even when the track is a film.
      field: trackId
      type: number
    fields:
      # The discriminator, and the only field both shapes share besides the
      # artist's name and the genre.
      wrapperType:
        type: string
      kind:
        type: string
      artistName:
        type: string
      trackName:
        type: string
      primaryGenreName:
        type: string

  # Nothing is ever in here. An id nobody has and a search with no term at all
  # both answer the same empty envelope, so the absence is the shape.
  nothing:
    id:
      style: numeric
      field: id
      type: number
    fields:
      wrapperType:
        type: string

  artist:
    id:
      style: numeric
      field: artistId
      type: number
    fields:
      wrapperType:
        type: string
      # Where a track has kind, an artist has this, and neither has the other.
      artistType:
        type: string
      artistName:
        type: string
      artistLinkUrl:
        type: string
      # A foreign key into All Media Guide, renamed in 2013.
      amgArtistId:
        type: number
      primaryGenreName:
        type: string
      primaryGenreId:
        type: number

routes:
  # The route that declares the parameter picking it comes first.
  - method: GET
    path: /search
    resource: artist
    operation: list
    matches_query:
      entity: musicArtist
    headers:
      # JSON, announced as JavaScript.
      Content-Type: text/javascript; charset=utf-8

  - method: GET
    path: /search
    resource: result
    operation: list
    headers:
      Content-Type: text/javascript; charset=utf-8

  # An id nobody has: still a 200, still the same envelope, still empty. Its
  # own resource, holding no records, because that is what the API answers
  # with rather than a shape of its own.
  - method: GET
    path: /lookup
    resource: nothing
    operation: list
    matches_query:
      id: "999999999999"
    headers:
      Content-Type: text/javascript; charset=utf-8

  - method: GET
    path: /lookup
    resource: artist
    operation: list
    headers:
      Content-Type: text/javascript; charset=utf-8

  # A bad parameter, which is the one way of asking wrong that is an error.
  - method: GET
    path: /search-bad-country
    error: invalid_parameter
    headers:
      Content-Type: text/javascript; charset=utf-8

  # A path the application never sees, answered by the web server in Latin-1.
  - method: GET
    path: /nosuchpath
    error: no_such_path
    headers:
      Content-Type: text/html; charset=iso-8859-1

errors:
  # The manual, delivered as a failure.
  invalid_parameter:
    status: 400
    message_field: errorMessage
    message: "Invalid value(s) for key(s): [country]"
    fields:
      # A map from parameter name to a sentence about it. This is the only
      # place the API describes itself, and callback is why the content type
      # says JavaScript.
      queryParameters:
        output: json
        callback: A javascript function to handle your search results
        country: ISO-2A country code
        limit: The number of search results to return
        term: A search string
        lang: ISO-2A language code

  # Not the application at all: Apache, in Latin-1.
  no_such_path:
    status: 404
    message_field: "-"
    message: ""
    fields: {}

fixtures:
  empty: {}

  catalogue:
    result:
      # A search for a band, answered with a film.
      - id: "1678172381"
        wrapperType: track
        kind: feature-movie
        artistName: Drew Thomas
        trackName: Coachella
        primaryGenreName: Music Feature Films

    artist:
      # The band, which only appears when the caller asks for it by entity.
      - id: "657515"
        wrapperType: artist
        artistType: Artist
        artistName: Radiohead
        artistLinkUrl: https://music.apple.com/us/artist/radiohead/657515?uo=4
        amgArtistId: 41092
        primaryGenreName: Alternative
        primaryGenreId: 20

conformance:
  - name: the JSON is served as JavaScript
    source: https://itunes.apple.com/search?term=radiohead&limit=1
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search?term=radiohead
    expect:
      status: 200
      headers:
        # A browser sniffs its way to the right parser. Anything that checks
        # the header first either refuses a body it could have read, or hands
        # it to a JavaScript evaluator because that is what was announced.
        Content-Type: text/javascript
      body:
        resultCount: 1

  - name: a band is not the first result for its own name
    source: https://itunes.apple.com/search?term=radiohead&limit=1
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search?term=radiohead
    expect:
      status: 200
      body:
        # A feature film, for a band's name, in the music store.
        "results[0].kind": feature-movie
        "results[0].artistName": Drew Thomas
        "results[0].trackName": Coachella
        "results[0].primaryGenreName": Music Feature Films
        # A track, says the wrapper, about a film.
        "results[0].wrapperType": track
        "results[0].trackId": 1678172381

  - name: and the band appears only when asked for by entity
    source: https://itunes.apple.com/search?term=radiohead&entity=musicArtist&limit=1
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search?term=radiohead&entity=musicArtist
    expect:
      status: 200
      headers:
        # Every route announces it, not just the one above.
        Content-Type: text/javascript
      body:
        "results[0].artistName": Radiohead
        "results[0].artistId": 657515
        "results[0].primaryGenreName": Alternative
        # A genre and its number, both sent.
        "results[0].primaryGenreId": 20
        "results[0].artistLinkUrl": "https://music.apple.com/us/artist/radiohead/657515?uo=4"

  - name: one array, two key sets, told apart only by wrapperType
    source: https://itunes.apple.com/search?term=radiohead&entity=musicArtist&limit=1
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search?term=radiohead&entity=musicArtist
    expect:
      status: 200
      body:
        "results[0].wrapperType": artist
        # Where a track has kind, an artist has artistType.
        "results[0].artistType": Artist
      absent:
        # And none of the track's own fields are here at all.
        - "results[0].kind"
        - "results[0].trackName"
        - "results[0].trackId"

  - name: a foreign key into a service renamed in 2013
    source: https://itunes.apple.com/search?term=radiohead&entity=musicArtist&limit=1
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search?term=radiohead&entity=musicArtist
    expect:
      status: 200
      body:
        # All Media Guide. The identifier outlived the name.
        "results[0].amgArtistId": 41092

  - name: an id nobody has is a 200 with an empty envelope
    source: https://itunes.apple.com/lookup?id=999999999999
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /lookup?id=999999999999
    expect:
      # Indistinguishable from a search with no term at all, which answers the
      # same thing -- so a rejected request and an empty one are one answer.
      status: 200
      body:
        resultCount: 0
      body_matches: '"results": \[\]'

  - name: a bad parameter is a 400 carrying the documentation
    source: https://itunes.apple.com/search?term=x&country=ZZ
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search-bad-country
    expect:
      status: 400
      headers:
        # Still JavaScript, even for a failure that is not JavaScript's
        # problem. Only the path the application never sees breaks the pattern.
        Content-Type: text/javascript; charset=utf-8
      body:
        errorMessage: "Invalid value(s) for key(s): [country]"
        # Parameter names mapped to sentences about them. The only place the
        # API describes itself is a response nobody wants.
        "queryParameters.country": ISO-2A country code
        "queryParameters.limit": The number of search results to return
        # And the reason the content type says JavaScript.
        "queryParameters.callback": A javascript function to handle your search results

  - name: a path that does not exist is Latin-1 HTML
    source: https://itunes.apple.com/nosuchpath
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /nosuchpath
    expect:
      # A third content type on one host, and the only one that is not UTF-8.
      status: 404
      headers:
        Content-Type: text/html; charset=iso-8859-1

  - name: and the failure is announced as JavaScript too
    source: https://itunes.apple.com/lookup?id=999999999999
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /lookup?id=999999999999
    expect:
      status: 200
      headers:
        Content-Type: text/javascript
