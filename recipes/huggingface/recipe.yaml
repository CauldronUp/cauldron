conformance:
  - name: the default listing carries a trending score nobody asked for
    source: https://huggingface.co/api/models?limit=2
    verified: "2026-08-31"
    fixture: trending-models
    request:
      method: GET
      path: /api/models
      query:
        limit: "2"
    expect:
      status: 200
      body:
        "[0]._id": 6a8bffdb39eb84b2b2755a6e
        "[0].id": Qwen/Qwen3.8-Flash-Next
        "[0].modelId": Qwen/Qwen3.8-Flash-Next
        "[0].trendingScore": 4306
        "[0].downloads": 158598
        "[1].id": zai-org/GLM-5.3-Flash
        "[1].trendingScore": 1710
      headers:
        # An RFC 5988 Link header, never a body field, carrying the next
        # page's cursor.
        Link: 'rel="next"'

  - name: and the whole set has four records in this exact order
    source: https://huggingface.co/api/models?limit=2 and its Link header, followed
    verified: "2026-08-31"
    fixture: trending-models
    request:
      method: GET
      path: /api/models
      query:
        limit: "4"
    expect:
      status: 200
      body:
        "[0].id": Qwen/Qwen3.8-Flash-Next
        "[1].id": zai-org/GLM-5.3-Flash
        "[2].id": zai-org/GLM-5.3
        "[2].trendingScore": 1360
        "[3].id": Qwen/Qwen3.8-27B
        "[3].downloads": 4720763

