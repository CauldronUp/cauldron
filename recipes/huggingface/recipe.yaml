# Hugging Face Hub Recipe for Cauldron
#
# A "not found" that asks for a password.
#
#   GET /api/models/nonexistent-org-xyz-123/nonexistent-model-xyz-123
#   401 {"error": "Invalid username or password."}
#   WWW-Authenticate: Bearer realm="Authentication required", charset="UTF-8"
#
# Not 404. A repository that does not exist and a repository that exists but
# is private answer identically -- 401, an authentication challenge, on a
# public read-only catalogue endpoint that took no credentials in the first
# place. The same body and the same WWW-Authenticate header come back for a
# single nonsense word ("onlyoneseg") and for a fully-shaped two-segment name
# ("nonexistent-org-xyz-123/nonexistent-model-xyz-123"). A client cannot tell
# a typo from a repository it is not allowed to see, on an API that has no
# login.
#
# Written against the live API rather than a document: every case below was
# checked against huggingface.co on the date in its verified field, using
# only public, unauthenticated requests.
#
# The Recipe's central gap follows from the same shape. A model or dataset id
# is always exactly two segments -- "openai/gpt2", "rajpurkar/squad" -- and
# Cauldron's router matches on an exact, fixed count of "/"-delimited path
# segments. Two IS fixed, unlike Semantic Scholar's DOI or the Guardian's
# content id (both unbounded), so this looked routable. It is not, for two
# separate reasons this Recipe checked rather than assumed:
#
#   1. The escape hatch npm scoped packages use does not exist here. npm
#      sends "@scope/name" URL-encoded as one segment ("@scope%2Fname") and
#      the registry accepts it. Hugging Face refuses the same trick outright:
#
#        GET /api/models/openai-community%2Fgpt2
#        400 {"error": "Invalid repo name: openai-community/gpt2 - repo name
#             includes an url-encoded slash"}
#
#      And Go's net/http decodes %2F into a literal "/" in r.URL.Path before
#      any router sees the request, so even if Hugging Face allowed it,
#      Cauldron could not tell the encoded form from the raw one -- both
#      arrive as two path segments.
#
#   1a. The greedy path parameter written for Semantic Scholar and the
#      Guardian does not rescue this one, and the reason is worth recording
#      because it is the limit of that mechanism. {id...} takes the rest of
#      the path, which for those two providers is right: every path under
#      their prefix is an identifier and nothing else lives there. Hugging
#      Face's is not. Checked live:
#
#        GET /api/models/openai-community/gpt2              200, the repo
#        GET /api/models/openai-community/gpt2/tree/main    200, a file listing
#        GET /api/models/a/b/c/d                            404, "Sorry, we
#                                                           can't find the page
#                                                           you are looking for."
#
#      Four segments is a different resource, not a longer name, and a
#      greedy parameter cannot tell the two apart -- it would swallow the
#      tree listing and answer about a repository called
#      "openai-community/gpt2/tree/main". A bounded form, "exactly two
#      segments", is what this would need, and that is not what {id...}
#      means. So the two-segment routes below stay as they are, and this is
#      a Recipe that documents where the new mechanism stops rather than
#      one that uses it.
#
#   2. Cauldron's scope + lookup_by mechanism -- built for exactly this
#      shape, and how GitHub's /repos/{owner}/{repo} and AfterShip's
#      /trackings/{carrier}/{number} are modelled -- needs a field the
#      provider actually sends for the part after the slash. Hugging Face has
#      none. Both "id" and "modelId" carry the full "openai-community/gpt2"
#      string; there is no bare "gpt2" field anywhere in the response to bind
#      a second path segment to. Inventing one would work mechanically and
#      would be exactly the thing this project exists to refuse: an
#      undeclared fixture field passes straight through to the wire (see
#      shape.go's present()), so a synthetic "name" field would render in
#      responses the real API never sends it in.
#
# So the two-segment address space -- where every real model and dataset
# actually lives -- is not routed to a resource at all. It is routed to the
# 401 above, for every two-segment path this Recipe does not otherwise name.
# That is faithful for the overwhelming majority of such paths, because it is
# the overwhelming majority of two-segment paths: almost every string you can
# make up is not a real repository. It is silently wrong for the handful that
# exist, because Cauldron has no way to special-case them without doing the
# thing paragraph 2 above just ruled out. The full single-repository shape --
# author, sha, lastModified, gated, config, siblings, spaces, cardData -- is
# real, cited below from two live calls, and simply is not servable by any
# route this Recipe declares.
#
# Four more things worth modelling exactly:
#
#   1. Two identifiers, two shapes, one record. Every listing carries both
#      "_id" (a Mongo ObjectId: "621ffdc036468d709f174338") and "id" (the
#      name a human types: "google-bert/bert-base-uncased"). "_id" looks
#      exactly like the kind of key an API addresses records by. It is not:
#      GET /api/models/621ffdc036468d709f174338 answers the same 401 as any
#      other nonexistent name. The field named "_id" has no addressing role
#      on the wire at all.
#   2. The field a client would filter listings by is missing from every
#      listing. "gated" -- boolean false, or the string "manual" for a
#      licence-gated model -- appears on the single-repository fetch and
#      nowhere in /api/models or /api/models?search=. A client cannot build
#      "show me only ungated models" from search results; it has to fetch
#      every candidate one at a time, through the very endpoint this Recipe
#      cannot route to.
#   3. One failure, two glyphs. An invalid sort parameter is refused with the
#      same sentence in two channels and two different bullets:
#      {"error": "✖ Invalid sort parameter: notarealfield"} in the JSON body
#      (U+2716 HEAVY MULTIPLICATION X) and
#      "X-Error-Message: * Invalid sort parameter: notarealfield" in the
#      response header (a plain ASCII asterisk). Code that reads the header
#      to log the failure and the body to show the user sees two different
#      sentences for the same rejected request.
#   4. A field that vanishes depending on what you asked for. "trendingScore"
#      is present on every record when no "sort" parameter is given --
#      including a filtered search -- and absent from every record the
#      moment "sort" names an explicit field (downloads, likes, createdAt).
#      "sort=trending" is not a valid value ("✖ Invalid sort parameter:
#      trending"); trending is only ever the default you get by asking for
#      nothing.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Downloads, likes and createdAt move, and the exact set of trending
#     models changes hour to hour. The values served are the ones recorded
#     on the date in each case's verified field.
#   - limit is clamped rather than refused, and not to the number the field
#     suggests. ?limit=999999, ?limit=0, ?limit=-1 and no limit at all each
#     answered 200 with exactly 1000 records and a Link header offering more.
#     That is recorded here rather than served, because the Recipe's
#     fixtures are a handful of records, not a thousand.
#   - The url-encoded-slash rejection in gap 1 above is real and cited but
#     not modelled as a route, for the reason given there: Cauldron cannot
#     receive the request in a form that is distinguishable from the plain
#     two-segment one.
#   - Only two sort values are modelled (downloads, and the default). likes
#     and createdAt were probed and drop trendingScore the same way; they are
#     not given their own routes.
#   - The 404 for a three-segment path is recorded for the garbage shape this
#     Recipe tested (/api/models/a/b/c). Real three-segment paths under a
#     genuine repository -- tree listings, revisions -- were not probed and
#     are not claimed.

recipe: huggingface
capability: ai
version: 0.1.0

upstream:
  api: hub
  provider: huggingface
  docs: https://huggingface.co/docs/hub/api

auth:
  # Public read. No key was requested, guessed, or used for anything in this
  # Recipe.
  scheme: none

responses:
  list:
    style: bare
    # The next page arrives as an RFC 5988 Link header carrying an opaque,
    # base64-encoded cursor -- never a body field. Checked on every listing
    # call below.
    link_header: true
  error:
    style: flat
    message_field: error

resources:
  model:
    id:
      style: opaque
      field: id
    fields:
      # A Mongo ObjectId with no addressing role of its own -- see the header.
      _id:
        type: string
      # Byte-identical to id on every record this Recipe observed.
      modelId:
        type: string
      likes:
        type: integer
      # Present only when no sort parameter is given -- see the header.
      trendingScore:
        type: integer
      private:
        type: boolean
      downloads:
        type: integer
      tags:
        type: list
      # Absent on some records entirely (see the llama-search fixture),
      # rather than present and empty.
      pipeline_tag:
        type: string
      library_name:
        type: string
      createdAt:
        type: datetime

  dataset:
    id:
      style: opaque
      field: id
    fields:
      _id:
        type: string
      author:
        type: string
      disabled:
        type: boolean
      gated:
        type: boolean
      lastModified:
        type: datetime
      likes:
        type: integer
      trendingScore:
        type: integer
      private:
        type: boolean
      sha:
        type: string
      description:
        type: string
      downloads:
        type: integer
      tags:
        type: list
      createdAt:
        type: datetime
      # Present on every dataset this Recipe observed, and empty on all of
      # them. Never seen holding a value.
      key:
        type: string

routes:
  # The default listing: no sort, no search. Ordered by a trending score the
  # client never asked for and the response never explains.
  - method: GET
    path: /api/models
    resource: model
    operation: list
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  # A search narrows the catalogue. It does not touch the shape: trendingScore
  # still rides along, because no sort parameter was given either.
  - method: GET
    path: /api/models
    resource: model
    operation: list
    matches_query:
      search: bert
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  # The same search that exposes a record with no pipeline_tag or
  # library_name at all.
  - method: GET
    path: /api/models
    resource: model
    operation: list
    matches_query:
      search: meta-llama/Llama-2-7b-hf
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  # Naming an explicit sort field. trendingScore drops out of every record --
  # not nulled, not zeroed, absent -- because it only means anything relative
  # to the default ranking this request just overrode.
  - method: GET
    path: /api/models
    resource: model
    operation: list
    matches_query:
      sort: downloads
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  # A sort value the API does not recognise.
  - method: GET
    path: /api/models
    error: invalid_sort
    matches_query:
      sort: notarealfield

  # A cursor that will not parse as the base64 it is supposed to be.
  - method: GET
    path: /api/models
    error: bad_cursor
    matches_query:
      cursor: garbage_not_valid

  # A canonical model minted before namespaces existed. The bare name still
  # resolves, by redirecting to the two-segment form -- the one mechanism in
  # this whole id shape a single {id} placeholder CAN express, because it
  # only ever reads one segment.
  - method: GET
    path: /api/models/gpt2
    raw:
      content_type: text/plain; charset=utf-8
      text: "Temporary Redirect. Redirecting to /api/models/openai-community/gpt2"
    status: 307
    headers:
      Location: /api/models/openai-community/gpt2

  # Any other single segment: a nonsense word, or the Mongo _id from a
  # listing above -- both answer the same authentication challenge as a
  # genuinely absent two-segment name.
  - method: GET
    path: /api/models/{id}
    error: invalid_credentials

  # The two-segment address space itself. See the header: this is faithful
  # for a name nobody has taken and wrong for one that exists, and Cauldron
  # has no way to tell the two apart without inventing a field Hugging Face
  # does not send.
  - method: GET
    path: /api/models/{author}/{name}
    error: invalid_credentials

  # Three or more segments under /api/models, of the shape this Recipe
  # tested: garbage all the way down, not a real repository's sub-resource.
  - method: GET
    path: /api/models/{a}/{b}/{c}
    error: too_many_segments

  # Datasets repeat the same shapes as models, on their own path.
  - method: GET
    path: /api/datasets
    resource: dataset
    operation: list
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /api/datasets
    resource: dataset
    operation: list
    matches_query:
      search: bert
    pagination:
      style: cursor
      limit: 1000
      limit_param: limit
      cursor_param: cursor

  - method: GET
    path: /api/datasets/squad
    raw:
      content_type: text/plain; charset=utf-8
      text: "Temporary Redirect. Redirecting to /api/datasets/rajpurkar/squad"
    status: 307
    headers:
      Location: /api/datasets/rajpurkar/squad

  - method: GET
    path: /api/datasets/{id}
    error: invalid_credentials

  - method: GET
    path: /api/datasets/{author}/{name}
    error: invalid_credentials

  - method: GET
    path: /api/datasets/{a}/{b}/{c}
    error: too_many_segments

errors:
  # The authentication challenge a public, keyless catalogue answers a
  # missing repository with. Body and header carry the same sentence this
  # time -- contrast invalid_sort below, where they do not.
  invalid_credentials:
    status: 401
    message: Invalid username or password.
    headers:
      X-Error-Message: Invalid username or password.
      WWW-Authenticate: 'Bearer realm="Authentication required", charset="UTF-8"'

  # Two spellings of one sentence: U+2716 in the body, a plain asterisk in
  # the header. See the header's third numbered finding.
  invalid_sort:
    status: 400
    message: "✖ Invalid sort parameter: notarealfield"
    headers:
      X-Error-Message: "* Invalid sort parameter: notarealfield"

  bad_cursor:
    status: 400
    message: Error parsing pagination cursor
    headers:
      X-Error-Message: Error parsing pagination cursor

  too_many_segments:
    status: 404
    message: Sorry, we can't find the page you are looking for.
    headers:
      X-Error-Message: Sorry, we can't find the page you are looking for.

