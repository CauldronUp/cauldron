# Trigger.dev Recipe for Cauldron
#
# The run listing, read from the management API reference at trigger.dev/docs,
# and struck live on 2026-09-14 with no credential, with a wrong secret key,
# with the key and no scheme, on a path that does not exist, and with a method
# the path does not take.
#
# **The problem document's type URI points at MDN.** Struck live:
#
#   {
#     "title": "Unauthorized",
#     "status": 401,
#     "type": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401",
#     "detail": "No authorization header provided",
#     "error": "No authorization header provided"
#   }
#
# RFC 9457 asks the `type` URI to identify the *problem type*. This one
# identifies the status code -- which is already in `status` and on the status
# line -- and it resolves to a third-party documentation site the API does not
# control, rather than to the specification or to Trigger's own docs. Anyone
# who reads it learns what 401 means, which they knew.
#
# **And the same sentence is in the body twice.** `detail` and `error` carry
# identical strings, so a client reading either gets the same thing and a
# client reading both cannot tell which is authoritative.
#
# **The response is pretty-printed.** Newlines and two-space indentation, on
# the wire, on every problem document this API sends.
#
# **The well-formed envelope is for the failure that is not about your key.**
# A wrong key gets none of it:
#
#   (no header)              401  application/problem+json   five fields, indented
#   Bearer <wrong secret>    401  application/json           {"error":"Invalid API key"}
#   <secret, no prefix>      401  application/json           {"error":"Invalid API key"}
#
# So the case a caller can fix by reading -- a missing header -- gets a title, a
# type, a detail and a link; and the case that actually happens when a key is
# rotated gets three words and one field.
#
# **Routing never happens.** An unrouted path and a method the path does not
# take both answer the "No authorization header provided" document, so this API
# cannot tell a caller their path is wrong until their key is right -- and a
# caller with a wrong key is told the key is wrong even when the path does not
# exist.
#
# **Eleven statuses, five of which are ways of failing.** `PENDING_VERSION`,
# `QUEUED`, `EXECUTING`, `REATTEMPTING`, `FROZEN`, `COMPLETED`, `CANCELED`,
# `FAILED`, `CRASHED`, `INTERRUPTED`, `SYSTEM_FAILURE`. What separates FAILED
# from CRASHED from INTERRUPTED from SYSTEM_FAILURE is not said in the field,
# and `CANCELED` is spelled with one L beside `REATTEMPTING`.
#
# **`ttl` is a string or a number.** The reference gives its type as both, so
# one field holds either a duration expression or a count, and the reader finds
# out at runtime.
#
# **Money is a floating-point number of cents.** `costInCents` and
# `baseCostInCents` are `number`, not integer -- the unit is in the name, the
# precision is binary, and there are two of them because the invocation is
# billed separately from the compute.
#
# Also pinned: paging and filtering are nested objects flattened into the query
# string -- `page[size]`, `page[after]`, `filter[status]`,
# `filter[createdAt][period]`; `pagination` carries `next` and `previous` that
# are run ids rather than cursors or URLs; `page[size]` is documented as 10 to
# 100 with a default of 25, so the smallest page is ten; and `tags` is capped
# at ten entries of 1 to 128 characters each.

recipe: trigger
capability: queue
version: 0.1.0

upstream:
  api: v1
  docs: https://trigger.dev/docs/management/runs/list

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - tr_dev_cauldr0ntr1ggerf1xturesecret
  absent_error: no_authorization_header
  # A key with no scheme is judged the same as a wrong one.
  malformed_error: invalid_api_key
  rejected_error: invalid_api_key
  # Routing never happens: an unrouted path answers the credential failure.

responses:
  list:
    style: wrapped
    key: data
    cursor_field: pagination.next
    cursor_null: true
    prev_field: pagination.previous
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  run:
    id:
      field: id
      style: prefixed
      prefix: run_
      length: 21
    fields:
      # Eleven values, five of them ways of failing.
      status:
        type: string
      taskIdentifier:
        type: string
      version:
        type: string
      env:
        type: map
      idempotencyKey:
      isTest:
        type: boolean
      createdAt:
        type: string
      updatedAt:
        type: string
      startedAt:
      finishedAt:
      delayedUntil:
      # A string or a number, in the same slot.
      ttl:
      expiredAt:
      tags:
        type: list
      # Money, in binary floating point, denominated in the field name.
      costInCents:
        type: number
      baseCostInCents:
        type: number
      durationMs:
        type: integer

routes:
  - method: GET
    path: /api/v1/runs
    resource: run
    operation: list
    pagination:
      style: cursor
      limit: 25
      max_limit: 100
      # Nested objects, flattened into the query string.
      limit_param: page[size]
      cursor_param: page[after]
    filters:
      - param: filter[status]
        field: status
      - param: filter[taskIdentifier]
        field: taskIdentifier

errors:
  no_authorization_header:
    status: 401
    message: No authorization header provided
    headers:
      Content-Type: application/problem+json; charset=utf-8
    fields:
      title: Unauthorized
      # The status, again, in the body.
      status: 401
      # A third-party documentation page for the status code.
      type: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      # The same sentence as `error`, one key away.
      detail: No authorization header provided

  # And the failure that actually happens gets one field.
  invalid_api_key:
    status: 401
    message: Invalid API key
    headers:
      Content-Type: application/json; charset=utf-8

  # Live, both of these answer the credential failure above. Declared so the
  # shapes are named; see the README.
  unknown_route:
    status: 401
    message: No authorization header provided
    headers:
      Content-Type: application/problem+json; charset=utf-8
    fields:
      title: Unauthorized
      status: 401
      type: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      detail: No authorization header provided

  method_not_allowed:
    status: 401
    message: No authorization header provided
    headers:
      Content-Type: application/problem+json; charset=utf-8
    fields:
      title: Unauthorized
      status: 401
      type: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
      detail: No authorization header provided

fixtures:
  empty:
    run: []

  runs:
    run:
      - id: run_7kq2mx9plz4vb1nr8st3w
        status: COMPLETED
        taskIdentifier: send-welcome-email
        version: "20260523.1"
        env:
          id: env_4f3e2d1c
          name: prod
        idempotencyKey: null
        isTest: false
        createdAt: "2026-09-13T21:00:04.118Z"
        updatedAt: "2026-09-13T21:00:41.902Z"
        startedAt: "2026-09-13T21:00:06.004Z"
        finishedAt: "2026-09-13T21:00:41.902Z"
        delayedUntil: null
        # A duration expression, in a field the reference also types as a
        # number.
        ttl: 10m
        expiredAt: null
        tags:
          - welcome
          - onboarding
        # Cents, as floating point, billed in two parts.
        costInCents: 0.0412
        baseCostInCents: 0.025
        durationMs: 35898
      - id: run_4nb6vc8xz2qa9ws1ed3rf
        # One of the five ways of failing.
        status: SYSTEM_FAILURE
        taskIdentifier: nightly-rollup
        version: "20260523.1"
        env:
          id: env_4f3e2d1c
          name: prod
        idempotencyKey: nightly-2026-09-13
        isTest: false
        createdAt: "2026-09-13T03:00:00.000Z"
        updatedAt: "2026-09-13T03:00:12.441Z"
        startedAt: "2026-09-13T03:00:01.220Z"
        finishedAt: "2026-09-13T03:00:12.441Z"
        delayedUntil: null
        # The other type this field takes.
        ttl: 3600
        expiredAt: null
        tags: []
        costInCents: 0
        baseCostInCents: 0.025
        durationMs: 11221

conformance:
  - name: the problem type points at mdn
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-14"
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      headers: {}
    expect:
      status: 401
      headers:
        Content-Type: application/problem+json; charset=utf-8
      body:
        title: Unauthorized
        # A third-party documentation page for the status code.
        type: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
        # The status, again, in the body.
        status: 401
        # And the same sentence twice, one key apart.
        detail: No authorization header provided
        error: No authorization header provided

  - name: and the failure that actually happens gets one field
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-14"
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_dev_notarealsecret"
    expect:
      status: 401
      headers:
        # Not problem+json.
        Content-Type: application/json; charset=utf-8
      body:
        error: Invalid API key
      absent:
        - title
        - type
        - detail

  - name: a key with no scheme is judged the same as a wrong one
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-14"
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: tr_dev_cauldr0ntr1ggerf1xturesecret
    expect:
      status: 401
      body:
        error: Invalid API key

  - name: an unrouted path is answered before the path is looked at
    source: https://api.trigger.dev/api/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: runs
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        # The credential failure, for a path that does not exist.
        title: Unauthorized
        detail: No authorization header provided

  - name: and so is a method the path does not take
    source: https://api.trigger.dev/api/v1/runs
    verified: "2026-09-14"
    fixture: runs
    request:
      method: PUT
      path: /api/v1/runs
      headers: {}
    expect:
      status: 401
      body:
        title: Unauthorized
        error: No authorization header provided

  - name: eleven statuses and five of them are ways of failing
    source: https://trigger.dev/docs/management/runs/list
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_dev_cauldr0ntr1ggerf1xturesecret"
    expect:
      status: 200
      body:
        'data[0].status': COMPLETED
        # FAILED, CRASHED, INTERRUPTED and SYSTEM_FAILURE are four of the
        # eleven, and nothing in the field says what separates them.
        'data[1].status': SYSTEM_FAILURE
        'data[0].taskIdentifier': send-welcome-email
        'data[1].taskIdentifier': nightly-rollup
        'data[0].version': "20260523.1"
        'data[0].env.name': prod
        'data[0].isTest': false

  - name: one field holds a duration expression or a number
    source: https://trigger.dev/docs/management/runs/list
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_dev_cauldr0ntr1ggerf1xturesecret"
    expect:
      status: 200
      body:
        # The reference types ttl as string/number, and here it is both.
        'data[0].ttl': 10m
        'data[1].ttl': 3600
        'data[0].expiredAt': null
        'data[0].delayedUntil': null
        'data[0].idempotencyKey': null
        'data[1].idempotencyKey': nightly-2026-09-13
        'data[0].tags[0]': welcome
        'data[1].tags': []

  - name: money is floating point and billed in two parts
    source: https://trigger.dev/docs/management/runs/list
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      query:
        filter[status]: COMPLETED
        filter[taskIdentifier]: send-welcome-email
      headers:
        Authorization: "Bearer tr_dev_cauldr0ntr1ggerf1xturesecret"
    expect:
      status: 200
      body:
        # Cents, in binary floating point, with the unit in the field name.
        'data[0].costInCents': 0.0412
        'data[0].baseCostInCents': 0.025
        'data[0].durationMs': 35898
        'data[0].createdAt': "2026-09-13T21:00:04.118Z"
        'data[0].updatedAt': "2026-09-13T21:00:41.902Z"
        'data[0].startedAt': "2026-09-13T21:00:06.004Z"
        'data[0].finishedAt': "2026-09-13T21:00:41.902Z"

  - name: paging is a nested object flattened into the query string
    source: https://trigger.dev/docs/management/runs/list
    fixture: runs
    request:
      method: GET
      path: /api/v1/runs
      query:
        page[size]: "1"
        page[after]: run_7kq2mx9plz4vb1nr8st3w
      headers:
        Authorization: "Bearer tr_dev_cauldr0ntr1ggerf1xturesecret"
    expect:
      status: 200
      body:
        # page[after] takes a run id, which is what pagination.next holds.
        'data[0].id': run_4nb6vc8xz2qa9ws1ed3rf
        'pagination.next': null

  - name: an environment with no runs keeps the envelope
    source: https://trigger.dev/docs/management/runs/list
    fixture: empty
    request:
      method: GET
      path: /api/v1/runs
      headers:
        Authorization: "Bearer tr_dev_cauldr0ntr1ggerf1xturesecret"
    expect:
      status: 200
      body:
        data: []
        'pagination.next': null
