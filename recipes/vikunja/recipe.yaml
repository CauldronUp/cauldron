# Vikunja Recipe for Cauldron
#
# Written against Vikunja's own generated Swagger 2.0 document, published in its
# own repository -- github.com/go-vikunja/vikunja, pkg/swagger/swagger.json, 126
# paths -- read on 2026-09-06. Vikunja is self-hosted and there is no public
# instance, so nothing here is verified live: every claim is the provider's own
# document.
#
# **The verb does not tell you the operation.**
#
#   PUT  /labels        -> "Create a label"
#   PUT  /labels/{id}   -> "Update a label"
#   POST /projects/{id} -> update a project
#   POST /register      -> create a user
#
# PUT means create on a collection and update on an item. POST means update on
# twelve item paths and create on a handful of collections. Thirty collection
# paths take PUT to create; twelve item paths take POST to update.
#
# So a client cannot decide the verb from the operation, or the operation from
# the verb. It has to know each path. And the mistake is quiet in the direction
# that matters: POSTing to a collection, which is what every other API in this
# collection means by "create", is not a create here.
#
# **Authorization arrives in a header, and only on single items.**
#
# From the document's own description: "All endpoints which return a single item
# (project, task, etc.) - no array - will also return a `x-max-permission`
# header with the max permission the user has on this item as an int where `0`
# is `Read Only`, `1` is `Read & Write` and `2` is `Admin`."
#
# So what a caller may do is not in the record. It is in a header, as a bare
# integer, and only on the fetch -- a listing carries no permissions at all. A
# client rendering an edit button from a listing has nothing to read, and one
# that reads only response bodies never learns any of it. And `0` is a real
# permission level, so the falsy value means Read Only rather than none.
#
# **Two pagination headers, and neither is a total.**
#
# Again the document's own words: `x-pagination-total-pages` is "the total
# number of available pages for this request" and `x-pagination-result-count`
# is "the number of items returned for this request".
#
# Pages, and this page. Nowhere does anything say how many items exist. A
# client can compute a lower bound -- pages times per_page -- and cannot get
# the number, and a progress bar over items has nothing to read.
#
# **The provider says not to trust the HTTP status.**
#
# "All errors have an error code and a human-readable error message in addition
# to the http status code. You should always check for the status code in the
# response, not only the http status code."
#
# Two status codes, and the document tells you which one is authoritative: the
# one in the body. `web.HTTPError.code` is Vikunja's own, and it is finer than
# the HTTP status -- several distinct failures share one status and differ only
# there.
#
# **And the document says it is incomplete.**
#
# "Due to limitations in the swagger library we're using for this document, only
# one error per http status code is documented here. Make sure to check the
# error docs in Vikunja's documentation for a full list of available error
# codes."
#
# So the machine-readable description is knowingly lossy about exactly the
# thing the paragraph above tells you to branch on. A generated client's error
# handling is complete with respect to the document and incomplete with respect
# to the API.
#
# **The message is a template.** `web.HTTPError` carries `i18n_params`, "Message's
# dynamic values, keyed by the client's translation placeholder names, so
# clients can localise the error". So the message is a rendered sentence and the
# values that produced it travel beside it -- which is a good design, and means
# a client matching on message text is matching on a rendering rather than on a
# fact.
#
# **Two credentials in one header, and a third protocol.** A JWT and a scoped
# API token both go in `Authorization: Bearer <token>`, indistinguishable on the
# wire. BasicAuth is declared and, in the document's words, "only used when
# requesting tasks via CalDAV" -- so the same product answers a second protocol
# with a different credential.
#
# **A documentation slip worth knowing about.** `PUT /labels/{id}` -- the update
# -- documents its 200 as "The created label object." The description was copied
# from the create beside it, so a generated client's own documentation says an
# update creates.
#
# Known modelling limits, stated rather than discovered later:
#
#   - Nothing here is verified against a live API. Vikunja is self-hosted and
#     there is no public instance.
#   - Labels, listed, fetched and created. 126 paths is a task manager:
#     projects, tasks, buckets, teams, subscriptions, filters, webhooks, the
#     migration surface and CalDAV each want their own evidence.
#   - `x-max-permission` is served on the fetch and not on the listing, which
#     is Vikunja's rule. Its value is the fixture's, not computed from the
#     credential, because this Recipe has one caller.
#   - Only the JWT is checked. The scoped API token is indistinguishable from
#     it on the wire, which is the finding, and modelling scopes would mean
#     inventing which ones exist.

recipe: vikunja
capability: scheduling
version: 0.1.0

upstream:
  api: "v1"
  docs: https://vikunja.io/docs/api-documentation/
  spec: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
  spec_hash: ad92614c855bf9a94d4970600a2c734f4c2ba4f5b0df2bf0be0ea31684276104
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    # A JWT and a scoped API token both go here, and nothing on the wire tells
    # them apart.
    - cauldron.vikunja.jwt
  absent_error: unauthorized

responses:
  list:
    style: bare
    # "The number of items returned for this request" -- this page, not the
    # whole set.
    count_header: x-pagination-result-count
    count_means: page
    # "The total number of available pages for this request". Pages, not items,
    # and there is no header anywhere carrying the number of items.
    pages_header: x-pagination-total-pages
  error:
    style: flat
    message_field: message
    # Vikunja's own code, which the document says to check instead of the HTTP
    # status.
    code_field: code
    code_type: number

resources:
  label:
    id:
      style: numeric
      type: number
    fields:
      title:
        type: string
        required: true
      description:
        type: string
      # Seven characters including the hash, per the document's maxLength.
      hex_color:
        type: string
        default: "#4287f5"
      created:
        type: datetime
      updated:
        type: datetime

routes:
  - method: GET
    path: /api/v1/labels
    resource: label
    operation: list
    pagination:
      style: page
      cursor_param: page
      limit_param: per_page
      limit: 50
      first_page: 1
    filters:
      # s, for search. One letter.
      - field: title
        param: s

  - method: GET
    path: /api/v1/labels/{id}
    resource: label
    operation: get
    not_found: not_found
    headers:
      # Only on a single item, never on a listing. The whole of what a caller
      # may do, as a bare integer, outside the body.
      x-max-permission: "2"

  # PUT on a collection, which is a create. This is the finding served rather
  # than described: a caller who POSTs here -- which is what create means
  # everywhere else -- does not create anything.
  - method: PUT
    path: /api/v1/labels
    resource: label
    operation: create

  # And PUT on an item, which is an update. Same verb, same Recipe, different
  # operation, decided by whether the path ends in an identifier.
  - method: PUT
    path: /api/v1/labels/{id}
    resource: label
    operation: update
    not_found: not_found

errors:
  unauthorized:
    status: 401
    code: 4001
    message: "missing, malformed, expired or otherwise invalid token provided"
  not_found:
    status: 404
    code: 5002
    message: "The label does not exist."
    fields:
      i18n_params: {}
  forbidden:
    status: 403
    code: 5003
    message: "You don't have the right to see this label."
    fields:
      i18n_params: {}
  invalid:
    status: 400
    code: 5001
    message: "The label title cannot be empty."
    fields:
      # The values that produced the rendered sentence, keyed by the client's
      # own placeholder names.
      i18n_params:
        field: title
  rate_limit:
    status: 429
    code: 4002
    message: "The rate limit was exceeded."
    fields:
      i18n_params: {}

fixtures:
  empty:
    label: []

  board:
    label:
      - id: 3
        title: urgent
        description: "Needs doing today."
        hex_color: "#e8483f"
        created: "2026-02-14T08:30:00Z"
        updated: "2026-07-22T13:05:00Z"
      - id: 4
        title: blocked
        description: "Waiting on somebody else."
        hex_color: "#f5a742"
        created: "2026-02-14T08:31:00Z"
        updated: "2026-02-14T08:31:00Z"

conformance:
  - name: the pagination headers count pages and this page, never the whole set
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      query:
        page: "1"
        per_page: "1"
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 200
      headers:
        # "The number of items returned for this request" -- one, because that
        # is the page. Not two.
        x-pagination-result-count: "1"
        # "The total number of available pages for this request" -- two pages
        # of one. Nowhere in the response does anything say there are two
        # items; a client can only multiply and get an upper bound.
        x-pagination-total-pages: "2"
      body:
        '[0].title': urgent
      absent:
        - '[1]'

  - name: permissions arrive in a header, and only on a single item
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels/3
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 200
      headers:
        # 0 is Read Only, 1 is Read & Write, 2 is Admin. A bare integer, in a
        # header, outside the body -- and 0 is a real level, so the falsy value
        # means read-only rather than nothing.
        x-max-permission: "2"
      body:
        title: urgent
        hex_color: "#e8483f"
        description: "Needs doing today."
        # "A timestamp when this label was created. You cannot change this
        # value" -- created and updated, not created_at and updated_at, and
        # the difference matters because a client mapping the usual spelling
        # writes undefined into both.
        created: "2026-02-14T08:30:00Z"
        updated: "2026-07-22T13:05:00Z"

  - name: a listing carries no permissions at all
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 200
      absent_headers:
        # "All endpoints which return a single item ... - no array -" is the
        # document's own wording. So a client rendering edit buttons from a
        # listing has nothing to read, and has to fetch each record to find
        # out.
        - x-max-permission
      body:
        '[0].title': urgent
        '[1].title': blocked

  - name: PUT on the collection creates
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: PUT
      path: /api/v1/labels
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
      json:
        title: waiting
        hex_color: "#8e44ad"
    expect:
      # Not POST. Thirty collection paths in this API take PUT to create, and
      # POSTing to one of them -- which is what create means everywhere else --
      # creates nothing.
      status: 200
      body:
        title: waiting
        hex_color: "#8e44ad"
      matches:
        # The identifier the server assigned, which is the part the request did
        # not send.
        id: '^[0-9]+$'

  - name: PUT on the item updates, with the same verb
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: PUT
      path: /api/v1/labels/4
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
      json:
        title: unblocked
    expect:
      status: 200
      body:
        id: 4
        title: unblocked
        # And the fields the request did not send survive, which is what makes
        # this an update rather than a replacement -- despite the verb.
        hex_color: "#f5a742"

  - name: a failure carries a code that is not the HTTP status
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels/9999
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 404
      body:
        # The document's own instruction: "You should always check for the
        # status code in the response, not only the http status code." This is
        # that code, and it is finer than the status -- several failures share
        # 404 and differ only here.
        code: 5002
        message: "The label does not exist."

  - name: an error message is a rendering, and its inputs travel beside it
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    arm: invalid
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 400
      body:
        code: 5001
        message: "The label title cannot be empty."
        # i18n_params carries "Message's dynamic values, keyed by the client's
        # translation placeholder names". So a client matching on the message
        # text is matching on one language's rendering of this.
        'i18n_params.field': title

  - name: no credential is refused with a code of its own
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      headers: {}
    expect:
      status: 401
      body:
        code: 4001
        message: "missing, malformed, expired or otherwise invalid token provided"

  - name: "a forbidden request says so in these words"
    source: "https://vikunja.io/docs/errors/"
    arm: forbidden
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 403
      body:
        code: 5003
        message: "You don't have the right to see this label."

  - name: "the rate limit says so in these words"
    source: "https://vikunja.io/docs/errors/"
    arm: rate_limit
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 429
      body:
        code: 4002
        message: "The rate limit was exceeded."

  - name: the search parameter is one letter
    source: https://raw.githubusercontent.com/go-vikunja/vikunja/main/pkg/swagger/swagger.json
    fixture: board
    request:
      method: GET
      path: /api/v1/labels
      query:
        # s. Not q, not search, not filter.
        s: blocked
      headers:
        Authorization: Bearer cauldron.vikunja.jwt
    expect:
      status: 200
      body:
        '[0].title': blocked
      absent:
        - '[1]'
