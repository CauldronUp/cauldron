# Four cases below carry `verified:` -- struck against api.papayaglobal.com,
# 2026-09-01, with no account, no api_key and no client_secret ever created.
# The rest are read from docs.papayaglobal.com's own embedded OpenAPI
# fragments and carry no verified date, because reaching a genuine 200 needs
# a token this Recipe was never issued.
conformance:
  - name: no credential at all is refused by an HTML page, not the documented JSON shape
    source: https://api.papayaglobal.com/payments/beneficiaries
    verified: "2026-09-01"
    fixture: demo-account
    request:
      method: GET
      path: /payments/beneficiaries
    expect:
      status: 401
      headers:
        Content-Type: "text/html"
      body_matches: "401 Authorization Required"

  - name: a well-formed but wrong bearer token gets the identical page
    source: https://api.papayaglobal.com/payments/beneficiaries
    verified: "2026-09-01"
    fixture: demo-account
    request:
      method: GET
      path: /payments/beneficiaries
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body_matches: "401 Authorization Required"

  - name: a wrong method on the real route is refused the same way, not with a 405
    source: https://api.papayaglobal.com/payments/beneficiaries
    verified: "2026-09-01"
    fixture: demo-account
    request:
      method: POST
      path: /payments/beneficiaries
    expect:
      status: 401
      body_matches: "401 Authorization Required"

  - name: an id-shaped path still reaches the same gate
    source: https://api.papayaglobal.com/payments/beneficiaries/15
    verified: "2026-09-01"
    fixture: demo-account
    request:
      method: GET
      path: /payments/beneficiaries/15
    expect:
      status: 401
      body_matches: "401 Authorization Required"

  - name: a listing carries payment readiness, never an employer
    source: https://docs.papayaglobal.com/api-reference/beneficiaries-management/get-beneficiaries-list
    fixture: demo-account
    request:
      method: GET
      path: /payments/beneficiaries
      headers:
        Authorization: Bearer cauldron-papayaglobal-fixture-token-000000000000
    expect:
      status: 200
      body:
        "items[8].id": "15"
        # A leading space -- see the fixture comment: this is the row's
        # merged, later-page spelling, not a typo in this Recipe.
        "items[8].name": " Sophia Brooks"
        "items[8].entity_type": INDIVIDUAL
        "items[8].status": ACTIVE
        "items[8].active": true
        paging.total: 16
      absent:
        - facets
        - "items[8].entity"
        - "items[8].bank_details"

  - name: the full record's entity is the payee's own identity, and nothing here names an employer or a termination
    # The centrepiece of this Recipe -- see the header. Field names chosen
    # in absent below echo Remote's own engaged_by_legal_entity_id and
    # employment_lifecycle_stage on purpose: neither this field nor any
    # equivalent exists anywhere on this object or this API.
    source: https://docs.papayaglobal.com/api-reference/beneficiaries-management/get-beneficiary-details
    fixture: demo-account
    request:
      method: GET
      path: /payments/beneficiaries/15
      headers:
        Authorization: Bearer cauldron-papayaglobal-fixture-token-000000000000
    expect:
      status: 200
      body:
        id: "15"
        entity_type: INDIVIDUAL
        "entity.individual_first_name": " Sophia"
        "entity.date_of_birth": "1968-08-29"
        "bank_details.account_name": Brooks Sophia
        status: ACTIVE
        active: true
        "issues[0].code": NO_PAYMENTS
      absent:
        - employer
        - employing_entity
        - engaged_by_legal_entity_id
        - employment_model
        - employment_lifecycle_stage
        - termination_date
        - terminated_at
