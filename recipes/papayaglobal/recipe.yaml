# Papaya Global Recipe for Cauldron
#
# This batch asked whether Papaya makes the employing entity visible and
# what a terminated worker looks like -- the same question
# recipes/remotecom/recipe.yaml answered with two independent fields
# (`type`, `employment_model`) and recipes/bamboohr/recipe.yaml answered by
# finding a terminated employee indistinguishable from one who never
# existed. Papaya's answer is different from both, and it is not a partial
# one: the question has no surface to land on, because the only API Papaya
# Global publishes anywhere reachable is not an employment API at all.
#
# docs.papayaglobal.com's own introduction, quoted verbatim: "Welcome to the
# Papaya Global payments API Reference documentation... The Papaya Global
# API is crafted to be adaptable, granting you authority over your
# beneficiaries, wallet payment instructions, and account management." Its
# own index (llms.txt, fetched in full) lists forty-some pages -- Wallets
# Management, Groups Management, Beneficiaries Management, Payment
# Management, Collect Information, Webhooks -- and not one of them is named
# Employees, Workers, Employment or HR. Grepped across every page this
# Recipe fetched: no mention of employment, employer, termination or
# offboarding anywhere. A beneficiary, in Papaya's own words on the
# Beneficiaries Management overview page, is "the person or organization
# receiving the payment" -- deliberately generic, because the same object
# stands in for an employee, a contractor, a vendor or anyone else a company
# sends money to through this product. This is Papaya's payment-disbursement
# API, not its Employer-of-Record platform. Compare deel/recipe.yaml
# elsewhere in this portfolio, the payroll peer that DOES answer this
# batch's question, because Deel's partner-gated sandbox actually exposes a
# contract/employment record with a real termination lifecycle. Papaya's
# public surface never gets that far: nothing about the employing entity or
# an employment record is documented anywhere this Recipe could reach, and
# this Recipe does not guess at a shape nobody has published.
#
# **A field that looks like it might answer the question does not.** A
# beneficiary carries `entity` and `entity_type` (`BUSINESS` or
# `INDIVIDUAL`, per the Create A Beneficiary reference page's own schema),
# which reads, out of context, like Remote's `type`/`employment_model` pair.
# It is not that. `entity` is "Beneficiary owning entity attributes" --
# quoted verbatim -- and its own worked example is the beneficiary's OWN
# name, date of birth and address (individual_first_name, individual_last_
# name, date_of_birth, address_city, ...): who the PAYEE is, not who employs
# them. There is no employer, employing_entity, company_id or anything
# resembling Remote's own engaged_by_legal_entity_id anywhere on this
# object. The one other place this vocabulary's own materials use the word
# "entity" is unrelated a third way: the Real-Life Scenarios guide lists
# "Establishing a legal entity (finishing the KYB procedure)" as a
# prerequisite step, where the entity being verified is Papaya's OWN
# CUSTOMER -- the paying business -- going through Know-Your-Business, not
# an employer relationship for a worker at all. Three uses of one word on
# one vendor's own materials, none of them the one this batch went looking
# for.
#
# **A beneficiary's own status vocabulary is about payment readiness, not
# employment.** Get Beneficiary Details' own schema: `status` is one of
# ACTIVE, ACTIVATING, REQUIRES_INPUT, REQUIRES_ATTENTION, DISABLED, and a
# separate `active` boolean is "true when the beneficiary is active for
# payments" -- quoted verbatim. DISABLED is the closest thing to
# "terminated" this object has, and it describes whether Papaya will still
# move money to this payee, not whether a person's employment ended.
# Nothing about a termination date, an employment_lifecycle_stage or a
# last-working-day exists on this record, documented or otherwise.
#
# **The resource host answers two different denials depending on whether
# the path is one Papaya actually routes, and neither is the application's
# own documented shape.** Checked live, 2026-09-01, against
# api.papayaglobal.com, with no account and no key ever created:
#
#   A path this Recipe could find no documentation for -- the bare host,
#   /v1, /v1/employees, /nonexistent-xyz-123, /swagger.json, /docs,
#   /openapi.json -- every method, every credential state (no header, a
#   junk Bearer token, a junk x-api-key header) answered the byte-identical
#
#     HTTP/1.1 403 Forbidden
#     x-amzn-ErrorType: ForbiddenException
#     {"message":"Forbidden"}
#
#   which is AWS API Gateway's own generic denial, not anything Papaya's
#   application wrote -- the ErrorType header names the AWS SDK exception
#   class, and it answered from the bare root path exactly as it did from a
#   fabricated one. The demo host named in Papaya's own Environments
#   reference, api.cust1.papaya-sandbox.com, answers the identical body for
#   the identical reason.
#
#   The real, documented resource path -- GET /payments/beneficiaries and
#   its id-addressed form -- routes somewhere else entirely and answers a
#   DIFFERENT status, with no credential, a junk Bearer token, and a wrong
#   method (POST) all landing on the byte-identical 172 bytes:
#
#     HTTP/1.1 401 Unauthorized
#     Content-Type: text/html
#     <html><head><title>401 Authorization Required</title></head>
#     <body><center><h1>401 Authorization Required</h1></center>
#     <hr><center>nginx</center></body></html>
#
#   an nginx-branded default error page, no WWW-Authenticate header at all,
#   fronting whatever actually serves this route. So a route that exists
#   answers more informatively than one that does not -- 401 rather than
#   403, plain HTML rather than a phantom-route JSON body -- but neither
#   status is the ForbiddenResponse-style application shape any of this
#   provider's own documentation describes, and neither is reachable by a
#   credential this Recipe could ever hold: no case below claims a 200 of
#   any kind was seen. This is a genuine sixth ordering beside the five
#   internal/recipe/auth.go already names for auth.after_routing: a route
#   that exists is denied by one piece of infrastructure and a route that
#   does not is denied by another, and credential shape changes neither
#   answer. Declaring after_routing on this Recipe would misstate one side
#   or the other, so it is left at Cauldron's own default and only the real
#   route's own behaviour -- the one an integration actually reaches -- is
#   modelled below; the phantom-route 403 is recorded here as live evidence
#   and not served by any case, the same choice kinde/recipe.yaml makes for
#   its own HTML "404 Domain Not Found" admin page.
#
# **The one piece of this product that is genuinely alive, application-
# level, and richly informative is credential ISSUANCE, not credential USE
# -- and it directly contradicts its own documentation.** Papaya's
# Authentication API reference names a real production host,
# authentication-service.papayaglobal.com, separate from the resource host
# above, and documents POST /token: send api_key, client_secret and
# token_name in the body, get back {valid_until, token, token_name} at 201,
# or 401 {"error":"Invalid request"} for a bad one. Struck live, 2026-09-01,
# with no api_key or client_secret this Recipe was ever issued:
#
#   POST /token, no body at all
#     -> 400 {"type":"about:blank","title":"Bad Request","status":400,
#             "detail":"Failed to read request","instance":"/token"}
#     Spring's own default ProblemDetail shape -- "about:blank" is Spring's
#     literal placeholder RFC 9457 type, not Papaya's.
#   POST /token, {} (an empty JSON object)
#     -> 400 {"error":"Client secret key is required","description":
#             "The provided Client secret is required","error_code":400}
#     which is close kin to the general error shape api-essentials.md
#     documents for the whole Payments API -- {error, description,
#     error_code, sub_code} -- confirming this host really is part of the
#     same product, just answering from a different subsystem.
#   POST /token, a body matching the documented request schema exactly
#   (api_key, client_secret, token_name), with junk values
#     -> 500 {"status":"INTERNAL_SERVER_ERROR","errors":["error <uuid>"]}
#     NOT the documented 401. A well-formed, wrong credential crashes this
#     endpoint rather than refusing it cleanly -- struck twice, with two
#     different request shapes, both times a 500.
#   GET /token (wrong method)
#     -> 405 {"status":"METHOD_NOT_ALLOWED","errors":["Request method
#             'GET' is not supported"]}, Allow: POST
#     a real 405, correctly routed, naming the one method this path takes.
#   Any other path, or the bare host
#     -> 404, Content-Type: application/xml, Server: AmazonS3,
#        <Error><Code>NoSuchKey</Code>...<Key>production/backoffice/v1/
#        nonexistent-xyz</Key>...
#     an S3 bucket behind the same CloudFront distribution, serving
#     Papaya's own backoffice frontend for literally everything on this
#     hostname except the one path actually wired to the token service.
#
# Three incompatible JSON shapes for three different ways of getting this
# one endpoint's request wrong -- Spring's generic problem-detail, a custom
# validation object, and a bare status/errors pair -- and the one outcome
# every worked example in the documentation shows, a bad credential
# answering 401, was never once observed: it answered 500 both times this
# Recipe tried it. That is the sharpest thing this Recipe found and the
# thing it could not model: Cauldron routes describe a wire's shape, not a
# separate credential-minting host with its own four-way error taxonomy,
# and the resource host above is where this Recipe's own auth block and
# conformance cases are aimed, the same choice payoneer/recipe.yaml makes
# for its own separate login host. Every byte quoted above was watched
# happen and is recorded here rather than forced into a route.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No 200 of any kind was ever observed. Every resource field and every
#     worked value below is read from docs.papayaglobal.com's own embedded
#     OpenAPI fragments (Get Beneficiary Details, Get Beneficiaries List),
#     never called, because no api_key/client_secret pair this Recipe could
#     use to mint a token was ever issued.
#   - Create, Update, Bulk Import, Invite and every write on Beneficiaries,
#     and the whole of Wallets Management, Groups Management, Payment
#     Management and Collect Information, are entirely unmodelled. This
#     Recipe is scoped to the one resource the batch's question turns on.
#   - The list envelope's own `facets` object (country/currency/user_tags
#     counts, per the Get Beneficiaries List worked example) is real and
#     not modelled: it is a search-aggregation feature orthogonal to the
#     question this Recipe exists to answer.
#   - No pagination beyond the single page Papaya's own worked example
#     shows (16 rows, `paging: {skip: 0, take: 50, total: 16}`) is
#     exercised; the fixture holds exactly those 16 rows, unedited.
#   - GET /payments/beneficiaries/schema/{entity_type}/{country}/{currency}
#     (Get Schema Information) is real, documented, and not modelled: it
#     answers a JSONSchema document describing what fields a given
#     country/currency combination accepts, which is a schema-of-a-schema
#     this format has no mechanism to express as a resource.
#   - Webhooks Notifications is documented only in prose on Papaya's own
#     reference page -- "PapayaGlobal offers a variety of webhooks for you
#     to choose from," with no event name, no payload, and no worked
#     example of any kind -- and is not modelled for that reason.
#   - Basic HTTP auth and OAuth are not offered by this API at all, per its
#     own documentation; the only scheme is the Bearer token POST /token
#     mints, described above and not exercised for a 200 by any case here.
#
# No upstream.spec is recorded. docs.papayaglobal.com is ReadMe.io-hosted
# with a separate OpenAPI fragment embedded per reference page rather than
# one fetchable document at a stable URL -- the same gap bamboohr/recipe.yaml
# and zenvia/recipe.yaml state for the same reason. Keys below are
# fixtures, not secrets, and belong to no account.

recipe: papayaglobal
capability: payroll
version: 0.1.0

upstream:
  api: v1
  provider: papayaglobal
  docs: https://docs.papayaglobal.com/api-reference/beneficiaries-management

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-papayaglobal-fixture-token-000000000000
  # No absent/malformed/rejected split. On the one real, documented route
  # this Recipe could reach, no credential, a well-formed junk Bearer
  # token, and a wrong method all answered the byte-identical nginx-branded
  # 401 -- see the header. Nothing this Recipe could send ever reached an
  # application-level distinction to declare.

responses:
  list:
    style: wrapped
    count_field: paging.total
  resource:
    style: bare
  # The one denial this Recipe's real declared route actually answers,
  # live -- an HTML page, not JSON. See the header for the phantom-route
  # JSON 403 this styling deliberately does not carry.
  error:
    style: text

resources:
  # GET /payments/beneficiaries and its id-addressed form. Every field and
  # value below is Papaya's own worked example on the Get Beneficiary
  # Details and Get Beneficiaries List reference pages, quoted verbatim --
  # both examples describe the same beneficiary (id 15, Sophia Brooks), so
  # this Recipe's one fixture is the two pages' examples combined rather
  # than two unrelated records.
  beneficiary:
    collection: items
    id:
      style: opaque
    fields:
      # A constant on every worked example this Recipe found: "contact".
      type:
        type: string
        default: contact
      name:
        type: string
      currency:
        type: string
      # BUSINESS or INDIVIDUAL -- the beneficiary's OWN legal nature, not an
      # employer. See the header: this is the field that looks like it
      # might answer the batch's question and does not.
      entity_type:
        type: string
      # Payment readiness, not employment status -- ACTIVE, ACTIVATING,
      # REQUIRES_INPUT, REQUIRES_ATTENTION, DISABLED. See the header.
      status:
        type: string
      active:
        type: boolean
      user_tags:
        type: map
        default: {}
      # List-only projection of the beneficiary's own address country; the
      # get-by-id shape carries the fuller address inside entity/bank_details
      # instead and this field is not present there. See routes below.
      account_country:
        type: string
        null_when_unset: true
      # get-by-id only. "Beneficiary owning entity attributes" -- the
      # payee's own name, date of birth and address. Never an employer.
      entity:
        type: map
        null_when_unset: true
      bank_details:
        type: map
        null_when_unset: true
      payments:
        type: map
        null_when_unset: true
      issues:
        type: list
        default: []

routes:
  - method: GET
    path: /payments/beneficiaries
    resource: beneficiary
    operation: list
    returns:
      - type
      - id
      - entity_type
      - name
      - account_country
      - currency
      - active
      - status
      - user_tags
    pagination:
      style: offset
      limit: 50
      limit_param: take
      cursor_param: skip

  - method: GET
    path: /payments/beneficiaries/{id}
    resource: beneficiary
    operation: get
    returns:
      - type
      - id
      - entity_type
      - name
      - currency
      - active
      - status
      - user_tags
      - entity
      - bank_details
      - payments
      - issues

errors:
  # Live, verified, byte-identical regardless of credential or method -- see
  # the header. This Recipe reproduces the page's title/heading text rather
  # than the complete markup, the same simplification textline/recipe.yaml
  # makes for its own HTML 404 page, for the same reason: the gate's
  # behaviour is the finding, not the exact bytes of a default error page.
  authentication_error:
    status: 401
    message: "401 Authorization Required"
    headers:
      Content-Type: "text/html"

fixtures:
  empty: {}

  demo-account:
    beneficiary:
      # Every row is Get Beneficiaries List's own worked example, quoted
      # verbatim, sixteen rows, unedited. id 15 (Sophia Brooks) is the same
      # beneficiary Get Beneficiary Details' own example describes in full,
      # so the get-by-id fixture below is not a separate invention.
      - type: contact
        id: "6"
        entity_type: INDIVIDUAL
        name: Jordan Anderson
        account_country: AU
        currency: AUD
        active: true
        status: ACTIVE
        user_tags:
          department: R&D
