        name: Caleb Rodriguez
        account_country: AU
        currency: AUD
        active: true
        status: ACTIVE
        user_tags:
          department: R&D
      - type: contact
        id: "7"
        entity_type: INDIVIDUAL
        name: Natalie Clarke
        account_country: AU
        currency: AUD
        active: true
        status: ACTIVE
        user_tags:
          department: Operations
      - type: contact
        id: "13"
        entity_type: INDIVIDUAL
        name: Lily Chang
        account_country: AU
        currency: AUD
        active: true
        status: ACTIVE
        user_tags:
          department: Sales
      - type: contact
        id: "9"
        entity_type: INDIVIDUAL
        name: Maya Patel
        account_country: AU
        currency: AUD
        active: true
        status: ACTIVE
        user_tags:
          department: Sales
      # This row is the two vendor pages' own examples merged: the list
      # page's row above this comment named this beneficiary "Sophia
      # Brooks" with department Operations; the Get Beneficiary Details
      # page's own full example for the SAME id, quoted below, names her
      # " Sophia Brooks" -- a leading space -- and never mentions a
      # department at all. Both are Papaya's own literal text; this Recipe
      # keeps the fuller, later page's exact spelling rather than silently
      # normalising the two apart, and states the mismatch here instead.
      - type: contact
        id: "15"
        entity_type: INDIVIDUAL
        name: " Sophia Brooks"
