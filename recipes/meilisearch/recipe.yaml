# Meilisearch Recipe for Cauldron
#
# Meilisearch is worth emulating for one reason above all the others: writing
# a document and finding it are two different things, minutes apart, and the
# API is honest about this in a way almost nobody reads.
#
# Adding a document answers 202 with a task number. Not the document, not its
# id, not a count: a number, and the word "enqueued". The document is not
# searchable yet. It may never be searchable, because the task can fail after
# the 202 that accepted it. A test that adds a document and immediately
# searches for it finds nothing, and the usual response is to add a sleep,
# which turns a race into a slow race.
#
# Four more worth modelling exactly:
#
#   1. The task is the only receipt. There is no document id in the response,
#      so the only way to know whether your write landed is to poll
#      /tasks/{uid} until the status leaves enqueued. Code that treats 202 as
#      success reports success for writes that failed.
#   2. estimatedTotalHits is an estimate. It is in the name and it is still
#      the number people page on, and it changes between requests for the
#      same query. A paginator computing a page count from it produces a
#      count that was true once.
#   3. A search that matches nothing answers 200 with an empty hits array.
#      A search against an index that does not exist answers 404. Both look
#      like "no results" to code that only checks whether hits is empty.
#   4. The primary key is inferred from the first document if it was not set,
#      and inferred wrong is permanent: the index has to be deleted. A
#      document whose id field is named something unexpected quietly decides
#      the schema for every document after it.
#
# Set against the three other answers this collection already has for "is a
# write finished when the response says so": Temporal Cloud's create hands
# back an AsyncOperation -- a second object, built to be polled, with no
# projection of the thing itself. Sumo Logic's search-job create answers 202
# with an id and a link.href addressing the poll endpoint, plus a warning
# field that pre-emptively names its own most likely failure mode. PandaDoc
# answers 201 with the *same* resource a GET returns, under the *same* field
# names, and the only difference between unfinished and finished is one
# status value the provider tells you to watch. Meilisearch's task is a
# fourth shape again: not the resource, not a projection of the resource, and
# not even a claim about the resource -- a bare number and the word enqueued,
# with the actual document reachable nowhere at all until a second request
# to a second endpoint says the first one is done. Turso's create is the
# nearest miss: a truncated projection of the row itself, three of eight
# fields, with no state field anywhere to say the projection is incomplete.
# Meilisearch is the only one of the four with a state field on every single
# task, always present, defaulting to enqueued rather than defaulting to
# looking finished.
#
# Two things below are read from Meilisearch's own source
# (github.com/meilisearch/meilisearch, crates/meilisearch-types/src/error.rs
# and crates/meilisearch/src/extractors/authentication/{mod,error}.rs) rather
# than from a live call, because no instance this task could reach exists to
# call. cloud.meilisearch.com is the Cloud dashboard, a Vercel-hosted
# Next.js app (checked live, 2026-09-01) -- not an instance's own API, which
# lives at ms-<project-id>.meilisearch.io and requires a project this task
# was never going to create. Both are cited with source: and carry no
# verified: date, exactly as this task's rules require for a claim read
# rather than called:
#
#   1. A missing credential and a wrong one are not the same failure, and the
#      difference is a status code, not just a sentence. extract_token_from_
#      request returns Ok(None) when there is no Authorization header at
#      all, which auth_token turns into AuthenticationError::
#      MissingAuthorizationHeader -- Code::MissingAuthorizationHeader, and
#      the Code table pins that at UNAUTHORIZED (401). A header that parses
#      as "Bearer <token>" for a token this instance does not hold reaches
#      auth_bearer instead, which raises Code::InvalidApiKey on failed
#      authentication -- and InvalidApiKey is pinned at FORBIDDEN (403), not
#      401. Both below are struck in the error registry lines 229, 386 and
#      391 of error.rs. This Recipe's auth.rejected_error carries the
#      distinction, which is the same device FireHydrant's and HERE's
#      Recipes in this collection use for their own two-sentence providers --
#      the difference here is that the two verdicts do not even share a
#      status code.
#   2. What Cauldron calls a malformed credential -- present, and not the
#      declared shape -- is not one thing in Meilisearch's own source. A
#      header that does not start with the literal string "Bearer " at all
#      (no scheme word, or the wrong one) falls through extract_token_from_
#      request's match to `_otherwise => Err(MissingAuthorizationHeader)` --
#      the identical error an absent header gets. A header that is exactly
#      "Bearer" with nothing after it -- no trailing space -- reaches a
#      different arm, `Some("Bearer") => match type_token.next() { None =>
#      Err(InvalidToken) }`, and InvalidToken carries Code::InvalidApiKey:
#      the 403, not the 401. Cauldron's own prefix check cannot tell these
#      two apart -- both are "present, does not start with the exact bytes
#      'Bearer '" to a runtime comparing one prefix -- so this Recipe leaves
#      auth.malformed_error unset and takes the collapse in the direction the
#      likelier real mistake falls on: a caller who sends the wrong scheme
#      word entirely (Basic, a raw token, nothing) outnumbers one who sends
#      the literal seven bytes "Bearer" with the trailing space trimmed off
#      by whatever handled the header before curl did.
#   3. Routing runs before the credential is examined, and this is read from
#      the request-handling architecture rather than observed: create_app
#      (crates/meilisearch/src/lib.rs) wraps the whole App in RouteMetrics,
#      Cors, TracingLogger and Compress, and none of the four is an auth
#      check. GuardedData<P, D>, the type that extracts and checks a
#      credential, is an actix-web FromRequest extractor -- a function
#      parameter on a specific matched handler, not global middleware -- so
#      it cannot run for a path nothing has registered. auth.after_routing
#      carries this, with no verified: date, because no live host answered
#      it: it is what the source says must happen, not what a response was
#      seen to do.
#
# Which mode this Recipe models, stated plainly because the task asked for
# it directly: a self-hosted instance started with no --master-key at all is
# not a degraded version of the API below -- it is a different product.
# Meilisearch's own specification (0119-instance-options, cited below) says
# so without qualification: "If no master key is provided in a development
# environment, all routes will be unprotected and publicly accessible."
# Every route, no exceptions, no distinction between reading and writing.
# That mode has no auth block to write down; every case in this file would
# be wrong about it. The same specification is just as direct about the
# mode this Recipe does model: "Providing a master key of at least 16 bytes
# is mandatory when --env is set to production," and a production instance
# refused one at startup is told so in as many words: "You must provide a
# master key to secure your instance in a production environment." Meilisearch
# Cloud instances are production instances -- nobody launches one with
# --env development -- so ms-<id>.meilisearch.io, the host this Recipe
# stands in for, is always the protected mode below, never the open one.
# The two 401/403 cases above are what that protected mode answers; the wide
# open mode is a different Recipe this task was not asked to write.
#
# Checked live 2026-09-05 for anything reachable, and there is nothing to
# probe that is actually this API. Meilisearch is self-hosted by default,
# and Meilisearch Cloud provisions one unique hostname per project
# (ms-<id>.meilisearch.io) rather than a shared endpoint anyone can address --
# there is no api.meilisearch.com the way there is an api.stripe.com.
# api.meilisearch.com does resolve, but it is the Cloud dashboard's own web
# app, not a search instance: /health answers 200 with a browser
# Content-Security-Policy naming Stripe and Vercel rather than Meilisearch's
# real health payload, {"status":"available"}, and /indexes answers a bare
# 404 with no body at all, not the JSON error an unauthenticated Meilisearch
# instance actually sends. No case below carries a verified date because
# there is no host reachable from outside that runs the API this Recipe
# emulates.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No task ever progresses. A task is enqueued, processing, succeeded or
#     failed because a fixture says so, and nothing moves it along. That is
#     the honest half of the trap: the point is that a client must poll, and
#     a client polling this Recipe finds whatever the fixture holds.
#   - No text is indexed and nothing is ranked. A search returns the fixture
#     hits for that index, in fixture order, whatever the query says. The
#     ranking rules, typo tolerance, synonyms and stop words are the part of
#     Meilisearch this cannot reproduce and should not pretend to.
#   - Faceting, filtering, geosearch and multi-search are not modelled.
#   - Every real Meilisearch error carries a fourth field, "link", pointing
#     at https://docs.meilisearch.com/errors#<code> -- confirmed in
#     ResponseError's own Serialize derive, error.rs. Adding it would touch
#     every error entry in this file for one field this group's question
#     does not turn on, so it is named here rather than declared.
#   - No fetchable OpenAPI document was found at a stable URL. Meilisearch
#     generates one via utoipa and serves it at /scalar only when the
#     "swagger" Cargo feature is built in, which Cloud instances behind
#     ms-<id>.meilisearch.io were never reachable to confirm either way.
#     upstream.spec is not recorded for that reason.
#
# Keys below are fixtures, not secrets.

recipe: meilisearch
capability: search
version: 0.1.0

upstream:
  api: v1.11
  docs: https://www.meilisearch.com/docs/reference/api/overview

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-meilisearch-master-key
  # A credential that is present, prefixed and simply not held gets its own
  # status as well as its own sentence -- 403, not 401. Read from the error
  # registry rather than observed; see the header.
  rejected_error: invalid_api_key
  # GuardedData is a per-route extractor, not global middleware, so a path
  # nothing has registered never reaches it. Read from the source rather
  # than observed; see the header.
  after_routing: true

responses:
  list:
    style: wrapped
    count_field: total
    # offset and limit, not a cursor. Meilisearch pages its administrative
    # listings by offset and its search results by a different mechanism
    # entirely, which is its own small trap.
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code
    type_field: type

resources:
  index:
    collection: results
    id:
      style: opaque
      length: 12
      # Meilisearch calls it uid everywhere. Code reading index.id gets
      # nothing, on every endpoint.
      field: uid
    fields:
      # Inferred from the first document if it was not set, and inferring it
      # wrong is permanent: the index has to be deleted and rebuilt. A
      # document whose identifier field is named something unexpected
      # quietly decides the schema for everything after it.
      primaryKey:
        type: string
        null_when_unset: true
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

  task:
    collection: results
    id:
      # A JSON number, not a string. uid === "42" is false against a real
      # instance and a schema declaring an integer rejects a quoted one.
      #
      # It increments across the whole instance rather than per index, so two
      # tasks on different indexes have adjacent numbers and neither fact
      # means anything.
      style: numeric
      type: number
      field: uid
    fields:
      indexUid:
        type: string
      # enqueued, processing, succeeded, failed, canceled. The 202 that
      # created this task said nothing about which.
      status:
        type: string
        default: enqueued
      # documentAdditionOrUpdate, documentDeletion, indexCreation,
      # settingsUpdate, and others. One name covers both adding and
      # updating, so the task does not say which happened.
      type:
        type: string
        default: documentAdditionOrUpdate
      # How many documents the task touched, and null until it finishes. A
      # client reading it off an enqueued task reads nothing.
      receivedDocuments:
        type: integer
        in: details
        as: receivedDocuments
      indexedDocuments:
        type: integer
        in: details
        as: indexedDocuments
      # Present only on a failure, nested, and the message is the whole
      # diagnosis.
      errorMessage:
        type: string
        in: error
        as: message
      errorCode:
        type: string
        in: error
        as: code
      enqueuedAt:
        type: datetime
      startedAt:
        type: datetime
        null_when_unset: true
      finishedAt:
        type: datetime
        null_when_unset: true

  # What a write answers with. The same task, described differently: this is
  # taskUid and the full object at /tasks is uid, so a client holding a write
  # response and going to look the task up has to know they are the same
  # number under two names.
  enqueued_task:
    collection: results
    id:
      style: numeric
      type: number
      field: taskUid
    fields:
      indexUid:
        type: string
      status:
        type: string
        default: enqueued
      type:
        type: string
        default: documentAdditionOrUpdate
      enqueuedAt:
        type: datetime

  # A document that has arrived. Not one that has been accepted: a document
  # is in neither the document listing nor the search index until the task
  # that added it has succeeded, so this collection is the answer to "did my
  # write land", and the answer is often no for several seconds.
  #
  # The fields below are Meilisearch's own example dataset. A real index has
  # whatever shape its documents have, which is the part of this that no
  # Recipe can describe for everybody.
  document:
    collection: results
    id:
      # Whatever the index's primary key holds. The example dataset uses
      # numbers, and an index keyed on a string identifier would declare
      # otherwise.
      style: numeric
      type: number
    fields:
      indexUid:
        type: string
      title:
        type: string
      overview:
        type: string
      genres:
        type: list
      release_date:
        type: integer

routes:
  - method: GET
    path: /indexes
    resource: index
    operation: list
    pagination:
      style: offset
      limit: 20
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /indexes/{id}
    resource: index
    operation: get

  # Creating an index answers with a task, not an index. There is no index
  # yet, and there is no index id in the response to hold on to.
  - method: POST
    path: /indexes
    resource: enqueued_task
    operation: create
    # 202, and Meilisearch's own description says 200 on this operation and on
    # the document add below. The description is the thing that is wrong:
    # Meilisearch answers Accepted because the work is enqueued, which is the
    # whole point of the task it hands back, and its documentation says so.
    # Written down because check reports the disagreement every time, and the
    # obvious way to silence it would be to make the Recipe wrong.
    status: 202
    returns:
      - id
      - indexUid
      - status
      - type
      - enqueuedAt

  # And so does adding a document. 202, a number, and the word enqueued.
  # Not the document, not its id, not a count.
  - method: POST
    path: /indexes/{indexUid}/documents
    resource: enqueued_task
    operation: create
    scope:
      - indexUid
    status: 202
    returns:
      - id
      - indexUid
      - status
      - type
      - enqueuedAt

  - method: GET
    path: /indexes/{indexUid}/documents
    resource: document
    operation: list
    scope:
      - indexUid
    pagination:
      style: offset
      limit: 20
      limit_param: limit
      cursor_param: offset

  - method: GET
    path: /indexes/{indexUid}/documents/{id}
    resource: document
    operation: get
    scope:
      - indexUid

  - method: GET
    path: /tasks
    resource: task
    operation: list
    pagination:
      # limit and from, from Meilisearch's own reference: limit is the
      # "maximum number of batches to return", defaulting to 20, and from is
      # the "uid of the first batch returned". The response carries next --
      # "value to pass as from parameter to get the next page. When null,
      # there are no more tasks to retrieve."
      #
      # So the position is a record id the caller lifts out of the response,
      # not an offset and not an opaque token, which is why the header above
      # calls Meilisearch's two paging mechanisms "its own small trap": the
      # administrative listings page this way and search results page by
      # something else entirely.
      style: cursor
      limit: 20
      limit_param: limit
      cursor_param: from

  - method: GET
    path: /tasks/{id}
    resource: task
    operation: get

errors:
  rate_limit:
    status: 429
    code: too_many_requests
    # Four types cover every failure Meilisearch has, and dozens of codes
    # sit under them. A client that switches on the code has a switch that
    # grows; one that switches on the type has four branches forever.
    type: system
    message: "Too many requests"

  authentication_error:
    status: 401
    code: missing_authorization_header
    type: auth
    message: "The Authorization header is missing. It must use the bearer authorization method."

  # 403, not 401 -- the Code table pins InvalidApiKey at FORBIDDEN while
  # MissingAuthorizationHeader sits at UNAUTHORIZED, two lines apart in the
  # same registry. Read from the source; see the header for the exact lines
  # and for the one shape of malformed header this collapses into the entry
  # above instead.
  invalid_api_key:
    status: 403
    code: invalid_api_key
    type: auth
    message: "The provided API key is invalid."

  # An index that does not exist. A search against it answers 404 while a
  # search that simply matched nothing answers 200, and both read as "no
  # results" to code that only looks at whether the list is empty.
  resource_missing:
    status: 404
    code: index_not_found
    type: invalid_request
    message: "Index `movies` not found."

  parameter_missing:
    status: 400
    code: bad_request
    type: invalid_request
    message: "The request is invalid."

  # The identifier field could not be worked out from the documents sent,
  # because more than one field looked like an id. The write is rejected and
  # the index stays empty rather than half-populated.
  primary_key_inference_failed:
    status: 400
    code: index_primary_key_multiple_candidates_found
    type: invalid_request
    message: "The primary key inference failed as the engine found several fields ending with `id` in their names. Please specify the primary key manually."

  # The index already has a primary key and it cannot be changed. The only
  # way out is to delete the index and rebuild it, so a wrong inference on
  # the first document is permanent.
  primary_key_already_present:
    status: 400
    code: index_primary_key_already_exists
    type: invalid_request
    message: "Index already has a primary key: `id`."

fixtures:
  empty: {}

  small-instance:
    index:
      - id: movies
        primaryKey: id
        createdAt: "2026-07-02T11:00:00Z"
        updatedAt: "2026-08-14T09:14:02Z"

      # No primary key. Meilisearch will infer one from the first document
      # added, and inferring it wrong is permanent: the index has to be
      # deleted and rebuilt.
      - id: drafts
        createdAt: "2026-08-14T09:20:00Z"
        updatedAt: "2026-08-14T09:20:00Z"

    document:
      - id: "287947"
        indexUid: movies
        title: Shazam!
        overview: "A boy is given the ability to become an adult superhero."
        genres:
          - Action
          - Comedy
        release_date: 1553299200

      - id: "522681"
        indexUid: movies
        title: Creed II
        overview: "Between personal obligations and training for his next big fight."
        genres:
          - Drama
        release_date: 1543708800

      # There is deliberately no document 671 here. Its task is below, it is
      # still enqueued, and this is the whole point: the write was accepted
      # with a 202 and the document is in neither the document listing nor
      # the search index.

    task:
      - id: "41"
        indexUid: movies
        status: succeeded
        type: documentAdditionOrUpdate
        receivedDocuments: 2
        indexedDocuments: 2
        enqueuedAt: "2026-08-14T09:12:00Z"
        startedAt: "2026-08-14T09:12:01Z"
        finishedAt: "2026-08-14T09:14:02Z"

      # Accepted two minutes ago and still not run. The client that added
      # document 671 got a 202 and a number, and searching for it right now
      # finds nothing. Adding a sleep turns the race into a slow race.
      - id: "42"
        indexUid: movies
        status: enqueued
        type: documentAdditionOrUpdate
        receivedDocuments: 1
        enqueuedAt: "2026-08-15T10:31:00Z"

      # And this one failed, after the same 202. Nothing about the write
      # response said it might, and the only place the reason exists is here.
      - id: "43"
        indexUid: drafts
        status: failed
        type: documentAdditionOrUpdate
        receivedDocuments: 1
        indexedDocuments: 0
        errorMessage: "The primary key inference failed as the engine found several fields ending with `id` in their names. Please specify the primary key manually."
        errorCode: index_primary_key_multiple_candidates_found
        enqueuedAt: "2026-08-15T09:58:00Z"
        startedAt: "2026-08-15T09:58:01Z"
        finishedAt: "2026-08-15T09:58:01Z"

    enqueued_task: []

# Every case below is derived from Meilisearch's published documentation, or,
# for the auth and routing cases, from its published source -- both cited by
# source: rather than by a call this task had no reachable instance to make.
# None has been run against a real instance. The verify report says so.
conformance:
  - name: adding a document answers with a number, not a document
    # 202, a task number and the word enqueued. No document, no document id,
    # no count. There is nothing in this response to store.
    source: https://www.meilisearch.com/docs/reference/api/documents
    fixture: small-instance
    request:
      method: POST
      path: /indexes/movies/documents
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
      json:
        title: The Whale
    expect:
      status: 202
      body:
        indexUid: movies
        status: enqueued
        type: documentAdditionOrUpdate
      matches:
        taskUid: '^[0-9]+$'
      absent:
        - id
        - uid
        - title
        - documents

  - name: the accepted document is in neither listing yet
    # Task 42 accepted document 671 and has not run. The document listing
    # does not have it, and neither does anything else. A test that adds a
    # document and immediately reads it back reads nothing.
    source: https://www.meilisearch.com/docs/reference/api/documents
    fixture: small-instance
    request:
      method: GET
      path: /indexes/movies/documents
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        total: 2
        results[0].title: Shazam!
        results[1].title: Creed II
        # Numbers, unquoted. The example dataset is keyed on an integer, and
        # a listing that quoted them would fail a schema that did not.
        results[0].id: 287947
        results[1].id: 522681
      absent:
        - results[2]

  - name: the enqueued task is the only place the write exists
    source: https://www.meilisearch.com/docs/reference/api/tasks
    fixture: small-instance
    request:
      method: GET
      path: /tasks/42
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        uid: 42
        status: enqueued
        indexUid: movies
        details.receivedDocuments: 1
      absent:
        - taskUid
        - details.indexedDocuments

  - name: an enqueued task has not started and says so with nulls
    # startedAt and finishedAt are present and null rather than left out, so
    # a client testing for the key's existence finds it and reads nothing.
    source: https://www.meilisearch.com/docs/reference/api/tasks
    fixture: small-instance
    request:
      method: GET
      path: /tasks/42
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        startedAt: null
        finishedAt: null

  - name: the same task is taskUid on a write and uid on a read
    # One number, two names. A client holding a write response and going to
    # look the task up has to know they are the same thing.
    source: https://www.meilisearch.com/docs/reference/api/tasks
    fixture: small-instance
    request:
      method: GET
      path: /tasks/41
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        uid: 41
        status: succeeded
      absent:
        - taskUid

  - name: a task uid is a number, not a string
    # uid === "42" is false against a real instance, and a schema declaring
    # an integer rejects a quoted one outright.
    source: https://www.meilisearch.com/docs/reference/api/tasks
    fixture: small-instance
    request:
      method: GET
      path: /tasks
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        total: 3
        results[0].uid: 41
        results[1].uid: 42
        results[2].uid: 43
      absent:
        - results[3]

  - name: a task can fail after the 202 that accepted it
    # Nothing about the write response said it might, and the only place the
    # reason exists is here, nested under error rather than at the top level.
    source: https://www.meilisearch.com/docs/reference/api/tasks
    fixture: small-instance
    request:
      method: GET
      path: /tasks/43
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        status: failed
        details.receivedDocuments: 1
        details.indexedDocuments: 0
        error.code: index_primary_key_multiple_candidates_found
      absent:
        - errorCode
        - errorMessage
        - message

  - name: an index calls its identifier uid
    # Not id, on any endpoint. Code reading index.id gets nothing everywhere.
    source: https://www.meilisearch.com/docs/reference/api/indexes
    fixture: small-instance
    request:
      method: GET
      path: /indexes/movies
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        uid: movies
        primaryKey: id
      absent:
        - id

  - name: an index without a primary key says null rather than leaving it out
    # Meilisearch will infer one from the first document added, and inferring
    # it wrong is permanent: the index has to be deleted and rebuilt.
    source: https://www.meilisearch.com/docs/reference/api/indexes
    fixture: small-instance
    request:
      method: GET
      path: /indexes/drafts
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        uid: drafts
        primaryKey: null

  - name: creating an index answers with a task, not an index
    # There is no index yet and nothing in this response to hold on to.
    source: https://www.meilisearch.com/docs/reference/api/indexes
    fixture: small-instance
    request:
      method: POST
      path: /indexes
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
      json:
        indexUid: reviews
        type: indexCreation
    expect:
      status: 202
      body:
        status: enqueued
        type: indexCreation
      absent:
        - uid
        - primaryKey
        - createdAt

  - name: a document listing is scoped to its index
    source: https://www.meilisearch.com/docs/reference/api/documents
    fixture: small-instance
    request:
      method: GET
      path: /indexes/drafts/documents
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 200
      body:
        total: 0
      absent:
        - results[0]

  - name: a missing index is a 404 while an empty result is a 200
    # Both read as "no results" to code that only checks whether the list is
    # empty, and one of them means the index name is wrong.
    source: https://www.meilisearch.com/docs/reference/api/documents
    fixture: small-instance
    request:
      method: GET
      path: /indexes/movies/documents/999999
      headers:
        Authorization: Bearer cauldron-meilisearch-master-key
    expect:
      status: 404
      body:
        code: index_not_found
        type: invalid_request
      matches:
        # The name a client unwraps a failure at. Asserted for presence
        # rather than wording, because the wording comes from this
        # Recipe's own errors block -- pinning the text would assert the
        # Recipe against itself, and the name is the part a provider
        # decides.
        message: '.'

  - name: a missing bearer token is refused
    source: https://www.meilisearch.com/docs/reference/api/keys
    fixture: small-instance
    request:
      method: GET
      path: /tasks
    expect:
      status: 401
      body:
        code: missing_authorization_header
        # auth, not invalid_request. Four types cover every failure
        # Meilisearch has, and a client that switches on the type has four
        # branches forever where one switching on the code has a switch that
        # grows.
        type: auth

  - name: a wrong bearer token is a different status, not just a different sentence
    # Read from the Code table (error.rs): InvalidApiKey is pinned at
    # FORBIDDEN where MissingAuthorizationHeader is pinned at UNAUTHORIZED.
    # No instance was reachable to call this against; see the header.
    source: https://github.com/meilisearch/meilisearch/blob/main/crates/meilisearch-types/src/error.rs
    fixture: small-instance
    request:
      method: GET
      path: /tasks
      headers:
        Authorization: Bearer wrong-key-this-instance-never-issued
    expect:
      status: 403
      body:
        code: invalid_api_key
        type: auth
        message: "The provided API key is invalid."

  - name: an unrecognised path is refused for the route, not the credential
    # GuardedData is a per-route FromRequest extractor, not global
    # middleware (create_app, lib.rs) -- a path nothing has registered
    # cannot reach it. Read from the source; no instance was reachable to
    # call this. Sent exactly as a request that had never held a credential
    # would be, which is what auth.after_routing is for.
    source: https://github.com/meilisearch/meilisearch/blob/main/crates/meilisearch/src/lib.rs
    fixture: small-instance
    request:
      method: GET
      path: /totally-bogus-endpoint-xyz
    expect:
      status: 404

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses and asserts the two records the fixture holds, in the
  # order it holds them.
  - name: "the index listing answers with what the fixture holds"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].uid": "movies"
        "results[1].uid": "drafts"

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].uid": "movies"
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from offset=1 answers
  # the *second* record, which can only happen if the name was read.
  # Between them these two cases pin both halves; either name renamed to
  # what the runtime falls back on fails one of them.
  - name: "offset moves the page on, and the second record is what comes back"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].uid": "drafts"
      absent:
        - "results[1]"

  # The page size. Asking for one and receiving the first without the
  # second can only happen if limit was read -- with the name ignored
  # the whole collection comes back, and this fixture holds 3 records.
  # No record had to be invented for that.
  - name: "limit is read, because a page of one is not the whole collection"
    source: "https://www.meilisearch.com/docs/reference/api/tasks"
    fixture: small-instance
    request:
      method: GET
      path: "/tasks"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].uid": 41
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from from=41 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "from moves the page on, and the second record is what comes back"
    source: "https://www.meilisearch.com/docs/reference/api/tasks"
    fixture: small-instance
    request:
      method: GET
      path: "/tasks"
      query:
        "limit": "1"
        "from": "41"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].uid": 42
      absent:
        - "results[1]"

  # The page size, asserted from what the sandbox answered rather than
  # from what the fixture lists -- the two are not the same thing,
  # because the store does not serve records in the order a fixture
  # writes them. Asking for one out of 2 and receiving one can only
  # happen if limit was read.
  - name: "limit is read, and a page of one is not the whole collection"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes/movies/documents"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].id": 287947
      absent:
        - "results[1]"

  # And the position. offset=1 answers a different record, which the
  # size alone cannot produce.
  - name: "offset moves the page on, and what comes back is not page one"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes/movies/documents"
      query:
        "limit": "1"
        "offset": "1"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].id": 522681
      absent:
        - "results[1]"

  # The names. This Recipe declares 3 field(s) on a document that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a document carries the field names this Recipe declares"
    source: "https://www.meilisearch.com/docs/reference/api/documents"
    fixture: small-instance
    request:
      method: GET
      path: "/indexes/movies/documents"
      headers:
