    expect:
      status: 200
      body:
        "results[0].createdAt": "2026-07-02T11:00:00Z"
        "results[0].updatedAt": "2026-08-14T09:14:02Z"

  # The names. This Recipe declares 1 field(s) on a task that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a task carries the field names this Recipe declares"
    source: "https://www.meilisearch.com/docs/reference/api/tasks"
    fixture: small-instance
    request:
      method: GET
      path: "/tasks"
      headers:
        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 200
      body:
        "results[0].enqueuedAt": "2026-08-14T09:12:00Z"

  # The names. This Recipe declares 1 field(s) on an enqueued_task that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "an enqueued_task carries the field names this Recipe declares"
    source: "https://www.meilisearch.com/docs/reference/api/indexes"
    fixture: small-instance
    request:
      method: POST
      path: "/indexes"
