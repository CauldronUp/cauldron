        "Authorization": "Bearer cauldron-meilisearch-master-key"
    expect:
      status: 202
      body:
        "enqueuedAt": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 2 field(s) on a task that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
