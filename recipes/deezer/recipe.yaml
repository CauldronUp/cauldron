# Deezer Recipe for Cauldron
#
# Every failure is HTTP 200.
#
#   /artist/999999999999  ->  200  {"error": {"type": "DataException",
#                                             "message": "no data", "code": 800}}
#   /nosuchthing          ->  200  {"error": {"type": "InvalidQueryException",
#                                             "message": "Unknown path components : /nosuchthing",
#                                             "code": 600}}
#   /search?q=            ->  200  {"error": {"type": "ParameterException",
#                                             "message": "empty parameter", "code": 500}}
#
# Not one of them is a 4xx. A client checking response.ok, or res.status < 400,
# or axios's default validateStatus, sees success on every failure this API has
# and hands an object with no id to whatever asked for a record.
#
# **And one of them carries a 500 inside the 200.** The code for an empty
# parameter is 500, in a response whose HTTP status is 200 -- three digits that
# look exactly like a status and are not one. Its neighbours are 600 and 800,
# which are not HTTP statuses at all, so a client that logs code beside status
# reports a server error on a request the server answered fine.
#
# **The number of matching records depends on how many you ask for.** The same
# query, four page sizes:
#
#   /search?q=daft&limit=1    ->  total 179
#   /search?q=daft&limit=5    ->  total 179
#   /search?q=daft&limit=25   ->  total 177
#   /search?q=daft&limit=100  ->  total 172
#
# Asking for a bigger page makes the collection smaller. A client sizing a
# pager from total gets a different answer per page size, and the direction is
# backwards from every guess anyone would make.
#
# Written against the live API rather than a document: every case below was
# checked against api.deezer.com on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A limit of nought is ignored. ?limit=0 answers with 25 records, the
#      default page, so a client asking for none because it needs none gets a
#      full page. A limit of -1 answers with eight, which is neither the
#      default, nor nothing, nor an error.
#   2. The share link carries the provider's analytics. share is the record's
#      URL with utm_source, utm_medium, utm_content and a utm_term of
#      0_1788098538 already attached, so an application rendering a share
#      button propagates Deezer's attribution without ever deciding to.
#   3. Five picture fields, and the first is not a picture. picture is
#      https://api.deezer.com/artist/27/image, an API path, while picture_small
#      through picture_xl are CDN JPEGs. A client rendering the shortest name
#      gets a redirect where its siblings give bytes.
#   4. Explicitness is sent three times in three encodings, in one record:
#      explicit_lyrics is true, explicit_content_lyrics is 1, and
#      explicit_content_cover is 0. A boolean, and two integers that are not
#      booleans, about the same subject. The album resource does the same with
#      false beside a 7, so the integer is not a boolean wearing a number.
#
# And every forward slash in every URL is escaped -- "https:\/\/www.deezer.com"
# -- which is PHP's json_encode leaving its fingerprints on the wire.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - One artist and one track are served, of Deezer's catalogue, and the
#     catalogue moves. The album resource is named in the notes above and not
#     served at all.
#   - The three totals are declared constants on three routes rather than
#     counts derived from the fixture. That is the finding: upstream they are
#     not derived from the fixture either, and a Recipe that computed them
#     would report the same number three times and pin nothing.
#   - The preview URL upstream carries an expiring hdnea= token. The fixture
#     keeps the path and drops the token, because a signed URL recorded in a
#     Recipe is a credential in a repository, and it would be expired anyway.
#   - Slashes are escaped by Deezer's encoder, not by this one. Cauldron's JSON
#     writer does not escape them, so the bytes differ there and the values do
#     not. It is recorded here rather than served.

recipe: deezer
capability: media
version: 0.1.0

upstream:
  api: v1
  provider: deezer
  docs: https://developers.deezer.com/api

auth:
  # Public for reads, no key.
  scheme: none

responses:
  list:
    style: wrapped
    key: data
  resource:
    style: bare
  error:
    # An object under "error", with a type, a sentence and a number that looks
    # like an HTTP status and is not one.
    style: nested
    key: error
    message_field: message
    type_field: type
    code_field: code
    code_type: number

resources:
  artist:
    id:
      style: numeric
      field: id
      type: number
    fields:
      name:
        type: string
      type:
        type: string
      link:
        type: string
      share:
        type: string
      picture:
        type: string
      picture_small:
        type: string
      picture_xl:
        type: string
      nb_album:
        type: integer
      nb_fan:
        type: integer
      radio:
        type: boolean
      tracklist:
        type: string

  track:
    id:
      style: numeric
      field: id
      type: number
    fields:
      title:
        type: string
      title_version:
        type: string
      isrc:
        type: string
      duration:
        type: integer
      rank:
        type: integer
      readable:
        type: boolean
      explicit_lyrics:
        type: boolean
      explicit_content_lyrics:
        type: integer
      explicit_content_cover:
        type: integer
      md5_image:
        type: string
      type:
        type: string

routes:
  - method: GET
    path: /artist/{id}
    resource: artist
    operation: get

  # The same query, three page sizes, three totals.
  - method: GET
    path: /search
    resource: track
    operation: list
    matches_query:
      limit: "1"
    fields:
      total: 179

  - method: GET
    path: /search
    resource: track
    operation: list
    matches_query:
      limit: "5"
    fields:
      # Still 179, so the drop is a threshold rather than noise.
      total: 179

  - method: GET
    path: /search
    resource: track
    operation: list
    matches_query:
      limit: "25"
    fields:
      # Two fewer, for asking for more.
      total: 177

  - method: GET
    path: /search
    resource: track
    operation: list
    matches_query:
      limit: "100"
    fields:
      # Seven fewer again.
      total: 172

  # A limit of nought is ignored, and answers the default page.
  - method: GET
    path: /search
    resource: track
    operation: list
    matches_query:
      limit: "0"
    fields:
      # The same total the default page size gives, because it is that page.
      total: 177

  # A record that does not exist. Two hundred.
  - method: GET
    path: /artist/999999999999
    error: no_data

  # A path that does not exist. Two hundred.
  - method: GET
    path: /nosuchthing
    error: unknown_path

  # An empty parameter. Two hundred, and a code of 500.
  - method: GET
    path: /search-empty-parameter
    error: empty_parameter

errors:
  no_data:
    # Not 404.
    status: 200
    type: DataException
    code: "800"
    message: "no data"

  unknown_path:
    status: 200
    type: InvalidQueryException
    code: "600"
    # A space before the colon, and the slash escaped on the wire.
    message: "Unknown path components : /nosuchthing"

  empty_parameter:
    # Two hundred, carrying five hundred.
    status: 200
    type: ParameterException
    code: "500"
    message: "empty parameter"

fixtures:
  empty: {}

  catalogue:
    artist:
      - id: "27"
        name: Daft Punk
        type: artist
        link: "https://www.deezer.com/artist/27"
        # The provider's own analytics, handed to whoever renders a share
        # button.
        share: "https://www.deezer.com/artist/27?utm_source=deezer&utm_content=artist-27&utm_term=0_1788098538&utm_medium=web"
        # An API path, where its four siblings are CDN JPEGs.
        picture: "https://api.deezer.com/artist/27/image"
        # Fifty-six pixels across...
        picture_small: "https://cdn-images.dzcdn.net/images/artist/638e69b9caaf9f9f3f8826febea7b543/56x56-000000-80-0-0.jpg"
        # ...and a thousand, from the same hash.
        picture_xl: "https://cdn-images.dzcdn.net/images/artist/638e69b9caaf9f9f3f8826febea7b543/1000x1000-000000-80-0-0.jpg"
        nb_album: 39
        # The artist counts fans as nb_fan; the album counts them as fans.
        nb_fan: 5197128
        radio: true
        tracklist: "https://api.deezer.com/artist/27/top?limit=50"

  results:
    track:
      - id: "136889400"
        title: Starboy
        # An empty string, where the rest of the record uses nothing at all.
        title_version: ""
        isrc: USUG11600976
        duration: 230
        rank: 975897
        readable: true
        # A boolean...
        explicit_lyrics: true
        # ...and two integers, about the same subject, in one record.
        explicit_content_lyrics: 1
        explicit_content_cover: 0
        # A bare hash, from which a client must build a URL itself.
        md5_image: 134778e4c4f19ea71c82408300925a9a
        type: track

conformance:
  - name: a record that does not exist answers two hundred
    source: https://api.deezer.com/artist/999999999999
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /artist/999999999999
    expect:
      # Not 404. A client checking response.ok sees success.
      status: 200
      body:
        error.type: DataException
        error.message: no data
        # A number that looks like a status and is not one.
        error.code: 800

  - name: a path that does not exist answers two hundred with a space before the colon
    source: https://api.deezer.com/nosuchthing
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /nosuchthing
    expect:
      status: 200
      body:
        error.type: InvalidQueryException
        # The space before the colon is Deezer's, not a typo here.
        error.message: "Unknown path components : /nosuchthing"
        error.code: 600

  - name: and an empty parameter answers two hundred carrying five hundred
    source: https://api.deezer.com/search?q=
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /search-empty-parameter
    expect:
      # Two hundred outside...
      status: 200
      body:
        # ...and five hundred inside.
        error.code: 500
        error.type: ParameterException
        error.message: empty parameter

  - name: the number of matching records shrinks as the page grows
    source: https://api.deezer.com/search?q=daft&limit=1
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "1"
    expect:
      status: 200
      body:
        # A hundred and seventy-nine, for asking for one.
        total: 179

  - name: asking for five still finds a hundred and seventy-nine
    source: https://api.deezer.com/search?q=daft&limit=5
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "5"
    expect:
      status: 200
      body:
        # Unchanged from one, so the number that follows is a threshold being
        # crossed rather than a total wandering between requests.
        total: 179

  - name: asking for twenty-five finds two fewer
    source: https://api.deezer.com/search?q=daft&limit=25
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "25"
    expect:
      status: 200
      body:
        total: 177

  - name: and asking for a hundred finds seven fewer again
    source: https://api.deezer.com/search?q=daft&limit=100
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "100"
    expect:
      status: 200
      body:
        # Same query, same second, twelve fewer records than limit=1 reported.
        total: 172

  - name: a limit of nought is ignored and answers the default page
    source: https://api.deezer.com/search?q=daft&limit=0
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "0"
    expect:
      status: 200
      body:
        # The total the default page size gives, because it is that page.
        total: 177
        "data[0].id": 136889400

  - name: the share link carries the provider's own analytics
    source: https://api.deezer.com/artist/27
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /artist/27
    expect:
      status: 200
      body:
        # utm_term and all, handed to whoever renders a share button.
        share: "https://www.deezer.com/artist/27?utm_source=deezer&utm_content=artist-27&utm_term=0_1788098538&utm_medium=web"
        # And the plain link, which does not.
        link: "https://www.deezer.com/artist/27"
        name: Daft Punk
        id: 27

  - name: five picture fields and the first is not a picture
    source: https://api.deezer.com/artist/27
    verified: "2026-08-30"
    fixture: catalogue
    request:
      method: GET
      path: /artist/27
    expect:
      status: 200
      body:
        # An API path...
        picture: "https://api.deezer.com/artist/27/image"
        # ...beside CDN JPEGs, under names that read as siblings.
        picture_small: "https://cdn-images.dzcdn.net/images/artist/638e69b9caaf9f9f3f8826febea7b543/56x56-000000-80-0-0.jpg"
        picture_xl: "https://cdn-images.dzcdn.net/images/artist/638e69b9caaf9f9f3f8826febea7b543/1000x1000-000000-80-0-0.jpg"
        # And the fan count, which the album resource calls "fans".
        nb_fan: 5197128
        nb_album: 39
        radio: true
        tracklist: "https://api.deezer.com/artist/27/top?limit=50"
        type: artist

  - name: explicitness is sent three times in three encodings
    source: https://api.deezer.com/search?q=daft&limit=1
    verified: "2026-08-30"
    fixture: results
    request:
      method: GET
      path: /search
      query:
        limit: "1"
    expect:
      status: 200
      body:
        # A boolean...
        "data[0].explicit_lyrics": true
        # ...and two integers, about the same subject.
        "data[0].explicit_content_lyrics": 1
        "data[0].explicit_content_cover": 0
        # An empty string, where absence elsewhere is a missing key.
        "data[0].title_version": ""
        "data[0].title": Starboy
        "data[0].isrc": USUG11600976
        "data[0].md5_image": 134778e4c4f19ea71c82408300925a9a
        "data[0].readable": true
        "data[0].duration": 230
        "data[0].rank": 975897
        "data[0].type": track
