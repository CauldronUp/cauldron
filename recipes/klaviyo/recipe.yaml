# Klaviyo Recipe for Cauldron
#
# Klaviyo has no sandbox. A private key reaches a real account, and a test that
# creates a profile creates a real contact who can then be swept into a real
# flow and emailed. Profiles cannot be hard deleted through the API either, so
# test data accumulates permanently and counts towards the plan. Teams share
# one account and prefix everything with "test-", which is not a boundary.
#
# Three things worth modelling exactly:
#
#   1. This is JSON:API. Every object is {type, id, attributes}, so the data a
#      client wants is one level down at data.attributes, and the object's own
#      kind is a sibling of its id rather than a field inside it.
#   2. The revision header is mandatory and dated. Klaviyo pins behaviour to
#      it, and omitting it is a hard failure rather than a default to latest,
#      which is the first wall a new integration hits.
#   3. Authentication is not a bearer token. The scheme is "Klaviyo-API-Key",
#      and sending Bearer fails in a way that reads like a bad key.
#
# Keys below are fixtures, not secrets.

recipe: klaviyo
capability: marketing
version: 0.1.0

upstream:
  api: "2024-10-15"
  docs: https://developers.klaviyo.com/en/reference/api_overview
  # This provider's own description, and it declares all three listings
  # this Recipe models. It is where the paging parameter names below
  # were read from.
  spec: https://raw.githubusercontent.com/klaviyo/openapi/main/openapi/stable.json
  spec_hash: 38a58b17c2cfc58af2e0e514017d0afe77cb7efb7a21e759ef847487f6504bc8
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  # Klaviyo's own scheme. Not Bearer.
  prefix: "Klaviyo-API-Key "
  keys:
    - pk_cauldron
  # Confirmed live 2026-09-05 -- see the errors table below. No credential
  # at all gets its own code and sentence; a wrong prefix (Bearer, sent by
  # habit) and the right prefix with a key nobody issued get an identical
  # second one, distinct from the first.
  absent_error: not_authenticated_error
  malformed_error: authentication_failed
  rejected_error: authentication_failed

# Klaviyo pins behaviour to a dated revision and refuses a request without one.
required_headers:
  revision: missing_revision

responses:
  list:
    style: wrapped
    cursor_field: links.next
    # A whole URL, not a token. Concatenating this onto a base URL --
    # which is what a client written against a token does -- builds an
    # address that does not exist.
    cursor_url: absolute
  resource:
    style: wrapped
    key: data
  # JSON:API errors: an array, each entry with its own status, code and detail.
  error:
    style: list
    key: errors
    type_field: title
    code_field: code
    message_field: detail
    status_field: status

resources:
  profile:
    collection: data
    constants:
      type: profile
    id:
      style: opaque
      length: 26
    fields:
      # Everything a client reads is one level down, under attributes.
      email:
        type: string
        in: attributes
      phone_number:
        type: string
        in: attributes
      first_name:
        type: string
        in: attributes
      last_name:
        type: string
        in: attributes
      external_id:
        type: string
        in: attributes
      created:
        type: datetime
        in: attributes
      updated:
        type: datetime
        in: attributes

  list:
    collection: data
    constants:
      type: list
    id:
      style: opaque
      length: 6
    fields:
      name:
        type: string
        required: true
        in: attributes
      # An opt-in process of double means a new profile receives nothing until
      # it confirms, and code that counts every member as reachable overstates
      # the audience.
      opt_in_process:
        type: string
        default: single
        in: attributes
      created:
        type: datetime
        in: attributes

  campaign:
    collection: data
    constants:
      type: campaign
    id:
      style: opaque
      length: 26
    fields:
      name:
        type: string
        required: true
        in: attributes
      # A draft campaign has sent nothing. Reporting on every campaign in the
      # list without checking this reports zeroes as failures.
      status:
        type: string
        default: Draft
        in: attributes
      channel:
        type: string
        default: email
        in: attributes
      send_time:
        type: datetime
        in: attributes
      created_at:
        type: datetime
        in: attributes

routes:
  - method: GET
    path: /api/profiles
    resource: profile
    operation: list
    pagination:
      # Klaviyo's own description names both, and neither is a bare word:
      # page[size] and page[cursor], square brackets included, which is
      # JSON:API's spelling. page[size] is "Default: 20. Min: 1. Max: 100."
      # The runtime was reading limit and cursor, and a parameter with
      # brackets in it is not one anybody arrives at by guessing.
      style: cursor
      limit: 20
      max_limit: 100
      limit_param: "page[size]"
      cursor_param: "page[cursor]"

  - method: POST
    path: /api/profiles
    resource: profile
    operation: create
    status: 201

  - method: GET
    path: /api/profiles/{id}
    resource: profile
    operation: get

  - method: PATCH
    path: /api/profiles/{id}
    resource: profile
    operation: update

  - method: GET
    path: /api/lists
    resource: list
    operation: list
    pagination:
      # Klaviyo's own description names both, and neither is a bare word:
      # page[size] and page[cursor], square brackets included, which is
      # JSON:API's spelling. page[size] is "Default: 20. Min: 1. Max: 100."
      # The runtime was reading limit and cursor, and a parameter with
      # brackets in it is not one anybody arrives at by guessing.
      style: cursor
      limit: 20
      max_limit: 100
      limit_param: "page[size]"
      cursor_param: "page[cursor]"

  - method: GET
    path: /api/lists/{id}
    resource: list
    operation: get

  - method: GET
    path: /api/campaigns
    resource: campaign
    operation: list
    pagination:
      # Klaviyo's own description names both, and neither is a bare word:
      # page[size] and page[cursor], square brackets included, which is
      # JSON:API's spelling. page[size] is "Default: 20. Min: 1. Max: 100."
      # The runtime was reading limit and cursor, and a parameter with
      # brackets in it is not one anybody arrives at by guessing.
      style: cursor
      limit: 20
      max_limit: 100
      limit_param: "page[size]"
      cursor_param: "page[cursor]"

  - method: GET
    path: /api/campaigns/{id}
    resource: campaign
    operation: get

webhooks:
  events:
    - profile.created
    - profile.updated
    - subscription.created
    - subscription.deleted
    - campaign.sent
  signing:
    scheme: hmac-sha256
    header: Klaviyo-Signature
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    code: throttled
    type: Rate limit exceeded
    message: Request was throttled. Expected available in 1 second.
    headers:
      Retry-After: "1"

  # Confirmed live 2026-09-05 against a.klaviyo.com, no account and no key.
  # This file used to declare one authentication_error, with the sentence
  # "The API key is missing or invalid." for every failure -- the real
  # sentence for a missing credential does not say that, and a bad one gets
  # a different sentence again, below.
  not_authenticated_error:
    status: 401
    code: not_authenticated
    type: Authentication credentials were not provided.
    message: Authentication credentials were not provided.

  # A wrong prefix (Bearer, sent from habit) and the right prefix with a key
  # nobody issued both answer this, identically. Confirmed live 2026-09-05.
  authentication_failed:
    status: 401
    code: authentication_failed
    type: Incorrect authentication credentials.
    message: Incorrect authentication credentials.

  resource_missing:
    status: 404
    code: not_found
    type: Not found
    message: "The resource could not be found: {detail}"

  parameter_missing:
    status: 400
    code: invalid
    type: Invalid input
    message: "{detail} is a required field."

  missing_revision:
    status: 400
    code: invalid
    type: Invalid input
    message: The revision header is required and must be a supported date.

  # Klaviyo refuses a duplicate email on create, which is what breaks a
  # retried import halfway through a batch.
  duplicate_profile:
    status: 409
    code: duplicate_profile
    type: Conflict
    message: A profile already exists with that email address.

  # A key scoped to read cannot write, and the failure names neither the
  # scope nor the key, which is worth reproducing exactly.
  insufficient_scope:
    status: 403
    code: permission_denied
    type: Permission denied
    message: You do not have permission to perform this action.

fixtures:
  empty: {}

  small-account:
    list:
      - id: aBc123
        name: Newsletter
        opt_in_process: double
    profile:
      - id: "01HCAULDRON00000000000001"
        email: ada@example.com
        first_name: Ada
        last_name: Lovelace
        external_id: cust-1001
      - id: "01HCAULDRON00000000000002"
        email: grace@example.com
        first_name: Grace
    campaign:
      - id: "01HCAULDRON00000000000010"
        name: January announcements
        status: Sent
        channel: email
      - id: "01HCAULDRON00000000000011"
        name: Never finished
        # A draft has sent nothing. Reporting on every campaign without
        # checking this reports zeroes as failures.
        status: Draft

# Conformance cases, read from Klaviyo's API reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: a request without the revision header is refused
    source: https://developers.klaviyo.com/en/reference/api_overview
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
    expect:
      # Klaviyo pins behaviour to the revision and does not default to
      # latest, so this is the first wall a new integration hits.
      status: 400
      body:
        errors[0].code: invalid
        errors[0].status: 400

  - name: an object is type, id and attributes
    source: https://developers.klaviyo.com/en/reference/get_profile
    fixture: small-account
    request:
      method: GET
      path: /api/profiles/01HCAULDRON00000000000001
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 200
      body:
        data:
          type: profile
          id: "01HCAULDRON00000000000001"
          attributes:
            email: ada@example.com
            first_name: Ada
      # The data a client wants is one level down. Reading data.email finds
      # nothing, and so does reading profile.email.
      absent:
        - data.email
        - email

  - name: the credential scheme is Klaviyo-API-Key, not Bearer
    # This asserted code not_authenticated and a detail matching "missing or
    # invalid" and passed, because the Recipe invented both. Confirmed live
    # 2026-09-05: sending Bearer gets the same code and sentence as a
    # well-formed key nobody issued, both below, and neither is this.
    source: https://a.klaviyo.com/api/profiles
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      headers:
        Authorization: Bearer pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 401
      body:
        errors[0].code: authentication_failed
        errors[0].detail: Incorrect authentication credentials.

  - name: a key nobody issued, sent with the right prefix, fails the same way
    source: https://a.klaviyo.com/api/profiles
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      headers:
        Authorization: Klaviyo-API-Key pk_junk12345
        revision: "2024-10-15"
    expect:
      status: 401
      body:
        errors[0].code: authentication_failed
        errors[0].detail: Incorrect authentication credentials.

  - name: no credential at all is a different failure from a wrong one
    source: https://a.klaviyo.com/api/profiles
    verified: "2026-09-05"
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      headers:
        revision: "2024-10-15"
    expect:
      status: 401
      body:
        errors[0].code: not_authenticated
        errors[0].detail: Authentication credentials were not provided.

  - name: a collection is an array of typed objects under data
    source: https://developers.klaviyo.com/en/reference/get_profiles
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 200
      body:
        data[0].type: profile
        data[0].attributes.email: ada@example.com
        data[1].attributes.first_name: Grace
      absent:
        - items
        - results
        - data[0].email

  - name: failures are an array with status and code in each entry
    source: https://developers.klaviyo.com/en/reference/api_overview
    fixture: small-account
    request:
      method: GET
      path: /api/profiles/doesnotexist
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 404
      body:
        errors[0].status: 404
        errors[0].code: not_found
        errors[0].title: Not found
      matches:
        errors[0].detail: 'could not be found'
      absent:
        - error
        - message

  - name: a double opt-in list reaches nobody until they confirm
    source: https://developers.klaviyo.com/en/reference/get_list
    fixture: small-account
    request:
      method: GET
      path: /api/lists/aBc123
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 200
      body:
        data:
          type: list
          attributes:
            # Counting every member as reachable overstates the audience by
            # everyone who never confirmed.
            opt_in_process: double
            name: Newsletter

  - name: a draft campaign has sent nothing
    source: https://developers.klaviyo.com/en/reference/get_campaigns
    fixture: small-account
    request:
      method: GET
      path: /api/campaigns
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: "2024-10-15"
    expect:
      status: 200
      body:
        data[0].attributes.status: Sent
        # Reporting on every campaign in the list reports this one's zeroes
        # as a failed send.
        data[1].attributes.status: Draft
        data[1].type: campaign

  - name: the paging fields are named links.next
    source: https://developers.klaviyo.com/en/reference/api_overview
    fixture: small-account
    request:
      method: GET
      path: /api/profiles
      query:
        # page[size], not limit. This case sent limit -- a parameter Klaviyo
        # does not have -- against a Recipe that was reading limit too, so the
        # two agreed and a page of one came back looking asked for. Klaviyo's
        # own description names page[size], brackets included.
        "page[size]": "1"
      headers:
        Authorization: Klaviyo-API-Key pk_cauldron
        revision: 2024-10-15
    expect:
      status: 200
      # A name a Recipe chooses is only a claim if something asserts it
      # where the value exists. Asserting its absence on a last page holds
      # whatever the field happens to be called, so this is what pins the
      # name down.
      matches:
        # A URL, not an opaque token: code that calls fetch on this
        # needs it to be one, and a dot matched a token just as happily.
        links.next: '^https?://'
