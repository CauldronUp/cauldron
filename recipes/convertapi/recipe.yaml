# ConvertAPI Recipe for Cauldron
#
# The account endpoint, read from the documentation at
# convertapi.com/docs/user-information, and struck live on 2026-09-14 with no
# credential, with a wrong bearer token, with the secret as a query parameter,
# on a path that does not exist, with a method the path does not take, on a
# conversion path, and on the root.
#
# **The root tells an anonymous caller their own IP address and the build
# number.** Struck live:
#
#   GET /
#   200  text/plain
#   Welcome <the caller's public IP> to ConvertAPI 1.2.67.108
#
# No credential, no path, no parameters: a greeting carrying the address the
# request came from and a four-part internal version. It is the only 200 this
# API gives away.
#
# **The error code is the HTTP status with a digit on the end.** `4011`. So a
# client storing the vendor code and a client storing the status are storing
# the same number, one of them with an extra digit, and `4011` sorts nowhere
# near the 401 it means.
#
# **The message admits it cannot tell the two cases apart.** "Unauthorized.
# Invalid or missing API credentials." -- *invalid or missing*, in the sentence
# itself. Struck live, the same body answers no credential, a wrong bearer
# token, and a wrong secret in the query string.
#
# **The keys are PascalCase.** `{"Code":4011,"Message":"…"}` -- capitalised
# where almost every JSON API in this collection is not, and the same casing
# runs through the success: `Active`, `FullName`, `ConversionsTotal`.
#
# **And the routing failures are not JSON at all.** An unrouted path answers
# `404` with an empty body and no content type; a method the path does not take
# answers `405` the same way. So the credential failure is a typed document and
# the two failures that would say what was wrong with the request say nothing.
#
# **One endpoint needs a stronger credential than the rest of the API.** The
# documentation says `/user` requires "the Master Token" and that "regular API
# Tokens are not accepted" -- and a regular token draws the same `4011` as no
# token at all, so a caller holding a working key for every other endpoint
# cannot tell this one apart from a broken credential.
#
# **The documentation declines to say what the response contains.** "The
# response may include additional legacy fields kept for backward
# compatibility" -- so the five documented fields are a lower bound, and what
# else arrives is whatever an older plan once needed.
#
# Also pinned: `ConversionsTotal` and `ConversionsConsumed` are two counters
# with no remaining between them, so the number a caller actually wants is a
# subtraction they do themselves; and the account holder's full name and email
# ride on what is otherwise a usage endpoint.

recipe: convertapi
capability: files
version: 0.1.0

upstream:
  api: "1.2"
  docs: https://www.convertapi.com/docs/user-information

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldr0n-convertapi-fixture-master-token
  # One sentence for all three, and the sentence says so.
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized
  # The path and the verb are resolved first.
  after_routing: true

responses:
  list:
    style: bare
  error:
    style: flat
    # PascalCase, on both halves of the API.
    code_field: Code
    message_field: Message
    # 4011, not "4011".
    code_type: number

resources:
  account:
    id:
      # The record carries no identifier: it is the account the token names.
      style: opaque
      field: "-"
      carried_by: Email
    fields:
      Active:
        type: boolean
      # Personal details, on a usage endpoint.
      FullName:
        type: string
      Email:
        type: string
      # Two counters, and no remaining between them.
      ConversionsTotal:
        type: integer
      ConversionsConsumed:
        type: integer

routes:
  # The only 200 this API gives away.
  - method: GET
    path: /
    public: true
    raw:
      content_type: text/plain; charset=utf-8
      # Live, the address is the caller's own. This is RFC 5737's
      # documentation range, because a fixture must not carry anybody's.
      text: "Welcome 192.0.2.1 to ConvertAPI 1.2.67.108"

  - method: GET
    path: /user
    resource: account
    operation: list
    list:
      style: bare
      collapse_single: true
    pagination:
      style: none

errors:
  unauthorized:
    status: 401
    # The status, with a digit on the end.
    code: 4011
    # "invalid or missing", in the sentence itself.
    message: Unauthorized. Invalid or missing API credentials.

  # Not JSON, and not anything.
  unknown_route:
    status: 404
    empty: true

  method_not_allowed:
    status: 405
    empty: true

fixtures:
  empty:
    account:
      - Active: false
        FullName: ""
        Email: ""
        ConversionsTotal: 0
        ConversionsConsumed: 0

  account:
    account:
      - Active: true
        FullName: Name Surname
        Email: user@example.com
        ConversionsTotal: 5000
        ConversionsConsumed: 1642

conformance:
  - name: the code is the status with a digit on the end
    source: https://v2.convertapi.com/user
    verified: "2026-09-14"
    fixture: account
    request:
      method: GET
      path: /user
      headers: {}
    expect:
      status: 401
      body:
        # 4011, for a 401.
        Code: 4011
        # And the sentence says it cannot tell the two cases apart.
        Message: Unauthorized. Invalid or missing API credentials.

  - name: and a wrong bearer token is the same body
    source: https://v2.convertapi.com/user
    verified: "2026-09-14"
    fixture: account
    request:
      method: GET
      path: /user
      headers:
        Authorization: "Bearer notarealsecret"
    expect:
      status: 401
      body:
        Code: 4011
        Message: Unauthorized. Invalid or missing API credentials.

  - name: an unrouted path answers nothing at all
    source: https://v2.convertapi.com/cauldron-nope
    verified: "2026-09-14"
    fixture: account
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      # No JSON, no content type, no body.
      no_body: true
      absent_headers:
        - Content-Type

  - name: and a wrong method answers nothing either
    source: https://v2.convertapi.com/user
    verified: "2026-09-14"
    fixture: account
    request:
      method: PUT
      path: /user
      headers: {}
    expect:
      status: 405
      no_body: true
      absent_headers:
        - Content-Type

  - name: the root greets an anonymous caller by their own address
    source: https://v2.convertapi.com/
    verified: "2026-09-14"
    fixture: account
    request:
      method: GET
      path: /
      headers: {}
    expect:
      status: 200
      headers:
        Content-Type: text/plain; charset=utf-8
      # A greeting, an IP address and a four-part build number.
      body_matches: '\AWelcome \S+ to ConvertAPI [0-9.]+\z'

  - name: the keys are pascal case on the success too
    source: https://www.convertapi.com/docs/user-information
    fixture: account
    request:
      method: GET
      path: /user
      headers:
        Authorization: "Bearer cauldr0n-convertapi-fixture-master-token"
    expect:
      status: 200
      body:
        Active: true
        # Personal details, on a usage endpoint.
        FullName: Name Surname
        Email: user@example.com

  - name: two counters and no remaining between them
    source: https://www.convertapi.com/docs/user-information
    fixture: account
    request:
      method: GET
      path: /user
      headers:
        Authorization: "Bearer cauldr0n-convertapi-fixture-master-token"
    expect:
      status: 200
      body:
        # The number a caller wants is 3358, and they do the subtraction.
        ConversionsTotal: 5000
        ConversionsConsumed: 1642
      absent:
        - ConversionsRemaining
        - ConversionsLeft

  - name: an inactive account keeps every field
    source: https://www.convertapi.com/docs/user-information
    fixture: empty
    request:
      method: GET
      path: /user
      headers:
        Authorization: "Bearer cauldr0n-convertapi-fixture-master-token"
    expect:
      status: 200
      body:
        Active: false
        ConversionsTotal: 0
        ConversionsConsumed: 0
