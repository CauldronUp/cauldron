# Square Recipe for Cauldron
#
# Square has a sandbox, and it is a shared one: a single set of test
# credentials per developer account, with state that persists between runs and
# between people. Two engineers testing refunds at the same time interfere with
# each other, and the failures worth rehearsing (a declined card, a payment
# that is authorised but never captured, an idempotency collision) need
# specific magic values that are easy to get wrong.
#
# Three things this Recipe insists on:
#
#   1. Money is an object, not a number. A payment carries
#      amount_money.amount in minor units and amount_money.currency beside it.
#      Code that reads payment.amount finds nothing, and code that treats the
#      minor units as pounds is out by a hundred.
#   2. The Square-Version header is required. Square pins behaviour to it, and
#      omitting it is a 400 rather than a sensible default.
#   3. Failures carry a category as well as a code, and clients switch on the
#      category first because it decides whether a retry could ever work.
#
# Struck live against connect.squareup.com on 2026-09-05, unauthenticated.
# The credential shape this file already claimed turned out right: absent
# and a garbage bearer token answer byte-identical 401 AUTHENTICATION_ERROR/
# UNAUTHORIZED, checked before Square-Version is ever asked for -- a
# genuine credential this file has (EAAAcauldron) cannot be told apart from a
# real one without an account, so the version-header ordering behind a valid
# key stays a documentation-only claim, but "which one wins with no key at
# all" needed no account and is now verified. What was not modelled: a path
# nothing declares and a method a real path does not support both answer the
# same 404 INVALID_REQUEST_ERROR/NOT_FOUND "Resource not found." -- no 405
# anywhere in this API -- with no credential sent on either request, so
# routing is resolved before the credential is judged. after_routing: true
# now says so.
#
# Tokens below are fixtures, not secrets.

recipe: square
capability: payments
version: 0.1.0

upstream:
  api: "2026-01-22"
  docs: https://developer.squareup.com/reference/square
  # Published in the provider's own organisation on GitHub, and it
  # declares all three listings this Recipe models. It is where the
  # paging parameter names below were read from.
  spec: https://raw.githubusercontent.com/square/connect-api-specification/master/api.json
  spec_hash: 533a111b734aedf703fc8e82baa295460689cd851cf6f7090e660e0aea7766fa
  spec_seen: "2026-09-05"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - EAAAcauldron
  # Verified live 2026-09-05: a path nothing declares and a wrong method on
  # a real path both 404 with no credential sent at all. Routing wins.
  after_routing: true

# Square pins behaviour to the version and refuses a request without it.
required_headers:
  Square-Version: parameter_missing

responses:
  list:
    style: wrapped
    cursor_field: cursor
  resource:
    style: wrapped
  error:
    style: list
    key: errors
    type_field: category
    code_field: code
    message_field: detail

resources:
  payment:
    collection: payments
    id:
      style: opaque
      length: 22
    fields:
      # Minor units. A payment of ten pounds is 1000, and treating it as
      # pounds is the classic hundredfold bug.
      amount:
        type: integer
        required: true
        in: amount_money
      currency:
        type: string
        default: GBP
        in: amount_money
      # Square's real lifecycle. An APPROVED payment has taken no money yet,
      # which is the state most integrations forget to complete.
      status:
        type: string
        default: APPROVED
      source_type:
        type: string
        default: CARD
      order_id:
        type: string
      customer_id:
        type: string
      receipt_number:
        type: string
      note:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime

  refund:
    collection: refunds
    id:
      style: opaque
      length: 22
    fields:
      amount:
        type: integer
        required: true
        in: amount_money
      currency:
        type: string
        default: GBP
        in: amount_money
      payment_id:
        type: string
        required: true
      status:
        type: string
        default: PENDING
      reason:
        type: string
      created_at:
        type: datetime

  customer:
    collection: customers
    id:
      style: opaque
      length: 22
    fields:
      given_name:
        type: string
      family_name:
        type: string
      email_address:
        type: string
      phone_number:
        type: string
      reference_id:
        type: string
      created_at:
        type: datetime
      updated_at:
        type: datetime

routes:
  - method: GET
    path: /v2/payments
    resource: payment
    operation: list
    pagination:
      # Square's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right and had
      # not been checked, which is a different thing. limit's description
      # carries the numbers: "The default value of 100 is also the maximum
      # allowed value."
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: cursor

  - method: POST
    path: /v2/payments
    resource: payment
    operation: create

  - method: GET
    path: /v2/payments/{id}
    resource: payment
    operation: get

  - method: GET
    path: /v2/refunds
    resource: refund
    operation: list
    pagination:
      # Square's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right and had
      # not been checked, which is a different thing. limit's description
      # carries the numbers: "The default value of 100 is also the maximum
      # allowed value."
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: cursor

  - method: POST
    path: /v2/refunds
    resource: refund
    operation: create

  - method: GET
    path: /v2/refunds/{id}
    resource: refund
    operation: get

  - method: GET
    path: /v2/customers
    resource: customer
    operation: list
    pagination:
      # Square's own description names both, and they are the two words the
      # runtime supplies -- limit and cursor -- so this was right and had
      # not been checked, which is a different thing. limit's description
      # carries the numbers: "The default value of 100 is also the maximum
      # allowed value."
      style: cursor
      limit: 100
      max_limit: 100
      limit_param: limit
      cursor_param: cursor

  - method: POST
    path: /v2/customers
    resource: customer
    operation: create

  - method: GET
    path: /v2/customers/{id}
    resource: customer
    operation: get

  - method: PUT
    path: /v2/customers/{id}
    resource: customer
    operation: update

  # 200, not 204. Square answers a delete with an empty JSON object and its
  # own description declares only a 200 here, so code branching on 204 --
  # or on a body being absent -- takes the wrong path against the real API.
  - method: DELETE
    path: /v2/customers/{id}
    resource: customer
    operation: delete
    status: 200

webhooks:
  events:
    - payment.created
    - payment.updated
    - refund.created
    - refund.updated
    - customer.created
    - order.created
    - dispute.created
  # Square nests the record under its own type, twice. A payment arrives at
  # data.object.payment and a customer at data.object.customer, so the key is
  # not fixed and a Recipe-wide envelope could not describe it until a
  # template key could vary.
  #
  # data.type carries the same word again as a value, and data.id is the
  # record's identifier rather than the delivery's -- three places to read the
  # same two facts, and an application that guesses wrong gets undefined
  # rather than an error.
  payload:
    merchant_id: MLCAULDRON000001
    type: "{event}"
    event_id: "{id}"
    created_at: "{created_iso}"
    data:
      type: "{resource}"
      id: "{record_id}"
      object:
        "{resource}":
          "{object}": true
  signing:
    scheme: hmac-sha256
    header: x-square-hmacsha256-signature
    # No format is declared, and that is deliberate rather than unfinished.
    #
    # Square's value is base64, which this could send, but the digest is
    # taken over the subscriber's notification URL followed by the body --
    # and a delivery here does not know the URL it is going to. Declaring
    # base64 would produce a value of exactly the right shape over the wrong
    # string, which is the one kind of signature bug a conformance case
    # cannot see: every digest of that length looks alike.
    #
    # So it keeps the default, which is at least wrong in a way that is
    # obvious on inspection.
    secret: cauldron-signature-key

errors:
  rate_limit:
    status: 429
    code: RATE_LIMITED
    type: RATE_LIMIT_ERROR
    message: The request was rate limited.
    headers:
      Retry-After: "1"

  authentication_error:
    status: 401
    code: UNAUTHORIZED
    type: AUTHENTICATION_ERROR
    message: This request could not be authorized.

  # Verified live 2026-09-05: not a 405. There is no method-not-allowed
  # sentence anywhere in this API -- a path Square has and a method it does
  # not support answers the identical body an unrouted path does.
  unknown_route: &square_not_found
    status: 404
    code: NOT_FOUND
    type: INVALID_REQUEST_ERROR
    message: Resource not found.

  method_not_allowed: *square_not_found

  resource_missing:
    status: 404
    code: NOT_FOUND
    type: INVALID_REQUEST_ERROR
    message: "Could not find the resource: {detail}"

  parameter_missing:
    status: 400
    code: MISSING_REQUIRED_PARAMETER
    type: INVALID_REQUEST_ERROR
    message: "Missing required parameter: {detail}"

  # The failures a payments integration has to handle and a shared sandbox
  # makes awkward to produce on demand.
  card_declined:
    status: 402
    code: CARD_DECLINED
    type: PAYMENT_METHOD_ERROR
    message: Card declined.

  cvv_failure:
    status: 402
    code: CVV_FAILURE
    type: PAYMENT_METHOD_ERROR
    message: Card declined due to invalid CVV.

  insufficient_funds:
    status: 402
    code: INSUFFICIENT_FUNDS
    type: PAYMENT_METHOD_ERROR
    message: Insufficient funds for the requested amount.

  # Square rejects a repeated idempotency key whose body differs, which is the
  # bug a retry loop introduces and nobody sees until production.
  idempotency_key_reused:
    status: 409
    code: IDEMPOTENCY_KEY_REUSED
    type: INVALID_REQUEST_ERROR
    message: The idempotency key was reused with a different request body.

fixtures:
  empty: {}

  small-merchant:
    payment:
      - id: pay000000000000000001
        amount: 2500
        currency: GBP
        status: COMPLETED
        source_type: CARD
        receipt_number: "0001"
        customer_id: cus000000000000000001
      - id: pay000000000000000002
        amount: 1099
        currency: GBP
        # Authorised but not captured. No money has moved, and an integration
        # that treats this as paid ships goods for free.
        status: APPROVED
        source_type: CARD
      - id: pay000000000000000003
        amount: 450
        currency: GBP
        status: FAILED
        source_type: CARD
    refund:
      - id: ref000000000000000001
        payment_id: pay000000000000000001
        amount: 500
        currency: GBP
        status: COMPLETED
        reason: Returned one item
    customer:
      - id: cus000000000000000001
        given_name: Ada
        family_name: Lovelace
        email_address: ada@example.com
        reference_id: cust-1001

# Conformance cases, read from Square's API reference rather than observed
# against a live sandbox. The verify report says so.
conformance:
  - name: deleting a customer answers 200 with a body, not 204 with none
    # Square declares one response on this operation and it is a 200 whose
    # body is an object. Code that branches on 204, or that treats "no
    # content" as the success signal and skips parsing, takes the wrong path
    # against the real API. The Recipe answered 204 and nothing here noticed,
    # because nothing here deleted a customer.
    source: https://developer.squareup.com/reference/square/customers-api/delete-customer
    fixture: small-merchant
    request:
      method: DELETE
      path: /v2/customers/cus000000000000000001
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 200
      # An empty object rather than an errors array. Square puts errors in
      # the body on failure, so their absence is the success signal here.
      absent:
        - errors

  - name: a request without Square-Version is refused
    source: https://developer.squareup.com/docs/build-basics/common-api-patterns/versioning-overview
    fixture: small-merchant
    request:
      method: GET
      path: /v2/payments
      headers:
        Authorization: Bearer EAAAcauldron
    expect:
      status: 400
      body:
        errors[0].category: INVALID_REQUEST_ERROR
        errors[0].code: MISSING_REQUIRED_PARAMETER

  - name: money is an object in minor units, not a number
    source: https://developer.squareup.com/reference/square/objects/Money
    fixture: small-merchant
    request:
      method: GET
      path: /v2/payments/pay000000000000000001
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 200
      body:
        payment:
          amount_money:
            amount: 2500
            currency: GBP
          status: COMPLETED
      # Code reading payment.amount finds nothing, and code treating 2500 as
      # pounds is out by a hundred.
      absent:
        - payment.amount
        - payment.currency

  - name: an approved payment has taken no money yet
    source: https://developer.squareup.com/docs/payments-api/take-payments
    fixture: small-merchant
    request:
      method: GET
      path: /v2/payments/pay000000000000000002
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 200
      body:
        payment:
          status: APPROVED
          amount_money:
            amount: 1099

  - name: a collection is wrapped under its plural name with a cursor
    source: https://developer.squareup.com/reference/square/payments-api/list-payments
    fixture: small-merchant
    request:
      method: GET
      path: /v2/payments
      query:
        limit: "2"
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 200
      body:
        payments[0].id: pay000000000000000001
        payments[1].status: APPROVED
      matches:
        cursor: '^pay[0-9]+$'
      absent:
        - payments[2]
        - data

  - name: a failure carries a category as well as a code
    source: https://developer.squareup.com/reference/square/objects/Error
    fixture: small-merchant
    request:
      method: GET
      path: /v2/payments/doesnotexist
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 404
      body:
        errors[0].category: INVALID_REQUEST_ERROR
        errors[0].code: NOT_FOUND
      matches:
        errors[0].detail: 'Could not find'
      # Nothing nested under error, and no bare message.
      absent:
        - error
        - message

  - name: no token at all is refused with the same array shape a garbage one gets
    # Named "a bad token" and sent none at all -- struck live, both answer
    # byte-identical, so the assertion happened to hold, but the name and
    # the request disagreed about what was being checked. Fixed here rather
    # than left to look like it tested something it did not.
    source: https://connect.squareup.com/v2/payments
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/payments
      headers:
        Square-Version: "2026-01-22"
    expect:
      status: 401
      body:
        errors[0].category: AUTHENTICATION_ERROR
        errors[0].code: UNAUTHORIZED
        errors[0].detail: This request could not be authorized.

  - name: a garbage bearer token answers identically to no token at all
    source: https://connect.squareup.com/v2/payments
    verified: "2026-09-05"
    request:
      method: GET
      path: /v2/payments
      headers:
        Square-Version: "2026-01-22"
        Authorization: Bearer EAAAgarbage000invalid
    expect:
      status: 401
      body:
        errors[0].category: AUTHENTICATION_ERROR
        errors[0].code: UNAUTHORIZED

  - name: a path nothing declares and a wrong method both 404 the same way -- there is no 405
    source: https://connect.squareup.com/v2/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No credential sent. Routing answers before the credential would.
      path: /v2/not-a-real-endpoint
    expect:
      status: 404
      body:
        errors[0].category: INVALID_REQUEST_ERROR
        errors[0].code: NOT_FOUND
        errors[0].detail: Resource not found.

  - name: and neither does a disallowed method on a real path
    source: https://connect.squareup.com/v2/payments
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /v2/payments
    expect:
      status: 404
      body:
        errors[0].category: INVALID_REQUEST_ERROR
        errors[0].code: NOT_FOUND
        errors[0].detail: Resource not found.

  - name: creating a payment sends money nested and gets it back nested
    source: https://developer.squareup.com/reference/square/payments-api/create-payment
    fixture: empty
    request:
      method: POST
      path: /v2/payments
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
      json:
        amount_money:
          amount: 4999
          currency: GBP
        note: Conformance case
    expect:
      status: 200
      body:
        payment:
          amount_money:
            amount: 4999
            currency: GBP
          status: APPROVED
          source_type: CARD
      matches:
        payment.id: '^[A-Za-z0-9]{22}$'

  - name: a webhook carries the same shape the response does
    source: https://developer.squareup.com/docs/webhooks/step1build
    fixture: small-merchant
    request:
      method: POST
      path: /v2/payments
      json:
        amount: 2500
        currency: USD
        source_id: "cnon:card-nonce-ok"
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
    expect:
      status: 200
      webhook:
        event: payment.created
        # The header a handler reads before it can verify anything. Square's
        # is lower-case and hyphenated with the algorithm in the middle, which
        # is not a shape anybody guesses, and until this could be asserted the
        # name was declared and checked by nothing -- in seventy-four Recipes.
        signature_header: x-square-hmacsha256-signature
        body:
          # Nested exactly as the response nests it. A payload carrying the
          # emulator's own field names would let a handler read
          # data.object.amount, pass every local test, and find nothing at all
          # against Square.
          #
          # The path gained a segment when the envelope stopped being the
          # default one: Square puts the record under its own type name, so
          # this is data.object.payment and was data.object for as long as
          # this Recipe sent Stripe's shape under Square's name.
          data.object.payment.amount_money.amount: 2500
          data.object.payment.amount_money.currency: USD
        absent:
          - data.object.payment.amount
          - data.object.payment.currency

  - name: the record is nested under its own type name
    source: https://developer.squareup.com/docs/webhooks/step2prepare
    fixture: small-merchant
    request:
      method: POST
      path: /v2/payments
      headers:
        Authorization: Bearer EAAAcauldron
        Square-Version: "2026-01-22"
      json:
        amount_money:
          amount: 2500
          currency: GBP
    expect:
      status: 200
      webhook:
        event: payment.created
        body:
          # The word appears here as a value...
          data.type: payment
          # ...and again here as a key, which is where the payment is. The
          # case above pins the amount at that path; what this one is for is
          # that the key is the resource's name at all.
          type: payment.created
        matches:
          data.object.payment.id: '^[A-Za-z0-9]+$'
        absent:
          # Not where the default puts it, and not one level up either.
          - data.object.id
          - data.object.amount_money


  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=pay000000000000000001, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads"
    source: "https://developer.squareup.com/reference/square/payments-api/list-payments"
    fixture: small-merchant
    request:
      method: GET
      path: "/v2/payments"
      query:
        "limit": "1"
        "cursor": "pay000000000000000001"
      headers:
        "Authorization": "Bearer EAAAcauldron"
        "Square-Version": "2026-01-22"
    expect:
      status: 200
      body:
        "payments[0].id": "pay000000000000000002"
      absent:
        - "payments[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "cursor" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # limit=1 and cursor=pay000000000000000001, which is the identifier of
  # the last record on the previous page, and asserts the second record
  # came back on its own: one to skip, one to return, and a third behind
  # it to prove the size stopped the page.
  - name: "limit and cursor are the two names this listing reads on v2 payments"
    source: "https://developer.squareup.com/reference/square/payments-api/list-payments"
    fixture: small-merchant
    request:
      method: GET
      path: "/v2/payments"
      query:
        "limit": "1"
        "cursor": "pay000000000000000001"
      headers:
        "Authorization": "Bearer EAAAcauldron"
        "Square-Version": "2026-01-22"
    expect:
      status: 200
      body:
        "payments[0].id": "pay000000000000000002"
      absent:
        - "payments[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the refund listing answers with what the fixture holds"
    source: "https://developer.squareup.com/reference/square/customers-api/delete-customer"
    fixture: small-merchant
    request:
      method: GET
      path: "/v2/refunds"
      headers:
        "Authorization": "Bearer EAAAcauldron"
        "Square-Version": "2026-01-22"
    expect:
      status: 200
      body:
        "refunds[0].id": "ref000000000000000001"
      absent:
        - "refunds[1]"

  # Nothing in this file showed what this listing answers. Every case
  # touching the route was checking a failure -- a missing credential, a
  # wrong method, an unknown path -- so the collection, the envelope and
  # the page size beside them were a description with no evidence under
  # it. This asks for the listing with the credential the rest of the
  # file uses, and asserts what the fixture holds and that there is no
  # more of it than that.
  - name: "the customer listing answers with what the fixture holds"
    source: "https://developer.squareup.com/reference/square/customers-api/delete-customer"
    fixture: small-merchant
    request:
      method: GET
      path: "/v2/customers"
      headers:
        "Authorization": "Bearer EAAAcauldron"
        "Square-Version": "2026-01-22"
    expect:
      status: 200
      body:
        "customers[0].id": "cus000000000000000001"
      absent:
        - "customers[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not limit was read -- but cursor can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "cursor moves past the only record, and the page comes back empty"
    source: "https://developer.squareup.com/reference/square/customers-api/delete-customer"
    fixture: small-merchant
    request:
      method: GET
      path: "/v2/refunds"
      query:
        "limit": "1"
        "cursor": "ref000000000000000001"
      headers:
        "Authorization": "Bearer EAAAcauldron"
        "Square-Version": "2026-01-22"
    expect:
      status: 200
      absent:
        - "refunds[0]"

  # The position, on a listing that serves one record. The page size
  # cannot be shown here -- asking for one out of one answers the same
  # whether limit was read or not -- but cursor can be: past the only
