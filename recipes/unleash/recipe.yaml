# Unleash Recipe for Cauldron
#
# Three APIs, one field called enabled, and in none of them does it mean
# "this flag is on".
#
# Written against the OpenAPI document an Unleash instance serves at
# /docs/openapi.json -- version 8.1.0, 185 paths, 406 schemas, and the source
# of every description quoted here.
#
# Unleash exposes the same feature flag through a Frontend API, a Client API
# and an Admin API. Each has a schema, each schema has an enabled boolean, and
# the four sentences describing it are these:
#
#   frontendApiFeatureSchema.enabled
#     "Always set to `true`."
#
#   clientFeatureSchema.enabled
#     "Whether the feature flag is enabled for the current API key or not.
#      This is ANDed with the evaluation results of the strategies list, so if
#      this is false, the evaluation result will always be false"
#
#   featureSchema.enabled            (Admin)
#     "`true` if the feature is enabled, otherwise `false`."
#
#   featureEnvironmentSchema.enabled (Admin, inside the array above)
#     "`true` if the feature is enabled for the environment, otherwise
#      `false`."
#
# Read them in order. On the Frontend API the field is a constant: the
# endpoint returns only the flags that already evaluated on for the given
# context, so enabled is true for everything in the array and the real answer
# to "is this flag on" is whether the object is in the array at all. Code that
# does toggles.find(t => t.name === x).enabled is asking a question whose
# answer is always yes when it does not throw.
#
# On the Client API it is one input among several. The SDK evaluates the flag
# itself, and enabled is ANDed with the strategies -- which are, per their own
# description, "evaluated and ORed together". So the flag is on when enabled
# is true and at least one strategy passes, and nothing anywhere states that
# rule: it exists as two clauses in two field descriptions.
#
# On the Admin API it is a summary of an array whose members disagree with it.
# A flag is on in development and off in production, and featureSchema.enabled
# is one boolean sitting beside an environments list that has the real answer
# in it, once per environment.
#
# Four more the Recipe pins:
#
#   1. The two SDK APIs do not agree on what to call the collection. The
#      Frontend API answers {"toggles": [...]} and the Client API answers
#      {"features": [...]}, for the same flags from the same server. Unleash
#      renamed the concept from toggles to flags; one endpoint moved.
#   2. The response format carries its own version number, in the body. Of
#      clientFeaturesSchema.version: "Most Unleash instances now return
#      version 2, which includes segments as a separate array" -- so segments
#      used to live inside the flags and now sit beside them, and an
#      evaluation that reads strategies without joining segments applies a
#      different rule while looking complete.
#   3. A flag carries a description of itself that is nullable, and a
#      variants array that is nullable, and an impressionData that is
#      nullable -- three fields where absent, null and false are all
#      reachable and mean different things.
#   4. Two authentication schemes, one header. The document declares apiKey
#      in Authorization and bearerToken as http bearer, which is the same
#      header carrying the token raw or behind "Bearer ". A client that adds
#      the prefix and one that does not are both right.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Evaluation is not modelled and cannot be. The whole point of the Client
#     API is that the SDK computes the answer from strategies, constraints,
#     segments and a request context; this Recipe serves the configuration
#     those SDKs read and does not evaluate it. What it pins is the shape of
#     the disagreement, which is where the bugs are.
#   - Both authentications are served now. The raw token and the "Bearer "
#     form of it are the same header two ways, which is what auth.also
#     describes, and this Recipe refused the second one until that field
#     existed.
#   - The Frontend API's context parameters, impression events, metrics
#     posting, segments, dependencies, lifecycle, tags, archiving and the
#     project and environment management surfaces are all absent.
#
# A live instance needs no account to check the shape of a refusal, and
# app.unleash-hosted.com/demo -- already cited above for what enabled means
# on each API -- was struck for it on 2026-09-05. It found this file's
# single authentication_error wrong twice over: the Frontend and Client
# APIs answer a flat {"message": ...} with no id and no name at all, while
# the Admin API answers {id, name: "AuthenticationRequired", message,
# details}, with a different sentence than this file had claimed and a
# fresh uuid in id on every failure. Two named errors and a per-route
# auth block on the Frontend and Client routes now keep the two apart;
# the Admin API keeps the Recipe-wide default, corrected.
#
# The token and flags below are fixtures and belong to no instance.

recipe: unleash
capability: flags
version: 0.1.0

upstream:
  api: v8
  docs: https://docs.getunleash.io/api-overview

auth:
  # "API key needed to access this API" -- in Authorization, with no scheme
  # word in front of it.
  scheme: header
  header: Authorization
  keys:
    - "*:development.cauldronfixturetokennotarealone0000"
  # And behind "Bearer ", which Unleash's own document declares beside the
  # raw form: apiKey in Authorization and bearerToken as http bearer, the
  # same header carrying the same token two ways. A client that adds the
  # prefix and one that does not are both right.
  #
  # This Recipe used to serve one and refuse the other, with a case pinning
  # the refusal and a note calling it "the wrong half of a true statement".
  # It was true when it was written -- authentication was one setting for a
  # whole Recipe -- and auth.also exists now for exactly this: one secret,
  # several carriers. A fake stricter than its provider is the failure that
  # field was added to prevent.
  also:
    - scheme: header
      header: Authorization
      prefix: "Bearer "

responses:
  resource:
    style: bare
  error:
    # {id, name, message}, where id is "The ID of the error instance" -- a
    # fresh uuid per failure rather than a code -- and name is "The name of
    # the error kind". So the stable thing to branch on is called name and the
    # thing called id is different every time.
    style: flat
    message_field: message
    code_field: name
    type_field: "-"

resources:
  frontend_feature:
    collection: toggles
    id:
      style: opaque
      field: name
    constants:
      # "Always set to `true`." Not a value: a constant, because the endpoint
      # only returns flags that already evaluated on.
      enabled: true
    fields:
      impressionData:
        type: boolean
      variant:
        type: map

  client_feature:
    collection: features
    id:
      style: opaque
      field: name
    fields:
      type:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      stale:
        type: boolean
      impressionData:
        type: boolean
      project:
        type: string
      strategies:
        type: list
      variants:
        type: list

  feature:
    collection: features
    id:
      style: opaque
      field: name
    fields:
      type:
        type: string
      description:
        type: string
      project:
        type: string
      enabled:
        type: boolean
      stale:
        type: boolean
      archived:
        type: boolean
      impressionData:
        type: boolean
      createdAt:
        type: datetime
      environments:
        type: list

routes:
  # Verified live against app.unleash-hosted.com/demo 2026-09-05: this
  # route's own auth failure is a flat {"message": ...} with no name, no id
  # and no details -- not the {id, name, message, details} shape the Admin
  # API answers with, which this Recipe's single authentication_error used
  # to serve everywhere. Given its own credential block so its own errors
  # can differ from the Admin API's below.
  - method: GET
    path: /api/frontend
    resource: frontend_feature
    operation: list
    pagination:
      # Unleash's client endpoint takes tag, namePrefix,
      # inlineSegmentConstraints and two deprecated filters, and no size or
      # position of any kind -- read from its own reference on 2026-09-05.
      # It answers the whole feature set, which is the only thing a feature-
      # flag SDK can do with it: a client holding half the flags evaluates
      # the other half wrong, so paging this would be a bug rather than a
      # feature.
      #
      # The frontend endpoint is the same shape -- context values as query
      # parameters, the flags that evaluate to enabled, all of them.
      #
      # Silence could not say that, so the runtime paged both at ten reading
      # a "limit" Unleash does not accept. An SDK that received ten flags
      # out of forty would not error; it would quietly report the missing
      # thirty as off.
      style: none
    auth:
      scheme: header
      header: Authorization
      keys:
        - "*:development.cauldronfixturetokennotarealone0000"
      absent_error: frontend_auth_required
      rejected_error: frontend_auth_required
    list:
      # Wrapped, and the resource's collection name supplies the key: toggles
      # here, features on the Client API below.
      style: wrapped

  # Verified the same day: the Client API shares the Frontend API's flatter
  # failure shape, not the Admin API's.
  - method: GET
    path: /api/client/features
    resource: client_feature
    operation: list
    pagination:
      # Unleash's client endpoint takes tag, namePrefix,
      # inlineSegmentConstraints and two deprecated filters, and no size or
      # position of any kind -- read from its own reference on 2026-09-05.
      # It answers the whole feature set, which is the only thing a feature-
      # flag SDK can do with it: a client holding half the flags evaluates
      # the other half wrong, so paging this would be a bug rather than a
      # feature.
      #
      # The frontend endpoint is the same shape -- context values as query
      # parameters, the flags that evaluate to enabled, all of them.
      #
      # Silence could not say that, so the runtime paged both at ten reading
      # a "limit" Unleash does not accept. An SDK that received ten flags
      # out of forty would not error; it would quietly report the missing
      # thirty as off.
      style: none
    auth:
      scheme: header
      header: Authorization
      keys:
        - "*:development.cauldronfixturetokennotarealone0000"
      absent_error: frontend_auth_required
      rejected_error: frontend_auth_required
    list:
      style: wrapped
    fields:
      # The format's own version, inside the body it describes. Declared on
      # the route rather than on the list override, which does not merge
      # constants.
      version: 2

  - method: GET
    path: /api/client/features/{id}
    resource: client_feature
    operation: get
    auth:
      scheme: header
      header: Authorization
      keys:
        - "*:development.cauldronfixturetokennotarealone0000"
      absent_error: frontend_auth_required
      rejected_error: frontend_auth_required

  - method: GET
    path: /api/admin/projects/{project}/features/{id}
    resource: feature
    operation: get
    scope: [project]

errors:
  # Verified live against app.unleash-hosted.com/demo 2026-09-05, on the
  # Admin API: absent and a garbage token are byte-identical, and the
  # sentence is not what this file had claimed. id is a fresh uuid per
  # failure -- a fixture value stands in for it below, since nothing here
  # generates one -- and details repeats the same sentence in an array,
  # which is what the schema's own name for the field says to expect from
  # an object that can carry more than one.
  authentication_error:
    status: 401
    message: "You have to identify yourself in order to use Unleash."
    code: AuthenticationRequired
    fields:
      id: 00000000-0000-0000-0000-000000000000
      details:
        - message: "You have to identify yourself in order to use Unleash."

  # Verified the same day: the Frontend and Client APIs, not the Admin API.
  # Flat, no id, no name, no details -- a different shape entirely, on the
  # same host, for the same kind of failure.
  frontend_auth_required:
    status: 401
    style: flat
    message_field: message
    code_field: "-"
    message: "This endpoint requires an API token. Please add an authorization header to your request with a valid token"

  resource_missing:
    status: 404
    message: Could not find feature flag.
    code: NotFoundError

  invalid_request:
    status: 400
    message: Request validation failed.
    code: BadDataError

fixtures:
  empty: {}

  project:
    frontend_feature:
      # One flag, where the other two APIs below carry two. The missing one
      # is the point: absence is how the Frontend API says "off".
      - id: disable-comments
        impressionData: false
        variant:
          name: blue_group
          enabled: true
          payload:
            type: json
            value: '{"color": "red"}'

    client_feature:
      - id: disable-comments
        type: release
        description: null
        enabled: true
        stale: false
        impressionData: false
        project: default
        strategies:
          - name: flexibleRollout
            parameters:
              rollout: "25"
              stickiness: default
        variants: null
      - id: new.payment.flow.stripe
        type: release
        description: No variants here
        enabled: true
        stale: false
        impressionData: false
        project: default
        strategies:
          - name: flexibleRollout
            parameters:
              rollout: "0"
              stickiness: default
        variants: null

    feature:
      - id: new.payment.flow.stripe
        type: release
        description: No variants here
        project: default
        enabled: true
        stale: false
        archived: false
        impressionData: false
        createdAt: "2026-04-02T09:00:00.000Z"
        environments:
          - name: development
            enabled: true
            type: development
          - name: production
            enabled: false
            type: production
      # A flag in a second project, so that partitioning is something the
      # cases can see rather than something the file asserts about itself.
      - id: checkout.redesign
        type: experiment
        description: null
        project: payments
        enabled: true
        stale: false
        archived: false
        impressionData: false
        createdAt: "2026-04-11T13:20:00.000Z"
        environments:
          - name: development
            enabled: true
            type: development

conformance:
  - name: no credential at all on the Frontend API is a flat failure, no name or id
    source: https://app.unleash-hosted.com/demo/api/frontend
    verified: "2026-09-05"
    request:
      method: GET
      path: /api/frontend
    expect:
      status: 401
      body:
        message: "This endpoint requires an API token. Please add an authorization header to your request with a valid token"
      absent:
        - name
        - id

  - name: the Admin API's failure is a different shape on the same host
    source: https://app.unleash-hosted.com/demo/api/admin/projects/default/features/nonexistent
    verified: "2026-09-05"
    request:
      method: GET
      # No credential sent. Same host as the case above, a different API
      # surface, and a shape with an id and a name where that one has none.
      path: /api/admin/projects/default/features/nonexistent
    expect:
      status: 401
      body:
        name: AuthenticationRequired
        message: "You have to identify yourself in order to use Unleash."
      matches:
        id: '^[0-9a-f-]{36}$'

  - name: the Frontend API's enabled is a constant
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/frontend
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        # "Always set to `true`." Reading it answers a question you did not
        # ask, with a yes you cannot rely on.
        "toggles[0].name": disable-comments
        "toggles[0].enabled": true

  - name: and the answer it looks like it gives is really absence
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/frontend
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      absent:
        # new.payment.flow.stripe exists, is enabled, and is rolled out to
        # nought per cent -- so the Frontend API does not mention it. A client
        # asking toggles.find(...).enabled throws here, and the throw is the
        # answer.
        - toggles[1]

  - name: the Client API sends the same flags under another name
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/client/features
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        # toggles on one endpoint, features on the other, from one server
        # about one set of flags.
        "features[0].name": disable-comments
        "features[1].name": new.payment.flow.stripe
        # The format's own version number, carried in the body it describes.
        version: 2
      absent:
        - toggles

  - name: the Client API's enabled is one input and not the answer
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/client/features/new.payment.flow.stripe
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        # "This is ANDed with the evaluation results of the strategies list."
        # enabled is true and the only strategy rolls out to nought per cent,
        # so the flag is off for everybody and the field says true.
        enabled: true
        "strategies[0].name": flexibleRollout
        "strategies[0].parameters.rollout": "0"

  - name: the Admin API's enabled is a summary of an array that disagrees
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/admin/projects/default/features/new.payment.flow.stripe
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        # One boolean at the top, and the real answers one level down, once
        # per environment. On in development and off in production, from the
        # same object that just said true.
        enabled: true
        "environments[0].name": development
        "environments[0].enabled": true
        "environments[1].name": production
        "environments[1].enabled": false

  - name: a flag's description is null rather than missing
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/client/features/disable-comments
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        # description and variants are both declared nullable, and both
        # arrive as null rather than being left out -- so a client spreading
        # this object over defaults overwrites them with nothing.
        description: null
        variants: null

  - name: a token this instance does not know is refused
    # Used to assert the Admin API's {id, name, message} shape on this
    # Client API route. Struck live against app.unleash-hosted.com/demo
    # 2026-09-05: this route answers flat, with no name field at all.
    source: https://app.unleash-hosted.com/demo/api/client/features
    verified: "2026-09-05"
    fixture: project
    request:
      method: GET
      path: /api/client/features
      headers:
        Authorization: "*:development.nottheonethisinstanceknows00000"
    expect:
      status: 401
      body:
        message: "This endpoint requires an API token. Please add an authorization header to your request with a valid token"
      absent:
        - name
        - id

  - name: and the Bearer form of the same token is accepted too
    # Unleash's document declares bearerToken beside apiKey -- the same header
    # carrying the same token behind a scheme word -- and this case used to
    # assert a 401, pinning a refusal the provider does not make. It was an
    # honest pin of a real gap at the time. auth.also closes the gap, and a
    # case asserting the refusal would now be pinning the fake's mistake.
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/client/features
      headers:
        Authorization: "Bearer *:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      # The same body the raw-token case gets, which is the claim: the prefix
      # changes nothing but the spelling.
      body:
        "features[0].name": disable-comments

  - name: a flag is only visible under the project that owns it
    source: https://app.unleash-hosted.com/demo/docs/openapi.json
    fixture: project
    request:
      method: GET
      path: /api/admin/projects/default/features/checkout.redesign
      headers:
        Authorization: "*:development.cauldronfixturetokennotarealone0000"
    expect:
      # The flag exists. It belongs to payments, and the admin path names a
      # project, so asking the wrong one is a 404 rather than the flag.
      status: 404
      body:
        name: NotFoundError

  # The names. This Recipe declares 4 field(s) on a client_feature that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 4 name(s) that came back at the paths they came
  # back under.
  - name: "a client_feature carries the field names this Recipe declares"
    source: "https://app.unleash-hosted.com/demo/docs/openapi.json"
    fixture: project
    request:
      method: GET
      path: "/api/client/features"
      headers:
        "Authorization": "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        "features[0].impressionData": false
        "features[0].project": "default"
        "features[0].stale": false
        "features[0].type": "release"

  # The names. This Recipe declares 6 field(s) on a feature that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 6 name(s) that came back at the paths they came back
  # under.
  - name: "a feature carries the field names this Recipe declares"
    source: "https://app.unleash-hosted.com/demo/docs/openapi.json"
    fixture: project
    request:
      method: GET
      path: "/api/admin/projects/default/features/new.payment.flow.stripe"
      headers:
        "Authorization": "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        "archived": false
        "createdAt": "2026-04-02T09:00:00.000Z"
        "impressionData": false
        "project": "default"
        "stale": false
        "environments[0].type": "development"

  # The names. This Recipe declares 2 field(s) on a frontend_feature
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a frontend_feature carries the field names this Recipe declares"
    source: "https://app.unleash-hosted.com/demo/docs/openapi.json"
    fixture: project
    request:
      method: GET
      path: "/api/frontend"
      headers:
        "Authorization": "*:development.cauldronfixturetokennotarealone0000"
    expect:
      status: 200
      body:
        "toggles[0].impressionData": false

