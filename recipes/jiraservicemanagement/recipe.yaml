      - id: "10023"
        issueKey: SD-5
        summary: New starter needs a mailbox
        requestTypeId: "26"
        serviceDeskId: "10"
        createdDate:
          epochMillis: 1754902800000
          friendly: Monday 09:00
          iso8601: "2026-08-11T09:00:00+0000"
          jira: "2026-08-11T09:00:00.000+0000"
        currentStatus:
          status: Done
          statusCategory: DONE
          statusDate:
            epochMillis: 1754910000000
            friendly: Monday 11:00
            iso8601: "2026-08-11T11:00:00+0000"
            jira: "2026-08-11T11:00:00.000+0000"
        reporter:
          accountId: 5b10a2844c20165700ede21h
          displayName: Grace Hopper
          emailAddress: grace@example.com
        sla:
          - id: "10030"
            name: Time to first response
            slaDisplayFormat: DURATION
            completedCycles:
              - startTime:
                  epochMillis: 1754902800000
                  friendly: Monday 09:00
                  iso8601: "2026-08-11T09:00:00+0000"
                  jira: "2026-08-11T09:00:00.000+0000"
                stopTime:
                  epochMillis: 1754910000000
                  friendly: Monday 11:00
                  iso8601: "2026-08-11T11:00:00+0000"
                  jira: "2026-08-11T11:00:00.000+0000"
                # A breach that did not occur, timed to the minute.
                breachTime:
                  epochMillis: 1754917200000
                  friendly: Monday 13:00
                  iso8601: "2026-08-11T13:00:00+0000"
                  jira: "2026-08-11T13:00:00.000+0000"
                breached: false
                elapsedTime:
                  millis: 7200000
                  friendly: 2h
                goalDuration:
                  millis: 14400000
                  friendly: 4h
                # A leftover rather than a countdown, under the name that
                # meant a countdown while the cycle was running.
                remainingTime:
                  millis: 7200000
                  friendly: 2h
      # A fourth request, on a different service desk, so that filtering by
      # one and paging past two are both things a case can show.
      - id: "10024"
        issueKey: FAC-1
        summary: Meeting room projector is dead
        requestTypeId: "31"
        serviceDeskId: "11"
        createdDate:
          epochMillis: 1755856800000
          friendly: Friday 10:00
          iso8601: "2026-08-22T10:00:00+0000"
          jira: "2026-08-22T10:00:00.000+0000"
        currentStatus:
          status: Waiting for support
          statusCategory: INDETERMINATE
