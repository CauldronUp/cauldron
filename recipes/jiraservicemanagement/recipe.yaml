          displayName: Alan Turing
          emailAddress: alan@example.com

conformance:
  - name: a request does not say whether it is breaching
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10021
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # A summary, a status, a reporter, four spellings of the created
        # date -- and nothing about the SLA, because sla is "Expandable
        # details" and nobody expanded it.
        issueId: "10021"
        issueKey: SD-3
        "currentStatus.status": Waiting for support
      absent:
        - sla

  - name: the clock says ninety minutes three days after it started
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-sla-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10021?expand=sla
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # Started Friday at five. elapsedTime is "Duration of the service",
        # and withinCalendarHours says the service is only counted nine to
        # five, so the number is an hour and a half while now minus startTime
        # is three days. The second number is the one every dashboard
        # computes and the first is the one the breach is decided on.
        "sla[0].ongoingCycle.startTime.iso8601": "2026-08-15T17:00:00+0000"
        "sla[0].ongoingCycle.elapsedTime.millis": 5400000
        "sla[0].ongoingCycle.withinCalendarHours": true
        "sla[0].ongoingCycle.breached": false

  - name: a paused clock is not stopped by anything a timestamp shows
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-sla-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10022?expand=sla
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # Waiting on the customer. The clock is not running and the only
        # sign is this boolean: every timestamp on the object still reads
        # exactly as it did while it was.
        "sla[0].ongoingCycle.paused": true
        "sla[0].ongoingCycle.elapsedTime.millis": 3600000
        "currentStatus.status": Waiting for customer

  - name: and the running clock beside it says it is not paused
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-sla-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10021?expand=sla
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # The other end of the distinction, so both are pinned: two ongoing
        # cycles, both unbreached, both with time remaining, and only one of
        # them counting.
        "sla[0].ongoingCycle.paused": false

  - name: a cycle that never breached carries the time it would have
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-sla-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10023?expand=sla
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # "would have breached in case of non-breached completed cycle". A
        # timestamp under the name breachTime, on a ticket answered two hours
        # inside its four-hour goal, describing an event that did not happen.
        "sla[0].completedCycles[0].breached": false
        "sla[0].completedCycles[0].breachTime.iso8601": "2026-08-11T13:00:00+0000"
        "sla[0].completedCycles[0].stopTime.iso8601": "2026-08-11T11:00:00+0000"
        # And remainingTime, which meant a countdown while the cycle ran and
        # means a leftover now.
        "sla[0].completedCycles[0].remainingTime.millis": 7200000
      absent:
        # paused is on the ongoing cycle and not on this one, so the record
        # that a clock was ever stopped does not survive the cycle.
        - sla[0].completedCycles[0].paused
        - sla[0].ongoingCycle

  - name: every instant arrives four times and one of them exists to disagree
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/10021
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # iso8601 and jira are both here, and jira is documented as "ISO8601
        # format but extended with milliseconds" -- a field Atlassian ships
        # because its own other API does not send what the field beside it is
        # named for.
        "createdDate.iso8601": "2026-08-15T17:00:00+0000"
        "createdDate.jira": "2026-08-15T17:00:00.000+0000"
        "createdDate.epochMillis": 1755277200000
        "createdDate.friendly": Friday 17:00

  - name: the listing counts the page and says only whether it is the last
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request?serviceDeskId=10&limit=2
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # size is "Number of items returned in the page" and there is no
        # total anywhere. Shopware's trap, and isLastPage is the only other
        # thing the envelope offers.
        size: 2
        isLastPage: false
        "values[0].issueKey": SD-3
        "values[1].issueKey": SD-4
      matches:
        # The pointer to the rest, as a whole REST API URL rather than a
        # token -- "REST API URL for the next page, if there is one" -- so a
        # client that joins it to a base builds an address that does not
        # exist.
        "_links.next": '^https?://'
      absent:
        - values[2]
        - total
        - totalCount

  - name: a request that is not there is refused with the status in the body
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/intro/#status-codes
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request/999999
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 404
      body:
        errorMessage: No request could be found with the given id.
        status: 404

  - name: a credential the site does not know is refused
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/intro/#auth
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206bm90LXRoaXMtc2l0ZXMtdG9rZW4=
    expect:
      status: 401
      body:
        status: 401

  - name: the second page starts where the first one stopped counting from nought
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request?serviceDeskId=10&start=2&limit=2
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
    expect:
      status: 200
      body:
        # "The starting index of the returned objects. Base index: 0." An
        # offset counts records rather than pages, so two records in is the
        # third of three, and the response echoes the index it served.
        start: 2
        size: 1
        isLastPage: true
        "values[0].issueKey": SD-5
      absent:
        - values[1]

  - name: filtering by service desk leaves the other desk's requests out
    source: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-get
    fixture: desk
    request:
      method: GET
      path: /rest/servicedeskapi/request?serviceDeskId=11
      headers:
        Authorization: Basic Y2F1bGRyb25AZXhhbXBsZS5jb206Y2F1bGRyb24tanNtLWZpeHR1cmUtdG9rZW4=
