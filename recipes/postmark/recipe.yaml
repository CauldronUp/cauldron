# Postmark Recipe for Cauldron
#
# Postmark is the transactional sender people reach for when deliverability
# matters, and testing against it has the same problem as any email provider:
# a send goes somewhere. Postmark's sandbox is a separate server token that
# teams forget to swap, so test runs bill against the real one.
#
# The shape worth modelling exactly is the success envelope. A successful send
# carries ErrorCode 0 and Message "OK", so a client cannot tell success from
# failure by the presence of an error field. It has to read the code. Plenty of
# integrations check for the absence of an error and get it right by accident.
#
# Checked live against api.postmarkapp.com, unauthenticated, 2026-09-05. No
# Server-Token header at all and a fictitious one answer the identical body
# -- {"ErrorCode":10,"Message":"Request does not contain a valid Server
# token."} -- so this file's assumed wording, "Your request did not submit
# the correct API token in the correct header.", was wrong even though the
# code (10) was right. Routing is also checked before the credential here:
# a wrong method on a real path (DELETE on /messages/outbound) answers a
# genuinely empty 405 -- zero bytes, no ErrorCode, no envelope at all --
# with no Server-Token sent, while the same path with a real method and no
# token still gets the 401 above. Modelled with after_routing rather than
# stated as a gap, since Cauldron's own flag for this ordering is right for
# both cases here.
#
# Tokens below are fixtures, not secrets.

recipe: postmark
capability: email
version: 0.1.0

upstream:
  api: "1.0"
  docs: https://postmarkapp.com/developer/api/overview

auth:
  scheme: header
  header: X-Postmark-Server-Token
  keys:
    - cauldron-server-token
  # Verified live, 2026-09-05: a wrong method on a real path answers 405
  # without needing a credential; a real method with no credential still
  # answers 401. See the file header.
  after_routing: true

responses:
  list:
    style: wrapped
    # No key here on purpose: every resource this Recipe lists names its
    # own collection, so a key would describe a response nothing can ask
    # for. It carried one until the rule stopped counting resources that
    # are never listed.
  # Postmark's failures are flat and PascalCase, and the code is a number.
  error:
    style: flat
    code_field: ErrorCode
    message_field: Message

resources:
  email:
    id:
      style: uuid
      field: MessageID
    # A successful send still carries an ErrorCode. It is zero, and that is the
    # only thing distinguishing it from a failure.
    constants:
      ErrorCode: 0
      Message: OK
    fields:
      To:
        type: string
        required: true
      From:
        type: string
        required: true
      Subject:
        type: string
      HtmlBody:
        type: string
      TextBody:
        type: string
      SubmittedAt:
        type: datetime

  outbound_message:
    collection: Messages
    id:
      style: uuid
      field: MessageID
    fields:
      Recipients:
        type: string
      Subject:
        type: string
      Status:
        type: string
        default: Sent
      ReceivedAt:
        type: datetime

  bounce:
    collection: Bounces
    id:
      style: numeric
    fields:
      Type:
        type: string
        default: HardBounce
      TypeCode:
        type: integer
        default: 1
      Email:
        type: string
        required: true
      Description:
        type: string
      Inactive:
        type: boolean
        default: true
      CanActivate:
        type: boolean
        default: true
      BouncedAt:
        type: datetime

routes:
  - method: POST
    path: /email
    resource: email
    operation: create

  - method: GET
    path: /messages/outbound
    resource: outbound_message
    operation: list
    pagination:
      # Checked against Postmark's own published Swagger: count, "number of
      # messages to return per request, max 500", and offset, "number of
      # messages to skip". Neither was read while this said limit.
      #
      # Stated gap: both are required there. Postmark refuses the listing
      # without them and this answers with everything, so code that forgets
      # them works here and fails in production -- the same shape of lie as
      # reading the wrong parameter name, from the other direction.
      style: offset
      limit: 50
      limit_param: count
      cursor_param: offset

  - method: GET
    path: /messages/outbound/{id}
    resource: outbound_message
    operation: get

  - method: GET
    path: /bounces
    resource: bounce
    operation: list
    pagination:
      # Checked against Postmark's own published Swagger: count, "number of
      # messages to return per request, max 500", and offset, "number of
      # messages to skip". Neither was read while this said limit.
      #
      # Stated gap: both are required there. Postmark refuses the listing
      # without them and this answers with everything, so code that forgets
      # them works here and fails in production -- the same shape of lie as
      # reading the wrong parameter name, from the other direction.
      style: offset
      limit: 50
      limit_param: count
      cursor_param: offset

  - method: GET
    path: /bounces/{id}
    resource: bounce
    operation: get

webhooks:
  events:
    - Delivery
    - Bounce
    - SpamComplaint
    - Open
    - Click
    - SubscriptionChange
  signing:
    scheme: none

errors:
  rate_limit:
    status: 429
    code: "429"
    message: Rate limit exceeded
    headers:
      Retry-After: "1"

  # Verified live, 2026-09-05: no Server-Token header at all and a
  # fictitious one both answer this exact body.
  authentication_error:
    status: 401
    code: "10"
    message: Request does not contain a valid Server token.

  # Verified live, 2026-09-05: genuinely empty, zero bytes, no envelope.
  method_not_allowed:
    status: 405
    empty: true

  resource_missing:
    status: 404
    code: "701"
    message: "The message could not be found: {detail}"

  parameter_missing:
    status: 422
    code: "300"
    message: "Invalid request: {detail} is required."

  # The failure that only appears once you are live: the recipient is on the
  # suppression list because they bounced or complained earlier.
  inactive_recipient:
    status: 422
    code: "406"
    message: You tried to send to recipient(s) that have been marked as inactive.

  # Postmark refuses to send from an unconfirmed address, which is the first
  # wall a new integration hits.
  sender_signature_not_confirmed:
    status: 422
    code: "400"
    message: You are trying to send email with a From address that has no confirmed Sender Signature.

fixtures:
  empty: {}

  small-server:
    outbound_message:
      - id: aaaaaaaa-1111-4111-8111-111111111111
        Recipients: ada@example.com
        Subject: Your receipt
        Status: Sent
      - id: bbbbbbbb-2222-4222-8222-222222222222
        Recipients: grace@example.com
        Subject: Password reset
        Status: Sent
      # A third, so that count and offset can be told apart. With two,
      # skipping one returns a single message whether or not the page size
      # was read at all, and the mutation that renames count survives.
      - id: cccccccc-3333-4333-8333-333333333333
        Recipients: ada@example.com
        Subject: Monthly summary
        Status: Sent
    bounce:
      - id: "1"
        Type: HardBounce
        TypeCode: 1
        Email: bounced@example.com
        Description: The server was unable to deliver your message
        Inactive: true

# Conformance cases. The two below were checked live against
# api.postmarkapp.com, unauthenticated, on 2026-09-05 -- see the file
# header. Everything else, which needs a real server token to reach, is
# read from Postmark's developer reference rather than observed.
conformance:
  - name: no Server-Token header at all is ErrorCode 10
    source: https://api.postmarkapp.com/messages/outbound
    verified: "2026-09-05"
    request:
      method: GET
      path: /messages/outbound
    expect:
      status: 401
      body:
        ErrorCode: 10
        Message: "Request does not contain a valid Server token."

  - name: a wrong method on a real path needs no credential and answers empty
    source: https://api.postmarkapp.com/messages/outbound
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /messages/outbound
    expect:
      status: 405
      no_body: true

  - name: a successful send carries ErrorCode zero
    source: https://postmarkapp.com/developer/api/email-api
    fixture: empty
    request:
      method: POST
      path: /email
      headers:
        X-Postmark-Server-Token: cauldron-server-token
      json:
        To: ada@example.com
        From: billing@example.com
        Subject: Your receipt
    expect:
      status: 200
      body:
        # The only thing separating success from failure. A client checking for
        # the absence of an error field cannot tell them apart.
        ErrorCode: 0
        Message: OK
        To: ada@example.com
      matches:
        MessageID: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      absent:
        - id

  - name: a failure uses the same two fields with a non-zero code
    source: https://postmarkapp.com/developer/api/overview
    fixture: empty
    request:
      method: POST
      path: /email
      headers:
        X-Postmark-Server-Token: cauldron-server-token
      json:
        From: billing@example.com
        Subject: No recipient
    expect:
      status: 422
      body:
        ErrorCode: 300
      matches:
        Message: 'To'
      # Same shape as a success, different code. Nothing nested, nothing added.
      absent:
        - error
        - errors

  - name: a bad server token is refused with Postmark's own code
    source: https://postmarkapp.com/developer/api/overview
    request:
      method: POST
      path: /email
      json:
        To: ada@example.com
        From: billing@example.com
    expect:
      status: 401
      body:
        ErrorCode: 10
      matches:
        Message: 'Server token'

  - name: outbound messages are wrapped under Messages
    source: https://postmarkapp.com/developer/api/messages-api
    fixture: small-server
    request:
      method: GET
      path: /messages/outbound
      headers:
        X-Postmark-Server-Token: cauldron-server-token
    expect:
      status: 200
      body:
        Messages[0].Subject: Your receipt
        Messages[0].Status: Sent
      absent:
        - data
        - results

  - name: the message identifier is called MessageID, not id
    source: https://postmarkapp.com/developer/api/messages-api
    fixture: small-server
    request:
      method: GET
      path: /messages/outbound/aaaaaaaa-1111-4111-8111-111111111111
      headers:
        X-Postmark-Server-Token: cauldron-server-token
    expect:
      status: 200
      body:
        MessageID: aaaaaaaa-1111-4111-8111-111111111111
        Recipients: ada@example.com
      absent:
        - id

  - name: a bounce carries the flags that decide whether to retry
    source: https://postmarkapp.com/developer/api/bounce-api
    fixture: small-server
    request:
      method: GET
      path: /bounces
      headers:
        X-Postmark-Server-Token: cauldron-server-token
    expect:
      status: 200
      body:
        Bounces[0].Type: HardBounce
        Bounces[0].Email: bounced@example.com
        Bounces[0].Inactive: true
        Bounces[0].CanActivate: true

  - name: outbound messages page by count and offset, which skips records
    # Not "limit", which Postmark does not accept. count is the page size and
    # offset is a number of records to skip, not a page number -- reading it
    # as a page would be wrong by a whole page at a time, and while no style
    # was declared it was not read at all.
    source: https://postmarkapp.com/swagger/server.yml
    fixture: small-server
    request:
      method: GET
      path: /messages/outbound
      headers:
        X-Postmark-Server-Token: cauldron-server-token
      query:
        count: "1"
        offset: "1"
    expect:
      status: 200
      body:
        # The second message, because offset counts records.
        Messages[0].Subject: Password reset
      absent:
        # Two remain after the offset and count caps the page at one, so the
        # third must not be here. Without that the page size is unchecked.
        - Messages[1]

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # count=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "count and offset are the two names this listing reads"
    source: "https://postmarkapp.com/developer/api/messages-api"
    fixture: small-server
    request:
      method: GET
      path: "/messages/outbound"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      body:
        "Messages[0].MessageID": "bbbbbbbb-2222-4222-8222-222222222222"
      absent:
        - "Messages[1]"

  # Both names were declared and sent by nothing, which means either
  # could have been renamed to the name the runtime falls back on --
  # "limit" for the size, "offset" for the position -- and every case
  # above would still have passed. Asserting the response to a listing
  # says nothing about which parameter produced it. This case sends
  # count=1 and offset=1, which is a count of records to skip, and
  # asserts the second record came back on its own: one to skip, one to
  # return, and a third behind it to prove the size stopped the page.
  - name: "count and offset are the two names this listing reads on messages outbound"
    source: "https://postmarkapp.com/developer/api/messages-api"
    fixture: small-server
    request:
      method: GET
      path: "/messages/outbound"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      body:
        "Messages[0].MessageID": "bbbbbbbb-2222-4222-8222-222222222222"
      absent:
        - "Messages[1]"

  # The position, on a fixture of one. There is no way to show the page
  # size here -- asking for one out of one answers the same whether or
  # not count was read -- but offset can be shown, and it is the half
  # nothing else in this file proves. Past the only record the
  # collection is empty, where a name the runtime ignored would have
  # answered with the record again.
  - name: "offset moves past the only record, and the page comes back empty"
    source: "https://postmarkapp.com/developer/api/bounce-api"
    fixture: small-server
    request:
      method: GET
      path: "/bounces"
      query:
        "count": "1"
        "offset": "1"
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      absent:
        - "Bounces[0]"

  # The names. This Recipe declares 3 field(s) on a bounce that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "a bounce carries the field names this Recipe declares"
    source: "https://postmarkapp.com/developer/api/bounce-api"
    fixture: small-server
    request:
      method: GET
      path: "/bounces"
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      body:
        "Bounces[0].BouncedAt": "2026-01-01T00:00:00Z"
        "Bounces[0].Description": "The server was unable to deliver your message"
        "Bounces[0].TypeCode": 1

  # The names. This Recipe declares 1 field(s) on a outbound_message
  # that no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "an outbound_message carries the field names this Recipe declares"
    source: "https://postmarkapp.com/developer/api/messages-api"
    fixture: small-server
    request:
      method: GET
      path: "/messages/outbound"
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      body:
        "Messages[0].ReceivedAt": "2026-01-01T00:00:00Z"

  # The names. This Recipe declares 4 field(s) on an email that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "an email carries the field names this Recipe declares"
    source: "https://postmarkapp.com/developer/api/email-api"
    fixture: empty
    request:
      method: POST
      path: "/email"
      json:
        To: ada@example.com
        From: billing@example.com
        Subject: Your receipt
      headers:
        "X-Postmark-Server-Token": "cauldron-server-token"
    expect:
      status: 200
      body:
        "From": "billing@example.com"
        "SubmittedAt": "2026-01-01T00:00:00Z"




