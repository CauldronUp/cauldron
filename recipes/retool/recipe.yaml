# Retool Recipe for Cauldron
#
# Retool is the odd one in this group. Airtable, Baserow and NocoDB, this
# collection's other three "spreadsheet as a database" providers, each
# answer the question of what a user-defined column's name looks like on
# the wire -- Airtable and NocoDB send it every time, Baserow only if asked.
# Retool has no answer to that question at all, because api.retool.com does
# not expose a table or a row of anything. Its own documentation
# (docs.retool.com/org-users/concepts/retool-api) says what the Retool API
# actually manages, in its own words: users, groups, permissions, apps,
# resources, folders, spaces, source control. Confirmed live rather than
# assumed: /api/v2/users, /api/v2/groups, /api/v2/folders, /api/v2/apps and
# /api/v2/permissions/grant all answer the same authenticated management
# API, and no path resembling a data table, a row or a record was found
# anywhere in Retool's own materials or reachable from this host. This
# Recipe therefore models the org-management surface Retool actually has,
# not a table API invented to fit the group -- what "actually exists and
# answers" for a user is create-user, and that is what is modelled below.
#
# Retool Database is a different product again, and worth naming precisely
# rather than folding into the API above. It is a managed Postgres instance
# with a spreadsheet-style editor inside the Retool app -- and per Retool's
# own community forum (a moderator answering directly, not a guess):
# https://community.retool.com/t/does-retool-expose-an-api-rest-js-etc-that-would-allow-read-write-of-a-postgres-table-that-a-retool-app-manages/24491
# there is no direct REST endpoint for it at all. Reading or writing a
# Retool Database table from outside Retool means building a Retool
# Workflow with a webhook trigger as a hand-built intermediary, secured by
# its own per-workflow workflowAPIKey, at a URL that does not exist until
# somebody builds that workflow. There is no fixed path, no fixed schema
# and no fixed credential to model -- the "API" is whatever the next person
# wires up, which is not a shape this format has a way to describe short of
# inventing one workflow that would not represent any other Retool
# instance's. Left out rather than invented.
#
# What IS modelled richly, and checked directly against api.retool.com with
# no account and no key ever created, is the credential mechanism -- and it
# is the sharpest three-way split checked across this whole group. Four
# requests, live, same path, same method, different headers:
#
#   (nothing sent)                        -> "Missing Authorization header."
#   Authorization: junkjunkjunk (no       -> "Authorization Header must
#     "Bearer " prefix at all)               start with Bearer."
#   Authorization: Bearer junkjunkjunk    -> "Invalid Authorization header."
#
# all wrapped identically -- {"success":false,"message":"Authentication
# failure. <sentence>"}, 401 -- and all three checked again against a path
# this host has never had a route for, and again against a real path with
# a method (PUT) nothing on it accepts, and every one of those six extra
# requests answered EXACTLY the same sentence its credential shape earns
# regardless of the path or the method. So the order here is simpler than
# any of the other three Recipes in this group needed: the credential is
# checked first, absolutely, for every path and every method, before
# routing is ever consulted -- the same shape FireHydrant's and Pipedream's
# Recipes elsewhere in this collection found for their own hosts, reached
# independently by a third provider. A caller cannot learn whether
# /api/v2/anything is a real Retool route without first presenting a
# credential that clears this gate; every probe this Recipe could run
# unauthenticated answers about the credential and never about the route.
#
# Rate limiting is documented in exact numbers Retool's own authentication
# guide states outright, and never triggered (the rule this whole project
# runs by: never retry into a limit) -- "You can use up to 300 points in a
# 60 second window. If you exceed this, Retool blocks API calls for 60
# seconds." Users, Folders and Apps requests cost 2 points each; Groups,
# Resources, Source Control, Spaces, SSO and several others cost 5;
# Permissions cost 10 -- a real, cited figure, and not one this Recipe
# turns into a 429 case, because nothing in Retool's own materials shows
# what that response's body looks like. Inventing one would be exactly the
# fabricated field value this project exists to refuse.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No response body for any successful call is modelled, for create-user
#     or anything else. Retool's own guide for automating user onboarding
#     (docs.retool.com/org-users/guides/retool-api/automate-onboarding)
#     shows the exact request this Recipe's one route accepts --
#     {"first_name", "last_name", "active", "email"} -- and shows no
#     response anywhere on that page, nor on the authentication guide, nor
#     anywhere else this project could find in Retool's public
#     documentation. Every field below is therefore in: "-": accepted on
#     the way in, and not claimed on the way out, the same device Mezmo's
#     Recipe elsewhere in this collection uses for its own ingest
#     endpoint's unspecified success body. A bare {} is served on success
#     rather than an invented user record.
#   - Groups, permissions, folders, apps, resources, workflows, spaces and
#     source control are all real, confirmed live and in Retool's own
#     documentation, and none of them are modelled as a second resource --
#     one route already carries the whole finding this Recipe exists to
#     state (there is no data-table surface here, and the one surface that
#     is real answers with the same credential gate whichever of these it
#     is), and a second copy would add fixtures rather than a finding.
#   - The SCIM 2.0 API (Enterprise-only, for identity-provider
#     provisioning) is real, documented and a genuinely separate surface
#     from the one modelled here; not reachable or checkable without an
#     Enterprise organisation, and not modelled.
#
# No upstream.spec is recorded. Retool publishes no machine-readable
# description of this API that this project could find -- docs.retool.com
# serves its reference as a rendered Docusaurus page rather than a fetchable
# OpenAPI or Postman document, and every guessed path for one (openapi.json,
# swagger.json, and the per-operation slugs the rendered sidebar implies)
# answered 404. Pointing upstream.spec at a page that is not a description
# would be a citation for the wrong claim, the same reasoning Pipedream's
# Recipe elsewhere in this collection gives for the identical omission.
#
# The token below is a fixture and belongs to no organisation.

recipe: retool
capability: infrastructure
version: 0.1.0

upstream:
  api: v2
  docs: https://docs.retool.com/org-users/concepts/retool-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-retool-fixture-token-00000000000000000000000000
  # Three live sentences, three named verdicts -- see the header. Nothing
  # here is collapsed the way NocoDB's Recipe elsewhere in this collection
  # had to leave all three unset.
  absent_error: missing_header
  malformed_error: missing_bearer_prefix
  rejected_error: invalid_header

responses:
  error:
    style: flat
    message_field: message
    code_field: "-"
    fields:
      success: false

resources:
  # See the header: no worked response example exists anywhere in Retool's
  # own public materials, for this route or any other on this surface.
  # Every field is in: "-" for that reason -- accepted, never claimed back.
  user:
    id:
      # Neither the shape nor the wire name is known -- see the header.
      style: opaque
      field: "-"
    fields:
      first_name:
        type: string
        required: true
        in: "-"
      last_name:
        type: string
        in: "-"
      email:
        type: string
        required: true
        in: "-"
      active:
        type: boolean
        in: "-"

routes:
  - method: POST
    path: /api/v2/users
    resource: user
    operation: create

errors:
  missing_header:
    status: 401
    message: Authentication failure. Missing Authorization header.

  missing_bearer_prefix:
    status: 401
    message: Authentication failure. Authorization Header must start with Bearer.

  invalid_header:
    status: 401
    message: Authentication failure. Invalid Authorization header.

fixtures:
  empty: {}

conformance:
  - name: no credential names itself as missing, not merely wrong
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/users
    expect:
      status: 401
      body:
        success: false
        message: Authentication failure. Missing Authorization header.

  - name: a header with no Bearer prefix is a third sentence, neither missing nor merely wrong
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: junkjunkjunk
    expect:
      status: 401
      body:
        success: false
        message: Authentication failure. Authorization Header must start with Bearer.

  - name: a correctly-prefixed wrong token is the third sentence again
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/users
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 401
      body:
        success: false
        message: Authentication failure. Invalid Authorization header.

  - name: the exact same three sentences answer a path this host has never had a route for
    source: https://api.retool.com/api/v2/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/this-is-not-a-real-endpoint
    expect:
      status: 401
      body:
        message: Authentication failure. Missing Authorization header.

  - name: and a wrong credential against that same invented path answers exactly what it would on a real one
    source: https://api.retool.com/api/v2/this-is-not-a-real-endpoint
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /api/v2/this-is-not-a-real-endpoint
      headers:
        Authorization: Bearer junkjunkjunk
    expect:
      status: 401
      body:
        message: Authentication failure. Invalid Authorization header.

  - name: a method nothing accepts on a real path is refused for its credential before its method is ever considered
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PUT
      path: /api/v2/users
    expect:
      status: 401
      body:
        message: Authentication failure. Missing Authorization header.

  - name: the one real write this Recipe models is gated by the identical credential check, using the exact body Retool's own guide shows
    # {"first_name":"Test","last_name":"User","active":true,"email":"testuser@retool.com"}
    # is Retool's own worked example, quoted verbatim, from
    # docs.retool.com/org-users/guides/retool-api/automate-onboarding.
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v2/users
      json:
        first_name: Test
        last_name: User
        active: true
        email: testuser@retool.com
    expect:
      status: 401
      body:
        message: Authentication failure. Missing Authorization header.

  - name: and a wrong bearer token against that same real write is the third sentence, not the first
    source: https://api.retool.com/api/v2/users
    verified: "2026-09-01"
    fixture: empty
    request:
      method: POST
      path: /api/v2/users
      headers:
        Authorization: Bearer junkjunkjunk
      json:
        first_name: Test
        last_name: User
        active: true
        email: testuser@retool.com
    expect:
      status: 401
      body:
        message: Authentication failure. Invalid Authorization header.
