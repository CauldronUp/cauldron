# UploadThing Recipe for Cauldron
#
# The file listing, read from the types in UploadThing's own SDK, and struck
# live on 2026-09-14 with no key, with a wrong key, on a version that does not
# exist, on a path that does not exist, with methods the path does not take,
# and on the root.
#
# **A missing key is a 400 and a wrong key is a 401.** Struck live:
#
#   (no header)                    400  {"error":"Missing API Key","data":400}
#   x-uploadthing-api-key: wrong   401  {"error":"Invalid API key"}
#
# Not sending a credential is a bad request; only sending the wrong one is
# unauthorized. So a client retrying on 401 and giving up on 400 has the two
# exactly backwards, and a proxy that treats 4xx uniformly will cache the wrong
# one.
#
# **And the status code is in a field called `data`.** `{"error":"Missing API
# Key","data":400}` -- `data`, which is where a successful response's payload
# belongs, holding the number that is already on the status line. The 401 omits
# the field entirely rather than sending `"data":401`, so the same envelope has
# two shapes one status apart.
#
# **The two sentences do not agree about capitals.** "Missing API **K**ey" and
# "Invalid API **k**ey", written by the same service about the same header.
#
# **Every mistake made without a key is that 400, and every mistake made with a
# wrong one is that 401.** A path that does not exist, a version that does not
# exist (`/v7/listFiles`), a verb the path does not take, the root, and a POST
# with an empty body all answer according to the credential and nothing else.
# The credential is judged before the path in both directions, so this API
# cannot tell a caller their URL is wrong at all.
#
# **The CDN calls a well-formed refusal an error.** `X-Cache: Error from
# cloudfront` rides on every one of these responses, beside an
# `X-Amzn-Trace-Id` whose `Sampled=0` says the trace was not recorded.
#
# **A status value has a space in it.** The enum is `"Deletion Pending"`,
# `"Failed"`, `"Uploaded"`, `"Uploading"` -- title-case English, and one of the
# four is two words, so anything switching on it is comparing display strings.
#
# **The SDK's own example does not match its own return type.** The JSDoc above
# `listFiles` reads:
#
#   const data = await listFiles({ limit: 1 });
#   console.log(data); // { key: "2e0fdb64-…_image.jpg", id: "2e0fdb64-…" }
#
# The declared response is `{hasMore, files: [...]}`. The example prints a
# single file where the method returns an envelope around an array.
#
# **And the key contains the id and the filename.** `key` is
# `<uuid>_<original name>`, so the identifier a caller stores carries the name
# of the file that was uploaded, and renaming the file does not change it.
#
# Also pinned: `id` and `key` are two identifiers for one file, with the first
# embedded in the second; `customId` is nullable beside them, making three;
# `uploadedAt` is a bare number; and the listing pages with `limit` and
# `offset` and reports only `hasMore`, so nothing says how many files there
# are.

recipe: uploadthing
capability: storage
version: 0.1.0

upstream:
  api: v6
  docs: https://docs.uploadthing.com/api-reference/ut-api

auth:
  scheme: header
  header: x-uploadthing-api-key
  keys:
    # Real keys begin sk_live_. This one deliberately does not: a fixture
    # wearing that prefix is refused by secret scanners, including the one on
    # this repository.
    - cauldr0n-upl0adth1ng-f1xture-key
  # A 400 for the absence, a 401 for the wrong value.
  absent_error: missing_api_key
  malformed_error: missing_api_key
  rejected_error: invalid_api_key
  # The credential is judged before the path, in both directions.

responses:
  list:
    style: wrapped
    key: files
    has_more_field: hasMore
  error:
    style: flat
    message_field: error
    code_field: "-"

resources:
  file:
    id:
      field: id
      style: uuid
    fields:
      # A third identifier, nullable.
      customId:
      # The id and the original filename, joined.
      key:
        type: string
      name:
        type: string
      size:
        type: integer
      # "Deletion Pending", "Failed", "Uploaded", "Uploading".
      status:
        type: string
      uploadedAt:
        type: timestamp_ms

routes:
  - method: POST
    path: /v6/listFiles
    resource: file
    operation: list
    pagination:
      style: offset
      limit: 100
      limit_param: limit
      cursor_param: offset

errors:
  missing_api_key:
    # A bad request, for a request that is well formed.
    status: 400
    message: Missing API Key
    fields:
      # The status again, in the field a payload belongs in.
      data: 400
    headers:
      X-Cache: Error from cloudfront

  invalid_api_key:
    status: 401
    # Lowercase k, where the sentence above has a capital.
    message: Invalid API key
    headers:
      X-Cache: Error from cloudfront
    # And no data field at all.

fixtures:
  empty:
    file: []

  uploads:
    file:
      - id: 2e0fdb64-9957-4262-8e45-f372ba903ac8
        customId: null
        # The id, an underscore, and the name of the file.
        key: 2e0fdb64-9957-4262-8e45-f372ba903ac8_image.jpg
        name: image.jpg
        size: 184320
        status: Uploaded
        uploadedAt: 1789300000000
      - id: 7b1d4e0a-93f2-4c55-80ab-3f9e1d2c4a67
        customId: invoice-8812
        key: 7b1d4e0a-93f2-4c55-80ab-3f9e1d2c4a67_invoice.pdf
        name: invoice.pdf
        size: 40218
        # The two-word member of the enum.
        status: Deletion Pending
        uploadedAt: 1789000000000

conformance:
  - name: a missing key is a bad request with the status in a data field
    source: https://api.uploadthing.com/v6/listFiles
    verified: "2026-09-14"
    fixture: uploads
    request:
      method: POST
      path: /v6/listFiles
      headers: {}
    expect:
      # A 400, where the wrong key below is a 401.
      status: 400
      body:
        error: Missing API Key
        # The number that is already on the status line, in the payload's field.
        data: 400
      headers:
        # A CDN calling a well-formed application response an error.
        X-Cache: Error from cloudfront

  - name: and a wrong key is unauthorized with no data field at all
    source: https://api.uploadthing.com/v6/listFiles
    verified: "2026-09-14"
    fixture: uploads
    request:
      method: POST
      path: /v6/listFiles
      headers:
        x-uploadthing-api-key: notarealkey-with-no-live-prefix
    expect:
      status: 401
      body:
        # Lowercase k, where the other sentence capitalises it.
        error: Invalid API key
      absent:
        - data

  - name: a path that does not exist is judged by the credential
    source: https://api.uploadthing.com/v6/cauldron-nope
    verified: "2026-09-14"
    fixture: uploads
    request:
      method: POST
      path: /v6/cauldron-nope
      headers:
        x-uploadthing-api-key: notarealkey-with-no-live-prefix
    expect:
      status: 401
      # The path is never looked at.
      body:
        error: Invalid API key

  - name: and so is a version that does not exist
    source: https://api.uploadthing.com/v7/listFiles
    verified: "2026-09-14"
    fixture: uploads
    request:
      method: POST
      path: /v7/listFiles
      headers: {}
    expect:
      status: 400
      body:
        error: Missing API Key
        data: 400

  - name: and so is a method the path does not take
    source: https://api.uploadthing.com/v6/listFiles
    verified: "2026-09-14"
    fixture: uploads
    request:
      method: PUT
      path: /v6/listFiles
      headers: {}
    expect:
      status: 400
      body:
        error: Missing API Key
        data: 400

  - name: a status value has a space in it
    source: https://github.com/pingdotgg/uploadthing
    fixture: uploads
    request:
      method: POST
      path: /v6/listFiles
      headers:
        x-uploadthing-api-key: cauldr0n-upl0adth1ng-f1xture-key
    expect:
      status: 200
      body:
        # Title-case English, and one of the four is two words.
        'files[0].status': Uploaded
        'files[1].status': Deletion Pending
        'files[0].name': image.jpg
        'files[1].name': invoice.pdf

  - name: the key contains the id and the filename
    source: https://github.com/pingdotgg/uploadthing
    fixture: uploads
    request:
      method: POST
      path: /v6/listFiles
      headers:
        x-uploadthing-api-key: cauldr0n-upl0adth1ng-f1xture-key
    expect:
      status: 200
      body:
        # Three identifiers, and the first is embedded in the second.
        'files[0].id': 2e0fdb64-9957-4262-8e45-f372ba903ac8
        'files[0].key': 2e0fdb64-9957-4262-8e45-f372ba903ac8_image.jpg
        'files[0].customId': null
        'files[1].customId': invoice-8812
        'files[0].size': 184320
        'files[0].uploadedAt': 1789300000000

  - name: the listing says whether there is more and not how much
    source: https://github.com/pingdotgg/uploadthing
    fixture: uploads
    request:
      method: POST
      path: /v6/listFiles
      query:
        limit: "1"
        offset: "0"
      headers:
        x-uploadthing-api-key: cauldr0n-upl0adth1ng-f1xture-key
    expect:
      status: 200
      body:
        hasMore: true
      absent:
        # No total, no count, no cursor.
        - total
        - count
        - nextCursor

  - name: an account with no files still says hasMore
    source: https://github.com/pingdotgg/uploadthing
    fixture: empty
    request:
      method: POST
      path: /v6/listFiles
      headers:
        x-uploadthing-api-key: cauldr0n-upl0adth1ng-f1xture-key
    expect:
      status: 200
      body:
        files: []
        hasMore: false
