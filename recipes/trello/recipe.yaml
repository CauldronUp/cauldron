# Trello Recipe for Cauldron
#
# Trello has no sandbox. A key and token reach a real account, and a test that
# creates a board creates it in somebody's workspace, where it stays until
# deleted. Boards can be closed but not easily removed, so a test suite leaves
# a trail. Worse, the interesting behaviour is in the webhooks, and pointing a
# real Trello webhook at a laptop needs a tunnel and a publicly reachable URL.
#
# Two things worth reproducing exactly, both of which a well-behaved fake would
# quietly paper over:
#
#   1. The credentials travel in the query string. That is a bad idea and
#      Trello does it anyway: the key and token end up in access logs, browser
#      history and error reports. An emulator that accepted a header instead
#      would hide the exposure from anybody testing against it.
#   2. Failures are plain text, not JSON. A client calling .json() on the
#      response throws rather than reporting the failure, and code written
#      against a JSON-emitting fake never meets that until production.
#
# The credential shape needed no account, and struck live against
# api.trello.com on 2026-09-05 it found this file's existing claim
# backwards. A present, wrong key answers 401 "invalid key" on every route
# tried, which is what this file already said. But no key or token AT ALL
# is not refused: GET and PUT on a board both proceed to the ordinary
# lookup and 404 on an id that does not resolve, and a POST with nothing
# sent got far enough to complain about a missing body parameter instead of
# ever mentioning a credential. One route -- the one an existing case
# already exercised -- is fixed to this with public: when-absent; the
# pattern looks Recipe-wide from GET, PUT and POST all agreeing, and this
# file does not yet apply it everywhere that would need it, which is a
# gap worth having open rather than closed by assumption. Separately, on
# /1/members/me -- a route this file does not model at all -- the same
# absent credential is a 400, "invalid token", which is neither of the
# above and could not be checked further without adding a route to say it
# on. A path nothing declares is its own answer again: Express's bare 404,
# resolved before any credential is judged, regardless of what was sent.
#
# Tokens below are fixtures, not secrets.

recipe: trello
capability: issues
version: 0.1.0

upstream:
  api: "1"
  docs: https://developer.atlassian.com/cloud/trello/rest/

auth:
  # In the URL, which is the point.
  scheme: query
  param: key
  keys:
    - cauldronkey
  # Verified live against api.trello.com 2026-09-05: a path nothing
  # declares is Express's own bare 404, resolved before any credential is
  # judged, regardless of what was sent. See the header for a second,
  # route-dependent finding this Recipe does not model.
  after_routing: true

responses:
  list:
    style: bare
  # Not JSON. A client calling .json() on this throws.
  error:
    style: text

resources:
  board:
    id:
      style: hex
      length: 24
    fields:
      name:
        type: string
        required: true
      desc:
        type: string
      # A closed board is archived, not deleted. It still exists, still
      # counts, and is still reachable by id.
      closed:
        type: boolean
        default: false
      idOrganization:
        type: string
      url:
        type: string
      shortLink:
        type: string

  list:
    id:
      style: hex
      length: 24
    fields:
      idBoard:
        type: string
      name:
        type: string
        required: true
      closed:
        type: boolean
        default: false
      # Trello orders by a float so a card can be inserted between two others
      # without renumbering everything. Treating it as an integer collapses
      # the ordering.
      pos:
        type: number
        default: 65535

  card:
    id:
      style: hex
      length: 24
    fields:
      idBoard:
        type: string
      idList:
        type: string
      name:
        type: string
        required: true
      desc:
        type: string
      closed:
        type: boolean
        default: false
      pos:
        type: number
        default: 65535
      # Absent unless somebody set one. A card with no due date is the normal
      # case, and stamping one would invent a deadline.
      due:
        type: datetime
        stamped: false
      dueComplete:
        type: boolean
        default: false
      shortUrl:
        type: string

routes:
  # Verified live 2026-09-05: no key or token at all does not refuse this
  # route, on GET or on PUT -- it is served as an ordinary request and 404s
  # on an id it cannot resolve, the same as it does for a well-formed
  # credential. Only a credential that was sent and is wrong is refused.
  # See the header for how far this reaches beyond the one route a case
  # here already exercised.
  - method: GET
    path: /1/boards/{id}
    resource: board
    operation: get
    public: when-absent

  - method: PUT
    path: /1/boards/{id}
    resource: board
    operation: update
    emits: updateBoard

  - method: POST
    path: /1/boards
    resource: board
    operation: create

  - method: GET
    path: /1/boards/{idBoard}/lists
    resource: list
    operation: list
    scope: [idBoard]
    pagination:
      # Checked against Trello's own description: neither the board's lists
      # nor its cards takes a limit, an offset or a cursor. Both answer with
      # everything on the board. Trello does page elsewhere -- its actions
      # and search endpoints take limit with before and since -- but not
      # here, so a page size declared on these was one they do not accept.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

  - method: GET
    path: /1/boards/{idBoard}/cards
    resource: card
    operation: list
    scope: [idBoard]
    pagination:
      # Checked against Trello's own description: neither the board's lists
      # nor its cards takes a limit, an offset or a cursor. Both answer with
      # everything on the board. Trello does page elsewhere -- its actions
      # and search endpoints take limit with before and since -- but not
      # here, so a page size declared on these was one they do not accept.
      # Silence could not say any of that, so the runtime paged it at ten
      # reading a "limit" the provider does not accept. style: none says it.
      style: none

  - method: GET
    path: /1/cards/{id}
    resource: card
    operation: get

  - method: POST
    path: /1/cards
    resource: card
    operation: create
    emits: createCard

  - method: PUT
    path: /1/cards/{id}
    resource: card
    operation: update
    emits: updateCard

webhooks:
  events:
    - createCard
    - updateCard
    - deleteCard
    - commentCard
    - updateBoard
    - createList
  # Trello sends what was done, not what it was done to. The action carries
  # the type and the changed entity keyed on its own name; model is the thing
  # the webhook was registered against, which is not necessarily either.
  payload:
    action:
      id: "{id}"
      type: "{event}"
      date: "{created_iso}"
      idMemberCreator: 5b10ac8d82e05b22cc7d4ef5
      data:
        "{resource}":
          "{object}": true
    model:
      id: 5b10ac8d82e05b22cc7d4ef6
  signing:
    scheme: hmac-sha256
    header: x-trello-webhook
    secret: cauldron-webhook-secret

errors:
  rate_limit:
    status: 429
    message: API_TOKEN_LIMIT_EXCEEDED
    headers:
      Retry-After: "10"

  # Verified live 2026-09-05: a present, wrong key (no token), on
  # /1/boards/{id} and on /1/members/me alike.
  authentication_error:
    status: 401
    message: invalid key

  resource_missing:
    status: 404
    message: "The requested resource was not found."

  # Verified live 2026-09-05: a path nothing declares, with no credential
  # sent at all. Express's own default 404, not Trello's -- "Cannot GET
  # /1/x", naming the method and the path, which is different wording from
  # resource_missing's sentence above and unrelated to it. This engine's
  # unknown_route {detail} is the path alone, with no method to put in
  # front of it, so the case below checks the substance rather than the
  # exact sentence.
  unknown_route:
    status: 404
    message: "Cannot {detail}"

  parameter_missing:
    status: 400
    message: "invalid value for {detail}"

  # Trello's own wording, which is unhelpfully terse and worth reproducing
  # because support threads quote it verbatim.
  invalid_id:
    status: 400
    message: invalid id

  # A token scoped to read cannot write, and the message says nothing about
  # scopes at all.
  unauthorized_write:
    status: 401
    message: unauthorized card permission requested

  # The plan wall on a free workspace, which arrives mid-import.
  board_limit_reached:
    status: 403
    message: You have reached the limit of 10 open boards in this Workspace.

fixtures:
  empty: {}

  small-workspace:
    board:
      - id: "000000000000000000000b01"
        name: Roadmap
        desc: Quarterly planning
        closed: false
        shortLink: cauldron1
        url: https://trello.com/b/cauldron1/roadmap
      - id: "000000000000000000000b02"
        name: Archived experiments
        # Closed is archived, not deleted. Still exists, still counts, still
        # reachable by id.
        closed: true
    list:
      - id: "000000000000000000000a01"
        idBoard: "000000000000000000000b01"
        name: To do
        pos: 16384
      - id: "000000000000000000000a02"
        idBoard: "000000000000000000000b01"
        name: Doing
        # A float, so a list can be inserted between two others without
        # renumbering. Treating it as an integer collapses the ordering.
        pos: 24576.5
    card:
      - id: "000000000000000000000c01"
        idBoard: "000000000000000000000b01"
        idList: "000000000000000000000a01"
        name: Ship the conformance suite
        pos: 16384
        due: "2026-02-01T17:00:00Z"
      - id: "000000000000000000000c02"
        idBoard: "000000000000000000000b01"
        idList: "000000000000000000000a01"
        name: No deadline on this one
        pos: 32768
      - id: "000000000000000000000c03"
        idBoard: "000000000000000000000b02"
        idList: "000000000000000000000a01"
        name: Should not appear on the roadmap board
        pos: 16384

# Conformance cases, read from Trello's REST reference rather than observed
# against a live account. The verify report says so.
conformance:
  - name: a present, wrong key is a 401
    source: https://api.trello.com/1/boards/000000000000000000000bff
    verified: "2026-09-05"
    request:
      method: GET
      path: /1/boards/000000000000000000000bff
      query:
        key: garbage000invalid
    expect:
      status: 401
      body_matches: "^invalid key$"

  - name: a path nothing declares is Express's own 404, not Trello's, checked before any credential
    source: https://api.trello.com/1/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No key or token sent. Routing answers first regardless.
      path: /1/not-a-real-endpoint
    expect:
      status: 404
      # Real Trello writes "Cannot GET /1/not-a-real-endpoint", naming the
      # method; this engine's unrouted-path detail carries no method to put
      # in front of the path, so the substance is checked rather than that
      # exact sentence.
      body_matches: "^Cannot .*not-a-real-endpoint$"

  - name: a failure is plain text, not JSON
    source: https://developer.atlassian.com/cloud/trello/rest/
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000bff
      query:
        key: cauldronkey
    expect:
      # A client calling .json() on this throws rather than reporting the
      # failure, and code written against a JSON-emitting fake never meets
      # that until production.
      status: 404
      headers:
        Content-Type: text/plain
      # The prose itself, matched against the raw bytes rather than a parsed
      # document. Until body_matches existed the only claim available here
      # was the Content-Type, which proves the response is text without
      # saying what it says, and the wording is the half support threads
      # quote and clients end up matching on.
      body_matches: 'The requested resource was not found'

  - name: the credential travels in the query string
    source: https://developer.atlassian.com/cloud/trello/rest/
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000b01
      query:
        key: cauldronkey
    expect:
      status: 200
      body:
        name: Roadmap
        closed: false

  - name: no key at all does not refuse this route -- it is served, and 404s on an id it cannot resolve
    # Used to claim 401 for exactly this request. Struck live against
    # api.trello.com 2026-09-05: an absent credential is not refused here,
    # on GET or on PUT, and a POST with one missing proceeded far enough to
    # complain about a missing body parameter instead. Fixed to what the
    # API actually does, and to an id nothing here holds, so the pass-through
    # this now models lands on the ordinary not-found path rather than
    # accidentally serving a fixture board to an anonymous request.
    source: https://api.trello.com/1/boards/000000000000000000000bff
    verified: "2026-09-05"
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000bff
    expect:
      status: 404
      body_matches: "The requested resource was not found\\."

  - name: a closed board is archived, not deleted
    source: https://developer.atlassian.com/cloud/trello/rest/api-group-boards/
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000b02
      query:
        key: cauldronkey
    expect:
      status: 200
      body:
        # Still exists, still counts against the plan, still reachable by id.
        closed: true
        name: Archived experiments

  - name: positions are floats so a card can be inserted between two others
    source: https://developer.atlassian.com/cloud/trello/guides/rest-api/object-definitions/
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000b01/lists
      query:
        key: cauldronkey
    expect:
      status: 200
      body:
        '[0]':
          pos: 16384
        # Treating this as an integer collapses the ordering.
        '[1]':
          pos: 24576.5

  - name: a card with no due date has none
    source: https://developer.atlassian.com/cloud/trello/rest/api-group-cards/
    fixture: small-workspace
    request:
      method: GET
      path: /1/cards/000000000000000000000c02
      query:
        key: cauldronkey
    expect:
      status: 200
      body:
        name: No deadline on this one
        dueComplete: false
      # The normal case. Stamping one would invent a deadline.
      absent:
        - due

  - name: another board's cards are not visible
    source: https://developer.atlassian.com/cloud/trello/rest/api-group-boards/
    fixture: small-workspace
    request:
      method: GET
      path: /1/boards/000000000000000000000b02/cards
      query:
        key: cauldronkey
    expect:
      status: 200
      body:
        '[0]':
          name: Should not appear on the roadmap board
      absent:
        - '[1]'
        - data

  - name: the change is under action and keyed on what changed
    source: https://developer.atlassian.com/cloud/trello/guides/rest-api/webhooks/
    fixture: small-workspace
    request:
      method: POST
      path: /1/cards
      # Trello authenticates in the URL, which is the point of its own
      # first case here.
      query:
        key: cauldronkey
      json:
        name: Ship the Trello Recipe
    expect:
      status: 200
      webhook:
        event: createCard
        body:
          action.type: createCard
          action.data.card.name: Ship the Trello Recipe
        absent:
          # Not at the top, and model is the board rather than the card.
          - name
          - model.name
          - data.object
