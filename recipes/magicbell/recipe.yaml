# MagicBell Recipe for Cauldron
#
# The notifications listing, read from MagicBell's own generated client -- it is
# open -- and struck live against api.magicbell.com on 2026-09-13 with no
# credential, with a wrong project key, with a wrong bearer token, and on a path
# that does not exist.
#
# **An unrouted path answers 405, and says the only method it takes is
# OPTIONS.** Struck live:
#
#   GET /cauldron-nope   405 text/plain, zero bytes
#                        allow: OPTIONS
#
# Not 404. A path that does not exist is reported as a path whose GET is not
# allowed -- and the `Allow` header offers one method, the CORS preflight. So a
# caller who mistypes an endpoint is told the endpoint exists and that the only
# thing it will do is answer a preflight.
#
# **Every failure carries a suggestion and a help link.** Struck live:
#
#   (no header)   401 {"errors":[{"code":"api_key_not_provided",
#                                 "message":"API Key not provided",
#                                 "suggestion":"Please provide a 'X-MAGICBELL-API-KEY' header containing your MagicBell project's API key",
#                                 "help_link":"https://documenter.getpostman.com/view/2269098/2sAYdhLAjv"}]}
#
# Four fields, two of them written for a person: a `suggestion` naming the exact
# header to send, and a `help_link`. Most APIs in this collection manage one
# sentence and no link.
#
# **And the help link points at Postman.** `documenter.getpostman.com/view/2269098/...`
# -- a third-party documentation host and an opaque numeric view id. The URL a
# failing caller is sent to does not belong to MagicBell, and nothing about it
# says which endpoint it describes.
#
# **A correctly formatted bearer token is refused for being badly formatted.**
# Struck live with `Authorization: Bearer notarealtoken`:
#
#   {"code":"invalid_jwt_format","message":"expected authorization header format: Bearer <token>"}
#
# The header sent was exactly `Bearer <token>`. The message describes the
# failure that did not happen and says nothing about the one that did -- and in
# passing it tells a caller who has proved nothing that the credential is a JWT.
#
# **Two credentials, and which one it complains about depends on which header
# you touched.** No headers at all complains about the missing
# `X-MAGICBELL-API-KEY`; a wrong `Authorization` complains about the JWT. So the
# API has two ways in and the failure describes whichever one the caller
# reached for.
#
# **A notification's state is in six places.** `status` is a string, and beside
# it are `sentAt`, `seenAt`, `readAt`, `archivedAt` and `discardedAt` -- five
# nullable timestamps, each recording one transition. Nothing says what `status`
# holds when two of them are set, or which wins.
#
# **`content` is capped at ten megabytes.** `z.string().max(10485760)` on a
# notification body, which is a field that arrives in a bell menu.
#
# **`customAttributes` is `z.any()`** -- no shape at all, on a field that ships
# in every record.
#
# **And the collection makes both of its keys optional.** `{data?: Notification[],
# links?: Links}` -- so `{}` is a conforming response to a request for
# notifications, and a client cannot tell an empty page from a malformed one.

recipe: magicbell
capability: push
version: 0.1.0

upstream:
  api: v1
  docs: https://www.magicbell.com/docs
  # No spec at a fetchable address: MagicBell generates its clients from an
  # internal description and publishes its reference through Postman's
  # documenter. The shapes below are read from the generated client, which is
  # the artefact that description produced.

auth:
  # The project key. There is a second credential -- a JWT in Authorization --
  # and the failure a caller gets depends on which of the two they touched.
  scheme: header
  header: X-MAGICBELL-API-KEY
  keys:
    - cauldr0n-mag1cbell-f1xture
  absent_error: api_key_not_provided
  rejected_error: incorrect_api_key
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    # Optional in the schema, like the collection itself.
    cursor_field: links.next
    cursor_null: true
    prev_field: links.prev
  error:
    style: list
    key: errors
    message_field: message
    code_field: code
    code_type: string
    type_field: "-"

resources:
  notification:
    id:
      field: id
      style: uuid
    fields:
      title:
        type: string
      # A string with no enum, beside five timestamps that say the same thing.
      status:
        type: string
      userId:
        type: string
      createdAt:
        type: datetime
      updatedAt:
        type: datetime
      # Untyped, so absence survives: each of these is optional and nullable.
      content:
      category:
      topic:
      actionUrl:
      sentAt:
      seenAt:
      readAt:
      archivedAt:
      discardedAt:
      # z.any(): no shape at all.
      customAttributes:

routes:
  - method: GET
    path: /notifications
    resource: notification
    operation: list
    pagination:
      style: cursor
      limit: 20
      limit_param: per_page
      cursor_param: page

errors:
  api_key_not_provided:
    status: 401
    code: api_key_not_provided
    message: API Key not provided
    fields:
      # Two fields written for a person, on a machine-readable failure.
      suggestion: "Please provide a 'X-MAGICBELL-API-KEY' header containing your MagicBell project's API key"
      # A third-party documentation host and an opaque view id.
      help_link: https://documenter.getpostman.com/view/2269098/2sAYdhLAjv

  incorrect_api_key:
    status: 401
    code: incorrect_api_key
    message: API Key is incorrect
    fields:
      suggestion: "Please provide your MagicBell project's correct API key in the 'X-MAGICBELL-API-KEY' header"
      help_link: https://documenter.getpostman.com/view/2269098/2sAYdhLAjv

  unknown_route:
    # Not 404: a path that does not exist is a method that is not allowed.
    status: 405
    empty: true
    headers:
      Content-Type: text/plain; charset=utf-8
      # One method, and it is the CORS preflight.
      Allow: OPTIONS

fixtures:
  empty:
    notification: []

  inbox:
    notification:
      - id: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        title: Your export is ready
        status: read
        userId: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        createdAt: "2026-06-02T14:12:05.000Z"
        updatedAt: "2026-06-02T14:20:00.000Z"
        content: The export you requested has finished.
        category: exports
        topic: export-4821
        actionUrl: https://example.com/exports/4821
        # Four of the five transitions, each in its own field.
        sentAt: "2026-06-02T14:12:06.000Z"
        seenAt: "2026-06-02T14:15:00.000Z"
        readAt: "2026-06-02T14:20:00.000Z"
        archivedAt: null
        discardedAt: null
        customAttributes:
          exportId: 4821
      - id: b8f9b663-0a3b-cf45-587a-be880946e881
        title: Welcome
        status: unread
        userId: 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        createdAt: "2026-01-15T09:30:00.000Z"
        updatedAt: "2026-01-15T09:30:00.000Z"
        content: null
        category: null
        topic: null
        actionUrl: null
        sentAt: "2026-01-15T09:30:01.000Z"
        seenAt: null
        readAt: null
        archivedAt: null
        discardedAt: null
        # z.any(), and here it is null.
        customAttributes: null

conformance:
  - name: a missing credential comes with a suggestion and a link
    source: https://api.magicbell.com/notifications
    verified: "2026-09-13"
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers: {}
    expect:
      status: 401
      body:
        'errors[0].code': api_key_not_provided
        'errors[0].message': API Key not provided
        # Two fields written for a person, naming the exact header to send.
        'errors[0].suggestion': "Please provide a 'X-MAGICBELL-API-KEY' header containing your MagicBell project's API key"

  - name: the help link belongs to a third party
    source: https://api.magicbell.com/notifications
    verified: "2026-09-13"
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: notarealkey
    expect:
      status: 401
      body:
        'errors[0].code': incorrect_api_key
        # Postman's documenter, and an opaque numeric view id, on every
        # failure this API sends.
        'errors[0].help_link': https://documenter.getpostman.com/view/2269098/2sAYdhLAjv
        'errors[0].suggestion': "Please provide your MagicBell project's correct API key in the 'X-MAGICBELL-API-KEY' header"

  - name: an unrouted path is a method that is not allowed
    source: https://api.magicbell.com/cauldron-nope
    verified: "2026-09-13"
    fixture: inbox
    request:
      method: GET
      path: /cauldron-nope
      headers:
        X-MAGICBELL-API-KEY: notarealkey
    expect:
      # Not 404, and the one method it offers is the CORS preflight.
      status: 405
      headers:
        Allow: OPTIONS
        Content-Type: text/plain; charset=utf-8
      no_body: true

  - name: a notification's state is in six places
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/notifications/models/notification.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
    expect:
      status: 200
      body:
        # A status string, and five nullable timestamps recording the
        # transitions, with nothing saying which wins.
        'data[0].status': read
        'data[0].sentAt': "2026-06-02T14:12:06.000Z"
        'data[0].seenAt': "2026-06-02T14:15:00.000Z"
        'data[0].readAt': "2026-06-02T14:20:00.000Z"
        'data[0].archivedAt': null
        'data[0].discardedAt': null

  - name: an unread notification leaves four of them null
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/notifications/models/notification.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
    expect:
      status: 200
      body:
        'data[1].status': unread
        'data[1].seenAt': null
        'data[1].readAt': null
        'data[1].sentAt': "2026-01-15T09:30:01.000Z"

  - name: the body is optional and so is everything describing it
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/notifications/models/notification.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
    expect:
      status: 200
      body:
        # content is capped at ten megabytes and may be absent; category,
        # topic and actionUrl are optional and nullable too.
        'data[0].content': The export you requested has finished.
        'data[1].content': null
        'data[0].category': exports
        'data[1].category': null
        'data[0].topic': export-4821
        'data[0].actionUrl': https://example.com/exports/4821
        'data[1].actionUrl': null

  - name: customAttributes has no shape at all
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/notifications/models/notification.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
    expect:
      status: 200
      body:
        # z.any(), on a field that ships in every record.
        'data[0].customAttributes.exportId': 4821
        'data[1].customAttributes': null
        'data[0].title': Your export is ready
        'data[0].userId': 3f2a1c44-58ab-4d19-b6c7-8e2d4f9a0b11
        'data[0].createdAt': "2026-06-02T14:12:05.000Z"
        'data[0].updatedAt': "2026-06-02T14:20:00.000Z"

  - name: the links object has a next and a prev and no last
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/common/links.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
      query:
        per_page: "1"
    expect:
      status: 200
      body:
        'data[0].id': 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
        # first, next and prev are the whole object: there is no last, so a
        # client cannot jump to the end.
        'links.prev': null
      matches:
        'links.next': '.'

  - name: the next page is asked for by the cursor in the links
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/common/links.ts
    fixture: inbox
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
      query:
        per_page: "1"
        page: 9c36e8c7-5a73-47c0-9716-99fd3d4197d5
    expect:
      status: 200
      body:
        'data[0].id': b8f9b663-0a3b-cf45-587a-be880946e881
        'data[0].title': Welcome

  - name: an inbox with no notifications still sends the key
    source: https://github.com/magicbell/magicbell-js/blob/main/packages/magicbell-js/src/user-client/services/notifications/models/notification-collection.ts
    fixture: empty
    request:
      method: GET
      path: /notifications
      headers:
        X-MAGICBELL-API-KEY: cauldr0n-mag1cbell-f1xture
    expect:
      status: 200
      body:
        # Both `data` and `links` are optional in the schema, so `{}` would
        # conform too and a client could not tell it from a malformed reply.
        data: []
