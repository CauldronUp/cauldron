  - name: an error code is a string of digits, not a number
    # "1016" quoted. Comparing it to 1016 fails in every language that does
    # not coerce, which is most of them.
    source: https://www.marqeta.com/docs/core-api/errors
    fixture: small-program
    arm: insufficient_funds
    request:
      method: GET
      path: /v3/transactions
      headers:
        Authorization: Basic Y2F1bGRyb25fbWFycWV0YV9hcHBfdG9rZW46Y2F1bGRyb25fbWFycWV0YV9hZG1pbl9hY2Nlc3NfdG9rZW4=
    expect:
      status: 400
      body:
        error_code: "1016"
        error_message: "Insufficient funds available on this account"

  - name: an inactive card reports 1503 rather than a distinct status
    # A card that cannot transact answers 400 with a code in the body, which
    # is the same 400 a malformed request gets. Branching on HTTP status
    # alone cannot tell a dead card from a typo.
    source: https://www.marqeta.com/docs/core-api/errors
    fixture: small-program
    arm: card_not_active
    request:
      method: GET
      path: /v3/cards/a3c7e912-6d40-4e88-9b21-77f0ac4e5d36
      headers:
        Authorization: Basic Y2F1bGRyb25fbWFycWV0YV9hcHBfdG9rZW46Y2F1bGRyb25fbWFycWV0YV9hZG1pbl9hY2Nlc3NfdG9rZW4=
    expect:
      status: 400
      body:
        error_code: "1503"

  - name: a missing resource says 404 in the body as well as the status
    source: https://www.marqeta.com/docs/core-api/errors
    fixture: small-program
    request:
      method: GET
      path: /v3/transactions/00000000-0000-4000-8000-000000000000
      headers:
