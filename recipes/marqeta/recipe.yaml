    expect:
      status: 404
      body:
        error_code: "404"

  - name: errors are flat with no wrapper
    # error_code and error_message at the top level, not under an "error"
    # object, so code unwrapping one finds nothing to unwrap.
    source: https://www.marqeta.com/docs/core-api/errors
    fixture: small-program
    request:
      method: GET
      path: /v3/transactions/00000000-0000-4000-8000-000000000000
      headers:
        Authorization: Basic Y2F1bGRyb25fbWFycWV0YV9hcHBfdG9rZW46Y2F1bGRyb25fbWFycWV0YV9hZG1pbl9hY2Nlc3NfdG9rZW4=
    expect:
      status: 404
      absent:
        - error
        - type
        - errors

