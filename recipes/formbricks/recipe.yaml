# Formbricks Recipe for Cauldron
#
# The surveys listing on the management API, read from Formbricks's own source
# -- it is open -- and struck live against app.formbricks.com on 2026-09-13
# with no credential, with a deliberately invalid one, on both API versions,
# and on a path that does not exist.
#
# **Two API versions on one host, two error shapes.** Struck live:
#
#   /api/v1/management/me  401 {"code":"not_authenticated","message":"Not authenticated",
#                               "details":{"x-Api-Key":"Header not provided or API Key invalid"}}
#   /api/v2/me             401 {"error":{"code":401,"message":"Unauthorized"}}
#
# `body.code` is the string `not_authenticated` in one and the number `401` in
# the other. `body.message` is at the top level in one and one level down in the
# other. A client that talks to both -- which is the normal case while a
# migration is in progress -- needs two readers for the same failure, and
# nothing but the path tells it which it is about to get.
#
# **The details map is keyed by a header name spelled three ways.**
#
#   "details": { "x-Api-Key": "Header not provided or API Key invalid" }
#
# Lower-case `x`, capital `A`, capital `K`. HTTP header names are
# case-insensitive, so a caller who sent `x-api-key` -- which is what the
# documentation tells them to send -- and then looks the name up in this map
# finds nothing. The key is a label rather than an identifier.
#
# **And the detail merges the two conditions it exists to separate.** "Header
# not provided **or** API Key invalid": the one field in the body whose job is
# to say which of the two happened says both. Struck live with no header and
# with a wrong key, the bodies are byte-identical.
#
# **The v2 success envelope makes its pagination optional.** From the source:
#
#   interface ApiResponseWithMeta<T> extends ApiResponse<T> {
#     meta?: { total?: number; limit?: number; offset?: number }
#   }
#
# `meta` is optional and so is every field inside it. So a paginated response
# may carry no pagination at all, and a client cannot tell "there are no more"
# from "the server did not say".
#
# **The listing can be sorted by two fields and neither is a name.** `sortBy` is
# an enum of `createdAt` and `updatedAt`. A caller who wants surveys in
# alphabetical order, or grouped by status, sorts them itself.
#
# **And an unrouted path under /api answers the web application.** A full
# Next.js HTML document, stylesheet links and all, from the path prefix reserved
# for the API.

recipe: formbricks
capability: forms
version: 0.1.0

upstream:
  api: v1
  docs: https://formbricks.com/docs
  # No spec at a fetchable address: Formbricks defines its API in Zod schemas
  # in the application itself and renders a reference from them at build time.
  # The shapes below are read from that source -- see the README.

auth:
  scheme: header
  header: x-api-key
  keys:
    - cauldr0n_f0rmbr1cks_f1xture
  # One body for both states, and a details map that says so.
  absent_error: not_authenticated
  rejected_error: not_authenticated
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
  error:
    # v1's shape: a string code at the top level, beside the message.
    style: flat
    message_field: message
    code_field: code
    code_type: string

resources:
  survey:
    id:
      # CUID2, which is what the v2 filter types declare for every identifier
      # in this API.
      field: id
      style: opaque
      length: 25
    fields:
      name:
        type: string
      # link or app -- the two values the filter enum permits.
      type:
        type: string
      # draft, inProgress, paused or completed.
      status:
        type: string
      environmentId:
        type: string
      # The only two fields the listing can be sorted by.
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: GET
    path: /api/v1/management/surveys
    resource: survey
    operation: list
    pagination:
      style: offset
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: skip

errors:
  not_authenticated:
    status: 401
    code: not_authenticated
    message: Not authenticated
    fields:
      details:
        # A header name in three cases, as a map key, where header names are
        # case-insensitive -- and a value that merges the two conditions the
        # field exists to tell apart.
        x-Api-Key: Header not provided or API Key invalid

  unknown_route:
    status: 404
    # The web application, from the path prefix reserved for the API.
    style: text
    message: "<!DOCTYPE html><html lang=\"en-US\" translate=\"no\"><head>"
    headers:
      Content-Type: text/html; charset=utf-8

fixtures:
  empty:
    survey: []

  environment:
    survey:
      - id: cm5k2qz1x0001xyz9abcd1234
        name: Product feedback
        type: link
        status: inProgress
        environmentId: cm5k2qz1x0000xyz9abcd0000
        createdAt: "2026-01-15T09:30:00.000Z"
        updatedAt: "2026-06-02T14:12:05.000Z"
      - id: cm5k2qz1x0002xyz9abcd5678
        name: In-app NPS
        type: app
        status: draft
        environmentId: cm5k2qz1x0000xyz9abcd0000
        createdAt: "2026-04-02T11:05:00.000Z"
        updatedAt: "2026-04-02T11:20:00.000Z"

conformance:
  - name: a missing key and a wrong one are byte-identical
    source: https://app.formbricks.com/api/v1/management/surveys
    verified: "2026-09-13"
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers: {}
    expect:
      status: 401
      body:
        # A string code at the top level, where v2 puts a number one level
        # down.
        code: not_authenticated
        message: Not authenticated

  - name: the details map is keyed by a header name in three cases
    source: https://app.formbricks.com/api/v1/management/surveys
    verified: "2026-09-13"
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: notarealkey
    expect:
      status: 401
      body:
        # Lower-case x, capital A, capital K -- so a caller who sent
        # `x-api-key` and looks that name up here finds nothing. And the
        # value merges the two conditions the field exists to separate.
        'details.x-Api-Key': Header not provided or API Key invalid
        code: not_authenticated

  - name: an unrouted path under the API prefix answers the web application
    source: https://app.formbricks.com/api/v1/management/cauldron-nope
    verified: "2026-09-13"
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/cauldron-nope
      headers:
        x-api-key: notarealkey
    expect:
      status: 404
      headers:
        Content-Type: text/html; charset=utf-8
      body_matches: '\A<!DOCTYPE html>'

  - name: a survey is a link or an app
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/management/surveys/types/surveys.ts
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
    expect:
      status: 200
      body:
        # The two values the filter enum permits, and nothing in between.
        'data[0].type': link
        'data[1].type': app
        'data[0].id': cm5k2qz1x0001xyz9abcd1234
        'data[0].name': Product feedback

  - name: the status enum is four words and one of them is not a word
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/management/surveys/types/surveys.ts
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
    expect:
      status: 200
      body:
        # draft, inProgress, paused, completed -- three lower-case and one
        # camelCase, in one enum.
        'data[0].status': inProgress
        'data[1].status': draft

  - name: every survey belongs to an environment
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/management/surveys/types/surveys.ts
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
    expect:
      status: 200
      body:
        # A CUID2, which is the identifier format for everything in this API.
        'data[0].environmentId': cm5k2qz1x0000xyz9abcd0000
        'data[1].environmentId': cm5k2qz1x0000xyz9abcd0000
        'data[1].id': cm5k2qz1x0002xyz9abcd5678
        'data[1].name': In-app NPS

  - name: the only two sortable fields are the timestamps
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/management/surveys/types/surveys.ts
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
    expect:
      status: 200
      body:
        # sortBy permits createdAt and updatedAt and nothing else, so
        # alphabetical order is the caller's problem.
        'data[0].createdAt': "2026-01-15T09:30:00.000Z"
        'data[0].updatedAt': "2026-06-02T14:12:05.000Z"
        'data[1].createdAt': "2026-04-02T11:05:00.000Z"
        'data[1].updatedAt': "2026-04-02T11:20:00.000Z"

  - name: the second page is the second survey
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/management/surveys/types/surveys.ts
    fixture: environment
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
      query:
        limit: "1"
        skip: "1"
    expect:
      status: 200
      body:
        'data[0].id': cm5k2qz1x0002xyz9abcd5678

  - name: an environment with no surveys still sends the envelope
    source: https://github.com/formbricks/formbricks/blob/main/apps/web/modules/api/v2/types/api-success.ts
    fixture: empty
    request:
      method: GET
      path: /api/v1/management/surveys
      headers:
        x-api-key: cauldr0n_f0rmbr1cks_f1xture
    expect:
      status: 200
      body:
        data: []
