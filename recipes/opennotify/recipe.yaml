# Open Notify Recipe for Cauldron
#
# There is no HTTPS. Port 443 does not answer at all.
#
#   http://api.open-notify.org/iss-now.json   ->  200
#   https://api.open-notify.org/iss-now.json  ->  connection timed out
#
# Not a redirect, not a certificate warning: the connection is never accepted.
# Every request and every response travels in clear text, and no page served over
# HTTPS can call this API from a browser, because mixed content is blocked
# outright. A client written against it works from a terminal and fails silently
# in production the first time it runs inside a web page. The only client anyone
# published, node-red-contrib-iss-location, hardcodes `http://` as its default
# domain, because there is no other one to reach.
#
# **And every failure declares JSON and sends none.** A 404 and a 405 both answer
# `Content-Type: application/json; charset=UTF-8` with a body of zero bytes:
#
#   GET  /nope.json     ->  404, application/json; charset=UTF-8, 0 bytes
#   POST /iss-now.json  ->  405, application/json; charset=UTF-8, 0 bytes
#
# So a client that trusts the content type calls .json() on an empty string and
# throws a parse error, having been told by the response itself that a document
# was coming.
#
# Written against the live API rather than a document: every case below was
# checked against api.open-notify.org on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. The endpoint the documentation still describes is gone, and it fails
#      differently. /iss-pass.json answers nginx's own HTML 404 -- text/html,
#      169 bytes, an <hr> and a version number -- because the request never
#      reaches the application at all. Two 404s in two content types on one
#      API, and which one arrives depends on how far in the request got.
#   2. message says "success" on a 200. A word restating the status line, in the
#      first key of one endpoint and the last key of the other.
#   3. number is people.length. astros.json sends both, so a client can disagree
#      with itself about how many people are in space by reading the wrong one --
#      and craft is not always "ISS": Tiangong is in there too, on an endpoint
#      whose host is named for the other station.
#
# The position is two strings beside a number as well: iss_position.longitude
# and iss_position.latitude are quoted, while the timestamp next to them is an
# integer. Three numeric fields in one object, two of them typed as text.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The station moves. The position served is the one recorded on the date in
#     the cases, and the real endpoint answers a different one every second.
#   - Cauldron serves over HTTP locally, which is what this API does, so the
#     absence of TLS is recorded in this header rather than demonstrated: an
#     emulator cannot show a port refusing to answer.
#   - Twelve astronauts are served, which is all of them on the date recorded.
#     The roster changes with every launch and every return.
#   - The real endpoint sends all twelve in one response and declares no paging
#     of any kind. Cauldron pages a listing at ten, so the sandbox answers ten
#     of them while number still reads 12 -- which is, by accident, the same
#     disagreement the real API invites by sending a count beside an array.
#   - The nginx page is served as the error body Cauldron declares, so it
#     carries Cauldron's error content type rather than text/html. The bytes are
#     the real ones; the header is not.

recipe: opennotify
capability: infrastructure
version: 0.1.0

upstream:
  api: opennotify
  docs: http://open-notify.org/Open-Notify-API/

auth:
  # Public, no key -- and no TLS.
  scheme: none

responses:
  success:
    fields:
      # A word restating the status line, on both endpoints.
      message: success
  resource:
    style: bare
  list:
    style: wrapped
    key: people
    count_field: number
  error:
    # nginx's own page, not the application's.
    style: text

resources:
  position:
    id:
      style: opaque
      # The endpoint answers about the station and nothing identifies it.
      field: "-"
    fields:
      # Two strings and a number, in one object family.
      iss_position:
        type: map
      timestamp:
        type: integer

  person:
    id:
      style: opaque
      field: "-"
      carried_by: name
    fields:
      # Not always the ISS.
      craft:
        type: string
      name:
        type: string

routes:
  - method: GET
    path: /iss-now.json
    resource: position
    operation: get
    id_from: auth

  - method: GET
    path: /astros.json
    resource: person
    operation: list
    pagination:
      # Struck live on 2026-09-05: everyone currently in space, with the
      # count beside them -- twelve people and "number": 12. There are no
      # parameters of any kind on this endpoint, and the collection is small
      # by physics.
      #
      # So this listing does not page. The runtime was serving ten of it and
      # reading "limit", a name this API does not have.
      style: none

  # Zero bytes and a 404, under a content type promising JSON. Modelled as a
  # route with an empty body rather than as an error, because an error always
  # writes a document and this one writes nothing at all.
  - method: GET
    path: /nope.json
    resource: position
    operation: get
    id_from: auth
    status: 404
    empty_body: true

  # The documented endpoint that is gone, failing before it reaches the
  # application: nginx answers for itself, in HTML.
  - method: GET
    path: /iss-pass.json
    error: never_reached_the_application

errors:
  never_reached_the_application:
    status: 404
    # nginx's default page, with the version it is running.
    message: "<html>\n<head><title>404 Not Found</title></head>\n<body bgcolor=\"white\">\n<center><h1>404 Not Found</h1></center>\n<hr><center>nginx/1.10.3</center>\n</body>\n</html>\n"

fixtures:
  empty: {}

  space:
    position:
      - id: iss
        iss_position:
          # Quoted...
          longitude: "-64.2109"
          latitude: "51.1826"
        # ...beside an integer.
        timestamp: 1788071591

    person:
      - id: Oleg Kononenko
        craft: ISS
        name: Oleg Kononenko
      - id: Nikolai Chub
        craft: ISS
        name: Nikolai Chub
      - id: Tracy Caldwell Dyson
        craft: ISS
        name: Tracy Caldwell Dyson
      - id: Matthew Dominick
        craft: ISS
        name: Matthew Dominick
      - id: Michael Barratt
        craft: ISS
        name: Michael Barratt
      - id: Jeanette Epps
        craft: ISS
        name: Jeanette Epps
      - id: Alexander Grebenkin
        craft: ISS
        name: Alexander Grebenkin
      - id: Butch Wilmore
        craft: ISS
        name: Butch Wilmore
      - id: Sunita Williams
        craft: ISS
        name: Sunita Williams
      # And three on the other station, on a host named for the first one.
      - id: Li Guangsu
        craft: Tiangong
        name: Li Guangsu
      - id: Li Cong
        craft: Tiangong
        name: Li Cong
      - id: Ye Guangfu
        craft: Tiangong
        name: Ye Guangfu

conformance:
  - name: the position is two strings beside a number
    source: http://api.open-notify.org/iss-now.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /iss-now.json
    expect:
      status: 200
      body:
        # Quoted...
        "iss_position.longitude": "-64.2109"
        "iss_position.latitude": "51.1826"
        # ...beside an integer, in the same response.
        timestamp: 1788071591
      absent:
        # Nothing identifies the station. The response is three keys and none
        # of them is an id.
        - id

  - name: a word restating the status line, in the first key
    source: http://api.open-notify.org/iss-now.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /iss-now.json
    expect:
      status: 200
      body:
        message: success

  - name: and in the last key of the other endpoint, beside a redundant count
    source: http://api.open-notify.org/astros.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /astros.json
    expect:
      status: 200
      body:
        message: success
        # people.length, sent as well as the array, so a client can disagree
        # with itself about how many people are in space.
        number: 12
        "people[0].name": Oleg Kononenko
      absent:
        # The astronauts are not identified either: a name and a craft, and
        # nothing to address one of them by.
        - "people[0].id"

  - name: craft is not always the ISS
    source: http://api.open-notify.org/astros.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /astros.json
    expect:
      status: 200
      body:
        "people[0].craft": ISS
        # On an endpoint whose host is named for the other station.
        "people[9].craft": Tiangong
        "people[9].name": Li Guangsu

  - name: a failure declares JSON and sends none of it
    source: http://api.open-notify.org/nope.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /nope.json
    expect:
      # Zero bytes under a content type promising a document, so a client that
      # trusts the header calls .json() on an empty string and throws.
      status: 404
      body_matches: '^$'

  - name: the documented endpoint is gone, and fails in HTML instead
    source: http://api.open-notify.org/iss-pass.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /iss-pass.json
    expect:
      # nginx answering for itself, because the request never reached the
      # application. A different 404 from the one above, on the same API.
      #
      # Both halves, because the page says it twice -- once in the title and
      # once in the heading -- and a regex that matches either cannot tell
      # which one is still there.
      status: 404
      body_matches: '<title>404 Not Found</title>[\s\S]*<h1>404 Not Found</h1>'

  - name: and it names the version it is running
    source: http://api.open-notify.org/iss-pass.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /iss-pass.json
    expect:
      status: 404
      body_matches: 'nginx/1\.10\.3'

  - name: every astronaut on the station
    source: http://api.open-notify.org/astros.json
    verified: "2026-08-30"
    fixture: space
    request:
      method: GET
      path: /astros.json
    expect:
      status: 200
      body:
        "people[1].name": Nikolai Chub
        "people[1].craft": ISS
        "people[2].name": Tracy Caldwell Dyson
        "people[2].craft": ISS
