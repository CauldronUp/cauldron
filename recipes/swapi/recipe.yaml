# SWAPI Recipe for Cauldron
#
# Every number is a string, and one of them has a unit in it.
#
#   "rotation_period": "23",
#   "orbital_period":  "304",
#   "diameter":        "10465",
#   "surface_water":   "1",
#   "population":      "200000",
#   "gravity":         "1 standard"
#
# Six numeric fields, six strings, and the sixth carries a word. Sorting planets
# by diameter sorts "10465" before "9000" because "1" is before "9", and
# parseFloat on gravity gives 1 while the string it came from means one standard
# gravity -- so the field that looks most like a number is the one that is least
# safely read as one.
#
# **And the absence of data is spelled two ways in one record.** The planet at
# /planets/28 is named "unknown", and its six numeric fields split three-three:
# rotation_period, orbital_period and diameter are "0", while surface_water,
# population and gravity are "unknown". The same missing information, two
# encodings, in the same object -- so a client that treats "0" as a real zero
# charts a planet with no diameter, and one that treats "unknown" as a sentinel
# misses the three that are not spelled that way.
#
# Written against the live API rather than a document: every case below was
# checked against swapi.info on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. A planet's name can be "unknown" too. Not null, not absent: the string,
#      in the field a user interface renders as a title.
#   2. Related records are URLs. residents and films are arrays of
#      "https://swapi.info/api/people/1", so joining anything means parsing an
#      integer back out of a string -- and the empty case is an empty array
#      rather than a missing key.
#   3. A planet that does not exist answers a web page. swapi.info is a static
#      site, so /planets/9999 returns the application's HTML shell with a 200,
#      and a client parsing every response as JSON throws on the parse.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two planets are served, not sixty: Tatooine and the one called "unknown",
#     chosen so both spellings of absence can be seen in one fixture.
#   - Tatooine's ten residents and five films are trimmed to two each. The
#     finding is that they are URLs, not how many there are.
#   - This is swapi.info, a static mirror of the original swapi.dev. The shapes
#     are the same and the host is not, and every URL inside the records points
#     at the mirror.

recipe: swapi
capability: infrastructure
version: 0.1.0

upstream:
  api: swapi
  docs: https://swapi.info/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: text

resources:
  planet:
    id:
      style: numeric
      # A planet carries a url and no id.
      field: "-"
      carried_by: url
    fields:
      # "unknown" is a value this field takes.
      name:
        type: string
      # Six numeric fields, all strings.
      rotation_period:
        type: string
      orbital_period:
        type: string
      diameter:
        type: string
      climate:
        type: string
      # A number with a unit word in it.
      gravity:
        type: string
      terrain:
        type: string
      surface_water:
        type: string
      population:
        type: string
      # URLs, not identifiers.
      residents:
        type: list
      films:
        type: list
      created:
        type: string
      edited:
        type: string
      url:
        type: string

routes:
  - method: GET
    path: /api/planets/{id}
    resource: planet
    operation: get
    not_found: not_a_planet

errors:
  # A static site answering its own application shell, with a 200.
  not_a_planet:
    status: 200
    headers:
      Content-Type: text/html
    message: |-
      <!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/></head></html>

fixtures:
  empty: {}

  galaxy:
    planet:
      - id: "1"
        name: Tatooine
        # Numbers, quoted.
        rotation_period: "23"
        orbital_period: "304"
        diameter: "10465"
        climate: arid
        # And a number with a word after it.
        gravity: 1 standard
        terrain: desert
        surface_water: "1"
        population: "200000"
        # URLs rather than identifiers. Two of the real ten and two of the
        # real five.
        residents:
          - https://swapi.info/api/people/1
          - https://swapi.info/api/people/2
        films:
          - https://swapi.info/api/films/1
          - https://swapi.info/api/films/3
        created: "2014-12-09T13:50:49.641000Z"
        edited: "2014-12-20T20:58:18.411000Z"
        url: https://swapi.info/api/planets/1

      # The planet whose name is the string "unknown".
      - id: "28"
        name: unknown
        # Three of the six numeric fields say nothing by saying zero...
        rotation_period: "0"
        orbital_period: "0"
        diameter: "0"
        climate: unknown
        # ...and three say nothing by saying so.
        gravity: unknown
        terrain: unknown
        surface_water: unknown
        population: unknown
        residents:
          - https://swapi.info/api/people/20
        # An empty array rather than a missing key.
        films: []
        created: "2014-12-15T12:25:59.569000Z"
        edited: "2014-12-20T20:58:18.466000Z"
        url: https://swapi.info/api/planets/28

conformance:
  - name: every number is a string and one of them has a unit in it
    source: https://swapi.info/api/planets/1
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/1
    expect:
      status: 200
      body:
        name: Tatooine
        # Quoted, so sorting by diameter puts "10465" before "9000".
        rotation_period: "23"
        orbital_period: "304"
        diameter: "10465"
        surface_water: "1"
        population: "200000"
        # And the one that carries a word, in the field that looks most like a
        # number.
        gravity: 1 standard

  - name: the absence of data is spelled two ways in one record
    source: https://swapi.info/api/planets/28
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/28
    expect:
      status: 200
      body:
        # Three numeric fields saying nothing by saying zero...
        rotation_period: "0"
        orbital_period: "0"
        diameter: "0"
        # ...and three saying nothing by saying so, on the same record.
        surface_water: unknown
        population: unknown
        gravity: unknown

  - name: a planet can be named unknown
    source: https://swapi.info/api/planets/28
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/28
    expect:
      status: 200
      body:
        # Not null, not absent: the string, in the field an interface renders
        # as a title.
        name: unknown
        climate: unknown
        terrain: unknown

  - name: related records are URLs and the empty case is an empty array
    source: https://swapi.info/api/planets/28
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/28
    expect:
      status: 200
      body:
        # A URL, so joining means parsing an integer back out of a string.
        "residents[0]": https://swapi.info/api/people/20
        # And an empty array rather than a missing key.
        films: []
        url: https://swapi.info/api/planets/28
        # The same six-digit microseconds and Z as the other planet's.
        created: "2014-12-15T12:25:59.569000Z"
        edited: "2014-12-20T20:58:18.466000Z"

  - name: and the populated planet's are the same shape
    source: https://swapi.info/api/planets/1
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/1
    expect:
      status: 200
      body:
        "residents[0]": https://swapi.info/api/people/1
        "residents[1]": https://swapi.info/api/people/2
        "films[0]": https://swapi.info/api/films/1
        "films[1]": https://swapi.info/api/films/3
        climate: arid
        terrain: desert
        created: "2014-12-09T13:50:49.641000Z"
        edited: "2014-12-20T20:58:18.411000Z"
        url: https://swapi.info/api/planets/1

  - name: a planet that does not exist answers a web page
    source: https://swapi.info/api/planets/9999
    verified: "2026-08-30"
    fixture: galaxy
    request:
      method: GET
      path: /api/planets/9999
    expect:
      # A static site, so the miss is the application's own HTML shell -- and a
      # client parsing every response as JSON throws on the parse rather than
      # reading a status.
      status: 200
      headers:
        Content-Type: text/html
      body_matches: '<!DOCTYPE html>'
