# Infisical Recipe for Cauldron
#
# Written against Infisical's own OpenAPI 3.0.3 document, served by the API
# itself at us.infisical.com/api/docs/json -- 1479 paths, 2317 operations,
# 12,974,420 bytes -- and struck live against us.infisical.com on 2026-09-06.
# Every live observation was made with no credential and then with two
# deliberately invalid ones.
#
# **The document contains zero `$ref`s.**
#
# Not few. None. `components.schemas` is empty and the string `"$ref"` does not
# occur once in 12.9MB. Every schema is written out longhand at every use site.
#
# 16,097 response schemas are declared and 869 of them are distinct, so 94.6%
# of what is in the file is a copy of something else in the file. **One shape
# appears 2,298 times** -- the 400 error envelope -- and the six error statuses
# together account for 13,788 inline copies of five fields.
#
# The effect on anything that reads it: a generator produces sixteen thousand
# anonymous inline types where eight hundred named ones exist, and the same
# error envelope becomes 2,298 separate unrelated structs. Nothing can tell
# that the 401 from one endpoint is the 401 from another, because the document
# never says they are the same thing.
#
# **The declared error requires a field the API does not always send.**
#
# Every one of those 13,788 envelopes is `required: [reqId, statusCode,
# message, error]` with `additionalProperties: false`. Struck live:
#
#   GET /api/v1/workspace                    (no credential)
#   401 {"reqId":"req-us-mlUwgIP7uYC7Za","statusCode":401,
#        "message":"Token missing","error":"UnauthorizedError"}
#
#   GET /api/v1/nonexistent-cauldron
#   404 {"message":"Route GET:/api/v1/nonexistent-cauldron not found",
#        "error":"Not Found","statusCode":404}
#
# **The 404 has no reqId.** The document's own strictest schema requires it and
# the API omits it on the failure a client meets first and most often. Struck
# twice, on two different unknown paths. The key order changes with it: the
# three credential failures lead with reqId, and this one leads with message.
#
# That 404 is Fastify's own not-found handler, printing the method and the path
# back into the sentence -- so it is the framework answering, below whatever
# adds reqId to everything else.
#
# **A credential that cannot be read at all is a 403.**
#
# Struck live, three requests, three statuses from two:
#
#   no Authorization header            401  UnauthorizedError   "Token missing"
#   Authorization: Bearer not-a-token  403  TokenError          "The provided access token is malformed. ..."
#   a real-shaped JWT, bad signature   403  TokenError          "invalid signature"
#
# 403 means the caller was identified and is not allowed. Here it is returned
# for a string that could not be parsed as a credential -- so a client's
# "refresh my token" branch, which nearly always hangs off 401, does not fire
# on the one failure a stale token produces.
#
# And the third message is not Infisical's. "The provided access token is
# malformed. Please use a valid token or generate a new one and try again." is
# a written sentence; "invalid signature" is jsonwebtoken's own string, lower
# case and without a full stop, arriving unchanged under the same `error`
# class. Two failures one signature-check apart, one prose and one library
# internals.
#
# **`reqId` names the region that answered.** `req-us-mlUwgIP7uYC7Za` from
# us.infisical.com. The document lists us.infisical.com, eu.infisical.com and
# localhost:8080 as servers, and the request id carries which one you reached
# -- useful, and also a field whose format is undocumented and which a client
# quoting it in a support ticket has to copy exactly.
#
# **Not one of the 2317 operations has a summary.** Zero. 300 of them have no
# `operationId` either, so an eighth of this API's methods are unnameable and
# every generator invents a name from the path. 2294 carry tags.
#
# **`version` is 0.0.1**, on the document describing a production secrets
# manager serving two regions.
#
# **The listing this Recipe serves has no paging of any kind.** No limit, no
# offset, no cursor, no total: `GET /api/v1/projects/{projectId}/roles` answers
# `{"roles": [...]}` and that is the whole envelope. A project with a thousand
# roles sends a thousand roles.
#
# **`description` is nullable and not required**, so a role with no description
# has two representations -- the key absent, or the key present and null -- and
# the schema permits both. `additionalProperties: false` sits on the same
# object, so the document is strict about fields that may not appear and silent
# about which of two ways this one will be missing.

recipe: infisical
capability: infrastructure
version: 0.1.0

upstream:
  api: 0.0.1
  docs: https://infisical.com/docs/api-reference/overview/introduction
  spec: https://app.infisical.com/api/docs/json
  spec_hash: f7c54ac8e394e1e73e370dbf066939b278d409114ec8f3a18dedc28e01aa1d7c
  spec_seen: "2026-09-06"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Infisical's tokens are JWTs, and the shape is what separates the two 403s
  # struck live: a string that is not three dot-separated segments never
  # reaches a signature check.
  shape: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  keys:
    - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature
  # Three failures, three verdicts, and two of them share a status. Sending
  # nothing is 401; sending something that is not a token is 403; sending a
  # token whose signature does not check is 403 with a different sentence in a
  # different voice.
  absent_error: token_missing
  shape_error: token_malformed
  rejected_error: invalid_signature

responses:
  list:
    style: wrapped
    key: roles
  error:
    style: flat
    message_field: message
    # The class name, as a string: UnauthorizedError, TokenError, Not Found.
    # Infisical's own error taxonomy, and the field a client should branch on
    # rather than the sentence beside it.
    type_field: error
    # The HTTP status, echoed into the body as a number. The document declares
    # it with a single-value enum on every one of the 13,788 copies, so a
    # generator produces 13,788 one-member enums.
    status_field: statusCode
    code_field: "-"
    # No envelope constant for reqId, deliberately. The document requires it on
    # every error and the API omits it on the 404, so declaring it here would
    # put it on the one failure that does not have it -- and an envelope
    # constant can be added per error but not taken away. It rides the three
    # failures that send it instead.

resources:
  role:
    id:
      field: id
      style: uuid
    fields:
      name:
        type: string
      slug:
        type: string
      # Nullable and not required, so absent and null are both legal for the
      # same fact. Declared here because the provider sends it.
      description:
        type: string
      projectId:
        type: string
        in: "-"
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: GET
    path: /api/v1/projects/{projectId}/roles
    resource: role
    operation: list
    scope: [projectId]
    # None declared, because none exists. The 200 schema is
    # {"roles": [...]} with additionalProperties: false, so there is nowhere
    # for a cursor or a total to go even if one were sent.
    pagination:
      style: none

errors:
  token_missing:
    status: 401
    type: UnauthorizedError
    message: "Token missing"
    fields:
      reqId: req-us-mlUwgIP7uYC7Za

  token_malformed:
    status: 403
    type: TokenError
    # A 403 for a string that could not be parsed. Struck live.
    message: "The provided access token is malformed. Please use a valid token or generate a new one and try again."
    fields:
      reqId: req-us-mlUwgIP7uYC7Za

  # The same class, one signature-check later, in a different voice: this is
  # jsonwebtoken's own string arriving unchanged. Lower case, no full stop.
  invalid_signature:
    status: 403
    type: TokenError
    message: "invalid signature"
    fields:
      reqId: req-us-mlUwgIP7uYC7Za

  # Fastify's not-found handler, below whatever stamps reqId on everything
  # else. The document requires reqId on this shape and the API does not send
  # it, which is why fields is emptied here rather than inherited.
  unknown_route:
    status: 404
    type: "Not Found"
    message: "Route GET:/api/v1/nonexistent-cauldron not found"
    fields: {}

fixtures:
  empty:
    role: []

  project:
    role:
      - id: 4f1a9c3e-8b27-4d6a-9f10-2c5e7b3a8d41
        name: Viewer
        slug: viewer
        description: Read-only access to every secret in the project
        projectId: proj-cauldron-demo
        createdAt: "2026-04-02T10:15:00.000Z"
        updatedAt: "2026-04-02T10:15:00.000Z"
      - id: 7c2d5e81-3f94-4a0b-b6e2-9d18c4a70e35
        name: Deployer
        slug: deployer
        description: null
        projectId: proj-cauldron-demo
        createdAt: "2026-05-19T08:40:22.000Z"
        updatedAt: "2026-08-27T16:03:11.000Z"
      - id: b93e6740-52ac-4118-8d7f-0e6a1c92f5b3
        name: Auditor
        slug: auditor
        description: Reads audit logs and no secret values
        projectId: proj-cauldron-demo
        createdAt: "2026-06-30T12:00:00.000Z"
        updatedAt: "2026-06-30T12:00:00.000Z"

conformance:
  - name: no credential is 401 and names its own error class
    source: https://us.infisical.com/api/v1/workspace
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers: {}
    expect:
      status: 401
      body:
        # Struck live: two words, and the class beside them.
        message: "Token missing"
        error: UnauthorizedError
        statusCode: 401

  - name: an unreadable credential is 403 rather than 401
    source: https://us.infisical.com/api/v1/workspace
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer not-a-real-token"
    expect:
      # 403 means identified and not allowed. This string was never parsed, so
      # a client refreshing on 401 does not refresh on the failure a stale
      # token actually produces.
      status: 403
      body:
        error: TokenError
        statusCode: 403
        message: "The provided access token is malformed. Please use a valid token or generate a new one and try again."

  - name: a signature failure answers in the library's own voice
    source: https://us.infisical.com/api/v1/workspace
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        # Three dot-separated segments, so it reaches the signature check the
        # string in the case above never got to.
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.notarealsignature"
    expect:
      status: 403
      body:
        # jsonwebtoken's own string, arriving unchanged: lower case, no full
        # stop, no mention of what to do about it -- beside a sibling failure
        # under the same error class that is a written sentence.
        message: "invalid signature"
        error: TokenError

  - name: every failure carries a request id naming its region
    source: https://us.infisical.com/api/v1/workspace
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers: {}
    expect:
      status: 401
      body:
        # req-us-, from us.infisical.com. The document declares it required on
        # all 13,788 error schemas and gives it no format.
        reqId: req-us-mlUwgIP7uYC7Za

  - name: the request id the document requires is missing from the 404
    source: https://us.infisical.com/api/v1/nonexistent-cauldron
    verified: "2026-09-06"
    fixture: project
    request:
      method: GET
      path: /api/v1/nonexistent-cauldron
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 404
      body:
        # Fastify's own handler, with the method and the path printed into the
        # sentence.
        message: "Route GET:/api/v1/nonexistent-cauldron not found"
        error: Not Found
      absent:
        # Required by the document, on a schema that also says
        # additionalProperties: false, and absent from the real response.
        # Struck twice on two different unknown paths.
        - reqId

  - name: a role listing is wrapped and unpaged
    source: https://infisical.com/docs/api-reference/endpoints/project-roles/list
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        'roles[0].slug': viewer
        'roles[2].name': Auditor
      absent:
        # There is no limit, no offset, no cursor and no total in the 200
        # schema, and additionalProperties: false leaves nowhere to put one.
        - totalCount
        - nextCursor

  - name: a role with no description sends null rather than nothing
    source: https://infisical.com/docs/api-reference/endpoints/project-roles/list
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        # nullable: true and not in required, so the document permits both the
        # absent key and the null value for one fact. A client checking
        # `'description' in role` and one checking `role.description !== null`
        # disagree about the same record.
        'roles[1].description': null
        'roles[0].description': Read-only access to every secret in the project

  - name: identifiers are uuids and the project is not one
    source: https://infisical.com/docs/api-reference/endpoints/project-roles/list
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      matches:
        # format: uuid on the role, and a plain string on projectId in the
        # same object -- so the two identifiers on one record are validated to
        # different standards.
        'roles[0].id': '^[0-9a-f]{8}-[0-9a-f]{4}-'

  - name: timestamps are RFC 3339 with milliseconds
    source: https://infisical.com/docs/api-reference/endpoints/project-roles/list
    fixture: project
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        'roles[1].createdAt': "2026-05-19T08:40:22.000Z"
        # Updated three months later, which is what an edited role looks like
        # from outside; createdAt and updatedAt are equal on the other two.
        'roles[1].updatedAt': "2026-08-27T16:03:11.000Z"

  - name: a project with no roles answers an empty array
    source: https://infisical.com/docs/api-reference/endpoints/project-roles/list
    fixture: empty
    request:
      method: GET
      path: /api/v1/projects/proj-cauldron-demo/roles
      headers:
        Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        roles: []
