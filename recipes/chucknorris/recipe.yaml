# Chuck Norris API Recipe for Cauldron
#
# The success and the failure carry timestamps in two different grammars.
#
#   success: "created_at": "2020-01-05 13:42:19.324003"
#   failure: "timestamp":  "2026-08-30T06:21:50.575Z"
#
# A space instead of a T, six digits of fraction instead of three, and no
# timezone at all -- against ISO 8601 with the T, the milliseconds and the Z.
# Same API, same request, and which format arrives depends on whether it worked.
# Date.parse handles the second and returns NaN for the first in any engine that
# follows the specification, so a client that logs "when did this happen" gets a
# date on its errors and Invalid Date on its results.
#
# **And the two identifier alphabets do not match either.** Most jokes carry
# base64url -- "xMUTjH93TyWHGR6MVf_vpA", mixed case with hyphens and
# underscores -- and some carry "rhvv9w42qka07narzt47da", lowercase letters and
# digits only. Both twenty-two characters, two different character sets, in one
# collection, so anything validating the shape of an id rejects half of them.
#
# Written against the live API rather than a document: every case below was
# checked against api.chucknorris.io on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. updated_at is never different from created_at. Every joke sampled carries
#      the same microsecond in both, so a field that exists to say when
#      something changed has never said it.
#   2. A bad query parameter is a 404 about a path. ?category=zzz on
#      /jokes/random answers "Not Found" with "path": "/jokes/random" -- the path
#      that does exist and did answer, named as the thing that was not found.
#   3. An empty search is {"total": 0, "result": []}. The array is called result,
#      singular, beside a total that is not.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Two jokes are served, not the collection, and the random endpoint answers
#     the recorded one rather than a random one.
#   - The category list is served whole: sixteen bare strings, which is what it
#     is.

recipe: chucknorris
capability: infrastructure
version: 0.1.0

upstream:
  api: chucknorris
  docs: https://api.chucknorris.io/

auth:
  # Public, and no key at all.
  scheme: none

responses:
  resource:
    style: bare
  list:
    style: wrapped
    key: result
    count_field: total
  error:
    style: flat
    message_field: error
    status_field: status

resources:
  joke:
    id:
      style: opaque
      length: 22
    fields:
      categories:
        type: list
      # A space instead of a T, six digits of fraction, and no timezone.
      created_at:
        type: string
      icon_url:
        type: string
      # Never different from created_at.
      updated_at:
        type: string
      url:
        type: string
      value:
        type: string
      query:
        type: string
        in: "-"

routes:
  - method: GET
    path: /jokes/{id}
    resource: joke
    operation: get
    not_found: not_found

  - method: GET
    path: /jokes/search
    resource: joke
    operation: list
    filters:
      - param: query
        field: query

errors:
  # ISO 8601 with a T, three digits and a Z -- and a path field naming the path
  # that answered.
  not_found:
    status: 404
    message: Not Found
    fields:
      timestamp: "2026-08-30T06:21:51.083Z"
      path: /jokes/zzzznotanid

  # The same shape for a query parameter that is not a category, naming the
  # path that does exist and did answer.
  unknown_category:
    status: 404
    message: Not Found
    fields:
      timestamp: "2026-08-30T06:21:50.575Z"
      path: /jokes/random

fixtures:
  empty: {}

  jokes:
    joke:
      # base64url: mixed case, with a hyphen and an underscore.
      - id: xMUTjH93TyWHGR6MVf_vpA
        query: internet
        categories: []
        # A space, six digits, no timezone.
        created_at: "2020-01-05 13:42:22.701402"
        icon_url: https://api.chucknorris.io/img/avatar/chuck-norris.png
        # The same microsecond, on a field that exists to say when something
        # changed.
        updated_at: "2020-01-05 13:42:22.701402"
        url: https://api.chucknorris.io/jokes/xMUTjH93TyWHGR6MVf_vpA
        value: Chuck Norris can kill you fifteen times before you even realize you crossed his property line.

      # And the other alphabet: lowercase letters and digits, no separators,
      # the same twenty-two characters long.
      - id: rhvv9w42qka07narzt47da
        query: internet
        categories:
          - dev
        created_at: "2020-01-05 13:42:19.324003"
        icon_url: https://api.chucknorris.io/img/avatar/chuck-norris.png
        updated_at: "2020-01-05 13:42:19.324003"
        url: https://api.chucknorris.io/jokes/rhvv9w42qka07narzt47da
        value: Chuck Norris' Internet connection is direct to the backbone.

conformance:
  - name: the success timestamp is not ISO 8601
    source: https://api.chucknorris.io/jokes/xMUTjH93TyWHGR6MVf_vpA
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/xMUTjH93TyWHGR6MVf_vpA
    expect:
      status: 200
      body:
        # A space instead of a T, six digits of fraction, no timezone -- so
        # Date.parse returns NaN in any engine that follows the specification.
        created_at: "2020-01-05 13:42:22.701402"
        # And the field that exists to say when something changed carries the
        # same microsecond.
        updated_at: "2020-01-05 13:42:22.701402"

  - name: and the failure timestamp is
    source: https://api.chucknorris.io/jokes/zzzznotanid
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/zzzznotanid
    expect:
      status: 404
      body:
        # The T, three digits and a Z, on the same API, in the same request --
        # so a client logging when something happened gets a date on its errors
        # and Invalid Date on its results.
        timestamp: "2026-08-30T06:21:51.083Z"
        status: 404
        error: Not Found
        path: /jokes/zzzznotanid

  - name: two identifier alphabets, both twenty-two characters
    source: https://api.chucknorris.io/jokes/rhvv9w42qka07narzt47da
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/rhvv9w42qka07narzt47da
    expect:
      status: 200
      body:
        # Lowercase letters and digits only, where the other joke's identifier
        # is base64url with a hyphen and an underscore in it.
        id: rhvv9w42qka07narzt47da
        url: https://api.chucknorris.io/jokes/rhvv9w42qka07narzt47da
        "categories[0]": dev

  - name: a joke with no categories has an empty array
    source: https://api.chucknorris.io/jokes/xMUTjH93TyWHGR6MVf_vpA
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/xMUTjH93TyWHGR6MVf_vpA
    expect:
      status: 200
      body:
        id: xMUTjH93TyWHGR6MVf_vpA
        categories: []
        icon_url: https://api.chucknorris.io/img/avatar/chuck-norris.png
        value: Chuck Norris can kill you fifteen times before you even realize you crossed his property line.

  - name: the fields the other cases do not read
    source: https://api.chucknorris.io/jokes/rhvv9w42qka07narzt47da
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/rhvv9w42qka07narzt47da
    expect:
      status: 200
      body:
        value: Chuck Norris' Internet connection is direct to the backbone.
        created_at: "2020-01-05 13:42:19.324003"
        # The same microsecond again, on the second joke.
        updated_at: "2020-01-05 13:42:19.324003"
        icon_url: https://api.chucknorris.io/img/avatar/chuck-norris.png

  - name: and the first joke's own address
    source: https://api.chucknorris.io/jokes/xMUTjH93TyWHGR6MVf_vpA
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/xMUTjH93TyWHGR6MVf_vpA
    expect:
      status: 200
      body:
        url: https://api.chucknorris.io/jokes/xMUTjH93TyWHGR6MVf_vpA

  - name: a query parameter that is not a category is a 404 about a path
    source: https://api.chucknorris.io/jokes/random?category=zzz
    verified: "2026-08-30"
    fixture: jokes
    arm: unknown_category
    request:
      method: GET
      path: /jokes/xMUTjH93TyWHGR6MVf_vpA
    expect:
      status: 404
      body:
        # The path that does exist and did answer, named as the thing that was
        # not found.
        path: /jokes/random
        error: Not Found
        timestamp: "2026-08-30T06:21:50.575Z"

  - name: an empty search is a singular key beside a total
    source: https://api.chucknorris.io/jokes/search?query=zzzznope
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/search?query=zzzznope
    expect:
      status: 200
      body:
        total: 0
        # The array is called result, singular.
        result: []

  - name: and a search that matches carries the jokes under the same key
    source: https://api.chucknorris.io/jokes/search?query=internet
    verified: "2026-08-30"
    fixture: jokes
    request:
      method: GET
      path: /jokes/search?query=internet
    expect:
      status: 200
      body:
        total: 2
        "result[0].id": xMUTjH93TyWHGR6MVf_vpA
        "result[1].id": rhvv9w42qka07narzt47da
