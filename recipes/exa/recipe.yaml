# Exa Recipe for Cauldron
#
# Exa is the provider in this group with two surfaces for the same question.
# /search finds documents; /contents fetches what is at a URL or a search
# result's id. Both post a JSON body and both read the key from x-api-key,
# and Exa's own reference for /contents answers this collection's central
# question in a field, not in prose: a "statuses" array rides beside every
# contents response, and each entry carries a "source" that is either
# "cached" or "crawled" -- the provider saying, per document, whether what
# you just read came from its index or from a fetch made for you just now.
# No other provider in this group has anything like it. Quoted verbatim from
# Exa's own worked example (docs.exa.ai/reference/get-contents, no key held,
# so this is documented rather than observed):
#
#   "statuses": [
#     {
#       "id": "https://arxiv.org/abs/2307.06435",
#       "status": "success",
#       "source": "cached"
#     }
#   ]
#
# The other half of the question -- does a result carry a crawl date or a
# publication date -- has a documented answer too, and it is the publication
# one. Every result's publishedDate is described, in the schema's own words,
# as "An estimate of the creation date, from parsing HTML content." That is
# a guess about when the page was written, laundered out of its markup, and
# it is a wholly different claim from source: the two together are a
# provider that tells you when a page was written and separately tells you
# whether what you are holding was fetched or remembered -- and declines to
# tell you when the remembering happened. No crawled-at timestamp is
# documented anywhere on either endpoint.
#
# No account was created and no key was requested, guessed, or used. Every
# case citing a verified date below was sent to api.exa.ai directly, with no
# key, an empty header, a wrong one, a wrong method or a path this project
# invented; Exa's own site advertises pay-per-call pricing and this project
# never paid for one.
#
# **Exa is the second provider in this collection, after Fireworks and
# Together, to answer a missing credential differently from a wrong one --
# and its missing-credential answer is not an authentication failure at
# all.** No x-api-key header, checked directly against /search with a real
# query body:
#
#   402  {"requestId":"...","error":"Payment required to access this
#         resource","tag":"X402_PAYMENT_REQUIRED"}
#
# alongside an x402 payment challenge: a WWW-Authenticate header, a
# Payment-Required header encoding acceptable USDC payments on Base and
# Solana, and an extensions object offering a Sign-In-With-Ethereum-shaped
# "agentkit" attestation as a free-trial alternative to paying. A key that is
# present and simply wrong, checked directly:
#
#   401  {"requestId":"...","error":"Invalid API key","tag":"INVALID_API_KEY"}
#
# Different status, different envelope content, different remedy. Exa is not
# saying "you are not who you claim to be" to an anonymous caller; it is
# saying "this specific call costs $0.007 and nobody has offered to pay for
# it," and only escalates to a credential complaint once a credential has
# actually been presented and rejected. An empty header -- x-api-key: with
# nothing after the colon -- answers byte for byte the same 402 as no header
# at all, checked directly: Exa's absent and empty are one state, the same
# collapse this collection has already seen from Brave and Serper on the
# other side of the line.
#
# **The two verdicts map onto this format's own vocabulary without a
# workaround.** auth.absent_error names the 402 and auth.rejected_error names
# the 401, which is what those fields exist for; unlike Brave's and Serper's
# Recipes, elsewhere in this collection, nothing here has to be rebuilt out
# of ordinary routes matched on a header's value, because a missing key and a
# wrong key really do differ by exactly the axis those fields describe.
#
# **Routing resolves before the credential does, on both endpoints.** A
# request to /nosuchroute and a GET where POST is the only method /search or
# /contents has -- checked directly, with no header and with a wrong one, on
# both routes -- all four answer the identical shape:
#
#   404  {"requestId":"...","error":"Not found","tag":"NOT_FOUND"}
#
# whether or not a credential was sent. So auth.after_routing is declared,
# and Exa has no real 405 anywhere this project could find: a method a route
# does not take gets the same "Not found" an unrouted path gets, the same
# collapse Turso's and Workable's Recipes elsewhere in this collection
# record for their own providers.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - requestId is not reproduced. It is on every response this project
#     saw, success and failure alike, and it is a fresh value every time --
#     which this format has no mechanism for outside a resource's own minted
#     identifier, and an error envelope is not a resource. Fireworks'
#     Recipe in this collection states the identical gap for the identical
#     reason, on the field it names request_id.
#   - The x402 payment challenge is not reproduced beyond the two fields
#     Cauldron's error envelope can hold. The real 402 carries a
#     Payment-Required header, a WWW-Authenticate header naming a payment
#     scheme, and an extensions object with per-network USDC pricing and a
#     Sign-In-With-Ethereum-shaped attestation flow -- none of which has a
#     slot in this format, and reproducing any of it would mean pinning a
#     nonce and an issuedAt timestamp that are different on every real
#     response.
#   - Neither /search nor /contents has an observed 200. Reaching one costs
#     real money on Exa's own pricing and this project did not pay for one,
#     so every success case below is sourced to Exa's own worked examples
#     and carries no verified date. The field names quoted are Exa's, the
#     values are Exa's own "example:" or code-block literals, and the
#     fixture content around them -- title, url, summary text -- is this
#     Recipe's own, not anything scraped from a live result.
#   - /search's contents param, which can pull text, highlights or a summary
#     into a search response directly rather than through a second call to
#     /contents, is not modelled. This Recipe's /search route returns only
#     title, url, publishedDate, author and id; the fuller extraction fields
#     are modelled on /contents alone.
#   - No rate-limit header was found on any failure this project checked.
#     Exa's CORS policy lists Retry-After among the headers a browser is
#     allowed to read (access-control-expose-headers), which is not the same
#     as sending one, and none of the four failures above carried it.
#   - resolvedSearchType is documented as deprecated and is reproduced once,
#     as a constant, because a currently-deprecated field is still a field a
#     client written last year is reading.
#   - No upstream.spec. docs.exa.ai/openapi.json redirects to
#     exa.ai/docs/openapi.json, which answers 404 "Asset not found" --
#     checked directly -- so there is no machine-readable document at the
#     published location for a fingerprint to be taken of.

recipe: exa
capability: search
version: 0.1.0

upstream:
  api: unversioned
  docs: https://docs.exa.ai/reference/search
  # Found by cauldron discover rather than recorded by hand. This
  # document declares both routes this Recipe models, which is
  # evidence it belongs to this provider rather than proof.
  spec: https://api.exa.ai/openapi.json
  spec_hash: cc8631fe48db661c26c3744f0c929e67d1f1f4129572910a2fa74364fc0a63c9
  spec_seen: "2026-09-05"

auth:
  scheme: header
  header: x-api-key
  keys:
    - cauldron-exa-fixture-key-0000000000000000
  # See the header: a missing key and a wrong one are different failures
  # here, not a collapsed pair, and the fields exist for exactly this.
  absent_error: payment_required
  rejected_error: invalid_api_key
  # Verified both ways, on both routes: a wrong method and an unrouted path
  # both answer before any credential is examined.
  after_routing: true

responses:
  list:
    style: wrapped
    key: results
  # Flat rather than nested: requestId, error and tag all sit at the top
  # level, with nothing wrapping "error" the way Stripe wraps its own.
  error:
    style: flat
    message_field: error
    code_field: tag
    type_field: "-"
  resource:
    style: bare

resources:
  result:
    id:
      # Exa's own words: "a temporary document ID." Checked against the
      # worked example, it is literally the result's URL, not a minted
      # token -- id and url are the same string on the one example Exa
      # publishes.
      style: opaque
      field: id
    fields:
      title:
        type: string
        required: true
      url:
        type: string
        required: true
      # "An estimate of the creation date, from parsing HTML content" --
      # Exa's own description, and a publication estimate rather than a
      # crawl date. See the header.
      publishedDate:
        type: datetime
        null_when_unset: true
      author:
        type: string
        null_when_unset: true
      # Only reachable through /contents on this Recipe -- see the header's
      # stated gap on /search's own contents parameter.
      text:
        type: string
        null_when_unset: true
      highlights:
        type: list
      summary:
        type: string
        null_when_unset: true

routes:
  - method: POST
    path: /search
    resource: result
    operation: list
    pagination:
      # numResults, in the request body, from Exa's own openapi.json read
      # 2026-09-05 -- and no position. Neither the name nor the place
      # matched what the runtime was reading, which was "limit" in the query
      # string.
      #
      # The body's startCrawlDate and startPublishedDate look like positions
      # and are not: they are date filters on the document, so a client
      # resuming from one would silently re-read and re-skip rather than
      # page.
      style: cursor
      limit: 10
      limit_param: numResults
      cursor_param: "-"
      in: body
    # /search's default answer, without a contents request, is title, url,
    # publishedDate, author and id -- not the extraction fields, which this
    # Recipe reserves for /contents. See the header's stated gap.
    returns: [title, url, publishedDate, author, id]
    fields:
      # Documented as deprecated and reproduced once anyway -- see the
      # header.
      resolvedSearchType: neural
      # Exa's own example numbers for a neural search, cited and not
      # observed: reaching this costs real money and this project did not
      # pay for one.
      costDollars.total: 0.007
      costDollars.search.neural: 0.007

  - method: POST
    path: /contents
    resource: result
    operation: list
    pagination:
      # The body is ids and urls -- the caller names the documents and Exa
      # returns their contents. From its own openapi.json, read 2026-09-05:
      # no size, no position, nothing that could mean either. The request is
      # the collection.
      #
      # So this does not page, and the runtime was serving ten of it while
      # reading a "limit" nobody sends.
      style: none
    fields:
      costDollars.total: 0.003
      # The finding this Recipe exists for. Matches Exa's own worked
      # example: one document, fetched successfully, served from Exa's
      # index rather than crawled for this request. The id repeats the
      # fixture result's own id below, which is how a real statuses entry
      # ties back to its result.
      statuses:
        - id: https://cauldronup.example/papers/recipe-emulation
          status: success
          source: cached

errors:
  # What no credential gets: not an authentication failure, a bill. See the
  # header for why auth.absent_error names this and not a 401. Every
  # response on this host, success and failure alike, carries the same
  # charset-qualified type -- checked directly.
  payment_required:
    status: 402
    code: X402_PAYMENT_REQUIRED
    message: Payment required to access this resource
    headers:
      Content-Type: application/json; charset=utf-8

  # What a credential that is present and simply wrong gets.
  invalid_api_key:
    status: 401
    code: INVALID_API_KEY
    message: Invalid API key
    headers:
      Content-Type: application/json; charset=utf-8

  # Checked directly: a wrong method and an unrouted path answer the
  # identical shape, whether or not a credential was sent. Declared at 404
  # for both names, because Exa has no real 405 -- see the header.
  unknown_route:
    status: 404
    code: NOT_FOUND
    message: Not found
    headers:
      Content-Type: application/json; charset=utf-8

  method_not_allowed:
    status: 404
    code: NOT_FOUND
    message: Not found
    headers:
      Content-Type: application/json; charset=utf-8

fixtures:
  empty: {}

  papers:
    result:
      - id: https://cauldronup.example/papers/recipe-emulation
        title: "Cauldron: fixtures for API integrations"
        url: https://cauldronup.example/papers/recipe-emulation
        publishedDate: "2026-01-05T12:00:00.000Z"
        author: Cauldron Maintainers
        text: An emulator that models what a provider actually sends, not what its docs promise.
        highlights:
          - Modelled from documented examples; no key was ever held to call this live.
        summary: Cauldron models what a provider actually sends, not what its docs promise.

conformance:
  - name: no key at all is a bill, not a login failure
    source: https://api.exa.ai/search
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /search
      headers:
        Content-Type: application/json
      json:
        query: cauldron search recipe
    expect:
      status: 402
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: Payment required to access this resource
        tag: X402_PAYMENT_REQUIRED

  - name: an empty key header answers byte for byte the same bill as no header
    source: https://api.exa.ai/search
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /search
      headers:
        Content-Type: application/json
        x-api-key: ""
      json:
        query: cauldron search recipe
    expect:
      status: 402
      body:
        tag: X402_PAYMENT_REQUIRED

  - name: a key that is merely wrong is a different status and a different sentence
    source: https://api.exa.ai/search
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /search
      headers:
        Content-Type: application/json
        x-api-key: junkkey1234567890
      json:
        query: cauldron search recipe
    expect:
      status: 401
      body:
        error: Invalid API key
        tag: INVALID_API_KEY

  - name: no rate-limit header survives a wrong-key failure
    source: https://api.exa.ai/search
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /search
      headers:
        x-api-key: junkkey1234567890
      json:
        query: cauldron search recipe
    expect:
      status: 401
      absent_headers:
        - Retry-After
        - X-RateLimit-Limit
        - X-RateLimit-Remaining

  - name: /contents answers the identical two-verdict split /search does
    source: https://api.exa.ai/contents
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /contents
      headers:
        Content-Type: application/json
      json:
        urls:
          - https://example.com
    expect:
      status: 402
      body:
        tag: X402_PAYMENT_REQUIRED

  - name: and a wrong key on /contents is the same 401 /search sends
    source: https://api.exa.ai/contents
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /contents
      headers:
        x-api-key: junkkey1234567890
      json:
        urls:
          - https://example.com
    expect:
      status: 401
      body:
        error: Invalid API key
        tag: INVALID_API_KEY

  - name: a wrong method reaches the router before it reaches the credential
    # GET where POST is the only method /search has, and no credential sent
    # at all -- this is what proves the ordering, not merely the status.
    source: https://api.exa.ai/search
    verified: "2026-09-03"
    fixture: papers
    request:
      method: GET
      path: /search
    expect:
      status: 404
      body:
        error: Not found
        tag: NOT_FOUND

  - name: and a path this project invented answers the identical shape
    source: https://api.exa.ai/nosuchroute
    verified: "2026-09-03"
    fixture: papers
    request:
      method: POST
      path: /nosuchroute
      headers:
        x-api-key: junkkey1234567890
      json: {}
    expect:
      status: 404
      body:
        error: Not found
        tag: NOT_FOUND

  - name: a search result carries an estimated publication date, not a crawl date
    # Exa's own schema description for publishedDate, quoted in the header.
    # No key was held to call this live, so no verified date: the field
    # names and the date format are Exa's, the fixture content is this
    # Recipe's own.
    source: https://docs.exa.ai/reference/search
    fixture: papers
    request:
      method: POST
      path: /search
      headers:
        x-api-key: cauldron-exa-fixture-key-0000000000000000
      json:
        query: cauldron search recipe
    expect:
      status: 200
      body:
        "results[0].title": "Cauldron: fixtures for API integrations"
        "results[0].publishedDate": "2026-01-05T12:00:00.000Z"
        resolvedSearchType: neural
        "costDollars.total": 0.007
      absent:
        # /search's default answer, without a contents request -- see the
        # header's stated gap.
        - "results[0].text"
        - "results[0].highlights"

  - name: contents says explicitly whether a document was cached or crawled
    # The finding this Recipe exists for, quoted from Exa's own worked
    # example in the header. No key was held to call this live.
    source: https://docs.exa.ai/reference/get-contents
    fixture: papers
    request:
      method: POST
      path: /contents
      headers:
        x-api-key: cauldron-exa-fixture-key-0000000000000000
      json:
        ids:
          - https://cauldronup.example/papers/recipe-emulation
    expect:
      status: 200
      body:
        "results[0].text": An emulator that models what a provider actually sends, not what its docs promise.
        "statuses[0].status": success
        "statuses[0].source": cached
        "costDollars.total": 0.003

  # The names. This Recipe declares 4 field(s) on a result that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "a result carries the field names this Recipe declares"
    source: "https://docs.exa.ai/reference/search"
    fixture: papers
    request:
      method: POST
      path: "/search"
      headers:
        "x-api-key": "cauldron-exa-fixture-key-0000000000000000"
    expect:
      status: 200
      body:
        "results[0].author": "Cauldron Maintainers"
        "results[0].url": "https://cauldronup.example/papers/recipe-emulation"

