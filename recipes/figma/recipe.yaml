# Figma Recipe for Cauldron
#
# Written against Figma's published OpenAPI document at
# github.com/figma/rest-api-spec and struck live against api.figma.com on
# 2026-09-11 with no credential, with a deliberately invalid one in each of the
# two schemes it accepts, and on a path that does not exist.
#
# **The document declares 403 where the API answers 401.** `GET /v1/me` lists
# exactly four responses -- 200, 403, 429 and 500 -- and a request without a
# credential answers:
#
#   401 {"status":401,"err":"Missing credentials"}
#
# So the status every new integration meets first is the one status the
# operation does not declare, and the refusal it *does* declare is a different
# one. A client generated from this document has a branch for a refusal it will
# rarely see and none for the one it will see immediately.
#
# That is the fourth document in a week to omit the failure everyone meets:
# [middesk](../middesk) declares only the success, [close](../close) declares
# three failures and types them all as "Any type", [attentive](../attentive)
# declares five and gives none of them a body. Figma is the variant that
# declares a *different* status instead of none.
#
# **The failure field is called `err`.** Three letters, where the rest of this
# collection says `error`, `message`, `detail` or `reason`. It is required by
# the schema, alongside `status` -- which is the HTTP status again, as a
# number, in the body.
#
# **Both credential schemes are read, and both refusals are identical.**
# `X-Figma-Token: notreal` and `Authorization: Bearer notreal` each answer
# `{"status":401,"err":"Invalid token"}`. The document declares four schemes --
# `PersonalAccessToken`, `PlanAccessToken`, `OAuth2` and `OrgOAuth2` -- and
# applies them properly, per operation, which is worth saying after three
# providers this week that defined schemes and referenced none of them.
#
# **The three sentences are accurate and distinct.** "Missing credentials" for
# a request carrying none, "Invalid token" for one carrying a wrong one, and
# "Not found" for a path that does not exist. Three failures, three sentences,
# none of them describing the wrong one -- which is rarer here than it should
# be.
#
# **The user is an `allOf` of two schemas.** `{id, handle, img_url}`, all
# required, composed with `{email}`, also required. So the shape a client reads
# is assembled from two pieces and every field in it is guaranteed, including
# the avatar URL -- a user who has never set a picture still has one, because
# the schema does not allow otherwise.

recipe: figma
capability: files
version: 0.1.0

upstream:
  api: v1
  docs: https://www.figma.com/developers/api
  spec: https://raw.githubusercontent.com/figma/rest-api-spec/main/openapi/openapi.yaml
  spec_hash: f730b0f41da805835875b6ce1ce4ad70e32fcabd6775a424e59358def3a1605b
  spec_seen: "2026-09-11"

auth:
  # A personal access token in its own header. The API also reads
  # Authorization: Bearer for OAuth, and refuses both identically.
  scheme: header
  header: X-Figma-Token
  keys:
    - figd_cauldr0nf1xturet0ken00000000000000000
  # The same credential in a second place: this API reads an OAuth bearer
  # token too, and refuses a wrong one with the identical sentence.
  also:
    - scheme: bearer
      header: Authorization
      prefix: "Bearer "
  absent_error: missing_credentials
  rejected_error: invalid_token
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: flat
    # Three letters, where the rest of this collection says error, message,
    # detail or reason -- and required by the schema.
    message_field: err
    code_field: "-"
    # The HTTP status again, in the body, as a number.
    status_field: status

resources:
  user:
    id:
      field: id
      style: digits
    fields:
      handle:
        type: string
      email:
        type: string
      # Required by the schema, so a user who never set a picture still has
      # one.
      img_url:
        type: string

routes:
  - method: GET
    path: /v1/me
    resource: user
    operation: get
    # No identifier in the request: the endpoint answers about whoever the
    # credential belongs to.
    id_from: auth

errors:
  missing_credentials:
    status: 401
    # The status the document does not declare for this operation.
    message: Missing credentials

  invalid_token:
    status: 401
    message: Invalid token

  unknown_route:
    status: 404
    message: Not found

fixtures:
  empty:
    user: []

  account:
    user:
      - id: "1234567890123456789"
        handle: Ada Lovelace
        email: ada@example.invalid
        img_url: https://s3-alpha.figma.com/profile/cauldron-fixture

conformance:
  - name: a missing credential is a status the document does not declare
    source: https://api.figma.com/v1/me
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers: {}
    expect:
      # GET /v1/me declares 200, 403, 429 and 500. This is the response every
      # new integration meets first.
      status: 401
      body:
        status: 401
        err: Missing credentials

  - name: the failure field is three letters long
    source: https://api.figma.com/v1/me
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers: {}
    expect:
      status: 401
      # `err`, required by the schema alongside `status` -- which repeats the
      # status line as a number.
      body_matches: '"err"'

  - name: a wrong token in the personal-token header is refused
    source: https://api.figma.com/v1/me
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers:
        X-Figma-Token: notreal
    expect:
      status: 401
      body:
        # A different sentence from the missing case, and an accurate one.
        err: Invalid token
        status: 401

  - name: a wrong bearer token is refused identically
    source: https://api.figma.com/v1/me
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers:
        # The OAuth scheme, which this API also reads -- the document declares
        # four schemes and applies them per operation.
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        err: Invalid token

  - name: an unknown path has its own sentence
    source: https://api.figma.com/v1/cauldron-nope
    verified: "2026-09-11"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nope
      headers:
        X-Figma-Token: notreal
    expect:
      # Three failures, three sentences, none describing the wrong one.
      status: 404
      body:
        status: 404
        err: Not found

  - name: the user is a bare object with no envelope
    source: https://raw.githubusercontent.com/figma/rest-api-spec/main/openapi/openapi.yaml
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers:
        X-Figma-Token: figd_cauldr0nf1xturet0ken00000000000000000
    expect:
      status: 200
      body:
        handle: Ada Lovelace
        email: ada@example.invalid

  - name: every field on the user is required
    source: https://raw.githubusercontent.com/figma/rest-api-spec/main/openapi/openapi.yaml
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers:
        X-Figma-Token: figd_cauldr0nf1xturet0ken00000000000000000
    expect:
      status: 200
      body:
        # An allOf of {id, handle, img_url} and {email}, every one required --
        # so a user who never set a picture still has an img_url, because the
        # schema does not allow otherwise.
        id: "1234567890123456789"
        img_url: https://s3-alpha.figma.com/profile/cauldron-fixture

  - name: the identifier is a long number sent as text
    source: https://raw.githubusercontent.com/figma/rest-api-spec/main/openapi/openapi.yaml
    fixture: account
    request:
      method: GET
      path: /v1/me
      headers:
        X-Figma-Token: figd_cauldr0nf1xturet0ken00000000000000000
    expect:
      status: 200
      matches:
        # Nineteen digits, quoted, so a client that parses it to a number
        # loses the tail.
        id: '^[0-9]{15,20}$'
