# ngrok Recipe for Cauldron
#
# The endpoint listing, read from ngrok's own published Go client
# (ngrok-api-go/datatypes.go), and struck live against api.ngrok.com on
# 2026-09-13 with no header, with a wrong bearer, on a path that does not
# exist, and with a method the path does not take.
#
# **The refusal quotes your credential back in full.** Struck live, sending
# `Authorization: Bearer notarealtoken`:
#
#   {"error_code":"ERR_NGROK_202","status_code":403,"msg":"The API
#     authentication you specified does not look like a valid credential. Your
#     credential: 'notarealtoken'. API keys and instructions are available on
#     your dashboard: https://dashboard.ngrok.com/api-keys","details":{...}}
#
# Not the first few characters, not a mask: the whole value, in single quotes,
# in the message field a client prints and a log keeps. Send a real key by
# mistake to the wrong account and the response contains it.
#
# **The error code has an HTTP success in its name.** `ERR_NGROK_200`, on a 403,
# for a missing credential. `ERR_NGROK_202` is the wrong-credential one. The
# digits are a vendor catalogue number and they read as status codes.
#
# **And the status is 403 for having presented nothing.** Forbidden, to a caller
# the server has never heard from, with no `WWW-Authenticate` anywhere.
#
# **The field a client switches on is missing from some failures.** The 403s
# carry `error_code`; the 404 does not:
#
#   {"status_code":404,"msg":"Not Found","details":{"path":"/cauldron-nope"}}
#
# So `error_code` is the discriminator, and it is absent exactly when the
# request went somewhere unexpected.
#
# **`details` changes its keys per failure.** `{"operation_id": "op_..."}` on
# the 403s and `{"path": "/..."}` on the 404 -- one object, two disjoint
# shapes, and nothing naming which to expect.
#
# **A wrong method is reported as a path that is not there.** `PUT /endpoints`
# answers `{"status_code":404,"msg":"Not Found","details":{"path":"/endpoints"}}`
# -- the path echoed back inside the failure that denies it.
#
# **One address, five fields, two of them deprecated.** From the published type:
#
#   PublicURL   "deprecated [replaced by URL]: URL of the hostport served by this endpoint"
#   Hostport    "hostport served by this endpoint (hostname:port) -> soon to be deprecated"
#   Host, Port  the same thing, split
#   URL         "the url of the endpoint"
#
# A deprecated field, a field announced as "soon to be deprecated" in a struct
# comment with no date on it, the split form of that one, and the replacement --
# all on the same record, all populated.
#
# **`proto` is documented and `scheme` is not.** `Proto` is "protocol served by
# this endpoint. one of http, https, tcp, or tls"; `Scheme` beside it carries no
# comment at all and holds the same kind of value.
#
# **Every field is `omitzero`.** The vendor's own struct tags mean a port of 0,
# an empty description and an empty metadata string vanish from the wire, so a
# client cannot tell "not set" from "set to nothing".
#
# **And `metadata` and `traffic_policy` are strings.** "user-supplied metadata"
# typed `string`, and a policy document typed `string` beside it, on a record
# whose other references are objects.

recipe: ngrok
capability: infrastructure
version: 0.1.0

upstream:
  api: "2"
  docs: https://ngrok.com/docs/api/
  # No spec: ngrok publishes a generated Go client rather than the document it
  # was generated from, and no OpenAPI description is served at any address
  # this Recipe could find. The record shape below is that client's own types.

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu
  absent_error: authorization_header_required
  rejected_error: credential_not_valid
  after_routing: true

responses:
  list:
    style: wrapped
    key: endpoints
    # Null on the last page, and no count anywhere.
    cursor_field: next_page_uri
    cursor_null: true
    cursor_url: path
    fields:
      # "URI of the endpoints list API resource", carried on that resource.
      uri: /endpoints
  error:
    style: flat
    message_field: msg
    code_field: error_code
    # The HTTP status, again, in the body.
    status_field: status_code

resources:
  endpoint:
    id:
      field: id
      style: prefixed
      prefix: ep_
      length: 26
    fields:
      region:
        type: string
      created_at:
        type: string
      updated_at:
        type: string
      # "deprecated [replaced by URL]"
      public_url:
        type: string
      # Documented: one of http, https, tcp, or tls.
      proto:
        type: string
      # Not documented at all.
      scheme:
        type: string
      # "soon to be deprecated", said in a struct comment with no date.
      hostport:
        type: string
      # The same thing, split.
      host:
        type: string
      port:
        type: integer
      type:
        type: string
      # "user-supplied metadata", typed string.
      metadata:
        type: string
      description:
        type: string
      domain:
      tcp_addr:
      tunnel:
      edge:
      upstream_url:
        type: string
      upstream_protocol:
        type: string
      # The replacement for public_url.
      url:
        type: string
      principal:
      # A policy document, as a string.
      traffic_policy:
        type: string
      bindings:
        type: list

routes:
  - method: GET
    path: /endpoints
    resource: endpoint
    operation: list
    pagination:
      style: cursor
      limit: 100
      limit_param: limit
      cursor_param: before_id

errors:
  authorization_header_required:
    # Forbidden, to a caller who presented nothing at all.
    status: 403
    # An error code whose digits are an HTTP success.
    code: ERR_NGROK_200
    message: "The ngrok API requires that you set the Authorization header for authentication. Your API keys and instructions are available on your dashboard: https://dashboard.ngrok.com/api-keys"
    fields:
      details.operation_id: op_3JIDGTgfDS5a1PDezDlRjaRL96s

  credential_not_valid:
    status: 403
    code: ERR_NGROK_202
    # The whole credential, in single quotes, in the message.
    message: "The API authentication you specified does not look like a valid credential. Your credential: '{detail}'. API keys and instructions are available on your dashboard: https://dashboard.ngrok.com/api-keys"
    fields:
      details.operation_id: op_3JIDGR67NVa4Nl9vptQnvK12ALI

  unknown_route:
    status: 404
    # No error_code at all, on the failure a mistyped path gets.
    code_field: "-"
    message: Not Found
    fields:
      # A different key from the one the 403s use.
      details.path: "{detail}"

  method_not_allowed:
    status: 404
    code_field: "-"
    message: Not Found
    fields:
      # The path that does exist, echoed inside the failure denying it.
      details.path: /endpoints

fixtures:
  empty:
    endpoint: []

  live:
    endpoint:
      - id: ep_2cauldr0nf1xturek3y00000
        region: us
        created_at: "2026-08-14T10:22:41Z"
        updated_at: "2026-09-12T04:17:03Z"
        # The deprecated one...
        public_url: https://kettle.ngrok.app
        proto: https
        # ...and the undocumented one beside the documented one.
        scheme: https
        # The one that is soon to be deprecated...
        hostport: kettle.ngrok.app:443
        # ...and its split form...
        host: kettle.ngrok.app
        port: 443
        type: ephemeral
        metadata: '{"team":"platform"}'
        description: the kettle
        domain:
          id: rd_2cauldr0nf1xturedomain00
          uri: https://api.ngrok.com/reserved_domains/rd_2cauldr0nf1xturedomain00
        tcp_addr: null
        tunnel:
          id: tn_2cauldr0nf1xturetunnel00
          uri: https://api.ngrok.com/tunnels/tn_2cauldr0nf1xturetunnel00
        edge: null
        upstream_url: http://localhost:8080
        upstream_protocol: http1
        # ...and the replacement.
        url: https://kettle.ngrok.app
        principal:
          id: usr_2cauldr0nf1xtureuser000
          uri: https://api.ngrok.com/users/usr_2cauldr0nf1xtureuser000
        traffic_policy: 'on_http_request:\n  - actions:\n      - type: deny'
        bindings:
          - public
      - id: ep_2cauldr0nf1xturek3y00001
        region: eu
        created_at: "2026-09-01T09:00:00Z"
        updated_at: "2026-09-01T09:00:00Z"
        public_url: tcp://1.tcp.eu.ngrok.io:21345
        proto: tcp
        scheme: tcp
        hostport: 1.tcp.eu.ngrok.io:21345
        host: 1.tcp.eu.ngrok.io
        port: 21345
        type: cloud
        # Empty, which the vendor's own omitzero tags would erase.
        metadata: ""
        description: ""
        domain: null
        tcp_addr:
          id: ra_2cauldr0nf1xtureaddr0000
          uri: https://api.ngrok.com/reserved_addrs/ra_2cauldr0nf1xtureaddr0000
        tunnel: null
        edge: null
        upstream_url: tcp://localhost:5432
        upstream_protocol: ""
        url: tcp://1.tcp.eu.ngrok.io:21345
        principal:
          id: usr_2cauldr0nf1xtureuser000
          uri: https://api.ngrok.com/users/usr_2cauldr0nf1xtureuser000
        traffic_policy: ""
        bindings:
          - public

conformance:
  - name: the refusal quotes the credential back in full
    source: https://api.ngrok.com/endpoints
    verified: "2026-09-13"
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer notarealtoken"
    expect:
      status: 403
      body:
        # The whole value, in single quotes, in the field a client prints.
        msg: "The API authentication you specified does not look like a valid credential. Your credential: 'notarealtoken'. API keys and instructions are available on your dashboard: https://dashboard.ngrok.com/api-keys"
        error_code: ERR_NGROK_202
        status_code: 403

  - name: an error code whose digits are an HTTP success
    source: https://api.ngrok.com/endpoints
    verified: "2026-09-13"
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers: {}
    expect:
      # Forbidden, to a caller who presented nothing.
      status: 403
      body:
        # Two hundred, in the code on a four-oh-three.
        error_code: ERR_NGROK_200
        status_code: 403
        msg: "The ngrok API requires that you set the Authorization header for authentication. Your API keys and instructions are available on your dashboard: https://dashboard.ngrok.com/api-keys"
      matches:
        details.operation_id: '\Aop_[0-9A-Za-z]+\z'

  - name: the field a client switches on is missing from the 404
    source: https://api.ngrok.com/cauldron-nope
    verified: "2026-09-13"
    fixture: live
    request:
      method: GET
      path: /cauldron-nope
      headers: {}
    expect:
      status: 404
      body:
        msg: Not Found
        status_code: 404
        # A different key from the one the 403s put in details.
        details.path: /cauldron-nope
      absent:
        # The discriminator, gone exactly when the request went astray.
        - error_code

  - name: a wrong method echoes the path inside the failure denying it
    source: https://api.ngrok.com/endpoints
    verified: "2026-09-13"
    fixture: live
    request:
      method: PUT
      path: /endpoints
      headers: {}
    expect:
      status: 404
      body:
        msg: Not Found
        details.path: /endpoints
      absent:
        - error_code
        - details.operation_id

  - name: one address on five fields two of them deprecated
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
    expect:
      status: 200
      body:
        # "deprecated [replaced by URL]"...
        'endpoints[0].public_url': https://kettle.ngrok.app
        # ..."soon to be deprecated"...
        'endpoints[0].hostport': kettle.ngrok.app:443
        # ...its split form...
        'endpoints[0].host': kettle.ngrok.app
        'endpoints[0].port': 443
        # ...and the replacement, all populated at once.
        'endpoints[0].url': https://kettle.ngrok.app

  - name: one protocol field is documented and the one beside it is not
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
    expect:
      status: 200
      body:
        # "one of http, https, tcp, or tls", and no comment at all.
        'endpoints[0].proto': https
        'endpoints[0].scheme': https
        'endpoints[1].proto': tcp
        'endpoints[1].scheme': tcp
        'endpoints[0].type': ephemeral
        'endpoints[1].type': cloud
        'endpoints[0].region': us
        'endpoints[1].region': eu

  - name: metadata and a policy document are both strings
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
    expect:
      status: 200
      body:
        # JSON in a string, and YAML in a string, on a record whose
        # references are objects.
        'endpoints[0].metadata': '{"team":"platform"}'
        'endpoints[0].traffic_policy': 'on_http_request:\n  - actions:\n      - type: deny'
        # And empty strings, which the vendor's own omitzero tags erase.
        'endpoints[1].metadata': ""
        'endpoints[1].description': ""
        'endpoints[1].traffic_policy': ""
        'endpoints[1].upstream_protocol': ""
        'endpoints[0].description': the kettle

  - name: the references are objects of an id and its address
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
    expect:
      status: 200
      body:
        'endpoints[0].domain.id': rd_2cauldr0nf1xturedomain00
        'endpoints[0].domain.uri': https://api.ngrok.com/reserved_domains/rd_2cauldr0nf1xturedomain00
        'endpoints[0].tunnel.id': tn_2cauldr0nf1xturetunnel00
        'endpoints[0].tcp_addr': null
        'endpoints[0].edge': null
        'endpoints[1].tcp_addr.id': ra_2cauldr0nf1xtureaddr0000
        'endpoints[1].domain': null
        'endpoints[0].principal.uri': https://api.ngrok.com/users/usr_2cauldr0nf1xtureuser000
        'endpoints[0].upstream_url': http://localhost:8080
        'endpoints[0].upstream_protocol': http1
        'endpoints[0].bindings[0]': public
        'endpoints[0].created_at': "2026-08-14T10:22:41Z"
        'endpoints[0].updated_at': "2026-09-12T04:17:03Z"

  - name: the listing carries its own address and a next page that ends in null
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
      query:
        limit: "1"
    expect:
      status: 200
      body:
        # "URI of the endpoints list API resource", on the resource.
        uri: /endpoints
        'endpoints[0].id': ep_2cauldr0nf1xturek3y00000
      matches:
        next_page_uri: '\A/endpoints\?.*\z'

  - name: the cursor is the last identifier you were given
    source: https://github.com/ngrok/ngrok-api-go
    fixture: live
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
      query:
        limit: "1"
        before_id: ep_2cauldr0nf1xturek3y00000
    expect:
      status: 200
      body:
        'endpoints[0].id': ep_2cauldr0nf1xturek3y00001
        next_page_uri: null

  - name: an account with no endpoints sends a null next page and no count
    source: https://github.com/ngrok/ngrok-api-go
    fixture: empty
    request:
      method: GET
      path: /endpoints
      headers:
        Authorization: "Bearer 2cauldr0nf1xturek3y000000_1f1xtureF1xtureF1xtu"
    expect:
      status: 200
      body:
        # No total, no count: null is the whole signal.
        endpoints: []
        next_page_uri: null
        uri: /endpoints
