# Stripe Recipe for Cauldron
#
# Scope is deliberately narrow for now: customers and payment intents, which
# together cover the majority of what an application exercises locally. The
# Recipe records the API version it targets so drift is detectable rather than
# discovered in production.
#
# Keys below are fixtures, not secrets. A Recipe must never carry a real
# credential.

recipe: stripe
capability: payments
version: 0.1.0

upstream:
  api: "2026-06-30"
  docs: https://docs.stripe.com/api
  spec: https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json
  spec_hash: 8c8889e5107200ebdd0118e84eaca7b832cf5f447b41f8518f4c444ea46a40ea
  spec_seen: "2026-08-30"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_test_cauldron
  # Verified live against api.stripe.com 2026-09-05: no key at all gets a
  # long explain-yourself sentence, and a present, wrong key gets a short
  # one that echoes the key back. Two different messages, not one.
  absent_error: missing_api_key
  # Verified the same day: a path nothing declares and a wrong method both
  # answer "Unrecognized request URL" -- a 404, not the 401 above -- with no
  # key sent on either request, so routing wins before the credential is
  # ever judged.
  after_routing: true

responses:
  list:
    style: envelope
    url: true

resources:
  customer:
    # Stripe stamps every object with its type and livemode. Client libraries
    # and webhook handlers switch on them, so a fake without them is not one.
    constants:
      object: customer
      livemode: false
    id:
      prefix: cus_
      length: 14
    fields:
      email:
        type: string
        required: true
      name:
        type: string
      description:
        type: string
      currency:
        type: string
        default: usd
      # Arbitrary key-value pairs Stripe stores and hands back without knowing
      # what they mean, which is what type: map is for. Almost every Stripe
      # object has one and integrations lean on it heavily -- an order id, a
      # tenant, whatever the application needs to find its own record from a
      # webhook later.
      #
      # It has to be declared. A create used to echo any field it was sent, so
      # metadata worked without anybody saying it existed, and so did a typo.
      metadata:
        type: map
      created:
        type: timestamp

  payment_intent:
    constants:
      object: payment_intent
      livemode: false
    id:
      prefix: pi_
      length: 24
    fields:
      amount:
        type: integer
        required: true
      currency:
        type: string
        required: true
        default: usd
      customer:
        type: string
      # Stripe's lifecycle, not a simplification of it: applications branch on
      # every one of these values.
      status:
        type: string
        default: requires_payment_method
      description:
        type: string
      # The same free-form container the customer has. Stripe puts metadata on
      # nearly every object, and a payment intent is where an application most
      # often needs it: the webhook that arrives later carries the intent and
      # nothing else, so whatever lets you find your own record has to have
      # been attached here.
      metadata:
        type: map
      created:
        type: timestamp

routes:
  - method: POST
    path: /v1/customers
    resource: customer
    operation: create

  - method: GET
    path: /v1/customers/{id}
    resource: customer
    operation: get

  - method: POST
    path: /v1/customers/{id}
    resource: customer
    operation: update

  - method: DELETE
    path: /v1/customers/{id}
    resource: customer
    operation: delete
    # Stripe is one of the few that answers a delete with something: an id, an
    # object discriminator and deleted: true, and no other field of the
    # customer at all.
    deleted_body: receipt

  - method: GET
    path: /v1/customers
    resource: customer
    operation: list
    pagination:
      # Stripe's own description names both: limit, "between 1 and 100, and
      # the default is 10", and starting_after for the position, with
      # ending_before for the other direction. It has no parameter called
      # cursor, and this block declared the style and neither name, so the
      # runtime sent one.
      #
      # Stripe is where most of this project's vocabulary came from, which
      # is exactly why nobody looked.
      style: cursor
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: starting_after

  - method: POST
    path: /v1/payment_intents
    resource: payment_intent
    operation: create

  - method: GET
    path: /v1/payment_intents/{id}
    resource: payment_intent
    operation: get

  - method: GET
    path: /v1/payment_intents
    resource: payment_intent
    operation: list
    pagination:
      # Stripe's own description names both: limit, "between 1 and 100, and
      # the default is 10", and starting_after for the position, with
      # ending_before for the other direction. It has no parameter called
      # cursor, and this block declared the style and neither name, so the
      # runtime sent one.
      #
      # Stripe is where most of this project's vocabulary came from, which
      # is exactly why nobody looked.
      style: cursor
      limit: 10
      max_limit: 100
      limit_param: limit
      cursor_param: starting_after

webhooks:
  events:
    - customer.created
    - customer.updated
    - customer.deleted
    - payment_intent.created
    - payment_intent.succeeded
    - payment_intent.payment_failed
  # Stripe's event, in full. The default envelope this project falls back to
  # was modelled on this one and carries four of its fields; the rest are not
  # decoration.
  #
  # object: "event" is what the libraries check before treating a body as an
  # event at all. livemode is what an application branches on to decide
  # whether a charge was real. Both are absent from the default, so a handler
  # reading either got undefined -- and `if (event.livemode)` is false for
  # undefined, which happens to be right here and would be wrong the moment
  # anybody trusted it.
  payload:
    id: "{id}"
    object: event
    api_version: "2026-06-30"
    created: "{created}"
    type: "{event}"
    livemode: false
    # Nothing is waiting to be retried in a fake, and Stripe sends the count
    # rather than omitting it.
    pending_webhooks: 0
    # Present and null for an event the API did not cause. A handler reading
    # request.idempotency_key must cope with the object existing and the key
    # being absent, which is not the same as the object being missing.
    request:
      id: null
      idempotency_key: null
    data:
      object:
        "{object}": true
  signing:
    scheme: hmac-sha256
    header: Stripe-Signature
    secret: whsec_cauldron

# Named failure modes that `cauldron fault stripe --error rate_limit` injects.
# These are the paths most likely to break in production and least likely to be
# reachable in a provider's sandbox.
errors:
  rate_limit:
    status: 429
    code: rate_limit
    type: invalid_request_error
    message: Too many requests hit the API too quickly.
    headers:
      Retry-After: "1"

  card_declined:
    status: 402
    code: card_declined
    type: card_error
    message: Your card was declined.

  # Verified live 2026-09-05: a present, wrong key. Stripe echoes the key
  # back masked -- "sk_test_***************_000" -- which {detail} cannot
  # reproduce, since it carries the raw value this Recipe was given rather
  # than a masked one; the message below echoes it unmasked instead of
  # inventing a masking scheme this project does not implement.
  authentication_error:
    status: 401
    code: authentication_required
    type: invalid_request_error
    message: "Invalid API Key provided: {detail}"

  # Verified live 2026-09-05: no Authorization header at all. A different,
  # longer sentence than the wrong-key one above.
  missing_api_key:
    status: 401
    code: authentication_required
    type: invalid_request_error
    message: "You did not provide an API key. You need to provide your API key in the Authorization header, using Bearer auth (e.g. 'Authorization: Bearer YOUR_SECRET_KEY'). See https://stripe.com/docs/api#authentication for details, or we can help at https://support.stripe.com/."

  # Verified the same day: not a distinct 405. A path this Recipe -- or the
  # real API -- does not have, and a method a real path does not support,
  # answer the identical sentence. Real Stripe writes the method into it
  # ("Unrecognized request URL (GET: /v1/x)"); the path alone is what this
  # engine can hand an unrouted 404, so the method is not reproduced here.
  #
  # And there is no code on it. Stripe's 404 for an unrecognised URL carries a
  # message and a type and nothing else -- no error.code at all, where every
  # other failure in this table has one. code_field: "-" is what removes it,
  # and removing it matters more than it looks: this engine falls back to its
  # own internal name for the code when a Recipe does not give one, so leaving
  # the field out would have served "unknown_route", a word no provider uses,
  # to the most commonly hit error path in any integration.
  unknown_route:
    status: 404
    code_field: "-"
    type: invalid_request_error
    message: "Unrecognized request URL ({detail}). Please see https://stripe.com/docs or we can help at https://support.stripe.com/."

  # Verified the same day, on a real path with a method it does not
  # support: identical wording, the same 404, and no code on that one either.
  # Real Stripe writes "(DELETE: /v1/x)", with a colon after the method; this
  # engine's detail for a disallowed method is "DELETE /v1/x", so the case
  # below checks the substance of the sentence rather than that exact
  # punctuation.
  method_not_allowed:
    status: 404
    code_field: "-"
    type: invalid_request_error
    message: "Unrecognized request URL ({detail}). Please see https://stripe.com/docs or we can help at https://support.stripe.com/."

  api_error:
    status: 500
    code: api_error
    type: api_error
    message: An error occurred with our API.

  # Declared so the emulator reports Stripe's real categories rather than
  # inventing one type per code. Stripe has four types and dozens of codes.
  # {detail} is the request-specific part: Stripe names the object it could
  # not find, and the parameter it was not given.
  resource_missing:
    status: 404
    code: resource_missing
    type: invalid_request_error
    message: "No such {detail}."

  parameter_missing:
    status: 400
    code: parameter_missing
    type: invalid_request_error
    message: "Missing required param: {detail}."

fixtures:
  empty: {}

  small-shop:
    customer:
      - id: cus_00000000000001
        email: ada@example.com
        name: Ada Lovelace
        currency: gbp
      - id: cus_00000000000002
        email: grace@example.com
        name: Grace Hopper
        currency: usd
      # A third of each, because a paging case needs three records: one to
      # skip, one to return, and one to prove the page size stopped it. With
      # two, asking for a page of one after the first customer returns a
      # single record whether or not the size was read at all.
      - id: cus_00000000000003
        email: katherine@example.com
        name: Katherine Johnson
        currency: usd
    payment_intent:
      - id: pi_000000000000000000000001
        amount: 2500
        currency: gbp
        customer: cus_00000000000001
        status: succeeded
        description: Annual subscription
      - id: pi_000000000000000000000002
        amount: 1200
        currency: gbp
        customer: cus_00000000000002
        status: requires_payment_method
        description: Monthly subscription
      - id: pi_000000000000000000000003
        amount: 4900
        currency: usd
        customer: cus_00000000000003
        status: processing
        description: Hardware

# Conformance cases: checkable claims about Stripe, each with a citation.
#
# None of these carry a `verified` date yet, which the report states plainly.
# They were read from Stripe's published API reference, not observed against a
# live account, and until someone runs them against the real API that is a
# weaker kind of evidence. Saying so is the point.
conformance:
  - name: a created customer is stamped with its object type
    source: https://docs.stripe.com/api/customers/object
    fixture: empty
    request:
      method: POST
      path: /v1/customers
      headers:
        Authorization: Bearer sk_test_cauldron
      form:
        email: ada@example.com
        name: Ada Lovelace
    expect:
      status: 200
      headers:
        Content-Type: application/json
      body:
        object: customer
        email: ada@example.com
        name: Ada Lovelace
        livemode: false
      matches:
        id: '^cus_[A-Za-z0-9]{14}$'
        created: '^[0-9]{10}$'

  - name: an unknown customer is a 404 in the invalid_request_error category
    source: https://docs.stripe.com/error-handling
    request:
      method: GET
      path: /v1/customers/cus_nonexistent
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 404
      body:
        error:
          type: invalid_request_error
          code: resource_missing

  - name: a request without a key is rejected before it reaches a resource
    source: https://api.stripe.com/v1/customers
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/customers
    expect:
      status: 401
      body:
        error:
          type: invalid_request_error
      matches:
        error.message: '^You did not provide an API key\.'

  - name: a present, wrong key gets a shorter, different sentence than no key at all
    source: https://api.stripe.com/v1/customers
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/customers
      headers:
        Authorization: Bearer sk_test_garbage_invalid_000
    expect:
      status: 401
      body:
        error:
          type: invalid_request_error
      matches:
        error.message: '^Invalid API Key provided:'

  - name: a path nothing declares is a 404 saying so, not the 401 an unrouted request might suggest
    source: https://api.stripe.com/v1/not-a-real-endpoint
    verified: "2026-09-05"
    request:
      method: GET
      # No key sent. Routing answers first regardless.
      path: /v1/not-a-real-endpoint
    expect:
      status: 404
      body:
        error:
          type: invalid_request_error
      matches:
        error.message: 'Unrecognized request URL'
      # There is no code on this one. Every other failure Stripe answers has
      # one, and this is the failure most integrations meet most often, so a
      # client reading error.code to branch finds undefined exactly there.
      absent:
        - error.code

  - name: and neither does a method a real path does not support
    source: https://api.stripe.com/v1/customers
    verified: "2026-09-05"
    request:
      method: DELETE
      path: /v1/customers
    expect:
      status: 404
      body:
        error:
          type: invalid_request_error
      matches:
        error.message: 'Unrecognized request URL'
      absent:
        - error.code

  - name: creating a payment intent without an amount names the parameter
    source: https://docs.stripe.com/api/payment_intents/create
    request:
      method: POST
      path: /v1/payment_intents
      headers:
        Authorization: Bearer sk_test_cauldron
      form:
        currency: usd
    expect:
      status: 400
      body:
        error:
          type: invalid_request_error
          code: parameter_missing
      matches:
        error.message: '^Missing required param: amount\.$'

  - name: a list is an object with data, has_more and its own url
    source: https://docs.stripe.com/api/pagination
    fixture: small-shop
    request:
      method: GET
      path: /v1/customers
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        object: list
        url: /v1/customers
        has_more: false
      matches:
        data[0].id: '^cus_'
        data[0].object: '^customer$'
      absent:
        - next_cursor

  - name: limit caps a page and reports that more remain
    source: https://docs.stripe.com/api/pagination
    fixture: small-shop
    request:
      method: GET
      path: /v1/customers
      query:
        limit: "1"
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        has_more: true
      matches:
        data[0].id: '^cus_00000000000001$'
      # Stripe sends no cursor even when more pages remain: the caller passes
      # the last id back as starting_after. A convenience field here would let
      # code work locally and break in production.
      absent:
        - next_cursor

  # starting_after was declared and sent by nothing, which means it could have
  # been renamed to "cursor" -- the name the runtime reads when none is given --
  # and every case above would still have passed. Asserting the response to a
  # listing says nothing about which parameter produced it.
  - name: starting_after resumes after the customer it names
    source: https://docs.stripe.com/api/pagination
    fixture: small-shop
    request:
      method: GET
      path: /v1/customers
      query:
        limit: "1"
        starting_after: cus_00000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        has_more: true
      matches:
        # The second customer, not the first: the position moved. And exactly
        # one of them, with a third still behind it, so has_more is true for a
        # reason the fixture can actually produce.
        data[0].id: '^cus_00000000000002$'
      absent:
        - data[1]
        - next_cursor

  # The same pair on the other listing, because a parameter name is declared
  # per route and Stripe's consistency is a fact about Stripe rather than
  # something this Recipe may assume.
  - name: payment intents page by the same two names customers do
    source: https://docs.stripe.com/api/pagination
    fixture: small-shop
    request:
      method: GET
      path: /v1/payment_intents
      query:
        limit: "1"
        starting_after: pi_000000000000000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        has_more: true
      matches:
        data[0].id: '^pi_000000000000000000000002$'
      absent:
        - data[1]
        - next_cursor

  - name: a payment intent keeps the lifecycle status it was given
    source: https://docs.stripe.com/api/payment_intents/object
    fixture: small-shop
    request:
      method: GET
      path: /v1/payment_intents/pi_000000000000000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        object: payment_intent
        status: succeeded
        amount: 2500
        currency: gbp

  - name: a new payment intent starts at requires_payment_method
    source: https://docs.stripe.com/payments/paymentintents/lifecycle
    fixture: empty
    request:
      method: POST
      path: /v1/payment_intents
      headers:
        Authorization: Bearer sk_test_cauldron
      form:
        amount: "2500"
        currency: usd
    expect:
      status: 200
      body:
        object: payment_intent
        status: requires_payment_method
      matches:
        id: '^pi_[A-Za-z0-9]{24}$'

  - name: a delete answers with a receipt and not the customer
    source: https://docs.stripe.com/api/customers/delete
    fixture: small-shop
    request:
      method: DELETE
      path: /v1/customers/cus_00000000000001
      headers:
        Authorization: Bearer sk_test_cauldron
    expect:
      status: 200
      body:
        # Three fields, and none of them is the customer. Anything reading an
        # email address off a delete response finds nothing, and the object
        # discriminator is how a generic handler knows what was removed.
        id: cus_00000000000001
        object: customer
        deleted: true
      absent:
        - email
        - name

  - name: an event says it is an event, and says whether it was live
    source: https://docs.stripe.com/api/events/object
    fixture: small-shop
    request:
      method: POST
      path: /v1/customers
      headers:
        Authorization: Bearer sk_test_cauldron
      form:
        email: hopper@example.com
    expect:
      status: 200
      webhook:
        event: customer.created
        body:
          # What a library checks before treating a body as an event.
          object: event
          # What an application branches on to decide whether a charge was
          # real. Absent from the default envelope, where reading it gave
          # undefined -- falsy, and accidentally right, which is the worst
          # way for a check like this to pass.
          livemode: false
          pending_webhooks: 0
          type: customer.created
          # Present and null, which is not the same as the object being
          # missing: a handler reading request.idempotency_key must cope
          # with one and not the other.
          request.idempotency_key: null
          # The customer's own discriminator, not the event's.
          data.object.object: customer
        matches:
          id: '^evt_'
          data.object.id: '^cus_'

  # The record. This listing was answered already -- the route, the
  # status and the envelope beside it -- but only ever empty, so the
  # collection key and the field names under it had nothing asserting
  # them and could have been renamed to anything. This seeds a fixture
  # that holds 3 and asserts what came back.
  - name: "the customer listing answers with a record in it"
    source: "https://docs.stripe.com/api/pagination"
    fixture: small-shop
    request:
      method: GET
      path: "/v1/customers"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "data[0].name": "Ada Lovelace"
      absent:
        - "data[3]"

  # The record. This listing was answered already -- the route, the
  # status and the envelope beside it -- but only ever empty, so the
  # collection key and the field names under it had nothing asserting
  # them and could have been renamed to anything. This seeds a fixture
  # that holds 3 and asserts what came back.
  - name: "the payment_intent listing answers with a record in it"
    source: "https://docs.stripe.com/api/pagination"
    fixture: small-shop
    request:
      method: GET
      path: "/v1/payment_intents"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "data[0].id": "pi_000000000000000000000001"
      absent:
        - "data[3]"

  # The names. This Recipe declares 3 field(s) on a payment_intent that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 2 name(s) that came back at the paths they came
  # back under.
  - name: "a payment_intent carries the field names this Recipe declares"
    source: "https://docs.stripe.com/api/pagination"
    fixture: small-shop
    request:
      method: GET
      path: "/v1/payment_intents"
      query:
        "limit": "1"
        "starting_after": "pi_000000000000000000000001"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "data[0].customer": "cus_00000000000002"
        "data[0].description": "Monthly subscription"

  # The names. This Recipe declares 3 field(s) on a customer that no
  # case asserted, so each of them could have been renamed to anything
  # and every case would have stayed green. The runtime builds the
  # response out of the declaration and the fixture, so this seeds one
  # and asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "a customer carries the field names this Recipe declares"
    source: "https://docs.stripe.com/api/pagination"
    fixture: small-shop
    request:
      method: GET
      path: "/v1/customers"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "data[0].currency": "gbp"

  # The names. This Recipe declares 2 field(s) on a payment_intent that
  # no case asserted, so each of them could have been renamed to
  # anything and every case would have stayed green. The runtime builds
  # the response out of the declaration and the fixture, so this seeds
  # one and asserts the 1 name(s) that came back at the paths they came
  # back under.
  - name: "a payment_intent carries the field names this Recipe declares, and 1 more of them"
    source: "https://docs.stripe.com/api/pagination"
    fixture: small-shop
    request:
      method: GET
      path: "/v1/payment_intents"
      query:
        "limit": "1"
        "starting_after": "pi_000000000000000000000001"
      headers:
        "Authorization": "Bearer sk_test_cauldron"
    expect:
      status: 200
      body:
        "data[0].created": 1767225600



