# Stripe Recipe for Cauldron
#
# Scope is deliberately narrow for now: customers and payment intents, which
# together cover the majority of what an application exercises locally. The
# Recipe records the API version it targets so drift is detectable rather than
# discovered in production.
#
# Keys below are fixtures, not secrets. A Recipe must never carry a real
# credential.

recipe: stripe
version: 0.1.0

upstream:
  api: "2026-06-30"
  docs: https://docs.stripe.com/api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - sk_test_cauldron

resources:
  customer:
    id:
      prefix: cus_
      length: 14
    fields:
      email:
        type: string
        required: true
      name:
        type: string
      description:
        type: string
      currency:
        type: string
        default: usd
      created:
        type: timestamp

  payment_intent:
    id:
      prefix: pi_
      length: 24
    fields:
      amount:
        type: integer
        required: true
      currency:
        type: string
        required: true
        default: usd
      customer:
        type: string
      # Stripe's lifecycle, not a simplification of it: applications branch on
      # every one of these values.
      status:
        type: string
        default: requires_payment_method
      description:
        type: string
      created:
        type: timestamp

routes:
  - method: POST
    path: /v1/customers
    resource: customer
    operation: create

  - method: GET
    path: /v1/customers/{id}
    resource: customer
    operation: get

  - method: POST
    path: /v1/customers/{id}
    resource: customer
    operation: update

  - method: DELETE
    path: /v1/customers/{id}
    resource: customer
    operation: delete

  - method: GET
    path: /v1/customers
    resource: customer
    operation: list
    pagination:
      style: cursor
      limit: 10

  - method: POST
    path: /v1/payment_intents
    resource: payment_intent
    operation: create

  - method: GET
    path: /v1/payment_intents/{id}
    resource: payment_intent
    operation: get

  - method: GET
    path: /v1/payment_intents
    resource: payment_intent
    operation: list
    pagination:
      style: cursor
      limit: 10

webhooks:
  events:
    - customer.created
    - customer.updated
    - customer.deleted
    - payment_intent.created
    - payment_intent.succeeded
    - payment_intent.payment_failed
  signing:
    scheme: hmac-sha256
    header: Stripe-Signature
    secret: whsec_cauldron

# Named failure modes that `cauldron fault stripe --error rate_limit` injects.
# These are the paths most likely to break in production and least likely to be
# reachable in a provider's sandbox.
errors:
  rate_limit:
    status: 429
    code: rate_limit
    message: Too many requests hit the API too quickly.
    headers:
      Retry-After: "1"

  card_declined:
    status: 402
    code: card_declined
    message: Your card was declined.

  authentication_error:
    status: 401
    code: authentication_required
    message: Invalid API key provided.

  api_error:
    status: 500
    code: api_error
    message: An error occurred with our API.

fixtures:
  empty: {}

  small-shop:
    customer:
      - id: cus_00000000000001
        email: ada@example.com
        name: Ada Lovelace
        currency: gbp
      - id: cus_00000000000002
        email: grace@example.com
        name: Grace Hopper
        currency: usd
    payment_intent:
      - id: pi_000000000000000000000001
        amount: 2500
        currency: gbp
        customer: cus_00000000000001
        status: succeeded
        description: Annual subscription
