# Groq Recipe for Cauldron
#
# Two kinds of evidence, kept apart. Observed: struck live against
# api.groq.com on 2026-08-31, with no API key at all -- every case below
# carrying a `verified:` date was read off the wire that day, bytes, status
# line and headers included. Documented: everything else -- the chat
# completion shape, the model catalogue's extra fields, the usage timing
# breakdown -- is read from the OpenAPI 3.0.1 description GroqCloud's own
# docs page embeds and renders client-side, and carries no `verified:` date,
# because reaching those routes with a result needs an account, and a
# completion costs money. Nothing here was called with a real key, and
# nothing ever will be.
#
# A word on that description before anything else. console.groq.com/docs/
# api-reference does not publish it at its own URL -- there is no
# openapi.json a plain GET returns; api.groq.com/openapi.json and every
# sibling guess answer 404. The document exists only as JSON embedded inside
# the page's own React payload, extracted here by hand rather than fetched.
# `upstream.spec` and `spec_hash` are therefore both absent from this Recipe:
# recording a fingerprint implies `cauldron drift` can recompute it later by
# fetching the URL, and there is no URL a plain fetch would find anything
# at. Citing the docs page and dating the extraction is the honest version
# of that claim; the routes and schemas below all come from "GroqCloud API"
# version 2.1, read out of that page on 2026-08-31.
#
# Missing a key and sending the wrong one are the same failure here, byte
# for byte -- which puts Groq beside Mistral's own Recipe in this collection
# and away from xAI's. No Authorization header at all and a syntactically
# plausible bearer token that is not a real key both answer:
#
#   {"error":{"message":"Invalid API Key","type":"invalid_request_error","code":"invalid_api_key"}}
#
# 96 bytes, identical, every time -- confirmed against both GET
# /openai/v1/models and POST /openai/v1/chat/completions with an empty body,
# so the failure does not depend on the route either. There is exactly one
# authentication failure on this host, the same conclusion Mistral's Recipe
# reaches, by an entirely different route: Mistral answers a bare {"detail":
# "..."} with no envelope at all, and Groq answers something that nests
# under "error" the way OpenAI's own failures do -- message, type, code,
# and nothing else. No param. OpenAI's own Recipe in this collection
# describes param as required and nullable; Groq's failure does not carry
# it, present or absent-as-null, at all.
#
# A path nothing maps to is the sharpest departure from every other Recipe
# in this collection, and it is the one place Groq's OpenAI compatibility
# runs out entirely: the same envelope answers, at a status the Recipe's own
# vocabulary calls "unknown_route", but the METHOD is folded into the
# message rather than treated as a separate failure --
#
#   Unknown request URL: GET /openai/v1/nonexistent-path-xyz. Please check
#   the URL for typos, or see the docs at https://console.groq.com/docs/
#
# -- and sending the right path with the wrong verb answers the identical
# shape, not a 405. POST to /openai/v1/models -- a route that only ever
# declared GET -- answers 404 with "Unknown request URL: POST
# /openai/v1/models. ..." rather than the 405-with-Allow-header this
# runtime sends by default for a matched path and an unlisted method. That
# default had to be overridden by declaring method_not_allowed at 404
# itself, below, because on this host a wrong verb and a wrong path are the
# same failure: there is no way to be right about the path and wrong about
# the verb and be told so.
#
# Both of those, unknown route and wrong method, were reached with the
# fixture key present rather than absent -- see the fidelity gap below --
# but the message text asserted is exactly what the real host sent with no
# credential at all.
#
# Four more, from the description:
#
#   1. A groq-specific request id rides inside the body, not only in a
#      header. x_groq.id is "a groq request ID which can be used to refer
#      to a specific request to groq support" -- a second identifier,
#      independent of the completion's own id, that exists purely for a
#      support ticket. OpenAI's own CreateChatCompletionResponse has never
#      had a place for one.
#   2. Usage carries a clock, not only a count. queue_time, prompt_time,
#      completion_time and total_time are all declared on
#      CompletionUsage, in seconds, alongside the token counts OpenAI's own
#      Usage already has. A cost model built by counting tokens learns
#      nothing about how long a request actually took queued behind
#      somebody else's; this schema answers that question inside the same
#      object.
#   3. The model listing is the one place compatibility does not stop.
#      Model here is exactly {id, object, created, owned_by} -- the same
#      four fields, the same names, as OpenAI's own Model schema, with
#      nothing extra declared. That symmetry does not survive contact with
#      what the docs actually show being sent, which is the next finding.
#   4. The documented example contradicts the documented schema, on the
#      same page. Model's own schema declares four fields; the worked
#      example of GET /openai/v1/models answers seven, adding active
#      (boolean), context_window (integer) and public_apps (always null in
#      every entry shown) that the schema component never names at all. A
#      client generated straight from the schema has no field for any of
#      the three. The chat completion example carries its own version of
#      the same gap the other direction: CreateChatCompletionResponse's
#      choices item schema declares logprobs as required, and the worked
#      example of a completion omits it entirely.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No model runs. A completion answers with whatever the resource's own
#     defaults say, always the same shape, because a create route cannot
#     branch on what was asked -- OpenAI's own Recipe in this collection
#     says so about its own create route too. There is also no GET for a
#     stored completion in the description, so the create route's own
#     default is the only chat completion shape this Recipe can ever answer
#     with, the same conclusion Mistral's and xAI's Recipes reach about
#     their own hosts.
#   - The runtime checks credentials before it checks the route, for every
#     Recipe, unconditionally. Groq does the opposite for a path nothing
#     matches, observed with no key present at all, and this Recipe cannot
#     reproduce that ordering -- the same gap Mistral's and xAI's Recipes
#     both state about their own hosts. unknown_route and method_not_allowed
#     below are reached with the fixture key so the emulator's own table is
#     reached at all; the shapes they assert are the ones the real host sent
#     with no key whatsoever.
#   - unknown_route's message hardcodes the word GET rather than templating
#     the method the request actually used. The runtime's own unknown-route
#     fallback passes only the path as {detail}, never the method, so
#     templating it in would need a request that always used GET to stay
#     honest -- which the one case exercising this failure does, and no
#     other case arms it a second way to notice the hardcoding.
#   - A wrong-method request against a matched path still gets an Allow
#     header from this runtime, attached unconditionally the moment it takes
#     that branch, before the Recipe's own method_not_allowed entry is even
#     consulted. Real Groq sends no such header on that response. Declaring
#     method_not_allowed at 404 fixes the status, the body and the code;
#     it cannot reach the header this runtime adds ahead of it.
#   - x-groq-region and x-request-id are real headers, observed on every
#     response including every failure, and both carry a value that is
#     different on every real request -- an edge region code and a
#     generated id. The values declared below are fixed, the same
#     compromise this runtime's own rate-limit headers make elsewhere, and
#     the conformance cases against them assert shape rather than the
#     literal value.
#   - Streaming is not modelled.
#   - Audio (speech, transcription, translation), batches, embeddings,
#     files, reranking, responses and fine-tunings are declared in the
#     description and not modelled here, to match the surface the other
#     Recipes in this collection cover. Chat completions and models only.
#
# The key below is a fixture and belongs to no account.

recipe: groq
capability: ai
version: 0.1.0

upstream:
  api: v1
  docs: https://console.groq.com/docs/api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - gsk_cauldron00000000000000000000000000000000

responses:
  # {object, data}, nothing else -- the description's ListModelsResponse has
  # no paging fields, and the only list route this Recipe has is this one.
  list:
    style: wrapped
    key: data
    fields:
      object: list
  resource:
    style: bare
  # Nested under "error" the way OpenAI's own failures are, with three
  # properties rather than OpenAI's four: message, type, code, and no param
  # anywhere -- present, null, or otherwise.
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    type_field: type

resources:
  model:
    id:
      style: opaque
    constants:
      object: model
    fields:
      created:
        type: timestamp
      owned_by:
        type: string
      # Declared in the worked example on the same docs page and nowhere in
      # the Model schema component: always true in every entry shown.
      active:
        type: boolean
        default: true
      # Also absent from the schema. An integer ceiling OpenAI's own Model
      # has never carried.
      context_window:
        type: integer
      # Also absent from the schema, and null in every entry the docs page
      # shows -- never omitted, never a real value in any example.
      public_apps:
        type: list
        default: null

  # A create route cannot branch on what was asked, and the description has
  # no GET for a stored completion either -- the same conclusion Mistral's
  # and xAI's Recipes reach about their own hosts -- so the one shape below
  # is the only chat completion this Recipe can ever answer with. It mirrors
  # the docs page's own worked example: no logprobs, despite the schema
  # declaring it required, because the example the docs ship answers
  # without one.
  completion:
    id:
      style: prefixed
      prefix: "chatcmpl-"
    constants:
      object: chat.completion
    fields:
      created:
        type: timestamp
      model:
        type: string
      system_fingerprint:
        type: string
        default: fp_cauldron0001
      index:
        type: integer
        in: choices[0]
        as: index
        default: 0
      finish_reason:
        type: string
        in: choices[0]
        as: finish_reason
        default: stop
      role:
        type: string
        in: choices[0].message
        as: role
        default: assistant
      content:
        type: string
        in: choices[0].message
        as: content
        default: Fast language models answer before the question finishes rendering.
      prompt_tokens:
        type: integer
        in: usage
        as: prompt_tokens
        default: 18
      completion_tokens:
        type: integer
        in: usage
        as: completion_tokens
        default: 14
      total_tokens:
        type: integer
        in: usage
        as: total_tokens
        default: 32
      # Time, not tokens. OpenAI's own Usage has never carried a clock.
      queue_time:
        type: number
        in: usage
        as: queue_time
        default: 0.003912
      prompt_time:
        type: number
        in: usage
        as: prompt_time
        default: 0.000842
      completion_time:
        type: number
        in: usage
        as: completion_time
        default: 0.041667
      total_time:
        type: number
        in: usage
        as: total_time
        default: 0.042509
      # A second identifier, for a support ticket rather than for finding
      # the completion again. OpenAI's schema has no field for this at all.
      groq_request_id:
        type: string
        in: x_groq
        as: id
        default: req_cauldron000000000000000001

routes:
  - method: GET
    path: /openai/v1/models
    resource: model
    operation: list
    headers:
      x-groq-region: dls
      x-request-id: req_cauldron000000000000000002

  - method: GET
    path: /openai/v1/models/{id}
    resource: model
    operation: get

  - method: POST
    path: /openai/v1/chat/completions
    resource: completion
    operation: create
    # None of the request comes back. What is served is an answer and a
    # bill, the same claim Mistral's own Recipe in this collection makes
    # about its own completions route.
    returns:
      - id
      - object
      - created
      - model
      - system_fingerprint
      - index
      - finish_reason
      - role
      - content
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - queue_time
      - prompt_time
      - completion_time
      - total_time
      - groq_request_id

errors:
  # Observed on api.groq.com on 2026-08-31: no Authorization header at all,
  # and separately a syntactically plausible bearer token that is not a
  # real key, both against GET /openai/v1/models and against POST
  # /openai/v1/chat/completions with an empty body. Identical status,
  # identical 96-byte body, every time -- one authentication failure here,
  # not a pair, the same conclusion Mistral's Recipe reaches about its own
  # host.
  authentication_error:
    status: 401
    code: invalid_api_key
    type: invalid_request_error
    message: Invalid API Key
    headers:
      x-groq-region: dls
      x-request-id: req_cauldron000000000000000003

  # Observed the same day, against a path nothing maps to, with no
  # Authorization header sent whatsoever. The method is folded into the
  # sentence itself rather than carried as a separate fact -- see the
  # fidelity gap above about why {detail} here is always GET.
  unknown_route:
    status: 404
    code: unknown_url
    type: invalid_request_error
    message: "Unknown request URL: GET {detail}. Please check the URL for typos, or see the docs at https://console.groq.com/docs/"

  # Observed the same day: POST to /openai/v1/models, a route this
  # description only ever declares GET for. Not a 405 -- the identical
  # unknown-url shape unknown_route answers, with the method this time
  # carried correctly because the runtime's own method_not_allowed passes
  # "METHOD /path" as {detail}. Declaring this by name overrides the
  # runtime's default 405, which is the whole point: on this host a wrong
  # verb on a real path is not a distinct failure from a wrong path.
  method_not_allowed:
    status: 404
    code: unknown_url
    type: invalid_request_error
    message: "Unknown request URL: {detail}. Please check the URL for typos, or see the docs at https://console.groq.com/docs/"

fixtures:
  empty: {}

  catalogue:
    model:
      - id: llama-3.1-8b-instant
        created: 1693721698
        owned_by: Meta
        active: true
        context_window: 131072
        public_apps: null

      - id: whisper-large-v3
        created: 1693721698
        owned_by: OpenAI
        active: true
        context_window: 448
        public_apps: null

# Cases carrying `verified: "2026-08-31"` were checked that day against
# api.groq.com with no API key. The rest are derived from the OpenAPI
# description embedded in console.groq.com/docs/api-reference and carry no
# date, because reaching them with a result needs an account this Recipe
# will never hold.
conformance:
  - name: a missing credential and a wrong one answer the identical 96 bytes
    source: https://api.groq.com/openai/v1/models
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /openai/v1/models
    expect:
      status: 401
      body:
        "error.message": Invalid API Key
        "error.type": invalid_request_error
        "error.code": invalid_api_key
      header_matches:
        x-request-id: "^req_"
        x-groq-region: "^[a-z]{3}$"
      absent:
        - error.param
        - param

  - name: and so does a bearer token that merely looks real
    source: https://api.groq.com/openai/v1/models
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /openai/v1/models
      headers:
        Authorization: Bearer gsk_notarealkey00000000000000000000000000
    expect:
      status: 401
      body:
        "error.message": Invalid API Key
        "error.type": invalid_request_error
        "error.code": invalid_api_key

  - name: an empty chat completions body fails on the credential, never on the body
    # POST rather than GET, and a request with no JSON at all rather than
    # one with a header problem only -- the same 401, which means the body
    # is never even read while the credential is missing.
    source: https://api.groq.com/openai/v1/chat/completions
    verified: "2026-08-31"
    fixture: empty
    request:
      method: POST
      path: /openai/v1/chat/completions
    expect:
      status: 401
      body:
        "error.message": Invalid API Key
        "error.code": invalid_api_key

  - name: a path nothing maps to folds the method into the sentence, not a field
    # Observed with no Authorization header sent whatsoever. Sent here with
    # the fixture key so the emulator's own route table is reached -- see
    # the fidelity gap above about check order -- but the message asserted
    # is exactly what the real host sent with no credential present.
    source: https://api.groq.com/openai/v1/nonexistent-path-xyz
    verified: "2026-08-31"
    fixture: empty
    request:
      method: GET
      path: /openai/v1/nonexistent-path-xyz
      headers:
        Authorization: Bearer gsk_cauldron00000000000000000000000000000000
    expect:
      status: 404
      body:
        "error.message": "Unknown request URL: GET /openai/v1/nonexistent-path-xyz. Please check the URL for typos, or see the docs at https://console.groq.com/docs/"
        "error.code": unknown_url

  - name: a right path with the wrong verb is not a 405, it is the same unknown-url shape
    # Observed the same day against POST /openai/v1/models, a route this
    # description declares only GET for. There is no method_not_allowed
    # distinct from unknown_route on this host.
    source: https://api.groq.com/openai/v1/models
    verified: "2026-08-31"
    fixture: empty
    request:
      method: POST
      path: /openai/v1/models
      headers:
        Authorization: Bearer gsk_cauldron00000000000000000000000000000000
    expect:
      status: 404
      body:
        "error.message": "Unknown request URL: POST /openai/v1/models. Please check the URL for typos, or see the docs at https://console.groq.com/docs/"
        "error.code": unknown_url
      # Real Groq sends no Allow header on this response at all -- this
      # runtime attaches one unconditionally whenever it takes the
      # matched-path/wrong-method branch, before the Recipe's own
      # method_not_allowed entry is consulted, and nothing in the format can
      # suppress it. Stated as a fidelity gap above rather than asserted
      # here as though it were absent.

  - name: a model's schema and a model's worked example disagree about how many fields it has
    # active, context_window and public_apps are all in the docs page's own
    # worked example and none of them are in the Model schema component
    # sitting on the same page.
    source: https://console.groq.com/docs/api-reference
    fixture: catalogue
    request:
      method: GET
      path: /openai/v1/models
      headers:
        Authorization: Bearer gsk_cauldron00000000000000000000000000000000
    expect:
      status: 200
      body:
        object: list
        "data[0].id": llama-3.1-8b-instant
        "data[0].object": model
        "data[0].active": true
        "data[0].context_window": 131072
        "data[0].public_apps": null
      absent:
        - has_more
        - next_page_token

  - name: a completion's id looks like OpenAI's and its usage carries a clock OpenAI's never did
    source: https://console.groq.com/docs/api-reference
    fixture: empty
    request:
      method: POST
      path: /openai/v1/chat/completions
      headers:
        Authorization: Bearer gsk_cauldron00000000000000000000000000000000
      json:
        model: llama-3.3-70b-versatile
        messages:
          - role: user
            content: Explain the importance of fast language models
    expect:
      status: 200
      body:
        object: chat.completion
        "choices[0].finish_reason": stop
        "choices[0].message.role": assistant
        "usage.queue_time": 0.003912
        "usage.completion_time": 0.041667
        "usage.total_time": 0.042509
      matches:
        id: '^chatcmpl-'

  - name: a groq request id rides inside the body, for a support ticket rather than a lookup
    # x_groq.id is not the completion's own id -- OpenAI's schema has no
    # equivalent field anywhere on a chat completion.
    source: https://console.groq.com/docs/api-reference
    fixture: empty
    request:
      method: POST
      path: /openai/v1/chat/completions
      headers:
        Authorization: Bearer gsk_cauldron00000000000000000000000000000000
      json:
        model: llama-3.3-70b-versatile
        messages:
          - role: user
            content: Explain the importance of fast language models
    expect:
      status: 200
      body:
        "x_groq.id": req_cauldron000000000000000001
      matches:
        id: '^chatcmpl-'
