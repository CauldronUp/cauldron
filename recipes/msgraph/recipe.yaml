# Microsoft Graph Recipe for Cauldron
#
# Written against Microsoft's own generated OpenAPI 3.0.4 document --
# microsoftgraph/msgraph-metadata, openapi/v1.0/openapi.yaml, 44,146,442 bytes
# and 982,167 lines -- and struck live against graph.microsoft.com on
# 2026-09-07 with no credential and then with a deliberately invalid one.
#
# **11,493 paths and 17,777 operations, in 44MB.**
#
# The largest description in this collection by a wide margin:
# [infisical](../infisical)'s is 13MB and 2,317 operations, and this is three
# times the bytes and nearly eight times the operations. The title is "OData
# Service for namespace microsoft.graph", which is what a converter writes when
# it turns CSDL into OpenAPI, so the document is a translation rather than a
# description somebody wrote.
#
# **10,101 of the 11,493 path keys have to be quoted** -- 88% -- because OData
# puts `$`, `(` and `)` in URLs. A YAML reader handles that; a developer
# grepping the file for a path does not, because the quoting is not what they
# will type.
#
# **The longest path is 340 characters.**
#
#   /identityGovernance/entitlementManagement/resourceEnvironments/
#   {accessPackageResourceEnvironment-id}/resources/{accessPackageResource-id}/
#   roles/{accessPackageResourceRole-id}/resource/scopes/
#   {accessPackageResourceScope-id}/resource/uploadSessions/
#   {customDataProvidedResourceUploadSession-id}/files/
#   {customDataProvidedResourceFile-id}/$value
#
# Five identifiers to name one file, a placeholder called
# `{customDataProvidedResourceUploadSession-id}`, and `$value` on the end
# because OData addresses a raw property by suffix rather than by header.
#
# **A wrong token is answered with a library error code and a lesson about JWT
# serialisation.** Struck live:
#
#   GET /v1.0/me                    Authorization: Bearer notreal
#   401 {"error":{"code":"InvalidAuthenticationToken",
#                 "message":"IDX14100: JWT is not well formed, there are no dots (.).\nThe token needs to be in JWS or JWE Compact Serialization Format. (JWS): 'EncodedHeader.EncodedPayload.EncodedSignature'. (JWE): 'EncodedProtectedHeader.EncodedEncryptedKey.EncodedInitializationVector.EncodedCiphertext.EncodedAuthenticationTag'.", ...}}
#
# `IDX14100` is Microsoft.IdentityModel's own error identifier, and the
# sentences after it are that library's help text -- including a literal `\n`
# and two format templates. It is genuinely the most useful refusal in this
# batch and it is also a library internal on the wire: the code is not
# documented as part of Graph, and it changes when the library does.
#
# **`request-id` and `client-request-id` are the same value.**
# `client-request-id` is meant to echo what the caller sent in the
# `client-request-id` header. A caller who sends none gets Graph's own id in
# the field named for theirs -- so two fields carry one value and the one named
# for the client is the server's.
#
# **The timestamp inside the failure has no timezone.** `2026-09-07T21:07:01`
# -- no `Z`, no offset. The one time in the response is unanchored.
#
# **Three naming conventions in one small object.** `code`, `message` and
# `innerError` are camelCase; `request-id` and `client-request-id` are
# hyphenated; `date` is a bare word. All five are inside `error`.
#
# **An unknown path answers 401 rather than 404**, so route existence is not
# discoverable without a token -- which for a document with 11,493 paths is
# the one thing a caller might reasonably want to check.

recipe: msgraph
capability: identity
version: 0.1.0

upstream:
  api: v1.0
  docs: https://learn.microsoft.com/en-us/graph/api/overview
  spec: https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/master/openapi/v1.0/openapi.yaml
  spec_hash: 5eead5c438cbc12ffdde8258017f73c7f47cd82ee54697115a991236eae910f5
  spec_seen: "2026-09-07"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Three dot-separated segments. What is not shaped like one never reaches a
  # signature check, and gets the library's lesson about serialisation
  # formats instead.
  shape: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  keys:
    - eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature
  absent_error: token_empty
  shape_error: token_malformed
  rejected_error: token_empty

responses:
  list:
    style: wrapped
    key: value
    fields:
      # OData's context URL on every collection, naming the entity set and the
      # properties selected. A second description of the response's shape,
      # inside the response.
      "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#users"
    cursor_field: "@odata.nextLink"
    cursor_url: absolute
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    code_type: string
    type_field: "-"

resources:
  user:
    id:
      field: id
      style: uuid
    fields:
      displayName:
        type: string
      userPrincipalName:
        type: string
      mail:
        type: string
      jobTitle:
        type: string
      businessPhones:
        type: list

routes:
  - method: GET
    path: /v1.0/users
    resource: user
    operation: list
    pagination:
      # OData's, so the size parameter has a dollar in it and the cursor comes
      # back as a whole URL rather than a token.
      style: cursor
      limit: 100
      limit_param: "$top"
      cursor_param: "$skiptoken"

errors:
  token_empty:
    status: 401
    code: InvalidAuthenticationToken
    # Struck live for a request with no Authorization header. Four words, and
    # accurate.
    message: "Access token is empty."
    fields:
      error.innerError:
        # No timezone. The one time in the failure is unanchored.
        date: "2026-09-07T21:07:01"
        # The same value twice: client-request-id is meant to echo what the
        # caller sent, and a caller who sends none gets Graph's own id in the
        # field named for theirs.
        request-id: ee24bb94-3e83-45de-a1e3-9c5ceebf5af0
        client-request-id: ee24bb94-3e83-45de-a1e3-9c5ceebf5af0

  token_malformed:
    status: 401
    # The same code as the case above, so the machine-readable field cannot
    # separate "nothing" from "not a token" -- and the sentence, which can, is
    # a library's.
    code: InvalidAuthenticationToken
    message: "IDX14100: JWT is not well formed, there are no dots (.).\nThe token needs to be in JWS or JWE Compact Serialization Format. (JWS): 'EncodedHeader.EncodedPayload.EncodedSignature'. (JWE): 'EncodedProtectedHeader.EncodedEncryptedKey.EncodedInitializationVector.EncodedCiphertext.EncodedAuthenticationTag'."
    fields:
      error.innerError:
        date: "2026-09-07T21:07:02"
        request-id: 6d176ba1-7f11-45dc-8d0c-a374c4846534
        client-request-id: 6d176ba1-7f11-45dc-8d0c-a374c4846534

fixtures:
  empty:
    user: []

  tenant:
    user:
      - id: 4d8b1e37-9a02-4c65-b731-5f0c8ad2e914
        displayName: Ada Lovelace
        userPrincipalName: ada@cauldron.onmicrosoft.com
        mail: ada@cauldron.example
        jobTitle: Principal Engineer
        businessPhones:
          - "+1 555 0100"
      - id: 91c47f5a-6d38-4b02-8e19-72a0d5c3f846
        displayName: Grace Hopper
        userPrincipalName: grace@cauldron.onmicrosoft.com
        # No mailbox: a directory user without a licence has a principal name
        # and a null mail, so the two identifiers that look like addresses
        # disagree about whether one exists.
        mail: null
        jobTitle: Distinguished Engineer
        businessPhones: []

conformance:
  - name: no credential is four words
    source: https://graph.microsoft.com/v1.0/me
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers: {}
    expect:
      status: 401
      body:
        'error.code': InvalidAuthenticationToken
        'error.message': "Access token is empty."

  - name: a wrong token is answered with a library error code
    source: https://graph.microsoft.com/v1.0/me
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer notreal"
    expect:
      status: 401
      body:
        # IDX14100 is Microsoft.IdentityModel's own identifier, and what
        # follows is that library's help text -- two format templates and a
        # literal newline. The most useful refusal in this batch, and a
        # library internal on the wire.
        'error.message': "IDX14100: JWT is not well formed, there are no dots (.).\nThe token needs to be in JWS or JWE Compact Serialization Format. (JWS): 'EncodedHeader.EncodedPayload.EncodedSignature'. (JWE): 'EncodedProtectedHeader.EncodedEncryptedKey.EncodedInitializationVector.EncodedCiphertext.EncodedAuthenticationTag'."
        # The same code as the case above, so the field a client branches on
        # cannot tell the two apart.
        'error.code': InvalidAuthenticationToken

  - name: the two request ids are the same value
    source: https://graph.microsoft.com/v1.0/me
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers: {}
    expect:
      status: 401
      body:
        # client-request-id is meant to echo what the caller sent. A caller
        # who sends none gets Graph's own id in the field named for theirs.
        'error.innerError.request-id': ee24bb94-3e83-45de-a1e3-9c5ceebf5af0
        'error.innerError.client-request-id': ee24bb94-3e83-45de-a1e3-9c5ceebf5af0

  - name: the timestamp in the failure has no timezone
    source: https://graph.microsoft.com/v1.0/me
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers: {}
    expect:
      status: 401
      body:
        # No Z, no offset. The one time in the response is unanchored, and it
        # sits in an object whose other two keys are hyphenated while it is
        # not.
        'error.innerError.date': "2026-09-07T21:07:01"

  - name: an unknown path is a credential failure
    source: https://graph.microsoft.com/v1.0/cauldron-nope
    verified: "2026-09-07"
    fixture: tenant
    request:
      method: GET
      path: /v1.0/cauldron-nope
      headers: {}
    expect:
      # 401, not 404 -- so for a document with 11,493 paths, the one thing a
      # caller might reasonably want to check is the one thing they cannot.
      status: 401
      body:
        'error.code': InvalidAuthenticationToken

  - name: a collection describes its own shape in the response
    source: https://learn.microsoft.com/en-us/graph/api/user-list
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        # OData's context URL, naming the entity set and any projection --
        # a second description of the response's shape, inside the response,
        # under a key beginning with an at sign.
        "@odata.context": "https://graph.microsoft.com/v1.0/$metadata#users"
        'value[0].displayName': Ada Lovelace

  - name: a user without a mailbox has two disagreeing addresses
    source: https://learn.microsoft.com/en-us/graph/api/user-list
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        # userPrincipalName always looks like an address and is not one; mail
        # is the address and can be null. A client showing "the user's email"
        # has to know which, and only one of them is named for it.
        'value[1].userPrincipalName': grace@cauldron.onmicrosoft.com
        'value[1].mail': null

  - name: phone numbers are a list even when there is one
    source: https://learn.microsoft.com/en-us/graph/api/user-list
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        # businessPhones is plural and there is no mobilePhone in it -- that
        # is a separate singular field -- so a user's numbers are split across
        # two shapes by which desk they belong to.
        'value[0].businessPhones[0]': "+1 555 0100"
        'value[1].businessPhones': []
        'value[1].jobTitle': Distinguished Engineer

  - name: paging uses dollar-prefixed parameters and a whole URL
    source: https://learn.microsoft.com/en-us/graph/paging
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
      query:
        "$top": "1"
    expect:
      status: 200
      body:
        'value[0].id': 4d8b1e37-9a02-4c65-b731-5f0c8ad2e914
      matches:
        # A complete URL rather than a token, under a key beginning with an
        # at sign -- so a client cannot build the next request itself and has
        # to follow what it is given.
        "@odata.nextLink": '^http'

  - name: the last page carries no next link
    source: https://learn.microsoft.com/en-us/graph/paging
    fixture: tenant
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
      query:
        "$top": "1"
        # Sent by no other case, so this pins the skiptoken name -- which is
        # spelled without a camel hump in the middle, unlike every other
        # OData system query option.
        "$skiptoken": 4d8b1e37-9a02-4c65-b731-5f0c8ad2e914
    expect:
      status: 200
      body:
        'value[0].id': 91c47f5a-6d38-4b02-8e19-72a0d5c3f846
      absent:
        - "@odata.nextLink"

  - name: a tenant with no users answers an empty array
    source: https://learn.microsoft.com/en-us/graph/api/user-list
    fixture: empty
    request:
      method: GET
      path: /v1.0/users
      headers:
        Authorization: "Bearer eyJ0eXAiOiJKV1QifQ.eyJhdWQiOiJjYXVsZHJvbiJ9.cauldronfixturesignature"
    expect:
      status: 200
      body:
        value: []
