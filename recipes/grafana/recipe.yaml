# Grafana Recipe for Cauldron
#
# Two unique identifiers for one dashboard, and the one called id is the one
# you cannot use.
#
# A save answers with both. The response schema's required list is, verbatim,
# ["status", "title", "version", "id", "uid", "url"], and the two identifiers
# are described like this:
#
#   id   -- "ID The unique identifier (id) of the created/updated dashboard."
#   uid  -- "UID The unique identifier (uid) of the created/updated dashboard."
#
# The same sentence twice, for an int64 and a string. And there is exactly one
# path that fetches a dashboard -- /api/dashboards/uid/{uid} -- so the integer
# is required in every save response and can address nothing. It is the
# instance's row number: unique inside one Grafana and meaningless in the next,
# which is why exported dashboards travel by uid and why a deploy that stored
# the id has stored the one identifier that will not survive the move.
#
# The document says so about folders in as many words. Of folderId, on both
# the save command and the dashboard meta: "Deprecated: use FolderUID
# instead", sitting beside folderUid.
#
# Written against api-merged.json in grafana/grafana -- the Swagger 2.0
# document Grafana generates from its own handlers, 207 paths and 480
# definitions, and the source of every quotation here.
#
# Three more the Recipe pins:
#
#   1. A field called title carries the slug, and the document admits it. The
#      save response's title is described as "Slug The slug of the dashboard."
#      with the example "my-dashboard" -- a Go struct comment that landed on
#      the field next to the one it was written for. So the obvious way to
#      show a user what they just saved shows them a URL fragment.
#   2. The number you need in order to save is not on the thing you save. A
#      dashboard fetch answers {dashboard, meta}, the dashboard is free-form
#      JSON, and version lives in meta. Saving with a stale one is a 412
#      Precondition Failed, declared on the save alongside 400, 401, 403, 404,
#      422 and 500.
#   3. "May I change this" has five answers and none of them is about
#      provisioning. meta carries canAdmin, canDelete, canEdit, canSave and
#      canStar as separate booleans, and provisioned as a sixth field beside
#      them -- a dashboard defined by a file on disk can report canSave true.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The 412 is described above and not served. Grafana's save is an upsert
#     whose identifier lives inside a nested free-form document and whose
#     guard lives in a sibling meta object, so it is neither a create nor an
#     update in this format's terms. The version_field mechanism that serves
#     commercetools' 409 wants a version on the record itself.
#   - The dashboard body is free-form on purpose: it is whatever JSON the
#     panels serialise to, and this Recipe carries a fixture of one rather
#     than pretending to model panel schemas.
#   - Alerting, datasources, folders, users, teams, annotations, playlists,
#     snapshots and provisioning are absent. Dashboards and search only.
#   - This is the Grafana HTTP API as a self-hosted instance serves it. Grafana
#     Cloud adds a stack-management API on top, which is a second surface and
#     not this one.
#
# Grafana is self-hosted, so there is no shared host the way there is for a
# SaaS API -- except that Grafana Labs runs one publicly, at
# play.grafana.org, for exactly this kind of demonstration. Probed live on
# 2026-09-05:
#
#   1. play.grafana.org grants anonymous callers a Viewer role, so GET
#      .../dashboards/uid/{uid}, GET .../search and GET .../org all answer
#      normally with no credential at all -- an invented Basic credential
#      changes nothing. This is Play's own deliberate configuration for a
#      public demo, not a fact about Grafana's API in general, and it means
#      authentication_error below could not be struck: nothing this probe
#      could reach on this instance ever needed a credential to read.
#   2. What Play does refuse, unauthenticated: POST /api/dashboards/db (a
#      real write) answers 403 with an empty JSON object, {}. Not modelled
#      as authentication_error either -- Play's anonymous caller is
#      authenticated as Viewer and refused on entitlement, not on having no
#      credential at all, which is a different verdict from the one a
#      normal installation's unauthenticated caller gets.
#   3. GET .../dashboards/uid/{a uid that does not exist} answers 404
#      {"message":"Dashboard not found","title":"Not found"} -- confirming
#      the shape this file already modelled as resource_missing, except
#      the field was named status and the value was capitalised "Not
#      Found"; both wrong. Fixed below.
#   4. GET .../not-a-real-endpoint and PATCH on a real dashboard path (a
#      method this Recipe does not declare for it) both answer 404
#      {"message":"Not found"} -- the identical sentence as point 3, with
#      no title field at all, which is the one thing distinguishing an
#      unrouted request from a named resource's absence.
#
# The token and dashboards below are fixtures and belong to no instance.

recipe: grafana
capability: observability
version: 0.1.0

upstream:
  api: v1
  docs: https://grafana.com/docs/grafana/latest/developers/http_api/

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - glsa_CauldronFixtureServiceAccountToken_000000

responses:
  resource:
    style: bare
  list:
    # HitList is a bare array: no envelope, no count, no cursor.
    style: bare
  # Struck live: the second field is named title, not status, and its
  # value is "Not found", not "Not Found" -- both wrong before this probe.
  error:
    style: flat
    message_field: message
    code_field: title
    type_field: "-"

resources:
  dashboard:
    id:
      style: opaque
      # The uid names it in the path; the body carries it nested inside the
      # free-form dashboard document.
      field: "-"
    fields:
      dashboard:
        type: map
      meta:
        type: map

  hit:
    id:
      style: opaque
      field: uid
    fields:
      # The row number, beside the identifier that actually addresses things.
      # Stored under a name of its own because the record's key is taken: the
      # identifier here is the uid, and Grafana publishes both.
      row_id:
        type: integer
        as: id
      title:
        type: string
      uri:
        type: string
      url:
        type: string
      slug:
        type: string
      type:
        type: string
      tags:
        type: list
      isStarred:
        type: boolean
      isDeleted:
        type: boolean
      folderId:
        type: integer
      folderUid:
        type: string
      folderTitle:
        type: string

  saved:
    id:
      style: opaque
      field: uid
      length: 9
    fields:
      status:
        type: string
        default: success
      # "Slug The slug of the dashboard." -- the description of a field called
      # title.
      title:
        type: string
        default: a-new-dashboard
      version:
        type: integer
        default: 1
      row_id:
        type: integer
        as: id
        default: 24
      url:
        type: string
        default: /d/cauldronfx/a-new-dashboard
      folderUid:
        type: string

routes:
  - method: GET
    path: /api/dashboards/uid/{id}
    resource: dashboard
    operation: get

  - method: POST
    path: /api/dashboards/db
    resource: saved
    operation: create

  - method: GET
    path: /api/search
    resource: hit
    operation: list
    filters:
      - param: type
        field: type

errors:
  # Not struck: play.grafana.org grants anonymous callers a Viewer role, so
  # nothing this probe could reach ever needed a credential to read. Left
  # exactly as documented. See the header.
  authentication_error:
    status: 401
    message: Unauthorized
    code: Unauthorized

  # Struck live against a dashboard uid that does not exist: the field is
  # title, not status, and the value is "Not found", not "Not Found" --
  # both wrong before this probe.
  resource_missing:
    status: 404
    message: Dashboard not found
    code: "Not found"

  # Struck live with no credential at all: a path this API does not route
  # answers this, with no title field at all -- the one thing telling it
  # apart from resource_missing's shape.
  unknown_route:
    status: 404
    message: "Not found"
    code_field: "-"

  # Struck live against a real path with a method this Recipe does not
  # declare for it: the identical body an unrouted path gets.
  method_not_allowed:
    status: 404
    message: "Not found"
    code_field: "-"

  invalid_request:
    status: 400
    message: bad request data
    code: Bad Request

fixtures:
  empty: {}

  instance:
    dashboard:
      - id: cauldron01
        dashboard:
          # Free-form: whatever the panels serialise to. The identifiers live
          # in here, one of which is the row number.
          id: 17
          uid: cauldron01
          title: Checkout latency
          schemaVersion: 39
          version: 4
          panels: []
        meta:
          # The version that guards the next save, one object away from the
          # thing being saved.
          version: 4
          slug: checkout-latency
          url: /d/cauldron01/checkout-latency
          type: db
          canAdmin: true
          canDelete: true
          canEdit: true
          canSave: true
          canStar: true
          # And a sixth field, which none of the five accounts for.
          provisioned: true
          provisionedExternalId: checkout.json
          hasAcl: false
          isFolder: false
          folderId: 3
          folderUid: fldcauldron
          folderTitle: Payments
          created: "2026-02-04T10:00:00Z"
          updated: "2026-05-19T14:22:31Z"
          createdBy: cauldron
          updatedBy: cauldron

    hit:
      - id: cauldron01
        row_id: 17
        title: Checkout latency
        uri: db/checkout-latency
        url: /d/cauldron01/checkout-latency
        slug: checkout-latency
        type: dash-db
        tags:
          - payments
        isStarred: true
        isDeleted: false
        folderId: 3
        folderUid: fldcauldron
        folderTitle: Payments

      - id: cauldron02
        row_id: 18
        title: Deleted experiment
        uri: db/deleted-experiment
        url: /d/cauldron02/deleted-experiment
        slug: deleted-experiment
        type: dash-db
        tags: []
        isStarred: false
        # A search result can be a dashboard already in the bin.
        isDeleted: true
        folderId: 3
        folderUid: fldcauldron
        folderTitle: Payments

# The resource cases below are read from Grafana's own generated Swagger
# document rather than a real instance -- no installation for one was ever
# stood up. The refusal cases carrying a verified date were struck live
# against play.grafana.org, Grafana Labs's own public demo; see the header
# for what its anonymous-viewer configuration could and could not settle.
conformance:
  - name: a save answers with two unique identifiers for one dashboard
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: POST
      path: /api/dashboards/db
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
      json:
        dashboard:
          title: A new dashboard
          panels: []
        message: first version
    expect:
      status: 200
      body:
        # Both are required by the schema, and both are described with the
        # same sentence: "The unique identifier ... of the created/updated
        # dashboard."
        status: success
        version: 1
        id: 24
      matches:
        # And only this one can be used to fetch it back: the single dashboard
        # path is /api/dashboards/uid/{uid} and there is no id equivalent.
        uid: '^[A-Za-z0-9]{9}$'

  - name: the field called title carries the slug
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: POST
      path: /api/dashboards/db
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
      json:
        dashboard:
          title: A new dashboard
          panels: []
    expect:
      status: 200
      body:
        # "Slug The slug of the dashboard.", with the example "my-dashboard",
        # attached to a property named title. A struct comment one field out
        # of place, and it is the field a UI shows back to the user.
        title: a-new-dashboard

  - name: the version that guards a save is not on the dashboard
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/dashboards/uid/cauldron01
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        # Two halves. The dashboard is free-form JSON; the number a save must
        # send back to avoid a 412 lives in the other one.
        "meta.version": 4
        "dashboard.title": Checkout latency
        "dashboard.uid": cauldron01

  - name: may I change this has five answers and provisioning is not one
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/dashboards/uid/cauldron01
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        # canSave is true on a dashboard defined by a file on disk. The five
        # permission booleans are about who you are; provisioned is about
        # where the dashboard came from, and nothing reconciles them.
        "meta.canSave": true
        "meta.canEdit": true
        "meta.canDelete": true
        "meta.provisioned": true
        "meta.provisionedExternalId": checkout.json

  - name: the folder has two identifiers too and one is deprecated
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/dashboards/uid/cauldron01
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        # "Deprecated: use FolderUID instead" is the description of folderId,
        # which is still sent, still an int64, and still beside folderUid.
        "meta.folderId": 3
        "meta.folderUid": fldcauldron

  - name: search answers with a bare array and no envelope at all
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/search
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        # HitList is an array of Hit. No count, no cursor, no wrapper -- so
        # nothing tells a caller whether it has seen everything.
        "[0].uid": cauldron01
        "[0].id": 17
        "[0].folderUid": fldcauldron
      absent:
        - data
        - items

  - name: and a search hit can be a dashboard already in the bin
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/search
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        # isDeleted sits on a Hit beside permanentlyDeleteDate, so a listing
        # of dashboards includes ones that have been deleted and not yet
        # purged.
        "[1].uid": cauldron02
        "[1].isDeleted": true
        "[0].isDeleted": false

  - name: filtering search by type narrows it
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/search?type=dash-db
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 200
      body:
        "[0].type": dash-db
        "[1].type": dash-db

  - name: a token this instance does not know is refused
    # Not struck: play.grafana.org's anonymous Viewer role meant nothing
    # reachable there ever needed a credential to read. The field name
    # below is title rather than status on the strength of the same
    # convention confirmed live for resource_missing and unknown_route --
    # see the header -- but the value itself is doc-only.
    source: https://github.com/grafana/grafana/blob/main/public/api-merged.json
    fixture: instance
    request:
      method: GET
      path: /api/search
      headers:
        Authorization: Bearer glsa_NotThisInstancesToken_00000000000000
    expect:
      status: 401
      body:
        message: Unauthorized
        title: Unauthorized

  - name: a dashboard that does not exist names the field title, not status
    # Struck live against play.grafana.org with no credential at all --
    # reads need none there, so this is a resource lookup, not an auth
    # failure. The field is title and the value is "Not found", both
    # different from what this file declared before the probe. Sent here
    # with the fixture's own valid credential, because this emulator, unlike
    # Play, does not grant anonymous access.
    source: https://play.grafana.org/api/dashboards/uid/this-uid-does-not-exist-00000
    verified: "2026-09-05"
    fixture: instance
    request:
      method: GET
      path: /api/dashboards/uid/this-uid-does-not-exist-00000
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 404
      body:
        message: "Dashboard not found"
        title: "Not found"

  - name: a path this API does not route has no title field at all
    # Struck live with no credential at all against play.grafana.org --
    # reads need none there. The one thing distinguishing an unrouted
    # request from a named resource's absence. Sent here with the
    # fixture's own valid credential, because this emulator, unlike Play,
    # does not grant anonymous access and checks it before routing.
    source: https://play.grafana.org/api/not-a-real-endpoint
    verified: "2026-09-05"
    fixture: empty
    request:
      method: GET
      path: /api/not-a-real-endpoint
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 404
      body:
        message: "Not found"
      absent:
        - title

  - name: a wrong method on a real path is the identical bare 404
    # PATCH on a dashboard path, a method this Recipe does not declare for
    # it. Struck live against play.grafana.org with no credential at all --
    # reads need none there. Sent here with the fixture's own valid
    # credential, because this emulator, unlike Play, checks it before
    # routing.
    source: https://play.grafana.org/api/dashboards/uid/lAoEVhD7z
    verified: "2026-09-05"
    fixture: empty
    request:
      method: PATCH
      path: /api/dashboards/uid/lAoEVhD7z
      headers:
        Authorization: Bearer glsa_CauldronFixtureServiceAccountToken_000000
    expect:
      status: 404
      body:
        message: "Not found"
      absent:
        - title
