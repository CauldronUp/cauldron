# Buttondown Recipe for Cauldron
#
# This is the control case for a group of three newsletter platforms whose
# shared question is: is a subscriber a person or a subscription, and what
# happens to them when they unsubscribe? Buttondown is the one with an
# honest answer, in its own words, because it is the one of the three that
# actually publishes a machine-readable description of itself: a real
# OpenAPI 3.1 document at docs.buttondown.com/openapi.json, reached by
# following a real redirect chain from api.buttondown.email/v1/openapi.json
# -> https://docs.buttondown.com/openapi.json, checked live. Kit answers the
# same question by publishing two API generations with two credential
# schemes (recipes/kit/recipe.yaml). Substack does not answer it at all --
# see recipes/backlog for why no recipes/substack/recipe.yaml exists.
#
# The answer, in Buttondown's own schema text rather than derived from
# behaviour this project could not observe:
#
# A subscriber is a person, addressed by one id for life, and unsubscribing
# is a status change on that same record, not a deletion. The Subscriber
# schema's own `type` field is documented as "the subscriber's lifecycle
# state" with sixteen values -- regular, unsubscribed, premium, blocked,
# complained, undeliverable and eleven more -- and `unsubscribed` is one
# value among them, sitting beside `unsubscription_date` and
# `unsubscription_reason`, both nullable, both populated only once that
# transition happens. Nothing about the record's `id` changes when it does.
#
# Three more claims, all straight out of the schema for
# `POST /v1/subscribers`'s own `collision_behavior` parameter, quoted rather
# than paraphrased because paraphrasing a legal-shaped claim like this one is
# how a Recipe ends up asserting something the vendor did not:
#
#   "no_op" (the default): "will return a 400 error if a subscriber with the
#   same email address already exists." Creating a subscriber a second time
#   is refused, not silently accepted -- which is itself proof the record
#   persists after an unsubscribe, because this refusal fires whether the
#   existing subscriber is regular or unsubscribed. A provider that actually
#   deleted unsubscribed rows would let the second create through clean.
#
#   "add": "will merge the new subscriber data into the existing one. For
#   unsubscribed subscribers, this resubscribes them as regular when type is
#   omitted, or as unactivated ... " -- resubscribing reactivates the SAME
#   record. It does not mint a new id for the returning address.
#
#   "overwrite": "will overwrite the existing subscriber's data with the new
#   one. This cannot change terminal subscriber types (unsubscribed,
#   blocked, complained, undeliverable); those requests return a 400." So
#   even the collision path built to let a caller force a change is refused
#   for exactly the transition this Recipe's whole question is about.
#
# Only a genuine `DELETE /v1/subscribers/{id_or_email}` removes a record --
# 204 No Content, a real delete operation distinct from unsubscribing, and
# not one this project could exercise: no account exists to create a
# subscriber and delete it, so whether the address becomes free to re-add as
# a new id, or stays reserved, or behaves some third way, is not stated here
# because nothing could check it. That is the one half of the group's
# question this Recipe cannot close.
#
# Two credentials, checked live against api.buttondown.email today, and the
# split runs the opposite way from FireHydrant's in this collection: absence
# gets its own sentence and everything else -- wrong scheme (Basic), wrong
# prefix (Bearer), and a well-formed Token value that is simply not a real
# key -- collapses onto one:
#
#   nothing at all                         -> 401 authentication_missing
#                                              "No 'Authorization' header was
#                                              provided. Authenticate with:
#                                              Authorization: Token
#                                              <your-api-key>."
#   Authorization: Basic ...                -> 401 authentication_invalid
#   Authorization: Bearer junktoken12345    -> 401 authentication_invalid
#   Authorization: Token junktoken12345     -> 401 authentication_invalid
#                                              (byte-identical detail sentence
#                                              in all three cases)
#
# Struck against every one of GET (list), GET (single), POST, PATCH and
# DELETE on the subscribers surface, all five today, all five identical.
# Cauldron's own credential check distinguishes malformed (present, wrong
# shape) from rejected (present, right shape, wrong value); Buttondown's
# wire does not, so auth.malformed_error and auth.rejected_error both name
# the same errors entry below -- the honest way to say the wire collapses a
# distinction Cauldron's runtime is able to keep.
#
# Routing beats auth here, the same order Rootly's Recipe already
# documents in this collection and the opposite of FireHydrant's and
# Pipedream's: a path this API has never heard of answers its 404 whether or
# not a credential is attached, and a real path with the wrong method
# answers its 405 the same way. Checked live, all four combinations:
#
#   GET  /v1/this-does-not-exist   no cred   -> 404 (html doc, see below)
#   GET  /v1/this-does-not-exist   junk cred -> 404 (identical)
#   PUT  /v1/subscribers           no cred   -> 405, Allow: POST, GET
#   OPTIONS /v1/subscribers        no cred   -> 405, Allow: POST, GET
#
# Cauldron's own auth check runs unconditionally before the router is ever
# consulted (internal/runtime/handler.go), so -- exactly as Rootly's Recipe
# already states for the identical limitation -- the two conformance cases
# below demonstrating this shape have to carry a valid credential to reach
# it at all, a request this Recipe never made against the live API. They
# carry no verified date for that reason, even though the bodies they
# assert are the literal ones this Recipe watched happen.
#
# The unrouted 404 is worth describing precisely because it is not the JSON
# API at all: Content-Type: text/html; charset=utf-8, and the body is a
# genuine HTML document -- "The requested resource was not found on this
# server." -- a Django/gunicorn default page, nothing Buttondown wrote for
# this API specifically. Client code that calls .json() on a mistyped path
# throws on the doctype rather than reading a JSON error. The 405 is
# stranger still: Content-Type also claims text/html, and the body is
# eighteen bytes of plain text with no markup in it at all -- "Method not
# allowed" -- so the header is simply wrong about what it is serving. Three
# failure shapes on one host (JSON errors, an HTML 404 page, and a
# mislabelled plain-text 405) and no field anywhere ties them together.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - GET /v1/subscribers documents more than forty query filters (bounce
#     window, engagement rate, UTM attribution, risk score, coupon, price,
#     Stripe expansion...). None are modelled; this Recipe is about the
#     lifecycle question, not a complete filter surface.
#   - Stripe billing fields (stripe_customer_id, stripe_coupon,
#     gift_subscription_*, churn_date, upgrade_date) and engagement fields
#     (open_rate, click_rate, delivered_count, risk_score, firewall_reasons)
#     are real, documented properties of Subscriber and are not declared.
#   - next / previous on a list response are documented only as
#     {"type": "string"} with no worked example anywhere in the published
#     spec to say whether they carry a path or an absolute URL -- the exact
#     distinction this format's cursor_url exists to make (see
#     recipes/mezmo/recipe.yaml's own citation of the same mechanism). Rather
#     than guess, this Recipe serves count and leaves cursoring undeclared.
#   - The per-page size for GET /v1/subscribers is never stated anywhere in
#     the published schema -- only that paging is by ?page=N. No number is
#     guessed for it here.
#   - collision_behavior is documented in exhaustive prose (quoted above)
#     and is not mechanically modelled: Cauldron's create operation has no
#     primitive for "answer 200 and mutate an existing record instead of
#     201ing a new one depending on whether a lookup by a non-identifier
#     field succeeds." The plain, non-colliding create path is modelled;
#     the branching is described here instead, the same trade Census's
#     Recipe makes for a sync-run object it could evidence but not route.
#   - The 400/422 validation error codes (SubscriberInputValidationErrorCode:
#     email_already_exists, subscriber_already_exists, email_blocked, and a
#     dozen more) are a real published enum with no worked `detail` sentence
#     anywhere in the spec for any of them. The one conformance case that
#     touches this asserts the code by pattern against the two documented
#     values a same-email create could plausibly return, rather than
#     inventing which one it is or the English sentence beside it.
#   - id.style below is declared "prefixed" with a "sub_" prefix. The real
#     value is a TypeID (github.com/jetify-com/typeid: a fixed prefix plus a
#     26-character Crockford-base32 UUID), which this format has no style
#     name for -- the closest fit is used and the difference is stated
#     rather than silently rendered as a shorter or differently-alphabeted
#     string.
#
# Every case below not carrying a verified date was read from
# docs.buttondown.com/openapi.json (openapi: 3.1.0, info.title: "Buttondown
# API"), not observed against a real newsletter -- this Recipe was written
# with no credential and created no account. The key below is a fixture and
# belongs to no newsletter.

recipe: buttondown
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://docs.buttondown.com/api-subscribers-introduction
  spec: https://docs.buttondown.com/openapi.json
  spec_hash: cae35faad8a9ce4be1100551d43c386dd7f39db6f7220f8b76a838c4ad70399c
  spec_seen: "2026-09-01"

auth:
  scheme: header
  header: Authorization
  prefix: "Token "
  keys:
    - cauldron-buttondown-fixture-key-0000000000000000
  # Absent gets its own sentence; a well-formed-but-wrong value and a
  # wrong-shape value both land on the second one -- see the header. Naming
  # the same entry for both is how this Recipe says the wire does not keep
  # the distinction Cauldron's own check is able to make.
  absent_error: authentication_missing
  malformed_error: authentication_invalid
  rejected_error: authentication_invalid

responses:
  list:
    style: wrapped
    count_field: count
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: code
    type_field: "-"

resources:
  subscriber:
    collection: results
    id:
      # See the header: the closest fit for a TypeID, not an exact match.
      style: prefixed
      prefix: "sub_"
    # A path may address this record by email_address as well as by id --
    # GET/PATCH/DELETE /v1/subscribers/{id_or_email} is the provider's own
    # parameter name for exactly that, the same shape Jira's issue.alias
    # already uses in this collection for a numeric id and a project key.
    alias: email_address
    fields:
      email_address:
        type: string
      # Spelled creation_date, not created_at -- Buttondown's own word, not
      # this format's usual default.
      creation_date:
        type: datetime
      # The lifecycle field this whole Recipe exists to carry. See the
      # header for the full documented vocabulary; only the default and the
      # unsubscribed transition are exercised below.
      type:
        type: string
        default: regular
      unsubscription_date:
        type: datetime
        null_when_unset: true
      unsubscription_reason:
        type: string
        null_when_unset: true
      notes:
        type: string
        default: ""
      tags:
        type: list
      # A human-readable sequential counter, unique within the newsletter --
      # and, unlike Turso's DbId in this collection, not documented as
      # addressable on any path at all. The path takes id or email_address
      # only.
      secondary_id:
        type: integer
      # api, form, import, embedded_form and ten more. Defaulted to "api"
      # because every record this Recipe mints is one this Recipe made.
      source:
        type: string
        default: api
      # Free-form, arbitrary caller-defined keys -- Stripe's metadata shape,
      # per resource.go's own field type for exactly this case.
      metadata:
        type: map
        default: {}

routes:
  - method: GET
    path: /v1/subscribers
    resource: subscriber
    operation: list
    pagination:
      # No page size is ever stated in the published schema and no query
      # parameter for one is documented at all -- see the header. "-" says
      # so explicitly rather than leaving the runtime to guess "limit".
      style: page
      limit_param: "-"
      cursor_param: page
      first_page: 1

  - method: GET
    path: /v1/subscribers/{id}
    resource: subscriber
    operation: get

  - method: POST
    path: /v1/subscribers
    resource: subscriber
    operation: create
    status: 201

  - method: PATCH
    path: /v1/subscribers/{id}
    resource: subscriber
    operation: update

  - method: DELETE
    path: /v1/subscribers/{id}
    resource: subscriber
    operation: delete
    # No body at all, 204 -- the default, and the faithful one: see the
    # header for why this Recipe cannot say what becomes of the id
    # afterwards.

errors:
  # Nothing presented at all. Reached automatically by auth.absent_error,
  # for every one of GET, POST, PATCH and DELETE -- struck live against all
  # four today.
  authentication_missing:
    status: 401
    code: authentication_missing
    message_field: detail
    message: >-
      No 'Authorization' header was provided. Authenticate with:
      Authorization: Token <your-api-key>.
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      metadata:
        documentation_url: https://docs.buttondown.com/api-authentication

  # Something was presented and it does not check out -- wrong scheme, wrong
  # prefix, or a well-formed Token value nobody minted. See the header: all
  # three land here, byte-identical, struck live.
  authentication_invalid:
    status: 401
    code: authentication_invalid
    message_field: detail
    message: >-
      The provided token was invalid. Authenticate with: Authorization:
      Token <your-api-key>.
    headers:
      Content-Type: "application/json; charset=utf-8"
    fields:
      metadata:
        documentation_url: https://docs.buttondown.com/api-authentication

  # The reserved name Cauldron's own router falls back to for a path it has
  # no route for at all -- overridden here with the literal body this host
  # actually sends, a Django default error page rather than anything the
  # Buttondown API wrote. See the header for why the two cases exercising
  # this need a credential the live probes did not.
  unknown_route:
    status: 404
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
    message: |-
      <!doctype html>
      <html lang="en">
      <head>
        <title>Not Found</title>
      </head>
      <body>
        <h1>Not Found</h1><p>The requested resource was not found on this server.</p>
      </body>
      </html>

  # The reserved name for a real path asked for with a method nothing is
  # registered for. Content-Type still says text/html even though the body
  # below is plain text with no markup at all -- see the header.
  method_not_allowed:
    status: 405
    style: text
    headers:
      Content-Type: "text/html; charset=utf-8"
      Allow: "POST, GET"
    message: "Method not allowed"

  # collision_behavior's documented default (no_op) refusing a second create
  # for an email that already has a subscriber, of any type -- see the
  # header for the exact wording this is quoting. No worked JSON example
  # exists for it anywhere in the published spec, so the conformance case
  # below asserts the code by pattern against the two documented values that
  # could plausibly apply, rather than choosing one.
  subscriber_collision:
    status: 400
    code: subscriber_already_exists
    message_field: detail
    message: A subscriber with this email address already exists.

fixtures:
  empty: {}

  small-newsletter:
    subscriber:
      - id: sub_01h8xg4j3k2m1n0p9q8r7s6t5v
        email_address: alice@example.com
        creation_date: "2026-06-01T09:00:00.000Z"
        type: regular
        notes: ""
        tags:
          - founding-member
        secondary_id: 1
        source: api
        metadata: {}

      # The record this fixture exists to carry: still present, still
      # addressable by the same id, holding the two fields that only ever
      # populate once this transition happens. See the header.
      - id: sub_01jv2m9q8r7s6t5w4x3y2z1abc
        email_address: bob@example.com
        creation_date: "2026-05-14T11:00:00.000Z"
        type: unsubscribed
        unsubscription_date: "2026-08-20T14:32:00.000Z"
        unsubscription_reason: "no longer interested"
        notes: ""
        tags: []
        secondary_id: 2
        source: form
        metadata: {}

conformance:
  - name: no credential at all is refused with its own sentence
    source: https://api.buttondown.email/v1/subscribers
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers
    expect:
      status: 401
      headers:
        Content-Type: "application/json; charset=utf-8"
      body:
        code: authentication_missing
        detail: >-
          No 'Authorization' header was provided. Authenticate with:
          Authorization: Token <your-api-key>.

  - name: the wrong scheme entirely gets the other sentence
    source: https://api.buttondown.email/v1/subscribers
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers
      headers:
        Authorization: Basic amdvo2p1bms=
    expect:
      status: 401
      body:
        code: authentication_invalid
        detail: >-
          The provided token was invalid. Authenticate with: Authorization:
          Token <your-api-key>.

  - name: a well-formed token that is simply not real gets the identical sentence
    source: https://api.buttondown.email/v1/subscribers
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers
      headers:
        Authorization: Token junktoken12345
    expect:
      status: 401
      body:
        code: authentication_invalid
        detail: >-
          The provided token was invalid. Authenticate with: Authorization:
          Token <your-api-key>.

  - name: a create with no credential is refused the same way as a read
    source: https://api.buttondown.email/v1/subscribers
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: POST
      path: /v1/subscribers
      json: {}
    expect:
      status: 401
      body:
        code: authentication_missing

  - name: and so is an update
    source: https://api.buttondown.email/v1/subscribers/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: PATCH
      path: /v1/subscribers/sub_01h8xg4j3k2m1n0p9q8r7s6t5v
      json: {}
    expect:
      status: 401
      body:
        code: authentication_missing

  - name: and so is a delete
    source: https://api.buttondown.email/v1/subscribers/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: small-newsletter
    request:
      method: DELETE
      path: /v1/subscribers/sub_01h8xg4j3k2m1n0p9q8r7s6t5v
    expect:
      status: 401
      body:
        code: authentication_missing

  - name: an unrouted path answers a Django 404 page, not a JSON error
    # Struck live with no credential and again with a junk one; both
    # answered this identical body. Reaching it here needs a valid
    # credential regardless -- Cauldron's own auth check is unconditional
    # and runs before routing, the opposite of this host's real order. See
    # the header.
    source: https://api.buttondown.email/v1/this-is-not-a-real-endpoint
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/this-is-not-a-real-endpoint
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 404
      headers:
        Content-Type: "text/html; charset=utf-8"
      body_matches: "The requested resource was not found on this server\\."

  - name: a wrong method on a real path is a real 405 with an Allow header
    # Struck live with no credential (PUT and OPTIONS both, identical). Same
    # caveat as above about needing a credential to reach this through
    # Cauldron.
    source: https://api.buttondown.email/v1/subscribers
    fixture: small-newsletter
    request:
      method: PUT
      path: /v1/subscribers
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 405
      headers:
        Allow: "POST, GET"
      body_matches: "^Method not allowed$"

  - name: a listing wraps its array under results, beside a total count
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        count: 2
        "results[0].email_address": alice@example.com
        "results[1].email_address": bob@example.com

  - name: an unsubscribed record is still there, at the same id, carrying why and when
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers/sub_01jv2m9q8r7s6t5w4x3y2z1abc
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        id: sub_01jv2m9q8r7s6t5w4x3y2z1abc
        email_address: bob@example.com
        type: unsubscribed
        unsubscription_date: "2026-08-20T14:32:00.000Z"
        unsubscription_reason: "no longer interested"

  - name: the same record is reachable by email address as well as by id
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: GET
      path: /v1/subscribers/bob@example.com
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 200
      body:
        id: sub_01jv2m9q8r7s6t5w4x3y2z1abc
        type: unsubscribed

  - name: a newly created subscriber starts out regular and unlisted for unsubscription
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: POST
      path: /v1/subscribers
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
      json:
        email_address: carol@example.com
    expect:
      status: 201
      body:
        email_address: carol@example.com
        type: regular
        # Pydantic/FastAPI-shaped response models serialise every declared
        # field, required or not -- an unset nullable field arrives as an
        # explicit null, not a missing key. See null_when_unset above.
        unsubscription_date: null
        unsubscription_reason: null

  - name: creating a second subscriber for an email that already exists is refused, not accepted
    # Quoting collision_behavior's own default -- see the header. The exact
    # code is asserted by pattern rather than chosen, because no worked
    # example anywhere in the published spec pins it to one of the two
    # documented candidates.
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    arm: subscriber_collision
    request:
      method: POST
      path: /v1/subscribers
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
      json:
        email_address: alice@example.com
    expect:
      status: 400
      matches:
        code: "^(email_already_exists|subscriber_already_exists)$"

  - name: a PATCH to type moves a record into the unsubscribed state without touching its id
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: PATCH
      path: /v1/subscribers/sub_01h8xg4j3k2m1n0p9q8r7s6t5v
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
      json:
        type: unsubscribed
        unsubscription_reason: requested by admin
    expect:
      status: 200
      body:
        id: sub_01h8xg4j3k2m1n0p9q8r7s6t5v
        type: unsubscribed
        unsubscription_reason: requested by admin

  - name: deleting a subscriber answers no body at all
    source: https://docs.buttondown.com/openapi.json
    fixture: small-newsletter
    request:
      method: DELETE
      path: /v1/subscribers/sub_01h8xg4j3k2m1n0p9q8r7s6t5v
      headers:
        Authorization: Token cauldron-buttondown-fixture-key-0000000000000000
    expect:
      status: 204
      no_body: true
