# Rippling Recipe for Cauldron
#
# Rippling renamed its developer surface recently. developer.rippling.com now
# documents a "REST API" (documentation/rest-api/reference/list-workers,
# .../get-employment-types) that talks about "workers," beside an older
# "Base API" section (documentation/base-api/reference/get-employees,
# .../get-employees-include-terminated) that talks about "employees." The
# question this Recipe was written to answer first was whether the wire moved
# when the docs did.
#
# It did not. Struck live, no credential:
#
#   GET /platform/api/employees          -> 401, real route
#   GET /platform/api/workers            -> 404, no such route
#   GET /platform/api/employment_types   -> 401, real route
#
# api.rippling.com/platform/api/ -- the old, "Base API" host -- is still what
# answers. "Workers" is a name the documentation adopted; the resource on the
# wire is still called "employees," and a client written against the older
# docs has not been left behind by anything except the reading experience.
# A third-party OpenAPI mirror of Rippling's own spec agrees: server URL
# https://api.rippling.com, paths /platform/api/employees and
# /platform/api/employees/{employee_id}
# (github.com/api-evangelist/rippling, openapi/rippling-platform-api-openapi.yml).
#
# Every credential shape this Recipe tried against a real route answered the
# identical body, byte for byte:
#
#   (no header at all)                                  -> 401
#   Authorization: Bearer junktoken12345                -> 401
#   Authorization: junktoken12345          (no scheme)  -> 401
#   Authorization: Bearer eyJ...(JWT-shaped, well-formed)-> 401
#
#   {"detail":"Authentication credentials were not provided."}
#
# every one of them, including the JWT-shaped value that at least looks like
# something a real client might send. That sentence is Django REST
# Framework's own default for "nothing I recognise as a credential arrived,"
# and Rippling never reaches past it to say a token was merely wrong -- an
# absent header and a well-formed-but-rejected bearer token are the same
# verdict here, not three the way Fireworks or Together split them. No
# absent_error, malformed_error or rejected_error is declared below because
# there is nothing to split: one message covers every shape that was tried.
#
# The routing order is the "route, then credential, then method" arrangement
# together/recipe.yaml's header names, not the after_routing flag Fireworks
# declares. Struck live, all with no credential:
#
#   GET /platform/api/employees            -> 401 (route exists)
#   PATCH /platform/api/employees          -> 401, not 405 (route exists,
#                                              method not, credential wins)
#   OPTIONS /platform/api/employees        -> 401, not a CORS preflight pass
#   GET /platform/api/nosuchroute12345     -> 404, HTML (route does not exist)
#   GET /platform/api/nosuchroute12345
#     with Authorization: Bearer junktoken12345 -> 404, identical HTML
#
# A route Cauldron's router does recognise refuses for its credentials before
# it ever looks at the method, which after_routing cannot express -- that flag
# makes an unmatched method answer 405 unconditionally, and this host never
# sent one. So auth.after_routing is left unset (the default: checked first,
# unconditionally) and the two routes below both carry only error-shaped
# cases, all struck with a real credential-less or wrong-credential request.
# The 404 for a route this Recipe does not know about is real and reproduced
# above rather than in a case: it is Cloudflare and the marketing site's own
# "Not Found!" page (a CF challenge-platform script, no relation to the JSON
# api.rippling.com/platform/api/ answers with), and Cauldron's default auth
# would need a credential this Recipe has never verified works in order to
# reach it -- see rootly/recipe.yaml for the same workaround used honestly;
# here the body itself is Cloudflare boilerplate rather than anything
# Rippling's own application emits, so it is described here and not served.
#
# The Allow header is worth recording even though nothing here ever earns a
# 405. GET /platform/api/employees allows GET, POST, HEAD, OPTIONS; GET
# /platform/api/employees/{id} allows GET, PUT, PATCH, DELETE, HEAD, OPTIONS
# -- both struck live, both attached to the credential failure itself, so the
# shape of the collection route and the shape of the item route are visible
# without ever authenticating.
#
# The question this whole batch exists to answer -- does a terminated
# employee still appear in the default listing, and can a caller tell
# "terminated" from "never existed" -- could not be settled against the wire.
# developer.rippling.com requires signing in with a Rippling account to read
# anything past a reference page's URL slug; this Recipe declines to create
# one, per the standing rule against creating accounts to probe an API. What
# survives is the slug itself, publicly indexed before the site required a
# login: a page named "GET Employees (Including Terminated)"
# (developer.rippling.com/documentation/base-api/reference/get-employees-include-terminated)
# sits beside the plain "GET Employees" page. Two separately named endpoints
# for the same resource, one of them explicitly carved out to include
# terminated employees, is real evidence that the plain one does not --
# but it is evidence about a sitemap, not a response body, and it is recorded
# in this header rather than turned into a field or a route.
#
# A third-party integration guide (stitchflow.com/user-management/rippling/api,
# not Rippling's own materials) describes an employmentStatus field
# (ACTIVE / INACTIVE / TERMINATED) and an endDate field, and hedges on
# whether the default list includes terminated employees ("may be excluded
# by default; check filter params"). That hedge is the guide's own word
# choice, not this Recipe's, and nothing below asserts either field exists:
# no worked example of either was found anywhere this Recipe could read, so
# no fixture and no resource field claims them. Employee id reuse is not
# addressed by anything this Recipe found either, from Rippling or from a
# third party; it is left unestablished rather than guessed.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No resource fields are declared at all. The employee resource below
#     exists to carry the two live routes and nothing else: id only, no
#     name, no status, no dates. Every field on a real employee record sits
#     behind the account this Recipe declined to create, and the only
#     third-party description of them is hedged, not a worked example.
#   - No 200 response is modelled anywhere in this Recipe. No credential
#     that authenticates against a real Rippling company was ever available,
#     so no successful shape -- envelope, pagination, field names -- was ever
#     observed, and none is guessed here.
#   - OAuth token issuance, webhooks, and every write operation are entirely
#     unmodelled.
#
# The key below is a fixture and belongs to no account. Every conformance
# case below either was struck live against api.rippling.com on the date
# shown, or (the two 404 cases) states plainly that it was not.

recipe: rippling
capability: hr
version: 0.1.0

upstream:
  api: v1
  docs: https://developer.rippling.com/documentation/rest-api

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron-rippling-fixture-token-0000000000000000

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: detail
    code_field: "-"
    type_field: "-"

resources:
  # Carries the two live routes below and nothing else -- see the header for
  # why no business field is declared. presence exists only because a
  # resource with zero fields is refused; in: "-" keeps it off the wire
  # entirely, the same device mezmo/recipe.yaml uses for its own event
  # resource and for the identical reason: nothing was ever observed to put
  # here honestly.
  employee:
    id:
      style: opaque
    fields:
      presence:
        type: boolean
        default: true
        in: "-"

routes:
  - method: GET
    path: /platform/api/employees
    resource: employee
    operation: list
    # Paging is still unstated here, and this is what was tried.
    # Tried on 2026-09-05. developer.rippling.com serves an empty document
    # body to anything that is not a browser -- the reference, the
    # pagination guide and the endpoint page all return a shell with no
    # content -- and no machine-readable description is published at any
    # address those pages name.

  - method: GET
    path: /platform/api/employees/{id}
    resource: employee
    operation: get

errors:
  # Django REST Framework's own default "nothing here I recognise as a
  # credential" sentence. Every credential shape this Recipe tried -- absent,
  # a wrong bearer token, an unprefixed value, a well-formed JWT-shaped value
  # -- answered this exact body.
  authentication_error:
    status: 401
    message_field: detail
    message: "Authentication credentials were not provided."

fixtures:
  empty: {}

# No case below carries a fixture beyond "empty": no credential this Recipe
# holds was ever accepted by the real host, so no successful body was ever
# observed to build one from.
conformance:
  - name: no credential at all
    source: https://api.rippling.com/platform/api/employees
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /platform/api/employees
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        detail: "Authentication credentials were not provided."

  - name: a wrong bearer token answers the identical sentence
    # Not a second message the way Fireworks or Together split absent from
    # wrong -- see the header. Struck live with Authorization: Bearer
    # junktoken12345.
    source: https://api.rippling.com/platform/api/employees
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /platform/api/employees
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."

  - name: a header with no Bearer prefix is refused the same way
    # "Authorization: junktoken12345", no scheme at all. Struck live; the
    # identical sentence, not a third one.
    source: https://api.rippling.com/platform/api/employees
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /platform/api/employees
      headers:
        Authorization: junktoken12345
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."

  - name: a real id under a real route is still refused for its credentials
    source: https://api.rippling.com/platform/api/employees/00000000-0000-0000-0000-000000000000
    verified: "2026-09-01"
    fixture: empty
    request:
      method: GET
      path: /platform/api/employees/00000000-0000-0000-0000-000000000000
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."

  - name: a wrong method on a real path is refused for its credential, not its method
    # PATCH is not in this route's own Allow header (GET, POST, HEAD,
    # OPTIONS), and the live host still answers 401, not 405. The credential
    # is examined before the method is ever considered -- struck live, no
    # credential at all.
    source: https://api.rippling.com/platform/api/employees
    verified: "2026-09-01"
    fixture: empty
    request:
      method: PATCH
      path: /platform/api/employees
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."

  - name: OPTIONS is not a free pass either
    source: https://api.rippling.com/platform/api/employees
    verified: "2026-09-01"
    fixture: empty
    request:
      method: OPTIONS
      path: /platform/api/employees
    expect:
      status: 401
      body:
        detail: "Authentication credentials were not provided."
