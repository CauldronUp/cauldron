# Dub Recipe for Cauldron
#
# Dub calls itself "the modern link attribution platform," and the wire backs
# that framing up in one specific way: clicks, leads, conversions, sales and
# saleAmount all sit directly on the Link object Dub's own docs describe --
# https://dub.co/docs/api-reference/endpoint/update-a-link names all five as
# properties of LinkSchema, none of them behind a separate analytics call.
# Compare bitly/recipe.yaml and short.io/recipe.yaml, both of which keep
# every click number off the link record entirely and behind a dedicated
# statistics endpoint. Three providers doing the same job, and only one of
# them puts the number a caller actually wants on the object they already
# have. Nothing in Dub's docs says whether clicks is live or on a delay --
# no worked instance exists to check it against either, see the fidelity gaps
# below -- so this Recipe states its presence and is silent about its
# freshness, rather than claiming either.
#
# The destination is mutable and Dub is direct about how: PATCH
# /links/{linkId} takes url ("The destination URL of the short link.") and a
# live, no-credential PATCH carrying exactly that body against a fabricated
# linkId reaches Dub's ordinary auth gate and nothing else -- see the
# conformance case below. LinkSchema has no previous-url field, no
# url_history, nothing that says what a link used to point at. There is a
# lastClicked timestamp and it records the last time someone followed the
# link, not the last time somebody retargeted it. A link's destination can be
# changed an unbounded number of times and the object carries no memory of
# any of it.
#
# archived and disabledAt are two separate booleans-ish fields on the same
# record -- archived (a plain boolean) and disabledAt (a nullable timestamp,
# implying it is set rather than merely flipped) -- and Dub's published docs
# describe neither one's effect on whether the short link itself keeps
# redirecting. Compare short.io/recipe.yaml, whose own docs answer the
# identical question about its own archived field in one sentence. Deleting a
# link answers 200 {"id": "the deleted link id"} per Dub's own docs, and
# nothing in that page or the update page says whether the id or the slug
# becomes available for reuse afterward, or what a visitor to the old URL
# sees. Not modelled, because nothing published settles it and no credential
# exists to test it.
#
# Every failure on this host answers the same three-field envelope --
# {"error": {"code", "message", "doc_url"}} -- and the doc_url fragment
# changes with the failure, which is itself worth having pinned: #unauthorized,
# #bad-request and #not-found are three different anchors on Dub's own
# published errors page, cited live below rather than assumed to be the same
# link three times.
#
# **Absent, malformed and wrong are three different answers here, not two.**
# No Authorization header at all: 401, "Missing Authorization header."
# A header present with no "Bearer " prefix, or "Bearer " with nothing after
# it: 400, not 401 -- "Misconfigured authorization header. Did you forget to
# add 'Bearer '? Learn more: https://d.to/auth". A well-formed bearer token
# that is simply wrong: 401 again, but a different sentence --
# "Unauthorized: Invalid API key." All three struck live, separately, on
# GET /links.
#
# **This host is workspace-scoped, and what a missing workspace answers
# depends on what else is wrong with the request, in a way this format's
# single-verdict auth model cannot fully express.** GET /links with no
# workspaceId query parameter and a wrong bearer token answers neither 401
# shape above. It answers 404:
#
#   {"error":{"code":"not_found","message":"Workspace ID not found. Did you
#   forget to include a `workspaceId` query parameter? It looks like you
#   might be using personal API keys, we also recommend refactoring to
#   workspace API keys: https://d.to/keys","doc_url":".../errors#not-found"}}
#
# The same wrong token, on the same route, with ?workspaceId=anything added,
# answers the plain "Unauthorized: Invalid API key." 401 instead. So a bad
# key is not rejected for being a bad key until a workspace has already been
# resolved -- an unscoped request to a workspace-scoped route fails for the
# workspace first, and the credential's own validity is never reached. GET
# /workspaces, which lists a caller's own workspaces and needs no workspaceId
# to mean something, answers its *absent*-credential case with a third
# sentence again -- "Unauthorized: Login required." rather than "Missing
# Authorization header." -- struck live and not modelled as a route, because
# this Recipe already spends its one Recipe-wide absent-credential slot on
# /links. Cauldron's credential check is one verdict per Recipe, decided from
# the header alone; it cannot see whether a query parameter was supplied, so
# the workspace_not_found shape below is armed rather than triggered -- see
# the fidelity gaps for exactly what that does and does not prove.
#
# **Routing beats the credential for an unrouted path or a wrong method, and
# neither is served here.** An unrouted path answers 404 as Dub's own
# marketing site, not its API -- a multi-kilobyte Next.js document under
# Content-Type: text/html, X-Matched-Path: /404, identical whether a
# credential was sent or not. See together/recipe.yaml for a provider in
# this collection making the identical choice not to serve a website's own
# 404 page as though it belonged to the API. A wrong method on a real path --
# PATCH /links, which only supports GET and POST -- answers 405 with
# Content-Length: 0 and no Allow header at all, credential-blind either way.
# Cauldron computes an Allow header for every 405 by construction (see
# internal/runtime/handler.go); Dub's live answer carries none, so the case
# below makes no claim about that header rather than asserting one the real
# API does not send.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No account exists and no key was ever created. Every case below that
#     needs no credential, or a wrong one, was struck live and carries a
#     verified date; nothing about a 2xx response is modelled, because no
#     worked full instance of a Link exists anywhere in Dub's published docs
#     for this Recipe to cite rather than invent -- see the header's
#     description of what the schema names without ever showing an example.
#   - The workspace_not_found case is armed, not triggered. Arming proves the
#     shape is servable; it does not prove Cauldron reaches it the way Dub
#     does, because the real trigger is the *absence* of a query parameter
#     and this format's credential check has nowhere to hold that. See
#     mezmo/recipe.yaml's account_not_found for the same device used for the
#     same reason.
#   - GET /workspaces and its own "Login required" absent-credential wording
#     are cited in the header above and not routed, for the reason given
#     there.
#   - The unrouted-path HTML page is not served. See together/recipe.yaml.
#   - clicks, leads, conversions, sales and saleAmount are declared as typed
#     fields and never given fixture values, for the same reason as every
#     other field on this resource: no worked instance exists to draw one
#     from honestly.
#   - trackConversion, geo, tags, testVariants, utm_* and the partner/program
#     fields are real, documented, and not declared: they bear on affiliate
#     and A/B-test features this Recipe was not asked about.
#   - No upstream.spec is recorded. dub.co/api.json and api.dub.co/openapi.json
#     both answer with the marketing site's own 404 page rather than a
#     document, and Dub's reference is split across many individual doc pages
#     rather than one fetchable description -- there is nothing a fingerprint
#     could be taken of.
#
# Every case below not carrying a verified date was read from
# https://dub.co/docs/api-reference/endpoint/update-a-link and
# https://dub.co/docs/api-reference/endpoint/delete-a-link, and never called
# -- this Recipe was written with no credential and created no account. The
# key below is a fixture and belongs to no workspace.

recipe: dub
capability: marketing
version: 0.1.0

upstream:
  api: v1
  docs: https://dub.co/docs/api-reference/introduction

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - dub_cauldron_fixture_0000000000000000000000
  # Absent falls through to authentication_error, which is already this
  # host's own "Missing Authorization header." sentence. Malformed and
  # rejected are two different sentences and two different statuses here --
  # see the header -- so each is named separately rather than folded
  # together the way bitly/recipe.yaml's genuinely are.
  malformed_error: misconfigured_header
  rejected_error: invalid_api_key
  after_routing: true

responses:
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: code
    # Dub's own envelope is {code, message, doc_url} -- no "type" anywhere.
    type_field: "-"

resources:
  # No worked full instance exists anywhere in Dub's published docs -- see
  # the header. Declared with typed fields and an empty fixture so the
  # credential machinery has a real route to gate; no case here asserts a
  # single field value.
  link:
    id:
      style: opaque
    fields:
      domain:
        type: string
      key:
        type: string
      url:
        type: string
      shortLink:
        type: string
      qrCode:
        type: string
      archived:
        type: boolean
        default: false
      disabledAt:
        type: datetime
        null_when_unset: true
      expiresAt:
        type: datetime
        null_when_unset: true
      expiredUrl:
        type: string
        null_when_unset: true
      password:
        type: string
        null_when_unset: true
      title:
        type: string
        null_when_unset: true
      publicStats:
        type: boolean
        default: false
      rewrite:
        type: boolean
        default: false
      folderId:
        type: string
        null_when_unset: true
      comments:
        type: string
        null_when_unset: true
      workspaceId:
        type: string
      clicks:
        type: integer
        default: 0
      leads:
        type: integer
        default: 0
      conversions:
        type: integer
        default: 0
      sales:
        type: integer
        default: 0
      saleAmount:
        type: integer
        default: 0
      lastClicked:
        type: datetime
        null_when_unset: true
      createdAt:
        type: datetime
      updatedAt:
        type: datetime

routes:
  - method: GET
    path: /links
    resource: link
    operation: list
    pagination:
      style: cursor
      limit: 100

  # "The destination URL of the short link." Retargeting reaches the ordinary
  # auth gate first -- see the header and the conformance case below.
  - method: PATCH
    path: /links/{id}
    resource: link
    operation: update

  # {"id": "the deleted link id"} per Dub's own docs. Not itself asserted by
  # any case here: no credential exists to reach a 200, and the request shape
  # alone -- reaching the same auth gate as every other route -- is what the
  # DELETE case below actually proves.
  - method: DELETE
    path: /links/{id}
    resource: link
    operation: delete
    deleted_body: id

errors:
  # No Authorization header at all, on the workspace-scoped link routes. See
  # the header for GET /workspaces answering a different sentence to the
  # identical absent case.
  authentication_error:
    status: 401
    message: Missing Authorization header.
    code: unauthorized
    fields:
      error.doc_url: https://dub.co/docs/api-reference/errors#unauthorized

  # Present, and not shaped like a credential at all -- no "Bearer " prefix,
  # or "Bearer " with nothing after it. A 400, not a 401: Dub treats this as
  # a request error rather than an authentication failure.
  misconfigured_header:
    status: 400
    message: "Misconfigured authorization header. Did you forget to add 'Bearer '? Learn more: https://d.to/auth"
    code: bad_request
    fields:
      error.doc_url: https://dub.co/docs/api-reference/errors#bad-request

  # Well-formed and simply wrong, once a workspace has already been
  # resolved -- see the header for the case where it has not been.
  invalid_api_key:
    status: 401
    message: "Unauthorized: Invalid API key."
    code: unauthorized
    fields:
      error.doc_url: https://dub.co/docs/api-reference/errors#unauthorized

  # Real, live-checked, and armed rather than triggered -- see the header and
  # the fidelity gaps for exactly what arming does and does not prove here.
  # The literal live body, for a wrong bearer token and no workspaceId query
  # parameter on GET /links.
  workspace_not_found:
    status: 404
    message: "Workspace ID not found. Did you forget to include a `workspaceId` query parameter? It looks like you might be using personal API keys, we also recommend refactoring to workspace API keys: https://d.to/keys"
    code: not_found
    fields:
      error.doc_url: https://dub.co/docs/api-reference/errors#not-found

  # Content-Length: 0, no Allow header, credential-blind -- see the header.
  method_not_allowed:
    status: 405
    empty: true

fixtures:
  empty: {}

# Every case below carries source. A verified date means this Recipe called
# api.dub.co with exactly the request shown and recorded exactly what came
# back; its absence means the case was read from Dub's published docs and
# never called.
conformance:
  - name: no credential at all is 401, Missing Authorization header
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /links
    expect:
      status: 401
      headers:
        Content-Type: application/json
      body:
        error.code: unauthorized
        error.message: Missing Authorization header.
        error.doc_url: https://dub.co/docs/api-reference/errors#unauthorized

  - name: a header with no Bearer prefix is a 400, not a 401
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /links
      headers:
        Authorization: junktoken12345
    expect:
      status: 400
      body:
        error.code: bad_request
        error.message: "Misconfigured authorization header. Did you forget to add 'Bearer '? Learn more: https://d.to/auth"

  - name: a bare Bearer with nothing after it gets the identical 400
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: /links
      headers:
        Authorization: "Bearer "
    expect:
      status: 400
      body:
        error.code: bad_request

  - name: a well-formed wrong token, once a workspace is named, is a plain 401
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: GET
      path: "/links?workspaceId=ws_cauldron000000000"
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 401
      body:
        error.code: unauthorized
        error.message: "Unauthorized: Invalid API key."

  - name: the identical wrong token with no workspace named is refused for the workspace instead
    # Armed -- see the header and the fidelity gaps. This is the literal live
    # body for GET /links with a wrong bearer token and no workspaceId query
    # parameter; Cauldron's credential check has no way to condition on a
    # query parameter's absence, so this proves the shape is servable and not
    # that Cauldron reaches it the way Dub does.
    source: https://api.dub.co/links
    verified: "2026-09-03"
    arm: workspace_not_found
    fixture: empty
    request:
      method: GET
      path: /links
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 404
      body:
        error.code: not_found
        error.message: "Workspace ID not found. Did you forget to include a `workspaceId` query parameter? It looks like you might be using personal API keys, we also recommend refactoring to workspace API keys: https://d.to/keys"
      absent:
        - error.type

  - name: retargeting a link's destination reaches the ordinary auth gate, not a body check
    # The field name (url) is Dub's own, from the update-a-link reference.
    # Sent live, with no credential, against a fabricated linkId -- and it
    # still answers the plain missing-credential sentence, so the shape of a
    # retarget request is never examined before the credential is.
    source: https://api.dub.co/links/link_fake00000000000000000000
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /links/link_fake00000000000000000000
      json:
        url: https://www.newdestination.com
    expect:
      status: 401
      body:
        error.code: unauthorized
        error.message: Missing Authorization header.

  - name: deleting a link reaches the same gate too
    source: https://api.dub.co/links/link_fake00000000000000000000
    verified: "2026-09-03"
    fixture: empty
    request:
      method: DELETE
      path: /links/link_fake00000000000000000000
    expect:
      status: 401
      body:
        error.code: unauthorized

  - name: a wrong method on a real path is a bare 405 with no body and no Allow header
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /links
    expect:
      status: 405
      no_body: true

  - name: and the same 405 is credential-blind
    source: https://api.dub.co/links
    verified: "2026-09-03"
    fixture: empty
    request:
      method: PATCH
      path: /links
      headers:
        Authorization: Bearer junktoken12345
    expect:
      status: 405
      no_body: true
