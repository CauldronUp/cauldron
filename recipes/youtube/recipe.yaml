# YouTube Data API Recipe for Cauldron
#
# Written against the discovery document Google publishes and generates its
# own client libraries from, at
# googleapis.com/discovery/v1/apis/youtube/v3/rest -- 520 kilobytes, and the
# source of every description quoted here.
#
# The identifier of a search result is an object, and none of its fields is
# called id.
#
# A video's id is a string: "The ID that YouTube uses to uniquely identify the
# video." A search result's id is a ResourceId, and a ResourceId is this:
#
#   kind        -- "The type of the API resource."
#   videoId     -- "...if that resource is a video. This property is only
#                  present if the resource is a video."
#   channelId   -- the same sentence, for a channel.
#   playlistId  -- the same sentence again, for a playlist.
#
# So the same field name carries a string on one endpoint and an object on
# another, in one API, and getting an identifier out of a search result means
# reading id.kind first and then picking whichever of three differently-named
# properties matches. There is no id.id. Code that does result.id gets an
# object, code that does result.id.videoId gets undefined for every channel in
# the results, and neither is an error.
#
# Three more, each from the same document:
#
#   1. A search returns five things unless you ask for more. maxResults on
#      search has a minimum of nought, a maximum of fifty, and a default of
#      five. Not twenty, not fifty, not the page size everything else uses --
#      five, which is small enough that a developer eyeballing the response
#      concludes the search matched five things.
#   2. The document describes its own results array as pagination. In
#      SearchListResponse, the description attached to items is "Pagination
#      information for token pagination" -- the sentence belonging to the
#      field beside it. It is a copy-and-paste mistake sitting in the file
#      Google generates its client libraries from, which is worth recording
#      because a generated client's documentation says it too.
#   3. Every response says what kind of thing it is, twice. A search listing
#      is kind: "youtube#searchListResponse" and each item is kind:
#      "youtube#searchResult", and inside each item id.kind says
#      "youtube#video" again. Three kinds to read one identifier.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Quota is the thing everybody hits and it is not modelled. YouTube costs
#     a search a hundred units and a list one, against a daily allowance, and
#     exceeding it is a 403 whose reason is quotaExceeded rather than a 429 --
#     so retry logic written for rate limits does not fire. This format arms
#     errors rather than counting requests, so the shape could be served and
#     the arithmetic that produces it could not, and half of that is worse
#     than none.
#   - The search returns what the fixture holds. Relevance ordering, the
#     documented cap of around five hundred results however large
#     totalResults claims to be, and the q language are all absent: this
#     Recipe is about the shape of a result rather than about which results
#     come back.
#   - maxResults is documented with a maximum of fifty and the document does
#     not say what happens above it. A ceiling is only servable as a
#     behaviour -- a refusal, or a silent trim -- and this file declares
#     neither, on the same reading the Voucherify and Apideck rows record: a
#     documented behaviour can be served and a documented range cannot.
#   - The videos endpoint takes ids as a comma-separated query parameter and
#     this Recipe does not filter on it: the identifier is not a declared
#     field here, and declaring one to filter on would put a second id on the
#     wire. The shape the parameter produces -- an array and a pageInfo for a
#     single video -- is served.
#   - Uploads, captions, comments, live broadcasts, playlists and the rest of
#     the API are absent. Searching and reading videos only.
#
# The key and the ids below are fixtures and belong to no project.

recipe: youtube
capability: media
version: 0.1.0

upstream:
  api: v3
  docs: https://developers.google.com/youtube/v3/docs

auth:
  # The API key in the query string, which is what every example in the
  # documentation sends and what makes a key end up in server logs.
  scheme: query
  param: key
  keys:
    - AIzaCauldronYouTubeFixtureKey0000000000

responses:
  list:
    style: wrapped
    key: items
    count_field: pageInfo.totalResults
    limit_field: pageInfo.resultsPerPage
  resource:
    style: bare
  error:
    style: nested
    key: error
    message_field: message
    code_field: status
    status_field: code
    type_field: "-"

resources:
  search_result:
    id:
      style: opaque
      # A search result has no identifier of its own on the wire: what it has
      # is an id object naming something else. See the field below.
      field: "-"
    constants:
      kind: youtube#searchResult
    fields:
      # The object that everybody expects to be a string. Stored under a name
      # of its own because the record needs a key, and published as id
      # because that is what YouTube calls it.
      resource_id:
        type: map
        as: id
      snippet:
        type: map

  video:
    id:
      style: opaque
    constants:
      kind: youtube#video
    fields:
      snippet:
        type: map
      statistics:
        type: map

routes:
  - method: GET
    path: /youtube/v3/search
    resource: search_result
    operation: list
    fields:
      kind: youtube#searchListResponse
    pagination:
      style: cursor
      cursor_param: pageToken
      limit_param: maxResults
      # "The maximum number of items that should be returned in the result
      # set" -- minimum nought, maximum fifty, default five.
      limit: 5

  - method: GET
    path: /youtube/v3/videos
    resource: video
    operation: list
    fields:
      kind: youtube#videoListResponse
    pagination:
      style: cursor
      cursor_param: pageToken
      limit_param: maxResults
      limit: 5

errors:
  authentication_error:
    status: 401
    message: Request is missing required authentication credential.
    code: UNAUTHENTICATED

  resource_missing:
    status: 404
    message: The video could not be found.
    code: NOT_FOUND

  invalid_request:
    status: 400
    message: Invalid Value
    code: INVALID_ARGUMENT

fixtures:
  empty: {}

  channel:
    search_result:
      # A video, whose identifier is under videoId.
      - id: sr1
        resource_id:
          kind: youtube#video
          videoId: M7lc1UVf-VE
        snippet:
          title: How a kettle works
          channelId: UCcauldron000000000000
          channelTitle: Cauldron Fixtures
          publishedAt: "2026-04-02T09:00:00Z"
      # A channel in the same result set, whose identifier is under a
      # different key entirely.
      - id: sr2
        resource_id:
          kind: youtube#channel
          channelId: UCcauldron000000000000
        snippet:
          title: Cauldron Fixtures
          channelId: UCcauldron000000000000
          channelTitle: Cauldron Fixtures
          publishedAt: "2025-09-14T11:00:00Z"

    video:
      - id: M7lc1UVf-VE
        snippet:
          title: How a kettle works
          channelId: UCcauldron000000000000
          channelTitle: Cauldron Fixtures
          publishedAt: "2026-04-02T09:00:00Z"
        statistics:
          viewCount: "10422"
          likeCount: "318"
          commentCount: "27"

conformance:
  - name: a search result's identifier is an object naming something else
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/search?part=snippet&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # There is no id.id. Reading the identifier means reading id.kind and
        # then choosing between videoId, channelId and playlistId, each of
        # which is "only present if the resource is" that kind.
        "items[0].id.kind": youtube#video
        "items[0].id.videoId": M7lc1UVf-VE
        "items[0].kind": youtube#searchResult
        kind: youtube#searchListResponse
      absent:
        - items[0].id.channelId
        - items[0].id.playlistId

  - name: and the next result in the same set puts it under a different key
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/search?part=snippet&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # One request, one array, two items whose identifiers live under
        # different property names. Code that reads id.videoId gets undefined
        # here and no error with it.
        "items[1].id.kind": youtube#channel
        "items[1].id.channelId": UCcauldron000000000000
      absent:
        - items[1].id.videoId

  - name: the same field on a video is a plain string
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/videos?part=snippet,statistics&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # "The ID that YouTube uses to uniquely identify the video" -- a
        # string, on the endpoint next door, under the same name that was an
        # object a moment ago.
        "items[0].id": M7lc1UVf-VE
        "items[0].kind": youtube#video
        kind: youtube#videoListResponse

  - name: a video's counts are digits in strings
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/videos?part=statistics&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # A view count can outgrow what a double counts exactly, so it
        # travels as text -- and code that sorts by it sorts lexicographically
        # unless it remembers to convert.
        "items[0].statistics.viewCount": "10422"
        "items[0].statistics.likeCount": "318"

  - name: a search hands back five things unless asked for more
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/search?part=snippet&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # maxResults on search has a minimum of nought, a maximum of fifty
        # and a default of five, which the envelope reports back as the page
        # size it used.
        "pageInfo.resultsPerPage": 5
        "pageInfo.totalResults": 2

  - name: fetching one video is still a listing
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/videos?part=snippet&id=M7lc1UVf-VE&key=AIzaCauldronYouTubeFixtureKey0000000000
    expect:
      status: 200
      body:
        # There is no /videos/{id}: ids travel as a comma-separated query
        # parameter, so asking for one video answers with an array and a
        # pageInfo, and a client that wants the video has to index into it.
        "items[0].id": M7lc1UVf-VE
        "items[0].snippet.title": How a kettle works
        "pageInfo.totalResults": 1
      absent:
        - items[1]

  - name: a key the project does not know is refused
    source: https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest
    fixture: channel
    request:
      method: GET
      path: /youtube/v3/search?part=snippet&key=AIzaNotThisProjectsKey00000000000000
    expect:
      status: 401
      body:
        "error.status": UNAUTHENTICATED
        "error.code": 401
        "error.message": Request is missing required authentication credential.
