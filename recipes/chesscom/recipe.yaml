# Chess.com Recipe for Cauldron
#
# The country is a URL.
#
#   "country": "https://api.chess.com/pub/country/US"
#
# Not "US", not "United States": a link. A client rendering player.country puts
# an API address on the page, and getting the two letters costs a second
# request -- to a resource that is {"@id", "code", "name"} and nothing else, so
# the round trip exists to deliver three fields, one of which is the URL that
# was already held.
#
# **And the player has two URLs that are not the same URL.**
#
#   "@id": "https://api.chess.com/pub/player/hikaru"
#   "url": "https://www.chess.com/member/Hikaru"
#
# Two hosts, two paths, and two capitalisations of the same username. One is the
# API resource and one is the web page, and nothing in either name says which.
# @id also begins with a sigil, so it is unreachable with a dot in most
# languages -- response["@id"] in JavaScript, and a syntax error without the
# brackets.
#
# Written against the live API rather than a document: every case below was
# checked against api.chess.com on the date in its verified field.
#
# Three more the Recipe pins:
#
#   1. twitch_url is sent twice. It is a top-level field and it is
#      streaming_platforms[0].channel_url, byte-identical, so the field and the
#      structure meant to replace it both ship and a client updating to the new
#      one changes nothing.
#   2. status is a subscription tier. "status": "premium" sits in a response
#      whose HTTP status is 200, so a client logging "status" logs the billing
#      plan.
#   3. The failure code is zero. A player who does not exist answers 404 with
#      {"code": 0, "message": "..."}, and a path that does not exist answers the
#      same zero with "Data provider not found for key
#      \"/pub/player/hikaru/notanendpoint\"." -- internal vocabulary, and the
#      path echoed back inside escaped quotes.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - followers and last_online move. The values served are the ones recorded on
#     the date in the cases.
#   - One player and one country are served.

recipe: chesscom
capability: analytics
version: 0.1.0

upstream:
  api: chesscom
  docs: https://www.chess.com/news/view/published-data-api

auth:
  # Public, no key. A User-Agent is expected.
  scheme: none

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: message
    code_field: code
    code_type: number

resources:
  player:
    id:
      style: opaque
      # The username, lowercase, which is not how url capitalises it.
      field: username
    fields:
      avatar:
        type: string
      player_id:
        type: integer
      # A sigil, so it needs a subscript in most languages -- and it is not
      # the same URL as url.
      "@id":
        type: string
      url:
        type: string
      name:
        type: string
      username:
        type: string
      title:
        type: string
      followers:
        type: integer
      # A link, not a code and not a name.
      country:
        type: string
      location:
        type: string
      last_online:
        type: integer
      joined:
        type: integer
      # A subscription tier, in a field named status.
      status:
        type: string
      is_streamer:
        type: boolean
      # Sent here and again inside streaming_platforms.
      twitch_url:
        type: string
      verified:
        type: boolean
      league:
        type: string
      streaming_platforms:
        type: list

  country:
    id:
      style: opaque
      field: code
    fields:
      "@id":
        type: string
      code:
        type: string
      name:
        type: string

routes:
  - method: GET
    path: /pub/player/{id}
    resource: player
    operation: get
    not_found: user_not_found

  - method: GET
    path: /pub/country/{id}
    resource: country
    operation: get

  # A path the API has no handler for, which fails differently in wording and
  # identically in code.
  - method: GET
    path: /pub/player/hikaru/notanendpoint
    error: no_data_provider

errors:
  user_not_found:
    status: 404
    # Zero, on a failure.
    code: 0
    message: 'User "zzzznotaplayer" not found.'

  no_data_provider:
    status: 404
    code: 0
    # Internal vocabulary, and the path echoed inside escaped quotes.
    message: 'Data provider not found for key "/pub/player/hikaru/notanendpoint".'

fixtures:
  empty: {}

  players:
    player:
      - id: hikaru
        avatar: https://images.chesscomfiles.com/uploads/v1/user/15448422.88c010c1.200x200o.3c5619f5441e.png
        player_id: 15448422
        # The API resource...
        "@id": https://api.chess.com/pub/player/hikaru
        # ...and the web page, on another host, capitalised differently.
        url: https://www.chess.com/member/Hikaru
        name: Hikaru Nakamura
        username: hikaru
        title: GM
        followers: 1408479
        # A link, where a client expects a country.
        country: https://api.chess.com/pub/country/US
        location: Florida
        last_online: 1788052154
        joined: 1389043258
        # The billing plan.
        status: premium
        is_streamer: true
        # The same string as streaming_platforms[0].channel_url.
        twitch_url: https://twitch.tv/gmhikaru
        verified: false
        league: Legend
        streaming_platforms:
          - type: twitch
            channel_url: https://twitch.tv/gmhikaru

    country:
      - id: US
        "@id": https://api.chess.com/pub/country/US
        code: US
        name: United States

conformance:
  - name: the country is a URL
    source: https://api.chess.com/pub/player/hikaru
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru
    expect:
      status: 200
      body:
        # Not "US" and not "United States". Getting the two letters costs a
        # second request.
        country: https://api.chess.com/pub/country/US
        username: hikaru

  - name: and the resource it points at is three fields, one of them that URL
    source: https://api.chess.com/pub/country/US
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/country/US
    expect:
      status: 200
      body:
        "@id": https://api.chess.com/pub/country/US
        code: US
        name: United States

  - name: the player has two URLs that are not the same URL
    source: https://api.chess.com/pub/player/hikaru
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru
    expect:
      status: 200
      body:
        # Two hosts, two paths, two capitalisations of one username, and
        # nothing in either name saying which is which.
        "@id": https://api.chess.com/pub/player/hikaru
        url: https://www.chess.com/member/Hikaru

  - name: twitch_url is sent twice
    source: https://api.chess.com/pub/player/hikaru
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru
    expect:
      status: 200
      body:
        # The field and the structure meant to replace it, byte-identical, so
        # a client moving to the new one changes nothing.
        twitch_url: https://twitch.tv/gmhikaru
        "streaming_platforms[0].channel_url": https://twitch.tv/gmhikaru
        "streaming_platforms[0].type": twitch

  - name: status is a subscription tier
    source: https://api.chess.com/pub/player/hikaru
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru
    expect:
      status: 200
      body:
        # In a response whose HTTP status is 200, so a client logging "status"
        # logs the billing plan.
        status: premium
        league: Legend
        # A titled player with 1.4 million followers, unverified.
        title: GM
        verified: false

  - name: the rest of the record
    source: https://api.chess.com/pub/player/hikaru
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru
    expect:
      status: 200
      body:
        player_id: 15448422
        name: Hikaru Nakamura
        # Lowercase here, capitalised in url.
        username: hikaru
        location: Florida
        # Both Unix seconds, twelve years apart.
        joined: 1389043258
        last_online: 1788052154
        # Counted on the date above, and different by now.
        followers: 1408479
        is_streamer: true
        # A third host, for the picture.
        avatar: https://images.chesscomfiles.com/uploads/v1/user/15448422.88c010c1.200x200o.3c5619f5441e.png

  - name: a player who does not exist fails with a code of zero
    source: https://api.chess.com/pub/player/zzzznotaplayer
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/zzzznotaplayer
    expect:
      status: 404
      body:
        # Zero, on a failure, in a field named code.
        code: 0
        message: 'User "zzzznotaplayer" not found.'

  - name: and a path that does not exist fails with the same zero
    source: https://api.chess.com/pub/player/hikaru/notanendpoint
    verified: "2026-08-30"
    fixture: players
    request:
      method: GET
      path: /pub/player/hikaru/notanendpoint
    expect:
      status: 404
      body:
        code: 0
        # Internal vocabulary, and the path echoed back inside escaped quotes.
        message: 'Data provider not found for key "/pub/player/hikaru/notanendpoint".'
