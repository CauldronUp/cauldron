# Flotiq Recipe for Cauldron
#
# The content-object listing, read from the Flotiq API documentation, and
# struck live on 2026-09-14 with no key, with a wrong key in the header, with a
# wrong key in the query parameter, on a path that does not exist, with a
# method the path does not take, on the schema endpoint and on the root.
#
# **Every response carries a frame policy no browser has honoured in a
# decade.** On all seven requests:
#
#   x-frame-options: ALLOW-FROM https://editor.flotiq.com
#
# `ALLOW-FROM` was dropped from the specification, Chrome never implemented it
# and Firefox removed it; a browser that does not understand the directive
# treats the whole header as invalid, so the effect is no protection at all
# rather than the narrow one it names. It rides on `application/json`
# responses, where framing is not a thing that happens, and it names the
# vendor's own editor host on every call an unauthenticated stranger makes.
#
# **One answer for every mistake.** No key, a wrong key in the header, a wrong
# key in the query parameter, a path that does not exist, a verb a path does
# not take, and the schema endpoint all answer
# `{"code":401,"message":"Unauthorized"}` -- with `code` repeating the status
# that is already on the status line.
#
# **And the machine-readable description is behind the credential.**
# `/api/v1/open-api-schema` answers that same 401, so the document describing
# the API cannot be read by anyone deciding whether to use it.
#
# **The identifier contains the type.** An object's `id` is
# `blogposts-456712`: the content type's name, a hyphen, then a number. So the
# id is not opaque, moving an object between types would change its id, and
# parsing it back out is the only way to learn the type from the id alone --
# which is also `internal.contentType`, one level down.
#
# **Two timestamps are the empty string and a version number is negative.**
# `deletedAt` is `""`, `publishedAt` is `""`, and `publicVersion` is `-1`,
# beside `status: "public"`. Four fields describing publication, in three
# conventions for "no", on an object the fifth calls public.
#
# **The user's fields and the system's share one level.** `id` and `internal`
# sit beside `title` and `postContent` -- whatever the content type defines. A
# type with a field called `id`, or `internal`, has nowhere to put it.
#
# Also pinned: the envelope carries four counters -- `total_count`,
# `total_pages`, `current_page`, `count` -- and no cursor; the key may travel
# as `X-AUTH-TOKEN` or as `?auth_token=`, and the query form puts it in every
# access log; `x-generated-by: Flotiq` is on every response including the
# 401s; and the API host's root is a styled HTML page titled "Flotiq - page
# not found".

recipe: flotiq
capability: cms
version: 1.0.0

upstream:
  api: v1
  docs: https://flotiq.com/docs/API/

auth:
  scheme: header
  header: X-AUTH-TOKEN
  keys:
    - cauldr0nflot1qf1xturekey00000000
  also:
    # Documented, and it puts the key in every access log.
    - scheme: query
      param: auth_token
      prefix: "-"
  absent_error: unauthorized
  malformed_error: unauthorized
  rejected_error: unauthorized

responses:
  list:
    style: wrapped
    key: data
    count_field: total_count
    pages_field: total_pages
    page_field: current_page
    page_count_field: count
  error:
    style: flat
    message_field: message
    # The status, again, in the body.
    status_field: code
    code_field: "-"

resources:
  content_object:
    id:
      # The content type's name, a hyphen, then a number.
      field: id
      style: prefixed
      prefix: blogposts-
      length: 6
    fields:
      # Publication state, in four fields and three conventions.
      internal:
        type: map
      # Whatever the content type defines, at the same level as the system's.
      title:
        type: string
      postContent:
        type: string

routes:
  - method: GET
    path: /api/v1/content/blogposts
    resource: content_object
    operation: list
    pagination:
      style: page
      first_page: 1
      limit: 20
      limit_param: limit
      cursor_param: page

  - method: GET
    path: /api/v1/content/blogposts/{id}
    resource: content_object
    operation: get
    not_found: object_not_found

errors:
  unauthorized:
    status: 401
    message: Unauthorized
    headers:
      # A directive no browser implements, on a JSON response.
      X-Frame-Options: ALLOW-FROM https://editor.flotiq.com
      X-Generated-By: Flotiq
      X-Content-Type-Options: nosniff

  # Live, an unrouted path answers the 401 above. Declared so the shape is
  # named; see the README.
  unknown_route:
    status: 401
    message: Unauthorized
    headers:
      X-Frame-Options: ALLOW-FROM https://editor.flotiq.com
      X-Generated-By: Flotiq

  method_not_allowed:
    status: 401
    message: Unauthorized
    headers:
      X-Frame-Options: ALLOW-FROM https://editor.flotiq.com
      X-Generated-By: Flotiq

  # Not observed: reaching it needs a real key. The provider's own envelope
  # with the status it would carry, and the README says so.
  object_not_found:
    status: 404
    message: Not found

fixtures:
  empty:
    content_object: []

  posts:
    content_object:
      - id: blogposts-456712
        internal:
          # The type again, one level down from the id that contains it.
          contentType: blogposts
          createdAt: "2026-04-09T13:30:48+00:00"
          updatedAt: "2026-04-09T13:30:48+00:00"
          # The empty string, not null.
          deletedAt: ""
          publishedAt: ""
          # Negative, beside a status of "public".
          publicVersion: -1
          status: public
        title: New object
        postContent: This will be the new content...
      - id: blogposts-456713
        internal:
          contentType: blogposts
          createdAt: "2026-08-21T09:02:11+00:00"
          updatedAt: "2026-09-01T17:44:30+00:00"
          deletedAt: ""
          publishedAt: "2026-08-21T09:05:00+00:00"
          publicVersion: 3
          status: public
        title: Second object
        postContent: Published, with a version that is not minus one.

conformance:
  - name: a frame policy no browser implements on a json refusal
    source: https://api.flotiq.com/api/v1/content/post
    verified: "2026-09-14"
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers: {}
    expect:
      status: 401
      headers:
        # Dropped from the specification; treated as invalid, so no policy.
        X-Frame-Options: ALLOW-FROM https://editor.flotiq.com
        X-Generated-By: Flotiq
      body:
        # The status, again, in the body.
        code: 401
        message: Unauthorized

  - name: a wrong key in the header is the same body
    source: https://api.flotiq.com/api/v1/content/post
    verified: "2026-09-14"
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers:
        X-AUTH-TOKEN: notrealkey
    expect:
      status: 401
      body:
        code: 401
        message: Unauthorized

  - name: and so is a wrong key in the query parameter
    source: https://api.flotiq.com/api/v1/content/post?auth_token=notrealkey
    verified: "2026-09-14"
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      query:
        # The documented second carrier, in every access log.
        auth_token: notrealkey
      headers: {}
    expect:
      status: 401
      body:
        message: Unauthorized

  - name: so is a path that does not exist
    source: https://api.flotiq.com/api/v1/cauldron-nope
    verified: "2026-09-14"
    fixture: posts
    request:
      method: GET
      path: /api/v1/cauldron-nope
      headers: {}
    expect:
      status: 401
      body:
        code: 401
        message: Unauthorized

  - name: and so is a method the path does not take
    source: https://api.flotiq.com/api/v1/content/post
    verified: "2026-09-14"
    fixture: posts
    request:
      method: PUT
      path: /api/v1/content/blogposts
      headers: {}
    expect:
      status: 401
      body:
        message: Unauthorized
      headers:
        X-Frame-Options: ALLOW-FROM https://editor.flotiq.com

  - name: the identifier contains the content type
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        # The type's name, a hyphen, a number.
        'data[0].id': blogposts-456712
        # And the type again, one level down.
        'data[0].internal.contentType': blogposts
        'data[1].id': blogposts-456713

  - name: three conventions for no publication on one object
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        # The empty string, twice, and a negative version, beside "public".
        'data[0].internal.deletedAt': ""
        'data[0].internal.publishedAt': ""
        'data[0].internal.publicVersion': -1
        'data[0].internal.status': public
        # And the same fields on an object that really is published.
        'data[1].internal.publishedAt': "2026-08-21T09:05:00+00:00"
        'data[1].internal.publicVersion': 3
        'data[0].internal.createdAt': "2026-04-09T13:30:48+00:00"
        'data[0].internal.updatedAt': "2026-04-09T13:30:48+00:00"

  - name: the user's fields sit beside the system's
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        # A content type defining a field called id or internal has nowhere
        # to put it.
        'data[0].title': New object
        'data[0].postContent': This will be the new content...
        'data[1].title': Second object

  - name: four counters and no cursor
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts
      query:
        limit: "1"
        page: "1"
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        total_count: 2
        total_pages: 2
        current_page: 1
        count: 1
      absent:
        - next
        - cursor

  - name: one object travels bare rather than wrapped
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts/blogposts-456713
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        id: blogposts-456713
        title: Second object
        'internal.status': public

  - name: an object that is not there keeps the json envelope
    source: https://flotiq.com/docs/API/
    fixture: posts
    request:
      method: GET
      path: /api/v1/content/blogposts/blogposts-000000
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 404
      body:
        code: 404
        message: Not found

  - name: a content type with nothing in it keeps all four counters
    source: https://flotiq.com/docs/API/
    fixture: empty
    request:
      method: GET
      path: /api/v1/content/blogposts
      headers:
        X-AUTH-TOKEN: cauldr0nflot1qf1xturekey00000000
    expect:
      status: 200
      body:
        data: []
        total_count: 0
        current_page: 1
