  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if page_size was read --
  # with the name ignored the whole collection comes back, because the
  # whole collection is two records. No third record is needed for that,
  # and none is invented.
  - name: "page_size is read, because a page of one out of two is not the whole collection"
    source: "https://www.courtlistener.com/api/rest/v4/courts/?page_size=1"
    fixture: federal-courts
    request:
      method: GET
      path: "/api/rest/v4/courts"
      query:
        "page_size": "1"
    expect:
      status: 200
      body:
        "results[0].id": "scotus"
      absent:
        - "results[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://www.courtlistener.com/api/rest/v4/courts/?page_size=1"
    fixture: federal-courts
    request:
      method: GET
      path: "/api/rest/v4/courts"
      query:
        "page_size": "1"
        "page": "2"
    expect:
      status: 200
      body:
        "results[0].id": "ca1"
      absent:
        - "results[1]"

