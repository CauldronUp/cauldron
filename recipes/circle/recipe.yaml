# Circle Recipe for Cauldron
#
# Written against Circle's developer documentation at developers.circle.com and
# struck live against api.circle.com on 2026-09-06. Every live request used a
# deliberately invalid credential; the read that needs an account is
# documentation-derived and marked as such.
#
# **A not-found is code -1.**
#
#   GET /v1/cauldron-nonexistent
#   404 {"code":-1,"message":"Resource not found"}
#
# Every other failure here carries a code that is the HTTP status: 401 for a
# credential problem, in the same field. The router's own failure carries -1 --
# a sentinel where a code belongs, negative so it cannot collide with a status,
# and undocumented. A client switching on `code` handles 401 and then meets a
# number no table explains.
#
# **Three different 401s, and the shape of the key decides which.** Struck live:
#
#   no header at all
#     "malformed authorization. Missing API key in authorization header.
#      Make sure to use Bearer authorization type"
#
#   Bearer not-a-real-key
#     "malformed API key. API key should contain three substrings, separated by
#      a colon. First substring denotes the environment, e.g. TEST_API_KEY.
#      Second substring denotes the ID of the key, e.g.
#      ebb3ad72232624921abc4b162148bb84. Third substring denotes the secret of
#      the key, e.g. 019ef3358ef9cd6d08fc32csfe89a68d. This format only applies
#      to API keys generated after May 2023"
#
#   Bearer TEST_API_KEY:abc:def
#     "Invalid credentials."
#
# The middle one is a four-sentence tutorial served as an error message, and it
# prints **example key material** -- a sample key id and a sample secret -- into
# the body of a 401 that anyone can trigger without an account. They are
# fictional, and they are also exactly what a real one looks like, which is the
# point of including them and the reason they are in a response rather than in
# the documentation where the same paragraph already lives.
#
# It also carries a date caveat: "This format only applies to API keys generated
# after May 2023." So the error describing the credential format is conditional
# on when the credential was issued, and does not say what the older one looks
# like.
#
# Note the punctuation: two of the three end without a full stop and the third
# ends with one. The first two begin lower case. A client displaying the message
# to a user gets three different registers from one status.
#
# **The health check is not in the API.** `GET /ping` answers
# `{"message":"pong"}` -- 200, no `code`, the only response here without one.
# `GET /v1/ping`, the same name one segment in, answers `{"code":-1,"message":
# "Resource not found"}`. So the endpoint a monitor calls sits outside the
# versioned surface and outside its envelope, and putting it where the rest of
# the API lives is a 404.

recipe: circle
capability: payments
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.circle.com/api-reference

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  # Three parts separated by colons: environment, key id, secret. The 401 for a
  # string that is not shaped like that is a different sentence from the 401
  # for one that is, which is what this gate is for.
  shape: '^[A-Z_]+:[0-9a-z]+:[0-9a-z]+$'
  keys:
    - "TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
  absent_error: missing_authorization
  shape_error: malformed_key
  rejected_error: invalid_credentials

responses:
  list:
    style: wrapped
    key: data
  error:
    style: flat
    message_field: message
    # Named code and carrying the HTTP status on every failure but one.
    code_field: code
    code_type: number

resources:
  balance:
    id:
      field: currency
      style: opaque
    fields:
      amount:
        type: string

  pong:
    id:
      field: message
      style: opaque
    fields:
      message:
        type: string
        default: pong

routes:
  - method: GET
    path: /v1/businessAccount/balances
    resource: balance
    operation: list
    list:
      # available and unsettled, both arrays, under one data object. The
      # listing this Recipe serves is the available half.
      key: data.available
    pagination:
      style: none

  # Outside the versioned surface, outside the envelope, and the only 200 here
  # with no code in it.
  - method: GET
    path: /ping
    resource: pong
    operation: list
    list:
      style: bare
      collapse_single: true
    public: true
    pagination:
      style: none

errors:
  missing_authorization:
    status: 401
    code: "401"
    message: "malformed authorization. Missing API key in authorization header. Make sure to use Bearer authorization type"

  malformed_key:
    status: 401
    code: "401"
    # Four sentences, two worked examples of key material, and a date caveat,
    # in the body of a 401 anyone can trigger. Struck live, verbatim.
    message: "malformed API key. API key should contain three substrings, separated by a colon. First substring denotes the environment, e.g. TEST_API_KEY. Second substring denotes the ID of the key, e.g. ebb3ad72232624921abc4b162148bb84. Third substring denotes the secret of the key, e.g. 019ef3358ef9cd6d08fc32csfe89a68d. This format only applies to API keys generated after May 2023"

  invalid_credentials:
    status: 401
    code: "401"
    # Two words and a full stop, where its two siblings are lower case and
    # unpunctuated.
    message: "Invalid credentials."

  unknown_route:
    status: 404
    # The sentinel. Every other failure's code is its HTTP status.
    code: "-1"
    message: "Resource not found"


fixtures:
  empty:
    balance: []
    pong:
      - message: pong

  account:
    pong:
      - message: pong
    balance:
      - currency: USD
        amount: "1250.00"
      - currency: EUR
        # Two decimal places on a string, so the value is exact and the type is
        # not a number. Circle sends money as text, which is right, and gives
        # no scale field to say how many places to expect.
        amount: "0.00"

conformance:
  - name: no credential at all is a malformed authorization
    source: https://api.circle.com/v1/businessAccount/balances
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers: {}
    expect:
      status: 401
      body:
        code: 401
        message: "malformed authorization. Missing API key in authorization header. Make sure to use Bearer authorization type"

  - name: a wrongly-shaped key is answered with a tutorial
    source: https://api.circle.com/v1/businessAccount/balances
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers:
        Authorization: "Bearer not-a-real-key"
    expect:
      status: 401
      body:
        # Four sentences and two examples of key material, struck live, in a
        # response anyone can obtain without an account.
        message: "malformed API key. API key should contain three substrings, separated by a colon. First substring denotes the environment, e.g. TEST_API_KEY. Second substring denotes the ID of the key, e.g. ebb3ad72232624921abc4b162148bb84. Third substring denotes the secret of the key, e.g. 019ef3358ef9cd6d08fc32csfe89a68d. This format only applies to API keys generated after May 2023"
        code: 401

  - name: a rightly-shaped key nobody issued is two words
    source: https://api.circle.com/v1/businessAccount/balances
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers:
        Authorization: "Bearer TEST_API_KEY:abc123:def456"
    expect:
      status: 401
      body:
        # Same status, same code, a third register: capitalised and with a
        # full stop, where the other two are neither.
        message: "Invalid credentials."
        code: 401

  - name: a not-found carries minus one where a code belongs
    source: https://api.circle.com/v1/cauldron-nonexistent
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /v1/cauldron-nonexistent
      headers:
        Authorization: "Bearer TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
    expect:
      status: 404
      body:
        # Every other failure's code is its HTTP status. This one is a
        # sentinel, negative so it cannot collide with one, and documented
        # nowhere.
        code: -1
        message: "Resource not found"

  - name: the health check is outside the version and outside the envelope
    source: https://api.circle.com/ping
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /ping
      headers: {}
    expect:
      status: 200
      body:
        message: pong
      absent:
        # The only response here with no code in it, and the only one that
        # needs no credential.
        - code

  - name: the same name one segment in does not exist
    source: https://api.circle.com/v1/ping
    verified: "2026-09-06"
    fixture: account
    request:
      method: GET
      path: /v1/ping
      headers:
        Authorization: "Bearer TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
    expect:
      # Struck live. /ping is a health check and /v1/ping is a 404, so a
      # monitor pointed at the versioned surface reports an outage that is a
      # routing table.
      status: 404
      body:
        code: -1

  - name: balances are strings under a nested key
    source: https://developers.circle.com/api-reference/circle-mint/balances/list-balances
    fixture: account
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers:
        Authorization: "Bearer TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
    expect:
      status: 200
      body:
        # data.available, two levels in, and the amount is text: exact, and
        # with no scale field to say how many places to expect.
        'data.available[0].currency': USD
        'data.available[0].amount': "1250.00"

  - name: a zero balance is still a string with its places
    source: https://developers.circle.com/api-reference/circle-mint/balances/list-balances
    fixture: account
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers:
        Authorization: "Bearer TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
    expect:
      status: 200
      body:
        # "0.00" rather than "0" or 0, so a falsy check on the string is false
        # and an equality check against 0 fails.
        'data.available[1].amount': "0.00"

  - name: an account with nothing settled answers an empty array
    source: https://developers.circle.com/api-reference/circle-mint/balances/list-balances
    fixture: empty
    request:
      method: GET
      path: /v1/businessAccount/balances
      headers:
        Authorization: "Bearer TEST_API_KEY:cauldr0nf1xtureke71d0000000000000:cauldr0nf1xturesecret00000000000"
    expect:
      status: 200
      body:
        'data.available': []
