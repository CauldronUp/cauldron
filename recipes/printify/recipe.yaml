# Printify Recipe for Cauldron
#
# Written against Printify's own OpenAPI description, fetched from
# developers.printify.com. Every figure and field name below was read out of
# that document rather than remembered, including the example response its
# authors published.
#
# The wholesale-and-retail split is not the reason this Recipe exists. That is
# the Printful Recipe's headline, already shipped, and repeating it would add
# a name rather than a shape. What differs here is where the two halves live.
#
# Printful puts costs and retail_costs side by side on the order. Printify
# puts the retail total on the order -- total_price -- and puts what you owe
# only on the line items, as cost and shipping_cost. There is no total_cost
# anywhere on an order. So the margin is not a subtraction between two fields;
# it is a subtraction between one field and the sum of a nested array, and an
# order with two line items from two different print providers has two costs
# to add before the question can be asked at all.
#
# Six things worth modelling exactly:
#
#   1. An order has no cost. total_price is retail; cost lives on each line
#      item and nowhere else.
#   2. The page size is capped at ten. The description says "default: 10,
#      maximum: 10", so a client asking for a hundred is answered with ten
#      and not told -- and a loop that stops when it receives fewer than it
#      asked for stops on the first page.
#   3. Paging is a Laravel paginator: twelve fields, including absolute URLs
#      for the first, last, next and previous pages, and a from and a to that
#      are record positions rather than pages.
#   4. Timestamps use a space where ISO 8601 uses a T --
#      "2017-04-18 13:24:28+00:00" -- so a parser expecting RFC 3339 rejects
#      a string that looks like a date and reads like one.
#   5. A line item has its own status and its own print_provider_id, so one
#      order can be split across providers and be fulfilled in parts while
#      the order's own status says something coarser.
#   6. Money is integer cents. Printful sends the same quantities as decimal
#      strings, so a shared money helper for the two print-on-demand
#      providers in this repository has to be told which is which.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - Sending an order to production is a separate endpoint and is not
#     modelled, so a draft here stays a draft. That is the same gap the
#     Printful Recipe carries.
#   - The paginator's URLs are fixtures rather than URLs that resolve. Their
#     shape is the claim; following one reaches nothing.
#   - Products, print providers, shipping calculation, webhooks and the
#     catalogue are absent. Only orders are modelled.
#
# Checked live against api.printify.com, unauthenticated, 2026-09-05. No
# Authorization header at all and a fictitious bearer answer the identical
# {"error":"Unauthenticated","request_id":"..."} -- no code field anywhere
# in it, which this file had wrong: it declared a numeric code (401)
# nothing on the wire carries. An unrouted path needs no credential either
# and answers 404 {"error":"Not found"}. A wrong method on a real path is
# the one case worth stating rather than encoding: it answers 405 with the
# allowed methods spelled out by name, "The DELETE method is not supported
# for route public/v1/shops.json. Supported methods: GET, HEAD." -- a
# sentence built per route and per method, which also leaks a "public/"
# prefix on the internal route name that never appears in the URL a caller
# actually sends. That message cannot be generalised to a route this Recipe
# does model without asserting a sentence never observed for it, so only
# its existence and shape are recorded here.
#
# The token below is a fixture, not a secret. It belongs to no shop.
#
# Drift note, 2026-09-03: the description moved since it was last recorded,
# and not by editing anything this Recipe names. Printify's document gained a
# second server, https://enterprise.printful.com/api/pfy/public, listed after
# the original https://api.printify.com. This tool's own base-path detection
# takes the first server whose URL resolves to a path; the primary server has
# none, so it falls through to the alternate and reads /api/pfy/public as the
# prefix every declared path sits under. Under that prefix both of this
# Recipe's routes read as absent, which is what moved the fingerprint -- not
# because Printify dropped, renamed, or reshaped /v1/shops/{shop_id}/
# orders.json or its singular sibling. Diffed the live document against an
# archive.org capture from 2026-05-13, the closest one before this Recipe's
# spec_seen: the order schema's properties, their types, and the response
# codes (200 and 400) on both operations this Recipe routes to are
# byte-for-byte identical across that span, and the single server the
# archived copy declared was the same https://api.printify.com with no
# second entry. The orders API this Recipe models has not changed; asked
# against the real primary server, every route, field and status this Recipe
# claims still holds.
#
# So nothing here is re-recorded. The fingerprint recorded on 2026-08-31 was
# and is correct, and the fix went where the fault was: BasePath now takes
# the first server and treats an empty path from it as an answer, which is
# what OpenAPI means by listing that server first. With that fixed this
# Recipe reports unchanged again, against the hash it always had.

recipe: printify
capability: commerce
version: 0.1.0

upstream:
  api: v1
  docs: https://developers.printify.com/
  spec: https://developers.printify.com/openapi.json
  spec_hash: d0ebe61f9cef654d29f3ce0b0dd52b0caee780df6f43ffed0bc235b266d9c099
  spec_seen: "2026-08-31"

auth:
  scheme: bearer
  header: Authorization
  prefix: "Bearer "
  keys:
    - cauldron.printify.token.0000
  # Verified live, 2026-09-05: an unrouted path answers 404 without needing
  # a credential. See the file header.
  after_routing: true

responses:
  list:
    style: wrapped
    key: data
    count_field: total
    limit_field: per_page
    page_field: current_page
    pages_field: last_page
  resource:
    style: bare
  error:
    style: flat
    message_field: error
    code_field: code
    type_field: "-"

resources:
  order:
    id:
      # A Mongo-shaped identifier, and a string.
      style: hex
      length: 24
    fields:
      app_order_id:
        type: string
      # Retail. What the customer paid, in cents. There is no field beside it
      # for what the shop owes.
      total_price:
        type: integer
      total_shipping:
        type: integer
      total_tax:
        type: integer
        default: 0
      # pending, on-hold, checking-quality, quality-declined, quality-approved,
      # ready-for-production, sending-to-production, in-production, canceled,
      # fulfilled, partially-fulfilled, payment-not-received, callback-received,
      # has-issues.
      status:
        type: string
        default: pending
      # Where the cost lives, and the only place it does.
      line_items:
        type: list
      address_to:
        type: map
      metadata:
        type: map
      shipping_method:
        type: integer
        default: 1
      is_printify_express:
        type: boolean
        default: false
      # A space rather than a T, which is what the published example shows.
      created_at:
        type: string
      sent_to_production_at:
        type: string
        null_when_unset: true
      fulfilled_at:
        type: string
        null_when_unset: true

routes:
  - method: GET
    path: /v1/shops/{shop_id}/orders.json
    resource: order
    operation: list
    pagination:
      style: page
      # Ten by default, and ten at most, because the description says both.
      # The cap is what makes asking for a hundred quiet rather than an
      # error.
      limit: 10
      max_limit: 10
      limit_param: limit
      cursor_param: page
      first_page: 1
    fields:
      # The rest of the Laravel paginator, which is a lot of fields for a
      # page of ten records.
      first_page_url: https://api.printify.test/v1/shops/9000/orders.json?page=1
      last_page_url: https://api.printify.test/v1/shops/9000/orders.json?page=1
      next_page_url: null
      prev_page_url: null
      path: https://api.printify.test/v1/shops/9000/orders.json
      from: 1
      to: 2

  - method: GET
    path: /v1/shops/{shop_id}/orders/{id}.json
    resource: order
    operation: get

errors:
  # Verified live, 2026-09-05: no Authorization header at all and a
  # fictitious bearer both answer this exact body -- no code field at all,
  # which this entry had wrong before this check.
  authentication_error:
    status: 401
    code_field: "-"
    message: Unauthenticated

  # Verified live, 2026-09-05, against an unrouted path -- needs no
  # credential, checked before it.
  unknown_route:
    status: 404
    code_field: "-"
    message: Not found

  resource_missing:
    status: 404
    code: 404
    message: The requested resource was not found.

  parameter_missing:
    status: 422
    code: 422
    message: The given data was invalid.

  rate_limit:
    status: 429
    code: 429
    message: Too Many Attempts.

fixtures:
  empty: {}

  one-shop:
    order:
      # Two line items from two different print providers, fulfilled. The
      # retail total is on the order; what the shop owes is only in the array.
      - id: 5a6e03bd2f7d8055768923c8
        app_order_id: "215014.44"
        total_price: 4400
        total_shipping: 800
        total_tax: 0
        status: fulfilled
        shipping_method: 1
        is_printify_express: false
        address_to:
          first_name: Jane
          last_name: Smith
          city: Retie
          country: BE
        line_items:
          - product_id: 5b05842f3921c9547531758d
            variant_id: 17887
            quantity: 1
            # What Printify charges the shop for this item.
            cost: 1050
            shipping_cost: 400
            # Which provider makes it. Two items, two providers.
            print_provider_id: 5
            status: fulfilled
            metadata:
              title: 18K gold plated necklace
              # What the customer paid for this item.
              price: 2200
              sku: "168699843"
          - product_id: 5b05842f3921c9547531758e
            variant_id: 17888
            quantity: 1
            cost: 1400
            shipping_cost: 400
            print_provider_id: 12
            status: fulfilled
            metadata:
              title: Enamel mug
              price: 2200
              sku: "168699844"
        metadata:
          order_type: external
          shop_order_id: 1370762297
          shop_order_label: "1370762297"
        created_at: "2026-02-01 09:15:00+00:00"
        sent_to_production_at: "2026-02-01 10:00:00+00:00"
        fulfilled_at: "2026-02-03 14:12:00+00:00"
      # Partly fulfilled: one item done, one still in production, and the
      # order's own status is a coarser word than either.
      - id: 6b7f14ce3a8e9166879034d9
        app_order_id: "215014.45"
        total_price: 4400
        total_shipping: 800
        total_tax: 0
        status: partially-fulfilled
        shipping_method: 1
        is_printify_express: false
        address_to:
          first_name: John
          last_name: Doe
          city: Lyon
          country: FR
        line_items:
          - product_id: 5b05842f3921c9547531758d
            variant_id: 17887
            quantity: 1
            cost: 1050
            shipping_cost: 400
            print_provider_id: 5
            status: fulfilled
            metadata:
              title: 18K gold plated necklace
              price: 2200
              sku: "168699843"
          - product_id: 5b05842f3921c9547531758e
            variant_id: 17888
            quantity: 1
            cost: 1400
            shipping_cost: 400
            print_provider_id: 12
            status: in-production
            metadata:
              title: Enamel mug
              price: 2200
              sku: "168699844"
        metadata:
          order_type: external
          shop_order_id: 1370762298
          shop_order_label: "1370762298"
        created_at: "2026-02-02 11:00:00+00:00"
        sent_to_production_at: "2026-02-02 11:40:00+00:00"

conformance:
  - name: no Authorization header at all is a bare Unauthenticated
    source: https://api.printify.com/v1/shops/9000/orders.json
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/shops/9000/orders.json
    expect:
      status: 401
      body:
        error: Unauthenticated
      absent:
        - code

  - name: an unrouted path needs no credential and answers Not found
    source: https://api.printify.com/v1/nonexistent
    verified: "2026-09-05"
    request:
      method: GET
      path: /v1/nonexistent
    expect:
      status: 404
      body:
        error: Not found
      absent:
        - code

  - name: an order has no cost on it anywhere
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # Retail, in cents, on the order.
        total_price: 4400
        total_shipping: 800
        # And what the shop owes is only here, one item at a time: 1050 and
        # 1400. The margin is a field minus the sum of an array, not a
        # subtraction between two fields the way Printful's is.
        line_items[0].cost: 1050
        line_items[1].cost: 1400
      absent:
        # There is no total_cost, and no other name for it either. A report
        # that wants the shop's cost has to walk the line items.
        - total_cost
        - costs
        - cost

  - name: the retail price is on the line item as well
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # Under metadata, beside the title and the sku, while the cost sits
        # on the line item itself. Two prices for one item, one level apart.
        line_items[0].metadata.price: 2200
        line_items[0].cost: 1050
        line_items[0].metadata.title: 18K gold plated necklace

  - name: one order can span two print providers
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # Printify is a marketplace of factories, so the two halves of one
        # parcel can be made in two places, at two costs, and shipped
        # separately.
        line_items[0].print_provider_id: 5
        line_items[1].print_provider_id: 12
        line_items[0].shipping_cost: 400
        line_items[1].shipping_cost: 400

  - name: a line item has its own status
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/6b7f14ce3a8e9166879034d9.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # One item made, one still being made, and the order's own word is
        # coarser than either. Code that reads the order status and stops
        # cannot tell which half the customer is waiting for.
        status: partially-fulfilled
        line_items[0].status: fulfilled
        line_items[1].status: in-production

  - name: timestamps use a space rather than a T
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # Not RFC 3339. It carries an offset, it looks like a date and it
        # reads like one, and a parser that insists on the T rejects it --
        # which is the published example's own format, not an invention here.
        created_at: "2026-02-01 09:15:00+00:00"
        fulfilled_at: "2026-02-03 14:12:00+00:00"

  - name: an unfulfilled order has a null rather than a missing date
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/6b7f14ce3a8e9166879034d9.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # Sent to production, not finished. The date that says when it
        # finished is present and empty.
        sent_to_production_at: "2026-02-02 11:40:00+00:00"
        fulfilled_at: null

  - name: an order id nobody holds is a 404 with a numeric code
    source: https://developers.printify.com/
    fixture: one-shop
    arm: resource_missing
    request:
      method: GET
      path: /v1/shops/9000/orders/000000000000000000000000.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 404
      body:
        error: The requested resource was not found.
        code: 404

  - name: the page size is capped at ten
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders.json?limit=100
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # The description says default 10, maximum 10. A client asking for a
        # hundred is answered with ten and not told, so a loop that stops
        # when it gets fewer than it asked for stops on the first page --
        # and a shop with four hundred orders reports ten.
        per_page: 10
        total: 2
        current_page: 1

  - name: paging is a Laravel paginator with twelve fields
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        data[0].id: 5a6e03bd2f7d8055768923c8
        # Positions rather than pages, beside absolute URLs for the pages
        # either side. A lot of fields for a page of ten records, and the
        # ones a client usually wants -- total and last_page -- are two of
        # twelve.
        from: 1
        to: 2
        last_page: 1
        path: https://api.printify.test/v1/shops/9000/orders.json
      absent:
        # The next page is null rather than absent when there is not one,
        # so a loop testing for presence never terminates.
        - next_page_url.href

  - name: money is integer cents
    source: https://developers.printify.com/
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json
      headers:
        Authorization: Bearer cauldron.printify.token.0000
    expect:
      status: 200
      body:
        # 4400 is forty-four, not four thousand four hundred. The other
        # print-on-demand Recipe in this repository sends the same
        # quantities as decimal strings, so a money helper shared between
        # them has to be told which it is holding.
        total_price: 4400
        total_tax: 0
        line_items[0].metadata.price: 2200

  - name: a bad token is refused
    source: https://api.printify.com/v1/shops/9000/orders.json
    verified: "2026-09-05"
    fixture: one-shop
    request:
      method: GET
      path: /v1/shops/9000/orders.json
      headers:
        Authorization: Bearer not_the_token
    expect:
      status: 401
      body:
        error: Unauthenticated
      absent:
        - code

  # The page size, on a fixture of two. Asking for one and receiving the
  # first without the second can only happen if limit was read -- with
  # the name ignored the whole collection comes back, because the whole
  # collection is two records. No third record is needed for that, and
  # none is invented.
  - name: "limit is read, because a page of one out of two is not the whole collection"
    source: "https://developers.printify.com/"
    fixture: one-shop
    request:
      method: GET
      path: "/v1/shops/9000/orders.json"
      query:
        "limit": "1"
      headers:
        "Authorization": "Bearer cauldron.printify.token.0000"
    expect:
      status: 200
      body:
        "data[0].id": "5a6e03bd2f7d8055768923c8"
      absent:
        - "data[1]"

  # And the position. Asking for one page-worth from page=2 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "page moves the page on, and the second record is what comes back"
    source: "https://developers.printify.com/"
    fixture: one-shop
    request:
      method: GET
      path: "/v1/shops/9000/orders.json"
      query:
        "limit": "1"
        "page": "2"
      headers:
        "Authorization": "Bearer cauldron.printify.token.0000"
    expect:
      status: 200
      body:
        "data[0].id": "6b7f14ce3a8e9166879034d9"
      absent:
        - "data[1]"

  # The names. This Recipe declares 4 field(s) on a order that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 3 name(s) that came back at the paths they came back
  # under.
  - name: "an order carries the field names this Recipe declares"
    source: "https://developers.printify.com/"
    fixture: one-shop
    request:
      method: GET
      path: "/v1/shops/5a6e03bd2f7d8055768923c8/orders.json"
      query:
        "limit": "100"
      headers:
        "Authorization": "Bearer cauldron.printify.token.0000"
    expect:
      status: 200
      body:
        "data[0].app_order_id": "215014.44"
        "data[0].is_printify_express": false
        "data[0].shipping_method": 1

  # The names. This Recipe declares 1 field(s) on an order that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an order carries the field names this Recipe declares, and 1 more of them"
    source: "https://developers.printify.com/"
    fixture: one-shop
    request:
      method: GET
      path: "/v1/shops/5a6e03bd2f7d8055768923c8/orders.json"
      query:
        "limit": "100"
      headers:
        "Authorization": "Bearer cauldron.printify.token.0000"
    expect:
      status: 200
      body:
        "data[0].address_to.city": "Retie"

  # What this provider says when it refuses. The Recipe declares a
  # status, a code and a message for rate limit and nothing asserted any
  # of them, so the wording could have been changed to anything and
  # every case would have stayed green. This makes the refusal happen --
  # arming the rate limit -- and asserts what came back, envelope and
  # all.
  - name: "the rate limit says so in these words"
    source: "https://developers.printify.com/"
    arm: rate_limit
    fixture: one-shop
    request:
      method: GET
      path: "/v1/shops/9000/orders/5a6e03bd2f7d8055768923c8.json"
      headers:
        "Authorization": "Bearer cauldron.printify.token.0000"
    expect:
      status: 429
      body:
        "code": 429
        "error": "Too Many Attempts."




