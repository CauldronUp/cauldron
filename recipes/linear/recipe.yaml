# Linear Recipe for Cauldron
#
# Priority counts down, and zero is not the top.
#
# Linear's own words: 0 = No priority, 1 = Urgent, 2 = High, 3 = Medium,
# 4 = Low. So the scale runs backwards -- a smaller number is more urgent --
# except at zero, which is not urgent at all and sorts first.
#
# Every ordering built on this is wrong in one of two ways. Sort ascending and
# the issues nobody has triaged come above the ones on fire. Sort descending
# and Low beats Urgent. Filter for `priority <= 2` to mean "important" and you
# have included everything unprioritised. The field is a number, the
# comparison compiles, and the list looks plausible either way.
#
# Five more the Recipe pins:
#
#   1. The state's name belongs to the team and the state's type does not.
#      name is "In Progress" or "Done" or whatever a team renamed it to, per
#      team, and type is one of seven fixed words. Branching on name works
#      until a second team exists.
#   2. Three of those seven close an issue. completed, canceled and
#      duplicate all mean it is off the board, so "is this done" is not one
#      comparison, and duplicate is the one everybody forgets.
#   3. A connection carries the same list twice. edges and nodes are both
#      there, holding the same issues in two shapes, so two parts of a
#      codebase can read the same query differently and both work until
#      somebody paginates.
#   4. There are three identifiers and only one is safe alone. id is a UUID,
#      identifier is "ENG-123" and appears in URLs, and number is scoped to
#      the team -- so two issues in two teams are both number 123.
#   5. Archived issues are absent unless asked for. includeArchived defaults
#      to false, so a query that counted issues last month and counts fewer
#      now may be looking at the same issues.
#
# And the page size is fifty unless you say otherwise. first defaults to 50,
# which is enough that a small workspace never notices and a real one
# silently truncates.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - No GraphQL is parsed. A query naming issues gets the issues fixture
#     whatever fields it asked for, so this reproduces the envelope, the
#     connection shape and the vocabulary rather than the query language.
#   - Nothing is filtered or ordered. includeArchived is described above and
#     honoured by nothing, so the archived issue in the fixture is always
#     present. first used to be in that sentence too, and no longer is: the
#     route declares variables.first and variables.after, so a client that
#     passes them as variables is paged. One that inlines them in the query
#     document still is not -- no GraphQL is parsed here.
#   - Mutations, comments, projects, cycles, webhooks and the OAuth flow are
#     not modelled.
#
# Keys below are fixtures, not secrets.

recipe: linear
capability: issues
version: 0.1.0

upstream:
  api: graphql
  docs: https://linear.app/developers/graphql

auth:
  scheme: header
  header: Authorization
  keys:
    - lin_api_cauldron00000000000000000000

responses:
  list:
    style: wrapped
  resource:
    style: bare
  error:
    style: list
    key: errors
    message_field: message
    code_field: "-"
    type_field: "-"

resources:
  # The nodes half of the connection.
  issue:
    collection: data.issues.nodes
    id:
      style: uuid
    fields:
      # ENG-123. What appears in URLs and what people paste at each other.
      identifier:
        type: string
      # Scoped to the team, so two issues in two teams are both 123.
      number:
        type: integer
      title:
        type: string
      # 0 = No priority, 1 = Urgent, 2 = High, 3 = Medium, 4 = Low.
      priority:
        type: integer
      # The word for the number above, which is the only place the ordering
      # is legible.
      priorityLabel:
        type: string
      # Whatever this team called it.
      state_name:
        type: string
        in: state
        as: name
      # One of triage, backlog, unstarted, started, completed, canceled,
      # duplicate. The stable one.
      state_type:
        type: string
        in: state
        as: type
      state_id:
        type: string
        in: state
        as: id
      team_key:
        type: string
        in: team
        as: key
      team_name:
        type: string
        in: team
        as: name
      createdAt:
        type: datetime
      # Null until something closes it, and set for all three closing types.
      completedAt:
        type: datetime
        null_when_unset: true
      archivedAt:
        type: datetime
        null_when_unset: true

  # The edges half. The same issues, in the other shape, in the same
  # response.
  issue_edge:
    collection: data.issues.edges
    id:
      style: uuid
      field: node.id
    fields:
      cursor:
        type: string
      identifier:
        type: string
        in: node
        as: identifier
      title:
        type: string
        in: node
        as: title
      priority:
        type: integer
        in: node
        as: priority

routes:
  - method: POST
    path: /graphql
    resource: issue
    operation: list
    pagination:
      # first and after, in the request body, under variables -- which is
      # where a client that passes them as GraphQL variables puts them, and
      # the only place anything here can read them from.
      #
      # This does not parse GraphQL, which is a gap this Recipe already
      # states. So a query that inlines its arguments in the document --
      # products(first: 10, after: "...") -- is still not read, and still
      # answers the whole fixture. What changes is the other spelling: a
      # client sending {"query": "...", "variables": {"first": 2}} now gets
      # two records instead of all of them, because the declaration names
      # where to look. The alternative was the engine's default, which reads
      # "limit" out of the query string of a POST -- a name no GraphQL
      # client has ever sent.
      #
      # Fifty by default, which the header above already records: "first
      # defaults to 50, which is enough that a small workspace never notices
      # and a real one silently truncates."
      style: cursor
      limit: 50
      limit_param: variables.first
      cursor_param: variables.after
      in: body
    selects: issues
    # The same records again, under the other key, because that is what a
    # connection is.
    beside: [issue_edge]
    fields:
      data.issues.pageInfo.hasNextPage: false
      data.issues.pageInfo.endCursor: YXJyYXljb25uZWN0aW9uOjI=

  - method: POST
    path: /graphql
    resource: issue
    operation: list
    pagination:
      # first and after, in the request body, under variables -- which is
      # where a client that passes them as GraphQL variables puts them, and
      # the only place anything here can read them from.
      #
      # This does not parse GraphQL, which is a gap this Recipe already
      # states. So a query that inlines its arguments in the document --
      # products(first: 10, after: "...") -- is still not read, and still
      # answers the whole fixture. What changes is the other spelling: a
      # client sending {"query": "...", "variables": {"first": 2}} now gets
      # two records instead of all of them, because the declaration names
      # where to look. The alternative was the engine's default, which reads
      # "limit" out of the query string of a POST -- a name no GraphQL
      # client has ever sent.
      #
      # Fifty by default, which the header above already records: "first
      # defaults to 50, which is enough that a small workspace never notices
      # and a real one silently truncates."
      style: cursor
      limit: 50
      limit_param: variables.first
      cursor_param: variables.after
      in: body
    selects: viewer
    fields:
      data.viewer.name: Ada Okonkwo
      data.viewer.email: ada@example.com

errors:
  # Linear answers a bad query with 400 and the errors array, so unlike
  # ShipHero the status is not always 200 -- which is worth knowing, because
  # a client written for one is written for the other until it is not.
  invalid_field:
    status: 400
    message: "Cannot query field 'titel' on type 'Issue'."

  # This was named "authentication" and declared status 400. Neither
  # mattered: auth.ErrorFor falls back to the name "authentication_error" on
  # a real refusal, and nothing here declared that name, so every actual
  # unauthenticated request served this runtime's own generic placeholder
  # instead and this entry was dead. Confirmed live 2026-09-05 against
  # api.linear.app, no account and no key: the sentence was right and the
  # status was not -- 401, not 400 -- and a missing credential and a wrong
  # one both answer this identical body, nested inside extensions with a
  # machine code and a second sentence meant for a person.
  authentication_error:
    status: 401
    message: "Authentication required, not authenticated"
    fields:
      extensions:
        type: authentication error
        code: AUTHENTICATION_ERROR
        statusCode: 401
        userError: true
        userPresentableMessage: "You need to authenticate to access this operation."
        meta: {}
        http:
          status: 401

  rate_limit:
    status: 429
    message: "Request limit exceeded. Please try again later."

fixtures:
  empty: {}

  one-workspace:
    issue:
      # Urgent, which is priority 1, which sorts below the unprioritised one
      # ascending and below Low descending.
      - id: 7c1b9e04-5f38-4a26-b0d3-91e2c4a7d5f8
        identifier: ENG-123
        number: 123
        title: "Checkout fails on the second card"
        priority: 1
        priorityLabel: Urgent
        state_name: "In Progress"
        state_type: started
        state_id: 2e8f5a13-c60b-4d97-8a24-f3b1d7e69c05
        team_key: ENG
        team_name: Engineering
        createdAt: "2026-08-14T09:12:04.201Z"

      # No priority, which is zero, which sorts first.
      - id: 9d4c2b78-1a05-4e63-bf8e-72a6c1d4093b
        identifier: ENG-124
        number: 124
        title: "Tidy the settings page"
        priority: 0
        priorityLabel: "No priority"
        state_name: Todo
        state_type: unstarted
        state_id: 5b3e8c21-9d47-4f06-a1b8-3e7c2f9a06d4
        team_key: ENG
        team_name: Engineering
        createdAt: "2026-08-15T11:40:22.883Z"

      # Number 123 again, in another team, which is why number alone is not
      # an identifier. And closed as a duplicate, which is neither completed
      # nor canceled and is off the board all the same.
      - id: c4f70e82-6a19-4d35-b8c0-2f9e1a7d63b5
        identifier: DES-123
        number: 123
        title: "Checkout button alignment"
        priority: 4
        priorityLabel: Low
        state_name: Duplicate
        state_type: duplicate
        state_id: 8a6d1f39-4b2c-40e7-95af-c1e83b7d02f6
        team_key: DES
        team_name: Design
        createdAt: "2026-08-11T16:02:19.775Z"
        completedAt: "2026-08-18T10:31:07.442Z"

    issue_edge:
      - id: 7c1b9e04-5f38-4a26-b0d3-91e2c4a7d5f8
        cursor: YXJyYXljb25uZWN0aW9uOjA=
        identifier: ENG-123
        title: "Checkout fails on the second card"
        priority: 1

      - id: 9d4c2b78-1a05-4e63-bf8e-72a6c1d4093b
        cursor: YXJyYXljb25uZWN0aW9uOjE=
        identifier: ENG-124
        title: "Tidy the settings page"
        priority: 0

      - id: c4f70e82-6a19-4d35-b8c0-2f9e1a7d63b5
        cursor: YXJyYXljb25uZWN0aW9uOjI=
        identifier: DES-123
        title: "Checkout button alignment"
        priority: 4

# Every case below is derived from the GraphQL schema Linear publishes in its
# own SDK. None has been run against a real workspace. The verify report says
# so.
conformance:
  - name: an unauthenticated request is 401, not 400
    # This file declared the status as 400 under a name nothing else in the
    # runtime ever reaches -- see the header. Confirmed live 2026-09-05, no
    # account and no key: 401, and a missing credential and a wrong one
    # answer this identical body.
    source: https://api.linear.app/graphql
    verified: "2026-09-05"
    request:
      method: POST
      path: /graphql
      json:
        query: "{ viewer { id } }"
    expect:
      status: 401
      body:
        errors[0].message: "Authentication required, not authenticated"
        errors[0].extensions.code: AUTHENTICATION_ERROR
        errors[0].extensions.statusCode: 401

  - name: priority counts down and zero is not the top
    # Linear's own words: 0 = No priority, 1 = Urgent, 4 = Low. Sorting
    # ascending puts the untriaged issue above the one on fire.
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { identifier priority priorityLabel } } }"
    expect:
      status: 200
      body:
        data.issues.nodes[0].priority: 1
        data.issues.nodes[0].priorityLabel: Urgent
        data.issues.nodes[1].priority: 0
        data.issues.nodes[1].priorityLabel: "No priority"
        data.issues.nodes[2].priority: 4
        data.issues.nodes[2].priorityLabel: Low

  - name: the state name belongs to the team and the type does not
    # name is whatever a team renamed it to. type is one of seven fixed
    # words, and it is the one to branch on.
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { state { name type } } } }"
    expect:
      status: 200
      body:
        data.issues.nodes[0].state.name: "In Progress"
        data.issues.nodes[0].state.type: started
        data.issues.nodes[1].state.name: Todo
        data.issues.nodes[1].state.type: unstarted

  - name: duplicate closes an issue and is neither completed nor canceled
    # Three of the seven types are off the board, and this is the one
    # everybody forgets. completedAt is set for it all the same.
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { state { type } completedAt } } }"
    expect:
      status: 200
      body:
        data.issues.nodes[2].state.type: duplicate
        data.issues.nodes[2].completedAt: "2026-08-18T10:31:07.442Z"
        data.issues.nodes[0].completedAt: null

  - name: the same list arrives twice in two shapes
    # edges and nodes are both there, holding the same issues, so two parts
    # of a codebase can read one query differently and both work.
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { identifier } edges { cursor node { identifier } } } }"
    expect:
      status: 200
      body:
        data.issues.nodes[0].identifier: ENG-123
        data.issues.edges[0].node.identifier: ENG-123
        data.issues.edges[0].cursor: YXJyYXljb25uZWN0aW9uOjA=
        data.issues.edges[2].node.identifier: DES-123

  - name: number alone is not an identifier
    # It is scoped to the team, so two issues in two teams are both 123. The
    # thing that is unique is identifier, which carries the team key in it.
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { number identifier team { key } } } }"
    expect:
      status: 200
      body:
        data.issues.nodes[0].number: 123
        data.issues.nodes[0].identifier: ENG-123
        data.issues.nodes[0].team.key: ENG
        data.issues.nodes[2].number: 123
        data.issues.nodes[2].identifier: DES-123
        data.issues.nodes[2].team.key: DES

  - name: paging state is beside the list, not in it
    source: https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { pageInfo { hasNextPage endCursor } nodes { id } } }"
    expect:
      status: 200
      body:
        data.issues.pageInfo.hasNextPage: false
        data.issues.pageInfo.endCursor: YXJyYXljb25uZWN0aW9uOjI=
      absent:
        - data.issues.nodes[0].pageInfo

  - name: the query picks the route here too
    # A different root field, the same path and method, and nothing about
    # the URL says which is which.
    source: https://linear.app/developers/graphql
    fixture: one-workspace
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { viewer { name email } }"
    expect:
      status: 200
      body:
        data.viewer.name: Ada Okonkwo
        data.viewer.email: ada@example.com

  - name: a bad field is a 400 here and a 200 elsewhere
    # Linear answers a malformed query with 400 and the errors array, which
    # is not what every GraphQL server does -- ShipHero answers 200 -- so a
    # client written for one is written for the other until it is not.
    source: https://linear.app/developers/graphql
    fixture: one-workspace
    arm: invalid_field
    request:
      method: POST
      path: /graphql
      headers:
        Authorization: lin_api_cauldron00000000000000000000
      json:
        query: "query { issues { nodes { titel } } }"
    expect:
      status: 400
      body:
        errors[0].message: "Cannot query field 'titel' on type 'Issue'."
      absent:
        - data
        - error

  # The page size. Asking for one and receiving the first without the
  # second can only happen if variables.first was read -- with the name
  # ignored the whole collection comes back, and this fixture holds 3
  # records. No record had to be invented for that.
  - name: "variables.first is read, because a page of one is not the whole collection"
    source: "https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql"
    fixture: one-workspace
    request:
      method: POST
      path: "/graphql"
      json:
        query: query { issues { nodes { identifier priority priorityLabel } } }
        variables:
          first: 1
      headers:
        "Authorization": "lin_api_cauldron00000000000000000000"
    expect:
      status: 200
      body:
        "data.issues.nodes[0].id": "7c1b9e04-5f38-4a26-b0d3-91e2c4a7d5f8"
      absent:
        - "data.issues.nodes[1]"

  # And the position. Asking for one page-worth from
  # variables.after=7c1b9e04-5f38-4a26-b0d3-91e2c4a7d5f8 answers the
  # *second* record, which can only happen if the name was read. Between
  # them these two cases pin both halves; either name renamed to what
  # the runtime falls back on fails one of them.
  - name: "variables.after moves the page on, and the second record is what comes back"
    source: "https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql"
    fixture: one-workspace
    request:
      method: POST
      path: "/graphql"
      json:
        query: query { issues { nodes { identifier priority priorityLabel } } }
        variables:
          first: 1
          after: 7c1b9e04-5f38-4a26-b0d3-91e2c4a7d5f8
      headers:
        "Authorization": "lin_api_cauldron00000000000000000000"
    expect:
      status: 200
      body:
        "data.issues.nodes[0].id": "9d4c2b78-1a05-4e63-bf8e-72a6c1d4093b"
      absent:
        - "data.issues.nodes[1]"

  # The names. This Recipe declares 3 field(s) on an issue that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "an issue carries the field names this Recipe declares"
    source: "https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql"
    fixture: one-workspace
    request:
      method: POST
      path: "/graphql"
      json:
        query: query { issues { nodes { identifier priority priorityLabel } } }
      headers:
        "Authorization": "lin_api_cauldron00000000000000000000"
    expect:
      status: 200
      body:
        "data.issues.nodes[0].createdAt": "2026-08-14T09:12:04.201Z"
        "data.issues.edges[0].node.title": "Checkout fails on the second card"

  # The names. This Recipe declares 1 field(s) on an issue that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 1 name(s) that came back at the paths they came back
  # under.
  - name: "an issue carries the field names this Recipe declares, and 1 more of them"
    source: "https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql"
    fixture: one-workspace
    request:
      method: POST
      path: "/graphql"
      json:
        query: query { issues { nodes { identifier priority priorityLabel } } }
      headers:
        "Authorization": "lin_api_cauldron00000000000000000000"
    expect:
      status: 200
      body:
        "data.issues.nodes[0].archivedAt": null

  # The names. This Recipe declares 2 field(s) on an issue that no case
  # asserted, so each of them could have been renamed to anything and
  # every case would have stayed green. The runtime builds the response
  # out of the declaration and the fixture, so this seeds one and
  # asserts the 2 name(s) that came back at the paths they came back
  # under.
  - name: "an issue carries the field names this Recipe declares, and 2 more of them"
    source: "https://github.com/linear/linear/blob/master/packages/sdk/src/schema.graphql"
    fixture: one-workspace
    request:
      method: POST
      path: "/graphql"
      json:
        query: query { issues { nodes { identifier priority priorityLabel } } }
      headers:
        "Authorization": "lin_api_cauldron00000000000000000000"
    expect:
      status: 200
      body:
        "data.issues.nodes[0].state.id": "2e8f5a13-c60b-4d97-8a24-f3b1d7e69c05"
        "data.issues.nodes[0].team.name": "Engineering"




