# MusicBrainz Recipe for Cauldron
#
# It answers XML unless you ask for JSON, and it says so in XML.
#
#   GET /ws/2/artist/{mbid}           ->  200  <?xml version="1.0" ...
#   GET /ws/2/artist/{mbid}?fmt=json  ->  200  {"name": "Nirvana", ...}
#   GET /ws/2/artist/{mbid}?fmt=yaml  ->  406  <?xml version="1.0" ...
#
# The default is XML, so a client that forgets fmt=json gets a document its
# .json() throws on. And a client that mistypes the parameter gets 406 with a
# message explaining that the recognised types are application/json and
# application/xml -- written in application/xml. The one answer that would tell
# you how to ask for JSON is the one you cannot parse without already having
# solved the problem.
#
# **And a mbid that does not exist is a 400 about the format of the mbid.**
#
#   GET /ws/2/artist/00000000-0000-0000-0000-000000000000?fmt=json
#   ->  400  {"error": "Invalid mbid.", "help": "..."}
#
#   GET /ws/2/artist/notanmbid?fmt=json
#   ->  400  {"help": "...", "error": "Invalid mbid."}
#
# The first identifier is a perfectly well-formed UUID that nothing in the
# database uses; the second is not a UUID at all. Both are "Invalid mbid.", both
# are 400, and there is no 404 anywhere in this shape -- so "no such artist" and
# "you sent nonsense" are one answer, and it is the wrong one for the first case.
# The two bodies also arrive with their keys in opposite orders, which is nothing
# to a parser and is a difference two snapshots will disagree about.
#
# Written against the live API rather than a document: every case below was
# checked against musicbrainz.org on the date in its verified field.
#
# Four more the Recipe pins:
#
#   1. A request that does not identify itself is 403 Forbidden with a message
#      about being throttled. The status says you are not allowed and the text
#      says you are going too fast, and the cause is neither: it is that the
#      User-Agent was missing. That body also arrives as application/json with
#      no charset, where every other JSON answer here declares one.
#   2. The field names are hyphenated: sort-name, type-id, begin-area,
#      end-area, life-span, gender-id, iso-3166-1-codes. In JavaScript
#      artist.sort-name is a subtraction, so every one of them has to be
#      reached with brackets.
#   3. life-span carries dates of different precision in one object: begin is
#      "1987" and end is "1994-04-05". Both are strings, neither says which
#      precision it is, and parsing them the same way puts the band's formation
#      on the first of January.
#   4. Nothing is missing and much is empty. gender and gender-id are null,
#      end-area is null, ipis is [], and inside area and begin-area the
#      disambiguation is "" while type and type-id are null. Four spellings of
#      "not applicable" in one document.
#
# Known fidelity gaps, stated rather than hidden:
#
#   - The database is served rather than searched. /ws/2/artist?query= takes a
#     Lucene expression and this Recipe answers with the artists its fixture
#     holds, the same reading recorded for Google Drive's q and Maven Central's
#     Solr expressions.
#   - The rate limit is not modelled: one request a second on the public
#     instance, and a limit is not a response shape. Only the missing
#     User-Agent is served, which is the same reading recorded for Nominatim.
#   - inc= is not modelled. Asking for release-groups, recordings or relations
#     adds whole subtrees to the same path, which is the shape recorded for
#     Clover's expand.
#   - fmt=yaml stands for every format that is not json or xml. A route matches
#     a declared value, so the Recipe names one of the wrong answers rather
#     than the rule -- the same reading recorded for Open-Meteo's second
#     coordinate.
#
# The artist below is public and was recorded on the date in the cases.

recipe: musicbrainz
capability: infrastructure
version: 0.1.0

upstream:
  api: ws/2
  docs: https://musicbrainz.org/doc/MusicBrainz_API

auth:
  # Public.
  scheme: none

required_headers:
  # 403, and the message is about throttling.
  User-Agent:
    error: not_identified

responses:
  resource:
    style: bare
  error:
    style: flat
    message_field: error

resources:
  artist:
    id:
      style: uuid
      field: id
    fields:
      name:
        type: string
      # Hyphenated, so artist.sort-name is a subtraction in JavaScript.
      sort-name:
        type: string
      type:
        type: string
      type-id:
        type: string
      disambiguation:
        type: string
      country:
        type: string
      # Present and null, both of them.
      gender:
        type: string
      gender-id:
        type: string
      # Present and empty.
      ipis:
        type: list
      isnis:
        type: list
      area:
        type: map
      begin-area:
        type: map
      end-area:
        type: map
      # begin is a year and end is a full date, in one object.
      life-span:
        type: map

routes:
  # One path, three answers, and the only thing that tells them apart is a
  # query parameter the caller may not have sent at all.
  - method: GET
    path: /ws/2/artist/{id}
    resource: artist
    operation: get
    matches_query:
      fmt: json
    not_found: invalid_mbid

  - method: GET
    path: /ws/2/artist/{id}
    matches_query:
      fmt: yaml
    error: unacceptable

  # The fallback, which is what a request that named no format gets.
  - method: GET
    path: /ws/2/artist/{id}
    error: xml_by_default

errors:
  # A well-formed UUID nothing uses, and a string that is not a UUID, are one
  # answer -- and it is a 400 about the format either way.
  invalid_mbid:
    status: 400
    headers:
      Content-Type: application/json; charset=utf-8
    fields:
      # Beside the message, pointing at a page about the format. The 403 below
      # does not carry it.
      help: "For usage, please see: https://musicbrainz.org/development/mmd"
    message: Invalid mbid.

  # 403, saying you are being throttled, because the User-Agent was missing.
  not_identified:
    status: 403
    headers:
      # No charset, where every other JSON answer here declares one.
      Content-Type: application/json
    message: >-
      Your requests are being throttled by MusicBrainz because the application
      you are using has not identified itself. Please update your application,
      and see http://musicbrainz.org/doc/XML_Web_Service/Rate_Limiting for more
      information.

  # The default. XML, from a request that named no format.
  xml_by_default:
    status: 200
    style: text
    headers:
      Content-Type: application/xml; charset=utf-8
    message: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <metadata xmlns="http://musicbrainz.org/ns/mmd-2.0#"><artist id="5b11f4ce-a62d-471e-81fc-a69a8278c7da" type="Group" type-id="e431f5f6-b5d2-343d-8b36-72607fffb74b"><name>Nirvana</name><sort-name>Nirvana</sort-name></artist></metadata>

  # And an explanation of how to ask for JSON, in XML.
  unacceptable:
    status: 406
    style: text
    headers:
      Content-Type: application/xml; charset=utf-8
    message: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <error><text>Invalid format. Either set an Accept header (recognized mime types are application/json and application/xml), or include a fmt= argument in the query string (recognized values are json and xml).</text></error>

fixtures:
  empty: {}

  band:
    artist:
      - id: 5b11f4ce-a62d-471e-81fc-a69a8278c7da
        name: Nirvana
        sort-name: Nirvana
        type: Group
        type-id: e431f5f6-b5d2-343d-8b36-72607fffb74b
        # An en dash, not a hyphen.
        disambiguation: 1980s–1990s US grunge band
        country: US
        # Present and null.
        gender: null
        gender-id: null
        # Present and empty.
        ipis: []
        isnis:
          - "0000000123486830"
          - "0000000123487390"
        area:
          id: 489ce91b-6658-3307-9877-795b68554c98
          name: United States
          sort-name: United States
          # Null, beside a disambiguation that is the empty string.
          type: null
          type-id: null
          disambiguation: ""
          iso-3166-1-codes:
            - US
        begin-area:
          id: a640b45c-c173-49b1-8030-973603e895b5
          name: Aberdeen
          sort-name: Aberdeen
          type: null
          type-id: null
          disambiguation: ""
        # Null, where the other two areas are objects.
        end-area: null
        life-span:
          # A year.
          begin: "1987"
          # A full date, in the same object.
          end: "1994-04-05"
          ended: true

conformance:
  - name: it answers XML unless you ask for JSON
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      # A 200 whose body .json() throws on, from an API that has a JSON mode
      # and does not use it by default.
      status: 200
      headers:
        Content-Type: application/xml; charset=utf-8
      body_matches: '^<\?xml version="1\.0" encoding="UTF-8"\?>'

  - name: and it explains how to ask for JSON in XML
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=yaml
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=yaml
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      # The one answer that would tell you how to ask for JSON is the one you
      # cannot parse without already having solved the problem.
      status: 406
      headers:
        Content-Type: application/xml; charset=utf-8
      body_matches: '^<\?xml version="1\.0" encoding="UTF-8"\?>[\s\S]*<error><text>Invalid format\.[^<]*recognized values are json and xml'

  - name: a well-formed identifier nothing uses is a 400 about its format
    source: https://musicbrainz.org/ws/2/artist/00000000-0000-0000-0000-000000000000?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/00000000-0000-0000-0000-000000000000?fmt=json
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      # A perfectly well-formed UUID, reported as an invalid one. There is no
      # 404 in this shape, so "no such artist" and "you sent nonsense" are the
      # same answer and it is wrong about the first.
      status: 400
      headers:
        Content-Type: application/json; charset=utf-8
      body:
        error: Invalid mbid.
        help: "For usage, please see: https://musicbrainz.org/development/mmd"

  - name: a request that does not identify itself is forbidden for going too fast
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    expect:
      # The status says you are not allowed, the text says you are being
      # throttled, and the cause is neither: the User-Agent was missing.
      status: 403
      header_matches:
        # No charset, where the 400 above declares one.
        Content-Type: '^application/json$'
      body_matches: 'has not identified itself'
      absent:
        - help

  - name: the field names are hyphenated
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # artist.sort-name is a subtraction in JavaScript, so every one of
        # these has to be reached with brackets.
        "sort-name": Nirvana
        "type-id": e431f5f6-b5d2-343d-8b36-72607fffb74b
        "begin-area.name": Aberdeen
        "area.iso-3166-1-codes[0]": US

  - name: the life span mixes a year with a full date
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # Both strings, neither saying which precision it is, so parsing them
        # the same way puts the band's formation on the first of January.
        "life-span.begin": "1987"
        "life-span.end": "1994-04-05"
        "life-span.ended": true

  - name: four spellings of not applicable in one document
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # null on a scalar, null on a whole object, an empty array, and an
        # empty string -- all of them meaning there is nothing there.
        gender: null
        "gender-id": null
        "end-area": null
        ipis: []
        "area.disambiguation": ""
        "area.type": null

  - name: the disambiguation carries an en dash
    source: https://musicbrainz.org/ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
    verified: "2026-08-28"
    fixture: band
    request:
      method: GET
      path: /ws/2/artist/5b11f4ce-a62d-471e-81fc-a69a8278c7da?fmt=json
      headers:
        User-Agent: cauldron-recipe-research/0.1
    expect:
      status: 200
      body:
        # U+2013, not a hyphen, in a field a client is likely to render raw.
        disambiguation: 1980s–1990s US grunge band
        country: US
        "isnis[1]": "0000000123487390"
