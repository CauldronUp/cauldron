# Whether the providers still describe themselves the way the Recipes were
# written against.
#
# Deliberately not part of CI. This job talks to other people's servers, and a
# pull request must not go red because a docs host was restarting. It runs on a
# schedule, and on demand, and the only thing that fails it is a fingerprint
# that moved -- which is a fact about a provider, not about a network.
name: Drift

on:
  schedule:
    # Daily, early UTC. A description that changed will still have changed
    # tomorrow, so there is nothing to gain from asking more often, and every
    # request is somebody else's bandwidth.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -o cauldron ./cmd/cauldron

      # The full report, for a person reading the log. It prints every Recipe,
      # including the ones with no description to check, because the number of
      # Recipes nothing can examine is the first thing a reader of a green scan
      # will otherwise assume is zero.
      - name: Report
        run: ./cauldron drift || true

      # And the gate. Only a moved fingerprint fails: an unreachable host has
      # said nothing about whether a provider changed anything, and a job that
      # goes red for that is a job somebody mutes inside a fortnight, taking
      # the one signal that mattered with it.
      - name: Fail only on a description that moved
        run: ./cauldron drift -q
